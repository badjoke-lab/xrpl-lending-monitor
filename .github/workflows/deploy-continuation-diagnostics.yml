name: Deploy continuation diagnostics and verify

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/deploy-continuation-diagnostics.yml]

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy-and-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec wrangler deploy

      - name: Capture live diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p continuation-diagnostics-evidence
          curl --fail-with-body --silent --show-error --retry 3 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            > continuation-diagnostics-evidence/subdomain.json
          SUBDOMAIN="$(jq -r '.result.subdomain // empty' continuation-diagnostics-evidence/subdomain.json)"
          test -n "${SUBDOMAIN}"
          BASE="https://xrpl-lending-monitor.${SUBDOMAIN}.workers.dev"
          printf '%s\n' "${BASE}" > continuation-diagnostics-evidence/base-url.txt
          curl --fail-with-body --silent --show-error --retry 3 \
            "${BASE}/api/status/continuation-diagnostics" \
            > continuation-diagnostics-evidence/continuation-diagnostics.json
          jq -e '.evidence and .report and .report.paths' \
            continuation-diagnostics-evidence/continuation-diagnostics.json > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: continuation-diagnostics-evidence
          path: continuation-diagnostics-evidence
          if-no-files-found: error
          retention-days: 7
