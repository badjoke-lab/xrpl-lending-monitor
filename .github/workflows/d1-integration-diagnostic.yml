name: D1 integration diagnostic

on:
  pull_request:
    paths:
      - src/worker/bootstrap/d1-local-integration.test.ts
      - src/worker/bootstrap/current-state-bootstrap.ts
      - .github/workflows/d1-integration-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run src/worker/bootstrap/d1-local-integration.test.ts --reporter=json --outputFile=d1-integration-result.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-integration-result
          path: d1-integration-result.json
          if-no-files-found: error
          retention-days: 3
