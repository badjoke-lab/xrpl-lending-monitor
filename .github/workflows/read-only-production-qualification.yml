name: Read-only production qualification

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/read-only-production-qualification.yml

permissions:
  contents: read

concurrency:
  group: qualification-995-semantic-route-probe
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
  PRODUCTION_BASE: https://xrpl-lending-monitor.badjoke-lab.workers.dev

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Capture fresh production state
        env:
          MODE: probe
          FAIL_ON_UNHEALTHY: 'false'
        run: python scripts/qualification-995-read-only/bootstrap.py

      - name: Probe archived and balance witness routes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p semantic-route-evidence
          probe() {
            local name="$1" url="$2"
            curl --silent --show-error --connect-timeout 10 --max-time 90 \
              --retry 3 --retry-all-errors \
              -A 'xrpl-lending-qualification/1.0' \
              -o "semantic-route-evidence/${name}.body" \
              -w '%{http_code}\n' "$url" > "semantic-route-evidence/${name}.code"
          }
          probe archived "${PRODUCTION_BASE}/api/audit/archived/Loan/04CA9DCF856BC9D15E1162636A07C6B1A270F747A4AC7919E0DDC06A5A99CEDE"
          probe balance "${PRODUCTION_BASE}/api/audit/cover-loss?metric_type=debt_total&subject_type=LoanBroker&subject_id=005AA07E30EDDF798346FC107C81343952EC00A451A3CEC4572E8351B02EB6F4&limit=100"
          printf 'archived=%s\nbalance=%s\n' \
            "$(cat semantic-route-evidence/archived.code)" \
            "$(cat semantic-route-evidence/balance.code)" \
            | tee semantic-route-evidence/summary.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualification-semantic-route-probe
          path: |
            qualification-evidence
            semantic-route-evidence
          if-no-files-found: warn
          retention-days: 30
