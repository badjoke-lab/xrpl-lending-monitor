name: Read-only production qualification

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/read-only-production-qualification.yml
      - scripts/qualification-995-read-only/**
      - scripts/history-reconstruction/**
      - scripts/measure-history-reconstruction.ts
      - vite.history-reconstruction-measurement.config.ts
      - scripts/check-actions-workflow-allowlist.sh
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only operation
        required: true
        type: choice
        options: [probe, arm, evaluate, measure]
      start_ms:
        description: Five-minute-aligned qualification start timestamp in milliseconds; required for arm/evaluate
        required: false
        type: string
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: read-only-production-qualification-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'operate' }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m py_compile scripts/qualification-995-read-only/bootstrap.py scripts/qualification-995-read-only/run.py
      - run: bash scripts/check-actions-workflow-allowlist.sh

  pull-request-probe:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Capture fresh read-only production state
        continue-on-error: true
        env:
          MODE: probe
          FAIL_ON_UNHEALTHY: 'false'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
          PRODUCTION_BASE: https://xrpl-lending-monitor.badjoke-lab.workers.dev
        run: python scripts/qualification-995-read-only/bootstrap.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualification-pr-probe
          path: qualification-evidence
          if-no-files-found: error
          retention-days: 30

  operate:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.number == 995
        && github.actor == 'badjoke-lab'
        && startsWith(github.event.comment.body, '/qualification ')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Parse explicit operation
        id: operation
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_START_MS: ${{ inputs.start_ms }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            mode="$INPUT_MODE"
            start_ms="$INPUT_START_MS"
          else
            read -r command mode start_ms extra <<< "$COMMENT_BODY"
            test "$command" = "/qualification"
            test -z "${extra:-}"
          fi
          case "$mode" in
            probe)
              test -z "${start_ms:-}"
              artifact="qualification-probe-${GITHUB_RUN_ID}"
              ;;
            arm)
              [[ "${start_ms:-}" =~ ^[0-9]+$ ]]
              artifact="qualification-arm-${start_ms}"
              ;;
            evaluate)
              [[ "${start_ms:-}" =~ ^[0-9]+$ ]]
              artifact="qualification-evaluate-${start_ms}"
              ;;
            measure)
              test -z "${start_ms:-}"
              artifact="history-reconstruction-measurement-${GITHUB_RUN_ID}"
              ;;
            *) exit 2 ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "start_ms=${start_ms:-}" >> "$GITHUB_OUTPUT"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        if: steps.operation.outputs.mode == 'measure'
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        if: steps.operation.outputs.mode == 'measure'
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Build local read-only measurement harness
        if: steps.operation.outputs.mode == 'measure'
        run: |
          pnpm install --frozen-lockfile
          pnpm build:history-segment
          pnpm build:history-reconstruction-measurement

      - name: Execute bounded read-only measurement
        id: measurement
        if: steps.operation.outputs.mode == 'measure'
        continue-on-error: true
        env:
          XRPL_MEASUREMENT_ENDPOINT: https://clio.devnet.rippletest.net:51234/
          MEASUREMENT_OUTPUT: history-measurement-evidence
          GITHUB_READ_TOKEN: ${{ github.token }}
        run: node .history-reconstruction-measurement-build/measure-history-reconstruction.mjs

      - name: Download unique arm evidence
        id: arm-download
        if: steps.operation.outputs.mode == 'evaluate'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          START_MS: ${{ steps.operation.outputs.start_ms }}
        run: |
          set -euo pipefail
          name="qualification-arm-${START_MS}"
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${name}&per_page=100" \
            > arm-artifact-pages.json
          jq '[.[].artifacts[] | select(.name == $name and .expired == false)]' \
            --arg name "$name" arm-artifact-pages.json > arm-artifacts.json
          count="$(jq 'length' arm-artifacts.json)"
          test "$count" -eq 1
          artifact_id="$(jq -r '.[0].id' arm-artifacts.json)"
          mkdir -p arm-evidence
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            > arm-evidence.zip
          unzip -q arm-evidence.zip -d arm-evidence
          test -f arm-evidence/arm.json

      - name: Execute read-only operation
        id: execute
        if: steps.operation.outputs.mode != 'measure' && (steps.operation.outputs.mode != 'evaluate' || steps.arm-download.outcome == 'success')
        continue-on-error: true
        env:
          MODE: ${{ steps.operation.outputs.mode }}
          START_MS: ${{ steps.operation.outputs.start_ms }}
          ARM_EVIDENCE_DIR: arm-evidence
          FAIL_ON_UNHEALTHY: 'true'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
          PRODUCTION_BASE: https://xrpl-lending-monitor.badjoke-lab.workers.dev
        run: python scripts/qualification-995-read-only/bootstrap.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ steps.operation.outputs.artifact }}
          path: |
            qualification-evidence
            history-measurement-evidence
          if-no-files-found: warn
          retention-days: 30

      - name: Report bounded result to Issue 995
        if: always() && steps.operation.outcome == 'success' && (steps.operation.outputs.mode == 'measure' || steps.execute.outcome == 'success')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.operation.outputs.mode }}
          START_MS: ${{ steps.operation.outputs.start_ms }}
          EXECUTE_OUTCOME: ${{ steps.execute.outcome }}
          ARM_DOWNLOAD_OUTCOME: ${{ steps.arm-download.outcome }}
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo "## Read-only qualification ${MODE} result"
            echo
            echo "- workflow run: ${run_url}"
            echo "- start_ms: ${START_MS:-not-applicable}"
            echo "- production mutation: none"
            case "$MODE" in
              probe)
                if test -f qualification-evidence/result.json; then
                  echo "- healthy: $(jq -r '.healthy' qualification-evidence/result.json)"
                  echo "- checked_at: $(jq -r '.checkedAt' qualification-evidence/result.json)"
                  echo "- ledger: $(jq -r '.fastLane.last_processed_ledger' qualification-evidence/result.json)"
                  echo "- failures: $(jq -c '.failures' qualification-evidence/result.json)"
                else
                  echo "- status: failed before result generation"
                fi
                ;;
              arm)
                if test -f qualification-evidence/arm.json; then
                  echo "- armed: true"
                  echo "- armed_at: $(jq -r '.armedAt' qualification-evidence/arm.json)"
                  echo "- start_utc: $(jq -r '.startUtc' qualification-evidence/arm.json)"
                  echo "- end_utc: $(jq -r '.endUtc' qualification-evidence/arm.json)"
                  echo "- deployment_id: $(jq -r '.identity.deploymentId' qualification-evidence/arm.json)"
                  echo "- version_id: $(jq -r '.identity.versionId' qualification-evidence/arm.json)"
                else
                  echo "- armed: false"
                  echo "- execute_outcome: ${EXECUTE_OUTCOME}"
                fi
                ;;
              evaluate)
                echo "- arm_download_outcome: ${ARM_DOWNLOAD_OUTCOME}"
                if test -f qualification-evidence/qualification-result.json; then
                  echo "- passed: $(jq -r '.passed' qualification-evidence/qualification-result.json)"
                  echo "- checked_at: $(jq -r '.checkedAt' qualification-evidence/qualification-result.json)"
                  echo "- failures: $(jq -c '.failures' qualification-evidence/qualification-result.json)"
                else
                  echo "- passed: false"
                  echo "- status: failed before result generation"
                fi
                ;;
              measure)
                echo "# P0 BLOCKED — qualification failed; immutable history repair in progress"
                echo "- disposition: read-only measurement only"
                echo "- artifact: ${{ steps.operation.outputs.artifact }}"
                echo "- measurement_outcome: ${{ steps.measurement.outcome }}"
                if test -f history-measurement-evidence/summary.json; then
                  echo "- measured_segments: $(jq '.segments | length' history-measurement-evidence/summary.json)"
                  echo "- total_compressed_bytes: $(jq '[.segments[].compressedBytes] | add' history-measurement-evidence/summary.json)"
                  echo "- failures: $(jq -c '.failures' history-measurement-evidence/summary.json)"
                else
                  echo "- measured_segments: 0"
                  echo "- failures: [\"measurement_summary_missing\"]"
                fi
                ;;
            esac
          } > qualification-report.md
          gh issue comment 995 --repo "$GITHUB_REPOSITORY" --body-file qualification-report.md

      - name: Preserve operation failure
        if: >-
          always()
          && steps.operation.outcome == 'success'
          && (
            (steps.operation.outputs.mode != 'measure' && steps.execute.outcome != 'success')
            || (steps.operation.outputs.mode == 'measure' && steps.measurement.outcome != 'success')
            || (steps.operation.outputs.mode == 'evaluate' && steps.arm-download.outcome != 'success')
          )
        run: exit 1
