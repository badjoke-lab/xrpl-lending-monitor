name: Read-only production qualification

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/read-only-production-qualification.yml

permissions:
  actions: read
  contents: read

concurrency:
  group: qualification-995-pr-evaluate
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
  PRODUCTION_BASE: https://xrpl-lending-monitor.badjoke-lab.workers.dev
  START_MS: '1784996100000'

jobs:
  evaluate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download unique arm evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name="qualification-arm-${START_MS}"
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${name}&per_page=100" \
            > arm-artifact-pages.json
          jq '[.[].artifacts[] | select(.name == $name and .expired == false)]' \
            --arg name "$name" arm-artifact-pages.json > arm-artifacts.json
          count="$(jq 'length' arm-artifacts.json)"
          test "$count" -eq 1
          artifact_id="$(jq -r '.[0].id' arm-artifacts.json)"
          mkdir -p arm-evidence
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            > arm-evidence.zip
          unzip -q arm-evidence.zip -d arm-evidence
          test -f arm-evidence/arm.json

      - name: Execute read-only qualification evaluation
        env:
          MODE: evaluate
          ARM_EVIDENCE_DIR: arm-evidence
          FAIL_ON_UNHEALTHY: 'false'
        run: python scripts/qualification-995-read-only/bootstrap.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualification-evaluate-1784996100000
          path: qualification-evidence
          if-no-files-found: warn
          retention-days: 30
