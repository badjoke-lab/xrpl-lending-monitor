name: P0 overlay capacity diagnosis

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, 'P0 overlay capacity diagnosis')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Query canonical overlay composition
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          STATE_SQL=$(cat <<'SQL'
          SELECT state.epoch_id, state.base_snapshot_id, state.base_ledger_index,
                 state.overlay_ledger_index, state.updated_at,
                 COUNT(objects.object_id) AS row_count,
                 COALESCE(SUM(LENGTH(objects.projection_json)), 0) AS payload_bytes
          FROM current_state_overlay_state AS state
          LEFT JOIN current_state_overlay_objects AS objects
            ON objects.network = state.network
           AND objects.epoch_id = state.epoch_id
           AND objects.base_snapshot_id = state.base_snapshot_id
          WHERE state.network = 'devnet'
          GROUP BY state.epoch_id, state.base_snapshot_id, state.base_ledger_index,
                   state.overlay_ledger_index, state.updated_at
          SQL
          )

          COMPOSITION_SQL=$(cat <<'SQL'
          SELECT object_type, operation,
                 COUNT(*) AS row_count,
                 COALESCE(SUM(LENGTH(projection_json)), 0) AS payload_bytes,
                 MIN(source_ledger_index) AS first_source_ledger,
                 MAX(source_ledger_index) AS last_source_ledger,
                 MIN(updated_at) AS first_updated_at,
                 MAX(updated_at) AS last_updated_at
          FROM current_state_overlay_objects
          WHERE network = 'devnet'
          GROUP BY object_type, operation
          ORDER BY object_type, operation
          SQL
          )

          SOAK_DELTA_SQL=$(cat <<'SQL'
          SELECT object_type, operation,
                 COUNT(*) AS rows_last_updated_after_soak_start,
                 COALESCE(SUM(LENGTH(projection_json)), 0) AS payload_bytes,
                 COUNT(DISTINCT source_transaction_hash) AS source_transactions,
                 MIN(source_ledger_index) AS first_source_ledger,
                 MAX(source_ledger_index) AS last_source_ledger
          FROM current_state_overlay_objects
          WHERE network = 'devnet'
            AND source_ledger_index > 3688600
          GROUP BY object_type, operation
          ORDER BY object_type, operation
          SQL
          )

          HOURLY_SQL=$(cat <<'SQL'
          SELECT SUBSTR(updated_at, 1, 13) AS utc_hour,
                 object_type, operation,
                 COUNT(*) AS rows_whose_latest_state_changed,
                 COALESCE(SUM(LENGTH(projection_json)), 0) AS payload_bytes
          FROM current_state_overlay_objects
          WHERE network = 'devnet'
            AND updated_at >= '2026-07-16T02:00:00Z'
          GROUP BY SUBSTR(updated_at, 1, 13), object_type, operation
          ORDER BY utc_hour, object_type, operation
          SQL
          )

          SIZE_DISTRIBUTION_SQL=$(cat <<'SQL'
          SELECT object_type, operation,
                 CAST(AVG(COALESCE(LENGTH(projection_json), 0)) AS INTEGER) AS avg_projection_bytes,
                 MAX(COALESCE(LENGTH(projection_json), 0)) AS max_projection_bytes,
                 SUM(CASE WHEN COALESCE(LENGTH(projection_json), 0) >= 4096 THEN 1 ELSE 0 END) AS rows_ge_4k,
                 SUM(CASE WHEN COALESCE(LENGTH(projection_json), 0) >= 8192 THEN 1 ELSE 0 END) AS rows_ge_8k
          FROM current_state_overlay_objects
          WHERE network = 'devnet'
          GROUP BY object_type, operation
          ORDER BY object_type, operation
          SQL
          )

          SLOT_FAILURE_SQL=$(cat <<'SQL'
          SELECT scheduled_time, status, started_at, completed_at,
                 next_scheduled_time, error_message, updated_at
          FROM fast_lane_queue_slots
          WHERE scheduled_time BETWEEN 1784199300000 AND 1784200200000
          ORDER BY scheduled_time
          SQL
          )

          query_d1() {
            local sql="$1"
            local output="$2"
            jq -n --arg sql "$sql" '{sql: $sql}' \
              | curl --fail-with-body --silent --show-error \
                  -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  -H 'Content-Type: application/json' \
                  --data-binary @- \
                  "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query" \
              > "$output"
          }

          query_d1 "$STATE_SQL" /tmp/state.json
          query_d1 "$COMPOSITION_SQL" /tmp/composition.json
          query_d1 "$SOAK_DELTA_SQL" /tmp/soak-delta.json
          query_d1 "$HOURLY_SQL" /tmp/hourly.json
          query_d1 "$SIZE_DISTRIBUTION_SQL" /tmp/size-distribution.json
          query_d1 "$SLOT_FAILURE_SQL" /tmp/slot-failure.json

          {
            echo 'P0 canonical overlay capacity diagnosis:'
            echo
            for section in state composition soak-delta hourly size-distribution slot-failure; do
              echo "## ${section}"
              echo
              echo '```json'
              jq . "/tmp/${section}.json"
              echo '```'
              echo
            done
          } > /tmp/comment.md

          if [ -n "${ISSUE_NUMBER:-}" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body-file /tmp/comment.md
          else
            cat /tmp/comment.md
          fi
