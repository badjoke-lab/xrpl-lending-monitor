name: R5 revision4 database footprint probe

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: r5-revision4-db-footprint-probe
  cancel-in-progress: false

jobs:
  probe:
    if: >-
      github.event.issue.number == 1261 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      (github.event.comment.body == '/r5-revision4-db-footprint-probe' ||
       github.event.comment.body == 'R5 database footprint read-only preflight')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Read production database footprint only
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SUPABASE_PROJECT_ID" =~ ^[a-z]{20}$ ]]
          test -n "$SUPABASE_ACCESS_TOKEN"
          mkdir -p r5-revision4-db-footprint-probe

          cat > /tmp/footprint.sql <<'SQL'
          with relations as (
            select
              n.nspname as schema_name,
              c.relname as relation_name,
              c.relkind,
              pg_total_relation_size(c.oid)::bigint as total_bytes,
              pg_relation_size(c.oid)::bigint as heap_bytes,
              pg_indexes_size(c.oid)::bigint as index_bytes,
              coalesce(s.n_live_tup, 0)::bigint as estimated_live_rows,
              coalesce(s.n_dead_tup, 0)::bigint as estimated_dead_rows
            from pg_class c
            join pg_namespace n on n.oid = c.relnamespace
            left join pg_stat_user_tables s on s.relid = c.oid
            where c.relkind in ('r','m')
              and n.nspname not in ('pg_catalog','information_schema')
              and n.nspname not like 'pg_toast%'
          ), schema_sizes as (
            select schema_name, sum(total_bytes)::bigint as total_bytes
            from relations
            group by schema_name
          ), cron_state as (
            select
              'cron.job_run_details'::regclass::oid::bigint as relation_oid,
              count(*)::bigint as exact_rows,
              pg_total_relation_size('cron.job_run_details'::regclass)::bigint as total_bytes,
              pg_relation_size('cron.job_run_details'::regclass)::bigint as heap_bytes,
              pg_indexes_size('cron.job_run_details'::regclass)::bigint as index_bytes,
              coalesce((select n_live_tup::bigint from pg_stat_user_tables where relid = 'cron.job_run_details'::regclass), 0) as estimated_live_rows,
              coalesce((select n_dead_tup::bigint from pg_stat_user_tables where relid = 'cron.job_run_details'::regclass), 0) as estimated_dead_rows,
              (select count(*)::bigint from pg_constraint where conrelid = 'cron.job_run_details'::regclass or confrelid = 'cron.job_run_details'::regclass) as constraint_count,
              (select count(*)::bigint from pg_constraint where contype = 'f' and (conrelid = 'cron.job_run_details'::regclass or confrelid = 'cron.job_run_details'::regclass)) as foreign_key_constraints,
              coalesce((
                select jsonb_agg(
                  jsonb_build_object(
                    'name', conname,
                    'type', contype,
                    'definedOnJobRunDetails', conrelid = 'cron.job_run_details'::regclass,
                    'referencesJobRunDetails', confrelid = 'cron.job_run_details'::regclass
                  ) order by conname
                )
                from pg_constraint
                where conrelid = 'cron.job_run_details'::regclass
                   or confrelid = 'cron.job_run_details'::regclass
              ), '[]'::jsonb) as constraints,
              (select count(*)::bigint from pg_trigger where tgrelid = 'cron.job_run_details'::regclass and not tgisinternal) as user_triggers
            from cron.job_run_details
          ), active_watermark as (
            select w.*
            from public.xrpl_phase_watermarks w
            where w.profile_id = 'supabase-devnet'
          ), current_work as (
            select w.*
            from public.xrpl_phase_work w
            join active_watermark watermark on watermark.work_id = w.work_id
            where w.profile_id = 'supabase-devnet'
              and w.status = 'committed'
              and w.committed_at is not null
              and w.scanned_end_ledger_index = watermark.ledger_index
              and w.final_ledger_hash = watermark.ledger_hash
          ), predecessor_work as (
            select predecessor.*
            from current_work current
            join public.xrpl_phase_work predecessor
              on predecessor.profile_id = current.profile_id
             and predecessor.status = 'committed'
             and predecessor.committed_at is not null
             and predecessor.scanned_end_ledger_index = current.previous_ledger_index
             and predecessor.final_ledger_hash = current.expected_parent_hash
            order by predecessor.committed_at desc, predecessor.work_id desc
            limit 1
          ), historical_committed_work as (
            select w.*
            from public.xrpl_phase_work w
            where w.profile_id = 'supabase-devnet'
              and w.status = 'committed'
              and w.committed_at is not null
              and w.work_id is distinct from (select work_id from current_work)
              and w.work_id is distinct from (select work_id from predecessor_work)
          ), phase_storage as (
            select jsonb_build_object(
              'activeWatermark', (
                select jsonb_build_object(
                  'ledgerIndex', ledger_index,
                  'ledgerHash', ledger_hash,
                  'workId', work_id
                ) from active_watermark
              ),
              'currentWork', (
                select jsonb_build_object(
                  'workId', work_id,
                  'previousLedgerIndex', previous_ledger_index,
                  'startLedgerIndex', start_ledger_index,
                  'scannedEndLedgerIndex', scanned_end_ledger_index,
                  'expectedParentHash', expected_parent_hash,
                  'finalLedgerHash', final_ledger_hash,
                  'expectedPayloadChunks', expected_payload_chunks,
                  'actualPayloadChunks', (select count(*)::bigint from public.xrpl_phase_payload_chunks p where p.work_id = current_work.work_id),
                  'expectedCommitChunks', expected_commit_chunks,
                  'actualCompletedCommitChunks', (select count(*)::bigint from public.xrpl_phase_commit_chunks c where c.work_id = current_work.work_id and c.status = 'completed'),
                  'referenceRows', (select count(*)::bigint from public.xrpl_phase_reference_rows r where r.work_id = current_work.work_id)
                ) from current_work
              ),
              'predecessorWork', (
                select jsonb_build_object(
                  'workId', work_id,
                  'previousLedgerIndex', previous_ledger_index,
                  'startLedgerIndex', start_ledger_index,
                  'scannedEndLedgerIndex', scanned_end_ledger_index,
                  'expectedParentHash', expected_parent_hash,
                  'finalLedgerHash', final_ledger_hash,
                  'expectedPayloadChunks', expected_payload_chunks,
                  'actualPayloadChunks', (select count(*)::bigint from public.xrpl_phase_payload_chunks p where p.work_id = predecessor_work.work_id),
                  'expectedCommitChunks', expected_commit_chunks,
                  'actualCompletedCommitChunks', (select count(*)::bigint from public.xrpl_phase_commit_chunks c where c.work_id = predecessor_work.work_id and c.status = 'completed'),
                  'referenceRows', (select count(*)::bigint from public.xrpl_phase_reference_rows r where r.work_id = predecessor_work.work_id)
                ) from predecessor_work
              ),
              'workStatusCounts', (
                select jsonb_build_object(
                  'planned', count(*) filter (where status = 'planned'),
                  'staged', count(*) filter (where status = 'staged'),
                  'committing', count(*) filter (where status = 'committing'),
                  'finalizing', count(*) filter (where status = 'finalizing'),
                  'committed', count(*) filter (where status = 'committed'),
                  'error', count(*) filter (where status = 'error')
                )
                from public.xrpl_phase_work
                where profile_id = 'supabase-devnet'
              ),
              'messageStatusCounts', (
                select jsonb_build_object(
                  'pending', count(*) filter (where status = 'pending'),
                  'leased', count(*) filter (where status = 'leased'),
                  'retry', count(*) filter (where status = 'retry'),
                  'completed', count(*) filter (where status = 'completed'),
                  'error', count(*) filter (where status = 'error')
                )
                from public.xrpl_phase_messages
                where profile_id = 'supabase-devnet'
              ),
              'canonicalReferenceRows', (
                select jsonb_build_object(
                  'exactRows', count(*)::bigint,
                  'logicalRowBytes', coalesce(sum(pg_column_size(r)), 0)::bigint,
                  'relationTotalBytes', pg_total_relation_size('public.xrpl_phase_reference_rows'::regclass)::bigint,
                  'retentionClass', 'canonical_history_required'
                )
                from public.xrpl_phase_reference_rows r
                join public.xrpl_phase_work w on w.work_id = r.work_id
                where w.profile_id = 'supabase-devnet'
                  and w.status = 'committed'
                  and w.committed_at is not null
              ),
              'committedWorkRows', (
                select jsonb_build_object(
                  'exactRows', count(*)::bigint,
                  'logicalRowBytes', coalesce(sum(pg_column_size(w)), 0)::bigint,
                  'relationTotalBytes', pg_total_relation_size('public.xrpl_phase_work'::regclass)::bigint,
                  'retentionClass', 'canonical_reader_join_required'
                )
                from public.xrpl_phase_work w
                where w.profile_id = 'supabase-devnet'
                  and w.status = 'committed'
                  and w.committed_at is not null
              ),
              'olderCommittedPayloadEvidenceObserved', (
                select jsonb_build_object(
                  'candidateWorkRows', (select count(*)::bigint from historical_committed_work),
                  'chunkRows', count(*)::bigint,
                  'logicalRowBytes', coalesce(sum(pg_column_size(p)), 0)::bigint,
                  'relationTotalBytes', pg_total_relation_size('public.xrpl_phase_payload_chunks'::regclass)::bigint,
                  'oldestLedgerIndex', (select min(start_ledger_index) from historical_committed_work),
                  'newestLedgerIndex', (select max(scanned_end_ledger_index) from historical_committed_work),
                  'classification', 'measurement_only_not_reclaim_authority'
                )
                from public.xrpl_phase_payload_chunks p
                join historical_committed_work w on w.work_id = p.work_id
              ),
              'olderCommittedCommitEvidenceObserved', (
                select jsonb_build_object(
                  'candidateWorkRows', (select count(*)::bigint from historical_committed_work),
                  'chunkRows', count(*)::bigint,
                  'logicalRowBytes', coalesce(sum(pg_column_size(c)), 0)::bigint,
                  'relationTotalBytes', pg_total_relation_size('public.xrpl_phase_commit_chunks'::regclass)::bigint,
                  'oldestLedgerIndex', (select min(start_ledger_index) from historical_committed_work),
                  'newestLedgerIndex', (select max(scanned_end_ledger_index) from historical_committed_work),
                  'classification', 'measurement_only_not_reclaim_authority'
                )
                from public.xrpl_phase_commit_chunks c
                join historical_committed_work w on w.work_id = c.work_id
                where c.status = 'completed'
              ),
              'olderCompletedSchedulerEvidenceObserved', (
                select jsonb_build_object(
                  'messageRows', count(*)::bigint,
                  'logicalRowBytes', coalesce(sum(pg_column_size(m)), 0)::bigint,
                  'relationTotalBytes', pg_total_relation_size('public.xrpl_phase_messages'::regclass)::bigint,
                  'classification', 'measurement_only_replay_dependencies_unresolved'
                )
                from public.xrpl_phase_messages m
                where m.profile_id = 'supabase-devnet'
                  and m.status = 'completed'
                  and m.completed_at < (select committed_at from predecessor_work)
              ),
              'olderSuccessorEvidenceObserved', (
                select jsonb_build_object(
                  'successorRows', count(*)::bigint,
                  'logicalRowBytes', coalesce(sum(pg_column_size(s)), 0)::bigint,
                  'relationTotalBytes', pg_total_relation_size('public.xrpl_phase_successors'::regclass)::bigint,
                  'classification', 'measurement_only_replay_dependencies_unresolved'
                )
                from public.xrpl_phase_successors s
                join public.xrpl_phase_messages m on m.message_id = s.current_message_id
                where m.profile_id = 'supabase-devnet'
                  and m.status = 'completed'
                  and m.completed_at < (select committed_at from predecessor_work)
              ),
              'retentionBoundary', jsonb_build_object(
                'canonicalReferenceRowsRetained', true,
                'allCommittedWorkRetained', true,
                'currentWorkRawEvidenceRetained', true,
                'predecessorWorkRawEvidenceRetained', true,
                'schedulerReplayDependenciesResolved', false,
                'candidateOnly', true,
                'noReclaimAuthorized', true
              )
            ) as value
          )
          select jsonb_build_object(
            'databaseBytes', pg_database_size(current_database())::bigint,
            'databaseHaltBytes', 400000000::bigint,
            'databaseHeadroomBytes', 400000000::bigint - pg_database_size(current_database())::bigint,
            'schemas', coalesce((
              select jsonb_agg(jsonb_build_object('schema', schema_name, 'totalBytes', total_bytes) order by total_bytes desc)
              from schema_sizes
            ), '[]'::jsonb),
            'topRelations', coalesce((
              select jsonb_agg(jsonb_build_object(
                'schema', schema_name,
                'relation', relation_name,
                'relkind', relkind,
                'totalBytes', total_bytes,
                'heapBytes', heap_bytes,
                'indexBytes', index_bytes,
                'estimatedLiveRows', estimated_live_rows,
                'estimatedDeadRows', estimated_dead_rows
              ) order by total_bytes desc)
              from (select * from relations order by total_bytes desc limit 40) ranked
            ), '[]'::jsonb),
            'cronJobRunDetails', (
              select jsonb_build_object(
                'relationOid', relation_oid,
                'exactRows', exact_rows,
                'totalBytes', total_bytes,
                'heapBytes', heap_bytes,
                'indexBytes', index_bytes,
                'estimatedLiveRows', estimated_live_rows,
                'estimatedDeadRows', estimated_dead_rows,
                'constraintCount', constraint_count,
                'foreignKeyConstraints', foreign_key_constraints,
                'constraints', constraints,
                'userTriggers', user_triggers
              ) from cron_state
            ),
            'phaseStorage', (select value from phase_storage),
            'productionDatabaseReadOnly', true,
            'noDatabaseMutation', true,
            'noSchedulerMutation', true,
            'noDeployment', true,
            'noMigration', true,
            'noPublicReaderMutation', true,
            'noReclaimAuthorized', true,
            'mainnetDisabled', true
          ) as footprint;
          SQL

          query="$(cat /tmp/footprint.sql)"
          jq -n --arg query "$query" '{query:$query,parameters:[],read_only:true}' > /tmp/query.json
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'content-type: application/json' \
            --data @/tmp/query.json \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/database/query" \
            > /tmp/result.json

          jq -c '.. | objects | .footprint? // empty' /tmp/result.json | head -n1 > r5-revision4-db-footprint-probe/footprint.json
          test -s r5-revision4-db-footprint-probe/footprint.json
          jq -e '
            .productionDatabaseReadOnly == true and
            .noDatabaseMutation == true and
            .noSchedulerMutation == true and
            .noDeployment == true and
            .noMigration == true and
            .noPublicReaderMutation == true and
            .noReclaimAuthorized == true and
            .mainnetDisabled == true and
            (.databaseBytes | type == "number") and
            (.schemas | type == "array") and
            (.topRelations | type == "array") and
            (.cronJobRunDetails.relationOid | type == "number") and
            (.cronJobRunDetails.exactRows | type == "number") and
            (.cronJobRunDetails.totalBytes | type == "number") and
            (.cronJobRunDetails.constraintCount | type == "number") and
            (.cronJobRunDetails.foreignKeyConstraints | type == "number") and
            (.cronJobRunDetails.constraints | type == "array") and
            (.cronJobRunDetails.userTriggers | type == "number") and
            (.phaseStorage.activeWatermark.workId | type == "string") and
            (.phaseStorage.currentWork.workId | type == "string") and
            (.phaseStorage.predecessorWork.workId | type == "string") and
            .phaseStorage.currentWork.expectedPayloadChunks == .phaseStorage.currentWork.actualPayloadChunks and
            .phaseStorage.currentWork.expectedCommitChunks == .phaseStorage.currentWork.actualCompletedCommitChunks and
            .phaseStorage.predecessorWork.expectedPayloadChunks == .phaseStorage.predecessorWork.actualPayloadChunks and
            .phaseStorage.predecessorWork.expectedCommitChunks == .phaseStorage.predecessorWork.actualCompletedCommitChunks and
            .phaseStorage.retentionBoundary.canonicalReferenceRowsRetained == true and
            .phaseStorage.retentionBoundary.allCommittedWorkRetained == true and
            .phaseStorage.retentionBoundary.currentWorkRawEvidenceRetained == true and
            .phaseStorage.retentionBoundary.predecessorWorkRawEvidenceRetained == true and
            .phaseStorage.retentionBoundary.schedulerReplayDependenciesResolved == false and
            .phaseStorage.retentionBoundary.candidateOnly == true and
            .phaseStorage.retentionBoundary.noReclaimAuthorized == true
          ' r5-revision4-db-footprint-probe/footprint.json > /dev/null

      - name: Upload sanitized footprint evidence
        uses: actions/upload-artifact@v4
        with:
          name: r5-revision4-db-footprint-probe-${{ github.run_id }}
          path: r5-revision4-db-footprint-probe/footprint.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish sanitized read-only result
        shell: bash
        run: |
          set -euo pipefail
          f='r5-revision4-db-footprint-probe/footprint.json'
          database_bytes="$(jq -r '.databaseBytes' "$f")"
          halt_bytes="$(jq -r '.databaseHaltBytes' "$f")"
          headroom_bytes="$(jq -r '.databaseHeadroomBytes' "$f")"
          top_schemas="$(jq -r '[.schemas[:8][] | (.schema + "=" + (.totalBytes|tostring) + "B")] | join(", ")' "$f")"
          top_relations="$(jq -r '[.topRelations[:12][] | (.schema + "." + .relation + "=" + (.totalBytes|tostring) + "B")] | join("\n- ")' "$f")"
          cron_oid="$(jq -r '.cronJobRunDetails.relationOid' "$f")"
          cron_exact_rows="$(jq -r '.cronJobRunDetails.exactRows' "$f")"
          cron_total_bytes="$(jq -r '.cronJobRunDetails.totalBytes' "$f")"
          cron_dead_rows="$(jq -r '.cronJobRunDetails.estimatedDeadRows' "$f")"
          cron_constraint_count="$(jq -r '.cronJobRunDetails.constraintCount' "$f")"
          cron_fks="$(jq -r '.cronJobRunDetails.foreignKeyConstraints' "$f")"
          cron_constraints="$(jq -c '.cronJobRunDetails.constraints' "$f")"
          cron_triggers="$(jq -r '.cronJobRunDetails.userTriggers' "$f")"
          watermark="$(jq -r '.phaseStorage.activeWatermark.ledgerIndex' "$f")"
          current_work="$(jq -r '.phaseStorage.currentWork.workId' "$f")"
          predecessor_work="$(jq -r '.phaseStorage.predecessorWork.workId' "$f")"
          reference_rows="$(jq -r '.phaseStorage.canonicalReferenceRows.exactRows' "$f")"
          reference_bytes="$(jq -r '.phaseStorage.canonicalReferenceRows.logicalRowBytes' "$f")"
          old_payload_rows="$(jq -r '.phaseStorage.olderCommittedPayloadEvidenceObserved.chunkRows' "$f")"
          old_payload_bytes="$(jq -r '.phaseStorage.olderCommittedPayloadEvidenceObserved.logicalRowBytes' "$f")"
          old_commit_rows="$(jq -r '.phaseStorage.olderCommittedCommitEvidenceObserved.chunkRows' "$f")"
          old_commit_bytes="$(jq -r '.phaseStorage.olderCommittedCommitEvidenceObserved.logicalRowBytes' "$f")"
          old_message_rows="$(jq -r '.phaseStorage.olderCompletedSchedulerEvidenceObserved.messageRows' "$f")"
          old_message_bytes="$(jq -r '.phaseStorage.olderCompletedSchedulerEvidenceObserved.logicalRowBytes' "$f")"
          old_successor_rows="$(jq -r '.phaseStorage.olderSuccessorEvidenceObserved.successorRows' "$f")"
          old_successor_bytes="$(jq -r '.phaseStorage.olderSuccessorEvidenceObserved.logicalRowBytes' "$f")"
          cat > /tmp/body.md <<EOF
          ## R5 revision-4 database footprint read-only probe

          Run: \`${GITHUB_RUN_ID}\`
          Source commit: \`$(git rev-parse HEAD)\`
          Database bytes: \`${database_bytes}\`
          Internal halt: \`${halt_bytes}\`
          Headroom: \`${headroom_bytes}\`
          Top schemas: ${top_schemas}

          Exact cron.job_run_details preflight: oid=\`${cron_oid}\`, rows=\`${cron_exact_rows}\`, size=\`${cron_total_bytes} B\`, estimated dead rows=\`${cron_dead_rows}\`, constraints=\`${cron_constraint_count}\`, foreign keys=\`${cron_fks}\`, user triggers=\`${cron_triggers}\`.
          Constraint details: \`${cron_constraints}\`.

          Active phase watermark: \`${watermark}\`.
          Current committed work retained: \`${current_work}\`.
          Immediate predecessor work retained: \`${predecessor_work}\`.
          Canonical reference rows retained: \`${reference_rows}\` rows / logical \`${reference_bytes} B\`.

          Measurement-only older committed raw evidence, excluding the current and immediate predecessor works:
          - payload chunks: \`${old_payload_rows}\` rows / logical \`${old_payload_bytes} B\`
          - commit chunks: \`${old_commit_rows}\` rows / logical \`${old_commit_bytes} B\`
          - completed scheduler messages older than predecessor: \`${old_message_rows}\` rows / logical \`${old_message_bytes} B\`
          - successor edges older than predecessor: \`${old_successor_rows}\` rows / logical \`${old_successor_bytes} B\`

          These values are measurement only. They are not physical-reclaim estimates and do not authorize deleting or compacting any row. Canonical reference rows and all committed work remain required by the current public reader; current and immediate predecessor raw evidence remain required by the current restore-continuation contract. Scheduler replay dependencies remain unresolved.

          Top relations:
          - ${top_relations}

          Production database read only: \`true\`. No database mutation, reclaim, scheduler mutation, deployment, migration, public-reader mutation, Mainnet, stabilization, or soak action was performed.
          EOF
          gh issue comment 1261 --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.md
