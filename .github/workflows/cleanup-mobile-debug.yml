name: Cleanup mobile debug
on:
  pull_request:
    paths:
      - .github/workflows/cleanup-mobile-debug.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-more-menu
      - name: Remove temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/e2e-final-debug.yml
          rm -f .github/workflows/cleanup-mobile-debug.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Remove temporary mobile debug workflows"
          git push origin HEAD:fix/mobile-more-menu
