name: Verify live current-state navigation

on:
  push:
    branches: [main]
    paths: [.github/live-api-navigation-trigger]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Capture details and cursor diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGIN: https://xrpl-lending-monitor.badjoke-lab.workers.dev
        run: |
          set -u
          jq -n '{}' > result.json
          for SPEC in 'vaults:vaults' 'loanBrokers:loan-brokers' 'loans:loans'; do
            KEY=${SPEC%%:*}
            PATH_PART=${SPEC#*:}
            LIST=$(curl -sS -o list.json -w '%{http_code}' "$ORIGIN/api/$PATH_PART?limit=2" || true)
            ID=$(jq -r '.data[0].id // ""' list.json 2>/dev/null || true)
            CURSOR=$(jq -r '.page.next_cursor // ""' list.json 2>/dev/null || true)
            SNAPSHOT=$(jq -r '.snapshot.id // ""' list.json 2>/dev/null || true)
            DETAIL=$(curl -sS -o detail.json -w '%{http_code}' "$ORIGIN/api/$PATH_PART/$ID" || true)
            PAGE2=$(curl -sS -G -o page2.json -w '%{http_code}' "$ORIGIN/api/$PATH_PART" --data-urlencode 'limit=2' --data-urlencode "cursor=$CURSOR" || true)
            COUNT2=$(jq '.data|length' page2.json 2>/dev/null || echo 0)
            DETAIL_BODY=$(head -c 200 detail.json | tr '\n' ' ')
            PAGE2_BODY=$(head -c 200 page2.json | tr '\n' ' ')
            jq --arg key "$KEY" --arg list "$LIST" --arg id "$ID" --arg snapshot "$SNAPSHOT" --arg detail "$DETAIL" --arg page2 "$PAGE2" --arg detailBody "$DETAIL_BODY" --arg page2Body "$PAGE2_BODY" --argjson count2 "$COUNT2" '.[$key]={listCode:$list,id:$id,snapshot:$snapshot,detailCode:$detail,page2Code:$page2,page2Count:$count2,detailBody:$detailBody,page2Body:$page2Body}' result.json > next.json
            mv next.json result.json
          done
          INVALID=$(curl -sS -G -o invalid.json -w '%{http_code}' "$ORIGIN/api/vaults" --data-urlencode 'cursor=deadbeef' || true)
          INVALID_BODY=$(head -c 200 invalid.json | tr '\n' ' ')
          jq --arg invalid "$INVALID" --arg body "$INVALID_BODY" '.invalidCursor={code:$invalid,body:$body}' result.json > next.json
          mv next.json result.json
          API="repos/${GITHUB_REPOSITORY}/contents/.github/live-api-navigation-results.json"
          CONTENT=$(base64 -w0 result.json)
          SHA=$(gh api "$API" --jq .sha 2>/dev/null || true)
          if [ -n "$SHA" ]; then
            gh api --method PUT "$API" -f message="Update live API navigation diagnostics" -f content="$CONTENT" -f sha="$SHA" >/dev/null
          else
            gh api --method PUT "$API" -f message="Create live API navigation diagnostics" -f content="$CONTENT" >/dev/null
          fi
