name: Diagnose record-budget tests

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-record-budget-tests.yml'
      - 'src/worker/repositories/hybrid-exact-object-history-budgeted.ts'
      - 'src/worker/repositories/hybrid-exact-object-history-budgeted.test.ts'
      - 'src/worker/routes/hybrid-history-override.ts'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run focused and full unit tests
        shell: bash
        run: |
          set +e
          mkdir -p record-budget-test-diagnostic
          pnpm exec vitest run src/worker/repositories/hybrid-exact-object-history-budgeted.test.ts --reporter=verbose \
            2>&1 | tee record-budget-test-diagnostic/focused.log
          FOCUSED=${PIPESTATUS[0]}
          pnpm test 2>&1 | tee record-budget-test-diagnostic/full.log
          FULL=${PIPESTATUS[0]}
          jq -n --argjson focused "${FOCUSED}" --argjson full "${FULL}" \
            '{focusedExit:$focused,fullExit:$full}' > record-budget-test-diagnostic/summary.json
          exit "${FULL}"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: record-budget-test-diagnostic
          path: record-budget-test-diagnostic
          if-no-files-found: error
          retention-days: 3
