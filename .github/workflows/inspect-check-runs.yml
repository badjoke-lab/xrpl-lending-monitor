name: Inspect check runs

on:
  push:
    branches: [main]
    paths: [.github/check-runs-inspect-trigger]

permissions:
  checks: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect runtime commit checks
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 4d21acf10a22f2581365e1d310e9218e5c0ee3b4
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/check-runs" \
            --jq '{total_count,check_runs:[.check_runs[]|{name,status,conclusion,details_url,app:.app.name,started_at,completed_at,output}]}' \
            > check-runs.json
          API="repos/${GITHUB_REPOSITORY}/contents/.github/runtime-check-runs.json"
          CONTENT=$(base64 -w0 check-runs.json)
          SHA=$(gh api "$API" --jq .sha 2>/dev/null || true)
          if [ -n "$SHA" ]; then
            gh api --method PUT "$API" -f message="Update runtime check runs" -f content="$CONTENT" -f sha="$SHA" >/dev/null
          else
            gh api --method PUT "$API" -f message="Create runtime check runs" -f content="$CONTENT" >/dev/null
          fi
