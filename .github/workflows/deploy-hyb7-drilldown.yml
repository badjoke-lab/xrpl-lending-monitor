name: Deploy HYB-7 drilldown and verify

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/deploy-hyb7-drilldown.yml]

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec wrangler deploy
      - name: Capture live drilldown
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hyb7-drilldown-evidence
          BASE="https://xrpl-lending-monitor.badjoke-lab.workers.dev"
          curl --fail-with-body --silent --show-error --retry 3 "$BASE/api/status/continuation-diagnostics" > hyb7-drilldown-evidence/continuation-diagnostics.json
          jq -e '.evidence and .report and .drilldown and .drilldown.linkageGaps' hyb7-drilldown-evidence/continuation-diagnostics.json > /dev/null
          curl --fail-with-body --silent --show-error --retry 3 "$BASE/api/status/collector" > hyb7-drilldown-evidence/collector.json
          curl --fail-with-body --silent --show-error --retry 3 "$BASE/api/status/m1-exit-diagnostics" > hyb7-drilldown-evidence/m1-exit-diagnostics.json
      - uses: actions/upload-artifact@v4
        with:
          name: hyb7-drilldown-evidence
          path: hyb7-drilldown-evidence
          if-no-files-found: error
          retention-days: 7
