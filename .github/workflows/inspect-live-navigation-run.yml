name: Inspect live navigation run

on:
  push:
    branches: [main]
    paths: [.github/current-state-ops-inspect-trigger]

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/verify-live-current-state-navigation.yml/runs?per_page=5" \
            --jq '{runs:[.workflow_runs[]|{id,status,conclusion,head_sha,created_at,updated_at,html_url}]}' \
            > nav-runs.json
          API="repos/${GITHUB_REPOSITORY}/contents/.github/live-api-navigation-runs.json"
          CONTENT=$(base64 -w0 nav-runs.json)
          SHA=$(gh api "$API" --jq .sha 2>/dev/null || true)
          if [ -n "$SHA" ]; then
            gh api --method PUT "$API" -f message="Update live navigation run list" -f content="$CONTENT" -f sha="$SHA" >/dev/null
          else
            gh api --method PUT "$API" -f message="Create live navigation run list" -f content="$CONTENT" >/dev/null
          fi
