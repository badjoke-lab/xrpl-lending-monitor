name: Temporary R4F Prebatch Residue Diagnostic

on:
  push:
    branches:
      - agent/r4f-compact-500-diagnostic

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Read progressive claim function identities only
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/diagnostic.sql <<'SQL'
          select coalesce(jsonb_agg(jsonb_build_object(
            'schema',n.nspname,
            'name',p.proname,
            'args',pg_get_function_identity_arguments(p.oid),
            'result',pg_get_function_result(p.oid)
          ) order by n.nspname,p.proname,p.oid),'[]'::jsonb) as claim_functions
          from pg_proc p
          join pg_namespace n on n.oid=p.pronamespace
          where p.proname ilike '%r5%recovery%batch%'
             or p.proname ilike '%recovery%batch%';
          SQL
          query="$(cat /tmp/diagnostic.sql)"
          jq -n --arg query "$query" '{query:$query,parameters:[],read_only:true}' > /tmp/query.json
          status="$(curl --silent --show-error -o /tmp/result.json -w '%{http_code}' \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'content-type: application/json' \
            --data @/tmp/query.json \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/database/query")"
          echo "http_status=$status"
          cat /tmp/result.json
          test "$status" = '200'
