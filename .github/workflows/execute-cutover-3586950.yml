name: Execute near-head production cutover

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/execute-cutover-3586950.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: execute-near-head-production-cutover
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      SOURCE_HISTORY_BRANCH: history-data
      SOURCE_CURRENT_BRANCH: current-state-data
      OUTPUT_HISTORY_BRANCH: history-cutover-near-head-data
      OUTPUT_CURRENT_BRANCH: current-state-cutover-near-head-data
    steps:
      - name: Stop competing recovery and cutover runs
        shell: bash
        run: |
          set -euo pipefail
          ROOT=near-head-cutover
          mkdir -p "${ROOT}"
          workflows=(
            run-history-catchup-cycle.yml
            complete-history-recovery.yml
            test-fixed-catchup-cycle.yml
            resume-history-recovery-after-fixed-index.yml
            resume-history-recovery-v2.yml
            execute-live-cutover-now.yml
            rolling-checkpoint-live-cutover.yml
          )
          for workflow in "${workflows[@]}"; do
            gh api "repos/${REPOSITORY}/actions/workflows/${workflow}/runs?per_page=100" > "${ROOT}/${workflow}.json" || continue
            while IFS= read -r run_id; do
              test "${run_id}" = "${GITHUB_RUN_ID}" && continue
              gh api --method POST "repos/${REPOSITORY}/actions/runs/${run_id}/cancel" || true
            done < <(jq -r '.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "requested" or .status == "waiting" or .status == "pending") | .id' "${ROOT}/${workflow}.json")
          done
          sleep 10

      - name: Bind aligned production source
        shell: bash
        run: |
          set -euo pipefail
          ROOT=near-head-cutover
          fetch_json() {
            local branch="$1" path="$2" output="$3"
            for attempt in $(seq 1 30); do
              if gh api --method GET "repos/${REPOSITORY}/contents/${path}" -f ref="${branch}" --jq '.content' 2>/dev/null \
                | tr -d '\n' | base64 --decode > "${output}"; then
                test -s "${output}" && jq -e . "${output}" > /dev/null && return 0
              fi
              sleep 10
            done
            return 1
          }
          fetch_json "${SOURCE_HISTORY_BRANCH}" history/publication.json "${ROOT}/source-publication.json"
          fetch_json "${SOURCE_CURRENT_BRANCH}" read-model/manifest.json "${ROOT}/source-current.json"
          source_ledger="$(jq -r '.endLedgerIndex' "${ROOT}/source-publication.json")"
          source_hash="$(jq -r '.endLedgerHash' "${ROOT}/source-publication.json")"
          jq -e --argjson ledger "${source_ledger}" --arg hash "${source_hash}" '
            .complete == true and .ledgerIndex == $ledger and .ledgerHash == $hash
          ' "${ROOT}/source-current.json" > /dev/null
          {
            echo "SOURCE_LEDGER=${source_ledger}"
            echo "SOURCE_HASH=${source_hash}"
          } >> "${GITHUB_ENV}"

      - name: Dispatch bounded near-head candidate
        shell: bash
        run: |
          set -euo pipefail
          ROOT=near-head-cutover
          gh api "repos/${REPOSITORY}/actions/workflows/rolling-checkpoint-candidate.yml/runs?event=workflow_dispatch&per_page=100" --jq '.workflow_runs[].id' > "${ROOT}/candidate-before.txt"
          jq -n \
            --arg ref main \
            --arg sourceHistory "${SOURCE_HISTORY_BRANCH}" \
            --arg sourceCurrent "${SOURCE_CURRENT_BRANCH}" \
            --arg outputHistory "${OUTPUT_HISTORY_BRANCH}" \
            --arg outputCurrent "${OUTPUT_CURRENT_BRANCH}" \
            '{ref:$ref,inputs:{source_history_branch:$sourceHistory,source_current_state_branch:$sourceCurrent,history_candidate_branch:$outputHistory,current_state_candidate_branch:$outputCurrent,max_delta_ledgers:"5000",segment_ledgers:"500",read_window_size:"4"}}' \
            > "${ROOT}/candidate-dispatch.json"
          gh api --method POST "repos/${REPOSITORY}/actions/workflows/rolling-checkpoint-candidate.yml/dispatches" --input "${ROOT}/candidate-dispatch.json"
          run_id=''
          for attempt in $(seq 1 60); do
            gh api "repos/${REPOSITORY}/actions/workflows/rolling-checkpoint-candidate.yml/runs?event=workflow_dispatch&per_page=100" > "${ROOT}/candidate-runs.json"
            while IFS= read -r id; do
              if ! grep -Fxq "${id}" "${ROOT}/candidate-before.txt"; then run_id="${id}"; break; fi
            done < <(jq -r '.workflow_runs | sort_by(.created_at) | reverse | .[].id' "${ROOT}/candidate-runs.json")
            test -n "${run_id}" && break
            sleep 10
          done
          test -n "${run_id}"
          echo "CANDIDATE_RUN_ID=${run_id}" >> "${GITHUB_ENV}"
          printf '%s\n' "${run_id}" > "${ROOT}/candidate-run-id.txt"

      - name: Require successful candidate publication stages
        shell: bash
        run: |
          set -euo pipefail
          ROOT=near-head-cutover
          for attempt in $(seq 1 360); do
            gh api "repos/${REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}" > "${ROOT}/candidate-run.json"
            test "$(jq -r '.status' "${ROOT}/candidate-run.json")" = completed && break
            sleep 30
          done
          test "$(jq -r '.status' "${ROOT}/candidate-run.json")" = completed
          gh api "repos/${REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}/jobs?per_page=100" > "${ROOT}/candidate-jobs.json"
          for step in \
            'Bind source pair and freeze bounded target' \
            'Generate bounded delta with configured read window' \
            'Verify delta and build target publication' \
            'Build target exact index incrementally' \
            'Build target current state from best available base' \
            'Publish history candidate branch' \
            'Publish current-state candidate branch'; do
            jq -e --arg name "${step}" '[.jobs[].steps[] | select(.name == $name)] | length == 1 and .[0].conclusion == "success"' "${ROOT}/candidate-jobs.json" > /dev/null
          done

      - name: Verify aligned near-head candidate against both RPCs
        shell: bash
        run: |
          set -euo pipefail
          ROOT=near-head-cutover
          fetch_json() {
            local branch="$1" path="$2" output="$3"
            for attempt in $(seq 1 90); do
              if gh api --method GET "repos/${REPOSITORY}/contents/${path}" -f ref="${branch}" --jq '.content' 2>/dev/null \
                | tr -d '\n' | base64 --decode > "${output}"; then
                test -s "${output}" && jq -e . "${output}" > /dev/null && return 0
              fi
              sleep 10
            done
            return 1
          }
          fetch_json "${OUTPUT_HISTORY_BRANCH}" history/publication.json "${ROOT}/target-publication.json"
          fetch_json "${OUTPUT_HISTORY_BRANCH}" history/index/exact/manifest.json "${ROOT}/target-exact.json"
          fetch_json "${OUTPUT_HISTORY_BRANCH}" history-channel.json "${ROOT}/target-history-channel.json"
          fetch_json "${OUTPUT_CURRENT_BRANCH}" read-model/manifest.json "${ROOT}/target-current.json"
          fetch_json "${OUTPUT_CURRENT_BRANCH}" channel.json "${ROOT}/target-current-channel.json"
          fetch_json "${OUTPUT_CURRENT_BRANCH}" rolling-read-model-summary.json "${ROOT}/target-current-summary.json"

          target_ledger="$(jq -r '.endLedgerIndex' "${ROOT}/target-publication.json")"
          target_hash="$(jq -r '.endLedgerHash' "${ROOT}/target-publication.json")"
          publication_sha="$(jq -r '.publicationSha256' "${ROOT}/target-publication.json")"
          current_manifest_sha="$(jq -r '.manifestSha256' "${ROOT}/target-current.json")"
          snapshot_id="$(jq -r '.snapshotId' "${ROOT}/target-current.json")"
          test "${target_ledger}" -gt "${SOURCE_LEDGER}"
          test "${target_ledger}" -le "$((SOURCE_LEDGER + 5000))"
          jq -e --argjson ledger "${target_ledger}" --arg hash "${target_hash}" '
            .complete == true and .ledgerIndex == $ledger and .ledgerHash == $hash
          ' "${ROOT}/target-current.json" > /dev/null
          jq -e --arg publication "${publication_sha}" '
            .publicationSha256 == $publication and .bucketCount == 256 and .totalRecords > 0
          ' "${ROOT}/target-exact.json" > /dev/null
          jq -e --arg manifest "${current_manifest_sha}" --arg snapshot "${snapshot_id}" '
            .active.manifestSha256 == $manifest and .active.snapshotId == $snapshot
          ' "${ROOT}/target-current-channel.json" > /dev/null
          jq -e --argjson ledger "${target_ledger}" --arg hash "${target_hash}" --arg manifest "${current_manifest_sha}" --arg snapshot "${snapshot_id}" '
            .target.ledgerIndex == $ledger and .target.ledgerHash == $hash and .target.manifestSha256 == $manifest and .target.snapshotId == $snapshot and .rollingBase.segmentCount == 64
          ' "${ROOT}/target-current-summary.json" > /dev/null
          jq -e '.active.dataCommitSha | test("^[a-f0-9]{40}$")' "${ROOT}/target-history-channel.json" > /dev/null

          jq -n '{method:"ledger",params:[{ledger_index:"validated",transactions:false,expand:false}]}' > "${ROOT}/head-request.json"
          jq -n --argjson ledger "${target_ledger}" '{method:"ledger",params:[{ledger_index:$ledger,transactions:false,expand:false}]}' > "${ROOT}/target-request.json"
          min_head=''
          for index in 0 1; do
            if [ "${index}" = 0 ]; then endpoint=https://devnet.honeycluster.io/; else endpoint=https://s.devnet.rippletest.net:51234/; fi
            curl --fail-with-body --silent --show-error --retry 3 --connect-timeout 10 --max-time 45 -H 'content-type: application/json' --data @"${ROOT}/head-request.json" "${endpoint}" > "${ROOT}/head-${index}.json"
            curl --fail-with-body --silent --show-error --retry 3 --connect-timeout 10 --max-time 45 -H 'content-type: application/json' --data @"${ROOT}/target-request.json" "${endpoint}" > "${ROOT}/ledger-${index}.json"
            head="$(jq -r '.result.ledger_index // .result.ledger.ledger_index' "${ROOT}/head-${index}.json")"
            hash="$(jq -r '.result.ledger_hash // .result.ledger.ledger_hash' "${ROOT}/ledger-${index}.json")"
            test "${hash}" = "${target_hash}"
            if [ -z "${min_head}" ] || [ "${head}" -lt "${min_head}" ]; then min_head="${head}"; fi
          done
          target_lag="$((min_head - target_ledger))"
          if [ "${target_lag}" -lt 0 ]; then target_lag=0; fi
          test "${target_lag}" -le 720
          {
            echo "TARGET_LEDGER=${target_ledger}"
            echo "TARGET_HASH=${target_hash}"
            echo "TARGET_LAG=${target_lag}"
          } >> "${GITHUB_ENV}"

      - name: Dispatch guarded live cutover
        shell: bash
        run: |
          set -euo pipefail
          ROOT=near-head-cutover
          gh api "repos/${REPOSITORY}/actions/workflows/rolling-checkpoint-live-cutover.yml/runs?event=workflow_dispatch&per_page=100" --jq '.workflow_runs[].id' > "${ROOT}/cutover-before.txt"
          jq -n --arg ref main --arg history "${OUTPUT_HISTORY_BRANCH}" --arg current "${OUTPUT_CURRENT_BRANCH}" '{ref:$ref,inputs:{history_candidate_branch:$history,current_state_candidate_branch:$current,confirm_production_write:"true"}}' > "${ROOT}/cutover-dispatch.json"
          gh api --method POST "repos/${REPOSITORY}/actions/workflows/rolling-checkpoint-live-cutover.yml/dispatches" --input "${ROOT}/cutover-dispatch.json"
          run_id=''
          for attempt in $(seq 1 60); do
            gh api "repos/${REPOSITORY}/actions/workflows/rolling-checkpoint-live-cutover.yml/runs?event=workflow_dispatch&per_page=100" > "${ROOT}/cutover-runs.json"
            while IFS= read -r id; do
              if ! grep -Fxq "${id}" "${ROOT}/cutover-before.txt"; then run_id="${id}"; break; fi
            done < <(jq -r '.workflow_runs | sort_by(.created_at) | reverse | .[].id' "${ROOT}/cutover-runs.json")
            test -n "${run_id}" && break
            sleep 10
          done
          test -n "${run_id}"
          echo "CUTOVER_RUN_ID=${run_id}" >> "${GITHUB_ENV}"
          printf '%s\n' "${run_id}" > "${ROOT}/cutover-run-id.txt"

      - name: Require successful cutover and live freshness
        shell: bash
        run: |
          set -euo pipefail
          ROOT=near-head-cutover
          for attempt in $(seq 1 180); do
            gh api "repos/${REPOSITORY}/actions/runs/${CUTOVER_RUN_ID}" > "${ROOT}/cutover-run.json"
            test "$(jq -r '.status' "${ROOT}/cutover-run.json")" = completed && break
            sleep 30
          done
          test "$(jq -r '.status' "${ROOT}/cutover-run.json")" = completed
          test "$(jq -r '.conclusion' "${ROOT}/cutover-run.json")" = success
          gh run download "${CUTOVER_RUN_ID}" --repo "${REPOSITORY}" --name rolling-checkpoint-live-cutover --dir "${ROOT}/cutover-artifact"
          evidence="$(find "${ROOT}/cutover-artifact" -name evidence.json -type f | head -n 1)"
          post="$(find "${ROOT}/cutover-artifact" -name post-cutover-verification.json -type f | head -n 1)"
          test -n "${evidence}" && test -n "${post}"
          jq -e --argjson ledger "${TARGET_LEDGER}" '.passed == true and .target.target.ledgerIndex == $ledger and .schedule == "*/5 * * * *" and .mainnetEnabled == false' "${evidence}" > /dev/null
          jq -e --argjson ledger "${TARGET_LEDGER}" '.passed == true and .target.ledgerIndex == $ledger and .lagLedgers <= 10 and .currentStateAgeSeconds <= 600 and .schedule == "*/5 * * * *" and .mainnetEnabled == false' "${post}" > /dev/null
          jq -n --argjson candidateRunId "${CANDIDATE_RUN_ID}" --argjson cutoverRunId "${CUTOVER_RUN_ID}" --argjson ledger "${TARGET_LEDGER}" --arg hash "${TARGET_HASH}" --argjson lag "${TARGET_LAG}" '{passed:true,candidateRunId:$candidateRunId,cutoverRunId:$cutoverRunId,target:{ledgerIndex:$ledger,ledgerHash:$hash,lagAtDispatch:$lag},schedule:"*/5 * * * *",mainnetEnabled:false}' > "${ROOT}/summary.json"

      - name: Upload retained near-head cutover evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: execute-near-head-production-cutover
          path: near-head-cutover
          if-no-files-found: warn
          retention-days: 30
