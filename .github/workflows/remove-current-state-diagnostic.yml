name: Remove current-state diagnostic route

on:
  push:
    branches: [main]
    paths: [.github/current-state-ops-inspect-trigger]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove diagnostic route registration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/worker/index.ts')
          text = path.read_text()
          text = text.replace("import { registerCurrentStateDiagnosticRoute } from './routes/current-state-diagnostic'\n", '')
          text = text.replace('registerCurrentStateDiagnosticRoute(app)\n', '')
          path.write_text(text)
          PY
          INDEX_API="repos/${GITHUB_REPOSITORY}/contents/src/worker/index.ts"
          INDEX_SHA=$(gh api "$INDEX_API" --jq .sha)
          INDEX_CONTENT=$(base64 -w0 src/worker/index.ts)
          gh api --method PUT "$INDEX_API" -f message="Remove temporary current-state diagnostic route" -f content="$INDEX_CONTENT" -f sha="$INDEX_SHA" >/dev/null
          ROUTE_API="repos/${GITHUB_REPOSITORY}/contents/src/worker/routes/current-state-diagnostic.ts"
          ROUTE_SHA=$(gh api "$ROUTE_API" --jq .sha)
          gh api --method DELETE "$ROUTE_API" -f message="Delete temporary current-state diagnostic route" -f sha="$ROUTE_SHA" >/dev/null
