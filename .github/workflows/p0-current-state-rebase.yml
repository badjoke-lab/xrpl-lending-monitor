name: P0 current-state base rebuild

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  rebuild:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, 'P0 current-state rebase now')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build complete typed current-state release
        id: build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .local
          TAG="current-state-rebase-$(date -u +%Y%m%d-%H%M%S)"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          pnpm exec vite build --config vite.typed-current-state-release.config.ts 2>&1 | tee /tmp/rebase.log
          node .typed-current-state-release-build/run-typed-current-state-release.mjs \
            --local \
            --release-tag "$TAG" \
            --epoch-id devnet-3371675 \
            --page-limit 10000 \
            --object-limit-per-page 2048 \
            --output-dir .local/current-state-release \
            2>&1 | tee -a /tmp/rebase.log
          jq -e '.complete == true' .local/current-state-release/release-summary.json >/dev/null
          SNAPSHOT_ID=$(jq -r '.snapshotId' .local/current-state-release/release-summary.json)
          LEDGER_INDEX=$(jq -r '.ledger.ledgerIndex' .local/current-state-release/release-summary.json)
          LEDGER_HASH=$(jq -r '.ledger.ledgerHash' .local/current-state-release/release-summary.json)
          test -n "$SNAPSHOT_ID"
          echo "SNAPSHOT_ID=$SNAPSHOT_ID" >> "$GITHUB_ENV"
          echo "LEDGER_INDEX=$LEDGER_INDEX" >> "$GITHUB_ENV"
          echo "LEDGER_HASH=$LEDGER_HASH" >> "$GITHUB_ENV"
      - name: Build branch read model
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vite build --config vite.base-current-state-read-model.config.ts 2>&1 | tee -a /tmp/rebase.log
          node .base-current-state-read-model-build/build-base-current-state-read-model.mjs \
            --local \
            --input-dir .local/current-state-release/assets \
            --output-dir .local/current-state-read-model \
            --snapshot-id "$SNAPSHOT_ID" \
            --release-tag "$TAG" \
            --page-size 50 \
            --lookup-prefix-length 3 \
            2>&1 | tee -a /tmp/rebase.log
      - name: Publish immutable release
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            .local/current-state-release/assets/* \
            --repo "$REPOSITORY" \
            --title "$TAG" \
            --notes-file .local/current-state-release/release-notes.md
      - name: Publish current-state data branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin current-state-data:refs/remotes/origin/current-state-data
          rm -rf /tmp/current-state-data
          git worktree add --detach /tmp/current-state-data origin/current-state-data
          cd /tmp/current-state-data
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -rf read-model
          cp -R "$GITHUB_WORKSPACE/.local/current-state-read-model/read-model" ./read-model
          git add -A read-model
          git commit -m "data: publish $TAG"
          DATA_COMMIT_SHA=$(git rev-parse HEAD)
          MANIFEST_SHA=$(jq -r '.manifestSha256' read-model/manifest.json)
          UPDATED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jq -n \
            --arg dataCommitSha "$DATA_COMMIT_SHA" \
            --arg manifestSha256 "$MANIFEST_SHA" \
            --arg releaseTag "$TAG" \
            --arg snapshotId "$SNAPSHOT_ID" \
            --arg updatedAt "$UPDATED_AT" \
            '{schemaVersion:1,active:{dataCommitSha:$dataCommitSha,manifestPath:"read-model/manifest.json",manifestSha256:$manifestSha256,releaseTag:$releaseTag,snapshotId:$snapshotId},updatedAt:$updatedAt}' \
            > channel.json
          git add channel.json
          git commit -m "data: activate $TAG"
          git push origin HEAD:current-state-data
          echo "DATA_COMMIT_SHA=$DATA_COMMIT_SHA" >> "$GITHUB_ENV"
      - name: Report result
        if: success()
        shell: bash
        run: |
          {
            echo 'P0 current-state rebase result:'
            echo
            echo 'Typed release snapshot:'
            echo '```json'
            jq . .local/current-state-release/release-summary.json
            echo '```'
            echo
            echo 'Read model:'
            echo '```json'
            jq . .local/current-state-read-model/base-read-model-summary.json
            echo '```'
            echo
            echo "data_commit_sha: $DATA_COMMIT_SHA"
          } > /tmp/comment.md
          if [ -n "${ISSUE_NUMBER:-}" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body-file /tmp/comment.md
          else
            cat /tmp/comment.md
          fi
      - name: Report failure
        if: failure() && env.ISSUE_NUMBER != ''
        shell: bash
        run: |
          {
            echo 'P0 current-state rebase failed.'
            echo
            echo '```text'
            if [ -f /tmp/rebase.log ]; then tail -n 160 /tmp/rebase.log; else echo 'No rebuild log was produced.'; fi
            echo '```'
          } > /tmp/failure.md
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body-file /tmp/failure.md
