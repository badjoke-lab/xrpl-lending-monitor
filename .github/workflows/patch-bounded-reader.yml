name: Patch bounded reader import

on:
  push:
    branches:
      - bounded-artifact-readers

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const branch = 'bounded-artifact-readers'
            const path = 'src/shared/current-state/artifact-snapshot-reader.ts'
            const source = await github.rest.repos.getContent({ owner, repo, path, ref: branch })
            const original = Buffer.from(source.data.content, 'base64').toString('utf8')
            const before = '    const descriptors = this.manifest.catalogs'
            const after = '    const descriptors: SnapshotCatalogDescriptor[] = this.manifest.catalogs'
            if (!original.includes(before)) throw new Error('Patch target not found')
            const patched = original.replace(before, after)
            const blob = await github.rest.git.createBlob({
              owner,
              repo,
              content: patched,
              encoding: 'utf-8',
            })
            const ref = await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` })
            const parent = ref.data.object.sha
            const commit = await github.rest.git.getCommit({ owner, repo, commit_sha: parent })
            const tree = await github.rest.git.createTree({
              owner,
              repo,
              base_tree: commit.data.tree.sha,
              tree: [
                { path, mode: '100644', type: 'blob', sha: blob.data.sha },
                { path: '.github/workflows/patch-bounded-reader.yml', mode: '100644', type: 'blob', sha: null },
              ],
            })
            const next = await github.rest.git.createCommit({
              owner,
              repo,
              message: 'fix: type snapshot catalog descriptors',
              tree: tree.data.sha,
              parents: [parent],
            })
            await github.rest.git.updateRef({
              owner,
              repo,
              ref: `heads/${branch}`,
              sha: next.data.sha,
            })
