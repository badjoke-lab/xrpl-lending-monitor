name: Verify production status cadence

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-production-status-cadence.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

concurrency:
  group: verify-production-status-cadence
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p production-status-cadence

      - name: Resolve production URL
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            > production-status-cadence/subdomain.json
          SUBDOMAIN="$(jq -r '.result.subdomain // empty' production-status-cadence/subdomain.json)"
          test -n "${SUBDOMAIN}"
          printf '%s\n' "https://xrpl-lending-monitor.${SUBDOMAIN}.workers.dev" \
            > production-status-cadence/production-url.txt

      - name: Verify shared schedule remains unchanged
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-monitor/schedules" \
            > production-status-cadence/schedules.json
          jq -e '.success == true and (.result.schedules | length == 1) and any(.result.schedules[]; .cron == "*/5 * * * *")' \
            production-status-cadence/schedules.json > /dev/null

      - name: Verify collector role and protected cadence
        run: |
          PRODUCTION_BASE="$(cat production-status-cadence/production-url.txt)"
          curl --fail-with-body --silent --show-error \
            "${PRODUCTION_BASE}/api/status/collector" \
            > production-status-cadence/collector.json
          jq -e '
            .network == "devnet"
            and .role == "canonical_overlay_refresh"
            and .cadence.expected_interval_seconds == 14400
            and .cadence.stale_after_seconds == 18000
            and (.status == "behind" or .status == "healthy")
            and .error == null
          ' production-status-cadence/collector.json > /dev/null

      - name: Verify current-state fast lane remains healthy
        run: |
          PRODUCTION_BASE="$(cat production-status-cadence/production-url.txt)"
          curl --fail-with-body --silent --show-error \
            "${PRODUCTION_BASE}/api/overview" \
            > production-status-cadence/overview.json
          curl --fail-with-body --silent --show-error \
            "${PRODUCTION_BASE}/api/status/fast-lane-diff?limit=500" \
            > production-status-cadence/fast-lane-diff.json
          jq -e '
            .current_state_watermark.source == "fast_lane"
            and (.current_state_watermark.ledger_index >= .counts_watermark.ledger_index)
          ' production-status-cadence/overview.json > /dev/null
          jq -e '
            .status == "ok"
            and .passed == true
            and .sample.sampledRows > 0
            and .sample.exactProjectionMismatches == 0
          ' production-status-cadence/fast-lane-diff.json > /dev/null

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: production-status-cadence
          path: production-status-cadence
          if-no-files-found: warn
          retention-days: 14
