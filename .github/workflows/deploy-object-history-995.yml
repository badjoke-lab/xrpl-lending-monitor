name: Deploy object-history repair 995

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/deploy-object-history-995.yml
      - .github/object-history-995-deploy-trigger
  push:
    branches: [main]
    paths:
      - .github/object-history-995-deploy-trigger

permissions:
  contents: write

concurrency:
  group: production-worker-write
  cancel-in-progress: false

env:
  RUNTIME_SHA: b690186c574fa7fcde16bc6efa5dd6653f894aed
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
  PRODUCTION_BASE: https://xrpl-lending-monitor.badjoke-lab.workers.dev
  WITNESS_HASH: 70A489701D68B89E04923A7845F81F2C615760992C55119A8FC0ED8C759DE684
  WITNESS_OBJECT_TYPE: Vault
  WITNESS_OBJECT_ID: AD0980A254BC7262C57001315A9B6C7C65A020F29FAB2D0A0915933C55FF3BB1
  GH_TOKEN: ${{ github.token }}

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact merged runtime and deployment boundary
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${RUNTIME_SHA}"
          git cat-file -e "${RUNTIME_SHA}^{commit}"
          test "$(cat .github/object-history-995-deploy-trigger)" = "deploy-${RUNTIME_SHA}"
          git diff --quiet "${RUNTIME_SHA}" -- src wrangler.jsonc package.json pnpm-lock.yaml migrations
          test -f migrations/10001_object_history_lookup.sql
          grep -F 'idx_object_changes_network_object_history' migrations/10001_object_history_lookup.sql >/dev/null
          jq -e '
            .main=="src/worker/p0-redundant-scheduler-entry.ts"
            and .triggers.crons==["*/5 * * * *"]
            and .vars.APP_NETWORK=="devnet"
            and .vars.MAINNET_ENABLED=="false"
            and .vars.FAST_LANE_MAX_LEDGERS_PER_RUN=="96"
            and (.queues.producers|length)==1
            and (.queues.consumers|length)==1
            and .queues.consumers[0].max_batch_size==1
            and .queues.consumers[0].max_concurrency==1
            and (.vars|has("REPLACEMENT_BASE_CUTOVER_TOKEN")|not)
          ' wrangler.jsonc >/dev/null

  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Validate source and capture pre-deploy identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          git fetch --no-tags --depth=1 origin "${RUNTIME_SHA}"
          git cat-file -e "${RUNTIME_SHA}^{commit}"
          test "$(cat .github/object-history-995-deploy-trigger)" = "deploy-${RUNTIME_SHA}"
          git diff --quiet "${RUNTIME_SHA}" -- src wrangler.jsonc package.json pnpm-lock.yaml migrations
          test -f migrations/10001_object_history_lookup.sql
          jq -e '
            .main=="src/worker/p0-redundant-scheduler-entry.ts"
            and .triggers.crons==["*/5 * * * *"]
            and .vars.APP_NETWORK=="devnet"
            and .vars.MAINNET_ENABLED=="false"
            and .vars.FAST_LANE_MAX_LEDGERS_PER_RUN=="96"
            and (.queues.producers|length)==1
            and (.queues.consumers|length)==1
            and .queues.consumers[0].max_batch_size==1
            and .queues.consumers[0].max_concurrency==1
          ' wrangler.jsonc >/dev/null
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-monitor/deployments" \
            > pre-deployments.json
          jq -e '.result.deployments|length>0' pre-deployments.json >/dev/null

      - name: Apply additive object-history index
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p migration-evidence
          pnpm exec wrangler d1 migrations list xrpl-lending-monitor --remote | tee migration-evidence/before.txt
          pnpm exec wrangler d1 migrations apply xrpl-lending-monitor --remote | tee migration-evidence/apply.txt
          pnpm exec wrangler d1 migrations list xrpl-lending-monitor --remote | tee migration-evidence/after.txt

      - name: Build application
        run: pnpm build

      - name: Deploy exact merged runtime
        id: deploy_worker
        run: pnpm exec wrangler deploy

      - name: Freeze deployment identity and active configuration
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          previous="$(jq -r '.result.deployments[0].id' pre-deployments.json)"
          found=false
          for attempt in $(seq 1 60); do
            curl --fail-with-body --silent --show-error --retry 2 --retry-all-errors \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-monitor/deployments" \
              > post-deployments.json || true
            current="$(jq -r '.result.deployments[0].id//empty' post-deployments.json 2>/dev/null || true)"
            if [ -n "$current" ] && [ "$current" != "$previous" ]; then found=true; break; fi
            sleep 2
          done
          test "$found" = true
          jq -e '(.result.deployments[0].versions|length)==1 and .result.deployments[0].versions[0].percentage==100' post-deployments.json >/dev/null
          jq '.result.deployments[0]' post-deployments.json > deployment.json
          jq -r '.created_on' deployment.json > deployment-created-on.txt

          for attempt in $(seq 1 30); do
            curl --fail-with-body --silent --show-error --retry 2 --retry-all-errors \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-monitor/settings" \
              > settings.json || true
            curl --fail-with-body --silent --show-error --retry 2 --retry-all-errors \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-monitor/schedules" \
              > schedules.json || true
            if jq -e '
              def binding($name): [.result.bindings[]|select(.name==$name)|(.text//.value)]|first;
              binding("APP_NETWORK")=="devnet"
              and binding("MAINNET_ENABLED")=="false"
              and binding("FAST_LANE_MAX_LEDGERS_PER_RUN")=="96"
              and ([.result.bindings[]|select(.name=="FAST_LANE_QUEUE" and .type=="queue")]|length)==1
              and ([.result.bindings[]|select(.name=="REPLACEMENT_BASE_CUTOVER_TOKEN")]|length)==0
            ' settings.json >/dev/null 2>&1 \
              && jq -e '.result.schedules|length==1 and .[0].cron=="*/5 * * * *"' schedules.json >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Verify exact failed object-history witness and XRPL source
        id: witness
        shell: bash
        run: |
          set -euo pipefail
          path="/api/objects/${WITNESS_OBJECT_TYPE}/${WITNESS_OBJECT_ID}/history?limit=100"
          code="$(curl --silent --show-error --retry 4 --retry-all-errors -o object-history.json -w '%{http_code}' "${PRODUCTION_BASE}${path}")"
          test "$code" = 200
          jq -e --arg type "$WITNESS_OBJECT_TYPE" --arg id "$WITNESS_OBJECT_ID" --arg hash "$WITNESS_HASH" '
            .network=="devnet"
            and .object_type==$type
            and .object_id==$id
            and ([.data[]|select(.transaction_hash==$hash and .object_type==$type and .object_id==$id)]|length)>0
          ' object-history.json >/dev/null

          code="$(curl --silent --show-error --retry 4 --retry-all-errors -o transaction.json -w '%{http_code}' "${PRODUCTION_BASE}/api/transactions/${WITNESS_HASH}")"
          test "$code" = 200
          jq -e --arg hash "$WITNESS_HASH" '.found==true and .transaction_hash==$hash and (.object_changes|length)>0' transaction.json >/dev/null

          verified=false
          for endpoint in https://s.devnet.rippletest.net:51234 https://s.altnet.rippletest.net:51234; do
            jq -n --arg hash "$WITNESS_HASH" '{method:"tx",params:[{transaction:$hash,binary:false}]}' \
              | curl --silent --show-error --retry 2 --retry-all-errors \
                  -H 'Content-Type: application/json' --data-binary @- "$endpoint" > xrpl-tx.json || true
            if jq -e --arg hash "$WITNESS_HASH" '
              (.result.validated==true)
              and ((.result.hash//.result.tx_json.hash//"")|ascii_upcase)==$hash
              and ([.result.meta.AffectedNodes[]?|..|objects|.LedgerIndex?//empty|select(ascii_upcase==$ENV.WITNESS_OBJECT_ID)]|length)>0
            ' xrpl-tx.json >/dev/null 2>&1; then
              verified=true
              break
            fi
          done
          test "$verified" = true

      - name: Verify first completed post-deploy five-minute slot
        id: slot
        shell: bash
        run: |
          set -euo pipefail
          query() {
            jq -n --arg sql "$1" '{sql:$sql}' | curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' --data-binary @- \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query" > "$2"
          }
          deployed="$(cat deployment-created-on.txt)"
          found=false
          for attempt in $(seq 1 120); do
            query "SELECT scheduled_time,status,started_at,completed_at,error_message FROM fast_lane_queue_slots WHERE status='completed' AND started_at>='${deployed}' ORDER BY started_at ASC LIMIT 1" slot.json
            if jq -e '.result[0].results|length==1' slot.json >/dev/null 2>&1; then found=true; break; fi
            sleep 5
          done
          test "$found" = true
          start="$(jq -r '.result[0].results[0].started_at' slot.json)"
          complete="$(jq -r '.result[0].results[0].completed_at' slot.json)"
          query "SELECT run_at,status,start_ledger_index,end_ledger_index,latest_observed_ledger,lag_ledgers,ledgers_processed,persistence_rows_read,persistence_rows_written,error_message FROM fast_lane_shadow_run_metrics WHERE network='devnet' AND run_at>='${start}' AND run_at<='${complete}' ORDER BY run_at" metrics.json
          query "SELECT start_ledger_index,end_ledger_index,end_ledger_hash,created_at,bundle_json FROM fast_lane_history_windows WHERE network='devnet' AND created_at>='${start}' AND created_at<='${complete}' ORDER BY start_ledger_index" history.json
          query "SELECT epoch_id,last_processed_ledger,last_processed_hash,latest_observed_ledger,latest_observed_hash,status,(latest_observed_ledger-last_processed_ledger) AS lag_ledgers FROM fast_lane_shadow_state WHERE network='devnet'" fast.json
          query "SELECT epoch_id,overlay_ledger_index,overlay_ledger_hash FROM current_state_overlay_state WHERE network='devnet'" overlay.json
          query "SELECT COUNT(*) AS compact_rows FROM fast_lane_shadow_objects_compact WHERE network='devnet'" compact.json
          query "SELECT COUNT(*) AS stale_rows FROM current_state_overlay_objects o WHERE o.network='devnet' AND NOT EXISTS (SELECT 1 FROM fast_lane_shadow_base_binding b WHERE b.network=o.network AND b.base_epoch_id=o.epoch_id AND b.base_snapshot_id=o.base_snapshot_id)" stale.json

          python - <<'PY'
          import base64,gzip,json
          slots=json.load(open('slot.json'))['result'][0]['results']
          assert len(slots)==1 and slots[0]['status']=='completed' and slots[0]['error_message'] is None
          metrics=json.load(open('metrics.json'))['result'][0]['results']
          assert metrics
          assert all(m['status']=='committed' and m['error_message'] is None for m in metrics)
          assert metrics[-1]['lag_ledgers']==0
          assert sum(m['persistence_rows_written'] for m in metrics)<=300
          rows=json.load(open('history.json'))['result'][0]['results']
          assert rows
          for row in rows:
              payload=row['bundle_json']
              if payload.startswith('gzip-base64-v1:'):
                  value=json.loads(gzip.decompress(base64.b64decode(payload.split(':',1)[1])))
              else:
                  value=json.loads(payload)
              for key in ('protocolEvents','objectChanges','loanLifecycle','archivedObjects','balanceHistory'):
                  assert isinstance(value.get(key),list), (row['start_ledger_index'],key)
          fast=json.load(open('fast.json'))['result'][0]['results'][0]
          overlay=json.load(open('overlay.json'))['result'][0]['results'][0]
          assert fast['status']=='healthy' and fast['lag_ledgers']==0
          assert fast['last_processed_ledger']==overlay['overlay_ledger_index']
          assert fast['last_processed_hash']==overlay['overlay_ledger_hash']
          assert json.load(open('compact.json'))['result'][0]['results'][0]['compact_rows']==0
          assert json.load(open('stale.json'))['result'][0]['results'][0]['stale_rows']==0
          PY

          for path in /api/overview /api/status/history-source '/api/status/fast-lane-diff?limit=1' /api/status/replacement-base-rebase; do
            status="$(curl --silent --show-error --retry 3 --retry-all-errors -o /dev/null -w '%{http_code}' "${PRODUCTION_BASE}${path}")"
            test "$status" = 200
          done

      - name: Retain deployment result
        if: always()
        shell: bash
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy_worker.outcome }}
          IDENTITY_OUTCOME: ${{ steps.identity.outcome }}
          WITNESS_OUTCOME: ${{ steps.witness.outcome }}
          SLOT_OUTCOME: ${{ steps.slot.outcome }}
        run: |
          set -euo pipefail
          passed=false
          if [ "${DEPLOY_OUTCOME}" = success ] && [ "${IDENTITY_OUTCOME}" = success ] && [ "${WITNESS_OUTCOME}" = success ] && [ "${SLOT_OUTCOME}" = success ]; then passed=true; fi
          jq -n \
            --arg checkedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg runtimeSha "$RUNTIME_SHA" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg deployOutcome "${DEPLOY_OUTCOME:-unknown}" \
            --arg identityOutcome "${IDENTITY_OUTCOME:-unknown}" \
            --arg witnessOutcome "${WITNESS_OUTCOME:-unknown}" \
            --arg slotOutcome "${SLOT_OUTCOME:-unknown}" \
            --arg witnessHash "$WITNESS_HASH" \
            --arg witnessObjectId "$WITNESS_OBJECT_ID" \
            --argjson passed "$passed" \
            '{checkedAt:$checkedAt,passed:$passed,runtimeSha:$runtimeSha,runId:$runId,runUrl:$runUrl,deployOutcome:$deployOutcome,identityOutcome:$identityOutcome,witnessOutcome:$witnessOutcome,slotOutcome:$slotOutcome,witnessHash:$witnessHash,witnessObjectId:$witnessObjectId}' \
            > deploy-status.json
          API_PATH="repos/${GITHUB_REPOSITORY}/contents/.github/object-history-995-deploy-status.json"
          CONTENT="$(base64 -w0 deploy-status.json)"
          EXISTING_SHA="$(gh api "$API_PATH" --jq .sha 2>/dev/null || true)"
          if [ -n "$EXISTING_SHA" ]; then
            gh api --method PUT "$API_PATH" -f message='Update object-history repair deploy status' -f content="$CONTENT" -f sha="$EXISTING_SHA" >/dev/null
          else
            gh api --method PUT "$API_PATH" -f message='Create object-history repair deploy status' -f content="$CONTENT" >/dev/null
          fi
          test "$passed" = true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: object-history-995-deploy-evidence
          path: |
            migration-evidence
            pre-deployments.json
            post-deployments.json
            deployment.json
            deployment-created-on.txt
            settings.json
            schedules.json
            object-history.json
            transaction.json
            xrpl-tx.json
            slot.json
            metrics.json
            history.json
            fast.json
            overlay.json
            compact.json
            stale.json
            deploy-status.json
          if-no-files-found: warn
          retention-days: 14
