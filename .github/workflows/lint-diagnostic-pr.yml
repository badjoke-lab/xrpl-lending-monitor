name: Lint diagnostic PR probe

on:
  pull_request:
    paths:
      - scripts/**
      - eslint.config.js
      - .github/workflows/lint-diagnostic-pr.yml

permissions:
  contents: read

jobs:
  lint-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture lint output
        shell: bash
        run: |
          set -o pipefail
          mkdir -p lint-diagnostic
          pnpm lint 2>&1 | tee lint-diagnostic/output.log
      - name: Upload lint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-diagnostic
          path: lint-diagnostic
          if-no-files-found: error
          retention-days: 1
