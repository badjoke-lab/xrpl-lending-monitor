name: Deploy M1 exit base fix and verify

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/deploy-m1-exit-base-fix.yml]

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec wrangler deploy

      - name: Capture live M1 exit evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p m1-exit-base-fix-evidence
          curl --fail-with-body --silent --show-error --retry 3 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            > m1-exit-base-fix-evidence/subdomain.json
          SUBDOMAIN="$(jq -r '.result.subdomain // empty' m1-exit-base-fix-evidence/subdomain.json)"
          test -n "${SUBDOMAIN}"
          BASE="https://xrpl-lending-monitor.${SUBDOMAIN}.workers.dev"
          printf '%s\n' "$BASE" > m1-exit-base-fix-evidence/base-url.txt

          curl --fail-with-body --silent --show-error --retry 3 \
            "$BASE/api/status/m1-exit-diagnostics" \
            > m1-exit-base-fix-evidence/m1-exit-diagnostics.json
          curl --fail-with-body --silent --show-error --retry 3 \
            "$BASE/api/status/catch-up-initialization" \
            > m1-exit-base-fix-evidence/catch-up-initialization.json
          curl --fail-with-body --silent --show-error --retry 3 \
            "$BASE/api/status/collector" \
            > m1-exit-base-fix-evidence/collector.json

          jq -e '
            .evidence.expectedBase.epochId == "devnet-3371675"
            and .evidence.expectedBase.snapshotId == "devnet-3371675-0ba2ed766c19"
            and .evidence.expectedBase.ledgerIndex == 3371675
            and .evidence.expectedBase.ledgerHash == "0BA2ED766C190C733F8F26288785CBDF01D0FC26E1A6C03EDB7E9DFF6F8BCB90"
            and .evidence.boundBase == .evidence.expectedBase
            and .report.gates.verifiedBaseBinding.state == "observed"
            and .report.gates.catchUpStart.state == "observed"
          ' m1-exit-base-fix-evidence/m1-exit-diagnostics.json > /dev/null

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m1-exit-base-fix-evidence
          path: m1-exit-base-fix-evidence
          if-no-files-found: error
          retention-days: 7
