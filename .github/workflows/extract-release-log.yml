name: Extract job log

on:
  push:
    branches: [main]
    paths: [.github/release-log-trigger]

permissions:
  actions: read
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Extract
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/85114943599/logs" > job.log
          tail -n 120 job.log > diagnostic.log
          API="repos/${GITHUB_REPOSITORY}/contents/.github/release-log-tail.txt"
          CONTENT=$(base64 -w0 diagnostic.log)
          SHA=$(gh api "$API" --jq .sha 2>/dev/null || true)
          if [ -n "$SHA" ]; then
            gh api --method PUT "$API" -f message="Update release log tail" -f content="$CONTENT" -f sha="$SHA" >/dev/null
          else
            gh api --method PUT "$API" -f message="Create release log tail" -f content="$CONTENT" >/dev/null
          fi
