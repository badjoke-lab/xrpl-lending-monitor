name: M5-5 production cross-audit

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Deployed read-only site base URL
        required: true
        default: https://xrpl-lending-monitor.badjoke-lab.workers.dev
        type: string
      confirm_d1_headroom:
        description: Confirm the operator expects the workflow to measure actual current UTC-day D1 headroom before auditing
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: m5-5-production-cross-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Enforce manual audit intent
        shell: bash
        run: test "${{ inputs.confirm_d1_headroom }}" = "true"

      - uses: actions/checkout@v4

      - name: Verify collector preflight
        shell: bash
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: |
          set -euo pipefail
          mkdir -p m5-5-cross-audit
          curl --max-time 60 --fail-with-body --silent --show-error --retry 3 \
            "${BASE_URL%/}/api/status/collector" \
            > m5-5-cross-audit/collector-preflight.json
          jq -e '.status == "healthy" and .cursor.lag_ledgers == 0 and .consecutive_failures == 0 and .error == null' \
            m5-5-cross-audit/collector-preflight.json > /dev/null

      - name: Measure and enforce actual D1 headroom
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_HEADROOM_OUTPUT_DIR: m5-5-cross-audit
        run: bash scripts/check-d1-headroom.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Run production cross-audit
        env:
          BASE_URL: ${{ inputs.base_url }}
          M5_CROSS_AUDIT_OUTPUT_DIR: m5-5-cross-audit
        run: node scripts/run-m5-5-cross-audit.mjs

      - name: Publish audit summary
        if: always()
        shell: bash
        run: |
          if [ -f m5-5-cross-audit/d1-headroom-summary.json ]; then
            {
              echo '## D1 headroom gate'
              echo
              jq -r '"- Rows read: `\(.rows_read)` / `\(.rows_read_daily_allowance)`"' m5-5-cross-audit/d1-headroom-summary.json
              jq -r '"- Rows written: `\(.rows_written)` / `\(.rows_written_daily_allowance)`"' m5-5-cross-audit/d1-headroom-summary.json
              jq -r '"- Passed: **\(.passed)**"' m5-5-cross-audit/d1-headroom-summary.json
              echo
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
          if [ -f m5-5-cross-audit/summary.md ]; then
            cat m5-5-cross-audit/summary.md >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload M5-5 cross-audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-5-production-cross-audit
          path: m5-5-cross-audit
          if-no-files-found: error
          retention-days: 14
