name: T5 cutover D1 headroom check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  D1_DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Capture current UTC-day D1 usage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p t5-cutover-d1-headroom
          TODAY="$(date -u +%F)"

          read -r -d '' QUERY <<'GRAPHQL' || true
          query D1Usage(
            $accountTag: string!
            $start: Date
            $end: Date
            $databaseId: string
          ) {
            viewer {
              accounts(filter: { accountTag: $accountTag }) {
                d1AnalyticsAdaptiveGroups(
                  limit: 10000
                  filter: {
                    date_geq: $start
                    date_leq: $end
                    databaseId: $databaseId
                  }
                ) {
                  sum {
                    readQueries
                    writeQueries
                    rowsRead
                    rowsWritten
                  }
                }
              }
            }
          }
          GRAPHQL

          jq -n \
            --arg query "${QUERY}" \
            --arg accountTag "${CLOUDFLARE_ACCOUNT_ID}" \
            --arg start "${TODAY}" \
            --arg end "${TODAY}" \
            --arg databaseId "${D1_DATABASE_ID}" \
            '{query:$query,variables:{accountTag:$accountTag,start:$start,end:$end,databaseId:$databaseId}}' \
            > t5-cutover-d1-headroom/request.json

          curl --fail-with-body --silent --show-error --retry 3 \
            -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data @t5-cutover-d1-headroom/request.json \
            https://api.cloudflare.com/client/v4/graphql \
            > t5-cutover-d1-headroom/response.json

          jq -e '((.errors // []) | length) == 0 and (.data.viewer.accounts | length) > 0' \
            t5-cutover-d1-headroom/response.json > /dev/null

          jq --arg date "${TODAY}" '
            [.data.viewer.accounts[0].d1AnalyticsAdaptiveGroups[]] as $groups
            | {
                date_utc: $date,
                read_queries: ([$groups[].sum.readQueries // 0] | add // 0),
                write_queries: ([$groups[].sum.writeQueries // 0] | add // 0),
                rows_read: ([$groups[].sum.rowsRead // 0] | add // 0),
                rows_written: ([$groups[].sum.rowsWritten // 0] | add // 0),
                free_rows_read_daily_allowance: 5000000,
                free_rows_written_daily_allowance: 100000
              }
            | .rows_read_fraction = (.rows_read / .free_rows_read_daily_allowance)
            | .rows_written_fraction = (.rows_written / .free_rows_written_daily_allowance)
            | .rows_written_remaining = (.free_rows_written_daily_allowance - .rows_written)
          ' t5-cutover-d1-headroom/response.json \
            > t5-cutover-d1-headroom/summary.json

          jq -e '.rows_written < 95000 and .rows_written_remaining >= 5000' \
            t5-cutover-d1-headroom/summary.json > /dev/null

      - name: Upload retained D1 headroom evidence
        uses: actions/upload-artifact@v4
        with:
          name: t5-cutover-d1-headroom
          path: t5-cutover-d1-headroom
          if-no-files-found: error
          retention-days: 30
