name: Verify 128-budget recovery

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/verify-128-recovery.yml]

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec wrangler deploy
      - name: Sample live recovery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery-evidence
          curl --fail-with-body --silent --show-error --retry 3 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" > recovery-evidence/subdomain.json
          SUBDOMAIN="$(jq -r '.result.subdomain // empty' recovery-evidence/subdomain.json)"
          BASE="https://xrpl-lending-monitor.${SUBDOMAIN}.workers.dev"
          for I in 0 1 2 3; do
            curl --fail-with-body --silent --show-error --retry 3 "$BASE/api/status/collector" > "recovery-evidence/collector-${I}.json"
            if [ "$I" -lt 3 ]; then sleep 60; fi
          done
          curl --fail-with-body --silent --show-error --retry 3 "$BASE/api/status/continuation-diagnostics" > recovery-evidence/continuation.json
          jq -s '[.[]|{status,cursor:.cursor.last_processed_ledger,head:.cursor.latest_observed_ledger,lag:.cursor.lag_ledgers,rows:.usage.estimated_rows,statements:.usage.estimated_statements,lending:.usage.lending_transactions,failures:.consecutive_failures,error}]' recovery-evidence/collector-*.json > recovery-evidence/series.json
          jq '{first:.[0],last:.[-1],cursor_delta:(.[-1].cursor-.[0].cursor),lag_delta:(.[-1].lag-.[0].lag),samples:length,failed_samples:([.[]|select(.failures>0 or .error!=null)]|length)}' recovery-evidence/series.json > recovery-evidence/summary.json
          jq -e '.last.cursor > 3388466 and .failed_samples == 0' recovery-evidence/summary.json > /dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: budget-128-recovery-evidence
          path: recovery-evidence
          if-no-files-found: error
          retention-days: 7
