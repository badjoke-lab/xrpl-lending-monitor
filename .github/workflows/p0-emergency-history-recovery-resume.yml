name: P0 emergency history recovery resume

on:
  push:
    branches: [main]
    paths:
      - .github/p0-emergency-history-recovery-resume-trigger

permissions:
  actions: write
  contents: write

concurrency:
  group: p0-emergency-history-recovery-resume
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    env:
      GH_TOKEN: ${{ github.token }}
      MAX_DELTA_LEDGERS: '5000'
      SEGMENT_LEDGERS: '500'
      READ_WINDOW_SIZE: '4'
      MAX_CYCLES: '8'
      TARGET_MAX_LAG_LEDGERS: '300'
      PRODUCTION_BASE: https://xrpl-lending-monitor.badjoke-lab.workers.dev
    steps:
      - uses: actions/checkout@v4

      - name: Reject unauthorized or non-Devnet recovery
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.vars.APP_NETWORK' wrangler.jsonc)" = devnet
          test "$(jq -r '.vars.MAINNET_ENABLED' wrangler.jsonc)" = false
          test "$(jq -r '.triggers.crons | length' wrangler.jsonc)" -eq 1
          test "$(jq -r '.triggers.crons[0]' wrangler.jsonc)" = '*/5 * * * *'

      - name: Resume catch-up from verified candidate A
        id: catchup
        shell: bash
        run: |
          set -euo pipefail
          ROOT=p0-emergency-history-recovery
          mkdir -p "${ROOT}"
          : > "${ROOT}/cycles.ndjson"

          SOURCE_HISTORY='history-p0-recovery-a-data'
          SOURCE_CURRENT='current-state-p0-recovery-a-data'
          OUTPUT_HISTORY='history-p0-recovery-b-data'
          OUTPUT_CURRENT='current-state-p0-recovery-b-data'

          fetch_repo_json() {
            local branch="$1"
            local path="$2"
            local output="$3"
            for attempt in $(seq 1 30); do
              if gh api --method GET \
                "repos/${GITHUB_REPOSITORY}/contents/${path}" \
                -f ref="${branch}" --jq '.content' 2>/dev/null \
                | tr -d '\n' | base64 --decode > "${output}"; then
                test -s "${output}" && return 0
              fi
              sleep 10
            done
            return 1
          }

          capture_live_head() {
            local prefix="$1"
            jq -n '{method:"ledger",params:[{ledger_index:"validated",transactions:false,expand:false}]}' \
              > "${ROOT}/${prefix}-head-request.json"
            curl --fail-with-body --silent --show-error --retry 3 \
              -H 'content-type: application/json' \
              --data @"${ROOT}/${prefix}-head-request.json" \
              https://devnet.honeycluster.io/ \
              > "${ROOT}/${prefix}-head-response.json"
            jq -r '.result.ledger_index // .result.ledger.ledger_index' \
              "${ROOT}/${prefix}-head-response.json"
          }

          validate_pair() {
            local history_branch="$1"
            local current_branch="$2"
            local prefix="$3"
            fetch_repo_json "${history_branch}" history/publication.json "${ROOT}/${prefix}-publication.json"
            fetch_repo_json "${current_branch}" read-model/manifest.json "${ROOT}/${prefix}-current-manifest.json"
            local ledger hash current_ledger current_hash
            ledger="$(jq -r '.endLedgerIndex' "${ROOT}/${prefix}-publication.json")"
            hash="$(jq -r '.endLedgerHash' "${ROOT}/${prefix}-publication.json")"
            current_ledger="$(jq -r '.ledgerIndex' "${ROOT}/${prefix}-current-manifest.json")"
            current_hash="$(jq -r '.ledgerHash' "${ROOT}/${prefix}-current-manifest.json")"
            test "$(jq -r '.complete' "${ROOT}/${prefix}-publication.json")" = true
            test "$(jq -r '.complete' "${ROOT}/${prefix}-current-manifest.json")" = true
            test "${ledger}" = "${current_ledger}"
            test "${hash}" = "${current_hash}"
            jq -n --argjson ledger "${ledger}" \
              '{method:"ledger",params:[{ledger_index:$ledger,transactions:false,expand:false}]}' \
              > "${ROOT}/${prefix}-ledger-request.json"
            curl --fail-with-body --silent --show-error --retry 3 \
              -H 'content-type: application/json' \
              --data @"${ROOT}/${prefix}-ledger-request.json" \
              https://devnet.honeycluster.io/ \
              > "${ROOT}/${prefix}-ledger-response.json"
            test "${hash}" = "$(jq -r '.result.ledger_hash // .result.ledger.ledger_hash' "${ROOT}/${prefix}-ledger-response.json")"
            printf '%s\t%s\n' "${ledger}" "${hash}"
          }

          IFS=$'\t' read -r RESUME_LEDGER RESUME_HASH < <(validate_pair "${SOURCE_HISTORY}" "${SOURCE_CURRENT}" resume)
          fetch_repo_json history-data history/publication.json "${ROOT}/production-publication.json"
          PRODUCTION_LEDGER="$(jq -r '.endLedgerIndex' "${ROOT}/production-publication.json")"
          test "${RESUME_LEDGER}" -gt "${PRODUCTION_LEDGER}"
          jq -n \
            --arg historyBranch "${SOURCE_HISTORY}" \
            --arg currentBranch "${SOURCE_CURRENT}" \
            --argjson ledgerIndex "${RESUME_LEDGER}" \
            --arg ledgerHash "${RESUME_HASH}" \
            --argjson productionLedgerIndex "${PRODUCTION_LEDGER}" \
            '{resumed:true,source:{historyBranch:$historyBranch,currentStateBranch:$currentBranch,ledgerIndex:$ledgerIndex,ledgerHash:$ledgerHash},productionLedgerIndex:$productionLedgerIndex}' \
            > "${ROOT}/resume.json"

          for CYCLE in $(seq 2 "${MAX_CYCLES}"); do
            IFS=$'\t' read -r SOURCE_LEDGER SOURCE_HASH < <(validate_pair "${SOURCE_HISTORY}" "${SOURCE_CURRENT}" "cycle-${CYCLE}-source")
            LIVE_BEFORE="$(capture_live_head "cycle-${CYCLE}-before")"
            LAG_BEFORE="$((LIVE_BEFORE - SOURCE_LEDGER))"
            if [ "${LAG_BEFORE}" -lt 0 ]; then LAG_BEFORE=0; fi
            if [ "${LAG_BEFORE}" -le "${TARGET_MAX_LAG_LEDGERS}" ]; then
              jq -n \
                --argjson cycle "${CYCLE}" \
                --arg historyBranch "${SOURCE_HISTORY}" \
                --arg currentBranch "${SOURCE_CURRENT}" \
                --argjson sourceLedger "${SOURCE_LEDGER}" \
                --arg sourceHash "${SOURCE_HASH}" \
                --argjson liveLedger "${LIVE_BEFORE}" \
                --argjson lagLedgers "${LAG_BEFORE}" \
                '{cycle:$cycle,skipped:true,reason:"target_lag_reached",source:{historyBranch:$historyBranch,currentStateBranch:$currentBranch,ledgerIndex:$sourceLedger,ledgerHash:$sourceHash},live:{ledgerIndex:$liveLedger,lagLedgers:$lagLedgers}}' \
                >> "${ROOT}/cycles.ndjson"
              break
            fi

            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/rolling-checkpoint-candidate.yml/runs?event=workflow_dispatch&per_page=100" \
              --jq '.workflow_runs[].id' > "${ROOT}/cycle-${CYCLE}-run-ids-before.txt"

            jq -n \
              --arg ref main \
              --arg sourceHistory "${SOURCE_HISTORY}" \
              --arg sourceCurrent "${SOURCE_CURRENT}" \
              --arg outputHistory "${OUTPUT_HISTORY}" \
              --arg outputCurrent "${OUTPUT_CURRENT}" \
              --arg maxDelta "${MAX_DELTA_LEDGERS}" \
              --arg segment "${SEGMENT_LEDGERS}" \
              --arg window "${READ_WINDOW_SIZE}" \
              '{ref:$ref,inputs:{source_history_branch:$sourceHistory,source_current_state_branch:$sourceCurrent,history_candidate_branch:$outputHistory,current_state_candidate_branch:$outputCurrent,max_delta_ledgers:$maxDelta,segment_ledgers:$segment,read_window_size:$window}}' \
              > "${ROOT}/cycle-${CYCLE}-dispatch.json"

            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/rolling-checkpoint-candidate.yml/dispatches" \
              --input "${ROOT}/cycle-${CYCLE}-dispatch.json"

            RUN_ID=''
            for attempt in $(seq 1 60); do
              gh api \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/rolling-checkpoint-candidate.yml/runs?event=workflow_dispatch&per_page=100" \
                > "${ROOT}/cycle-${CYCLE}-runs-after.json"
              while IFS= read -r candidate_id; do
                if ! grep -Fxq "${candidate_id}" "${ROOT}/cycle-${CYCLE}-run-ids-before.txt"; then
                  RUN_ID="${candidate_id}"
                  break
                fi
              done < <(jq -r '.workflow_runs | sort_by(.created_at) | reverse | .[].id' "${ROOT}/cycle-${CYCLE}-runs-after.json")
              test -n "${RUN_ID}" && break
              sleep 10
            done
            test -n "${RUN_ID}"

            for attempt in $(seq 1 720); do
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" > "${ROOT}/cycle-${CYCLE}-run.json"
              STATUS="$(jq -r '.status' "${ROOT}/cycle-${CYCLE}-run.json")"
              test "${STATUS}" = completed && break
              sleep 30
            done
            test "$(jq -r '.status' "${ROOT}/cycle-${CYCLE}-run.json")" = completed
            RUN_CONCLUSION="$(jq -r '.conclusion' "${ROOT}/cycle-${CYCLE}-run.json")"

            IFS=$'\t' read -r OUTPUT_LEDGER OUTPUT_HASH < <(validate_pair "${OUTPUT_HISTORY}" "${OUTPUT_CURRENT}" "cycle-${CYCLE}-output")
            test "${OUTPUT_LEDGER}" -gt "${SOURCE_LEDGER}"
            test "${OUTPUT_LEDGER}" -le "$((SOURCE_LEDGER + MAX_DELTA_LEDGERS))"

            LIVE_AFTER="$(capture_live_head "cycle-${CYCLE}-after")"
            LAG_AFTER="$((LIVE_AFTER - OUTPUT_LEDGER))"
            if [ "${LAG_AFTER}" -lt 0 ]; then LAG_AFTER=0; fi
            jq -n \
              --argjson cycle "${CYCLE}" \
              --argjson runId "${RUN_ID}" \
              --arg runConclusion "${RUN_CONCLUSION}" \
              --arg sourceHistory "${SOURCE_HISTORY}" \
              --arg sourceCurrent "${SOURCE_CURRENT}" \
              --argjson sourceLedger "${SOURCE_LEDGER}" \
              --arg outputHistory "${OUTPUT_HISTORY}" \
              --arg outputCurrent "${OUTPUT_CURRENT}" \
              --argjson outputLedger "${OUTPUT_LEDGER}" \
              --arg outputHash "${OUTPUT_HASH}" \
              --argjson liveLedger "${LIVE_AFTER}" \
              --argjson lagLedgers "${LAG_AFTER}" \
              '{cycle:$cycle,passed:true,childRunId:$runId,childConclusion:$runConclusion,acceptedBy:"published_pair_and_live_hash_validation",source:{historyBranch:$sourceHistory,currentStateBranch:$sourceCurrent,ledgerIndex:$sourceLedger},output:{historyBranch:$outputHistory,currentStateBranch:$outputCurrent,ledgerIndex:$outputLedger,ledgerHash:$outputHash},live:{ledgerIndex:$liveLedger,lagLedgers:$lagLedgers}}' \
              >> "${ROOT}/cycles.ndjson"

            SOURCE_HISTORY="${OUTPUT_HISTORY}"
            SOURCE_CURRENT="${OUTPUT_CURRENT}"
            if [ "${OUTPUT_HISTORY}" = history-p0-recovery-a-data ]; then
              OUTPUT_HISTORY='history-p0-recovery-b-data'
              OUTPUT_CURRENT='current-state-p0-recovery-b-data'
            else
              OUTPUT_HISTORY='history-p0-recovery-a-data'
              OUTPUT_CURRENT='current-state-p0-recovery-a-data'
            fi
            test "${LAG_AFTER}" -le "${TARGET_MAX_LAG_LEDGERS}" && break
          done

          IFS=$'\t' read -r FINAL_LEDGER FINAL_HASH < <(validate_pair "${SOURCE_HISTORY}" "${SOURCE_CURRENT}" final)
          FINAL_LIVE="$(capture_live_head final)"
          FINAL_LAG="$((FINAL_LIVE - FINAL_LEDGER))"
          if [ "${FINAL_LAG}" -lt 0 ]; then FINAL_LAG=0; fi
          test "${FINAL_LAG}" -le "${TARGET_MAX_LAG_LEDGERS}"

          jq -n \
            --arg historyBranch "${SOURCE_HISTORY}" \
            --arg currentStateBranch "${SOURCE_CURRENT}" \
            --argjson ledgerIndex "${FINAL_LEDGER}" \
            --arg ledgerHash "${FINAL_HASH}" \
            --argjson liveLedger "${FINAL_LIVE}" \
            --argjson remainingLagLedgers "${FINAL_LAG}" \
            --argjson targetMaxLagLedgers "${TARGET_MAX_LAG_LEDGERS}" \
            '{passed:true,finalCandidate:{historyBranch:$historyBranch,currentStateBranch:$currentStateBranch,ledgerIndex:$ledgerIndex,ledgerHash:$ledgerHash},live:{ledgerIndex:$liveLedger,remainingLagLedgers:$remainingLagLedgers,targetMaxLagLedgers:$targetMaxLagLedgers}}' \
            | tee "${ROOT}/catchup-summary.json"

          {
            echo "FINAL_HISTORY_BRANCH=${SOURCE_HISTORY}"
            echo "FINAL_CURRENT_BRANCH=${SOURCE_CURRENT}"
            echo "FINAL_TARGET_LEDGER=${FINAL_LEDGER}"
            echo "FINAL_TARGET_HASH=${FINAL_HASH}"
          } >> "${GITHUB_ENV}"

      - name: Dispatch guarded production cutover
        shell: bash
        run: |
          set -euo pipefail
          ROOT=p0-emergency-history-recovery
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/rolling-checkpoint-live-cutover.yml/runs?event=workflow_dispatch&per_page=100" \
            --jq '.workflow_runs[].id' > "${ROOT}/cutover-run-ids-before.txt"
          jq -n \
            --arg ref main \
            --arg history "${FINAL_HISTORY_BRANCH}" \
            --arg current "${FINAL_CURRENT_BRANCH}" \
            '{ref:$ref,inputs:{history_candidate_branch:$history,current_state_candidate_branch:$current,confirm_production_write:"true"}}' \
            > "${ROOT}/cutover-dispatch.json"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/rolling-checkpoint-live-cutover.yml/dispatches" \
            --input "${ROOT}/cutover-dispatch.json"

          CUTOVER_RUN_ID=''
          for attempt in $(seq 1 60); do
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/rolling-checkpoint-live-cutover.yml/runs?event=workflow_dispatch&per_page=100" \
              > "${ROOT}/cutover-runs-after.json"
            while IFS= read -r candidate_id; do
              if ! grep -Fxq "${candidate_id}" "${ROOT}/cutover-run-ids-before.txt"; then
                CUTOVER_RUN_ID="${candidate_id}"
                break
              fi
            done < <(jq -r '.workflow_runs | sort_by(.created_at) | reverse | .[].id' "${ROOT}/cutover-runs-after.json")
            test -n "${CUTOVER_RUN_ID}" && break
            sleep 10
          done
          test -n "${CUTOVER_RUN_ID}"
          echo "CUTOVER_RUN_ID=${CUTOVER_RUN_ID}" >> "${GITHUB_ENV}"

          for attempt in $(seq 1 240); do
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CUTOVER_RUN_ID}" > "${ROOT}/cutover-run.json"
            STATUS="$(jq -r '.status' "${ROOT}/cutover-run.json")"
            test "${STATUS}" = completed && break
            sleep 30
          done
          test "$(jq -r '.status' "${ROOT}/cutover-run.json")" = completed
          test "$(jq -r '.conclusion' "${ROOT}/cutover-run.json")" = success

      - name: Verify post-cutover production data
        shell: bash
        run: |
          set -euo pipefail
          ROOT=p0-emergency-history-recovery
          verified=false
          for attempt in $(seq 1 60); do
            curl --silent --show-error --retry 1 "${PRODUCTION_BASE}/api/overview" > "${ROOT}/overview.json" || true
            curl --silent --show-error --retry 1 "${PRODUCTION_BASE}/api/activity?limit=25" > "${ROOT}/activity.json" || true
            curl --silent --show-error --retry 1 "${PRODUCTION_BASE}/api/status/pre-soak-readiness" > "${ROOT}/readiness.json" || true
            if jq -e --argjson target "${FINAL_TARGET_LEDGER}" '
              (.snapshot.ledger_index // .snapshot.ledgerIndex // 0) >= $target
              or (.current_state_watermark.ledger_index // .current_state_watermark.ledgerIndex // 0) >= $target
            ' "${ROOT}/overview.json" > /dev/null 2>&1 \
              && jq -e '.events | type == "array"' "${ROOT}/activity.json" > /dev/null 2>&1; then
              verified=true
              break
            fi
            sleep 5
          done
          test "${verified}" = true
          jq -n \
            --argjson cutoverRunId "${CUTOVER_RUN_ID}" \
            --slurpfile catchup "${ROOT}/catchup-summary.json" \
            --slurpfile overview "${ROOT}/overview.json" \
            --slurpfile activity "${ROOT}/activity.json" \
            '{passed:true,cutoverRunId:$cutoverRunId,catchup:$catchup[0],overview:$overview[0],activity:$activity[0]}' \
            > "${ROOT}/summary.json"

      - name: Publish emergency recovery status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ROOT=p0-emergency-history-recovery
          if [ -s "${ROOT}/summary.json" ]; then
            cp "${ROOT}/summary.json" status.json
          elif [ -s "${ROOT}/catchup-summary.json" ]; then
            jq -n --arg runId "${GITHUB_RUN_ID}" --arg outcome "${{ job.status }}" --slurpfile catchup "${ROOT}/catchup-summary.json" '{runId:$runId,outcome:$outcome,catchup:$catchup[0]}' > status.json
          else
            jq -n --arg runId "${GITHUB_RUN_ID}" --arg outcome "${{ job.status }}" '{runId:$runId,outcome:$outcome}' > status.json
          fi
          API_PATH="repos/${GITHUB_REPOSITORY}/contents/.github/p0-emergency-history-recovery-status.json"
          CONTENT="$(base64 -w0 status.json)"
          for attempt in $(seq 1 10); do
            EXISTING_SHA="$(gh api "$API_PATH" --jq .sha 2>/dev/null || true)"
            if [ -n "${EXISTING_SHA}" ]; then
              gh api --method PUT "$API_PATH" -f message="Update P0 emergency history recovery status" -f content="$CONTENT" -f sha="$EXISTING_SHA" >/dev/null && exit 0
            else
              gh api --method PUT "$API_PATH" -f message="Create P0 emergency history recovery status" -f content="$CONTENT" >/dev/null && exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Upload emergency recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-emergency-history-recovery
          path: p0-emergency-history-recovery
          if-no-files-found: warn
          retention-days: 30
