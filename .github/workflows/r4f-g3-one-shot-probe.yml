name: R4F G3 One-Shot Probe

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: r4f-g3-one-shot-probe
  cancel-in-progress: false

env:
  QUALIFICATION_ISSUE: '1261'
  PROFILE_IDENTITY_DIGEST: 39e8b620a20bb08fbe8306fe753d4d445c5191bcafddbf67721e0c17d5b6bcd5
  PURPOSE: r4f-g3-directional-readonly-probe
  DEVNET_RPC: https://s.devnet.rippletest.net:51234/

jobs:
  prepare:
    if: >-
      github.event.issue.number == 1261 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      startsWith(github.event.comment.body, '/r4f-g3-prepare ')
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      GH_TOKEN: ${{ github.token }}
      PREPARE_BODY: ${{ github.event.comment.body }}
      PREPARE_CREATED_AT: ${{ github.event.comment.created_at }}
    steps:
      - name: Check out exact main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Verify dashboard authorization, pause, and retained BEFORE ordering
        id: sequence
        shell: bash
        run: |
          set -euo pipefail
          regex='^/r4f-g3-prepare dashboard_auth=([0-9]+) pause_run=([0-9]+) before_comment=([0-9]+) project=([a-f0-9]{64})$'
          [[ "$PREPARE_BODY" =~ $regex ]] || { echo 'prepare command shape mismatch' >&2; exit 1; }
          dashboard_auth="${BASH_REMATCH[1]}"
          pause_run="${BASH_REMATCH[2]}"
          before_comment="${BASH_REMATCH[3]}"
          project_digest="${BASH_REMATCH[4]}"
          test "$dashboard_auth" -gt 0
          test "$pause_run" -gt 0
          test "$before_comment" -gt 0
          [[ "$SUPABASE_PROJECT_ID" =~ ^[a-z]{20}$ ]]
          actual_project_digest="$(printf '%s' "$SUPABASE_PROJECT_ID" | sha256sum | awk '{print $1}')"
          test "$project_digest" = "$actual_project_digest"

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${pause_run}" > /tmp/pause-run.json
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${QUALIFICATION_ISSUE}/comments?per_page=100" \
            | jq -s 'add' > /tmp/issue-comments.json

          node scripts/verify-r4f-g3-before-sequence.mjs \
            --comments /tmp/issue-comments.json \
            --pause-run /tmp/pause-run.json \
            --dashboard-auth-comment-id "$dashboard_auth" \
            --pause-run-id "$pause_run" \
            --before-comment-id "$before_comment" \
            --project-digest "$project_digest" \
            --prepare-created-at "$PREPARE_CREATED_AT" > /tmp/before-sequence.json

          source_commit="$(jq -r '.sourceCommit' /tmp/before-sequence.json)"
          job_id="$(jq -r '.schedulerJobId' /tmp/before-sequence.json)"
          command_digest="$(jq -r '.schedulerCommandDigest' /tmp/before-sequence.json)"
          before_captured_at="$(jq -r '.beforeCapturedAt' /tmp/before-sequence.json)"
          before_invocations="$(jq -r '.beforeInvocations' /tmp/before-sequence.json)"
          before_artifact_digest="$(jq -r '.beforeArtifactDigest' /tmp/before-sequence.json)"
          test "$source_commit" = "$(git rev-parse HEAD)"

          printf 'dashboard_auth=%s\npause_run=%s\nbefore_comment=%s\nproject_digest=%s\nsource_commit=%s\njob_id=%s\ncommand_digest=%s\nbefore_captured_at=%s\nbefore_invocations=%s\nbefore_artifact_digest=%s\n' \
            "$dashboard_auth" "$pause_run" "$before_comment" "$project_digest" "$source_commit" "$job_id" "$command_digest" "$before_captured_at" "$before_invocations" "$before_artifact_digest" >> "$GITHUB_OUTPUT"

      - name: Resolve exact authorization proposal
        id: proposal
        env:
          DASHBOARD_AUTH: ${{ steps.sequence.outputs.dashboard_auth }}
          PAUSE_RUN: ${{ steps.sequence.outputs.pause_run }}
          BEFORE_COMMENT: ${{ steps.sequence.outputs.before_comment }}
          PROJECT_DIGEST: ${{ steps.sequence.outputs.project_digest }}
          SOURCE_COMMIT: ${{ steps.sequence.outputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          request='{"method":"ledger","params":[{"ledger_index":"validated","transactions":false,"expand":false,"api_version":1}]}'
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            -H 'content-type: application/json' \
            --data "$request" \
            "$DEVNET_RPC" > /tmp/devnet-ledger.json

          ledger="$(node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const payload = JSON.parse(readFileSync('/tmp/devnet-ledger.json', 'utf8'))
          const result = payload?.result
          if (!result || result.validated !== true) throw new Error('Devnet validated ledger unavailable')
          const raw = result.ledger_index ?? result.ledger?.ledger_index
          const ledger = Number(raw)
          if (!Number.isSafeInteger(ledger) || ledger <= 0) throw new Error('Devnet ledger index invalid')
          process.stdout.write(String(ledger))
          NODE
          )"

          head_sha="$(git rev-parse HEAD)"
          test "$head_sha" = "$SOURCE_COMMIT"
          printf 'head_sha=%s\nledger=%s\nproject_digest=%s\n' "$head_sha" "$ledger" "$PROJECT_DIGEST" >> "$GITHUB_OUTPUT"

          cat > /tmp/proposal.md <<EOF
          ## R4F G3 one-shot authorization proposal

          Preparation run: \`${GITHUB_RUN_ID}\`
          Source commit: \`${head_sha}\`
          Revision-4 profile digest: \`${PROFILE_IDENTITY_DIGEST}\`
          Project identity digest: \`${PROJECT_DIGEST}\`
          Exact Devnet ledger: \`${ledger}\`
          Dashboard authorization comment: \`${DASHBOARD_AUTH}\`
          Isolation pause run: \`${PAUSE_RUN}\`
          BEFORE capture comment: \`${BEFORE_COMMENT}\`

          The dashboard capture authorization and isolated BEFORE marker were verified before this prepare run.

          Exact authorization command:

          \`/r4f-g3-authorize commit=${head_sha} ledger=${ledger} project=${PROJECT_DIGEST} prepare_run=${GITHUB_RUN_ID} dashboard_auth=${DASHBOARD_AUTH} pause_run=${PAUSE_RUN} before_comment=${BEFORE_COMMENT}\`

          This authorizes only a temporary G3 probe deployment, one read-only request for the exact Devnet ledger above, sanitized evidence upload, and cleanup. It does not authorize DB access, migration, R5 mutation, public-reader change, Mainnet, stabilization, or soak.
          EOF

          gh issue comment "$QUALIFICATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/proposal.md

  execute:
    if: >-
      github.event.issue.number == 1261 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      startsWith(github.event.comment.body, '/r4f-g3-authorize ')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      GH_TOKEN: ${{ github.token }}
      AUTHORIZATION_COMMENT_ID: ${{ github.event.comment.id }}
      AUTHORIZATION_CREATED_AT: ${{ github.event.comment.created_at }}
      AUTHORIZATION_BODY: ${{ github.event.comment.body }}
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Parse and verify exact owner authorization and retained BEFORE sequence
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          regex='^/r4f-g3-authorize commit=([a-f0-9]{40}) ledger=([0-9]+) project=([a-f0-9]{64}) prepare_run=([0-9]+) dashboard_auth=([0-9]+) pause_run=([0-9]+) before_comment=([0-9]+)$'
          [[ "$AUTHORIZATION_BODY" =~ $regex ]] || { echo 'authorization command shape mismatch' >&2; exit 1; }
          commit="${BASH_REMATCH[1]}"
          ledger="${BASH_REMATCH[2]}"
          project_digest="${BASH_REMATCH[3]}"
          prepare_run="${BASH_REMATCH[4]}"
          dashboard_auth="${BASH_REMATCH[5]}"
          pause_run="${BASH_REMATCH[6]}"
          before_comment="${BASH_REMATCH[7]}"

          test "$ledger" -gt 0
          test "$prepare_run" -gt 0
          test "$dashboard_auth" -gt 0
          test "$pause_run" -gt 0
          test "$before_comment" -gt 0
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_ID"
          [[ "$SUPABASE_PROJECT_ID" =~ ^[a-z]{20}$ ]]
          test "$commit" = "$(git rev-parse HEAD)"
          actual_project_digest="$(printf '%s' "$SUPABASE_PROJECT_ID" | sha256sum | awk '{print $1}')"
          test "$project_digest" = "$actual_project_digest"

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${prepare_run}" > /tmp/prepare-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${pause_run}" > /tmp/pause-run.json
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${QUALIFICATION_ISSUE}/comments?per_page=100" \
            | jq -s 'add' > /tmp/issue-comments.json

          prepare_created_at="$(jq -r '.created_at' /tmp/prepare-run.json)"
          node scripts/verify-r4f-g3-before-sequence.mjs \
            --comments /tmp/issue-comments.json \
            --pause-run /tmp/pause-run.json \
            --dashboard-auth-comment-id "$dashboard_auth" \
            --pause-run-id "$pause_run" \
            --before-comment-id "$before_comment" \
            --project-digest "$project_digest" \
            --prepare-created-at "$prepare_created_at" > /tmp/before-sequence.json

          node scripts/verify-r4f-g3-prepare-proposal.mjs \
            --comments /tmp/issue-comments.json \
            --run /tmp/prepare-run.json \
            --prepare-run "$prepare_run" \
            --commit "$commit" \
            --ledger "$ledger" \
            --project-digest "$project_digest" \
            --dashboard-auth-comment-id "$dashboard_auth" \
            --pause-run-id "$pause_run" \
            --before-comment-id "$before_comment" \
            --authorization-created-at "$AUTHORIZATION_CREATED_AT"

          job_id="$(jq -r '.schedulerJobId' /tmp/before-sequence.json)"
          command_digest="$(jq -r '.schedulerCommandDigest' /tmp/before-sequence.json)"
          before_captured_at="$(jq -r '.beforeCapturedAt' /tmp/before-sequence.json)"
          before_invocations="$(jq -r '.beforeInvocations' /tmp/before-sequence.json)"
          before_artifact_digest="$(jq -r '.beforeArtifactDigest' /tmp/before-sequence.json)"

          printf 'commit=%s\nledger=%s\nproject_digest=%s\nprepare_run=%s\ndashboard_auth=%s\npause_run=%s\nbefore_comment=%s\njob_id=%s\ncommand_digest=%s\nbefore_captured_at=%s\nbefore_invocations=%s\nbefore_artifact_digest=%s\n' \
            "$commit" "$ledger" "$project_digest" "$prepare_run" "$dashboard_auth" "$pause_run" "$before_comment" "$job_id" "$command_digest" "$before_captured_at" "$before_invocations" "$before_artifact_digest" >> "$GITHUB_OUTPUT"

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: latest

      - name: Bundle exact G3 probe source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r4f-g3-one-shot-evidence
          source_path='supabase/functions/xrpl-r4f-g3-directional-probe/index.ts'
          bundle_path='/tmp/xrpl-r4f-g3-directional-probe-index.ts'
          bun build "$source_path" --target=browser --format=esm --outfile="$bundle_path"
          test -s "$bundle_path"
          ! grep -q 'cloudflare:' "$bundle_path"
          grep -q 'Deno.serve' "$bundle_path"
          cp "$bundle_path" "$source_path"

      - name: Create one-run probe secrets
        env:
          SOURCE_COMMIT: ${{ steps.auth.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          probe_token="$(openssl rand -hex 32)"
          echo "::add-mask::${probe_token}"
          supabase secrets set \
            R4F_G3_PROBE_VERIFY_TOKEN="${probe_token}" \
            R4F_G3_PROBE_SOURCE_COMMIT="${SOURCE_COMMIT}" \
            --project-ref "$SUPABASE_PROJECT_ID"
          printf 'R4F_G3_PROBE_VERIFY_TOKEN=%s\n' "$probe_token" >> "$GITHUB_ENV"

      - name: Deploy only the bounded G3 probe
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy xrpl-r4f-g3-directional-probe \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --use-api \
            --no-verify-jwt

      - name: Invoke exactly one authorized Devnet ledger read
        env:
          LEDGER_INDEX: ${{ steps.auth.outputs.ledger }}
          SOURCE_COMMIT: ${{ steps.auth.outputs.commit }}
          PROJECT_IDENTITY_DIGEST: ${{ steps.auth.outputs.project_digest }}
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir='r4f-g3-one-shot-evidence'
          observation_id="r4f.g3.live.${GITHUB_RUN_ID}"
          attempt_id="r4f.g3.live.attempt.${GITHUB_RUN_ID}"
          body="$(printf '{\"ledgerIndex\":%s,\"observationId\":\"%s\",\"attemptId\":\"%s\",\"sourceRunId\":%s}' "$LEDGER_INDEX" "$observation_id" "$attempt_id" "$GITHUB_RUN_ID")"

          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 60 \
            -H 'content-type: application/json' \
            -H "x-xrpl-reader-purpose: ${PURPOSE}" \
            -H "x-xrpl-reader-token: ${R4F_G3_PROBE_VERIFY_TOKEN}" \
            --data "$body" \
            "https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/xrpl-r4f-g3-directional-probe" \
            > "$evidence_dir/probe-response.json"

          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          import { createHash } from 'node:crypto'
          const text = readFileSync('r4f-g3-one-shot-evidence/probe-response.json', 'utf8')
          const value = JSON.parse(text)
          if (value.schemaVersion !== 1) throw new Error('probe schema mismatch')
          if (value.purpose !== 'r4f-g3-directional-readonly-probe') throw new Error('probe purpose mismatch')
          if (value.profileRevision !== 4) throw new Error('probe revision mismatch')
          if (value.profileIdentityDigest !== process.env.PROFILE_IDENTITY_DIGEST) throw new Error('probe identity mismatch')
          if (value.network !== 'devnet') throw new Error('probe network mismatch')
          if (value.ledgerIndex !== Number(process.env.LEDGER_INDEX)) throw new Error('probe ledger mismatch')
          if (value.sourceCommit !== process.env.SOURCE_COMMIT) throw new Error('probe commit mismatch')
          if (value.checks?.databaseRequestIssued !== false) throw new Error('probe database boundary changed')
          if (value.checks?.recoveryMutationCommitted !== false) throw new Error('probe recovery boundary changed')
          if (value.checks?.mainnetDisabled !== true) throw new Error('probe mainnet boundary changed')
          const accounting = value.accountingEvidence?.accounting
          if (!accounting || accounting.checks?.blanketAllDirectionMultiplierUsed !== false) throw new Error('probe accounting contract mismatch')
          const summary = {
            schemaVersion: 1,
            qualificationIssue: 1261,
            runId: Number(process.env.GITHUB_RUN_ID),
            authorizationCommentId: Number(process.env.AUTHORIZATION_COMMENT_ID),
            sourceCommit: value.sourceCommit,
            ledgerIndex: value.ledgerIndex,
            projectIdentityDigest: process.env.PROJECT_IDENTITY_DIGEST,
            profileIdentityDigest: value.profileIdentityDigest,
            xrplResponseBytes: value.xrplResponseBytes,
            xrplResponseDigest: value.xrplResponseDigest,
            accountingDigest: value.accountingEvidence.accountingDigest,
            rollingBillableEgressUpperBoundBytes: accounting.rollingBillableEgressUpperBoundBytes,
            memoryTransportUpperBoundBytes: accounting.memoryTransportUpperBoundBytes,
            probeResponseSha256: createHash('sha256').update(text).digest('hex'),
            safety: value.checks,
          }
          writeFileSync('r4f-g3-one-shot-evidence/summary.json', `${JSON.stringify(summary, null, 2)}\n`)
          NODE

      - name: Remove one-shot function and secrets
        if: always()
        shell: bash
        run: |
          set +e
          supabase functions delete xrpl-r4f-g3-directional-probe --project-ref "$SUPABASE_PROJECT_ID"
          function_cleanup=$?
          supabase secrets unset R4F_G3_PROBE_VERIFY_TOKEN R4F_G3_PROBE_SOURCE_COMMIT --project-ref "$SUPABASE_PROJECT_ID"
          secret_cleanup=$?
          if [ "$function_cleanup" -ne 0 ] || [ "$secret_cleanup" -ne 0 ]; then
            echo 'one-shot cleanup did not fully complete' >&2
            exit 1
          fi

      - name: Upload sanitized G3 probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r4f-g3-one-shot-evidence
          path: r4f-g3-one-shot-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Publish sanitized execution locator and immediate resume command
        if: always()
        env:
          RUN_STATUS: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PAUSE_RUN: ${{ steps.auth.outputs.pause_run }}
          BEFORE_COMMENT: ${{ steps.auth.outputs.before_comment }}
          PROJECT_DIGEST: ${{ steps.auth.outputs.project_digest }}
          JOB_ID: ${{ steps.auth.outputs.job_id }}
          COMMAND_DIGEST: ${{ steps.auth.outputs.command_digest }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/g3-run.md <<EOF
          ## R4F G3 one-shot probe run

          Run: ${RUN_URL}
          Status: \`${RUN_STATUS}\`
          Authorization comment: \`${AUTHORIZATION_COMMENT_ID}\`
          Source commit: \`${{ steps.auth.outputs.commit }}\`
          Devnet ledger: \`${{ steps.auth.outputs.ledger }}\`
          Project identity digest: \`${PROJECT_DIGEST}\`
          Pause run: \`${PAUSE_RUN}\`
          BEFORE capture comment: \`${BEFORE_COMMENT}\`

          This workflow contains no DB migration or R5 recovery step. If Status is \`success\`, restore the exact collector scheduler immediately. Do not wait for Supabase Usage to refresh.

          Exact immediate-resume command:

          \`/r4f-g3-isolation-resume project=${PROJECT_DIGEST} job=${JOB_ID} command=${COMMAND_DIGEST} pause_run=${PAUSE_RUN} one_shot_run=${GITHUB_RUN_ID} before_comment=${BEFORE_COMMENT}\`

          Fresh project-filtered Supabase Usage AFTER evidence is captured only after the successful resume. Freshness remains mandatory for G3 qualification.
          EOF
          gh issue comment "$QUALIFICATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/g3-run.md

  after_validate:
    if: >-
      github.event.issue.number == 1261 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      startsWith(github.event.comment.body, '/r4f-g3-after ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      GH_TOKEN: ${{ github.token }}
      AFTER_BODY: ${{ github.event.comment.body }}
      AFTER_COMMENT_ID: ${{ github.event.comment.id }}
    steps:
      - name: Check out current main read-only
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Verify post-resume fresh Usage evidence
        id: after
        shell: bash
        run: |
          set -euo pipefail
          regex='^/r4f-g3-after run=([0-9]+) pause_run=([0-9]+) resume_run=([0-9]+) before_comment=([0-9]+) project=([a-f0-9]{64}) captured_at=([^ ]+) invocations=([0-9]+) artifact=([a-f0-9]{64})$'
          [[ "$AFTER_BODY" =~ $regex ]] || { echo 'AFTER command shape mismatch' >&2; exit 1; }
          one_shot_run="${BASH_REMATCH[1]}"
          pause_run="${BASH_REMATCH[2]}"
          resume_run="${BASH_REMATCH[3]}"
          before_comment="${BASH_REMATCH[4]}"
          project_digest="${BASH_REMATCH[5]}"
          test "$one_shot_run" -gt 0
          test "$pause_run" -gt 0
          test "$resume_run" -gt 0
          test "$before_comment" -gt 0
          [[ "$SUPABASE_PROJECT_ID" =~ ^[a-z]{20}$ ]]
          actual_project_digest="$(printf '%s' "$SUPABASE_PROJECT_ID" | sha256sum | awk '{print $1}')"
          test "$project_digest" = "$actual_project_digest"

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${one_shot_run}" > /tmp/one-shot-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${resume_run}" > /tmp/resume-run.json
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${QUALIFICATION_ISSUE}/comments?per_page=100" \
            | jq -s 'add' > /tmp/issue-comments.json

          node scripts/verify-r4f-g3-after-sequence.mjs \
            --comments /tmp/issue-comments.json \
            --one-shot-run /tmp/one-shot-run.json \
            --resume-run /tmp/resume-run.json \
            --pause-run-id "$pause_run" \
            --before-comment-id "$before_comment" \
            --after-comment-id "$AFTER_COMMENT_ID" \
            --project-digest "$project_digest" > /tmp/after-sequence.json

          capture_start="$(jq -r '.beforeCapturedAt' /tmp/after-sequence.json)"
          capture_end="$(jq -r '.afterCapturedAt' /tmp/after-sequence.json)"
          invocation_delta="$(jq -r '.invocationDelta' /tmp/after-sequence.json)"
          CAPTURE_START="$capture_start" CAPTURE_END="$capture_end" node --input-type=module <<'NODE'
          const start = Date.parse(process.env.CAPTURE_START ?? '')
          const end = Date.parse(process.env.CAPTURE_END ?? '')
          if (!Number.isFinite(start) || !Number.isFinite(end) || end < start) throw new Error('provider interval is invalid')
          if (end - start > 60 * 60 * 1000) throw new Error('provider interval exceeds one hour')
          NODE

          printf 'one_shot_run=%s\npause_run=%s\nresume_run=%s\nbefore_comment=%s\nafter_comment=%s\nproject_digest=%s\ncapture_start=%s\ncapture_end=%s\ninvocation_delta=%s\n' \
            "$one_shot_run" "$pause_run" "$resume_run" "$before_comment" "$AFTER_COMMENT_ID" "$project_digest" "$capture_start" "$capture_end" "$invocation_delta" >> "$GITHUB_OUTPUT"

      - name: Publish fresh AFTER validation and exact log-capture command
        env:
          ONE_SHOT_RUN: ${{ steps.after.outputs.one_shot_run }}
          PAUSE_RUN: ${{ steps.after.outputs.pause_run }}
          RESUME_RUN: ${{ steps.after.outputs.resume_run }}
          BEFORE_COMMENT: ${{ steps.after.outputs.before_comment }}
          AFTER_COMMENT: ${{ steps.after.outputs.after_comment }}
          PROJECT_DIGEST: ${{ steps.after.outputs.project_digest }}
          INVOCATION_DELTA: ${{ steps.after.outputs.invocation_delta }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/g3-after.md <<EOF
          ## R4F G3 fresh AFTER verified after collector restoration

          One-shot run: \`${ONE_SHOT_RUN}\`
          Resume run: \`${RESUME_RUN}\`
          BEFORE capture comment: \`${BEFORE_COMMENT}\`
          AFTER capture comment: \`${AFTER_COMMENT}\`
          Project identity digest: \`${PROJECT_DIGEST}\`
          Verified Usage invocation delta: \`${INVOCATION_DELTA}\`

          Supabase Usage freshness is now verified after the collector was already restored. This does not by itself qualify G3. Capture bounded concurrent provider logs next with:

          \`/r4f-g3-capture-logs run=${ONE_SHOT_RUN} resume_run=${RESUME_RUN} pause_run=${PAUSE_RUN} before_comment=${BEFORE_COMMENT} after_comment=${AFTER_COMMENT} project=${PROJECT_DIGEST}\`
          EOF
          gh issue comment "$QUALIFICATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/g3-after.md

  capture_logs:
    if: >-
      github.event.issue.number == 1261 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      startsWith(github.event.comment.body, '/r4f-g3-capture-logs ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      GH_TOKEN: ${{ github.token }}
      CAPTURE_BODY: ${{ github.event.comment.body }}
      CAPTURE_AUTH_CREATED_AT: ${{ github.event.comment.created_at }}
    steps:
      - name: Check out current main read-only
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Parse and verify fresh AFTER, completed G3 run, resume, and provider interval
        id: target
        shell: bash
        run: |
          set -euo pipefail
          regex='^/r4f-g3-capture-logs run=([0-9]+) resume_run=([0-9]+) pause_run=([0-9]+) before_comment=([0-9]+) after_comment=([0-9]+) project=([a-f0-9]{64})$'
          [[ "$CAPTURE_BODY" =~ $regex ]] || { echo 'log capture command shape mismatch' >&2; exit 1; }
          target_run="${BASH_REMATCH[1]}"
          resume_run="${BASH_REMATCH[2]}"
          pause_run="${BASH_REMATCH[3]}"
          before_comment="${BASH_REMATCH[4]}"
          after_comment="${BASH_REMATCH[5]}"
          project_digest="${BASH_REMATCH[6]}"
          test "$target_run" -gt 0
          test "$resume_run" -gt 0
          test "$pause_run" -gt 0
          test "$before_comment" -gt 0
          test "$after_comment" -gt 0
          test -n "$SUPABASE_ACCESS_TOKEN"
          [[ "$SUPABASE_PROJECT_ID" =~ ^[a-z]{20}$ ]]
          actual_project_digest="$(printf '%s' "$SUPABASE_PROJECT_ID" | sha256sum | awk '{print $1}')"
          test "$project_digest" = "$actual_project_digest"

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${target_run}" > /tmp/target-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${resume_run}" > /tmp/resume-run.json
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${QUALIFICATION_ISSUE}/comments?per_page=100" \
            | jq -s 'add' > /tmp/issue-comments.json

          node scripts/verify-r4f-g3-after-sequence.mjs \
            --comments /tmp/issue-comments.json \
            --one-shot-run /tmp/target-run.json \
            --resume-run /tmp/resume-run.json \
            --pause-run-id "$pause_run" \
            --before-comment-id "$before_comment" \
            --after-comment-id "$after_comment" \
            --project-digest "$project_digest" > /tmp/after-sequence.json

          capture_start="$(jq -r '.beforeCapturedAt' /tmp/after-sequence.json)"
          capture_end="$(jq -r '.afterCapturedAt' /tmp/after-sequence.json)"
          invocation_delta="$(jq -r '.invocationDelta' /tmp/after-sequence.json)"

          AFTER_COMMENT="$after_comment" CAPTURE_AUTH_CREATED_AT="$CAPTURE_AUTH_CREATED_AT" CAPTURE_START="$capture_start" CAPTURE_END="$capture_end" node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const comments = JSON.parse(readFileSync('/tmp/issue-comments.json', 'utf8'))
          const after = comments.find((item) => Number(item?.id) === Number(process.env.AFTER_COMMENT))
          const afterAt = Date.parse(String(after?.created_at ?? ''))
          const authorizationAt = Date.parse(process.env.CAPTURE_AUTH_CREATED_AT ?? '')
          const start = Date.parse(process.env.CAPTURE_START ?? '')
          const end = Date.parse(process.env.CAPTURE_END ?? '')
          if (![afterAt, authorizationAt, start, end].every(Number.isFinite)) throw new Error('G3 log sequence timestamps are invalid')
          if (!(afterAt < authorizationAt)) throw new Error('log capture authorization must follow verified AFTER marker')
          if (end - start > 60 * 60 * 1000) throw new Error('provider interval exceeds one hour')
          NODE

          source_commit="$(jq -r '.head_sha' /tmp/target-run.json)"
          [[ "$source_commit" =~ ^[a-f0-9]{40}$ ]]
          printf 'target_run=%s\nresume_run=%s\nafter_comment=%s\ncapture_start=%s\ncapture_end=%s\ninvocation_delta=%s\nproject_digest=%s\nsource_commit=%s\n' \
            "$target_run" "$resume_run" "$after_comment" "$capture_start" "$capture_end" "$invocation_delta" "$project_digest" "$source_commit" >> "$GITHUB_OUTPUT"

      - name: Capture bounded read-only Supabase traffic logs
        env:
          TARGET_G3_RUN: ${{ steps.target.outputs.target_run }}
          CAPTURE_START: ${{ steps.target.outputs.capture_start }}
          CAPTURE_END: ${{ steps.target.outputs.capture_end }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/capture-r4f-g3-concurrent-traffic-logs.mjs \
            --target-run "$TARGET_G3_RUN" \
            --start "$CAPTURE_START" \
            --end "$CAPTURE_END" \
            --output r4f-g3-concurrent-traffic-evidence/log-window.json

      - name: Reject retained credentials or project ref
        shell: bash
        run: |
          set -euo pipefail
          evidence='r4f-g3-concurrent-traffic-evidence/log-window.json'
          test -s "$evidence"
          ! grep -Fq "$SUPABASE_PROJECT_ID" "$evidence"
          ! grep -Eq 'sbp_[A-Za-z0-9_-]{12,}|Bearer [A-Za-z0-9._-]{12,}|postgres(ql)?://' "$evidence"

      - name: Upload sanitized concurrent traffic evidence
        uses: actions/upload-artifact@v4
        with:
          name: r4f-g3-concurrent-traffic-evidence
          path: r4f-g3-concurrent-traffic-evidence/log-window.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish read-only log capture locator
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TARGET_G3_RUN: ${{ steps.target.outputs.target_run }}
          RESUME_RUN: ${{ steps.target.outputs.resume_run }}
          AFTER_COMMENT: ${{ steps.target.outputs.after_comment }}
          CAPTURE_START: ${{ steps.target.outputs.capture_start }}
          CAPTURE_END: ${{ steps.target.outputs.capture_end }}
          INVOCATION_DELTA: ${{ steps.target.outputs.invocation_delta }}
          TARGET_SOURCE_COMMIT: ${{ steps.target.outputs.source_commit }}
          TARGET_PROJECT_IDENTITY_DIGEST: ${{ steps.target.outputs.project_digest }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/g3-log-capture.md <<EOF
          ## R4F G3 concurrent-traffic log capture

          Run: ${RUN_URL}
          Target one-shot run: \`${TARGET_G3_RUN}\`
          Resume run: \`${RESUME_RUN}\`
          Fresh AFTER comment: \`${AFTER_COMMENT}\`
          Verified Usage invocation delta: \`${INVOCATION_DELTA}\`
          Captured provider interval: \`${CAPTURE_START}\` → \`${CAPTURE_END}\`
          Source commit under test: \`${TARGET_SOURCE_COMMIT}\`
          Project identity digest: \`${TARGET_PROJECT_IDENTITY_DIGEST}\`

          This is a read-only Supabase Management API log query performed after collector restoration and fresh Usage validation. It does not deploy a function, change secrets, access the database, authorize R5, enable Mainnet, or authorize stabilization/soak. Bind this artifact and its SHA-256 into the provider capture evidence before running the final G3 verifier.
          EOF
          gh issue comment "$QUALIFICATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/g3-log-capture.md
