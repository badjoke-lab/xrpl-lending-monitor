name: Complete-history 12-slot qualification 995 v5

on:
  workflow_dispatch:
  schedule:
    - cron: '5 16 28 7 *'
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/complete-history-12-slot-qualification-995-v5.yml
      - .github/qualification-995-v5-bundle.txt
      - .github/complete-history-12-slot-qualification-995-v5-plan.json
      - docs/implementation-status.md
      - docs/qualification-995-v5-plan.md

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: complete-history-12-slot-qualification-995-v5
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
  PRODUCTION_BASE: https://xrpl-lending-monitor.badjoke-lab.workers.dev
  STATUS_ISSUE: '995'
  RUNTIME_SHA: 5b56de459e97495a9358f0e203c056d2a99afc6b
  DEPLOY_PROOF_PATH: .github/object-window-index-995-verification-v3-status.json
  HISTORY_BRANCH: history-data
  HISTORY_HEAD: 5d7bf6d330407c7ead237b3885d4330a8d268ce6
  HISTORY_DATA_SHA: 12252ce9df0d5ab50adc51e2743edb8ff03989dd
  HISTORY_CHAIN_ID: canonical-devnet-3371676-3932301-v3
  HISTORY_END_LEDGER: '3932301'
  HISTORY_SEGMENTS: '1136'
  HISTORY_LEDGERS: '560626'
  HISTORY_BUCKETS: '1024'
  HISTORY_RECORDS: '33811930'
  CURRENT_STATE_BRANCH: current-state-data
  PREPARE_UTC: '2026-07-28T16:25:00Z'
  START_UTC: '2026-07-28T16:30:00Z'
  END_UTC: '2026-07-28T17:25:00Z'
  EVALUATE_UTC: '2026-07-28T17:30:30Z'
  START_MS: '1785256200000'
  END_MS: '1785259500000'
  QUALIFY_TIMEOUT_MINUTES: '180'
  FINALIZATION_BUDGET_SECONDS: '1200'

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Extract reviewed qualification bundle
        shell: bash
        run: |
          set -euo pipefail
          sed -n "/<<'PAYLOAD'$/,/^PAYLOAD$/p" .github/qualification-995-v5-bundle.txt | sed '1d;$d' > /tmp/qualification-v5.tar.gz.b64
          test -s /tmp/qualification-v5.tar.gz.b64
          base64 -d /tmp/qualification-v5.tar.gz.b64 > /tmp/qualification-v5.tar.gz
          tar -xzf /tmp/qualification-v5.tar.gz -C .
      - name: Validate fixed qualification v5 boundary and identities
        shell: bash
        run: bash scripts/qualification-995-v5/validate.sh
      - name: Reject stale qualification identities
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n -E 'qualification 995 v[1-4]|qualify-v[1-4]|2026-07-25T08:30:00Z|1784968200000' scripts/qualification-995-v5 .github/complete-history-12-slot-qualification-995-v5-plan.json
          grep -q "'startUtc':'2026-07-28T16:30:00Z'" scripts/qualification-995-v5/evaluate.sh
          grep -q 'qualification 995 v5' scripts/qualification-995-v5/publish.sh
          bash -n scripts/qualification-995-v5/*.sh

  qualify:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Extract reviewed qualification bundle
        shell: bash
        run: |
          set -euo pipefail
          sed -n "/<<'PAYLOAD'$/,/^PAYLOAD$/p" .github/qualification-995-v5-bundle.txt | sed '1d;$d' > /tmp/qualification-v5.tar.gz.b64
          test -s /tmp/qualification-v5.tar.gz.b64
          base64 -d /tmp/qualification-v5.tar.gz.b64 > /tmp/qualification-v5.tar.gz
          tar -xzf /tmp/qualification-v5.tar.gz -C .
      - name: Validate fixed qualification v5 boundary and identities
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/qualification-995-v5/validate.sh
          bash -n scripts/qualification-995-v5/*.sh
      - name: Arm Issue and wait for identity freeze point
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash scripts/qualification-995-v5/arm.sh
      - name: Capture pre-window production identity
        shell: bash
        run: bash scripts/qualification-995-v5/capture-pre.sh
      - name: Wait for fixed qualification window to close
        shell: bash
        run: bash scripts/qualification-995-v5/wait.sh
      - name: Read exact slot, metric, history and final identity evidence
        shell: bash
        run: bash scripts/qualification-995-v5/read-evidence.sh
      - name: Decode, source-cross-audit and evaluate
        shell: bash
        run: bash scripts/qualification-995-v5/evaluate.sh
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-history-12-slot-qualification-995-v5
          path: |
            complete-history-12-slot-qualification-995-v5.json
            qualification-status.txt
            pre-identity.json
            slots.json
            slot-metrics.json
            slot-windows.json
            final-fast.json
            final-overlay.json
            post-readiness.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publish retained evidence and Issue result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash scripts/qualification-995-v5/publish.sh
