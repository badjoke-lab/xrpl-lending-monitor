name: Inspect current-state runs

on:
  push:
    branches:
      - main
    paths:
      - .github/current-state-runs-inspect-trigger

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect release workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/publish-current-state-release.yml/runs?per_page=10" \
            --jq '{runs:[.workflow_runs[]|{id,name,status,conclusion,event,head_sha,run_number,created_at,updated_at,html_url}]}' \
            > current-state-runs.json
          API_PATH="repos/${GITHUB_REPOSITORY}/contents/.github/current-state-runs.json"
          CONTENT=$(base64 -w0 current-state-runs.json)
          EXISTING_SHA=$(gh api "$API_PATH" --jq .sha 2>/dev/null || true)
          if [ -n "$EXISTING_SHA" ]; then
            gh api --method PUT "$API_PATH" -f message="Update current-state run list" -f content="$CONTENT" -f sha="$EXISTING_SHA" >/dev/null
          else
            gh api --method PUT "$API_PATH" -f message="Create current-state run list" -f content="$CONTENT" >/dev/null
          fi
