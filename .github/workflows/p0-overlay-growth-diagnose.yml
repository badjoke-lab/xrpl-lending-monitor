name: P0 overlay growth diagnose

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    if: startsWith(github.event.issue.title, 'P0 overlay growth diagnose')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Query overlay growth composition
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          COMPOSITION_SQL=$(cat <<'SQL'
          SELECT operation,
                 object_type,
                 COALESCE(on_ledger_status, '(null)') AS on_ledger_status,
                 COUNT(*) AS row_count,
                 COALESCE(SUM(LENGTH(projection_json)), 0) AS projection_bytes,
                 MIN(source_ledger_index) AS oldest_source_ledger,
                 MAX(source_ledger_index) AS newest_source_ledger
          FROM current_state_overlay_objects
          WHERE network = 'devnet'
          GROUP BY operation, object_type, COALESCE(on_ledger_status, '(null)')
          ORDER BY row_count DESC
          SQL
          )

          AGE_SQL=$(cat <<'SQL'
          WITH current AS (
            SELECT overlay_ledger_index AS current_ledger
            FROM current_state_overlay_state
            WHERE network = 'devnet'
            LIMIT 1
          )
          SELECT CASE
                   WHEN current.current_ledger - overlay.source_ledger_index < 1000 THEN 'lt_1000'
                   WHEN current.current_ledger - overlay.source_ledger_index < 5000 THEN '1000_4999'
                   WHEN current.current_ledger - overlay.source_ledger_index < 20000 THEN '5000_19999'
                   ELSE 'gte_20000'
                 END AS age_bucket,
                 overlay.operation,
                 COUNT(*) AS row_count,
                 COALESCE(SUM(LENGTH(overlay.projection_json)), 0) AS projection_bytes
          FROM current_state_overlay_objects AS overlay
          CROSS JOIN current
          WHERE overlay.network = 'devnet'
          GROUP BY age_bucket, overlay.operation
          ORDER BY age_bucket, overlay.operation
          SQL
          )

          SUMMARY_SQL=$(cat <<'SQL'
          SELECT state.epoch_id,
                 state.base_snapshot_id,
                 state.base_ledger_index,
                 state.overlay_ledger_index,
                 state.overlay_ledger_index - state.base_ledger_index AS overlay_span_ledgers,
                 (SELECT COUNT(*) FROM current_state_overlay_objects WHERE network = 'devnet') AS overlay_rows,
                 (SELECT COUNT(*) FROM current_state_overlay_objects WHERE network = 'devnet' AND operation = 'deleted') AS deleted_rows,
                 (SELECT COUNT(*) FROM current_state_overlay_objects WHERE network = 'devnet' AND operation <> 'deleted') AS live_rows,
                 (SELECT COUNT(*) FROM fast_lane_shadow_objects_compact WHERE network = 'devnet') AS compact_rows
          FROM current_state_overlay_state AS state
          WHERE state.network = 'devnet'
          LIMIT 1
          SQL
          )

          query_d1() {
            local sql="$1"
            local output="$2"
            jq -n --arg sql "$sql" '{sql: $sql}' \
              | curl --fail-with-body --silent --show-error \
                  -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  -H 'Content-Type: application/json' \
                  --data-binary @- \
                  "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query" \
              > "$output"
          }

          query_d1 "$SUMMARY_SQL" /tmp/summary.json
          query_d1 "$COMPOSITION_SQL" /tmp/composition.json
          query_d1 "$AGE_SQL" /tmp/age.json

          {
            echo 'P0 overlay growth diagnostics:'
            echo
            echo 'Summary:'
            echo '```json'
            jq . /tmp/summary.json
            echo '```'
            echo
            echo 'Composition:'
            echo '```json'
            jq . /tmp/composition.json
            echo '```'
            echo
            echo 'Age distribution:'
            echo '```json'
            jq . /tmp/age.json
            echo '```'
          } > /tmp/comment.md

          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body-file /tmp/comment.md
