name: P0 emergency production deploy

on:
  push:
    branches: [main]
    paths:
      - .github/p0-emergency-production-deploy-trigger

permissions:
  actions: read
  contents: write

concurrency:
  group: p0-emergency-production-worker-write
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_BASE: https://xrpl-lending-monitor.badjoke-lab.workers.dev
    steps:
      - name: Check out implementation
        uses: actions/checkout@v4

      - name: Check out production current-state identity
        uses: actions/checkout@v4
        with:
          ref: current-state-data
          path: .local/current-state-data
          sparse-checkout: read-model/manifest.json
          sparse-checkout-cone-mode: false

      - name: Check out archived history identity
        uses: actions/checkout@v4
        with:
          ref: history-data
          path: .local/history-data
          sparse-checkout: history/publication.json
          sparse-checkout-cone-mode: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate emergency production boundary
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "$(jq -r '.vars.APP_NETWORK' wrangler.jsonc)" = devnet
          test "$(jq -r '.vars.MAINNET_ENABLED' wrangler.jsonc)" = false
          test "$(jq -r '.triggers.crons | length' wrangler.jsonc)" -eq 1
          test "$(jq -r '.triggers.crons[0]' wrangler.jsonc)" = '*/5 * * * *'
          test "$(jq -r '.vars | has("REPLACEMENT_BASE_CUTOVER_TOKEN")' wrangler.jsonc)" = false
          cp wrangler.jsonc wrangler.production.jsonc
          python - <<'PY'
          import json
          from pathlib import Path

          current = json.loads(Path('.local/current-state-data/read-model/manifest.json').read_text())
          history = json.loads(Path('.local/history-data/history/publication.json').read_text())
          config = json.loads(Path('wrangler.production.jsonc').read_text())

          assert current['complete'] is True
          assert history['complete'] is True
          assert current['epochId'] == history['epochId']
          assert history['endLedgerIndex'] <= current['ledgerIndex']
          if history['endLedgerIndex'] == current['ledgerIndex']:
              assert history['endLedgerHash'] == current['ledgerHash']

          assert config['vars']['REPLACEMENT_BASE_EPOCH_ID'] == current['epochId']
          assert config['vars']['REPLACEMENT_BASE_SNAPSHOT_ID'] == current['snapshotId']
          assert int(config['vars']['REPLACEMENT_BASE_LEDGER_INDEX']) == current['ledgerIndex']
          assert config['vars']['REPLACEMENT_BASE_LEDGER_HASH'] == current['ledgerHash']

          checkpoint = {
              'epochId': current['epochId'],
              'snapshotId': current['snapshotId'],
              'ledgerIndex': current['ledgerIndex'],
              'ledgerHash': current['ledgerHash'],
              'historyMode': 'd1_fast_lane_windows_with_archived_branch',
              'historyArchiveLedgerIndex': history['endLedgerIndex'],
              'historyArchiveLedgerHash': history['endLedgerHash'],
              'historyPublicationSha256': history['publicationSha256'],
          }
          Path('production-deploy-checkpoint.json').write_text(json.dumps(checkpoint, indent=2) + '\n')
          PY

      - name: Build application
        run: pnpm build

      - name: Reassert pinned production config
        shell: bash
        run: |
          set -euo pipefail
          cp wrangler.production.jsonc wrangler.jsonc
          test "$(jq -r '.vars.APP_NETWORK' wrangler.jsonc)" = devnet
          test "$(jq -r '.vars.MAINNET_ENABLED' wrangler.jsonc)" = false
          test "$(jq -r '.triggers.crons[0]' wrangler.jsonc)" = '*/5 * * * *'

      - name: Apply P0 D1 migration
        id: migrations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p production-d1-migrations
          pnpm exec wrangler d1 migrations list xrpl-lending-monitor --remote \
            | tee production-d1-migrations/before.txt
          pnpm exec wrangler d1 migrations apply xrpl-lending-monitor --remote \
            | tee production-d1-migrations/apply.txt
          pnpm exec wrangler d1 migrations list xrpl-lending-monitor --remote \
            | tee production-d1-migrations/after.txt
          pnpm exec wrangler d1 execute xrpl-lending-monitor --remote --json \
            --command "SELECT name FROM sqlite_master WHERE type = 'table' AND name = 'fast_lane_history_windows'" \
            > production-d1-migrations/schema.json
          jq -e '[.[].results[]? | select(.name == "fast_lane_history_windows")] | length == 1' \
            production-d1-migrations/schema.json > /dev/null

      - name: Deploy P0 Worker
        id: deploy
        run: pnpm exec wrangler deploy

      - name: Verify deployed P0 runtime
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_EPOCH="$(jq -r '.epochId' production-deploy-checkpoint.json)"
          EXPECTED_SNAPSHOT="$(jq -r '.snapshotId' production-deploy-checkpoint.json)"
          EXPECTED_LEDGER="$(jq -r '.ledgerIndex' production-deploy-checkpoint.json)"
          EXPECTED_HASH="$(jq -r '.ledgerHash' production-deploy-checkpoint.json)"
          AUTH=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          verified=false

          for attempt in $(seq 1 60); do
            curl --fail-with-body --silent --show-error "${AUTH[@]}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-monitor/settings" \
              > deployed-worker-settings.json || true
            curl --fail-with-body --silent --show-error "${AUTH[@]}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-monitor/schedules" \
              > deployed-worker-schedules.json || true
            rebase_status="$(curl --silent --show-error --retry 1 \
              -o deployed-rebase-status.json -w '%{http_code}' \
              "${PRODUCTION_BASE}/api/status/replacement-base-rebase" || true)"

            if jq -e \
              --arg epoch "${EXPECTED_EPOCH}" \
              --arg snapshot "${EXPECTED_SNAPSHOT}" \
              --arg ledger "${EXPECTED_LEDGER}" \
              --arg hash "${EXPECTED_HASH}" '
                def binding($name):
                  [.result.bindings[] | select(.name == $name) | (.text // .value)] | first;
                binding("APP_NETWORK") == "devnet"
                and binding("MAINNET_ENABLED") == "false"
                and binding("REPLACEMENT_BASE_EPOCH_ID") == $epoch
                and binding("REPLACEMENT_BASE_SNAPSHOT_ID") == $snapshot
                and binding("REPLACEMENT_BASE_LEDGER_INDEX") == $ledger
                and binding("REPLACEMENT_BASE_LEDGER_HASH") == $hash
                and ([.result.bindings[] | select(.name == "REPLACEMENT_BASE_CUTOVER_TOKEN")] | length) == 0
              ' deployed-worker-settings.json > /dev/null 2>&1 \
              && jq -e '.result.schedules | length == 1 and .[0].cron == "*/5 * * * *"' \
                deployed-worker-schedules.json > /dev/null 2>&1 \
              && [ "${rebase_status}" = 200 ] \
              && jq -e --arg epoch "${EXPECTED_EPOCH}" --arg snapshot "${EXPECTED_SNAPSHOT}" --argjson ledger "${EXPECTED_LEDGER}" --arg hash "${EXPECTED_HASH}" '
                .status == "replayed"
                and .target.epochId == $epoch
                and .target.snapshotId == $snapshot
                and .target.ledgerIndex == $ledger
                and .target.ledgerHash == $hash
              ' deployed-rebase-status.json > /dev/null 2>&1; then
              verified=true
              break
            fi
            sleep 3
          done

          test "${verified}" = true
          jq -n \
            --slurpfile checkpoint production-deploy-checkpoint.json \
            --slurpfile rebase deployed-rebase-status.json \
            '{passed:true,checkpoint:$checkpoint[0],replacementBase:$rebase[0],schedule:"*/5 * * * *",mainnetEnabled:false}' \
            > production-deploy-verification.json

      - name: Report emergency deploy status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          FINAL_OUTCOME="${VERIFY_OUTCOME}"
          if [ -z "${FINAL_OUTCOME}" ] || [ "${FINAL_OUTCOME}" = skipped ]; then FINAL_OUTCOME="${DEPLOY_OUTCOME}"; fi
          if [ -z "${FINAL_OUTCOME}" ]; then FINAL_OUTCOME=failure; fi
          if [ -s production-deploy-checkpoint.json ]; then
            jq -n \
              --arg runId "$GITHUB_RUN_ID" \
              --arg runUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              --arg headSha "$GITHUB_SHA" \
              --arg outcome "$FINAL_OUTCOME" \
              --slurpfile checkpoint production-deploy-checkpoint.json \
              '{runId:$runId,runUrl:$runUrl,headSha:$headSha,outcome:$outcome,checkpoint:$checkpoint[0]}' \
              > deploy-status.json
          else
            jq -n \
              --arg runId "$GITHUB_RUN_ID" \
              --arg runUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              --arg headSha "$GITHUB_SHA" \
              --arg outcome "$FINAL_OUTCOME" \
              '{runId:$runId,runUrl:$runUrl,headSha:$headSha,outcome:$outcome,checkpoint:null}' \
              > deploy-status.json
          fi
          API_PATH="repos/${GITHUB_REPOSITORY}/contents/.github/production-deploy-status.json"
          CONTENT="$(base64 -w0 deploy-status.json)"
          for attempt in $(seq 1 10); do
            EXISTING_SHA="$(gh api "$API_PATH" --jq .sha 2>/dev/null || true)"
            if [ -n "$EXISTING_SHA" ] && gh api --method PUT "$API_PATH" \
              -f message="Update production deploy status" \
              -f content="$CONTENT" \
              -f sha="$EXISTING_SHA" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Upload emergency deploy verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-emergency-production-deploy-verification
          path: |
            production-deploy-checkpoint.json
            production-deploy-verification.json
            deployed-worker-settings.json
            deployed-worker-schedules.json
            deployed-rebase-status.json
            production-d1-migrations
          if-no-files-found: warn
          retention-days: 14
