name: Current fresh replacement cutover control

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: >-
    ${{
      github.event.issue.number == 995 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      (
        github.event.comment.body == '/current-fresh-cutover-prepare' ||
        startsWith(github.event.comment.body, '/current-fresh-cutover-authorize ')
      ) &&
      'current-fresh-cutover-production-write' ||
      format('current-fresh-cutover-noop-{0}', github.run_id)
    }}
  cancel-in-progress: false

env:
  QUALIFICATION_ISSUE: '995'
  SCRIPT_NAME: xrpl-lending-monitor
  QUEUE_ID: 2ae398f2edbf43749e45cd7ede77c6cd
  DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
  PRODUCTION_BASE: https://xrpl-lending-monitor.badjoke-lab.workers.dev
  RUNTIME_SOURCE_SHA: 07af3846ac056b892a23ef6146cc986bdf753dc1
  CUTOVER_DATA_BRANCH: current-state-fresh-replacement-cutover-data
  CUTOVER_DATA_COMMIT: 4fad78c2b8e5dc6e83363d9c8239bbfd6010e352
  CUTOVER_PAYLOAD_COMMIT: d9ba9fc769ab7ec8002d6ab56f54801f7967800b
  TARGET_EPOCH: devnet-3371675
  TARGET_SNAPSHOT: devnet-5101160-ea7a044b3eea
  TARGET_LEDGER: '5101160'
  TARGET_HASH: EA7A044B3EEA548AA9C12831104CA8AFEB6FE14C0FE96CA95E96E8C789234401
  TARGET_MANIFEST: 260aa84de5597200ab619d4112e60af7ae04c58ac0b17faa19799898d9b97a45
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  GH_TOKEN: ${{ github.token }}

jobs:
  prepare:
    if: >-
      github.event.issue.number == 995 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      github.event.comment.body == '/current-fresh-cutover-prepare'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable target and unchanged production source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$RUNTIME_SOURCE_SHA"
          git diff --quiet "$RUNTIME_SOURCE_SHA" HEAD -- src wrangler.jsonc package.json pnpm-lock.yaml
          test "$(jq -r '.triggers.crons | length' wrangler.jsonc)" -eq 0
          test "$(jq -r '.vars.APP_NETWORK' wrangler.jsonc)" = devnet
          test "$(jq -r '.vars.MAINNET_ENABLED' wrangler.jsonc)" = false
          test "$(jq -r '.vars.CURRENT_STATE_GITHUB_BRANCH' wrangler.jsonc)" = current-state-data
          test "$(jq -r '.vars.CURRENT_STATE_REPLACEMENT_SNAPSHOT_ID' wrangler.jsonc)" = devnet-4039102-4298500c53ba
          test "$(jq -r '.vars.REPLACEMENT_BASE_LEDGER_INDEX' wrangler.jsonc)" = 4039102
          head="$(gh api "repos/${GITHUB_REPOSITORY}/branches/${CUTOVER_DATA_BRANCH}" --jq '.commit.sha')"
          test "$head" = "$CUTOVER_DATA_COMMIT"
          gh api "repos/${GITHUB_REPOSITORY}/contents/channel.json?ref=${CUTOVER_DATA_BRANCH}" --jq '.content' | tr -d '\n' | base64 -d > /tmp/channel.json
          gh api "repos/${GITHUB_REPOSITORY}/contents/fresh-replacement-base-summary.json?ref=${CUTOVER_DATA_BRANCH}" --jq '.content' | tr -d '\n' | base64 -d > /tmp/base-summary.json
          gh api "repos/${GITHUB_REPOSITORY}/contents/read-model/manifest.json?ref=${CUTOVER_DATA_BRANCH}" --jq '.content' | tr -d '\n' | base64 -d > /tmp/read-model-manifest.json
          jq -e --arg payload "$CUTOVER_PAYLOAD_COMMIT" --arg snapshot "$TARGET_SNAPSHOT" --arg manifest "$TARGET_MANIFEST" '
            .active.dataCommitSha == $payload and .active.snapshotId == $snapshot and .active.manifestSha256 == $manifest and .active.manifestPath == "read-model/manifest.json"
          ' /tmp/channel.json >/dev/null
          jq -e --arg epoch "$TARGET_EPOCH" --arg snapshot "$TARGET_SNAPSHOT" --arg hash "$TARGET_HASH" --arg manifest "$TARGET_MANIFEST" --argjson ledger "$TARGET_LEDGER" '
            .epochId == $epoch and .snapshotId == $snapshot and .ledgerIndex == $ledger and .ledgerHash == $hash and .manifestSha256 == $manifest
          ' /tmp/base-summary.json >/dev/null
          jq -e --arg epoch "$TARGET_EPOCH" --arg snapshot "$TARGET_SNAPSHOT" --arg hash "$TARGET_HASH" --arg manifest "$TARGET_MANIFEST" --argjson ledger "$TARGET_LEDGER" '
            .complete == true and .epochId == $epoch and .snapshotId == $snapshot and .ledgerIndex == $ledger and .ledgerHash == $hash and .manifestSha256 == $manifest
          ' /tmp/read-model-manifest.json >/dev/null

      - name: Capture exact read-only production state
        id: state
        shell: bash
        run: |
          set -euo pipefail
          ROOT=current-fresh-cutover-prepare
          mkdir -p "$ROOT"
          set +e
          CURRENT_RESTART_PREFLIGHT_OUTPUT="$ROOT/preflight" python scripts/current-restart-preflight.py
          preflight_rc=$?
          set -e
          result="$ROOT/preflight/result.json"
          test -f "$result"
          test "$(jq -r '.productionMutation' "$result")" = false
          test "$preflight_rc" -eq 1
          jq -e '
            .failures == ["queueDeliveryPaused"]
            and .checks.devnetOnly == true
            and .checks.currentMaxLedgersBound == true
            and .checks.singleQueueBinding == true
            and .checks.schedulerStillDisabled == true
            and .checks.singleDeploymentVersion == true
            and .checks.baseBindingAligned == true
            and .checks.fastCursorAtOrAfterBase == true
            and .checks.noLiveUnstagedProcessingSlot == true
            and .checks.noStagedSuccessorSlot == true
            and .checks.noPendingQueueSlot == true
            and .checks.staleOverlayZero == true
            and .checks.foldableCompactZero == true
            and .checks.compactRowsDoNotExceedFastCursor == true
            and .checks.latestMetricCommittedAtCursor == true
            and .checks.replacementBaseReplaySafe == true
            and .state.queue.deliveryPaused == false
          ' "$result" >/dev/null
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          qbase="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues/${QUEUE_ID}"
          curl -fsS -H "$auth" "$qbase/metrics" | tee "$ROOT/queue-metrics.json" >/dev/null
          curl -fsS -X POST -H "$auth" -H 'Content-Type: application/json' "$qbase/messages/peek" -d '{"batch_size":2}' | tee "$ROOT/queue-peek.json" >/dev/null
          python scripts/current-fresh-cutover-queue-proof.py \
            --mode prepare \
            --preflight "$result" \
            --metrics "$ROOT/queue-metrics.json" \
            --peek "$ROOT/queue-peek.json" \
            --output "$ROOT/queue-proof.json"
          deployment="$(jq -r '.state.deployment.versions[0].version_id' "$result")"
          test -n "$deployment"
          jq -n -S \
            --arg sourceCommit "$(git rev-parse HEAD)" \
            --arg candidateCommit "$CUTOVER_DATA_COMMIT" \
            --arg deployment "$deployment" \
            --arg snapshot "$TARGET_SNAPSHOT" \
            --arg manifest "$TARGET_MANIFEST" \
            --arg fastHash "$(jq -r '.state.fastLane.last_processed_hash' "$result")" \
            --arg metricRunAt "$(jq -r '.state.latestMetric.run_at' "$result")" \
            --argjson target "$TARGET_LEDGER" \
            --argjson fastLedger "$(jq -r '.state.fastLane.last_processed_ledger' "$result")" \
            --argjson pending "$(jq -r '.state.queueSlotCounts.pending // 0' "$result")" \
            --argjson live "$(jq -r '.state.processingSlots.liveUnstaged' "$result")" \
            --argjson staged "$(jq -r '.state.processingSlots.stagedSuccessor' "$result")" \
            --argjson backlogBytes "$(jq -r '.backlogBytes' "$ROOT/queue-proof.json")" \
            --argjson successorScheduledTime "$(jq -r '.successorScheduledTime' "$ROOT/queue-proof.json")" \
            '{sourceCommit:$sourceCommit,candidateCommit:$candidateCommit,deployment:$deployment,target:$target,snapshot:$snapshot,manifest:$manifest,fastLedger:$fastLedger,fastHash:$fastHash,metricRunAt:$metricRunAt,pending:$pending,live:$live,staged:$staged,queuePaused:false,backlogCount:0,backlogBytes:$backlogBytes,messages:0,schedules:0,delayedSuccessorScheduledTime:$successorScheduledTime}' \
            > "$ROOT/stable-state.json"
          digest="$(sha256sum "$ROOT/stable-state.json" | awk '{print $1}')"
          manager="$(sha256sum .github/workflows/current-fresh-cutover-control.yml | awk '{print $1}')"
          printf 'source_commit=%s\ncandidate_commit=%s\ndeployment=%s\nstate=%s\nmanager=%s\nsuccessor_deadline_ms=%s\n' \
            "$(git rev-parse HEAD)" "$CUTOVER_DATA_COMMIT" "$deployment" "$digest" "$manager" \
            "$(jq -r '.successorScheduledTime' "$ROOT/queue-proof.json")" >> "$GITHUB_OUTPUT"

      - name: Publish exact fresh cutover authorization proposal
        env:
          SOURCE_COMMIT: ${{ steps.state.outputs.source_commit }}
          CANDIDATE_COMMIT: ${{ steps.state.outputs.candidate_commit }}
          DEPLOYMENT: ${{ steps.state.outputs.deployment }}
          STATE: ${{ steps.state.outputs.state }}
          MANAGER: ${{ steps.state.outputs.manager }}
          SUCCESSOR_DEADLINE_MS: ${{ steps.state.outputs.successor_deadline_ms }}
        shell: bash
        run: |
          set -euo pipefail
          now_epoch="$(date -u +%s)"
          expires_epoch=$((now_epoch + 2 * 60 * 60))
          if test "$SUCCESSOR_DEADLINE_MS" -gt 0; then
            successor_safe_epoch=$((SUCCESSOR_DEADLINE_MS / 1000 - 20 * 60))
            if test "$successor_safe_epoch" -lt "$expires_epoch"; then
              expires_epoch="$successor_safe_epoch"
            fi
          fi
          test "$expires_epoch" -gt "$now_epoch"
          expires="$(date -u -d "@${expires_epoch}" '+%Y-%m-%dT%H:%M:%SZ')"
          nonce="$(openssl rand -hex 8)"
          command="/current-fresh-cutover-authorize commit=${SOURCE_COMMIT} manager=${MANAGER} state=${STATE} candidate=${CANDIDATE_COMMIT} deployment=${DEPLOYMENT} target=${TARGET_LEDGER} snapshot=${TARGET_SNAPSHOT} manifest=${TARGET_MANIFEST} prepare_run=${GITHUB_RUN_ID} expires=${expires} nonce=${nonce}"
          cat > /tmp/fresh-cutover-proposal.md <<EOF
          ## Fresh Current replacement cutover authorization proposal

          Preparation run: \`${GITHUB_RUN_ID}\`
          Source main commit: \`${SOURCE_COMMIT}\`
          Immutable cutover data commit: \`${CANDIDATE_COMMIT}\`
          Current production Worker version: \`${DEPLOYMENT}\`
          Target: \`${TARGET_LEDGER} / ${TARGET_SNAPSHOT}\`
          Manifest SHA-256: \`${TARGET_MANIFEST}\`
          Read-only stable-state digest: \`${STATE}\`
          Manager SHA-256: \`${MANAGER}\`

          Merging this control does not change production runtime configuration. This authorization performs the production mutation: pause Queue delivery; create a temporary fresh-target Wrangler config only inside this Actions job; upload/deploy one Worker version with a one-run random cutover secret; prove the deployed target is exactly \`rebase / advance_to_target\`; apply the replacement-base cutover; and leave Queue delivery paused. It does not resume Queue delivery, enqueue a message, create a Cron, enable Mainnet, mutate Supabase History, or claim Current recovery.

          Exact authorization command:

          \`${command}\`
          EOF
          gh issue comment "$QUALIFICATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/fresh-cutover-proposal.md

      - name: Upload fresh cutover preparation evidence
        uses: actions/upload-artifact@v4
        with:
          name: current-fresh-cutover-prepare
          path: current-fresh-cutover-prepare
          if-no-files-found: error
          retention-days: 30

  execute:
    if: >-
      github.event.issue.number == 995 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      startsWith(github.event.comment.body, '/current-fresh-cutover-authorize ')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      AUTHORIZATION_BODY: ${{ github.event.comment.body }}
      AUTHORIZATION_CREATED_AT: ${{ github.event.comment.created_at }}
      AUTHORIZATION_COMMENT_ID: ${{ github.event.comment.id }}
    steps:
      - name: Check out exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Parse and bind exact fresh cutover authorization
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          regex='^/current-fresh-cutover-authorize commit=([a-f0-9]{40}) manager=([a-f0-9]{64}) state=([a-f0-9]{64}) candidate=([a-f0-9]{40}) deployment=([0-9a-f-]{36}) target=([0-9]+) snapshot=([A-Za-z0-9._-]+) manifest=([a-f0-9]{64}) prepare_run=([0-9]+) expires=([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z) nonce=([a-f0-9]{16})$'
          [[ "$AUTHORIZATION_BODY" =~ $regex ]] || { echo 'Fresh cutover authorization shape mismatch' >&2; exit 1; }
          names=(commit manager state candidate deployment target snapshot manifest prepare_run expires nonce)
          for index in "${!names[@]}"; do
            printf '%s=%s\n' "${names[$index]}" "${BASH_REMATCH[$((index + 1))]}" >> "$GITHUB_OUTPUT"
          done
          test "${BASH_REMATCH[1]}" = "$(git rev-parse HEAD)"
          test "${BASH_REMATCH[2]}" = "$(sha256sum .github/workflows/current-fresh-cutover-control.yml | awk '{print $1}')"
          test "${BASH_REMATCH[4]}" = "$CUTOVER_DATA_COMMIT"
          test "${BASH_REMATCH[6]}" = "$TARGET_LEDGER"
          test "${BASH_REMATCH[7]}" = "$TARGET_SNAPSHOT"
          test "${BASH_REMATCH[8]}" = "$TARGET_MANIFEST"
          expires_epoch="$(date -u -d "${BASH_REMATCH[10]}" +%s)"
          auth_epoch="$(date -u -d "$AUTHORIZATION_CREATED_AT" +%s)"
          now_epoch="$(date -u +%s)"
          test "$auth_epoch" -lt "$expires_epoch"
          test "$now_epoch" -le "$expires_epoch"
          test $((expires_epoch - auth_epoch)) -le 7200

      - name: Verify exact prior proposal and unique authorization
        env:
          PREPARE_RUN: ${{ steps.auth.outputs.prepare_run }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${QUALIFICATION_ISSUE}/comments?per_page=100" | jq -s 'add' > /tmp/fresh-cutover-comments.json
          EXPECTED="$AUTHORIZATION_BODY" PREPARE="$PREPARE_RUN" AUTH_ID="$AUTHORIZATION_COMMENT_ID" node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const comments = JSON.parse(readFileSync('/tmp/fresh-cutover-comments.json', 'utf8'))
          const proposals = comments.filter((comment) => comment?.user?.login === 'github-actions[bot]' && typeof comment?.body === 'string' && comment.body.includes(`Preparation run: \`${process.env.PREPARE}\``) && comment.body.includes(`\`${process.env.EXPECTED}\``))
          if (proposals.length !== 1) throw new Error(`expected one exact fresh-cutover proposal, found ${proposals.length}`)
          const authorizations = comments.filter((comment) => comment?.user?.login === 'badjoke-lab' && comment?.body === process.env.EXPECTED)
          if (authorizations.length !== 1 || Number(authorizations[0].id) !== Number(process.env.AUTH_ID)) throw new Error('fresh-cutover authorization is not unique')
          NODE

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies and build deploy assets
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm build:deploy-assets

      - name: Re-prove exact authorized pre-mutation state
        env:
          AUTHORIZED_STATE: ${{ steps.auth.outputs.state }}
          AUTHORIZED_DEPLOYMENT: ${{ steps.auth.outputs.deployment }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT=current-fresh-cutover-execute
          mkdir -p "$ROOT/preflight"
          git fetch --no-tags --depth=1 origin "$RUNTIME_SOURCE_SHA"
          git diff --quiet "$RUNTIME_SOURCE_SHA" HEAD -- src wrangler.jsonc package.json pnpm-lock.yaml
          head="$(gh api "repos/${GITHUB_REPOSITORY}/branches/${CUTOVER_DATA_BRANCH}" --jq '.commit.sha')"
          test "$head" = "$CUTOVER_DATA_COMMIT"
          set +e
          CURRENT_RESTART_PREFLIGHT_OUTPUT="$ROOT/preflight" python scripts/current-restart-preflight.py
          preflight_rc=$?
          set -e
          result="$ROOT/preflight/result.json"
          test "$preflight_rc" -eq 1
          jq -e '.failures == ["queueDeliveryPaused"] and .state.queue.deliveryPaused == false and .checks.replacementBaseReplaySafe == true and .checks.noPendingQueueSlot == true and .checks.noLiveUnstagedProcessingSlot == true and .checks.noStagedSuccessorSlot == true and .checks.schedulerStillDisabled == true' "$result" >/dev/null
          deployment="$(jq -r '.state.deployment.versions[0].version_id' "$result")"
          test "$deployment" = "$AUTHORIZED_DEPLOYMENT"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          qbase="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues/${QUEUE_ID}"
          curl -fsS -H "$auth" "$qbase/metrics" > "$ROOT/queue-metrics-before.json"
          curl -fsS -X POST -H "$auth" -H 'Content-Type: application/json' "$qbase/messages/peek" -d '{"batch_size":2}' > "$ROOT/queue-peek-before.json"
          python scripts/current-fresh-cutover-queue-proof.py \
            --mode execute \
            --preflight "$result" \
            --metrics "$ROOT/queue-metrics-before.json" \
            --peek "$ROOT/queue-peek-before.json" \
            --output "$ROOT/queue-proof-before.json"
          jq -n -S \
            --arg sourceCommit "$(git rev-parse HEAD)" \
            --arg candidateCommit "$CUTOVER_DATA_COMMIT" \
            --arg deployment "$deployment" \
            --arg snapshot "$TARGET_SNAPSHOT" \
            --arg manifest "$TARGET_MANIFEST" \
            --arg fastHash "$(jq -r '.state.fastLane.last_processed_hash' "$result")" \
            --arg metricRunAt "$(jq -r '.state.latestMetric.run_at' "$result")" \
            --argjson target "$TARGET_LEDGER" \
            --argjson fastLedger "$(jq -r '.state.fastLane.last_processed_ledger' "$result")" \
            --argjson pending "$(jq -r '.state.queueSlotCounts.pending // 0' "$result")" \
            --argjson live "$(jq -r '.state.processingSlots.liveUnstaged' "$result")" \
            --argjson staged "$(jq -r '.state.processingSlots.stagedSuccessor' "$result")" \
            --argjson backlogBytes "$(jq -r '.backlogBytes' "$ROOT/queue-proof-before.json")" \
            --argjson successorScheduledTime "$(jq -r '.successorScheduledTime' "$ROOT/queue-proof-before.json")" \
            '{sourceCommit:$sourceCommit,candidateCommit:$candidateCommit,deployment:$deployment,target:$target,snapshot:$snapshot,manifest:$manifest,fastLedger:$fastLedger,fastHash:$fastHash,metricRunAt:$metricRunAt,pending:$pending,live:$live,staged:$staged,queuePaused:false,backlogCount:0,backlogBytes:$backlogBytes,messages:0,schedules:0,delayedSuccessorScheduledTime:$successorScheduledTime}' \
            > "$ROOT/stable-state-before.json"
          test "$(sha256sum "$ROOT/stable-state-before.json" | awk '{print $1}')" = "$AUTHORIZED_STATE"

      - name: Build ephemeral fresh-target runtime config
        shell: bash
        run: |
          set -euo pipefail
          jq \
            --arg branch "$CUTOVER_DATA_BRANCH" \
            --arg epoch "$TARGET_EPOCH" \
            --arg snapshot "$TARGET_SNAPSHOT" \
            --arg ledger "$TARGET_LEDGER" \
            --arg hash "$TARGET_HASH" '
              .vars.CURRENT_STATE_GITHUB_BRANCH = $branch
              | .vars.CURRENT_STATE_REPLACEMENT_SNAPSHOT_ID = $snapshot
              | .vars.CURRENT_STATE_REPLACEMENT_GITHUB_BRANCH = $branch
              | .vars.REPLACEMENT_BASE_REBASE_ENABLED = "true"
              | .vars.REPLACEMENT_BASE_EPOCH_ID = $epoch
              | .vars.REPLACEMENT_BASE_SNAPSHOT_ID = $snapshot
              | .vars.REPLACEMENT_BASE_LEDGER_INDEX = $ledger
              | .vars.REPLACEMENT_BASE_LEDGER_HASH = $hash
            ' wrangler.jsonc > .wrangler-fresh-cutover.json
          test "$(jq -r '.triggers.crons | length' .wrangler-fresh-cutover.json)" -eq 0
          test "$(jq -r '.vars.APP_NETWORK' .wrangler-fresh-cutover.json)" = devnet
          test "$(jq -r '.vars.MAINNET_ENABLED' .wrangler-fresh-cutover.json)" = false
          test "$(jq -r '.vars.CURRENT_STATE_GITHUB_BRANCH' .wrangler-fresh-cutover.json)" = "$CUTOVER_DATA_BRANCH"
          test "$(jq -r '.vars.CURRENT_STATE_REPLACEMENT_SNAPSHOT_ID' .wrangler-fresh-cutover.json)" = "$TARGET_SNAPSHOT"
          test "$(jq -r '.vars.REPLACEMENT_BASE_EPOCH_ID' .wrangler-fresh-cutover.json)" = "$TARGET_EPOCH"
          test "$(jq -r '.vars.REPLACEMENT_BASE_SNAPSHOT_ID' .wrangler-fresh-cutover.json)" = "$TARGET_SNAPSHOT"
          test "$(jq -r '.vars.REPLACEMENT_BASE_LEDGER_INDEX' .wrangler-fresh-cutover.json)" = "$TARGET_LEDGER"
          test "$(jq -r '.vars.REPLACEMENT_BASE_LEDGER_HASH' .wrangler-fresh-cutover.json)" = "$TARGET_HASH"

      - name: Pause Queue, deploy fresh runtime, and apply cutover
        id: mutate
        env:
          OLD_VERSION: ${{ steps.auth.outputs.deployment }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT=current-fresh-cutover-execute
          mkdir -p "$ROOT"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          qbase="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues/${QUEUE_ID}"
          deployment_attempted=false
          cutover_applied=false
          rollback() {
            rc=$?
            if test "$deployment_attempted" = true && test "$cutover_applied" = false; then
              pnpm exec wrangler versions deploy "${OLD_VERSION}@100%" --yes || true
            fi
            curl -fsS -X PATCH -H "$auth" -H 'Content-Type: application/json' "$qbase" -d '{"settings":{"delivery_paused":true}}' >/dev/null || true
            rm -f .wrangler-fresh-cutover.json
            exit "$rc"
          }
          trap rollback ERR

          curl -fsS -X PATCH -H "$auth" -H 'Content-Type: application/json' "$qbase" -d '{"settings":{"delivery_paused":true}}' | tee "$ROOT/queue-pause.json" >/dev/null
          curl -fsS -H "$auth" "$qbase" | tee "$ROOT/queue-paused-confirm.json" | jq -e '.success == true and .result.settings.delivery_paused == true' >/dev/null

          umask 077
          cutover_token="$(openssl rand -hex 32)"
          secret_file="$(mktemp)"
          jq -n --arg token "$cutover_token" '{REPLACEMENT_BASE_CUTOVER_TOKEN:$token}' > "$secret_file"
          pnpm exec wrangler versions upload --config .wrangler-fresh-cutover.json --secrets-file "$secret_file" --message "Fresh Current replacement cutover ${TARGET_LEDGER}" | tee "$ROOT/version-upload.txt"
          rm -f "$secret_file"
          new_version="$(grep -Eio '[0-9a-f]{8}-[0-9a-f-]{27,}' "$ROOT/version-upload.txt" | tail -1)"
          test -n "$new_version"
          deployment_attempted=true
          pnpm exec wrangler versions deploy "${new_version}@100%" --yes | tee "$ROOT/version-deploy.txt"

          curl -fsS "$PRODUCTION_BASE/api/status/replacement-base-rebase" | tee "$ROOT/deployed-dry-run.json" >/dev/null
          jq -e --arg epoch "$TARGET_EPOCH" --arg snapshot "$TARGET_SNAPSHOT" --arg hash "$TARGET_HASH" --argjson ledger "$TARGET_LEDGER" '
            .status == "ready"
            and .plan.action == "rebase"
            and .plan.cursorMode == "advance_to_target"
            and .target.epochId == $epoch
            and .target.snapshotId == $snapshot
            and .target.ledgerIndex == $ledger
            and .target.ledgerHash == $hash
          ' "$ROOT/deployed-dry-run.json" >/dev/null

          curl -fsS -X POST -H "x-replacement-base-cutover-token: ${cutover_token}" "$PRODUCTION_BASE/api/operator/replacement-base-cutover" | tee "$ROOT/cutover-response.json" >/dev/null
          jq -e --arg epoch "$TARGET_EPOCH" --arg snapshot "$TARGET_SNAPSHOT" --arg hash "$TARGET_HASH" --argjson ledger "$TARGET_LEDGER" '
            .status == "cutover_applied"
            and .network == "devnet"
            and .rebase.status == "rebased"
            and .rebase.plan.action == "rebase"
            and .rebase.plan.cursorMode == "advance_to_target"
            and .target.epochId == $epoch
            and .target.snapshotId == $snapshot
            and .target.ledgerIndex == $ledger
            and .target.ledgerHash == $hash
          ' "$ROOT/cutover-response.json" >/dev/null
          cutover_applied=true
          rm -f .wrangler-fresh-cutover.json
          trap - ERR
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"

      - name: Verify cutover with Queue still paused
        env:
          NEW_VERSION: ${{ steps.mutate.outputs.new_version }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT=current-fresh-cutover-execute
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          qbase="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues/${QUEUE_ID}"
          curl -fsS -H "$auth" "$qbase" | tee "$ROOT/queue-after.json" | jq -e '.success == true and .result.settings.delivery_paused == true' >/dev/null
          curl -fsS -X POST -H "$auth" -H 'Content-Type: application/json' "$qbase/messages/peek" -d '{"batch_size":2}' | tee "$ROOT/queue-peek-after.json" >/dev/null
          jq -e '.success == true and ((.result.messages // .result // []) | length) == 0' "$ROOT/queue-peek-after.json" >/dev/null
          curl -fsS "$PRODUCTION_BASE/api/status/replacement-base-rebase" | tee "$ROOT/replay-proof.json" >/dev/null
          jq -e --arg snapshot "$TARGET_SNAPSHOT" --arg hash "$TARGET_HASH" --argjson ledger "$TARGET_LEDGER" '
            .status == "replayed" and .plan.action == "replay" and .target.snapshotId == $snapshot and .target.ledgerIndex == $ledger and .target.ledgerHash == $hash
          ' "$ROOT/replay-proof.json" >/dev/null

          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query"
          query() { curl -fsS -H "$auth" -H 'Content-Type: application/json' "$api" -d "$(jq -n --arg sql "$1" '{sql:$sql}')"; }
          query "SELECT epoch_id,last_processed_ledger,last_processed_hash FROM sync_state WHERE network='devnet'" > "$ROOT/sync-after.json"
          query "SELECT epoch_id,base_snapshot_id,base_ledger_index,base_ledger_hash,overlay_ledger_index,overlay_ledger_hash FROM current_state_overlay_state WHERE network='devnet' AND base_snapshot_id='${TARGET_SNAPSHOT}' ORDER BY updated_at DESC LIMIT 1" > "$ROOT/overlay-after.json"
          query "SELECT shadow_epoch_id,base_epoch_id,base_snapshot_id,base_ledger_index,base_ledger_hash FROM fast_lane_shadow_base_binding WHERE network='devnet'" > "$ROOT/base-binding-after.json"
          query "SELECT COUNT(*) AS row_count FROM fast_lane_shadow_state" > "$ROOT/fast-state-count-after.json"
          query "SELECT COUNT(*) AS row_count FROM fast_lane_shadow_objects_compact" > "$ROOT/compact-count-after.json"
          jq -e --arg epoch "$TARGET_EPOCH" --arg hash "$TARGET_HASH" --argjson ledger "$TARGET_LEDGER" '.success == true and .result[0].results[0].epoch_id == $epoch and .result[0].results[0].last_processed_ledger == $ledger and .result[0].results[0].last_processed_hash == $hash' "$ROOT/sync-after.json" >/dev/null
          jq -e --arg epoch "$TARGET_EPOCH" --arg snapshot "$TARGET_SNAPSHOT" --arg hash "$TARGET_HASH" --argjson ledger "$TARGET_LEDGER" '.success == true and .result[0].results[0].epoch_id == $epoch and .result[0].results[0].base_snapshot_id == $snapshot and .result[0].results[0].base_ledger_index == $ledger and .result[0].results[0].base_ledger_hash == $hash and .result[0].results[0].overlay_ledger_index == $ledger and .result[0].results[0].overlay_ledger_hash == $hash' "$ROOT/overlay-after.json" >/dev/null
          jq -e --arg epoch "$TARGET_EPOCH" --arg snapshot "$TARGET_SNAPSHOT" --arg hash "$TARGET_HASH" --argjson ledger "$TARGET_LEDGER" '.success == true and .result[0].results[0].base_epoch_id == $epoch and .result[0].results[0].base_snapshot_id == $snapshot and .result[0].results[0].base_ledger_index == $ledger and .result[0].results[0].base_ledger_hash == $hash' "$ROOT/base-binding-after.json" >/dev/null
          jq -e '.success == true and .result[0].results[0].row_count == 0' "$ROOT/fast-state-count-after.json" >/dev/null
          jq -e '.success == true and .result[0].results[0].row_count == 0' "$ROOT/compact-count-after.json" >/dev/null
          curl -fsS "$PRODUCTION_BASE/api/overview" > "$ROOT/overview-after.json"
          jq -n \
            --arg newVersion "$NEW_VERSION" \
            --arg snapshot "$TARGET_SNAPSHOT" \
            --arg manifest "$TARGET_MANIFEST" \
            --argjson ledger "$TARGET_LEDGER" \
            '{passed:true,productionMutation:true,newVersion:$newVersion,targetLedger:$ledger,targetSnapshot:$snapshot,manifestSha256:$manifest,queuePaused:true,queueResumed:false,queuePurged:false,cronChanged:false,mainnetEnabled:false,historyMutation:false,currentRecovered:false,recoveryRequiresFreshDeliveryProof:true}' \
            | tee "$ROOT/result.json"

      - name: Publish fresh cutover result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result=current-fresh-cutover-execute/result.json
          if test -f "$result"; then
            passed="$(jq -r '.passed' "$result")"
            version="$(jq -r '.newVersion' "$result")"
          else
            passed=false
            version=unavailable
          fi
          cat > /tmp/fresh-cutover-result.md <<EOF
          ## Fresh Current replacement cutover result

          Run: \`${GITHUB_RUN_ID}\`
          Passed: \`${passed}\`
          Deployed version: \`${version}\`
          Target: \`${TARGET_LEDGER} / ${TARGET_SNAPSHOT}\`
          Current recovered: \`false\`

          The execute path is designed to leave Queue delivery paused on both success and failure. A separate read-only Queue proof and separate fresh-delivery authorization are required before Current can be called recovered.
          EOF
          gh issue comment "$QUALIFICATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/fresh-cutover-result.md

      - name: Upload fresh cutover evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-fresh-cutover-execute
          path: current-fresh-cutover-execute
          if-no-files-found: warn
          retention-days: 30
