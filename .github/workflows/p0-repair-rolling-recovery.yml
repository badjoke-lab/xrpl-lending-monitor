name: P0 repair rolling recovery orchestration

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  repair:
    if: startsWith(github.event.issue.title, 'P0 repair rolling recovery orchestration')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      REPAIR_BRANCH: fix/rolling-recovery-serialization-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cancel duplicate recovery orchestrators and children
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/cancelled.txt

          cancel_run() {
            local run_id="$1"
            local status
            status="$(gh api "repos/${REPOSITORY}/actions/runs/${run_id}" --jq '.status' 2>/dev/null || true)"
            if [ "${status}" = "queued" ] || [ "${status}" = "in_progress" ] || [ "${status}" = "waiting" ] || [ "${status}" = "requested" ]; then
              gh api --method POST "repos/${REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null || true
              printf '%s\n' "${run_id}" >> /tmp/cancelled.txt
            fi
          }

          cancel_run 29678012062

          for workflow in p0-recover-rolling-backlog.yml rolling-checkpoint-candidate.yml rolling-checkpoint-live-cutover.yml; do
            gh api "repos/${REPOSITORY}/actions/workflows/${workflow}/runs?per_page=100" > "/tmp/${workflow}.json"
            jq -r '.workflow_runs[]
              | select(.created_at >= "2026-07-19T07:00:00Z")
              | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested")
              | .id' "/tmp/${workflow}.json" |
            while IFS= read -r run_id; do
              test -n "${run_id}" && cancel_run "${run_id}"
            done
          done

      - name: Patch serialization and retained evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          candidate_path = Path('.github/workflows/rolling-checkpoint-candidate.yml')
          candidate = candidate_path.read_text()

          old_concurrency = '''concurrency:
            group: rolling-checkpoint-candidate-${{ inputs.history_candidate_branch }}-${{ inputs.current_state_candidate_branch }}
            cancel-in-progress: false
          '''
          new_concurrency = '''concurrency:
            group: rolling-checkpoint-candidate
            cancel-in-progress: false
          '''
          if candidate.count(old_concurrency) != 1:
              raise SystemExit('candidate concurrency block mismatch')
          candidate = candidate.replace(old_concurrency, new_concurrency)

          stage_anchor = '''          cp .local/next-current-state/rolling-read-model-summary.json /tmp/rolling-current-candidate/rolling-read-model-summary.json
          '''
          preserved = '''          cp .local/next-current-state/rolling-read-model-summary.json /tmp/rolling-current-candidate/rolling-read-model-summary.json
                    cp rolling-checkpoint-candidate/plan.json /tmp/rolling-candidate-evidence/plan.json
                    cp .local/history-root/history/publication.json /tmp/rolling-candidate-evidence/publication.json
                    cp .local/history-root/history/index/exact/manifest.json /tmp/rolling-candidate-evidence/exact-manifest.json
                    cp .local/next-current-state/rolling-read-model-summary.json /tmp/rolling-candidate-evidence/current-summary.json
                    cp rolling-checkpoint-candidate/base-mode.txt /tmp/rolling-candidate-evidence/base-mode.txt
                    cp rolling-checkpoint-candidate/delta-elapsed-seconds.txt /tmp/rolling-candidate-evidence/delta-elapsed-seconds.txt
                    cp rolling-checkpoint-candidate/exact-index-elapsed-seconds.txt /tmp/rolling-candidate-evidence/exact-index-elapsed-seconds.txt
                    cp rolling-checkpoint-candidate/current-state-elapsed-seconds.txt /tmp/rolling-candidate-evidence/current-state-elapsed-seconds.txt
          '''
          if candidate.count(stage_anchor) != 1:
              raise SystemExit('candidate stage anchor mismatch')
          candidate = candidate.replace(stage_anchor, preserved)

          evidence_old = '''          ROOT=rolling-checkpoint-candidate
                    PUBLICATION=.local/history-root/history/publication.json
                    EXACT=.local/history-root/history/index/exact/manifest.json
                    CURRENT=.local/next-current-state/rolling-read-model-summary.json
                    cp /tmp/rolling-candidate-evidence/* "${ROOT}/"
          '''
          evidence_new = '''          ROOT=rolling-checkpoint-candidate
                    mkdir -p "${ROOT}"
                    cp /tmp/rolling-candidate-evidence/* "${ROOT}/"
                    PUBLICATION="${ROOT}/publication.json"
                    EXACT="${ROOT}/exact-manifest.json"
                    CURRENT="${ROOT}/current-summary.json"
          '''
          if candidate.count(evidence_old) != 1:
              raise SystemExit('candidate evidence block mismatch')
          candidate = candidate.replace(evidence_old, evidence_new)
          candidate_path.write_text(candidate)

          parent_path = Path('.github/workflows/p0-recover-rolling-backlog.yml')
          parent = parent_path.read_text()
          if parent.count('  group: p0-recover-rolling-checkpoint-backlog') != 1:
              raise SystemExit('parent concurrency group mismatch')
          parent = parent.replace('  group: p0-recover-rolling-checkpoint-backlog', '  group: p0-rolling-overlay-recovery')

          status_anchor = '''            test "$(jq -r '.status' "${CYCLE_ROOT}/run.json")" = completed
          '''
          status_new = '''            test "$(jq -r '.status' "${CYCLE_ROOT}/run.json")" = completed
                      test "$(jq -r '.conclusion' "${CYCLE_ROOT}/run.json")" = success
          '''
          if parent.count(status_anchor) != 1:
              raise SystemExit('parent child status anchor mismatch')
          parent = parent.replace(status_anchor, status_new)

          steps_anchor = '''              'Publish current-state candidate branch' \\
                        'Rehearse remote candidate pair'; do
          '''
          steps_new = '''              'Publish current-state candidate branch' \\
                        'Rehearse remote candidate pair' \\
                        'Build retained candidate evidence'; do
          '''
          if parent.count(steps_anchor) != 1:
              raise SystemExit('parent required steps anchor mismatch')
          parent = parent.replace(steps_anchor, steps_new)
          parent_path.write_text(parent)
          PY

          git diff --check
          git diff -- .github/workflows/rolling-checkpoint-candidate.yml .github/workflows/p0-recover-rolling-backlog.yml

      - name: Publish focused repair PR
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -b "${REPAIR_BRANCH}"
          git add .github/workflows/rolling-checkpoint-candidate.yml .github/workflows/p0-recover-rolling-backlog.yml
          git commit -m "Fix rolling recovery serialization and evidence retention"
          git push --force origin "HEAD:refs/heads/${REPAIR_BRANCH}"

          PR_URL="$(gh pr list --repo "${REPOSITORY}" --head "${REPAIR_BRANCH}" --state open --json url --jq '.[0].url // empty')"
          if [ -z "${PR_URL}" ]; then
            PR_URL="$(gh pr create --repo "${REPOSITORY}" --base main --head "${REPAIR_BRANCH}" \
              --title 'Fix rolling recovery serialization and evidence retention' \
              --body 'Serializes all rolling checkpoint candidate writes, preserves evidence inputs before orphan publication checkouts, makes the issue-triggered recovery require a successful child conclusion and retained evidence, and shares a single overlay-recovery concurrency group. No capacity guard or Mainnet setting is weakened.')"
          fi

          {
            echo 'Duplicate recovery runs cancelled:'
            echo
            echo '```text'
            cat /tmp/cancelled.txt
            echo '```'
            echo
            echo "Repair PR: ${PR_URL}"
          } > /tmp/comment.md
          gh issue comment "${ISSUE_NUMBER}" --repo "${REPOSITORY}" --body-file /tmp/comment.md
