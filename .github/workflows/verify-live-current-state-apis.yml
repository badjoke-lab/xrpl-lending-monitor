name: Verify live current-state APIs

on:
  push:
    branches: [main]
    paths: [.github/live-api-verify-trigger]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Query live APIs
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGIN: https://xrpl-lending-monitor.badjoke-lab.workers.dev
        run: |
          mkdir -p responses
          jq -n '{}' > live-api-results.json
          for SPEC in \
            'vaults:/api/vaults?limit=1' \
            'loanBrokers:/api/loan-brokers?limit=1' \
            'loans:/api/loans?limit=1'; do
            KEY=${SPEC%%:*}
            PATH_PART=${SPEC#*:}
            CODE=$(curl -L -sS -o "responses/${KEY}.json" -w '%{http_code}' --connect-timeout 10 --max-time 180 "${ORIGIN}${PATH_PART}" || true)
            BYTES=$(wc -c < "responses/${KEY}.json" 2>/dev/null || echo 0)
            VALID=false
            ITEM_COUNT=0
            ERROR_CODE=""
            SNAPSHOT_ID=""
            LEDGER_INDEX=0
            if jq -e . "responses/${KEY}.json" >/dev/null 2>&1; then
              VALID=true
              ITEM_COUNT=$(jq '[.items[]?] | length' "responses/${KEY}.json" 2>/dev/null || echo 0)
              ERROR_CODE=$(jq -r '.error.code // ""' "responses/${KEY}.json" 2>/dev/null || true)
              SNAPSHOT_ID=$(jq -r '.meta.snapshotId // .snapshot.id // ""' "responses/${KEY}.json" 2>/dev/null || true)
              LEDGER_INDEX=$(jq -r '.meta.ledgerIndex // .snapshot.ledgerIndex // 0' "responses/${KEY}.json" 2>/dev/null || echo 0)
            fi
            jq \
              --arg key "$KEY" \
              --arg code "$CODE" \
              --argjson bytes "$BYTES" \
              --argjson valid "$VALID" \
              --argjson itemCount "$ITEM_COUNT" \
              --arg errorCode "$ERROR_CODE" \
              --arg snapshotId "$SNAPSHOT_ID" \
              --argjson ledgerIndex "$LEDGER_INDEX" \
              '.[$key]={httpCode:$code,responseBytes:$bytes,validJson:$valid,itemCount:$itemCount,errorCode:$errorCode,snapshotId:$snapshotId,ledgerIndex:$ledgerIndex}' \
              live-api-results.json > next.json
            mv next.json live-api-results.json
          done
          API="repos/${GITHUB_REPOSITORY}/contents/.github/live-api-results.json"
          CONTENT=$(base64 -w0 live-api-results.json)
          SHA=$(gh api "$API" --jq .sha 2>/dev/null || true)
          if [ -n "$SHA" ]; then
            gh api --method PUT "$API" -f message="Update live API verification" -f content="$CONTENT" -f sha="$SHA" >/dev/null
          else
            gh api --method PUT "$API" -f message="Create live API verification" -f content="$CONTENT" >/dev/null
          fi
