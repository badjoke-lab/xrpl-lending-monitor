name: M5-5 browser regression PR probe

on:
  pull_request:
    paths:
      - scripts/run-m5-5-browser-regression.mjs
      - .github/workflows/m5-5-browser-regression.yml
      - .github/workflows/m5-5-browser-regression-pr-probe.yml

permissions:
  contents: read

concurrency:
  group: m5-5-browser-regression-pr-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Verify collector preflight
        shell: bash
        env:
          BASE_URL: https://xrpl-lending-monitor.badjoke-lab.workers.dev
        run: |
          set -euo pipefail
          mkdir -p m5-5-browser-regression
          curl --max-time 60 --fail-with-body --silent --show-error --retry 3 \
            "${BASE_URL%/}/api/status/collector" \
            > m5-5-browser-regression/collector-preflight.json
          jq -e '.status == "healthy" and .cursor.lag_ledgers == 0 and .consecutive_failures == 0 and .error == null' \
            m5-5-browser-regression/collector-preflight.json > /dev/null

      - name: Measure and enforce actual D1 headroom
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_HEADROOM_OUTPUT_DIR: m5-5-browser-regression
        run: bash scripts/check-d1-headroom.sh

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run real-data browser regression and behavior smoke
        shell: bash
        env:
          BASE_URL: https://xrpl-lending-monitor.badjoke-lab.workers.dev
          M5_BROWSER_OUTPUT_DIR: m5-5-browser-regression
          M5_BROWSER_REQUEST_TIMEOUT_MS: 120000
        run: |
          set -o pipefail
          node scripts/run-m5-5-browser-regression.mjs 2>&1 | tee m5-5-browser-regression/runner.log

      - name: Upload temporary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-5-browser-regression-pr-probe
          path: m5-5-browser-regression
          if-no-files-found: error
          retention-days: 3
