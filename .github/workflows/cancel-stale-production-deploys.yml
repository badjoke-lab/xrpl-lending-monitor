name: Cancel stale production deploys
# Final quiescence cleanup for every workflow that can write the production Worker.

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cancel-stale-production-deploys.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel every active production writer except this cleanup run
        shell: bash
        run: |
          set -euo pipefail
          ROOT=cancel-stale-production-deploys
          mkdir -p "$ROOT"
          : > "$ROOT/cancelled.ndjson"
          WRITERS=(
            deploy-production-worker.yml
            rolling-checkpoint-live-cutover.yml
            rolling-checkpoint-maintenance.yml
            resume-history-recovery-after-fixed-index.yml
            stabilize-production-runtime.yml
            quiesce-and-restore-production.yml
            rolling-checkpoint-promotion.yml
          )

          for workflow in "${WRITERS[@]}"; do
            if ! gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?per_page=100" > "$ROOT/runs-$workflow.json" 2> "$ROOT/runs-$workflow.stderr"; then
              printf '{"workflow_runs":[]}\n' > "$ROOT/runs-$workflow.json"
            fi
            while IFS= read -r run; do
              id="$(jq -r '.id' <<<"$run")"
              [ "$id" = "$GITHUB_RUN_ID" ] && continue
              gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/cancel" > "$ROOT/cancel-$id.json" 2> "$ROOT/cancel-$id.stderr" || true
              jq -n \
                --arg workflow "$workflow" \
                --argjson id "$id" \
                --arg status "$(jq -r '.status' <<<"$run")" \
                --arg createdAt "$(jq -r '.created_at' <<<"$run")" \
                --arg headSha "$(jq -r '.head_sha // ""' <<<"$run")" \
                '{workflow:$workflow,runId:$id,statusBeforeCancel:$status,createdAt:$createdAt,headSha:$headSha}' \
                >> "$ROOT/cancelled.ndjson"
            done < <(jq -c '.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending" or .status == "requested")' "$ROOT/runs-$workflow.json")
          done

          for workflow in stabilize-production-runtime.yml quiesce-and-restore-production.yml; do
            gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/disable" > "$ROOT/disable-$workflow.json" 2> "$ROOT/disable-$workflow.stderr" || true
          done

      - name: Require all production writers to become quiescent
        shell: bash
        run: |
          set -euo pipefail
          ROOT=cancel-stale-production-deploys
          WRITERS=(
            deploy-production-worker.yml
            rolling-checkpoint-live-cutover.yml
            rolling-checkpoint-maintenance.yml
            resume-history-recovery-after-fixed-index.yml
            stabilize-production-runtime.yml
            quiesce-and-restore-production.yml
            rolling-checkpoint-promotion.yml
          )
          : > "$ROOT/quiescence.ndjson"
          QUIESCENT=false
          for attempt in $(seq 1 120); do
            active=0
            for workflow in "${WRITERS[@]}"; do
              if ! gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?per_page=100" > "$ROOT/wait-$workflow.json" 2>/dev/null; then
                printf '{"workflow_runs":[]}\n' > "$ROOT/wait-$workflow.json"
              fi
              count="$(jq --argjson current "$GITHUB_RUN_ID" '[.workflow_runs[] | select(.id != $current) | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending" or .status == "requested")] | length' "$ROOT/wait-$workflow.json")"
              active="$((active + count))"
            done
            jq -n --argjson attempt "$attempt" --argjson active "$active" '{attempt:$attempt,activeProductionWriters:$active,observedAt:(now|todateiso8601)}' >> "$ROOT/quiescence.ndjson"
            if [ "$active" -eq 0 ]; then QUIESCENT=true; break; fi
            sleep 5
          done
          test "$QUIESCENT" = true
          cancelled="$(wc -l < "$ROOT/cancelled.ndjson")"
          jq -n --argjson cancelled "$cancelled" '{passed:true,cancelledRuns:$cancelled,activeProductionWriters:0,disabledOneTimeWorkflows:["stabilize-production-runtime.yml","quiesce-and-restore-production.yml"]}' > "$ROOT/summary.json"
          cat "$ROOT/summary.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cancel-stale-production-deploys
          path: cancel-stale-production-deploys
          if-no-files-found: error
          retention-days: 14
