name: P0 final fast recovery

on:
  push:
    branches: [main]
    paths:
      - .github/p0-final-fast-recovery-trigger

permissions:
  actions: write
  contents: write

concurrency:
  group: p0-final-fast-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_HISTORY_BRANCH: history-p0-recovery-b-data
      SOURCE_CURRENT_BRANCH: current-state-p0-recovery-b-data
      OUTPUT_HISTORY_BRANCH: history-p0-recovery-a-data
      OUTPUT_CURRENT_BRANCH: current-state-p0-recovery-a-data
      OLD_PARENT_RUN_ID: '29249584609'
      MAX_DELTA_LEDGERS: '30000'
      SEGMENT_LEDGERS: '500'
      READ_WINDOW_SIZE: '4'
      PRODUCTION_BASE: https://xrpl-lending-monitor.badjoke-lab.workers.dev
    steps:
      - name: Check out implementation
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Wait for verified second-cycle candidate B
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p p0-final-fast-recovery
          fetch_json() {
            local branch="$1" path="$2" out="$3"
            gh api --method GET "repos/${GITHUB_REPOSITORY}/contents/${path}" -f ref="$branch" --jq .content \
              | tr -d '\n' | base64 --decode > "$out"
          }
          ready=false
          for attempt in $(seq 1 240); do
            if fetch_json "$SOURCE_HISTORY_BRANCH" history/publication.json p0-final-fast-recovery/source-publication.json 2>/dev/null \
              && fetch_json "$SOURCE_CURRENT_BRANCH" read-model/manifest.json p0-final-fast-recovery/source-current.json 2>/dev/null; then
              H_LEDGER="$(jq -r .endLedgerIndex p0-final-fast-recovery/source-publication.json)"
              H_HASH="$(jq -r .endLedgerHash p0-final-fast-recovery/source-publication.json)"
              C_LEDGER="$(jq -r .ledgerIndex p0-final-fast-recovery/source-current.json)"
              C_HASH="$(jq -r .ledgerHash p0-final-fast-recovery/source-current.json)"
              if [ "$H_LEDGER" -ge 3612674 ] && [ "$H_LEDGER" = "$C_LEDGER" ] && [ "$H_HASH" = "$C_HASH" ]; then
                ready=true
                break
              fi
            fi
            sleep 15
          done
          test "$ready" = true
          jq -n --argjson ledger_index "$H_LEDGER" '{method:"ledger",params:[{ledger_index:$ledger_index,transactions:false,expand:false}]}' > p0-final-fast-recovery/source-ledger-request.json
          curl --fail-with-body --silent --show-error --retry 3 -H 'content-type: application/json' \
            --data @p0-final-fast-recovery/source-ledger-request.json https://devnet.honeycluster.io/ \
            > p0-final-fast-recovery/source-ledger-response.json
          test "$H_HASH" = "$(jq -r '.result.ledger_hash // .result.ledger.ledger_hash' p0-final-fast-recovery/source-ledger-response.json)"

      - name: Stop superseded recovery writers
        shell: bash
        run: |
          set -euo pipefail
          parent_status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${OLD_PARENT_RUN_ID}" --jq .status 2>/dev/null || true)"
          if [ "$parent_status" = queued ] || [ "$parent_status" = in_progress ] || [ "$parent_status" = waiting ] || [ "$parent_status" = pending ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${OLD_PARENT_RUN_ID}/cancel" >/dev/null || true
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/rolling-checkpoint-candidate.yml/runs?event=workflow_dispatch&per_page=30" \
            > p0-final-fast-recovery/candidate-runs.json
          while read -r run_id; do
            status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .status 2>/dev/null || true)"
            if [ "$status" = queued ] || [ "$status" = in_progress ] || [ "$status" = waiting ] || [ "$status" = pending ]; then
              gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null || true
            fi
          done < <(jq -r '.workflow_runs[] | select(.created_at > "2026-07-13T12:42:39Z") | .id' p0-final-fast-recovery/candidate-runs.json)

      - name: Check out source history
        uses: actions/checkout@v4
        with:
          ref: history-p0-recovery-b-data
          path: .local/history-root
          sparse-checkout: history
          sparse-checkout-cone-mode: true

      - name: Check out source current state
        uses: actions/checkout@v4
        with:
          ref: current-state-p0-recovery-b-data
          path: .local/current-state-root
          sparse-checkout: |
            read-model
            rolling-base
          sparse-checkout-cone-mode: true

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build recovery tools
        run: |
          pnpm build:history-extension-plan
          pnpm build:history-extension-artifacts
          pnpm build:history-segment
          pnpm build:history-segment-checkpoint
          pnpm build:history-segment-chain
          pnpm build:extended-history-publication
          pnpm build:incremental-history-exact-index
          pnpm build:history-segment-channel
          pnpm build:rolling-current-state
          pnpm build:candidate-source-rehearsal
          cp .history-segment-channel-build/build-history-segment-channel.mjs /tmp/build-history-segment-channel.mjs
          cp .candidate-source-rehearsal-build/rehearse-candidate-sources.mjs /tmp/rehearse-candidate-sources.mjs

      - name: Bind source and freeze final target
        shell: bash
        run: |
          set -euo pipefail
          ROOT=p0-final-fast-recovery
          SOURCE=.local/history-root/history/publication.json
          CURRENT=.local/current-state-root/read-model/manifest.json
          SOURCE_LEDGER="$(jq -r .endLedgerIndex "$SOURCE")"
          SOURCE_HASH="$(jq -r .endLedgerHash "$SOURCE")"
          test "$SOURCE_LEDGER" = "$(jq -r .ledgerIndex "$CURRENT")"
          test "$SOURCE_HASH" = "$(jq -r .ledgerHash "$CURRENT")"
          cp "$SOURCE" "$ROOT/source-publication.json"
          rm -rf .local/base-exact-index
          cp -R .local/history-root/history/index/exact .local/base-exact-index
          jq -n '{method:"ledger",params:[{ledger_index:"validated",transactions:false,expand:false}]}' > "$ROOT/live-head-request.json"
          curl --fail-with-body --silent --show-error --retry 3 -H 'content-type: application/json' \
            --data @"$ROOT/live-head-request.json" https://devnet.honeycluster.io/ > "$ROOT/live-head-response.json"
          LIVE_LEDGER="$(jq -r '.result.ledger_index // .result.ledger.ledger_index' "$ROOT/live-head-response.json")"
          MAX_TARGET=$((SOURCE_LEDGER + MAX_DELTA_LEDGERS))
          if [ "$LIVE_LEDGER" -lt "$MAX_TARGET" ]; then TARGET="$LIVE_LEDGER"; else TARGET="$MAX_TARGET"; fi
          jq -n --argjson ledger_index "$TARGET" '{method:"ledger",params:[{ledger_index:$ledger_index,transactions:false,expand:false}]}' > "$ROOT/target-request.json"
          curl --fail-with-body --silent --show-error --retry 3 -H 'content-type: application/json' \
            --data @"$ROOT/target-request.json" https://devnet.honeycluster.io/ > "$ROOT/target-response.json"
          TARGET_HASH="$(jq -r '.result.ledger_hash // .result.ledger.ledger_hash' "$ROOT/target-response.json")"
          node .history-extension-plan-build/plan-history-extension.mjs --local \
            --publication "$SOURCE" --target-ledger "$TARGET" --target-ledger-hash "$TARGET_HASH" \
            --segment-ledgers "$SEGMENT_LEDGERS" --checkpoint-every-segments 10 \
            --output "$ROOT/plan.json" > "$ROOT/plan.stdout.json"
          jq -e --argjson maximum "$MAX_DELTA_LEDGERS" '.extension.ledgerCount > 0 and .extension.ledgerCount <= $maximum' "$ROOT/plan.json" >/dev/null

      - name: Generate final bounded delta
        shell: bash
        run: |
          set -euo pipefail
          ROOT=p0-final-fast-recovery
          PLAN="$ROOT/plan.json"
          EPOCH="$(jq -r .epochId "$PLAN")"
          RANGE_START="$(jq -r .extension.startLedgerIndex "$PLAN")"
          RANGE_END="$(jq -r .extension.endLedgerIndex "$PLAN")"
          ANCHOR_ID="$(jq -r .extension.anchorPreviousSegmentId "$PLAN")"
          ANCHOR_HASH="$(jq -r .extension.anchorPreviousSegmentEndHash "$PLAN")"
          CHECKPOINT="$ROOT/checkpoint.json"
          MANIFEST_PATHS="$ROOT/manifest-paths.txt"
          : > "$MANIFEST_PATHS"
          PREV_ID="$ANCHOR_ID"; PREV_HASH="$ANCHOR_HASH"
          while IFS= read -r SEGMENT; do
            ORDINAL="$(jq -r .ordinal <<<"$SEGMENT")"
            SEGMENT_ID="$(jq -r .segmentId <<<"$SEGMENT")"
            START="$(jq -r .startLedgerIndex <<<"$SEGMENT")"
            END="$(jq -r .endLedgerIndex <<<"$SEGMENT")"
            OUT=".local/history-root/history/${EPOCH}/${SEGMENT_ID}"
            PASSED=false
            for ATTEMPT in 1 2 3; do
              if node .history-segment-build/run-history-segment.mjs --local \
                --endpoint https://devnet.honeycluster.io/ --timeout-ms 12000 --read-window-size "$READ_WINDOW_SIZE" \
                --start-ledger "$START" --end-ledger "$END" --epoch-id "$EPOCH" --segment-id "$SEGMENT_ID" \
                --previous-segment-id "$PREV_ID" --previous-segment-end-hash "$PREV_HASH" \
                --source-revision "$GITHUB_SHA" --output-dir "$OUT" > "$ROOT/segment-${ORDINAL}.stdout.json"; then PASSED=true; break; fi
              sleep $((ATTEMPT * 10))
            done
            test "$PASSED" = true
            node .history-segment-checkpoint-build/update-history-segment-checkpoint.mjs --local \
              --checkpoint "$CHECKPOINT" --manifest "$OUT/manifest.json" --epoch-id "$EPOCH" \
              --range-start-ledger "$RANGE_START" --range-end-ledger "$RANGE_END" \
              --previous-segment-id "$ANCHOR_ID" --previous-segment-end-hash "$ANCHOR_HASH" \
              > "$ROOT/checkpoint-${ORDINAL}.stdout.json"
            printf '%s\n' "$OUT/manifest.json" >> "$MANIFEST_PATHS"
            PREV_ID="$SEGMENT_ID"; PREV_HASH="$(jq -r .endLedgerHash "$OUT/manifest.json")"
          done < <(jq -c '.extension.segments[]' "$PLAN")

      - name: Build final publication, exact index, and current state
        shell: bash
        run: |
          set -euo pipefail
          ROOT=p0-final-fast-recovery
          PLAN="$ROOT/plan.json"
          MANIFEST_ARGS=()
          while IFS= read -r MANIFEST; do MANIFEST_ARGS+=(--manifest "$MANIFEST"); done < "$ROOT/manifest-paths.txt"
          node .history-extension-artifacts-build/verify-history-extension-artifacts.mjs --local --plan "$PLAN" "${MANIFEST_ARGS[@]}" > "$ROOT/plan-bound-summary.json"
          node .history-segment-chain-build/verify-history-segment-chain.mjs --local "${MANIFEST_ARGS[@]}" \
            --epoch-id "$(jq -r .epochId "$PLAN")" --start-ledger "$(jq -r .extension.startLedgerIndex "$PLAN")" \
            --start-parent-hash "$(jq -r .source.endLedgerHash "$PLAN")" --previous-segment-id "$(jq -r .source.lastSegmentId "$PLAN")" \
            --previous-segment-end-hash "$(jq -r .source.endLedgerHash "$PLAN")" --end-ledger "$(jq -r .target.ledgerIndex "$PLAN")" \
            --end-ledger-hash "$(jq -r .target.ledgerHash "$PLAN")" > "$ROOT/chain-summary.json"
          TARGET="$(jq -r .target.ledgerIndex "$PLAN")"
          node .extended-history-publication-build/build-extended-history-publication.mjs --local \
            --source-publication "$ROOT/source-publication.json" --plan "$PLAN" "${MANIFEST_ARGS[@]}" \
            --chain-id "canonical-devnet-3371676-${TARGET}" --source-revision "$GITHUB_SHA" \
            --output "$ROOT/publication.json" > "$ROOT/publication.stdout.json"
          cp "$ROOT/publication.json" .local/history-root/history/publication.json
          rm -rf .local/next-exact-index
          node .incremental-history-exact-index-build/build-incremental-history-exact-index.mjs --local \
            --publication .local/history-root/history/publication.json --plan "$PLAN" --artifact-root .local/history-root \
            --base-index-dir .local/base-exact-index --base-publication "$ROOT/source-publication.json" \
            --output-dir .local/next-exact-index --asset-prefix history/index/exact --source-revision "$GITHUB_SHA" \
            > "$ROOT/incremental-exact-index.stdout.json"
          rm -rf .local/history-root/history/index/exact
          mv .local/next-exact-index .local/history-root/history/index/exact
          HASH="$(jq -r .target.ledgerHash "$PLAN")"
          PREFIX="$(printf '%s' "$HASH" | tr '[:upper:]' '[:lower:]' | cut -c1-12)"
          node .rolling-current-state-build/build-rolling-current-state-read-model.mjs --local \
            --base-rolling-dir .local/current-state-root/rolling-base --history-root .local/history-root --plan "$PLAN" \
            --output-dir .local/next-current-state --page-size 50 --lookup-prefix-length 3 --rolling-segments 64 \
            --snapshot-id "devnet-${TARGET}-${PREFIX}" --release-tag "replacement-current-state-${TARGET}" \
            > "$ROOT/current-state.stdout.json"
          jq -e --argjson target "$TARGET" --arg hash "$HASH" '.target.ledgerIndex == $target and .target.ledgerHash == $hash and .rollingBase.segmentCount == 64' \
            .local/next-current-state/rolling-read-model-summary.json >/dev/null

      - name: Publish final candidate pair
        shell: bash
        run: |
          set -euo pipefail
          ROOT=p0-final-fast-recovery
          rm -rf /tmp/p0-final-history /tmp/p0-final-current
          mkdir -p /tmp/p0-final-history /tmp/p0-final-current
          cp -R .local/history-root/history /tmp/p0-final-history/history
          cp -R .local/next-current-state/read-model /tmp/p0-final-current/read-model
          cp -R .local/next-current-state/rolling-base /tmp/p0-final-current/rolling-base
          cp .local/next-current-state/rolling-read-model-summary.json /tmp/p0-final-current/rolling-read-model-summary.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout --orphan p0-final-history-publish
          git rm -rf . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R /tmp/p0-final-history/. .
          git add history
          git commit -m 'Publish final P0 history candidate data'
          DATA_SHA="$(git rev-parse HEAD)"
          node /tmp/build-history-segment-channel.mjs --local --publication history/publication.json \
            --publication-path history/publication.json --exact-index-manifest history/index/exact/manifest.json \
            --exact-index-manifest-path history/index/exact/manifest.json --data-commit-sha "$DATA_SHA" --output history-channel.json
          git add history-channel.json
          git commit -m 'Activate final P0 history candidate channel'
          git push --force origin "HEAD:refs/heads/${OUTPUT_HISTORY_BRANCH}"
          git checkout --orphan p0-final-current-publish
          git rm -rf . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R /tmp/p0-final-current/. .
          git add read-model rolling-base rolling-read-model-summary.json
          git commit -m 'Publish final P0 current-state candidate data'
          DATA_SHA="$(git rev-parse HEAD)"
          MANIFEST_SHA="$(jq -r .target.manifestSha256 rolling-read-model-summary.json)"
          RELEASE_TAG="$(jq -r .target.releaseTag rolling-read-model-summary.json)"
          SNAPSHOT_ID="$(jq -r .target.snapshotId rolling-read-model-summary.json)"
          jq -n --arg dataCommitSha "$DATA_SHA" --arg manifestSha256 "$MANIFEST_SHA" --arg releaseTag "$RELEASE_TAG" \
            --arg snapshotId "$SNAPSHOT_ID" --arg updatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schemaVersion:1,active:{dataCommitSha:$dataCommitSha,manifestPath:"read-model/manifest.json",manifestSha256:$manifestSha256,releaseTag:$releaseTag,snapshotId:$snapshotId},updatedAt:$updatedAt}' > channel.json
          git add channel.json
          git commit -m 'Activate final P0 current-state candidate channel'
          git push --force origin "HEAD:refs/heads/${OUTPUT_CURRENT_BRANCH}"
          node /tmp/rehearse-candidate-sources.mjs --local --repository badjoke-lab/xrpl-lending-monitor \
            --history-branch "$OUTPUT_HISTORY_BRANCH" --current-state-branch "$OUTPUT_CURRENT_BRANCH" \
            > "$ROOT/remote-rehearsal-summary.json"
          jq -e '.passed == true and (.exactReads | length) == 3 and .recentHistory.items == 1' "$ROOT/remote-rehearsal-summary.json" >/dev/null

      - name: Cut over and verify production
        shell: bash
        run: |
          set -euo pipefail
          ROOT=p0-final-fast-recovery
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/rolling-checkpoint-live-cutover.yml/runs?event=workflow_dispatch&per_page=100" --jq '.workflow_runs[].id' > "$ROOT/cutover-before.txt"
          jq -n --arg ref main --arg h "$OUTPUT_HISTORY_BRANCH" --arg c "$OUTPUT_CURRENT_BRANCH" \
            '{ref:$ref,inputs:{history_candidate_branch:$h,current_state_candidate_branch:$c,confirm_production_write:"true"}}' > "$ROOT/cutover-dispatch.json"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/rolling-checkpoint-live-cutover.yml/dispatches" --input "$ROOT/cutover-dispatch.json"
          CUTOVER_ID=''
          for attempt in $(seq 1 90); do
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/rolling-checkpoint-live-cutover.yml/runs?event=workflow_dispatch&per_page=100" > "$ROOT/cutover-runs.json"
            while read -r id; do if ! grep -Fxq "$id" "$ROOT/cutover-before.txt"; then CUTOVER_ID="$id"; break; fi; done \
              < <(jq -r '.workflow_runs | sort_by(.created_at) | reverse | .[].id' "$ROOT/cutover-runs.json")
            test -n "$CUTOVER_ID" && break
            sleep 10
          done
          test -n "$CUTOVER_ID"
          for attempt in $(seq 1 480); do
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CUTOVER_ID}" > "$ROOT/cutover-run.json"
            test "$(jq -r .status "$ROOT/cutover-run.json")" = completed && break
            sleep 15
          done
          test "$(jq -r .conclusion "$ROOT/cutover-run.json")" = success
          TARGET="$(jq -r .target.ledgerIndex "$ROOT/plan.json")"
          VERIFIED=false
          for attempt in $(seq 1 90); do
            curl --silent --show-error --retry 1 "$PRODUCTION_BASE/api/overview" > "$ROOT/overview.json" || true
            curl --silent --show-error --retry 1 "$PRODUCTION_BASE/api/activity?limit=25" > "$ROOT/activity.json" || true
            OBSERVED="$(jq -r '[.snapshot.ledger_index,.snapshot.ledgerIndex,.current_state_watermark.ledger_index,.current_state_watermark.ledgerIndex,.data.snapshot.ledger_index,.data.snapshot.ledgerIndex] | map(select(. != null)) | max // 0' "$ROOT/overview.json" 2>/dev/null || echo 0)"
            if [ "$OBSERVED" -ge "$TARGET" ] && jq -e '(.events // .items // .data.events // .data.items) | type == "array"' "$ROOT/activity.json" >/dev/null 2>&1; then VERIFIED=true; break; fi
            sleep 5
          done
          test "$VERIFIED" = true
          jq -n --argjson target "$TARGET" --argjson cutoverRunId "$CUTOVER_ID" --slurpfile overview "$ROOT/overview.json" --slurpfile activity "$ROOT/activity.json" \
            '{passed:true,targetLedger:$target,cutoverRunId:$cutoverRunId,overview:$overview[0],activity:$activity[0]}' > "$ROOT/status.json"
          CONTENT="$(base64 -w0 "$ROOT/status.json")"
          API="repos/${GITHUB_REPOSITORY}/contents/.github/p0-final-fast-recovery-status.json"
          SHA="$(gh api "$API" --jq .sha 2>/dev/null || true)"
          if [ -n "$SHA" ]; then gh api --method PUT "$API" -f message='Update final P0 recovery status' -f content="$CONTENT" -f sha="$SHA" >/dev/null
          else gh api --method PUT "$API" -f message='Create final P0 recovery status' -f content="$CONTENT" >/dev/null
          fi

      - name: Upload final recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-final-fast-recovery
          path: p0-final-fast-recovery
          if-no-files-found: warn
          retention-days: 30
