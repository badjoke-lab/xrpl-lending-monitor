name: Current post-resume read-only probe

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: current-post-resume-readonly-probe
  cancel-in-progress: false

env:
  QUALIFICATION_ISSUE: '995'
  QUEUE_ID: 2ae398f2edbf43749e45cd7ede77c6cd
  DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
  SCRIPT_NAME: xrpl-lending-monitor
  BASELINE_LEDGER: '4086707'
  EXPECTED_VERSION_ID: 6c9af7da-863e-4afa-8711-fd28d18bc05e
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  probe:
    if: >-
      github.event.issue.number == 995 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      github.event.comment.body == '/current-post-resume-probe'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read production Current state only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p current-post-resume-probe
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          queue="${api}/queues/${QUEUE_ID}"
          d1="${api}/d1/database/${DATABASE_ID}/query"
          worker="${api}/workers/scripts/${SCRIPT_NAME}"

          curl -fsS -H "$auth" "$queue" | tee current-post-resume-probe/queue.json >/dev/null
          curl -fsS -H "$auth" "$queue/metrics" | tee current-post-resume-probe/queue-metrics.json >/dev/null
          curl -fsS -H "$auth" "$worker/schedules" | tee current-post-resume-probe/schedules.json >/dev/null
          curl -fsS -H "$auth" "$worker/deployments" | tee current-post-resume-probe/deployments.json >/dev/null

          # Cloudflare Queue peek is non-leasing and non-consuming: it returns queued
          # messages without acknowledging, retrying, purging, or otherwise mutating them.
          curl -fsS -X POST -H "$auth" -H 'Content-Type: application/json' \
            "$queue/messages/peek" --data '{"batch_size":10}' \
            | tee current-post-resume-probe/queue-peek.json >/dev/null

          query() {
            local sql="$1"
            curl -fsS -X POST -H "$auth" -H 'Content-Type: application/json' "$d1" \
              --data "$(jq -cn --arg sql "$sql" '{sql:$sql}')"
          }

          query "SELECT epoch_id,last_processed_ledger,latest_observed_ledger,status,updated_at FROM fast_lane_shadow_state WHERE network='devnet'" \
            | tee current-post-resume-probe/fast.json >/dev/null
          query "SELECT run_at,status,start_ledger_index,end_ledger_index,error_message FROM fast_lane_shadow_run_metrics WHERE network='devnet' ORDER BY run_at DESC LIMIT 6" \
            | tee current-post-resume-probe/metrics.json >/dev/null
          query "SELECT scheduled_time,status,message_id,started_at,completed_at,next_scheduled_time,next_cron,error_message,updated_at FROM fast_lane_queue_slots ORDER BY scheduled_time DESC LIMIT 16" \
            | tee current-post-resume-probe/slots.json >/dev/null

          jq -e '.success == true and .result.settings.delivery_paused == false' current-post-resume-probe/queue.json >/dev/null
          jq -e '.success == true and (.result.backlog_count | type == "number")' current-post-resume-probe/queue-metrics.json >/dev/null
          jq -e '.success == true and (.result.schedules | length) == 0' current-post-resume-probe/schedules.json >/dev/null
          jq -e --arg v "$EXPECTED_VERSION_ID" '.success == true and (.result.deployments[0].versions | length) == 1 and .result.deployments[0].versions[0].percentage == 100 and .result.deployments[0].versions[0].version_id == $v' current-post-resume-probe/deployments.json >/dev/null
          jq -e '.success == true and ((.result.messages // .messages // []) | type == "array")' current-post-resume-probe/queue-peek.json >/dev/null

          ledger="$(jq -r '.result[0].results[0].last_processed_ledger' current-post-resume-probe/fast.json)"
          latest="$(jq -r '.result[0].results[0].latest_observed_ledger' current-post-resume-probe/fast.json)"
          status="$(jq -r '.result[0].results[0].status' current-post-resume-probe/fast.json)"
          metric_status="$(jq -r '.result[0].results[0].status' current-post-resume-probe/metrics.json)"
          metric_end="$(jq -r '.result[0].results[0].end_ledger_index' current-post-resume-probe/metrics.json)"
          metric_error="$(jq -r '.result[0].results[0].error_message' current-post-resume-probe/metrics.json)"
          slot_status="$(jq -r '.result[0].results[0].status' current-post-resume-probe/slots.json)"
          slot_time="$(jq -r '.result[0].results[0].scheduled_time' current-post-resume-probe/slots.json)"
          slot_error="$(jq -r '.result[0].results[0].error_message' current-post-resume-probe/slots.json)"
          peek_count="$(jq -r '(.result.messages // .messages // []) | length' current-post-resume-probe/queue-peek.json)"
          backlog_count="$(jq -r '.result.backlog_count' current-post-resume-probe/queue-metrics.json)"
          backlog_bytes="$(jq -r '.result.backlog_bytes' current-post-resume-probe/queue-metrics.json)"
          oldest_message_timestamp_ms="$(jq -r '.result.oldest_message_timestamp_ms' current-post-resume-probe/queue-metrics.json)"
          advanced=false
          if [ "$ledger" -gt "$BASELINE_LEDGER" ]; then advanced=true; fi

          jq -n \
            --argjson baseline "$BASELINE_LEDGER" \
            --argjson ledger "$ledger" \
            --argjson latest "$latest" \
            --arg status "$status" \
            --arg metricStatus "$metric_status" \
            --argjson metricEnd "$metric_end" \
            --arg metricError "$metric_error" \
            --arg slotStatus "$slot_status" \
            --argjson slotTime "$slot_time" \
            --arg slotError "$slot_error" \
            --argjson peekCount "$peek_count" \
            --argjson backlogCount "$backlog_count" \
            --argjson backlogBytes "$backlog_bytes" \
            --argjson oldestMessageTimestampMs "$oldest_message_timestamp_ms" \
            --argjson advanced "$advanced" \
            '{passed:true,productionMutation:false,queuePeekNonLeasing:true,queueDeliveryPaused:false,baselineLedger:$baseline,lastProcessedLedger:$ledger,latestObservedLedger:$latest,fastLaneStatus:$status,advanced:$advanced,queueBacklogCount:$backlogCount,queueBacklogBytes:$backlogBytes,queueOldestMessageTimestampMs:$oldestMessageTimestampMs,queuePeekCount:$peekCount,latestMetricStatus:$metricStatus,latestMetricEndLedger:$metricEnd,latestMetricError:(if $metricError=="null" then null else $metricError end),latestSlotStatus:$slotStatus,latestSlotScheduledTime:$slotTime,latestSlotError:(if $slotError=="null" then null else $slotError end)}' \
            > current-post-resume-probe/result.json

          cat current-post-resume-probe/result.json

      - name: Upload read-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: current-post-resume-readonly-probe
          path: current-post-resume-probe
          if-no-files-found: error
          retention-days: 30
