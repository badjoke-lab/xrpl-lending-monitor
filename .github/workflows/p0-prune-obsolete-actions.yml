name: P0 prune obsolete Actions

on:
  push:
    branches: [main]
    paths:
      - .github/prune-obsolete-actions-trigger

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: repository-actions-prune
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cancel obsolete queued and running workflows
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for status in queued in_progress; do
            gh run list --repo "$GITHUB_REPOSITORY" --status "$status" --limit 100 \
              --json databaseId,name 2>/dev/null \
              | jq -r --argjson current "$GITHUB_RUN_ID" '.[] | select(.databaseId != $current) | select(.name != "P0 emergency production catch-up") | select(.name != "Four-hour current-state checkpoint") | .databaseId' \
              | while read -r run_id; do
                  [ -n "$run_id" ] && gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || true
                done
          done

      - name: Remove every nonessential workflow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github
          before="$(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | sort)"
          before_count="$(printf '%s\n' "$before" | sed '/^$/d' | wc -l | tr -d ' ')"
          : > /tmp/deleted-workflows.txt

          while IFS= read -r workflow; do
            case "$workflow" in
              .github/workflows/ci.yml|.github/workflows/four-hour-history-maintenance.yml|.github/workflows/p0-prune-obsolete-actions.yml)
                ;;
              *)
                printf '%s\n' "$workflow" >> /tmp/deleted-workflows.txt
                rm -f "$workflow"
                ;;
            esac
          done <<< "$before"

          find .github -maxdepth 1 -type f -name '*trigger*' \
            ! -name 'four-hour-history-maintenance-trigger' \
            ! -name 'prune-obsolete-actions-trigger' \
            -delete

          deleted_count="$(sed '/^$/d' /tmp/deleted-workflows.txt | wc -l | tr -d ' ')"
          after_count="$(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) ! -name 'p0-prune-obsolete-actions.yml' | wc -l | tr -d ' ')"

          {
            echo '# GitHub Actions prune report'
            echo
            echo "- Before: ${before_count} workflow files"
            echo "- Deleted: ${deleted_count} workflow files"
            echo "- Retained after self-removal: ${after_count} workflow files"
            echo '- Retained allowlist:'
            echo '  - `.github/workflows/ci.yml`'
            echo '  - `.github/workflows/four-hour-history-maintenance.yml`'
            echo
            echo '## Deleted workflows'
            sed 's#^#- `#; s#$#`#' /tmp/deleted-workflows.txt
          } > .github/actions-prune-report.md

          rm -f .github/workflows/p0-prune-obsolete-actions.yml
          rm -f .github/prune-obsolete-actions-trigger

          test -f .github/workflows/ci.yml
          test -f .github/workflows/four-hour-history-maintenance.yml
          test "$(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | wc -l | tr -d ' ')" = 2

      - name: Commit the pruned workflow set
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ops: remove obsolete GitHub Actions workflows'
          git push origin HEAD:main

      - name: Publish prune result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ -f .github/actions-prune-report.md ]; then
            gh issue comment 976 --repo "$GITHUB_REPOSITORY" --body-file .github/actions-prune-report.md || true
          fi
