name: Rolling checkpoint equivalence rehearsal

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rolling-checkpoint-equivalence-rehearsal.yml'
      - 'scripts/build-rolling-current-state-read-model.ts'
      - 'src/shared/current-state/rolling-base.ts'
      - 'src/shared/current-state/rolling-base.test.ts'
      - 'vite.rolling-current-state.config.ts'
      - 'package.json'

permissions:
  contents: read
  actions: read

jobs:
  equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out implementation
        uses: actions/checkout@v4

      - name: Check out T1 production history
        uses: actions/checkout@v4
        with:
          ref: history-data
          path: .local/history-root
          sparse-checkout: history
          sparse-checkout-cone-mode: true

      - name: Check out T1 production current state
        uses: actions/checkout@v4
        with:
          ref: current-state-data
          path: .local/current-base
          sparse-checkout: read-model
          sparse-checkout-cone-mode: true

      - name: Download verified release-native root base
        uses: actions/download-artifact@v4
        with:
          name: current-state-release-assets
          path: .local/current-state-release
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 28699460881

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build rehearsal tools
        run: |
          pnpm build:history-extension-plan
          pnpm build:history-segment
          pnpm build:history-segment-checkpoint
          pnpm build:history-extension-artifacts
          pnpm build:history-segment-chain
          pnpm build:extended-history-publication
          pnpm build:rolling-current-state
          pnpm build:replacement-current-state-read-model

      - name: Freeze T1-plus-24 target and build extension plan
        shell: bash
        run: |
          set -euo pipefail
          ROOT=rolling-checkpoint-equivalence
          SOURCE=.local/history-root/history/publication.json
          mkdir -p "${ROOT}"
          SOURCE_END="$(jq -r '.endLedgerIndex' "${SOURCE}")"
          SOURCE_HASH="$(jq -r '.endLedgerHash' "${SOURCE}")"
          test "${SOURCE_END}" -eq 3539657
          test "${SOURCE_HASH}" = "747554DD57DE87C80E55B5936EAE223DA72DE3637DD23A6095A34CAFE1CCAEDB"
          TARGET="$((SOURCE_END + 24))"
          jq -n --argjson ledger_index "${TARGET}" '{method:"ledger",params:[{ledger_index:$ledger_index,transactions:false,expand:false}]}' > "${ROOT}/target-request.json"
          curl --fail-with-body --silent --show-error --retry 3 -H 'Content-Type: application/json' --data @"${ROOT}/target-request.json" https://devnet.honeycluster.io/ > "${ROOT}/target-response.json"
          TARGET_HASH="$(jq -r '.result.ledger_hash // .result.ledger.ledger_hash // empty' "${ROOT}/target-response.json")"
          printf '%s' "${TARGET_HASH}" | grep -Eq '^[A-F0-9]{64}$'
          node .history-extension-plan-build/plan-history-extension.mjs --local --publication "${SOURCE}" --target-ledger "${TARGET}" --target-ledger-hash "${TARGET_HASH}" --segment-ledgers 4 --checkpoint-every-segments 2 --output "${ROOT}/plan.json" > "${ROOT}/plan.stdout.json"
          jq -e '.extension.ledgerCount == 24 and .extension.segmentCount == 6 and .source.endLedgerIndex == 3539657' "${ROOT}/plan.json" > /dev/null

      - name: Generate and checkpoint six delta segments
        shell: bash
        run: |
          set -euo pipefail
          ROOT=rolling-checkpoint-equivalence
          PLAN="${ROOT}/plan.json"
          EPOCH="$(jq -r '.epochId' "${PLAN}")"
          RANGE_START="$(jq -r '.extension.startLedgerIndex' "${PLAN}")"
          RANGE_END="$(jq -r '.extension.endLedgerIndex' "${PLAN}")"
          ANCHOR_ID="$(jq -r '.extension.anchorPreviousSegmentId' "${PLAN}")"
          ANCHOR_HASH="$(jq -r '.extension.anchorPreviousSegmentEndHash' "${PLAN}")"
          CHECKPOINT="${ROOT}/checkpoint.json"
          PREV_ID="${ANCHOR_ID}"
          PREV_HASH="${ANCHOR_HASH}"
          : > "${ROOT}/manifest-paths.txt"

          while IFS= read -r SEGMENT; do
            ORDINAL="$(jq -r '.ordinal' <<<"${SEGMENT}")"
            SEGMENT_ID="$(jq -r '.segmentId' <<<"${SEGMENT}")"
            START="$(jq -r '.startLedgerIndex' <<<"${SEGMENT}")"
            END="$(jq -r '.endLedgerIndex' <<<"${SEGMENT}")"
            OUT=".local/history-root/history/${EPOCH}/${SEGMENT_ID}"
            PASSED=false
            for ATTEMPT in 1 2 3; do
              if node .history-segment-build/run-history-segment.mjs --local --endpoint https://devnet.honeycluster.io/ --timeout-ms 12000 --start-ledger "${START}" --end-ledger "${END}" --epoch-id "${EPOCH}" --segment-id "${SEGMENT_ID}" --previous-segment-id "${PREV_ID}" --previous-segment-end-hash "${PREV_HASH}" --source-revision "${GITHUB_SHA}" --output-dir "${OUT}" > "${ROOT}/segment-${ORDINAL}.stdout.json"; then PASSED=true; break; fi
              sleep $((ATTEMPT * 5))
            done
            test "${PASSED}" = true
            node .history-segment-checkpoint-build/update-history-segment-checkpoint.mjs --local --checkpoint "${CHECKPOINT}" --manifest "${OUT}/manifest.json" --epoch-id "${EPOCH}" --range-start-ledger "${RANGE_START}" --range-end-ledger "${RANGE_END}" --previous-segment-id "${ANCHOR_ID}" --previous-segment-end-hash "${ANCHOR_HASH}" > "${ROOT}/checkpoint-${ORDINAL}.stdout.json"
            printf '%s\n' "${OUT}/manifest.json" >> "${ROOT}/manifest-paths.txt"
            PREV_ID="${SEGMENT_ID}"
            PREV_HASH="$(jq -r '.endLedgerHash' "${OUT}/manifest.json")"
          done < <(jq -c '.extension.segments[]' "${PLAN}")

          jq -e --argjson end "${RANGE_END}" '.nextLedgerIndex == ($end + 1) and (.completedSegments | length) == 6' "${CHECKPOINT}" > /dev/null

      - name: Verify extension and build full rehearsal publication
        shell: bash
        run: |
          set -euo pipefail
          ROOT=rolling-checkpoint-equivalence
          PLAN="${ROOT}/plan.json"
          MANIFEST_ARGS=()
          while IFS= read -r MANIFEST; do MANIFEST_ARGS+=(--manifest "${MANIFEST}"); done < "${ROOT}/manifest-paths.txt"
          node .history-extension-artifacts-build/verify-history-extension-artifacts.mjs --local --plan "${PLAN}" "${MANIFEST_ARGS[@]}" > "${ROOT}/plan-bound-summary.json"
          node .history-segment-chain-build/verify-history-segment-chain.mjs --local "${MANIFEST_ARGS[@]}" --epoch-id "$(jq -r '.epochId' "${PLAN}")" --start-ledger "$(jq -r '.extension.startLedgerIndex' "${PLAN}")" --start-parent-hash "$(jq -r '.source.endLedgerHash' "${PLAN}")" --previous-segment-id "$(jq -r '.source.lastSegmentId' "${PLAN}")" --previous-segment-end-hash "$(jq -r '.source.endLedgerHash' "${PLAN}")" --end-ledger "$(jq -r '.target.ledgerIndex' "${PLAN}")" --end-ledger-hash "$(jq -r '.target.ledgerHash' "${PLAN}")" > "${ROOT}/chain-summary.json"
          TARGET="$(jq -r '.target.ledgerIndex' "${PLAN}")"
          node .extended-history-publication-build/build-extended-history-publication.mjs --local --source-publication .local/history-root/history/publication.json --plan "${PLAN}" "${MANIFEST_ARGS[@]}" --chain-id "canonical-devnet-3371676-${TARGET}" --source-revision "${GITHUB_SHA}" --output "${ROOT}/publication.json" > "${ROOT}/publication.stdout.json"
          cp "${ROOT}/publication.json" .local/history-root/history/publication.json

      - name: Build rolling T2 current state from T1 read model plus delta only
        shell: bash
        run: |
          set -euo pipefail
          ROOT=rolling-checkpoint-equivalence
          TARGET="$(jq -r '.target.ledgerIndex' "${ROOT}/plan.json")"
          HASH="$(jq -r '.target.ledgerHash' "${ROOT}/plan.json")"
          PREFIX="$(printf '%s' "${HASH}" | tr '[:upper:]' '[:lower:]' | cut -c1-12)"
          node .rolling-current-state-build/build-rolling-current-state-read-model.mjs --local --base-read-model-dir .local/current-base/read-model --history-root .local/history-root --plan "${ROOT}/plan.json" --output-dir "${ROOT}/rolling" --page-size 50 --lookup-prefix-length 3 --rolling-segments 64 --snapshot-id "devnet-${TARGET}-${PREFIX}" --release-tag "replacement-current-state-${TARGET}" > "${ROOT}/rolling.stdout.json"

      - name: Build full-replay T2 baseline
        shell: bash
        run: |
          set -euo pipefail
          ROOT=rolling-checkpoint-equivalence
          TARGET="$(jq -r '.target.ledgerIndex' "${ROOT}/plan.json")"
          HASH="$(jq -r '.target.ledgerHash' "${ROOT}/plan.json")"
          PREFIX="$(printf '%s' "${HASH}" | tr '[:upper:]' '[:lower:]' | cut -c1-12)"
          node .replacement-current-state-read-model-build/build-replacement-current-state-read-model.mjs --local --input-dir .local/current-state-release/assets --history-root .local/history-root --publication .local/history-root/history/publication.json --output-dir "${ROOT}/baseline" --page-size 50 --lookup-prefix-length 3 --snapshot-id "devnet-${TARGET}-${PREFIX}" --release-tag "replacement-current-state-${TARGET}" > "${ROOT}/baseline.stdout.json"

      - name: Require byte-identical read-model outputs
        shell: bash
        run: |
          set -euo pipefail
          ROOT=rolling-checkpoint-equivalence
          (cd "${ROOT}/rolling" && find read-model -type f -print0 | sort -z | xargs -0 sha256sum) > "${ROOT}/rolling-sha256.txt"
          (cd "${ROOT}/baseline" && find read-model -type f -print0 | sort -z | xargs -0 sha256sum) > "${ROOT}/baseline-sha256.txt"
          diff -u "${ROOT}/baseline-sha256.txt" "${ROOT}/rolling-sha256.txt"
          jq -e '.rollingBase.segmentCount == 64 and .extension.ledgerCount == 24 and .target.ledgerIndex > .source.ledgerIndex' "${ROOT}/rolling/rolling-read-model-summary.json" > /dev/null
          jq -n --slurpfile plan "${ROOT}/plan.json" --slurpfile rolling "${ROOT}/rolling/rolling-read-model-summary.json" --slurpfile baseline "${ROOT}/baseline/replacement-read-model-summary.json" '{passed:true,target:$plan[0].target,rolling:$rolling[0],baseline:$baseline[0],readModelByteEquivalent:true}' > "${ROOT}/evidence.json"

      - name: Upload retained equivalence evidence
        uses: actions/upload-artifact@v4
        with:
          name: rolling-checkpoint-equivalence-rehearsal
          path: |
            rolling-checkpoint-equivalence/evidence.json
            rolling-checkpoint-equivalence/plan.json
            rolling-checkpoint-equivalence/plan-bound-summary.json
            rolling-checkpoint-equivalence/chain-summary.json
            rolling-checkpoint-equivalence/rolling-sha256.txt
            rolling-checkpoint-equivalence/baseline-sha256.txt
            rolling-checkpoint-equivalence/rolling/rolling-read-model-summary.json
            rolling-checkpoint-equivalence/rolling/rolling-base/manifest.json
          if-no-files-found: error
          retention-days: 30
