name: D1 actual usage probe

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/d1-actual-usage-probe.yml

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  D1_DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Resolve deployed Worker URL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p d1-actual-usage-probe
          curl --fail-with-body --silent --show-error --retry 3 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            > d1-actual-usage-probe/subdomain.json
          SUBDOMAIN="$(jq -r '.result.subdomain // empty' d1-actual-usage-probe/subdomain.json)"
          test -n "${SUBDOMAIN}"
          printf '%s\n' "https://xrpl-lending-monitor.${SUBDOMAIN}.workers.dev" \
            > d1-actual-usage-probe/base-url.txt

      - name: Measure D1 usage delta for one HYB-7 diagnostic call
        shell: bash
        run: |
          set -euo pipefail
          TODAY="$(date -u +%F)"
          BASE="$(cat d1-actual-usage-probe/base-url.txt)"

          read -r -d '' QUERY <<'GRAPHQL' || true
          query D1Usage(
            $accountTag: string!
            $start: Date
            $end: Date
            $databaseId: string
          ) {
            viewer {
              accounts(filter: { accountTag: $accountTag }) {
                d1AnalyticsAdaptiveGroups(
                  limit: 10000
                  filter: {
                    date_geq: $start
                    date_leq: $end
                    databaseId: $databaseId
                  }
                  orderBy: [date_DESC]
                ) {
                  sum {
                    readQueries
                    writeQueries
                    rowsRead
                    rowsWritten
                  }
                  dimensions {
                    date
                    databaseId
                  }
                }
              }
            }
          }
          GRAPHQL

          jq -n \
            --arg query "${QUERY}" \
            --arg accountTag "${CLOUDFLARE_ACCOUNT_ID}" \
            --arg start "${TODAY}" \
            --arg end "${TODAY}" \
            --arg databaseId "${D1_DATABASE_ID}" \
            '{query: $query, variables: {accountTag: $accountTag, start: $start, end: $end, databaseId: $databaseId}}' \
            > d1-actual-usage-probe/request.json

          query_usage() {
            local out="$1"
            curl --fail-with-body --silent --show-error --retry 3 \
              -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' \
              --data @d1-actual-usage-probe/request.json \
              https://api.cloudflare.com/client/v4/graphql \
              > "${out}"
            jq -e '((.errors // []) | length) == 0 and (.data.viewer.accounts | length) > 0' \
              "${out}" > /dev/null
          }

          summarize_usage() {
            local input="$1"
            local output="$2"
            jq --arg date "${TODAY}" --arg databaseId "${D1_DATABASE_ID}" '
              [.data.viewer.accounts[0].d1AnalyticsAdaptiveGroups[]] as $groups
              | {
                  date_utc: $date,
                  database_id: $databaseId,
                  read_queries: ([$groups[].sum.readQueries // 0] | add // 0),
                  write_queries: ([$groups[].sum.writeQueries // 0] | add // 0),
                  rows_read: ([$groups[].sum.rowsRead // 0] | add // 0),
                  rows_written: ([$groups[].sum.rowsWritten // 0] | add // 0),
                  free_rows_read_daily_allowance: 5000000,
                  free_rows_written_daily_allowance: 100000
                }
            ' "${input}" > "${output}"
          }

          query_usage d1-actual-usage-probe/response-before.json
          summarize_usage \
            d1-actual-usage-probe/response-before.json \
            d1-actual-usage-probe/summary-before.json

          CODE="$(curl --silent --show-error --retry 3 \
            -o d1-actual-usage-probe/continuation-diagnostics.json \
            -w '%{http_code}' \
            "${BASE}/api/status/continuation-diagnostics")"
          printf '%s\n' "${CODE}" > d1-actual-usage-probe/continuation-diagnostics.http-status.txt
          test "${CODE}" = "200"
          jq -e '.report and .report.paths and .evidence' \
            d1-actual-usage-probe/continuation-diagnostics.json > /dev/null

          sleep 60

          query_usage d1-actual-usage-probe/response-after.json
          summarize_usage \
            d1-actual-usage-probe/response-after.json \
            d1-actual-usage-probe/summary-after.json

          jq -n \
            --slurpfile before d1-actual-usage-probe/summary-before.json \
            --slurpfile after d1-actual-usage-probe/summary-after.json \
            '{
              before: $before[0],
              after: $after[0],
              delta: {
                read_queries: ($after[0].read_queries - $before[0].read_queries),
                write_queries: ($after[0].write_queries - $before[0].write_queries),
                rows_read: ($after[0].rows_read - $before[0].rows_read),
                rows_written: ($after[0].rows_written - $before[0].rows_written)
              }
            }' > d1-actual-usage-probe/usage-delta.json

          cat d1-actual-usage-probe/usage-delta.json

      - name: Capture recent top queries by rows read
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler d1 insights xrpl-lending-monitor \
            --sort-type=sum \
            --sort-by=reads \
            --sort-direction=DESC \
            --limit=30 \
            --timePeriod=1h \
            --json \
            > d1-actual-usage-probe/top-reads.json
          jq -e 'type == "array"' d1-actual-usage-probe/top-reads.json > /dev/null
          jq '[.[] | {query, totalRowsRead, totalRowsWritten, numberOfTimesRun, totalDurationMs}]' \
            d1-actual-usage-probe/top-reads.json \
            > d1-actual-usage-probe/top-reads-summary.json
          cat d1-actual-usage-probe/top-reads-summary.json

      - name: Write usage summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## D1 actual usage probe'
            echo
            jq -r '"- Diagnostic call rows-read delta: `\(.delta.rows_read)`"' d1-actual-usage-probe/usage-delta.json
            jq -r '"- Diagnostic call rows-written delta: `\(.delta.rows_written)`"' d1-actual-usage-probe/usage-delta.json
            jq -r '"- Daily rows read after: `\(.after.rows_read)` / `\(.after.free_rows_read_daily_allowance)`"' d1-actual-usage-probe/usage-delta.json
            jq -r '"- Daily rows written after: `\(.after.rows_written)` / `\(.after.free_rows_written_daily_allowance)`"' d1-actual-usage-probe/usage-delta.json
            echo
            echo '### Recent top D1 queries by rows read'
            jq -r '.[] | "- rows_read=`\(.totalRowsRead)` runs=`\(.numberOfTimesRun)` rows_written=`\(.totalRowsWritten)` — `\(.query | gsub("\\n"; " ") | .[0:220])`"' d1-actual-usage-probe/top-reads-summary.json
          } >> "${GITHUB_STEP_SUMMARY}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-actual-usage-probe
          path: d1-actual-usage-probe
          if-no-files-found: error
          retention-days: 14
