name: R5 Bounded Recovery Burst

on:
  workflow_dispatch:
    inputs:
      batch_limit:
        description: Maximum sequential recovery batches for this run
        required: true
        default: 8
        type: number
      wall_seconds:
        description: Hard wall-clock bound in seconds
        required: true
        default: 900
        type: number
      confirm:
        description: Type RUN_R5_BOUNDED_BURST to authorize this finite Devnet recovery run
        required: true
        type: string
  issue_comment:
    types: [created]
  push:
    branches: [main]
    paths:
      - ops/r5/run-once-20260804-8x900-observable-v2.marker

permissions:
  contents: read
  issues: write

concurrency:
  group: r5-bounded-recovery-burst
  cancel-in-progress: false

jobs:
  reject-invalid-request:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm != 'RUN_R5_BOUNDED_BURST' }}
    runs-on: ubuntu-latest
    steps:
      - name: Refuse an ambiguous recovery request
        run: |
          echo 'Type RUN_R5_BOUNDED_BURST to authorize one finite R5 Devnet recovery burst.'
          exit 1

  execute-bounded-burst:
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && inputs.confirm == 'RUN_R5_BOUNDED_BURST')
        || (
          github.event_name == 'issue_comment'
          && github.event.issue.number == 1175
          && github.actor == 'badjoke-lab'
          && (
            github.event.comment.body == '/r5-recovery burst 8 900 nonce-e3378018'
            || github.event.comment.body == '/r5-recovery burst 64 1800 nonce-cd7eb564'
          )
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      R5_RECOVERY_BURST_BATCH_LIMIT: >-
        ${{ github.event_name == 'issue_comment' && github.event.comment.body == '/r5-recovery burst 64 1800 nonce-cd7eb564' && '64' || github.event_name == 'issue_comment' && '8' || inputs.batch_limit }}
      R5_RECOVERY_BURST_WALL_SECONDS: >-
        ${{ github.event_name == 'issue_comment' && github.event.comment.body == '/r5-recovery burst 64 1800 nonce-cd7eb564' && '1800' || github.event_name == 'issue_comment' && '900' || inputs.wall_seconds }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify exact bounded request and secret bindings
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          [[ "$SUPABASE_PROJECT_ID" =~ ^[a-z]{20}$ ]]
          [[ "$R5_RECOVERY_BURST_BATCH_LIMIT" =~ ^[0-9]+$ ]]
          [[ "$R5_RECOVERY_BURST_WALL_SECONDS" =~ ^[0-9]+$ ]]
          test "$R5_RECOVERY_BURST_BATCH_LIMIT" -ge 1
          test "$R5_RECOVERY_BURST_BATCH_LIMIT" -le 64
          test "$R5_RECOVERY_BURST_WALL_SECONDS" -ge 60
          test "$R5_RECOVERY_BURST_WALL_SECONDS" -le 1800
          if [ "$GITHUB_EVENT_NAME" = issue_comment ]; then
            if [ "$R5_RECOVERY_BURST_BATCH_LIMIT" -eq 8 ]; then
              test "$R5_RECOVERY_BURST_WALL_SECONDS" -eq 900
            else
              test "$R5_RECOVERY_BURST_BATCH_LIMIT" -eq 64
              test "$R5_RECOVERY_BURST_WALL_SECONDS" -eq 1800
            fi
          fi

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: latest

      - name: Rotate one-run R5 recovery verifier token
        shell: bash
        run: |
          set -euo pipefail
          recovery_token="$(openssl rand -hex 32)"
          echo "::add-mask::${recovery_token}"
          supabase secrets set XRPL_R5_RECOVERY_VERIFY_TOKEN="${recovery_token}" \
            --project-ref "$SUPABASE_PROJECT_ID"
          echo "XRPL_R5_RECOVERY_VERIFY_TOKEN=${recovery_token}" >> "$GITHUB_ENV"

      - name: Execute and verify one finite R5 recovery burst
        # The sequence-correction runner executes the reviewed controller source:
        # node scripts/verify-supabase-r5-recovery-burst-adoption-aware.mjs
        # Its retained ordinary predecessor remains:
        # node scripts/verify-supabase-r5-recovery-burst.mjs
        run: node scripts/run-supabase-r5-recovery-burst-adoption-aware.mjs

      - name: Upload sanitized burst evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-r5-recovery-burst-evidence
          path: supabase-r5-recovery-burst-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Publish sanitized R5 burst locator
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/publish-supabase-r5-recovery-burst-run-locator.mjs \
            > /tmp/r5-burst-comment.md
          test -s /tmp/r5-burst-comment.md
          gh issue comment 1175 --repo "$GITHUB_REPOSITORY" \
            --body-file /tmp/r5-burst-comment.md

  diagnose-pending-scan:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify exact read-only diagnostic marker
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          [[ "$SUPABASE_PROJECT_ID" =~ ^[a-z]{20}$ ]]
          test "$GITHUB_REF" = refs/heads/main
          marker='ops/r5/run-once-20260804-8x900-observable-v2.marker'
          test -f "$marker"
          marker_sha="$(sha256sum "$marker" | cut -d' ' -f1)"
          test "$marker_sha" = bf47940252a652535df1f6876904e0ba32302dc1906bfd3b3caf57827fc9591e
          author_login="$(
            gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" \
              --jq '.author.login'
          )"
          test "$author_login" = badjoke-lab

      - name: Read and verify the R5 pending scan boundary
        run: node scripts/diagnose-supabase-r5-pending-scan.mjs

      - name: Upload sanitized pending scan diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-r5-pending-scan-diagnostic
          path: supabase-r5-pending-scan-diagnostic
          if-no-files-found: error
          retention-days: 14

      - name: Publish sanitized pending scan diagnostic
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -s supabase-r5-pending-scan-diagnostic/diagnostic.md
          gh issue comment 1175 --repo "$GITHUB_REPOSITORY" \
            --body-file supabase-r5-pending-scan-diagnostic/diagnostic.md
