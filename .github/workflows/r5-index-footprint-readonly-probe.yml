name: R5 index footprint read-only probe

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: r5-index-footprint-readonly-probe
  cancel-in-progress: false

jobs:
  probe:
    if: >-
      github.event.issue.number == 1261 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      github.event.comment.body == '/r5-index-footprint-readonly-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Read production index footprint only
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          node scripts/r5-index-footprint-readonly-probe.mjs \
            --source-commit "$GITHUB_SHA" \
            --output-dir r5-index-footprint-readonly-probe

      - name: Read secondary index consumers and planner only
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          node scripts/r5-secondary-index-readonly-audit.mjs \
            --source-commit "$GITHUB_SHA" \
            --output-dir r5-index-footprint-readonly-probe

      - name: Read terminal transport retention candidates only
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          node scripts/r5-transport-retention-readonly-audit.mjs \
            --source-commit "$GITHUB_SHA" \
            --output-dir r5-index-footprint-readonly-probe

      - name: Read terminal transport compaction shape only
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          node scripts/r5-transport-compaction-shape-readonly-audit.mjs \
            --source-commit "$GITHUB_SHA" \
            --output-dir r5-index-footprint-readonly-probe

      - name: Read transport consumer compatibility only
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          node scripts/r5-transport-consumer-compat-readonly-audit.mjs \
            --source-commit "$GITHUB_SHA" \
            --output-dir r5-index-footprint-readonly-probe

      - name: Read historical transport consumer sources only
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          node scripts/r5-historical-transport-consumer-source-readonly-audit.mjs \
            --source-commit "$GITHUB_SHA" \
            --output-dir r5-index-footprint-readonly-probe

      - name: Read legacy revision-3 executable callers only
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          node scripts/r5-legacy-rev3-caller-readonly-audit.mjs \
            --source-commit "$GITHUB_SHA" \
            --output-dir r5-index-footprint-readonly-probe

      - name: Read exact target transport function sources only
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          node scripts/r5-transport-target-source-readonly-audit.mjs \
            --source-commit "$GITHUB_SHA" \
            --output-dir r5-index-footprint-readonly-probe

      - name: Run terminal archive Phase B preflight read-only
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          node scripts/r5-terminal-archive-phase-b-readonly-preflight.mjs \
            --source-commit "$GITHUB_SHA" \
            --output-dir r5-index-footprint-readonly-probe

      - name: Verify Phase B throughput boundary read-only
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          node scripts/r5-terminal-archive-phase-b-throughput-readonly-gate.mjs \
            --source-commit "$GITHUB_SHA" \
            --output-dir r5-index-footprint-readonly-probe

      - name: Plan terminal archive capacity read-only
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          node scripts/r5-terminal-archive-capacity-readonly-planner.mjs \
            --source-commit "$GITHUB_SHA" \
            --output-dir r5-index-footprint-readonly-probe

      - name: Upload sanitized read-only index evidence
        uses: actions/upload-artifact@v4
        with:
          name: r5-index-footprint-readonly-probe-${{ github.run_id }}
          path: r5-index-footprint-readonly-probe/
          if-no-files-found: error
          retention-days: 7

      - name: Publish sanitized read-only index result
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### R5 index footprint read-only probe'
            echo
            cat r5-index-footprint-readonly-probe/summary.md
            echo
            cat r5-index-footprint-readonly-probe/secondary-summary.md
            echo
            cat r5-index-footprint-readonly-probe/transport-summary.md
            echo
            cat r5-index-footprint-readonly-probe/transport-shape-summary.md
            echo
            cat r5-index-footprint-readonly-probe/transport-consumer-compat-summary.md
            echo
            cat r5-index-footprint-readonly-probe/historical-transport-consumer-source-summary.md
            echo
            cat r5-index-footprint-readonly-probe/legacy-rev3-caller-summary.md
            echo
            cat r5-index-footprint-readonly-probe/transport-target-source-summary.md
            echo
            cat r5-index-footprint-readonly-probe/terminal-archive-phase-b-preflight-summary.md
            echo
            cat r5-index-footprint-readonly-probe/terminal-archive-phase-b-throughput-gate-summary.md
            echo
            cat r5-index-footprint-readonly-probe/terminal-archive-capacity-planner-summary.md
            echo
            echo "Run: ${GITHUB_RUN_ID}"
            echo 'Safety: SELECT/read_only only. No index mutation, DELETE, VACUUM, scheduler mutation, deployment, Mainnet, stabilization, soak, or R5 restart is authorized.'
          } > /tmp/index-footprint-comment.md
          gh issue comment 1261 --repo "$GITHUB_REPOSITORY" --body-file /tmp/index-footprint-comment.md
