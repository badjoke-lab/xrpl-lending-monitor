name: R5 exact-source internal reuse read-only fallback

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  issues: write

concurrency:
  group: r5-exact-source-internal-reuse-fallback
  cancel-in-progress: false

jobs:
  probe:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/r5-internal-reuse-exact-source-fallback' &&
      github.event.pull_request.user.login == 'badjoke-lab' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      GH_TOKEN: ${{ github.token }}
      SOURCE_COMMIT: e378efcc981ceda46774efc8bed8dc29001c79fb
    steps:
      - name: Check out exact fixed audit source
        uses: actions/checkout@v4
        with:
          ref: e378efcc981ceda46774efc8bed8dc29001c79fb
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact source identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_COMMIT" ]]
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]

      - name: Read Phase B internal reuse only
        shell: bash
        run: |
          set -euo pipefail
          node scripts/r5-terminal-archive-phase-b-internal-reuse-readonly-audit.mjs \
            --source-commit "$SOURCE_COMMIT" \
            --output-dir r5-exact-source-internal-reuse

      - name: Upload sanitized exact-source evidence
        uses: actions/upload-artifact@v4
        with:
          name: r5-exact-source-internal-reuse-${{ github.run_id }}
          path: r5-exact-source-internal-reuse/
          if-no-files-found: error
          retention-days: 7

      - name: Publish sanitized exact-source result
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### R5 Phase B internal reuse exact-source fallback'
            echo
            cat r5-exact-source-internal-reuse/terminal-archive-phase-b-internal-reuse-summary.md
            echo
            echo "Run: ${GITHUB_RUN_ID}"
            echo "Fixed audit source commit: ${SOURCE_COMMIT}"
            echo 'Base main for this two-line SQL fix: ee2cc5ce020566901186a2524321e7838412cd66'
            echo 'Safety: SELECT/read_only only. This fallback does not authorize row/index mutation, DELETE, VACUUM, archive movement, scheduler/deployment/public-reader change, Mainnet, stabilization, soak, or R5 restart.'
          } > /tmp/r5-exact-source-internal-reuse-comment.md
          gh issue comment 1261 --repo "$GITHUB_REPOSITORY" --body-file /tmp/r5-exact-source-internal-reuse-comment.md
