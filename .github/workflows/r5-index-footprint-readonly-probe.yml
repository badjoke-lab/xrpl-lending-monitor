name: R5 terminal archive derivation read-only fallback

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  issues: write

concurrency:
  group: r5-terminal-archive-derivation-fallback
  cancel-in-progress: false

jobs:
  probe:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/r5-internal-reuse-exact-source-fallback' &&
      github.event.pull_request.user.login == 'badjoke-lab' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      GH_TOKEN: ${{ github.token }}
      SOURCE_COMMIT: 509b4f57113c7c57ca67f0c73e9ca498f76f8659
    steps:
      - name: Check out exact derivation audit source
        uses: actions/checkout@v4
        with:
          ref: 509b4f57113c7c57ca67f0c73e9ca498f76f8659
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact source identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_COMMIT" ]]
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]

      - name: Audit durable terminal membership derivation only
        shell: bash
        run: |
          set -euo pipefail
          node scripts/r5-terminal-archive-derived-membership-readonly-audit.mjs \
            --source-commit "$SOURCE_COMMIT" \
            --output-dir r5-terminal-archive-derivation

      - name: Audit durable completion-time derivation only
        shell: bash
        run: |
          set -euo pipefail
          node scripts/r5-terminal-archive-derived-completion-time-readonly-audit.mjs \
            --source-commit "$SOURCE_COMMIT" \
            --output-dir r5-terminal-archive-derivation

      - name: Upload sanitized derivation evidence
        uses: actions/upload-artifact@v4
        with:
          name: r5-terminal-archive-derivation-${{ github.run_id }}
          path: r5-terminal-archive-derivation/
          if-no-files-found: error
          retention-days: 7

      - name: Publish sanitized derivation result
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### R5 terminal archive durable derivation read-only fallback'
            echo
            cat r5-terminal-archive-derivation/derived-membership-summary.md
            echo
            cat r5-terminal-archive-derivation/derived-completion-time-summary.md
            echo
            echo "Run: ${GITHUB_RUN_ID}"
            echo "Derivation audit source commit: ${SOURCE_COMMIT}"
            echo 'Safety: SELECT/read_only only. No archive mutation/deletion, Phase B execution, restore reclaim, scheduler/deployment/public-reader change, R5 rearm, Mainnet, stabilization, or soak is authorized.'
          } > /tmp/r5-terminal-archive-derivation-comment.md
          gh issue comment 1261 --repo "$GITHUB_REPOSITORY" --body-file /tmp/r5-terminal-archive-derivation-comment.md
