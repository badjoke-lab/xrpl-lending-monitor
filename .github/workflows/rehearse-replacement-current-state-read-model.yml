name: Rehearse replacement current-state read model

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rehearse-replacement-current-state-read-model.yml'
      - 'scripts/build-replacement-current-state-read-model.ts'
      - 'src/shared/current-state/replacement-read-model.ts'
      - 'src/shared/current-state/replacement-read-model.test.ts'
      - 'vite.replacement-current-state-read-model.config.ts'
      - 'package.json'

permissions:
  actions: read
  contents: read

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Download verified base artifact
        uses: actions/download-artifact@v4
        with:
          name: current-state-release-assets
          path: .local/current-state-release
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 28699460881

      - name: Download verified Stage A artifact
        uses: actions/download-artifact@v4
        with:
          name: canonical-history-stage-a
          path: .local/canonical-stage-a
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 28795462858

      - name: Verify rehearsal inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r .complete .local/current-state-release/release-summary.json)" = "true"
          test "$(jq -r .ledger.ledgerIndex .local/current-state-release/release-summary.json)" = "3371675"
          test "$(jq -r .stageStartLedgerIndex .local/canonical-stage-a/stage-a-measurement-summary.json)" = "3371676"
          test "$(jq -r .stageEndLedgerIndex .local/canonical-stage-a/stage-a-measurement-summary.json)" = "3376675"
          test "$(jq -r .passed .local/canonical-stage-a/stage-a-measurement-summary.json)" = "true"

      - name: Build replacement compiler
        run: pnpm build:replacement-current-state-read-model

      - name: Rehearse Stage A replacement read model
        shell: bash
        run: |
          set -euo pipefail
          STARTED=$(date +%s)
          node .replacement-current-state-read-model-build/build-replacement-current-state-read-model.mjs \
            --local \
            --input-dir .local/current-state-release/assets \
            --history-root .local/canonical-stage-a \
            --publication .local/canonical-stage-a/history/publication.json \
            --output-dir .local/replacement-stage-a \
            --page-size 50 \
            --lookup-prefix-length 3 \
            > .local/replacement-stage-a-output.json
          ELAPSED=$(( $(date +%s) - STARTED ))
          echo "$ELAPSED" > .local/replacement-stage-a-elapsed-seconds.txt

      - name: Verify replacement output
        shell: bash
        run: |
          set -euo pipefail
          SUMMARY=.local/replacement-stage-a/replacement-read-model-summary.json
          MANIFEST=.local/replacement-stage-a/read-model/manifest.json
          test "$(jq -r .target.ledgerIndex "$SUMMARY")" = "3376675"
          test "$(jq -r .target.ledgerHash "$SUMMARY")" = "4FBAE14F2EB86369228F8C58D7DADC4A334CC05DED7C2C20667FA8C9B90F6463"
          test "$(jq -r .segmentCount "$SUMMARY")" = "10"
          test "$(jq -r .ledgerCount "$SUMMARY")" = "5000"
          test "$(jq -r .mutationStats.records "$SUMMARY")" = "61"
          test "$(jq -r .ledgerIndex "$MANIFEST")" = "3376675"
          test "$(find .local/replacement-stage-a/read-model/lookup -type f | wc -l)" = "4096"
          PAGE_COUNT=$(find .local/replacement-stage-a/read-model/pages -type f | wc -l)
          test "$PAGE_COUNT" -gt 30000
          jq -n \
            --argjson elapsedSeconds "$(cat .local/replacement-stage-a-elapsed-seconds.txt)" \
            --argjson pageFiles "$PAGE_COUNT" \
            --slurpfile summary "$SUMMARY" \
            '{schemaVersion:1,passed:true,elapsedSeconds:$elapsedSeconds,pageFiles:$pageFiles,replacement:$summary[0]}' \
            > .local/replacement-stage-a-evidence.json
          cat .local/replacement-stage-a-evidence.json

      - name: Upload replacement rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replacement-current-state-stage-a-evidence
          path: |
            .local/replacement-stage-a-evidence.json
            .local/replacement-stage-a/replacement-read-model-summary.json
            .local/replacement-stage-a/read-model/manifest.json
          if-no-files-found: warn
          retention-days: 30
