name: Cancel obsolete current-state runs

on:
  push:
    branches:
      - main
    paths:
      - .github/cancel-obsolete-current-state-runs-trigger

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel obsolete full traversals
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for RUN_ID in 28700014957 28700600596; do
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/cancel" >/dev/null 2>&1 || true
          done
