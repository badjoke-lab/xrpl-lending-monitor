name: P0 fast-lane manual cycle

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:deploy-assets

      - name: Expose scheduled test route to the Worker
        shell: bash
        run: |
          node <<'EOF'
          const fs = require('node:fs')
          const path = 'wrangler.jsonc'
          const config = JSON.parse(fs.readFileSync(path, 'utf8'))
          const current = Array.isArray(config.assets?.run_worker_first) ? config.assets.run_worker_first : []
          config.assets.run_worker_first = [...new Set([...current, '/__scheduled*'])]
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n')
          EOF

      - name: Invoke one remote scheduled cycle and capture logs
        shell: bash
        run: |
          set -uo pipefail
          : > wrangler-dev.log
          pnpm exec wrangler dev --remote --test-scheduled --ip 127.0.0.1 --port 8787 > wrangler-dev.log 2>&1 &
          PID=$!
          cleanup() { kill "$PID" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          READY=0
          for _ in $(seq 1 45); do
            if curl --silent --fail --max-time 2 http://127.0.0.1:8787/ >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -eq 1 ]; then
            curl --silent --show-error --max-time 120 \
              -D scheduled-response-headers.txt \
              -o scheduled-response-body.txt \
              'http://127.0.0.1:8787/__scheduled?cron=%2A%2F5%20%2A%20%2A%20%2A%20%2A' \
              || true
            sleep 20
          else
            printf '%s\n' 'wrangler dev did not become ready' > scheduled-response-body.txt
            : > scheduled-response-headers.txt
          fi
          cleanup
          wait "$PID" || true

      - name: Capture D1 state after manual cycle
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler d1 execute xrpl-lending-monitor --remote \
            --command "SELECT epoch_id,last_processed_ledger,last_processed_hash,latest_observed_ledger,latest_observed_hash,status,updated_at FROM fast_lane_shadow_state WHERE network='devnet';" \
            --json > state-raw.txt
          sed -n '/^\[/,$p' state-raw.txt > state.json
          pnpm exec wrangler d1 execute xrpl-lending-monitor --remote \
            --command "SELECT run_at,status,start_ledger_index,end_ledger_index,latest_observed_ledger,lag_ledgers,ledgers_processed,persistence_rows_written FROM fast_lane_shadow_run_metrics WHERE network='devnet' ORDER BY run_at DESC LIMIT 12;" \
            --json > metrics-raw.txt
          sed -n '/^\[/,$p' metrics-raw.txt > metrics.json
          tail -n 240 wrangler-dev.log > wrangler-dev-tail.log || true
          jq -n \
            --arg capturedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --rawfile responseHeaders scheduled-response-headers.txt \
            --rawfile responseBody scheduled-response-body.txt \
            --rawfile wranglerLog wrangler-dev-tail.log \
            --slurpfile state state.json \
            --slurpfile metrics metrics.json \
            '{capturedAt:$capturedAt,responseHeaders:$responseHeaders,responseBody:$responseBody,wranglerLog:$wranglerLog,state:$state[0],metrics:$metrics[0]}' \
            > result.json

      - uses: actions/upload-artifact@v4
        with:
          name: p0-fast-lane-manual-cycle
          path: result.json
          retention-days: 14
