name: P0 recover rolling checkpoint backlog

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: p0-rolling-overlay-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: startsWith(github.event.issue.title, 'P0 recover rolling checkpoint backlog')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      MAX_DELTA_LEDGERS: '5000'
      SEGMENT_LEDGERS: '500'
      READ_WINDOW_SIZE: '4'
      MAX_CYCLES: '16'
      TARGET_MAX_LAG_LEDGERS: '300'
      PRODUCTION_HISTORY_BRANCH: history-data
      PRODUCTION_CURRENT_BRANCH: current-state-data
      CANDIDATE_HISTORY_A: history-rolling-maintenance-candidate-data
      CANDIDATE_CURRENT_A: current-state-rolling-maintenance-candidate-data
      CANDIDATE_HISTORY_B: history-rolling-recovery-b-data
      CANDIDATE_CURRENT_B: current-state-rolling-recovery-b-data
    steps:
      - uses: actions/checkout@v4

      - name: Build resumable near-head candidate
        shell: bash
        run: |
          set -euo pipefail
          ROOT=p0-rolling-backlog-recovery
          mkdir -p "${ROOT}"
          : > "${ROOT}/cycles.ndjson"

          fetch_repo_json() {
            local branch="$1"
            local path="$2"
            local output="$3"
            for attempt in $(seq 1 30); do
              if gh api --method GET \
                "repos/${REPOSITORY}/contents/${path}" \
                -f ref="${branch}" --jq '.content' 2>/dev/null \
                | tr -d '\n' | base64 --decode > "${output}"; then
                test -s "${output}" && return 0
              fi
              sleep 10
            done
            return 1
          }

          try_pair() {
            local history_branch="$1"
            local current_branch="$2"
            local prefix="$3"
            if ! fetch_repo_json "${history_branch}" history/publication.json "${ROOT}/${prefix}-publication.json"; then
              return 1
            fi
            if ! fetch_repo_json "${current_branch}" read-model/manifest.json "${ROOT}/${prefix}-manifest.json"; then
              return 1
            fi
            local history_ledger history_hash current_ledger current_hash history_epoch current_epoch
            history_ledger="$(jq -r '.endLedgerIndex // empty' "${ROOT}/${prefix}-publication.json")"
            history_hash="$(jq -r '.endLedgerHash // empty' "${ROOT}/${prefix}-publication.json")"
            current_ledger="$(jq -r '.ledgerIndex // empty' "${ROOT}/${prefix}-manifest.json")"
            current_hash="$(jq -r '.ledgerHash // empty' "${ROOT}/${prefix}-manifest.json")"
            history_epoch="$(jq -r '.epochId // empty' "${ROOT}/${prefix}-publication.json")"
            current_epoch="$(jq -r '.epochId // empty' "${ROOT}/${prefix}-manifest.json")"
            test "$(jq -r '.complete' "${ROOT}/${prefix}-publication.json")" = true
            test "$(jq -r '.complete' "${ROOT}/${prefix}-manifest.json")" = true
            test "${history_ledger}" = "${current_ledger}"
            test "${history_hash}" = "${current_hash}"
            test "${history_epoch}" = devnet-3371675
            test "${current_epoch}" = devnet-3371675
            printf '%s\t%s\t%s\t%s\n' "${history_ledger}" "${history_hash}" "${history_branch}" "${current_branch}"
          }

          capture_live_head() {
            local prefix="$1"
            jq -n '{method:"ledger",params:[{ledger_index:"validated",transactions:false,expand:false}]}' \
              > "${ROOT}/${prefix}-head-request.json"
            curl --fail-with-body --silent --show-error --retry 3 \
              -H 'content-type: application/json' \
              --data @"${ROOT}/${prefix}-head-request.json" \
              https://devnet.honeycluster.io/ \
              > "${ROOT}/${prefix}-head-response.json"
            jq -r '.result.ledger_index // .result.ledger.ledger_index' \
              "${ROOT}/${prefix}-head-response.json"
          }

          PRODUCTION_PAIR="$(try_pair "${PRODUCTION_HISTORY_BRANCH}" "${PRODUCTION_CURRENT_BRANCH}" production)"
          test -n "${PRODUCTION_PAIR}"
          BEST_PAIR="${PRODUCTION_PAIR}"
          PRODUCTION_LEDGER="$(printf '%s' "${PRODUCTION_PAIR}" | cut -f1)"

          for candidate in A B; do
            if [ "${candidate}" = A ]; then
              H="${CANDIDATE_HISTORY_A}"
              C="${CANDIDATE_CURRENT_A}"
            else
              H="${CANDIDATE_HISTORY_B}"
              C="${CANDIDATE_CURRENT_B}"
            fi
            if PAIR="$(try_pair "${H}" "${C}" "candidate-${candidate}" 2>/dev/null)"; then
              LEDGER="$(printf '%s' "${PAIR}" | cut -f1)"
              BEST_LEDGER="$(printf '%s' "${BEST_PAIR}" | cut -f1)"
              if [ "${LEDGER}" -ge "${PRODUCTION_LEDGER}" ] && [ "${LEDGER}" -gt "${BEST_LEDGER}" ]; then
                BEST_PAIR="${PAIR}"
              fi
            fi
          done

          SOURCE_LEDGER="$(printf '%s' "${BEST_PAIR}" | cut -f1)"
          SOURCE_HASH="$(printf '%s' "${BEST_PAIR}" | cut -f2)"
          SOURCE_HISTORY="$(printf '%s' "${BEST_PAIR}" | cut -f3)"
          SOURCE_CURRENT="$(printf '%s' "${BEST_PAIR}" | cut -f4)"

          if [ "${SOURCE_HISTORY}" = "${CANDIDATE_HISTORY_A}" ]; then
            OUTPUT_HISTORY="${CANDIDATE_HISTORY_B}"
            OUTPUT_CURRENT="${CANDIDATE_CURRENT_B}"
          else
            OUTPUT_HISTORY="${CANDIDATE_HISTORY_A}"
            OUTPUT_CURRENT="${CANDIDATE_CURRENT_A}"
          fi

          jq -n \
            --arg historyBranch "${SOURCE_HISTORY}" \
            --arg currentBranch "${SOURCE_CURRENT}" \
            --argjson ledgerIndex "${SOURCE_LEDGER}" \
            --arg ledgerHash "${SOURCE_HASH}" \
            '{resumedFrom:{historyBranch:$historyBranch,currentStateBranch:$currentBranch,ledgerIndex:$ledgerIndex,ledgerHash:$ledgerHash}}' \
            > "${ROOT}/resume.json"

          for CYCLE in $(seq 1 "${MAX_CYCLES}"); do
            CYCLE_ROOT="${ROOT}/cycle-${CYCLE}"
            mkdir -p "${CYCLE_ROOT}"

            fetch_repo_json "${SOURCE_HISTORY}" history/publication.json "${CYCLE_ROOT}/source-publication.json"
            fetch_repo_json "${SOURCE_CURRENT}" read-model/manifest.json "${CYCLE_ROOT}/source-current-manifest.json"
            SOURCE_LEDGER="$(jq -r '.endLedgerIndex' "${CYCLE_ROOT}/source-publication.json")"
            SOURCE_HASH="$(jq -r '.endLedgerHash' "${CYCLE_ROOT}/source-publication.json")"
            test "${SOURCE_LEDGER}" = "$(jq -r '.ledgerIndex' "${CYCLE_ROOT}/source-current-manifest.json")"
            test "${SOURCE_HASH}" = "$(jq -r '.ledgerHash' "${CYCLE_ROOT}/source-current-manifest.json")"

            LIVE_BEFORE="$(capture_live_head "cycle-${CYCLE}-before")"
            LAG_BEFORE="$((LIVE_BEFORE - SOURCE_LEDGER))"
            if [ "${LAG_BEFORE}" -lt 0 ]; then LAG_BEFORE=0; fi
            if [ "${LAG_BEFORE}" -le "${TARGET_MAX_LAG_LEDGERS}" ]; then
              jq -n \
                --argjson cycle "${CYCLE}" \
                --arg sourceHistory "${SOURCE_HISTORY}" \
                --arg sourceCurrent "${SOURCE_CURRENT}" \
                --argjson sourceLedger "${SOURCE_LEDGER}" \
                --arg sourceHash "${SOURCE_HASH}" \
                --argjson liveLedger "${LIVE_BEFORE}" \
                --argjson lagLedgers "${LAG_BEFORE}" \
                '{cycle:$cycle,skipped:true,reason:"target_lag_reached",source:{historyBranch:$sourceHistory,currentStateBranch:$sourceCurrent,ledgerIndex:$sourceLedger,ledgerHash:$sourceHash},live:{ledgerIndex:$liveLedger,lagLedgers:$lagLedgers}}' \
                >> "${ROOT}/cycles.ndjson"
              break
            fi

            gh api "repos/${REPOSITORY}/actions/workflows/rolling-checkpoint-candidate.yml/runs?event=workflow_dispatch&per_page=100" \
              --jq '.workflow_runs[].id' > "${CYCLE_ROOT}/run-ids-before.txt"

            jq -n \
              --arg ref main \
              --arg sourceHistory "${SOURCE_HISTORY}" \
              --arg sourceCurrent "${SOURCE_CURRENT}" \
              --arg outputHistory "${OUTPUT_HISTORY}" \
              --arg outputCurrent "${OUTPUT_CURRENT}" \
              --arg maxDelta "${MAX_DELTA_LEDGERS}" \
              --arg segment "${SEGMENT_LEDGERS}" \
              --arg window "${READ_WINDOW_SIZE}" \
              '{ref:$ref,inputs:{source_history_branch:$sourceHistory,source_current_state_branch:$sourceCurrent,history_candidate_branch:$outputHistory,current_state_candidate_branch:$outputCurrent,max_delta_ledgers:$maxDelta,segment_ledgers:$segment,read_window_size:$window}}' \
              > "${CYCLE_ROOT}/dispatch.json"
            gh api --method POST \
              "repos/${REPOSITORY}/actions/workflows/rolling-checkpoint-candidate.yml/dispatches" \
              --input "${CYCLE_ROOT}/dispatch.json"

            RUN_ID=''
            for attempt in $(seq 1 60); do
              gh api "repos/${REPOSITORY}/actions/workflows/rolling-checkpoint-candidate.yml/runs?event=workflow_dispatch&per_page=100" \
                > "${CYCLE_ROOT}/runs-after.json"
              while IFS= read -r candidate_id; do
                if ! grep -Fxq "${candidate_id}" "${CYCLE_ROOT}/run-ids-before.txt"; then
                  RUN_ID="${candidate_id}"
                  break
                fi
              done < <(jq -r '.workflow_runs | sort_by(.created_at) | reverse | .[].id' "${CYCLE_ROOT}/runs-after.json")
              test -n "${RUN_ID}" && break
              sleep 10
            done
            test -n "${RUN_ID}"
            printf '%s\n' "${RUN_ID}" > "${CYCLE_ROOT}/run-id.txt"

            for attempt in $(seq 1 720); do
              gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}" > "${CYCLE_ROOT}/run.json"
              STATUS="$(jq -r '.status' "${CYCLE_ROOT}/run.json")"
              test "${STATUS}" = completed && break
              sleep 30
            done
            test "$(jq -r '.status' "${CYCLE_ROOT}/run.json")" = completed
            test "$(jq -r '.conclusion' "${CYCLE_ROOT}/run.json")" = success

            gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" > "${CYCLE_ROOT}/jobs.json"
            for REQUIRED_STEP in \
              'Bind source pair and freeze bounded target' \
              'Generate bounded delta with configured read window' \
              'Verify delta and build target publication' \
              'Build target exact index incrementally' \
              'Build target current state from best available base' \
              'Publish history candidate branch' \
              'Publish current-state candidate branch' \
              'Rehearse remote candidate pair' \
              'Build retained candidate evidence'; do
              jq -e --arg name "${REQUIRED_STEP}" \
                '[.jobs[].steps[] | select(.name == $name)] | length == 1 and .[0].conclusion == "success"' \
                "${CYCLE_ROOT}/jobs.json" > /dev/null
            done

            fetch_repo_json "${OUTPUT_HISTORY}" history/publication.json "${CYCLE_ROOT}/output-publication.json"
            fetch_repo_json "${OUTPUT_CURRENT}" read-model/manifest.json "${CYCLE_ROOT}/output-current-manifest.json"
            OUTPUT_LEDGER="$(jq -r '.endLedgerIndex' "${CYCLE_ROOT}/output-publication.json")"
            OUTPUT_HASH="$(jq -r '.endLedgerHash' "${CYCLE_ROOT}/output-publication.json")"
            test "${OUTPUT_LEDGER}" -gt "${SOURCE_LEDGER}"
            test "${OUTPUT_LEDGER}" -le "$((SOURCE_LEDGER + MAX_DELTA_LEDGERS))"
            test "${OUTPUT_LEDGER}" = "$(jq -r '.ledgerIndex' "${CYCLE_ROOT}/output-current-manifest.json")"
            test "${OUTPUT_HASH}" = "$(jq -r '.ledgerHash' "${CYCLE_ROOT}/output-current-manifest.json")"

            jq -n --argjson ledger "${OUTPUT_LEDGER}" \
              '{method:"ledger",params:[{ledger_index:$ledger,transactions:false,expand:false}]}' \
              > "${CYCLE_ROOT}/output-ledger-request.json"
            curl --fail-with-body --silent --show-error --retry 3 \
              -H 'content-type: application/json' \
              --data @"${CYCLE_ROOT}/output-ledger-request.json" \
              https://devnet.honeycluster.io/ \
              > "${CYCLE_ROOT}/output-ledger-response.json"
            test "${OUTPUT_HASH}" = "$(jq -r '.result.ledger_hash // .result.ledger.ledger_hash' "${CYCLE_ROOT}/output-ledger-response.json")"

            LIVE_AFTER="$(capture_live_head "cycle-${CYCLE}-after")"
            LAG_AFTER="$((LIVE_AFTER - OUTPUT_LEDGER))"
            if [ "${LAG_AFTER}" -lt 0 ]; then LAG_AFTER=0; fi
            jq -n \
              --argjson cycle "${CYCLE}" \
              --argjson runId "${RUN_ID}" \
              --arg sourceHistory "${SOURCE_HISTORY}" \
              --arg sourceCurrent "${SOURCE_CURRENT}" \
              --argjson sourceLedger "${SOURCE_LEDGER}" \
              --arg outputHistory "${OUTPUT_HISTORY}" \
              --arg outputCurrent "${OUTPUT_CURRENT}" \
              --argjson outputLedger "${OUTPUT_LEDGER}" \
              --arg outputHash "${OUTPUT_HASH}" \
              --argjson liveLedger "${LIVE_AFTER}" \
              --argjson lagLedgers "${LAG_AFTER}" \
              '{cycle:$cycle,passed:true,childRunId:$runId,source:{historyBranch:$sourceHistory,currentStateBranch:$sourceCurrent,ledgerIndex:$sourceLedger},output:{historyBranch:$outputHistory,currentStateBranch:$outputCurrent,ledgerIndex:$outputLedger,ledgerHash:$outputHash},live:{ledgerIndex:$liveLedger,lagLedgers:$lagLedgers}}' \
              | tee "${CYCLE_ROOT}/summary.json" >> "${ROOT}/cycles.ndjson"

            SOURCE_HISTORY="${OUTPUT_HISTORY}"
            SOURCE_CURRENT="${OUTPUT_CURRENT}"
            SOURCE_LEDGER="${OUTPUT_LEDGER}"
            SOURCE_HASH="${OUTPUT_HASH}"
            if [ "${OUTPUT_HISTORY}" = "${CANDIDATE_HISTORY_A}" ]; then
              OUTPUT_HISTORY="${CANDIDATE_HISTORY_B}"
              OUTPUT_CURRENT="${CANDIDATE_CURRENT_B}"
            else
              OUTPUT_HISTORY="${CANDIDATE_HISTORY_A}"
              OUTPUT_CURRENT="${CANDIDATE_CURRENT_A}"
            fi
            test "${LAG_AFTER}" -le "${TARGET_MAX_LAG_LEDGERS}" && break
          done

          jq -s '.' "${ROOT}/cycles.ndjson" > "${ROOT}/cycles.json"
          fetch_repo_json "${SOURCE_HISTORY}" history/publication.json "${ROOT}/final-publication.json"
          fetch_repo_json "${SOURCE_CURRENT}" read-model/manifest.json "${ROOT}/final-current-manifest.json"
          FINAL_LEDGER="$(jq -r '.endLedgerIndex' "${ROOT}/final-publication.json")"
          FINAL_HASH="$(jq -r '.endLedgerHash' "${ROOT}/final-publication.json")"
          test "${FINAL_LEDGER}" = "$(jq -r '.ledgerIndex' "${ROOT}/final-current-manifest.json")"
          test "${FINAL_HASH}" = "$(jq -r '.ledgerHash' "${ROOT}/final-current-manifest.json")"
          FINAL_LIVE="$(capture_live_head final)"
          FINAL_LAG="$((FINAL_LIVE - FINAL_LEDGER))"
          if [ "${FINAL_LAG}" -lt 0 ]; then FINAL_LAG=0; fi

          jq -n \
            --arg historyBranch "${SOURCE_HISTORY}" \
            --arg currentStateBranch "${SOURCE_CURRENT}" \
            --argjson ledgerIndex "${FINAL_LEDGER}" \
            --arg ledgerHash "${FINAL_HASH}" \
            --argjson liveLedger "${FINAL_LIVE}" \
            --argjson remainingLagLedgers "${FINAL_LAG}" \
            --argjson targetMaxLagLedgers "${TARGET_MAX_LAG_LEDGERS}" \
            --slurpfile cycles "${ROOT}/cycles.json" \
            '{passed:($remainingLagLedgers <= $targetMaxLagLedgers),finalCandidate:{historyBranch:$historyBranch,currentStateBranch:$currentStateBranch,ledgerIndex:$ledgerIndex,ledgerHash:$ledgerHash},live:{ledgerIndex:$liveLedger,remainingLagLedgers:$remainingLagLedgers,targetMaxLagLedgers:$targetMaxLagLedgers},cycles:$cycles[0]}' \
            | tee "${ROOT}/catchup-summary.json"
          jq -e '.passed == true' "${ROOT}/catchup-summary.json" > /dev/null

          echo "FINAL_HISTORY_BRANCH=${SOURCE_HISTORY}" >> "${GITHUB_ENV}"
          echo "FINAL_CURRENT_BRANCH=${SOURCE_CURRENT}" >> "${GITHUB_ENV}"
          echo "FINAL_TARGET_LEDGER=${FINAL_LEDGER}" >> "${GITHUB_ENV}"
          echo "FINAL_TARGET_HASH=${FINAL_HASH}" >> "${GITHUB_ENV}"

      - name: Dispatch guarded production cutover
        shell: bash
        run: |
          set -euo pipefail
          ROOT=p0-rolling-backlog-recovery
          gh api "repos/${REPOSITORY}/actions/workflows/rolling-checkpoint-live-cutover.yml/runs?event=workflow_dispatch&per_page=100" \
            --jq '.workflow_runs[].id' > "${ROOT}/cutover-run-ids-before.txt"
          jq -n \
            --arg ref main \
            --arg history "${FINAL_HISTORY_BRANCH}" \
            --arg current "${FINAL_CURRENT_BRANCH}" \
            '{ref:$ref,inputs:{history_candidate_branch:$history,current_state_candidate_branch:$current,confirm_production_write:"true"}}' \
            > "${ROOT}/cutover-dispatch.json"
          gh api --method POST \
            "repos/${REPOSITORY}/actions/workflows/rolling-checkpoint-live-cutover.yml/dispatches" \
            --input "${ROOT}/cutover-dispatch.json"

          CUTOVER_RUN_ID=''
          for attempt in $(seq 1 60); do
            gh api "repos/${REPOSITORY}/actions/workflows/rolling-checkpoint-live-cutover.yml/runs?event=workflow_dispatch&per_page=100" \
              > "${ROOT}/cutover-runs-after.json"
            while IFS= read -r candidate_id; do
              if ! grep -Fxq "${candidate_id}" "${ROOT}/cutover-run-ids-before.txt"; then
                CUTOVER_RUN_ID="${candidate_id}"
                break
              fi
            done < <(jq -r '.workflow_runs | sort_by(.created_at) | reverse | .[].id' "${ROOT}/cutover-runs-after.json")
            test -n "${CUTOVER_RUN_ID}" && break
            sleep 10
          done
          test -n "${CUTOVER_RUN_ID}"
          printf '%s\n' "${CUTOVER_RUN_ID}" > "${ROOT}/cutover-run-id.txt"

          for attempt in $(seq 1 180); do
            gh api "repos/${REPOSITORY}/actions/runs/${CUTOVER_RUN_ID}" > "${ROOT}/cutover-run.json"
            STATUS="$(jq -r '.status' "${ROOT}/cutover-run.json")"
            test "${STATUS}" = completed && break
            sleep 30
          done
          test "$(jq -r '.status' "${ROOT}/cutover-run.json")" = completed
          test "$(jq -r '.conclusion' "${ROOT}/cutover-run.json")" = success
          echo "CUTOVER_RUN_ID=${CUTOVER_RUN_ID}" >> "${GITHUB_ENV}"

      - name: Record successful recovery
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment "${ISSUE_NUMBER}" --repo "${REPOSITORY}" --body \
            "Rolling checkpoint backlog recovery and guarded production cutover succeeded. Final candidate ledger: ${FINAL_TARGET_LEDGER}. Cutover run ID: ${CUTOVER_RUN_ID}."

      - name: Upload recovery evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: p0-rolling-backlog-recovery
          path: p0-rolling-backlog-recovery
          if-no-files-found: warn
          retention-days: 30
