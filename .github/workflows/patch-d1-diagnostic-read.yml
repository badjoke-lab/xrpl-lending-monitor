name: Patch D1 diagnostic read query

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/patch-d1-diagnostic-read.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Add indexed object-type lookup to overlay evidence query
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/worker/repositories/live-continuation-verification.ts')
          text = path.read_text()
          old = """                  AND c.epoch_id = o.epoch_id
                  AND c.object_id = o.object_id
"""
          new = """                  AND c.epoch_id = o.epoch_id
                  AND c.object_type = CASE o.object_type
                    WHEN 'vault' THEN 'Vault'
                    WHEN 'loan_broker' THEN 'LoanBroker'
                    WHEN 'loan' THEN 'Loan'
                  END
                  AND c.object_id = o.object_id
"""
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected 2 overlay/object-change correlation anchors, found {count}')
          path.write_text(text.replace(old, new))
          Path('.github/workflows/patch-d1-diagnostic-read.yml').unlink()
      - name: Commit optimized diagnostic query
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Use indexed object-type lookup in HYB-7 overlay evidence"
          git push origin HEAD:${GITHUB_HEAD_REF}
