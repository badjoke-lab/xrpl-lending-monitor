name: Mobile selector fix
on:
  pull_request:
    paths:
      - .github/workflows/mobile-selector-fix.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-more-menu
      - name: Update mobile More selectors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              "page.locator('.mobile-bottom-nav summary').click()": "page.locator('.mobile-bottom-nav').getByRole('button', { name: 'More' }).click()",
              "page.locator('.mobile-bottom-nav details').click()": "page.locator('.mobile-bottom-nav').getByRole('button', { name: 'More' }).click()",
          }
          for path in Path('tests/e2e').glob('*.spec.ts'):
              text = path.read_text()
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated)
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/e2e
          git commit -m "Align remaining mobile More E2E selectors"
          git push origin HEAD:fix/mobile-more-menu
