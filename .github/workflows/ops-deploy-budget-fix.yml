name: Deploy incremental budget fix and verify catch-up

on:
  push:
    branches:
      - ops/deploy-budget-fix
    paths:
      - .github/workflows/ops-deploy-budget-fix.yml

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate repository
        run: pnpm check
      - name: Deploy Worker
        run: pnpm exec wrangler deploy
      - name: Wait for scheduled collector cycles
        run: sleep 125
      - name: Capture post-deploy runtime evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p post-deploy-evidence

          curl -sS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            > post-deploy-evidence/workers-subdomain.json

          SUBDOMAIN="$(jq -r '.result.subdomain // empty' post-deploy-evidence/workers-subdomain.json)"
          BASE="https://xrpl-lending-monitor.${SUBDOMAIN}.workers.dev"
          printf '%s\n' "${BASE}" > post-deploy-evidence/base-url.txt

          for NAME in catch-up-initialization collector continuation-verification m1-exit; do
            URL="${BASE}/api/status/${NAME}"
            STATUS="$(curl -sS -o "post-deploy-evidence/${NAME}.json" -w '%{http_code}' "${URL}" || true)"
            printf '%s\n' "${STATUS}" > "post-deploy-evidence/${NAME}.http-status.txt"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: post-deploy-evidence
          path: post-deploy-evidence
          if-no-files-found: error
