name: Dispatch recovery cycle A

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-recovery-cycle-a.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch next 5000-ledger candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n '{ref:"main",inputs:{source_history_branch:"history-rolling-recovery-b-data",source_current_state_branch:"current-state-rolling-recovery-b-data",history_candidate_branch:"history-rolling-next-candidate-data",current_state_candidate_branch:"current-state-rolling-next-candidate-data",max_delta_ledgers:"5000",segment_ledgers:"500",read_window_size:"4"}}' > dispatch.json
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/rolling-checkpoint-candidate.yml/dispatches" --input dispatch.json
