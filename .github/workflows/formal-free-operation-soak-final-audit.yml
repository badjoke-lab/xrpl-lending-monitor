name: Formal Free-operation soak final audit

on:
  push:
    branches: [main]
    paths:
      - .github/formal-free-soak-final-audit-trigger

permissions:
  contents: read
  issues: write

concurrency:
  group: formal-free-soak-final-audit
  cancel-in-progress: false

jobs:
  final-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: '962'
      PRODUCTION_BASE: https://xrpl-lending-monitor.badjoke-lab.workers.dev
      TARGET_EPOCH: devnet-3371675
      TARGET_SNAPSHOT: devnet-3800885-eaa0d29666e7
      TARGET_LEDGER: '3800885'
      TARGET_HASH: EAA0D29666E73D7594A52DF8000B07F346CD4DA24A9A07549612CDC7D727B700
      SOAK_START: '2026-07-22T00:15:00Z'
      SOAK_END: '2026-07-23T00:15:00Z'
    steps:
      - name: Check out implementation
        uses: actions/checkout@v4

      - name: Check out current-state publication identity
        uses: actions/checkout@v4
        with:
          ref: current-state-data
          path: .local/current-state
          sparse-checkout: read-model/manifest.json
          sparse-checkout-cone-mode: false

      - name: Check out history publication identity
        uses: actions/checkout@v4
        with:
          ref: history-data
          path: .local/history
          sparse-checkout: history/publication.json
          sparse-checkout-cone-mode: false

      - name: Audit all 288 exact slots and final production state
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p final-soak-evidence

          now_epoch="$(date -u +%s)"
          end_epoch="$(date -u -d "$SOAK_END" +%s)"
          test "$now_epoch" -ge "$end_epoch"

          gh issue view "$ISSUE_NUMBER" --repo "$REPOSITORY" --json state,title,labels > final-soak-evidence/issue-before.json
          issue_open="$(jq '.state=="OPEN" and (.title|startswith("FAILED")|not) and (.title|startswith("NOT STARTED")|not)' final-soak-evidence/issue-before.json)"

          query_d1() {
            local sql="$1"
            local output="$2"
            jq -n --arg sql "$sql" '{sql:$sql}' \
              | curl --fail-with-body --silent --show-error \
                  -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  -H 'Content-Type: application/json' --data-binary @- \
                  "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query" > "$output"
            jq -e '.success==true and ((.errors // [])|length)==0 and ([.result[].success]|all)' "$output" > /dev/null
          }

          start_epoch="$(date -u -d "$SOAK_START" +%s)"
          start_slot=$((start_epoch / 300))
          end_slot=$((start_slot + 287))

          SLOTS_SQL=$(cat <<SQL
          WITH base AS (
            SELECT run_at,status,end_ledger_index,latest_observed_ledger,lag_ledgers,error_message,
                   CAST(strftime('%s',run_at)/300 AS INTEGER) AS slot_id
            FROM fast_lane_shadow_run_metrics
            WHERE network='devnet'
              AND CAST(strftime('%s',run_at)/300 AS INTEGER) BETWEEN ${start_slot} AND ${end_slot}
          ), ranked AS (
            SELECT *,ROW_NUMBER() OVER (PARTITION BY slot_id ORDER BY run_at DESC) AS terminal_rank,
                   COUNT(*) OVER (PARTITION BY slot_id) AS runs_in_slot,
                   SUM(CASE WHEN status='error' OR error_message IS NOT NULL THEN 1 ELSE 0 END) OVER (PARTITION BY slot_id) AS errors_in_slot
            FROM base
          ), terminal AS (
            SELECT slot_id,run_at,status,end_ledger_index,latest_observed_ledger,lag_ledgers,error_message,runs_in_slot,errors_in_slot
            FROM ranked WHERE terminal_rank=1
          )
          SELECT COUNT(*) AS slot_count,MIN(slot_id) AS first_slot,MAX(slot_id) AS last_slot,
                 SUM(CASE WHEN status NOT IN ('committed','caught_up') OR lag_ledgers<>0 OR error_message IS NOT NULL OR end_ledger_index IS NULL THEN 1 ELSE 0 END) AS terminal_failures,
                 COALESCE(SUM(errors_in_slot),0) AS errors_in_slots,
                 COALESCE(MAX(lag_ledgers),0) AS max_terminal_lag,
                 MIN(run_at) AS first_terminal_run,MAX(run_at) AS last_terminal_run,
                 SUM(runs_in_slot) AS total_attempt_rows
          FROM terminal
          SQL
          )
          query_d1 "$SLOTS_SQL" final-soak-evidence/slots-summary.json
          query_d1 "WITH base AS (SELECT run_at,status,end_ledger_index,latest_observed_ledger,lag_ledgers,error_message,CAST(strftime('%s',run_at)/300 AS INTEGER) AS slot_id FROM fast_lane_shadow_run_metrics WHERE network='devnet' AND CAST(strftime('%s',run_at)/300 AS INTEGER) BETWEEN ${start_slot} AND ${end_slot}),ranked AS (SELECT *,ROW_NUMBER() OVER (PARTITION BY slot_id ORDER BY run_at DESC) AS terminal_rank,SUM(CASE WHEN status='error' OR error_message IS NOT NULL THEN 1 ELSE 0 END) OVER (PARTITION BY slot_id) AS errors_in_slot FROM base) SELECT slot_id,run_at,status,end_ledger_index,latest_observed_ledger,lag_ledgers,error_message,errors_in_slot FROM ranked WHERE terminal_rank=1 ORDER BY slot_id" final-soak-evidence/slots-detail.json
          query_d1 "SELECT last_processed_ledger,latest_observed_ledger,last_processed_hash,latest_observed_hash,status,updated_at,(latest_observed_ledger-last_processed_ledger) AS lag_ledgers FROM fast_lane_shadow_state WHERE network='devnet'" final-soak-evidence/state.json
          query_d1 "SELECT base_epoch_id,base_snapshot_id,base_ledger_index,base_ledger_hash FROM fast_lane_shadow_base_binding WHERE network='devnet'" final-soak-evidence/binding.json
          query_d1 "SELECT COUNT(*) AS overlay_rows,COALESCE(SUM(LENGTH(projection_json)),0) AS overlay_payload_bytes FROM current_state_overlay_objects WHERE network='devnet'" final-soak-evidence/overlay.json
          query_d1 "SELECT COUNT(*) AS stale_rows FROM current_state_overlay_objects o WHERE o.network='devnet' AND NOT EXISTS (SELECT 1 FROM fast_lane_shadow_base_binding b WHERE b.network=o.network AND b.base_epoch_id=o.epoch_id AND b.base_snapshot_id=o.base_snapshot_id)" final-soak-evidence/stale.json
          query_d1 "SELECT COUNT(*) AS state_rows,MAX(overlay_ledger_index) AS overlay_ledger_index FROM current_state_overlay_state WHERE network='devnet'" final-soak-evidence/overlay-state.json
          query_d1 "SELECT COUNT(*) AS compact_rows FROM fast_lane_shadow_objects_compact WHERE network='devnet'" final-soak-evidence/compact.json
          query_d1 "SELECT COUNT(*) AS foldable_rows FROM fast_lane_shadow_objects_compact AS fast WHERE fast.network='devnet' AND EXISTS (SELECT 1 FROM current_state_overlay_objects AS overlay JOIN fast_lane_shadow_base_binding AS binding ON binding.network='devnet' WHERE overlay.network='devnet' AND overlay.epoch_id=binding.base_epoch_id AND overlay.base_snapshot_id=binding.base_snapshot_id AND overlay.object_type=fast.object_type AND overlay.object_id=fast.object_id AND (overlay.source_ledger_index>fast.source_ledger_index OR (overlay.source_ledger_index=fast.source_ledger_index AND overlay.source_transaction_index>=fast.source_transaction_index)))" final-soak-evidence/foldable.json

          curl --fail-with-body --silent --show-error --retry 3 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-monitor/schedules" > final-soak-evidence/schedules.json
          curl --fail-with-body --silent --show-error --retry 3 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}" > final-soak-evidence/database.json

          overview_http="$(curl --silent --show-error --retry 3 -o final-soak-evidence/overview.json -w '%{http_code}' "${PRODUCTION_BASE}/api/overview")"
          history_http="$(curl --silent --show-error --retry 3 -o final-soak-evidence/history.json -w '%{http_code}' "${PRODUCTION_BASE}/api/status/history-source")"
          diff_http="$(curl --silent --show-error --retry 3 -o final-soak-evidence/diff.json -w '%{http_code}' "${PRODUCTION_BASE}/api/status/fast-lane-diff?limit=500")"

          read -r -d '' q <<'GRAPHQL' || true
          query D1Usage($accountTag:string!,$start:Date,$end:Date,$databaseId:string){viewer{accounts(filter:{accountTag:$accountTag}){d1AnalyticsAdaptiveGroups(limit:10000,filter:{date_geq:$start,date_leq:$end,databaseId:$databaseId}){sum{rowsRead rowsWritten}}}}}
          GRAPHQL
          for day in 2026-07-22 2026-07-23; do
            jq -n --arg query "$q" --arg accountTag "$CLOUDFLARE_ACCOUNT_ID" --arg start "$day" --arg end "$day" --arg databaseId "$DATABASE_ID" '{query:$query,variables:{accountTag:$accountTag,start:$start,end:$end,databaseId:$databaseId}}' > "final-soak-evidence/usage-${day}-request.json"
            curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'content-type: application/json' --data @"final-soak-evidence/usage-${day}-request.json" https://api.cloudflare.com/client/v4/graphql > "final-soak-evidence/usage-${day}.json"
          done

          slots="$(jq -c '.result[0].results[0]' final-soak-evidence/slots-summary.json)"
          state="$(jq -c '.result[0].results[0]' final-soak-evidence/state.json)"
          binding="$(jq -c '.result[0].results[0]' final-soak-evidence/binding.json)"
          overlay="$(jq -c '.result[0].results[0]' final-soak-evidence/overlay.json)"
          stale="$(jq -c '.result[0].results[0]' final-soak-evidence/stale.json)"
          overlay_state="$(jq -c '.result[0].results[0]' final-soak-evidence/overlay-state.json)"
          compact="$(jq -c '.result[0].results[0]' final-soak-evidence/compact.json)"
          foldable="$(jq -c '.result[0].results[0]' final-soak-evidence/foldable.json)"
          database_bytes="$(jq -r '.result.file_size' final-soak-evidence/database.json)"
          day1_read="$(jq '[.data.viewer.accounts[0].d1AnalyticsAdaptiveGroups[].sum.rowsRead // 0] | add // 0' final-soak-evidence/usage-2026-07-22.json)"
          day1_write="$(jq '[.data.viewer.accounts[0].d1AnalyticsAdaptiveGroups[].sum.rowsWritten // 0] | add // 0' final-soak-evidence/usage-2026-07-22.json)"
          day2_read="$(jq '[.data.viewer.accounts[0].d1AnalyticsAdaptiveGroups[].sum.rowsRead // 0] | add // 0' final-soak-evidence/usage-2026-07-23.json)"
          day2_write="$(jq '[.data.viewer.accounts[0].d1AnalyticsAdaptiveGroups[].sum.rowsWritten // 0] | add // 0' final-soak-evidence/usage-2026-07-23.json)"

          slots_ok="$(jq -n --argjson s "$slots" --argjson first "$start_slot" --argjson last "$end_slot" '$s.slot_count==288 and $s.first_slot==$first and $s.last_slot==$last and $s.terminal_failures==0 and $s.errors_in_slots==0 and $s.max_terminal_lag==0')"
          state_ok="$(jq -n --argjson s "$state" '$s.lag_ledgers==0 and $s.status=="healthy" and $s.last_processed_ledger==$s.latest_observed_ledger and $s.last_processed_hash==$s.latest_observed_hash')"
          binding_ok="$(jq -n --argjson b "$binding" --arg epoch "$TARGET_EPOCH" --arg snapshot "$TARGET_SNAPSHOT" --argjson ledger "$TARGET_LEDGER" --arg hash "$TARGET_HASH" '$b.base_epoch_id==$epoch and $b.base_snapshot_id==$snapshot and $b.base_ledger_index==$ledger and $b.base_ledger_hash==$hash')"
          publication_ok="$(jq -n --slurpfile current .local/current-state/read-model/manifest.json --slurpfile history .local/history/history/publication.json --arg epoch "$TARGET_EPOCH" --arg snapshot "$TARGET_SNAPSHOT" --argjson ledger "$TARGET_LEDGER" --arg hash "$TARGET_HASH" '$current[0].complete==true and $current[0].epochId==$epoch and $current[0].snapshotId==$snapshot and $current[0].ledgerIndex==$ledger and $current[0].ledgerHash==$hash and $history[0].complete==true and $history[0].endLedgerIndex==$ledger and $history[0].endLedgerHash==$hash')"
          storage_ok="$(jq -n --argjson o "$overlay" --argjson st "$stale" --argjson os "$overlay_state" --argjson c "$compact" --argjson f "$foldable" --argjson db "$database_bytes" '$o.overlay_rows>0 and $o.overlay_rows<59000 and $o.overlay_payload_bytes<70000000 and $st.stale_rows==0 and $os.state_rows==1 and $c.compact_rows==0 and $f.foldable_rows==0 and $db<400000000')"
          usage_ok="$(jq -n --argjson r1 "$day1_read" --argjson w1 "$day1_write" --argjson r2 "$day2_read" --argjson w2 "$day2_write" '$r1<4000000 and $w1<80000 and $r2<4000000 and $w2<80000')"
          schedule_ok="$(jq '.success==true and (.result.schedules|length==1) and .result.schedules[0].cron=="*/5 * * * *"' final-soak-evidence/schedules.json)"
          config_ok="$(jq '.triggers.crons==["*/5 * * * *"] and .vars.APP_NETWORK=="devnet" and .vars.MAINNET_ENABLED=="false" and (.queues.producers|length==1) and (.queues.consumers|length==1) and .queues.consumers[0].max_batch_size==1 and .queues.consumers[0].max_concurrency==1' wrangler.jsonc)"
          api_ok="$(jq -n --arg overview "$overview_http" --arg history "$history_http" --arg diff "$diff_http" --slurpfile d final-soak-evidence/diff.json '$overview=="200" and $history=="200" and $diff=="200" and $d[0].status=="ok" and $d[0].sample.exactProjectionMismatches==0 and $d[0].sample.canonicalAheadRows==0')"
          passed="$(jq -n --argjson issue "$issue_open" --argjson a "$slots_ok" --argjson b "$state_ok" --argjson c "$binding_ok" --argjson d "$publication_ok" --argjson e "$storage_ok" --argjson f "$usage_ok" --argjson g "$schedule_ok" --argjson h "$config_ok" --argjson i "$api_ok" '$issue and $a and $b and $c and $d and $e and $f and $g and $h and $i')"

          jq -n --argjson passed "$passed" --argjson issueOpenAndUnfailed "$issue_open" --argjson slotsOk "$slots_ok" --argjson stateOk "$state_ok" --argjson bindingOk "$binding_ok" --argjson publicationOk "$publication_ok" --argjson storageOk "$storage_ok" --argjson usageOk "$usage_ok" --argjson scheduleOk "$schedule_ok" --argjson configOk "$config_ok" --argjson apiOk "$api_ok" --argjson slots "$slots" --argjson state "$state" --argjson binding "$binding" --argjson overlay "$overlay" --argjson stale "$stale" --argjson overlayState "$overlay_state" --argjson compact "$compact" --argjson foldable "$foldable" --argjson databaseBytes "$database_bytes" --argjson day1Read "$day1_read" --argjson day1Write "$day1_write" --argjson day2Read "$day2_read" --argjson day2Write "$day2_write" --arg overviewHttp "$overview_http" --arg historyHttp "$history_http" --arg diffHttp "$diff_http" --arg start "$SOAK_START" --arg end "$SOAK_END" '{passed:$passed,checks:{issueOpenAndUnfailed:$issueOpenAndUnfailed,slotsOk:$slotsOk,stateOk:$stateOk,bindingOk:$bindingOk,publicationOk:$publicationOk,storageOk:$storageOk,usageOk:$usageOk,scheduleOk:$scheduleOk,configOk:$configOk,apiOk:$apiOk},window:{start:$start,end:$end,expectedSlots:288},slots:$slots,state:$state,binding:$binding,overlay:$overlay,stale:$stale,overlayState:$overlayState,compact:$compact,foldable:$foldable,databaseBytes:$databaseBytes,d1Usage:{"2026-07-22":{rowsRead:$day1Read,rowsWritten:$day1Write},"2026-07-23":{rowsRead:$day2Read,rowsWritten:$day2Write}},overviewHttp:$overviewHttp,historyHttp:$historyHttp,diffHttp:$diffHttp}' > final-soak-evidence/summary.json
          test "$passed" = true

      - name: Report and close formal soak
        if: always()
        shell: bash
        run: |
          test -s final-soak-evidence/summary.json || echo '{"passed":false,"reason":"final audit failed before summary"}' > final-soak-evidence/summary.json
          {
            echo 'Formal 288-slot Free-operation soak final audit:'
            echo
            echo '```json'
            cat final-soak-evidence/summary.json
            echo '```'
          } > final-soak-evidence/comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body-file final-soak-evidence/comment.md
          if jq -e '.passed==true' final-soak-evidence/summary.json > /dev/null; then
            gh issue edit "$ISSUE_NUMBER" --repo "$REPOSITORY" --title 'PASSED — 24h five-minute Free-operation soak post-recovery 2026-07-22 09:15 JST' --state closed
          else
            current_title="$(gh issue view "$ISSUE_NUMBER" --repo "$REPOSITORY" --json title --jq .title)"
            if [[ "$current_title" != FAILED* ]] && [[ "$current_title" != 'NOT STARTED'* ]]; then
              gh issue edit "$ISSUE_NUMBER" --repo "$REPOSITORY" --title 'FAILED — 24h five-minute Free-operation soak post-recovery 2026-07-22 09:15 JST' --state closed
            fi
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: formal-free-operation-soak-final-audit
          path: final-soak-evidence
          if-no-files-found: warn
          retention-days: 30
