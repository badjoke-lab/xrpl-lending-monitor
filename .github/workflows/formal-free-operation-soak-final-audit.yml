name: Formal Free-operation soak final audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/formal-free-soak-final-audit-trigger

permissions:
  contents: read
  issues: write

concurrency:
  group: formal-free-soak-final-audit
  cancel-in-progress: false

jobs:
  final-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: '962'
      PRODUCTION_BASE: https://xrpl-lending-monitor.badjoke-lab.workers.dev
      SOAK_START: '2026-07-22T00:15:00Z'
      SOAK_END: '2026-07-23T00:15:00Z'
    steps:
      - uses: actions/checkout@v4

      - name: Audit accepted 288-slot window
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p final-soak-evidence
          now_epoch="$(date -u +%s)"
          end_epoch="$(date -u -d "$SOAK_END" +%s)"
          test "$now_epoch" -ge "$end_epoch"

          gh issue view "$ISSUE_NUMBER" --repo "$REPOSITORY" --json state,title,labels > final-soak-evidence/issue.json
          issue_ok="$(jq '.state=="OPEN" and (([.labels[].name]|index("in-progress"))!=null) and ((.title|startswith("FAILED"))|not) and ((.title|startswith("NOT STARTED"))|not)' final-soak-evidence/issue.json)"
          test "$issue_ok" = true

          read -r -d '' Q <<'GRAPHQL' || true
          query D1Usage($accountTag:string!,$start:Date,$end:Date,$databaseId:string){viewer{accounts(filter:{accountTag:$accountTag}){d1AnalyticsAdaptiveGroups(limit:10000,filter:{date_geq:$start,date_leq:$end,databaseId:$databaseId}){sum{rowsRead rowsWritten}}}}}
          GRAPHQL
          for day in 2026-07-22 2026-07-23; do
            jq -n --arg query "$Q" --arg accountTag "$CLOUDFLARE_ACCOUNT_ID" --arg start "$day" --arg end "$day" --arg databaseId "$DATABASE_ID" '{query:$query,variables:{accountTag:$accountTag,start:$start,end:$end,databaseId:$databaseId}}' > "final-soak-evidence/usage-${day}-request.json"
            curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'content-type: application/json' --data @"final-soak-evidence/usage-${day}-request.json" https://api.cloudflare.com/client/v4/graphql > "final-soak-evidence/usage-${day}.json"
          done

          start_epoch="$(date -u -d "$SOAK_START" +%s)"
          start_slot=$((start_epoch / 300))
          end_slot=$((start_slot + 287))
          SQL=$(cat <<SQL
          WITH base AS (
            SELECT run_at,status,start_ledger_index,end_ledger_index,latest_observed_ledger,
                   lag_ledgers,ledgers_processed,persistence_rows_written,error_message,
                   CAST(strftime('%s',run_at)/300 AS INTEGER) AS slot_id
            FROM fast_lane_shadow_run_metrics
            WHERE network='devnet'
              AND CAST(strftime('%s',run_at)/300 AS INTEGER) BETWEEN ${start_slot} AND ${end_slot}
          ), ranked AS (
            SELECT *,ROW_NUMBER() OVER (PARTITION BY slot_id ORDER BY run_at DESC) AS terminal_rank,
                   COUNT(*) OVER (PARTITION BY slot_id) AS attempts_in_slot
            FROM base
          ), terminal AS (
            SELECT * FROM ranked WHERE terminal_rank=1
          )
          SELECT COUNT(*) AS slot_count,MIN(slot_id) AS first_slot,MAX(slot_id) AS last_slot,
                 SUM(CASE WHEN status NOT IN ('committed','caught_up') OR lag_ledgers<>0 OR error_message IS NOT NULL OR end_ledger_index IS NULL THEN 1 ELSE 0 END) AS terminal_failures,
                 (SELECT COUNT(*) FROM base WHERE error_message IS NOT NULL OR (status='error' AND NOT (error_message IS NULL AND start_ledger_index IS NULL AND end_ledger_index IS NULL AND latest_observed_ledger=0 AND lag_ledgers=0 AND ledgers_processed=0 AND persistence_rows_written=0))) AS actual_error_rows,
                 (SELECT COUNT(*) FROM base WHERE status='error' AND error_message IS NULL AND start_ledger_index IS NULL AND end_ledger_index IS NULL AND latest_observed_ledger=0 AND lag_ledgers=0 AND ledgers_processed=0 AND persistence_rows_written=0) AS abandoned_heartbeats,
                 SUM(attempts_in_slot) AS total_attempt_rows,MIN(run_at) AS first_terminal_run,MAX(run_at) AS last_terminal_run
          FROM terminal;
          SELECT last_processed_ledger,last_processed_hash,latest_observed_ledger,latest_observed_hash,status,updated_at,(latest_observed_ledger-last_processed_ledger) AS lag_ledgers FROM fast_lane_shadow_state WHERE network='devnet';
          SELECT (SELECT COUNT(*) FROM fast_lane_shadow_objects_compact WHERE network='devnet') AS compact_rows,
                 (SELECT COUNT(*) FROM current_state_overlay_objects o WHERE o.network='devnet' AND NOT EXISTS (SELECT 1 FROM fast_lane_shadow_base_binding b WHERE b.network=o.network AND b.base_epoch_id=o.epoch_id AND b.base_snapshot_id=o.base_snapshot_id)) AS stale_rows,
                 (SELECT COUNT(*) FROM current_state_overlay_state WHERE network='devnet') AS overlay_state_rows,
                 (SELECT MAX(overlay_ledger_index) FROM current_state_overlay_state WHERE network='devnet') AS overlay_ledger_index,
                 (SELECT MAX(overlay_ledger_hash) FROM current_state_overlay_state WHERE network='devnet') AS overlay_ledger_hash,
                 (SELECT COUNT(*) FROM current_state_overlay_objects WHERE network='devnet') AS overlay_rows,
                 (SELECT COALESCE(SUM(LENGTH(projection_json)),0) FROM current_state_overlay_objects WHERE network='devnet') AS overlay_payload_bytes;
          SQL
          )
          jq -n --arg sql "$SQL" '{sql:$sql}' | curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' --data-binary @- \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query" > final-soak-evidence/d1.json
          jq -e '.success==true and ((.errors//[])|length)==0 and (.result|length)==3 and ([.result[].success]|all)' final-soak-evidence/d1.json > /dev/null

          curl --fail-with-body --silent --show-error -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-monitor/schedules" > final-soak-evidence/schedules.json
          curl --fail-with-body --silent --show-error -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}" > final-soak-evidence/database.json
          overview_http="$(curl --silent --show-error --retry 2 -o final-soak-evidence/overview.json -w '%{http_code}' "${PRODUCTION_BASE}/api/overview")"
          history_http="$(curl --silent --show-error --retry 2 -o final-soak-evidence/history.json -w '%{http_code}' "${PRODUCTION_BASE}/api/status/history-source")"
          diff_http="$(curl --silent --show-error --retry 2 -o final-soak-evidence/diff.json -w '%{http_code}' "${PRODUCTION_BASE}/api/status/fast-lane-diff?limit=500")"

          slots="$(jq -c '.result[0].results[0]' final-soak-evidence/d1.json)"
          state="$(jq -c '.result[1].results[0]' final-soak-evidence/d1.json)"
          storage="$(jq -c '.result[2].results[0]' final-soak-evidence/d1.json)"
          day1_read="$(jq '[.data.viewer.accounts[0].d1AnalyticsAdaptiveGroups[].sum.rowsRead//0]|add//0' final-soak-evidence/usage-2026-07-22.json)"
          day1_write="$(jq '[.data.viewer.accounts[0].d1AnalyticsAdaptiveGroups[].sum.rowsWritten//0]|add//0' final-soak-evidence/usage-2026-07-22.json)"
          day2_read="$(jq '[.data.viewer.accounts[0].d1AnalyticsAdaptiveGroups[].sum.rowsRead//0]|add//0' final-soak-evidence/usage-2026-07-23.json)"
          day2_write="$(jq '[.data.viewer.accounts[0].d1AnalyticsAdaptiveGroups[].sum.rowsWritten//0]|add//0' final-soak-evidence/usage-2026-07-23.json)"
          database_bytes="$(jq -r '.result.file_size' final-soak-evidence/database.json)"

          slots_ok="$(jq -n --argjson s "$slots" --argjson first "$start_slot" --argjson last "$end_slot" '$s.slot_count==288 and $s.first_slot==$first and $s.last_slot==$last and $s.terminal_failures==0 and $s.actual_error_rows==0')"
          state_ok="$(jq -n --argjson s "$state" '$s.status=="healthy" and $s.lag_ledgers==0 and $s.last_processed_ledger==$s.latest_observed_ledger and $s.last_processed_hash==$s.latest_observed_hash')"
          storage_ok="$(jq -n --argjson s "$state" --argjson o "$storage" --argjson db "$database_bytes" '$o.compact_rows==0 and $o.stale_rows==0 and $o.overlay_state_rows==1 and $o.overlay_ledger_index==$s.last_processed_ledger and $o.overlay_ledger_hash==$s.last_processed_hash and $o.overlay_rows>0 and $o.overlay_rows<50000 and $o.overlay_payload_bytes<67108864 and $db<400000000')"
          usage_ok="$(jq -n --argjson r1 "$day1_read" --argjson w1 "$day1_write" --argjson r2 "$day2_read" --argjson w2 "$day2_write" '$r1<4000000 and $w1<80000 and $r2<4000000 and $w2<80000')"
          schedule_ok="$(jq '.success==true and (.result.schedules|length)==1 and .result.schedules[0].cron=="*/5 * * * *"' final-soak-evidence/schedules.json)"
          config_ok="$(jq '.triggers.crons==["*/5 * * * *"] and .vars.APP_NETWORK=="devnet" and .vars.MAINNET_ENABLED=="false" and (.queues.producers|length)==1 and (.queues.consumers|length)==1 and .queues.consumers[0].max_batch_size==1 and .queues.consumers[0].max_concurrency==1' wrangler.jsonc)"
          api_ok="$(jq -n --arg overview "$overview_http" --arg history "$history_http" --arg diff "$diff_http" --slurpfile d final-soak-evidence/diff.json '$overview=="200" and $history=="200" and $diff=="200" and $d[0].status=="ok" and $d[0].passed==true and $d[0].reason==null and $d[0].fastLane.ledgerIndex==$d[0].canonicalOverlay.ledgerIndex and $d[0].fastLane.ledgerHash==$d[0].canonicalOverlay.ledgerHash and ($d[0].sample.exactProjectionMismatches//0)==0 and ($d[0].sample.canonicalAheadRows//0)==0')"
          passed="$(jq -n --argjson a "$issue_ok" --argjson b "$slots_ok" --argjson c "$state_ok" --argjson d "$storage_ok" --argjson e "$usage_ok" --argjson f "$schedule_ok" --argjson g "$config_ok" --argjson h "$api_ok" '$a and $b and $c and $d and $e and $f and $g and $h')"

          jq -n --argjson passed "$passed" --argjson issueOk "$issue_ok" --argjson slotsOk "$slots_ok" --argjson stateOk "$state_ok" --argjson storageOk "$storage_ok" --argjson usageOk "$usage_ok" --argjson scheduleOk "$schedule_ok" --argjson configOk "$config_ok" --argjson apiOk "$api_ok" --argjson slots "$slots" --argjson state "$state" --argjson storage "$storage" --argjson databaseBytes "$database_bytes" --argjson day1Read "$day1_read" --argjson day1Write "$day1_write" --argjson day2Read "$day2_read" --argjson day2Write "$day2_write" '{passed:$passed,checks:{issueOk:$issueOk,slotsOk:$slotsOk,stateOk:$stateOk,storageOk:$storageOk,usageOk:$usageOk,scheduleOk:$scheduleOk,configOk:$configOk,apiOk:$apiOk},window:{start:"2026-07-22T00:15:00Z",end:"2026-07-23T00:15:00Z",expectedSlots:288},slots:$slots,state:$state,storage:$storage,databaseBytes:$databaseBytes,d1Usage:{"2026-07-22":{rowsRead:$day1Read,rowsWritten:$day1Write},"2026-07-23":{rowsRead:$day2Read,rowsWritten:$day2Write}}}' > final-soak-evidence/summary.json
          test "$passed" = true

      - name: Report final result
        if: always()
        shell: bash
        run: |
          test -s final-soak-evidence/summary.json || echo '{"passed":false,"reason":"final audit failed before summary"}' > final-soak-evidence/summary.json
          { echo 'Formal isolated 288-slot five-minute soak final audit:'; echo; echo '```json'; cat final-soak-evidence/summary.json; echo '```'; } > final-soak-evidence/comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body-file final-soak-evidence/comment.md
          if jq -e '.passed==true' final-soak-evidence/summary.json > /dev/null; then
            gh issue edit "$ISSUE_NUMBER" --repo "$REPOSITORY" --title 'PASSED — 24h five-minute Free-operation soak post-recovery 2026-07-22 09:15 JST' --state closed
          else
            current="$(gh issue view "$ISSUE_NUMBER" --repo "$REPOSITORY" --json title --jq .title)"
            if [[ "$current" != FAILED* ]] && [[ "$current" != 'NOT STARTED'* ]]; then
              gh issue edit "$ISSUE_NUMBER" --repo "$REPOSITORY" --title 'FAILED — 24h five-minute Free-operation soak post-recovery 2026-07-22 09:15 JST' --state closed
            fi
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formal-free-operation-soak-final-audit
          path: final-soak-evidence
          if-no-files-found: warn
          retention-days: 30
