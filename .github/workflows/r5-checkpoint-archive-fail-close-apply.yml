name: R5 checkpoint terminal-archive fail-close apply

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: r5-checkpoint-archive-fail-close-apply
  cancel-in-progress: false

env:
  QUALIFICATION_ISSUE: '1261'
  MANAGER_PATH: scripts/manage-r5-checkpoint-archive-fail-close-apply.mjs
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
  GH_TOKEN: ${{ github.token }}

jobs:
  prepare:
    if: >-
      github.event.issue.number == 1261 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      github.event.comment.body == '/r5-checkpoint-archive-fail-close-prepare'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare exact checkpoint archive fail-close state read-only
        id: state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r5-checkpoint-archive-fail-close-evidence
          source_commit="$(git rev-parse HEAD)"
          manager_sha="$(sha256sum "$MANAGER_PATH" | awk '{print $1}')"
          node "$MANAGER_PATH" prepare \
            --source-commit "$source_commit" \
            --output r5-checkpoint-archive-fail-close-evidence/prepare.json \
            > r5-checkpoint-archive-fail-close-evidence/prepare.stdout.json
          file=r5-checkpoint-archive-fail-close-evidence/prepare.json
          test "$(jq -r '.classification' "$file")" = unapplied_expected
          test "$(jq -r '.archiveRows' "$file")" = 0
          test "$(jq -r '.activeRun.status' "$file")" = halted
          test "$(jq -r '.activeRun.lastError' "$file")" = r5_recovery_database_halt
          test "$(jq -r '.productionDatabaseReadOnly' "$file")" = true
          test "$(jq -r '.functionDefinitionMutationAuthorized' "$file")" = false
          test "$(jq -r '.terminalTransportMutationAuthorized' "$file")" = false
          test "$(jq -r '.canonicalHistoryRowMutationAuthorized' "$file")" = false
          test "$(jq -r '.physicalCompactionAuthorized' "$file")" = false
          test "$(jq -r '.schedulerMutationAuthorized' "$file")" = false
          test "$(jq -r '.publicReaderMutationAuthorized' "$file")" = false
          test "$(jq -r '.r5RearmAuthorized' "$file")" = false
          printf 'source_commit=%s\nmanager_sha=%s\nplan=%s\nstate=%s\nproject=%s\nhead=%s\ndatabase_bytes=%s\ncheckpoint_before=%s\n' \
            "$source_commit" "$manager_sha" \
            "$(jq -r '.planDigestSha256' "$file")" \
            "$(jq -r '.structuralStateSha256' "$file")" \
            "$(jq -r '.projectIdentityDigest' "$file")" \
            "$(jq -r '.maxMigrationVersion' "$file")" \
            "$(jq -r '.databaseBytes' "$file")" \
            "$(jq -r '.checkpointDefinitionSha256' "$file")" >> "$GITHUB_OUTPUT"

      - name: Publish expiring exact checkpoint fail-close authorization proposal
        env:
          SOURCE_COMMIT: ${{ steps.state.outputs.source_commit }}
          MANAGER_SHA: ${{ steps.state.outputs.manager_sha }}
          PLAN_SHA: ${{ steps.state.outputs.plan }}
          STATE_SHA: ${{ steps.state.outputs.state }}
          PROJECT_DIGEST: ${{ steps.state.outputs.project }}
          MIGRATION_HEAD: ${{ steps.state.outputs.head }}
          DATABASE_BYTES: ${{ steps.state.outputs.database_bytes }}
          CHECKPOINT_BEFORE: ${{ steps.state.outputs.checkpoint_before }}
        shell: bash
        run: |
          set -euo pipefail
          expires="$(date -u -d '+2 hours' '+%Y-%m-%dT%H:%M:%SZ')"
          nonce="$(openssl rand -hex 8)"
          command="/r5-checkpoint-archive-fail-close-authorize commit=${SOURCE_COMMIT} manager=${MANAGER_SHA} plan=${PLAN_SHA} state=${STATE_SHA} project=${PROJECT_DIGEST} head=${MIGRATION_HEAD} prepare_run=${GITHUB_RUN_ID} expires=${expires} nonce=${nonce}"
          file=r5-checkpoint-archive-fail-close-evidence/prepare.json
          cat > /tmp/r5-checkpoint-archive-fail-close-proposal.md <<EOF2
          ## R5 checkpoint terminal-archive fail-close authorization proposal

          Preparation run: \`${GITHUB_RUN_ID}\`
          Source main commit: \`${SOURCE_COMMIT}\`
          Manager SHA-256: \`${MANAGER_SHA}\`
          Exact one-file plan digest: \`${PLAN_SHA}\`
          Authorized structural state SHA-256: \`${STATE_SHA}\`
          Project identity digest: \`${PROJECT_DIGEST}\`
          Current production migration head: \`${MIGRATION_HEAD}\`
          Database bytes at preparation: \`${DATABASE_BYTES}\`
          Current strict-checkpoint definition SHA-256: \`${CHECKPOINT_BEFORE}\`
          Authorization expires: \`${expires}\`

          Exact SQL: \`$(jq -r '.plan.file.path' "$file")\` — SHA-256 \`$(jq -r '.plan.file.sha256' "$file")\` — \`$(jq -r '.plan.file.bytes' "$file")\` bytes

          This proposal authorizes only replacement of \`xrpl_create_r5_active_checkpoint_strict(...)\` with the exact fail-close definition staged in the one-file plan. The guard makes legacy live-only checkpoint creation fail closed after the first terminal archive row exists. The archive must still contain exactly zero rows at apply time.

          It does **not** authorize terminal transport backfill/delete, canonical history mutation, physical compaction/VACUUM/reindex, scheduler mutation, deployment, public-reader mutation, Mainnet, stabilization/soak, or R5 rearm.

          Exact authorization command:

          \`${command}\`
          EOF2
          gh issue comment "$QUALIFICATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/r5-checkpoint-archive-fail-close-proposal.md

      - name: Upload sanitized checkpoint fail-close preparation evidence
        if: always() && steps.state.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: r5-checkpoint-archive-fail-close-prepare-evidence
          path: r5-checkpoint-archive-fail-close-evidence
          if-no-files-found: error
          retention-days: 14

  execute:
    if: >-
      github.event.issue.number == 1261 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      startsWith(github.event.comment.body, '/r5-checkpoint-archive-fail-close-authorize ')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      AUTHORIZATION_BODY: ${{ github.event.comment.body }}
      AUTHORIZATION_CREATED_AT: ${{ github.event.comment.created_at }}
      AUTHORIZATION_COMMENT_ID: ${{ github.event.comment.id }}
    steps:
      - name: Check out exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Parse and bind exact owner checkpoint fail-close authorization
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          regex='^/r5-checkpoint-archive-fail-close-authorize commit=([a-f0-9]{40}) manager=([a-f0-9]{64}) plan=([a-f0-9]{64}) state=([a-f0-9]{64}) project=([a-f0-9]{64}) head=([0-9]{14}) prepare_run=([0-9]+) expires=([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z) nonce=([a-f0-9]{16})$'
          [[ "$AUTHORIZATION_BODY" =~ $regex ]] || { echo 'checkpoint fail-close authorization shape mismatch' >&2; exit 1; }
          commit="${BASH_REMATCH[1]}"; manager="${BASH_REMATCH[2]}"; plan="${BASH_REMATCH[3]}"; state="${BASH_REMATCH[4]}"; project="${BASH_REMATCH[5]}"; head="${BASH_REMATCH[6]}"; prepare_run="${BASH_REMATCH[7]}"; expires="${BASH_REMATCH[8]}"; nonce="${BASH_REMATCH[9]}"
          test "$commit" = "$(git rev-parse HEAD)"
          test "$manager" = "$(sha256sum "$MANAGER_PATH" | awk '{print $1}')"
          [[ "$SUPABASE_PROJECT_ID" =~ ^[a-z]{20}$ ]]
          current_project="$(PROJECT_ID="$SUPABASE_PROJECT_ID" node -e "const c=require('node:crypto');process.stdout.write(c.createHash('sha256').update(process.env.PROJECT_ID).digest('hex'))")"
          test "$project" = "$current_project"
          expires_epoch="$(date -u -d "$expires" +%s)"; auth_epoch="$(date -u -d "$AUTHORIZATION_CREATED_AT" +%s)"; now_epoch="$(date -u +%s)"
          test "$auth_epoch" -lt "$expires_epoch"; test "$now_epoch" -le "$expires_epoch"; test $((expires_epoch - auth_epoch)) -le 7200
          printf 'commit=%s\nmanager=%s\nplan=%s\nstate=%s\nproject=%s\nhead=%s\nprepare_run=%s\nexpires=%s\nnonce=%s\n' \
            "$commit" "$manager" "$plan" "$state" "$project" "$head" "$prepare_run" "$expires" "$nonce" >> "$GITHUB_OUTPUT"

      - name: Verify exact prior proposal and unique owner authorization
        env:
          PREPARE_RUN: ${{ steps.auth.outputs.prepare_run }}
          COMMIT: ${{ steps.auth.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREPARE_RUN}" > /tmp/prepare-run.json
          jq -e --arg commit "$COMMIT" '.event == "issue_comment" and .conclusion == "success" and .head_sha == $commit and .actor.login == "badjoke-lab"' /tmp/prepare-run.json >/dev/null
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${QUALIFICATION_ISSUE}/comments?per_page=100" | jq -s 'add' > /tmp/comments.json
          EXPECTED="$AUTHORIZATION_BODY" PREPARE_RUN="$PREPARE_RUN" AUTH_ID="$AUTHORIZATION_COMMENT_ID" AUTH_CREATED_AT="$AUTHORIZATION_CREATED_AT" node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const comments = JSON.parse(readFileSync('/tmp/comments.json','utf8'))
          const expected = process.env.EXPECTED
          const run = process.env.PREPARE_RUN
          const authAt = Date.parse(process.env.AUTH_CREATED_AT ?? '')
          const proposals = comments.filter(c => c?.user?.login === 'github-actions[bot]' && typeof c?.body === 'string' && c.body.includes(`Preparation run: \`${run}\``) && c.body.includes(`\`${expected}\``))
          if (proposals.length !== 1) throw new Error(`expected one exact checkpoint fail-close proposal, found ${proposals.length}`)
          if (!(Date.parse(proposals[0].created_at ?? '') < authAt)) throw new Error('checkpoint fail-close proposal must precede authorization')
          const owner = comments.filter(c => c?.user?.login === 'badjoke-lab' && c?.body === expected)
          if (owner.length !== 1 || Number(owner[0].id) !== Number(process.env.AUTH_ID)) throw new Error(`checkpoint fail-close authorization must be unique, found ${owner.length}`)
          NODE

      - name: Revalidate exact checkpoint fail-close state read-only
        env:
          COMMIT: ${{ steps.auth.outputs.commit }}
          AUTH_PLAN: ${{ steps.auth.outputs.plan }}
          AUTH_STATE: ${{ steps.auth.outputs.state }}
          AUTH_HEAD: ${{ steps.auth.outputs.head }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r5-checkpoint-archive-fail-close-evidence
          node "$MANAGER_PATH" prepare --source-commit "$COMMIT" --output r5-checkpoint-archive-fail-close-evidence/pre-apply.json > /tmp/pre.json
          test "$(jq -r '.classification' /tmp/pre.json)" = unapplied_expected
          test "$(jq -r '.archiveRows' /tmp/pre.json)" = 0
          test "$(jq -r '.planDigestSha256' /tmp/pre.json)" = "$AUTH_PLAN"
          test "$(jq -r '.structuralStateSha256' /tmp/pre.json)" = "$AUTH_STATE"
          test "$(jq -r '.maxMigrationVersion' /tmp/pre.json)" = "$AUTH_HEAD"

      - name: Apply only exact authorized checkpoint archive fail-close
        id: apply
        env:
          COMMIT: ${{ steps.auth.outputs.commit }}
          AUTH_PLAN: ${{ steps.auth.outputs.plan }}
          AUTH_STATE: ${{ steps.auth.outputs.state }}
        shell: bash
        run: |
          set -euo pipefail
          node "$MANAGER_PATH" apply \
            --source-commit "$COMMIT" \
            --authorized-plan "$AUTH_PLAN" \
            --authorized-state "$AUTH_STATE" \
            --output r5-checkpoint-archive-fail-close-evidence/apply.json \
            2>&1 | tee r5-checkpoint-archive-fail-close-evidence/apply.log

      - name: Verify bounded checkpoint fail-close result
        if: steps.apply.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          file=r5-checkpoint-archive-fail-close-evidence/apply.json
          test "$(jq -r '.classificationAfter' "$file")" = applied_consistent
          test "$(jq -r '.checkpointDefinitionSha256After' "$file")" = e170166e6c73bf4e7a112ad3daf94873935d0b2b248abf55f7bb42059575c733
          test "$(jq -r '.archiveRowsAfter' "$file")" = 0
          test "$(jq -r '.functionDefinitionMutationPerformed' "$file")" = true
          test "$(jq -r '.terminalTransportMutationPerformed' "$file")" = false
          test "$(jq -r '.canonicalHistoryRowMutationPerformed' "$file")" = false
          test "$(jq -r '.physicalCompactionPerformed' "$file")" = false
          test "$(jq -r '.vacuumPerformed' "$file")" = false
          test "$(jq -r '.schedulerMutationPerformed' "$file")" = false
          test "$(jq -r '.deploymentPerformed' "$file")" = false
          test "$(jq -r '.publicReaderMutationPerformed' "$file")" = false
          test "$(jq -r '.mainnetDisabled' "$file")" = true
          test "$(jq -r '.r5RearmPerformed' "$file")" = false
          test "$(jq -r '.postVerificationReadOnly' "$file")" = true

      - name: Upload sanitized checkpoint fail-close apply evidence
        if: always() && steps.auth.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: r5-checkpoint-archive-fail-close-apply-evidence
          path: r5-checkpoint-archive-fail-close-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Publish checkpoint fail-close result
        if: always() && steps.auth.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          verdict=FAIL; if [ "${{ job.status }}" = success ]; then verdict=PASS; fi
          cat > /tmp/result.md <<EOF2
          ## R5 checkpoint terminal-archive fail-close — ${verdict}

          Run: \`${GITHUB_RUN_ID}\`
          Source commit: \`${{ steps.auth.outputs.commit }}\`

          Scope was limited to the exact strict-checkpoint function-definition replacement. No terminal transport row mutation, canonical history mutation, physical compaction/VACUUM/reindex, scheduler/deployment/public-reader/Mainnet mutation, stabilization/soak, or R5 rearm was authorized.
          EOF2
          gh issue comment "$QUALIFICATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/result.md
