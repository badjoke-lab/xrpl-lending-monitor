name: R5 raw evidence physical compaction

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: r5-raw-evidence-physical-compaction
  cancel-in-progress: false

env:
  QUALIFICATION_ISSUE: '1261'
  MANAGER_PATH: scripts/manage-r5-raw-evidence-compaction.mjs
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
  GH_TOKEN: ${{ github.token }}

jobs:
  prepare:
    if: >-
      github.event.issue.number == 1261 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      github.event.comment.body == '/r5-raw-evidence-compaction-prepare'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Inspect raw-evidence physical state read-only
        id: state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r5-raw-evidence-compaction-evidence
          source_commit="$(git rev-parse HEAD)"
          manager_sha="$(sha256sum "$MANAGER_PATH" | awk '{print $1}')"
          node "$MANAGER_PATH" prepare \
            --source-commit "$source_commit" \
            --output r5-raw-evidence-compaction-evidence/prepare.json \
            > r5-raw-evidence-compaction-evidence/prepare.stdout.json \
            2> r5-raw-evidence-compaction-evidence/prepare.stderr.log
          cp r5-raw-evidence-compaction-evidence/prepare.stdout.json /tmp/r5-raw-evidence-compaction-prepare.json
          test "$(jq -r '.mutationAuthorized' /tmp/r5-raw-evidence-compaction-prepare.json)" = false
          test "$(jq -r '.schedulerMutationAuthorized' /tmp/r5-raw-evidence-compaction-prepare.json)" = false
          test "$(jq -r '.vacuumAuthorized' /tmp/r5-raw-evidence-compaction-prepare.json)" = false
          test "$(jq -r '.retentionPolicyMutationAuthorized' /tmp/r5-raw-evidence-compaction-prepare.json)" = false
          test "$(jq -r '.mutation.rowPreserving' /tmp/r5-raw-evidence-compaction-prepare.json)" = true
          printf 'source_commit=%s\nmanager_sha=%s\nstate_sha=%s\nproject_digest=%s\nmutation_sha=%s\ndatabase_bytes=%s\npayload_rows=%s\ncommit_rows=%s\npayload_digest=%s\ncommit_digest=%s\npayload_bytes=%s\ncommit_bytes=%s\n' \
            "$source_commit" "$manager_sha" \
            "$(jq -r '.structuralStateSha256' /tmp/r5-raw-evidence-compaction-prepare.json)" \
            "$(jq -r '.structuralState.projectIdentityDigest' /tmp/r5-raw-evidence-compaction-prepare.json)" \
            "$(jq -r '.mutation.sha256' /tmp/r5-raw-evidence-compaction-prepare.json)" \
            "$(jq -r '.databaseBytes' /tmp/r5-raw-evidence-compaction-prepare.json)" \
            "$(jq -r '.payloadRows' /tmp/r5-raw-evidence-compaction-prepare.json)" \
            "$(jq -r '.commitRows' /tmp/r5-raw-evidence-compaction-prepare.json)" \
            "$(jq -r '.payloadDigest' /tmp/r5-raw-evidence-compaction-prepare.json)" \
            "$(jq -r '.commitDigest' /tmp/r5-raw-evidence-compaction-prepare.json)" \
            "$(jq -r '.payloadRelationBytes' /tmp/r5-raw-evidence-compaction-prepare.json)" \
            "$(jq -r '.commitRelationBytes' /tmp/r5-raw-evidence-compaction-prepare.json)" >> "$GITHUB_OUTPUT"

      - name: Publish expiring owner authorization proposal
        env:
          SOURCE_COMMIT: ${{ steps.state.outputs.source_commit }}
          MANAGER_SHA: ${{ steps.state.outputs.manager_sha }}
          STATE_SHA: ${{ steps.state.outputs.state_sha }}
          PROJECT_DIGEST: ${{ steps.state.outputs.project_digest }}
          MUTATION_SHA: ${{ steps.state.outputs.mutation_sha }}
          DATABASE_BYTES: ${{ steps.state.outputs.database_bytes }}
          PAYLOAD_ROWS: ${{ steps.state.outputs.payload_rows }}
          COMMIT_ROWS: ${{ steps.state.outputs.commit_rows }}
          PAYLOAD_DIGEST: ${{ steps.state.outputs.payload_digest }}
          COMMIT_DIGEST: ${{ steps.state.outputs.commit_digest }}
          PAYLOAD_BYTES: ${{ steps.state.outputs.payload_bytes }}
          COMMIT_BYTES: ${{ steps.state.outputs.commit_bytes }}
        shell: bash
        run: |
          set -euo pipefail
          expires="$(date -u -d '+2 hours' '+%Y-%m-%dT%H:%M:%SZ')"
          nonce="$(openssl rand -hex 8)"
          command="/r5-raw-evidence-compaction-authorize commit=${SOURCE_COMMIT} manager=${MANAGER_SHA} state=${STATE_SHA} project=${PROJECT_DIGEST} mutation=${MUTATION_SHA} prepare_run=${GITHUB_RUN_ID} expires=${expires} nonce=${nonce}"
          cat > /tmp/r5-raw-evidence-compaction-proposal.md <<EOF2
          ## R5 raw evidence row-preserving physical compaction authorization proposal

          Preparation run: \`${GITHUB_RUN_ID}\`
          Source main commit: \`${SOURCE_COMMIT}\`
          Manager SHA-256: \`${MANAGER_SHA}\`
          Authorized structural state SHA-256: \`${STATE_SHA}\`
          Project identity digest: \`${PROJECT_DIGEST}\`
          Exact physical-compaction mutation SHA-256: \`${MUTATION_SHA}\`
          Database bytes: \`${DATABASE_BYTES}\`
          Payload rows / relation bytes / digest: \`${PAYLOAD_ROWS} / ${PAYLOAD_BYTES} / ${PAYLOAD_DIGEST}\`
          Commit rows / relation bytes / digest: \`${COMMIT_ROWS} / ${COMMIT_BYTES} / ${COMMIT_DIGEST}\`
          Authorization expires: \`${expires}\`

          This authorizes exactly one row-preserving physical compaction of only \`public.xrpl_phase_payload_chunks\` and \`public.xrpl_phase_commit_chunks\`: acquire ACCESS EXCLUSIVE locks with a 5-second lock timeout, copy every currently retained row to temporary tables, TRUNCATE only those two targets without CASCADE, restore every row, and require exact row-count and deterministic row-digest equality before commit. Statement timeout is 45 seconds.

          This does not authorize logical retention changes, DELETE, VACUUM, REINDEX, CLUSTER, schema DDL, scheduler mutation, work/message/watermark mutation, deployment, public-reader mutation, Mainnet, stabilization, soak, or R5 restart.

          Exact owner authorization command:

          \`${command}\`
          EOF2
          gh issue comment "$QUALIFICATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/r5-raw-evidence-compaction-proposal.md

      - name: Upload sanitized preparation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r5-raw-evidence-compaction-prepare-evidence
          path: r5-raw-evidence-compaction-evidence
          if-no-files-found: warn
          retention-days: 14

  execute:
    if: >-
      github.event.issue.number == 1261 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      startsWith(github.event.comment.body, '/r5-raw-evidence-compaction-authorize ')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AUTHORIZATION_BODY: ${{ github.event.comment.body }}
      AUTHORIZATION_CREATED_AT: ${{ github.event.comment.created_at }}
      AUTHORIZATION_COMMENT_ID: ${{ github.event.comment.id }}
    steps:
      - name: Check out exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Parse exact owner authorization
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          regex='^/r5-raw-evidence-compaction-authorize commit=([a-f0-9]{40}) manager=([a-f0-9]{64}) state=([a-f0-9]{64}) project=([a-f0-9]{64}) mutation=([a-f0-9]{64}) prepare_run=([0-9]+) expires=([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z) nonce=([a-f0-9]{16})$'
          [[ "$AUTHORIZATION_BODY" =~ $regex ]] || { echo 'authorization shape mismatch' >&2; exit 1; }
          commit="${BASH_REMATCH[1]}"; manager_sha="${BASH_REMATCH[2]}"; state_sha="${BASH_REMATCH[3]}"; project_digest="${BASH_REMATCH[4]}"; mutation_sha="${BASH_REMATCH[5]}"; prepare_run="${BASH_REMATCH[6]}"; expires="${BASH_REMATCH[7]}"; nonce="${BASH_REMATCH[8]}"
          test "$commit" = "$(git rev-parse HEAD)"
          test "$manager_sha" = "$(sha256sum "$MANAGER_PATH" | awk '{print $1}')"
          test "$project_digest" = "$(printf '%s' "$SUPABASE_PROJECT_ID" | sha256sum | awk '{print $1}')"
          now_epoch="$(date -u +%s)"; expires_epoch="$(date -u -d "$expires" +%s)"; auth_epoch="$(date -u -d "$AUTHORIZATION_CREATED_AT" +%s)"
          test "$auth_epoch" -lt "$expires_epoch"; test "$now_epoch" -le "$expires_epoch"; test $((expires_epoch-auth_epoch)) -le 7200
          printf 'commit=%s\nmanager_sha=%s\nstate_sha=%s\nproject_digest=%s\nmutation_sha=%s\nprepare_run=%s\nexpires=%s\nnonce=%s\n' "$commit" "$manager_sha" "$state_sha" "$project_digest" "$mutation_sha" "$prepare_run" "$expires" "$nonce" >> "$GITHUB_OUTPUT"

      - name: Verify exact prior proposal and unique owner authorization
        env:
          PREPARE_RUN: ${{ steps.auth.outputs.prepare_run }}
          COMMIT: ${{ steps.auth.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREPARE_RUN}" > /tmp/prepare-run.json
          jq -e --arg commit "$COMMIT" '.event=="issue_comment" and .conclusion=="success" and .head_sha==$commit and .actor.login=="badjoke-lab"' /tmp/prepare-run.json >/dev/null
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${QUALIFICATION_ISSUE}/comments?per_page=100" | jq -s 'add' > /tmp/comments.json
          EXPECTED="$AUTHORIZATION_BODY" PREPARE_RUN="$PREPARE_RUN" AUTH_ID="$AUTHORIZATION_COMMENT_ID" AUTH_CREATED_AT="$AUTHORIZATION_CREATED_AT" node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const comments=JSON.parse(readFileSync('/tmp/comments.json','utf8')); const expected=process.env.EXPECTED; const run=process.env.PREPARE_RUN; const authAt=Date.parse(process.env.AUTH_CREATED_AT)
          const proposals=comments.filter(c=>c?.user?.login==='github-actions[bot]'&&c?.body?.includes(`Preparation run: \`${run}\``)&&c?.body?.includes(`\`${expected}\``))
          if(proposals.length!==1||!(Date.parse(proposals[0].created_at)<authAt)) throw new Error('exact prior proposal missing or late')
          const owners=comments.filter(c=>c?.user?.login==='badjoke-lab'&&c?.body===expected)
          if(owners.length!==1||Number(owners[0].id)!==Number(process.env.AUTH_ID)) throw new Error('owner authorization is not unique')
          NODE

      - name: Revalidate exact authorized structural state read-only
        env:
          COMMIT: ${{ steps.auth.outputs.commit }}
          STATE_SHA: ${{ steps.auth.outputs.state_sha }}
          MUTATION_SHA: ${{ steps.auth.outputs.mutation_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r5-raw-evidence-compaction-evidence
          node "$MANAGER_PATH" prepare --source-commit "$COMMIT" --output r5-raw-evidence-compaction-evidence/pre-apply.json > /tmp/pre.json
          test "$(jq -r '.structuralStateSha256' /tmp/pre.json)" = "$STATE_SHA"
          test "$(jq -r '.mutation.sha256' /tmp/pre.json)" = "$MUTATION_SHA"

      - name: Apply exact bounded raw-evidence physical compaction
        id: apply
        env:
          COMMIT: ${{ steps.auth.outputs.commit }}
          STATE_SHA: ${{ steps.auth.outputs.state_sha }}
          MUTATION_SHA: ${{ steps.auth.outputs.mutation_sha }}
        shell: bash
        run: |
          set -euo pipefail
          node "$MANAGER_PATH" apply \
            --source-commit "$COMMIT" \
            --authorized-state "$STATE_SHA" \
            --authorized-mutation "$MUTATION_SHA" \
            --output r5-raw-evidence-compaction-evidence/apply.json \
            2>&1 | tee r5-raw-evidence-compaction-evidence/apply.log

      - name: Upload sanitized application evidence
        if: always() && steps.auth.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: r5-raw-evidence-compaction-apply-evidence
          path: r5-raw-evidence-compaction-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Publish bounded result
        if: always() && steps.apply.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          jq -r '"## R5 raw evidence row-preserving physical compaction — PASS\n\n- payload rows before/after: `\(.payloadRowsBefore) / \(.payloadRowsAfter)`\n- commit rows before/after: `\(.commitRowsBefore) / \(.commitRowsAfter)`\n- payload digest preserved: `\(.payloadDigestBefore == .payloadDigestAfter)`\n- commit digest preserved: `\(.commitDigestBefore == .commitDigestAfter)`\n- database bytes before/after/reclaimed: `\(.databaseBytesBefore) / \(.databaseBytesAfter) / \(.databaseBytesReclaimed)`\n- payload relation before/after/reclaimed: `\(.payloadRelationBytesBefore) / \(.payloadRelationBytesAfter) / \(.payloadRelationBytesReclaimed)`\n- commit relation before/after/reclaimed: `\(.commitRelationBytesBefore) / \(.commitRelationBytesAfter) / \(.commitRelationBytesReclaimed)`\n- database below 400000000: `\(.databaseBelowTarget)`\n- headroom bytes: `\(.headroomBytes)`\n\nNo logical retention policy, scheduler, work/message/watermark rows, deployment, Mainnet, stabilization, soak, or R5 restart was authorized by this run."' r5-raw-evidence-compaction-evidence/apply.json > /tmp/result.md
          gh issue comment "$QUALIFICATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/result.md
