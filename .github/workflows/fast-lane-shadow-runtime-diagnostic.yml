name: Fast lane shadow runtime diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/fast-lane-shadow-runtime-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p fast-lane-shadow-runtime-diagnostic

      - name: Inspect Cloudflare cron registration
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-fast-lane-shadow/schedules" \
            > fast-lane-shadow-runtime-diagnostic/schedules.json
          cat fast-lane-shadow-runtime-diagnostic/schedules.json

      - name: Inspect Worker public status
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            > fast-lane-shadow-runtime-diagnostic/subdomain.json
          SUBDOMAIN="$(jq -r '.result.subdomain' fast-lane-shadow-runtime-diagnostic/subdomain.json)"
          curl --fail-with-body --silent --show-error \
            "https://xrpl-lending-fast-lane-shadow.${SUBDOMAIN}.workers.dev/status" \
            > fast-lane-shadow-runtime-diagnostic/status.json
          cat fast-lane-shadow-runtime-diagnostic/status.json

      - name: Inspect remote shadow D1 state
        run: |
          pnpm exec wrangler d1 execute xrpl-lending-monitor --remote \
            --command "SELECT * FROM fast_lane_shadow_state; SELECT COUNT(*) AS object_count FROM fast_lane_shadow_objects_compact; SELECT COUNT(*) AS window_count FROM fast_lane_shadow_windows;" \
            --json > fast-lane-shadow-runtime-diagnostic/d1-state.json
          cat fast-lane-shadow-runtime-diagnostic/d1-state.json

      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: fast-lane-shadow-runtime-diagnostic
          path: fast-lane-shadow-runtime-diagnostic
          if-no-files-found: error
          retention-days: 14
