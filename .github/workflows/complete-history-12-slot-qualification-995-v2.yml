name: Complete-history 12-slot qualification 995 v2

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/complete-history-12-slot-qualification-995-v2.yml
      - .github/complete-history-12-slot-qualification-995-v2-trigger
  push:
    branches: [main]
    paths:
      - .github/complete-history-12-slot-qualification-995-v2-trigger

permissions:
  contents: write
  issues: write

concurrency:
  group: complete-history-12-slot-qualification-995-v2
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
  PRODUCTION_BASE: https://xrpl-lending-monitor.badjoke-lab.workers.dev
  STATUS_ISSUE: '995'
  RUNTIME_SHA: ead8f7a2d06c7d010d2dbba076ec4d3fb6118c74
  DEPLOY_PROOF_PATH: .github/hybrid-transaction-detail-999-deploy-status.json
  PREPARE_UTC: '2026-07-24T16:10:00Z'
  START_UTC: '2026-07-24T16:15:00Z'
  END_UTC: '2026-07-24T17:10:00Z'
  EVALUATE_UTC: '2026-07-24T17:15:30Z'
  START_MS: '1784909700000'
  END_MS: '1784913000000'

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate fixed qualification boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .github/complete-history-12-slot-qualification-995-v2-trigger)" = \
            "qualify-${START_MS}-${END_MS}-${RUNTIME_SHA}"
          jq -e --arg runtime "$RUNTIME_SHA" '
            .passed==true
            and .runtimeSha==$runtime
            and .deployOutcome=="success"
            and .identityOutcome=="success"
            and .witnessOutcome=="success"
          ' "$DEPLOY_PROOF_PATH" >/dev/null
          jq -e '
            .main=="src/worker/p0-redundant-scheduler-entry.ts"
            and .triggers.crons==["*/5 * * * *"]
            and .vars.APP_NETWORK=="devnet"
            and .vars.MAINNET_ENABLED=="false"
            and .vars.FAST_LANE_MAX_LEDGERS_PER_RUN=="96"
            and (.queues.producers|length)==1
            and (.queues.consumers|length)==1
            and .queues.consumers[0].max_batch_size==1
            and .queues.consumers[0].max_concurrency==1
            and (.vars|has("REPLACEMENT_BASE_CUTOVER_TOKEN")|not)
          ' wrangler.jsonc >/dev/null
          python - <<'PY'
          from datetime import datetime, timezone
          start=datetime.fromisoformat("2026-07-24T16:15:00+00:00")
          end=datetime.fromisoformat("2026-07-24T17:10:00+00:00")
          evaluate=datetime.fromisoformat("2026-07-24T17:15:30+00:00")
          assert int(start.timestamp()*1000)==1784909700000
          assert int(end.timestamp()*1000)==1784913000000
          assert (end-start).total_seconds()==55*60
          assert (evaluate-end).total_seconds()>=300
          assert datetime.now(timezone.utc)<start
          PY

  qualify:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4

      - name: Arm Issue and wait for identity freeze point
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          start_epoch="$(date -u -d "$START_UTC" +%s)"
          now="$(date -u +%s)"
          test "$now" -lt "$start_epoch"
          gh issue edit "$STATUS_ISSUE" \
            --title 'P0 RUNNING — complete-history 12-slot pre-soak qualification v2'
          gh issue comment "$STATUS_ISSUE" --body "$(cat <<EOF
          ## Replacement 12-slot qualification armed

          - runtime: \`${RUNTIME_SHA}\`
          - start: \`${START_UTC}\` (2026-07-25 01:15 JST)
          - final slot: \`${END_UTC}\` (2026-07-25 02:10 JST)
          - evaluate: \`${EVALUATE_UTC}\` (2026-07-25 02:15:30 JST)
          - exact slots: 12 at 300,000 ms spacing
          - metric attribution: each metric must fall inside that Queue slot's persisted \`started_at\`–\`completed_at\` interval
          - production mutation during the window: none
          - deployment ID/version, base/epoch identity, cron, Queue topology and history publication are frozen and compared before/after
          EOF
          )"
          target="$(date -u -d "$PREPARE_UTC" +%s)"
          now="$(date -u +%s)"
          if [ "$now" -lt "$target" ]; then sleep "$((target-now))"; fi
          test "$(date -u +%s)" -lt "$start_epoch"

      - name: Capture pre-window production identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          query_d1() {
            local sql="$1" output="$2"
            jq -n --arg sql "$sql" '{sql:$sql}' \
              | curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
                  --connect-timeout 10 --max-time 45 \
                  -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  -H 'Content-Type: application/json' --data-binary @- \
                  "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query" \
              > "$output"
          }

          cf_get() {
            local path="$1" output="$2"
            curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}${path}" > "$output"
          }

          cf_get "/workers/scripts/xrpl-lending-monitor/deployments" pre-deployments.json
          cf_get "/workers/scripts/xrpl-lending-monitor/settings" pre-settings.json
          cf_get "/workers/scripts/xrpl-lending-monitor/schedules" pre-schedules.json
          query_d1 "SELECT * FROM fast_lane_shadow_base_binding WHERE network='devnet'" pre-base-binding.json
          query_d1 "SELECT epoch_id,base_snapshot_id,base_ledger_index,base_ledger_hash,overlay_ledger_index,overlay_ledger_hash FROM current_state_overlay_state WHERE network='devnet'" pre-overlay.json
          query_d1 "SELECT epoch_id,last_processed_ledger,last_processed_hash,latest_observed_ledger,latest_observed_hash,status FROM fast_lane_shadow_state WHERE network='devnet'" pre-fast.json
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            "${PRODUCTION_BASE}/api/status/history-source" > pre-history-source.json
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            "${PRODUCTION_BASE}/api/overview" > pre-overview.json

          python - <<'PY'
          import json
          from pathlib import Path
          def d1(path):
              p=json.loads(Path(path).read_text())
              rows=p.get("result",[{}])[0].get("results",[])
              return rows[0] if rows else None
          dep=json.loads(Path("pre-deployments.json").read_text())["result"]["deployments"][0]
          versions=dep.get("versions") or []
          assert len(versions)==1 and versions[0].get("percentage")==100
          settings=json.loads(Path("pre-settings.json").read_text())
          schedules=json.loads(Path("pre-schedules.json").read_text())
          bindings=settings.get("result",{}).get("bindings",[])
          def binding(name):
              vals=[b.get("text",b.get("value")) for b in bindings if b.get("name")==name]
              return vals[0] if vals else None
          identity={
              "deploymentId":dep.get("id"),
              "versionId":versions[0].get("version_id") or versions[0].get("id"),
              "deploymentCreatedOn":dep.get("created_on"),
              "appNetwork":binding("APP_NETWORK"),
              "mainnetEnabled":binding("MAINNET_ENABLED"),
              "maxLedgersPerRun":binding("FAST_LANE_MAX_LEDGERS_PER_RUN"),
              "queueBindings":[b for b in bindings if b.get("type")=="queue"],
              "schedules":schedules.get("result",{}).get("schedules",[]),
              "baseBinding":d1("pre-base-binding.json"),
              "overlayBase":d1("pre-overlay.json"),
              "fastEpoch":(d1("pre-fast.json") or {}).get("epoch_id"),
              "historySource":json.loads(Path("pre-history-source.json").read_text()),
          }
          assert identity["deploymentId"] and identity["versionId"]
          assert identity["appNetwork"]=="devnet"
          assert identity["mainnetEnabled"]=="false"
          assert identity["maxLedgersPerRun"]=="96"
          assert len(identity["queueBindings"])==1
          assert len(identity["schedules"])==1
          assert identity["schedules"][0].get("cron")=="*/5 * * * *"
          Path("pre-identity.json").write_text(json.dumps(identity,indent=2)+"\n")
          PY

      - name: Wait for fixed qualification window to close
        shell: bash
        run: |
          set -euo pipefail
          target="$(date -u -d "$EVALUATE_UTC" +%s)"
          now="$(date -u +%s)"
          if [ "$now" -lt "$target" ]; then sleep "$((target-now))"; fi

      - name: Read exact slot, metric, history and final identity evidence
        shell: bash
        run: |
          set -euo pipefail

          query_d1() {
            local sql="$1" output="$2"
            jq -n --arg sql "$sql" '{sql:$sql}' \
              | curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
                  --connect-timeout 10 --max-time 60 \
                  -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  -H 'Content-Type: application/json' --data-binary @- \
                  "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query" \
              > "$output"
          }

          cf_get() {
            local path="$1" output="$2"
            curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}${path}" > "$output"
          }

          query_d1 "SELECT scheduled_time,message_id,status,started_at,completed_at,next_scheduled_time,error_message,updated_at FROM fast_lane_queue_slots WHERE scheduled_time BETWEEN ${START_MS} AND ${END_MS} ORDER BY scheduled_time" slots.json

          query_d1 "SELECT s.scheduled_time,s.started_at AS slot_started_at,s.completed_at AS slot_completed_at,m.run_at,m.status AS metric_status,m.start_ledger_index,m.end_ledger_index,m.latest_observed_ledger,m.lag_ledgers,m.ledgers_processed,m.persistence_rows_read,m.persistence_rows_written,m.error_message AS metric_error FROM fast_lane_queue_slots s LEFT JOIN fast_lane_shadow_run_metrics m ON m.network='devnet' AND m.run_at>=s.started_at AND m.run_at<=s.completed_at WHERE s.scheduled_time BETWEEN ${START_MS} AND ${END_MS} ORDER BY s.scheduled_time,m.run_at" slot-metrics.json

          query_d1 "SELECT s.scheduled_time,s.started_at AS slot_started_at,s.completed_at AS slot_completed_at,h.start_ledger_index,h.end_ledger_index,h.end_ledger_hash,h.created_at,LENGTH(h.bundle_json) AS encoded_bytes,h.bundle_json FROM fast_lane_queue_slots s JOIN fast_lane_history_windows h ON h.network='devnet' AND h.created_at>=s.started_at AND h.created_at<=s.completed_at WHERE s.scheduled_time BETWEEN ${START_MS} AND ${END_MS} ORDER BY h.start_ledger_index,h.end_ledger_index,h.created_at" slot-windows.json

          query_d1 "SELECT epoch_id,last_processed_ledger,last_processed_hash,latest_observed_ledger,latest_observed_hash,status,(latest_observed_ledger-last_processed_ledger) AS lag_ledgers,updated_at FROM fast_lane_shadow_state WHERE network='devnet'" final-fast.json
          query_d1 "SELECT epoch_id,base_snapshot_id,base_ledger_index,base_ledger_hash,overlay_ledger_index,overlay_ledger_hash,updated_at FROM current_state_overlay_state WHERE network='devnet'" final-overlay.json
          query_d1 "SELECT * FROM fast_lane_shadow_base_binding WHERE network='devnet'" post-base-binding.json
          query_d1 "SELECT COUNT(*) AS compact_rows FROM fast_lane_shadow_objects_compact WHERE network='devnet'" compact.json
          query_d1 "SELECT COUNT(*) AS stale_rows FROM current_state_overlay_objects o WHERE o.network='devnet' AND NOT EXISTS (SELECT 1 FROM fast_lane_shadow_base_binding b WHERE b.network=o.network AND b.base_epoch_id=o.epoch_id AND b.base_snapshot_id=o.base_snapshot_id)" stale.json
          query_d1 "SELECT COUNT(*) AS retained_queue_slots,MIN(scheduled_time) AS first_slot,MAX(scheduled_time) AS last_slot FROM fast_lane_queue_slots WHERE status='completed'" queue-retention.json
          query_d1 "SELECT COUNT(*) AS retained_metrics,MIN(run_at) AS first_metric,MAX(run_at) AS last_metric FROM fast_lane_shadow_run_metrics WHERE network='devnet'" metric-retention.json
          query_d1 "SELECT COUNT(*) AS retained_windows,MIN(start_ledger_index) AS first_ledger,MAX(end_ledger_index) AS last_ledger,COALESCE(SUM(LENGTH(bundle_json)),0) AS payload_bytes FROM fast_lane_history_windows WHERE network='devnet'" window-retention.json

          cf_get "/workers/scripts/xrpl-lending-monitor/deployments" post-deployments.json
          cf_get "/workers/scripts/xrpl-lending-monitor/settings" post-settings.json
          cf_get "/workers/scripts/xrpl-lending-monitor/schedules" post-schedules.json

          for name_path in \
            "overview:/api/overview" \
            "history-source:/api/status/history-source" \
            "fast-lane-diff:/api/status/fast-lane-diff?limit=1" \
            "replacement-base:/api/status/replacement-base-rebase" \
            "pre-soak-readiness:/api/status/pre-soak-readiness"; do
            name="${name_path%%:*}"
            path="${name_path#*:}"
            curl --silent --show-error --retry 3 --retry-all-errors \
              --connect-timeout 10 --max-time 60 \
              -o "${name}.json" -w '%{http_code}' "${PRODUCTION_BASE}${path}" > "${name}.code"
          done

      - name: Decode, source-cross-audit and evaluate
        id: evaluate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip, json, re, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import quote, urlencode

          START_MS=1784909700000
          END_MS=1784913000000
          SLOT_MS=300000
          EXPECTED=[START_MS+i*SLOT_MS for i in range(12)]
          PRODUCTION="https://xrpl-lending-monitor.badjoke-lab.workers.dev"
          HASH_RE=re.compile(r"^[A-Fa-f0-9]{64}$")
          SEMANTIC_KEYS=("protocolEvents","objectChanges","loanLifecycle","archivedObjects","balanceHistory")

          def load(path):
              return json.loads(Path(path).read_text())
          def results(path):
              return load(path).get("result",[{}])[0].get("results",[])
          def one(path):
              rows=results(path)
              return rows[0] if rows else {}
          def curl_json(url, payload=None):
              cmd=["curl","--fail-with-body","--silent","--show-error","--retry","3","--retry-all-errors","--connect-timeout","10","--max-time","45"]
              if payload is not None:
                  cmd += ["-H","Content-Type: application/json","--data-binary",json.dumps(payload),url]
              else:
                  cmd += [url]
              proc=subprocess.run(cmd,text=True,capture_output=True)
              if proc.returncode:
                  raise RuntimeError(proc.stderr.strip() or f"curl_exit_{proc.returncode}")
              return json.loads(proc.stdout)
          def rpc(method, params):
              errors=[]
              for endpoint in (
                  "https://devnet.honeycluster.io/",
                  "https://s.devnet.rippletest.net:51234/",
                  "https://s.altnet.rippletest.net:51234/",
              ):
                  try:
                      payload=curl_json(endpoint,{"method":method,"params":[params]})
                      result=payload.get("result",{})
                      if "error" not in result:
                          return result, endpoint
                      errors.append(f"{endpoint}:{result.get('error')}")
                  except Exception as exc:
                      errors.append(f"{endpoint}:{exc}")
              raise RuntimeError("; ".join(errors))
          def contains_hash(value, target):
              if isinstance(value,str):
                  return value.upper()==target
              if isinstance(value,list):
                  return any(contains_hash(v,target) for v in value)
              if isinstance(value,dict):
                  return any(contains_hash(v,target) for v in value.values())
              return False
          def tx_hash(kind, record):
              key={
                  "protocolEvents":"eventHash",
                  "objectChanges":"transactionHash",
                  "loanLifecycle":"transactionHash",
                  "archivedObjects":"deletionTransactionHash",
                  "balanceHistory":"transactionHash",
              }[kind]
              value=record.get(key)
              return value.upper() if isinstance(value,str) and HASH_RE.fullmatch(value) else None

          slots=results("slots.json")
          slot_times=[int(row.get("scheduled_time",-1)) for row in slots]
          slots_exact=(slot_times==EXPECTED and len(slots)==12)
          slots_completed=(slots_exact and all(
              row.get("status")=="completed"
              and row.get("started_at")
              and row.get("completed_at")
              and row.get("error_message") in (None,"")
              for row in slots
          ))

          metric_rows=results("slot-metrics.json")
          grouped_metrics={slot:[] for slot in EXPECTED}
          for row in metric_rows:
              slot=int(row.get("scheduled_time",-1))
              if slot in grouped_metrics and row.get("run_at"):
                  grouped_metrics[slot].append(row)
          metric_errors=[]
          slot_resource=[]
          accepted_start=None
          accepted_end=None
          for slot in EXPECTED:
              group=grouped_metrics[slot]
              if not group:
                  metric_errors.append({"slot":slot,"reason":"missing_metrics"})
                  continue
              group.sort(key=lambda row:row["run_at"])
              bad=[row for row in group if row.get("metric_status")!="committed" or row.get("metric_error") not in (None,"")]
              if bad:
                  metric_errors.append({"slot":slot,"reason":"non_committed_or_error","rows":bad})
              terminal=group[-1]
              if int(terminal.get("lag_ledgers",-1))!=0:
                  metric_errors.append({"slot":slot,"reason":"terminal_lag_nonzero","lag":terminal.get("lag_ledgers")})
              starts=[int(row["start_ledger_index"]) for row in group if row.get("start_ledger_index") is not None]
              ends=[int(row["end_ledger_index"]) for row in group if row.get("end_ledger_index") is not None]
              if starts:
                  accepted_start=min(starts) if accepted_start is None else min(accepted_start,min(starts))
              if ends:
                  accepted_end=max(ends) if accepted_end is None else max(accepted_end,max(ends))
              slot_resource.append({
                  "slot":slot,
                  "metricCount":len(group),
                  "rowsRead":sum(int(row.get("persistence_rows_read") or 0) for row in group),
                  "rowsWritten":sum(int(row.get("persistence_rows_written") or 0) for row in group),
                  "terminalLag":int(terminal.get("lag_ledgers",-1)),
              })
          metrics_ok=not metric_errors

          windows=results("slot-windows.json")
          decoded=[]
          decode_errors=[]
          bundles=[]
          semantic_totals={key:0 for key in SEMANTIC_KEYS}
          max_encoded=0
          for row in windows:
              start=int(row["start_ledger_index"])
              end=int(row["end_ledger_index"])
              max_encoded=max(max_encoded,int(row.get("encoded_bytes") or 0))
              try:
                  value=row["bundle_json"]
                  if not isinstance(value,str) or not value.startswith("gzip-base64-v1:"):
                      raise ValueError("unexpected_encoding")
                  bundle=json.loads(gzip.decompress(base64.b64decode(value.split(":",1)[1])).decode())
                  if bundle.get("schemaVersion")!=1:
                      raise ValueError("invalid_schema_version")
                  counts={}
                  for key in SEMANTIC_KEYS:
                      records=bundle.get(key)
                      if not isinstance(records,list):
                          raise ValueError(f"missing_array:{key}")
                      counts[key]=len(records)
                      semantic_totals[key]+=len(records)
                  if int(bundle.get("startLedgerIndex",-1))!=start or int(bundle.get("endLedgerIndex",-1))!=end:
                      raise ValueError("bundle_window_identity_mismatch")
                  if str(bundle.get("endLedgerHash","")).upper()!=str(row.get("end_ledger_hash","")).upper():
                      raise ValueError("bundle_end_hash_mismatch")
                  bundles.append(bundle)
                  decoded.append({
                      "slot":int(row["scheduled_time"]),
                      "startLedgerIndex":start,
                      "endLedgerIndex":end,
                      "endLedgerHash":str(row["end_ledger_hash"]).upper(),
                      "encodedBytes":int(row.get("encoded_bytes") or 0),
                      "counts":counts,
                  })
              except Exception as exc:
                  decode_errors.append({"startLedgerIndex":start,"endLedgerIndex":end,"error":str(exc)})
          decoded.sort(key=lambda row:(row["startLedgerIndex"],row["endLedgerIndex"]))
          bundles.sort(key=lambda row:(int(row["startLedgerIndex"]),int(row["endLedgerIndex"])))
          coverage_ok=bool(decoded) and not decode_errors and len(decoded)==len(windows)
          for previous,current in zip(decoded,decoded[1:]):
              if current["startLedgerIndex"]!=previous["endLedgerIndex"]+1:
                  coverage_ok=False
          if accepted_start is None or accepted_end is None:
              coverage_ok=False
          elif decoded:
              coverage_ok=coverage_ok and decoded[0]["startLedgerIndex"]==accepted_start and decoded[-1]["endLedgerIndex"]==accepted_end

          ledger_checks=[]
          ledger_cache={}
          def ledger(index):
              if index not in ledger_cache:
                  result,endpoint=rpc("ledger",{"ledger_index":index,"transactions":False,"expand":False})
                  ledger_obj=result.get("ledger") or {}
                  ledger_cache[index]={
                      "index":index,
                      "hash":str(result.get("ledger_hash") or ledger_obj.get("hash") or "").upper(),
                      "parentHash":str(ledger_obj.get("parent_hash") or "").upper(),
                      "validated":bool(result.get("validated")),
                      "endpoint":endpoint,
                  }
              return ledger_cache[index]
          hash_continuity_ok=coverage_ok
          if coverage_ok:
              try:
                  for idx,row in enumerate(decoded):
                      end_ledger=ledger(row["endLedgerIndex"])
                      end_match=end_ledger["validated"] and end_ledger["hash"]==row["endLedgerHash"]
                      parent_match=True
                      if idx:
                          start_ledger=ledger(row["startLedgerIndex"])
                          parent_match=(
                              start_ledger["validated"]
                              and start_ledger["parentHash"]==decoded[idx-1]["endLedgerHash"]
                          )
                      ledger_checks.append({
                          "startLedgerIndex":row["startLedgerIndex"],
                          "endLedgerIndex":row["endLedgerIndex"],
                          "endHashMatch":end_match,
                          "parentHashMatch":parent_match,
                          "rpcEnd":end_ledger,
                      })
                      if not end_match or not parent_match:
                          hash_continuity_ok=False
              except Exception as exc:
                  hash_continuity_ok=False
                  ledger_checks.append({"error":str(exc)})

          class_records={key:[] for key in SEMANTIC_KEYS}
          for bundle in bundles:
              for key in SEMANTIC_KEYS:
                  class_records[key].extend(bundle[key])

          tx_cache={}
          def validated_tx(hash_value):
              if hash_value not in tx_cache:
                  result,endpoint=rpc("tx",{"transaction":hash_value,"binary":False})
                  returned=str(result.get("hash") or (result.get("tx_json") or {}).get("hash") or "").upper()
                  tx_cache[hash_value]={
                      "validated":bool(result.get("validated")),
                      "hash":returned,
                      "endpoint":endpoint,
                      "result":result,
                  }
              return tx_cache[hash_value]

          witnesses={}
          all_witnesses_ok=True
          for kind in SEMANTIC_KEYS:
              record=None
              hash_value=None
              for candidate in class_records[kind]:
                  candidate_hash=tx_hash(kind,candidate)
                  if not candidate_hash:
                      continue
                  if kind=="objectChanges" and (
                      candidate.get("objectType") not in ("Vault","LoanBroker","Loan")
                      or not candidate.get("objectId")
                  ):
                      continue
                  record=candidate
                  hash_value=candidate_hash
                  break
              witness={"observed":len(class_records[kind]),"found":record is not None,"hash":hash_value}
              if record is None or hash_value is None:
                  witness["passed"]=False
                  witness["reason"]="no_valid_class_witness"
                  all_witnesses_ok=False
                  witnesses[kind]=witness
                  continue
              try:
                  if kind=="protocolEvents":
                      path=f"/api/transactions/{hash_value}"
                  elif kind=="objectChanges":
                      path=f"/api/objects/{quote(str(record['objectType']))}/{quote(str(record['objectId']))}/history?limit=100"
                  elif kind=="loanLifecycle":
                      path=f"/api/loans/{quote(str(record['loanId']))}/lifecycle?limit=100"
                  elif kind=="archivedObjects":
                      path=f"/api/audit/archived/{quote(str(record['objectType']))}/{quote(str(record['objectId']))}"
                  else:
                      params={
                          "metric_type":record.get("metricType"),
                          "subject_type":record.get("subjectType"),
                          "subject_id":record.get("subjectId"),
                          "asset_key":record.get("assetKey"),
                          "limit":"100",
                      }
                      path="/api/audit/cover-loss?"+urlencode({k:v for k,v in params.items() if v not in (None,"")})
                  public=curl_json(PRODUCTION+path)
                  public_match=contains_hash(public,hash_value)
                  tx=validated_tx(hash_value)
                  source_match=tx["validated"] and tx["hash"]==hash_value
                  affected_match=True
                  transaction_type_match=True
                  if kind=="protocolEvents":
                      tx_json=tx["result"].get("tx_json") or tx["result"]
                      transaction_type_match=tx_json.get("TransactionType")==record.get("eventType")
                  if kind=="objectChanges":
                      meta=tx["result"].get("meta") or tx["result"].get("metaData") or {}
                      nodes=meta.get("AffectedNodes") or []
                      affected_match=False
                      expected_action={"created":"CreatedNode","modified":"ModifiedNode","deleted":"DeletedNode"}.get(record.get("action"))
                      for node in nodes:
                          if not isinstance(node,dict):
                              continue
                          inner=node.get(expected_action) if expected_action else None
                          if not isinstance(inner,dict):
                              continue
                          if str(inner.get("LedgerIndex","")).upper()==str(record.get("objectId","")).upper() and inner.get("LedgerEntryType")==record.get("objectType"):
                              affected_match=True
                              break
                  witness.update({
                      "path":path,
                      "publicMatch":public_match,
                      "sourceValidated":source_match,
                      "transactionTypeMatch":transaction_type_match,
                      "affectedNodeMatch":affected_match,
                      "passed":public_match and source_match and transaction_type_match and affected_match,
                      "record":record,
                  })
              except Exception as exc:
                  witness.update({"passed":False,"error":str(exc),"record":record})
              if not witness.get("passed"):
                  all_witnesses_ok=False
              witnesses[kind]=witness

          pre=load("pre-identity.json")
          dep=load("post-deployments.json")["result"]["deployments"][0]
          versions=dep.get("versions") or []
          post_settings=load("post-settings.json")
          post_schedules=load("post-schedules.json")
          bindings=post_settings.get("result",{}).get("bindings",[])
          def binding(name):
              vals=[b.get("text",b.get("value")) for b in bindings if b.get("name")==name]
              return vals[0] if vals else None
          post={
              "deploymentId":dep.get("id"),
              "versionId":(versions[0].get("version_id") or versions[0].get("id")) if len(versions)==1 else None,
              "appNetwork":binding("APP_NETWORK"),
              "mainnetEnabled":binding("MAINNET_ENABLED"),
              "maxLedgersPerRun":binding("FAST_LANE_MAX_LEDGERS_PER_RUN"),
              "queueBindings":[b for b in bindings if b.get("type")=="queue"],
              "schedules":post_schedules.get("result",{}).get("schedules",[]),
              "baseBinding":one("post-base-binding.json"),
              "overlayBase":one("final-overlay.json"),
              "fastEpoch":one("final-fast.json").get("epoch_id"),
              "historySource":load("history-source.json"),
          }
          stable_overlay_keys=("epoch_id","base_snapshot_id","base_ledger_index","base_ledger_hash")
          identity_checks={
              "deploymentId":pre.get("deploymentId")==post.get("deploymentId"),
              "versionId":pre.get("versionId")==post.get("versionId"),
              "baseBinding":pre.get("baseBinding")==post.get("baseBinding"),
              "overlayBase":all((pre.get("overlayBase") or {}).get(k)==(post.get("overlayBase") or {}).get(k) for k in stable_overlay_keys),
              "fastEpoch":pre.get("fastEpoch")==post.get("fastEpoch"),
              "historySource":pre.get("historySource")==post.get("historySource"),
              "appNetwork":post.get("appNetwork")=="devnet",
              "mainnetDisabled":post.get("mainnetEnabled")=="false",
              "maxLedgers":post.get("maxLedgersPerRun")=="96",
              "oneQueueBinding":len(post.get("queueBindings") or [])==1,
              "oneCron":len(post.get("schedules") or [])==1 and post["schedules"][0].get("cron")=="*/5 * * * *",
          }
          identity_ok=all(identity_checks.values())

          fast=one("final-fast.json")
          overlay=one("final-overlay.json")
          final_alignment=(
              int(fast.get("last_processed_ledger",-1))==int(overlay.get("overlay_ledger_index",-2))
              and str(fast.get("last_processed_hash","")).upper()==str(overlay.get("overlay_ledger_hash","")).upper()
              and int(fast.get("lag_ledgers",-1))==0
              and fast.get("status")=="healthy"
          )
          compact=int(one("compact.json").get("compact_rows",-1))
          stale=int(one("stale.json").get("stale_rows",-1))

          max_writes=max((row["rowsWritten"] for row in slot_resource),default=-1)
          total_writes=sum(row["rowsWritten"] for row in slot_resource)
          total_reads=sum(row["rowsRead"] for row in slot_resource)
          resource={
              "perSlot":slot_resource,
              "maxWritesPerSlot":max_writes,
              "projectedDailyRowsWritten":total_writes*24,
              "projectedDailyRowsRead":total_reads*24,
              "maxEncodedBytes":max_encoded,
          }
          resource["passed"]=(
              max_writes<=300
              and resource["projectedDailyRowsWritten"]<100000
              and resource["projectedDailyRowsRead"]<4000000
              and max_encoded<=131072
          )

          retention={
              "queue":one("queue-retention.json"),
              "metrics":one("metric-retention.json"),
              "historyWindows":one("window-retention.json"),
          }
          retention_ok=(
              int(retention["queue"].get("retained_queue_slots",0))>=288
              and int(retention["metrics"].get("retained_metrics",0))>=288
              and isinstance(post.get("historySource"),dict)
              and post["historySource"].get("status")=="ok"
          )

          http={name:Path(f"{name}.code").read_text().strip() for name in (
              "overview","history-source","fast-lane-diff","replacement-base","pre-soak-readiness"
          )}
          http_ok=all(code=="200" for code in http.values())

          protected_boundaries=[]
          for hour in (0,4,8,12,16,20):
              boundary=datetime(2026,7,24,hour,0,tzinfo=timezone.utc)
              ms=int(boundary.timestamp()*1000)
              if START_MS<=ms<=END_MS:
                  protected_boundaries.append(boundary.isoformat())
          protected_boundary_ok=(len(protected_boundaries)==0)

          checks={
              "exact12CompletedQueueSlots":slots_completed,
              "metricsExactlyAttributedCommittedTerminalLagZero":metrics_ok,
              "ledgerWindowCoverageExact":coverage_ok,
              "ledgerHashAndParentContinuity":hash_continuity_ok,
              "allBundlesDecodedWithFiveSemanticArrays":bool(decoded) and not decode_errors,
              "allFiveSemanticWitnessesPublicAndSourceVerified":all_witnesses_ok,
              "fastLaneCanonicalFinalAlignment":final_alignment,
              "compactZero":compact==0,
              "staleZero":stale==0,
              "deploymentBaseEpochPublicationIdentityStable":identity_ok,
              "resourceEnvelope":resource["passed"],
              "retentionFor24HourAudit":retention_ok,
              "publicStatusApis":http_ok,
              "protectedCollectorBoundaryRule":protected_boundary_ok,
          }
          passed=all(checks.values())
          summary={
              "checkedAt":datetime.now(timezone.utc).isoformat().replace("+00:00","Z"),
              "status":"passed" if passed else "failed",
              "passed":passed,
              "fixedWindow":{
                  "startUtc":"2026-07-24T16:15:00Z",
                  "endUtc":"2026-07-24T17:10:00Z",
                  "evaluateUtc":"2026-07-24T17:15:30Z",
                  "startJst":"2026-07-25T01:15:00+09:00",
                  "endJst":"2026-07-25T02:10:00+09:00",
                  "expectedSlots":12,
                  "spacingMs":300000,
              },
              "runtimeSha":"ead8f7a2d06c7d010d2dbba076ec4d3fb6118c74",
              "checks":checks,
              "failures":[key for key,value in checks.items() if not value],
              "slots":slots,
              "metricErrors":metric_errors,
              "metricsBySlot":slot_resource,
              "history":{
                  "windowCount":len(windows),
                  "decodedWindowCount":len(decoded),
                  "acceptedStartLedger":accepted_start,
                  "acceptedEndLedger":accepted_end,
                  "coverageFirstLedger":decoded[0]["startLedgerIndex"] if decoded else None,
                  "coverageLastLedger":decoded[-1]["endLedgerIndex"] if decoded else None,
                  "semanticTotals":semantic_totals,
                  "maxEncodedBytes":max_encoded,
                  "decodeErrors":decode_errors,
                  "ledgerContinuity":ledger_checks,
              },
              "semanticWitnesses":witnesses,
              "preIdentity":pre,
              "postIdentity":post,
              "identityChecks":identity_checks,
              "finalFastLane":fast,
              "finalCanonicalOverlay":overlay,
              "compactRows":compact,
              "staleRows":stale,
              "resource":resource,
              "retention":retention,
              "http":http,
              "protectedCollectorBoundariesInWindow":protected_boundaries,
              "qualificationScope":{
                  "automatedSourceAudit":"all five semantic classes with public API and XRPL source transaction validation; object change additionally matched to AffectedNodes",
                  "releaseCertification":False,
                  "note":"A pass qualifies the 12-slot pre-soak window only. It does not by itself certify the following 24-hour soak or Mainnet.",
              },
          }
          Path("complete-history-12-slot-qualification-995-v2.json").write_text(json.dumps(summary,indent=2)+"\n")
          Path("qualification-status.txt").write_text(summary["status"]+"\n")
          PY

      - name: Publish retained evidence and Issue result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          result=complete-history-12-slot-qualification-995-v2.json
          if [ ! -s "$result" ]; then
            jq -n \
              --arg checkedAt "$(date -u +%FT%TZ)" \
              --arg runUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              '{checkedAt:$checkedAt,status:"failed",passed:false,failures:["qualification_result_missing"],runUrl:$runUrl}' \
              > "$result"
          fi
          tmp="$(mktemp)"
          jq \
            --arg runUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg runId "$GITHUB_RUN_ID" \
            '. + {runUrl:$runUrl,runId:($runId|tonumber)}' "$result" > "$tmp"
          mv "$tmp" "$result"

          status="$(jq -r '.status' "$result")"
          if [ "$status" = passed ]; then
            title='P0 PASSED — complete-history 12-slot pre-soak qualification v2'
          else
            title='P0 FAILED — complete-history 12-slot pre-soak qualification v2'
          fi
          gh issue edit "$STATUS_ISSUE" --title "$title"

          {
            echo '## Complete-history 12-slot qualification v2 result'
            echo
            echo '```json'
            cat "$result"
            echo '```'
          } > issue-result.md
          gh issue comment "$STATUS_ISSUE" --body-file issue-result.md

          api="repos/${GITHUB_REPOSITORY}/contents/.github/complete-history-12-slot-qualification-995-v2.json"
          sha="$(gh api "$api" --jq .sha 2>/dev/null || true)"
          content="$(base64 -w0 "$result")"
          if [ -n "$sha" ]; then
            gh api --method PUT "$api" \
              -f message="Record ${status} complete-history qualification 995 v2" \
              -f content="$content" -f sha="$sha" -f branch=main >/dev/null
          else
            gh api --method PUT "$api" \
              -f message="Record ${status} complete-history qualification 995 v2" \
              -f content="$content" -f branch=main >/dev/null
          fi
          test "$status" = passed
