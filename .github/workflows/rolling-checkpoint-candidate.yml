name: Current-state overlay checkpoint candidate

on:
  workflow_dispatch:
    inputs:
      source_current_state_branch:
        description: Source current-state branch with a verified rolling base
        required: true
        default: current-state-four-hour-b-data
        type: string
      current_state_candidate_branch:
        description: Output current-state candidate branch
        required: true
        default: current-state-four-hour-a-data
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: current-state-overlay-checkpoint-candidate
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SOURCE_CURRENT_STATE_BRANCH: ${{ inputs.source_current_state_branch }}
      CURRENT_STATE_CANDIDATE_BRANCH: ${{ inputs.current_state_candidate_branch }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
    steps:
      - name: Check out implementation
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check out verified rolling base
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_current_state_branch }}
          path: .local/source-current
          sparse-checkout: rolling-base
          sparse-checkout-cone-mode: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Validate checkpoint boundary
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          git check-ref-format --branch "$SOURCE_CURRENT_STATE_BRANCH" >/dev/null
          git check-ref-format --branch "$CURRENT_STATE_CANDIDATE_BRANCH" >/dev/null
          test "$SOURCE_CURRENT_STATE_BRANCH" != "$CURRENT_STATE_CANDIDATE_BRANCH"
          jq -e '.triggers.crons == ["*/5 * * * *"] and .vars.APP_NETWORK == "devnet" and .vars.MAINNET_ENABLED == "false"' wrangler.jsonc >/dev/null
          node --check scripts/build-overlay-current-state-checkpoint.mjs
          node --check scripts/overlay-checkpoint/common.mjs
          node --check scripts/overlay-checkpoint/input.mjs
          node --check scripts/overlay-checkpoint/output.mjs
          jq -e '.complete == true and .network == "devnet" and .segmentCount == 64' .local/source-current/rolling-base/manifest.json >/dev/null

      - name: Fold D1 overlay into a new current-state checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .local/next-current-state /tmp/current-state-checkpoint-evidence
          node scripts/build-overlay-current-state-checkpoint.mjs \
            --base-dir .local/source-current/rolling-base \
            --output-dir .local/next-current-state \
            --evidence-dir /tmp/current-state-checkpoint-evidence \
            --page-size 50 \
            --lookup-prefix-length 3 \
            --rolling-segments 64 \
            | tee /tmp/current-state-checkpoint-evidence/builder.stdout.json
          jq -e '
            .mode == "d1-overlay-fold"
            and .target.ledgerIndex >= .source.ledgerIndex
            and .target.ledgerHash == .overlaySource.overlayLedgerHash
            and .rollingBase.segmentCount == 64
            and .target.manifestSha256 == .target.manifestSha256
          ' .local/next-current-state/rolling-read-model-summary.json >/dev/null

      - name: Publish current-state candidate branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/current-state-candidate
          mkdir -p /tmp/current-state-candidate
          cp -R .local/next-current-state/read-model /tmp/current-state-candidate/read-model
          cp -R .local/next-current-state/rolling-base /tmp/current-state-candidate/rolling-base
          cp .local/next-current-state/rolling-read-model-summary.json /tmp/current-state-candidate/rolling-read-model-summary.json

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout --orphan current-state-overlay-publish
          git rm -rf . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R /tmp/current-state-candidate/. .
          git add read-model rolling-base rolling-read-model-summary.json
          git commit -m "Publish D1 overlay-folded current-state checkpoint"
          DATA_SHA="$(git rev-parse HEAD)"
          MANIFEST_SHA="$(jq -r .target.manifestSha256 rolling-read-model-summary.json)"
          RELEASE_TAG="$(jq -r .target.releaseTag rolling-read-model-summary.json)"
          SNAPSHOT_ID="$(jq -r .target.snapshotId rolling-read-model-summary.json)"
          jq -n \
            --arg dataCommitSha "$DATA_SHA" \
            --arg manifestSha256 "$MANIFEST_SHA" \
            --arg releaseTag "$RELEASE_TAG" \
            --arg snapshotId "$SNAPSHOT_ID" \
            --arg updatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schemaVersion:1,active:{dataCommitSha:$dataCommitSha,manifestPath:"read-model/manifest.json",manifestSha256:$manifestSha256,releaseTag:$releaseTag,snapshotId:$snapshotId},updatedAt:$updatedAt}' \
            > channel.json
          git add channel.json
          git commit -m "Activate D1 overlay-folded current-state checkpoint"
          git push --force origin "HEAD:refs/heads/$CURRENT_STATE_CANDIDATE_BRANCH"
          git rev-parse HEAD > /tmp/current-state-checkpoint-evidence/candidate-commit-sha.txt

      - name: Upload current-state checkpoint evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: current-state-overlay-checkpoint-candidate
          path: /tmp/current-state-checkpoint-evidence
          if-no-files-found: warn
          retention-days: 30
