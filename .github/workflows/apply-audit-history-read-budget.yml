name: Apply audit history read budget

on:
  push:
    branches:
      - fix/history-audit-scan-budgets
    paths:
      - .github/workflows/apply-audit-history-read-budget.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/history-audit-scan-budgets
          fetch-depth: 0

      - name: Apply bounded audit history scan budgets
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/worker/repositories/hybrid-history-repository.ts')
          text = path.read_text()
          anchor = """import {
            mergeActivityHistory,
            mergeArchivedObjects,
            mergeBalanceHistory,
            mergeLoanLifecycleDetail,
            mergeLoanLifecycleExplorer,
            mergeObjectHistory,
          } from './merged-history-source'
          """
          constants = anchor + """

          const ARCHIVED_HISTORY_SEGMENT_READS = 24
          const BALANCE_HISTORY_SEGMENT_READS = 16
          const AUDIT_HISTORY_WALL_TIME_MS = 5_000
          """
          if anchor not in text:
              raise SystemExit('import anchor not found')
          text = text.replace(anchor, constants, 1)

          archive_old = """    limit: options.list.limit,
              cursor: options.immutableCursor,
            })
            const live = await listLiveArchivedObjectsAfterBoundary(
          """
          archive_new = """    limit: options.list.limit,
              cursor: options.immutableCursor,
              maxSegmentReads: ARCHIVED_HISTORY_SEGMENT_READS,
              maxWallTimeMs: AUDIT_HISTORY_WALL_TIME_MS,
            })
            const live = await listLiveArchivedObjectsAfterBoundary(
          """
          if archive_old not in text:
              raise SystemExit('archive read target not found')
          text = text.replace(archive_old, archive_new, 1)

          balance_old = """    limit: options.list.limit,
              cursor: options.immutableCursor,
            })
            const live = await listLiveBalanceHistoryAfterBoundary(
          """
          balance_new = """    limit: options.list.limit,
              cursor: options.immutableCursor,
              maxSegmentReads: BALANCE_HISTORY_SEGMENT_READS,
              maxWallTimeMs: AUDIT_HISTORY_WALL_TIME_MS,
            })
            const live = await listLiveBalanceHistoryAfterBoundary(
          """
          if balance_old not in text:
              raise SystemExit('balance read target not found')
          text = text.replace(balance_old, balance_new, 1)

          path.write_text(text)
          Path('.github/workflows/apply-audit-history-read-budget.yml').unlink()

      - name: Commit bounded budget changes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/worker/repositories/hybrid-history-repository.ts .github/workflows/apply-audit-history-read-budget.yml
          git commit -m "Bound sparse audit history scans by kind"
          git push origin HEAD:fix/history-audit-scan-budgets
