name: Temporary R4F proof resume patch

on:
  push:
    branches:
      - agent/r4f-proof-env-resume-prepared
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r4f-proof-env-resume-prepared
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Generate and verify exact patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/temporary-r4f-proof-resume-patch.py
          python3 scripts/temporary-r4f-proof-resume-patch.py
          python3 <<'PY'
          from pathlib import Path
          path = Path('scripts/test-r4f-revision4-12-ledger-qualification-contract.sh')
          text = path.read_text()
          text = text.replace(
              "grep -Fq 'Qualification state: `${QUALIFICATION_STATE_MODE}`' \"$workflow\"",
              "grep -Fq 'Qualification state: \\`${QUALIFICATION_STATE_MODE}\\`' \"$workflow\"",
          )
          text = text.replace(
              "grep -Fq 'Qualification state digest: `${QUALIFICATION_STATE_DIGEST}`' \"$workflow\"",
              "grep -Fq 'Qualification state digest: \\`${QUALIFICATION_STATE_DIGEST}\\`' \"$workflow\"",
          )
          for token in ('checkpointRev4Exists', 'rebindStrictRev4Exists', 'egressPolicyRows', 'runIdRows', 'evidenceRows'):
              text = text.replace(
                  f"grep -Fq '{token}' \"$workflow\"",
                  f"grep -Fq '{token}' \"$qualification_state\"",
              )
          text = text.replace(
              "grep -Fq \"policy_id='r5-revision4-egress-4581-v1'\" \"$workflow\"",
              "grep -Fq \"policy_id = 'r5-revision4-egress-4581-v1'\" \"$qualification_state\"",
          )
          for field, value in (
              ('maximum_ledgers_per_claim', '12'),
              ('maximum_billable_egress_bytes_per_ledger', '4581'),
              ('maximum_claim_billable_egress_bytes', '54972'),
              ('maximum_claim_exclusive_reservation_bytes', '54973'),
          ):
              text = text.replace(
                  f"grep -Fq '{field}={value}' \"$workflow\"",
                  f"grep -Fq '{field} = {value}' \"$qualification_state\"",
              )
          path.write_text(text)
          PY
          node --check scripts/inspect-r4f-revision4-qualification-state.mjs
          bun scripts/build-r4f-revision4-proof-bundle.ts \
            supabase/functions/xrpl-r4f-revision4-proof-batch/index.ts \
            /tmp/xrpl-r4f-revision4-proof-batch.ts
          test -s /tmp/xrpl-r4f-revision4-proof-batch.ts
          grep -Fq '__XRPL_R5_REVISION4_QUALIFICATION_OVERRIDE__' /tmp/xrpl-r4f-revision4-proof-batch.ts
          grep -Fq 'Deno.serve' /tmp/xrpl-r4f-revision4-proof-batch.ts
          if grep -Eq '\bDeno\.env\.(set|delete)[[:space:]]*\(' /tmp/xrpl-r4f-revision4-proof-batch.ts; then
            echo 'verified proof bundle mutates Deno.env' >&2
            exit 1
          fi
          bash -x scripts/test-r4f-revision4-12-ledger-qualification-contract.sh
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 2
          test "$(git diff --name-only | sed -n '1p')" = '.github/workflows/r4f-revision4-12-ledger-qualification.yml'
          test "$(git diff --name-only | sed -n '2p')" = 'scripts/test-r4f-revision4-12-ledger-qualification-contract.sh'
          mkdir -p /tmp/r4f-proof-resume-verified
          cp .github/workflows/r4f-revision4-12-ledger-qualification.yml /tmp/r4f-proof-resume-verified/workflow.yml
          cp scripts/test-r4f-revision4-12-ledger-qualification-contract.sh /tmp/r4f-proof-resume-verified/contract.sh
          cp /tmp/xrpl-r4f-revision4-proof-batch.ts /tmp/r4f-proof-resume-verified/proof-bundle.ts
          git diff --binary > /tmp/r4f-proof-resume-verified/changes.patch

      - name: Upload verified files
        uses: actions/upload-artifact@v4
        with:
          name: r4f-proof-resume-verified-files
          path: /tmp/r4f-proof-resume-verified
          if-no-files-found: error
          retention-days: 7
