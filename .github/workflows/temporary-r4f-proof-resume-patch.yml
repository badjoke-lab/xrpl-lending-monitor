name: Temporary R4F proof resume patch

on:
  push:
    branches:
      - agent/r4f-proof-env-resume-prepared
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r4f-proof-env-resume-prepared
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Generate and verify exact patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/temporary-r4f-proof-resume-patch.py
          python3 scripts/temporary-r4f-proof-resume-patch.py
          python3 <<'PY'
          from pathlib import Path
          path = Path('scripts/test-r4f-revision4-12-ledger-qualification-contract.sh')
          text = path.read_text()
          text = text.replace(
              "grep -Fq 'Qualification state: `${QUALIFICATION_STATE_MODE}`' \"$workflow\"",
              "grep -Fq 'Qualification state: \\`${QUALIFICATION_STATE_MODE}\\`' \"$workflow\"",
          )
          text = text.replace(
              "grep -Fq 'Qualification state digest: `${QUALIFICATION_STATE_DIGEST}`' \"$workflow\"",
              "grep -Fq 'Qualification state digest: \\`${QUALIFICATION_STATE_DIGEST}\\`' \"$workflow\"",
          )
          for token in ('checkpointRev4Exists', 'rebindStrictRev4Exists', 'egressPolicyRows', 'runIdRows', 'evidenceRows'):
              text = text.replace(
                  f"grep -Fq '{token}' \"$workflow\"",
                  f"grep -Fq '{token}' \"$qualification_state\"",
              )
          text = text.replace(
              "grep -Fq \"policy_id='r5-revision4-egress-4581-v1'\" \"$workflow\"",
              "grep -Fq \"policy_id = 'r5-revision4-egress-4581-v1'\" \"$qualification_state\"",
          )
          for field, value in (
              ('maximum_ledgers_per_claim', '12'),
              ('maximum_billable_egress_bytes_per_ledger', '4581'),
              ('maximum_claim_billable_egress_bytes', '54972'),
              ('maximum_claim_exclusive_reservation_bytes', '54973'),
          ):
              text = text.replace(
                  f"grep -Fq '{field}={value}' \"$workflow\"",
                  f"grep -Fq '{field} = {value}' \"$qualification_state\"",
              )
          path.write_text(text)
          PY
          node --check scripts/inspect-r4f-revision4-qualification-state.mjs
          bun scripts/build-r4f-revision4-proof-bundle.ts \
            supabase/functions/xrpl-r4f-revision4-proof-batch/index.ts \
            /tmp/xrpl-r4f-revision4-proof-batch.ts
          test -s /tmp/xrpl-r4f-revision4-proof-batch.ts
          grep -Fq '__XRPL_R5_REVISION4_QUALIFICATION_OVERRIDE__' /tmp/xrpl-r4f-revision4-proof-batch.ts
          grep -Fq 'Deno.serve' /tmp/xrpl-r4f-revision4-proof-batch.ts
          if grep -Eq '\bDeno\.env\.(set|delete)[[:space:]]*\(' /tmp/xrpl-r4f-revision4-proof-batch.ts; then
            echo 'verified proof bundle mutates Deno.env' >&2
            exit 1
          fi
          bash scripts/test-r4f-revision4-12-ledger-qualification-contract.sh
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 2
          test "$(git diff --name-only | sed -n '1p')" = '.github/workflows/r4f-revision4-12-ledger-qualification.yml'
          test "$(git diff --name-only | sed -n '2p')" = 'scripts/test-r4f-revision4-12-ledger-qualification-contract.sh'
          mkdir -p /tmp/r4f-proof-resume-verified
          cp .github/workflows/r4f-revision4-12-ledger-qualification.yml /tmp/r4f-proof-resume-verified/workflow.yml
          cp scripts/test-r4f-revision4-12-ledger-qualification-contract.sh /tmp/r4f-proof-resume-verified/contract.sh
          cp /tmp/xrpl-r4f-revision4-proof-batch.ts /tmp/r4f-proof-resume-verified/proof-bundle.ts
          git diff --binary > /tmp/r4f-proof-resume-verified/changes.patch

      - name: Create unreferenced clean five-file commit object
        id: clean_commit
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN: 9cfcf71eb46e6641185b6e079d4b73379f9681e7
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          headers=(-H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          main_sha="$(curl --fail-with-body --silent --show-error "${headers[@]}" "${api}/git/ref/heads/main" | jq -r '.object.sha')"
          test "$main_sha" = "$EXPECTED_MAIN"
          main_tree="$(curl --fail-with-body --silent --show-error "${headers[@]}" "${api}/git/commits/${main_sha}" | jq -r '.tree.sha')"
          [[ "$main_tree" =~ ^[a-f0-9]{40}$ ]]

          create_blob() {
            local path="$1"
            jq -Rs '{content: ., encoding: "utf-8"}' < "$path" \
              | curl --fail-with-body --silent --show-error "${headers[@]}" \
                  -X POST "${api}/git/blobs" --data-binary @- \
              | jq -r '.sha'
          }
          file_mode() {
            local path="$1"
            local mode
            mode="$(git ls-tree HEAD "$path" | awk '{print $1}')"
            test -n "$mode"
            printf '%s' "$mode"
          }

          workflow_path='.github/workflows/r4f-revision4-12-ledger-qualification.yml'
          wrapper_path='supabase/functions/xrpl-r4f-revision4-proof-batch/index.ts'
          builder_path='scripts/build-r4f-revision4-proof-bundle.ts'
          inspector_path='scripts/inspect-r4f-revision4-qualification-state.mjs'
          contract_path='scripts/test-r4f-revision4-12-ledger-qualification-contract.sh'

          workflow_blob="$(create_blob "$workflow_path")"
          wrapper_blob="$(create_blob "$wrapper_path")"
          builder_blob="$(create_blob "$builder_path")"
          inspector_blob="$(create_blob "$inspector_path")"
          contract_blob="$(create_blob "$contract_path")"
          for sha in "$workflow_blob" "$wrapper_blob" "$builder_blob" "$inspector_blob" "$contract_blob"; do
            [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          done

          jq -n \
            --arg base "$main_tree" \
            --arg wp "$workflow_path" --arg wm "$(file_mode "$workflow_path")" --arg ws "$workflow_blob" \
            --arg rp "$wrapper_path" --arg rm "$(file_mode "$wrapper_path")" --arg rs "$wrapper_blob" \
            --arg bp "$builder_path" --arg bm "$(file_mode "$builder_path")" --arg bs "$builder_blob" \
            --arg ip "$inspector_path" --arg im "$(file_mode "$inspector_path")" --arg is "$inspector_blob" \
            --arg cp "$contract_path" --arg cm "$(file_mode "$contract_path")" --arg cs "$contract_blob" \
            '{base_tree:$base,tree:[
              {path:$wp,mode:$wm,type:"blob",sha:$ws},
              {path:$rp,mode:$rm,type:"blob",sha:$rs},
              {path:$bp,mode:$bm,type:"blob",sha:$bs},
              {path:$ip,mode:$im,type:"blob",sha:$is},
              {path:$cp,mode:$cm,type:"blob",sha:$cs}
            ]}' > /tmp/clean-tree-request.json
          clean_tree="$(curl --fail-with-body --silent --show-error "${headers[@]}" -X POST "${api}/git/trees" --data-binary @/tmp/clean-tree-request.json | jq -r '.sha')"
          [[ "$clean_tree" =~ ^[a-f0-9]{40}$ ]]

          jq -n --arg message 'Resume prepared revision4 proof without Edge env mutation' --arg tree "$clean_tree" --arg parent "$main_sha" \
            '{message:$message,tree:$tree,parents:[$parent]}' > /tmp/clean-commit-request.json
          clean_commit="$(curl --fail-with-body --silent --show-error "${headers[@]}" -X POST "${api}/git/commits" --data-binary @/tmp/clean-commit-request.json | jq -r '.sha')"
          [[ "$clean_commit" =~ ^[a-f0-9]{40}$ ]]
          jq -n --arg main "$main_sha" --arg tree "$clean_tree" --arg commit "$clean_commit" \
            '{main:$main,tree:$tree,commit:$commit,changedFiles:5,refUpdated:false}' \
            > /tmp/r4f-proof-resume-verified/clean-commit.json
          printf 'clean_commit=%s\n' "$clean_commit" >> "$GITHUB_OUTPUT"
          echo "clean unreferenced commit: $clean_commit"

      - name: Upload verified files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r4f-proof-resume-verified-files
          path: /tmp/r4f-proof-resume-verified
          if-no-files-found: error
          retention-days: 7
