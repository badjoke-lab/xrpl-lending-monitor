name: Diagnose production Search

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-production-search.yml'

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p production-search-diagnostic

      - name: Resolve production URL
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            > production-search-diagnostic/subdomain.json
          SUBDOMAIN="$(jq -r '.result.subdomain // empty' production-search-diagnostic/subdomain.json)"
          test -n "${SUBDOMAIN}"
          printf '%s\n' "https://xrpl-lending-monitor.${SUBDOMAIN}.workers.dev" \
            > production-search-diagnostic/production-url.txt

      - name: Tail and request failing Search query
        shell: bash
        run: |
          set +e
          PRODUCTION_BASE="$(cat production-search-diagnostic/production-url.txt)"
          timeout 45s pnpm exec wrangler tail xrpl-lending-monitor \
            --format json \
            > production-search-diagnostic/tail.jsonl 2>&1 &
          TAIL_PID=$!
          sleep 6
          curl --silent --show-error \
            --dump-header production-search-diagnostic/response.headers \
            --output production-search-diagnostic/response.body \
            --write-out '%{http_code}\n' \
            "${PRODUCTION_BASE}/api/search?q=F36BD84ADA7929AF8F86C3C2820BF30F98E31A7E7B509F06BF8A0E2311F27696&limit=100" \
            > production-search-diagnostic/response.status
          sleep 10
          kill "${TAIL_PID}" 2>/dev/null || true
          wait "${TAIL_PID}" 2>/dev/null || true
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-search-diagnostic
          path: production-search-diagnostic
          if-no-files-found: error
          retention-days: 7
