name: Formal Free-operation soak strict parity monitor

on:
  schedule:
    - cron: '8 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: formal-free-operation-soak-strict-parity-monitor
  cancel-in-progress: false

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PRODUCTION_DIFF: https://xrpl-lending-monitor.badjoke-lab.workers.dev/api/status/fast-lane-diff?limit=500
    steps:
      - uses: actions/checkout@v4

      - name: Enforce accepted live parity during formal window
        shell: bash
        run: |
          set -Eeuo pipefail
          issue="$(jq -r '.issueNumber' .github/formal-free-soak-window.json)"
          start="$(jq -r '.startUtc' .github/formal-free-soak-window.json)"
          end="$(jq -r '.endUtc' .github/formal-free-soak-window.json)"
          now_epoch="$(date -u +%s)"
          start_epoch="$(date -u -d "$start" +%s)"
          end_epoch="$(date -u -d "$end" +%s)"

          if test "$now_epoch" -lt "$start_epoch" || test "$now_epoch" -ge "$end_epoch"; then
            echo 'Formal soak window is not active.'
            exit 0
          fi

          mkdir -p strict-parity-evidence
          http="$(curl --silent --show-error --retry 3 -o strict-parity-evidence/diff.json -w '%{http_code}' "$PRODUCTION_DIFF")"
          if test "$http" = 200 && jq -e '
            .status == "ok"
            and .passed == true
            and .reason == null
            and .fastLane.ledgerIndex == .canonicalOverlay.ledgerIndex
            and .fastLane.ledgerHash == .canonicalOverlay.ledgerHash
            and (.sample.canonicalAheadRows // 0) == 0
            and (.sample.exactProjectionMismatches // 0) == 0
          ' strict-parity-evidence/diff.json > /dev/null; then
            exit 0
          fi

          {
            echo 'Formal Free-operation soak failed strict parity monitoring:'
            echo
            echo '```json'
            cat strict-parity-evidence/diff.json
            echo '```'
          } > strict-parity-evidence/comment.md
          gh issue comment "$issue" --repo "$REPOSITORY" --body-file strict-parity-evidence/comment.md
          gh issue edit "$issue" --repo "$REPOSITORY" \
            --title 'FAILED — 24h five-minute Free-operation soak post-recovery 2026-07-22 09:15 JST' \
            --state closed
          exit 1

      - name: Upload strict parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formal-free-operation-soak-strict-parity
          path: strict-parity-evidence
          if-no-files-found: warn
          retention-days: 30
