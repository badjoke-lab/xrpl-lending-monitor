name: Current-state artifact measurement

on:
  workflow_dispatch:
    inputs:
      full_run:
        description: Run until the fixed ledger is complete
        required: true
        default: false
        type: boolean
      page_budget:
        description: Page budget when full_run is false
        required: true
        default: '500'
        type: string
      ledger_index:
        description: Optional fixed validated ledger index
        required: false
        type: string
      ledger_hash:
        description: Optional fixed validated ledger hash
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: current-state-artifact-measurement
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run local artifact measurement
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --local
            --root .local/current-state-measurement
            --output .local/current-state-measurement/evidence-copy.json
          )
          if [[ '${{ inputs.full_run }}' != 'true' ]]; then
            args+=(--page-budget '${{ inputs.page_budget }}')
          fi
          if [[ -n '${{ inputs.ledger_index }}' || -n '${{ inputs.ledger_hash }}' ]]; then
            if [[ -z '${{ inputs.ledger_index }}' || -z '${{ inputs.ledger_hash }}' ]]; then
              echo 'ledger_index and ledger_hash must be supplied together' >&2
              exit 1
            fi
            args+=(--ledger-index '${{ inputs.ledger_index }}')
            args+=(--ledger-hash '${{ inputs.ledger_hash }}')
          fi
          pnpm artifact:measure -- "${args[@]}"

      - name: Upload measurement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-state-artifact-measurement
          if-no-files-found: warn
          retention-days: 7
          path: |
            .local/current-state-measurement/run.json
            .local/current-state-measurement/evidence.json
            .local/current-state-measurement/evidence-copy.json
            .local/current-state-measurement/checkpoints/*.json
