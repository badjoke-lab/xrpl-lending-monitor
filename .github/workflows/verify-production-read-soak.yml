name: Verify production read soak

on:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-production-read-soak.yml'
      - 'scripts/verify-production-read-audit.ts'
      - 'vite.production-read-audit.config.ts'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-production-read-soak.yml'
      - 'scripts/verify-production-read-audit.ts'
      - 'vite.production-read-audit.config.ts'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

concurrency:
  group: verify-production-read-soak
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p production-read-audit

      - name: Build production verifier
        run: pnpm exec vite build --config vite.production-read-audit.config.ts

      - name: Resolve production URL
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            > production-read-audit/subdomain.json
          SUBDOMAIN="$(jq -r '.result.subdomain // empty' production-read-audit/subdomain.json)"
          test -n "${SUBDOMAIN}"
          printf '%s\n' "https://xrpl-lending-monitor.${SUBDOMAIN}.workers.dev" \
            > production-read-audit/production-url.txt

      - name: Capture production schedule
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-monitor/schedules" \
            > production-read-audit/schedules.json
          jq -e '.success == true and (.result.schedules | length == 1) and any(.result.schedules[]; .cron == "*/5 * * * *")' \
            production-read-audit/schedules.json > /dev/null

      - name: Capture fast-lane state
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler d1 execute xrpl-lending-monitor --remote \
            --command "SELECT epoch_id,last_processed_ledger,last_processed_hash,latest_observed_ledger,latest_observed_hash,status,updated_at FROM fast_lane_shadow_state WHERE network='devnet';" \
            --json > production-read-audit/state-raw.txt
          sed -n '/^\[/,$p' production-read-audit/state-raw.txt \
            > production-read-audit/state.json
          jq -e 'type == "array" and length > 0 and .[0].success == true and (.[0].results | length == 1)' \
            production-read-audit/state.json > /dev/null

      - name: Capture fast-lane base binding
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler d1 execute xrpl-lending-monitor --remote \
            --command "SELECT shadow_epoch_id,base_epoch_id,base_snapshot_id,base_ledger_index,base_ledger_hash,bound_at FROM fast_lane_shadow_base_binding WHERE network='devnet';" \
            --json > production-read-audit/binding-raw.txt
          sed -n '/^\[/,$p' production-read-audit/binding-raw.txt \
            > production-read-audit/binding.json
          jq -e 'type == "array" and length > 0 and .[0].success == true and (.[0].results | length == 1)' \
            production-read-audit/binding.json > /dev/null

      - name: Capture recent fast-lane run metrics
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler d1 execute xrpl-lending-monitor --remote \
            --command "SELECT run_at,status,start_ledger_index,end_ledger_index,latest_observed_ledger,lag_ledgers,ledgers_processed,lending_transactions,coalesced_object_rows,persistence_rows_read,persistence_rows_written FROM fast_lane_shadow_run_metrics WHERE network='devnet' ORDER BY run_at DESC LIMIT 6;" \
            --json > production-read-audit/metrics-raw.txt
          sed -n '/^\[/,$p' production-read-audit/metrics-raw.txt \
            > production-read-audit/metrics.json
          jq -e 'type == "array" and length > 0 and .[0].success == true and (.[0].results | length >= 3)' \
            production-read-audit/metrics.json > /dev/null

      - name: Capture rolling production health
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler d1 execute xrpl-lending-monitor --remote \
            --command "WITH ordered AS (SELECT run_at,status,lag_ledgers,LAG(run_at) OVER (ORDER BY run_at) AS previous_run_at FROM fast_lane_shadow_run_metrics WHERE network='devnet' AND julianday(run_at) >= julianday('now','-30 minutes')),summary AS (SELECT COUNT(*) AS run_count,SUM(CASE WHEN status NOT IN ('caught_up','committed','reanchored') THEN 1 ELSE 0 END) AS failure_count,COALESCE(MAX(lag_ledgers),0) AS max_lag_ledgers,COALESCE(MAX(CASE WHEN previous_run_at IS NULL THEN 0 ELSE ROUND((julianday(run_at)-julianday(previous_run_at))*86400) END),0) AS max_gap_seconds,MIN(run_at) AS first_run_at,MAX(run_at) AS last_run_at FROM ordered) SELECT summary.*,COALESCE(ROUND((julianday('now')-julianday(last_run_at))*86400),999999) AS last_run_age_seconds FROM summary;" \
            --json > production-read-audit/rolling-health-raw.txt
          sed -n '/^\[/,$p' production-read-audit/rolling-health-raw.txt \
            > production-read-audit/rolling-health.json
          jq -e '
            type == "array"
            and length > 0
            and .[0].success == true
            and (.[0].results | length == 1)
            and (.[0].results[0].run_count >= 4)
            and (.[0].results[0].failure_count == 0)
            and (.[0].results[0].max_lag_ledgers <= 10)
            and (.[0].results[0].max_gap_seconds <= 420)
            and (.[0].results[0].last_run_age_seconds <= 420)
          ' production-read-audit/rolling-health.json > /dev/null

      - name: Verify production current-state reads and recent cron cycles
        run: |
          PRODUCTION_BASE="$(cat production-read-audit/production-url.txt)"
          node .production-read-audit-build/verify-production-read-audit.mjs \
            --base "${PRODUCTION_BASE}" \
            --state production-read-audit/state.json \
            --binding production-read-audit/binding.json \
            --metrics production-read-audit/metrics.json \
            --schedules production-read-audit/schedules.json \
            --output production-read-audit/summary.json \
            2>&1 | tee production-read-audit/verify.log
          jq -e '.passed == true and .schedule.count == 1 and .state.lagLedgers <= 10 and .fastLaneDiff.exactProjectionMismatches == 0' \
            production-read-audit/summary.json > /dev/null

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: production-read-soak-audit
          path: production-read-audit
          if-no-files-found: warn
          retention-days: 14

      - name: Open production freshness incident
        if: ${{ failure() && github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TITLE='P0: production freshness regression'
          EXISTING="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --search 'P0 production freshness regression in:title' --json number,title --jq 'map(select(.title == "P0: production freshness regression")) | .[0].number // empty')"
          if [ -n "${EXISTING}" ]; then
            exit 0
          fi
          gh issue create \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${TITLE}" \
            --body "The permanent production freshness monitor failed. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Treat this as a P0 until the five-minute cron, rolling run count, maximum gap, ledger lag, current-state reads, and fast-lane parity are verified healthy again."
