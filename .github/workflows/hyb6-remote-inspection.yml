name: HYB-6 remote state inspection

on:
  push:
    branches:
      - ops/hyb6-remote-inspection
    paths:
      - .github/workflows/hyb6-remote-inspection.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/hyb6-remote-inspection.yml

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Inspect remote D1 state
        shell: bash
        run: |
          set +e
          mkdir -p remote-inspection

          pnpm exec wrangler d1 execute xrpl-lending-monitor --remote \
            --command "SELECT name FROM sqlite_master WHERE type = 'table' ORDER BY name;" \
            > remote-inspection/tables.txt 2>&1
          echo $? > remote-inspection/tables.exit-code

          pnpm exec wrangler d1 execute xrpl-lending-monitor --remote \
            --command "SELECT * FROM sync_state WHERE network = 'devnet';" \
            > remote-inspection/sync-state.txt 2>&1
          echo $? > remote-inspection/sync-state.exit-code

          pnpm exec wrangler d1 execute xrpl-lending-monitor --remote \
            --command "SELECT id, status, first_ledger_index, first_ledger_hash, last_ledger_index, last_ledger_hash, started_at, ended_at FROM network_epochs WHERE network = 'devnet' ORDER BY created_at DESC LIMIT 10;" \
            > remote-inspection/network-epochs.txt 2>&1
          echo $? > remote-inspection/network-epochs.exit-code

          pnpm exec wrangler d1 execute xrpl-lending-monitor --remote \
            --command "SELECT network, epoch_id, base_snapshot_id, base_ledger_index, base_ledger_hash, overlay_ledger_index, overlay_ledger_hash, updated_at FROM current_state_overlay_state WHERE network = 'devnet' ORDER BY updated_at DESC LIMIT 10;" \
            > remote-inspection/overlay-state.txt 2>&1
          echo $? > remote-inspection/overlay-state.exit-code

          pnpm exec wrangler d1 execute xrpl-lending-monitor --remote \
            --command "SELECT COUNT(*) AS processed_ledger_count, MIN(ledger_index) AS min_ledger, MAX(ledger_index) AS max_ledger FROM processed_ledgers WHERE network = 'devnet';" \
            > remote-inspection/processed-ledgers.txt 2>&1
          echo $? > remote-inspection/processed-ledgers.exit-code

          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: hyb6-remote-inspection
          path: remote-inspection
          if-no-files-found: error
