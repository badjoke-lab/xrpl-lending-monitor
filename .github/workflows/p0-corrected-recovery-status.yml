name: P0 exact D1 binding diagnostic

on:
  push:
    branches: [main]
    paths:
      - .github/p0-stale-overlay-cleanup-trigger

permissions:
  contents: read
  issues: write

concurrency:
  group: p0-d1-binding-diagnostic-3800885
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: '946'
    steps:
      - name: Read D1 write usage and overlay schema
        shell: bash
        run: |
          set -u
          mkdir -p diagnostic-evidence

          query_d1() {
            local sql="$1"
            local output="$2"
            jq -n --arg sql "$sql" '{sql:$sql}' \
              | curl --fail-with-body --silent --show-error \
                  -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  -H 'Content-Type: application/json' \
                  --data-binary @- \
                  "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query" \
              > "$output" 2> "${output}.stderr"
            return 0
          }

          query_d1 "SELECT type,name,tbl_name,sql FROM sqlite_master WHERE tbl_name IN ('current_state_overlay_objects','current_state_overlay_state') OR name LIKE 'current_state_overlay_%' ORDER BY type,name" diagnostic-evidence/schema.json
          query_d1 "PRAGMA table_info(current_state_overlay_objects)" diagnostic-evidence/objects-columns.json
          query_d1 "PRAGMA table_info(current_state_overlay_state)" diagnostic-evidence/state-columns.json
          query_d1 "SELECT COUNT(*) AS stale_rows,COALESCE(SUM(LENGTH(o.projection_json)),0) AS stale_payload_bytes FROM current_state_overlay_objects o WHERE o.network='devnet' AND NOT EXISTS (SELECT 1 FROM fast_lane_shadow_base_binding b WHERE b.network=o.network AND b.base_epoch_id=o.epoch_id AND b.base_snapshot_id=o.base_snapshot_id)" diagnostic-evidence/stale.json

          today="$(date -u +%F)"
          read -r -d '' query <<'GRAPHQL' || true
          query D1Usage($accountTag:string!,$start:Date,$end:Date,$databaseId:string){viewer{accounts(filter:{accountTag:$accountTag}){d1AnalyticsAdaptiveGroups(limit:10000,filter:{date_geq:$start,date_leq:$end,databaseId:$databaseId}){sum{rowsRead rowsWritten}}}}}
          GRAPHQL
          jq -n --arg query "$query" --arg accountTag "$CLOUDFLARE_ACCOUNT_ID" --arg start "$today" --arg end "$today" --arg databaseId "$DATABASE_ID" '{query:$query,variables:{accountTag:$accountTag,start:$start,end:$end,databaseId:$databaseId}}' > diagnostic-evidence/usage-request.json
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'content-type: application/json' \
            --data @diagnostic-evidence/usage-request.json \
            https://api.cloudflare.com/client/v4/graphql > diagnostic-evidence/usage.json

          jq -n \
            --slurpfile schema diagnostic-evidence/schema.json \
            --slurpfile objectColumns diagnostic-evidence/objects-columns.json \
            --slurpfile stateColumns diagnostic-evidence/state-columns.json \
            --slurpfile stale diagnostic-evidence/stale.json \
            --slurpfile usage diagnostic-evidence/usage.json \
            '{schema:$schema[0],objectColumns:$objectColumns[0],stateColumns:$stateColumns[0],stale:$stale[0],usage:$usage[0]}' \
            > diagnostic-evidence/summary.json

      - name: Report exact diagnostic
        if: always()
        shell: bash
        run: |
          test -s diagnostic-evidence/summary.json || echo '{"passed":false,"reason":"diagnostic step failed before summary"}' > diagnostic-evidence/summary.json
          {
            echo 'D1 cleanup feasibility diagnostic:'
            echo
            echo '```json'
            cat diagnostic-evidence/summary.json
            echo '```'
          } > diagnostic-evidence/comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body-file diagnostic-evidence/comment.md

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-cleanup-feasibility-diagnostic
          path: diagnostic-evidence
          if-no-files-found: warn
          retention-days: 14
