name: P0 guarded stale overlay cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/p0-stale-overlay-cleanup-trigger
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: p0-stale-overlay-cleanup-3800885
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event_name == 'push' || startsWith(github.event.issue.title, 'P0 stale overlay cleanup after base 3800885')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      TARGET_EPOCH: devnet-3371675
      TARGET_SNAPSHOT: devnet-3800885-eaa0d29666e7
      TARGET_LEDGER: '3800885'
      TARGET_HASH: EAA0D29666E73D7594A52DF8000B07F346CD4DA24A9A07549612CDC7D727B700
    steps:
      - name: Verify active binding and delete only stale overlay snapshots
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p cleanup-evidence

          query_d1() {
            local sql="$1"
            local output="$2"
            jq -n --arg sql "$sql" '{sql:$sql}' \
              | curl --fail-with-body --silent --show-error \
                  -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  -H 'Content-Type: application/json' \
                  --data-binary @- \
                  "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query" \
              > "$output"
            jq -e '.success == true and ((.errors // []) | length) == 0' "$output" > /dev/null
          }

          query_d1 "SELECT base_epoch_id,base_snapshot_id,base_ledger_index,base_ledger_hash FROM fast_lane_shadow_base_binding WHERE network='devnet'" cleanup-evidence/binding.json
          jq -e --arg epoch "$TARGET_EPOCH" --arg snapshot "$TARGET_SNAPSHOT" --argjson ledger "$TARGET_LEDGER" --arg hash "$TARGET_HASH" '
            .result[0].results | length == 1
            and .[0].base_epoch_id == $epoch
            and .[0].base_snapshot_id == $snapshot
            and .[0].base_ledger_index == $ledger
            and .[0].base_ledger_hash == $hash
          ' cleanup-evidence/binding.json > /dev/null

          query_d1 "SELECT COUNT(*) AS stale_rows,COALESCE(SUM(LENGTH(projection_json)),0) AS stale_payload_bytes FROM current_state_overlay_objects o WHERE o.network='devnet' AND NOT EXISTS (SELECT 1 FROM fast_lane_shadow_base_binding b WHERE b.network=o.network AND b.base_epoch_id=o.epoch_id AND b.base_snapshot_id=o.base_snapshot_id)" cleanup-evidence/stale-before.json
          stale_rows="$(jq -r '.result[0].results[0].stale_rows' cleanup-evidence/stale-before.json)"

          if [ "$stale_rows" -gt 0 ]; then
            today="$(date -u +%F)"
            read -r -d '' query <<'GRAPHQL' || true
          query D1Usage($accountTag:string!,$start:Date,$end:Date,$databaseId:string){viewer{accounts(filter:{accountTag:$accountTag}){d1AnalyticsAdaptiveGroups(limit:10000,filter:{date_geq:$start,date_leq:$end,databaseId:$databaseId}){sum{rowsRead rowsWritten}}}}}
          GRAPHQL
            jq -n --arg query "$query" --arg accountTag "$CLOUDFLARE_ACCOUNT_ID" --arg start "$today" --arg end "$today" --arg databaseId "$DATABASE_ID" '{query:$query,variables:{accountTag:$accountTag,start:$start,end:$end,databaseId:$databaseId}}' > cleanup-evidence/usage-request.json
            curl --fail-with-body --silent --show-error -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'content-type: application/json' \
              --data @cleanup-evidence/usage-request.json \
              https://api.cloudflare.com/client/v4/graphql > cleanup-evidence/usage-response.json
            jq -e '((.errors // []) | length) == 0 and (.data.viewer.accounts | length) > 0' cleanup-evidence/usage-response.json > /dev/null
            rows_written="$(jq '[.data.viewer.accounts[0].d1AnalyticsAdaptiveGroups[].sum.rowsWritten // 0] | add // 0' cleanup-evidence/usage-response.json)"
            remaining=$((100000 - rows_written))
            test "$remaining" -ge "$((stale_rows + 5000))"

            query_d1 "DELETE FROM current_state_overlay_objects WHERE network='devnet' AND NOT EXISTS (SELECT 1 FROM fast_lane_shadow_base_binding b WHERE b.network=current_state_overlay_objects.network AND b.base_epoch_id=current_state_overlay_objects.epoch_id AND b.base_snapshot_id=current_state_overlay_objects.base_snapshot_id)" cleanup-evidence/delete-objects.json
            query_d1 "DELETE FROM current_state_overlay_state WHERE network='devnet' AND NOT EXISTS (SELECT 1 FROM fast_lane_shadow_base_binding b WHERE b.network=current_state_overlay_state.network AND b.base_epoch_id=current_state_overlay_state.epoch_id AND b.base_snapshot_id=current_state_overlay_state.base_snapshot_id)" cleanup-evidence/delete-state.json
          fi

          query_d1 "SELECT COUNT(*) AS total_rows,COALESCE(SUM(LENGTH(projection_json)),0) AS total_payload_bytes FROM current_state_overlay_objects WHERE network='devnet'" cleanup-evidence/overlay-after.json
          query_d1 "SELECT COUNT(*) AS stale_rows FROM current_state_overlay_objects o WHERE o.network='devnet' AND NOT EXISTS (SELECT 1 FROM fast_lane_shadow_base_binding b WHERE b.network=o.network AND b.base_epoch_id=o.epoch_id AND b.base_snapshot_id=o.base_snapshot_id)" cleanup-evidence/stale-after.json
          test "$(jq -r '.result[0].results[0].stale_rows' cleanup-evidence/stale-after.json)" = 0

          jq -n --argjson passed true --argjson staleRowsBefore "$stale_rows" --slurpfile binding cleanup-evidence/binding.json --slurpfile overlayAfter cleanup-evidence/overlay-after.json '{passed:$passed,staleRowsBefore:$staleRowsBefore,binding:$binding[0],overlayAfter:$overlayAfter[0]}' > cleanup-evidence/summary.json

      - name: Report cleanup result to issue
        if: always() && github.event_name == 'issues'
        shell: bash
        run: |
          test -s cleanup-evidence/summary.json || echo '{"passed":false}' > cleanup-evidence/summary.json
          {
            echo 'Guarded stale overlay cleanup result:'
            echo
            echo '```json'
            cat cleanup-evidence/summary.json
            echo '```'
          } > cleanup-evidence/comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body-file cleanup-evidence/comment.md

      - name: Upload cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guarded-stale-overlay-cleanup
          path: cleanup-evidence
          if-no-files-found: warn
          retention-days: 14
