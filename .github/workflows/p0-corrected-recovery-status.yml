name: P0 D1 write headroom

on:
  push:
    branches: [main]
    paths:
      - .github/p0-stale-overlay-cleanup-trigger

permissions:
  contents: read
  issues: write

concurrency:
  group: p0-d1-write-headroom
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: '948'
    steps:
      - name: Read rows written and stale rows
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p headroom-evidence

          jq -n --arg sql "SELECT COUNT(*) AS stale_rows FROM current_state_overlay_objects o WHERE o.network='devnet' AND NOT EXISTS (SELECT 1 FROM fast_lane_shadow_base_binding b WHERE b.network=o.network AND b.base_epoch_id=o.epoch_id AND b.base_snapshot_id=o.base_snapshot_id)" '{sql:$sql}' \
            | curl --fail-with-body --silent --show-error \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H 'Content-Type: application/json' \
                --data-binary @- \
                "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query" \
            > headroom-evidence/stale.json
          stale_rows="$(jq -r '.result[0].results[0].stale_rows' headroom-evidence/stale.json)"

          today="$(date -u +%F)"
          read -r -d '' query <<'GRAPHQL' || true
          query D1Usage($accountTag:string!,$start:Date,$end:Date,$databaseId:string){viewer{accounts(filter:{accountTag:$accountTag}){d1AnalyticsAdaptiveGroups(limit:10000,filter:{date_geq:$start,date_leq:$end,databaseId:$databaseId}){sum{rowsRead rowsWritten}}}}}
          GRAPHQL
          jq -n --arg query "$query" --arg accountTag "$CLOUDFLARE_ACCOUNT_ID" --arg start "$today" --arg end "$today" --arg databaseId "$DATABASE_ID" '{query:$query,variables:{accountTag:$accountTag,start:$start,end:$end,databaseId:$databaseId}}' > headroom-evidence/request.json
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'content-type: application/json' \
            --data @headroom-evidence/request.json \
            https://api.cloudflare.com/client/v4/graphql > headroom-evidence/usage.json
          rows_written="$(jq '[.data.viewer.accounts[0].d1AnalyticsAdaptiveGroups[].sum.rowsWritten // 0] | add // 0' headroom-evidence/usage.json)"
          remaining=$((100000 - rows_written))
          required=$((stale_rows + 5000))
          if [ "$remaining" -ge "$required" ]; then allowed=true; else allowed=false; fi
          jq -n --argjson rowsWritten "$rows_written" --argjson remaining "$remaining" --argjson staleRows "$stale_rows" --argjson required "$required" --argjson directDeleteAllowed "$allowed" '{rowsWritten:$rowsWritten,rowsWrittenRemaining:$remaining,staleRows:$staleRows,requiredWithSafetyMargin:$required,directDeleteAllowed:$directDeleteAllowed}' > headroom-evidence/summary.json

      - name: Report
        if: always()
        shell: bash
        run: |
          test -s headroom-evidence/summary.json || echo '{"passed":false}' > headroom-evidence/summary.json
          {
            echo 'D1 write headroom:'
            echo
            echo '```json'
            cat headroom-evidence/summary.json
            echo '```'
          } > headroom-evidence/comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body-file headroom-evidence/comment.md
