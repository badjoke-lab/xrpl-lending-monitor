name: P0 exact D1 binding diagnostic

on:
  push:
    branches: [main]
    paths:
      - .github/p0-stale-overlay-cleanup-trigger

permissions:
  contents: read
  issues: write

concurrency:
  group: p0-d1-binding-diagnostic-3800885
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: '946'
    steps:
      - name: Read active binding and overlay identities
        shell: bash
        run: |
          set -u
          mkdir -p diagnostic-evidence

          query_d1() {
            local sql="$1"
            local output="$2"
            jq -n --arg sql "$sql" '{sql:$sql}' \
              | curl --fail-with-body --silent --show-error \
                  -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  -H 'Content-Type: application/json' \
                  --data-binary @- \
                  "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query" \
              > "$output" 2> "${output}.stderr"
            return 0
          }

          query_d1 "SELECT base_epoch_id,base_snapshot_id,base_ledger_index,base_ledger_hash FROM fast_lane_shadow_base_binding WHERE network='devnet'" diagnostic-evidence/binding.json
          query_d1 "SELECT epoch_id,base_snapshot_id,COUNT(*) AS row_count,COALESCE(SUM(LENGTH(projection_json)),0) AS payload_bytes FROM current_state_overlay_objects WHERE network='devnet' GROUP BY epoch_id,base_snapshot_id ORDER BY row_count DESC" diagnostic-evidence/overlay-identities.json
          query_d1 "SELECT COUNT(*) AS stale_rows,COALESCE(SUM(LENGTH(o.projection_json)),0) AS stale_payload_bytes FROM current_state_overlay_objects o WHERE o.network='devnet' AND NOT EXISTS (SELECT 1 FROM fast_lane_shadow_base_binding b WHERE b.network=o.network AND b.base_epoch_id=o.epoch_id AND b.base_snapshot_id=o.base_snapshot_id)" diagnostic-evidence/stale.json
          query_d1 "SELECT COUNT(*) AS active_rows,COALESCE(SUM(LENGTH(o.projection_json)),0) AS active_payload_bytes FROM current_state_overlay_objects o WHERE o.network='devnet' AND EXISTS (SELECT 1 FROM fast_lane_shadow_base_binding b WHERE b.network=o.network AND b.base_epoch_id=o.epoch_id AND b.base_snapshot_id=o.base_snapshot_id)" diagnostic-evidence/active.json
          query_d1 "SELECT COUNT(*) AS total_rows,COALESCE(SUM(LENGTH(projection_json)),0) AS total_payload_bytes FROM current_state_overlay_objects WHERE network='devnet'" diagnostic-evidence/total.json
          query_d1 "SELECT overlay_ledger_index,overlay_ledger_hash,epoch_id,base_snapshot_id FROM current_state_overlay_state WHERE network='devnet'" diagnostic-evidence/state.json
          query_d1 "SELECT run_at,status,start_ledger_index,end_ledger_index,latest_observed_ledger,lag_ledgers,ledgers_processed,persistence_rows_written,error_message FROM fast_lane_shadow_run_metrics WHERE network='devnet' ORDER BY run_at DESC LIMIT 8" diagnostic-evidence/runs.json

          jq -n \
            --slurpfile binding diagnostic-evidence/binding.json \
            --slurpfile identities diagnostic-evidence/overlay-identities.json \
            --slurpfile stale diagnostic-evidence/stale.json \
            --slurpfile active diagnostic-evidence/active.json \
            --slurpfile total diagnostic-evidence/total.json \
            --slurpfile state diagnostic-evidence/state.json \
            --slurpfile runs diagnostic-evidence/runs.json \
            '{binding:$binding[0],overlayIdentities:$identities[0],stale:$stale[0],active:$active[0],total:$total[0],state:$state[0],runs:$runs[0]}' \
            > diagnostic-evidence/summary.json

      - name: Report exact diagnostic
        if: always()
        shell: bash
        run: |
          test -s diagnostic-evidence/summary.json || echo '{"passed":false,"reason":"diagnostic step failed before summary"}' > diagnostic-evidence/summary.json
          {
            echo 'Exact D1 binding diagnostic:'
            echo
            echo '```json'
            cat diagnostic-evidence/summary.json
            echo '```'
          } > diagnostic-evidence/comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body-file diagnostic-evidence/comment.md

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-d1-binding-diagnostic
          path: diagnostic-evidence
          if-no-files-found: warn
          retention-days: 14
