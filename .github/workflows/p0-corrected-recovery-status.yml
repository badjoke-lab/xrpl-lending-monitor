name: P0 current maintenance status

on:
  issues:
    types: [opened]

permissions:
  actions: read
  issues: write

jobs:
  status:
    if: startsWith(github.event.issue.title, 'P0 current maintenance status')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Report Issue 937 maintenance and child runs
        shell: bash
        run: |
          set -euo pipefail
          STARTED_AT='2026-07-20T08:49:00Z'
          PARENT_TITLE='P0 rolling checkpoint maintenance now 2026-07-20 17:49 JST immediate recovery'
          gh api "repos/${REPOSITORY}/actions/workflows/rolling-checkpoint-maintenance.yml/runs?event=issues&per_page=100" > /tmp/maintenance.json
          MAINTENANCE_ID="$(jq -r --arg title "${PARENT_TITLE}" '[.workflow_runs[] | select(.display_title == $title)][0].id // empty' /tmp/maintenance.json)"
          if [ -n "${MAINTENANCE_ID}" ]; then
            gh api "repos/${REPOSITORY}/actions/runs/${MAINTENANCE_ID}/jobs?per_page=100" > /tmp/maintenance-jobs.json
          else
            printf '{"jobs":[]}' > /tmp/maintenance-jobs.json
          fi

          gh api "repos/${REPOSITORY}/actions/workflows/rolling-checkpoint-candidate.yml/runs?event=workflow_dispatch&per_page=100" > /tmp/candidates.json
          CANDIDATE_ID="$(jq -r --arg started "${STARTED_AT}" '[.workflow_runs[] | select(.created_at >= $started)][0].id // empty' /tmp/candidates.json)"
          if [ -n "${CANDIDATE_ID}" ]; then
            gh api "repos/${REPOSITORY}/actions/runs/${CANDIDATE_ID}/jobs?per_page=100" > /tmp/candidate-jobs.json
          else
            printf '{"jobs":[]}' > /tmp/candidate-jobs.json
          fi

          gh api "repos/${REPOSITORY}/actions/workflows/rolling-checkpoint-live-cutover.yml/runs?event=workflow_dispatch&per_page=100" > /tmp/cutovers.json
          CUTOVER_ID="$(jq -r --arg started "${STARTED_AT}" '[.workflow_runs[] | select(.created_at >= $started)][0].id // empty' /tmp/cutovers.json)"
          if [ -n "${CUTOVER_ID}" ]; then
            gh api "repos/${REPOSITORY}/actions/runs/${CUTOVER_ID}/jobs?per_page=100" > /tmp/cutover-jobs.json
          else
            printf '{"jobs":[]}' > /tmp/cutover-jobs.json
          fi

          jq -n --arg maintenanceId "${MAINTENANCE_ID}" --arg candidateId "${CANDIDATE_ID}" --arg cutoverId "${CUTOVER_ID}" \
            --slurpfile maintenance /tmp/maintenance.json --slurpfile maintenanceJobs /tmp/maintenance-jobs.json \
            --slurpfile candidates /tmp/candidates.json --slurpfile candidateJobs /tmp/candidate-jobs.json \
            --slurpfile cutovers /tmp/cutovers.json --slurpfile cutoverJobs /tmp/cutover-jobs.json '
            {
              maintenance:(if $maintenanceId == "" then null else [$maintenance[0].workflow_runs[] | select((.id|tostring) == $maintenanceId) | {id,status,conclusion,created_at,updated_at,html_url,display_title}][0] end),
              maintenanceJobs:[$maintenanceJobs[0].jobs[] | {id,name,status,conclusion,steps:[.steps[] | {name,status,conclusion,number}]}],
              candidate:(if $candidateId == "" then null else [$candidates[0].workflow_runs[] | select((.id|tostring) == $candidateId) | {id,status,conclusion,created_at,updated_at,html_url}][0] end),
              candidateJobs:[$candidateJobs[0].jobs[] | {id,name,status,conclusion,steps:[.steps[] | {name,status,conclusion,number}]}],
              cutover:(if $cutoverId == "" then null else [$cutovers[0].workflow_runs[] | select((.id|tostring) == $cutoverId) | {id,status,conclusion,created_at,updated_at,html_url}][0] end),
              cutoverJobs:[$cutoverJobs[0].jobs[] | {id,name,status,conclusion,steps:[.steps[] | {name,status,conclusion,number}]}]
            }' > /tmp/status.json
          {
            echo 'Current maintenance status:'
            echo '```json'
            jq . /tmp/status.json
            echo '```'
          } > /tmp/comment.md
          gh issue comment "${ISSUE_NUMBER}" --repo "${REPOSITORY}" --body-file /tmp/comment.md
