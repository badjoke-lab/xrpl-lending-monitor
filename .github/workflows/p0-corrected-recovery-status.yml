name: P0 compaction preflight diagnostic

on:
  push:
    branches: [main]
    paths:
      - .github/p0-stale-overlay-cleanup-trigger

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Read preflight state
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p out
          q(){ jq -n --arg sql "$1" '{sql:$sql}' | curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' --data-binary @- "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query"; }
          q "SELECT base_epoch_id,base_snapshot_id,base_ledger_index,base_ledger_hash FROM fast_lane_shadow_base_binding WHERE network='devnet'" > out/binding.json
          q "SELECT COUNT(*) AS active_rows FROM current_state_overlay_objects WHERE network='devnet' AND epoch_id='devnet-3371675' AND base_snapshot_id='devnet-3800885-eaa0d29666e7'" > out/active.json
          q "SELECT COUNT(*) AS stale_rows FROM current_state_overlay_objects WHERE network='devnet' AND NOT (epoch_id='devnet-3371675' AND base_snapshot_id='devnet-3800885-eaa0d29666e7')" > out/stale.json
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-monitor/schedules" > out/schedules.json
          d=$(date -u +%F)
          jq -n --arg q 'query($a:string!,$d:Date,$i:string){viewer{accounts(filter:{accountTag:$a}){d1AnalyticsAdaptiveGroups(limit:10000,filter:{date_geq:$d,date_leq:$d,databaseId:$i}){sum{rowsWritten}}}}}' --arg a "$CLOUDFLARE_ACCOUNT_ID" --arg d "$d" --arg i "$DATABASE_ID" '{query:$q,variables:{a:$a,d:$d,i:$i}}' | curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' --data-binary @- https://api.cloudflare.com/client/v4/graphql > out/usage.json
          jq -n --slurpfile b out/binding.json --slurpfile a out/active.json --slurpfile s out/stale.json --slurpfile c out/schedules.json --slurpfile u out/usage.json '{binding:$b[0],active:$a[0],stale:$s[0],schedules:$c[0],usage:$u[0]}' > out/summary.json
      - name: Report
        if: always()
        shell: bash
        run: |
          test -s out/summary.json || echo '{"passed":false}' > out/summary.json
          { echo 'Compaction preflight diagnostic:'; echo; echo '```json'; cat out/summary.json; echo '```'; } > out/comment.md
          gh issue comment 950 --repo "$REPOSITORY" --body-file out/comment.md
