name: P0 production D1 recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/p0-production-repair-trigger

permissions:
  contents: read
  issues: write

concurrency:
  group: production-worker-write
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
  GH_TOKEN: ${{ github.token }}
  REPOSITORY: ${{ github.repository }}
  STATUS_ISSUE: '978'

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Remove only stale overlay storage
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p repair-evidence

          query_d1() {
            local sql="$1"
            local output="$2"
            jq -n --arg sql "$sql" '{sql:$sql}' \
              | curl --fail-with-body --silent --show-error --retry 3 \
                  -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  -H 'Content-Type: application/json' \
                  --data-binary @- \
                  "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query" \
              > "$output"
            jq -e '.success == true and ((.errors // []) | length) == 0 and ([.result[].success] | all)' "$output" >/dev/null
          }

          query_d1 "SELECT base_epoch_id,base_snapshot_id,base_ledger_index,base_ledger_hash FROM fast_lane_shadow_base_binding WHERE network='devnet'" repair-evidence/binding-before.json
          query_d1 "SELECT epoch_id,last_processed_ledger,last_processed_hash,latest_observed_ledger,latest_observed_hash,status,(latest_observed_ledger-last_processed_ledger) AS lag_ledgers FROM fast_lane_shadow_state WHERE network='devnet'" repair-evidence/state-before.json
          query_d1 "SELECT COUNT(*) AS compact_rows FROM fast_lane_shadow_objects_compact WHERE network='devnet'" repair-evidence/compact-before.json
          query_d1 "SELECT COUNT(*) AS overlay_rows,COALESCE(SUM(LENGTH(projection_json)),0) AS overlay_payload_bytes FROM current_state_overlay_objects WHERE network='devnet'" repair-evidence/overlay-before.json
          query_d1 "SELECT COUNT(*) AS active_rows FROM current_state_overlay_objects o WHERE o.network='devnet' AND EXISTS (SELECT 1 FROM fast_lane_shadow_base_binding b WHERE b.network=o.network AND b.base_epoch_id=o.epoch_id AND b.base_snapshot_id=o.base_snapshot_id)" repair-evidence/active-before.json
          query_d1 "SELECT COUNT(*) AS stale_rows,COALESCE(SUM(LENGTH(projection_json)),0) AS stale_payload_bytes FROM current_state_overlay_objects o WHERE o.network='devnet' AND NOT EXISTS (SELECT 1 FROM fast_lane_shadow_base_binding b WHERE b.network=o.network AND b.base_epoch_id=o.epoch_id AND b.base_snapshot_id=o.base_snapshot_id)" repair-evidence/stale-before.json
          query_d1 "SELECT COUNT(*) AS stale_state_rows FROM current_state_overlay_state s WHERE s.network='devnet' AND NOT EXISTS (SELECT 1 FROM fast_lane_shadow_base_binding b WHERE b.network=s.network AND b.base_epoch_id=s.epoch_id AND b.base_snapshot_id=s.base_snapshot_id)" repair-evidence/stale-state-before.json
          query_d1 "SELECT COUNT(*) AS stale_guard_rows FROM current_state_overlay_commit_guards g WHERE g.network='devnet' AND NOT EXISTS (SELECT 1 FROM fast_lane_shadow_base_binding b WHERE b.network=g.network AND b.base_epoch_id=g.epoch_id AND b.base_snapshot_id=g.base_snapshot_id)" repair-evidence/stale-guards-before.json

          jq -e '.result[0].results | length == 1' repair-evidence/binding-before.json >/dev/null
          jq -e '.result[0].results | length == 1 and .[0].status == "healthy" and .[0].lag_ledgers == 0' repair-evidence/state-before.json >/dev/null
          compact_before="$(jq -r '.result[0].results[0].compact_rows' repair-evidence/compact-before.json)"
          stale_before="$(jq -r '.result[0].results[0].stale_rows' repair-evidence/stale-before.json)"
          test "$compact_before" -gt 0
          test "$stale_before" -gt 0

          curl --fail-with-body --silent --show-error --retry 3 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-monitor/schedules" \
            > repair-evidence/schedules-before.json
          jq -e '.success == true and (.result.schedules | length == 1) and .result.schedules[0].cron == "*/5 * * * *"' repair-evidence/schedules-before.json >/dev/null

          curl --fail-with-body --silent --show-error --retry 3 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}" \
            > repair-evidence/database-before.json

          today="$(date -u +%F)"
          read -r -d '' gql <<'GRAPHQL' || true
          query D1Usage($accountTag:string!,$start:Date,$end:Date,$databaseId:string){viewer{accounts(filter:{accountTag:$accountTag}){d1AnalyticsAdaptiveGroups(limit:10000,filter:{date_geq:$start,date_leq:$end,databaseId:$databaseId}){sum{rowsWritten}}}}}
          GRAPHQL
          jq -n --arg query "$gql" --arg accountTag "$CLOUDFLARE_ACCOUNT_ID" --arg start "$today" --arg end "$today" --arg databaseId "$DATABASE_ID" '{query:$query,variables:{accountTag:$accountTag,start:$start,end:$end,databaseId:$databaseId}}' \
            | curl --fail-with-body --silent --show-error --retry 3 \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H 'Content-Type: application/json' \
                --data-binary @- https://api.cloudflare.com/client/v4/graphql \
            > repair-evidence/usage-before.json
          rows_written="$(jq '[.data.viewer.accounts[0].d1AnalyticsAdaptiveGroups[].sum.rowsWritten // 0] | add // 0' repair-evidence/usage-before.json)"
          remaining=$((100000 - rows_written))
          test "$remaining" -ge "$((stale_before + 5000))"

          query_d1 "DELETE FROM current_state_overlay_objects WHERE network='devnet' AND NOT EXISTS (SELECT 1 FROM fast_lane_shadow_base_binding b WHERE b.network=current_state_overlay_objects.network AND b.base_epoch_id=current_state_overlay_objects.epoch_id AND b.base_snapshot_id=current_state_overlay_objects.base_snapshot_id)" repair-evidence/delete-stale-objects.json
          query_d1 "DELETE FROM current_state_overlay_commit_guards WHERE network='devnet' AND NOT EXISTS (SELECT 1 FROM fast_lane_shadow_base_binding b WHERE b.network=current_state_overlay_commit_guards.network AND b.base_epoch_id=current_state_overlay_commit_guards.epoch_id AND b.base_snapshot_id=current_state_overlay_commit_guards.base_snapshot_id)" repair-evidence/delete-stale-guards.json
          query_d1 "DELETE FROM current_state_overlay_state WHERE network='devnet' AND NOT EXISTS (SELECT 1 FROM fast_lane_shadow_base_binding b WHERE b.network=current_state_overlay_state.network AND b.base_epoch_id=current_state_overlay_state.epoch_id AND b.base_snapshot_id=current_state_overlay_state.base_snapshot_id)" repair-evidence/delete-stale-state.json

          query_d1 "SELECT COUNT(*) AS overlay_rows,COALESCE(SUM(LENGTH(projection_json)),0) AS overlay_payload_bytes FROM current_state_overlay_objects WHERE network='devnet'" repair-evidence/overlay-after.json
          query_d1 "SELECT COUNT(*) AS stale_rows FROM current_state_overlay_objects o WHERE o.network='devnet' AND NOT EXISTS (SELECT 1 FROM fast_lane_shadow_base_binding b WHERE b.network=o.network AND b.base_epoch_id=o.epoch_id AND b.base_snapshot_id=o.base_snapshot_id)" repair-evidence/stale-after.json
          query_d1 "SELECT COUNT(*) AS stale_state_rows FROM current_state_overlay_state s WHERE s.network='devnet' AND NOT EXISTS (SELECT 1 FROM fast_lane_shadow_base_binding b WHERE b.network=s.network AND b.base_epoch_id=s.epoch_id AND b.base_snapshot_id=s.base_snapshot_id)" repair-evidence/stale-state-after.json
          query_d1 "SELECT COUNT(*) AS stale_guard_rows FROM current_state_overlay_commit_guards g WHERE g.network='devnet' AND NOT EXISTS (SELECT 1 FROM fast_lane_shadow_base_binding b WHERE b.network=g.network AND b.base_epoch_id=g.epoch_id AND b.base_snapshot_id=g.base_snapshot_id)" repair-evidence/stale-guards-after.json
          query_d1 "SELECT COUNT(*) AS compact_rows FROM fast_lane_shadow_objects_compact WHERE network='devnet'" repair-evidence/compact-after.json

          test "$(jq -r '.result[0].results[0].stale_rows' repair-evidence/stale-after.json)" = 0
          test "$(jq -r '.result[0].results[0].stale_state_rows' repair-evidence/stale-state-after.json)" = 0
          test "$(jq -r '.result[0].results[0].stale_guard_rows' repair-evidence/stale-guards-after.json)" = 0
          test "$(jq -r '.result[0].results[0].compact_rows' repair-evidence/compact-after.json)" = "$compact_before"

          curl --fail-with-body --silent --show-error --retry 3 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}" \
            > repair-evidence/database-after.json

          jq -n \
            --arg checkedAt "$(date -u +%FT%TZ)" \
            --argjson binding "$(jq -c '.result[0].results[0]' repair-evidence/binding-before.json)" \
            --argjson state "$(jq -c '.result[0].results[0]' repair-evidence/state-before.json)" \
            --argjson overlayBefore "$(jq -c '.result[0].results[0]' repair-evidence/overlay-before.json)" \
            --argjson activeBefore "$(jq -c '.result[0].results[0]' repair-evidence/active-before.json)" \
            --argjson staleBefore "$(jq -c '.result[0].results[0]' repair-evidence/stale-before.json)" \
            --argjson overlayAfter "$(jq -c '.result[0].results[0]' repair-evidence/overlay-after.json)" \
            --argjson compactBefore "$compact_before" \
            --argjson compactAfter "$(jq -r '.result[0].results[0].compact_rows' repair-evidence/compact-after.json)" \
            --argjson rowsWrittenToday "$rows_written" \
            --argjson databaseBytesBefore "$(jq -r '.result.file_size // 0' repair-evidence/database-before.json)" \
            --argjson databaseBytesAfter "$(jq -r '.result.file_size // 0' repair-evidence/database-after.json)" \
            '{passed:true,checkedAt:$checkedAt,action:"deleted stale overlay only; compact preserved for promotion",binding:$binding,stateBefore:$state,overlayBefore:$overlayBefore,activeOverlayBefore:$activeBefore,staleBefore:$staleBefore,overlayAfter:$overlayAfter,compactRowsBefore:$compactBefore,compactRowsAfter:$compactAfter,rowsWrittenTodayBeforeRepair:$rowsWrittenToday,databaseBytesBefore:$databaseBytesBefore,databaseBytesAfter:$databaseBytesAfter,nextAction:"existing five-minute cron must promote compact and write a fresh run"}' \
            > repair-evidence/summary.json

      - name: Publish repair result
        if: always()
        shell: bash
        run: |
          test -s repair-evidence/summary.json || echo '{"passed":false,"action":"production D1 repair failed before summary"}' > repair-evidence/summary.json
          {
            echo '# Production repair status'
            echo
            echo 'This is a production repair result, not a soak result.'
            echo
            echo '```json'
            cat repair-evidence/summary.json
            echo '```'
          } > repair-evidence/issue-body.md
          gh issue edit "$STATUS_ISSUE" --repo "$REPOSITORY" --body-file repair-evidence/issue-body.md
