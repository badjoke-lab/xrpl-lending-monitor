name: P0 push Queue message

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  push:
    if: startsWith(github.event.issue.title, 'P0 push Queue message')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      QUEUE_ID: 2ae398f2edbf43749e45cd7ede77c6cd
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Push production Queue message
        shell: bash
        run: |
          set -euo pipefail
          NOW_MS="$(date +%s%3N)"
          SLOT_MS="$((NOW_MS / 300000 * 300000))"
          ENQUEUED_AT="$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"
          jq -nc \
            --argjson scheduledTime "$SLOT_MS" \
            --arg cron 'manual-queue-api-verification' \
            --arg enqueuedAt "$ENQUEUED_AT" \
            '{body:{scheduledTime:$scheduledTime,cron:$cron,enqueuedAt:$enqueuedAt},content_type:"json"}' \
            > /tmp/message.json
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/message.json \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues/${QUEUE_ID}/messages" \
            > /tmp/response.json
          jq -e '.success == true' /tmp/response.json > /dev/null

      - name: Report Queue API result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'Direct Queue message result:'
            echo
            echo '### Request'
            echo '```json'
            if [ -s /tmp/message.json ]; then jq . /tmp/message.json; else echo '{}'; fi
            echo '```'
            echo
            echo '### Response'
            echo '```json'
            if [ -s /tmp/response.json ]; then jq . /tmp/response.json; else echo '{}'; fi
            echo '```'
            echo
            echo "Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > /tmp/comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
