name: Finalize single D1

on:
  push:
    branches:
      - feature-single-d1-binding
    paths:
      - .github/workflows/finalize-single-d1.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-single-d1-binding
      - name: Apply exact updates
        run: |
          python - <<'PY'
          from pathlib import Path

          test = Path('src/worker/core-api-routes.test.ts')
          s = test.read_text()
          s = s.replace(
              'function createEnv(db: D1Database, currentState = false): Bindings {',
              'function createEnv(db: D1Database): Bindings {',
          )
          s = s.replace("    ...(currentState ? { CURRENT_STATE: db as unknown as R2Bucket } : {}),\n", '')
          s = s.replace('const env = createEnv(db, true)', 'const env = createEnv(db)')
          old = """  it('returns an explicit unavailable entity collection without the current-state binding', async () => {
    const response = await app.request(
      '/api/loan-brokers?limit=2',
      {},
      createEnv(createFakeDatabase({ includeSnapshot: true })),
    )

    expect(response.status).toBe(200)
    await expect(response.json()).resolves.toMatchObject({
      network: 'devnet',
      kind: 'loan_brokers',
      data: [],
      page: { limit: 2, next_cursor: null },
      availability: {
        state: 'unavailable',
        reason: 'current object storage binding is not configured for public API reads',
      },
      provenance: { collection: 'unavailable' },
    })
  })
"""
          new = """  it('reads an active empty Loan Broker collection through the single D1 binding', async () => {
    const response = await app.request(
      '/api/loan-brokers?limit=2',
      {},
      createEnv(createFakeDatabase({ includeSnapshot: true })),
    )

    expect(response.status).toBe(200)
    await expect(response.json()).resolves.toMatchObject({
      network: 'devnet',
      kind: 'loan_brokers',
      data: [],
      page: { limit: 2, next_cursor: null },
      availability: { state: 'available' },
      provenance: { collection: 'direct' },
    })
  })
"""
          if old not in s:
              raise SystemExit('old route test block not found')
          test.write_text(s.replace(old, new))

          status = Path('docs/implementation-status.md')
          s = status.read_text()
          pairs = [
            ('Status: active D1-1 implementation unit.', 'Status: merged D1-1 implementation unit.'),
            ('### PR #49 — Current state binding', '### PR #55 — Single D1 binding'),
            ('Status: open but not merge-ready in its current form.', 'Status: active D1-2 implementation unit.'),
            ('1. Complete and merge PR #54 snapshot retention safeguards.\n2. Revise and merge PR #49 as the single-`DB` runtime binding unit.', '1. Complete and merge PR #55 single-`DB` runtime binding.'),
            ('- PR #54 retention safeguards are not merged;\n- PR #49 still represents the D1 database through a duplicate legacy binding;', '- PR #55 single-DB binding is not merged;'),
          ]
          for old, new in pairs:
              if old not in s:
                  raise SystemExit('expected status text not found')
              s = s.replace(old, new)
          status.write_text(s)
          Path('.github/workflows/finalize-single-d1.yml').unlink()
          PY
      - name: Commit updates
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/worker/core-api-routes.test.ts docs/implementation-status.md .github/workflows/finalize-single-d1.yml
          git commit -m "test: align routes with single D1 binding"
          git push origin HEAD:feature-single-d1-binding
