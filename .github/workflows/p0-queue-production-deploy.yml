name: P0 Queue production deploy

on:
  push:
    branches: [main]
    paths:
      - .github/p0-queue-production-deploy-trigger

permissions:
  contents: read

concurrency:
  group: p0-emergency-production-worker-write
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      QUEUE_NAME: xrpl-lending-fast-lane
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Queue production boundary
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "$(jq -r '.vars.APP_NETWORK' wrangler.jsonc)" = devnet
          test "$(jq -r '.vars.MAINNET_ENABLED' wrangler.jsonc)" = false
          test "$(jq -r '.triggers.crons | length' wrangler.jsonc)" -eq 1
          test "$(jq -r '.triggers.crons[0]' wrangler.jsonc)" = '*/5 * * * *'
          test "$(jq -r '.queues.producers[0].binding' wrangler.jsonc)" = FAST_LANE_QUEUE
          test "$(jq -r '.queues.producers[0].queue' wrangler.jsonc)" = "$QUEUE_NAME"
          test "$(jq -r '.queues.consumers[0].queue' wrangler.jsonc)" = "$QUEUE_NAME"
          test "$(jq -r '.queues.consumers[0].max_batch_size' wrangler.jsonc)" -eq 1
          test "$(jq -r '.queues.consumers[0].max_concurrency' wrangler.jsonc)" -eq 1

      - name: Ensure production Queue exists
        shell: bash
        run: |
          set -euo pipefail
          if pnpm exec wrangler queues info "$QUEUE_NAME" > queue-info-before.txt 2>&1; then
            echo "Queue already exists"
          else
            cat queue-info-before.txt
            pnpm exec wrangler queues create "$QUEUE_NAME"
          fi
          pnpm exec wrangler queues info "$QUEUE_NAME" | tee queue-info-after.txt

      - name: Build application
        run: pnpm build

      - name: Apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply xrpl-lending-monitor --remote

      - name: Deploy Queue producer and consumer
        run: pnpm exec wrangler deploy

      - name: Verify deployed five-minute Cron
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-monitor/schedules" \
            > deployed-worker-schedules.json
          jq -e '.success == true and (.result.schedules | length) == 1 and .result.schedules[0].cron == "*/5 * * * *"' \
            deployed-worker-schedules.json > /dev/null
          pnpm exec wrangler queues info "$QUEUE_NAME" | tee queue-info-deployed.txt

      - name: Upload Queue deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-queue-production-deploy-evidence
          path: |
            deployed-worker-schedules.json
            queue-info-before.txt
            queue-info-after.txt
            queue-info-deployed.txt
          if-no-files-found: warn
          retention-days: 14
