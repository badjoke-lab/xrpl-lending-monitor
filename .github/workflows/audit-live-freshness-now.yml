name: Audit live freshness now

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/audit-live-freshness-now.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PRODUCTION_BASE: https://xrpl-lending-monitor.badjoke-lab.workers.dev

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p live-freshness-audit

      - name: Capture public API and XRPL Devnet head
        shell: bash
        run: |
          set -euo pipefail
          ROOT=live-freshness-audit
          date -u +'%Y-%m-%dT%H:%M:%SZ' > "${ROOT}/captured-at.txt"
          curl --fail-with-body --silent --show-error --retry 3 "${PRODUCTION_BASE}/api/overview" > "${ROOT}/overview.json"
          curl --fail-with-body --silent --show-error --retry 3 "${PRODUCTION_BASE}/api/status/collector" > "${ROOT}/collector.json"
          curl --fail-with-body --silent --show-error --retry 3 "${PRODUCTION_BASE}/api/status/history-source" > "${ROOT}/history-source.json"
          curl --fail-with-body --silent --show-error --retry 3 "${PRODUCTION_BASE}/api/status/fast-lane-diff?limit=500" > "${ROOT}/fast-lane-diff.json"
          jq -n '{method:"ledger",params:[{ledger_index:"validated",transactions:false,expand:false}]}' > "${ROOT}/head-request.json"
          curl --fail-with-body --silent --show-error --retry 3 -H 'content-type: application/json' --data @"${ROOT}/head-request.json" https://devnet.honeycluster.io/ > "${ROOT}/head-primary.json"
          curl --fail-with-body --silent --show-error --retry 3 -H 'content-type: application/json' --data @"${ROOT}/head-request.json" https://s.devnet.rippletest.net:51234/ > "${ROOT}/head-fallback.json"

      - name: Capture production cron and fast-lane D1 state
        shell: bash
        run: |
          set -euo pipefail
          ROOT=live-freshness-audit
          curl --fail-with-body --silent --show-error -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-monitor/schedules" > "${ROOT}/schedules.json"
          pnpm exec wrangler d1 execute xrpl-lending-monitor --remote --command "SELECT epoch_id,last_processed_ledger,last_processed_hash,latest_observed_ledger,latest_observed_hash,status,updated_at FROM fast_lane_shadow_state WHERE network='devnet';" --json > "${ROOT}/state-raw.txt"
          sed -n '/^\[/,$p' "${ROOT}/state-raw.txt" > "${ROOT}/state.json"
          pnpm exec wrangler d1 execute xrpl-lending-monitor --remote --command "SELECT run_at,status,start_ledger_index,end_ledger_index,latest_observed_ledger,lag_ledgers,ledgers_processed,lending_transactions,coalesced_object_rows,persistence_rows_read,persistence_rows_written FROM fast_lane_shadow_run_metrics WHERE network='devnet' ORDER BY run_at DESC LIMIT 30;" --json > "${ROOT}/metrics-raw.txt"
          sed -n '/^\[/,$p' "${ROOT}/metrics-raw.txt" > "${ROOT}/metrics.json"

      - name: Compute freshness verdict
        shell: bash
        run: |
          set -euo pipefail
          ROOT=live-freshness-audit
          python - <<'PY'
          import json, datetime, pathlib
          root=pathlib.Path('live-freshness-audit')
          def load(name): return json.loads((root/name).read_text())
          overview=load('overview.json')
          collector=load('collector.json')
          history=load('history-source.json')
          schedules=load('schedules.json')
          state_raw=load('state.json')
          metrics_raw=load('metrics.json')
          p=load('head-primary.json'); f=load('head-fallback.json')
          def head(x):
              r=x.get('result',{}); l=r.get('ledger',{}) if isinstance(r.get('ledger'),dict) else {}
              return int(r.get('ledger_index') or l.get('ledger_index') or l.get('seqNum'))
          live=min(head(p),head(f))
          wm=overview.get('current_state_watermark') or {}
          current=int(wm.get('ledger_index') or 0)
          updated=wm.get('updated_at')
          now=datetime.datetime.now(datetime.timezone.utc)
          age=None
          if updated:
              age=(now-datetime.datetime.fromisoformat(updated.replace('Z','+00:00'))).total_seconds()
          state_rows=state_raw[0].get('results',[]) if state_raw else []
          metrics=metrics_raw[0].get('results',[]) if metrics_raw else []
          last_metric=metrics[0] if metrics else None
          verdict={
              'captured_at': now.isoformat().replace('+00:00','Z'),
              'live_head': live,
              'public_current_ledger': current,
              'public_current_updated_at': updated,
              'public_current_age_seconds': age,
              'public_current_lag_ledgers': max(0, live-current),
              'cron_schedules': [x.get('cron') for x in schedules.get('result',{}).get('schedules',[])],
              'fast_lane_state': state_rows[0] if state_rows else None,
              'last_metric': last_metric,
              'recent_metrics': metrics,
              'collector': collector,
              'history': history,
          }
          verdict['current_state_fresh']=bool(age is not None and age <= 600 and verdict['public_current_lag_ledgers'] <= 10)
          (root/'summary.json').write_text(json.dumps(verdict,indent=2)+'\n')
          print(json.dumps(verdict,indent=2))
          if verdict['current_state_fresh']:
              raise SystemExit(0)
          raise SystemExit(2)
          PY

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: live-freshness-audit-now
          path: live-freshness-audit
          if-no-files-found: error
          retention-days: 14
