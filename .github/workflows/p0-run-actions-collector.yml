name: P0 run Actions collector

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: production-five-minute-fast-lane
  cancel-in-progress: false

jobs:
  collect:
    if: startsWith(github.event.issue.title, 'P0 run Actions collector')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle production collector
        run: pnpm exec vite build --config vite.fast-lane-production.config.ts

      - name: Run production collector
        id: collector
        run: node .fast-lane-production-build/run-fast-lane-production.mjs | tee /tmp/collector.log

      - name: Report collector result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'P0 Actions collector result:'
            echo
            echo '```text'
            if [ -s /tmp/collector.log ]; then tail -n 30 /tmp/collector.log; else echo 'collector produced no stdout'; fi
            echo '```'
            echo
            echo "Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > /tmp/comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
