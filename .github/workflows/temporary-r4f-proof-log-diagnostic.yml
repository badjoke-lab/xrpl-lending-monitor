name: Temporary R4F Proof Log Diagnostic

on:
  push:
    branches:
      - agent/r4f-proof-log-diagnostic

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Inspect migration history shape read-only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          [[ "$SUPABASE_PROJECT_ID" =~ ^[a-z]{20}$ ]]
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises'
          const token=process.env.SUPABASE_ACCESS_TOKEN??''
          const project=process.env.SUPABASE_PROJECT_ID??''
          const endpoint=`https://api.supabase.com/v1/projects/${project}/database/query`
          const sql=`
          select column_name,data_type,is_nullable
          from information_schema.columns
          where table_schema='supabase_migrations' and table_name='schema_migrations'
          order by ordinal_position;
          select version,name,cardinality(statements) as statement_count
          from supabase_migrations.schema_migrations
          where version in ('20260809151000','20260810123000','20260810133000','20260811012000','20260811061000')
          order by version;
          `.trim()
          const response=await fetch(endpoint,{method:'POST',headers:{authorization:`Bearer ${token}`,'content-type':'application/json',accept:'application/json'},body:JSON.stringify({query:sql,read_only:true}),signal:AbortSignal.timeout(60_000)})
          const text=await response.text()
          if(!response.ok) throw new Error(`database query failed:${response.status}:${text.slice(0,1000)}`)
          const parsed=JSON.parse(text)
          const output=`${JSON.stringify({schemaVersion:1,purpose:'migration-history-shape-readonly',readOnly:true,productionMutationPerformed:false,response:parsed},null,2)}\n`
          if(output.includes(project)||output.includes(token)) throw new Error('sanitization failed')
          await writeFile('r4f-proof-log-diagnostic.json',output)
          console.log(output)
          NODE

      - name: Upload sanitized diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: r4f-proof-log-diagnostic
          path: r4f-proof-log-diagnostic.json
          if-no-files-found: error
          retention-days: 7
