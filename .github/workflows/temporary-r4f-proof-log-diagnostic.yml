name: Temporary R4F Proof Log Diagnostic

on:
  push:
    branches:
      - agent/r4f-proof-log-diagnostic

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Measure checkpoint source tables read-only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          [[ "$SUPABASE_PROJECT_ID" =~ ^[a-z]{20}$ ]]
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises'
          const token = process.env.SUPABASE_ACCESS_TOKEN ?? ''
          const project = process.env.SUPABASE_PROJECT_ID ?? ''
          const endpoint = `https://api.supabase.com/v1/projects/${project}/database/query`
          const sql = `
          with metrics as (
            select 'phase_messages' as section,
                   (select count(*) from public.xrpl_phase_messages where profile_id='supabase-devnet')::bigint as row_count,
                   pg_total_relation_size('public.xrpl_phase_messages'::regclass)::bigint as relation_bytes
            union all
            select 'phase_successors',
                   (select count(*) from public.xrpl_phase_successors s join public.xrpl_phase_messages m on m.message_id=s.current_message_id where m.profile_id='supabase-devnet')::bigint,
                   pg_total_relation_size('public.xrpl_phase_successors'::regclass)::bigint
            union all
            select 'phase_work',
                   (select count(*) from public.xrpl_phase_work where profile_id='supabase-devnet')::bigint,
                   pg_total_relation_size('public.xrpl_phase_work'::regclass)::bigint
            union all
            select 'payload_chunks',
                   (select count(*) from public.xrpl_phase_payload_chunks c join public.xrpl_phase_work w on w.work_id=c.work_id where w.profile_id='supabase-devnet')::bigint,
                   pg_total_relation_size('public.xrpl_phase_payload_chunks'::regclass)::bigint
            union all
            select 'reference_rows',
                   (select count(*) from public.xrpl_phase_reference_rows r join public.xrpl_phase_work w on w.work_id=r.work_id where w.profile_id='supabase-devnet')::bigint,
                   pg_total_relation_size('public.xrpl_phase_reference_rows'::regclass)::bigint
            union all
            select 'commit_chunks',
                   (select count(*) from public.xrpl_phase_commit_chunks c join public.xrpl_phase_work w on w.work_id=c.work_id where w.profile_id='supabase-devnet')::bigint,
                   pg_total_relation_size('public.xrpl_phase_commit_chunks'::regclass)::bigint
            union all
            select 'resource_attempts', count(*)::bigint,
                   pg_total_relation_size('xrpl_resource_guard_v2.attempts'::regclass)::bigint
              from xrpl_resource_guard_v2.attempts
            union all
            select 'resource_tick_accounting', count(*)::bigint,
                   pg_total_relation_size('xrpl_resource_guard_v2.tick_accounting'::regclass)::bigint
              from xrpl_resource_guard_v2.tick_accounting
          )
          select * from metrics order by section;
          `.trim()
          const response = await fetch(endpoint, {
            method: 'POST',
            headers: {authorization:`Bearer ${token}`,'content-type':'application/json',accept:'application/json'},
            body: JSON.stringify({query: sql, read_only: true}),
            signal: AbortSignal.timeout(90_000),
          })
          const text = await response.text()
          if (!response.ok) throw new Error(`database query failed:${response.status}:${text.slice(0,1000)}`)
          const parsed = JSON.parse(text)
          const rows = Array.isArray(parsed) ? parsed : Array.isArray(parsed?.result) ? parsed.result : []
          const evidence = {schemaVersion:1,purpose:'checkpoint-source-size-readonly',readOnly:true,productionMutationPerformed:false,rows}
          const output = `${JSON.stringify(evidence,null,2)}\n`
          if (output.includes(project) || output.includes(token)) throw new Error('sanitization failed')
          await writeFile('r4f-proof-log-diagnostic.json', output)
          console.log(output)
          NODE

      - name: Upload sanitized diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: r4f-proof-log-diagnostic
          path: r4f-proof-log-diagnostic.json
          if-no-files-found: error
          retention-days: 7
