name: Temporary R4F Proof Log Diagnostic

on:
  push:
    branches:
      - agent/r4f-proof-log-diagnostic

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact current main
        uses: actions/checkout@v4
        with:
          ref: 2517bc28cc862979205ee4032d58d730d367265b
          fetch-depth: 1

      - name: Patch and validate proof key selection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/r4f-revision4-12-ledger-qualification.yml')
          text = workflow.read_text()
          old = '''          legacy_count="$(jq '[.[] | select(.type == "legacy" and (.name == "service_role" or ((.secret_jwt_template.role // "") == "service_role")))] | length' /tmp/project-api-keys.json)"
          secret_count="$(jq '[.[] | select(.type == "secret")] | length' /tmp/project-api-keys.json)"
          if [ "$legacy_count" -eq 1 ]; then
            elevated_key="$(jq -r '[.[] | select(.type == "legacy" and (.name == "service_role" or ((.secret_jwt_template.role // "") == "service_role")))][0].api_key // empty' /tmp/project-api-keys.json)"
            elevated_kind=legacy
          elif [ "$legacy_count" -eq 0 ] && [ "$secret_count" -eq 1 ]; then
            elevated_key="$(jq -r '[.[] | select(.type == "secret")][0].api_key // empty' /tmp/project-api-keys.json)"
            elevated_kind=secret
          else
'''
          new = '''          default_secret_count="$(jq '[.[] | select(.type == "secret" and .name == "default")] | length' /tmp/project-api-keys.json)"
          legacy_count="$(jq '[.[] | select(.type == "legacy" and (.name == "service_role" or ((.secret_jwt_template.role // "") == "service_role")))] | length' /tmp/project-api-keys.json)"
          if [ "$default_secret_count" -eq 1 ]; then
            elevated_key="$(jq -r '[.[] | select(.type == "secret" and .name == "default")][0].api_key // empty' /tmp/project-api-keys.json)"
            elevated_kind=secret
          elif [ "$default_secret_count" -eq 0 ] && [ "$legacy_count" -eq 1 ]; then
            elevated_key="$(jq -r '[.[] | select(.type == "legacy" and (.name == "service_role" or ((.secret_jwt_template.role // "") == "service_role")))][0].api_key // empty' /tmp/project-api-keys.json)"
            elevated_kind=legacy
          else
'''
          if text.count(old) != 1:
              raise SystemExit(f'proof key resolver block count={text.count(old)}')
          workflow.write_text(text.replace(old, new))

          contract = Path('scripts/test-r4f-revision4-12-ledger-qualification-contract.sh')
          contract_text = contract.read_text()
          marker = "printf '%s\\n' 'R4F revision-4 exact 12-ledger qualification contract: PASS'\n"
          if contract_text.count(marker) != 1:
              raise SystemExit(f'contract final marker count={contract_text.count(marker)}')
          regression = r'''grep -Fq 'default_secret_count="$(jq '\''[.[] | select(.type == "secret" and .name == "default")] | length'\'' /tmp/project-api-keys.json)"' "$workflow"
          grep -Fq 'if [ "$default_secret_count" -eq 1 ]; then' "$workflow"
          grep -Fq 'elevated_key="$(jq -r '\''[.[] | select(.type == "secret" and .name == "default")][0].api_key // empty'\'' /tmp/project-api-keys.json)"' "$workflow"
          grep -Fq 'elif [ "$default_secret_count" -eq 0 ] && [ "$legacy_count" -eq 1 ]; then' "$workflow"
          grep -Fq 'if [ "$SUPABASE_R4F_PROOF_KEY_KIND" = legacy ]; then' "$workflow"
          if grep -Fq 'secret_count="$(jq '\''[.[] | select(.type == "secret")] | length'\'' /tmp/project-api-keys.json)"' "$workflow"; then
            echo 'qualification workflow still selects an arbitrary secret key instead of SUPABASE_SECRET_KEYS.default' >&2
            exit 1
          fi

          python - "$workflow" <<'PY_PROOF_KEY_ORDER'
          from pathlib import Path
          import sys

          text = Path(sys.argv[1]).read_text()
          start = text.index('      - name: Resolve exactly one elevated database API key\n')
          end = text.index('\n      - name: Bundle and deploy only isolated temporary revision-4 proof function\n', start)
          section = text[start:end]
          secret_if = section.index('if [ "$default_secret_count" -eq 1 ]; then')
          legacy_fallback = section.index('elif [ "$default_secret_count" -eq 0 ] && [ "$legacy_count" -eq 1 ]; then')
          secret_select = section.index('select(.type == "secret" and .name == "default")][0].api_key')
          legacy_select = section.index('select(.type == "legacy" and (.name == "service_role"')
          if not (secret_if < secret_select < legacy_fallback < legacy_select):
              raise SystemExit('proof key resolver does not prefer default secret before legacy fallback')
          PY_PROOF_KEY_ORDER

          '''
          contract.write_text(contract_text.replace(marker, regression + marker))
          PY

          bash scripts/test-r4f-revision4-12-ledger-qualification-contract.sh
          git diff --check
          git diff -- .github/workflows/r4f-revision4-12-ledger-qualification.yml scripts/test-r4f-revision4-12-ledger-qualification-contract.sh

          mkdir -p .r4f-verified
          cp .github/workflows/r4f-revision4-12-ledger-qualification.yml .r4f-verified/r4f-revision4-12-ledger-qualification.yml
          cp scripts/test-r4f-revision4-12-ledger-qualification-contract.sh .r4f-verified/test-r4f-revision4-12-ledger-qualification-contract.sh
          git checkout -- .github/workflows/r4f-revision4-12-ledger-qualification.yml scripts/test-r4f-revision4-12-ledger-qualification-contract.sh
          test -f .r4f-verified/r4f-revision4-12-ledger-qualification.yml
          test -f .r4f-verified/test-r4f-revision4-12-ledger-qualification-contract.sh
          test "$(git status --short)" = '?? .r4f-verified/'

      - name: Stage verified blobs only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name badjoke-lab
          git config user.email badjoke.lab@gmail.com
          git add .r4f-verified/r4f-revision4-12-ledger-qualification.yml .r4f-verified/test-r4f-revision4-12-ledger-qualification-contract.sh
          git commit -m 'Stage verified revision4 proof key selection fix'
          git push origin HEAD:refs/heads/agent/r4f-proof-key-selection-fix-staging
          git hash-object .r4f-verified/r4f-revision4-12-ledger-qualification.yml
          git hash-object .r4f-verified/test-r4f-revision4-12-ledger-qualification-contract.sh
