name: Temporary R4F Proof Log Diagnostic

on:
  push:
    branches:
      - agent/r4f-proof-log-diagnostic

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out failing PR head
        uses: actions/checkout@v4
        with:
          ref: 04786b1f9fd4c90fd3fa817929dcf015bd4d589f
          fetch-depth: 1

      - name: Remove broken aligned-output parser only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/test-r4f-revision4-qualification-compact-checkpoint-postgres.sh')
          text = path.read_text()
          old = '''result_json="$(sed -n '/^{/,$p' /tmp/r4f-compact-checkpoint-result.txt | tr -d '\\n' | sed 's/^ *//;s/ *$//')"
          test -n "$result_json"

          '''
          # The source lines are not indented. Normalize the literal accordingly.
          old = old.replace('          ', '')
          if text.count(old) != 1:
              raise SystemExit(f'broken parser block count={text.count(old)}')
          path.write_text(text.replace(old, ''))
          PY
          git diff --check
          git diff -- scripts/test-r4f-revision4-qualification-compact-checkpoint-postgres.sh

      - name: Commit script-only fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name badjoke-lab
          git config user.email badjoke.lab@gmail.com
          git add scripts/test-r4f-revision4-qualification-compact-checkpoint-postgres.sh
          git commit -m 'Fix compact checkpoint integration assertion'
          git push origin HEAD:refs/heads/agent/r4f-compact-test-parser-fix-staging
          git rev-parse HEAD
