name: Temporary R4F Proof Log Diagnostic

on:
  push:
    branches:
      - agent/r4f-proof-log-diagnostic

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reproduce exact Devnet server_info request read-only
        shell: bash
        run: |
          set -euo pipefail
          started="$(date -u '+%Y-%m-%dT%H:%M:%S.%3NZ')"
          set +e
          http_meta="$(curl --silent --show-error --max-time 30 \
            -o /tmp/devnet-head.json \
            -w '%{http_code} %{time_total} %{remote_ip}\n' \
            -H 'content-type: application/json' \
            --data '{"method":"server_info","params":[{}]}' \
            'https://s.devnet.rippletest.net:51234/')"
          curl_status=$?
          set -e
          finished="$(date -u '+%Y-%m-%dT%H:%M:%S.%3NZ')"
          http_code="$(awk '{print $1}' <<<"$http_meta")"
          time_total="$(awk '{print $2}' <<<"$http_meta")"
          remote_ip="$(awk '{print $3}' <<<"$http_meta")"
          response_bytes="$(wc -c < /tmp/devnet-head.json 2>/dev/null || printf '0')"
          result_status="$(jq -r '.result.status // .status // empty' /tmp/devnet-head.json 2>/dev/null || true)"
          ledger_seq="$(jq -r '.result.info.validated_ledger.seq // empty' /tmp/devnet-head.json 2>/dev/null || true)"
          error_code="$(jq -r '.error // .result.error // empty' /tmp/devnet-head.json 2>/dev/null || true)"
          jq -n \
            --arg started "$started" \
            --arg finished "$finished" \
            --argjson curlStatus "$curl_status" \
            --arg httpCode "$http_code" \
            --arg timeTotal "$time_total" \
            --arg remoteIp "$remote_ip" \
            --argjson responseBytes "$response_bytes" \
            --arg resultStatus "$result_status" \
            --arg ledgerSeq "$ledger_seq" \
            --arg errorCode "$error_code" \
            '{schemaVersion:1,purpose:"r4f-devnet-server-info-readonly-diagnostic",readOnly:true,productionMutationPerformed:false,started:$started,finished:$finished,curlStatus:$curlStatus,httpCode:$httpCode,timeTotalSeconds:$timeTotal,remoteIp:$remoteIp,responseBytes:$responseBytes,resultStatus:$resultStatus,validatedLedgerSeq:$ledgerSeq,errorCode:$errorCode}' \
            > r4f-proof-log-diagnostic.json
          cat r4f-proof-log-diagnostic.json

      - name: Upload sanitized diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: r4f-proof-log-diagnostic
          path: r4f-proof-log-diagnostic.json
          if-no-files-found: error
          retention-days: 7
