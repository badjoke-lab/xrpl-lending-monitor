name: Temporary R4F Proof Log Diagnostic

on:
  push:
    branches:
      - agent/r4f-proof-log-diagnostic

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out failing PR head
        uses: actions/checkout@v4
        with:
          ref: 04786b1f9fd4c90fd3fa817929dcf015bd4d589f
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reproduce PostgreSQL integration with trace
        id: reproduce
        shell: bash
        run: |
          set +e
          bash -x scripts/test-r4f-revision4-directional-persistence-postgres.sh > /tmp/r4f-postgres-debug.log 2>&1
          status=$?
          set -e
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          tail -n 160 /tmp/r4f-postgres-debug.log
          cp /tmp/r4f-postgres-debug.log r4f-proof-log-diagnostic.txt

      - name: Upload diagnostic trace
        uses: actions/upload-artifact@v4
        with:
          name: r4f-proof-log-diagnostic
          path: r4f-proof-log-diagnostic.txt
          if-no-files-found: error
          retention-days: 7

      - name: Assert reproduction result recorded
        run: |
          echo "reproduced_status=${{ steps.reproduce.outputs.status }}"
          test -n "${{ steps.reproduce.outputs.status }}"
