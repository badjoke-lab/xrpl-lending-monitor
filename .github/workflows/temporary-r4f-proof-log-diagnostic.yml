name: Temporary R4F Proof Log Diagnostic

on:
  push:
    branches:
      - agent/r4f-proof-log-diagnostic

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Audit R5 checkpoint consumers in repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic
          rg -n --hidden \
            --glob '!node_modules/**' \
            --glob '!.git/**' \
            '(xrpl_read_r5_active_checkpoint|xrpl_create_r5_active_checkpoint|xrpl_create_r5_revision4_active_checkpoint|xrpl_r5_v1\.active_checkpoints|checkpoint_state_digest|stateDigest)' \
            . > diagnostic/checkpoint-consumers.txt || true
          python - <<'PY'
          import json, pathlib, re
          lines=pathlib.Path('diagnostic/checkpoint-consumers.txt').read_text().splitlines()
          rows=[]
          for line in lines:
              m=re.match(r'^([^:]+):(\d+):(.*)$', line)
              if not m: continue
              path,lineno,text=m.groups()
              rows.append({'path':path.removeprefix('./'),'line':int(lineno),'text':text.strip()[:500]})
          paths=sorted({r['path'] for r in rows})
          evidence={
            'schemaVersion':1,
            'purpose':'r5-checkpoint-repository-consumer-audit',
            'productionMutationPerformed':False,
            'matchCount':len(rows),
            'paths':paths,
            'matches':rows,
          }
          pathlib.Path('diagnostic/r4f-proof-log-diagnostic.json').write_text(json.dumps(evidence,indent=2)+'\n')
          print(json.dumps({'matchCount':len(rows),'paths':paths},indent=2))
          PY
      - name: Upload repository consumer audit
        uses: actions/upload-artifact@v4
        with:
          name: r4f-proof-log-diagnostic
          path: diagnostic/r4f-proof-log-diagnostic.json
          if-no-files-found: error
          retention-days: 7
