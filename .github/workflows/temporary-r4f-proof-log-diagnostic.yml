name: Temporary R4F Proof Log Diagnostic

on:
  push:
    branches:
      - agent/r4f-proof-log-diagnostic

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      CAPTURE_START: '2026-08-12T12:51:40Z'
      CAPTURE_END: '2026-08-12T12:53:55Z'
      TARGET_PATH: '/functions/v1/xrpl-r4f-revision4-proof-batch'
    steps:
      - name: Query exact read-only Edge log interval
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          [[ "$SUPABASE_PROJECT_ID" =~ ^[a-z]{20}$ ]]
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises'

          const token = process.env.SUPABASE_ACCESS_TOKEN ?? ''
          const project = process.env.SUPABASE_PROJECT_ID ?? ''
          const start = process.env.CAPTURE_START ?? ''
          const end = process.env.CAPTURE_END ?? ''
          const targetPath = process.env.TARGET_PATH ?? ''
          if (!token || !/^[a-z]{20}$/u.test(project)) throw new Error('Supabase credentials unavailable')
          if (!start || !end || !targetPath) throw new Error('diagnostic bounds unavailable')
          const endpoint = `https://api.supabase.com/v1/projects/${project}/analytics/endpoints/logs`

          async function query(sql) {
            const url = new URL(endpoint)
            url.searchParams.set('sql', sql)
            url.searchParams.set('iso_timestamp_start', start)
            url.searchParams.set('iso_timestamp_end', end)
            const response = await fetch(url, {
              headers: { authorization: `Bearer ${token}`, accept: 'application/json' },
              signal: AbortSignal.timeout(60_000),
            })
            const text = await response.text()
            const parsed = JSON.parse(text)
            if (!response.ok) throw new Error(`logs query failed ${response.status}: ${JSON.stringify(parsed).slice(0, 500)}`)
            if (typeof parsed?.error === 'string' && parsed.error) throw new Error(parsed.error)
            return Array.isArray(parsed?.result) ? parsed.result : Array.isArray(parsed) ? parsed : []
          }

          const edgeSql = `
          SELECT
            timestamp,
            id,
            source,
            event_message,
            severity_text,
            log_attributes['request.method'] AS method,
            log_attributes['request.path'] AS path,
            toInt32OrZero(log_attributes['response.status_code']) AS status,
            log_attributes['response.origin_time'] AS origin_time,
            toJSONString(log_attributes) AS attributes_json
          FROM logs
          WHERE timestamp >= parseDateTimeBestEffort('${start}')
            AND timestamp <= parseDateTimeBestEffort('${end}')
            AND source = 'function_edge_logs'
            AND log_attributes['request.path'] LIKE '%${targetPath}'
          ORDER BY timestamp ASC
          LIMIT 50
          `.trim()

          const runtimeSql = `
          SELECT
            timestamp,
            id,
            source,
            event_message,
            severity_text,
            toJSONString(log_attributes) AS attributes_json
          FROM logs
          WHERE timestamp >= parseDateTimeBestEffort('${start}')
            AND timestamp <= parseDateTimeBestEffort('${end}')
            AND source = 'function_logs'
          ORDER BY timestamp ASC
          LIMIT 1000
          `.trim()

          const [edgeRows, runtimeRows] = await Promise.all([query(edgeSql), query(runtimeSql)])

          function parseAttrs(row) {
            try { return JSON.parse(String(row.attributes_json ?? '{}')) } catch { return {} }
          }
          const targetIds = new Set()
          for (const row of edgeRows) {
            const attrs = parseAttrs(row)
            for (const [key, value] of Object.entries(attrs)) {
              if (/(execution|function|deployment|version)/iu.test(key) && typeof value === 'string' && value.length >= 6) {
                targetIds.add(value)
              }
            }
          }

          const interestingKey = /(execution|function|deployment|version|region|event|shutdown|reason|status|duration|time)/iu
          const fallbackMessage = /(wall.?clock|cpu|shutdown|earlydrop|boot|timeout|limit|error|cancel|worker)/iu
          const filteredRuntime = runtimeRows.filter((row) => {
            const attrs = parseAttrs(row)
            const values = Object.values(attrs).map((value) => String(value))
            if ([...targetIds].some((id) => values.includes(id) || String(row.event_message ?? '').includes(id))) return true
            return fallbackMessage.test(String(row.event_message ?? ''))
          })

          function sanitizeString(value) {
            return String(value ?? '')
              .replaceAll(project, '[project]')
              .replaceAll(token, '[access-token]')
              .replace(/Bearer\s+[A-Za-z0-9._-]{12,}/giu, 'Bearer [redacted]')
              .replace(/sbp_[A-Za-z0-9_-]{12,}/gu, 'sbp_[redacted]')
              .replace(/postgres(?:ql)?:\/\/[^\s"']+/giu, 'postgres://[redacted]')
          }
          function selectedAttrs(row) {
            const attrs = parseAttrs(row)
            return Object.fromEntries(Object.entries(attrs)
              .filter(([key]) => interestingKey.test(key))
              .map(([key, value]) => [sanitizeString(key), sanitizeString(value)]))
          }
          const evidence = {
            schemaVersion: 1,
            purpose: 'r4f-revision4-proof-log-readonly-diagnostic',
            targetRun: 31598361794,
            interval: { start, end },
            targetPath,
            readOnlyManagementApi: true,
            productionMutationPerformed: false,
            edgeRows: edgeRows.map((row) => ({
              timestamp: sanitizeString(row.timestamp),
              eventMessage: sanitizeString(row.event_message),
              severity: sanitizeString(row.severity_text),
              method: sanitizeString(row.method),
              path: sanitizeString(row.path),
              status: Number(row.status ?? 0),
              originTime: sanitizeString(row.origin_time),
              attributes: selectedAttrs(row),
            })),
            targetIdentifiers: [...targetIds].map(sanitizeString),
            runtimeRows: filteredRuntime.map((row) => ({
              timestamp: sanitizeString(row.timestamp),
              eventMessage: sanitizeString(row.event_message),
              severity: sanitizeString(row.severity_text),
              attributes: selectedAttrs(row),
            })),
          }
          const output = `${JSON.stringify(evidence, null, 2)}\n`
          if (output.includes(project) || output.includes(token)) throw new Error('sanitization failed')
          if (/Bearer\s+[A-Za-z0-9._-]{12,}|sbp_[A-Za-z0-9_-]{12,}|postgres(?:ql)?:\/\//u.test(output)) {
            throw new Error('credential-shaped material retained')
          }
          await writeFile('r4f-proof-log-diagnostic.json', output)
          console.log(JSON.stringify({
            edgeRows: evidence.edgeRows,
            targetIdentifiers: evidence.targetIdentifiers,
            runtimeRows: evidence.runtimeRows,
          }, null, 2))
          NODE

      - name: Upload sanitized diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: r4f-proof-log-diagnostic
          path: r4f-proof-log-diagnostic.json
          if-no-files-found: error
          retention-days: 7
