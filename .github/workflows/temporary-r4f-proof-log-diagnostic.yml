name: Temporary R4F Proof Log Diagnostic

on:
  push:
    branches:
      - agent/r4f-proof-log-diagnostic

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Read current checkpoint function definitions
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          [[ "$SUPABASE_PROJECT_ID" =~ ^[a-z]{20}$ ]]
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises'
          const token = process.env.SUPABASE_ACCESS_TOKEN ?? ''
          const project = process.env.SUPABASE_PROJECT_ID ?? ''
          const endpoint = `https://api.supabase.com/v1/projects/${project}/database/query`
          const sql = `
          select p.oid::regprocedure::text as signature,
                 pg_get_functiondef(p.oid) as definition
          from pg_proc p
          join pg_namespace n on n.oid = p.pronamespace
          where n.nspname = 'public'
            and p.proname in (
              'xrpl_create_r5_active_checkpoint_strict',
              'xrpl_create_r5_active_checkpoint',
              'xrpl_create_r5_revision4_active_checkpoint',
              'xrpl_transfer_json_digest'
            )
          order by p.proname, p.oid;
          `.trim()
          const response = await fetch(endpoint, {
            method: 'POST',
            headers: {authorization:`Bearer ${token}`,'content-type':'application/json',accept:'application/json'},
            body: JSON.stringify({query: sql, read_only: true}),
            signal: AbortSignal.timeout(60_000),
          })
          const text = await response.text()
          if (!response.ok) throw new Error(`database query failed:${response.status}:${text.slice(0,500)}`)
          const parsed = JSON.parse(text)
          const rows = Array.isArray(parsed) ? parsed : Array.isArray(parsed?.result) ? parsed.result : []
          const output = `${JSON.stringify({schemaVersion:1,purpose:'live-checkpoint-function-definitions-readonly',readOnly:true,productionMutationPerformed:false,rows},null,2)}\n`
          if (output.includes(project) || output.includes(token)) throw new Error('sanitization failed')
          await writeFile('r4f-proof-log-diagnostic.json', output)
          console.log(JSON.stringify({signatures: rows.map(r => r.signature), definitionBytes: rows.map(r => [r.signature, Buffer.byteLength(String(r.definition ?? ''),'utf8')])}, null, 2))
          NODE

      - name: Upload sanitized diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: r4f-proof-log-diagnostic
          path: r4f-proof-log-diagnostic.json
          if-no-files-found: error
          retention-days: 7
