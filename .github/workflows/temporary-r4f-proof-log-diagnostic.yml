name: Temporary R4F Proof Log Diagnostic

on:
  push:
    branches:
      - agent/r4f-proof-log-diagnostic

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact current main
        uses: actions/checkout@v4
        with:
          ref: 2517bc28cc862979205ee4032d58d730d367265b
          fetch-depth: 1

      - name: Patch and validate proof key selection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/r4f-revision4-12-ledger-qualification.yml')
          text = workflow.read_text()
          indent = '          '
          old_lines = [
              '''legacy_count="$(jq '[.[] | select(.type == "legacy" and (.name == "service_role" or ((.secret_jwt_template.role // "") == "service_role")))] | length' /tmp/project-api-keys.json)"''',
              '''secret_count="$(jq '[.[] | select(.type == "secret")] | length' /tmp/project-api-keys.json)"''',
              '''if [ "$legacy_count" -eq 1 ]; then''',
              '''  elevated_key="$(jq -r '[.[] | select(.type == "legacy" and (.name == "service_role" or ((.secret_jwt_template.role // "") == "service_role")))][0].api_key // empty' /tmp/project-api-keys.json)"''',
              '''  elevated_kind=legacy''',
              '''elif [ "$legacy_count" -eq 0 ] && [ "$secret_count" -eq 1 ]; then''',
              '''  elevated_key="$(jq -r '[.[] | select(.type == "secret")][0].api_key // empty' /tmp/project-api-keys.json)"''',
              '''  elevated_kind=secret''',
              '''else''',
          ]
          new_lines = [
              '''default_secret_count="$(jq '[.[] | select(.type == "secret" and .name == "default")] | length' /tmp/project-api-keys.json)"''',
              old_lines[0],
              '''if [ "$default_secret_count" -eq 1 ]; then''',
              '''  elevated_key="$(jq -r '[.[] | select(.type == "secret" and .name == "default")][0].api_key // empty' /tmp/project-api-keys.json)"''',
              '''  elevated_kind=secret''',
              '''elif [ "$default_secret_count" -eq 0 ] && [ "$legacy_count" -eq 1 ]; then''',
              old_lines[3],
              '''  elevated_kind=legacy''',
              '''else''',
          ]
          old = '\n'.join(indent + line for line in old_lines) + '\n'
          new = '\n'.join(indent + line for line in new_lines) + '\n'
          if text.count(old) != 1:
              raise SystemExit(f'proof key resolver block count={text.count(old)}')
          workflow.write_text(text.replace(old, new))

          contract = Path('scripts/test-r4f-revision4-12-ledger-qualification-contract.sh')
          contract_text = contract.read_text()
          marker = "printf '%s\\n' 'R4F revision-4 exact 12-ledger qualification contract: PASS'\n"
          if contract_text.count(marker) != 1:
              raise SystemExit(f'contract final marker count={contract_text.count(marker)}')
          checks = '''grep -Fq 'default_secret_count="$(jq' "$workflow"
          grep -Fq 'select(.type == "secret" and .name == "default")' "$workflow"
          grep -Fq 'if [ "$default_secret_count" -eq 1 ]; then' "$workflow"
          grep -Fq 'elif [ "$default_secret_count" -eq 0 ] && [ "$legacy_count" -eq 1 ]; then' "$workflow"
          grep -Fq 'if [ "$SUPABASE_R4F_PROOF_KEY_KIND" = legacy ]; then' "$workflow"
          if grep -Fq 'secret_count="$(jq' "$workflow"; then
            echo 'qualification workflow still contains arbitrary secret-key selection' >&2
            exit 1
          fi

          '''
          contract.write_text(contract_text.replace(marker, checks + marker))
          PY

          bash scripts/test-r4f-revision4-12-ledger-qualification-contract.sh
          git diff --check

          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/r4f-revision4-12-ledger-qualification.yml').read_text()
          start = text.index('      - name: Resolve exactly one elevated database API key\n')
          end = text.index('\n      - name: Bundle and deploy only isolated temporary revision-4 proof function\n', start)
          section = text[start:end]
          positions = [
              section.index('if [ "$default_secret_count" -eq 1 ]; then'),
              section.index('select(.type == "secret" and .name == "default")][0].api_key'),
              section.index('elif [ "$default_secret_count" -eq 0 ] && [ "$legacy_count" -eq 1 ]; then'),
              section.index('select(.type == "legacy" and (.name == "service_role"'),
          ]
          if positions != sorted(positions):
              raise SystemExit('default secret is not selected before legacy fallback')
          PY

          git diff -- .github/workflows/r4f-revision4-12-ledger-qualification.yml scripts/test-r4f-revision4-12-ledger-qualification-contract.sh

      - name: Commit validated two-file fix to staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name badjoke-lab
          git config user.email badjoke.lab@gmail.com
          git add .github/workflows/r4f-revision4-12-ledger-qualification.yml scripts/test-r4f-revision4-12-ledger-qualification-contract.sh
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" -eq 2
          git commit -m 'Prefer default Supabase secret for revision4 proof'
          git push origin HEAD:refs/heads/agent/r4f-proof-key-selection-fix-staging --force
          git rev-parse HEAD
