name: Temporary R4F Proof Log Diagnostic

on:
  push:
    branches:
      - agent/r4f-proof-log-diagnostic

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      CAPTURE_START: '2026-08-12T12:50:00Z'
      CAPTURE_END: '2026-08-12T12:54:30Z'
    steps:
      - name: Query sanitized generic Edge events read-only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          [[ "$SUPABASE_PROJECT_ID" =~ ^[a-z]{20}$ ]]
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises'
          const token = process.env.SUPABASE_ACCESS_TOKEN ?? ''
          const project = process.env.SUPABASE_PROJECT_ID ?? ''
          const start = process.env.CAPTURE_START ?? ''
          const end = process.env.CAPTURE_END ?? ''
          const endpoint = `https://api.supabase.com/v1/projects/${project}/analytics/endpoints/logs`
          async function query(sql) {
            const url = new URL(endpoint)
            url.searchParams.set('sql', sql)
            url.searchParams.set('iso_timestamp_start', start)
            url.searchParams.set('iso_timestamp_end', end)
            const response = await fetch(url, {
              headers: { authorization: `Bearer ${token}`, accept: 'application/json' },
              signal: AbortSignal.timeout(60_000),
            })
            const parsed = JSON.parse(await response.text())
            if (!response.ok || (typeof parsed?.error === 'string' && parsed.error)) {
              throw new Error(`logs query failed:${response.status}:${String(parsed?.error ?? '')}`)
            }
            return Array.isArray(parsed?.result) ? parsed.result : []
          }
          const edgeSql = `SELECT timestamp,event_message,severity_text,toJSONString(log_attributes) AS attributes_json FROM logs WHERE timestamp >= parseDateTimeBestEffort('${start}') AND timestamp <= parseDateTimeBestEffort('${end}') AND source='edge_logs' ORDER BY timestamp ASC LIMIT 100`
          const rows = await query(edgeSql)
          function attrs(row) { try { return JSON.parse(String(row.attributes_json ?? '{}')) } catch { return {} } }
          function sanitize(value) {
            return String(value ?? '')
              .replaceAll(project, '[project]')
              .replaceAll(token, '[access-token]')
              .replace(/Bearer\s+[A-Za-z0-9._-]{12,}/giu, 'Bearer [redacted]')
              .replace(/sbp_[A-Za-z0-9_-]{12,}/gu, 'sbp_[redacted]')
              .replace(/postgres(?:ql)?:\/\/[^\s"']+/giu, 'postgres://[redacted]')
          }
          const useful = /(status|method|path|execution|function|deployment|version|region|duration|time|reason|event|origin|request|response|route|error)/iu
          function safeRow(row) {
            const a = attrs(row)
            return {
              timestamp: sanitize(row.timestamp),
              eventMessage: sanitize(row.event_message),
              severity: sanitize(row.severity_text),
              attributeKeys: Object.keys(a).sort().map(sanitize),
              attributes: Object.fromEntries(Object.entries(a)
                .filter(([key]) => useful.test(key) && !/(header|authorization|apikey|body|query|cookie|ip$)/iu.test(key))
                .map(([key,value]) => [sanitize(key), sanitize(value)])),
            }
          }
          const evidence = {
            schemaVersion: 4,
            purpose: 'r4f-revision4-proof-generic-edge-readonly-diagnostic',
            targetRun: 31598361794,
            interval: { start, end },
            readOnlyManagementApi: true,
            productionMutationPerformed: false,
            genericEdgeRows: rows.map(safeRow),
          }
          const output = `${JSON.stringify(evidence, null, 2)}\n`
          if (output.includes(project) || output.includes(token)) throw new Error('sanitization failed')
          if (/Bearer\s+[A-Za-z0-9._-]{12,}|sbp_[A-Za-z0-9_-]{12,}|postgres(?:ql)?:\/\//u.test(output)) throw new Error('credential-shaped material retained')
          await writeFile('r4f-proof-log-diagnostic.json', output)
          console.log(output)
          NODE

      - name: Upload sanitized diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: r4f-proof-log-diagnostic
          path: r4f-proof-log-diagnostic.json
          if-no-files-found: error
          retention-days: 7
