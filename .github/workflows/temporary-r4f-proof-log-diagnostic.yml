name: Temporary R4F Proof Log Diagnostic

on:
  push:
    branches:
      - agent/r4f-proof-log-diagnostic

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Inspect only API key kinds read-only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          [[ "$SUPABASE_PROJECT_ID" =~ ^[a-z]{20}$ ]]
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/api-keys?reveal=true" > /tmp/project-api-keys.json
          jq '[.[] | {type, name, role: (.secret_jwt_template.role // null), prefix: (.prefix // null), hasApiKey: ((.api_key // "") | length > 0)}]' /tmp/project-api-keys.json \
            > /tmp/key-metadata.json
          legacy_service_role_count="$(jq '[.[] | select(.type == "legacy" and (.name == "service_role" or .role == "service_role"))] | length' /tmp/key-metadata.json)"
          secret_count="$(jq '[.[] | select(.type == "secret")] | length' /tmp/key-metadata.json)"
          publishable_count="$(jq '[.[] | select(.type == "publishable")] | length' /tmp/key-metadata.json)"
          legacy_anon_count="$(jq '[.[] | select(.type == "legacy" and (.name == "anon" or .role == "anon"))] | length' /tmp/key-metadata.json)"
          selected_kind=invalid
          if [ "$legacy_service_role_count" -eq 1 ]; then
            selected_kind=legacy
          elif [ "$legacy_service_role_count" -eq 0 ] && [ "$secret_count" -eq 1 ]; then
            selected_kind=secret
          fi
          jq -n \
            --argjson legacyServiceRoleCount "$legacy_service_role_count" \
            --argjson secretCount "$secret_count" \
            --argjson publishableCount "$publishable_count" \
            --argjson legacyAnonCount "$legacy_anon_count" \
            --arg selectedKind "$selected_kind" \
            '{schemaVersion:1,purpose:"r4f-proof-api-key-kind-readonly-diagnostic",readOnlyManagementApi:true,productionMutationPerformed:false,legacyServiceRoleCount:$legacyServiceRoleCount,secretCount:$secretCount,publishableCount:$publishableCount,legacyAnonCount:$legacyAnonCount,qualificationResolverWouldSelect:$selectedKind}' \
            > r4f-proof-log-diagnostic.json
          cat r4f-proof-log-diagnostic.json
          rm -f /tmp/project-api-keys.json /tmp/key-metadata.json

      - name: Upload sanitized diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: r4f-proof-log-diagnostic
          path: r4f-proof-log-diagnostic.json
          if-no-files-found: error
          retention-days: 7
