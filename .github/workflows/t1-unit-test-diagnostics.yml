name: T1 unit test diagnostics

on:
  pull_request:
    paths:
      - 'src/collector/incremental/**'
      - '.github/workflows/t1-unit-test-diagnostics.yml'

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests and retain diagnostics
        id: unit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee t1-unit-test.log

      - name: Upload unit-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t1-unit-test-diagnostics
          path: t1-unit-test.log
          if-no-files-found: error

      - name: Preserve unit-test outcome
        if: steps.unit.outcome == 'failure'
        run: exit 1
