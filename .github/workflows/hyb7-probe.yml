name: HYB7 probe
on:
  pull_request:
    paths: [.github/workflows/hyb7-probe.yml]
permissions:
  contents: read
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir probe
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" > probe/subdomain.json
          S="$(jq -r '.result.subdomain' probe/subdomain.json)"
          B="https://xrpl-lending-monitor.${S}.workers.dev"
          curl -fsS "${B}/api/status/collector" > probe/collector.json
          curl -fsS "${B}/api/status/continuation-diagnostics" > probe/hyb7.json
          curl -fsS "${B}/api/status/m1-exit-diagnostics" > probe/m1.json
          jq '{status,cursor,consecutive_failures}' probe/collector.json
          jq '{passed:.report.passed,paths:(.report.paths|with_entries(.value=.value.state)),loanActivity,balanceSource,managedTransitions}' probe/hyb7.json
          jq '{ready:.report.ready,gates:(.report.gates|with_entries(.value=.value.state))}' probe/m1.json
          jq -e '[.report.paths[]|select(.state=="inconsistent")]|length==0' probe/hyb7.json >/dev/null
          jq -e '[.report.gates[]|select(.state=="inconsistent")]|length==0' probe/m1.json >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hyb7-probe
          path: probe
          retention-days: 14
