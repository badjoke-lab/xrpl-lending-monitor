name: Reconcile HYB-5 integration history

on:
  push:
    branches:
      - c4
    paths:
      - .github/workflows/reconcile-hyb5-integration.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: c4
      - name: Merge main and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit -X ours origin/main
          git rm .github/workflows/reconcile-hyb5-integration.yml
          git commit -m "ci: remove HYB-5 reconciliation helper"
          git push origin HEAD:c4
