name: Verify source drilldown

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/verify-source-drilldown.yml]

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec wrangler deploy
      - name: Capture evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          curl --fail-with-body --silent --show-error --retry 3 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" > evidence/subdomain.json
          SUBDOMAIN="$(jq -r '.result.subdomain // empty' evidence/subdomain.json)"
          BASE="https://xrpl-lending-monitor.${SUBDOMAIN}.workers.dev"
          curl --fail-with-body --silent --show-error --retry 3 "$BASE/api/status/continuation-diagnostics" > evidence/continuation.json
          curl --fail-with-body --silent --show-error --retry 3 "$BASE/api/status/m1-exit-diagnostics" > evidence/m1-exit.json
          curl --fail-with-body --silent --show-error --retry 3 "$BASE/api/status/collector" > evidence/collector.json
          jq -e '.loanActivity' evidence/continuation.json > /dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-drilldown-evidence
          path: evidence
          if-no-files-found: error
          retention-days: 7
