name: Local source export

on:
  push:
    branches:
      - tmp/local-behavior-source-export-20260728

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact branch commit
        uses: actions/checkout@v4
      - name: Record source identity
        run: |
          printf '%s\n' "${GITHUB_SHA}" > SOURCE_SHA.txt
          git status --short
      - name: Upload complete source tree
        uses: actions/upload-artifact@v4
        with:
          name: xrpl-lending-source-${{ github.sha }}
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1
