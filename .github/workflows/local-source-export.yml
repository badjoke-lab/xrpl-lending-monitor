name: Local source export

on:
  pull_request:
  push:
    branches:
      - tmp/local-behavior-source-export-20260728

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact branch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build exact frontend assets
        run: pnpm build:deploy-assets
      - name: Install isolated Playwright Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: playwright-browsers
        run: pnpm exec playwright install chromium
      - name: Pack local runtime
        run: |
          tar --zstd -cf node_modules.tar.zst node_modules
          tar --zstd -cf playwright-browsers.tar.zst playwright-browsers
      - name: Record source identity
        run: |
          printf '%s\n' "${{ github.event.pull_request.head.sha || github.sha }}" > SOURCE_SHA.txt
          git status --short
      - name: Upload exact local e2e bundle
        uses: actions/upload-artifact@v4
        with:
          name: xrpl-lending-local-e2e-browser-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist
            tests/e2e
            playwright.config.ts
            package.json
            node_modules.tar.zst
            playwright-browsers.tar.zst
            SOURCE_SHA.txt
          if-no-files-found: error
          retention-days: 1
