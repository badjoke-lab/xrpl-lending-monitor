name: Fix D1 integration

on:
  pull_request:
    paths:
      - src/worker/bootstrap/d1-local-integration.test.ts
      - .github/workflows/fix-d1-integration.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d1-integration
      - run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/worker/bootstrap/d1-local-integration.test.ts')
          s = p.read_text()
          old = """      id: firstIdentity.snapshotId,
      ledger_index: firstIdentity.ledgerIndex,
      object_count: 0,
"""
          new = """      id: firstIdentity.snapshotId,
      ledgerIndex: firstIdentity.ledgerIndex,
      objectCount: 0,
"""
          if old not in s:
              raise SystemExit('expected snapshot assertion missing')
          p.write_text(s.replace(old, new))
          Path('.github/workflows/fix-d1-integration.yml').unlink()
          PY
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/worker/bootstrap/d1-local-integration.test.ts .github/workflows/fix-d1-integration.yml
          git commit -m "test: use active snapshot contract keys"
          git push origin HEAD:d1-integration
