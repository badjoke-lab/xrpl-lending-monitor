name: Fast lane shadow canary PR

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/measure-fast-lane-shadow-canary.mjs'
      - '.github/workflows/fast-lane-shadow-canary.yml'
      - '.github/workflows/fast-lane-shadow-canary-pr.yml'

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Run real read-only shadow sample
        run: |
          node scripts/measure-fast-lane-shadow-canary.mjs \
            --endpoint https://devnet.honeycluster.io/ \
            --max-ledgers 90 \
            --read-window 4 \
            --bootstrap-ledgers 90 \
            --output fast-lane-canary/sample.json
          jq -e '
            .mode == "read-only-shadow"
            and .source.cadenceTargetSeconds == 300
            and .source.ledgersRead > 0
            and .metrics.inspectedTransactions >= .metrics.lendingTransactions
            and .metrics.affectedObjects.total >= 0
            and .metrics.minimalProjectionWriteLowerBound >= 2
            and .timing.elapsedMs > 0
          ' fast-lane-canary/sample.json > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: fast-lane-shadow-pr-sample
          path: fast-lane-canary/sample.json
          if-no-files-found: error
          retention-days: 7
