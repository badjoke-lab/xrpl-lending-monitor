name: D2 codec lock sync

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: read

jobs:
  sync:
    if: >-
      github.event.issue.number == 1675 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      github.event.comment.body == '/d2-sync-codec-lock'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/db-less-d2-codec-211-20260920
          fetch-depth: 1
      - run: corepack enable
      - run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Assert only lockfile changed
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --short | awk '{print $2}')"
          test "$changed" = "pnpm-lock.yaml"
      - name: Commit resolved lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'Sync ripple-binary-codec 2.11.0 lockfile'
          git push origin HEAD:agent/db-less-d2-codec-211-20260920
