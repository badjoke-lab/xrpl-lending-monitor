name: P0 soak Action interference audit 2026-07-21

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p0-soak-action-interference-audit-20260721.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: p0-soak-action-interference-audit-20260721
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Inventory workflows without touching Cloudflare or D1
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          python - <<'PY' > /tmp/workflow-audit.md
          from pathlib import Path
          import re

          root = Path('.github/workflows')
          files = sorted(root.glob('*.yml')) + sorted(root.glob('*.yaml'))
          print('# P0 soak and GitHub Actions interference audit')
          print()
          print('This audit only reads repository files. It does not call Cloudflare, D1, the Worker, or XRPL endpoints.')
          print()
          print(f'- workflow files present: **{len(files)}**')
          print()
          print('| workflow | scheduled | production deploy/write risk | D1/Cloudflare diagnostic reads | issue-only/reporting |')
          print('|---|---:|---:|---:|---:|')
          risky=[]
          scheduled=[]
          diagnostic=[]
          for p in files:
              text=p.read_text(errors='replace')
              has_schedule=bool(re.search(r'^\s*schedule\s*:', text, re.M))
              deploy=bool(re.search(r'wrangler\s+deploy|workers/scripts/.*/schedules|queues|d1\s+(execute|migrations)|/d1/database/.*/query', text, re.I))
              reads=bool(re.search(r'd1/database/.*/query|d1AnalyticsAdaptiveGroups|api/status/fast-lane-diff|api/overview|api/status/history-source', text, re.I))
              issue=bool(re.search(r'gh\s+issue|issues:\s*write', text, re.I))
              print(f'| `{p.name}` | {"yes" if has_schedule else "no"} | {"yes" if deploy else "no"} | {"yes" if reads else "no"} | {"yes" if issue else "no"} |')
              if has_schedule: scheduled.append(p.name)
              if deploy: risky.append(p.name)
              if reads: diagnostic.append(p.name)
          print()
          print('## Scheduled workflows')
          for x in scheduled: print(f'- `{x}`')
          if not scheduled: print('- none')
          print()
          print('## Workflows capable of production/D1/Cloudflare interaction')
          for x in risky: print(f'- `{x}`')
          if not risky: print('- none')
          print()
          print('## Diagnostic workflows that can add D1/API usage when triggered')
          for x in diagnostic: print(f'- `{x}`')
          if not diagnostic: print('- none')
          print()
          print('The inventory is evidence for manual review of trigger guards and overlap. It is not itself a pass/fail conclusion.')
          PY
          gh issue edit 966 --repo "$REPOSITORY" --body-file /tmp/workflow-audit.md
