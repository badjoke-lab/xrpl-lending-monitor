name: P0 patch recovery lag threshold

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: p0-patch-recovery-lag-threshold
  cancel-in-progress: false

jobs:
  patch:
    if: startsWith(github.event.issue.title, 'P0 patch recovery lag threshold')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: fix/runtime-cutover-lag-threshold-720
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch impossible runtime lag threshold
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -b "${BRANCH}"
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/p0-recover-rolling-backlog.yml')
          text = path.read_text()
          old = "      TARGET_MAX_LAG_LEDGERS: '300'"
          new = "      # One candidate cycle takes long enough for Devnet to advance roughly 400–500 ledgers.\n      # A 300-ledger gate is therefore operationally unreachable and causes endless A/B cycling.\n      # 720 remains bounded, is already enforced by the guarded live-cutover workflow, and\n      # leaves the fast lane to close the residual gap immediately after cutover.\n      TARGET_MAX_LAG_LEDGERS: '720'"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one threshold line, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          grep -F "TARGET_MAX_LAG_LEDGERS: '720'" .github/workflows/p0-recover-rolling-backlog.yml
          git add .github/workflows/p0-recover-rolling-backlog.yml
          git commit -m "Use achievable bounded recovery lag gate"
          git push origin "${BRANCH}"

      - name: Open focused pull request
        shell: bash
        run: |
          set -euo pipefail
          gh pr create \
            --base main \
            --head "${BRANCH}" \
            --title "Use achievable bounded recovery lag gate" \
            --body "The 300-ledger recovery gate is below the live Devnet movement during one candidate build, causing endless A/B cycles even when each candidate is valid. Restore the bounded 720-ledger gate already used by guarded cutover. No cadence, D1 quota, capacity, network, or Mainnet guard changes."

      - name: Record patch result
        shell: bash
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "Created focused recovery-threshold PR from branch \`${BRANCH}\`."
