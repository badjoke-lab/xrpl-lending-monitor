name: Reconcile M5-5 cross-audit evidence

on:
  pull_request:
    paths:
      - .github/workflows/reconcile-m5-5-cross-audit-docs.yml

permissions:
  contents: write

concurrency:
  group: reconcile-m5-5-cross-audit-evidence
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Reconcile roadmap and implementation status
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          roadmap = Path('docs/development-roadmap.md')
          text = roadmap.read_text()
          replacements = {
            '| M5 Differentiated audit UI | M5-5 active after successful M1 exit |': '| M5 Differentiated audit UI | M5-5 API cross-audit passed; browser regression and representative behavior smoke active |',
            'M1 exited on retained 2026-07-08 UTC evidence: collector healthy at exact head, HYB-7 passed with every path observed, and M1 exit diagnostics reported ready with every gate observed. Work now proceeds to M5-5 real-data integration while permanent monitoring and the independently D1-gated UI audit track continue.': 'M1 exited on retained 2026-07-08 UTC evidence. The first M5-5 D1-gated production cross-audit then passed against live Devnet data at 2026-07-08 00:52:38 UTC. API-level current/history, lifecycle/current, archive/current exclusion, live relationships, bounded exports, Activity result classification, Cover & Loss availability, snapshot identity, and freshness/lag checks are observed. M5-5 now proceeds to real-data browser regression and representative browser behavior smoke while permanent monitoring and the independently D1-gated human UI audit track continue.',
            '1. Preserve permanent monitoring and the completed M1 exit evidence.\n2. Run cross-audit real-data integration against the verified base-plus-overlay current state and indexed real history.\n3. Verify bounded exports against the live evidence boundary.\n4. Run real-data browser regression and current/history consistency checks.\n5. Cross-check lifecycle against current objects and prove archive/current exclusion.\n6. Run bounded production behavior smoke across representative list/detail and audit routes.\n7. Verify Loan to Loan Broker and Loan Broker to Vault relationships through live identifiers, plus freshness and lag claims against collector status.': '1. Preserve permanent monitoring and the completed M1 exit evidence.\n2. Preserve the passing D1-gated production cross-audit evidence and durable manual audit workflow.\n3. Treat API-level current/history, lifecycle/current, archive/current exclusion, live relationship, bounded export/feed, snapshot identity, and freshness/lag checks as observed from the retained cross-audit evidence.\n4. Preserve Activity result-code classification: successful and non-success protocol transactions are both valid indexed evidence and are counted separately rather than rejecting non-success events.\n5. Run real-data browser regression across representative Overview, entity list/detail, Activity, Lifecycle, Archived Objects, Cover & Loss, Search, and Network Status routes.\n6. Run representative browser production behavior smoke with live identifiers and prove route-level relationship, archive/current, history/current, lifecycle/current, and freshness presentation consistency.\n7. Reconcile M5-5 exit only after the browser regression and representative production behavior smoke pass.',
          }
          for old, new in replacements.items():
            if old not in text:
              raise SystemExit(f'missing roadmap anchor: {old[:100]}')
            text = text.replace(old, new, 1)

          evidence_anchor = 'M1 exit evidence recorded for this dependency: at 2026-07-08 00:13:44 UTC the collector was healthy with cursor and observed head both `3476415`, lag `0`, zero consecutive failures, HYB-7 passed with every path observed, and M1 diagnostics reported `ready: true` with all four gates observed.\n'
          evidence_addition = evidence_anchor + '\nFirst M5-5 production cross-audit evidence: at 2026-07-08 00:52:38 UTC the collector was healthy with cursor and observed head both `3477191`, lag `0`, and zero consecutive failures. Snapshot `devnet-3432924-canonical` matched Overview and current Vault, Loan Broker, and Loan reads. Loan to Loan Broker and Loan Broker to Vault links were consistent; a lifecycle-backed current Loan matched indexed lifecycle and bounded object history; an exact archived Loan was available in archive history and returned `404` from current state; Activity returned 100 rows classified as 77 successful and 23 non-success protocol transactions; Archived Objects returned 25 rows; Cover & Loss returned 100 rows; JSON, NDJSON, CSV, and feed NDJSON Activity exports each returned 25 bounded rows. The audit passed. D1 usage at capture time was 946,159 rows read and 3,414 rows written, so the unchanged headroom gate passed. Human screenshot review remains a separate Track B requirement.\n'
          if evidence_anchor not in text:
            raise SystemExit('missing M5 evidence anchor')
          text = text.replace(evidence_anchor, evidence_addition, 1)
          roadmap.write_text(text)

          status = Path('docs/implementation-status.md')
          text = status.read_text()

          phase_anchor = 'M1 exit is complete. M5-5 real-data integration is now active; M6 remains gated behind M5-5 and its production evidence.'
          phase_replacement = phase_anchor + '\n\nThe first D1-gated M5-5 production cross-audit passed at 2026-07-08 00:52:38 UTC. It verified shared snapshot identity across current entities, live Loan to Loan Broker and Loan Broker to Vault relationships, lifecycle-backed current/history consistency, lifecycle/current consistency, exact archive availability plus current-state exclusion, Activity result-code classification, Cover & Loss evidence availability, bounded Activity exports and feed output, Overview snapshot identity, and collector freshness. A durable manual workflow now repeats the same audit only after healthy zero-lag collector preflight and the unchanged measured D1 headroom gate pass. Real-data browser regression and representative browser production behavior smoke remain active before M5-5 exit.'
          if phase_anchor not in text:
            raise SystemExit('missing status phase anchor')
          text = text.replace(phase_anchor, phase_replacement, 1)

          resource_old = 'The 2026-07-08 00:13 UTC M1 exit probe measured fresh UTC-day D1 usage at 528 rows read and 1,168 rows written and passed the headroom gate. The production screenshot audit still applies its own independent current-day gate before crawling. Production screenshot audit remains deferred until a new current-day measurement passes; scheduling cannot bypass it.'
          resource_new = 'The 2026-07-08 00:52 UTC M5-5 production cross-audit probe measured 946,159 rows read and 3,414 rows written for the UTC day. Read and write fractions were approximately 18.92% and 3.41% of the configured daily reference allowances, so the unchanged below-80% gate passed. The production screenshot audit remains independently gated and must remeasure current-day usage before crawling.'
          if resource_old not in text:
            raise SystemExit('missing status resource blocker anchor')
          text = text.replace(resource_old, resource_new, 1)

          track_old = '''1. Preserve permanent monitoring and the completed M1 exit evidence.
2. Cross-audit verified current state against indexed real history.
3. Validate bounded exports against the live evidence boundary.
4. Run real-data browser regression and current/history consistency checks.
5. Cross-check lifecycle/current-object consistency and archive/current exclusion.
6. Run bounded production behavior smoke and relationship checks across representative routes.
7. Verify freshness and lag claims against collector status.'''
          track_new = '''1. Preserve permanent monitoring, completed M1 exit evidence, and the passing D1-gated production cross-audit artifact.
2. Keep the durable production cross-audit workflow available for repeatable API-level checks after healthy collector and measured D1 headroom gates pass.
3. Treat current/history, lifecycle/current, archive/current exclusion, live relationships, bounded exports/feed, snapshot identity, Activity result classification, and freshness/lag API checks as observed in retained evidence.
4. Run real-data browser regression across representative current, history, audit, Search, and Network Status routes.
5. Run representative browser production behavior smoke with live identifiers and verify rendered relationship, archive/current, history/current, lifecycle/current, and freshness consistency.
6. Reconcile M5-5 exit only after the browser regression and representative browser smoke pass.'''
          if track_old not in text:
            raise SystemExit('missing status Track A anchor')
          text = text.replace(track_old, track_new, 1)

          next_old = '''1. Keep permanent monitoring active.
2. Execute M5-5 cross-audit real-data integration against the completed M1 state.
3. Complete bounded exports, browser regression, current/history and lifecycle/current consistency, archive/current exclusion, relationship verification, and bounded production behavior smoke.
4. In parallel, run the independently D1-gated production UI audit when measured headroom permits; inspect summaries, diagnostics, and screenshots, then remediate and re-audit confirmed defects.
5. After M5-5 exits, complete M6 integrity/reset simulations, runtime/resource guardrails, final visual audit, accessibility, performance, security, and cross-browser validation.
6. Bind SEO/discoverability to the final public host and complete owner-managed analytics and search setup.
7. Finalize operations/deployment documentation and recovery verification.
8. Complete the real multi-day Devnet soak and final release verification.'''
          next_new = '''1. Keep permanent monitoring active.
2. Preserve the passing M5-5 API cross-audit evidence and durable D1-gated repeat workflow.
3. Run real-data browser regression and representative browser production behavior smoke across the roadmap route set, using live identifiers and checking relationship, archive/current, history/current, lifecycle/current, and freshness presentation consistency.
4. Reconcile M5-5 exit only from browser evidence; do not treat API cross-audit success as a substitute for browser regression.
5. In parallel, run the independently D1-gated production UI audit when measured headroom permits; inspect summaries, diagnostics, and screenshots, then remediate and re-audit confirmed defects.
6. After M5-5 exits, complete M6 integrity/reset simulations, runtime/resource guardrails, final visual audit, accessibility, performance, security, and cross-browser validation.
7. Bind SEO/discoverability to the final public host and complete owner-managed analytics and search setup.
8. Finalize operations/deployment documentation and recovery verification.
9. Complete the real multi-day Devnet soak and final release verification.'''
          if next_old not in text:
            raise SystemExit('missing status next-order anchor')
          text = text.replace(next_old, next_new, 1)

          blocker_old = '- Production behavior smoke remains pending for the post-M1 M5-5 path.'
          blocker_new = '- M5-5 API cross-audit evidence is passing, but real-data browser regression and representative browser production behavior smoke remain pending before M5-5 exit.'
          if blocker_old not in text:
            raise SystemExit('missing status blocker anchor')
          text = text.replace(blocker_old, blocker_new, 1)

          result_anchor = '## Active unit\n'
          result_section = '''## Latest M5-5 production cross-audit result

At 2026-07-08 00:52:38 UTC, the D1-gated production cross-audit passed with:

- collector healthy, cursor/head `3477191`, lag `0`, consecutive failures `0`;
- active snapshot `devnet-3432924-canonical` at ledger `3432924`, with Overview snapshot match;
- 25 current Vaults, 25 Loan Brokers, and 25 Loans sampled from bounded list reads;
- Loan to Loan Broker and Loan Broker to Vault live relationship checks consistent;
- one lifecycle-backed current Loan matched one bounded newest object-history row and indexed lifecycle evidence;
- Lifecycle explorer: 100 rows;
- archived Loan exact lookup available and same object excluded from current state with HTTP `404`;
- Activity: 100 rows, including 77 `tesSUCCESS` and 23 non-success protocol transactions, classified rather than rejected;
- Archived Objects: 25 rows;
- Cover & Loss: 100 rows;
- Activity JSON, NDJSON, CSV, and feed NDJSON outputs: 25 bounded rows each;
- D1 usage: 946,159 rows read and 3,414 rows written; headroom gate passed;
- audit result: passed;
- human screenshot review remains separately required.

'''
          if result_anchor not in text:
            raise SystemExit('missing status result insertion anchor')
          text = text.replace(result_anchor, result_section + result_anchor, 1)
          status.write_text(text)
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/development-roadmap.md docs/implementation-status.md
          git commit -m 'Record passing M5-5 API cross-audit evidence'
          git push origin HEAD:${{ github.head_ref }}
