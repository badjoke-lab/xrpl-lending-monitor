name: Diagnose first soak start gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-first-soak-start.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://xrpl-lending-monitor.badjoke-lab.workers.dev
      PRIMARY_RPC: https://devnet.honeycluster.io/
      FALLBACK_RPC: https://s.devnet.rippletest.net:51234/
      EXPECTED_EPOCH_ID: devnet-3371675
      EXPECTED_SNAPSHOT_ID: devnet-3592674-0373cda0b0cd
      EXPECTED_LEDGER_INDEX: '3592674'
      EXPECTED_LEDGER_HASH: 0373CDA0B0CD8486C0C55C5B5DD460501419367BD76D146E4A718EBD9DD8A893
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Capture one start-gate sample
        run: |
          mkdir -p diagnose-first-soak-start
          node - <<'NODE' > diagnose-first-soak-start/sample.json
          import('./scripts/run-first-24h-soak-segment.mjs')
            .then(async ({captureSample}) => console.log(JSON.stringify(await captureSample(), null, 2)))
            .catch((error) => { console.error(error); process.exit(1) })
          NODE
          jq '{passed,failedChecks,currentState,rpc,runtime,collector,readinessPassed:.readiness.passed}' diagnose-first-soak-start/sample.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnose-first-soak-start
          path: diagnose-first-soak-start
          if-no-files-found: error
          retention-days: 7
