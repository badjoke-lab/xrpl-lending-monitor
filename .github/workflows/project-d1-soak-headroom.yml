name: Project D1 soak headroom

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/project-d1-soak-headroom.yml'

permissions:
  contents: read

jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture current UTC-day D1 usage
        env:
          D1_HEADROOM_OUTPUT_DIR: d1-soak-headroom
          D1_HEADROOM_FRACTION: '1.0'
        run: bash scripts/check-d1-headroom.sh
      - name: Capture recent five-minute and heavy-cycle usage
        shell: bash
        run: |
          set -euo pipefail
          ROOT=d1-soak-headroom
          pnpm exec wrangler d1 execute xrpl-lending-monitor --remote \
            --command "SELECT run_at,status,persistence_rows_read,persistence_rows_written FROM fast_lane_shadow_run_metrics WHERE network='devnet' ORDER BY run_at DESC LIMIT 288;" \
            --json > "$ROOT/fast-raw.txt"
          sed -n '/^\[/,$p' "$ROOT/fast-raw.txt" > "$ROOT/fast.json"
          curl --fail-with-body --silent --show-error --retry 3 \
            https://xrpl-lending-monitor.badjoke-lab.workers.dev/api/status/collector \
            > "$ROOT/collector.json"
      - name: Project safety through reset and a full UTC day
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime, json, math, pathlib
          root=pathlib.Path('d1-soak-headroom')
          usage=json.loads((root/'d1-headroom-summary.json').read_text())
          fast_payload=json.loads((root/'fast.json').read_text())
          fast=(fast_payload[0].get('results',[]) if fast_payload else [])
          collector=json.loads((root/'collector.json').read_text())
          now=datetime.datetime.now(datetime.timezone.utc)
          reset=(now+datetime.timedelta(days=1)).replace(hour=0,minute=0,second=0,microsecond=0)
          seconds=max(0,(reset-now).total_seconds())
          ticks_to_reset=math.ceil(seconds/300)+2
          heavy_to_reset=math.ceil(seconds/14400)+1
          fast_reads=[int(row.get('persistence_rows_read') or 0) for row in fast]
          fast_writes=[int(row.get('persistence_rows_written') or 0) for row in fast]
          measured_fast_read=max(fast_reads or [0])
          measured_fast_write=max(fast_writes or [0])
          fast_read_budget=max(measured_fast_read,1000)
          fast_write_budget=max(measured_fast_write,100)
          heavy_usage=collector.get('usage') or {}
          measured_heavy_read=int(heavy_usage.get('persistence_rows_read') or 0)
          measured_heavy_write=int(heavy_usage.get('persistence_rows_written') or 0)
          heavy_read_budget=max(measured_heavy_read,10000)
          heavy_write_budget=max(measured_heavy_write,1000)
          audit_read_buffer=30000
          audit_write_buffer=1000
          pre_read=math.ceil((ticks_to_reset*fast_read_budget+heavy_to_reset*heavy_read_budget+audit_read_buffer)*1.25)
          pre_write=math.ceil((ticks_to_reset*fast_write_budget+heavy_to_reset*heavy_write_budget+audit_write_buffer)*1.25)
          day_read=math.ceil((288*fast_read_budget+7*heavy_read_budget+audit_read_buffer)*1.25)
          day_write=math.ceil((288*fast_write_budget+7*heavy_write_budget+audit_write_buffer)*1.25)
          remaining_read=int(usage['rows_read_daily_allowance'])-int(usage['rows_read'])
          remaining_write=int(usage['rows_written_daily_allowance'])-int(usage['rows_written'])
          checks={
            'current_usage_below_hard_allowance': remaining_read>0 and remaining_write>0,
            'remaining_until_reset_sufficient': remaining_read>=pre_read and remaining_write>=pre_write,
            'full_utc_day_below_80_percent': day_read<=int(usage['rows_read_daily_allowance'])*0.8 and day_write<=int(usage['rows_written_daily_allowance'])*0.8,
            'recent_metrics_present': len(fast)>=3,
          }
          out={
            'generatedAt':now.isoformat().replace('+00:00','Z'),
            'currentUsage':usage,
            'remaining':{'rowsRead':remaining_read,'rowsWritten':remaining_write,'secondsToUtcReset':seconds},
            'observed':{'fastRuns':len(fast),'maximumFastRowsRead':measured_fast_read,'maximumFastRowsWritten':measured_fast_write,'heavyRowsRead':measured_heavy_read,'heavyRowsWritten':measured_heavy_write},
            'conservativeBudgets':{'fastRowsReadPerTick':fast_read_budget,'fastRowsWrittenPerTick':fast_write_budget,'heavyRowsReadPerRun':heavy_read_budget,'heavyRowsWrittenPerRun':heavy_write_budget,'safetyMultiplier':1.25},
            'projection':{'ticksToReset':ticks_to_reset,'heavyRunsToReset':heavy_to_reset,'requiredBeforeReset':{'rowsRead':pre_read,'rowsWritten':pre_write},'fullUtcDay':{'rowsRead':day_read,'rowsWritten':day_write}},
            'checks':checks,
            'passed':all(checks.values()),
          }
          (root/'projection.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          raise SystemExit(0 if out['passed'] else 2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-soak-headroom-projection
          path: d1-soak-headroom
          if-no-files-found: error
          retention-days: 14
