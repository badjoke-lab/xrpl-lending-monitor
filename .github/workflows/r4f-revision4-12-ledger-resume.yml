name: R4F Revision4 12-Ledger Resume Qualification

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: r4f-revision4-12-ledger-qualification
  cancel-in-progress: false

env:
  QUALIFICATION_ISSUE: '1261'
  RUNTIME_PATH: 'supabase/migrations/20260809151000_xrpl_r5_revision4_runtime_rpcs.sql'
  EGRESS_PATH: 'supabase/migrations/20260810123000_xrpl_r5_revision4_per_ledger_egress_gate.sql'
  EVIDENCE_PATH: 'supabase/migrations/20260810133000_xrpl_r5_revision4_accounting_qualification_evidence.sql'
  PROOF_FUNCTION: 'xrpl-r4f-revision4-proof-batch'
  PROOF_FUNCTION_PATH: 'supabase/functions/xrpl-r4f-revision4-proof-batch/index.ts'
  EXECUTOR_PATH: 'supabase/functions/xrpl-r5-recovery-batch/index.ts'
  ACTIVE_FUNCTION: 'xrpl-r5-recovery-batch'
  QUALIFICATION_KEY: 'r4f-revision4-r5-12-ledger-accounting-v1'
  SELECTION_DIGEST: '99a1f97fc17ed6023bc3075bffe963a260e99a4ed0e2d831b068826c7797222f'
  PROFILE_DIGEST: '39e8b620a20bb08fbe8306fe753d4d445c5191bcafddbf67721e0c17d5b6bcd5'
  RECOVERY_RUN_ID: 'r5-recovery-selected-revision4-entry'
  MAX_LEDGER_COUNT: '12'
  MAX_PER_LEDGER_BYTES: '4581'
  MAX_TOTAL_BYTES: '54972'

jobs:
  prepare:
    if: >-
      github.event.issue.number == 1261 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      github.event.comment.body == '/r4f-revision4-12-ledger-resume-prepare'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Verify repository resume contract
        run: bash scripts/test-r4f-revision4-12-ledger-resume-contract.sh

      - name: Inspect exact collector scheduler and runtime source set read-only
        id: scheduler
        run: node scripts/prepare-r4f-g3-isolated-window.mjs

      - name: Verify exact prepared zero-progress qualification residue read-only
        id: residue
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r4f-revision4-12-ledger-resume-prepare-evidence
          history_query="select version::text as version from supabase_migrations.schema_migrations where version::text in ('20260809151000','20260810123000','20260810133000','20260811012000','20260811061000') order by version::text;"
          jq -n --arg query "$history_query" '{query:$query,parameters:[],read_only:true}' > /tmp/history-query.json
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'content-type: application/json' \
            --data @/tmp/history-query.json \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/database/query" \
            > r4f-revision4-12-ledger-resume-prepare-evidence/migration-history.json
          mapfile -t remote_versions < <(jq -r '.. | objects | .version? // empty | tostring' r4f-revision4-12-ledger-resume-prepare-evidence/migration-history.json | grep -E '^20[0-9]{12}$' | LC_ALL=C sort -u)
          test "${remote_versions[*]:-}" = '20260809151000 20260810123000 20260810133000 20260811012000 20260811061000'

          cat > /tmp/residue.sql <<'SQL'
          with target_run as (
            select r.* from xrpl_r5_v1.recovery_runs r
            where r.run_id='r5-recovery-selected-revision4-entry'
          ), target_checkpoint as (
            select c.* from xrpl_r5_v1.active_checkpoints c
            join target_run r on r.checkpoint_id=c.checkpoint_id
          )
          select jsonb_build_object(
            'checkpointRev4Exists',to_regprocedure('public.xrpl_create_r5_revision4_active_checkpoint(text,text,timestamp with time zone)') is not null,
            'prepareRev4Exists',to_regprocedure('public.xrpl_prepare_r5_revision4_active_recovery(text,text,text,bigint,text,timestamp with time zone)') is not null,
            'rebindRev4Exists',to_regprocedure('public.xrpl_rebind_r5_revision4_prebatch_recovery_to_active_boundary(text,timestamp with time zone)') is not null,
            'progressiveClaimRev4Exists',to_regprocedure('public.xrpl_claim_r5_revision4_recovery_batch_from_prepared_head(text,text,timestamp with time zone,integer)') is not null,
            'completionRev4Exists',to_regprocedure('public.xrpl_complete_r5_revision4_recovery_batch(text,text,text,timestamp with time zone,text,text,text,text,bigint,numeric,numeric,numeric)') is not null,
            'runRows',(select count(*) from target_run),
            'checkpointRows',(select count(*) from target_checkpoint),
            'allRevision4RunRows',(select count(*) from xrpl_r5_v1.recovery_runs where profile_revision=4),
            'allRevision4CheckpointRows',(select count(*) from xrpl_r5_v1.active_checkpoints where profile_revision=4),
            'batchRows',(select count(*) from xrpl_r5_v1.recovery_batches where run_id='r5-recovery-selected-revision4-entry'),
            'evidenceRows',(select count(*) from xrpl_r5_v1.revision4_accounting_qualification_evidence where qualification_key='r4f-revision4-r5-12-ledger-accounting-v1'),
            'egressPolicyRows',(select count(*) from xrpl_r5_v1.revision4_egress_budget_policy where policy_id='r5-revision4-egress-4581-v1' and profile_revision=4 and maximum_ledgers_per_claim=12 and maximum_billable_egress_bytes_per_ledger=4581 and maximum_claim_billable_egress_bytes=54972 and maximum_claim_exclusive_reservation_bytes=54973 and public_reader_unchanged=true and mainnet_disabled=true and stabilization_authorized=false and soak_authorized=false),
            'runStatus',(select status from target_run),
            'runProfileRevision',(select profile_revision from target_run),
            'runProfileIdentityDigest',(select profile_identity_digest from target_run),
            'runSelectionDigest',(select selection_digest from target_run),
            'runCheckpointId',(select checkpoint_id from target_run),
            'runCompletedBatches',(select completed_batches from target_run),
            'runCommittedLedgers',(select committed_ledgers from target_run),
            'runLastAccountingDigest',(select last_accounting_digest from target_run),
            'runLastError',(select last_error from target_run),
            'runStartedAt',(select started_at from target_run),
            'runCompletedAt',(select completed_at from target_run),
            'runInitialValidatedHeadLedgerIndex',(select initial_validated_head_ledger_index from target_run),
            'runInitialValidatedHeadLedgerHash',(select initial_validated_head_ledger_hash from target_run),
            'runRowDigest',(select public.xrpl_transfer_json_digest(to_jsonb(r)) from target_run r),
            'checkpointProfileRevision',(select profile_revision from target_checkpoint),
            'checkpointProfileIdentityDigest',(select profile_identity_digest from target_checkpoint),
            'checkpointSelectionDigest',(select selection_digest from target_checkpoint),
            'checkpointStateDigest',(select state_digest from target_checkpoint),
            'checkpointStateDigestValid',(select public.xrpl_transfer_json_digest(state)=state_digest from target_checkpoint),
            'checkpointPurpose',(select state->>'purpose' from target_checkpoint),
            'qualificationBoundaryOnly',(select coalesce((state#>>'{checks,qualificationBoundaryOnly}')::boolean,false) from target_checkpoint),
            'fullRecoveryStateCaptured',(select coalesce((state#>>'{checks,fullRecoveryStateCaptured}')::boolean,true) from target_checkpoint),
            'publicReaderUnchanged',(select coalesce((state#>>'{checks,publicReaderUnchanged}')::boolean,false) from target_checkpoint),
            'mainnetDisabled',(select coalesce((state#>>'{checks,mainnetDisabled}')::boolean,false) from target_checkpoint),
            'checkpointRowDigest',(select public.xrpl_transfer_json_digest(to_jsonb(c)) from target_checkpoint c)
          ) as state;
          SQL
          residue_query="$(cat /tmp/residue.sql)"
          jq -n --arg query "$residue_query" '{query:$query,parameters:[],read_only:true}' > /tmp/residue-query.json
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'content-type: application/json' \
            --data @/tmp/residue-query.json \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/database/query" \
            > r4f-revision4-12-ledger-resume-prepare-evidence/prepared-residue.json
          state="$(jq -c '.. | objects | .state? // empty' r4f-revision4-12-ledger-resume-prepare-evidence/prepared-residue.json | head -n1)"
          test -n "$state"
          jq -e --arg profile "$PROFILE_DIGEST" --arg selection "$SELECTION_DIGEST" '
            .checkpointRev4Exists == true and .prepareRev4Exists == true and
            .rebindRev4Exists == true and .progressiveClaimRev4Exists == true and
            .completionRev4Exists == true and
            .runRows == 1 and .checkpointRows == 1 and
            .allRevision4RunRows == 1 and .allRevision4CheckpointRows == 1 and
            .batchRows == 0 and .evidenceRows == 0 and .egressPolicyRows == 1 and
            .runStatus == "prepared" and .runProfileRevision == 4 and
            .runProfileIdentityDigest == $profile and .runSelectionDigest == $selection and
            .runCompletedBatches == 0 and .runCommittedLedgers == 0 and
            .runLastAccountingDigest == null and .runLastError == null and
            .runStartedAt == null and .runCompletedAt == null and
            (.runInitialValidatedHeadLedgerIndex | type) == "number" and
            (.runInitialValidatedHeadLedgerHash | test("^[A-F0-9]{64}$")) and
            .checkpointProfileRevision == 4 and
            .checkpointProfileIdentityDigest == $profile and .checkpointSelectionDigest == $selection and
            .checkpointStateDigestValid == true and
            .checkpointPurpose == "r5-revision4-qualification-boundary-checkpoint" and
            .qualificationBoundaryOnly == true and .fullRecoveryStateCaptured == false and
            .publicReaderUnchanged == true and .mainnetDisabled == true and
            (.runRowDigest | test("^[a-f0-9]{64}$")) and
            (.checkpointRowDigest | test("^[a-f0-9]{64}$")) and
            (.checkpointStateDigest | test("^[a-f0-9]{64}$")) and
            (.runCheckpointId | test("^r5-checkpoint-revision4-proof-[0-9]+$"))
          ' <<<"$state" > /dev/null
          printf 'run_row_digest=%s\ncheckpoint_row_digest=%s\ncheckpoint_id=%s\ncheckpoint_state_digest=%s\ninitial_head_index=%s\ninitial_head_hash=%s\n' \
            "$(jq -r '.runRowDigest' <<<"$state")" \
            "$(jq -r '.checkpointRowDigest' <<<"$state")" \
            "$(jq -r '.runCheckpointId' <<<"$state")" \
            "$(jq -r '.checkpointStateDigest' <<<"$state")" \
            "$(jq -r '.runInitialValidatedHeadLedgerIndex' <<<"$state")" \
            "$(jq -r '.runInitialValidatedHeadLedgerHash' <<<"$state")" >> "$GITHUB_OUTPUT"

      - name: Bind exact source and prepared residue into expiring proposal
        id: proposal
        env:
          SOURCE_COMMIT: ${{ steps.scheduler.outputs.source_commit }}
          PROJECT_DIGEST: ${{ steps.scheduler.outputs.project_digest }}
          JOB_ID: ${{ steps.scheduler.outputs.job_id }}
          COMMAND_DIGEST: ${{ steps.scheduler.outputs.command_digest }}
          PREPARE_SOURCE_SHA: ${{ steps.scheduler.outputs.r5_prepare_source_sha256 }}
          RUN_ROW_DIGEST: ${{ steps.residue.outputs.run_row_digest }}
          CHECKPOINT_ROW_DIGEST: ${{ steps.residue.outputs.checkpoint_row_digest }}
          CHECKPOINT_ID: ${{ steps.residue.outputs.checkpoint_id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$SOURCE_COMMIT" = "$(git rev-parse HEAD)"
          test "$(git hash-object "$RUNTIME_PATH")" = '350238cec920446faa036cbf225b35683bcd4b54'
          test "$(git hash-object "$EGRESS_PATH")" = '96d8d478174866355ee798500e3eff83634a442d'
          test "$(git hash-object "$EVIDENCE_PATH")" = '2a986ba2872aead52119563fc43d8d49c1211949'
          [[ "$PREPARE_SOURCE_SHA" =~ ^[a-f0-9]{64}$ ]]
          [[ "$RUN_ROW_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          [[ "$CHECKPOINT_ROW_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          [[ "$CHECKPOINT_ID" =~ ^r5-checkpoint-revision4-proof-[0-9]+$ ]]
          runtime_sha="$(sha256sum "$RUNTIME_PATH" | awk '{print $1}')"
          egress_sha="$(sha256sum "$EGRESS_PATH" | awk '{print $1}')"
          evidence_sha="$(sha256sum "$EVIDENCE_PATH" | awk '{print $1}')"
          function_sha="$(sha256sum "$PROOF_FUNCTION_PATH" | awk '{print $1}')"
          executor_sha="$(sha256sum "$EXECUTOR_PATH" | awk '{print $1}')"
          expires="$(date -u -d '+2 hours' '+%Y-%m-%dT%H:%M:%SZ')"
          nonce="$(openssl rand -hex 8)"
          auth_command="/r4f-revision4-12-ledger-resume-authorize commit=${SOURCE_COMMIT} runtime=${runtime_sha} egress=${egress_sha} evidence=${evidence_sha} function=${function_sha} executor=${executor_sha} prepare_source=${PREPARE_SOURCE_SHA} project=${PROJECT_DIGEST} job=${JOB_ID} command=${COMMAND_DIGEST} resume_state=prepared_zero_progress runrow=${RUN_ROW_DIGEST} checkpointrow=${CHECKPOINT_ROW_DIGEST} checkpoint_id=${CHECKPOINT_ID} prepare_run=${GITHUB_RUN_ID} expires=${expires} nonce=${nonce}"
          printf 'runtime_sha=%s\negress_sha=%s\nevidence_sha=%s\nfunction_sha=%s\nexecutor_sha=%s\nprepare_source_sha=%s\nexpires=%s\nauth_command=%s\n' \
            "$runtime_sha" "$egress_sha" "$evidence_sha" "$function_sha" "$executor_sha" "$PREPARE_SOURCE_SHA" "$expires" "$auth_command" >> "$GITHUB_OUTPUT"

      - name: Upload sanitized resume preparation evidence
        uses: actions/upload-artifact@v4
        with:
          name: r4f-revision4-12-ledger-resume-prepare-evidence
          path: |
            r4f-revision4-12-ledger-resume-prepare-evidence
            r4f-g3-isolated-window-prepare-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Publish exact fresh resume authorization proposal
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_COMMIT: ${{ steps.scheduler.outputs.source_commit }}
          PROJECT_DIGEST: ${{ steps.scheduler.outputs.project_digest }}
          JOB_ID: ${{ steps.scheduler.outputs.job_id }}
          COMMAND_DIGEST: ${{ steps.scheduler.outputs.command_digest }}
          PREPARE_SOURCE_SHA: ${{ steps.proposal.outputs.prepare_source_sha }}
          RUNTIME_SHA: ${{ steps.proposal.outputs.runtime_sha }}
          EGRESS_SHA: ${{ steps.proposal.outputs.egress_sha }}
          EVIDENCE_SHA: ${{ steps.proposal.outputs.evidence_sha }}
          FUNCTION_SHA: ${{ steps.proposal.outputs.function_sha }}
          EXECUTOR_SHA: ${{ steps.proposal.outputs.executor_sha }}
          RUN_ROW_DIGEST: ${{ steps.residue.outputs.run_row_digest }}
          CHECKPOINT_ROW_DIGEST: ${{ steps.residue.outputs.checkpoint_row_digest }}
          CHECKPOINT_ID: ${{ steps.residue.outputs.checkpoint_id }}
          CHECKPOINT_STATE_DIGEST: ${{ steps.residue.outputs.checkpoint_state_digest }}
          INITIAL_HEAD_INDEX: ${{ steps.residue.outputs.initial_head_index }}
          INITIAL_HEAD_HASH: ${{ steps.residue.outputs.initial_head_hash }}
          EXPIRES: ${{ steps.proposal.outputs.expires }}
          AUTH_COMMAND: ${{ steps.proposal.outputs.auth_command }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/resume-proposal.md <<EOF
          ## R4F revision-4 exact 12-ledger prepared-run resume authorization proposal

          Preparation run: \`${GITHUB_RUN_ID}\`
          Run: ${RUN_URL}
          Source main commit: \`${SOURCE_COMMIT}\`
          Project identity digest: \`${PROJECT_DIGEST}\`
          Collector cron job id: \`${JOB_ID}\`
          Collector command digest: \`${COMMAND_DIGEST}\`
          Revision-3 runtime source-set SHA-256: \`${PREPARE_SOURCE_SHA}\`
          Runtime migration SHA-256: \`${RUNTIME_SHA}\`
          Per-ledger egress gate SHA-256: \`${EGRESS_SHA}\`
          Accounting-evidence migration SHA-256: \`${EVIDENCE_SHA}\`
          Temporary proof wrapper SHA-256: \`${FUNCTION_SHA}\`
          Imported executor source SHA-256: \`${EXECUTOR_SHA}\`
          Resume state: \`prepared_zero_progress\`
          Recovery run: \`${RECOVERY_RUN_ID}\`
          Bound run-row digest: \`${RUN_ROW_DIGEST}\`
          Existing qualification checkpoint: \`${CHECKPOINT_ID}\`
          Bound checkpoint-row digest: \`${CHECKPOINT_ROW_DIGEST}\`
          Checkpoint state digest: \`${CHECKPOINT_STATE_DIGEST}\`
          Retained validated head: \`${INITIAL_HEAD_INDEX} / ${INITIAL_HEAD_HASH}\`
          Authorization expires: \`${EXPIRES}\`

          Exact bounded mutation authorized by the command below:

          1. revalidate the already-applied revision-4 migrations and the exact single prepared/zero-progress qualification run and checkpoint; do not create, delete, replace, or rewrite either row before the proof call;
          2. deploy only temporary \`${PROOF_FUNCTION}\` from the bound source; the active \`${ACTIVE_FUNCTION}\` deployment is not replaced or deleted;
          3. install the proven watchdog, pause only the exact Devnet collector cron, and preserve the existing quiet-boundary control;
          4. revalidate the same bound prepared residue after pause, then invoke the temporary proof function exactly once for \`${RECOVERY_RUN_ID}\`; the progressive claim must rebind the prepared run to the current active boundary before reservation and may claim at most \`${MAX_LEDGER_COUNT}\` ledgers;
          5. require exactly \`${MAX_LEDGER_COUNT}\` committed Devnet ledgers and directional accounting \`<= ${MAX_TOTAL_BYTES} B\` total / \`<= ${MAX_PER_LEDGER_BYTES} B/ledger\`;
          6. restore the exact collector command and remove the watchdog even on failure, then delete the temporary proof function;
          7. retain and independently capture the bounded qualification evidence.

          This does **not** authorize deleting/recreating the prepared run or checkpoint, migration mutation, revision-4 selection/promotion, replacement of the active R5 function, Mainnet, public-reader mutation, another G3/provider-dashboard attempt, stabilization, or soak.

          Exact authorization command:

          \`${AUTH_COMMAND}\`

          Preparation itself is read-only and does not pause the collector, deploy a function, or mutate database state.
          EOF
          gh issue comment "$QUALIFICATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/resume-proposal.md

  execute:
    if: >-
      github.event.issue.number == 1261 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      startsWith(github.event.comment.body, '/r4f-revision4-12-ledger-resume-authorize ')
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      GH_TOKEN: ${{ github.token }}
      AUTHORIZATION_BODY: ${{ github.event.comment.body }}
      AUTHORIZATION_CREATED_AT: ${{ github.event.comment.created_at }}
      AUTHORIZATION_COMMENT_ID: ${{ github.event.comment.id }}
    steps:
      - name: Check out exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Verify repository resume contract
        run: bash scripts/test-r4f-revision4-12-ledger-resume-contract.sh

      - name: Parse exact owner resume authorization and source bindings
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          regex='^/r4f-revision4-12-ledger-resume-authorize commit=([a-f0-9]{40}) runtime=([a-f0-9]{64}) egress=([a-f0-9]{64}) evidence=([a-f0-9]{64}) function=([a-f0-9]{64}) executor=([a-f0-9]{64}) prepare_source=([a-f0-9]{64}) project=([a-f0-9]{64}) job=([0-9]+) command=([a-f0-9]{64}) resume_state=prepared_zero_progress runrow=([a-f0-9]{64}) checkpointrow=([a-f0-9]{64}) checkpoint_id=(r5-checkpoint-revision4-proof-[0-9]+) prepare_run=([0-9]+) expires=([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z) nonce=([a-f0-9]{16})$'
          [[ "$AUTHORIZATION_BODY" =~ $regex ]] || { echo 'resume authorization command shape mismatch' >&2; exit 1; }
          commit="${BASH_REMATCH[1]}"
          runtime_sha="${BASH_REMATCH[2]}"
          egress_sha="${BASH_REMATCH[3]}"
          evidence_sha="${BASH_REMATCH[4]}"
          function_sha="${BASH_REMATCH[5]}"
          executor_sha="${BASH_REMATCH[6]}"
          prepare_source_sha="${BASH_REMATCH[7]}"
          project_digest="${BASH_REMATCH[8]}"
          job_id="${BASH_REMATCH[9]}"
          command_digest="${BASH_REMATCH[10]}"
          run_row_digest="${BASH_REMATCH[11]}"
          checkpoint_row_digest="${BASH_REMATCH[12]}"
          checkpoint_id="${BASH_REMATCH[13]}"
          prepare_run="${BASH_REMATCH[14]}"
          expires="${BASH_REMATCH[15]}"
          nonce="${BASH_REMATCH[16]}"
          test "$commit" = "$(git rev-parse HEAD)"
          test "$runtime_sha" = "$(sha256sum "$RUNTIME_PATH" | awk '{print $1}')"
          test "$egress_sha" = "$(sha256sum "$EGRESS_PATH" | awk '{print $1}')"
          test "$evidence_sha" = "$(sha256sum "$EVIDENCE_PATH" | awk '{print $1}')"
          test "$function_sha" = "$(sha256sum "$PROOF_FUNCTION_PATH" | awk '{print $1}')"
          test "$executor_sha" = "$(sha256sum "$EXECUTOR_PATH" | awk '{print $1}')"
          [[ "$prepare_source_sha" =~ ^[a-f0-9]{64}$ ]]
          [[ "$SUPABASE_PROJECT_ID" =~ ^[a-z]{20}$ ]]
          actual_project_digest="$(printf '%s' "$SUPABASE_PROJECT_ID" | sha256sum | awk '{print $1}')"
          test "$project_digest" = "$actual_project_digest"
          test "$job_id" -gt 0
          test "$prepare_run" -gt 0
          expires_epoch="$(date -u -d "$expires" +%s)"
          auth_epoch="$(date -u -d "$AUTHORIZATION_CREATED_AT" +%s)"
          now_epoch="$(date -u +%s)"
          test "$auth_epoch" -lt "$expires_epoch"
          test "$now_epoch" -le "$expires_epoch"
          test $((expires_epoch - auth_epoch)) -le 7200
          printf 'commit=%s\nruntime_sha=%s\negress_sha=%s\nevidence_sha=%s\nfunction_sha=%s\nexecutor_sha=%s\nprepare_source_sha=%s\nproject_digest=%s\njob_id=%s\ncommand_digest=%s\nrun_row_digest=%s\ncheckpoint_row_digest=%s\ncheckpoint_id=%s\nprepare_run=%s\nexpires=%s\nnonce=%s\n' \
            "$commit" "$runtime_sha" "$egress_sha" "$evidence_sha" "$function_sha" "$executor_sha" "$prepare_source_sha" "$project_digest" "$job_id" "$command_digest" "$run_row_digest" "$checkpoint_row_digest" "$checkpoint_id" "$prepare_run" "$expires" "$nonce" >> "$GITHUB_OUTPUT"

      - name: Verify successful fresh resume preparation and unique prior proposal
        env:
          COMMIT: ${{ steps.auth.outputs.commit }}
          PREPARE_RUN: ${{ steps.auth.outputs.prepare_run }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREPARE_RUN}" > /tmp/prepare-run.json
          jq -e --arg commit "$COMMIT" '.event == "issue_comment" and .conclusion == "success" and .head_sha == $commit and .actor.login == "badjoke-lab"' /tmp/prepare-run.json > /dev/null
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${QUALIFICATION_ISSUE}/comments?per_page=100" | jq -s 'add' > /tmp/comments.json
          EXPECTED_COMMAND="$AUTHORIZATION_BODY" PREPARE_RUN="$PREPARE_RUN" AUTH_CREATED_AT="$AUTHORIZATION_CREATED_AT" node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const comments = JSON.parse(readFileSync('/tmp/comments.json', 'utf8'))
          const expected = process.env.EXPECTED_COMMAND
          const prepareRun = process.env.PREPARE_RUN
          const authorizationAt = Date.parse(process.env.AUTH_CREATED_AT ?? '')
          const proposals = comments.filter((comment) =>
            comment?.user?.login === 'github-actions[bot]'
            && typeof comment?.body === 'string'
            && comment.body.includes(`Preparation run: \`${prepareRun}\``)
            && comment.body.includes(`\`${expected}\``),
          )
          if (proposals.length !== 1) throw new Error(`expected one exact prior resume proposal, found ${proposals.length}`)
          const proposalAt = Date.parse(proposals[0].created_at ?? '')
          if (!Number.isFinite(proposalAt) || !Number.isFinite(authorizationAt) || !(proposalAt < authorizationAt)) {
            throw new Error('resume authorization proposal must precede owner authorization')
          }
          const exactOwnerCommands = comments.filter((comment) => comment?.user?.login === 'badjoke-lab' && comment?.body === expected)
          if (exactOwnerCommands.length !== 1) throw new Error(`resume authorization command must be unique, found ${exactOwnerCommands.length}`)
          NODE

      - name: Reverify exact collector scheduler and runtime source set read-only
        id: scheduler
        run: node scripts/prepare-r4f-g3-isolated-window.mjs

      - name: Verify scheduler and source tuple did not drift
        env:
          EXPECTED_PROJECT: ${{ steps.auth.outputs.project_digest }}
          EXPECTED_JOB: ${{ steps.auth.outputs.job_id }}
          EXPECTED_COMMAND: ${{ steps.auth.outputs.command_digest }}
          EXPECTED_PREPARE_SOURCE: ${{ steps.auth.outputs.prepare_source_sha }}
          ACTUAL_PROJECT: ${{ steps.scheduler.outputs.project_digest }}
          ACTUAL_JOB: ${{ steps.scheduler.outputs.job_id }}
          ACTUAL_COMMAND: ${{ steps.scheduler.outputs.command_digest }}
          ACTUAL_PREPARE_SOURCE: ${{ steps.scheduler.outputs.r5_prepare_source_sha256 }}
          SCHEDULER_SOURCE_COMMIT: ${{ steps.scheduler.outputs.source_commit }}
          AUTH_SOURCE_COMMIT: ${{ steps.auth.outputs.commit }}
        run: |
          set -euo pipefail
          test "$ACTUAL_PROJECT" = "$EXPECTED_PROJECT"
          test "$ACTUAL_JOB" = "$EXPECTED_JOB"
          test "$ACTUAL_COMMAND" = "$EXPECTED_COMMAND"
          test "$ACTUAL_PREPARE_SOURCE" = "$EXPECTED_PREPARE_SOURCE"
          test "$SCHEDULER_SOURCE_COMMIT" = "$AUTH_SOURCE_COMMIT"

      - name: Reverify exact prepared zero-progress residue read-only
        id: residue_before
        env:
          EXPECTED_RUN_ROW_DIGEST: ${{ steps.auth.outputs.run_row_digest }}
          EXPECTED_CHECKPOINT_ROW_DIGEST: ${{ steps.auth.outputs.checkpoint_row_digest }}
          EXPECTED_CHECKPOINT_ID: ${{ steps.auth.outputs.checkpoint_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r4f-revision4-12-ledger-resume-evidence
          cat > /tmp/residue.sql <<'SQL'
          with target_run as (
            select r.* from xrpl_r5_v1.recovery_runs r where r.run_id='r5-recovery-selected-revision4-entry'
          ), target_checkpoint as (
            select c.* from xrpl_r5_v1.active_checkpoints c join target_run r on r.checkpoint_id=c.checkpoint_id
          )
          select jsonb_build_object(
            'runRows',(select count(*) from target_run),
            'checkpointRows',(select count(*) from target_checkpoint),
            'allRevision4RunRows',(select count(*) from xrpl_r5_v1.recovery_runs where profile_revision=4),
            'allRevision4CheckpointRows',(select count(*) from xrpl_r5_v1.active_checkpoints where profile_revision=4),
            'batchRows',(select count(*) from xrpl_r5_v1.recovery_batches where run_id='r5-recovery-selected-revision4-entry'),
            'evidenceRows',(select count(*) from xrpl_r5_v1.revision4_accounting_qualification_evidence where qualification_key='r4f-revision4-r5-12-ledger-accounting-v1'),
            'runStatus',(select status from target_run),
            'runProfileRevision',(select profile_revision from target_run),
            'runProfileIdentityDigest',(select profile_identity_digest from target_run),
            'runSelectionDigest',(select selection_digest from target_run),
            'runCheckpointId',(select checkpoint_id from target_run),
            'runCompletedBatches',(select completed_batches from target_run),
            'runCommittedLedgers',(select committed_ledgers from target_run),
            'runLastAccountingDigest',(select last_accounting_digest from target_run),
            'runLastError',(select last_error from target_run),
            'runStartedAt',(select started_at from target_run),
            'runCompletedAt',(select completed_at from target_run),
            'runRowDigest',(select public.xrpl_transfer_json_digest(to_jsonb(r)) from target_run r),
            'checkpointStateDigestValid',(select public.xrpl_transfer_json_digest(state)=state_digest from target_checkpoint),
            'checkpointPurpose',(select state->>'purpose' from target_checkpoint),
            'qualificationBoundaryOnly',(select coalesce((state#>>'{checks,qualificationBoundaryOnly}')::boolean,false) from target_checkpoint),
            'fullRecoveryStateCaptured',(select coalesce((state#>>'{checks,fullRecoveryStateCaptured}')::boolean,true) from target_checkpoint),
            'publicReaderUnchanged',(select coalesce((state#>>'{checks,publicReaderUnchanged}')::boolean,false) from target_checkpoint),
            'mainnetDisabled',(select coalesce((state#>>'{checks,mainnetDisabled}')::boolean,false) from target_checkpoint),
            'checkpointRowDigest',(select public.xrpl_transfer_json_digest(to_jsonb(c)) from target_checkpoint c)
          ) as state;
          SQL
          query="$(cat /tmp/residue.sql)"
          jq -n --arg query "$query" '{query:$query,parameters:[],read_only:true}' > /tmp/residue-query.json
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'content-type: application/json' \
            --data @/tmp/residue-query.json \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/database/query" > r4f-revision4-12-ledger-resume-evidence/prepared-residue-before.json
          state="$(jq -c '.. | objects | .state? // empty' r4f-revision4-12-ledger-resume-evidence/prepared-residue-before.json | head -n1)"
          test -n "$state"
          jq -e --arg profile "$PROFILE_DIGEST" --arg selection "$SELECTION_DIGEST" --arg checkpoint "$EXPECTED_CHECKPOINT_ID" '
            .runRows == 1 and .checkpointRows == 1 and .allRevision4RunRows == 1 and .allRevision4CheckpointRows == 1 and
            .batchRows == 0 and .evidenceRows == 0 and .runStatus == "prepared" and
            .runProfileRevision == 4 and .runProfileIdentityDigest == $profile and .runSelectionDigest == $selection and
            .runCheckpointId == $checkpoint and .runCompletedBatches == 0 and .runCommittedLedgers == 0 and
            .runLastAccountingDigest == null and .runLastError == null and .runStartedAt == null and .runCompletedAt == null and
            .checkpointStateDigestValid == true and .checkpointPurpose == "r5-revision4-qualification-boundary-checkpoint" and
            .qualificationBoundaryOnly == true and .fullRecoveryStateCaptured == false and
            .publicReaderUnchanged == true and .mainnetDisabled == true
          ' <<<"$state" > /dev/null
          test "$(jq -r '.runRowDigest' <<<"$state")" = "$EXPECTED_RUN_ROW_DIGEST"
          test "$(jq -r '.checkpointRowDigest' <<<"$state")" = "$EXPECTED_CHECKPOINT_ROW_DIGEST"

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: latest

      - name: Set up pinned Bun for proof prebundle
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Resolve exactly one elevated database API key
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/api-keys?reveal=true" > /tmp/project-api-keys.json
          legacy_count="$(jq '[.[] | select(.type == "legacy" and (.name == "service_role" or ((.secret_jwt_template.role // "") == "service_role")))] | length' /tmp/project-api-keys.json)"
          secret_count="$(jq '[.[] | select(.type == "secret")] | length' /tmp/project-api-keys.json)"
          if [ "$legacy_count" -eq 1 ]; then
            elevated_key="$(jq -r '[.[] | select(.type == "legacy" and (.name == "service_role" or ((.secret_jwt_template.role // "") == "service_role")))][0].api_key // empty' /tmp/project-api-keys.json)"
            elevated_kind=legacy
          elif [ "$legacy_count" -eq 0 ] && [ "$secret_count" -eq 1 ]; then
            elevated_key="$(jq -r '[.[] | select(.type == "secret")][0].api_key // empty' /tmp/project-api-keys.json)"
            elevated_kind=secret
          else
            echo 'Unable to select exactly one elevated Supabase API key.' >&2
            jq '[.[] | {id, type, name, prefix, hasApiKey: ((.api_key // "") | length > 0)}]' /tmp/project-api-keys.json >&2
            exit 1
          fi
          test -n "$elevated_key"
          echo "::add-mask::${elevated_key}"
          printf 'SUPABASE_R4F_PROOF_KEY=%s\nSUPABASE_R4F_PROOF_KEY_KIND=%s\n' "$elevated_key" "$elevated_kind" >> "$GITHUB_ENV"
          rm -f /tmp/project-api-keys.json

      - name: Bundle and deploy only isolated temporary revision-4 proof function
        id: deploy
        env:
          SOURCE_COMMIT: ${{ steps.auth.outputs.commit }}
          AUTHORIZED_FUNCTION_SHA: ${{ steps.auth.outputs.function_sha }}
          AUTHORIZED_EXECUTOR_SHA: ${{ steps.auth.outputs.executor_sha }}
        run: |
          set -euo pipefail
          test "$PROOF_FUNCTION" != "$ACTIVE_FUNCTION"
          test "$AUTHORIZED_EXECUTOR_SHA" = "$(sha256sum "$EXECUTOR_PATH" | awk '{print $1}')"
          mkdir -p r4f-revision4-12-ledger-resume-evidence
          bundle_path="/tmp/${PROOF_FUNCTION}-index.ts"
          bundle_evidence='r4f-revision4-12-ledger-resume-evidence/proof-function-bundle.json'
          bun_version="$(bun --version)"
          test "$bun_version" = '1.3.14'
          bun build "$PROOF_FUNCTION_PATH" --target=browser --format=esm --outfile="$bundle_path"
          test -s "$bundle_path"
          SOURCE_PATH="$PROOF_FUNCTION_PATH" BUNDLE_PATH="$bundle_path" EVIDENCE_PATH="$bundle_evidence" SOURCE_COMMIT="$SOURCE_COMMIT" AUTHORIZED_FUNCTION_SHA="$AUTHORIZED_FUNCTION_SHA" BUN_VERSION="$bun_version" node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto'
          import { readFileSync, writeFileSync } from 'node:fs'
          const sourcePath = process.env.SOURCE_PATH
          const bundlePath = process.env.BUNDLE_PATH
          const evidencePath = process.env.EVIDENCE_PATH
          const sourceCommit = process.env.SOURCE_COMMIT
          const authorizedFunctionSha = process.env.AUTHORIZED_FUNCTION_SHA
          const bunVersion = process.env.BUN_VERSION
          const source = readFileSync(sourcePath, 'utf8')
          const bundle = readFileSync(bundlePath, 'utf8')
          const sourceSha256 = createHash('sha256').update(source).digest('hex')
          if (sourceSha256 !== authorizedFunctionSha) throw new Error('proof wrapper source drifted before bundling')
          if (/(?:from\s*|import\s*\()\s*['"]\.{1,2}\//u.test(bundle)) throw new Error('generated proof bundle retains a relative import')
          if (bundle.includes('cloudflare:')) throw new Error('generated proof bundle contains a Cloudflare runtime import')
          if (!bundle.includes('Deno.serve')) throw new Error('generated proof bundle does not contain the Edge entrypoint')
          if (bundle.includes('Deno.env.set') || bundle.includes('Deno.env.delete') || bundle.includes('setEnv(')) {
            throw new Error('generated proof bundle contains unsupported Edge environment mutation')
          }
          if (!bundle.includes('__XRPL_R5_REVISION4_PROOF_RUNTIME_CONFIG__')) {
            throw new Error('generated proof bundle lost the qualification-only runtime override')
          }
          const evidence = {
            schemaVersion: 1,
            source: sourcePath,
            sourceCommit,
            sourceSha256,
            bunVersion,
            bytes: Buffer.byteLength(bundle),
            sha256: createHash('sha256').update(bundle).digest('hex'),
            relativeImports: 0,
            cloudflareImports: 0,
            unsupportedEnvironmentMutation: 0,
            qualificationRuntimeOverride: true,
            denoServeEntrypoint: true,
          }
          writeFileSync(evidencePath, `${JSON.stringify(evidence, null, 2)}\n`)
          NODE
          cp "$bundle_path" "$PROOF_FUNCTION_PATH"
          restore_proof_source() { git checkout -- "$PROOF_FUNCTION_PATH"; }
          trap restore_proof_source EXIT
          mapfile -t changed_paths < <(git diff --name-only)
          test "${#changed_paths[@]}" -eq 1
          test "${changed_paths[0]}" = "$PROOF_FUNCTION_PATH"
          supabase functions deploy "$PROOF_FUNCTION" --project-ref "$SUPABASE_PROJECT_ID" --use-api --no-verify-jwt
          restore_proof_source
          trap - EXIT
          test "$AUTHORIZED_FUNCTION_SHA" = "$(sha256sum "$PROOF_FUNCTION_PATH" | awk '{print $1}')"

      - name: Pause exact collector with automatic restore watchdog
        id: pause
        env:
          PROJECT_DIGEST: ${{ steps.auth.outputs.project_digest }}
          JOB_ID: ${{ steps.auth.outputs.job_id }}
          COMMAND_DIGEST: ${{ steps.auth.outputs.command_digest }}
        run: |
          set -euo pipefail
          node scripts/manage-r4f-g3-isolated-window.mjs \
            --mode pause \
            --expected-job-id "$JOB_ID" \
            --expected-command-digest "$COMMAND_DIGEST" \
            --expected-project-digest "$PROJECT_DIGEST" \
            --output-directory r4f-revision4-12-ledger-resume-evidence/isolation

      - name: Reverify bound prepared residue after pause read-only
        env:
          EXPECTED_RUN_ROW_DIGEST: ${{ steps.auth.outputs.run_row_digest }}
          EXPECTED_CHECKPOINT_ROW_DIGEST: ${{ steps.auth.outputs.checkpoint_row_digest }}
          EXPECTED_CHECKPOINT_ID: ${{ steps.auth.outputs.checkpoint_id }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/residue-after-pause.sql <<'SQL'
          with target_run as (
            select r.* from xrpl_r5_v1.recovery_runs r where r.run_id='r5-recovery-selected-revision4-entry'
          ), target_checkpoint as (
            select c.* from xrpl_r5_v1.active_checkpoints c join target_run r on r.checkpoint_id=c.checkpoint_id
          )
          select jsonb_build_object(
            'runRows',(select count(*) from target_run),
            'checkpointRows',(select count(*) from target_checkpoint),
            'batchRows',(select count(*) from xrpl_r5_v1.recovery_batches where run_id='r5-recovery-selected-revision4-entry'),
            'evidenceRows',(select count(*) from xrpl_r5_v1.revision4_accounting_qualification_evidence where qualification_key='r4f-revision4-r5-12-ledger-accounting-v1'),
            'runStatus',(select status from target_run),
            'runCompletedBatches',(select completed_batches from target_run),
            'runCommittedLedgers',(select committed_ledgers from target_run),
            'runLastAccountingDigest',(select last_accounting_digest from target_run),
            'runLastError',(select last_error from target_run),
            'runStartedAt',(select started_at from target_run),
            'runCompletedAt',(select completed_at from target_run),
            'runCheckpointId',(select checkpoint_id from target_run),
            'runRowDigest',(select public.xrpl_transfer_json_digest(to_jsonb(r)) from target_run r),
            'checkpointRowDigest',(select public.xrpl_transfer_json_digest(to_jsonb(c)) from target_checkpoint c)
          ) as state;
          SQL
          query="$(cat /tmp/residue-after-pause.sql)"
          jq -n --arg query "$query" '{query:$query,parameters:[],read_only:true}' > /tmp/residue-after-pause-query.json
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'content-type: application/json' \
            --data @/tmp/residue-after-pause-query.json \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/database/query" > r4f-revision4-12-ledger-resume-evidence/prepared-residue-after-pause.json
          state="$(jq -c '.. | objects | .state? // empty' r4f-revision4-12-ledger-resume-evidence/prepared-residue-after-pause.json | head -n1)"
          test -n "$state"
          jq -e --arg checkpoint "$EXPECTED_CHECKPOINT_ID" '.runRows==1 and .checkpointRows==1 and .batchRows==0 and .evidenceRows==0 and .runStatus=="prepared" and .runCompletedBatches==0 and .runCommittedLedgers==0 and .runLastAccountingDigest==null and .runLastError==null and .runStartedAt==null and .runCompletedAt==null and .runCheckpointId==$checkpoint' <<<"$state" > /dev/null
          test "$(jq -r '.runRowDigest' <<<"$state")" = "$EXPECTED_RUN_ROW_DIGEST"
          test "$(jq -r '.checkpointRowDigest' <<<"$state")" = "$EXPECTED_CHECKPOINT_ROW_DIGEST"

      - name: Resume exact prepared run with one 12-ledger proof invocation
        id: execute_proof
        shell: bash
        run: |
          set -euo pipefail
          proof_headers=(-H 'content-type: application/json' -H "apikey: ${SUPABASE_R4F_PROOF_KEY}")
          if [ "$SUPABASE_R4F_PROOF_KEY_KIND" = legacy ]; then
            proof_headers+=(-H "Authorization: Bearer ${SUPABASE_R4F_PROOF_KEY}")
          fi
          jq -n --arg run "$RECOVERY_RUN_ID" '{source:"github_actions_prepared_resume",run_id:$run}' > /tmp/proof-body.json
          curl --fail-with-body --silent --show-error \
            "${proof_headers[@]}" \
            --data @/tmp/proof-body.json \
            "https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/${PROOF_FUNCTION}" \
            > r4f-revision4-12-ledger-resume-evidence/executor-response.json
          jq -e --arg run "$RECOVERY_RUN_ID" --argjson max "$MAX_TOTAL_BYTES" '
            .ok == true and .claimed == true and .runId == $run and
            .ledgerCount == 12 and .endLedgerIndex == (.startLedgerIndex + 11) and
            .accountingProfileRevision == 4 and .completionAcknowledged == true and
            .activeMutationCommitted == true and .finalizedEgressUpperBoundBytes <= $max and
            (.accountingDigest | test("^[a-f0-9]{64}$"))
          ' r4f-revision4-12-ledger-resume-evidence/executor-response.json > /dev/null
          printf 'batch_id=%s\naccounting_digest=%s\nfinalized_egress=%s\n' \
            "$(jq -r '.batchId' r4f-revision4-12-ledger-resume-evidence/executor-response.json)" \
            "$(jq -r '.accountingDigest' r4f-revision4-12-ledger-resume-evidence/executor-response.json)" \
            "$(jq -r '.finalizedEgressUpperBoundBytes' r4f-revision4-12-ledger-resume-evidence/executor-response.json)" >> "$GITHUB_OUTPUT"

      - name: Restore exact collector immediately after resume attempt
        id: resume_collector
        if: always() && steps.auth.outcome == 'success'
        env:
          PROJECT_DIGEST: ${{ steps.auth.outputs.project_digest }}
          JOB_ID: ${{ steps.auth.outputs.job_id }}
          COMMAND_DIGEST: ${{ steps.auth.outputs.command_digest }}
        run: |
          set -euo pipefail
          node scripts/manage-r4f-g3-isolated-window.mjs \
            --mode resume \
            --expected-job-id "$JOB_ID" \
            --expected-command-digest "$COMMAND_DIGEST" \
            --expected-project-digest "$PROJECT_DIGEST" \
            --output-directory r4f-revision4-12-ledger-resume-evidence/isolation

      - name: Delete only temporary proof function
        id: cleanup_function
        if: always() && steps.deploy.outcome == 'success'
        run: |
          set -euo pipefail
          test "$PROOF_FUNCTION" != "$ACTIVE_FUNCTION"
          supabase functions delete "$PROOF_FUNCTION" --project-ref "$SUPABASE_PROJECT_ID"

      - name: Capture and independently qualify retained accounting evidence
        id: capture
        if: steps.execute_proof.outcome == 'success' && steps.resume_collector.outcome == 'success'
        env:
          BATCH_ID: ${{ steps.execute_proof.outputs.batch_id }}
          ACCOUNTING_DIGEST: ${{ steps.execute_proof.outputs.accounting_digest }}
          FINALIZED_EGRESS: ${{ steps.execute_proof.outputs.finalized_egress }}
          SOURCE_COMMIT: ${{ steps.auth.outputs.commit }}
        run: |
          set -euo pipefail
          node scripts/capture-supabase-revision4-r5-accounting-qualification.mjs \
            --expected-batch-id "$BATCH_ID" \
            --expected-accounting-digest "$ACCOUNTING_DIGEST" \
            --expected-finalized-egress "$FINALIZED_EGRESS" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --source-commit "$SOURCE_COMMIT" \
            --output r4f-revision4-12-ledger-resume-evidence/qualification.json
          jq -e --argjson max "$MAX_TOTAL_BYTES" --argjson per "$MAX_PER_LEDGER_BYTES" '
            .qualification.pass == true and .qualificationInput.ledgerCount == 12 and
            .qualification.rollingBillableEgressUpperBoundBytes <= $max and
            .qualification.perLedgerBillableEgressUpperBoundBytes <= $per and
            .safety.publicReaderUnchanged == true and .safety.mainnetDisabled == true
          ' r4f-revision4-12-ledger-resume-evidence/qualification.json > /dev/null

      - name: Upload sanitized resume qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r4f-revision4-12-ledger-resume-qualification-evidence
          path: r4f-revision4-12-ledger-resume-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Publish bounded resume qualification result
        if: always()
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_COMMIT: ${{ steps.auth.outputs.commit }}
          PREPARE_RUN: ${{ steps.auth.outputs.prepare_run }}
          CHECKPOINT_ID: ${{ steps.auth.outputs.checkpoint_id }}
          BATCH_ID: ${{ steps.execute_proof.outputs.batch_id }}
          FINALIZED_EGRESS: ${{ steps.execute_proof.outputs.finalized_egress }}
          EXECUTE_OUTCOME: ${{ steps.execute_proof.outcome }}
          RESTORE_OUTCOME: ${{ steps.resume_collector.outcome }}
          DELETE_OUTCOME: ${{ steps.cleanup_function.outcome }}
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
        run: |
          set -euo pipefail
          verdict=FAIL
          per_ledger=unavailable
          if [ "$CAPTURE_OUTCOME" = success ] && [ -s r4f-revision4-12-ledger-resume-evidence/qualification.json ]; then
            verdict="$(jq -r 'if .qualification.pass then "PASS" else "FAIL" end' r4f-revision4-12-ledger-resume-evidence/qualification.json)"
            per_ledger="$(jq -r '.qualification.perLedgerBillableEgressUpperBoundBytes' r4f-revision4-12-ledger-resume-evidence/qualification.json)"
          fi
          cat > /tmp/result.md <<EOF
          ## R4F revision-4 exact 12-ledger prepared-run resume — ${verdict}

          Run: ${RUN_URL}
          Source commit: \`${SOURCE_COMMIT:-unavailable}\`
          Authorization comment: \`${AUTHORIZATION_COMMENT_ID}\`
          Preparation run: \`${PREPARE_RUN:-unavailable}\`
          Reused checkpoint: \`${CHECKPOINT_ID:-unavailable}\`
          Recovery run: \`${RECOVERY_RUN_ID}\`
          Batch: \`${BATCH_ID:-unavailable}\`
          Finalized directional egress upper bound: \`${FINALIZED_EGRESS:-unavailable} B\`
          Per-ledger upper bound: \`${per_ledger} B\`
          Required bound: \`<= ${MAX_TOTAL_BYTES} B / ${MAX_LEDGER_COUNT} ledgers\` (\`<= ${MAX_PER_LEDGER_BYTES} B/ledger\`)
          Prepared-run execution: \`${EXECUTE_OUTCOME}\`
          Collector restore: \`${RESTORE_OUTCOME}\`
          Temporary proof-function deletion: \`${DELETE_OUTCOME}\`
          Independent retained-evidence capture: \`${CAPTURE_OUTCOME}\`

          Scope remains qualification-only. This workflow does not delete/recreate the bound checkpoint/run, mutate migrations, replace/delete the active \`${ACTIVE_FUNCTION}\`, select/promote revision 4, touch Mainnet/public reader, rerun G3, stabilize, or soak.
          EOF
          gh issue comment "$QUALIFICATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/result.md
