name: Probe current-state diagnostic

on:
  push:
    branches: [main]
    paths: [.github/current-state-diagnostic-probe-trigger]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Query diagnostic endpoint
        env:
          GH_TOKEN: ${{ github.token }}
          URL: https://xrpl-lending-monitor.badjoke-lab.workers.dev/api/internal/current-state-diagnostic
        run: |
          curl -L -sS --connect-timeout 10 --max-time 180 "$URL" -o diagnostic.json
          jq . diagnostic.json
          API="repos/${GITHUB_REPOSITORY}/contents/.github/current-state-diagnostic-result.json"
          CONTENT=$(base64 -w0 diagnostic.json)
          SHA=$(gh api "$API" --jq .sha 2>/dev/null || true)
          if [ -n "$SHA" ]; then
            gh api --method PUT "$API" -f message="Update current-state diagnostic result" -f content="$CONTENT" -f sha="$SHA" >/dev/null
          else
            gh api --method PUT "$API" -f message="Create current-state diagnostic result" -f content="$CONTENT" >/dev/null
          fi
