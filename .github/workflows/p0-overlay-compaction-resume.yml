name: P0 overlay compaction and collector resume

on:
  push:
    branches: [main]
    paths:
      - .github/p0-overlay-compaction-resume-trigger

permissions:
  contents: read
  issues: write

concurrency:
  group: production-worker-write
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
  GH_TOKEN: ${{ github.token }}
  REPOSITORY: ${{ github.repository }}
  ISSUE_NUMBER: '950'
  TARGET_EPOCH: devnet-3371675
  TARGET_SNAPSHOT: devnet-3800885-eaa0d29666e7
  TARGET_LEDGER: '3800885'
  TARGET_HASH: EAA0D29666E73D7594A52DF8000B07F346CD4DA24A9A07549612CDC7D727B700
  PRODUCTION_BASE: https://xrpl-lending-monitor.badjoke-lab.workers.dev

jobs:
  compact-and-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out implementation
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify quota reset, paused schedule, and exact active binding
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p compaction-evidence

          query_d1() {
            local sql="$1"
            local output="$2"
            jq -n --arg sql "$sql" '{sql:$sql}' \
              | curl --fail-with-body --silent --show-error \
                  -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  -H 'Content-Type: application/json' \
                  --data-binary @- \
                  "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query" \
              > "$output"
            jq -e '.success == true and ((.errors // []) | length) == 0 and ([.result[].success] | all)' "$output" > /dev/null
          }

          today="$(date -u +%F)"
          read -r -d '' query <<'GRAPHQL' || true
          query D1Usage($accountTag:string!,$start:Date,$end:Date,$databaseId:string){viewer{accounts(filter:{accountTag:$accountTag}){d1AnalyticsAdaptiveGroups(limit:10000,filter:{date_geq:$start,date_leq:$end,databaseId:$databaseId}){sum{rowsRead rowsWritten}}}}}
          GRAPHQL
          jq -n --arg query "$query" --arg accountTag "$CLOUDFLARE_ACCOUNT_ID" --arg start "$today" --arg end "$today" --arg databaseId "$DATABASE_ID" '{query:$query,variables:{accountTag:$accountTag,start:$start,end:$end,databaseId:$databaseId}}' > compaction-evidence/usage-request.json
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'content-type: application/json' \
            --data @compaction-evidence/usage-request.json \
            https://api.cloudflare.com/client/v4/graphql > compaction-evidence/usage-before.json
          rows_written="$(jq '[.data.viewer.accounts[0].d1AnalyticsAdaptiveGroups[].sum.rowsWritten // 0] | add // 0' compaction-evidence/usage-before.json)"
          test "$rows_written" -le 5000

          curl --fail-with-body --silent --show-error --retry 3 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-monitor/schedules" \
            > compaction-evidence/schedules-before.json
          jq -e '.success == true and .result.schedules == []' compaction-evidence/schedules-before.json > /dev/null

          query_d1 "SELECT base_epoch_id,base_snapshot_id,base_ledger_index,base_ledger_hash FROM fast_lane_shadow_base_binding WHERE network='devnet'" compaction-evidence/binding-before.json
          jq -e --arg epoch "$TARGET_EPOCH" --arg snapshot "$TARGET_SNAPSHOT" --argjson ledger "$TARGET_LEDGER" --arg hash "$TARGET_HASH" '
            .result[0].results | length == 1
            and .[0].base_epoch_id == $epoch
            and .[0].base_snapshot_id == $snapshot
            and .[0].base_ledger_index == $ledger
            and .[0].base_ledger_hash == $hash
          ' compaction-evidence/binding-before.json > /dev/null

          query_d1 "SELECT COUNT(*) AS active_rows,COALESCE(SUM(LENGTH(projection_json)),0) AS active_payload_bytes FROM current_state_overlay_objects WHERE network='devnet' AND epoch_id='${TARGET_EPOCH}' AND base_snapshot_id='${TARGET_SNAPSHOT}'" compaction-evidence/active-before.json
          query_d1 "SELECT COUNT(*) AS stale_rows,COALESCE(SUM(LENGTH(o.projection_json)),0) AS stale_payload_bytes FROM current_state_overlay_objects o WHERE o.network='devnet' AND NOT (o.epoch_id='${TARGET_EPOCH}' AND o.base_snapshot_id='${TARGET_SNAPSHOT}')" compaction-evidence/stale-before.json
          active_rows="$(jq -r '.result[0].results[0].active_rows' compaction-evidence/active-before.json)"
          stale_rows="$(jq -r '.result[0].results[0].stale_rows' compaction-evidence/stale-before.json)"
          test "$active_rows" -gt 0
          test "$active_rows" -le 5000
          test "$stale_rows" -gt 0
          printf '%s\n' "$active_rows" > compaction-evidence/active-rows-before.txt
          printf '%s\n' "$stale_rows" > compaction-evidence/stale-rows-before.txt

      - name: Atomically rebuild overlay objects with active identity only
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > compaction-evidence/compact.sql <<'SQL'
          CREATE TABLE current_state_overlay_objects_compacted (
            network TEXT NOT NULL CHECK (network = 'devnet'),
            epoch_id TEXT NOT NULL,
            base_snapshot_id TEXT NOT NULL,
            object_type TEXT NOT NULL CHECK (object_type IN ('vault', 'loan_broker', 'loan')),
            object_id TEXT NOT NULL,
            operation TEXT NOT NULL CHECK (operation IN ('upsert', 'deleted')),
            projection_json TEXT,
            owner TEXT,
            account TEXT,
            borrower TEXT,
            vault_id TEXT,
            loan_broker_id TEXT,
            asset_key TEXT,
            on_ledger_status TEXT CHECK (
              on_ledger_status IS NULL OR
              on_ledger_status IN ('active', 'impaired', 'defaulted')
            ),
            source_ledger_index INTEGER NOT NULL CHECK (source_ledger_index >= 0),
            source_ledger_hash TEXT NOT NULL,
            source_transaction_hash TEXT NOT NULL,
            source_transaction_index INTEGER NOT NULL CHECK (source_transaction_index >= 0),
            updated_at TEXT NOT NULL,
            PRIMARY KEY (network, epoch_id, base_snapshot_id, object_type, object_id),
            FOREIGN KEY (network, epoch_id, base_snapshot_id)
              REFERENCES current_state_overlay_state(network, epoch_id, base_snapshot_id)
              ON DELETE CASCADE,
            CHECK (
              (operation = 'upsert' AND projection_json IS NOT NULL) OR
              (operation = 'deleted' AND projection_json IS NULL)
            )
          );

          INSERT INTO current_state_overlay_objects_compacted (
            network,epoch_id,base_snapshot_id,object_type,object_id,operation,projection_json,
            owner,account,borrower,vault_id,loan_broker_id,asset_key,on_ledger_status,
            source_ledger_index,source_ledger_hash,source_transaction_hash,source_transaction_index,updated_at
          )
          SELECT
            network,epoch_id,base_snapshot_id,object_type,object_id,operation,projection_json,
            owner,account,borrower,vault_id,loan_broker_id,asset_key,on_ledger_status,
            source_ledger_index,source_ledger_hash,source_transaction_hash,source_transaction_index,updated_at
          FROM current_state_overlay_objects
          WHERE network='devnet'
            AND epoch_id='devnet-3371675'
            AND base_snapshot_id='devnet-3800885-eaa0d29666e7';

          DROP TABLE current_state_overlay_objects;
          ALTER TABLE current_state_overlay_objects_compacted RENAME TO current_state_overlay_objects;

          CREATE INDEX current_state_overlay_objects_account
            ON current_state_overlay_objects (network,epoch_id,base_snapshot_id,account,object_type,operation,object_id);
          CREATE INDEX current_state_overlay_objects_asset
            ON current_state_overlay_objects (network,epoch_id,base_snapshot_id,asset_key,object_type,operation,object_id);
          CREATE INDEX current_state_overlay_objects_borrower
            ON current_state_overlay_objects (network,epoch_id,base_snapshot_id,borrower,operation,object_id);
          CREATE INDEX current_state_overlay_objects_broker
            ON current_state_overlay_objects (network,epoch_id,base_snapshot_id,loan_broker_id,object_type,operation,object_id);
          CREATE INDEX current_state_overlay_objects_ledger
            ON current_state_overlay_objects (network,epoch_id,base_snapshot_id,source_ledger_index,source_transaction_index,object_type,object_id);
          CREATE INDEX current_state_overlay_objects_list
            ON current_state_overlay_objects (network,epoch_id,base_snapshot_id,object_type,operation,object_id);
          CREATE INDEX current_state_overlay_objects_owner
            ON current_state_overlay_objects (network,epoch_id,base_snapshot_id,owner,object_type,operation,object_id);
          CREATE INDEX current_state_overlay_objects_status
            ON current_state_overlay_objects (network,epoch_id,base_snapshot_id,on_ledger_status,operation,object_id);
          CREATE INDEX current_state_overlay_objects_vault
            ON current_state_overlay_objects (network,epoch_id,base_snapshot_id,vault_id,object_type,operation,object_id);

          DELETE FROM current_state_overlay_state
          WHERE network='devnet'
            AND NOT (epoch_id='devnet-3371675' AND base_snapshot_id='devnet-3800885-eaa0d29666e7');
          SQL

          jq -Rs '{sql:.}' compaction-evidence/compact.sql \
            | curl --fail-with-body --silent --show-error \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H 'Content-Type: application/json' \
                --data-binary @- \
                "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query" \
            > compaction-evidence/compact-response.json
          jq -e '.success == true and ((.errors // []) | length) == 0 and ([.result[].success] | all)' compaction-evidence/compact-response.json > /dev/null
          jq '[.result[].meta.rows_written // 0] | add // 0' compaction-evidence/compact-response.json > compaction-evidence/compaction-rows-written.json
          test "$(cat compaction-evidence/compaction-rows-written.json)" -le 50000

      - name: Verify compacted overlay and schema
        shell: bash
        run: |
          set -Eeuo pipefail

          query_d1() {
            local sql="$1"
            local output="$2"
            jq -n --arg sql "$sql" '{sql:$sql}' \
              | curl --fail-with-body --silent --show-error \
                  -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  -H 'Content-Type: application/json' \
                  --data-binary @- \
                  "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query" \
              > "$output"
            jq -e '.success == true and ((.errors // []) | length) == 0 and ([.result[].success] | all)' "$output" > /dev/null
          }

          query_d1 "SELECT COUNT(*) AS active_rows,COALESCE(SUM(LENGTH(projection_json)),0) AS active_payload_bytes FROM current_state_overlay_objects WHERE network='devnet' AND epoch_id='${TARGET_EPOCH}' AND base_snapshot_id='${TARGET_SNAPSHOT}'" compaction-evidence/active-after.json
          query_d1 "SELECT COUNT(*) AS stale_rows FROM current_state_overlay_objects WHERE network='devnet' AND NOT (epoch_id='${TARGET_EPOCH}' AND base_snapshot_id='${TARGET_SNAPSHOT}')" compaction-evidence/stale-after.json
          query_d1 "SELECT COUNT(*) AS state_rows FROM current_state_overlay_state WHERE network='devnet'" compaction-evidence/state-after.json
          query_d1 "SELECT COUNT(*) AS stale_guard_rows FROM current_state_overlay_commit_guards WHERE network='devnet' AND NOT (epoch_id='${TARGET_EPOCH}' AND base_snapshot_id='${TARGET_SNAPSHOT}')" compaction-evidence/guards-after.json
          query_d1 "SELECT COUNT(*) AS secondary_indexes FROM sqlite_master WHERE type='index' AND tbl_name='current_state_overlay_objects' AND sql IS NOT NULL" compaction-evidence/indexes-after.json

          before="$(cat compaction-evidence/active-rows-before.txt)"
          after="$(jq -r '.result[0].results[0].active_rows' compaction-evidence/active-after.json)"
          test "$after" = "$before"
          test "$(jq -r '.result[0].results[0].stale_rows' compaction-evidence/stale-after.json)" = 0
          test "$(jq -r '.result[0].results[0].state_rows' compaction-evidence/state-after.json)" = 1
          test "$(jq -r '.result[0].results[0].stale_guard_rows' compaction-evidence/guards-after.json)" = 0
          test "$(jq -r '.result[0].results[0].secondary_indexes' compaction-evidence/indexes-after.json)" = 9

      - name: Restore canonical five-minute deployment
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -e '
            .triggers.crons == ["*/5 * * * *"]
            and .vars.APP_NETWORK == "devnet"
            and .vars.MAINNET_ENABLED == "false"
            and .vars.REPLACEMENT_BASE_SNAPSHOT_ID == "devnet-3800885-eaa0d29666e7"
            and .vars.REPLACEMENT_BASE_LEDGER_INDEX == "3800885"
            and .vars.REPLACEMENT_BASE_LEDGER_HASH == "EAA0D29666E73D7594A52DF8000B07F346CD4DA24A9A07549612CDC7D727B700"
          ' wrangler.jsonc > /dev/null
          pnpm build:deploy-assets
          pnpm exec wrangler deploy --config wrangler.jsonc | tee compaction-evidence/resume-deploy.log

          curl --fail-with-body --silent --show-error --retry 3 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-monitor/schedules" \
            > compaction-evidence/schedules-after.json
          jq -e '.success == true and .result.schedules | length == 1 and .[0].cron == "*/5 * * * *"' compaction-evidence/schedules-after.json > /dev/null

          overview_status="$(curl --silent --show-error --retry 3 -o compaction-evidence/overview-after.json -w '%{http_code}' "${PRODUCTION_BASE}/api/overview")"
          history_status="$(curl --silent --show-error --retry 3 -o compaction-evidence/history-after.json -w '%{http_code}' "${PRODUCTION_BASE}/api/status/history-source")"
          test "$overview_status" = 200
          test "$history_status" = 200

          jq -n \
            --argjson passed true \
            --argjson activeRows "$(jq -r '.result[0].results[0].active_rows' compaction-evidence/active-after.json)" \
            --argjson activePayloadBytes "$(jq -r '.result[0].results[0].active_payload_bytes' compaction-evidence/active-after.json)" \
            --argjson staleRows "$(jq -r '.result[0].results[0].stale_rows' compaction-evidence/stale-after.json)" \
            --argjson compactionRowsWritten "$(cat compaction-evidence/compaction-rows-written.json)" \
            --slurpfile schedules compaction-evidence/schedules-after.json \
            --arg overviewHttp "$overview_status" \
            --arg historyHttp "$history_status" \
            '{passed:$passed,activeRows:$activeRows,activePayloadBytes:$activePayloadBytes,staleRows:$staleRows,compactionRowsWritten:$compactionRowsWritten,schedules:$schedules[0].result.schedules,overviewHttp:$overviewHttp,historyHttp:$historyHttp,verification12Slots:"pending"}' \
            > compaction-evidence/summary.json

      - name: Report compaction and resume result
        if: always()
        shell: bash
        run: |
          test -s compaction-evidence/summary.json || echo '{"passed":false}' > compaction-evidence/summary.json
          {
            echo 'Overlay compaction and collector resume result:'
            echo
            echo '```json'
            cat compaction-evidence/summary.json
            echo '```'
          } > compaction-evidence/comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body-file compaction-evidence/comment.md

      - name: Upload compaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-overlay-compaction-resume
          path: compaction-evidence
          if-no-files-found: warn
          retention-days: 30
