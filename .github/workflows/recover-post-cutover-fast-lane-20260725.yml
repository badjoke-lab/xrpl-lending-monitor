name: Recover post-cutover fast lane 20260725

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/recover-post-cutover-fast-lane-trigger-20260725
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-worker-write
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
  DATABASE_NAME: xrpl-lending-monitor
  PRODUCTION_BASE: https://xrpl-lending-monitor.badjoke-lab.workers.dev
  EXPECTED_SNAPSHOT: devnet-3932301-7d026fed85bc
  EXPECTED_BASE_LEDGER: '3932301'

jobs:
  recover:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate recovery implementation and production guards
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'ORDER BY base_ledger_index DESC, updated_at DESC' src/worker/operator/fast-lane-canonical-bridge.ts
          jq -e --arg snapshot "$EXPECTED_SNAPSHOT" --arg ledger "$EXPECTED_BASE_LEDGER" '
            .triggers.crons == ["*/5 * * * *"]
            and .vars.APP_NETWORK == "devnet"
            and .vars.MAINNET_ENABLED == "false"
            and .vars.CURRENT_STATE_REPLACEMENT_SNAPSHOT_ID == $snapshot
            and .vars.REPLACEMENT_BASE_SNAPSHOT_ID == $snapshot
            and .vars.REPLACEMENT_BASE_LEDGER_INDEX == $ledger
            and (.vars | has("REPLACEMENT_BASE_CUTOVER_TOKEN") | not)
          ' wrangler.jsonc >/dev/null
          pnpm build:deploy-assets

      - name: Deploy repaired main to production
        shell: bash
        run: pnpm exec wrangler deploy

      - name: Poll production until fully recovered
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p post-cutover-recovery-evidence

          query_d1() {
            local sql="$1" output="$2" payload tmp code
            payload="$(mktemp)"
            jq -n --arg sql "$sql" '{sql:$sql}' > "$payload"
            for retry in $(seq 1 5); do
              tmp="${output}.retry-${retry}.json"
              code="$(curl --silent --show-error --connect-timeout 10 --max-time 60 \
                -o "$tmp" -w '%{http_code}' \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H 'Content-Type: application/json' --data-binary @"$payload" \
                "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query" || true)"
              if [ "$code" = 200 ] && jq -e '.success == true and .result[0].success == true' "$tmp" >/dev/null 2>&1; then
                mv "$tmp" "$output"
                rm -f "$payload"
                return 0
              fi
              sleep "$((retry * 2))"
            done
            rm -f "$payload"
            return 1
          }

          fetch_api() {
            local path="$1" output="$2" code_file="$3"
            curl --silent --show-error --retry 3 --retry-all-errors \
              --connect-timeout 10 --max-time 45 -o "$output" -w '%{http_code}' \
              "${PRODUCTION_BASE}${path}" > "$code_file"
          }

          recovered=false
          for attempt in $(seq 1 31); do
            dir="post-cutover-recovery-evidence/attempt-${attempt}"
            mkdir -p "$dir"

            query_d1 "SELECT epoch_id,last_processed_ledger,last_processed_hash,latest_observed_ledger,latest_observed_hash,status,(latest_observed_ledger-last_processed_ledger) AS lag_ledgers,updated_at FROM fast_lane_shadow_state WHERE network='devnet'" "$dir/fast.json"
            query_d1 "SELECT epoch_id,base_snapshot_id,base_ledger_index,base_ledger_hash,overlay_ledger_index,overlay_ledger_hash,updated_at FROM current_state_overlay_state WHERE network='devnet' ORDER BY base_ledger_index DESC,updated_at DESC LIMIT 1" "$dir/overlay.json"
            query_d1 "SELECT base_epoch_id,base_snapshot_id,base_ledger_index,base_ledger_hash,updated_at FROM fast_lane_shadow_base_binding WHERE network='devnet'" "$dir/binding.json"
            query_d1 "SELECT network,run_at,status,start_ledger_index,end_ledger_index,latest_observed_ledger,lag_ledgers,ledgers_processed,persistence_rows_read,persistence_rows_written,error_message FROM fast_lane_shadow_run_metrics WHERE network='devnet' ORDER BY run_at DESC LIMIT 1" "$dir/metric.json"
            query_d1 "SELECT scheduled_time,datetime(scheduled_time/1000,'unixepoch') AS scheduled_at_utc,status,started_at,completed_at,next_scheduled_time,error_message,updated_at FROM fast_lane_queue_slots ORDER BY scheduled_time DESC LIMIT 12" "$dir/slots.json"
            query_d1 "SELECT COUNT(*) AS compact_rows FROM fast_lane_shadow_objects_compact WHERE network='devnet'" "$dir/compact.json"
            query_d1 "SELECT COUNT(*) AS stale_rows FROM current_state_overlay_objects o WHERE o.network='devnet' AND NOT EXISTS (SELECT 1 FROM fast_lane_shadow_base_binding b WHERE b.network=o.network AND b.base_epoch_id=o.epoch_id AND b.base_snapshot_id=o.base_snapshot_id)" "$dir/stale.json"
            query_d1 "SELECT COUNT(*) AS compressed_rows,MIN(start_ledger_index) AS first_ledger,MAX(end_ledger_index) AS last_ledger,MAX(LENGTH(bundle_json)) AS max_encoded_bytes FROM fast_lane_history_windows WHERE network='devnet' AND SUBSTR(bundle_json,1,15)='gzip-base64-v1:'" "$dir/history.json"

            fetch_api '/api/overview' "$dir/overview.json" "$dir/overview.code"
            fetch_api '/api/status/history-source' "$dir/history-source.json" "$dir/history-source.code"
            fetch_api '/api/status/fast-lane-diff?limit=500' "$dir/fast-lane-diff.json" "$dir/fast-lane-diff.code"
            fetch_api '/api/status/replacement-base-rebase' "$dir/replacement-base.json" "$dir/replacement-base.code"

            curl --fail-with-body --silent --show-error --retry 3 \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/xrpl-lending-monitor/schedules" \
              > "$dir/schedules.json"
            curl --fail-with-body --silent --show-error --retry 3 \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/xrpl-lending-monitor/deployments" \
              > "$dir/deployments.json"

            ATTEMPT="$attempt" DIR="$dir" EXPECTED_SNAPSHOT="$EXPECTED_SNAPSHOT" EXPECTED_BASE_LEDGER="$EXPECTED_BASE_LEDGER" python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path(os.environ['DIR'])
          attempt = int(os.environ['ATTEMPT'])
          expected_snapshot = os.environ['EXPECTED_SNAPSHOT']
          expected_base = int(os.environ['EXPECTED_BASE_LEDGER'])

          def load(name):
              return json.loads((root / name).read_text())
          def results(name):
              return load(name).get('result', [{}])[0].get('results', [])
          def one(name):
              rows = results(name)
              return rows[0] if rows else {}

          fast = one('fast.json')
          overlay = one('overlay.json')
          binding = one('binding.json')
          metric = one('metric.json')
          slots = results('slots.json')
          compact = int(one('compact.json').get('compact_rows', -1))
          stale = int(one('stale.json').get('stale_rows', -1))
          history = one('history.json')
          diff = load('fast-lane-diff.json')
          rebase = load('replacement-base.json')
          http = {name: (root / f'{name}.code').read_text().strip() for name in ('overview','history-source','fast-lane-diff','replacement-base')}
          schedules = load('schedules.json').get('result', {}).get('schedules', [])
          deployments = load('deployments.json').get('result', {}).get('deployments', [])

          latest = slots[:3]
          aligned = (
              int(fast.get('last_processed_ledger', -1)) == int(overlay.get('overlay_ledger_index', -2))
              and str(fast.get('last_processed_hash', '')).upper() == str(overlay.get('overlay_ledger_hash', '')).upper()
          )
          active_identity = (
              overlay.get('base_snapshot_id') == expected_snapshot
              and int(overlay.get('base_ledger_index', -1)) == expected_base
              and binding.get('base_snapshot_id') == expected_snapshot
              and int(binding.get('base_ledger_index', -1)) == expected_base
          )
          slots_ok = len(latest) == 3 and all(
              row.get('status') == 'completed' and row.get('error_message') in (None, '') for row in latest
          )
          schedule_ok = len(schedules) == 1 and schedules[0].get('cron') == '*/5 * * * *'
          diff_ok = diff.get('passed') is True and diff.get('sample', {}).get('exactProjectionMismatches') == 0
          rebase_ok = (
              rebase.get('status') == 'replayed'
              and rebase.get('target', {}).get('snapshotId') == expected_snapshot
              and int(rebase.get('target', {}).get('ledgerIndex', -1)) == expected_base
          )
          healthy = all((
              fast.get('status') == 'healthy',
              int(fast.get('lag_ledgers', -1)) == 0,
              metric.get('status') == 'committed',
              metric.get('error_message') in (None, ''),
              aligned,
              active_identity,
              compact == 0,
              stale == 0,
              slots_ok,
              all(code == '200' for code in http.values()),
              int(history.get('compressed_rows') or 0) > 0,
              schedule_ok,
              diff_ok,
              rebase_ok,
          ))
          out = {
              'checkedAt': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              'attempt': attempt,
              'healthy': healthy,
              'fastLane': fast,
              'canonicalOverlay': overlay,
              'fastLaneBinding': binding,
              'latestMetric': metric,
              'recentQueueSlots': slots,
              'compactRows': compact,
              'staleRows': stale,
              'compressedHistory': history,
              'http': http,
              'fastLaneDiff': diff,
              'replacementBase': rebase,
              'schedules': schedules,
              'latestDeployment': deployments[0] if deployments else None,
          }
          (root / 'result.json').write_text(json.dumps(out, indent=2) + '\n')
          print(json.dumps({
              'attempt': attempt,
              'healthy': healthy,
              'lag': fast.get('lag_ledgers'),
              'fastLedger': fast.get('last_processed_ledger'),
              'overlayLedger': overlay.get('overlay_ledger_index'),
              'compact': compact,
              'stale': stale,
              'latestSlots': [row.get('status') for row in latest],
              'metricStatus': metric.get('status'),
              'metricError': metric.get('error_message'),
          }))
          PY

            cp "$dir/result.json" post-cutover-recovery-evidence/latest.json
            if jq -e '.healthy == true' "$dir/result.json" >/dev/null; then
              recovered=true
              break
            fi
            sleep 30
          done

          test "$recovered" = true

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-cutover-fast-lane-recovery-20260725
          path: post-cutover-recovery-evidence
          if-no-files-found: error
          retention-days: 30
