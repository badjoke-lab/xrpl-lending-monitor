name: UI screenshot audit

on:
  schedule:
    - cron: '30 0 8 7 *'
  workflow_dispatch:
    inputs:
      base_url:
        description: Deployed read-only site base URL
        required: true
        default: https://xrpl-lending-monitor.badjoke-lab.workers.dev
        type: string
      confirm_fresh_head:
        description: Confirm collector freshness has been reviewed before this production crawl
        required: true
        default: false
        type: boolean
      confirm_d1_headroom:
        description: Confirm the operator expects the workflow to verify current UTC-day D1 headroom before crawling
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ui-screenshot-audit
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve manual intent or one-shot scheduled window
        id: execution
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CONFIRM_FRESH_HEAD: ${{ inputs.confirm_fresh_head }}
          CONFIRM_D1_HEADROOM: ${{ inputs.confirm_d1_headroom }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            test "${CONFIRM_FRESH_HEAD}" = "true"
            test "${CONFIRM_D1_HEADROOM}" = "true"
            echo 'active=true' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [ "$(date -u +%F)" = "2026-07-08" ]; then
            echo 'active=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'active=false' >> "${GITHUB_OUTPUT}"
          fi

      - uses: actions/checkout@v4
        if: steps.execution.outputs.active == 'true'

      - name: Verify collector is fresh and healthy
        if: steps.execution.outputs.active == 'true'
        shell: bash
        env:
          BASE_URL: ${{ inputs.base_url || 'https://xrpl-lending-monitor.badjoke-lab.workers.dev' }}
        run: |
          set -euo pipefail
          mkdir -p ui-screenshot-audit
          curl --max-time 60 -fsS "${BASE_URL%/}/api/status/collector" \
            > ui-screenshot-audit/collector.json
          jq -e '.status == "healthy" and .cursor.lag_ledgers == 0 and .consecutive_failures == 0 and .error == null' \
            ui-screenshot-audit/collector.json > /dev/null

      - name: Measure and enforce actual D1 headroom
        if: steps.execution.outputs.active == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_HEADROOM_OUTPUT_DIR: ui-screenshot-audit
        run: bash scripts/check-d1-headroom.sh

      - uses: pnpm/action-setup@v4
        if: steps.execution.outputs.active == 'true'
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        if: steps.execution.outputs.active == 'true'
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        if: steps.execution.outputs.active == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        if: steps.execution.outputs.active == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Capture representative full-page screenshots
        if: steps.execution.outputs.active == 'true'
        env:
          BASE_URL: ${{ inputs.base_url || 'https://xrpl-lending-monitor.badjoke-lab.workers.dev' }}
          OUTPUT_DIR: ui-screenshot-audit/screenshots
        run: node scripts/capture-ui-audit.mjs

      - name: Analyze screenshot audit evidence
        if: steps.execution.outputs.active == 'true'
        env:
          UI_AUDIT_INPUT_DIR: ui-screenshot-audit/screenshots
          UI_AUDIT_ANALYSIS_OUTPUT_DIR: ui-screenshot-audit
        run: node scripts/analyze-ui-audit.mjs

      - name: Write audit gate and analysis summary
        if: always() && steps.execution.outputs.active == 'true'
        shell: bash
        run: |
          {
            echo '## UI screenshot audit gates'
            echo
            if [ -f ui-screenshot-audit/collector.json ]; then
              jq -r '"- Collector: **\(.status)**, cursor `\(.cursor.last_processed_ledger)`, head `\(.cursor.latest_observed_ledger)`, lag `\(.cursor.lag_ledgers)`, failures `\(.consecutive_failures)`"' \
                ui-screenshot-audit/collector.json
            fi
            if [ -f ui-screenshot-audit/d1-headroom-summary.json ]; then
              jq -r '"- D1 rows read: `\(.rows_read)` / `\(.rows_read_daily_allowance)` (`\((.rows_read_fraction * 10000 | round) / 100)%`)"' \
                ui-screenshot-audit/d1-headroom-summary.json
              jq -r '"- D1 rows written: `\(.rows_written)` / `\(.rows_written_daily_allowance)` (`\((.rows_written_fraction * 10000 | round) / 100)%`)"' \
                ui-screenshot-audit/d1-headroom-summary.json
              jq -r '"- Actual headroom gate passed: **\(.passed)**"' \
                ui-screenshot-audit/d1-headroom-summary.json
            fi
            if [ -f ui-screenshot-audit/analysis-summary.md ]; then
              echo
              cat ui-screenshot-audit/analysis-summary.md
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload screenshot audit evidence
        if: always() && steps.execution.outputs.active == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshot-audit
          path: ui-screenshot-audit
          if-no-files-found: error
          retention-days: 14
