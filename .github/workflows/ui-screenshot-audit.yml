name: UI screenshot audit

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Deployed read-only site base URL
        required: true
        default: https://xrpl-lending-monitor.badjoke-lab.workers.dev
        type: string
      confirm_fresh_head:
        description: Confirm collector freshness has been reviewed before this production crawl
        required: true
        default: false
        type: boolean
      confirm_d1_headroom:
        description: Confirm the operator expects the workflow to verify current UTC-day D1 headroom before crawling
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ui-screenshot-audit
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Enforce manual production-audit intent
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirm_fresh_head }}" = "true"
          test "${{ inputs.confirm_d1_headroom }}" = "true"

      - uses: actions/checkout@v4

      - name: Verify collector is fresh and healthy
        shell: bash
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: |
          set -euo pipefail
          mkdir -p ui-screenshot-audit
          curl --max-time 60 -fsS "${BASE_URL%/}/api/status/collector" \
            > ui-screenshot-audit/collector.json
          jq -e '.status == "healthy" and .cursor.lag_ledgers == 0 and .consecutive_failures == 0 and .error == null' \
            ui-screenshot-audit/collector.json > /dev/null

      - name: Measure and enforce actual D1 headroom
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_HEADROOM_OUTPUT_DIR: ui-screenshot-audit
        run: bash scripts/check-d1-headroom.sh

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Capture representative full-page screenshots
        env:
          BASE_URL: ${{ inputs.base_url }}
          OUTPUT_DIR: ui-screenshot-audit/screenshots
        run: node scripts/capture-ui-audit.mjs

      - name: Evaluate audit diagnostics
        env:
          AUDIT_DIR: ui-screenshot-audit/screenshots
          REQUIRE_UI_AUDIT_TECHNICAL_CLEAN: true
        run: node scripts/evaluate-ui-audit.mjs

      - name: Write audit gate and diagnostics summary
        if: always()
        shell: bash
        run: |
          {
            echo '## UI screenshot audit gates and diagnostics'
            echo
            if [ -f ui-screenshot-audit/collector.json ]; then
              jq -r '"- Collector: **\(.status)**, cursor `\(.cursor.last_processed_ledger)`, head `\(.cursor.latest_observed_ledger)`, lag `\(.cursor.lag_ledgers)`, failures `\(.consecutive_failures)`"' \
                ui-screenshot-audit/collector.json
            fi
            if [ -f ui-screenshot-audit/d1-headroom-summary.json ]; then
              jq -r '"- D1 rows read: `\(.rows_read)` / `\(.rows_read_daily_allowance)` (`\((.rows_read_fraction * 10000 | round) / 100)%`)"' \
                ui-screenshot-audit/d1-headroom-summary.json
              jq -r '"- D1 rows written: `\(.rows_written)` / `\(.rows_written_daily_allowance)` (`\((.rows_written_fraction * 10000 | round) / 100)%`)"' \
                ui-screenshot-audit/d1-headroom-summary.json
              jq -r '"- Actual headroom gate passed: **\(.passed)**"' \
                ui-screenshot-audit/d1-headroom-summary.json
            fi
            if [ -f ui-screenshot-audit/screenshots/evaluation.json ]; then
              jq -r '"- Technical diagnostics passed: **\(.technical_passed)**"' \
                ui-screenshot-audit/screenshots/evaluation.json
              jq -r '"- Capture coverage: `\(.coverage.actual_route_diagnostic_count)` / `\(.coverage.expected_capture_count)` route diagnostics, coverage passed **\(.coverage.passed)**"' \
                ui-screenshot-audit/screenshots/evaluation.json
              jq -r '"- Page-level horizontal overflow findings: **\(.page_horizontal_overflow_count)**"' \
                ui-screenshot-audit/screenshots/evaluation.json
              jq -r '"- Browser/runtime/HTTP technical findings: **\(.technical_finding_count)**"' \
                ui-screenshot-audit/screenshots/evaluation.json
              jq -r '"- Routes with overflow review candidates: **\(.overflow_review_candidate_route_count)**"' \
                ui-screenshot-audit/screenshots/evaluation.json
              echo '- Visual screenshot review is still required even when technical diagnostics pass.'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload screenshot audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshot-audit
          path: ui-screenshot-audit
          if-no-files-found: error
          retention-days: 14
