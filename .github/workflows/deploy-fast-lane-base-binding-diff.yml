name: Deploy fast lane base binding diff

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/deploy-fast-lane-base-binding-diff.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

concurrency:
  group: deploy-fast-lane-base-binding-diff
  cancel-in-progress: true

jobs:
  deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p fast-lane-base-binding-diff-evidence

      - name: Apply pending remote D1 migrations
        run: pnpm exec wrangler d1 migrations apply xrpl-lending-monitor --remote | tee fast-lane-base-binding-diff-evidence/migrations.txt

      - name: Build deploy assets
        run: pnpm build:deploy-assets

      - name: Deploy main Worker with bound fast lane
        run: pnpm exec wrangler deploy --config wrangler.jsonc | tee fast-lane-base-binding-diff-evidence/deploy.txt

      - name: Verify shared five-minute schedule remains registered
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-monitor/schedules" \
            > fast-lane-base-binding-diff-evidence/schedules.json
          jq -e '.success == true and (.result.schedules | length == 1) and (.result.schedules[0].cron == "*/5 * * * *")' \
            fast-lane-base-binding-diff-evidence/schedules.json > /dev/null

      - name: Resolve public Worker URL
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            > fast-lane-base-binding-diff-evidence/subdomain.json
          SUBDOMAIN="$(jq -r '.result.subdomain // empty' fast-lane-base-binding-diff-evidence/subdomain.json)"
          test -n "${SUBDOMAIN}"
          printf '%s\n' "https://xrpl-lending-monitor.${SUBDOMAIN}.workers.dev" > fast-lane-base-binding-diff-evidence/base-url.txt

      - name: Wait for bound fast-lane cycle and differential status
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(cat fast-lane-base-binding-diff-evidence/base-url.txt)"
          for ATTEMPT in $(seq 1 24); do
            curl --fail-with-body --silent --show-error \
              "${BASE}/api/status/fast-lane-diff?limit=200" \
              > fast-lane-base-binding-diff-evidence/diff-latest.json
            STATUS="$(jq -r '.status // empty' fast-lane-base-binding-diff-evidence/diff-latest.json)"
            SAMPLED="$(jq -r '.sample.sampledRows // 0' fast-lane-base-binding-diff-evidence/diff-latest.json)"
            if [ "${STATUS}" = "ok" ] && [ "${SAMPLED}" -gt 0 ]; then
              cp fast-lane-base-binding-diff-evidence/diff-latest.json fast-lane-base-binding-diff-evidence/diff-confirmed.json
              break
            fi
            sleep 30
          done
          test -f fast-lane-base-binding-diff-evidence/diff-confirmed.json
          jq -e '.passed == true and .sample.exactProjectionMismatches == 0' \
            fast-lane-base-binding-diff-evidence/diff-confirmed.json > /dev/null

      - name: Capture current fast-lane run metrics
        run: |
          pnpm exec wrangler d1 execute xrpl-lending-monitor --remote \
            --command "SELECT run_at,status,start_ledger_index,end_ledger_index,latest_observed_ledger,lag_ledgers,ledgers_processed,lending_transactions,coalesced_object_rows,persistence_rows_read,persistence_rows_written FROM fast_lane_shadow_run_metrics WHERE network='devnet' ORDER BY run_at DESC LIMIT 4;" \
            --json > fast-lane-base-binding-diff-evidence/metrics.json

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: fast-lane-base-binding-diff-evidence
          path: fast-lane-base-binding-diff-evidence
          if-no-files-found: warn
          retention-days: 14
