name: P0 apply recovery continuation patch from Windows

on:
  push:
    branches: [main]
    paths:
      - .github/p0-cancel-obsolete-windows-trigger

permissions:
  actions: write
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Patch P0 candidate and recovery workflows through GitHub API
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'

          function Read-RepoFile([string]$Path) {
            $api = "repos/$env:GITHUB_REPOSITORY/contents/$Path"
            $raw = gh api $api | ConvertFrom-Json
            $text = [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(($raw.content -replace '\s','')))
            return @{ Api = $api; Sha = $raw.sha; Text = ($text -replace "`r`n", "`n") }
          }

          function Write-RepoFile($File, [string]$Text, [string]$Message) {
            $content = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($Text))
            gh api --method PUT $File.Api -f message=$Message -f content=$content -f sha=$File.Sha | Out-Null
          }

          $candidate = Read-RepoFile '.github/workflows/rolling-checkpoint-candidate.yml'
          $oldLimit = '          test "${MAX_DELTA_LEDGERS}" -le 5000' + "`n"
          $newLimit = @'
          if [ "${MAX_DELTA_LEDGERS}" -gt 5000 ]; then
            test "${MAX_DELTA_LEDGERS}" -le 30000
            PAIR="${SOURCE_HISTORY_BRANCH}:${SOURCE_CURRENT_STATE_BRANCH}:${HISTORY_CANDIDATE_BRANCH}:${CURRENT_STATE_CANDIDATE_BRANCH}"
            case "${PAIR}" in
              history-p0-recovery-a-data:current-state-p0-recovery-a-data:history-p0-recovery-b-data:current-state-p0-recovery-b-data|history-p0-recovery-b-data:current-state-p0-recovery-b-data:history-p0-recovery-a-data:current-state-p0-recovery-a-data) ;;
              *) echo "Large delta is restricted to aligned P0 recovery branches" >&2; exit 1 ;;
            esac
          fi
'@ -replace "`r`n", "`n"
          if (-not $candidate.Text.Contains($oldLimit)) { throw 'candidate max-delta anchor missing' }
          $candidateText = $candidate.Text.Replace($oldLimit, $newLimit)

          $oldEvidence = @'
      - name: Build retained candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          ROOT=rolling-checkpoint-candidate
          PUBLICATION=.local/history-root/history/publication.json
'@ -replace "`r`n", "`n"
          $newEvidence = @'
      - name: Build retained candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          ROOT=rolling-checkpoint-candidate
          mkdir -p "${ROOT}"
          PUBLICATION=.local/history-root/history/publication.json
'@ -replace "`r`n", "`n"
          if (-not $candidateText.Contains($oldEvidence)) { throw 'candidate evidence anchor missing' }
          $candidateText = $candidateText.Replace($oldEvidence, $newEvidence)
          Write-RepoFile $candidate $candidateText 'fix: retain rolling candidate evidence after branch publication'

          $recovery = Read-RepoFile '.github/workflows/p0-history-recovery.yml'
          $recoveryText = $recovery.Text.Replace("      MAX_DELTA_LEDGERS: '5000'`n", "      MAX_DELTA_LEDGERS: '30000'`n")
          $recoveryText = $recoveryText.Replace("      MAX_CYCLES: '8'`n", "      MAX_CYCLES: '1'`n")
          $oldSource = @'
          SOURCE_HISTORY='history-data'
          SOURCE_CURRENT='current-state-data'
          OUTPUT_HISTORY='history-p0-recovery-a-data'
          OUTPUT_CURRENT='current-state-p0-recovery-a-data'
'@ -replace "`r`n", "`n"
          $newSource = @'
          SOURCE_HISTORY='history-p0-recovery-a-data'
          SOURCE_CURRENT='current-state-p0-recovery-a-data'
          OUTPUT_HISTORY='history-p0-recovery-b-data'
          OUTPUT_CURRENT='current-state-p0-recovery-b-data'
'@ -replace "`r`n", "`n"
          if (-not $recoveryText.Contains($oldSource)) { throw 'P0 continuation source anchor missing' }
          $recoveryText = $recoveryText.Replace($oldSource, $newSource)
          Write-RepoFile $recovery $recoveryText 'fix: continue P0 recovery from verified candidate A'
