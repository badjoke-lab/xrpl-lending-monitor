name: Inspect deployments

on:
  push:
    branches: [main]
    paths: [.github/deployment-inspect-trigger]

permissions:
  contents: write
  deployments: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read deployment history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/deployments?per_page=20" > deployments.json
          jq '[.[]|{id,ref,sha,environment,description,created_at,updated_at,statuses_url}]' deployments.json > summary.json
          API="repos/${GITHUB_REPOSITORY}/contents/.github/deployments-summary.json"
          CONTENT=$(base64 -w0 summary.json)
          SHA=$(gh api "$API" --jq .sha 2>/dev/null || true)
          if [ -n "$SHA" ]; then
            gh api --method PUT "$API" -f message="Update deployments summary" -f content="$CONTENT" -f sha="$SHA" >/dev/null
          else
            gh api --method PUT "$API" -f message="Create deployments summary" -f content="$CONTENT" >/dev/null
          fi
