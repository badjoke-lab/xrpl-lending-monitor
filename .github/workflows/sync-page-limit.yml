name: Sync page limit

on:
  push:
    branches:
      - d1-page-batching
    paths:
      - .github/workflows/sync-page-limit.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d1-page-batching
      - name: Reuse the bootstrap page limit
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/worker/operator/d1-current-state-operator.ts')
          text = path.read_text()
          old_import = "import { runD1Bootstrap } from '../bootstrap/d1-bootstrap'\n"
          new_import = old_import + "import { PAGE_OBJECT_LIMIT } from '../bootstrap/page-batching'\n"
          if text.count(old_import) != 1:
              raise SystemExit('bootstrap import not found exactly once')
          text = text.replace(old_import, new_import)
          old_limit = 'const MAX_OBJECTS_PER_PAGE = 80'
          if text.count(old_limit) != 1:
              raise SystemExit('operator page limit not found exactly once')
          text = text.replace(old_limit, 'const MAX_OBJECTS_PER_PAGE = PAGE_OBJECT_LIMIT')
          path.write_text(text)
          Path('.github/workflows/sync-page-limit.yml').unlink()
          PY
      - name: Commit page limit alignment
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/worker/operator/d1-current-state-operator.ts .github/workflows/sync-page-limit.yml
          git commit -m "refactor: share the bootstrap page limit"
          git push origin HEAD:d1-page-batching
