name: P0 emergency recovery probe from Windows

on:
  push:
    branches: [main]
    paths:
      - .github/p0-emergency-recovery-probe-windows-trigger

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Capture emergency recovery status
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $runs = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/p0-emergency-history-recovery-resume.yml/runs?per_page=20" | ConvertFrom-Json
          $run = $runs.workflow_runs | Sort-Object {[datetime]$_.created_at} -Descending | Select-Object -First 1
          if (-not $run) { throw 'No emergency recovery run found' }
          $jobs = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$($run.id)/jobs?per_page=100" | ConvertFrom-Json
          $payload = [ordered]@{
            capturedAt = (Get-Date).ToUniversalTime().ToString('o')
            run = [ordered]@{
              id = $run.id
              url = $run.html_url
              status = $run.status
              conclusion = $run.conclusion
              headSha = $run.head_sha
              createdAt = $run.created_at
              updatedAt = $run.updated_at
            }
            jobs = @($jobs.jobs | ForEach-Object {
              [ordered]@{
                id = $_.id
                name = $_.name
                status = $_.status
                conclusion = $_.conclusion
                startedAt = $_.started_at
                completedAt = $_.completed_at
                steps = @($_.steps | ForEach-Object {
                  [ordered]@{name=$_.name;status=$_.status;conclusion=$_.conclusion;number=$_.number}
                })
              }
            })
          } | ConvertTo-Json -Depth 8
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($payload + "`n")
          $content = [Convert]::ToBase64String($bytes)
          $apiPath = "repos/$env:GITHUB_REPOSITORY/contents/.github/p0-emergency-history-recovery-status.json"
          $existingSha = ''
          try { $existingSha = gh api $apiPath --jq .sha } catch {}
          if ($existingSha) {
            gh api --method PUT $apiPath -f message='Update P0 emergency history recovery status' -f content=$content -f sha=$existingSha | Out-Null
          } else {
            gh api --method PUT $apiPath -f message='Create P0 emergency history recovery status' -f content=$content | Out-Null
          }
