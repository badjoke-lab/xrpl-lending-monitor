name: R4F Revision4 Resource Snapshot Refresh

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

env:
  QUALIFICATION_ISSUE: '1261'
  PREPARE_SCRIPT: scripts/prepare-r4f-revision4-resource-snapshot.ts
  WRITER_SIGNATURE: public.xrpl_record_external_resource_snapshot(text,bigint,text,timestamp with time zone,bigint,bigint,integer,bigint,text,integer,text)
  INVOCATION_HALT_31D: '400000'
  BUNDLE_HALT_BYTES: '4000000'

jobs:
  prepare:
    if: >-
      github.event.issue.number == 1261 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      github.event.comment.body == '/r4f-revision4-resource-snapshot-refresh-prepare'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Build fresh provider and bundle snapshot proposal read-only
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SUPABASE_PROJECT_ID" =~ ^[a-z]{20}$ ]]
          test -n "$SUPABASE_ACCESS_TOKEN"
          test "$(bun --version)" = '1.3.14'
          bun "$PREPARE_SCRIPT"
          test -s r4f-revision4-resource-snapshot-refresh/proposal.json

      - name: Bind exact production snapshot writer read-only
        id: writer
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/writer.sql <<SQL
          with f as (
            select to_regprocedure('${WRITER_SIGNATURE}') as oid
          )
          select case when oid is null then null else
            encode(extensions.digest(convert_to(pg_get_functiondef(oid), 'UTF8'), 'sha256'), 'hex')
          end as writer_sha256
          from f;
          SQL
          query="$(cat /tmp/writer.sql)"
          jq -n --arg query "$query" '{query:$query,parameters:[],read_only:true}' > /tmp/writer-query.json
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'content-type: application/json' \
            --data @/tmp/writer-query.json \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/database/query" \
            > /tmp/writer-result.json
          writer_sha="$(jq -r '.. | objects | .writer_sha256? // empty' /tmp/writer-result.json | head -n1)"
          [[ "$writer_sha" =~ ^[a-f0-9]{64}$ ]]
          echo "writer_sha=$writer_sha" >> "$GITHUB_OUTPUT"

      - name: Publish fresh exact authorization proposal
        shell: bash
        env:
          WRITER_SHA: ${{ steps.writer.outputs.writer_sha }}
        run: |
          set -euo pipefail
          p='r4f-revision4-resource-snapshot-refresh/proposal.json'
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "$GITHUB_SHA"
          project_digest="$(printf '%s' "$SUPABASE_PROJECT_ID" | sha256sum | awk '{print $1}')"
          snapshot_id="$(jq -r '.snapshotId' "$p")"
          observed_at="$(jq -r '.observedAt' "$p")"
          observed_epoch="$(date -u -d "$observed_at" +%s)"
          invocation24h="$(jq -r '.invocationCount24h' "$p")"
          projected31d="$(jq -r '.projectedInvocations31d' "$p")"
          function_count="$(jq -r '.functionCount' "$p")"
          function_identity="$(jq -r '.functionIdentityDigest' "$p")"
          max_bundle_bytes="$(jq -r '.maxBundleBytes' "$p")"
          max_bundle_name="$(jq -r '.maxBundleName' "$p")"
          bundle_count="$(jq -r '.bundleCount' "$p")"
          bundle_identity="$(jq -r '.bundleIdentityDigest' "$p")"
          evidence="$(jq -r '.evidenceDigest' "$p")"
          [[ "$snapshot_id" =~ ^[a-z0-9][a-z0-9-]{7,99}$ ]]
          [[ "$function_identity" =~ ^[a-f0-9]{64}$ ]]
          [[ "$bundle_identity" =~ ^[a-f0-9]{64}$ ]]
          [[ "$evidence" =~ ^[a-f0-9]{64}$ ]]
          test "$invocation24h" -gt 0
          test "$projected31d" -eq $((invocation24h * 31))
          test "$projected31d" -lt "$INVOCATION_HALT_31D"
          test "$function_count" -gt 0
          test "$bundle_count" -eq "$function_count"
          test "$max_bundle_bytes" -gt 0
          test "$max_bundle_bytes" -lt "$BUNDLE_HALT_BYTES"
          [[ "$max_bundle_name" =~ ^[a-z0-9][a-z0-9-]*$ ]]
          [[ "$WRITER_SHA" =~ ^[a-f0-9]{64}$ ]]
          expires="$(date -u -d '+2 hours' '+%Y-%m-%dT%H:%M:%SZ')"
          nonce="$(openssl rand -hex 8)"
          command="/r4f-revision4-resource-snapshot-refresh-authorize commit=${source_commit} project=${project_digest} writer=${WRITER_SHA} snapshot=${snapshot_id} observed_epoch=${observed_epoch} invocation24h=${invocation24h} projected31d=${projected31d} function_count=${function_count} function_identity=${function_identity} max_bundle_bytes=${max_bundle_bytes} max_bundle_name=${max_bundle_name} bundle_count=${bundle_count} bundle_identity=${bundle_identity} evidence=${evidence} prepare_run=${GITHUB_RUN_ID} expires=${expires} nonce=${nonce}"
          cat > /tmp/proposal.md <<EOF
          ## R4F revision-4 resource snapshot refresh authorization proposal

          Preparation run: \`${GITHUB_RUN_ID}\`
          Source main commit: \`${source_commit}\`
          Project identity digest: \`${project_digest}\`
          Snapshot writer SHA-256: \`${WRITER_SHA}\`
          Snapshot ID: \`${snapshot_id}\`
          Provider observation: \`${observed_at}\`
          Provider invocations 24h: \`${invocation24h}\`
          Projected invocations 31d: \`${projected31d}\` / halt \`${INVOCATION_HALT_31D}\`
          Active function count: \`${function_count}\`
          Active function identity digest: \`${function_identity}\`
          Maximum exact same-commit bundle: \`${max_bundle_bytes} B\` (\`${max_bundle_name}\`) / halt \`${BUNDLE_HALT_BYTES} B\`
          Bundle count: \`${bundle_count}\`
          Bundle identity digest: \`${bundle_identity}\`
          Snapshot evidence digest: \`${evidence}\`
          Authorization expires: \`${expires}\`

          Exact bounded mutation authorized by the command below: insert exactly this one fresh external resource snapshot through the existing canonical writer, verify exact readback and current guard result, and do nothing else. No collector pause, Edge Function deploy/delete, migration, revision-4 selection/promotion, Mainnet, public-reader mutation, stabilization, or soak is authorized.

          Exact authorization command:

          \`${command}\`

          Preparation itself used only Supabase Management API reads, repository-local bundling, and one read-only production writer-definition query. It performed no production mutation.
          EOF
          gh issue comment "$QUALIFICATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/proposal.md

      - name: Upload sanitized preparation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r4f-revision4-resource-snapshot-refresh-prepare
          path: r4f-revision4-resource-snapshot-refresh
          if-no-files-found: warn
          retention-days: 14

  execute:
    if: >-
      github.event.issue.number == 1261 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      startsWith(github.event.comment.body, '/r4f-revision4-resource-snapshot-refresh-authorize ')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      GH_TOKEN: ${{ github.token }}
      AUTHORIZATION_BODY: ${{ github.event.comment.body }}
      AUTHORIZATION_CREATED_AT: ${{ github.event.comment.created_at }}
      AUTHORIZATION_COMMENT_ID: ${{ github.event.comment.id }}
    steps:
      - name: Check out exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Parse exact owner authorization and immutable bindings
        id: auth
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          regex='^/r4f-revision4-resource-snapshot-refresh-authorize commit=([a-f0-9]{40}) project=([a-f0-9]{64}) writer=([a-f0-9]{64}) snapshot=([a-z0-9][a-z0-9-]{7,99}) observed_epoch=([0-9]+) invocation24h=([0-9]+) projected31d=([0-9]+) function_count=([0-9]+) function_identity=([a-f0-9]{64}) max_bundle_bytes=([0-9]+) max_bundle_name=([a-z0-9][a-z0-9-]*) bundle_count=([0-9]+) bundle_identity=([a-f0-9]{64}) evidence=([a-f0-9]{64}) prepare_run=([0-9]+) expires=([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z) nonce=([a-f0-9]{16})$'
          [[ "$AUTHORIZATION_BODY" =~ $regex ]] || { echo 'authorization command shape mismatch' >&2; exit 1; }
          commit="${BASH_REMATCH[1]}"
          project="${BASH_REMATCH[2]}"
          writer="${BASH_REMATCH[3]}"
          snapshot="${BASH_REMATCH[4]}"
          observed_epoch="${BASH_REMATCH[5]}"
          invocation24h="${BASH_REMATCH[6]}"
          projected31d="${BASH_REMATCH[7]}"
          function_count="${BASH_REMATCH[8]}"
          function_identity="${BASH_REMATCH[9]}"
          max_bundle_bytes="${BASH_REMATCH[10]}"
          max_bundle_name="${BASH_REMATCH[11]}"
          bundle_count="${BASH_REMATCH[12]}"
          bundle_identity="${BASH_REMATCH[13]}"
          evidence="${BASH_REMATCH[14]}"
          prepare_run="${BASH_REMATCH[15]}"
          expires="${BASH_REMATCH[16]}"
          nonce="${BASH_REMATCH[17]}"
          test "$commit" = "$(git rev-parse HEAD)"
          actual_project="$(printf '%s' "$SUPABASE_PROJECT_ID" | sha256sum | awk '{print $1}')"
          test "$project" = "$actual_project"
          test "$invocation24h" -gt 0
          test "$projected31d" -eq $((invocation24h * 31))
          test "$projected31d" -lt "$INVOCATION_HALT_31D"
          test "$function_count" -gt 0
          test "$bundle_count" -eq "$function_count"
          test "$max_bundle_bytes" -gt 0
          test "$max_bundle_bytes" -lt "$BUNDLE_HALT_BYTES"
          test "$prepare_run" -gt 0
          auth_epoch="$(date -u -d "$AUTHORIZATION_CREATED_AT" +%s)"
          expires_epoch="$(date -u -d "$expires" +%s)"
          now_epoch="$(date -u +%s)"
          test "$auth_epoch" -lt "$expires_epoch"
          test "$now_epoch" -le "$expires_epoch"
          test $((expires_epoch - auth_epoch)) -le 7200
          test "$observed_epoch" -le $((now_epoch + 300))
          test $((now_epoch - observed_epoch)) -le 7200
          printf 'commit=%s\nproject=%s\nwriter=%s\nsnapshot=%s\nobserved_epoch=%s\ninvocation24h=%s\nprojected31d=%s\nfunction_count=%s\nfunction_identity=%s\nmax_bundle_bytes=%s\nmax_bundle_name=%s\nbundle_count=%s\nbundle_identity=%s\nevidence=%s\nprepare_run=%s\nexpires=%s\nnonce=%s\n' \
            "$commit" "$project" "$writer" "$snapshot" "$observed_epoch" "$invocation24h" "$projected31d" "$function_count" "$function_identity" "$max_bundle_bytes" "$max_bundle_name" "$bundle_count" "$bundle_identity" "$evidence" "$prepare_run" "$expires" "$nonce" >> "$GITHUB_OUTPUT"

      - name: Verify successful fresh preparation and unique prior proposal
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          PREPARE_RUN: ${{ steps.auth.outputs.prepare_run }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREPARE_RUN}" > /tmp/prepare-run.json
          jq -e --arg commit "${{ steps.auth.outputs.commit }}" '.event == "issue_comment" and .conclusion == "success" and .head_sha == $commit and .actor.login == "badjoke-lab"' /tmp/prepare-run.json > /dev/null
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${QUALIFICATION_ISSUE}/comments?per_page=100" | jq -s 'add' > /tmp/comments.json
          EXPECTED="$AUTHORIZATION_BODY" PREPARE_RUN="$PREPARE_RUN" AUTH_AT="$AUTHORIZATION_CREATED_AT" node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const comments = JSON.parse(readFileSync('/tmp/comments.json', 'utf8'))
          const expected = process.env.EXPECTED
          const prepare = process.env.PREPARE_RUN
          const authAt = Date.parse(process.env.AUTH_AT ?? '')
          const proposals = comments.filter((comment) =>
            comment?.user?.login === 'github-actions[bot]'
            && typeof comment?.body === 'string'
            && comment.body.includes(`Preparation run: \`${prepare}\``)
            && comment.body.includes(`\`${expected}\``),
          )
          if (proposals.length !== 1) throw new Error(`expected one exact prior proposal, found ${proposals.length}`)
          if (!(Date.parse(proposals[0].created_at ?? '') < authAt)) throw new Error('proposal must precede authorization')
          const owners = comments.filter((comment) => comment?.user?.login === 'badjoke-lab' && comment?.body === expected)
          if (owners.length !== 1) throw new Error(`authorization command must be unique, found ${owners.length}`)
          NODE

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Reverify deployed function identity and same-commit bundles read-only
        shell: bash
        run: |
          set -euo pipefail
          test "$(bun --version)" = '1.3.14'
          bun "$PREPARE_SCRIPT"
          p='r4f-revision4-resource-snapshot-refresh/proposal.json'
          test "$(jq -r '.functionIdentityDigest' "$p")" = "${{ steps.auth.outputs.function_identity }}"
          test "$(jq -r '.bundleIdentityDigest' "$p")" = "${{ steps.auth.outputs.bundle_identity }}"
          test "$(jq -r '.functionCount' "$p")" = "${{ steps.auth.outputs.function_count }}"
          test "$(jq -r '.bundleCount' "$p")" = "${{ steps.auth.outputs.bundle_count }}"
          test "$(jq -r '.maxBundleBytes' "$p")" = "${{ steps.auth.outputs.max_bundle_bytes }}"
          test "$(jq -r '.maxBundleName' "$p")" = "${{ steps.auth.outputs.max_bundle_name }}"

      - name: Reverify exact production snapshot writer read-only
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/writer.sql <<SQL
          with f as (
            select to_regprocedure('${WRITER_SIGNATURE}') as oid
          )
          select case when oid is null then null else
            encode(extensions.digest(convert_to(pg_get_functiondef(oid), 'UTF8'), 'sha256'), 'hex')
          end as writer_sha256
          from f;
          SQL
          query="$(cat /tmp/writer.sql)"
          jq -n --arg query "$query" '{query:$query,parameters:[],read_only:true}' > /tmp/writer-query.json
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'content-type: application/json' \
            --data @/tmp/writer-query.json \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/database/query" \
            > /tmp/writer-result.json
          actual="$(jq -r '.. | objects | .writer_sha256? // empty' /tmp/writer-result.json | head -n1)"
          test "$actual" = "${{ steps.auth.outputs.writer }}"

      - name: Record exactly the authorized fresh external resource snapshot
        id: write
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          mkdir -p r4f-revision4-resource-snapshot-refresh
          query="select public.xrpl_record_external_resource_snapshot('${{ steps.auth.outputs.snapshot }}', ${{ steps.auth.outputs.prepare_run }}::bigint, '${{ steps.auth.outputs.commit }}', to_timestamp(${{ steps.auth.outputs.observed_epoch }}), ${{ steps.auth.outputs.invocation24h }}::bigint, ${{ steps.auth.outputs.projected31d }}::bigint, ${{ steps.auth.outputs.function_count }}::integer, ${{ steps.auth.outputs.max_bundle_bytes }}::bigint, '${{ steps.auth.outputs.max_bundle_name }}', ${{ steps.auth.outputs.bundle_count }}::integer, '${{ steps.auth.outputs.evidence }}') as value;"
          jq -n --arg query "$query" '{query:$query,parameters:[],read_only:false}' > /tmp/write-query.json
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'content-type: application/json' \
            --data @/tmp/write-query.json \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/database/query" \
            > r4f-revision4-resource-snapshot-refresh/write-result.json
          value="$(jq -c '.. | objects | .value? // empty' r4f-revision4-resource-snapshot-refresh/write-result.json | head -n1)"
          test -n "$value"
          jq -e \
            --argjson inv "${{ steps.auth.outputs.invocation24h }}" \
            --argjson projected "${{ steps.auth.outputs.projected31d }}" \
            --argjson functions "${{ steps.auth.outputs.function_count }}" \
            --argjson maxBundle "${{ steps.auth.outputs.max_bundle_bytes }}" \
            --arg maxName "${{ steps.auth.outputs.max_bundle_name }}" \
            --argjson bundles "${{ steps.auth.outputs.bundle_count }}" \
            '.allowed == true and .measurements.externalSnapshotFresh == true and .measurements.invocationCount24h == $inv and .measurements.projectedInvocations31d == $projected and .measurements.functionCount == $functions and .measurements.maxBundleBytes == $maxBundle and .measurements.maxBundleName == $maxName and .measurements.bundleCount == $bundles and .coverage.functionInvocations == true and .coverage.bundleSize == true' \
            <<<"$value" > /dev/null

      - name: Verify exact snapshot readback read-only
        id: readback
        if: always() && steps.write.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          query="select jsonb_build_object('snapshotId', snapshot_id, 'sourceRunId', source_run_id, 'sourceCommit', source_commit, 'observedEpoch', extract(epoch from observed_at)::bigint, 'invocationCount24h', invocation_count_24h, 'projectedInvocations31d', projected_invocations_31d, 'functionCount', function_count, 'maxBundleBytes', max_bundle_bytes, 'maxBundleName', max_bundle_name, 'bundleCount', bundle_count, 'evidenceDigest', evidence_digest) as state from xrpl_resource_guard_v1.external_snapshots order by observed_at desc, snapshot_id desc limit 1;"
          jq -n --arg query "$query" '{query:$query,parameters:[],read_only:true}' > /tmp/readback-query.json
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'content-type: application/json' \
            --data @/tmp/readback-query.json \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/database/query" \
            > r4f-revision4-resource-snapshot-refresh/readback.json
          state="$(jq -c '.. | objects | .state? // empty' r4f-revision4-resource-snapshot-refresh/readback.json | head -n1)"
          test -n "$state"
          jq -e \
            --arg snapshot "${{ steps.auth.outputs.snapshot }}" \
            --argjson run "${{ steps.auth.outputs.prepare_run }}" \
            --arg commit "${{ steps.auth.outputs.commit }}" \
            --argjson observed "${{ steps.auth.outputs.observed_epoch }}" \
            --argjson inv "${{ steps.auth.outputs.invocation24h }}" \
            --argjson projected "${{ steps.auth.outputs.projected31d }}" \
            --argjson functions "${{ steps.auth.outputs.function_count }}" \
            --argjson maxBundle "${{ steps.auth.outputs.max_bundle_bytes }}" \
            --arg maxName "${{ steps.auth.outputs.max_bundle_name }}" \
            --argjson bundles "${{ steps.auth.outputs.bundle_count }}" \
            --arg evidence "${{ steps.auth.outputs.evidence }}" \
            '.snapshotId == $snapshot and .sourceRunId == $run and .sourceCommit == $commit and .observedEpoch == $observed and .invocationCount24h == $inv and .projectedInvocations31d == $projected and .functionCount == $functions and .maxBundleBytes == $maxBundle and .maxBundleName == $maxName and .bundleCount == $bundles and .evidenceDigest == $evidence' \
            <<<"$state" > /dev/null

      - name: Upload sanitized refresh evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r4f-revision4-resource-snapshot-refresh-execute
          path: r4f-revision4-resource-snapshot-refresh
          if-no-files-found: warn
          retention-days: 14

      - name: Publish bounded refresh result
        if: always()
        shell: bash
        env:
          WRITE_OUTCOME: ${{ steps.write.outcome }}
          READBACK_OUTCOME: ${{ steps.readback.outcome }}
        run: |
          set -euo pipefail
          verdict=FAIL
          if [ "$WRITE_OUTCOME" = success ] && [ "$READBACK_OUTCOME" = success ]; then verdict=PASS; fi
          cat > /tmp/result.md <<EOF
          ## R4F revision-4 resource snapshot refresh — ${verdict}

          Run: \`${GITHUB_RUN_ID}\`
          Source commit: \`${{ steps.auth.outputs.commit }}\`
          Authorization comment: \`${AUTHORIZATION_COMMENT_ID}\`
          Preparation run: \`${{ steps.auth.outputs.prepare_run }}\`
          Snapshot: \`${{ steps.auth.outputs.snapshot }}\`
          Provider invocations 24h: \`${{ steps.auth.outputs.invocation24h }}\`
          Projected invocations 31d: \`${{ steps.auth.outputs.projected31d }}\`
          Exact snapshot write: \`${WRITE_OUTCOME}\`
          Exact readback: \`${READBACK_OUTCOME}\`

          Scope was one external resource snapshot row only. No collector pause, Edge Function deploy/delete, migration, revision-4 selection/promotion, Mainnet, public-reader mutation, stabilization, or soak occurred.
          EOF
          gh issue comment "$QUALIFICATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/result.md
          test "$verdict" = PASS
