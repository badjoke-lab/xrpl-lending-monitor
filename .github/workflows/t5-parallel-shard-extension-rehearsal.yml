name: T5 parallel shard extension rehearsal

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/t5-parallel-shard-extension-rehearsal.yml'
      - 'scripts/plan-history-extension-shards.ts'
      - 'src/shared/history-segments/extension-shards.ts'
      - 'src/shared/history-segments/extension-shards.test.ts'
      - 'vite.history-extension-shards.config.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: history-data
          path: .local/history-source
          sparse-checkout: history/publication.json
          sparse-checkout-cone-mode: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build planners
        run: |
          pnpm build:history-extension-plan
          pnpm exec vite build --config vite.history-extension-shards.config.ts
      - name: Freeze small target and build shard plan
        shell: bash
        run: |
          set -euo pipefail
          ROOT=t5-parallel-shard-rehearsal
          SOURCE=.local/history-source/history/publication.json
          mkdir -p "${ROOT}"
          SOURCE_END="$(jq -r '.endLedgerIndex' "${SOURCE}")"
          TARGET="$((SOURCE_END + 24))"
          jq -n --argjson ledger_index "${TARGET}" '{method:"ledger",params:[{ledger_index:$ledger_index,transactions:false,expand:false}]}' > "${ROOT}/target-request.json"
          curl --fail-with-body --silent --show-error --retry 3 -H 'Content-Type: application/json' --data @"${ROOT}/target-request.json" https://devnet.honeycluster.io/ > "${ROOT}/target-response.json"
          TARGET_HASH="$(jq -r '.result.ledger_hash // .result.ledger.ledger_hash // empty' "${ROOT}/target-response.json")"
          printf '%s' "${TARGET_HASH}" | grep -Eq '^[A-F0-9]{64}$'
          node .history-extension-plan-build/plan-history-extension.mjs --local --publication "${SOURCE}" --target-ledger "${TARGET}" --target-ledger-hash "${TARGET_HASH}" --segment-ledgers 4 --checkpoint-every-segments 2 --output "${ROOT}/extension-plan.json" > "${ROOT}/extension-plan.stdout.json"
          node .history-extension-shards-build/plan-history-extension-shards.mjs --local --plan "${ROOT}/extension-plan.json" --segments-per-shard 2 --output "${ROOT}/shard-plan.json" > "${ROOT}/shard-plan.stdout.json"
          jq -e '.extension.segmentCount == 6' "${ROOT}/extension-plan.json" > /dev/null
          jq -e '.shardCount == 3 and ([.shards[].segmentCount] | all(. == 2))' "${ROOT}/shard-plan.json" > /dev/null
      - id: matrix
        shell: bash
        run: |
          MATRIX="$(jq -c '{shard:[.shards[].ordinal]}' t5-parallel-shard-rehearsal/shard-plan.json)"
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: t5-parallel-shard-plan
          path: t5-parallel-shard-rehearsal
          if-no-files-found: error

  generate:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm build:history-segment
          pnpm build:history-segment-checkpoint
      - uses: actions/download-artifact@v4
        with:
          name: t5-parallel-shard-plan
          path: .local/plan
      - name: Resolve shard anchor and generate planned segments
        shell: bash
        env:
          SHARD_ORDINAL: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          PLAN=.local/plan/extension-plan.json
          SHARDS=.local/plan/shard-plan.json
          SHARD="$(jq -c --argjson ordinal "${SHARD_ORDINAL}" '.shards[] | select(.ordinal == $ordinal)' "${SHARDS}")"
          EPOCH="$(jq -r '.epochId' "${PLAN}")"
          START="$(jq -r '.startLedgerIndex' <<<"${SHARD}")"
          END="$(jq -r '.endLedgerIndex' <<<"${SHARD}")"
          ANCHOR_LEDGER="$(jq -r '.anchorPreviousLedgerIndex' <<<"${SHARD}")"
          ANCHOR_ID="$(jq -r '.anchorPreviousSegmentId' <<<"${SHARD}")"
          ROOT="shard-output-${SHARD_ORDINAL}"
          CHECKPOINT="${ROOT}/checkpoint.json"
          mkdir -p "${ROOT}/history/${EPOCH}"

          jq -n --argjson ledger_index "${ANCHOR_LEDGER}" '{method:"ledger",params:[{ledger_index:$ledger_index,transactions:false,expand:false}]}' > "${ROOT}/anchor-request.json"
          curl --fail-with-body --silent --show-error --retry 3 -H 'Content-Type: application/json' --data @"${ROOT}/anchor-request.json" https://devnet.honeycluster.io/ > "${ROOT}/anchor-response.json"
          ANCHOR_HASH="$(jq -r '.result.ledger_hash // .result.ledger.ledger_hash // empty' "${ROOT}/anchor-response.json")"
          printf '%s' "${ANCHOR_HASH}" | grep -Eq '^[A-F0-9]{64}$'
          if [ "${SHARD_ORDINAL}" = "1" ]; then test "${ANCHOR_HASH}" = "$(jq -r '.source.endLedgerHash' "${PLAN}")"; fi

          PREV_ID="${ANCHOR_ID}"
          PREV_HASH="${ANCHOR_HASH}"
          while IFS= read -r SEGMENT; do
            ORDINAL="$(jq -r '.ordinal' <<<"${SEGMENT}")"
            SEGMENT_ID="$(jq -r '.segmentId' <<<"${SEGMENT}")"
            SEGMENT_START="$(jq -r '.startLedgerIndex' <<<"${SEGMENT}")"
            SEGMENT_END="$(jq -r '.endLedgerIndex' <<<"${SEGMENT}")"
            OUT="${ROOT}/history/${EPOCH}/${SEGMENT_ID}"
            PASSED=false
            for ATTEMPT in 1 2 3; do
              if node .history-segment-build/run-history-segment.mjs --local --endpoint https://devnet.honeycluster.io/ --timeout-ms 8000 --start-ledger "${SEGMENT_START}" --end-ledger "${SEGMENT_END}" --epoch-id "${EPOCH}" --segment-id "${SEGMENT_ID}" --previous-segment-id "${PREV_ID}" --previous-segment-end-hash "${PREV_HASH}" --source-revision "${GITHUB_SHA}" --output-dir "${OUT}" > "${ROOT}/segment-${ORDINAL}.stdout.json"; then PASSED=true; break; fi
              sleep $((ATTEMPT * 3))
            done
            test "${PASSED}" = true
            node .history-segment-checkpoint-build/update-history-segment-checkpoint.mjs --local --checkpoint "${CHECKPOINT}" --manifest "${OUT}/manifest.json" --epoch-id "${EPOCH}" --range-start-ledger "${START}" --range-end-ledger "${END}" --previous-segment-id "${ANCHOR_ID}" --previous-segment-end-hash "${ANCHOR_HASH}" > "${ROOT}/checkpoint-${ORDINAL}.stdout.json"
            PREV_ID="${SEGMENT_ID}"
            PREV_HASH="$(jq -r '.endLedgerHash' "${OUT}/manifest.json")"
          done < <(jq -c '.segments[]' <<<"${SHARD}")

          EXPECTED_COUNT="$(jq -r '.segmentCount' <<<"${SHARD}")"
          jq -e --argjson end "${END}" --argjson count "${EXPECTED_COUNT}" '.nextLedgerIndex == ($end + 1) and (.completedSegments | length) == $count' "${CHECKPOINT}" > /dev/null
          jq -n --argjson shardOrdinal "${SHARD_ORDINAL}" --arg anchorSegmentId "${ANCHOR_ID}" --arg anchorLedgerHash "${ANCHOR_HASH}" --slurpfile checkpoint "${CHECKPOINT}" '{passed:true,shardOrdinal:$shardOrdinal,anchorSegmentId:$anchorSegmentId,anchorLedgerHash:$anchorLedgerHash,checkpoint:$checkpoint[0]}' > "${ROOT}/evidence.json"
      - uses: actions/upload-artifact@v4
        with:
          name: t5-parallel-shard-${{ matrix.shard }}
          path: shard-output-${{ matrix.shard }}
          if-no-files-found: error

  verify:
    needs: [plan, generate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm build:history-extension-artifacts
          pnpm build:history-segment-chain
      - uses: actions/download-artifact@v4
        with:
          name: t5-parallel-shard-plan
          path: .local/plan
      - uses: actions/download-artifact@v4
        with:
          pattern: t5-parallel-shard-*
          path: .local/shards
          merge-multiple: true
      - name: Verify merged shard set against frozen plan and full chain
        shell: bash
        run: |
          set -euo pipefail
          PLAN=.local/plan/extension-plan.json
          EPOCH="$(jq -r '.epochId' "${PLAN}")"
          MANIFEST_ARGS=()
          while IFS= read -r SEGMENT_ID; do
            MANIFEST="$(find .local/shards -path "*/history/${EPOCH}/${SEGMENT_ID}/manifest.json" -print -quit)"
            test -n "${MANIFEST}"
            MANIFEST_ARGS+=(--manifest "${MANIFEST}")
          done < <(jq -r '.extension.segments[].segmentId' "${PLAN}")

          mkdir -p t5-parallel-shard-verify
          node .history-extension-artifacts-build/verify-history-extension-artifacts.mjs --local --plan "${PLAN}" "${MANIFEST_ARGS[@]}" > t5-parallel-shard-verify/plan-bound-summary.json
          node .history-segment-chain-build/verify-history-segment-chain.mjs --local "${MANIFEST_ARGS[@]}" --epoch-id "$(jq -r '.epochId' "${PLAN}")" --start-ledger "$(jq -r '.extension.startLedgerIndex' "${PLAN}")" --start-parent-hash "$(jq -r '.source.endLedgerHash' "${PLAN}")" --previous-segment-id "$(jq -r '.source.lastSegmentId' "${PLAN}")" --previous-segment-end-hash "$(jq -r '.source.endLedgerHash' "${PLAN}")" --end-ledger "$(jq -r '.target.ledgerIndex' "${PLAN}")" --end-ledger-hash "$(jq -r '.target.ledgerHash' "${PLAN}")" > t5-parallel-shard-verify/chain-summary.json
          jq -n --slurpfile planBound t5-parallel-shard-verify/plan-bound-summary.json --slurpfile chain t5-parallel-shard-verify/chain-summary.json '{passed:true,planBound:$planBound[0],chain:$chain[0]}' > t5-parallel-shard-verify/evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: t5-parallel-shard-extension-rehearsal
          path: t5-parallel-shard-verify
          if-no-files-found: error
