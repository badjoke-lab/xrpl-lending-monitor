name: Five-minute production collector

on:
  pull_request:
    paths:
      - '.github/workflows/five-minute-collector.yml'
      - 'scripts/run-five-minute-collector.ts'
      - 'vite.five-minute-collector.config.ts'
      - 'src/collector/**'
      - 'src/shared/**'
      - 'src/worker/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'pnpm-lock.yaml'
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vite build --config vite.five-minute-collector.config.ts

  collect:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && startsWith(github.event.issue.title, 'P0 actions collector run'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: production-five-minute-collector
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vite build --config vite.five-minute-collector.config.ts
      - name: Run production collector
        run: node .five-minute-collector-build/run-five-minute-collector.mjs
