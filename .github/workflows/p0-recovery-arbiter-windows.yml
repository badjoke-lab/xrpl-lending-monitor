name: P0 recovery arbiter from Windows

on:
  push:
    branches: [main]
    paths:
      - .github/p0-recovery-arbiter-windows-trigger

permissions:
  actions: write
  contents: write

jobs:
  arbitrate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Keep one P0 recovery writer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          function LatestRun([string]$Workflow) {
            $runs = gh api "repos/$repo/actions/workflows/$Workflow/runs?per_page=20" | ConvertFrom-Json
            return ($runs.workflow_runs | Sort-Object {[datetime]$_.created_at} -Descending | Select-Object -First 1)
          }
          function IsActive($Run) {
            return ($null -ne $Run -and $Run.status -in @('queued','in_progress','waiting','pending'))
          }
          $primary = LatestRun 'p0-recovery-continuation-windows.yml'
          $duplicate = LatestRun 'p0-emergency-history-recovery-resume.yml'
          $cancelled = $null
          if ((IsActive $primary) -and (IsActive $duplicate)) {
            gh api --method POST "repos/$repo/actions/runs/$($duplicate.id)/cancel" | Out-Null
            $cancelled = [int64]$duplicate.id
          }
          $payload = [ordered]@{
            capturedAt = (Get-Date).ToUniversalTime().ToString('o')
            primary = if ($primary) { [ordered]@{id=$primary.id;status=$primary.status;conclusion=$primary.conclusion;createdAt=$primary.created_at;updatedAt=$primary.updated_at;url=$primary.html_url} } else { $null }
            duplicate = if ($duplicate) { [ordered]@{id=$duplicate.id;status=$duplicate.status;conclusion=$duplicate.conclusion;createdAt=$duplicate.created_at;updatedAt=$duplicate.updated_at;url=$duplicate.html_url} } else { $null }
            cancelledRunId = $cancelled
          } | ConvertTo-Json -Depth 6
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($payload + "`n")
          $content = [Convert]::ToBase64String($bytes)
          $apiPath = "repos/$repo/contents/.github/p0-recovery-arbiter-status.json"
          $existingSha = ''
          try { $existingSha = gh api $apiPath --jq .sha } catch {}
          if ($existingSha) {
            gh api --method PUT $apiPath -f message='Update P0 recovery arbiter status' -f content=$content -f sha=$existingSha | Out-Null
          } else {
            gh api --method PUT $apiPath -f message='Create P0 recovery arbiter status' -f content=$content | Out-Null
          }
