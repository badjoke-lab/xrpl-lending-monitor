name: Post-cutover live probe

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/post-cutover-live-probe.yml

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Capture guarded cutover runtime evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p post-cutover-live-probe

          curl -sS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            > post-cutover-live-probe/workers-subdomain.json

          SUBDOMAIN="$(jq -r '.result.subdomain // empty' post-cutover-live-probe/workers-subdomain.json)"
          test -n "${SUBDOMAIN}"
          BASE="https://xrpl-lending-monitor.${SUBDOMAIN}.workers.dev"
          printf '%s\n' "${BASE}" > post-cutover-live-probe/base-url.txt

          REBASE_STATUS=""
          for ATTEMPT in $(seq 1 36); do
            HTTP="$(curl -sS -o post-cutover-live-probe/replacement-base-rebase.json -w '%{http_code}' "${BASE}/api/status/replacement-base-rebase" || true)"
            REBASE_STATUS="$(jq -r '.status // empty' post-cutover-live-probe/replacement-base-rebase.json 2>/dev/null || true)"
            printf '%s %s %s\n' "${ATTEMPT}" "${HTTP}" "${REBASE_STATUS}" >> post-cutover-live-probe/rebase-attempts.txt
            if [ "${HTTP}" = "200" ] && [ "${REBASE_STATUS}" = "replayed" ]; then
              break
            fi
            sleep 10
          done

          for NAME in collector continuation-verification continuation-diagnostics history-source m1-exit m1-exit-diagnostics; do
            URL="${BASE}/api/status/${NAME}"
            CODE="$(curl -sS -o "post-cutover-live-probe/${NAME}.json" -w '%{http_code}' "${URL}" || true)"
            printf '%s\n' "${CODE}" > "post-cutover-live-probe/${NAME}.http-status.txt"
          done

          jq -n \
            --slurpfile rebase post-cutover-live-probe/replacement-base-rebase.json \
            --slurpfile collector post-cutover-live-probe/collector.json \
            --slurpfile continuation post-cutover-live-probe/continuation-verification.json \
            --slurpfile history post-cutover-live-probe/history-source.json \
            --slurpfile m1 post-cutover-live-probe/m1-exit.json \
            '{
              rebase: $rebase[0],
              collector: $collector[0],
              continuation: $continuation[0],
              history: $history[0],
              m1: $m1[0]
            }' > post-cutover-live-probe/summary.json

          jq -e '.status == "replayed"' post-cutover-live-probe/replacement-base-rebase.json > /dev/null
          jq -e '.mode == "hybrid" and .configured == true and .chain.end_ledger_index == 3432924' post-cutover-live-probe/history-source.json > /dev/null
          jq -e '.target.ledgerIndex == 3432924 and .target.snapshotId == "devnet-3432924-canonical"' post-cutover-live-probe/replacement-base-rebase.json > /dev/null

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-cutover-live-probe
          path: post-cutover-live-probe
          if-no-files-found: error
          retention-days: 30
