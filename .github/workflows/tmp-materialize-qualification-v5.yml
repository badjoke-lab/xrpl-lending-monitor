name: Temporary materialize qualification 995 v5

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-materialize-qualification-v5.yml

permissions:
  contents: write

concurrency:
  group: tmp-materialize-qualification-v5
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/qualification-995-v5-history-recovered
          fetch-depth: 0
      - name: Expand reviewed bundle into qualification branch
        shell: bash
        run: |
          set -euo pipefail
          source_file=.github/workflows/bootstrap-qualification-995-v5.yml
          test -f "$source_file"
          awk '/^PAYLOAD$/{capture=!capture; next} capture' "$source_file" > /tmp/qualification-v5.tar.gz.b64
          test -s /tmp/qualification-v5.tar.gz.b64
          base64 -d /tmp/qualification-v5.tar.gz.b64 > /tmp/qualification-v5.tar.gz
          tar -xzf /tmp/qualification-v5.tar.gz -C .
          rm -f "$source_file"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Stage history-recovered qualification 995 v5'
          git push origin HEAD:ops/qualification-995-v5-history-recovered
      - name: Remove temporary materializer from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          git rm .github/workflows/tmp-materialize-qualification-v5.yml
          git commit -m 'Remove temporary qualification materializer'
          git push origin HEAD:main
