name: P0 lint diagnostic

on:
  push:
    branches:
      - agent/p0-current-state-resilience-health-gates

permissions:
  contents: read

jobs:
  lint-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture lint output
        id: lint
        shell: bash
        run: |
          set +e
          pnpm lint > lint-output.txt 2>&1
          status=$?
          cat lint-output.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload lint output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-lint-output
          path: lint-output.txt
          if-no-files-found: error
          retention-days: 1
      - name: Preserve lint result
        if: steps.lint.outputs.status != '0'
        run: exit 1
