name: Current repair existing retry proof

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: >-
    ${{
      github.event.issue.number == 995 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      startsWith(github.event.comment.body, '/current-repair-existing-retry-proof-') &&
      'current-repair-production-worker-write' ||
      format('current-repair-existing-retry-noop-{0}', github.run_id)
    }}
  cancel-in-progress: false

env:
  QUALIFICATION_ISSUE: '995'
  SCRIPT_NAME: xrpl-lending-monitor
  QUEUE_ID: 2ae398f2edbf43749e45cd7ede77c6cd
  DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
  REPAIRED_VERSION_ID: 4c5ba859-0d22-41ae-9978-8369beea6a0e
  EXPECTED_SCHEDULED_TIME: '1788260040000'
  EXPECTED_MESSAGE_ID: 3a504373e28bd9ae052f7091e2482c86
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  GH_TOKEN: ${{ github.token }}

jobs:
  prepare:
    if: >-
      github.event.issue.number == 995 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      github.event.comment.body == '/current-repair-existing-retry-proof-prepare'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Capture exact existing-retry preflight
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p current-repair-existing-retry-prepare-evidence
          CURRENT_REPAIR_EXISTING_RETRY_OUTPUT=current-repair-existing-retry-prepare-evidence \
            python scripts/current-repair-existing-retry-proof.py --prepare
          result=current-repair-existing-retry-prepare-evidence/result.json
          test "$(jq -r '.safeToRunExistingRetryProof' "$result")" = true
          test "$(jq -r '.productionMutation' "$result")" = false
          test "$(jq -r '.failures | length' "$result")" -eq 0
          test "$(jq -r '.state.slot.scheduled_time' "$result")" = "$EXPECTED_SCHEDULED_TIME"
          test "$(jq -r '.state.slot.message_id' "$result")" = "$EXPECTED_MESSAGE_ID"
          source_commit="$(git rev-parse HEAD)"
          state="$(jq -r '.stateDigest' "$result")"
          version="$(jq -r '.state.deploymentVersion' "$result")"
          manager="$(sha256sum scripts/current-repair-existing-retry-proof.py | awk '{print $1}')"
          test "$version" = "$REPAIRED_VERSION_ID"
          printf 'source_commit=%s\nstate=%s\nversion=%s\nmanager=%s\n' \
            "$source_commit" "$state" "$version" "$manager" >> "$GITHUB_OUTPUT"

      - name: Publish exact existing-retry authorization proposal
        env:
          SOURCE_COMMIT: ${{ steps.preflight.outputs.source_commit }}
          STATE: ${{ steps.preflight.outputs.state }}
          VERSION: ${{ steps.preflight.outputs.version }}
          MANAGER: ${{ steps.preflight.outputs.manager }}
        shell: bash
        run: |
          set -euo pipefail
          expires="$(date -u -d '+2 hours' '+%Y-%m-%dT%H:%M:%SZ')"
          nonce="$(openssl rand -hex 8)"
          command="/current-repair-existing-retry-proof-authorize commit=${SOURCE_COMMIT} version=${VERSION} manager=${MANAGER} state=${STATE} scheduled=${EXPECTED_SCHEDULED_TIME} message=${EXPECTED_MESSAGE_ID} prepare_run=${GITHUB_RUN_ID} expires=${expires} nonce=${nonce}"
          cat > /tmp/current-repair-existing-retry-proposal.md <<EOF
          ## Current repair existing-retry proof authorization proposal

          Preparation run: \`${GITHUB_RUN_ID}\`
          Source main commit: \`${SOURCE_COMMIT}\`
          Repaired Worker version: \`${VERSION}\`
          Read-only state digest: \`${STATE}\`
          Existing failed slot: \`${EXPECTED_SCHEDULED_TIME}\`
          Existing Queue message id: \`${EXPECTED_MESSAGE_ID}\`
          Manager SHA-256: \`${MANAGER}\`

          This authorization resumes the currently paused Queue only long enough for the exact pre-existing retry message to be redelivered to the repaired Worker, then immediately re-pauses delivery. It sends no new Queue message, purges nothing, creates no Cron, deploys no Worker, enables no Mainnet path, alters no Supabase History/R5 state, and does not start continuous catch-up. At most one Current Worker invocation may run, still bounded to 32 ledgers; one successor may be staged but must remain undelivered while Queue delivery is paused.

          Exact authorization command:

          \`${command}\`
          EOF
          gh issue comment "$QUALIFICATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/current-repair-existing-retry-proposal.md

      - name: Upload existing-retry preparation evidence
        uses: actions/upload-artifact@v4
        with:
          name: current-repair-existing-retry-prepare
          path: current-repair-existing-retry-prepare-evidence
          if-no-files-found: error
          retention-days: 14

  execute:
    if: >-
      github.event.issue.number == 995 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      startsWith(github.event.comment.body, '/current-repair-existing-retry-proof-authorize ')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      AUTHORIZATION_BODY: ${{ github.event.comment.body }}
      AUTHORIZATION_CREATED_AT: ${{ github.event.comment.created_at }}
      AUTHORIZATION_COMMENT_ID: ${{ github.event.comment.id }}
    steps:
      - name: Check out exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Parse and bind exact existing-retry authorization
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          regex='^/current-repair-existing-retry-proof-authorize commit=([a-f0-9]{40}) version=([0-9a-f-]{36}) manager=([a-f0-9]{64}) state=([a-f0-9]{64}) scheduled=([0-9]{13}) message=([a-f0-9]{32}) prepare_run=([0-9]+) expires=([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z) nonce=([a-f0-9]{16})$'
          [[ "$AUTHORIZATION_BODY" =~ $regex ]] || { echo 'Current repair existing-retry authorization shape mismatch' >&2; exit 1; }
          names=(commit version manager state scheduled message prepare_run expires nonce)
          for index in "${!names[@]}"; do
            printf '%s=%s\n' "${names[$index]}" "${BASH_REMATCH[$((index + 1))]}" >> "$GITHUB_OUTPUT"
          done
          test "${BASH_REMATCH[1]}" = "$(git rev-parse HEAD)"
          test "${BASH_REMATCH[2]}" = "$REPAIRED_VERSION_ID"
          test "${BASH_REMATCH[3]}" = "$(sha256sum scripts/current-repair-existing-retry-proof.py | awk '{print $1}')"
          test "${BASH_REMATCH[5]}" = "$EXPECTED_SCHEDULED_TIME"
          test "${BASH_REMATCH[6]}" = "$EXPECTED_MESSAGE_ID"
          expires_epoch="$(date -u -d "${BASH_REMATCH[8]}" +%s)"
          auth_epoch="$(date -u -d "$AUTHORIZATION_CREATED_AT" +%s)"
          now_epoch="$(date -u +%s)"
          test "$auth_epoch" -lt "$expires_epoch"
          test "$now_epoch" -le "$expires_epoch"
          test $((expires_epoch - auth_epoch)) -le 7200

      - name: Verify exact prior proposal and unique authorization
        env:
          PREPARE_RUN: ${{ steps.auth.outputs.prepare_run }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${QUALIFICATION_ISSUE}/comments?per_page=100" | jq -s 'add' > /tmp/current-repair-existing-retry-comments.json
          EXPECTED="$AUTHORIZATION_BODY" PREPARE="$PREPARE_RUN" AUTH_ID="$AUTHORIZATION_COMMENT_ID" node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const comments = JSON.parse(readFileSync('/tmp/current-repair-existing-retry-comments.json', 'utf8'))
          const proposals = comments.filter((comment) => comment?.user?.login === 'github-actions[bot]' && typeof comment?.body === 'string' && comment.body.includes(`Preparation run: \`${process.env.PREPARE}\``) && comment.body.includes(`\`${process.env.EXPECTED}\``))
          if (proposals.length !== 1) throw new Error(`expected one exact existing-retry proposal, found ${proposals.length}`)
          const authorizations = comments.filter((comment) => comment?.user?.login === 'badjoke-lab' && comment?.body === process.env.EXPECTED)
          if (authorizations.length !== 1 || Number(authorizations[0].id) !== Number(process.env.AUTH_ID)) throw new Error('existing-retry authorization is not unique')
          NODE

      - name: Execute exactly one existing retry Current proof
        env:
          AUTHORIZED_STATE_DIGEST: ${{ steps.auth.outputs.state }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p current-repair-existing-retry-evidence
          CURRENT_REPAIR_EXISTING_RETRY_OUTPUT=current-repair-existing-retry-evidence \
            python scripts/current-repair-existing-retry-proof.py --execute

      - name: Publish existing-retry proof result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result=current-repair-existing-retry-evidence/result.json
          if test -f "$result"; then
            passed="$(jq -r '.passed' "$result")"
            resumed="$(jq -r '.queueResumed' "$result")"
            repaused="$(jq -r '.queueRepaused' "$result")"
            seeded="$(jq -r '.seedMessageSent' "$result")"
            purged="$(jq -r '.queuePurged' "$result")"
            delta="$(jq -r '.ledgerDelta // "unavailable"' "$result")"
            failure="$(jq -r '.failure // "none"' "$result")"
          else
            passed=false
            resumed=unknown
            repaused=unknown
            seeded=unknown
            purged=unknown
            delta=unavailable
            failure='result unavailable'
          fi
          cat > /tmp/current-repair-existing-retry-result.md <<EOF
          ## Current repair existing-retry proof result

          Run: \`${GITHUB_RUN_ID}\`
          Passed: \`${passed}\`
          Queue resumed: \`${resumed}\`
          Queue re-paused: \`${repaused}\`
          New seed sent: \`${seeded}\`
          Queue purged: \`${purged}\`
          Fast-lane ledger delta: \`${delta}\`
          Failure: \`${failure}\`

          Continuous catch-up remains stopped. Queue delivery must remain paused after this proof.
          EOF
          gh issue comment "$QUALIFICATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/current-repair-existing-retry-result.md

      - name: Upload existing-retry proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-repair-existing-retry-proof
          path: current-repair-existing-retry-evidence
          if-no-files-found: warn
          retention-days: 30
