name: P0 self-scheduled Queue production deploy

on:
  push:
    branches: [main]
    paths:
      - .github/p0-self-schedule-production-deploy-trigger

permissions:
  contents: read

concurrency:
  group: p0-emergency-production-worker-write
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      QUEUE_NAME: xrpl-lending-fast-lane
      QUEUE_ID: 2ae398f2edbf43749e45cd7ede77c6cd
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate self-scheduled Queue boundary
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "$(jq -r '.vars.APP_NETWORK' wrangler.jsonc)" = devnet
          test "$(jq -r '.vars.MAINNET_ENABLED' wrangler.jsonc)" = false
          test "$(jq -r '.triggers.crons | length' wrangler.jsonc)" -eq 0
          test "$(jq -r '.queues.producers[0].binding' wrangler.jsonc)" = FAST_LANE_QUEUE
          test "$(jq -r '.queues.producers[0].queue' wrangler.jsonc)" = "$QUEUE_NAME"
          test "$(jq -r '.queues.consumers[0].queue' wrangler.jsonc)" = "$QUEUE_NAME"
          test "$(jq -r '.queues.consumers[0].max_batch_size' wrangler.jsonc)" -eq 1
          test "$(jq -r '.queues.consumers[0].max_concurrency' wrangler.jsonc)" -eq 1
          test -f migrations/9999_fast_lane_queue_slots.sql

      - name: Verify production Queue attachment
        run: pnpm exec wrangler queues info "$QUEUE_NAME" | tee queue-info-before.txt

      - name: Build application
        run: pnpm build

      - name: Apply D1 migrations
        run: |
          pnpm exec wrangler d1 migrations apply xrpl-lending-monitor --remote | tee migration-apply.txt
          pnpm exec wrangler d1 execute xrpl-lending-monitor --remote --json \
            --command "SELECT name FROM sqlite_master WHERE type = 'table' AND name = 'fast_lane_queue_slots'" \
            > queue-slot-schema.json
          jq -e '[.[].results[]? | select(.name == "fast_lane_queue_slots")] | length == 1' \
            queue-slot-schema.json > /dev/null

      - name: Deploy self-scheduled Queue consumer
        run: pnpm exec wrangler deploy | tee deploy.txt

      - name: Verify Cron removed and Queue attached
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-monitor/schedules" \
            > deployed-worker-schedules.json
          jq -e '.success == true and (.result.schedules | length) == 0' \
            deployed-worker-schedules.json > /dev/null
          pnpm exec wrangler queues info "$QUEUE_NAME" | tee queue-info-deployed.txt

      - name: Bootstrap self-scheduled five-minute chain
        shell: bash
        run: |
          set -euo pipefail
          NOW_MS="$(date +%s%3N)"
          SLOT_MS="$((NOW_MS / 300000 * 300000))"
          ENQUEUED_AT="$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"
          jq -nc \
            --argjson scheduledTime "$SLOT_MS" \
            --arg cron 'queue-self-schedule' \
            --arg enqueuedAt "$ENQUEUED_AT" \
            '{body:{scheduledTime:$scheduledTime,cron:$cron,enqueuedAt:$enqueuedAt},content_type:"json"}' \
            > bootstrap-message.json
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @bootstrap-message.json \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues/${QUEUE_ID}/messages" \
            > bootstrap-response.json
          jq -e '.success == true' bootstrap-response.json > /dev/null

      - name: Upload self-schedule deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-self-schedule-production-deploy-evidence
          path: |
            queue-info-before.txt
            migration-apply.txt
            queue-slot-schema.json
            deploy.txt
            deployed-worker-schedules.json
            queue-info-deployed.txt
            bootstrap-message.json
            bootstrap-response.json
          if-no-files-found: warn
          retention-days: 14
