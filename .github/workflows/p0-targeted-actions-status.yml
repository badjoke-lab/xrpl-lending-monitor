name: P0 targeted Actions status

on:
  issues:
    types: [opened]

permissions:
  actions: read
  issues: write

jobs:
  status:
    if: startsWith(github.event.issue.title, 'P0 targeted Actions status')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Report overlay recovery parent, candidate, and cutover workflows
        shell: bash
        run: |
          set -euo pipefail

          gh api "repos/${REPOSITORY}/actions/runs/29678012062" > /tmp/parent.json
          gh api "repos/${REPOSITORY}/actions/workflows/rolling-checkpoint-candidate.yml/runs?event=workflow_dispatch&per_page=30" > /tmp/candidates.json
          gh api "repos/${REPOSITORY}/actions/workflows/rolling-checkpoint-live-cutover.yml/runs?event=workflow_dispatch&per_page=30" > /tmp/cutovers.json

          jq -s '{runs: (
            [.[0]]
            + [.[1].workflow_runs[] | select(.created_at >= "2026-07-19T07:22:54Z")]
            + [.[2].workflow_runs[] | select(.created_at >= "2026-07-19T07:22:54Z")]
          ) | map({id,name,event,display_title,status,conclusion,head_branch,head_sha,created_at,updated_at,run_attempt,html_url})}' \
            /tmp/parent.json /tmp/candidates.json /tmp/cutovers.json > /tmp/runs.json

          jq -r '.runs[].id' /tmp/runs.json > /tmp/run-ids.txt
          : > /tmp/jobs.ndjson
          while IFS= read -r run_id; do
            test -n "$run_id" || continue
            gh api "repos/${REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" \
              | jq --argjson run_id "$run_id" '{run_id:$run_id,jobs:[.jobs[] | {id,name,status,conclusion,started_at,completed_at,steps:[.steps[] | {name,status,conclusion,number}]}]}' \
              >> /tmp/jobs.ndjson
          done < /tmp/run-ids.txt
          jq -s '{run_jobs:.}' /tmp/jobs.ndjson > /tmp/jobs.json

          {
            echo 'Overlay recovery workflow runs:'
            echo
            echo '```json'
            jq . /tmp/runs.json
            echo '```'
            echo
            echo 'Overlay recovery jobs and steps:'
            echo
            echo '```json'
            jq . /tmp/jobs.json
            echo '```'
          } > /tmp/comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body-file /tmp/comment.md
