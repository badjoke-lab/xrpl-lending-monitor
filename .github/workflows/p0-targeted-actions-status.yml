name: P0 targeted Actions status

on:
  issues:
    types: [opened]

permissions:
  actions: read
  issues: write

jobs:
  status:
    if: startsWith(github.event.issue.title, 'P0 targeted Actions status')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Report collector and deploy workflows
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${REPOSITORY}/actions/runs?per_page=100" \
            --jq '{runs: [.workflow_runs[] | select(.name == "P0 self-scheduled Queue production deploy" or .name == "P0 redundant five-minute scheduler production deploy" or .name == "P0 tail Queue runtime" or .name == "Manual fast-lane collector fallback" or .name == "P0 run Actions collector" or .name == "P0 Queue production deploy" or .name == "P0 disable Worker cron deploy" or .name == "CI" or .name == "Release-native CI") | {id, name, event, display_title, status, conclusion, head_sha, created_at, updated_at, html_url}]}' \
            > /tmp/runs.json
          {
            echo 'Targeted workflow runs:'
            echo
            echo '```json'
            jq . /tmp/runs.json
            echo '```'
          } > /tmp/comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body-file /tmp/comment.md
