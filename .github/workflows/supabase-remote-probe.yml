name: Supabase Remote Probe Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/**'
      - 'src/collector/history-segments/**'
      - 'src/collector/incremental/**'
      - 'src/shared/portable-collector-*.ts'
      - 'scripts/verify-supabase-remote-probe.mjs'
      - '.github/workflows/supabase-remote-probe.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: supabase-remote-probe-deploy
  cancel-in-progress: false

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify required secret bindings
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_ID"
          test -n "$SUPABASE_DB_PASSWORD"
          [[ "$SUPABASE_PROJECT_ID" =~ ^[a-z]{20}$ ]]

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: latest

      - name: Bundle exact Devnet phase executor
        shell: bash
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          source_path='supabase/functions/xrpl-collector-tick/index.ts'
          bundle_path='/tmp/xrpl-collector-tick-index.ts'
          evidence_dir='supabase-remote-probe-evidence'
          mkdir -p "$evidence_dir"

          bun build "$source_path" \
            --target=browser \
            --format=esm \
            --outfile="$bundle_path"

          test -s "$bundle_path"
          BUNDLE_PATH="$bundle_path" HEAD_SHA="$HEAD_SHA" node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto'
          import { readFileSync, writeFileSync } from 'node:fs'

          const path = process.env.BUNDLE_PATH
          const headSha = process.env.HEAD_SHA
          const bundle = readFileSync(path, 'utf8')
          const unresolvedRelativeImport = /(?:from\s*|import\s*\()\s*['"]\.{1,2}\//u
          if (unresolvedRelativeImport.test(bundle)) {
            throw new Error('generated Supabase bundle retains a relative import')
          }
          if (!bundle.includes('Deno.serve')) {
            throw new Error('generated Supabase bundle does not contain the Edge entrypoint')
          }
          const evidence = {
            schemaVersion: 1,
            source: 'supabase/functions/xrpl-collector-tick/index.ts',
            headSha,
            bytes: Buffer.byteLength(bundle),
            sha256: createHash('sha256').update(bundle).digest('hex'),
            relativeImports: 0,
            denoServeEntrypoint: true,
          }
          writeFileSync(
            'supabase-remote-probe-evidence/bundle.json',
            `${JSON.stringify(evidence, null, 2)}\n`,
          )
          NODE

          cp "$bundle_path" "$source_path"

      - name: Link exact Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply pending migrations
        run: supabase db push --linked --yes

      - name: Deploy exact Devnet phase executor bundle
        run: >-
          supabase functions deploy xrpl-collector-tick
          --project-ref "$SUPABASE_PROJECT_ID"
          --use-api
          --no-verify-jwt

      - name: Verify repeated remote portable phase execution
        run: node scripts/verify-supabase-remote-probe.mjs

      - name: Upload sanitized remote evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-remote-probe-evidence
          path: supabase-remote-probe-evidence
          if-no-files-found: warn
          retention-days: 7

      - name: Publish sanitized run locator
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' > /tmp/supabase-run-comment.md
          import { existsSync, readFileSync } from 'node:fs'

          const runStatus = process.env.RUN_STATUS ?? 'unknown'
          const runId = process.env.RUN_ID ?? 'unknown'
          const runUrl = process.env.RUN_URL ?? ''
          const headSha = process.env.HEAD_SHA ?? 'unknown'
          const bundlePath = 'supabase-remote-probe-evidence/bundle.json'
          const verifiedPath = 'supabase-remote-probe-evidence/verified-health.json'
          const failedPath = 'supabase-remote-probe-evidence/failed-verification.json'

          const lines = [
            '## Supabase deployment verification',
            '',
            `- run: [${runId}](${runUrl})`,
            `- commit: \`${headSha}\``,
            `- job status: \`${runStatus}\``,
          ]

          if (existsSync(bundlePath)) {
            const bundle = JSON.parse(readFileSync(bundlePath, 'utf8'))
            lines.push(
              `- bundle bytes: \`${String(bundle?.bytes ?? 'unknown')}\``,
              `- bundle sha256: \`${String(bundle?.sha256 ?? 'unknown')}\``,
              `- unresolved relative imports: \`${String(bundle?.relativeImports ?? 'unknown')}\``,
            )
          }

          if (existsSync(verifiedPath)) {
            const evidence = JSON.parse(readFileSync(verifiedPath, 'utf8'))
            const runtime = evidence?.health?.runtime ?? null
            const phase = evidence?.health?.phaseChain ?? null
            const watermark = phase?.watermark ?? null
            lines.push(
              '- verifier: `success`',
              `- evidence schema: \`${String(evidence?.schemaVersion ?? 'unknown')}\``,
              `- verified at: \`${String(evidence?.verifiedAt ?? 'unknown')}\``,
              `- verifier attempt: \`${String(evidence?.attempt ?? 'unknown')}\``,
              `- completed ticks: \`${String(runtime?.tick_count ?? 'unknown')}\``,
              `- consecutive failures: \`${String(runtime?.consecutive_failures ?? 'unknown')}\``,
              `- phase watermark ledger: \`${String(watermark?.ledger_index ?? 'not available')}\``,
              `- phase watermark work: \`${String(watermark?.work_id ?? 'not available')}\``,
            )
          } else if (existsSync(failedPath)) {
            const evidence = JSON.parse(readFileSync(failedPath, 'utf8'))
            lines.push(
              '- verifier: `failed`',
              `- failed at: \`${String(evidence?.failedAt ?? 'unknown')}\``,
              `- reason: \`${String(evidence?.reason ?? 'unknown').slice(0, 500)}\``,
            )
          } else {
            lines.push('- verifier: `not reached or no sanitized evidence produced`')
          }

          console.log(`${lines.join('\n')}\n`)
          NODE
          gh issue comment 1109 --repo "$GITHUB_REPOSITORY" --body-file /tmp/supabase-run-comment.md
