name: Supabase Remote Probe Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/**'
      - 'src/collector/history-segments/**'
      - 'src/collector/incremental/**'
      - 'src/shared/portable-collector-*.ts'
      - 'scripts/verify-supabase-remote-probe.mjs'
      - 'scripts/verify-supabase-committed-reader.mjs'
      - 'scripts/verify-supabase-historical-witness.mjs'
      - 'scripts/verify-supabase-multichunk-witness.mjs'
      - 'scripts/verify-supabase-complete-state-transfer.mjs'
      - 'scripts/verify-supabase-restore-continuation.mjs'
      - 'scripts/verify-supabase-remote-fault-qualification.mjs'
      - 'scripts/verify-supabase-throughput-resource-baseline.mjs'
      - 'scripts/verify-supabase-catchup-throughput.mjs'
      - 'scripts/verify-supabase-steady-throughput.mjs'
      - 'scripts/verify-supabase-resource-headroom-guard.mjs'
      - 'scripts/record-supabase-external-resource-snapshot.mjs'
      - 'scripts/publish-supabase-run-locator.mjs'
      - 'scripts/publish-supabase-steady-run-locator.mjs'
      - 'scripts/publish-supabase-resource-run-locator.mjs'
      - '.github/workflows/supabase-remote-probe.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: supabase-remote-probe-deploy
  cancel-in-progress: false

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify required secret bindings
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_ID"
          test -n "$SUPABASE_DB_PASSWORD"
          [[ "$SUPABASE_PROJECT_ID" =~ ^[a-z]{20}$ ]]

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: latest

      - name: Bundle exact Devnet executors and qualification readers
        shell: bash
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          evidence_dir='supabase-remote-probe-evidence'
          mkdir -p "$evidence_dir"

          bundle_function() {
            local source_path="$1"
            local bundle_path="$2"
            local evidence_path="$3"

            bun build "$source_path" \
              --target=browser \
              --format=esm \
              --outfile="$bundle_path"

            test -s "$bundle_path"
            SOURCE_PATH="$source_path" BUNDLE_PATH="$bundle_path" EVIDENCE_PATH="$evidence_path" HEAD_SHA="$HEAD_SHA" node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto'
          import { readFileSync, writeFileSync } from 'node:fs'

          const sourcePath = process.env.SOURCE_PATH
          const bundlePath = process.env.BUNDLE_PATH
          const evidencePath = process.env.EVIDENCE_PATH
          const headSha = process.env.HEAD_SHA
          const bundle = readFileSync(bundlePath, 'utf8')
          const unresolvedRelativeImport = /(?:from\s*|import\s*\()\s*['"]\.{1,2}\//u
          if (unresolvedRelativeImport.test(bundle)) {
            throw new Error(`generated Supabase bundle retains a relative import: ${sourcePath}`)
          }
          if (bundle.includes('cloudflare:')) {
            throw new Error(`generated Supabase bundle contains a Cloudflare runtime import: ${sourcePath}`)
          }
          if (!bundle.includes('Deno.serve')) {
            throw new Error(`generated Supabase bundle does not contain the Edge entrypoint: ${sourcePath}`)
          }
          const evidence = {
            schemaVersion: 1,
            source: sourcePath,
            headSha,
            bytes: Buffer.byteLength(bundle),
            sha256: createHash('sha256').update(bundle).digest('hex'),
            relativeImports: 0,
            cloudflareImports: 0,
            denoServeEntrypoint: true,
          }
          writeFileSync(evidencePath, `${JSON.stringify(evidence, null, 2)}\n`)
          NODE

            cp "$bundle_path" "$source_path"
          }

          bundle_function 'supabase/functions/xrpl-collector-tick/index.ts' '/tmp/xrpl-collector-tick-index.ts' "$evidence_dir/bundle.json"
          bundle_function 'supabase/functions/xrpl-committed-reader/index.ts' '/tmp/xrpl-committed-reader-index.ts' "$evidence_dir/reader-bundle.json"
          bundle_function 'supabase/functions/xrpl-historical-witness/index.ts' '/tmp/xrpl-historical-witness-index.ts' "$evidence_dir/historical-loader-bundle.json"
          bundle_function 'supabase/functions/xrpl-historical-witness-reader/index.ts' '/tmp/xrpl-historical-witness-reader-index.ts' "$evidence_dir/historical-reader-bundle.json"
          bundle_function 'supabase/functions/xrpl-multichunk-witness/index.ts' '/tmp/xrpl-multichunk-witness-index.ts' "$evidence_dir/multichunk-executor-bundle.json"
          bundle_function 'supabase/functions/xrpl-multichunk-witness-reader/index.ts' '/tmp/xrpl-multichunk-witness-reader-index.ts' "$evidence_dir/multichunk-reader-bundle.json"
          bundle_function 'supabase/functions/xrpl-complete-state-transfer/index.ts' '/tmp/xrpl-complete-state-transfer-index.ts' "$evidence_dir/complete-state-transfer-bundle.json"
          bundle_function 'supabase/functions/xrpl-restore-continuation/index.ts' '/tmp/xrpl-restore-continuation-index.ts' "$evidence_dir/restore-continuation-bundle.json"
          bundle_function 'supabase/functions/xrpl-remote-fault-qualification/index.ts' '/tmp/xrpl-remote-fault-qualification-index.ts' "$evidence_dir/remote-fault-qualification-bundle.json"
          bundle_function 'supabase/functions/xrpl-throughput-resource-baseline/index.ts' '/tmp/xrpl-throughput-resource-baseline-index.ts' "$evidence_dir/throughput-resource-baseline-bundle.json"
          bundle_function 'supabase/functions/xrpl-catchup-throughput/index.ts' '/tmp/xrpl-catchup-throughput-index.ts' "$evidence_dir/catchup-throughput-bundle.json"
          bundle_function 'supabase/functions/xrpl-steady-batch-tick/index.ts' '/tmp/xrpl-steady-batch-tick-index.ts' "$evidence_dir/steady-batch-tick-bundle.json"
          bundle_function 'supabase/functions/xrpl-steady-throughput-qualification/index.ts' '/tmp/xrpl-steady-throughput-qualification-index.ts' "$evidence_dir/steady-throughput-qualification-bundle.json"
          bundle_function 'supabase/functions/xrpl-resource-headroom-guard/index.ts' '/tmp/xrpl-resource-headroom-guard-index.ts' "$evidence_dir/resource-headroom-guard-bundle.json"

      - name: Link exact Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Rotate one-run committed reader verifier token
        shell: bash
        run: |
          set -euo pipefail
          verifier_token="$(openssl rand -hex 32)"
          echo "::add-mask::${verifier_token}"
          supabase secrets set XRPL_READER_VERIFY_TOKEN="${verifier_token}" --project-ref "$SUPABASE_PROJECT_ID"
          echo "XRPL_READER_VERIFY_TOKEN=${verifier_token}" >> "$GITHUB_ENV"

      - name: Apply pending migrations
        run: supabase db push --linked --yes

      - name: Deploy exact Devnet phase executor bundle
        run: supabase functions deploy xrpl-collector-tick --project-ref "$SUPABASE_PROJECT_ID" --use-api --no-verify-jwt
      - name: Deploy qualification-only committed reader bundle
        run: supabase functions deploy xrpl-committed-reader --project-ref "$SUPABASE_PROJECT_ID" --use-api --no-verify-jwt
      - name: Deploy isolated historical witness loader bundle
        run: supabase functions deploy xrpl-historical-witness --project-ref "$SUPABASE_PROJECT_ID" --use-api --no-verify-jwt
      - name: Deploy isolated historical witness reader bundle
        run: supabase functions deploy xrpl-historical-witness-reader --project-ref "$SUPABASE_PROJECT_ID" --use-api --no-verify-jwt
      - name: Deploy isolated standard-phase multi-chunk executor bundle
        run: supabase functions deploy xrpl-multichunk-witness --project-ref "$SUPABASE_PROJECT_ID" --use-api --no-verify-jwt
      - name: Deploy isolated standard-phase multi-chunk reader bundle
        run: supabase functions deploy xrpl-multichunk-witness-reader --project-ref "$SUPABASE_PROJECT_ID" --use-api --no-verify-jwt
      - name: Deploy isolated complete-state transfer bundle
        run: supabase functions deploy xrpl-complete-state-transfer --project-ref "$SUPABASE_PROJECT_ID" --use-api --no-verify-jwt
      - name: Deploy isolated post-restore continuation bundle
        run: supabase functions deploy xrpl-restore-continuation --project-ref "$SUPABASE_PROJECT_ID" --use-api --no-verify-jwt
      - name: Deploy isolated remote fault qualification bundle
        run: supabase functions deploy xrpl-remote-fault-qualification --project-ref "$SUPABASE_PROJECT_ID" --use-api --no-verify-jwt
      - name: Deploy throughput and resource baseline bundle
        run: supabase functions deploy xrpl-throughput-resource-baseline --project-ref "$SUPABASE_PROJECT_ID" --use-api --no-verify-jwt
      - name: Deploy isolated catch-up throughput bundle
        run: supabase functions deploy xrpl-catchup-throughput --project-ref "$SUPABASE_PROJECT_ID" --use-api --no-verify-jwt
      - name: Deploy network steady batch tick bundle
        run: supabase functions deploy xrpl-steady-batch-tick --project-ref "$SUPABASE_PROJECT_ID" --use-api --no-verify-jwt
      - name: Deploy network steady qualification bundle
        run: supabase functions deploy xrpl-steady-throughput-qualification --project-ref "$SUPABASE_PROJECT_ID" --use-api --no-verify-jwt
      - name: Deploy resource headroom guard bundle
        run: supabase functions deploy xrpl-resource-headroom-guard --project-ref "$SUPABASE_PROJECT_ID" --use-api --no-verify-jwt

      - name: Verify repeated remote portable phase execution
        run: node scripts/verify-supabase-remote-probe.mjs
      - name: Verify remote immutable committed reader
        run: node scripts/verify-supabase-committed-reader.mjs
      - name: Verify isolated historical witness persistence and reader
        run: node scripts/verify-supabase-historical-witness.mjs
      - name: Verify isolated standard-phase multi-chunk execution and reader
        run: node scripts/verify-supabase-multichunk-witness.mjs
      - name: Verify isolated complete-state export and typed restore
        run: node scripts/verify-supabase-complete-state-transfer.mjs
      - name: Verify isolated post-restore continuation
        run: node scripts/verify-supabase-restore-continuation.mjs
      - name: Verify isolated remote fault qualification
        run: node scripts/verify-supabase-remote-fault-qualification.mjs
      - name: Verify throughput and resource baseline
        run: node scripts/verify-supabase-throughput-resource-baseline.mjs
      - name: Verify isolated catch-up throughput
        run: node scripts/verify-supabase-catchup-throughput.mjs
      - name: Verify network steady throughput
        run: node scripts/verify-supabase-steady-throughput.mjs
      - name: Verify resource headroom fail-closed guards
        run: node scripts/verify-supabase-resource-headroom-guard.mjs

      - name: Upload sanitized remote evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-remote-probe-evidence
          path: supabase-remote-probe-evidence
          if-no-files-found: warn
          retention-days: 7

      - name: Publish sanitized run locator
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # supabase-remote-probe-evidence/verified-health.json
          # supabase-remote-probe-evidence/failed-verification.json
          # verified-reader.json / failed-reader-verification.json
          # verified-historical-witness.json / failed-historical-witness-verification.json
          # verified-multichunk-witness.json / failed-multichunk-witness-verification.json
          # verified-complete-state-transfer.json / failed-complete-state-transfer-verification.json
          # verified-restore-continuation.json / failed-restore-continuation-verification.json
          # verified-remote-fault-qualification.json / failed-remote-fault-qualification-verification.json
          # verified-throughput-resource-baseline.json / failed-throughput-resource-baseline-verification.json
          # verified-catchup-throughput.json / failed-catchup-throughput-verification.json
          # verified-steady-throughput.json / failed-steady-throughput-verification.json
          # verified-resource-headroom-guard.json / failed-resource-headroom-guard-verification.json
          # phase watermark ledger / consecutive failures
          # historical witness verifier: `success`
          # multi-chunk witness verifier: `success`
          # complete-state transfer verifier: `success`
          # restore continuation verifier: `success`
          # remote fault qualification verifier: `success`
          # throughput resource baseline verifier: `success`
          # catch-up throughput verifier: `success`
          # steady throughput verifier: `success`
          # resource headroom guard verifier: `success`
          node scripts/publish-supabase-run-locator.mjs > /tmp/supabase-run-comment.md
          node scripts/publish-supabase-steady-run-locator.mjs >> /tmp/supabase-run-comment.md
          node scripts/publish-supabase-resource-run-locator.mjs >> /tmp/supabase-run-comment.md
          gh issue comment 1109 --repo "$GITHUB_REPOSITORY" --body-file /tmp/supabase-run-comment.md