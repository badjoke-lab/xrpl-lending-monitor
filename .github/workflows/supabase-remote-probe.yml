name: Supabase Remote Probe Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/**'
      - 'src/collector/history-segments/**'
      - 'src/collector/incremental/**'
      - 'src/shared/portable-collector-*.ts'
      - 'scripts/verify-supabase-remote-probe.mjs'
      - 'scripts/verify-supabase-committed-reader.mjs'
      - 'scripts/verify-supabase-historical-witness.mjs'
      - '.github/workflows/supabase-remote-probe.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: supabase-remote-probe-deploy
  cancel-in-progress: false

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify required secret bindings
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_ID"
          test -n "$SUPABASE_DB_PASSWORD"
          [[ "$SUPABASE_PROJECT_ID" =~ ^[a-z]{20}$ ]]

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: latest

      - name: Bundle exact Devnet executors and qualification readers
        shell: bash
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          evidence_dir='supabase-remote-probe-evidence'
          mkdir -p "$evidence_dir"

          bundle_function() {
            local source_path="$1"
            local bundle_path="$2"
            local evidence_path="$3"

            bun build "$source_path" \
              --target=browser \
              --format=esm \
              --outfile="$bundle_path"

            test -s "$bundle_path"
            SOURCE_PATH="$source_path" BUNDLE_PATH="$bundle_path" EVIDENCE_PATH="$evidence_path" HEAD_SHA="$HEAD_SHA" node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto'
          import { readFileSync, writeFileSync } from 'node:fs'

          const sourcePath = process.env.SOURCE_PATH
          const bundlePath = process.env.BUNDLE_PATH
          const evidencePath = process.env.EVIDENCE_PATH
          const headSha = process.env.HEAD_SHA
          const bundle = readFileSync(bundlePath, 'utf8')
          const unresolvedRelativeImport = /(?:from\s*|import\s*\()\s*['"]\.{1,2}\//u
          if (unresolvedRelativeImport.test(bundle)) {
            throw new Error(`generated Supabase bundle retains a relative import: ${sourcePath}`)
          }
          if (bundle.includes('cloudflare:')) {
            throw new Error(`generated Supabase bundle contains a Cloudflare runtime import: ${sourcePath}`)
          }
          if (!bundle.includes('Deno.serve')) {
            throw new Error(`generated Supabase bundle does not contain the Edge entrypoint: ${sourcePath}`)
          }
          const evidence = {
            schemaVersion: 1,
            source: sourcePath,
            headSha,
            bytes: Buffer.byteLength(bundle),
            sha256: createHash('sha256').update(bundle).digest('hex'),
            relativeImports: 0,
            cloudflareImports: 0,
            denoServeEntrypoint: true,
          }
          writeFileSync(evidencePath, `${JSON.stringify(evidence, null, 2)}\n`)
          NODE

            cp "$bundle_path" "$source_path"
          }

          bundle_function \
            'supabase/functions/xrpl-collector-tick/index.ts' \
            '/tmp/xrpl-collector-tick-index.ts' \
            "$evidence_dir/bundle.json"

          bundle_function \
            'supabase/functions/xrpl-committed-reader/index.ts' \
            '/tmp/xrpl-committed-reader-index.ts' \
            "$evidence_dir/reader-bundle.json"

          bundle_function \
            'supabase/functions/xrpl-historical-witness/index.ts' \
            '/tmp/xrpl-historical-witness-index.ts' \
            "$evidence_dir/historical-loader-bundle.json"

          bundle_function \
            'supabase/functions/xrpl-historical-witness-reader/index.ts' \
            '/tmp/xrpl-historical-witness-reader-index.ts' \
            "$evidence_dir/historical-reader-bundle.json"

      - name: Link exact Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Rotate one-run committed reader verifier token
        shell: bash
        run: |
          set -euo pipefail
          verifier_token="$(openssl rand -hex 32)"
          echo "::add-mask::${verifier_token}"
          supabase secrets set XRPL_READER_VERIFY_TOKEN="${verifier_token}" --project-ref "$SUPABASE_PROJECT_ID"
          echo "XRPL_READER_VERIFY_TOKEN=${verifier_token}" >> "$GITHUB_ENV"

      - name: Apply pending migrations
        run: supabase db push --linked --yes

      - name: Deploy exact Devnet phase executor bundle
        run: >-
          supabase functions deploy xrpl-collector-tick
          --project-ref "$SUPABASE_PROJECT_ID"
          --use-api
          --no-verify-jwt

      - name: Deploy qualification-only committed reader bundle
        run: >-
          supabase functions deploy xrpl-committed-reader
          --project-ref "$SUPABASE_PROJECT_ID"
          --use-api
          --no-verify-jwt

      - name: Deploy isolated historical witness loader bundle
        run: >-
          supabase functions deploy xrpl-historical-witness
          --project-ref "$SUPABASE_PROJECT_ID"
          --use-api
          --no-verify-jwt

      - name: Deploy isolated historical witness reader bundle
        run: >-
          supabase functions deploy xrpl-historical-witness-reader
          --project-ref "$SUPABASE_PROJECT_ID"
          --use-api
          --no-verify-jwt

      - name: Verify repeated remote portable phase execution
        run: node scripts/verify-supabase-remote-probe.mjs

      - name: Verify remote immutable committed reader
        run: node scripts/verify-supabase-committed-reader.mjs

      - name: Verify isolated historical witness persistence and reader
        run: node scripts/verify-supabase-historical-witness.mjs

      - name: Upload sanitized remote evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-remote-probe-evidence
          path: supabase-remote-probe-evidence
          if-no-files-found: warn
          retention-days: 7

      - name: Publish sanitized run locator
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' > /tmp/supabase-run-comment.md
          import { existsSync, readFileSync } from 'node:fs'

          const runStatus = process.env.RUN_STATUS ?? 'unknown'
          const runId = process.env.RUN_ID ?? 'unknown'
          const runUrl = process.env.RUN_URL ?? ''
          const headSha = process.env.HEAD_SHA ?? 'unknown'
          const bundlePath = 'supabase-remote-probe-evidence/bundle.json'
          const readerBundlePath = 'supabase-remote-probe-evidence/reader-bundle.json'
          const historicalLoaderBundlePath = 'supabase-remote-probe-evidence/historical-loader-bundle.json'
          const historicalReaderBundlePath = 'supabase-remote-probe-evidence/historical-reader-bundle.json'
          const verifiedPath = 'supabase-remote-probe-evidence/verified-health.json'
          const failedPath = 'supabase-remote-probe-evidence/failed-verification.json'
          const verifiedReaderPath = 'supabase-remote-probe-evidence/verified-reader.json'
          const failedReaderPath = 'supabase-remote-probe-evidence/failed-reader-verification.json'
          const verifiedHistoricalPath = 'supabase-remote-probe-evidence/verified-historical-witness.json'
          const failedHistoricalPath = 'supabase-remote-probe-evidence/failed-historical-witness-verification.json'

          const lines = [
            '## Supabase deployment verification',
            '',
            `- run: [${runId}](${runUrl})`,
            `- commit: \`${headSha}\``,
            `- job status: \`${runStatus}\``,
          ]

          function appendBundle(label, path) {
            if (!existsSync(path)) return
            const bundle = JSON.parse(readFileSync(path, 'utf8'))
            lines.push(
              `- ${label} bytes: \`${String(bundle?.bytes ?? 'unknown')}\``,
              `- ${label} sha256: \`${String(bundle?.sha256 ?? 'unknown')}\``,
              `- ${label} relative imports: \`${String(bundle?.relativeImports ?? 'unknown')}\``,
              `- ${label} Cloudflare imports: \`${String(bundle?.cloudflareImports ?? 'unknown')}\``,
            )
          }

          appendBundle('collector bundle', bundlePath)
          appendBundle('committed reader bundle', readerBundlePath)
          appendBundle('historical loader bundle', historicalLoaderBundlePath)
          appendBundle('historical reader bundle', historicalReaderBundlePath)

          if (existsSync(verifiedPath)) {
            const evidence = JSON.parse(readFileSync(verifiedPath, 'utf8'))
            const runtime = evidence?.health?.runtime ?? null
            const phase = evidence?.health?.phaseChain ?? null
            const watermark = phase?.watermark ?? null
            lines.push(
              '- verifier: `success`',
              `- evidence schema: \`${String(evidence?.schemaVersion ?? 'unknown')}\``,
              `- verified at: \`${String(evidence?.verifiedAt ?? 'unknown')}\``,
              `- verifier attempt: \`${String(evidence?.attempt ?? 'unknown')}\``,
              `- completed ticks: \`${String(runtime?.tick_count ?? 'unknown')}\``,
              `- consecutive failures: \`${String(runtime?.consecutive_failures ?? 'unknown')}\``,
              `- phase watermark ledger: \`${String(watermark?.ledger_index ?? 'not available')}\``,
              `- phase watermark work: \`${String(watermark?.work_id ?? 'not available')}\``,
            )
          } else if (existsSync(failedPath)) {
            const evidence = JSON.parse(readFileSync(failedPath, 'utf8'))
            lines.push(
              '- verifier: `failed`',
              `- failed at: \`${String(evidence?.failedAt ?? 'unknown')}\``,
              `- reason: \`${String(evidence?.reason ?? 'unknown').slice(0, 500)}\``,
            )
          } else {
            lines.push('- verifier: `not reached or no sanitized evidence produced`')
          }

          if (existsSync(verifiedReaderPath)) {
            const evidence = JSON.parse(readFileSync(verifiedReaderPath, 'utf8'))
            lines.push(
              '- committed reader verifier: `success`',
              `- reader verified at: \`${String(evidence?.verifiedAt ?? 'unknown')}\``,
              `- reader verifier attempt: \`${String(evidence?.attempt ?? 'unknown')}\``,
              `- reader fence ledger: \`${String(evidence?.fence?.ledgerIndex ?? 'not available')}\``,
              `- reader fence work: \`${String(evidence?.fence?.workId ?? 'not available')}\``,
            )
          } else if (existsSync(failedReaderPath)) {
            const evidence = JSON.parse(readFileSync(failedReaderPath, 'utf8'))
            lines.push(
              '- committed reader verifier: `failed`',
              `- reader failed at: \`${String(evidence?.failedAt ?? 'unknown')}\``,
              `- reader reason: \`${String(evidence?.reason ?? 'unknown').slice(0, 500)}\``,
            )
          } else {
            lines.push('- committed reader verifier: `not reached or no sanitized evidence produced`')
          }

          if (existsSync(verifiedHistoricalPath)) {
            const evidence = JSON.parse(readFileSync(verifiedHistoricalPath, 'utf8'))
            lines.push(
              '- historical witness verifier: `success`',
              `- historical verified at: \`${String(evidence?.verifiedAt ?? 'unknown')}\``,
              `- historical records: \`${String(evidence?.fullPagination?.rowCount ?? 'unknown')}\``,
              `- historical page sizes: \`${JSON.stringify(evidence?.fullPagination?.pageSizes ?? [])}\``,
              `- historical class counts: \`${JSON.stringify(evidence?.classCounts ?? {})}\``,
              `- historical relationship rows: \`${String(evidence?.relationship?.rowCount ?? 'unknown')}\``,
              `- historical fence ledger: \`${String(evidence?.fence?.ledgerIndex ?? 'unknown')}\``,
            )
          } else if (existsSync(failedHistoricalPath)) {
            const evidence = JSON.parse(readFileSync(failedHistoricalPath, 'utf8'))
            lines.push(
              '- historical witness verifier: `failed`',
              `- historical failed at: \`${String(evidence?.failedAt ?? 'unknown')}\``,
              `- historical reason: \`${String(evidence?.reason ?? 'unknown').slice(0, 500)}\``,
            )
          } else {
            lines.push('- historical witness verifier: `not reached or no sanitized evidence produced`')
          }

          console.log(`${lines.join('\n')}\n`)
          NODE
          gh issue comment 1109 --repo "$GITHUB_REPOSITORY" --body-file /tmp/supabase-run-comment.md
