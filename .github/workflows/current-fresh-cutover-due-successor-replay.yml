name: Current fresh due-successor cutover replay

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: >-
    ${{
      github.event.issue.number == 995 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      github.event.comment.body == '/current-fresh-cutover-due-successor-replay authorization_comment=5578273221' &&
      'current-fresh-cutover-production-write' ||
      format('current-fresh-cutover-due-successor-replay-noop-{0}', github.run_id)
    }}
  cancel-in-progress: false

env:
  QUALIFICATION_ISSUE: '995'
  QUEUE_ID: 2ae398f2edbf43749e45cd7ede77c6cd
  DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
  PRODUCTION_BASE: https://xrpl-lending-monitor.badjoke-lab.workers.dev
  RUNTIME_SOURCE_SHA: 07af3846ac056b892a23ef6146cc986bdf753dc1
  EXPECTED_OLD_VERSION: 6c9af7da-863e-4afa-8711-fd28d18bc05e
  CUTOVER_DATA_BRANCH: current-state-fresh-replacement-cutover-data
  CUTOVER_DATA_COMMIT: 4fad78c2b8e5dc6e83363d9c8239bbfd6010e352
  CUTOVER_PAYLOAD_COMMIT: d9ba9fc769ab7ec8002d6ab56f54801f7967800b
  TARGET_EPOCH: devnet-3371675
  TARGET_SNAPSHOT: devnet-5101160-ea7a044b3eea
  TARGET_LEDGER: '5101160'
  TARGET_HASH: EA7A044B3EEA548AA9C12831104CA8AFEB6FE14C0FE96CA95E96E8C789234401
  TARGET_MANIFEST: 260aa84de5597200ab619d4112e60af7ae04c58ac0b17faa19799898d9b97a45
  EXPECTED_SUCCESSOR: '1788788700000'
  EXPECTED_SUCCESSOR_CRON: queue-catch-up
  EXPECTED_QUEUE_BYTES: '95'
  AUTHORIZATION_COMMENT_ID: '5578273221'
  AUTHORIZED_SOURCE_COMMIT: 0ee4852e3b6a2cccc60384d52c9aa91a3ea761d3
  AUTHORIZED_MANAGER_SHA256: 07630714a42095889b34e39411008676040e39bbd55269c5f4f784eb6b6e5e76
  AUTHORIZED_STATE: 4f7b1d182d74d30987a7e7b9f1986a01f6961f7f947fc39b78cb9f3977fcc90c
  AUTHORIZED_DEPLOYMENT: 6c9af7da-863e-4afa-8711-fd28d18bc05e
  AUTHORIZED_MESSAGE_ID: 46d929d18d579effab3d99a610fefda2
  AUTHORIZED_BODY_SHA: 40718c6cc98ec63441c5c905cad74cfef2cf08da24d373e1af15871070cac873
  AUTHORIZED_PREPARE_RUN: '34180706563'
  AUTHORIZED_EXPIRES: 2026-09-08T04:37:58Z
  AUTHORIZED_NONCE: c6701abf7927c1c7
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  GH_TOKEN: ${{ github.token }}

jobs:
  replay:
    if: >-
      github.event.issue.number == 995 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      github.event.comment.body == '/current-fresh-cutover-due-successor-replay authorization_comment=5578273221'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0ee4852e3b6a2cccc60384d52c9aa91a3ea761d3
          fetch-depth: 1
          persist-credentials: false

      - name: Bind historical authorization comment exactly
        id: authorization
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${AUTHORIZATION_COMMENT_ID}" > /tmp/authorization.json
          jq -e '
            .id == 5578273221
            and .user.login == "badjoke-lab"
            and .author_association == "OWNER"
            and .created_at == "2026-09-08T02:38:43Z"
          ' /tmp/authorization.json >/dev/null
          body="$(jq -r '.body' /tmp/authorization.json)"
          expected="/current-fresh-cutover-due-successor-authorize commit=${AUTHORIZED_SOURCE_COMMIT} manager=${AUTHORIZED_MANAGER_SHA256} state=${AUTHORIZED_STATE} candidate=${CUTOVER_DATA_COMMIT} deployment=${AUTHORIZED_DEPLOYMENT} target=${TARGET_LEDGER} snapshot=${TARGET_SNAPSHOT} manifest=${TARGET_MANIFEST} successor=${EXPECTED_SUCCESSOR} queue_bytes=${EXPECTED_QUEUE_BYTES} message_id=${AUTHORIZED_MESSAGE_ID} body_sha=${AUTHORIZED_BODY_SHA} prepare_run=${AUTHORIZED_PREPARE_RUN} expires=${AUTHORIZED_EXPIRES} nonce=${AUTHORIZED_NONCE}"
          test "$body" = "$expected"
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_SOURCE_COMMIT"
          test "$(sha256sum .github/workflows/current-fresh-cutover-due-successor-control.yml | awk '{print $1}')" = "$AUTHORIZED_MANAGER_SHA256"
          auth_epoch="$(date -u -d "$(jq -r '.created_at' /tmp/authorization.json)" +%s)"
          expires_epoch="$(date -u -d "$AUTHORIZED_EXPIRES" +%s)"
          test "$auth_epoch" -lt "$expires_epoch"
          test $((expires_epoch - auth_epoch)) -le 7200
          printf 'body=%s\n' "$body" >> "$GITHUB_OUTPUT"

      - name: Verify exact prior proposal and original authorization uniqueness
        env:
          AUTHORIZATION_BODY: ${{ steps.authorization.outputs.body }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${QUALIFICATION_ISSUE}/comments?per_page=100" | jq -s 'add' > /tmp/comments.json
          EXPECTED="$AUTHORIZATION_BODY" PREPARE="$AUTHORIZED_PREPARE_RUN" AUTH_ID="$AUTHORIZATION_COMMENT_ID" node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const comments = JSON.parse(readFileSync('/tmp/comments.json', 'utf8'))
          const proposals = comments.filter((c) => c?.user?.login === 'github-actions[bot]' && typeof c?.body === 'string' && c.body.includes(`Preparation run: \`${process.env.PREPARE}\``) && c.body.includes(`\`${process.env.EXPECTED}\``))
          if (proposals.length !== 1) throw new Error(`expected one exact proposal, found ${proposals.length}`)
          const authorizations = comments.filter((c) => c?.user?.login === 'badjoke-lab' && c?.body === process.env.EXPECTED)
          if (authorizations.length !== 1 || Number(authorizations[0].id) !== Number(process.env.AUTH_ID)) throw new Error('original authorization is not unique')
          NODE

      - name: Verify immutable fresh target and unchanged authorized production source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$RUNTIME_SOURCE_SHA"
          git diff --quiet "$RUNTIME_SOURCE_SHA" HEAD -- src wrangler.jsonc package.json pnpm-lock.yaml
          test "$(jq -r '.triggers.crons | length' wrangler.jsonc)" -eq 0
          test "$(jq -r '.vars.APP_NETWORK' wrangler.jsonc)" = devnet
          test "$(jq -r '.vars.MAINNET_ENABLED' wrangler.jsonc)" = false
          test "$(gh api "repos/${GITHUB_REPOSITORY}/branches/${CUTOVER_DATA_BRANCH}" --jq '.commit.sha')" = "$CUTOVER_DATA_COMMIT"
          gh api "repos/${GITHUB_REPOSITORY}/contents/channel.json?ref=${CUTOVER_DATA_BRANCH}" --jq '.content' | tr -d '\n' | base64 -d > /tmp/channel.json
          gh api "repos/${GITHUB_REPOSITORY}/contents/fresh-replacement-base-summary.json?ref=${CUTOVER_DATA_BRANCH}" --jq '.content' | tr -d '\n' | base64 -d > /tmp/base-summary.json
          gh api "repos/${GITHUB_REPOSITORY}/contents/read-model/manifest.json?ref=${CUTOVER_DATA_BRANCH}" --jq '.content' | tr -d '\n' | base64 -d > /tmp/read-model-manifest.json
          jq -e --arg payload "$CUTOVER_PAYLOAD_COMMIT" --arg snapshot "$TARGET_SNAPSHOT" --arg manifest "$TARGET_MANIFEST" '.active.dataCommitSha == $payload and .active.snapshotId == $snapshot and .active.manifestSha256 == $manifest and .active.manifestPath == "read-model/manifest.json"' /tmp/channel.json >/dev/null
          jq -e --arg epoch "$TARGET_EPOCH" --arg snapshot "$TARGET_SNAPSHOT" --arg hash "$TARGET_HASH" --arg manifest "$TARGET_MANIFEST" --argjson ledger "$TARGET_LEDGER" '.epochId == $epoch and .snapshotId == $snapshot and .ledgerIndex == $ledger and .ledgerHash == $hash and .manifestSha256 == $manifest' /tmp/base-summary.json >/dev/null
          jq -e --arg epoch "$TARGET_EPOCH" --arg snapshot "$TARGET_SNAPSHOT" --arg hash "$TARGET_HASH" --arg manifest "$TARGET_MANIFEST" --argjson ledger "$TARGET_LEDGER" '.complete == true and .epochId == $epoch and .snapshotId == $snapshot and .ledgerIndex == $ledger and .ledgerHash == $hash and .manifestSha256 == $manifest' /tmp/read-model-manifest.json >/dev/null

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies and re-prove exact authorized state
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm build:deploy-assets
          git fetch --no-tags --depth=1 origin "$RUNTIME_SOURCE_SHA"
          git diff --quiet "$RUNTIME_SOURCE_SHA" HEAD -- src wrangler.jsonc package.json pnpm-lock.yaml
          test "$(gh api "repos/${GITHUB_REPOSITORY}/branches/${CUTOVER_DATA_BRANCH}" --jq '.commit.sha')" = "$CUTOVER_DATA_COMMIT"
          export STATE_ROOT=current-fresh-cutover-due-successor-replay
          scripts/current-fresh-cutover-due-successor-state.sh
          metadata="$STATE_ROOT/state-metadata.json"
          test "$(jq -r '.stateDigest' "$metadata")" = "$AUTHORIZED_STATE"
          test "$(jq -r '.deployment' "$metadata")" = "$AUTHORIZED_DEPLOYMENT"
          test "$(jq -r '.messageId' "$metadata")" = "$AUTHORIZED_MESSAGE_ID"
          test "$(jq -r '.bodySha256' "$metadata")" = "$AUTHORIZED_BODY_SHA"

      - name: Build ephemeral immutable fresh-target config
        shell: bash
        run: |
          set -euo pipefail
          jq --arg branch "$CUTOVER_DATA_BRANCH" --arg epoch "$TARGET_EPOCH" --arg snapshot "$TARGET_SNAPSHOT" --arg ledger "$TARGET_LEDGER" --arg hash "$TARGET_HASH" '
            .vars.CURRENT_STATE_GITHUB_BRANCH = $branch
            | .vars.CURRENT_STATE_REPLACEMENT_SNAPSHOT_ID = $snapshot
            | .vars.CURRENT_STATE_REPLACEMENT_GITHUB_BRANCH = $branch
            | .vars.REPLACEMENT_BASE_REBASE_ENABLED = "true"
            | .vars.REPLACEMENT_BASE_EPOCH_ID = $epoch
            | .vars.REPLACEMENT_BASE_SNAPSHOT_ID = $snapshot
            | .vars.REPLACEMENT_BASE_LEDGER_INDEX = $ledger
            | .vars.REPLACEMENT_BASE_LEDGER_HASH = $hash
          ' wrangler.jsonc > .wrangler-fresh-cutover-due-successor.json
          test "$(jq -r '.triggers.crons | length' .wrangler-fresh-cutover-due-successor.json)" -eq 0
          test "$(jq -r '.vars.APP_NETWORK' .wrangler-fresh-cutover-due-successor.json)" = devnet
          test "$(jq -r '.vars.MAINNET_ENABLED' .wrangler-fresh-cutover-due-successor.json)" = false
          test "$(jq -r '.vars.REPLACEMENT_BASE_LEDGER_INDEX' .wrangler-fresh-cutover-due-successor.json)" = "$TARGET_LEDGER"

      - name: Deploy fresh runtime and apply cutover through exact preview
        id: mutate
        shell: bash
        run: |
          set -euo pipefail
          ROOT=current-fresh-cutover-due-successor-replay
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          qbase="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues/${QUEUE_ID}"
          deployment_attempted=false
          cutover_applied=false
          rollback() {
            rc=$?
            if test "$deployment_attempted" = true && test "$cutover_applied" = false; then pnpm exec wrangler versions deploy "${AUTHORIZED_DEPLOYMENT}@100%" --yes || true; fi
            curl -fsS -X PATCH -H "$auth" -H 'Content-Type: application/json' "$qbase" -d '{"settings":{"delivery_paused":true}}' >/dev/null || true
            rm -f "${secret_file:-}" .wrangler-fresh-cutover-due-successor.json
            exit "$rc"
          }
          trap rollback ERR
          curl -fsS -H "$auth" "$qbase" | tee "$ROOT/queue-before-mutation.json" | jq -e '.success == true and .result.settings.delivery_paused == true' >/dev/null
          umask 077
          cutover_token="$(openssl rand -hex 32)"
          secret_file="$(mktemp)"
          jq -n --arg token "$cutover_token" '{REPLACEMENT_BASE_CUTOVER_TOKEN:$token}' > "$secret_file"
          pnpm exec wrangler versions upload --config .wrangler-fresh-cutover-due-successor.json --secrets-file "$secret_file" --message "Fresh Current due-successor cutover replay ${TARGET_LEDGER}" | tee "$ROOT/version-upload.txt"
          rm -f "$secret_file"
          new_version="$(sed -n 's/^Worker Version ID: //p' "$ROOT/version-upload.txt" | tail -1 | tr -d '\r')"
          preview_base="$(sed -n 's/^Version Preview URL: //p' "$ROOT/version-upload.txt" | tail -1 | tr -d '\r')"
          test -n "$new_version" && test -n "$preview_base"
          case "$preview_base" in https://*-xrpl-lending-monitor.badjoke-lab.workers.dev) ;; *) echo 'Unexpected preview URL' >&2; exit 1;; esac
          preview_status="${preview_base}/api/status/replacement-base-rebase"
          preview_ready=false
          for attempt in $(seq 1 30); do
            curl -fsS "$preview_status" > "$ROOT/preview-dry-run.json" || true
            if jq -e --arg epoch "$TARGET_EPOCH" --arg snapshot "$TARGET_SNAPSHOT" --arg hash "$TARGET_HASH" --argjson ledger "$TARGET_LEDGER" '.status == "ready" and .plan.action == "rebase" and .plan.cursorMode == "advance_to_target" and .target.epochId == $epoch and .target.snapshotId == $snapshot and .target.ledgerIndex == $ledger and .target.ledgerHash == $hash' "$ROOT/preview-dry-run.json" >/dev/null 2>&1; then preview_ready=true; break; fi
            sleep 2
          done
          test "$preview_ready" = true
          deployment_attempted=true
          pnpm exec wrangler versions deploy "${new_version}@100%" --yes | tee "$ROOT/version-deploy.txt"
          propagated=false
          for attempt in $(seq 1 60); do
            curl -fsS "$PRODUCTION_BASE/api/status/replacement-base-rebase" > "$ROOT/deployed-dry-run.json" || true
            if jq -e --arg epoch "$TARGET_EPOCH" --arg snapshot "$TARGET_SNAPSHOT" --arg hash "$TARGET_HASH" --argjson ledger "$TARGET_LEDGER" '.status == "ready" and .plan.action == "rebase" and .plan.cursorMode == "advance_to_target" and .target.epochId == $epoch and .target.snapshotId == $snapshot and .target.ledgerIndex == $ledger and .target.ledgerHash == $hash' "$ROOT/deployed-dry-run.json" >/dev/null 2>&1; then propagated=true; break; fi
            sleep 2
          done
          test "$propagated" = true
          curl -fsS -X POST -H "x-replacement-base-cutover-token: ${cutover_token}" "${preview_base}/api/operator/replacement-base-cutover" > "$ROOT/cutover-response.json"
          jq -e --arg epoch "$TARGET_EPOCH" --arg snapshot "$TARGET_SNAPSHOT" --arg hash "$TARGET_HASH" --argjson ledger "$TARGET_LEDGER" '.status == "cutover_applied" and .network == "devnet" and .rebase.status == "rebased" and .rebase.plan.action == "rebase" and .rebase.plan.cursorMode == "advance_to_target" and .target.epochId == $epoch and .target.snapshotId == $snapshot and .target.ledgerIndex == $ledger and .target.ledgerHash == $hash' "$ROOT/cutover-response.json" >/dev/null
          cutover_applied=true
          rm -f .wrangler-fresh-cutover-due-successor.json
          trap - ERR
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"
          echo "preview_base=$preview_base" >> "$GITHUB_OUTPUT"

      - name: Verify target cutover with exact physical successor preserved
        env:
          NEW_VERSION: ${{ steps.mutate.outputs.new_version }}
          PREVIEW_BASE: ${{ steps.mutate.outputs.preview_base }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT=current-fresh-cutover-due-successor-replay
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          qbase="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues/${QUEUE_ID}"
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query"
          query() { curl -fsS -H "$auth" -H 'Content-Type: application/json' "$api" -d "$(jq -n --arg sql "$1" '{sql:$sql}')"; }
          curl -fsS -H "$auth" "$qbase" > "$ROOT/queue-after.json"
          jq -e '.success == true and .result.settings.delivery_paused == true' "$ROOT/queue-after.json" >/dev/null
          curl -fsS -H "$auth" "$qbase/metrics" > "$ROOT/queue-metrics-after.json"
          jq -e --argjson bytes "$EXPECTED_QUEUE_BYTES" '.success == true and (.result.backlog_count // -1) == 1 and (.result.backlog_bytes // -1) == $bytes' "$ROOT/queue-metrics-after.json" >/dev/null
          curl -fsS -X POST -H "$auth" -H 'Content-Type: application/json' "$qbase/messages/peek" -d '{"batch_size":2}' > "$ROOT/queue-peek-after.json"
          jq -e --arg id "$AUTHORIZED_MESSAGE_ID" '.success == true and ((.result.messages // .result // []) | length) == 1 and (.result.messages // .result // [])[0].id == $id' "$ROOT/queue-peek-after.json" >/dev/null
          body="$(jq -r '(.result.messages // .result // [])[0].body' "$ROOT/queue-peek-after.json")"
          test "$(printf '%s' "$body" | sha256sum | awk '{print $1}')" = "$AUTHORIZED_BODY_SHA"
          query "SELECT epoch_id,last_processed_ledger,last_processed_hash FROM sync_state WHERE network='devnet'" > "$ROOT/sync-after.json"
          query "SELECT epoch_id,base_snapshot_id,base_ledger_index,base_ledger_hash,overlay_ledger_index,overlay_ledger_hash FROM current_state_overlay_state WHERE network='devnet' AND base_snapshot_id='${TARGET_SNAPSHOT}' ORDER BY updated_at DESC LIMIT 1" > "$ROOT/overlay-after.json"
          query "SELECT COUNT(*) AS row_count FROM fast_lane_shadow_state" > "$ROOT/fast-state-count-after.json"
          query "SELECT COUNT(*) AS row_count FROM fast_lane_shadow_objects_compact" > "$ROOT/compact-count-after.json"
          jq -e --arg epoch "$TARGET_EPOCH" --arg hash "$TARGET_HASH" --argjson ledger "$TARGET_LEDGER" '.success == true and .result[0].results[0].epoch_id == $epoch and .result[0].results[0].last_processed_ledger == $ledger and .result[0].results[0].last_processed_hash == $hash' "$ROOT/sync-after.json" >/dev/null
          jq -e --arg epoch "$TARGET_EPOCH" --arg snapshot "$TARGET_SNAPSHOT" --arg hash "$TARGET_HASH" --argjson ledger "$TARGET_LEDGER" '.success == true and .result[0].results[0].epoch_id == $epoch and .result[0].results[0].base_snapshot_id == $snapshot and .result[0].results[0].base_ledger_index == $ledger and .result[0].results[0].base_ledger_hash == $hash and .result[0].results[0].overlay_ledger_index == $ledger and .result[0].results[0].overlay_ledger_hash == $hash' "$ROOT/overlay-after.json" >/dev/null
          jq -e '.success == true and .result[0].results[0].row_count == 0' "$ROOT/fast-state-count-after.json" >/dev/null
          jq -e '.success == true and .result[0].results[0].row_count == 0' "$ROOT/compact-count-after.json" >/dev/null
          replayed=false
          for attempt in $(seq 1 30); do
            curl -fsS "$PREVIEW_BASE/api/status/replacement-base-rebase" > "$ROOT/replay-proof.json" || true
            if jq -e --arg snapshot "$TARGET_SNAPSHOT" --arg hash "$TARGET_HASH" --argjson ledger "$TARGET_LEDGER" '.status == "replayed" and .plan.action == "replay" and .target.snapshotId == $snapshot and .target.ledgerIndex == $ledger and .target.ledgerHash == $hash' "$ROOT/replay-proof.json" >/dev/null 2>&1; then replayed=true; break; fi
            sleep 1
          done
          test "$replayed" = true
          jq -n --arg newVersion "$NEW_VERSION" --arg messageId "$AUTHORIZED_MESSAGE_ID" --arg snapshot "$TARGET_SNAPSHOT" --argjson ledger "$TARGET_LEDGER" --argjson successor "$EXPECTED_SUCCESSOR" '{passed:true,productionMutation:true,newVersion:$newVersion,targetLedger:$ledger,targetSnapshot:$snapshot,dueSuccessorScheduledTime:$successor,dueSuccessorMessageId:$messageId,queuePaused:true,queueResumed:false,queuePurged:false,messageDelivered:false,currentRecovered:false,recoveryRequiresDueSuccessorDeliveryProof:true,authorizationCommentId:5578273221,authorizationReplayed:true}' > "$ROOT/result.json"

      - name: Publish result
        if: success()
        env:
          NEW_VERSION: ${{ steps.mutate.outputs.new_version }}
        shell: bash
        run: |
          gh issue comment "$QUALIFICATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body "Fresh due-successor cutover replay run \`${GITHUB_RUN_ID}\`: passed=\`true\`, authorization_comment=\`${AUTHORIZATION_COMMENT_ID}\`, version=\`${NEW_VERSION}\`, target=\`${TARGET_LEDGER}\`. Exact 95-byte successor remains preserved and Queue remains paused. Current recovered=\`false\`; next gate is one existing-message delivery proof."

      - name: Re-pause Queue if execution failed
        if: failure()
        shell: bash
        run: |
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          qbase="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues/${QUEUE_ID}"
          curl -fsS -X PATCH -H "$auth" -H 'Content-Type: application/json' "$qbase" -d '{"settings":{"delivery_paused":true}}' >/dev/null || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-fresh-cutover-due-successor-replay
          path: current-fresh-cutover-due-successor-replay
          if-no-files-found: warn
          retention-days: 30
