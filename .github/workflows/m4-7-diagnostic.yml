name: M4-7 diagnostic

on:
  push:
    branches:
      - ui/m4-7-baseline-integration

permissions:
  contents: read
  issues: write

jobs:
  browser-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run M4-7 browser test
        continue-on-error: true
        run: |
          set +e
          pnpm test:e2e tests/e2e/integration-accessibility.spec.ts > m4-7-diagnostic.log 2>&1
          echo "exit_status=$?" >> m4-7-diagnostic.log
      - name: Post diagnostic output
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const text = fs.readFileSync('m4-7-diagnostic.log', 'utf8')
            const body = `<!-- m4-7-diagnostic -->\n## M4-7 browser diagnostic\n\n\`\`\`text\n${text.slice(-50000)}\n\`\`\``
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 34,
              per_page: 100,
            })
            const prior = comments.find((comment) => comment.body?.includes('<!-- m4-7-diagnostic -->'))
            if (prior) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: prior.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 34,
                body,
              })
            }
