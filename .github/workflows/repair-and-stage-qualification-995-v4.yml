name: Repair and stage qualification 995 v4

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/xrpl-lending-recovery-trigger-pr
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-and-stage-qualification-995-v4
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Generate and validate qualification v4
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/stage-qualification-995-v4.py
          python scripts/stage-qualification-995-v4.py
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path

          workflow_path = Path('.github/workflows/complete-history-12-slot-qualification-995-v4.yml')
          workflow = workflow_path.read_text()
          plan = json.loads(Path('.github/complete-history-12-slot-qualification-995-v4-plan.json').read_text())
          trigger = Path('.github/complete-history-12-slot-qualification-995-v4-trigger').read_text().strip()
          required = [
              "cron: '5 8 25 7 *'",
              "PREPARE_UTC: '2026-07-25T08:25:00Z'",
              "START_UTC: '2026-07-25T08:30:00Z'",
              "END_UTC: '2026-07-25T09:25:00Z'",
              "EVALUATE_UTC: '2026-07-25T09:30:30Z'",
              "timeout-minutes: 180",
              "Qualification time budget invalid",
              "github.event_name == 'schedule'",
          ]
          missing = [value for value in required if value not in workflow]
          forbidden = [value for value in ('timeout-minutes: 115', 'qualification v3', 'qualify-v3') if value in workflow]
          assert not missing, missing
          assert not forbidden, forbidden
          assert trigger == 'qualify-v4-1784968200000-1784971500000-5b56de459e97495a9358f0e203c056d2a99afc6b'
          assert plan['status'] == 'staged'
          assert plan['timeoutMinutes'] == 180
          assert plan['finalizationBudgetSeconds'] == 1200
          assert datetime.fromisoformat(plan['startUtc'].replace('Z', '+00:00')) < datetime.fromisoformat(plan['endUtc'].replace('Z', '+00:00'))
          assert (datetime.fromisoformat(plan['endUtc'].replace('Z', '+00:00')) - datetime.fromisoformat(plan['startUtc'].replace('Z', '+00:00'))).total_seconds() == 55 * 60

          lines = workflow.splitlines()
          names = {
              'Validate fixed qualification v4 boundary': 'validate.sh',
              'Arm Issue and wait for identity freeze point': 'arm.sh',
              'Capture pre-window production identity': 'capture-pre.sh',
              'Wait for fixed qualification window to close': 'wait.sh',
              'Read exact slot, metric, history and final identity evidence': 'read-evidence.sh',
              'Decode, source-cross-audit and evaluate': 'evaluate.sh',
              'Publish retained evidence and Issue result': 'publish.sh',
          }
          output_dir = Path('scripts/qualification-995-v4')
          output_dir.mkdir(parents=True, exist_ok=True)
          extracted = {}
          for index, line in enumerate(lines):
              stripped = line.strip()
              if not stripped.startswith('- name: '):
                  continue
              name = stripped.removeprefix('- name: ')
              if name not in names:
                  continue
              run_index = index + 1
              while run_index < len(lines) and lines[run_index].strip() != 'run: |':
                  run_index += 1
              assert run_index < len(lines), name
              body = []
              cursor = run_index + 1
              while cursor < len(lines):
                  current = lines[cursor]
                  if current and len(current) - len(current.lstrip(' ')) < 10:
                      break
                  body.append(current[10:] if current.startswith('          ') else '')
                  cursor += 1
              script = '#!/usr/bin/env bash\n' + '\n'.join(body).rstrip() + '\n'
              path = output_dir / names[name]
              path.write_text(script)
              extracted[name] = path
          assert set(extracted) == set(names), (set(names) - set(extracted))
          assert extracted['Decode, source-cross-audit and evaluate'].stat().st_size > 19000
          assert 'Qualification time budget invalid' in extracted['Arm Issue and wait for identity freeze point'].read_text()
          assert 'complete-history-12-slot-qualification-995-v4.json' in extracted['Publish retained evidence and Issue result'].read_text()
          workflow_path.unlink()
          PY

      - name: Commit validated non-workflow v4 bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/complete-history-12-slot-qualification-995-v4-trigger \
                  .github/complete-history-12-slot-qualification-995-v4-plan.json \
                  scripts/qualification-995-v4
          git commit -m 'Stage qualification 995 v4 script bundle'
          git push origin HEAD:main
