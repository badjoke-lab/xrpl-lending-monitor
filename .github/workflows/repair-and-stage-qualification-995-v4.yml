name: Repair and stage qualification 995 v4

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/xrpl-lending-recovery-trigger-pr
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-and-stage-qualification-995-v4
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Generate and validate qualification v4
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/stage-qualification-995-v4.py
          python scripts/stage-qualification-995-v4.py
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path

          workflow = Path('.github/workflows/complete-history-12-slot-qualification-995-v4.yml').read_text()
          plan = json.loads(Path('.github/complete-history-12-slot-qualification-995-v4-plan.json').read_text())
          trigger = Path('.github/complete-history-12-slot-qualification-995-v4-trigger').read_text().strip()
          required = [
              "cron: '5 8 25 7 *'",
              "PREPARE_UTC: '2026-07-25T08:25:00Z'",
              "START_UTC: '2026-07-25T08:30:00Z'",
              "END_UTC: '2026-07-25T09:25:00Z'",
              "EVALUATE_UTC: '2026-07-25T09:30:30Z'",
              "timeout-minutes: 180",
              "Qualification time budget invalid",
              "github.event_name == 'schedule'",
          ]
          missing = [value for value in required if value not in workflow]
          forbidden = [value for value in ('timeout-minutes: 115', 'qualification v3', 'qualify-v3') if value in workflow]
          assert not missing, missing
          assert not forbidden, forbidden
          assert trigger == 'qualify-v4-1784968200000-1784971500000-5b56de459e97495a9358f0e203c056d2a99afc6b'
          assert plan['status'] == 'staged'
          assert plan['timeoutMinutes'] == 180
          assert plan['finalizationBudgetSeconds'] == 1200
          assert datetime.fromisoformat(plan['startUtc'].replace('Z', '+00:00')) < datetime.fromisoformat(plan['endUtc'].replace('Z', '+00:00'))
          assert (datetime.fromisoformat(plan['endUtc'].replace('Z', '+00:00')) - datetime.fromisoformat(plan['startUtc'].replace('Z', '+00:00'))).total_seconds() == 55 * 60
          PY

      - name: Commit staged v4 and remove one-time generator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/repair-and-stage-qualification-995-v4.yml scripts/stage-qualification-995-v4.py
          git add .github/workflows/complete-history-12-slot-qualification-995-v4.yml \
                  .github/complete-history-12-slot-qualification-995-v4-trigger \
                  .github/complete-history-12-slot-qualification-995-v4-plan.json
          git commit -m 'Stage complete-history qualification 995 v4'
          git push origin HEAD:main
