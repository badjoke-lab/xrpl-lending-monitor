name: Repair and stage qualification 995 v4

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - .github/xrpl-lending-recovery-trigger-pr
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-and-stage-qualification-995-v4
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build corrected scheduled v4 workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          source = Path('.github/workflows/complete-history-12-slot-qualification-995-v3.yml')
          target = Path('.github/workflows/complete-history-12-slot-qualification-995-v4.yml')
          trigger = Path('.github/complete-history-12-slot-qualification-995-v4-trigger')
          plan = Path('.github/complete-history-12-slot-qualification-995-v4-plan.json')
          text = source.read_text()

          replacements = {
              'Complete-history 12-slot qualification 995 v3': 'Complete-history 12-slot qualification 995 v4',
              'complete-history-12-slot-qualification-995-v3': 'complete-history-12-slot-qualification-995-v4',
              'pre-soak qualification v3': 'pre-soak qualification v4',
              'qualification v3': 'qualification v4',
              'qualify-v3': 'qualify-v4',
              "PREPARE_UTC: '2026-07-25T04:05:00Z'": "PREPARE_UTC: '2026-07-25T08:05:00Z'",
              "START_UTC: '2026-07-25T04:10:00Z'": "START_UTC: '2026-07-25T08:10:00Z'",
              "END_UTC: '2026-07-25T05:05:00Z'": "END_UTC: '2026-07-25T09:05:00Z'",
              "EVALUATE_UTC: '2026-07-25T05:10:30Z'": "EVALUATE_UTC: '2026-07-25T09:10:30Z'",
              '1784952600000': '1784967000000',
              '1784955900000': '1784970300000',
              '2026-07-25T04:10:00+00:00': '2026-07-25T08:10:00+00:00',
              '2026-07-25T05:05:00+00:00': '2026-07-25T09:05:00+00:00',
              '2026-07-25T05:10:30+00:00': '2026-07-25T09:10:30+00:00',
              '2026-07-25T13:10:00+09:00': '2026-07-25T17:10:00+09:00',
              '2026-07-25T14:05:00+09:00': '2026-07-25T18:05:00+09:00',
              '2026-07-25 13:10 JST': '2026-07-25 17:10 JST',
              '2026-07-25 14:05 JST': '2026-07-25 18:05 JST',
              '2026-07-25 14:10:30 JST': '2026-07-25 18:10:30 JST',
              'timeout-minutes: 115': 'timeout-minutes: 180',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing replacement anchor: {old}')
              text = text.replace(old, new)

          on_anchor = "on:\n"
          scheduled_on = "on:\n  workflow_dispatch:\n  schedule:\n    - cron: '30 7 25 7 *'\n"
          if on_anchor not in text:
              raise SystemExit('missing on anchor')
          text = text.replace(on_anchor, scheduled_on, 1)

          qualify_if = "    if: github.event_name == 'push'\n    runs-on: ubuntu-latest\n    timeout-minutes: 180\n"
          scheduled_if = "    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'\n    runs-on: ubuntu-latest\n    timeout-minutes: 180\n"
          if qualify_if not in text:
              raise SystemExit('missing qualify event anchor')
          text = text.replace(qualify_if, scheduled_if, 1)

          env_anchor = "  END_MS: '1784970300000'\n"
          if env_anchor not in text:
              raise SystemExit('missing env anchor')
          text = text.replace(
              env_anchor,
              env_anchor + "  QUALIFY_TIMEOUT_MINUTES: '180'\n  FINALIZATION_BUDGET_SECONDS: '1200'\n",
              1,
          )

          arm_anchor = '''          set -euo pipefail
          start_epoch="$(date -u -d "$START_UTC" +%s)"
'''
          guard = '''          set -euo pipefail
          now_epoch="$(date -u +%s)"
          evaluate_epoch="$(date -u -d "$EVALUATE_UTC" +%s)"
          budget_seconds="$((QUALIFY_TIMEOUT_MINUTES * 60))"
          required_seconds="$((evaluate_epoch - now_epoch + FINALIZATION_BUDGET_SECONDS))"
          test "$required_seconds" -gt 0
          if [ "$required_seconds" -ge "$((budget_seconds - 300))" ]; then
            echo "::error::Qualification time budget invalid: required=${required_seconds}s budget=${budget_seconds}s"
            exit 1
          fi
          start_epoch="$(date -u -d "$START_UTC" +%s)"
'''
          if arm_anchor not in text:
              raise SystemExit('missing arm anchor')
          text = text.replace(arm_anchor, guard, 1)

          validation_anchor = "          assert (evaluate-end).total_seconds()>=300\n"
          validation = """          assert (evaluate-end).total_seconds()>=300
          prepare=datetime.fromisoformat('2026-07-25T08:05:00+00:00')
          timeout_seconds=180*60
          finalization_seconds=1200
          assert (evaluate-prepare).total_seconds()+finalization_seconds < timeout_seconds-300
          workflow=Path('.github/workflows/complete-history-12-slot-qualification-995-v4.yml').read_text()
          assert 'timeout-minutes: 180' in workflow
          assert 'Qualification time budget invalid' in workflow
          assert "cron: '30 7 25 7 *'" in workflow
"""
          if validation_anchor not in text:
              raise SystemExit('missing validation anchor')
          text = text.replace(validation_anchor, validation, 1)
          text = text.replace(
              'from datetime import datetime, timezone\n',
              'from datetime import datetime, timezone\nfrom pathlib import Path\n',
              1,
          )

          target.write_text(text)
          trigger.write_text('qualify-v4-1784967000000-1784970300000-5b56de459e97495a9358f0e203c056d2a99afc6b\n')
          plan.write_text(json.dumps({
              'generatedAt': datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
              'workflowArmUtc': '2026-07-25T07:30:00Z',
              'prepareUtc': '2026-07-25T08:05:00Z',
              'startUtc': '2026-07-25T08:10:00Z',
              'endUtc': '2026-07-25T09:05:00Z',
              'evaluateUtc': '2026-07-25T09:10:30Z',
              'startJst': '2026-07-25T17:10:00+09:00',
              'endJst': '2026-07-25T18:05:00+09:00',
              'evaluateJst': '2026-07-25T18:10:30+09:00',
              'timeoutMinutes': 180,
              'finalizationBudgetSeconds': 1200,
              'runtimeSha': '5b56de459e97495a9358f0e203c056d2a99afc6b',
              'status': 'staged',
          }, indent=2) + '\n')
          PY

          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/complete-history-12-slot-qualification-995-v4.yml').read_text()
          required = [
              "START_UTC: '2026-07-25T08:10:00Z'",
              "END_UTC: '2026-07-25T09:05:00Z'",
              "EVALUATE_UTC: '2026-07-25T09:10:30Z'",
              "timeout-minutes: 180",
              "Qualification time budget invalid",
              "cron: '30 7 25 7 *'",
              "github.event_name == 'schedule'",
          ]
          missing = [value for value in required if value not in text]
          if missing:
              raise SystemExit(f'missing generated assertions: {missing}')
          if 'timeout-minutes: 115' in text:
              raise SystemExit('unsafe timeout remained')
          PY

          rm .github/workflows/repair-and-stage-qualification-995-v4.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/complete-history-12-slot-qualification-995-v4.yml \
                  .github/complete-history-12-slot-qualification-995-v4-trigger \
                  .github/complete-history-12-slot-qualification-995-v4-plan.json \
                  .github/workflows/repair-and-stage-qualification-995-v4.yml
          git commit -m 'Stage scheduled complete-history qualification 995 v4'
          git push origin HEAD:main
