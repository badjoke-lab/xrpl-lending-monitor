name: Apply canary cause patch

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-canary-cause-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Preserve caught request error as cause
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/verify-three-layer-read-canary.ts')
          source = path.read_text()
          old = "throw new Error(`Request failed for ${url}: ${message}`)"
          new = "throw new Error(`Request failed for ${url}: ${message}`, { cause: error })"
          if source.count(old) != 1:
              raise SystemExit(f'expected exact patch target once, found {source.count(old)}')
          path.write_text(source.replace(old, new))
          PY
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/apply-canary-cause-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/verify-three-layer-read-canary.ts
          git commit -m "fix: preserve canary request failure cause"
          git push origin HEAD:${{ github.head_ref }}
