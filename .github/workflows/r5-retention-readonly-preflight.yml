name: R5 retention read-only preflight

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: r5-retention-readonly-preflight
  cancel-in-progress: false

env:
  QUALIFICATION_ISSUE: '1261'
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
  GH_TOKEN: ${{ github.token }}

jobs:
  probe:
    if: >-
      github.event.issue.number == 1261 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      github.event.comment.body == '/r5-retention-readonly-preflight'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Read retention candidates and dependencies only
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SUPABASE_PROJECT_ID" =~ ^[a-z]{20}$ ]]
          test -n "$SUPABASE_ACCESS_TOKEN"
          mkdir -p r5-retention-readonly-preflight
          source_commit="$(git rev-parse HEAD)"
          node scripts/r5-retention-readonly-preflight.mjs \
            --source-commit "$source_commit" \
            --output r5-retention-readonly-preflight/evidence.json \
            --summary r5-retention-readonly-preflight/summary.md \
            > /tmp/r5-retention-readonly-preflight.json
          test "$(jq -r '.retentionBoundary.probeReadOnly' /tmp/r5-retention-readonly-preflight.json)" = true
          test "$(jq -r '.retentionBoundary.noDeleteAuthorized' /tmp/r5-retention-readonly-preflight.json)" = true
          test "$(jq -r '.retentionBoundary.noVacuumAuthorized' /tmp/r5-retention-readonly-preflight.json)" = true
          test "$(jq -r '.retentionBoundary.noSchedulerMutationAuthorized' /tmp/r5-retention-readonly-preflight.json)" = true
          test "$(jq -r '.retentionBoundary.noDeploymentAuthorized' /tmp/r5-retention-readonly-preflight.json)" = true
          test "$(jq -r '.retentionBoundary.mainnetDisabled' /tmp/r5-retention-readonly-preflight.json)" = true

          node scripts/r5-resource-restore-readonly-preflight.mjs \
            --source-commit "$source_commit" \
            --output r5-retention-readonly-preflight/resource-restore-evidence.json \
            --summary r5-retention-readonly-preflight/resource-restore-summary.md \
            > /tmp/r5-resource-restore-readonly-preflight.json
          test "$(jq -r '.boundary.productionDatabaseReadOnly' /tmp/r5-resource-restore-readonly-preflight.json)" = true
          test "$(jq -r '.boundary.productionMutationAuthorized' /tmp/r5-resource-restore-readonly-preflight.json)" = false
          test "$(jq -r '.assessment.reconstructabilityProven' /tmp/r5-resource-restore-readonly-preflight.json)" = false
          test "$(jq -r '.assessment.safeToDeleteProven' /tmp/r5-resource-restore-readonly-preflight.json)" = false
          test "$(jq -r '.boundary.r5RearmAuthorized' /tmp/r5-resource-restore-readonly-preflight.json)" = false
          test "$(jq -r '.boundary.mainnetEnabled' /tmp/r5-resource-restore-readonly-preflight.json)" = false

          node scripts/r5-post-retention-readonly-gate.mjs \
            --source-commit "$source_commit" \
            --output r5-retention-readonly-preflight/post-retention-gate.json \
            --summary r5-retention-readonly-preflight/post-retention-gate.md \
            > /tmp/r5-post-retention-readonly-gate.json
          test "$(jq -r '.boundary.readOnly' /tmp/r5-post-retention-readonly-gate.json)" = true
          test "$(jq -r '.boundary.productionMutationAuthorized' /tmp/r5-post-retention-readonly-gate.json)" = false
          test "$(jq -r '.boundary.deploymentAuthorized' /tmp/r5-post-retention-readonly-gate.json)" = false
          test "$(jq -r '.boundary.mainnetDisabled' /tmp/r5-post-retention-readonly-gate.json)" = true
          test "$(jq -r '.boundary.r5RestartAuthorized' /tmp/r5-post-retention-readonly-gate.json)" = false
          jq -e '.verdict == "pass" or .verdict == "pending" or .verdict == "block"' /tmp/r5-post-retention-readonly-gate.json >/dev/null
          printf '\n' >> r5-retention-readonly-preflight/summary.md
          cat r5-retention-readonly-preflight/resource-restore-summary.md >> r5-retention-readonly-preflight/summary.md
          printf '\n' >> r5-retention-readonly-preflight/summary.md
          cat r5-retention-readonly-preflight/post-retention-gate.md >> r5-retention-readonly-preflight/summary.md

          printf 'source_commit=%s\ndatabase_bytes=%s\nheadroom_bytes=%s\nrestore_present=%s\nrestore_bytes=%s\npost_retention_verdict=%s\n' \
            "$source_commit" \
            "$(jq -r '.databaseBytes' /tmp/r5-retention-readonly-preflight.json)" \
            "$(jq -r '.databaseHeadroomBytes' /tmp/r5-retention-readonly-preflight.json)" \
            "$(jq -r '.relationPresent' /tmp/r5-resource-restore-readonly-preflight.json)" \
            "$(jq -r '.catalog.totalRelationBytes // 0' /tmp/r5-resource-restore-readonly-preflight.json)" \
            "$(jq -r '.verdict' /tmp/r5-post-retention-readonly-gate.json)" \
            >> "$GITHUB_OUTPUT"

      - name: Upload sanitized read-only evidence
        if: always() && steps.probe.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: r5-retention-readonly-preflight-evidence
          path: r5-retention-readonly-preflight
          if-no-files-found: error
          retention-days: 14

      - name: Publish sanitized read-only result
        if: always() && steps.probe.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          cat r5-retention-readonly-preflight/summary.md
          gh issue comment "$QUALIFICATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file r5-retention-readonly-preflight/summary.md
