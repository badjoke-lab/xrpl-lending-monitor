name: Current live runtime deploy

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: current-live-runtime-deploy
  cancel-in-progress: false

env:
  QUALIFICATION_ISSUE: '995'
  RUNTIME_SOURCE_SHA: 18d12f7ce40000397b073d033b99d74c18f96dd2
  SCRIPT_NAME: xrpl-lending-monitor
  QUEUE_ID: 2ae398f2edbf43749e45cd7ede77c6cd
  DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
  PRODUCTION_BASE: https://xrpl-lending-monitor.badjoke-lab.workers.dev
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    if: >-
      github.event.issue.number == 995 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      github.event.comment.body == '/current-live-runtime-deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out runtime source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RUNTIME_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify live runtime invariants
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RUNTIME_SOURCE_SHA"
          grep -F "export const FAST_LANE_CATCH_UP_INTERVAL_MS = 60_000" src/worker/fast-lane-successor-cadence.ts
          grep -F "export const FAST_LANE_MAX_PERSISTENCE_LEDGERS = 32" src/collector/incremental/fast-lane-persistence-window.ts
          grep -F "export const FAST_LANE_MAX_PERSISTENCE_MUTATIONS = 24" src/collector/incremental/fast-lane-persistence-window.ts
          test "$(jq -r '.triggers.crons | length' wrangler.jsonc)" -eq 0
          test "$(jq -r '.vars.APP_NETWORK' wrangler.jsonc)" = devnet
          test "$(jq -r '.vars.MAINNET_ENABLED' wrangler.jsonc)" = false
          test "$(jq -r '.vars.FAST_LANE_MAX_LEDGERS_PER_RUN' wrangler.jsonc)" = 32

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run focused runtime tests
        run: >-
          pnpm exec vitest run
          src/worker/fast-lane-successor-cadence.test.ts
          src/collector/incremental/fast-lane-persistence-window.test.ts

      - name: Build deploy assets
        run: pnpm build:deploy-assets

      - name: Capture live state
        id: before
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p current-live-runtime-deploy
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          curl -fsS -H "$auth" "$api/queues/$QUEUE_ID" \
            | tee current-live-runtime-deploy/queue-before.json \
            | jq -e '.success == true and .result.settings.delivery_paused == false' >/dev/null
          curl -fsS -H "$auth" "$api/workers/scripts/$SCRIPT_NAME/deployments" \
            | tee current-live-runtime-deploy/deployments-before.json >/dev/null
          old_version="$(jq -r '.result.deployments[0].versions[0].version_id' current-live-runtime-deploy/deployments-before.json)"
          test -n "$old_version" && test "$old_version" != null
          echo "old_version=$old_version" >> "$GITHUB_OUTPUT"
          query() {
            local sql="$1"
            curl -fsS -X POST -H "$auth" -H 'Content-Type: application/json' \
              "$api/d1/database/$DATABASE_ID/query" \
              --data "$(jq -cn --arg sql "$sql" '{sql:$sql}')"
          }
          query "SELECT last_processed_ledger,latest_observed_ledger,status,updated_at FROM fast_lane_shadow_state WHERE network='devnet'" \
            | tee current-live-runtime-deploy/fast-before.json >/dev/null
          query "SELECT scheduled_time,status,next_scheduled_time,next_cron,error_message,updated_at FROM fast_lane_queue_slots ORDER BY scheduled_time DESC LIMIT 3" \
            | tee current-live-runtime-deploy/slots-before.json >/dev/null
          echo "Current before deploy:"
          jq '.result[0].results[0] // null' current-live-runtime-deploy/fast-before.json
          echo "Latest Queue slots before deploy:"
          jq '.result[0].results' current-live-runtime-deploy/slots-before.json

      - name: Upload and deploy runtime
        id: deploy
        shell: bash
        env:
          OLD_VERSION: ${{ steps.before.outputs.old_version }}
        run: |
          set -euo pipefail
          deployed=false
          rollback() {
            rc=$?
            if test "$deployed" = true; then
              pnpm exec wrangler versions deploy "${OLD_VERSION}@100%" --yes || true
            fi
            exit "$rc"
          }
          trap rollback ERR
          pnpm exec wrangler versions upload --message "Live Current runtime ${RUNTIME_SOURCE_SHA}" \
            | tee current-live-runtime-deploy/version-upload.txt
          new_version="$(grep -Eio '[0-9a-f]{8}-[0-9a-f-]{27,}' current-live-runtime-deploy/version-upload.txt | tail -1)"
          test -n "$new_version"
          deployed=true
          pnpm exec wrangler versions deploy "${new_version}@100%" --yes \
            | tee current-live-runtime-deploy/version-deploy.txt
          trap - ERR
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"

      - name: Confirm live endpoints and Queue remain active
        shell: bash
        env:
          NEW_VERSION: ${{ steps.deploy.outputs.new_version }}
        run: |
          set -euo pipefail
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          curl -fsS -H "$auth" "$api/queues/$QUEUE_ID" \
            | tee current-live-runtime-deploy/queue-after.json \
            | jq -e '.success == true and .result.settings.delivery_paused == false' >/dev/null
          curl -fsS -H "$auth" "$api/workers/scripts/$SCRIPT_NAME/deployments" \
            | tee current-live-runtime-deploy/deployments-after.json \
            | jq -e --arg v "$NEW_VERSION" '.success == true and .result.deployments[0].versions[0].version_id == $v and .result.deployments[0].versions[0].percentage == 100' >/dev/null
          curl -fsS "$PRODUCTION_BASE/api/overview" \
            | tee current-live-runtime-deploy/overview-after.json >/dev/null
          curl -fsS "$PRODUCTION_BASE/api/status/fast-lane-diff?limit=1" \
            | tee current-live-runtime-deploy/fast-lane-diff-after.json >/dev/null
          query() {
            local sql="$1"
            curl -fsS -X POST -H "$auth" -H 'Content-Type: application/json' \
              "$api/d1/database/$DATABASE_ID/query" \
              --data "$(jq -cn --arg sql "$sql" '{sql:$sql}')"
          }
          query "SELECT last_processed_ledger,latest_observed_ledger,status,updated_at FROM fast_lane_shadow_state WHERE network='devnet'" \
            | tee current-live-runtime-deploy/fast-after.json >/dev/null
          echo "Current immediately after deploy:"
          jq '.result[0].results[0] // null' current-live-runtime-deploy/fast-after.json
          jq -n \
            --arg runtimeSource "$RUNTIME_SOURCE_SHA" \
            --arg newVersion "$NEW_VERSION" \
            '{passed:true,runtimeSource:$runtimeSource,newVersion:$newVersion,queueDeliveryPaused:false}' \
            | tee current-live-runtime-deploy/result.json

      - name: Upload operational record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-live-runtime-deploy
          path: current-live-runtime-deploy
          if-no-files-found: warn
          retention-days: 30
