name: Current live runtime deploy

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: current-live-runtime-deploy
  cancel-in-progress: false

env:
  SCRIPT_NAME: xrpl-lending-monitor
  LEGACY_QUEUE_NAME: xrpl-lending-fast-lane
  DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
  PRODUCTION_BASE: https://xrpl-lending-monitor.badjoke-lab.workers.dev
  TARGET_EPOCH: devnet-3371675
  TARGET_LEDGER: '5218039'
  TARGET_HASH: 5701853F89034B14F4E9698AD31E04535636CF4DD9CD986136ABDA7F290011A6
  TARGET_SNAPSHOT: devnet-5218039-5701853f8903
  TARGET_BRANCH: current-state-live-direct-5218039-20260912
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    if: >-
      github.event.issue.number == 995 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      github.event.comment.body == '/current-live-runtime-deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Verify direct Current invariants
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          test "$(jq -r '.main' wrangler.jsonc)" = 'src/worker/current-direct-entry.ts'
          jq -e '.triggers.crons == ["* * * * *"]' wrangler.jsonc >/dev/null
          jq -e 'has("queues") | not' wrangler.jsonc >/dev/null
          test "$(jq -r '.vars.APP_NETWORK' wrangler.jsonc)" = devnet
          test "$(jq -r '.vars.MAINNET_ENABLED' wrangler.jsonc)" = false
          test "$(jq -r '.vars.CURRENT_STATE_GITHUB_BRANCH' wrangler.jsonc)" = "$TARGET_BRANCH"
          test "$(jq -r '.vars.CURRENT_STATE_REPLACEMENT_SNAPSHOT_ID' wrangler.jsonc)" = "$TARGET_SNAPSHOT"
          test "$(jq -r '.vars.REPLACEMENT_BASE_LEDGER_INDEX' wrangler.jsonc)" = "$TARGET_LEDGER"
          test "$(jq -r '.vars.REPLACEMENT_BASE_LEDGER_HASH' wrangler.jsonc)" = "$TARGET_HASH"
          test "$(jq -r '.vars.INCREMENTAL_MAX_LEDGERS_PER_RUN' wrangler.jsonc)" = 256
          test "$(jq -r '.vars.INCREMENTAL_EXECUTION_BUDGET_MS' wrangler.jsonc)" = 45000
          grep -F 'runBoundedIncrementalCollectorCycle' src/worker/current-direct-entry.ts >/dev/null
          if grep -F 'FAST_LANE_QUEUE' src/worker/current-direct-entry.ts; then
            echo 'direct Current entry must not reference FAST_LANE_QUEUE' >&2
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run direct collector tests
        run: >-
          pnpm exec vitest run
          src/collector/incremental/collector-cycle.test.ts
          src/collector/incremental/run-bounded-prepared-range.test.ts
          src/collector/incremental/measured-incremental-commit.test.ts
          src/collector/incremental/current-state-overlay.test.ts

      - name: Build deploy assets
        run: pnpm build:deploy-assets

      - name: Capture canonical state before deploy
        id: before
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p current-live-runtime-deploy
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          query() {
            local sql="$1"
            curl -fsS -X POST -H "$auth" -H 'Content-Type: application/json' \
              "$api/d1/database/$DATABASE_ID/query" \
              --data "$(jq -cn --arg sql "$sql" '{sql:$sql}')"
          }
          query "SELECT epoch_id,last_processed_ledger,last_processed_hash,latest_observed_ledger,latest_observed_hash,status,error_code,error_message,updated_at FROM sync_state WHERE network='devnet'" \
            | tee current-live-runtime-deploy/sync-before.json \
            | jq -e '.success == true' >/dev/null
          before_ledger="$(jq -r '.result[0].results[0].last_processed_ledger // empty' current-live-runtime-deploy/sync-before.json)"
          test "$before_ledger" -eq "$before_ledger"
          echo "before_ledger=$before_ledger" >> "$GITHUB_OUTPUT"

      - name: Detach legacy Queue consumer
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler queues consumer list "$LEGACY_QUEUE_NAME" --json --config wrangler.jsonc \
            | tee current-live-runtime-deploy/legacy-consumers-before.json
          if grep -F "$SCRIPT_NAME" current-live-runtime-deploy/legacy-consumers-before.json >/dev/null; then
            pnpm exec wrangler queues consumer remove "$LEGACY_QUEUE_NAME" "$SCRIPT_NAME" --config wrangler.jsonc \
              | tee current-live-runtime-deploy/legacy-consumer-remove.txt
          fi
          pnpm exec wrangler queues consumer list "$LEGACY_QUEUE_NAME" --json --config wrangler.jsonc \
            | tee current-live-runtime-deploy/legacy-consumers-after.json
          if grep -F "$SCRIPT_NAME" current-live-runtime-deploy/legacy-consumers-after.json >/dev/null; then
            echo 'legacy Queue consumer is still attached' >&2
            exit 1
          fi

      - name: Deploy direct Current runtime and apply fresh base
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cutover_token="$(openssl rand -hex 32)"
          secret_file="$(mktemp)"
          trap 'rm -f "$secret_file"' EXIT
          jq -n --arg token "$cutover_token" '{REPLACEMENT_BASE_CUTOVER_TOKEN:$token}' > "$secret_file"
          pnpm exec wrangler deploy --config wrangler.jsonc --secrets-file "$secret_file" \
            | tee current-live-runtime-deploy/wrangler-deploy.txt
          curl -fsS -X POST \
            -H "x-replacement-base-cutover-token: ${cutover_token}" \
            "$PRODUCTION_BASE/api/operator/replacement-base-cutover" \
            | tee current-live-runtime-deploy/cutover-response.json >/dev/null
          jq -e \
            --arg epoch "$TARGET_EPOCH" \
            --arg snapshot "$TARGET_SNAPSHOT" \
            --arg hash "$TARGET_HASH" \
            --argjson ledger "$TARGET_LEDGER" '
              .status == "cutover_applied"
              and .network == "devnet"
              and .target.epochId == $epoch
              and .target.snapshotId == $snapshot
              and .target.ledgerIndex == $ledger
              and .target.ledgerHash == $hash
              and (.rebase.status == "rebased" or .rebase.status == "replayed")
            ' current-live-runtime-deploy/cutover-response.json >/dev/null

      - name: Confirm public endpoints
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$PRODUCTION_BASE/api/health" \
            | tee current-live-runtime-deploy/health-after.json \
            | jq -e '.ok == true and .network == "devnet" and .mainnet_enabled == false' >/dev/null
          curl -fsS "$PRODUCTION_BASE/api/status" \
            | tee current-live-runtime-deploy/status-immediate.json >/dev/null
          curl -fsS "$PRODUCTION_BASE/api/overview" \
            | tee current-live-runtime-deploy/overview-immediate.json >/dev/null

      - name: Wait for direct one-minute cycles
        run: sleep 150

      - name: Verify canonical cursor advances
        id: verify
        shell: bash
        env:
          BEFORE_LEDGER: ${{ steps.before.outputs.before_ledger }}
        run: |
          set -euo pipefail
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          query() {
            local sql="$1"
            curl -fsS -X POST -H "$auth" -H 'Content-Type: application/json' \
              "$api/d1/database/$DATABASE_ID/query" \
              --data "$(jq -cn --arg sql "$sql" '{sql:$sql}')"
          }
          query "SELECT epoch_id,last_processed_ledger,last_processed_hash,latest_observed_ledger,latest_observed_hash,status,error_code,error_message,updated_at FROM sync_state WHERE network='devnet'" \
            | tee current-live-runtime-deploy/sync-after.json \
            | jq -e '.success == true' >/dev/null
          query "SELECT epoch_id,base_snapshot_id,base_ledger_index,base_ledger_hash,overlay_ledger_index,overlay_ledger_hash,updated_at FROM current_state_overlay_state WHERE network='devnet' AND base_snapshot_id='$TARGET_SNAPSHOT'" \
            | tee current-live-runtime-deploy/overlay-after.json \
            | jq -e '.success == true' >/dev/null
          after_ledger="$(jq -r '.result[0].results[0].last_processed_ledger // empty' current-live-runtime-deploy/sync-after.json)"
          latest_ledger="$(jq -r '.result[0].results[0].latest_observed_ledger // empty' current-live-runtime-deploy/sync-after.json)"
          after_hash="$(jq -r '.result[0].results[0].last_processed_hash // empty' current-live-runtime-deploy/sync-after.json)"
          overlay_ledger="$(jq -r '.result[0].results[0].overlay_ledger_index // empty' current-live-runtime-deploy/overlay-after.json)"
          overlay_hash="$(jq -r '.result[0].results[0].overlay_ledger_hash // empty' current-live-runtime-deploy/overlay-after.json)"
          test "$after_ledger" -ge "$TARGET_LEDGER"
          test "$after_ledger" -gt "$BEFORE_LEDGER"
          test "$overlay_ledger" -eq "$after_ledger"
          test "$overlay_hash" = "$after_hash"
          test "$latest_ledger" -ge "$after_ledger"
          if test "$after_ledger" -eq "$TARGET_LEDGER" && test "$latest_ledger" -gt "$TARGET_LEDGER"; then
            echo "fresh base applied but direct collector did not advance beyond it" >&2
            exit 1
          fi
          echo "after_ledger=$after_ledger" >> "$GITHUB_OUTPUT"
          echo "latest_ledger=$latest_ledger" >> "$GITHUB_OUTPUT"
          curl -fsS "$PRODUCTION_BASE/api/status" | tee current-live-runtime-deploy/status-after.json >/dev/null
          curl -fsS "$PRODUCTION_BASE/api/overview" | tee current-live-runtime-deploy/overview-after.json >/dev/null

      - name: Delete retired Queue
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler queues delete "$LEGACY_QUEUE_NAME" --config wrangler.jsonc \
            | tee current-live-runtime-deploy/legacy-queue-delete.txt
          pnpm exec wrangler queues list --config wrangler.jsonc \
            | tee current-live-runtime-deploy/queues-after-delete.txt
          if grep -F "$LEGACY_QUEUE_NAME" current-live-runtime-deploy/queues-after-delete.txt >/dev/null; then
            echo 'retired Queue still exists' >&2
            exit 1
          fi

      - name: Record result
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          BEFORE_LEDGER: ${{ steps.before.outputs.before_ledger }}
          AFTER_LEDGER: ${{ steps.verify.outputs.after_ledger }}
          LATEST_LEDGER: ${{ steps.verify.outputs.latest_ledger }}
        run: |
          set -euo pipefail
          jq -n \
            --arg runtimeSource "$SOURCE_SHA" \
            --argjson baseLedger "$TARGET_LEDGER" \
            --argjson beforeLedger "$BEFORE_LEDGER" \
            --argjson afterLedger "$AFTER_LEDGER" \
            --argjson latestObservedLedger "$LATEST_LEDGER" \
            '{passed:true,runtimeSource:$runtimeSource,mode:"direct-one-minute-collector",baseLedger:$baseLedger,beforeLedger:$beforeLedger,afterLedger:$afterLedger,latestObservedLedger:$latestObservedLedger,legacyQueueDeleted:true}' \
            | tee current-live-runtime-deploy/result.json

      - name: Upload operational record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-live-runtime-deploy
          path: current-live-runtime-deploy
          if-no-files-found: warn
          retention-days: 30
