name: Current live runtime deploy

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: current-live-runtime-deploy
  cancel-in-progress: false

env:
  RUNTIME_SOURCE_SHA: 5075c8a1116cb3bea241e318dd48f357b3eeefdc
  SCRIPT_NAME: xrpl-lending-monitor
  DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
  PRODUCTION_BASE: https://xrpl-lending-monitor.badjoke-lab.workers.dev
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    if: >-
      github.event.issue.number == 995 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      github.event.comment.body == '/current-live-runtime-deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out direct Current runtime
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RUNTIME_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify direct Current invariants
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RUNTIME_SOURCE_SHA"
          test "$(jq -r '.main' wrangler.jsonc)" = 'src/worker/current-direct-entry.ts'
          jq -e '.triggers.crons == ["*/5 * * * *"]' wrangler.jsonc >/dev/null
          jq -e 'has("queues") | not' wrangler.jsonc >/dev/null
          test "$(jq -r '.vars.APP_NETWORK' wrangler.jsonc)" = devnet
          test "$(jq -r '.vars.MAINNET_ENABLED' wrangler.jsonc)" = false
          grep -F 'runBoundedIncrementalCollectorCycle' src/worker/current-direct-entry.ts >/dev/null
          if grep -F 'FAST_LANE_QUEUE' src/worker/current-direct-entry.ts; then
            echo 'direct Current entry must not reference FAST_LANE_QUEUE' >&2
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run direct collector tests
        run: >-
          pnpm exec vitest run
          src/collector/incremental/collector-cycle.test.ts
          src/collector/incremental/run-bounded-prepared-range.test.ts
          src/collector/incremental/measured-incremental-commit.test.ts
          src/collector/incremental/current-state-overlay.test.ts

      - name: Build deploy assets
        run: pnpm build:deploy-assets

      - name: Capture canonical state before deploy
        id: before
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p current-live-runtime-deploy
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          query() {
            local sql="$1"
            curl -fsS -X POST -H "$auth" -H 'Content-Type: application/json' \
              "$api/d1/database/$DATABASE_ID/query" \
              --data "$(jq -cn --arg sql "$sql" '{sql:$sql}')"
          }
          query "SELECT epoch_id,last_processed_ledger,last_processed_hash,latest_observed_ledger,latest_observed_hash,status,error_code,error_message,updated_at FROM sync_state WHERE network='devnet'" \
            | tee current-live-runtime-deploy/sync-before.json \
            | jq -e '.success == true' >/dev/null
          query "SELECT epoch_id,base_snapshot_id,base_ledger_index,base_ledger_hash,overlay_ledger_index,overlay_ledger_hash,updated_at FROM current_state_overlay_state WHERE network='devnet'" \
            | tee current-live-runtime-deploy/overlay-before.json \
            | jq -e '.success == true' >/dev/null
          before_ledger="$(jq -r '.result[0].results[0].last_processed_ledger // empty' current-live-runtime-deploy/sync-before.json)"
          test "$before_ledger" -eq "$before_ledger"
          echo "before_ledger=$before_ledger" >> "$GITHUB_OUTPUT"
          echo 'Canonical state before deploy:'
          jq '.result[0].results[0] // null' current-live-runtime-deploy/sync-before.json

      - name: Deploy direct Current runtime and schedule
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler deploy --config wrangler.jsonc \
            | tee current-live-runtime-deploy/wrangler-deploy.txt

      - name: Confirm public endpoints
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$PRODUCTION_BASE/api/health" \
            | tee current-live-runtime-deploy/health-after.json \
            | jq -e '.ok == true and .network == "devnet" and .mainnet_enabled == false' >/dev/null
          curl -fsS "$PRODUCTION_BASE/api/status" \
            | tee current-live-runtime-deploy/status-immediate.json >/dev/null
          curl -fsS "$PRODUCTION_BASE/api/overview" \
            | tee current-live-runtime-deploy/overview-immediate.json >/dev/null

      - name: Wait for one five-minute Current cycle
        run: sleep 370

      - name: Verify canonical cursor advances
        shell: bash
        env:
          BEFORE_LEDGER: ${{ steps.before.outputs.before_ledger }}
        run: |
          set -euo pipefail
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          query() {
            local sql="$1"
            curl -fsS -X POST -H "$auth" -H 'Content-Type: application/json' \
              "$api/d1/database/$DATABASE_ID/query" \
              --data "$(jq -cn --arg sql "$sql" '{sql:$sql}')"
          }
          query "SELECT epoch_id,last_processed_ledger,last_processed_hash,latest_observed_ledger,latest_observed_hash,status,error_code,error_message,updated_at FROM sync_state WHERE network='devnet'" \
            | tee current-live-runtime-deploy/sync-after.json \
            | jq -e '.success == true' >/dev/null
          query "SELECT epoch_id,base_snapshot_id,base_ledger_index,base_ledger_hash,overlay_ledger_index,overlay_ledger_hash,updated_at FROM current_state_overlay_state WHERE network='devnet'" \
            | tee current-live-runtime-deploy/overlay-after.json \
            | jq -e '.success == true' >/dev/null

          after_ledger="$(jq -r '.result[0].results[0].last_processed_ledger // empty' current-live-runtime-deploy/sync-after.json)"
          latest_ledger="$(jq -r '.result[0].results[0].latest_observed_ledger // empty' current-live-runtime-deploy/sync-after.json)"
          test "$after_ledger" -eq "$after_ledger"
          test "$latest_ledger" -eq "$latest_ledger"
          if ! { test "$after_ledger" -gt "$BEFORE_LEDGER" || test "$after_ledger" -eq "$latest_ledger"; }; then
            echo "direct Current cursor did not advance: before=$BEFORE_LEDGER after=$after_ledger latest=$latest_ledger" >&2
            jq '.result[0].results[0] // null' current-live-runtime-deploy/sync-after.json >&2
            exit 1
          fi

          curl -fsS "$PRODUCTION_BASE/api/status" \
            | tee current-live-runtime-deploy/status-after.json >/dev/null
          curl -fsS "$PRODUCTION_BASE/api/overview" \
            | tee current-live-runtime-deploy/overview-after.json >/dev/null
          jq -n \
            --arg runtimeSource "$RUNTIME_SOURCE_SHA" \
            --argjson beforeLedger "$BEFORE_LEDGER" \
            --argjson afterLedger "$after_ledger" \
            --argjson latestObservedLedger "$latest_ledger" \
            '{passed:true,runtimeSource:$runtimeSource,mode:"direct-five-minute-collector",beforeLedger:$beforeLedger,afterLedger:$afterLedger,latestObservedLedger:$latestObservedLedger}' \
            | tee current-live-runtime-deploy/result.json

      - name: Upload operational record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-live-runtime-deploy
          path: current-live-runtime-deploy
          if-no-files-found: warn
          retention-days: 30
