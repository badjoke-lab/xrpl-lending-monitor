name: Deploy hybrid transaction detail 999 v2

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/deploy-hybrid-transaction-detail-999-v2.yml
      - .github/hybrid-transaction-detail-999-v2-deploy-trigger
  push:
    branches: [main]
    paths:
      - .github/hybrid-transaction-detail-999-v2-deploy-trigger

permissions:
  contents: write

concurrency:
  group: production-worker-write
  cancel-in-progress: false

env:
  RUNTIME_SHA: ead8f7a2d06c7d010d2dbba076ec4d3fb6118c74
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
  PRODUCTION_BASE: https://xrpl-lending-monitor.badjoke-lab.workers.dev
  GH_TOKEN: ${{ github.token }}

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact merged runtime and deployment boundary
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${RUNTIME_SHA}"
          git cat-file -e "${RUNTIME_SHA}^{commit}"
          test "$(cat .github/hybrid-transaction-detail-999-v2-deploy-trigger)" = "deploy-${RUNTIME_SHA}"
          git diff --quiet "${RUNTIME_SHA}" -- src wrangler.jsonc package.json pnpm-lock.yaml migrations
          test -f migrations/10000_fast_lane_transaction_lookup.sql
          jq -e '
            .main=="src/worker/p0-redundant-scheduler-entry.ts"
            and .triggers.crons==["*/5 * * * *"]
            and .vars.APP_NETWORK=="devnet"
            and .vars.MAINNET_ENABLED=="false"
            and .vars.FAST_LANE_MAX_LEDGERS_PER_RUN=="96"
            and (.queues.producers|length)==1
            and (.queues.consumers|length)==1
            and .queues.consumers[0].max_batch_size==1
            and .queues.consumers[0].max_concurrency==1
            and (.vars|has("REPLACEMENT_BASE_CUTOVER_TOKEN")|not)
          ' wrangler.jsonc >/dev/null

  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Validate source and capture pre-deploy identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          git fetch --no-tags --depth=1 origin "${RUNTIME_SHA}"
          git cat-file -e "${RUNTIME_SHA}^{commit}"
          test "$(cat .github/hybrid-transaction-detail-999-v2-deploy-trigger)" = "deploy-${RUNTIME_SHA}"
          git diff --quiet "${RUNTIME_SHA}" -- src wrangler.jsonc package.json pnpm-lock.yaml migrations
          test -f migrations/10000_fast_lane_transaction_lookup.sql
          jq -e '
            .main=="src/worker/p0-redundant-scheduler-entry.ts"
            and .triggers.crons==["*/5 * * * *"]
            and .vars.APP_NETWORK=="devnet"
            and .vars.MAINNET_ENABLED=="false"
            and .vars.FAST_LANE_MAX_LEDGERS_PER_RUN=="96"
            and (.queues.producers|length)==1
            and (.queues.consumers|length)==1
            and .queues.consumers[0].max_batch_size==1
            and .queues.consumers[0].max_concurrency==1
          ' wrangler.jsonc >/dev/null
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-monitor/deployments" \
            > pre-deployments.json
          jq -e '.result.deployments|length>0' pre-deployments.json >/dev/null

      - name: Apply additive transaction lookup indexes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p migration-evidence
          pnpm exec wrangler d1 migrations list xrpl-lending-monitor --remote | tee migration-evidence/before.txt
          pnpm exec wrangler d1 migrations apply xrpl-lending-monitor --remote | tee migration-evidence/apply.txt
          pnpm exec wrangler d1 migrations list xrpl-lending-monitor --remote | tee migration-evidence/after.txt

      - name: Build application
        run: pnpm build

      - name: Deploy exact merged runtime
        id: deploy_worker
        run: pnpm exec wrangler deploy

      - name: Freeze deployment identity and active configuration
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          previous="$(jq -r '.result.deployments[0].id' pre-deployments.json)"
          found=false
          for attempt in $(seq 1 60); do
            curl --fail-with-body --silent --show-error --retry 2 --retry-all-errors \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-monitor/deployments" \
              > post-deployments.json || true
            current="$(jq -r '.result.deployments[0].id//empty' post-deployments.json 2>/dev/null || true)"
            if [ -n "$current" ] && [ "$current" != "$previous" ]; then found=true; break; fi
            sleep 2
          done
          test "$found" = true
          jq -e '(.result.deployments[0].versions|length)==1 and .result.deployments[0].versions[0].percentage==100' post-deployments.json >/dev/null
          jq '.result.deployments[0]' post-deployments.json > deployment.json

          for attempt in $(seq 1 30); do
            curl --fail-with-body --silent --show-error --retry 2 --retry-all-errors \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-monitor/settings" \
              > settings.json || true
            curl --fail-with-body --silent --show-error --retry 2 --retry-all-errors \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-monitor/schedules" \
              > schedules.json || true
            if jq -e '
              def binding($name): [.result.bindings[]|select(.name==$name)|(.text//.value)]|first;
              binding("APP_NETWORK")=="devnet"
              and binding("MAINNET_ENABLED")=="false"
              and binding("FAST_LANE_MAX_LEDGERS_PER_RUN")=="96"
              and ([.result.bindings[]|select(.name=="FAST_LANE_QUEUE" and .type=="queue")]|length)==1
              and ([.result.bindings[]|select(.name=="REPLACEMENT_BASE_CUTOVER_TOKEN")]|length)==0
            ' settings.json >/dev/null 2>&1 \
              && jq -e '.result.schedules|length==1 and .[0].cron=="*/5 * * * *"' schedules.json >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Read production state and select a real fast-lane witness
        shell: bash
        run: |
          set -euo pipefail
          query() {
            jq -n --arg sql "$1" '{sql:$sql}' | curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' --data-binary @- \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query" > "$2"
          }
          query "SELECT epoch_id,last_processed_ledger,last_processed_hash,latest_observed_ledger,latest_observed_hash,status,(latest_observed_ledger-last_processed_ledger) AS lag_ledgers,updated_at FROM fast_lane_shadow_state WHERE network='devnet'" fast.json
          query "SELECT epoch_id,overlay_ledger_index,overlay_ledger_hash,updated_at FROM current_state_overlay_state WHERE network='devnet'" overlay.json
          query "SELECT COUNT(*) AS compact_rows FROM fast_lane_shadow_objects_compact WHERE network='devnet'" compact.json
          query "SELECT COUNT(*) AS stale_rows FROM current_state_overlay_objects o WHERE o.network='devnet' AND NOT EXISTS (SELECT 1 FROM fast_lane_shadow_base_binding b WHERE b.network=o.network AND b.base_epoch_id=o.epoch_id AND b.base_snapshot_id=o.base_snapshot_id)" stale.json
          query "SELECT run_at,status,lag_ledgers,persistence_rows_written,error_message FROM fast_lane_shadow_run_metrics WHERE network='devnet' ORDER BY run_at DESC LIMIT 1" metric.json
          query "SELECT activity_bundle_json,end_ledger_index,created_at FROM fast_lane_shadow_windows WHERE network='devnet' ORDER BY end_ledger_index DESC LIMIT 256" activity.json
          python - <<'PY'
          import json,re
          rows=json.load(open('activity.json'))['result'][0]['results']
          pattern=re.compile(r'^[A-Fa-f0-9]{64}$')
          def walk(value):
              if isinstance(value,dict):
                  direct=value.get('hash')
                  if isinstance(direct,str) and pattern.fullmatch(direct):
                      return direct.upper()
                  for child in value.values():
                      found=walk(child)
                      if found: return found
              elif isinstance(value,list):
                  for child in value:
                      found=walk(child)
                      if found: return found
              return None
          witness=None
          for row in rows:
              witness=walk(json.loads(row['activity_bundle_json']))
              if witness: break
          if not witness:
              raise SystemExit('no transaction hash witness in bounded activity ring')
          open('witness-hash.txt','w').write(witness+'\n')
          PY

      - name: Verify public transaction detail and XRPL Devnet source
        id: witness
        shell: bash
        run: |
          set -euo pipefail
          HASH="$(cat witness-hash.txt)"
          code="$(curl --silent --show-error --retry 3 --retry-all-errors -o transaction.json -w '%{http_code}' "${PRODUCTION_BASE}/api/transactions/${HASH}")"
          test "$code" = 200
          jq -e --arg hash "$HASH" '
            .found==true
            and .transaction_hash==$hash
            and (.event!=null or (.object_changes|length)>0)
          ' transaction.json >/dev/null

          verified=false
          for endpoint in https://s.devnet.rippletest.net:51234 https://s.altnet.rippletest.net:51234; do
            jq -n --arg hash "$HASH" '{method:"tx",params:[{transaction:$hash,binary:false}]}' \
              | curl --silent --show-error --retry 2 --retry-all-errors \
                  -H 'Content-Type: application/json' --data-binary @- "$endpoint" > xrpl-tx.json || true
            if jq -e --arg hash "$HASH" '
              (.result.validated==true)
              and ((.result.hash//.result.tx_json.hash//"")|ascii_upcase)==$hash
            ' xrpl-tx.json >/dev/null 2>&1; then
              verified=true
              break
            fi
          done
          test "$verified" = true

          FAST_LEDGER="$(jq -r '.result[0].results[0].last_processed_ledger' fast.json)"
          FAST_HASH="$(jq -r '.result[0].results[0].last_processed_hash' fast.json)"
          OVERLAY_LEDGER="$(jq -r '.result[0].results[0].overlay_ledger_index' overlay.json)"
          OVERLAY_HASH="$(jq -r '.result[0].results[0].overlay_ledger_hash' overlay.json)"
          test "$FAST_LEDGER" = "$OVERLAY_LEDGER"
          test "$FAST_HASH" = "$OVERLAY_HASH"
          jq -e '.result[0].results[0].lag_ledgers==0 and .result[0].results[0].status=="healthy"' fast.json >/dev/null
          jq -e '.result[0].results[0].compact_rows==0' compact.json >/dev/null
          jq -e '.result[0].results[0].stale_rows==0' stale.json >/dev/null
          jq -e '.result[0].results[0].status=="committed" and .result[0].results[0].lag_ledgers==0 and .result[0].results[0].error_message==null and .result[0].results[0].persistence_rows_written<=300' metric.json >/dev/null

          for path in /api/overview /api/status/history-source '/api/status/fast-lane-diff?limit=1' /api/status/replacement-base-rebase; do
            status="$(curl --silent --show-error --retry 3 --retry-all-errors -o /dev/null -w '%{http_code}' "${PRODUCTION_BASE}${path}")"
            test "$status" = 200
          done

      - name: Retain deployment result
        if: always()
        shell: bash
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy_worker.outcome }}
          IDENTITY_OUTCOME: ${{ steps.identity.outcome }}
          WITNESS_OUTCOME: ${{ steps.witness.outcome }}
        run: |
          set -euo pipefail
          passed=false
          if [ "${DEPLOY_OUTCOME}" = success ] && [ "${IDENTITY_OUTCOME}" = success ] && [ "${WITNESS_OUTCOME}" = success ]; then passed=true; fi
          jq -n \
            --arg checkedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg runtimeSha "$RUNTIME_SHA" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg deployOutcome "${DEPLOY_OUTCOME:-unknown}" \
            --arg identityOutcome "${IDENTITY_OUTCOME:-unknown}" \
            --arg witnessOutcome "${WITNESS_OUTCOME:-unknown}" \
            --arg witnessHash "$(cat witness-hash.txt 2>/dev/null || true)" \
            --argjson passed "$passed" \
            '{checkedAt:$checkedAt,passed:$passed,runtimeSha:$runtimeSha,runId:$runId,runUrl:$runUrl,deployOutcome:$deployOutcome,identityOutcome:$identityOutcome,witnessOutcome:$witnessOutcome,witnessHash:$witnessHash}' \
            > deploy-status.json
          API_PATH="repos/${GITHUB_REPOSITORY}/contents/.github/hybrid-transaction-detail-999-deploy-status.json"
          CONTENT="$(base64 -w0 deploy-status.json)"
          EXISTING_SHA="$(gh api "$API_PATH" --jq .sha 2>/dev/null || true)"
          if [ -n "$EXISTING_SHA" ]; then
            gh api --method PUT "$API_PATH" -f message='Update hybrid transaction detail deploy status' -f content="$CONTENT" -f sha="$EXISTING_SHA" >/dev/null
          else
            gh api --method PUT "$API_PATH" -f message='Create hybrid transaction detail deploy status' -f content="$CONTENT" >/dev/null
          fi
          test "$passed" = true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-transaction-detail-999-v2-deploy-evidence
          path: |
            migration-evidence
            pre-deployments.json
            post-deployments.json
            deployment.json
            settings.json
            schedules.json
            fast.json
            overlay.json
            compact.json
            stale.json
            metric.json
            activity.json
            witness-hash.txt
            transaction.json
            xrpl-tx.json
            deploy-status.json
          if-no-files-found: warn
          retention-days: 14
