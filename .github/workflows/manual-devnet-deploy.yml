name: Manual Devnet deploy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type CONFIRM_DEVNET to continue
        required: true
        type: string
      apply_migrations:
        description: Apply pending remote D1 migrations
        required: true
        default: false
        type: boolean
      deploy_worker:
        description: Build and deploy the Worker
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      confirmed: ${{ steps.confirm.outputs.confirmed }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: confirm
        name: Validate explicit Devnet confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirmation }}" != "CONFIRM_DEVNET" ]; then
            echo "Expected confirmation value CONFIRM_DEVNET" >&2
            exit 1
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Cloudflare CI authentication is unavailable" >&2
            exit 1
          fi
          echo "confirmed=true" >> "$GITHUB_OUTPUT"
      - name: List unapplied remote D1 migrations
        run: pnpm exec wrangler d1 migrations list xrpl-lending-monitor --remote

  migrate:
    needs: preflight
    if: ${{ inputs.apply_migrations && needs.preflight.outputs.confirmed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply pending remote D1 migrations
        run: pnpm exec wrangler d1 migrations apply xrpl-lending-monitor --remote
      - name: Verify no unapplied remote D1 migrations remain
        run: pnpm exec wrangler d1 migrations list xrpl-lending-monitor --remote

  deploy:
    needs: [preflight, migrate]
    if: ${{ always() && inputs.deploy_worker && needs.preflight.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate repository before deployment
        run: pnpm check
      - name: Deploy Worker
        run: pnpm exec wrangler deploy

  summary:
    needs: [preflight, migrate, deploy]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Report operation results
        shell: bash
        run: |
          echo "preflight=${{ needs.preflight.result }}"
          echo "migrate=${{ needs.migrate.result }}"
          echo "deploy=${{ needs.deploy.result }}"
          if [ "${{ needs.preflight.result }}" != "success" ]; then exit 1; fi
          if [ "${{ inputs.apply_migrations }}" = "true" ] && [ "${{ needs.migrate.result }}" != "success" ]; then exit 1; fi
          if [ "${{ inputs.deploy_worker }}" = "true" ] && [ "${{ needs.deploy.result }}" != "success" ]; then exit 1; fi
