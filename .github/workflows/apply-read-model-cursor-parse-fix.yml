name: Apply read-model cursor parse fix

on:
  push:
    branches: [main]
    paths: [.github/check-runs-inspect-trigger]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize cursor parse errors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/shared/current-state/github-read-model-reader.ts')
          text = path.read_text()
          before = "  const source = record(JSON.parse(new TextDecoder().decode(bytes)), 'cursor')"
          after = "  let parsed: unknown\n  try {\n    parsed = JSON.parse(new TextDecoder().decode(bytes))\n  } catch {\n    throw new Error('Read-model cursor is invalid')\n  }\n  const source = record(parsed, 'cursor')"
          if text.count(before) != 1:
              raise SystemExit('cursor parse target mismatch')
          path.write_text(text.replace(before, after))
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/shared/current-state/github-read-model-reader.ts
          git diff --cached --check
          git commit -m "Normalize read-model cursor parse errors"
          git pull --rebase origin main
          git push origin HEAD:main
