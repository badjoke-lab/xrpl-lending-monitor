name: P0 enable formal start-gate dispatch 2026-07-21

on:
  push:
    branches: [main]
    paths:
      - .github/p0-enable-formal-start-gate-dispatch-20260721-trigger

permissions:
  contents: write

jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add workflow_dispatch to formal start gate
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/formal-free-operation-soak-start-gate.yml')
          text = path.read_text()
          if '  workflow_dispatch:' not in text:
              old = """on:
            push:
              branches: [main]
              paths:
                - .github/formal-free-soak-start-trigger
          """
              new = """on:
            push:
              branches: [main]
              paths:
                - .github/formal-free-soak-start-trigger
            workflow_dispatch:
          """
              if old not in text:
                  raise SystemExit('formal start-gate trigger block not found')
              path.write_text(text.replace(old, new, 1))
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/formal-free-operation-soak-start-gate.yml
          if git diff --cached --quiet; then
            echo 'Formal start gate already supports workflow_dispatch.'
          else
            git commit -m 'Enable dispatch for formal Free-operation start gate'
            git push origin HEAD:main
          fi
