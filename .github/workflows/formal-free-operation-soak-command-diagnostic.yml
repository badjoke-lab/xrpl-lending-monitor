name: Formal soak production monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  issue_comment:
    types: [created]
  push:
    branches: [main]
    paths:
      - '.github/workflows/formal-free-operation-soak-command-diagnostic.yml'

concurrency:
  group: formal-soak-production-monitor
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 976 &&
       contains(github.event.comment.body, '/run-formal-soak-diagnostic'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: '976'
      PRODUCTION_BASE: https://xrpl-lending-monitor.badjoke-lab.workers.dev
    steps:
      - name: Query and record production evidence
        shell: bash
        run: |
          set -u

          query() {
            jq -n --arg sql "$1" '{sql:$sql}' | curl --silent --show-error \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' --data-binary @- \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query"
          }

          state="$(query "SELECT epoch_id,last_processed_ledger,last_processed_hash,latest_observed_ledger,latest_observed_hash,status,(latest_observed_ledger-last_processed_ledger) AS lag_ledgers FROM fast_lane_shadow_state WHERE network='devnet'")"
          binding="$(query "SELECT base_epoch_id,base_snapshot_id,base_ledger_index,base_ledger_hash FROM fast_lane_shadow_base_binding WHERE network='devnet'")"
          overlay="$(query "SELECT COUNT(*) AS overlay_rows,COALESCE(SUM(LENGTH(projection_json)),0) AS overlay_payload_bytes FROM current_state_overlay_objects WHERE network='devnet'")"
          stale="$(query "SELECT COUNT(*) AS stale_rows FROM current_state_overlay_objects o WHERE o.network='devnet' AND NOT EXISTS (SELECT 1 FROM fast_lane_shadow_base_binding b WHERE b.network=o.network AND b.base_epoch_id=o.epoch_id AND b.base_snapshot_id=o.base_snapshot_id)")"
          overlay_state="$(query "SELECT COUNT(*) AS state_rows,MAX(overlay_ledger_index) AS overlay_ledger_index FROM current_state_overlay_state WHERE network='devnet'")"
          compact="$(query "SELECT COUNT(*) AS compact_rows FROM fast_lane_shadow_objects_compact WHERE network='devnet'")"
          metrics_schema="$(query "PRAGMA table_info(fast_lane_shadow_run_metrics)")"
          recent_metrics="$(query "SELECT * FROM fast_lane_shadow_run_metrics WHERE network='devnet' ORDER BY run_at DESC LIMIT 12")"
          formal_metrics="$(query "SELECT * FROM fast_lane_shadow_run_metrics WHERE network='devnet' AND run_at >= '2026-07-23T16:13:00Z' ORDER BY run_at ASC")"

          overview_code="$(curl --silent --show-error -o overview.json -w '%{http_code}' "${PRODUCTION_BASE}/api/overview" || true)"
          history_code="$(curl --silent --show-error -o history.json -w '%{http_code}' "${PRODUCTION_BASE}/api/status/history-source" || true)"
          diff_code="$(curl --silent --show-error -o diff.json -w '%{http_code}' "${PRODUCTION_BASE}/api/status/fast-lane-diff?limit=500" || true)"

          jq -n \
            --argjson state "$(jq '.result[0].results // []' <<<"$state")" \
            --argjson binding "$(jq '.result[0].results // []' <<<"$binding")" \
            --argjson overlay "$(jq '.result[0].results // []' <<<"$overlay")" \
            --argjson stale "$(jq '.result[0].results // []' <<<"$stale")" \
            --argjson overlayState "$(jq '.result[0].results // []' <<<"$overlay_state")" \
            --argjson compact "$(jq '.result[0].results // []' <<<"$compact")" \
            --argjson metricsSchema "$(jq '.result[0].results // []' <<<"$metrics_schema")" \
            --argjson recentMetrics "$(jq '.result[0].results // []' <<<"$recent_metrics")" \
            --argjson formalMetrics "$(jq '.result[0].results // []' <<<"$formal_metrics")" \
            --arg overview "$overview_code" --arg history "$history_code" --arg diff "$diff_code" \
            '{checkedAt:(now|todate),formalSoakStart:"2026-07-23T16:13:00Z",formalSoakEnd:"2026-07-24T16:13:00Z",state:$state,binding:$binding,overlay:$overlay,stale:$stale,overlayState:$overlayState,compact:$compact,metricsSchema:$metricsSchema,recentMetrics:$recentMetrics,formalMetrics:$formalMetrics,formalMetricCount:($formalMetrics|length),api:{overview:$overview,historySource:$history,fastLaneDiff:$diff}}' > summary.json

          {
            echo 'Formal soak production evidence:'
            echo
            echo '```json'
            cat summary.json
            echo '```'
          } > comment.md

          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file comment.md
