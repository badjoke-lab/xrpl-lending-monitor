name: Inventory Cloudflare cron trigger slots

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/inventory-cloudflare-cron-slots.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: mkdir -p cron-slot-inventory

      - name: List Worker scripts
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts" \
            > cron-slot-inventory/scripts.json
          jq -e '.success == true and (.result | type == "array")' cron-slot-inventory/scripts.json > /dev/null

      - name: Read schedules for every Worker script
        shell: bash
        run: |
          set -euo pipefail
          : > cron-slot-inventory/scheduled-workers.ndjson
          jq -r '.result[] | .id // .name // empty' cron-slot-inventory/scripts.json | while IFS= read -r SCRIPT; do
            test -n "${SCRIPT}" || continue
            SAFE="$(printf '%s' "${SCRIPT}" | tr -c 'A-Za-z0-9._-' '_')"
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${SCRIPT}/schedules" \
              > "cron-slot-inventory/${SAFE}-schedules.json"
            COUNT="$(jq '.result.schedules | length' "cron-slot-inventory/${SAFE}-schedules.json")"
            if [ "${COUNT}" -gt 0 ]; then
              jq -c --arg script "${SCRIPT}" '{script:$script,schedules:.result.schedules}' \
                "cron-slot-inventory/${SAFE}-schedules.json" >> cron-slot-inventory/scheduled-workers.ndjson
            fi
          done

      - name: Build inventory summary
        run: |
          jq -s '{schemaVersion:1,scheduledWorkers:.,totalCronTriggers:([.[].schedules | length] | add // 0)}' \
            cron-slot-inventory/scheduled-workers.ndjson > cron-slot-inventory/summary.json
          cat cron-slot-inventory/summary.json
          test "$(jq -r '.totalCronTriggers' cron-slot-inventory/summary.json)" -eq 5

      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-cron-slot-inventory
          path: cron-slot-inventory
          retention-days: 14
