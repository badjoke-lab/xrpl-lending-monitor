name: Verify shared fast lane runtime

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/verify-shared-fast-lane-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p shared-fast-lane-runtime-evidence

      - name: Verify schedule ownership without changing triggers
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-monitor/schedules" \
            > shared-fast-lane-runtime-evidence/main-schedules.json
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-fast-lane-shadow/schedules" \
            > shared-fast-lane-runtime-evidence/separate-fast-schedules.json
          jq -e '.success == true and (.result.schedules | length == 1) and (.result.schedules[0].cron == "*/5 * * * *")' \
            shared-fast-lane-runtime-evidence/main-schedules.json > /dev/null
          jq -e '.success == true and (.result.schedules | length == 0)' \
            shared-fast-lane-runtime-evidence/separate-fast-schedules.json > /dev/null

      - name: Read existing fast-lane metrics without reset
        run: |
          pnpm exec wrangler d1 execute xrpl-lending-monitor --remote \
            --command "SELECT run_at,status,start_ledger_index,end_ledger_index,latest_observed_ledger,lag_ledgers,ledgers_processed,lending_transactions,coalesced_object_rows,persistence_rows_read,persistence_rows_written FROM fast_lane_shadow_run_metrics WHERE network='devnet' ORDER BY run_at ASC;" \
            --json > shared-fast-lane-runtime-evidence/metrics-raw.txt
          sed -n '/^\[/,$p' shared-fast-lane-runtime-evidence/metrics-raw.txt \
            > shared-fast-lane-runtime-evidence/metrics.json
          jq -e '.[0].results | length >= 2' shared-fast-lane-runtime-evidence/metrics.json > /dev/null

      - name: Verify advancing cursor, cadence, and measured D1 writes
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const payload = JSON.parse(fs.readFileSync('shared-fast-lane-runtime-evidence/metrics.json', 'utf8'))
          const rows = payload[0]?.results ?? []
          if (rows.length < 2) throw new Error('Need at least two fast-lane run metrics')
          const first = rows.at(-2)
          const second = rows.at(-1)
          const gapSeconds = (Date.parse(second.run_at) - Date.parse(first.run_at)) / 1000
          if (!(second.end_ledger_index > first.end_ledger_index)) {
            throw new Error(`Cursor did not advance: ${first.end_ledger_index} -> ${second.end_ledger_index}`)
          }
          if (!(gapSeconds > 0 && gapSeconds <= 900)) {
            throw new Error(`Observed cadence gap out of bound: ${gapSeconds}`)
          }
          if (!(first.persistence_rows_written >= 0 && second.persistence_rows_written >= 0)) {
            throw new Error('Measured persistence rows_written missing')
          }
          const summary = {
            schemaVersion: 1,
            passed: true,
            sampleCount: rows.length,
            first: {
              runAt: first.run_at,
              endLedger: first.end_ledger_index,
              lendingTransactions: first.lending_transactions,
              coalescedObjectRows: first.coalesced_object_rows,
              rowsRead: first.persistence_rows_read,
              rowsWritten: first.persistence_rows_written,
            },
            second: {
              runAt: second.run_at,
              endLedger: second.end_ledger_index,
              lendingTransactions: second.lending_transactions,
              coalescedObjectRows: second.coalesced_object_rows,
              rowsRead: second.persistence_rows_read,
              rowsWritten: second.persistence_rows_written,
            },
            ledgerAdvance: second.end_ledger_index - first.end_ledger_index,
            observedGapSeconds: gapSeconds,
          }
          fs.writeFileSync('shared-fast-lane-runtime-evidence/summary.json', JSON.stringify(summary, null, 2) + '\n')
          console.log(JSON.stringify(summary, null, 2))
          NODE

      - name: Capture protected collector status after shared-cron cutover
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            > shared-fast-lane-runtime-evidence/subdomain.json
          SUBDOMAIN="$(jq -r '.result.subdomain // empty' shared-fast-lane-runtime-evidence/subdomain.json)"
          test -n "${SUBDOMAIN}"
          curl --fail-with-body --silent --show-error \
            "https://xrpl-lending-monitor.${SUBDOMAIN}.workers.dev/api/status/collector" \
            > shared-fast-lane-runtime-evidence/collector-status.json
          jq -e '.network == "devnet" and .consecutive_failures == 0' \
            shared-fast-lane-runtime-evidence/collector-status.json > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: shared-fast-lane-runtime-evidence
          path: shared-fast-lane-runtime-evidence
          if-no-files-found: error
          retention-days: 14
