name: P0 report main tree

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  report:
    if: startsWith(github.event.issue.title, 'P0 report main tree')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          gh issue comment "${ISSUE_NUMBER}" --repo "${REPOSITORY}" --body "commit=$(git rev-parse HEAD) tree=$(git rev-parse 'HEAD^{tree}')"
