name: Publish current-state read model

on:
  push:
    branches: [main]
    paths: [.github/current-state-read-model-publish-trigger]

permissions:
  actions: read
  contents: write

concurrency:
  group: current-state-read-model-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SOURCE_RUN_ID: '28699460881'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: current-state-release-assets
          path: .local/current-state-release
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Verify complete source artifact
        run: |
          test "$(jq -r .complete .local/current-state-release/release-summary.json)" = "true"
          test "$(jq -r .dataAssets .local/current-state-release/release-summary.json)" = "20"
          test "$(jq -r .indexAssets .local/current-state-release/release-summary.json)" = "64"
          test "$(find .local/current-state-release/assets -maxdepth 1 -type f | wc -l)" = "85"

      - name: Build read-model compiler
        run: pnpm exec vite build --config vite.current-state-read-model.config.ts

      - name: Compile lightweight read model
        run: |
          node .current-state-read-model-build/build-current-state-read-model.mjs \
            --input-dir .local/current-state-release/assets \
            --output-dir .local/current-state-read-model \
            --page-size 50 \
            --lookup-prefix-length 3

      - name: Verify read model
        run: |
          SUMMARY=.local/current-state-read-model/read-model-summary.json
          test "$(jq -r .pageSize "$SUMMARY")" = "50"
          test "$(jq -r .lookupPrefixLength "$SUMMARY")" = "3"
          test "$(jq -r .lookupBuckets "$SUMMARY")" = "4096"
          test "$(jq -r '.counts.vaults + .counts.loanBrokers + .counts.loans' "$SUMMARY")" = "1552503"
          test "$(find .local/current-state-read-model/read-model/pages -type f | wc -l)" = "31051"
          test "$(find .local/current-state-read-model/read-model/lookup -type f | wc -l)" = "4096"

      - name: Stage branch payload
        run: |
          rm -rf /tmp/current-state-read-model
          mkdir -p /tmp/current-state-read-model
          cp -R .local/current-state-read-model/read-model /tmp/current-state-read-model/read-model
          cp .local/current-state-read-model/read-model-summary.json /tmp/current-state-read-model/read-model-summary.json

      - name: Publish immutable read-model commit and active channel
        id: publish
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout --orphan current-state-read-model-publish
          git rm -rf . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R /tmp/current-state-read-model/. .
          git add read-model read-model-summary.json
          git commit -m "Publish lightweight current-state read model"
          DATA_SHA=$(git rev-parse HEAD)
          MANIFEST_SHA=$(jq -r .manifestSha256 read-model-summary.json)
          RELEASE_TAG=$(jq -r .releaseTag read-model-summary.json)
          SNAPSHOT_ID=$(jq -r .snapshotId read-model-summary.json)
          jq -n \
            --arg dataCommitSha "$DATA_SHA" \
            --arg manifestSha256 "$MANIFEST_SHA" \
            --arg releaseTag "$RELEASE_TAG" \
            --arg snapshotId "$SNAPSHOT_ID" \
            --arg updatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schemaVersion:1,active:{dataCommitSha:$dataCommitSha,manifestPath:"read-model/manifest.json",manifestSha256:$manifestSha256,releaseTag:$releaseTag,snapshotId:$snapshotId},updatedAt:$updatedAt}' \
            > channel.json
          git add channel.json
          git commit -m "Activate lightweight current-state read model"
          git push --force origin HEAD:refs/heads/current-state-data
          echo "data_sha=$DATA_SHA" >> "$GITHUB_OUTPUT"

      - name: Report publication status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          DATA_SHA: ${{ steps.publish.outputs.data_sha }}
        run: |
          SUMMARY=.local/current-state-read-model/read-model-summary.json
          jq -n \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg sourceRunId "$SOURCE_RUN_ID" \
            --arg outcome "$PUBLISH_OUTCOME" \
            --arg dataCommitSha "$DATA_SHA" \
            --arg snapshotId "$(jq -r '.snapshotId // ""' "$SUMMARY" 2>/dev/null || true)" \
            '{runId:$runId,runUrl:$runUrl,sourceRunId:$sourceRunId,outcome:$outcome,dataCommitSha:$dataCommitSha,snapshotId:$snapshotId}' \
            > read-model-publish-status.json
          API="repos/${GITHUB_REPOSITORY}/contents/.github/current-state-read-model-publish-status.json"
          CONTENT=$(base64 -w0 read-model-publish-status.json)
          SHA=$(gh api "$API" --jq .sha 2>/dev/null || true)
          if [ -n "$SHA" ]; then
            gh api --method PUT "$API" -f message="Update read-model publication status" -f content="$CONTENT" -f sha="$SHA" >/dev/null
          else
            gh api --method PUT "$API" -f message="Create read-model publication status" -f content="$CONTENT" >/dev/null
          fi
