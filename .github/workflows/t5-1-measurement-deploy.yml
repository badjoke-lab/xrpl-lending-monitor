name: T5-1 measurement deploy

on:
  push:
    branches:
      - ops/t5-1-measurement-deploy

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  migrate-deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Capture remote migration state before apply
        run: pnpm exec wrangler d1 migrations list xrpl-lending-monitor --remote | tee migrations-before.txt

      - name: Apply pending remote D1 migrations
        run: pnpm exec wrangler d1 migrations apply xrpl-lending-monitor --remote

      - name: Verify remote migration state after apply
        run: pnpm exec wrangler d1 migrations list xrpl-lending-monitor --remote | tee migrations-after.txt

      - name: Validate repository before deployment
        run: pnpm check

      - name: Deploy Worker
        run: pnpm exec wrangler deploy

      - name: Wait for one measured WSS32 scheduled run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p t5-1-production-evidence
          DEPLOYED_AT_MS="$(node -e 'process.stdout.write(String(Date.now()))')"

          curl --fail-with-body --silent --show-error --retry 3 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            > t5-1-production-evidence/subdomain.json
          SUBDOMAIN="$(jq -r '.result.subdomain // empty' t5-1-production-evidence/subdomain.json)"
          test -n "${SUBDOMAIN}"
          BASE="https://xrpl-lending-monitor.${SUBDOMAIN}.workers.dev"
          printf '%s\n' "${BASE}" > t5-1-production-evidence/base-url.txt

          for ATTEMPT in $(seq 1 16); do
            curl --fail-with-body --silent --show-error --retry 3 \
              "${BASE}/api/status/collector" \
              > t5-1-production-evidence/collector-latest.json

            LAST_ATTEMPT="$(jq -r '.timing.last_attempt_at // empty' t5-1-production-evidence/collector-latest.json)"
            LAST_ATTEMPT_MS="$(node -e 'const v=Date.parse(process.argv[1]||""); process.stdout.write(Number.isFinite(v)?String(v):"0")' "${LAST_ATTEMPT}")"
            PERSISTENCE_STATEMENTS="$(jq -r '.usage.persistence_statements // 0' t5-1-production-evidence/collector-latest.json)"

            if [ "${LAST_ATTEMPT_MS}" -gt "${DEPLOYED_AT_MS}" ] && [ "${PERSISTENCE_STATEMENTS}" -gt 0 ]; then
              cp t5-1-production-evidence/collector-latest.json t5-1-production-evidence/collector-measured.json
              jq '{status, cursor, timing, usage, endpoint, consecutive_failures, error}' \
                t5-1-production-evidence/collector-measured.json \
                > t5-1-production-evidence/summary.json
              exit 0
            fi

            sleep 30
          done

          echo "No post-deploy measured collector run observed" >&2
          exit 1

      - name: Upload T5-1 production evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: t5-1-wss32-persistence-usage
          path: |
            migrations-before.txt
            migrations-after.txt
            t5-1-production-evidence
          if-no-files-found: warn
