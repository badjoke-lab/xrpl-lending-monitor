name: M5 browser lint diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/m5-browser-lint-diagnostic.yml

permissions:
  contents: read

jobs:
  lint-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture ESLint JSON
        shell: bash
        run: |
          set +e
          pnpm exec eslint scripts/run-m5-5-browser-regression.mjs -f json > m5-browser-lint.json
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: m5-browser-lint-diagnostic
          path: m5-browser-lint.json
          retention-days: 1
