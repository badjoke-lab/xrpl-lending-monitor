name: Apply converged canary gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-converged-canary-gate.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Accept verified production convergence and assert production schedule
        run: |
          python - <<'PY'
          from pathlib import Path

          script = Path('scripts/verify-three-layer-read-canary.ts')
          source = script.read_text()
          old = """  const effectiveDifferences = (comparisonCounts.created ?? 0)\n    + (comparisonCounts.changed ?? 0)\n    + (comparisonCounts.deleted ?? 0)\n\n  const summary = {\n    schemaVersion: 1,\n    generatedAt: new Date().toISOString(),\n    passed: candidateFailures.length === 0 && effectiveDifferences > 0,\n"""
          new = """  const effectiveDifferences = (comparisonCounts.created ?? 0)\n    + (comparisonCounts.changed ?? 0)\n    + (comparisonCounts.deleted ?? 0)\n  const unchangedWitnesses = comparisonCounts.unchanged ?? 0\n  const productionConverged = effectiveDifferences === 0\n    && unchangedWitnesses === witnesses.length\n\n  const summary = {\n    schemaVersion: 1,\n    generatedAt: new Date().toISOString(),\n    passed: candidateFailures.length === 0\n      && (effectiveDifferences > 0 || productionConverged),\n    comparisonMode: effectiveDifferences > 0 ? 'differential' : 'converged',\n    productionConverged,\n"""
          if source.count(old) != 1:
              raise SystemExit(f'expected script patch target once, found {source.count(old)}')
          script.write_text(source.replace(old, new))

          workflow = Path('.github/workflows/verify-three-layer-read-canary.yml')
          source = workflow.read_text()
          old = """          jq -e '.success == true and (.result.schedules | length == 0)' \\\n            three-layer-canary-evidence/canary-schedules.json > /dev/null\n\n      - name: Resolve production and canary URLs\n"""
          new = """          jq -e '.success == true and (.result.schedules | length == 0)' \\\n            three-layer-canary-evidence/canary-schedules.json > /dev/null\n\n      - name: Verify production keeps the shared five-minute schedule\n        run: |\n          curl --fail-with-body --silent --show-error \\\n            -H \"Authorization: Bearer ${CLOUDFLARE_API_TOKEN}\" \\\n            \"https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-monitor/schedules\" \\\n            > three-layer-canary-evidence/production-schedules.json\n          jq -e '.success == true and (.result.schedules | length == 1) and any(.result.schedules[]; .cron == \"*/5 * * * *\")' \\\n            three-layer-canary-evidence/production-schedules.json > /dev/null\n\n      - name: Resolve production and canary URLs\n"""
          if source.count(old) != 1:
              raise SystemExit(f'expected schedule patch target once, found {source.count(old)}')
          source = source.replace(old, new)
          old = """          jq -e '.passed == true and .witnessCount > 0 and .candidateFailureCount == 0 and .effectiveDifferences > 0' \\\n            three-layer-canary-evidence/summary.json > /dev/null\n"""
          new = """          jq -e '.passed == true and .witnessCount > 0 and .candidateFailureCount == 0 and ((.effectiveDifferences > 0) or (.productionConverged == true))' \\\n            three-layer-canary-evidence/summary.json > /dev/null\n"""
          if source.count(old) != 1:
              raise SystemExit(f'expected final gate target once, found {source.count(old)}')
          workflow.write_text(source.replace(old, new))
          PY
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/apply-converged-canary-gate.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/verify-three-layer-read-canary.ts .github/workflows/verify-three-layer-read-canary.yml
          git commit -m "ops: accept verified production convergence"
          git push origin HEAD:${{ github.head_ref }}
