name: R5 collector runs retention preflight

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: r5-collector-runs-retention-preflight
  cancel-in-progress: false

env:
  QUALIFICATION_ISSUE: '1261'
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
  GH_TOKEN: ${{ github.token }}

jobs:
  probe:
    if: >-
      github.event.issue.number == 1261 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      github.event.comment.body == '/r5-collector-runs-retention-preflight'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Read collector run retention prerequisites only
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r5-collector-runs-retention-preflight-evidence
          source_commit="$(git rev-parse HEAD)"
          script_sha="$(sha256sum scripts/r5-collector-runs-retention-readonly-preflight.mjs | awk '{print $1}')"
          node scripts/r5-collector-runs-retention-readonly-preflight.mjs \
            --source-commit "$source_commit" \
            --output r5-collector-runs-retention-preflight-evidence/preflight.json \
            > /tmp/r5-collector-runs-retention-preflight.json
          test "$(jq -r '.safety.readOnly' /tmp/r5-collector-runs-retention-preflight.json)" = true
          test "$(jq -r '.safety.retentionMutationAuthorized' /tmp/r5-collector-runs-retention-preflight.json)" = false
          test "$(jq -r '.safety.physicalRewriteAuthorized' /tmp/r5-collector-runs-retention-preflight.json)" = false
          test "$(jq -r '.safety.sequenceMutationAuthorized' /tmp/r5-collector-runs-retention-preflight.json)" = false
          test "$(jq -r '.safety.schedulerMutationAuthorized' /tmp/r5-collector-runs-retention-preflight.json)" = false
          test "$(jq -r '.safety.deploymentAuthorized' /tmp/r5-collector-runs-retention-preflight.json)" = false
          test "$(jq -r '.safety.publicReaderMutationAuthorized' /tmp/r5-collector-runs-retention-preflight.json)" = false
          test "$(jq -r '.safety.mainnetDisabled' /tmp/r5-collector-runs-retention-preflight.json)" = true
          test "$(jq -r '.safety.r5RearmAuthorized' /tmp/r5-collector-runs-retention-preflight.json)" = false
          printf 'source_commit=%s\nscript_sha=%s\nstate_sha=%s\ndatabase_bytes=%s\nrelation_bytes=%s\nexact_rows=%s\nretained_rows=%s\ncandidate_rows=%s\ncandidate_logical_bytes=%s\ninbound_fk_count=%s\nconsumer_count=%s\nsequence_count=%s\n' \
            "$source_commit" "$script_sha" \
            "$(jq -r '.structuralStateSha256' /tmp/r5-collector-runs-retention-preflight.json)" \
            "$(jq -r '.databaseBytes' /tmp/r5-collector-runs-retention-preflight.json)" \
            "$(jq -r '.relationBytes' /tmp/r5-collector-runs-retention-preflight.json)" \
            "$(jq -r '.exactRows' /tmp/r5-collector-runs-retention-preflight.json)" \
            "$(jq -r '.retention.retainedRows' /tmp/r5-collector-runs-retention-preflight.json)" \
            "$(jq -r '.retention.candidateRows' /tmp/r5-collector-runs-retention-preflight.json)" \
            "$(jq -r '.retention.candidateLogicalBytes' /tmp/r5-collector-runs-retention-preflight.json)" \
            "$(jq -r '.inboundForeignKeys|length' /tmp/r5-collector-runs-retention-preflight.json)" \
            "$(jq -r '.routineConsumers|length' /tmp/r5-collector-runs-retention-preflight.json)" \
            "$(jq -r '.sequences|length' /tmp/r5-collector-runs-retention-preflight.json)" \
            >> "$GITHUB_OUTPUT"

      - name: Publish sanitized collector retention result
        env:
          SOURCE_COMMIT: ${{ steps.probe.outputs.source_commit }}
          SCRIPT_SHA: ${{ steps.probe.outputs.script_sha }}
          STATE_SHA: ${{ steps.probe.outputs.state_sha }}
          DATABASE_BYTES: ${{ steps.probe.outputs.database_bytes }}
          RELATION_BYTES: ${{ steps.probe.outputs.relation_bytes }}
          EXACT_ROWS: ${{ steps.probe.outputs.exact_rows }}
          RETAINED_ROWS: ${{ steps.probe.outputs.retained_rows }}
          CANDIDATE_ROWS: ${{ steps.probe.outputs.candidate_rows }}
          CANDIDATE_LOGICAL_BYTES: ${{ steps.probe.outputs.candidate_logical_bytes }}
          INBOUND_FK_COUNT: ${{ steps.probe.outputs.inbound_fk_count }}
          CONSUMER_COUNT: ${{ steps.probe.outputs.consumer_count }}
          SEQUENCE_COUNT: ${{ steps.probe.outputs.sequence_count }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r5-collector-runs-retention-result.md <<EOF2
          ## R5 collector run history retention preflight — READ ONLY

          - source main: \`${SOURCE_COMMIT}\`
          - preflight script SHA-256: \`${SCRIPT_SHA}\`
          - structural state SHA-256: \`${STATE_SHA}\`
          - database bytes: \`${DATABASE_BYTES}\`
          - collector relation bytes / exact rows: \`${RELATION_BYTES} / ${EXACT_ROWS}\`
          - proposed retain-latest / candidate rows: \`${RETAINED_ROWS} / ${CANDIDATE_ROWS}\`
          - candidate logical bytes: \`${CANDIDATE_LOGICAL_BYTES}\`
          - inbound FK / routine consumer / owned-sequence counts: \`${INBOUND_FK_COUNT} / ${CONSUMER_COUNT} / ${SEQUENCE_COUNT}\`
          - retention/rewrite/sequence/scheduler/R5 rearm authorized: \`false / false / false / false / false\`

          This is measurement only. It does not authorize collector-history DELETE/TRUNCATE/rewrite, sequence reset, REINDEX/VACUUM/CLUSTER, scheduler/deployment/public-reader/Mainnet change, stabilization, soak, or R5 restart.
          EOF2
          gh issue comment "$QUALIFICATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/r5-collector-runs-retention-result.md

      - name: Upload sanitized collector retention evidence
        if: always() && steps.probe.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: r5-collector-runs-retention-preflight-evidence
          path: r5-collector-runs-retention-preflight-evidence
          if-no-files-found: error
          retention-days: 14
