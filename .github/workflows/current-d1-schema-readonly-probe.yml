name: Current direct read-only probe

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: current-direct-readonly-probe
  cancel-in-progress: false

env:
  DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
  SCRIPT_NAME: xrpl-lending-monitor
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  probe:
    if: >-
      github.event.issue.number == 995 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      github.event.comment.body == '/current-d1-schema-probe'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read direct Current production state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p current-direct-probe
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          d1="$api/d1/database/$DATABASE_ID/query"
          query() {
            local sql="$1"
            curl -fsS -X POST -H "$auth" -H 'Content-Type: application/json' "$d1" \
              --data "$(jq -cn --arg sql "$sql" '{sql:$sql}')"
          }

          query "SELECT epoch_id,last_processed_ledger,last_processed_hash,latest_observed_ledger,latest_observed_hash,status,error_code,error_message,last_attempt_at,last_success_at,updated_at FROM sync_state WHERE network='devnet'" \
            | tee current-direct-probe/sync.json >/dev/null
          query "SELECT status,last_attempt_at,last_success_at,consecutive_failures,lag_ledgers,endpoint,last_run_duration_ms,last_rpc_requests,last_endpoint_attempts,last_ledgers_processed,last_inspected_transactions,last_lending_transactions,last_estimated_rows,last_estimated_statements,last_overlay_mutations,last_persistence_batch_results,last_persistence_statements,last_persistence_rows_read,last_persistence_rows_written,error_code,error_message,updated_at FROM incremental_collector_state WHERE network='devnet'" \
            | tee current-direct-probe/collector.json >/dev/null
          query "SELECT epoch_id,base_snapshot_id,base_ledger_index,base_ledger_hash,overlay_ledger_index,overlay_ledger_hash,updated_at FROM current_state_overlay_state WHERE network='devnet' ORDER BY updated_at DESC LIMIT 3" \
            | tee current-direct-probe/overlay.json >/dev/null
          curl -fsS -H "$auth" "$api/workers/scripts/$SCRIPT_NAME/schedules" \
            | tee current-direct-probe/schedules.json >/dev/null

          for file in sync collector overlay schedules; do
            jq -e '.success == true' "current-direct-probe/${file}.json" >/dev/null
          done

          jq -n \
            --argjson sync "$(jq '.result[0].results[0] // null' current-direct-probe/sync.json)" \
            --argjson collector "$(jq '.result[0].results[0] // null' current-direct-probe/collector.json)" \
            --argjson overlay "$(jq '.result[0].results[0] // null' current-direct-probe/overlay.json)" \
            --argjson schedules "$(jq '.result.schedules // []' current-direct-probe/schedules.json)" \
            '{passed:true,productionMutation:false,sync:$sync,collector:$collector,overlay:$overlay,schedules:$schedules}' \
            | tee current-direct-probe/result.json

      - name: Upload direct Current evidence
        uses: actions/upload-artifact@v4
        with:
          name: current-direct-readonly-probe
          path: current-direct-probe
          if-no-files-found: error
          retention-days: 7
