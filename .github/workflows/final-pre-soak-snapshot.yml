name: Final pre-soak snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/final-pre-soak-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: https://xrpl-lending-monitor.badjoke-lab.workers.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture public and source state
        shell: bash
        run: |
          set -euo pipefail
          ROOT=final-pre-soak-snapshot
          mkdir -p "$ROOT"
          for spec in \
            'overview:/api/overview' \
            'collector:/api/status/collector' \
            'history:/api/status/history-source' \
            'rebase:/api/status/replacement-base-rebase' \
            'diff:/api/status/fast-lane-diff?limit=500' \
            'continuation:/api/status/continuation-verification' \
            'm1:/api/status/m1-exit'; do
            name="${spec%%:*}"; path="${spec#*:}"
            curl --fail-with-body --silent --show-error --retry 3 "$BASE$path" > "$ROOT/$name.json"
          done
          jq -n '{method:"ledger",params:[{ledger_index:"validated",transactions:false,expand:false}]}' > "$ROOT/head-request.json"
          curl --fail-with-body --silent --show-error --retry 3 -H 'content-type: application/json' --data @"$ROOT/head-request.json" https://devnet.honeycluster.io/ > "$ROOT/head-primary.json"
          curl --fail-with-body --silent --show-error --retry 3 -H 'content-type: application/json' --data @"$ROOT/head-request.json" https://s.devnet.rippletest.net:51234/ > "$ROOT/head-fallback.json"
      - name: Capture Cloudflare and D1 state
        shell: bash
        run: |
          set -euo pipefail
          ROOT=final-pre-soak-snapshot
          curl --fail-with-body --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/xrpl-lending-monitor/settings" > "$ROOT/settings.json"
          curl --fail-with-body --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/xrpl-lending-monitor/schedules" > "$ROOT/schedules.json"
          pnpm exec wrangler d1 execute xrpl-lending-monitor --remote --command "SELECT epoch_id,last_processed_ledger,last_processed_hash,latest_observed_ledger,latest_observed_hash,status,updated_at FROM fast_lane_shadow_state WHERE network='devnet';" --json > "$ROOT/state-raw.txt"
          sed -n '/^\[/,$p' "$ROOT/state-raw.txt" > "$ROOT/state.json"
          pnpm exec wrangler d1 execute xrpl-lending-monitor --remote --command "SELECT shadow_epoch_id,base_epoch_id,base_snapshot_id,base_ledger_index,base_ledger_hash,bound_at FROM fast_lane_shadow_base_binding WHERE network='devnet';" --json > "$ROOT/binding-raw.txt"
          sed -n '/^\[/,$p' "$ROOT/binding-raw.txt" > "$ROOT/binding.json"
          pnpm exec wrangler d1 execute xrpl-lending-monitor --remote --command "SELECT run_at,status,start_ledger_index,end_ledger_index,latest_observed_ledger,lag_ledgers,ledgers_processed,lending_transactions,persistence_rows_read,persistence_rows_written FROM fast_lane_shadow_run_metrics WHERE network='devnet' ORDER BY run_at DESC LIMIT 12;" --json > "$ROOT/metrics-raw.txt"
          sed -n '/^\[/,$p' "$ROOT/metrics-raw.txt" > "$ROOT/metrics.json"
      - name: Build verdict
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime, json, pathlib
          root = pathlib.Path('final-pre-soak-snapshot')
          def load(name): return json.loads((root/name).read_text())
          def rows(name):
              data=load(name); return data[0].get('results',[]) if data else []
          def head(data):
              r=data.get('result',{}); l=r.get('ledger',{}) if isinstance(r.get('ledger'),dict) else {}
              return int(r.get('ledger_index') or l.get('ledger_index') or l.get('seqNum') or 0)
          def binding(settings,name):
              for item in settings.get('result',{}).get('bindings',[]):
                  if item.get('name')==name: return item.get('text',item.get('value'))
          overview=load('overview.json'); collector=load('collector.json'); history=load('history.json'); rebase=load('rebase.json'); diff=load('diff.json'); continuation=load('continuation.json'); m1=load('m1.json')
          settings=load('settings.json'); schedules=load('schedules.json'); state=(rows('state.json') or [{}])[0]; base=(rows('binding.json') or [{}])[0]; metrics=rows('metrics.json')
          heads=[x for x in (head(load('head-primary.json')),head(load('head-fallback.json'))) if x>0]; live=min(heads) if heads else 0
          wm=overview.get('current_state_watermark') or {}; current=int(wm.get('ledger_index') or 0); lag=max(0,live-current)
          updated=wm.get('updated_at'); age=None
          if updated: age=(datetime.datetime.now(datetime.timezone.utc)-datetime.datetime.fromisoformat(updated.replace('Z','+00:00'))).total_seconds()
          hist=int((history.get('chain') or {}).get('end_ledger_index') or 0)
          cursor=collector.get('cursor') or {}; expected_cursor_lag=None
          if cursor.get('last_processed_ledger') is not None and cursor.get('latest_observed_ledger') is not None:
              expected_cursor_lag=max(0,int(cursor['latest_observed_ledger'])-int(cursor['last_processed_ledger']))
          checks={
            'devnet': binding(settings,'APP_NETWORK')=='devnet',
            'mainnet_disabled': str(binding(settings,'MAINNET_ENABLED')).lower()=='false',
            'single_5m_cron': [x.get('cron') for x in schedules.get('result',{}).get('schedules',[])]==['*/5 * * * *'],
            'rebase_replayed': rebase.get('status')=='replayed' and int((rebase.get('target') or {}).get('ledgerIndex') or 0)==hist,
            'binding_checkpoint': int(base.get('base_ledger_index') or 0)==hist,
            'diff_zero': diff.get('status')=='ok' and diff.get('passed') is True and int((diff.get('sample') or {}).get('exactProjectionMismatches') or 0)==0,
            'source_fast_lane': wm.get('source')=='fast_lane',
            'age_600': age is not None and age<=600,
            'lag_10': lag<=10,
            'd1_matches_public': int(state.get('last_processed_ledger') or 0)==current,
            'collector_consistent': expected_cursor_lag is not None and int(cursor.get('lag_ledgers') or 0)==expected_cursor_lag,
            'collector_no_failures': int(collector.get('consecutive_failures') or 0)==0 and collector.get('error') is None,
            'continuation': continuation.get('passed') is True,
            'm1': m1.get('ready') is True,
            'metrics_present': len(metrics)>=3,
          }
          out={'capturedAt':datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'),'liveHead':live,'current':{'source':wm.get('source'),'ledger':current,'updatedAt':updated,'ageSeconds':age,'lagLedgers':lag},'checkpoint':hist,'state':state,'binding':base,'metrics':metrics,'checks':checks,'passed':all(checks.values())}
          (root/'summary.json').write_text(json.dumps(out,indent=2)+'\n'); print(json.dumps(out,indent=2))
          raise SystemExit(0 if out['passed'] else 2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-pre-soak-snapshot
          path: final-pre-soak-snapshot
          if-no-files-found: error
          retention-days: 14
