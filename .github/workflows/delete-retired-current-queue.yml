name: Delete retired Current Queue

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  delete:
    if: >-
      github.event.issue.number == 995 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      github.event.comment.body == '/delete-retired-current-queue'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      QUEUE_ID: 2ae398f2edbf43749e45cd7ede77c6cd
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Delete retired Queue and verify absence
        shell: bash
        run: |
          set -euo pipefail
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          curl -fsS -X DELETE -H "$auth" "$api/queues/$QUEUE_ID" \
            | tee delete-result.json \
            | jq -e '.success == true' >/dev/null
          curl -fsS -H "$auth" "$api/queues?per_page=100" \
            | tee queues-after.json \
            | jq -e --arg id "$QUEUE_ID" '.success == true and ([.result[] | select(.queue_id == $id or .queue_id == $id)] | length == 0)' >/dev/null
