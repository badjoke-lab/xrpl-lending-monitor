name: Apply Overview correctness fix once
on:
  pull_request:
    paths: [.github/workflows/apply-overview-correctness-fix-temp.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply bounded UI correctness changes
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          overview = Path('src/ui/pages/OverviewPage.tsx')
          text = overview.read_text()
          replacements = [
            (
              "import {\n  EmptyBlock,",
              "import { rippleEpochToIso } from '../../domain/time/ripple-epoch'\n\nimport {\n  EmptyBlock,",
            ),
            (
              '<td>{formatUtc(event.close_time)}</td>',
              '<td>{formatUtc(rippleEpochToIso(event.close_time))}</td>',
            ),
            (
              'href={`/api/transactions/${event.transaction_hash}`}',
              'href={`/transactions/${event.transaction_hash}`}',
            ),
          ]
          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'Overview replacement missing: {old}')
            text = text.replace(old, new, 1)
          overview.write_text(text)

          api_types = Path('src/ui/types/api.ts')
          text = api_types.read_text()
          old = '  close_time: string\n  transaction_type: string'
          new = '  close_time: number\n  transaction_type: string'
          if old not in text:
            raise SystemExit('Activity close_time type anchor not found')
          api_types.write_text(text.replace(old, new, 1))

          smoke = Path('tests/e2e/smoke.spec.ts')
          text = smoke.read_text()
          old = "close_time: '2026-07-02T01:02:00.000Z',"
          if old not in text:
            raise SystemExit('smoke close_time fixture not found')
          text = text.replace(old, 'close_time: 836_269_320,', 1)
          anchor = "  await expect(page.getByText('LoanPay', { exact: true })).toBeVisible()\n"
          addition = anchor + "  await expect(page.getByText(/02 Jul 2026, 01:02:00 UTC/)).toBeVisible()\n  await expect(page.locator('.activity-panel tbody a.identifier-link')).toHaveAttribute(\n    'href',\n    '/transactions/ABCDEF000000000000000000000000000000000000000000000000000001',\n  )\n"
          if anchor not in text:
            raise SystemExit('smoke assertion anchor not found')
          smoke.write_text(text.replace(anchor, addition, 1))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/ui/pages/OverviewPage.tsx src/ui/types/api.ts tests/e2e/smoke.spec.ts
          git commit -m "Fix Overview activity time and transaction links"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
