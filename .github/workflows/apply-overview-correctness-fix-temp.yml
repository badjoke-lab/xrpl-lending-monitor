name: Apply Overview correctness fix once
on:
  pull_request:
    paths: [.github/workflows/apply-overview-correctness-fix-temp.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply bounded UI correctness changes
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          overview = Path('src/ui/pages/OverviewPage.tsx')
          text = overview.read_text()
          text = text.replace("import {\n  EmptyBlock,", "import { rippleEpochToIso } from '../../domain/time/ripple-epoch'\n\nimport {\n  EmptyBlock,", 1)
          text = text.replace('<td>{formatUtc(event.close_time)}</td>', '<td>{formatUtc(rippleEpochToIso(event.close_time))}</td>', 1)
          old = '''<a className="mono identifier-link" href={`/api/transactions/${event.transaction_hash}`} title={event.transaction_hash}>
                        {truncateMiddle(event.transaction_hash)}
                      </a>'''
          new = '''<a
                        className="mono identifier-link"
                        href={`/transactions/${event.transaction_hash}`}
                        title={event.transaction_hash}
                        onClick={(clickEvent) => {
                          clickEvent.preventDefault()
                          onNavigate(`/transactions/${event.transaction_hash}`)
                        }}
                      >
                        {truncateMiddle(event.transaction_hash)}
                      </a>'''
          if old not in text:
            raise SystemExit('Overview transaction link block not found')
          overview.write_text(text.replace(old, new, 1))

          api_types = Path('src/ui/types/api.ts')
          text = api_types.read_text()
          marker = '''export interface ActivityRecord {
            transaction_hash: string
            epoch_id: string
            ledger_index: number
            event_index: number
            close_time: string'''
          replacement = marker.replace('close_time: string', 'close_time: number')
          if marker not in text:
            raise SystemExit('ActivityRecord close_time type not found')
          api_types.write_text(text.replace(marker, replacement, 1))

          smoke = Path('tests/e2e/smoke.spec.ts')
          text = smoke.read_text()
          text = text.replace("close_time: '2026-07-02T01:02:00.000Z',", 'close_time: 836_269_320,', 1)
          anchor = "  await expect(page.getByText('LoanPay', { exact: true })).toBeVisible()\n"
          addition = anchor + "  await expect(page.getByText(/02 Jul 2026, 01:02:00 UTC/)).toBeVisible()\n  await expect(page.locator('.activity-panel tbody a.identifier-link')).toHaveAttribute(\n    'href',\n    '/transactions/ABCDEF000000000000000000000000000000000000000000000000000001',\n  )\n"
          if anchor not in text:
            raise SystemExit('smoke assertion insertion point not found')
          smoke.write_text(text.replace(anchor, addition, 1))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/ui/pages/OverviewPage.tsx src/ui/types/api.ts tests/e2e/smoke.spec.ts
          git commit -m "Fix Overview activity time and transaction links"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
