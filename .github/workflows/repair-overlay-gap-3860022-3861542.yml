name: Repair overlay gap 3860022-3861542

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/repair-overlay-gap-trigger-3860022-3861542
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: repair-overlay-gap-3860022-3861542
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  DATABASE_NAME: xrpl-lending-monitor
  EPOCH_ID: devnet-3371675
  BASE_SNAPSHOT_ID: devnet-3860021-fbba23eeffd1
  BASE_LEDGER_INDEX: '3860021'
  BASE_LEDGER_HASH: FBBA23EEFFD19FFD81F2E6A0A9A5D3E503EE78AA8EB6F3653F756BA90655B4A7
  START_LEDGER: '3860022'
  END_LEDGER: '3861542'
  MISSING_VAULT_ID: EE61076DFD544A725F7C7FB67908CFFF7E2B2BD78ECD23285F50E762A5D47143

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Create evidence directory
        run: mkdir -p overlay-gap-repair-evidence

      - name: Capture and validate active production identities
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          pnpm exec wrangler d1 execute "$DATABASE_NAME" --remote --json --command "
            SELECT network,epoch_id,base_snapshot_id,base_ledger_index,base_ledger_hash,overlay_ledger_index,overlay_ledger_hash,updated_at
            FROM current_state_overlay_state WHERE network='devnet';
            SELECT network,epoch_id,last_processed_ledger,last_processed_hash,latest_observed_ledger,latest_observed_hash,status,updated_at
            FROM fast_lane_shadow_state WHERE network='devnet';
            SELECT object_type,object_id,operation,projection_json,source_ledger_index,source_ledger_hash,source_transaction_hash,source_transaction_index
            FROM current_state_overlay_objects
            WHERE network='devnet' AND epoch_id='${EPOCH_ID}' AND base_snapshot_id='${BASE_SNAPSHOT_ID}'
              AND object_type='vault' AND object_id='${MISSING_VAULT_ID}';
          " > overlay-gap-repair-evidence/before-raw.txt
          sed -n '/^\[/,$p' overlay-gap-repair-evidence/before-raw.txt > overlay-gap-repair-evidence/before.json
          jq -e --arg epoch "$EPOCH_ID" --arg base "$BASE_SNAPSHOT_ID" --arg hash "$BASE_LEDGER_HASH" --argjson ledger "$BASE_LEDGER_INDEX" --argjson gapEnd "$END_LEDGER" '
            length == 3
            and all(.[]; .success == true)
            and .[0].results[0].network == "devnet"
            and .[0].results[0].epoch_id == $epoch
            and .[0].results[0].base_snapshot_id == $base
            and .[0].results[0].base_ledger_index == $ledger
            and .[0].results[0].base_ledger_hash == $hash
            and .[0].results[0].overlay_ledger_index >= $gapEnd
            and .[1].results[0].epoch_id == "fast-lane-shadow-devnet"
          ' overlay-gap-repair-evidence/before.json >/dev/null
          jq -S '.[0].results[0]' overlay-gap-repair-evidence/before.json > overlay-gap-repair-evidence/overlay-state-before.json
          jq -S '.[1].results[0]' overlay-gap-repair-evidence/before.json > overlay-gap-repair-evidence/fast-state-before.json
          jq -S '.[2].results' overlay-gap-repair-evidence/before.json > overlay-gap-repair-evidence/missing-vault-before.json

      - name: Build bounded replay generator
        run: pnpm exec vite build --config vite.current-state-overlay-gap-replay.config.ts

      - name: Reconstruct exact missing ledger range
        shell: bash
        run: |
          set -euo pipefail
          node .current-state-overlay-gap-replay-build/build-current-state-overlay-gap-replay.mjs \
            --endpoint https://s.devnet.rippletest.net:51234/ \
            --start-ledger "$START_LEDGER" \
            --end-ledger "$END_LEDGER" \
            --epoch-id "$EPOCH_ID" \
            --base-snapshot-id "$BASE_SNAPSHOT_ID" \
            --read-window 8 \
            --timeout-ms 12000 \
            --output-sql /tmp/current-state-overlay-gap-replay.sql \
            --output-summary overlay-gap-repair-evidence/replay-summary.json
          jq -e --arg vault "$MISSING_VAULT_ID" --arg hash "$BASE_LEDGER_HASH" --argjson base "$BASE_LEDGER_INDEX" --argjson start "$START_LEDGER" --argjson end "$END_LEDGER" '
            .mode == "bounded-current-state-overlay-gap-replay"
            and .source.previousLedgerIndex == $base
            and .source.previousLedgerHash == $hash
            and .source.startLedgerIndex == $start
            and .source.endLedgerIndex == $end
            and .source.ledgersRead == ($end - $start + 1)
            and .mutationCount > 0
            and .confirmedMissingVault.objectId == $vault
            and .confirmedMissingVault.ledgerIndex == 3861541
            and .safeguards.overlayWatermarkMutation == false
            and .safeguards.fastLaneCursorMutation == false
            and .safeguards.historyMutation == false
            and .safeguards.newerRowsProtectedBySourceOrder == true
          ' overlay-gap-repair-evidence/replay-summary.json >/dev/null
          sed '/^BEGIN TRANSACTION;$/d;/^COMMIT;$/d' /tmp/current-state-overlay-gap-replay.sql > /tmp/current-state-overlay-gap-replay-execute.sql
          test "$(grep -c '^INSERT INTO current_state_overlay_objects' /tmp/current-state-overlay-gap-replay-execute.sql)" -eq "$(jq -r .mutationCount overlay-gap-repair-evidence/replay-summary.json)"
          ! grep -E 'current_state_overlay_state|fast_lane_shadow_state|fast_lane_history_windows|fast_lane_shadow_windows' /tmp/current-state-overlay-gap-replay-execute.sql
          sha256sum /tmp/current-state-overlay-gap-replay-execute.sql > overlay-gap-repair-evidence/executed-sql.sha256

      - name: Apply source-ordered idempotent repair
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler d1 execute "$DATABASE_NAME" --remote --json \
            --file /tmp/current-state-overlay-gap-replay-execute.sql \
            > overlay-gap-repair-evidence/execute-raw.txt
          sed -n '/^\[/,$p' overlay-gap-repair-evidence/execute-raw.txt > overlay-gap-repair-evidence/execute.json
          jq -e 'type == "array" and length > 0 and all(.[]; .success == true)' overlay-gap-repair-evidence/execute.json >/dev/null

      - name: Verify repaired object and monotonic production state
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler d1 execute "$DATABASE_NAME" --remote --json --command "
            SELECT network,epoch_id,base_snapshot_id,base_ledger_index,base_ledger_hash,overlay_ledger_index,overlay_ledger_hash,updated_at
            FROM current_state_overlay_state WHERE network='devnet';
            SELECT network,epoch_id,last_processed_ledger,last_processed_hash,latest_observed_ledger,latest_observed_hash,status,updated_at
            FROM fast_lane_shadow_state WHERE network='devnet';
            SELECT object_type,object_id,operation,projection_json,source_ledger_index,source_ledger_hash,source_transaction_hash,source_transaction_index
            FROM current_state_overlay_objects
            WHERE network='devnet' AND epoch_id='${EPOCH_ID}' AND base_snapshot_id='${BASE_SNAPSHOT_ID}'
              AND object_type='vault' AND object_id='${MISSING_VAULT_ID}';
          " > overlay-gap-repair-evidence/after-raw.txt
          sed -n '/^\[/,$p' overlay-gap-repair-evidence/after-raw.txt > overlay-gap-repair-evidence/after.json
          jq -e --arg epoch "$EPOCH_ID" --arg base "$BASE_SNAPSHOT_ID" --arg vault "$MISSING_VAULT_ID" --argjson baseLedger "$BASE_LEDGER_INDEX" '
            length == 3
            and all(.[]; .success == true)
            and .[0].results[0].epoch_id == $epoch
            and .[0].results[0].base_snapshot_id == $base
            and .[0].results[0].base_ledger_index == $baseLedger
            and .[1].results[0].epoch_id == "fast-lane-shadow-devnet"
            and .[2].results | length == 1
            and .[2].results[0].object_id == $vault
            and .[2].results[0].object_type == "vault"
            and .[2].results[0].operation == "upsert"
            and .[2].results[0].source_ledger_index == 3861541
            and (. [2].results[0].projection_json | fromjson | .id) == $vault
            and (. [2].results[0].projection_json | fromjson | .kind) == "vault"
          ' overlay-gap-repair-evidence/after.json >/dev/null
          BEFORE_OVERLAY="$(jq -r '.[0].results[0].overlay_ledger_index' overlay-gap-repair-evidence/before.json)"
          AFTER_OVERLAY="$(jq -r '.[0].results[0].overlay_ledger_index' overlay-gap-repair-evidence/after.json)"
          BEFORE_FAST="$(jq -r '.[1].results[0].last_processed_ledger' overlay-gap-repair-evidence/before.json)"
          AFTER_FAST="$(jq -r '.[1].results[0].last_processed_ledger' overlay-gap-repair-evidence/after.json)"
          test "$AFTER_OVERLAY" -ge "$BEFORE_OVERLAY"
          test "$AFTER_FAST" -ge "$BEFORE_FAST"
          jq -S '.[0].results[0]' overlay-gap-repair-evidence/after.json > overlay-gap-repair-evidence/overlay-state-after.json
          jq -S '.[1].results[0]' overlay-gap-repair-evidence/after.json > overlay-gap-repair-evidence/fast-state-after.json
          jq -S '.[2].results[0]' overlay-gap-repair-evidence/after.json > overlay-gap-repair-evidence/missing-vault-after.json

      - name: Trigger checkpoint candidate after repair
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TRIGGERED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run rolling-checkpoint-candidate.yml --ref main \
            -f source_current_state_branch=current-state-data \
            -f current_state_candidate_branch=current-state-four-hour-a-data
          sleep 10
          RUN_ID="$(gh run list --workflow rolling-checkpoint-candidate.yml --event workflow_dispatch --limit 20 \
            --json databaseId,createdAt \
            --jq 'sort_by(.createdAt) | last | .databaseId')"
          test -n "$RUN_ID"
          printf '%s\n' "$RUN_ID" > overlay-gap-repair-evidence/checkpoint-run-id.txt
          printf '%s\n' "$TRIGGERED_AT" > overlay-gap-repair-evidence/checkpoint-triggered-at.txt
          gh run watch "$RUN_ID" --exit-status --interval 20
          gh run download "$RUN_ID" --name current-state-overlay-checkpoint-candidate \
            --dir overlay-gap-repair-evidence/checkpoint-artifact
          test -s overlay-gap-repair-evidence/checkpoint-artifact/candidate-commit-sha.txt
          test -s overlay-gap-repair-evidence/checkpoint-artifact/builder.stdout.json

      - name: Upload retained repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overlay-gap-repair-3860022-3861542
          path: overlay-gap-repair-evidence
          if-no-files-found: error
          retention-days: 30
