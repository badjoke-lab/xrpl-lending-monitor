name: R5 revision4 resource halt rearm

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: r5-revision4-resource-halt-rearm
  cancel-in-progress: false

env:
  QUALIFICATION_ISSUE: '1261'
  R5_RUN_ID: r5-recovery-selected-revision4-entry
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
  GH_TOKEN: ${{ github.token }}

jobs:
  prepare:
    if: >-
      github.event.issue.number == 1261 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      github.event.comment.body == '/r5-revision4-resource-halt-rearm-prepare'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pinned Bun for exact diagnostic replay
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Capture blocked activation state and reproduce resource accounting read-only
        id: evidence
        run: |
          set -euo pipefail
          mkdir -p r5-revision4-resource-halt-rearm-evidence

          set +e
          node scripts/inspect-r5-revision4-minute-state.mjs \
            r5-revision4-resource-halt-rearm-evidence/state-before.json
          inspector_rc=$?
          set -e
          test "$inspector_rc" -ne 0
          jq -e '
            .run.runId == "r5-recovery-selected-revision4-entry" and
            .run.status == "halted" and
            .run.lastError == "revision4_resource_halt" and
            .run.completedBatches == 0 and
            .run.committedLedgers == 0 and
            .run.lastAccountingDigest == null and
            .batchCounts.total == 1 and
            .batchCounts.leased == 0 and
            .batchCounts.committed == 0 and
            .latestBatch.status == "halted" and
            .latestBatch.error_message == "revision4_resource_halt" and
            .latestBatch.rows_digest == null and
            .latestBatch.accounting_digest == null and
            .latestBatch.finalized_egress_upper_bound_bytes == null and
            .latestBatch.final_work_id == null and
            .latestBatch.failure_reservation_retained == false and
            .resourceSnapshot.fresh == true and
            .resourceSnapshot.projectedInvocations31d < 400000 and
            .migration.targetApplied == true and
            .migration.currentMaxVersionApproved == true and
            .activationMode == "blocked_failure_state" and
            .activationBlockedReason == "unsupported R5 activation state:halted:revision4_resource_halt" and
            .mainnetDisabled == true' \
            r5-revision4-resource-halt-rearm-evidence/state-before.json >/dev/null

          bun scripts/diagnose-r5-revision4-resource-halt.ts \
            r5-revision4-resource-halt-rearm-evidence/diagnostic-before.json \
            > r5-revision4-resource-halt-rearm-evidence/diagnostic-before.stdout.json
          jq -e '
            .runId == "r5-recovery-selected-revision4-entry" and
            .verdict.classification == "no_resource_halt_reproduced" and
            .verdict.batchEgressProven == false and
            .verdict.memoryHaltPossible == false and
            .verdict.projectEgressHaltPossible == false and
            .safety.productionDatabaseReadOnly == true and
            .safety.noRunMutation == true and
            .safety.noBatchMutation == true and
            .safety.noPublicReaderMutation == true and
            .safety.mainnetDisabled == true' \
            r5-revision4-resource-halt-rearm-evidence/diagnostic-before.json >/dev/null

          repair_binding="$(jq -c '{run:{runId:.run.runId,status:.run.status,lastError:.run.lastError,profileRevision:.run.profileRevision,profileIdentityDigest:.run.profileIdentityDigest,selectionDigest:.run.selectionDigest,completedBatches:.run.completedBatches,committedLedgers:.run.committedLedgers,lastAccountingDigest:.run.lastAccountingDigest,currentWatermarkLedgerIndex:.run.currentWatermarkLedgerIndex,currentWatermarkLedgerHash:.run.currentWatermarkLedgerHash},batchCounts:.batchCounts,latestBatch:{run_id:.latestBatch.run_id,status:.latestBatch.status,batch_id:.latestBatch.batch_id,batch_sequence:.latestBatch.batch_sequence,start_ledger_index:.latestBatch.start_ledger_index,end_ledger_index:.latestBatch.end_ledger_index,ledger_count:.latestBatch.ledger_count,expected_parent_hash:.latestBatch.expected_parent_hash,error_message:.latestBatch.error_message,rows_digest:.latestBatch.rows_digest,accounting_digest:.latestBatch.accounting_digest,finalized_egress_upper_bound_bytes:.latestBatch.finalized_egress_upper_bound_bytes,final_work_id:.latestBatch.final_work_id,failure_reservation_retained:.latestBatch.failure_reservation_retained,lease_owner:.latestBatch.lease_owner,lease_expires_at:.latestBatch.lease_expires_at},snapshot:{snapshotId:.resourceSnapshot.snapshotId,projectedInvocations31d:.resourceSnapshot.projectedInvocations31d},migration:{currentMaxVersion:.migration.currentMaxVersion}}' r5-revision4-resource-halt-rearm-evidence/state-before.json | sha256sum | awk '{print $1}')"
          diagnostic_binding="$(jq -c '{runId,batchId,range,guards,verdict,safety}' r5-revision4-resource-halt-rearm-evidence/diagnostic-before.json | sha256sum | awk '{print $1}')"

          printf 'repair_binding=%s\ndiagnostic_binding=%s\nbatch_id=%s\nrun_watermark=%s\nactive_floor=%s\nsnapshot_id=%s\nmigration_max=%s\n' \
            "$repair_binding" \
            "$diagnostic_binding" \
            "$(jq -r '.latestBatch.batch_id' r5-revision4-resource-halt-rearm-evidence/state-before.json)" \
            "$(jq -r '.run.currentWatermarkLedgerIndex' r5-revision4-resource-halt-rearm-evidence/state-before.json)" \
            "$(jq -r '.activeWatermark.ledgerIndex' r5-revision4-resource-halt-rearm-evidence/state-before.json)" \
            "$(jq -r '.resourceSnapshot.snapshotId' r5-revision4-resource-halt-rearm-evidence/state-before.json)" \
            "$(jq -r '.migration.currentMaxVersion' r5-revision4-resource-halt-rearm-evidence/state-before.json)" \
            >> "$GITHUB_OUTPUT"

      - name: Publish exact one-shot rearm authorization proposal
        env:
          REPAIR_BINDING: ${{ steps.evidence.outputs.repair_binding }}
          DIAGNOSTIC_BINDING: ${{ steps.evidence.outputs.diagnostic_binding }}
          BATCH_ID: ${{ steps.evidence.outputs.batch_id }}
          RUN_WATERMARK: ${{ steps.evidence.outputs.run_watermark }}
          ACTIVE_FLOOR: ${{ steps.evidence.outputs.active_floor }}
          SNAPSHOT_ID: ${{ steps.evidence.outputs.snapshot_id }}
          MIGRATION_MAX: ${{ steps.evidence.outputs.migration_max }}
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          expires="$(date -u -d '+2 hours' '+%Y-%m-%dT%H:%M:%SZ')"
          nonce="$(openssl rand -hex 8)"
          command="/r5-revision4-resource-halt-rearm commit=${source_commit} repair=${REPAIR_BINDING} diagnostic=${DIAGNOSTIC_BINDING} batch=${BATCH_ID} run_watermark=${RUN_WATERMARK} active_floor=${ACTIVE_FLOOR} snapshot=${SNAPSHOT_ID} migration_max=${MIGRATION_MAX} prepare_run=${GITHUB_RUN_ID} expires=${expires} nonce=${nonce}"
          cat > /tmp/rearm-proposal.md <<EOF
          ## R5 revision-4 resource-halt rearm authorization proposal

          Preparation run: \`${GITHUB_RUN_ID}\`
          Source main commit: \`${source_commit}\`
          Retained R5 run: \`${R5_RUN_ID}\`
          Halted batch: \`${BATCH_ID}\`
          Retained R5 watermark: \`${RUN_WATERMARK}\`
          Current canonical watermark floor: \`${ACTIVE_FLOOR}\`
          Fresh provider snapshot: \`${SNAPSHOT_ID}\`
          Applied migration max: \`${MIGRATION_MAX}\`
          Zero-progress state binding: \`${REPAIR_BINDING}\`
          Fresh 12-ledger diagnostic binding: \`${DIAGNOSTIC_BINDING}\`

          The prepare job verified a single zero-progress \`revision4_resource_halt\` batch and reproduced the exact historical 12-ledger range with classification \`no_resource_halt_reproduced\`. Execute must reproduce both stable bindings before mutation.

          This one-shot transaction deletes only that uncommitted halted batch row and returns the retained R5 run to \`prepared\`. It does not delete committed history, alter the canonical watermark, weaken resource thresholds, start a scheduler, deploy a function, or enable Mainnet. The normal continuous-head rebind remains required later during the separately authorized one-minute activation.

          Exact authorization command:

          \`${command}\`
          EOF
          gh issue comment "$QUALIFICATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/rearm-proposal.md

      - name: Upload read-only rearm preparation evidence
        uses: actions/upload-artifact@v4
        with:
          name: r5-revision4-resource-halt-rearm-prepare
          path: r5-revision4-resource-halt-rearm-evidence
          if-no-files-found: error
          retention-days: 14

  execute:
    if: >-
      github.event.issue.number == 1261 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      startsWith(github.event.comment.body, '/r5-revision4-resource-halt-rearm ')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      AUTHORIZATION_BODY: ${{ github.event.comment.body }}
      AUTHORIZATION_CREATED_AT: ${{ github.event.comment.created_at }}
      AUTHORIZATION_COMMENT_ID: ${{ github.event.comment.id }}
    steps:
      - name: Check out exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Parse and bind exact owner authorization
        id: auth
        run: |
          set -euo pipefail
          regex='^/r5-revision4-resource-halt-rearm commit=([a-f0-9]{40}) repair=([a-f0-9]{64}) diagnostic=([a-f0-9]{64}) batch=([a-z0-9-]+) run_watermark=([0-9]+) active_floor=([0-9]+) snapshot=([A-Za-z0-9._:-]+) migration_max=([0-9]+) prepare_run=([0-9]+) expires=([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z) nonce=([a-f0-9]{16})$'
          [[ "$AUTHORIZATION_BODY" =~ $regex ]] || { echo 'resource-halt rearm authorization shape mismatch' >&2; exit 1; }
          names=(commit repair_binding diagnostic_binding batch_id run_watermark active_floor snapshot_id migration_max prepare_run expires nonce)
          for index in "${!names[@]}"; do
            printf '%s=%s\n' "${names[$index]}" "${BASH_REMATCH[$((index + 1))]}" >> "$GITHUB_OUTPUT"
          done
          test "${BASH_REMATCH[1]}" = "$(git rev-parse HEAD)"
          expires_epoch="$(date -u -d "${BASH_REMATCH[10]}" +%s)"
          auth_epoch="$(date -u -d "$AUTHORIZATION_CREATED_AT" +%s)"
          now_epoch="$(date -u +%s)"
          test "$auth_epoch" -lt "$expires_epoch"
          test "$now_epoch" -le "$expires_epoch"
          test $((expires_epoch - auth_epoch)) -le 7200

      - name: Verify exact prior proposal and unique authorization
        env:
          PREPARE_RUN: ${{ steps.auth.outputs.prepare_run }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${QUALIFICATION_ISSUE}/comments?per_page=100" | jq -s 'add' > /tmp/rearm-comments.json
          EXPECTED="$AUTHORIZATION_BODY" PREPARE="$PREPARE_RUN" AUTH_ID="$AUTHORIZATION_COMMENT_ID" node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const comments = JSON.parse(readFileSync('/tmp/rearm-comments.json', 'utf8'))
          const proposals = comments.filter((comment) => comment?.user?.login === 'github-actions[bot]' && typeof comment?.body === 'string' && comment.body.includes(`Preparation run: \`${process.env.PREPARE}\``) && comment.body.includes(`\`${process.env.EXPECTED}\``))
          if (proposals.length !== 1) throw new Error(`expected one exact resource-halt rearm proposal, found ${proposals.length}`)
          const authorizations = comments.filter((comment) => comment?.user?.login === 'badjoke-lab' && comment?.body === process.env.EXPECTED)
          if (authorizations.length !== 1 || Number(authorizations[0].id) !== Number(process.env.AUTH_ID)) throw new Error('resource-halt rearm authorization is not unique')
          NODE

      - name: Set up pinned Bun for exact diagnostic replay
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Reproduce exact zero-progress and resource diagnostic bindings read-only
        env:
          EXPECTED_REPAIR: ${{ steps.auth.outputs.repair_binding }}
          EXPECTED_DIAGNOSTIC: ${{ steps.auth.outputs.diagnostic_binding }}
          EXPECTED_BATCH: ${{ steps.auth.outputs.batch_id }}
          EXPECTED_RUN_WATERMARK: ${{ steps.auth.outputs.run_watermark }}
          ACTIVE_FLOOR: ${{ steps.auth.outputs.active_floor }}
          EXPECTED_SNAPSHOT: ${{ steps.auth.outputs.snapshot_id }}
          EXPECTED_MIGRATION_MAX: ${{ steps.auth.outputs.migration_max }}
        run: |
          set -euo pipefail
          mkdir -p r5-revision4-resource-halt-rearm-evidence
          set +e
          node scripts/inspect-r5-revision4-minute-state.mjs r5-revision4-resource-halt-rearm-evidence/state-recheck.json
          inspector_rc=$?
          set -e
          test "$inspector_rc" -ne 0
          test "$(jq -r '.latestBatch.batch_id' r5-revision4-resource-halt-rearm-evidence/state-recheck.json)" = "$EXPECTED_BATCH"
          test "$(jq -r '.run.currentWatermarkLedgerIndex' r5-revision4-resource-halt-rearm-evidence/state-recheck.json)" = "$EXPECTED_RUN_WATERMARK"
          test "$(jq -r '.activeWatermark.ledgerIndex' r5-revision4-resource-halt-rearm-evidence/state-recheck.json)" -ge "$ACTIVE_FLOOR"
          test "$(jq -r '.resourceSnapshot.snapshotId' r5-revision4-resource-halt-rearm-evidence/state-recheck.json)" = "$EXPECTED_SNAPSHOT"
          test "$(jq -r '.migration.currentMaxVersion' r5-revision4-resource-halt-rearm-evidence/state-recheck.json)" = "$EXPECTED_MIGRATION_MAX"

          repair_binding="$(jq -c '{run:{runId:.run.runId,status:.run.status,lastError:.run.lastError,profileRevision:.run.profileRevision,profileIdentityDigest:.run.profileIdentityDigest,selectionDigest:.run.selectionDigest,completedBatches:.run.completedBatches,committedLedgers:.run.committedLedgers,lastAccountingDigest:.run.lastAccountingDigest,currentWatermarkLedgerIndex:.run.currentWatermarkLedgerIndex,currentWatermarkLedgerHash:.run.currentWatermarkLedgerHash},batchCounts:.batchCounts,latestBatch:{run_id:.latestBatch.run_id,status:.latestBatch.status,batch_id:.latestBatch.batch_id,batch_sequence:.latestBatch.batch_sequence,start_ledger_index:.latestBatch.start_ledger_index,end_ledger_index:.latestBatch.end_ledger_index,ledger_count:.latestBatch.ledger_count,expected_parent_hash:.latestBatch.expected_parent_hash,error_message:.latestBatch.error_message,rows_digest:.latestBatch.rows_digest,accounting_digest:.latestBatch.accounting_digest,finalized_egress_upper_bound_bytes:.latestBatch.finalized_egress_upper_bound_bytes,final_work_id:.latestBatch.final_work_id,failure_reservation_retained:.latestBatch.failure_reservation_retained,lease_owner:.latestBatch.lease_owner,lease_expires_at:.latestBatch.lease_expires_at},snapshot:{snapshotId:.resourceSnapshot.snapshotId,projectedInvocations31d:.resourceSnapshot.projectedInvocations31d},migration:{currentMaxVersion:.migration.currentMaxVersion}}' r5-revision4-resource-halt-rearm-evidence/state-recheck.json | sha256sum | awk '{print $1}')"
          test "$repair_binding" = "$EXPECTED_REPAIR"

          bun scripts/diagnose-r5-revision4-resource-halt.ts r5-revision4-resource-halt-rearm-evidence/diagnostic-recheck.json > r5-revision4-resource-halt-rearm-evidence/diagnostic-recheck.stdout.json
          jq -e '.verdict.classification == "no_resource_halt_reproduced" and .safety.productionDatabaseReadOnly == true and .safety.noRunMutation == true and .safety.noBatchMutation == true and .safety.mainnetDisabled == true' r5-revision4-resource-halt-rearm-evidence/diagnostic-recheck.json >/dev/null
          diagnostic_binding="$(jq -c '{runId,batchId,range,guards,verdict,safety}' r5-revision4-resource-halt-rearm-evidence/diagnostic-recheck.json | sha256sum | awk '{print $1}')"
          test "$diagnostic_binding" = "$EXPECTED_DIAGNOSTIC"

      - name: Rearm exactly one zero-progress resource-halted batch
        env:
          EXPECTED_BATCH: ${{ steps.auth.outputs.batch_id }}
          EXPECTED_RUN_WATERMARK: ${{ steps.auth.outputs.run_watermark }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_BATCH" =~ ^r5-batch-v1-r5-recovery-selected-revision4-entry-[0-9]{8}$ ]]
          [[ "$EXPECTED_RUN_WATERMARK" =~ ^[0-9]+$ ]]
          read -r -d '' sql <<SQL || true
          do \$rearm\$
          declare
            v_run xrpl_r5_v1.recovery_runs%rowtype;
            v_batch xrpl_r5_v1.recovery_batches%rowtype;
            v_batch_count bigint;
          begin
            perform pg_advisory_xact_lock(hashtextextended('xrpl-r5-active-recovery', 0));

            select * into v_run
              from xrpl_r5_v1.recovery_runs
             where run_id = '${R5_RUN_ID}'
             for update;
            if not found
              or v_run.status <> 'halted'
              or v_run.last_error <> 'revision4_resource_halt'
              or v_run.profile_revision <> 4
              or v_run.profile_identity_digest <> '39e8b620a20bb08fbe8306fe753d4d445c5191bcafddbf67721e0c17d5b6bcd5'
              or v_run.network <> 'devnet'
              or v_run.epoch_id <> 'supabase-r4c2c-v1'
              or v_run.completed_batches <> 0
              or v_run.committed_ledgers <> 0
              or v_run.last_accounting_digest is not null
              or v_run.current_watermark_ledger_index <> ${EXPECTED_RUN_WATERMARK} then
              raise exception 'r5_resource_halt_rearm_run_state_changed';
            end if;

            select count(*) into v_batch_count
              from xrpl_r5_v1.recovery_batches
             where run_id = v_run.run_id;
            if v_batch_count <> 1 then
              raise exception 'r5_resource_halt_rearm_batch_count_changed:%', v_batch_count;
            end if;

            select * into v_batch
              from xrpl_r5_v1.recovery_batches
             where run_id = v_run.run_id
               and batch_id = '${EXPECTED_BATCH}'
             for update;
            if not found
              or v_batch.status <> 'halted'
              or v_batch.error_message <> 'revision4_resource_halt'
              or v_batch.batch_sequence <> 1
              or v_batch.start_ledger_index <> v_run.current_watermark_ledger_index + 1
              or v_batch.end_ledger_index <> v_batch.start_ledger_index + v_batch.ledger_count - 1
              or v_batch.ledger_count <> 12
              or v_batch.lease_owner is not null
              or v_batch.lease_expires_at is not null
              or v_batch.rows_digest is not null
              or v_batch.accounting_digest is not null
              or v_batch.finalized_egress_upper_bound_bytes is not null
              or v_batch.final_work_id is not null
              or v_batch.failure_reservation_retained is distinct from false then
              raise exception 'r5_resource_halt_rearm_batch_state_changed';
            end if;

            delete from xrpl_r5_v1.recovery_batches
             where run_id = v_run.run_id and batch_id = v_batch.batch_id;
            if not found then
              raise exception 'r5_resource_halt_rearm_batch_delete_failed';
            end if;

            update xrpl_r5_v1.recovery_runs
               set status = 'prepared',
                   started_at = null,
                   completed_at = null,
                   last_error = null,
                   updated_at = now()
             where run_id = v_run.run_id;
            if not found then
              raise exception 'r5_resource_halt_rearm_run_update_failed';
            end if;
          end
          \$rearm\$;
          select jsonb_build_object(
            'runStatus', (select status from xrpl_r5_v1.recovery_runs where run_id='${R5_RUN_ID}'),
            'runLastError', (select last_error from xrpl_r5_v1.recovery_runs where run_id='${R5_RUN_ID}'),
            'runCompletedBatches', (select completed_batches from xrpl_r5_v1.recovery_runs where run_id='${R5_RUN_ID}'),
            'runCommittedLedgers', (select committed_ledgers from xrpl_r5_v1.recovery_runs where run_id='${R5_RUN_ID}'),
            'remainingBatchCount', (select count(*) from xrpl_r5_v1.recovery_batches where run_id='${R5_RUN_ID}'),
            'canonicalWatermarkLedger', (select ledger_index from public.xrpl_phase_watermarks where profile_id='supabase-devnet'),
            'mainnetDisabled', true
          ) as result;
          SQL
          jq -n --arg query "$sql" '{query:$query,parameters:[],read_only:false}' > /tmp/rearm-mutation.json
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'content-type: application/json' \
            --data @/tmp/rearm-mutation.json \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/database/query" \
            > r5-revision4-resource-halt-rearm-evidence/rearm-result.json
          jq -e '.. | objects | .result? | select(.runStatus == "prepared" and .runLastError == null and .runCompletedBatches == 0 and .runCommittedLedgers == 0 and .remainingBatchCount == 0 and .mainnetDisabled == true)' r5-revision4-resource-halt-rearm-evidence/rearm-result.json >/dev/null

      - name: Verify post-rearm state read-only
        run: |
          set -euo pipefail
          node scripts/inspect-r5-revision4-minute-state.mjs r5-revision4-resource-halt-rearm-evidence/state-after.json
          jq -e '.run.status == "prepared" and .run.lastError == null and .run.completedBatches == 0 and .run.committedLedgers == 0 and .batchCounts.total == 0 and .activationMode == "prepared_continue" and .mainnetDisabled == true' r5-revision4-resource-halt-rearm-evidence/state-after.json >/dev/null

      - name: Upload rearm evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r5-revision4-resource-halt-rearm-evidence
          path: r5-revision4-resource-halt-rearm-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Publish rearm result
        if: always()
        env:
          SOURCE_COMMIT: ${{ steps.auth.outputs.commit }}
          BATCH_ID: ${{ steps.auth.outputs.batch_id }}
          PREPARE_RUN: ${{ steps.auth.outputs.prepare_run }}
        run: |
          set -euo pipefail
          verdict=FAIL
          if [ "${{ job.status }}" = success ]; then verdict=PASS; fi
          cat > /tmp/rearm-result.md <<EOF
          ## R5 revision-4 resource-halt rearm — ${verdict}

          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          Source commit: \`${SOURCE_COMMIT:-unavailable}\`
          Preparation run: \`${PREPARE_RUN:-unavailable}\`
          Rearmed batch: \`${BATCH_ID:-unavailable}\`

          PASS means the exact authorized zero-progress \`revision4_resource_halt\` batch was removed and the retained R5 run returned to \`prepared\`, while committed history and the canonical watermark were left intact. Resource thresholds were not changed. This operation does not activate the one-minute scheduler or enable Mainnet.
          EOF
          gh issue comment "$QUALIFICATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/rearm-result.md
