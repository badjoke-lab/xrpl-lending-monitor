name: R5 revision4 database guard apply

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: r5-revision4-database-guard-apply
  cancel-in-progress: false

env:
  QUALIFICATION_ISSUE: '1261'
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
  GH_TOKEN: ${{ github.token }}

jobs:
  prepare:
    if: >-
      github.event.issue.number == 1261 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      github.event.comment.body == '/r5-revision4-database-guard-prepare'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Capture database guard pre-state read-only
        id: evidence
        run: |
          set -euo pipefail
          mkdir -p r5-revision4-database-guard-evidence
          source_commit="$(git rev-parse HEAD)"
          node scripts/manage-r5-revision4-database-guard.mjs prepare \
            --source-commit "$source_commit" \
            --output r5-revision4-database-guard-evidence/prepare.json \
            > r5-revision4-database-guard-evidence/prepare.stdout.json
          state="$(jq -r '.structuralStateSha256' r5-revision4-database-guard-evidence/prepare.json)"
          sql="$(jq -r '.guardSqlSha256' r5-revision4-database-guard-evidence/prepare.json)"
          project="$(jq -r '.structuralState.projectIdentityDigest' r5-revision4-database-guard-evidence/prepare.json)"
          manager="$(sha256sum scripts/manage-r5-revision4-database-guard.mjs | awk '{print $1}')"
          test "$(jq -r '.guardInstalled' r5-revision4-database-guard-evidence/prepare.json)" = false
          test "$(jq -r '.helperExists' r5-revision4-database-guard-evidence/prepare.json)" = false
          test "$(jq -r '.mainnetDisabled' r5-revision4-database-guard-evidence/prepare.json)" = true
          test "$(jq -r '.databaseBytes' r5-revision4-database-guard-evidence/prepare.json)" -ge 400000000
          printf 'source_commit=%s\nmanager=%s\nstate=%s\nproject=%s\nsql=%s\n' \
            "$source_commit" "$manager" "$state" "$project" "$sql" >> "$GITHUB_OUTPUT"

      - name: Publish exact database guard authorization proposal
        env:
          SOURCE_COMMIT: ${{ steps.evidence.outputs.source_commit }}
          MANAGER: ${{ steps.evidence.outputs.manager }}
          STATE: ${{ steps.evidence.outputs.state }}
          PROJECT: ${{ steps.evidence.outputs.project }}
          SQL_SHA: ${{ steps.evidence.outputs.sql }}
        run: |
          set -euo pipefail
          expires="$(date -u -d '+2 hours' '+%Y-%m-%dT%H:%M:%SZ')"
          nonce="$(openssl rand -hex 8)"
          command="/r5-revision4-database-guard-authorize commit=${SOURCE_COMMIT} manager=${MANAGER} state=${STATE} project=${PROJECT} sql=${SQL_SHA} prepare_run=${GITHUB_RUN_ID} expires=${expires} nonce=${nonce}"
          db_bytes="$(jq -r '.databaseBytes' r5-revision4-database-guard-evidence/prepare.json)"
          headroom="$(jq -r '.databaseHeadroomBytes' r5-revision4-database-guard-evidence/prepare.json)"
          run_status="$(jq -r '.run.status' r5-revision4-database-guard-evidence/prepare.json)"
          cat > /tmp/database-guard-proposal.md <<EOF
          ## R5 revision-4 database guard authorization proposal

          Preparation run: \`${GITHUB_RUN_ID}\`
          Source main commit: \`${SOURCE_COMMIT}\`
          Active successor: \`r5-recovery-selected-revision4-minute2-entry\`
          Active status: \`${run_status}\`
          Database bytes: \`${db_bytes}\`
          Fixed internal halt: \`400000000\`
          Headroom: \`${headroom}\`
          Structural state: \`${STATE}\`
          Manager SHA-256: \`${MANAGER}\`
          Staged SQL SHA-256: \`${SQL_SHA}\`
          Project identity digest: \`${PROJECT}\`

          Prepare was read-only and verified the exact Devnet revision-4 successor, the one-minute scheduler, the unpatched live claim definition, guard-helper absence, and database size at or above the fixed halt. The authorization applies only the staged claim guard. It does not delete history, VACUUM, change the scheduler, deploy Edge functions, change the public reader, enable Mainnet, authorize stabilization/soak, or rearm the run.

          Exact authorization command:

          \`${command}\`
          EOF
          gh issue comment "$QUALIFICATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/database-guard-proposal.md

      - name: Upload read-only database guard preparation evidence
        uses: actions/upload-artifact@v4
        with:
          name: r5-revision4-database-guard-prepare
          path: r5-revision4-database-guard-evidence
          if-no-files-found: error
          retention-days: 14

  execute:
    if: >-
      github.event.issue.number == 1261 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      startsWith(github.event.comment.body, '/r5-revision4-database-guard-authorize ')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      AUTHORIZATION_BODY: ${{ github.event.comment.body }}
      AUTHORIZATION_CREATED_AT: ${{ github.event.comment.created_at }}
      AUTHORIZATION_COMMENT_ID: ${{ github.event.comment.id }}
    steps:
      - name: Check out exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Parse and bind exact owner authorization
        id: auth
        run: |
          set -euo pipefail
          regex='^/r5-revision4-database-guard-authorize commit=([a-f0-9]{40}) manager=([a-f0-9]{64}) state=([a-f0-9]{64}) project=([a-f0-9]{64}) sql=([a-f0-9]{64}) prepare_run=([0-9]+) expires=([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z) nonce=([a-f0-9]{16})$'
          [[ "$AUTHORIZATION_BODY" =~ $regex ]] || { echo 'database guard authorization shape mismatch' >&2; exit 1; }
          names=(commit manager state project sql prepare_run expires nonce)
          for index in "${!names[@]}"; do
            printf '%s=%s\n' "${names[$index]}" "${BASH_REMATCH[$((index + 1))]}" >> "$GITHUB_OUTPUT"
          done
          test "${BASH_REMATCH[1]}" = "$(git rev-parse HEAD)"
          test "${BASH_REMATCH[2]}" = "$(sha256sum scripts/manage-r5-revision4-database-guard.mjs | awk '{print $1}')"
          current_project="$(PROJECT_ID="$SUPABASE_PROJECT_ID" node -e "const c=require('node:crypto');process.stdout.write(c.createHash('sha256').update(process.env.PROJECT_ID).digest('hex'))")"
          test "${BASH_REMATCH[4]}" = "$current_project"
          expires_epoch="$(date -u -d "${BASH_REMATCH[7]}" +%s)"
          auth_epoch="$(date -u -d "$AUTHORIZATION_CREATED_AT" +%s)"
          now_epoch="$(date -u +%s)"
          test "$auth_epoch" -lt "$expires_epoch"
          test "$now_epoch" -le "$expires_epoch"
          test $((expires_epoch - auth_epoch)) -le 7200

      - name: Verify exact prior proposal and unique authorization
        env:
          PREPARE_RUN: ${{ steps.auth.outputs.prepare_run }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${QUALIFICATION_ISSUE}/comments?per_page=100" | jq -s 'add' > /tmp/database-guard-comments.json
          EXPECTED="$AUTHORIZATION_BODY" PREPARE="$PREPARE_RUN" AUTH_ID="$AUTHORIZATION_COMMENT_ID" node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const comments = JSON.parse(readFileSync('/tmp/database-guard-comments.json', 'utf8'))
          const proposals = comments.filter((comment) => comment?.user?.login === 'github-actions[bot]' && typeof comment?.body === 'string' && comment.body.includes(`Preparation run: \`${process.env.PREPARE}\``) && comment.body.includes(`\`${process.env.EXPECTED}\``))
          if (proposals.length !== 1) throw new Error(`expected one exact database guard proposal, found ${proposals.length}`)
          const authorizations = comments.filter((comment) => comment?.user?.login === 'badjoke-lab' && comment?.body === process.env.EXPECTED)
          if (authorizations.length !== 1 || Number(authorizations[0].id) !== Number(process.env.AUTH_ID)) throw new Error('database guard authorization is not unique')
          NODE

      - name: Revalidate and apply exact staged database guard
        env:
          SOURCE_COMMIT: ${{ steps.auth.outputs.commit }}
          AUTHORIZED_STATE: ${{ steps.auth.outputs.state }}
          AUTHORIZED_SQL: ${{ steps.auth.outputs.sql }}
        run: |
          set -euo pipefail
          mkdir -p r5-revision4-database-guard-evidence
          node scripts/manage-r5-revision4-database-guard.mjs apply \
            --source-commit "$SOURCE_COMMIT" \
            --authorized-state "$AUTHORIZED_STATE" \
            --authorized-sql "$AUTHORIZED_SQL" \
            --output r5-revision4-database-guard-evidence/apply.json \
            > r5-revision4-database-guard-evidence/apply.stdout.json
          jq -e '.guardInstalled == true and .boundary.below == true and .boundary.at == false and .boundary.above == false and .schedulerMutationPerformed == false and .deploymentPerformed == false and .publicReaderMutationPerformed == false and .mainnetDisabled == true and .rearmAuthorized == false' \
            r5-revision4-database-guard-evidence/apply.json >/dev/null

      - name: Observe natural one-minute database halt read-only
        env:
          SOURCE_COMMIT: ${{ steps.auth.outputs.commit }}
        run: |
          set -euo pipefail
          node scripts/manage-r5-revision4-database-guard.mjs wait-for-halt \
            --source-commit "$SOURCE_COMMIT" \
            --output r5-revision4-database-guard-evidence/natural-halt.json \
            > r5-revision4-database-guard-evidence/natural-halt.stdout.json
          jq -e '.observed == true and .run.status == "halted" and .run.lastError == "r5_recovery_database_halt" and .guardInstalled == true and .manualClaimInvoked == false and .mainnetDisabled == true' \
            r5-revision4-database-guard-evidence/natural-halt.json >/dev/null

      - name: Upload database guard apply evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r5-revision4-database-guard-apply
          path: r5-revision4-database-guard-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Publish database guard result
        if: always()
        env:
          SOURCE_COMMIT: ${{ steps.auth.outputs.commit }}
          PREPARE_RUN: ${{ steps.auth.outputs.prepare_run }}
        run: |
          set -euo pipefail
          verdict=FAIL
          if [ "${{ job.status }}" = success ]; then verdict=PASS; fi
          db_bytes=unavailable
          if [ -f r5-revision4-database-guard-evidence/natural-halt.json ]; then db_bytes="$(jq -r '.databaseBytes' r5-revision4-database-guard-evidence/natural-halt.json)"; fi
          cat > /tmp/database-guard-result.md <<EOF
          ## R5 revision-4 database guard apply — ${verdict}

          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          Source commit: \`${SOURCE_COMMIT:-unavailable}\`
          Preparation run: \`${PREPARE_RUN:-unavailable}\`
          Database bytes at natural halt observation: \`${db_bytes}\`
          Fixed internal halt: \`400000000\`

          PASS means the exact staged revision-4 claim guard was installed, its 399999999/400000000/400000001 boundary was verified in production, and the existing one-minute scheduler naturally exposed \`r5_recovery_database_halt\` without a manual claim. Scheduler, deployment, public reader, Mainnet, stabilization/soak, and rearm were not authorized by this operation.
          EOF
          gh issue comment "$QUALIFICATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/database-guard-result.md
