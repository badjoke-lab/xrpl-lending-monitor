name: Rolling output concurrency patch

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rolling-output-concurrency-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Apply bounded concurrent artifact writes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/build-rolling-current-state-read-model.ts')
          text = path.read_text()

          page_start_marker = "  const records: unknown[] = []\n  let pageNo = 0\n  async function flush(): Promise<void> {"
          page_end_marker = "  }\n  options.db.exec('BEGIN')"
          start = text.index(page_start_marker)
          end = text.index(page_end_marker, start)
          replacement = '''  const records: unknown[] = []
          const pendingWrites: Promise<void>[] = []
          let pageNo = 0
          async function flush(): Promise<void> {
            if (records.length === 0) return
            const outputPage = pageNo
            const outputRecords = records.splice(0)
            pageNo += 1
            pendingWrites.push(writeGzipJson(
              join(pageDir, `${String(outputPage).padStart(8, '0')}.json.gz`),
              { schemaVersion: 1, kind: options.kind, page: outputPage, records: outputRecords },
            ))
            if (pendingWrites.length >= 16) await Promise.all(pendingWrites.splice(0))
          }
          '''
          text = text[:start] + replacement + text[end:]

          finish_marker = "    await flush()\n    options.db.exec('COMMIT')"
          if finish_marker not in text:
              raise SystemExit('page finish marker not found')
          text = text.replace(
              finish_marker,
              "    await flush()\n    await Promise.all(pendingWrites)\n    options.db.exec('COMMIT')",
              1,
          )

          lookup_function = text.index('async function writeLookupBuckets(')
          lookup_start = text.index('  const bucketCount = 16 ** prefixLength', lookup_function)
          lookup_end_marker = '  return bucketCount\n}'
          lookup_end = text.index(lookup_end_marker, lookup_start) + len(lookup_end_marker)
          lookup_replacement = '''  const bucketCount = 16 ** prefixLength
          const pendingWrites: Promise<void>[] = []
          for (let index = 0; index < bucketCount; index += 1) {
            const prefix = index.toString(16).toUpperCase().padStart(prefixLength, '0')
            const next = nextHexPrefix(prefix)
            const rows = query.all(prefix, next, next) as LookupRow[]
            pendingWrites.push(writeGzipJson(
              join(lookupDir, `${prefix}.json.gz`),
              {
                schemaVersion: 1,
                prefix,
                records: rows.map((row) => ({ id: row.id, kind: row.kind, page: row.page_no, offset: row.offset_no })),
              },
            ))
            if (pendingWrites.length >= 32) await Promise.all(pendingWrites.splice(0))
          }
          await Promise.all(pendingWrites)
          return bucketCount
          }'''
          text = text[:lookup_start] + lookup_replacement + text[lookup_end:]

          path.write_text(text)
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/build-rolling-current-state-read-model.ts
          git commit -m 'perf: batch rolling read-model artifact writes'
          git push origin HEAD:${GITHUB_HEAD_REF}
