name: Apply activity history budget to main

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-activity-history-budget-main.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply bounded activity read budget
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/worker/repositories/hybrid-history-repository.ts')
          lines = path.read_text().splitlines()
          output = []
          constant_inserted = False
          activity_inserted = False
          inside_activity = False

          for line in lines:
              if line == 'const ARCHIVED_HISTORY_SEGMENT_READS = 24' and not constant_inserted:
                  output.append('const ACTIVITY_HISTORY_SEGMENT_READS = 24')
                  constant_inserted = True
              if line.startswith('export async function listHybridActivity('):
                  inside_activity = True
              output.append(line)
              if inside_activity and line == '    cursor: options.immutableCursor,':
                  output.append('    maxSegmentReads: ACTIVITY_HISTORY_SEGMENT_READS,')
                  output.append('    maxWallTimeMs: AUDIT_HISTORY_WALL_TIME_MS,')
                  activity_inserted = True
                  inside_activity = False

          if not constant_inserted or not activity_inserted:
              raise SystemExit('activity history edit anchors were not found')
          path.write_text('\n'.join(output) + '\n')
          PY
          git diff --check
          grep -n 'ACTIVITY_HISTORY_SEGMENT_READS\|maxWallTimeMs' src/worker/repositories/hybrid-history-repository.ts
      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/worker/repositories/hybrid-history-repository.ts
          git commit -m 'fix: widen bounded activity history read'
          git push origin HEAD:main
