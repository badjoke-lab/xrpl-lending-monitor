name: Compare Cloudflare cron registration

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/compare-cloudflare-cron-registration.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p cron-registration-evidence
      - name: Read protected production Worker schedules
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-monitor/schedules" \
            > cron-registration-evidence/main-worker.json
          cat cron-registration-evidence/main-worker.json
      - name: Read fast-lane shadow Worker schedules
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-fast-lane-shadow/schedules" \
            > cron-registration-evidence/fast-lane-worker.json
          cat cron-registration-evidence/fast-lane-worker.json
      - name: Compare registrations
        run: |
          MAIN_COUNT="$(jq '.result.schedules | length' cron-registration-evidence/main-worker.json)"
          FAST_COUNT="$(jq '.result.schedules | length' cron-registration-evidence/fast-lane-worker.json)"
          jq -n --argjson main_count "${MAIN_COUNT}" --argjson fast_count "${FAST_COUNT}" \
            '{main_worker_schedule_count:$main_count,fast_lane_schedule_count:$fast_count}' \
            > cron-registration-evidence/summary.json
          cat cron-registration-evidence/summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: cron-registration-evidence
          path: cron-registration-evidence
          retention-days: 14
