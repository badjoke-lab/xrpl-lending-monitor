name: Verify three-layer read canary

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-three-layer-read-canary.yml'
      - 'wrangler.three-layer-read-canary.jsonc'
      - 'scripts/verify-three-layer-read-canary.ts'
      - 'vite.three-layer-read-canary.config.ts'
      - 'scripts/verify-fast-lane-against-ledger.ts'
      - 'vite.fast-lane-ledger-diff.config.ts'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

concurrency:
  group: verify-three-layer-read-canary
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p three-layer-canary-evidence

      - name: Build deploy assets and verifiers
        run: |
          pnpm build:deploy-assets
          pnpm exec vite build --config vite.three-layer-read-canary.config.ts
          pnpm exec vite build --config vite.fast-lane-ledger-diff.config.ts

      - name: Deploy cron-free read canary
        run: |
          pnpm exec wrangler deploy --config wrangler.three-layer-read-canary.jsonc \
            | tee three-layer-canary-evidence/deploy.txt

      - name: Verify canary has no schedules
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-three-layer-read-canary/schedules" \
            > three-layer-canary-evidence/canary-schedules.json
          jq -e '.success == true and (.result.schedules | length == 0)' \
            three-layer-canary-evidence/canary-schedules.json > /dev/null

      - name: Resolve production and canary URLs
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            > three-layer-canary-evidence/subdomain.json
          SUBDOMAIN="$(jq -r '.result.subdomain // empty' three-layer-canary-evidence/subdomain.json)"
          test -n "${SUBDOMAIN}"
          printf '%s\n' "https://xrpl-lending-monitor.${SUBDOMAIN}.workers.dev" \
            > three-layer-canary-evidence/production-url.txt
          printf '%s\n' "https://xrpl-lending-three-layer-read-canary.${SUBDOMAIN}.workers.dev" \
            > three-layer-canary-evidence/candidate-url.txt

      - name: Require current fast-lane differential health
        run: |
          PRODUCTION_BASE="$(cat three-layer-canary-evidence/production-url.txt)"
          curl --fail-with-body --silent --show-error \
            "${PRODUCTION_BASE}/api/status/fast-lane-diff?limit=500" \
            > three-layer-canary-evidence/fast-lane-diff.json
          jq -e '.status == "ok" and .passed == true and .sample.sampledRows > 0 and .sample.exactProjectionMismatches == 0' \
            three-layer-canary-evidence/fast-lane-diff.json > /dev/null

      - name: Capture fast-lane witnesses that supersede canonical state
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler d1 execute xrpl-lending-monitor --remote \
            --command "WITH b AS (SELECT shadow_epoch_id,base_epoch_id,base_snapshot_id FROM fast_lane_shadow_base_binding WHERE network='devnet'), s AS (SELECT epoch_id FROM fast_lane_shadow_state WHERE network='devnet') SELECT f.object_type,f.object_id,f.operation,f.projection_json,f.source_ledger_index,f.source_transaction_index FROM fast_lane_shadow_objects_compact f JOIN b ON f.epoch_id=b.shadow_epoch_id JOIN s ON s.epoch_id=f.epoch_id LEFT JOIN current_state_overlay_objects c ON c.network='devnet' AND c.epoch_id=b.base_epoch_id AND c.base_snapshot_id=b.base_snapshot_id AND c.object_type=f.object_type AND c.object_id=f.object_id WHERE f.network='devnet' AND (c.object_id IS NULL OR c.source_ledger_index < f.source_ledger_index OR (c.source_ledger_index = f.source_ledger_index AND c.source_transaction_index < f.source_transaction_index)) ORDER BY f.source_ledger_index DESC,f.source_transaction_index DESC LIMIT 30;" \
            --json > three-layer-canary-evidence/witnesses-raw.txt
          sed -n '/^\[/,$p' three-layer-canary-evidence/witnesses-raw.txt \
            > three-layer-canary-evidence/witnesses.json
          jq -e 'type == "array" and length > 0 and .[0].success == true and (.[0].results | length > 0)' \
            three-layer-canary-evidence/witnesses.json > /dev/null

      - name: Capture one internally consistent exact-ledger sample
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler d1 execute xrpl-lending-monitor --remote \
            --command "SELECT s.last_processed_ledger,s.last_processed_hash,o.object_type,o.object_id,o.operation,o.projection_json FROM fast_lane_shadow_state s JOIN fast_lane_shadow_objects_compact o ON o.network=s.network AND o.epoch_id=s.epoch_id WHERE s.network='devnet' ORDER BY o.object_type ASC,o.object_id ASC LIMIT 100;" \
            --json > three-layer-canary-evidence/ledger-sample-raw.txt
          sed -n '/^\[/,$p' three-layer-canary-evidence/ledger-sample-raw.txt \
            > three-layer-canary-evidence/ledger-sample.json
          jq -e 'type == "array" and length > 0 and .[0].success == true and (.[0].results | length > 0)' \
            three-layer-canary-evidence/ledger-sample.json > /dev/null

      - name: Re-verify fast lane against exact ledger state
        run: |
          node .fast-lane-ledger-diff-build/verify-fast-lane-against-ledger.mjs \
            --endpoint https://devnet.honeycluster.io/ \
            --input three-layer-canary-evidence/ledger-sample.json \
            --output three-layer-canary-evidence/exact-ledger-summary.json \
            --concurrency 8
          jq -e '.passed == true and .sampleSize > 0 and ((.counts.mismatch // 0) == 0) and ((.counts.unexpected_present // 0) == 0) and ((.counts.rpc_error // 0) == 0)' \
            three-layer-canary-evidence/exact-ledger-summary.json > /dev/null

      - name: Capture candidate collection smoke responses
        shell: bash
        run: |
          CANDIDATE_BASE="$(cat three-layer-canary-evidence/candidate-url.txt)"
          for RESOURCE in vaults loan-brokers loans; do
            STATUS="$(curl --silent --show-error \
              --output "three-layer-canary-evidence/candidate-${RESOURCE}.json" \
              --write-out '%{http_code}' \
              "${CANDIDATE_BASE}/api/${RESOURCE}?limit=1&sort=id_asc")"
            printf '%s\n' "${STATUS}" > "three-layer-canary-evidence/candidate-${RESOURCE}.status"
          done

      - name: Compare production and candidate read paths
        shell: bash
        run: |
          set -o pipefail
          PRODUCTION_BASE="$(cat three-layer-canary-evidence/production-url.txt)"
          CANDIDATE_BASE="$(cat three-layer-canary-evidence/candidate-url.txt)"
          node .three-layer-read-canary-build/verify-three-layer-read-canary.mjs \
            --production-base "${PRODUCTION_BASE}" \
            --candidate-base "${CANDIDATE_BASE}" \
            --witnesses three-layer-canary-evidence/witnesses.json \
            --output three-layer-canary-evidence/summary.json \
            2>&1 | tee three-layer-canary-evidence/compare.log
          jq -e '.passed == true and .witnessCount > 0 and .candidateFailureCount == 0 and .effectiveDifferences > 0' \
            three-layer-canary-evidence/summary.json > /dev/null

      - name: Delete temporary read canary
        if: ${{ always() }}
        run: pnpm exec wrangler delete --config wrangler.three-layer-read-canary.jsonc --force || true

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: three-layer-read-canary-evidence
          path: three-layer-canary-evidence
          if-no-files-found: warn
          retention-days: 14
