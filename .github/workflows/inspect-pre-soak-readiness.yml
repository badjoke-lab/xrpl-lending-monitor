name: Inspect pre-soak readiness

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/inspect-pre-soak-readiness.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Capture readiness response
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pre-soak-readiness-inspection
          curl --fail-with-body --silent --show-error --retry 3 \
            https://xrpl-lending-monitor.badjoke-lab.workers.dev/api/status/pre-soak-readiness \
            > pre-soak-readiness-inspection/readiness.json
          jq '{passed,architecture,checks,evidence:{fastLane:.evidence.fastLane,protectedCollector:.evidence.protectedCollector,recentRuns:.evidence.recentRuns,history:.evidence.history,replacementBaseDryRunPassed:.evidence.replacementBaseDryRunPassed}}' \
            pre-soak-readiness-inspection/readiness.json \
            > pre-soak-readiness-inspection/summary.json
          cat pre-soak-readiness-inspection/summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: pre-soak-readiness-inspection
          path: pre-soak-readiness-inspection
          if-no-files-found: error
          retention-days: 7
