name: R5 free-operation capacity qualification

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: r5-free-operation-capacity-qualification
  cancel-in-progress: false

jobs:
  qualify:
    if: >-
      github.event.issue.number == 1261 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      github.event.comment.body == '/r5-free-operation-capacity-qualify'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Measure free-operation capacity read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r5-free-operation-capacity
          source_commit="$(git rev-parse HEAD)"
          node scripts/qualify-r5-free-operation-capacity.mjs \
            --source-commit "$source_commit" \
            --output r5-free-operation-capacity/qualification.json
          jq -e '
            .purpose == "r5-free-operation-capacity-readonly-qualification" and
            .sourceCommit == env.GITHUB_SHA and
            .productionDatabaseReadOnly == true and
            .bsrReadExecuted == true and
            .rowMutationPerformed == false and
            .schedulerMutationPerformed == false and
            .deploymentPerformed == false and
            .publicReaderMutationPerformed == false and
            .migrationMutationPerformed == false and
            .r5RearmAuthorized == false and
            .r5RearmPerformed == false and
            .mainnetEnabled == false and
            (.databaseBytes | type == "number") and
            (.databaseHeadroomBytes | type == "number") and
            (.growthModel.sampleLedgerCount | type == "number") and
            (.growthModel.projectedIncrementalRows | type == "number") and
            (.growthModel.projectedIncrementalDatabaseBytes | type == "number") and
            (.projectedDatabaseBytesReserve | type == "number") and
            (.resourceBounds.reviewedResourceAccountingUnchanged | type == "boolean") and
            (.resourceBounds.egressCapacitySafe | type == "boolean") and
            (.resourceBounds.memoryCapacitySafe | type == "boolean") and
            (.resourceBounds.invocationCapacitySafe | type == "boolean") and
            (.safeForR5Rearm | type == "boolean") and
            (.evidenceDigest | test("^[a-f0-9]{64}$"))
          ' r5-free-operation-capacity/qualification.json >/dev/null

      - name: Upload sanitized capacity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r5-free-operation-capacity-qualification-${{ github.run_id }}
          path: r5-free-operation-capacity/qualification.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publish sanitized qualification result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          f='r5-free-operation-capacity/qualification.json'
          if [ ! -s "$f" ]; then
            cat > /tmp/body.md <<EOF
          ## R5 free-operation capacity qualification — FAILED BEFORE EVIDENCE

          Run: \`${GITHUB_RUN_ID}\`
          Source commit: \`${GITHUB_SHA}\`

          No production mutation, R5 rearm, scheduler mutation, deployment, public-reader mutation, migration mutation, or Mainnet enablement was authorized or performed.
          EOF
          else
            db="$(jq -r '.databaseBytes' "$f")"
            headroom="$(jq -r '.databaseHeadroomBytes' "$f")"
            one_claim="$(jq -r '.projectedDatabaseBytesOneClaim' "$f")"
            reserve="$(jq -r '.projectedDatabaseBytesReserve' "$f")"
            sample="$(jq -r '.growthModel.sampleLedgerCount' "$f")"
            max_rows="$(jq -r '.growthModel.maxDirectRowsPerLedger' "$f")"
            projected_rows="$(jq -r '.growthModel.projectedRowsPerLedger' "$f")"
            row_bytes="$(jq -r '.growthModel.maxObservedPhysicalBytesPerRow' "$f")"
            windows="$(jq -r '.growthModel.reserveWindows' "$f")"
            db_safe="$(jq -r '.databaseCapacitySafe' "$f")"
            accounting_unchanged="$(jq -r '.resourceBounds.reviewedResourceAccountingUnchanged' "$f")"
            egress="$(jq -r '.resourceBounds.projectedEgress31dBytes' "$f")"
            egress_safe="$(jq -r '.resourceBounds.egressCapacitySafe' "$f")"
            memory="$(jq -r '.resourceBounds.memoryUpperBytes' "$f")"
            memory_safe="$(jq -r '.resourceBounds.memoryCapacitySafe' "$f")"
            invocations="$(jq -r '.resourceBounds.projectedInvocations31d' "$f")"
            invocations_safe="$(jq -r '.resourceBounds.invocationCapacitySafe' "$f")"
            spec="$(jq -r '.currentSpecificationIntact' "$f")"
            reclaim="$(jq -r '.integrityPreservingReclaimOrRetentionProven' "$f")"
            safe="$(jq -r '.safeForR5Rearm' "$f")"
            digest="$(jq -r '.evidenceDigest' "$f")"
            cat > /tmp/body.md <<EOF
          ## R5 free-operation capacity read-only qualification

          Run: \`${GITHUB_RUN_ID}\`
          Source commit: \`${GITHUB_SHA}\`
          Database: \`${db} B\` / halt \`400000000 B\`; headroom \`${headroom} B\`.
          Growth sample: \`${sample}\` committed ledgers; observed max direct rows/ledger \`${max_rows}\`; conservative projected rows/ledger \`${projected_rows}\`; physical upper-bound bytes/row \`${row_bytes}\`.
          Projected database after one 12-ledger claim: \`${one_claim} B\`.
          Projected database after \`${windows}\` reserved claim windows: \`${reserve} B\`; database capacity safe: \`${db_safe}\`.
          Reviewed resource-accounting implementation unchanged: \`${accounting_unchanged}\`.
          Projected rolling egress: \`${egress} B\`; safe: \`${egress_safe}\`.
          Memory upper bound: \`${memory} B\`; safe: \`${memory_safe}\`.
          Projected 31-day invocations: \`${invocations}\`; safe: \`${invocations_safe}\`.
          Current revision-4 specification intact: \`${spec}\`.
          Integrity-preserving reclaim/retention proof present: \`${reclaim}\`.
          Safe for separate R5 rearm authorization candidacy: **\`${safe}\`**.
          Evidence digest: \`${digest}\`.

          This qualification is production-database read-only. It does **not** authorize or perform R5 rearm, scheduler mutation, deployment, public-reader mutation, migration mutation, row mutation, or Mainnet enablement.
          EOF
          fi
          gh issue comment 1261 --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.md
