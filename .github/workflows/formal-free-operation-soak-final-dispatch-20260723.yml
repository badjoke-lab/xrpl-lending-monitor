name: Dispatch formal Free-operation soak final audit 2026-07-23

on:
  schedule:
    - cron: '20 0 23 7 *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: read

concurrency:
  group: formal-free-operation-soak-final-dispatch-20260723
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Dispatch only the accepted one-time formal soak
        shell: bash
        run: |
          set -Eeuo pipefail
          if test "$(date -u +%F)" != '2026-07-23'; then
            echo 'Outside the one-time final-audit date.'
            exit 0
          fi
          gh issue view 962 --repo "$REPOSITORY" --json state,title,labels > /tmp/issue.json
          if ! jq -e '.state=="OPEN" and (([.labels[].name]|index("in-progress"))!=null) and ((.title|startswith("FAILED"))|not) and ((.title|startswith("NOT STARTED"))|not)' /tmp/issue.json > /dev/null; then
            echo 'Formal soak was not accepted or is already closed; final audit not dispatched.'
            exit 0
          fi
          gh workflow run formal-free-operation-soak-final-audit.yml --repo "$REPOSITORY" --ref main
