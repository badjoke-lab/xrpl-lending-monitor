name: Diagnose stalled fast lane before soak

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-soak-fast-lane-state.yml'

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      BASE_URL: https://xrpl-lending-monitor.badjoke-lab.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture D1 fast-lane state and public status
        shell: bash
        run: |
          set -euo pipefail
          ROOT=diagnose-soak-fast-lane-state
          mkdir -p "$ROOT"
          pnpm exec wrangler d1 execute xrpl-lending-monitor --remote --command "SELECT * FROM fast_lane_shadow_state WHERE network='devnet';" --json > "$ROOT/state-raw.txt"
          sed -n '/^\[/,$p' "$ROOT/state-raw.txt" > "$ROOT/state.json"
          pnpm exec wrangler d1 execute xrpl-lending-monitor --remote --command "SELECT * FROM fast_lane_shadow_base_binding WHERE network='devnet';" --json > "$ROOT/binding-raw.txt"
          sed -n '/^\[/,$p' "$ROOT/binding-raw.txt" > "$ROOT/binding.json"
          pnpm exec wrangler d1 execute xrpl-lending-monitor --remote --command "SELECT run_at,status,start_ledger_index,end_ledger_index,latest_observed_ledger,lag_ledgers,ledgers_processed,lending_transactions,coalesced_object_rows,persistence_rows_read,persistence_rows_written FROM fast_lane_shadow_run_metrics WHERE network='devnet' ORDER BY run_at DESC LIMIT 80;" --json > "$ROOT/metrics-raw.txt"
          sed -n '/^\[/,$p' "$ROOT/metrics-raw.txt" > "$ROOT/metrics.json"
          pnpm exec wrangler d1 execute xrpl-lending-monitor --remote --command "SELECT name,sql FROM sqlite_master WHERE type='table' AND (name LIKE '%fast_lane%' OR name LIKE '%collector%' OR name LIKE '%run%') ORDER BY name;" --json > "$ROOT/schema-raw.txt"
          sed -n '/^\[/,$p' "$ROOT/schema-raw.txt" > "$ROOT/schema.json"
          curl --fail-with-body --silent --show-error --retry 3 "$BASE_URL/api/status/pre-soak-readiness" > "$ROOT/readiness.json"
          curl --fail-with-body --silent --show-error --retry 3 "$BASE_URL/api/overview" > "$ROOT/overview.json"
          curl --fail-with-body --silent --show-error --retry 3 "$BASE_URL/api/status/fast-lane-diff?limit=500" > "$ROOT/diff.json"
          curl --fail-with-body --silent --show-error --retry 3 "$BASE_URL/api/status/collector" > "$ROOT/collector.json"
          grep -R -n -E 'fast_lane_shadow_state|fast_lane_shadow_base_binding|fast_lane_shadow_run_metrics|reinitial|reanchor|DELETE FROM fast_lane' src scripts .github/workflows > "$ROOT/source-paths.txt" || true
          while IFS=: read -r file line rest; do
            [ -f "$file" ] || continue
            start=$((line > 35 ? line - 35 : 1))
            end=$((line + 70))
            printf '\n===== %s:%s =====\n' "$file" "$line" >> "$ROOT/source-context.txt"
            sed -n "${start},${end}p" "$file" >> "$ROOT/source-context.txt"
          done < "$ROOT/source-paths.txt"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?created=2026-07-13T00:15:00Z..2026-07-13T01:30:00Z&per_page=100" > "$ROOT/actions-runs.json"
          jq '[.workflow_runs[] | {id,name,path,event,status,conclusion,head_branch,head_sha,created_at,run_started_at,updated_at}]' "$ROOT/actions-runs.json" > "$ROOT/actions-window.json"
          AUTH=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          curl --fail-with-body --silent --show-error "${AUTH[@]}" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/xrpl-lending-monitor/deployments" > "$ROOT/deployments.json"
          curl --fail-with-body --silent --show-error "${AUTH[@]}" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/xrpl-lending-monitor/versions" > "$ROOT/versions.json"
          jq -n --slurpfile state "$ROOT/state.json" --slurpfile binding "$ROOT/binding.json" --slurpfile metrics "$ROOT/metrics.json" --slurpfile readiness "$ROOT/readiness.json" --slurpfile overview "$ROOT/overview.json" --slurpfile diff "$ROOT/diff.json" --slurpfile collector "$ROOT/collector.json" --slurpfile actions "$ROOT/actions-window.json" --slurpfile deployments "$ROOT/deployments.json" '{state:$state[0],binding:$binding[0],metrics:$metrics[0],readiness:$readiness[0],overview:$overview[0],diff:$diff[0],collector:$collector[0],actions:$actions[0],deployments:$deployments[0]}' > "$ROOT/summary.json"
          jq '{state:.state[0].results,binding:.binding[0].results,latestMetrics:(.metrics[0].results[0:10]),readinessPassed:.readiness.passed,current:.overview.current_state_watermark,diffStatus:.diff.status,diffReason:.diff.reason,actions:.actions,deployments:.deployments.result.deployments}' "$ROOT/summary.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnose-soak-fast-lane-state
          path: diagnose-soak-fast-lane-state
          if-no-files-found: error
          retention-days: 7
