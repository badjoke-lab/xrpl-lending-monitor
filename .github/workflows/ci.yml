name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: pnpm install --no-frozen-lockfile 2>&1 | tee pnpm-install.log

      - name: Upload install diagnostics and generated lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-install-diagnostics
          path: |
            pnpm-install.log
            pnpm-lock.yaml
          retention-days: 1

      - name: Stop after install failure
        if: steps.install.outcome != 'success'
        run: exit 1

      - name: Lint
        id: lint
        continue-on-error: true
        run: pnpm lint 2>&1 | tee lint.log

      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-diagnostics
          path: lint.log
          retention-days: 1

      - name: Stop after lint failure
        if: steps.lint.outcome != 'success'
        run: exit 1

      - name: Type-check
        id: typecheck
        continue-on-error: true
        run: pnpm typecheck 2>&1 | tee typecheck.log

      - name: Upload type-check diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          retention-days: 1

      - name: Stop after type-check failure
        if: steps.typecheck.outcome != 'success'
        run: exit 1

      - name: Unit tests
        id: unit
        continue-on-error: true
        run: pnpm test 2>&1 | tee unit-test.log

      - name: Upload unit-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-diagnostics
          path: unit-test.log
          retention-days: 1

      - name: Stop after unit-test failure
        if: steps.unit.outcome != 'success'
        run: exit 1

      - name: Build application
        id: build
        continue-on-error: true
        run: pnpm build 2>&1 | tee build.log

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: build.log
          retention-days: 1

      - name: Stop after build failure
        if: steps.build.outcome != 'success'
        run: exit 1

      - name: Install Chromium
        id: browser_install
        continue-on-error: true
        run: pnpm exec playwright install --with-deps chromium 2>&1 | tee playwright-install.log

      - name: Upload Chromium installation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-install-diagnostics
          path: playwright-install.log
          retention-days: 1

      - name: Stop after Chromium installation failure
        if: steps.browser_install.outcome != 'success'
        run: exit 1

      - name: Browser smoke test
        id: browser_test
        continue-on-error: true
        run: pnpm test:e2e 2>&1 | tee browser-test.log

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-diagnostics
          path: |
            browser-test.log
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 1

      - name: Stop after browser-test failure
        if: steps.browser_test.outcome != 'success'
        run: exit 1
