name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write

jobs:
  dispatch-history:
    if: github.event_name == 'pull_request' && github.head_ref == 'ops/one-shot-history-dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch immutable-history reconstruction once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/history-dispatch.json" <<'JSON'
          {
            "ref": "main",
            "inputs": {
              "operation": "immutable_history_reconstruction",
              "source_current_state_branch": "current-state-four-hour-b-data",
              "current_state_candidate_branch": "current-state-four-hour-a-data",
              "history_max_segments": "64",
              "history_auto_continue": true
            }
          }
          JSON
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/actions/workflows/rolling-checkpoint-candidate.yml/dispatches" \
            --input "$RUNNER_TEMP/history-dispatch.json"
          echo "immutable-history workflow dispatch accepted"

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enforce minimal Actions workflow surface
        run: bash scripts/check-actions-workflow-allowlist.sh

      - name: Upload Actions workflow policy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actions-workflow-policy-evidence
          path: actions-workflow-policy-evidence
          if-no-files-found: warn
          retention-days: 7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Validate D1 headroom gate shell syntax
        run: bash -n scripts/check-d1-headroom.sh

      - name: Validate live cutover shell syntax
        run: |
          bash -n scripts/run-live-checkpoint-cutover.sh
          bash -n scripts/verify-live-checkpoint-cutover.sh
          bash -n scripts/check-canonical-production-base.sh

      - name: Validate canonical production base identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-canonical-production-base.sh

      - name: Type-check
        run: pnpm typecheck

      - name: Bundle production fast-lane runner
        run: pnpm exec vite build --config vite.fast-lane-production.config.ts

      - name: Validate production fast-lane configuration
        run: node .fast-lane-production-build/run-fast-lane-production.mjs --validate-config

      - name: Unit tests
        run: pnpm test

      - name: Apply D1 migrations locally
        run: pnpm db:migrate:local

      - name: Build application
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser smoke test
        run: pnpm test:e2e
