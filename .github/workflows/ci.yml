name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enforce minimal Actions workflow surface
        run: bash scripts/check-actions-workflow-allowlist-r5-one-shot.sh

      - name: Upload Actions workflow policy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actions-workflow-policy-evidence
          path: actions-workflow-policy-evidence
          if-no-files-found: warn
          retention-days: 7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Validate D1 headroom gate shell syntax
        run: bash -n scripts/check-d1-headroom.sh

      - name: Validate live cutover shell syntax
        run: |
          bash -n scripts/run-live-checkpoint-cutover.sh
          bash -n scripts/verify-live-checkpoint-cutover.sh
          bash -n scripts/check-canonical-production-base.sh
          bash -n scripts/check-actions-workflow-allowlist-r5-one-shot.sh
          bash -n scripts/test-r4f-revision4-directional-persistence-postgres.sh
          bash -n scripts/test-r4f-revision4-provider-capture-verifier.sh
          bash -n scripts/test-r4f-steady-qualification-reclaim-contract.sh
          bash -n scripts/test-r5-phase-message-ready-partial-index-postgres.sh

      - name: Validate canonical production base identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-canonical-production-base.sh

      - name: Type-check
        run: pnpm typecheck

      - name: Bundle production fast-lane runner
        run: pnpm exec vite build --config vite.fast-lane-production.config.ts

      - name: Validate production fast-lane configuration
        run: node .fast-lane-production-build/run-fast-lane-production.mjs --validate-config

      - name: Unit tests
        run: pnpm test

      - name: Verify revision-4 PostgreSQL persistence locally
        run: bash scripts/test-r4f-revision4-directional-persistence-postgres.sh

      - name: Verify revision-4 provider capture verifier locally
        run: bash scripts/test-r4f-revision4-provider-capture-verifier.sh

      - name: Verify steady qualification reclaim contract
        run: bash scripts/test-r4f-steady-qualification-reclaim-contract.sh

      - name: Verify R5 phase message ready partial index locally
        run: bash scripts/test-r5-phase-message-ready-partial-index-postgres.sh

      - name: Upload R5 phase message ready partial-index evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r5-phase-message-ready-partial-index-evidence
          path: r5-phase-message-ready-partial-index-evidence
          if-no-files-found: warn
          retention-days: 7

      - name: Apply D1 migrations locally
        run: pnpm db:migrate:local

      - name: Build application
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser smoke test
        run: pnpm test:e2e

  r4f-g4-memory-replay:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out exact main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify one-shot G4 replay boundary
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          marker='ops/r4f/run-once-20260806-g4-memory-replay.marker'
          if ! git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -Fxq "$marker"; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'The exact one-shot marker was not introduced by this commit; replay skipped.'
            exit 0
          fi
          test -f "$marker"
          marker_sha="$(sha256sum "$marker" | cut -d' ' -f1)"
          test "$marker_sha" = 695d93c22dc2c2db76fdd352e4b9319de2573235f05e692833ab16fb4758a70e
          author_login="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" --jq '.author.login')"
          test "$author_login" = badjoke-lab
          grep -Fxq 'issue=1261' "$marker"
          grep -Fxq 'authorization_comment=5401115525' "$marker"
          grep -Fxq 'production_credentials=none' "$marker"
          grep -Fxq 'production_mutation=none' "$marker"
          grep -Fxq 'mainnet=disabled' "$marker"
          mkdir -p r4f-g4-memory-replay
          echo 'run=true' >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        if: steps.gate.outputs.run == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Set up Deno
        if: steps.gate.outputs.run == 'true'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Capture exact public Devnet source range
        if: steps.gate.outputs.run == 'true'
        run: |
          deno run \
            --allow-net \
            --allow-read=. \
            --allow-write=r4f-g4-memory-replay \
            scripts/run-r4f-revision4-memory-replay.mjs \
            capture \
            --output r4f-g4-memory-replay/source

      - name: Replay exact twelve-ledger halt shape offline
        if: steps.gate.outputs.run == 'true'
        run: |
          deno run \
            --allow-read=. \
            --allow-write=r4f-g4-memory-replay \
            --unstable-sloppy-imports \
            --node-modules-dir=manual \
            scripts/run-r4f-revision4-memory-replay.mjs \
            replay \
            --input r4f-g4-memory-replay/source \
            --shape exact \
            --output r4f-g4-memory-replay/exact.json

      - name: Replay heavier retained shape offline
        if: steps.gate.outputs.run == 'true'
        run: |
          deno run \
            --allow-read=. \
            --allow-write=r4f-g4-memory-replay \
            --unstable-sloppy-imports \
            --node-modules-dir=manual \
            scripts/run-r4f-revision4-memory-replay.mjs \
            replay \
            --input r4f-g4-memory-replay/source \
            --shape heavier \
            --output r4f-g4-memory-replay/heavier.json

      - name: Assemble revision-4 memory evidence
        if: steps.gate.outputs.run == 'true'
        run: |
          deno run \
            --allow-read=. \
            --allow-write=r4f-g4-memory-replay \
            scripts/run-r4f-revision4-memory-replay.mjs \
            assemble \
            --exact r4f-g4-memory-replay/exact.json \
            --heavier r4f-g4-memory-replay/heavier.json \
            --output r4f-g4-memory-replay/evidence.json \
            --summary r4f-g4-memory-replay/summary.md \
            --source-commit "$GITHUB_SHA" \
            --harness scripts/run-r4f-revision4-memory-replay.mjs

      - name: Verify assembled memory evidence fail closed
        if: steps.gate.outputs.run == 'true'
        run: |
          npx vite build --config vite.r4f-revision4-memory-evidence-verifier.config.ts
          node .tmp/r4f-revision4-memory-evidence-verifier.mjs \
            --input r4f-g4-memory-replay/evidence.json \
            --output r4f-g4-memory-replay/verified.json \
            --require-proof-ready

      - name: Upload G4 memory replay evidence
        id: upload
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: r4f-g4-memory-replay-evidence
          path: r4f-g4-memory-replay
          if-no-files-found: warn
          retention-days: 14

      - name: Publish sanitized G4 replay result
        if: always() && steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        shell: bash
        run: |
          set -euo pipefail
          comment='/tmp/r4f-g4-memory-replay-comment.md'
          if test -s r4f-g4-memory-replay/summary.md && test -s r4f-g4-memory-replay/verified.json; then
            cp r4f-g4-memory-replay/summary.md "$comment"
            proof_ready="$(node -e "const x=require('./r4f-g4-memory-replay/verified.json');process.stdout.write(String(x.proofReady))")"
            blockers="$(node -e "const x=require('./r4f-g4-memory-replay/verified.json');process.stdout.write(x.blockingReasons.join(',')||'none')")"
            {
              echo "- verifier proof ready: \`$proof_ready\`"
              echo "- verifier blockers: \`$blockers\`"
            } >> "$comment"
          else
            {
              echo '## R4F G4 bounded offline memory replay'
              echo
              echo "- source commit: \`$GITHUB_SHA\`"
              echo '- replay result: `failed before verified evidence`'
              echo '- production credentials: `none`'
              echo '- production mutation: `none`'
              echo '- recovery mutation committed: `false`'
              echo '- public reader unchanged: `true`'
              echo '- Mainnet disabled: `true`'
              echo '- stabilization authorized: `false`'
              echo '- soak authorized: `false`'
            } > "$comment"
          fi
          {
            echo "- workflow run: \`$GITHUB_RUN_ID\`"
            echo "- artifact ID: \`${ARTIFACT_ID:-unavailable}\`"
            echo "- artifact digest: \`${ARTIFACT_DIGEST:-unavailable}\`"
            echo
          } >> "$comment"
          gh issue comment 1261 --repo "$GITHUB_REPOSITORY" --body-file "$comment"
