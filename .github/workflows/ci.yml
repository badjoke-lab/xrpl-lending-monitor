name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  prepare-history-workflow-fix:
    if: github.event_name == 'pull_request' && github.head_ref == 'ops/one-shot-history-dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Publish isolated runner temp-context fix branch
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/rolling-checkpoint-candidate.yml')
          text = path.read_text()
          token = '$' + '{{ runner.temp }}/history-reconstruction'
          old = f'HISTORY_OUTPUT: {token}'
          new = 'HISTORY_OUTPUT: /tmp/history-reconstruction'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one invalid runner.temp job-env expression, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -c fix/history-reconstruction-runner-temp-context
          git add .github/workflows/rolling-checkpoint-candidate.yml
          git commit -m "Fix immutable-history workflow runner temp context"
          git push --force origin HEAD:refs/heads/fix/history-reconstruction-runner-temp-context

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enforce minimal Actions workflow surface
        run: bash scripts/check-actions-workflow-allowlist.sh

      - name: Upload Actions workflow policy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actions-workflow-policy-evidence
          path: actions-workflow-policy-evidence
          if-no-files-found: warn
          retention-days: 7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Validate D1 headroom gate shell syntax
        run: bash -n scripts/check-d1-headroom.sh

      - name: Validate live cutover shell syntax
        run: |
          bash -n scripts/run-live-checkpoint-cutover.sh
          bash -n scripts/verify-live-checkpoint-cutover.sh
          bash -n scripts/check-canonical-production-base.sh

      - name: Validate canonical production base identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-canonical-production-base.sh

      - name: Type-check
        run: pnpm typecheck

      - name: Bundle production fast-lane runner
        run: pnpm exec vite build --config vite.fast-lane-production.config.ts

      - name: Validate production fast-lane configuration
        run: node .fast-lane-production-build/run-fast-lane-production.mjs --validate-config

      - name: Unit tests
        run: pnpm test

      - name: Apply D1 migrations locally
        run: pnpm db:migrate:local

      - name: Build application
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser smoke test
        run: pnpm test:e2e
