name: CI

on:
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  capture-history-run:
    if: github.head_ref == 'ops/one-shot-history-dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Capture latest immutable-history workflow dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: 9587f1360a88b1630e3bca31a271fe8daa9bd40b
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/history-run-state"
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/actions/workflows/rolling-checkpoint-candidate.yml/runs?event=workflow_dispatch&per_page=20" \
            > "$RUNNER_TEMP/history-run-state/runs.json"
          jq --arg sha "$EXPECTED_HEAD_SHA" '
            [.workflow_runs[] | select(.head_sha == $sha)]
            | sort_by(.created_at)
            | reverse
            | .[0]
            | {
                id,
                run_number,
                event,
                status,
                conclusion,
                head_sha,
                created_at,
                updated_at,
                html_url,
                jobs_url,
                artifacts_url
              }
          ' "$RUNNER_TEMP/history-run-state/runs.json" \
            > "$RUNNER_TEMP/history-run-state/latest.json"
          jq -e '.id != null and .event == "workflow_dispatch" and .head_sha == env.EXPECTED_HEAD_SHA' \
            "$RUNNER_TEMP/history-run-state/latest.json" >/dev/null
          cat "$RUNNER_TEMP/history-run-state/latest.json"

      - name: Upload immutable-history run state
        uses: actions/upload-artifact@v4
        with:
          name: immutable-history-run-state
          path: ${{ runner.temp }}/history-run-state/latest.json
          if-no-files-found: error
          retention-days: 1
