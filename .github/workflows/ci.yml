name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MAINNET_ENABLED: 'false'
      VITE_MAINNET_ENABLED: 'false'
      VITE_NETWORK: devnet
      VITE_XRPL_RPC_URL: wss://s.devnet.rippletest.net:51233

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Validate live cutover shell syntax
        run: |
          bash -n scripts/publish-m1-immutable-base.sh
          bash -n scripts/build-m1-production-runtime-vars.sh
          bash -n scripts/test-r4f-revision4-directional-persistence-postgres.sh

      - name: Verify canonical production runtime identity fixture
        run: |
          node scripts/build-m1-production-runtime-vars.mjs \
            --smoke-json src/test/fixtures/m1-gate-production-ready.json \
            --out-json /tmp/m1-production-runtime-vars.json \
            --out-env /tmp/m1-production-runtime-vars.env
          diff -u src/test/fixtures/m1-production-runtime-vars.json /tmp/m1-production-runtime-vars.json
          diff -u src/test/fixtures/m1-production-runtime-vars.env /tmp/m1-production-runtime-vars.env

      - name: Type-check
        run: pnpm typecheck

      - name: Verify fast-lane bundle and runtime config
        run: pnpm verify:fast-lane

      - name: Run unit tests
        run: pnpm test

      - name: Verify revision-4 PostgreSQL persistence locally
        run: bash scripts/test-r4f-revision4-directional-persistence-postgres.sh

      - name: Apply D1 migrations locally
        run: pnpm db:migrate:local

      - name: Build production bundle
        run: pnpm build

      - name: Install Chromium for browser smoke tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Run built-app browser smoke tests
        run: pnpm test:browser

      - name: Enforce workflow policy
        run: bash scripts/check-actions-workflow-allowlist.sh
