name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Apply D1 migrations locally
        run: pnpm db:migrate:local

      - name: Build application
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser smoke test
        run: pnpm test:e2e

  patch-diagnostic-read:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optimize-d1-diagnostic-reads
          fetch-depth: 2
      - name: Apply indexed object-type lookup patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/worker/repositories/live-continuation-verification.ts')
          text = path.read_text()
          old = """                  AND c.epoch_id = o.epoch_id
                  AND c.object_id = o.object_id
"""
          new = """                  AND c.epoch_id = o.epoch_id
                  AND c.object_type = CASE o.object_type
                    WHEN 'vault' THEN 'Vault'
                    WHEN 'loan_broker' THEN 'LoanBroker'
                    WHEN 'loan' THEN 'Loan'
                  END
                  AND c.object_id = o.object_id
"""
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected 2 correlation anchors, found {count}')
          path.write_text(text.replace(old, new))
          Path('.github/workflows/patch-d1-diagnostic-read.yml').unlink(missing_ok=True)
      - name: Restore standard CI and commit patch
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Use indexed object-type lookup in HYB-7 overlay evidence"
          git push origin HEAD:optimize-d1-diagnostic-reads
