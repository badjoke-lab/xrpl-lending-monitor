name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enforce minimal Actions workflow surface
        run: bash scripts/check-actions-workflow-allowlist.sh

      - name: Upload Actions workflow policy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actions-workflow-policy-evidence
          path: actions-workflow-policy-evidence
          if-no-files-found: warn
          retention-days: 7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Validate D1 headroom gate shell syntax
        run: bash -n scripts/check-d1-headroom.sh

      - name: Validate live cutover shell syntax
        run: |
          bash -n scripts/run-live-checkpoint-cutover.sh
          bash -n scripts/verify-live-checkpoint-cutover.sh
          bash -n scripts/check-canonical-production-base.sh

      - name: Validate canonical production base identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-canonical-production-base.sh

      - name: Type-check
        run: pnpm typecheck

      - name: Bundle production fast-lane runner
        run: pnpm exec vite build --config vite.fast-lane-production.config.ts

      - name: Validate production fast-lane configuration
        run: node .fast-lane-production-build/run-fast-lane-production.mjs --validate-config

      - name: Unit tests
        run: pnpm test

      - name: Apply D1 migrations locally
        run: pnpm db:migrate:local

      - name: Build application
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser smoke test
        run: pnpm test:e2e

  history-repair-preflight:
    if: github.event_name == 'pull_request' && github.head_ref == 'ops/history-repair-resumable-3932301'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repair implementation
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test bounded storage and resumable runner generation
        shell: bash
        run: |
          mkdir -p history-repair-preflight-evidence
          set -o pipefail
          pnpm exec vitest run \
            scripts/history-exact-index-spill.test.mjs \
            scripts/prepare-resumable-history-repair.test.mjs \
            2>&1 | tee history-repair-preflight-evidence/repair-tests.log

      - name: Upload history repair preflight diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-repair-preflight-evidence
          path: history-repair-preflight-evidence
          if-no-files-found: warn
          retention-days: 7

      - name: Bundle memory-bounded exact index
        run: pnpm build:history-exact-index

      - name: Generate and validate resumable repair runner
        run: |
          node scripts/prepare-resumable-history-repair.mjs \
            scripts/run-history-repair-3932301.sh \
            .local/run-history-repair-resumable-3932301.sh
          bash -n .local/run-history-repair-resumable-3932301.sh
          grep -Fq 'Checkpoint immutable history repair through segment' .local/run-history-repair-resumable-3932301.sh
          grep -Fq 'reusing verified segment' .local/run-history-repair-resumable-3932301.sh
          grep -Fq 'SpillBucketStore' scripts/build-history-exact-index.ts
          grep -Fq 'productionMutation: false' scripts/run-history-repair-3932301.sh
