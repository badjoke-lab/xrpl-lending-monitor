name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-history-workflow-fix:
    if: github.event_name == 'pull_request' && github.head_ref == 'ops/one-shot-history-dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Build corrected workflow file
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_PATH: .github/workflows/rolling-checkpoint-candidate.yml
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/history-workflow-fix/.github/workflows"
          gh api "repos/$GITHUB_REPOSITORY/contents/$TARGET_PATH?ref=main" > "$RUNNER_TEMP/file-meta.json"
          jq -r .content "$RUNNER_TEMP/file-meta.json" | tr -d '\n' | base64 --decode \
            > "$RUNNER_TEMP/history-workflow-fix/$TARGET_PATH"
          python - <<'PY'
          from pathlib import Path

          path = Path('/home/runner/work/_temp/history-workflow-fix/.github/workflows/rolling-checkpoint-candidate.yml')
          text = path.read_text()
          token = '$' + '{{ runner.temp }}/history-reconstruction'
          old = f'HISTORY_OUTPUT: {token}'
          new = 'HISTORY_OUTPUT: /tmp/history-reconstruction'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one invalid job-level runner context, found {count}')
          path.write_text(text.replace(old, new))
          PY
          grep -F 'HISTORY_OUTPUT: /tmp/history-reconstruction' \
            "$RUNNER_TEMP/history-workflow-fix/$TARGET_PATH"

      - name: Upload corrected workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: history-workflow-parse-fix
          path: ${{ runner.temp }}/history-workflow-fix
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
