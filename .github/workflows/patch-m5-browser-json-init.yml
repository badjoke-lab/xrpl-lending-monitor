name: Patch M5 browser JSON init

on:
  pull_request:
    paths:
      - .github/workflows/patch-m5-browser-json-init.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Remove unused initial JSON assignment
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/run-m5-5-browser-regression.mjs')
          text = path.read_text()
          old = '    let json = null\n    try {'
          new = '    let json\n    try {'
          if old not in text:
            raise SystemExit('JSON initialization anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/run-m5-5-browser-regression.mjs
          git commit -m 'Remove unused JSON initialization'
          git push origin HEAD:${{ github.head_ref }}
