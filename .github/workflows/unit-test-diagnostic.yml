name: Unit test diagnostic

on:
  push:
    branches:
      - feature-single-d1-binding
    paths:
      - .github/workflows/unit-test-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm exec vitest run --reporter=json --outputFile=unit-test-result.json
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-result
          path: unit-test-result.json
          if-no-files-found: error
          retention-days: 3
