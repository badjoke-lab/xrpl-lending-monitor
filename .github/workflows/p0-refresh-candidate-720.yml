name: P0 refresh rolling candidate to 720

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: p0-refresh-rolling-candidate-720
  cancel-in-progress: false

jobs:
  refresh:
    if: startsWith(github.event.issue.title, 'P0 refresh rolling candidate to 720')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      MAX_DELTA_LEDGERS: '5000'
      TARGET_MAX_LAG_LEDGERS: '720'
      SEGMENT_LEDGERS: '500'
      READ_WINDOW_SIZE: '4'
      MAX_CYCLES: '16'
      CANDIDATE_HISTORY_A: history-rolling-maintenance-candidate-data
      CANDIDATE_CURRENT_A: current-state-rolling-maintenance-candidate-data
      CANDIDATE_HISTORY_B: history-rolling-recovery-b-data
      CANDIDATE_CURRENT_B: current-state-rolling-recovery-b-data
    steps:
      - uses: actions/checkout@v4

      - name: Refresh bounded A/B candidate pair
        shell: bash
        run: |
          set -euo pipefail
          ROOT=p0-refresh-candidate-720
          mkdir -p "$ROOT"
          : > "$ROOT/cycles.ndjson"

          fetch_json() {
            local branch="$1" path="$2" output="$3"
            for attempt in $(seq 1 30); do
              if gh api "repos/${REPOSITORY}/contents/${path}?ref=${branch}" --jq '.content' 2>/dev/null | tr -d '\n' | base64 --decode > "$output"; then
                test -s "$output" && return 0
              fi
              sleep 10
            done
            return 1
          }

          pair() {
            local h="$1" c="$2" p="$3"
            fetch_json "$h" history/publication.json "$ROOT/${p}-publication.json" || return 1
            fetch_json "$c" read-model/manifest.json "$ROOT/${p}-manifest.json" || return 1
            local hl hh cl ch he ce
            hl=$(jq -r '.endLedgerIndex // empty' "$ROOT/${p}-publication.json")
            hh=$(jq -r '.endLedgerHash // empty' "$ROOT/${p}-publication.json")
            cl=$(jq -r '.ledgerIndex // empty' "$ROOT/${p}-manifest.json")
            ch=$(jq -r '.ledgerHash // empty' "$ROOT/${p}-manifest.json")
            he=$(jq -r '.epochId // empty' "$ROOT/${p}-publication.json")
            ce=$(jq -r '.epochId // empty' "$ROOT/${p}-manifest.json")
            test "$(jq -r '.complete' "$ROOT/${p}-publication.json")" = true
            test "$(jq -r '.complete' "$ROOT/${p}-manifest.json")" = true
            test "$hl" = "$cl"; test "$hh" = "$ch"
            test "$he" = devnet-3371675; test "$ce" = devnet-3371675
            printf '%s\t%s\t%s\t%s\n' "$hl" "$hh" "$h" "$c"
          }

          live_head() {
            curl --fail-with-body --silent --show-error --retry 3 -H 'content-type: application/json' \
              --data '{"method":"ledger","params":[{"ledger_index":"validated","transactions":false,"expand":false}]}' \
              https://devnet.honeycluster.io/ | jq -r '.result.ledger_index // .result.ledger.ledger_index'
          }

          A=$(pair "$CANDIDATE_HISTORY_A" "$CANDIDATE_CURRENT_A" A 2>/dev/null || true)
          B=$(pair "$CANDIDATE_HISTORY_B" "$CANDIDATE_CURRENT_B" B 2>/dev/null || true)
          test -n "$A" || test -n "$B"
          if test -n "$A" && { test -z "$B" || test "$(printf '%s' "$A" | cut -f1)" -ge "$(printf '%s' "$B" | cut -f1)"; }; then BEST="$A"; else BEST="$B"; fi

          SOURCE_LEDGER=$(printf '%s' "$BEST" | cut -f1)
          SOURCE_HASH=$(printf '%s' "$BEST" | cut -f2)
          SOURCE_HISTORY=$(printf '%s' "$BEST" | cut -f3)
          SOURCE_CURRENT=$(printf '%s' "$BEST" | cut -f4)

          for CYCLE in $(seq 1 "$MAX_CYCLES"); do
            LIVE_BEFORE=$(live_head)
            LAG_BEFORE=$((LIVE_BEFORE - SOURCE_LEDGER)); test "$LAG_BEFORE" -ge 0 || LAG_BEFORE=0
            if test "$LAG_BEFORE" -le "$TARGET_MAX_LAG_LEDGERS"; then break; fi

            if test "$SOURCE_HISTORY" = "$CANDIDATE_HISTORY_A"; then
              OUTPUT_HISTORY="$CANDIDATE_HISTORY_B"; OUTPUT_CURRENT="$CANDIDATE_CURRENT_B"
            else
              OUTPUT_HISTORY="$CANDIDATE_HISTORY_A"; OUTPUT_CURRENT="$CANDIDATE_CURRENT_A"
            fi

            BEFORE="$ROOT/run-ids-before-$CYCLE.txt"
            gh api "repos/${REPOSITORY}/actions/workflows/rolling-checkpoint-candidate.yml/runs?event=workflow_dispatch&per_page=100" --jq '.workflow_runs[].id' > "$BEFORE"
            jq -n --arg ref main --arg sh "$SOURCE_HISTORY" --arg sc "$SOURCE_CURRENT" --arg oh "$OUTPUT_HISTORY" --arg oc "$OUTPUT_CURRENT" --arg md "$MAX_DELTA_LEDGERS" --arg sg "$SEGMENT_LEDGERS" --arg rw "$READ_WINDOW_SIZE" \
              '{ref:$ref,inputs:{source_history_branch:$sh,source_current_state_branch:$sc,history_candidate_branch:$oh,current_state_candidate_branch:$oc,max_delta_ledgers:$md,segment_ledgers:$sg,read_window_size:$rw}}' > "$ROOT/dispatch-$CYCLE.json"
            gh api --method POST "repos/${REPOSITORY}/actions/workflows/rolling-checkpoint-candidate.yml/dispatches" --input "$ROOT/dispatch-$CYCLE.json"

            RUN_ID=''
            for attempt in $(seq 1 60); do
              gh api "repos/${REPOSITORY}/actions/workflows/rolling-checkpoint-candidate.yml/runs?event=workflow_dispatch&per_page=100" > "$ROOT/runs-$CYCLE.json"
              RUN_ID=$(jq -r '.workflow_runs | sort_by(.created_at) | reverse | .[].id' "$ROOT/runs-$CYCLE.json" | while read id; do grep -Fxq "$id" "$BEFORE" || { echo "$id"; break; }; done)
              test -n "$RUN_ID" && break
              sleep 10
            done
            test -n "$RUN_ID"

            for attempt in $(seq 1 720); do
              gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}" > "$ROOT/run-$CYCLE.json"
              test "$(jq -r '.status' "$ROOT/run-$CYCLE.json")" = completed && break
              sleep 30
            done
            test "$(jq -r '.conclusion' "$ROOT/run-$CYCLE.json")" = success
            gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" > "$ROOT/jobs-$CYCLE.json"
            for STEP in 'Bind source pair and freeze bounded target' 'Generate bounded delta with configured read window' 'Verify delta and build target publication' 'Build target exact index incrementally' 'Build target current state from best available base' 'Publish history candidate branch' 'Publish current-state candidate branch' 'Rehearse remote candidate pair' 'Build retained candidate evidence'; do
              jq -e --arg s "$STEP" '[.jobs[].steps[] | select(.name == $s)] | length == 1 and .[0].conclusion == "success"' "$ROOT/jobs-$CYCLE.json" >/dev/null
            done

            OUT=$(pair "$OUTPUT_HISTORY" "$OUTPUT_CURRENT" "out-$CYCLE")
            OUTPUT_LEDGER=$(printf '%s' "$OUT" | cut -f1)
            OUTPUT_HASH=$(printf '%s' "$OUT" | cut -f2)
            test "$OUTPUT_LEDGER" -gt "$SOURCE_LEDGER"
            test "$OUTPUT_LEDGER" -le $((SOURCE_LEDGER + MAX_DELTA_LEDGERS))
            REMOTE_HASH=$(curl --fail-with-body --silent --show-error --retry 3 -H 'content-type: application/json' --data "{\"method\":\"ledger\",\"params\":[{\"ledger_index\":${OUTPUT_LEDGER},\"transactions\":false,\"expand\":false}]}" https://devnet.honeycluster.io/ | jq -r '.result.ledger_hash // .result.ledger.ledger_hash')
            test "$OUTPUT_HASH" = "$REMOTE_HASH"
            LIVE_AFTER=$(live_head)
            LAG_AFTER=$((LIVE_AFTER - OUTPUT_LEDGER)); test "$LAG_AFTER" -ge 0 || LAG_AFTER=0
            jq -n --argjson cycle "$CYCLE" --argjson runId "$RUN_ID" --arg sh "$SOURCE_HISTORY" --arg sc "$SOURCE_CURRENT" --argjson sl "$SOURCE_LEDGER" --arg oh "$OUTPUT_HISTORY" --arg oc "$OUTPUT_CURRENT" --argjson ol "$OUTPUT_LEDGER" --arg hash "$OUTPUT_HASH" --argjson live "$LIVE_AFTER" --argjson lag "$LAG_AFTER" '{cycle:$cycle,childRunId:$runId,source:{historyBranch:$sh,currentStateBranch:$sc,ledgerIndex:$sl},output:{historyBranch:$oh,currentStateBranch:$oc,ledgerIndex:$ol,ledgerHash:$hash},live:{ledgerIndex:$live,lagLedgers:$lag}}' >> "$ROOT/cycles.ndjson"
            SOURCE_HISTORY="$OUTPUT_HISTORY"; SOURCE_CURRENT="$OUTPUT_CURRENT"; SOURCE_LEDGER="$OUTPUT_LEDGER"; SOURCE_HASH="$OUTPUT_HASH"
            test "$LAG_AFTER" -le "$TARGET_MAX_LAG_LEDGERS" && break
          done

          FINAL_LIVE=$(live_head)
          FINAL_LAG=$((FINAL_LIVE - SOURCE_LEDGER)); test "$FINAL_LAG" -ge 0 || FINAL_LAG=0
          test "$FINAL_LAG" -le "$TARGET_MAX_LAG_LEDGERS"
          jq -n --arg historyBranch "$SOURCE_HISTORY" --arg currentStateBranch "$SOURCE_CURRENT" --argjson ledgerIndex "$SOURCE_LEDGER" --arg ledgerHash "$SOURCE_HASH" --argjson liveLedger "$FINAL_LIVE" --argjson lagLedgers "$FINAL_LAG" '{candidate:{historyBranch:$historyBranch,currentStateBranch:$currentStateBranch,ledgerIndex:$ledgerIndex,ledgerHash:$ledgerHash},live:{ledgerIndex:$liveLedger,lagLedgers:$lagLedgers},verified:true,targetMaxLagLedgers:720,maxDeltaLedgers:5000}' > "$ROOT/final.json"
          BODY=$(jq -r '"Verified candidate pair: `" + .candidate.historyBranch + "` / `" + .candidate.currentStateBranch + "`; ledger `" + (.candidate.ledgerIndex|tostring) + "`; hash `" + .candidate.ledgerHash + "`; live Devnet head `" + (.live.ledgerIndex|tostring) + "`; remaining lag `" + (.live.lagLedgers|tostring) + "` ledgers. Each cycle was bounded to 5,000 ledgers and the 720-ledger target was enforced."' "$ROOT/final.json")
          gh issue comment "$ISSUE_NUMBER" --body "$BODY"

          gh api "repos/${REPOSITORY}/actions/workflows/rolling-checkpoint-live-cutover.yml/runs?event=workflow_dispatch&per_page=100" --jq '.workflow_runs[].id' > "$ROOT/cutover-before.txt"
          jq -n --arg ref main --arg history "$SOURCE_HISTORY" --arg current "$SOURCE_CURRENT" '{ref:$ref,inputs:{history_candidate_branch:$history,current_state_candidate_branch:$current,confirm_production_write:"true"}}' > "$ROOT/cutover-dispatch.json"
          gh api --method POST "repos/${REPOSITORY}/actions/workflows/rolling-checkpoint-live-cutover.yml/dispatches" --input "$ROOT/cutover-dispatch.json"

          CUTOVER_RUN_ID=''
          for attempt in $(seq 1 60); do
            gh api "repos/${REPOSITORY}/actions/workflows/rolling-checkpoint-live-cutover.yml/runs?event=workflow_dispatch&per_page=100" > "$ROOT/cutover-runs.json"
            CUTOVER_RUN_ID=$(jq -r '.workflow_runs | sort_by(.created_at) | reverse | .[].id' "$ROOT/cutover-runs.json" | while read id; do grep -Fxq "$id" "$ROOT/cutover-before.txt" || { echo "$id"; break; }; done)
            test -n "$CUTOVER_RUN_ID" && break
            sleep 5
          done
          test -n "$CUTOVER_RUN_ID"
          printf '%s\n' "$CUTOVER_RUN_ID" > "$ROOT/cutover-run-id.txt"

          for attempt in $(seq 1 180); do
            gh api "repos/${REPOSITORY}/actions/runs/${CUTOVER_RUN_ID}" > "$ROOT/cutover-run.json"
            test "$(jq -r '.status' "$ROOT/cutover-run.json")" = completed && break
            sleep 30
          done
          test "$(jq -r '.status' "$ROOT/cutover-run.json")" = completed
          gh api "repos/${REPOSITORY}/actions/runs/${CUTOVER_RUN_ID}/jobs?per_page=100" > "$ROOT/cutover-jobs.json"
          test "$(jq -r '.conclusion' "$ROOT/cutover-run.json")" = success
          gh issue comment "$ISSUE_NUMBER" --body "Guarded production cutover succeeded. Live cutover run: ${CUTOVER_RUN_ID}."

      - name: Preserve recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-refresh-candidate-720-${{ github.run_id }}
          path: p0-refresh-candidate-720
          if-no-files-found: warn
          retention-days: 30
