name: Inventory production writers
# Include historical runs for every direct production deploy workflow.

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/inventory-production-writers.yml'

permissions:
  actions: read
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Find every Worker deployment path
        shell: bash
        run: |
          set -euo pipefail
          ROOT=production-writer-inventory
          mkdir -p "$ROOT"
          grep -RInE 'wrangler[[:space:]]+deploy|workers/scripts|version_upload|production-deploy-trigger|replacement-base-cutover' .github scripts package.json pnpm-lock.yaml \
            > "$ROOT/matches.txt" || true
          find .github/workflows -maxdepth 1 \( -name '*.yml' -o -name '*.yaml' \) -type f | sort > "$ROOT/workflow-files.txt"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" > "$ROOT/recent-runs.json"
          jq '[.workflow_runs[] | {id,name,path,event,status,conclusion,created_at,updated_at,head_branch,head_sha,run_started_at,run_attempt}]' "$ROOT/recent-runs.json" > "$ROOT/recent-runs-compact.json"
          for workflow in \
            deploy-fast-lane-base-binding-diff.yml \
            rolling-checkpoint-production-promotion.yml \
            manual-devnet-deploy.yml \
            rolling-checkpoint-live-cutover.yml \
            deploy-production-worker.yml \
            stabilize-production-runtime.yml \
            quiesce-and-restore-production.yml; do
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?per_page=100" > "$ROOT/runs-$workflow.json" || printf '{"workflow_runs":[]}\n' > "$ROOT/runs-$workflow.json"
          done
          cat "$ROOT/matches.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: production-writer-inventory
          path: production-writer-inventory
          if-no-files-found: error
          retention-days: 14
