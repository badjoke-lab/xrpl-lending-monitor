name: Materialize staged sources

on:
  push:
    branches:
      - github-release-current-state
    paths:
      - .staging/READY

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: github-release-current-state
          fetch-depth: 0

      - name: Reconstruct source files
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          for manifest_path in sorted(Path('.staging/manifests').glob('*.txt')):
              for line in manifest_path.read_text().splitlines():
                  if not line.strip():
                      continue
                  target, *fragments = line.split('\t')
                  destination = Path(target)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  with destination.open('wb') as output:
                      for fragment in fragments:
                          output.write(Path('.staging', fragment).read_bytes())
          PY

      - name: Commit reconstructed sources
        shell: bash
        run: |
          set -euo pipefail
          git rm -r .staging
          git rm .github/workflows/materialize-takeover.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add release-native current-state pipeline"
          git push origin HEAD:github-release-current-state
