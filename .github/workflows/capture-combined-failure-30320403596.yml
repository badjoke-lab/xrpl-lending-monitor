name: Capture combined candidate failure 30327015100

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/workflows/capture-combined-failure-30320403596.yml

permissions:
  actions: read
  contents: read

jobs:
  capture:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download exact failed job log
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          JOB_ID: '90174410436'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/jobs/$JOB_ID/logs" \
            -o evidence/job.log
          tail -n 600 evidence/job.log > evidence/job-tail.log
          grep -nE 'exact-index|heartbeat|segment|bucket|##\[error\]|fatal|FATAL|ENOMEM|ENOSPC|heap out of memory|Killed|No space left|Command terminated|Process completed with exit code|exit code 143|SIGTERM|runner' \
            evidence/job.log > evidence/progress-and-error-lines.log || true
          wc -c evidence/job.log evidence/job-tail.log evidence/progress-and-error-lines.log > evidence/sizes.txt
          cat evidence/progress-and-error-lines.log
          tail -n 180 evidence/job-tail.log

      - name: Upload exact failed job evidence
        uses: actions/upload-artifact@v4
        with:
          name: combined-candidate-failure-30327015100
          path: evidence
          if-no-files-found: error
          retention-days: 30
