name: Rolling checkpoint live cutover

on:
  workflow_dispatch:
    inputs:
      history_candidate_branch:
        description: Aligned immutable-history candidate branch
        required: true
        type: string
      current_state_candidate_branch:
        description: Aligned current-state candidate branch
        required: true
        type: string
      confirm_production_write:
        description: Explicitly authorize Devnet production branch, D1, Worker, and cron writes
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: production-worker-write
  cancel-in-progress: false

env:
  HISTORY_CANDIDATE_BRANCH: ${{ inputs.history_candidate_branch }}
  CURRENT_STATE_CANDIDATE_BRANCH: ${{ inputs.current_state_candidate_branch }}
  CONFIRM_PRODUCTION_WRITE: ${{ inputs.confirm_production_write }}
  PRODUCTION_HISTORY_BRANCH: history-data
  PRODUCTION_CURRENT_STATE_BRANCH: current-state-data
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  D1_DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
  PRODUCTION_BASE: https://xrpl-lending-monitor.badjoke-lab.workers.dev

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out implementation
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check out history candidate metadata
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.history_candidate_branch }}
          path: .local/history-candidate
          sparse-checkout: |
            history-channel.json
            history/publication.json
            history/index/exact/manifest.json
          sparse-checkout-cone-mode: false

      - name: Check out current-state candidate metadata
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.current_state_candidate_branch }}
          path: .local/current-candidate
          sparse-checkout: |
            channel.json
            rolling-read-model-summary.json
            read-model/manifest.json
          sparse-checkout-cone-mode: false

      - name: Check out production current-state rollback identity
        uses: actions/checkout@v4
        with:
          ref: current-state-data
          path: .local/production-current-before
          sparse-checkout: read-model/manifest.json
          sparse-checkout-cone-mode: false

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:candidate-source-rehearsal

      - name: Build deployable application assets
        run: pnpm build:deploy-assets

      - name: Align one-time cutover bounds and deployment readiness
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          source = json.loads(Path('wrangler.jsonc').read_text())
          previous = json.loads(Path('.local/production-current-before/read-model/manifest.json').read_text())
          assert source['triggers']['crons'] == ['*/5 * * * *']
          assert source['vars']['APP_NETWORK'] == 'devnet'
          assert source['vars']['MAINNET_ENABLED'] == 'false'
          assert previous['complete'] is True
          assert previous['epochId'] == 'devnet-3371675'
          assert isinstance(previous['snapshotId'], str) and previous['snapshotId']
          assert isinstance(previous['ledgerIndex'], int) and previous['ledgerIndex'] > 0
          assert isinstance(previous['ledgerHash'], str) and len(previous['ledgerHash']) == 64

          rollback = json.loads(json.dumps(source))
          variables = rollback['vars']
          variables['CURRENT_STATE_REPLACEMENT_GITHUB_BRANCH'] = 'current-state-data'
          variables['CURRENT_STATE_REPLACEMENT_SNAPSHOT_ID'] = previous['snapshotId']
          variables['REPLACEMENT_BASE_REBASE_ENABLED'] = 'true'
          variables['REPLACEMENT_BASE_EPOCH_ID'] = previous['epochId']
          variables['REPLACEMENT_BASE_SNAPSHOT_ID'] = previous['snapshotId']
          variables['REPLACEMENT_BASE_LEDGER_INDEX'] = str(previous['ledgerIndex'])
          variables['REPLACEMENT_BASE_LEDGER_HASH'] = previous['ledgerHash']
          variables.pop('REPLACEMENT_BASE_CUTOVER_TOKEN', None)
          Path('wrangler.rollback.jsonc').write_text(json.dumps(rollback, indent=2) + '\n')
          PY

          jq -e '
            .triggers.crons == ["*/5 * * * *"]
            and .vars.APP_NETWORK == "devnet"
            and .vars.MAINNET_ENABLED == "false"
            and .vars.CURRENT_STATE_REPLACEMENT_GITHUB_BRANCH == "current-state-data"
            and (.vars.REPLACEMENT_BASE_LEDGER_INDEX | tonumber) > 0
            and (.vars | has("REPLACEMENT_BASE_CUTOVER_TOKEN") | not)
          ' wrangler.rollback.jsonc > /dev/null

          grep -F 'pnpm exec wrangler deploy --config wrangler.jsonc' scripts/run-live-checkpoint-cutover.sh
          sed -i 's#pnpm exec wrangler deploy --config wrangler.jsonc#pnpm exec wrangler deploy --config wrangler.rollback.jsonc#' scripts/run-live-checkpoint-cutover.sh
          grep -F 'test "${TARGET_LAG_AT_GATE}" -le 300' scripts/run-live-checkpoint-cutover.sh
          sed -i 's/test "${TARGET_LAG_AT_GATE}" -le 300/test "${TARGET_LAG_AT_GATE}" -le 720/' scripts/run-live-checkpoint-cutover.sh
          grep -F 'for attempt in $(seq 1 90); do' scripts/verify-live-checkpoint-cutover.sh
          sed -i 's/for attempt in $(seq 1 90); do/for attempt in $(seq 1 150); do/' scripts/verify-live-checkpoint-cutover.sh
          sed -i 's/within 15 minutes/within 25 minutes/' scripts/verify-live-checkpoint-cutover.sh

          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/run-live-checkpoint-cutover.sh')
          text = path.read_text()
          old = '''pnpm exec wrangler deploy --config wrangler.live-cutover.jsonc
          touch "${ROOT}/cutover-config-deployed"

          for attempt in 1 2 3; do
            http_status="$(curl --silent --show-error --retry 2 \
              -o "${ROOT}/cutover-response-${attempt}.json" -w '%{http_code}' \
              -X POST \
              -H "x-replacement-base-cutover-token: ${CUTOVER_TOKEN}" \
              "${PRODUCTION_BASE}/api/operator/replacement-base-cutover")"
            if [ "${http_status}" = 200 ] && jq -e --arg snapshot "${TARGET_SNAPSHOT_ID}" --argjson ledger "${TARGET_LEDGER_INDEX}" '
              .status == "cutover_applied"
              and .target.snapshotId == $snapshot
              and .target.ledgerIndex == $ledger
            ' "${ROOT}/cutover-response-${attempt}.json" > /dev/null 2>&1; then
              touch "${ROOT}/cutover-applied"
              break
            fi
            sleep 5
          done
          '''
          new = '''pnpm exec wrangler deploy --config wrangler.live-cutover.jsonc
          touch "${ROOT}/cutover-config-deployed"

          cutover_binding_ready=false
          for attempt in $(seq 1 30); do
            readiness_status="$(curl --silent --show-error --retry 2 \
              -o "${ROOT}/cutover-readiness-${attempt}.json" -w '%{http_code}' \
              -X POST \
              "${PRODUCTION_BASE}/api/operator/replacement-base-cutover")"
            printf '%s\n' "${readiness_status}" > "${ROOT}/cutover-readiness-${attempt}.status"
            if [ "${readiness_status}" = 403 ]; then
              cutover_binding_ready=true
              touch "${ROOT}/cutover-binding-ready"
              break
            fi
            sleep 3
          done
          test "${cutover_binding_ready}" = true

          for attempt in $(seq 1 12); do
            http_status="$(curl --silent --show-error --retry 2 \
              -o "${ROOT}/cutover-response-${attempt}.json" -w '%{http_code}' \
              -X POST \
              -H "x-replacement-base-cutover-token: ${CUTOVER_TOKEN}" \
              "${PRODUCTION_BASE}/api/operator/replacement-base-cutover")"
            printf '%s\n' "${http_status}" > "${ROOT}/cutover-response-${attempt}.status"
            if [ "${http_status}" = 200 ] && jq -e --arg snapshot "${TARGET_SNAPSHOT_ID}" --argjson ledger "${TARGET_LEDGER_INDEX}" '
              .status == "cutover_applied"
              and .target.snapshotId == $snapshot
              and .target.ledgerIndex == $ledger
            ' "${ROOT}/cutover-response-${attempt}.json" > /dev/null 2>&1; then
              touch "${ROOT}/cutover-applied"
              break
            fi
            sleep 5
          done
          '''
          if old not in text:
              raise SystemExit('cutover invocation block not found')
          path.write_text(text.replace(old, new, 1))
          PY

          bash -n scripts/run-live-checkpoint-cutover.sh
          bash -n scripts/verify-live-checkpoint-cutover.sh
          test -f dist/index.html

      - name: Run guarded five-minute Devnet cutover
        shell: bash
        run: bash scripts/run-live-checkpoint-cutover.sh

      - name: Verify post-cutover live freshness
        shell: bash
        run: bash scripts/verify-live-checkpoint-cutover.sh

      - name: Upload retained live-cutover evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: rolling-checkpoint-live-cutover
          path: live-cutover-evidence
          if-no-files-found: warn
          retention-days: 30
