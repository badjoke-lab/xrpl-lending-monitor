name: Current-state checkpoint live cutover

on:
  workflow_dispatch:
    inputs:
      current_state_candidate_branch:
        description: Verified D1 overlay-folded current-state candidate branch
        required: true
        type: string
      confirm_production_write:
        description: Explicitly authorize Devnet current-state branch, D1, Worker, and cron writes
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: production-worker-write
  cancel-in-progress: false

env:
  CURRENT_STATE_CANDIDATE_BRANCH: ${{ inputs.current_state_candidate_branch }}
  CONFIRM_PRODUCTION_WRITE: ${{ inputs.confirm_production_write }}
  PRODUCTION_CURRENT_STATE_BRANCH: current-state-data
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  D1_DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
  PRODUCTION_BASE: https://xrpl-lending-monitor.badjoke-lab.workers.dev

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out implementation
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check out current-state candidate metadata
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.current_state_candidate_branch }}
          path: .local/current-candidate
          sparse-checkout: |
            channel.json
            rolling-read-model-summary.json
            read-model/manifest.json
          sparse-checkout-cone-mode: false

      - name: Check out production current-state identity
        uses: actions/checkout@v4
        with:
          ref: current-state-data
          path: .local/production-current-before
          sparse-checkout: read-model/manifest.json
          sparse-checkout-cone-mode: false

      - name: Check out production immutable-history identity
        uses: actions/checkout@v4
        with:
          ref: history-data
          path: .local/production-history
          sparse-checkout: |
            history-channel.json
            history/publication.json
            history/index/exact/manifest.json
          sparse-checkout-cone-mode: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:deploy-assets

      - name: Validate aligned history and current-state cutover boundary
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/run-current-state-checkpoint-cutover.sh
          node --check scripts/verify-history-current-state-alignment.mjs
          node scripts/verify-history-current-state-alignment.mjs \
            --history-publication .local/production-history/history/publication.json \
            --history-channel .local/production-history/history-channel.json \
            --exact-index-manifest .local/production-history/history/index/exact/manifest.json \
            --current-manifest .local/current-candidate/read-model/manifest.json \
            > history-current-state-alignment.json
          jq -e '.passed == true' history-current-state-alignment.json >/dev/null
          grep -Fq "jq -e '.rows_read >= 0 and .rows_written >= 0'" scripts/run-current-state-checkpoint-cutover.sh
          grep -Fq 'and .counts_watermark.ledger_index >= $base' scripts/run-current-state-checkpoint-cutover.sh
          grep -Fq 'sync_main_config()' scripts/run-current-state-checkpoint-cutover.sh
          grep -Fq 'git reset --hard origin/main' scripts/run-current-state-checkpoint-cutover.sh
          test -f dist/index.html
          jq -e '.triggers.crons == ["*/5 * * * *"] and .vars.APP_NETWORK == "devnet" and .vars.MAINNET_ENABLED == "false"' wrangler.jsonc >/dev/null

      - name: Run guarded current-state checkpoint cutover
        shell: bash
        run: bash scripts/run-current-state-checkpoint-cutover.sh

      - name: Upload current-state cutover evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: current-state-checkpoint-live-cutover
          path: |
            current-state-cutover-evidence
            history-current-state-alignment.json
          if-no-files-found: warn
          retention-days: 30
