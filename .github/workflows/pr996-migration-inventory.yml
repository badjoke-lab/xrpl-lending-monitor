name: PR 996 migration inventory

on:
  push:
    branches:
      - agent/qualifier-995-diagnose
    paths:
      - .github/workflows/pr996-migration-inventory.yml

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retain migration inventory
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          find migrations -maxdepth 1 -type f -printf '%f\n' | sort > migrations.txt
          api="repos/${GITHUB_REPOSITORY}/contents/.github/pr996-migrations.txt"
          content="$(base64 -w0 migrations.txt)"
          gh api --method PUT "$api" -f message='Retain PR 996 migration inventory' -f content="$content" -f branch="$GITHUB_REF_NAME" >/dev/null
