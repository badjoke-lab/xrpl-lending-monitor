name: Post-recovery catch-up slope

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/post-recovery-slope.yml]

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Sample collector
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p post-recovery-slope
          curl --fail-with-body --silent --show-error --retry 3 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            > post-recovery-slope/subdomain.json
          SUBDOMAIN="$(jq -r '.result.subdomain // empty' post-recovery-slope/subdomain.json)"
          BASE="https://xrpl-lending-monitor.${SUBDOMAIN}.workers.dev"
          printf '%s\n' "$BASE" > post-recovery-slope/base-url.txt

          for I in 0 1 2 3 4 5; do
            curl --fail-with-body --silent --show-error --retry 3 \
              "$BASE/api/status/collector" \
              > "post-recovery-slope/collector-${I}.json"
            if [ "$I" -lt 5 ]; then sleep 60; fi
          done

          curl --fail-with-body --silent --show-error --retry 3 \
            "$BASE/api/status/continuation-diagnostics" \
            > post-recovery-slope/continuation-diagnostics.json
          curl --fail-with-body --silent --show-error --retry 3 \
            "$BASE/api/status/m1-exit-diagnostics" \
            > post-recovery-slope/m1-exit-diagnostics.json

      - name: Build summary
        shell: bash
        run: |
          set -euo pipefail
          jq -s '[.[] | {cursor:.cursor.last_processed_ledger,head:.cursor.latest_observed_ledger,lag:.cursor.lag_ledgers,ledgers_processed:.usage.ledgers_processed,lending_transactions:.usage.lending_transactions,rows:.usage.estimated_rows,statements:.usage.estimated_statements,consecutive_failures,error}]' post-recovery-slope/collector-*.json > post-recovery-slope/series.json
          jq '{first:.[0],last:.[-1],cursor_delta:(.[-1].cursor-.[0].cursor),head_delta:(.[-1].head-.[0].head),lag_delta:(.[-1].lag-.[0].lag),samples:length,zero_failure_samples:([.[]|select(.consecutive_failures==0 and .error==null)]|length),processed_ledgers_per_sample:[.[]|.ledgers_processed],rows_per_sample:[.[]|.rows],statements_per_sample:[.[]|.statements],lending_transactions_per_sample:[.[]|.lending_transactions]}' post-recovery-slope/series.json > post-recovery-slope/summary.json
          jq -e '.zero_failure_samples == .samples and .cursor_delta > 0' post-recovery-slope/summary.json > /dev/null

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-recovery-slope
          path: post-recovery-slope
          if-no-files-found: error
          retention-days: 7
