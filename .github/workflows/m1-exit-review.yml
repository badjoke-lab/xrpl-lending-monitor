name: M1 exit review

on:
  schedule:
    - cron: '10 0 8 7 *'
  workflow_dispatch:
    inputs:
      require_ready:
        description: Fail unless every M1 exit gate and HYB-7 path is observed
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: m1-exit-review
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve manual mode or one-shot scheduled window
        id: execution
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUIRE_READY_INPUT: ${{ inputs.require_ready }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            echo 'active=true' >> "${GITHUB_OUTPUT}"
            if [ "${REQUIRE_READY_INPUT}" = "true" ]; then
              echo 'enforce_ready=true' >> "${GITHUB_OUTPUT}"
            else
              echo 'enforce_ready=false' >> "${GITHUB_OUTPUT}"
            fi
            exit 0
          fi

          if [ "$(date -u +%F)" = "2026-07-08" ]; then
            echo 'active=true' >> "${GITHUB_OUTPUT}"
            echo 'enforce_ready=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'active=false' >> "${GITHUB_OUTPUT}"
            echo 'enforce_ready=false' >> "${GITHUB_OUTPUT}"
          fi

      - uses: actions/checkout@v4
        if: steps.execution.outputs.active == 'true'

      - name: Resolve deployed Worker URL
        if: steps.execution.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p m1-exit-review
          curl --fail-with-body --silent --show-error --retry 3 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            > m1-exit-review/subdomain.json
          SUBDOMAIN="$(jq -r '.result.subdomain // empty' m1-exit-review/subdomain.json)"
          test -n "${SUBDOMAIN}"
          printf '%s\n' "https://xrpl-lending-monitor.${SUBDOMAIN}.workers.dev" \
            > m1-exit-review/base-url.txt

      - name: Capture runtime and exit evidence
        if: steps.execution.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(cat m1-exit-review/base-url.txt)"

          curl --fail-with-body --silent --show-error --retry 3 \
            "${BASE}/api/status/collector" \
            > m1-exit-review/collector.json
          curl --fail-with-body --silent --show-error --retry 3 \
            "${BASE}/api/status/continuation-diagnostics" \
            > m1-exit-review/continuation-diagnostics.json
          curl --fail-with-body --silent --show-error --retry 3 \
            "${BASE}/api/status/m1-exit-diagnostics" \
            > m1-exit-review/m1-exit-diagnostics.json
          curl --fail-with-body --silent --show-error --retry 3 \
            "${BASE}/api/status/replacement-base-rebase" \
            > m1-exit-review/replacement-base-rebase.json
          curl --fail-with-body --silent --show-error --retry 3 \
            "${BASE}/api/status/history-source" \
            > m1-exit-review/history-source.json
          curl --fail-with-body --silent --show-error --retry 3 \
            "${BASE}/api/overview" \
            > m1-exit-review/overview.json

          jq -e '.cursor and .usage and (.consecutive_failures != null)' \
            m1-exit-review/collector.json > /dev/null
          jq -e '.evidence and .report and .report.paths and (.report.passed != null)' \
            m1-exit-review/continuation-diagnostics.json > /dev/null
          jq -e '.evidence and .report and .report.gates and (.report.ready != null)' \
            m1-exit-review/m1-exit-diagnostics.json > /dev/null
          jq -e '.status == "replayed" and .target.snapshotId == "devnet-3432924-canonical" and .target.ledgerIndex == 3432924' \
            m1-exit-review/replacement-base-rebase.json > /dev/null
          jq -e '.status == "ok" and .mode == "hybrid" and .configured == true and .chain.end_ledger_index == 3432924 and .exact_index.total_records > 0' \
            m1-exit-review/history-source.json > /dev/null
          grep -q 'devnet-3432924-canonical' m1-exit-review/overview.json

      - name: Capture current-state list and exact-read evidence
        if: steps.execution.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(cat m1-exit-review/base-url.txt)"

          curl --fail-with-body --silent --show-error --retry 3 \
            "${BASE}/api/vaults?limit=25&sort=id_asc" \
            > m1-exit-review/vault-list.json
          curl --fail-with-body --silent --show-error --retry 3 \
            "${BASE}/api/loan-brokers?limit=25&sort=id_asc" \
            > m1-exit-review/loan-broker-list.json
          curl --fail-with-body --silent --show-error --retry 3 \
            "${BASE}/api/loans?limit=25&sort=id_asc" \
            > m1-exit-review/loan-list.json

          jq -e '.availability.state == "available" and (.data | length) > 0 and .snapshot.id == "devnet-3432924-canonical"' \
            m1-exit-review/vault-list.json > /dev/null
          jq -e '.availability.state == "available" and (.data | length) > 0 and .snapshot.id == "devnet-3432924-canonical"' \
            m1-exit-review/loan-broker-list.json > /dev/null
          jq -e '.availability.state == "available" and (.data | length) > 0 and .snapshot.id == "devnet-3432924-canonical"' \
            m1-exit-review/loan-list.json > /dev/null

          VAULT_ID="$(jq -r '.data[0].id' m1-exit-review/vault-list.json)"
          BROKER_ID="$(jq -r '.data[0].id' m1-exit-review/loan-broker-list.json)"
          LOAN_ID="$(jq -r '.data[0].id' m1-exit-review/loan-list.json)"

          curl --fail-with-body --silent --show-error --retry 3 \
            "${BASE}/api/vaults/${VAULT_ID}" \
            > m1-exit-review/vault-detail.json
          curl --fail-with-body --silent --show-error --retry 3 \
            "${BASE}/api/loan-brokers/${BROKER_ID}" \
            > m1-exit-review/loan-broker-detail.json
          curl --fail-with-body --silent --show-error --retry 3 \
            "${BASE}/api/loans/${LOAN_ID}" \
            > m1-exit-review/loan-detail.json

          jq -e --arg id "${VAULT_ID}" '.availability.state == "available" and .data.id == $id and .snapshot.id == "devnet-3432924-canonical"' \
            m1-exit-review/vault-detail.json > /dev/null
          jq -e --arg id "${BROKER_ID}" '.availability.state == "available" and .data.id == $id and .snapshot.id == "devnet-3432924-canonical"' \
            m1-exit-review/loan-broker-detail.json > /dev/null
          jq -e --arg id "${LOAN_ID}" '.availability.state == "available" and .data.id == $id and .snapshot.id == "devnet-3432924-canonical"' \
            m1-exit-review/loan-detail.json > /dev/null

      - name: Build review summary
        if: steps.execution.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail

          jq -n \
            --slurpfile collector m1-exit-review/collector.json \
            --slurpfile continuation m1-exit-review/continuation-diagnostics.json \
            --slurpfile m1 m1-exit-review/m1-exit-diagnostics.json \
            --slurpfile rebase m1-exit-review/replacement-base-rebase.json \
            --slurpfile history m1-exit-review/history-source.json \
            --slurpfile vault m1-exit-review/vault-detail.json \
            --slurpfile broker m1-exit-review/loan-broker-detail.json \
            --slurpfile loan m1-exit-review/loan-detail.json \
            '{
              recorded_at: (now | todateiso8601),
              collector: {
                status: $collector[0].status,
                cursor: $collector[0].cursor,
                usage: $collector[0].usage,
                consecutive_failures: $collector[0].consecutive_failures
              },
              replacement_base: {
                status: $rebase[0].status,
                snapshot_id: $rebase[0].target.snapshotId,
                ledger_index: $rebase[0].target.ledgerIndex
              },
              history_source: {
                mode: $history[0].mode,
                end_ledger_index: $history[0].chain.end_ledger_index,
                segment_count: $history[0].chain.segment_count,
                exact_index_records: $history[0].exact_index.total_records
              },
              hyb7: {
                passed: $continuation[0].report.passed,
                path_states: ($continuation[0].report.paths | with_entries(.value = .value.state))
              },
              m1_exit: {
                ready: $m1[0].report.ready,
                gate_states: ($m1[0].report.gates | with_entries(.value = .value.state))
              },
              current_state_exact_reads: {
                vault_id: $vault[0].data.id,
                loan_broker_id: $broker[0].data.id,
                loan_id: $loan[0].data.id,
                snapshot_id: $vault[0].snapshot.id
              }
            }' > m1-exit-review/summary.json

          {
            echo '## M1 exit review'
            echo
            jq -r '"- Collector status: **\(.collector.status)**"' m1-exit-review/summary.json
            jq -r '"- Cursor: `\(.collector.cursor.last_processed_ledger)` / head `\(.collector.cursor.latest_observed_ledger)` / lag `\(.collector.cursor.lag_ledgers)`"' m1-exit-review/summary.json
            jq -r '"- Replacement base: **\(.replacement_base.status)** — `\(.replacement_base.snapshot_id)` at `\(.replacement_base.ledger_index)`"' m1-exit-review/summary.json
            jq -r '"- History source: **\(.history_source.mode)** through `\(.history_source.end_ledger_index)`"' m1-exit-review/summary.json
            jq -r '"- HYB-7 passed: **\(.hyb7.passed)**"' m1-exit-review/summary.json
            jq -r '"- M1 exit ready: **\(.m1_exit.ready)**"' m1-exit-review/summary.json
            echo
            echo '### HYB-7 paths'
            jq -r '.hyb7.path_states | to_entries[] | "- `\(.key)`: **\(.value)**"' m1-exit-review/summary.json
            echo
            echo '### M1 gates'
            jq -r '.m1_exit.gate_states | to_entries[] | "- `\(.key)`: **\(.value)**"' m1-exit-review/summary.json
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Enforce non-contradiction invariants
        if: steps.execution.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          jq -e '[.report.paths[] | select(.state == "inconsistent")] | length == 0' \
            m1-exit-review/continuation-diagnostics.json > /dev/null
          jq -e '[.report.gates[] | select(.state == "inconsistent")] | length == 0' \
            m1-exit-review/m1-exit-diagnostics.json > /dev/null
          jq -e '.consecutive_failures == 0' m1-exit-review/collector.json > /dev/null

      - name: Enforce ready exit state
        if: steps.execution.outputs.active == 'true' && steps.execution.outputs.enforce_ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.report.passed == true and ([.report.paths[].state] | all(. == "observed"))' \
            m1-exit-review/continuation-diagnostics.json > /dev/null
          jq -e '.report.ready == true and ([.report.gates[].state] | all(. == "observed"))' \
            m1-exit-review/m1-exit-diagnostics.json > /dev/null
          jq -e '.cursor.lag_ledgers == 0 and .consecutive_failures == 0' \
            m1-exit-review/collector.json > /dev/null

      - name: Upload M1 exit review evidence
        if: always() && steps.execution.outputs.active == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: m1-exit-review
          path: m1-exit-review
          if-no-files-found: error
          retention-days: 30
