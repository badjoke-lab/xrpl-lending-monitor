name: Final live recovery verification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/final-live-recovery-cutover.yml'

permissions:
  contents: read

concurrency:
  group: final-live-recovery-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out verified main implementation
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Bind completed production checkpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live-cutover-evidence
          jq -n '{historyBranch:"history-data",currentStateBranch:"current-state-data",target:{ledgerIndex:3591849,ledgerHash:"377B6FD146F74AA9C4B025D8557E679231B64C2DC542DE2A122BC9CF6CCA1092",publicationSha256:"e347ca8f51181b13892cf0f455e1b1de293a5e156397a07b8255ec287ab37f82",snapshotId:"devnet-3591849-377b6fd146f7",currentManifestSha256:"97ec1a2040754acb617a782b9be6dbaa66dff4fe5b9c84c6fd1b5ced5ee65d7d"}}' > live-cutover-evidence/target-identity.json

      - name: Require live five-minute freshness convergence
        shell: bash
        run: bash scripts/verify-live-checkpoint-cutover.sh

      - name: Require exact production data identity
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --retry 3 https://raw.githubusercontent.com/badjoke-lab/xrpl-lending-monitor/history-data/history/publication.json > live-cutover-evidence/production-history.json
          curl --fail-with-body --silent --show-error --retry 3 https://raw.githubusercontent.com/badjoke-lab/xrpl-lending-monitor/current-state-data/read-model/manifest.json > live-cutover-evidence/production-current.json
          jq -e '.complete == true and .endLedgerIndex == 3591849 and .endLedgerHash == "377B6FD146F74AA9C4B025D8557E679231B64C2DC542DE2A122BC9CF6CCA1092" and .publicationSha256 == "e347ca8f51181b13892cf0f455e1b1de293a5e156397a07b8255ec287ab37f82"' live-cutover-evidence/production-history.json > /dev/null
          jq -e '.complete == true and .ledgerIndex == 3591849 and .ledgerHash == "377B6FD146F74AA9C4B025D8557E679231B64C2DC542DE2A122BC9CF6CCA1092" and .snapshotId == "devnet-3591849-377b6fd146f7" and .manifestSha256 == "97ec1a2040754acb617a782b9be6dbaa66dff4fe5b9c84c6fd1b5ced5ee65d7d"' live-cutover-evidence/production-current.json > /dev/null

      - name: Upload final verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: final-live-recovery-verification
          path: live-cutover-evidence
          if-no-files-found: warn
          retention-days: 30
