name: Production freshness watchdog

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/production-freshness-watchdog.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: production-freshness-watchdog
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
  GH_TOKEN: ${{ github.token }}
  STATUS_ISSUE: '978'
  PRODUCTION_BASE: https://xrpl-lending-monitor.badjoke-lab.workers.dev
  FORMAL_OPERATION_START: '2026-07-24T02:40:00Z'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read exact production freshness
        shell: bash
        run: |
          set -uo pipefail

          query_d1() {
            local sql="$1" output="$2"
            jq -n --arg sql "$sql" '{sql:$sql}' \
              | curl --silent --show-error --retry 3 --retry-all-errors \
                  --connect-timeout 10 --max-time 45 \
                  -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  -H 'Content-Type: application/json' \
                  --data-binary @- \
                  "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query" \
              > "$output" || printf '{"success":false,"result":[],"errors":[{"message":"transport_failure"}]}' > "$output"
          }

          fetch_api() {
            local path="$1" output="$2" code_file="$3"
            local code
            code="$(curl --silent --show-error --retry 3 --retry-all-errors \
              --connect-timeout 10 --max-time 45 \
              -o "$output" -w '%{http_code}' "${PRODUCTION_BASE}${path}" || true)"
            printf '%s' "$code" > "$code_file"
          }

          query_d1 "SELECT epoch_id,last_processed_ledger,last_processed_hash,latest_observed_ledger,latest_observed_hash,status,(latest_observed_ledger-last_processed_ledger) AS lag_ledgers,updated_at FROM fast_lane_shadow_state WHERE network='devnet'" state.json
          query_d1 "SELECT epoch_id,base_snapshot_id,base_ledger_index,base_ledger_hash,overlay_ledger_index,overlay_ledger_hash,updated_at FROM current_state_overlay_state WHERE network='devnet'" overlay-state.json
          query_d1 "SELECT COUNT(*) AS compact_rows FROM fast_lane_shadow_objects_compact WHERE network='devnet'" compact.json
          query_d1 "SELECT COUNT(*) AS stale_rows FROM current_state_overlay_objects o WHERE o.network='devnet' AND NOT EXISTS (SELECT 1 FROM fast_lane_shadow_base_binding b WHERE b.network=o.network AND b.base_epoch_id=o.epoch_id AND b.base_snapshot_id=o.base_snapshot_id)" stale.json
          query_d1 "SELECT network,run_at,status,start_ledger_index,end_ledger_index,latest_observed_ledger,lag_ledgers,ledgers_processed,persistence_rows_read,persistence_rows_written,error_message FROM fast_lane_shadow_run_metrics WHERE network='devnet' ORDER BY run_at DESC LIMIT 64" metrics.json
          query_d1 "WITH ranked AS (SELECT run_at,status,lag_ledgers,error_message,start_ledger_index,end_ledger_index,CAST(strftime('%s',run_at)/300 AS INTEGER) AS slot,ROW_NUMBER() OVER (PARTITION BY CAST(strftime('%s',run_at)/300 AS INTEGER) ORDER BY run_at DESC) AS rn FROM fast_lane_shadow_run_metrics WHERE network='devnet' AND run_at >= '${FORMAL_OPERATION_START}'), terminal AS (SELECT * FROM ranked WHERE rn=1) SELECT COUNT(*) AS observed_slots,COALESCE(SUM(CASE WHEN status='committed' AND lag_ledgers=0 AND error_message IS NULL THEN 1 ELSE 0 END),0) AS good_slots,COALESCE(SUM(CASE WHEN status<>'committed' OR lag_ledgers<>0 OR error_message IS NOT NULL THEN 1 ELSE 0 END),0) AS bad_slots,MIN(slot) AS first_slot,MAX(slot) AS last_slot,CASE WHEN COUNT(*)=0 THEN 0 ELSE MAX(slot)-MIN(slot)+1-COUNT(*) END AS missing_slots,MIN(run_at) AS first_run_at,MAX(run_at) AS last_run_at,MIN(start_ledger_index) AS first_start_ledger,MAX(end_ledger_index) AS last_end_ledger FROM terminal" continuity.json

          fetch_api '/api/overview' overview.json overview.code
          fetch_api '/api/status/history-source' history.json history.code
          fetch_api '/api/status/fast-lane-diff?limit=1' diff.json diff.code

          state_ok="$(jq -r '.success == true and ((.errors // [])|length)==0 and (.result[0].results|length)==1' state.json 2>/dev/null || echo false)"
          overlay_ok="$(jq -r '.success == true and ((.errors // [])|length)==0 and (.result[0].results|length)==1' overlay-state.json 2>/dev/null || echo false)"
          compact_ok="$(jq -r '.success == true and ((.errors // [])|length)==0 and (.result[0].results|length)==1' compact.json 2>/dev/null || echo false)"
          stale_ok="$(jq -r '.success == true and ((.errors // [])|length)==0 and (.result[0].results|length)==1' stale.json 2>/dev/null || echo false)"
          continuity_ok="$(jq -r '.success == true and ((.errors // [])|length)==0 and (.result[0].results|length)==1' continuity.json 2>/dev/null || echo false)"

          state="$(jq -c '.result[0].results[0] // {}' state.json 2>/dev/null || echo '{}')"
          overlay="$(jq -c '.result[0].results[0] // {}' overlay-state.json 2>/dev/null || echo '{}')"
          compact_rows="$(jq -r '.result[0].results[0].compact_rows // -1' compact.json 2>/dev/null || echo -1)"
          stale_rows="$(jq -r '.result[0].results[0].stale_rows // -1' stale.json 2>/dev/null || echo -1)"
          continuity="$(jq -c '.result[0].results[0] // {}' continuity.json 2>/dev/null || echo '{}')"

          terminal_metrics="$(jq -c '
            [.result[0].results[]?
              | . + {slot: (((.run_at | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601) / 300) | floor)}]
            | sort_by([.slot, .run_at])
            | group_by(.slot)
            | map(last)
            | sort_by(.slot)
            | reverse
            | .[:6]
          ' metrics.json 2>/dev/null || echo '[]')"
          metrics_ok="$(jq -r 'length >= 3' <<<"$terminal_metrics")"
          latest_metric="$(jq -c '.[0] // {}' <<<"$terminal_metrics")"

          processed="$(jq -r '.last_processed_ledger // -1' <<<"$state")"
          lag="$(jq -r '.lag_ledgers // -1' <<<"$state")"
          fast_status="$(jq -r '.status // "missing"' <<<"$state")"
          overlay_ledger="$(jq -r '.overlay_ledger_index // -1' <<<"$overlay")"
          metric_run_at="$(jq -r '.run_at // empty' <<<"$latest_metric")"
          metric_status="$(jq -r '.status // "missing"' <<<"$latest_metric")"
          metric_error="$(jq -r '.error_message // empty' <<<"$latest_metric")"
          observed_slots="$(jq -r '.observed_slots // 0' <<<"$continuity")"
          bad_slots="$(jq -r '.bad_slots // -1' <<<"$continuity")"
          missing_slots="$(jq -r '.missing_slots // -1' <<<"$continuity")"

          checked_at="$(date -u +%FT%TZ)"
          now_epoch="$(date -u +%s)"
          metric_age_seconds=-1
          if [ -n "$metric_run_at" ]; then
            metric_epoch="$(date -u -d "$metric_run_at" +%s 2>/dev/null || echo 0)"
            if [ "$metric_epoch" -gt 0 ]; then metric_age_seconds="$((now_epoch - metric_epoch))"; fi
          fi

          consecutive_runs=false
          all_terminal_good="$(jq -r 'length >= 3 and all(.[]; .status == "committed" and (.lag_ledgers // -1) == 0 and .error_message == null)' <<<"$terminal_metrics")"
          if [ "$all_terminal_good" = true ]; then
            mapfile -t slots < <(jq -r '.[].slot' <<<"$terminal_metrics")
            consecutive_runs=true
            for ((i=0; i<${#slots[@]}-1; i++)); do
              gap="$((slots[$i] - slots[$((i+1))]))"
              if [ "$gap" -ne 1 ]; then
                consecutive_runs=false
                break
              fi
            done
          fi

          overview_http="$(cat overview.code)"
          history_http="$(cat history.code)"
          diff_http="$(cat diff.code)"

          healthy=false
          if [ "$state_ok" = true ] && [ "$overlay_ok" = true ] && [ "$compact_ok" = true ] && [ "$stale_ok" = true ] && [ "$continuity_ok" = true ] && [ "$metrics_ok" = true ] \
             && [ "$overview_http" = 200 ] && [ "$history_http" = 200 ] && [ "$diff_http" = 200 ] \
             && [ "$fast_status" = healthy ] && [ "$lag" -eq 0 ] \
             && [ "$metric_status" = committed ] && [ -z "$metric_error" ] \
             && [ "$metric_age_seconds" -ge 0 ] && [ "$metric_age_seconds" -le 600 ] \
             && [ "$consecutive_runs" = true ] \
             && [ "$observed_slots" -ge 3 ] && [ "$bad_slots" -eq 0 ] && [ "$missing_slots" -eq 0 ] \
             && [ "$stale_rows" -eq 0 ] && [ "$compact_rows" -eq 0 ] \
             && [ "$overlay_ledger" -eq "$processed" ]; then
            healthy=true
          fi

          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          jq -n \
            --arg checkedAt "$checked_at" \
            --arg formalOperationStart "$FORMAL_OPERATION_START" \
            --arg eventName "$GITHUB_EVENT_NAME" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg runUrl "$run_url" \
            --arg workflowSha "$GITHUB_SHA" \
            --arg workflowRef "$GITHUB_WORKFLOW_REF" \
            --arg actor "$GITHUB_ACTOR" \
            --arg schedule '*/5 * * * *' \
            --argjson healthy "$healthy" \
            --argjson consecutiveRuns "$consecutive_runs" \
            --argjson stateQueryOk "$state_ok" \
            --argjson overlayQueryOk "$overlay_ok" \
            --argjson compactQueryOk "$compact_ok" \
            --argjson staleQueryOk "$stale_ok" \
            --argjson continuityQueryOk "$continuity_ok" \
            --argjson metricsQueryOk "$metrics_ok" \
            --argjson state "$state" \
            --argjson overlay "$overlay" \
            --argjson compactRows "$compact_rows" \
            --argjson staleRows "$stale_rows" \
            --argjson continuity "$continuity" \
            --argjson terminalMetrics "$terminal_metrics" \
            --argjson metricAgeSeconds "$metric_age_seconds" \
            --arg overviewHttp "$overview_http" \
            --arg historyHttp "$history_http" \
            --arg diffHttp "$diff_http" \
            '{checkedAt:$checkedAt,healthy:$healthy,watchdog:{schedule:$schedule,eventName:$eventName,runId:($runId|tonumber),runAttempt:($runAttempt|tonumber),runUrl:$runUrl,workflowSha:$workflowSha,workflowRef:$workflowRef,actor:$actor},formalOperation:{startedAt:$formalOperationStart,continuity:$continuity},consecutiveFiveMinuteSlots:$consecutiveRuns,queryOk:{fastLaneState:$stateQueryOk,overlayState:$overlayQueryOk,compact:$compactQueryOk,stale:$staleQueryOk,continuity:$continuityQueryOk,terminalMetrics:$metricsQueryOk},fastLane:$state,canonicalOverlay:$overlay,compactRows:$compactRows,staleRows:$staleRows,terminalMetrics:$terminalMetrics,metricAgeSeconds:$metricAgeSeconds,http:{overview:$overviewHttp,historySource:$historyHttp,fastLaneDiff:$diffHttp}}' > summary.json

          {
            echo '# Production freshness watchdog'
            echo
            echo 'Exact read-only D1 and public API check. It does not invoke the collector, deploy, repair, or maintenance paths.'
            echo
            echo 'The `watchdog.eventName` and linked Actions run distinguish scheduled checks from manual or push-triggered checks. The continuity aggregate is computed from the terminal run in every five-minute slot since formal operation started.'
            echo
            echo '```json'
            cat summary.json
            echo '```'
          } > issue.md

          gh issue edit "$STATUS_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file issue.md
          test "$healthy" = true
