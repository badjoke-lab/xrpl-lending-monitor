name: Production freshness watchdog

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/production-freshness-watchdog.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: production-freshness-watchdog
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
  GH_TOKEN: ${{ github.token }}
  STATUS_ISSUE: '978'
  PRODUCTION_BASE: https://xrpl-lending-monitor.badjoke-lab.workers.dev

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read exact production freshness
        shell: bash
        run: |
          set -uo pipefail

          query_d1() {
            local sql="$1" output="$2"
            jq -n --arg sql "$sql" '{sql:$sql}' \
              | curl --silent --show-error --retry 3 --retry-all-errors \
                  --connect-timeout 10 --max-time 45 \
                  -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  -H 'Content-Type: application/json' \
                  --data-binary @- \
                  "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query" \
              > "$output" || printf '{"success":false,"result":[],"errors":[{"message":"transport_failure"}]}' > "$output"
          }

          fetch_api() {
            local path="$1" output="$2" code_file="$3"
            local code
            code="$(curl --silent --show-error --retry 3 --retry-all-errors \
              --connect-timeout 10 --max-time 45 \
              -o "$output" -w '%{http_code}' "${PRODUCTION_BASE}${path}" || true)"
            printf '%s' "$code" > "$code_file"
          }

          query_d1 "SELECT epoch_id,last_processed_ledger,last_processed_hash,latest_observed_ledger,latest_observed_hash,status,(latest_observed_ledger-last_processed_ledger) AS lag_ledgers,updated_at FROM fast_lane_shadow_state WHERE network='devnet'" state.json
          query_d1 "SELECT epoch_id,base_snapshot_id,base_ledger_index,base_ledger_hash,overlay_ledger_index,overlay_ledger_hash,updated_at FROM current_state_overlay_state WHERE network='devnet'" overlay-state.json
          query_d1 "SELECT COUNT(*) AS compact_rows FROM fast_lane_shadow_objects_compact WHERE network='devnet'" compact.json
          query_d1 "SELECT COUNT(*) AS stale_rows FROM current_state_overlay_objects o WHERE o.network='devnet' AND NOT EXISTS (SELECT 1 FROM fast_lane_shadow_base_binding b WHERE b.network=o.network AND b.base_epoch_id=o.epoch_id AND b.base_snapshot_id=o.base_snapshot_id)" stale.json
          query_d1 "SELECT network,run_at,status,start_ledger_index,end_ledger_index,latest_observed_ledger,lag_ledgers,ledgers_processed,persistence_rows_read,persistence_rows_written,error_message FROM fast_lane_shadow_run_metrics WHERE network='devnet' ORDER BY run_at DESC LIMIT 6" metrics.json

          fetch_api '/api/overview' overview.json overview.code
          fetch_api '/api/status/history-source' history.json history.code
          fetch_api '/api/status/fast-lane-diff?limit=1' diff.json diff.code

          state_ok="$(jq -r '.success == true and ((.errors // [])|length)==0 and (.result[0].results|length)==1' state.json 2>/dev/null || echo false)"
          overlay_ok="$(jq -r '.success == true and ((.errors // [])|length)==0 and (.result[0].results|length)==1' overlay-state.json 2>/dev/null || echo false)"
          compact_ok="$(jq -r '.success == true and ((.errors // [])|length)==0 and (.result[0].results|length)==1' compact.json 2>/dev/null || echo false)"
          stale_ok="$(jq -r '.success == true and ((.errors // [])|length)==0 and (.result[0].results|length)==1' stale.json 2>/dev/null || echo false)"
          metrics_ok="$(jq -r '.success == true and ((.errors // [])|length)==0 and (.result[0].results|length)>=3' metrics.json 2>/dev/null || echo false)"

          state="$(jq -c '.result[0].results[0] // {}' state.json 2>/dev/null || echo '{}')"
          overlay="$(jq -c '.result[0].results[0] // {}' overlay-state.json 2>/dev/null || echo '{}')"
          compact_rows="$(jq -r '.result[0].results[0].compact_rows // -1' compact.json 2>/dev/null || echo -1)"
          stale_rows="$(jq -r '.result[0].results[0].stale_rows // -1' stale.json 2>/dev/null || echo -1)"
          recent_metrics="$(jq -c '.result[0].results // []' metrics.json 2>/dev/null || echo '[]')"
          latest_metric="$(jq -c '.[0] // {}' <<<"$recent_metrics")"

          processed="$(jq -r '.last_processed_ledger // -1' <<<"$state")"
          lag="$(jq -r '.lag_ledgers // -1' <<<"$state")"
          fast_status="$(jq -r '.status // "missing"' <<<"$state")"
          overlay_ledger="$(jq -r '.overlay_ledger_index // -1' <<<"$overlay")"
          metric_run_at="$(jq -r '.run_at // empty' <<<"$latest_metric")"
          metric_status="$(jq -r '.status // "missing"' <<<"$latest_metric")"
          metric_error="$(jq -r '.error_message // empty' <<<"$latest_metric")"

          checked_at="$(date -u +%FT%TZ)"
          now_epoch="$(date -u +%s)"
          metric_age_seconds=-1
          if [ -n "$metric_run_at" ]; then
            metric_epoch="$(date -u -d "$metric_run_at" +%s 2>/dev/null || echo 0)"
            if [ "$metric_epoch" -gt 0 ]; then metric_age_seconds="$((now_epoch - metric_epoch))"; fi
          fi

          consecutive_runs=false
          all_recent_good="$(jq -r 'length >= 3 and all(.[]; .status == "committed" and (.lag_ledgers // -1) == 0 and .error_message == null)' <<<"$recent_metrics")"
          if [ "$all_recent_good" = true ]; then
            mapfile -t run_times < <(jq -r '.[].run_at' <<<"$recent_metrics")
            consecutive_runs=true
            for ((i=0; i<${#run_times[@]}-1; i++)); do
              newer="$(date -u -d "${run_times[$i]}" +%s 2>/dev/null || echo 0)"
              older="$(date -u -d "${run_times[$((i+1))]}" +%s 2>/dev/null || echo 0)"
              gap="$((newer - older))"
              if [ "$newer" -le 0 ] || [ "$older" -le 0 ] || [ "$gap" -le 0 ] || [ "$gap" -gt 600 ]; then
                consecutive_runs=false
                break
              fi
            done
          fi

          overview_http="$(cat overview.code)"
          history_http="$(cat history.code)"
          diff_http="$(cat diff.code)"

          healthy=false
          if [ "$state_ok" = true ] && [ "$overlay_ok" = true ] && [ "$compact_ok" = true ] && [ "$stale_ok" = true ] && [ "$metrics_ok" = true ] \
             && [ "$overview_http" = 200 ] && [ "$history_http" = 200 ] && [ "$diff_http" = 200 ] \
             && [ "$fast_status" = healthy ] && [ "$lag" -eq 0 ] \
             && [ "$metric_status" = committed ] && [ -z "$metric_error" ] \
             && [ "$metric_age_seconds" -ge 0 ] && [ "$metric_age_seconds" -le 600 ] \
             && [ "$consecutive_runs" = true ] \
             && [ "$stale_rows" -eq 0 ] && [ "$compact_rows" -eq 0 ] \
             && [ "$overlay_ledger" -eq "$processed" ]; then
            healthy=true
          fi

          jq -n \
            --arg checkedAt "$checked_at" \
            --argjson healthy "$healthy" \
            --argjson consecutiveRuns "$consecutive_runs" \
            --argjson stateQueryOk "$state_ok" \
            --argjson overlayQueryOk "$overlay_ok" \
            --argjson compactQueryOk "$compact_ok" \
            --argjson staleQueryOk "$stale_ok" \
            --argjson metricsQueryOk "$metrics_ok" \
            --argjson state "$state" \
            --argjson overlay "$overlay" \
            --argjson compactRows "$compact_rows" \
            --argjson staleRows "$stale_rows" \
            --argjson recentMetrics "$recent_metrics" \
            --argjson metricAgeSeconds "$metric_age_seconds" \
            --arg overviewHttp "$overview_http" \
            --arg historyHttp "$history_http" \
            --arg diffHttp "$diff_http" \
            '{checkedAt:$checkedAt,healthy:$healthy,consecutiveFiveMinuteRuns:$consecutiveRuns,queryOk:{fastLaneState:$stateQueryOk,overlayState:$overlayQueryOk,compact:$compactQueryOk,stale:$staleQueryOk,recentMetrics:$metricsQueryOk},fastLane:$state,canonicalOverlay:$overlay,compactRows:$compactRows,staleRows:$staleRows,recentMetrics:$recentMetrics,metricAgeSeconds:$metricAgeSeconds,http:{overview:$overviewHttp,historySource:$historyHttp,fastLaneDiff:$diffHttp}}' > summary.json

          {
            echo '# Production freshness watchdog'
            echo
            echo 'Exact read-only D1 and public API check. It does not invoke the collector, deploy, repair, or maintenance paths.'
            echo
            echo '```json'
            cat summary.json
            echo '```'
          } > issue.md

          gh issue edit "$STATUS_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file issue.md
          test "$healthy" = true
