name: Production freshness watchdog

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/production-freshness-watchdog.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: production-freshness-watchdog
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  STATUS_ISSUE: '978'
  PRODUCTION_BASE: https://xrpl-lending-monitor.badjoke-lab.workers.dev

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read public production APIs only
        shell: bash
        run: |
          set -uo pipefail

          fetch_api() {
            local path="$1" output="$2" code_file="$3"
            local code
            code="$(curl --silent --show-error --retry 3 --retry-all-errors \
              --connect-timeout 10 --max-time 45 \
              -o "$output" -w '%{http_code}' "${PRODUCTION_BASE}${path}" || true)"
            printf '%s' "$code" > "$code_file"
            jq -e . "$output" >/dev/null 2>&1 || printf '{}\n' > "$output"
          }

          scalar_candidates() {
            local file="$1" regex="$2"
            jq -c --arg regex "$regex" '
              [paths(scalars) as $p
               | {path:($p|map(tostring)|join(".")), value:getpath($p)}
               | select(.path|test($regex; "i"))]
            ' "$file" 2>/dev/null || printf '[]\n'
          }

          first_numeric_candidate() {
            local candidates="$1"
            jq -r '[.[] | select(.value|type == "number")][0].value // empty' <<<"$candidates"
          }

          fetch_api '/api/overview' overview.json overview.code
          fetch_api '/api/status/history-source' history.json history.code
          fetch_api '/api/status/fast-lane-diff?limit=1' diff.json diff.code

          overview_code="$(cat overview.code)"
          history_code="$(cat history.code)"
          diff_code="$(cat diff.code)"

          overview_processed="$(scalar_candidates overview.json '(last.*processed|processed.*ledger|fast.*lane.*ledger)')"
          diff_processed="$(scalar_candidates diff.json '(last.*processed|processed.*ledger|fast.*lane.*ledger)')"
          overview_observed="$(scalar_candidates overview.json '(latest.*observed|observed.*ledger)')"
          diff_observed="$(scalar_candidates diff.json '(latest.*observed|observed.*ledger)')"
          overview_lag="$(scalar_candidates overview.json '(^|\.)(lag|lagLedgers|lag_ledgers)($|\.)')"
          diff_lag="$(scalar_candidates diff.json '(^|\.)(lag|lagLedgers|lag_ledgers)($|\.)')"
          overview_status="$(scalar_candidates overview.json '(status|state)')"
          diff_status="$(scalar_candidates diff.json '(status|state)')"
          history_ledgers="$(scalar_candidates history.json '(ledgerIndex|ledger_index|ledger)')"
          history_times="$(scalar_candidates history.json '(updatedAt|generatedAt|createdAt|runAt|run_at|timestamp)')"

          processed="$(first_numeric_candidate "$overview_processed")"
          if ! [[ "$processed" =~ ^[0-9]+$ ]]; then
            processed="$(first_numeric_candidate "$diff_processed")"
          fi

          observed="$(first_numeric_candidate "$overview_observed")"
          if ! [[ "$observed" =~ ^[0-9]+$ ]]; then
            observed="$(first_numeric_candidate "$diff_observed")"
          fi

          lag="$(first_numeric_candidate "$overview_lag")"
          if ! [[ "$lag" =~ ^[0-9]+$ ]]; then
            lag="$(first_numeric_candidate "$diff_lag")"
          fi
          if ! [[ "$lag" =~ ^-?[0-9]+$ ]] && [[ "$processed" =~ ^[0-9]+$ ]] && [[ "$observed" =~ ^[0-9]+$ ]]; then
            lag="$((observed - processed))"
          fi

          state_status="$(jq -r '[.[] | select(.value|type == "string") | .value | select(. == "healthy" or . == "behind" or . == "error")][0] // empty' <<<"$overview_status" 2>/dev/null || true)"
          if [ -z "$state_status" ]; then
            state_status="$(jq -r '[.[] | select(.value|type == "string") | .value | select(. == "healthy" or . == "behind" or . == "error")][0] // empty' <<<"$diff_status" 2>/dev/null || true)"
          fi

          history_ledger="$(jq -r '[.[] | select(.value|type == "number") | .value] | max // empty' <<<"$history_ledgers" 2>/dev/null || true)"
          history_timestamp="$(jq -r '[.[] | select(.value|type == "string") | .value][0] // empty' <<<"$history_times" 2>/dev/null || true)"

          previous_body="$(gh issue view "$STATUS_ISSUE" --repo "$GITHUB_REPOSITORY" --json body --jq .body 2>/dev/null || true)"
          previous_state="$(printf '%s\n' "$previous_body" | sed -n 's/^<!-- watchdog-state: \(.*\) -->$/\1/p' | tail -n1)"
          previous_processed="$(jq -r '.lastProcessedLedger // empty' <<<"${previous_state:-{}}" 2>/dev/null || true)"
          previous_history="$(jq -r '.historyLedger // empty' <<<"${previous_state:-{}}" 2>/dev/null || true)"
          previous_history_change="$(jq -r '.historyLastChangedAt // empty' <<<"${previous_state:-{}}" 2>/dev/null || true)"

          checked_at="$(date -u +%FT%TZ)"
          advanced=false
          if [[ "$processed" =~ ^[0-9]+$ ]] && [[ "$previous_processed" =~ ^[0-9]+$ ]] && [ "$processed" -gt "$previous_processed" ]; then
            advanced=true
          fi

          first_sample=false
          if ! [[ "$previous_processed" =~ ^[0-9]+$ ]]; then
            first_sample=true
          fi

          history_change_at="$previous_history_change"
          if [[ "$history_ledger" =~ ^[0-9]+$ ]] && { ! [[ "$previous_history" =~ ^[0-9]+$ ]] || [ "$history_ledger" -ne "$previous_history" ]; }; then
            history_change_at="$checked_at"
          fi

          healthy=false
          if [ "$overview_code" = 200 ] && [ "$history_code" = 200 ] && [ "$diff_code" = 200 ] \
             && [[ "$processed" =~ ^[0-9]+$ ]] \
             && [[ "$lag" =~ ^-?[0-9]+$ ]] && [ "$lag" -eq 0 ] \
             && [[ "$history_ledger" =~ ^[0-9]+$ ]] \
             && { [ "$advanced" = true ] || [ "$first_sample" = true ]; }; then
            healthy=true
          fi

          jq -n \
            --arg checkedAt "$checked_at" \
            --arg overviewHttp "$overview_code" \
            --arg historyHttp "$history_code" \
            --arg diffHttp "$diff_code" \
            --arg stateStatus "$state_status" \
            --arg processed "$processed" \
            --arg observed "$observed" \
            --arg lag "$lag" \
            --arg historyLedger "$history_ledger" \
            --arg historyTimestamp "$history_timestamp" \
            --arg historyLastChangedAt "$history_change_at" \
            --argjson advanced "$advanced" \
            --argjson firstSample "$first_sample" \
            --argjson healthy "$healthy" \
            --argjson overviewProcessed "$overview_processed" \
            --argjson diffProcessed "$diff_processed" \
            --argjson overviewObserved "$overview_observed" \
            --argjson diffObserved "$diff_observed" \
            --argjson overviewLag "$overview_lag" \
            --argjson diffLag "$diff_lag" \
            --argjson historyLedgers "$history_ledgers" \
            '{checkedAt:$checkedAt,healthy:$healthy,firstSample:$firstSample,advancedSincePreviousCheck:$advanced,http:{overview:$overviewHttp,historySource:$historyHttp,fastLaneDiff:$diffHttp},fastLane:{status:$stateStatus,lastProcessedLedger:($processed|tonumber? // null),latestObservedLedger:($observed|tonumber? // null),lagLedgers:($lag|tonumber? // null)},history:{ledger:($historyLedger|tonumber? // null),sourceTimestamp:($historyTimestamp|select(length>0) // null),lastChangedAt:($historyLastChangedAt|select(length>0) // null)},diagnostics:{overviewProcessed:$overviewProcessed,diffProcessed:$diffProcessed,overviewObserved:$overviewObserved,diffObserved:$diffObserved,overviewLag:$overviewLag,diffLag:$diffLag,historyLedgers:$historyLedgers}}' > summary.json

          jq -n \
            --arg checkedAt "$checked_at" \
            --arg processed "$processed" \
            --arg historyLedger "$history_ledger" \
            --arg historyLastChangedAt "$history_change_at" \
            '{checkedAt:$checkedAt,lastProcessedLedger:($processed|tonumber? // null),historyLedger:($historyLedger|tonumber? // null),historyLastChangedAt:($historyLastChangedAt|select(length>0) // null)}' > state.json

          {
            echo '# Production freshness watchdog'
            echo
            echo 'Public API read-only check. This workflow never queries or writes D1 and never calls collector, deploy, maintenance, or repair endpoints.'
            echo
            echo '```json'
            cat summary.json
            echo '```'
            echo
            printf '<!-- watchdog-state: %s -->\n' "$(jq -c . state.json)"
          } > issue.md

          gh issue edit "$STATUS_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file issue.md
          test "$healthy" = true
