name: Apply current-state hotfix once
on:
  pull_request:
    paths: [.github/workflows/apply-current-state-hotfix-temp.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply bounded hotfix patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git log -1 --pretty=%s)" = "Add one-shot current-state hotfix applier" || exit 0
          python <<'PY'
          from pathlib import Path

          path = Path('src/worker/repositories/release-current-state.ts')
          text = path.read_text()
          text = text.replace('function createReadModelAdapter(\n', 'export function createReadModelAdapter(\n', 1)
          old = '''  const cache = new Map<string, { kind: ReadModelKind; projection: Projection }>()

          function remember(kind: ReadModelKind, projection: Projection): void {
            cache.set(projection.id, { kind, projection })
          }

          function rememberPageItem(kind: ReadModelKind, item: unknown): void {
            if (kind === 'vault') {
              remember('vault', item as VaultCurrentProjection)
              return
            }
            if (kind === 'loan-broker') {
              const record = item as ReadModelBrokerRecord
              remember('loan-broker', record.broker)
              remember('vault', record.vault)
              return
            }
            const record = item as ReadModelLoanRecord
            remember('loan', record.loan)
            remember('loan-broker', record.broker)
            remember('vault', record.vault)
          }
          '''
          new = '''  const baseCache = new Map<string, { kind: ReadModelKind; projection: Projection }>()
          const resolvedCache = new Map<string, { kind: ReadModelKind; projection: Projection }>()

          function rememberBase(kind: ReadModelKind, projection: Projection): void {
            baseCache.set(projection.id.toUpperCase(), { kind, projection })
          }

          function rememberResolved(kind: ReadModelKind, projection: Projection): void {
            resolvedCache.set(projection.id.toUpperCase(), { kind, projection })
          }

          function rememberBasePageItem(kind: ReadModelKind, item: unknown): void {
            if (kind === 'vault') {
              rememberBase('vault', item as VaultCurrentProjection)
              return
            }
            if (kind === 'loan-broker') {
              const record = item as ReadModelBrokerRecord
              rememberBase('loan-broker', record.broker)
              rememberBase('vault', record.vault)
              return
            }
            const record = item as ReadModelLoanRecord
            rememberBase('loan', record.loan)
            rememberBase('loan-broker', record.broker)
            rememberBase('vault', record.vault)
          }
          '''
          if old not in text:
            raise SystemExit('cache block not found')
          text = text.replace(old, new, 1)
          text = text.replace('    const cached = cache.get(id)\n    if (cached) return cached\n', '    const cached = resolvedCache.get(id)\n    if (cached) return cached\n', 1)
          text = text.replace('        remember(kind, resolved.item)\n', '        rememberResolved(kind, resolved.item)\n', 1)
          marker = "  async function loadBaseAny(objectId: string): Promise<{ kind: ReadModelKind; projection: Projection } | null> {\n    const id = objectId.toUpperCase()\n"
          replacement = marker + "    const cached = baseCache.get(id)\n    if (cached) return cached\n\n"
          if marker not in text:
            raise SystemExit('base load marker not found')
          text = text.replace(marker, replacement, 1)
          text = text.replace('            remember(kind, item)\n', '            rememberBase(kind, item)\n', 1)
          text = text.replace('rememberPageItem(kind, item)', 'rememberBasePageItem(kind, item)')
          text = text.replace('remember(kind, projection)', 'rememberResolved(kind, projection)')
          path.write_text(text)

          review = Path('.github/workflows/m1-exit-review.yml')
          text = review.read_text()
          text = text.replace('${BASE}/api/vaults?limit=1', '${BASE}/api/vaults?limit=25&sort=id_asc')
          text = text.replace('${BASE}/api/loan-brokers?limit=1', '${BASE}/api/loan-brokers?limit=25&sort=id_asc')
          text = text.replace('${BASE}/api/loans?limit=1', '${BASE}/api/loans?limit=25&sort=id_asc')
          review.write_text(text)

          status = Path('docs/implementation-status.md')
          text = status.read_text()
          needle = 'The latest recorded runtime evidence shows continued collector progress with zero observed failures and negative lag slope. HYB-7 has now observed created current objects, modified current objects, deletion/archive handling, ledger continuity, and cursor/overlay agreement after the replacement boundary. Remaining semantic paths are LoanPay, impairment, unimpairment, default, activity/history/balance consistency, and freshness at zero lag.\n\n'
          addition = needle + 'A read-only production list probe on 2026-07-07 compared current-state endpoints at `limit=1` and the UI-shaped `limit=25`. Vault list reads returned HTTP 200 at both limits. Loan Broker and Loan list reads returned HTTP 200 at `limit=1` but HTTP 500 at `limit=25`. The isolated hotfix keeps collector and D1 continuation behavior unchanged while removing relationship-read amplification in the release current-state adapter and strengthening the M1 exit review to exercise 25-row list reads.\n\n'
          if needle not in text:
            raise SystemExit('status insertion point not found')
          text = text.replace(needle, addition, 1)
          text = text.replace('- reproducible manual M1 exit review workflow capturing runtime gates, source invariants, and current-state exact-read evidence.\n', '- reproducible manual M1 exit review workflow capturing runtime gates, source invariants, and current-state exact-read evidence;\n- production-shaped current-state list probing that distinguishes one-row success from UI-shaped 25-row relationship-read failures.\n', 1)
          status.write_text(text)
          PY
          rm -f .github/workflows/source-snapshot-temp.yml
          rm -f .github/workflows/apply-current-state-hotfix-temp.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/worker/repositories/release-current-state.ts \
            src/worker/repositories/release-current-state.test.ts \
            .github/workflows/m1-exit-review.yml \
            docs/implementation-status.md \
            .github/workflows/source-snapshot-temp.yml \
            .github/workflows/apply-current-state-hotfix-temp.yml
          git commit -m "Fix current-state relation list reads"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
