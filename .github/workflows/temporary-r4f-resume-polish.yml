name: Temporary R4F Resume Polish

on:
  push:
    branches:
      - agent/r4f-proof-edge-runtime-config

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: agent/r4f-proof-edge-runtime-config
      TARGET_PATH: supabase/functions/xrpl-r5-recovery-batch/index.ts
    steps:
      - name: Bind proof-only request source through Contents API
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/contents/${TARGET_PATH}?ref=${TARGET_BRANCH}" > /tmp/file.json
          sha="$(jq -r '.sha' /tmp/file.json)"
          jq -r '.content' /tmp/file.json | tr -d '\n' | base64 -d > /tmp/index.ts
          TARGET=/tmp/index.ts python - <<'PY'
          import os
          from pathlib import Path
          path = Path(os.environ['TARGET'])
          text = path.read_text()
          if "requestSource: 'github_actions_prepared_resume'" in text and "body.source !== requestSource()" in text:
              print('proof-only request source already patched')
              raise SystemExit(0)

          replacements = [
              (
                  "type Revision4QualificationRuntimeOverride = {\n  selectionDigest: string\n  unexplainedEgressReserveBytes: number\n}",
                  "type Revision4QualificationRuntimeOverride = {\n  selectionDigest: string\n  unexplainedEgressReserveBytes: number\n  requestSource: 'github_actions_prepared_resume'\n}",
              ),
              (
                  "Object.keys(candidate).sort().join(',') !== 'selectionDigest,unexplainedEgressReserveBytes'",
                  "Object.keys(candidate).sort().join(',') !== 'requestSource,selectionDigest,unexplainedEgressReserveBytes'",
              ),
              (
                  "  return {\n    selectionDigest: candidate.selectionDigest,\n    unexplainedEgressReserveBytes: candidate.unexplainedEgressReserveBytes,\n  }",
                  "  if (candidate.requestSource !== 'github_actions_prepared_resume') {\n    throw new RecoveryError('revision-4 qualification request source override is invalid', true)\n  }\n  return {\n    selectionDigest: candidate.selectionDigest,\n    unexplainedEgressReserveBytes: candidate.unexplainedEgressReserveBytes,\n    requestSource: candidate.requestSource,\n  }",
              ),
              (
                  "function selectionDigest(): string {",
                  "function requestSource(): string {\n  return qualificationRuntimeOverride()?.requestSource ?? 'github_actions'\n}\n\nfunction selectionDigest(): string {",
              ),
              (
                  "if (body.source !== 'github_actions') {",
                  "if (body.source !== requestSource()) {",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'exact executor replacement count mismatch for {old!r}: {count}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          grep -Fq "requestSource: 'github_actions_prepared_resume'" /tmp/index.ts
          grep -Fq 'body.source !== requestSource()' /tmp/index.ts
          current="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${TARGET_PATH}?ref=${TARGET_BRANCH}" --jq '.content' | tr -d '\n' | base64 -d)"
          proposed="$(cat /tmp/index.ts)"
          if [ "$current" = "$proposed" ]; then
            echo 'target already patched'
            exit 0
          fi
          base64 -w0 /tmp/index.ts > /tmp/content.b64
          jq -n \
            --arg message 'Bind qualification-only proof request source' \
            --arg content "$(cat /tmp/content.b64)" \
            --arg sha "$sha" \
            --arg branch "$TARGET_BRANCH" \
            '{message:$message,content:$content,sha:$sha,branch:$branch}' > /tmp/put.json
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/${TARGET_PATH}" --input /tmp/put.json > /tmp/put-result.json
          jq -e '.commit.sha | test("^[a-f0-9]{40}$")' /tmp/put-result.json > /dev/null
