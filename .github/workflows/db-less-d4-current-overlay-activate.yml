name: DB-less D4 Current overlay activation

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  activate:
    if: >-
      github.event.issue.number == 1673 &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/d4-activate-current-overlay ')
    concurrency:
      group: db-less-d4-current-overlay-activation
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      D3_CHANNEL_RELEASE_TAG: db-less-live-channel-candidate-v1
      D4_CHANNEL_RELEASE_TAG: db-less-current-overlay-channel-v1
      AUTHORIZATION_COMMENT: ${{ github.event.comment.body }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Verify exact D4 activation authorization
        shell: bash
        run: |
          set -euo pipefail

          read -r command expected_main expected_channel extra <<< "$AUTHORIZATION_COMMENT"
          test "$command" = "/d4-activate-current-overlay"
          test -z "${extra:-}"
          [[ "$expected_main" =~ ^[a-f0-9]{40}$ ]]
          [[ "$expected_channel" =~ ^[a-f0-9]{64}$ ]]

          actual_main="$(git rev-parse HEAD)"
          test "$actual_main" = "$expected_main"

          channel_body="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$D3_CHANNEL_RELEASE_TAG" --jq '.body')"
          actual_channel="$(jq -er '.channelSha256' <<< "$channel_body")"
          test "$actual_channel" = "$expected_channel"

          echo "AUTHORIZED_MAIN_SHA=$expected_main" >> "$GITHUB_ENV"
          echo "EXPECTED_D3_CHANNEL_SHA=$expected_channel" >> "$GITHUB_ENV"

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Build D4 checkpoint and publisher CLIs
        run: |
          pnpm build:db-less-current-overlay-checkpoint
          pnpm build:db-less-current-overlay-publisher

      - name: Build and verify fresh Current overlay checkpoint locally
        run: >-
          node .db-less-current-overlay-checkpoint-build/build-db-less-current-overlay-checkpoint.mjs
          --local
          --repository "$GITHUB_REPOSITORY"
          --channel-release-tag "$D3_CHANNEL_RELEASE_TAG"
          --expected-channel-sha256 "$EXPECTED_D3_CHANNEL_SHA"
          --active-overlay-channel-release-tag "$D4_CHANNEL_RELEASE_TAG"
          --max-generations 2048
          --bucket-count 256
          --max-records-per-shard 50000
          --max-bytes-per-shard 2000000
          --output-dir .local/d4-current-overlay

      - name: Verify checkpoint matches exact authorization
        shell: bash
        run: |
          set -euo pipefail
          summary=.local/d4-current-overlay/rehearsal-summary.json
          test "$(jq -r '.channelSha256' "$summary")" = "$EXPECTED_D3_CHANNEL_SHA"

      - name: Resolve and verify D4 Releases
        shell: bash
        run: |
          set -euo pipefail

          summary=.local/d4-current-overlay/rehearsal-summary.json
          through="$(jq -r '.throughLedgerIndex' "$summary")"
          test "$through" -gt 0
          checkpoint_tag="db-less-current-overlay-v1-$through"
          echo "CHECKPOINT_RELEASE_TAG=$checkpoint_tag" >> "$GITHUB_ENV"

          if gh release view "$checkpoint_tag" >/dev/null 2>&1; then
            release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$checkpoint_tag")"
            test "$(jq -r '.draft' <<<"$release_json")" = "false"
            test "$(jq -r '.prerelease' <<<"$release_json")" = "true"
          else
            gh release create "$checkpoint_tag"               --target "$AUTHORIZED_MAIN_SHA"               --prerelease               --latest=false               --title "D4 Current overlay checkpoint $through"               --notes "Immutable verified D4 Current overlay checkpoint. Activated only through the D4 channel Release."
          fi

          if gh release view "$D4_CHANNEL_RELEASE_TAG" >/dev/null 2>&1; then
            channel_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$D4_CHANNEL_RELEASE_TAG")"
            test "$(jq -r '.draft' <<<"$channel_json")" = "false"
            test "$(jq -r '.prerelease' <<<"$channel_json")" = "true"
          else
            gh api               --method POST               "repos/$GITHUB_REPOSITORY/releases"               -f tag_name="$D4_CHANNEL_RELEASE_TAG"               -f target_commitish="$AUTHORIZED_MAIN_SHA"               -f name="D4 Current overlay active checkpoint channel"               -f body=''               -F draft=false               -F prerelease=true               -f make_latest=false               >/dev/null
          fi

      - name: Publish immutable checkpoint then activate D4 channel
        shell: bash
        run: |
          set -euo pipefail
          updated_at="$(node -e 'process.stdout.write(new Date().toISOString())')"
          node .db-less-current-overlay-publisher-build/publish-db-less-current-overlay-checkpoint.mjs             --local             --repository "$GITHUB_REPOSITORY"             --input-dir .local/d4-current-overlay             --checkpoint-release-tag "$CHECKPOINT_RELEASE_TAG"             --channel-release-tag "$D4_CHANNEL_RELEASE_TAG"             --updated-at "$updated_at"             --output .local/d4-current-overlay/publication-summary.json

      - name: Record D4 activation evidence
        shell: bash
        run: |
          set -euo pipefail
          summary=.local/d4-current-overlay/publication-summary.json
          rehearsal=.local/d4-current-overlay/rehearsal-summary.json
          through="$(jq -r '.throughLedgerIndex' "$summary")"
          mode="$(jq -r '.mode' "$rehearsal")"
          seed_through="$(jq -r '.seedThroughLedgerIndex' "$rehearsal")"
          incremental_generations="$(jq -r '.incrementalGenerationCount' "$rehearsal")"
          traversed_manifests="$(jq -r '.traversedIncrementalManifests' "$rehearsal")"
          manifest="$(jq -r '.manifestSha256' "$summary")"
          state="$(jq -r '.stateSha256' "$summary")"
          source_channel="$(jq -r '.sourceChannelSha256' "$summary")"
          d4_channel="$(jq -r '.channelSha256' "$summary")"
          uploaded="$(jq -r '.uploadedAssets' "$summary")"
          reused="$(jq -r '.reusedAssets' "$summary")"

          gh issue comment 1673 --body "$(cat <<EOF
          D4 Current overlay activation PASS.

          - run: $GITHUB_RUN_ID
          - authorized main: $AUTHORIZED_MAIN_SHA
          - authorized D3 channel SHA-256: $EXPECTED_D3_CHANNEL_SHA
          - mode: $mode
          - seed through ledger: $seed_through
          - incremental generations: $incremental_generations
          - traversed incremental manifests: $traversed_manifests
          - through ledger: $through
          - checkpoint Release: $CHECKPOINT_RELEASE_TAG
          - checkpoint manifest SHA-256: $manifest
          - compacted state SHA-256: $state
          - source D3 channel SHA-256: $source_channel
          - D4 channel SHA-256: $d4_channel
          - immutable assets uploaded/reused: $uploaded / $reused
          - checkpoint assets were verified before channel activation

          No D3 channel, D2 base, D1, Queue, or Supabase state was mutated.
          EOF
          )"

      - name: Upload D4 activation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-less-d4-current-overlay-activation
          path: |
            .local/d4-current-overlay/rehearsal-summary.json
            .local/d4-current-overlay/publication-summary.json
            .local/d4-current-overlay/current-overlay-v1-*-manifest.json
          if-no-files-found: warn
          retention-days: 30
