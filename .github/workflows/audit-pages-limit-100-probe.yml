name: Audit pages limit 100 probe
on:
  pull_request:
    paths:
      - .github/workflows/audit-pages-limit-100-probe.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production audit collection reads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-pages-probe
          B="https://xrpl-lending-monitor.badjoke-lab.workers.dev"
          CODE="$(curl --max-time 120 -sS -o audit-pages-probe/lifecycle.json -w '%{http_code}' "${B}/api/audit/lifecycle?limit=100")"
          printf '%s\n' "${CODE}" > audit-pages-probe/lifecycle.status
          test "${CODE}" = "200"
          CODE="$(curl --max-time 120 -sS -o audit-pages-probe/archived.json -w '%{http_code}' "${B}/api/audit/archived?limit=100")"
          printf '%s\n' "${CODE}" > audit-pages-probe/archived.status
          test "${CODE}" = "200"
          CODE="$(curl --max-time 120 -sS -o audit-pages-probe/cover-loss.json -w '%{http_code}' "${B}/api/audit/cover-loss?limit=100")"
          printf '%s\n' "${CODE}" > audit-pages-probe/cover-loss.status
          test "${CODE}" = "200"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-pages-limit-100-probe
          path: audit-pages-probe
          retention-days: 1
