name: Diagnose Wrangler var flags

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-wrangler-var-flags.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture deploy help and validate explicit var overrides in dry-run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wrangler-var-diagnostic
          pnpm exec wrangler deploy --help > wrangler-var-diagnostic/deploy-help.txt 2>&1
          pnpm build:deploy-assets
          cp wrangler.jsonc wrangler-var-diagnostic/wrangler.test.jsonc
          pnpm exec wrangler deploy \
            --dry-run \
            --config wrangler-var-diagnostic/wrangler.test.jsonc \
            --outdir wrangler-var-diagnostic/dry-run \
            --var REPLACEMENT_BASE_LEDGER_INDEX:3592674 \
            --var REPLACEMENT_BASE_SNAPSHOT_ID:devnet-3592674-0373cda0b0cd \
            > wrangler-var-diagnostic/dry-run.log 2>&1
          grep -nE -- '--var|keep-vars|keep_vars' wrangler-var-diagnostic/deploy-help.txt > wrangler-var-diagnostic/relevant-help.txt || true
          cat wrangler-var-diagnostic/relevant-help.txt
          cat wrangler-var-diagnostic/dry-run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wrangler-var-diagnostic
          path: wrangler-var-diagnostic
          if-no-files-found: error
          retention-days: 3
