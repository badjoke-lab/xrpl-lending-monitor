name: Run history catch-up cycle

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/run-history-catchup-cycle.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: history-catchup-cycle-20260711
  cancel-in-progress: false

jobs:
  dispatch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      MAX_DELTA_LEDGERS: '5000'
      SEGMENT_LEDGERS: '500'
      READ_WINDOW_SIZE: '4'
      MAX_CYCLES: '8'
      TARGET_MAX_LAG_LEDGERS: '300'
    steps:
      - uses: actions/checkout@v4

      - name: Run remaining bounded rolling catch-up cycles
        shell: bash
        run: |
          set -euo pipefail
          ROOT=history-catchup-cycle
          mkdir -p "${ROOT}"
          : > "${ROOT}/cycles.ndjson"

          SOURCE_HISTORY='history-rolling-recovery-b-data'
          SOURCE_CURRENT='current-state-rolling-recovery-b-data'
          OUTPUT_HISTORY='history-rolling-next-candidate-data'
          OUTPUT_CURRENT='current-state-rolling-next-candidate-data'

          fetch_repo_json() {
            local branch="$1"
            local path="$2"
            local output="$3"
            for attempt in $(seq 1 30); do
              if gh api --method GET \
                "repos/${GITHUB_REPOSITORY}/contents/${path}" \
                -f ref="${branch}" \
                --jq '.content' 2>/dev/null \
                | tr -d '\n' | base64 --decode > "${output}"; then
                test -s "${output}" && return 0
              fi
              sleep 10
            done
            return 1
          }

          capture_live_head() {
            local prefix="$1"
            jq -n '{method:"ledger",params:[{ledger_index:"validated",transactions:false,expand:false}]}' \
              > "${ROOT}/${prefix}-head-request.json"
            curl --fail-with-body --silent --show-error --retry 3 \
              -H 'content-type: application/json' \
              --data @"${ROOT}/${prefix}-head-request.json" \
              https://devnet.honeycluster.io/ \
              > "${ROOT}/${prefix}-head-response.json"
            jq -r '.result.ledger_index // .result.ledger.ledger_index' \
              "${ROOT}/${prefix}-head-response.json"
          }

          for CYCLE in $(seq 1 "${MAX_CYCLES}"); do
            CYCLE_ROOT="${ROOT}/cycle-${CYCLE}"
            mkdir -p "${CYCLE_ROOT}"

            fetch_repo_json "${SOURCE_HISTORY}" history/publication.json "${CYCLE_ROOT}/source-publication.json"
            fetch_repo_json "${SOURCE_CURRENT}" read-model/manifest.json "${CYCLE_ROOT}/source-current-manifest.json"

            SOURCE_LEDGER="$(jq -r '.endLedgerIndex' "${CYCLE_ROOT}/source-publication.json")"
            SOURCE_HASH="$(jq -r '.endLedgerHash' "${CYCLE_ROOT}/source-publication.json")"
            CURRENT_LEDGER="$(jq -r '.ledgerIndex' "${CYCLE_ROOT}/source-current-manifest.json")"
            CURRENT_HASH="$(jq -r '.ledgerHash' "${CYCLE_ROOT}/source-current-manifest.json")"
            test "${SOURCE_LEDGER}" = "${CURRENT_LEDGER}"
            test "${SOURCE_HASH}" = "${CURRENT_HASH}"

            LIVE_BEFORE="$(capture_live_head "cycle-${CYCLE}-before")"
            LAG_BEFORE="$((LIVE_BEFORE - SOURCE_LEDGER))"
            if [ "${LAG_BEFORE}" -lt 0 ]; then LAG_BEFORE=0; fi
            if [ "${LAG_BEFORE}" -le "${TARGET_MAX_LAG_LEDGERS}" ]; then
              jq -n \
                --argjson cycle "${CYCLE}" \
                --arg sourceHistory "${SOURCE_HISTORY}" \
                --arg sourceCurrent "${SOURCE_CURRENT}" \
                --argjson sourceLedger "${SOURCE_LEDGER}" \
                --arg sourceHash "${SOURCE_HASH}" \
                --argjson liveLedger "${LIVE_BEFORE}" \
                --argjson lagLedgers "${LAG_BEFORE}" \
                '{cycle:$cycle,skipped:true,reason:"target_lag_reached",source:{historyBranch:$sourceHistory,currentStateBranch:$sourceCurrent,ledgerIndex:$sourceLedger,ledgerHash:$sourceHash},live:{ledgerIndex:$liveLedger,lagLedgers:$lagLedgers}}' \
                >> "${ROOT}/cycles.ndjson"
              break
            fi

            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/rolling-checkpoint-candidate.yml/runs?event=workflow_dispatch&per_page=100" \
              --jq '.workflow_runs[].id' > "${CYCLE_ROOT}/run-ids-before.txt"

            jq -n \
              --arg ref main \
              --arg sourceHistory "${SOURCE_HISTORY}" \
              --arg sourceCurrent "${SOURCE_CURRENT}" \
              --arg outputHistory "${OUTPUT_HISTORY}" \
              --arg outputCurrent "${OUTPUT_CURRENT}" \
              --arg maxDelta "${MAX_DELTA_LEDGERS}" \
              --arg segment "${SEGMENT_LEDGERS}" \
              --arg window "${READ_WINDOW_SIZE}" \
              '{ref:$ref,inputs:{source_history_branch:$sourceHistory,source_current_state_branch:$sourceCurrent,history_candidate_branch:$outputHistory,current_state_candidate_branch:$outputCurrent,max_delta_ledgers:$maxDelta,segment_ledgers:$segment,read_window_size:$window}}' \
              > "${CYCLE_ROOT}/dispatch.json"

            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/rolling-checkpoint-candidate.yml/dispatches" \
              --input "${CYCLE_ROOT}/dispatch.json"

            RUN_ID=''
            for attempt in $(seq 1 60); do
              gh api \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/rolling-checkpoint-candidate.yml/runs?event=workflow_dispatch&per_page=100" \
                > "${CYCLE_ROOT}/runs-after.json"
              while IFS= read -r candidate_id; do
                if ! grep -Fxq "${candidate_id}" "${CYCLE_ROOT}/run-ids-before.txt"; then
                  RUN_ID="${candidate_id}"
                  break
                fi
              done < <(jq -r '.workflow_runs | sort_by(.created_at) | reverse | .[].id' "${CYCLE_ROOT}/runs-after.json")
              test -n "${RUN_ID}" && break
              sleep 10
            done
            test -n "${RUN_ID}"
            printf '%s\n' "${RUN_ID}" > "${CYCLE_ROOT}/run-id.txt"

            for attempt in $(seq 1 720); do
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
                > "${CYCLE_ROOT}/run.json"
              STATUS="$(jq -r '.status' "${CYCLE_ROOT}/run.json")"
              test "${STATUS}" = completed && break
              sleep 30
            done
            test "$(jq -r '.status' "${CYCLE_ROOT}/run.json")" = completed

            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" \
              > "${CYCLE_ROOT}/jobs.json"
            for REQUIRED_STEP in \
              'Bind source pair and freeze bounded target' \
              'Generate bounded delta with configured read window' \
              'Verify delta and build target publication' \
              'Build target exact index incrementally' \
              'Build target current state from best available base' \
              'Publish history candidate branch' \
              'Publish current-state candidate branch' \
              'Rehearse remote candidate pair'; do
              jq -e --arg name "${REQUIRED_STEP}" \
                '[.jobs[].steps[] | select(.name == $name)] | length == 1 and .[0].conclusion == "success"' \
                "${CYCLE_ROOT}/jobs.json" > /dev/null
            done

            fetch_repo_json "${OUTPUT_HISTORY}" history/publication.json "${CYCLE_ROOT}/output-publication.json"
            fetch_repo_json "${OUTPUT_HISTORY}" history/index/exact/manifest.json "${CYCLE_ROOT}/output-exact-index.json"
            fetch_repo_json "${OUTPUT_HISTORY}" history-channel.json "${CYCLE_ROOT}/output-history-channel.json"
            fetch_repo_json "${OUTPUT_CURRENT}" read-model/manifest.json "${CYCLE_ROOT}/output-current-manifest.json"
            fetch_repo_json "${OUTPUT_CURRENT}" channel.json "${CYCLE_ROOT}/output-current-channel.json"

            OUTPUT_LEDGER="$(jq -r '.endLedgerIndex' "${CYCLE_ROOT}/output-publication.json")"
            OUTPUT_HASH="$(jq -r '.endLedgerHash' "${CYCLE_ROOT}/output-publication.json")"
            OUTPUT_CURRENT_LEDGER="$(jq -r '.ledgerIndex' "${CYCLE_ROOT}/output-current-manifest.json")"
            OUTPUT_CURRENT_HASH="$(jq -r '.ledgerHash' "${CYCLE_ROOT}/output-current-manifest.json")"
            test "${OUTPUT_LEDGER}" -gt "${SOURCE_LEDGER}"
            test "${OUTPUT_LEDGER}" -le "$((SOURCE_LEDGER + MAX_DELTA_LEDGERS))"
            test "${OUTPUT_LEDGER}" = "${OUTPUT_CURRENT_LEDGER}"
            test "${OUTPUT_HASH}" = "${OUTPUT_CURRENT_HASH}"
            test "$(jq -r '.complete' "${CYCLE_ROOT}/output-publication.json")" = true
            test "$(jq -r '.complete' "${CYCLE_ROOT}/output-current-manifest.json")" = true
            test "$(jq -r '.active.manifestSha256' "${CYCLE_ROOT}/output-current-channel.json")" = "$(jq -r '.manifestSha256' "${CYCLE_ROOT}/output-current-manifest.json")"

            jq -n --argjson ledger "${OUTPUT_LEDGER}" \
              '{method:"ledger",params:[{ledger_index:$ledger,transactions:false,expand:false}]}' \
              > "${CYCLE_ROOT}/output-ledger-request.json"
            curl --fail-with-body --silent --show-error --retry 3 \
              -H 'content-type: application/json' \
              --data @"${CYCLE_ROOT}/output-ledger-request.json" \
              https://devnet.honeycluster.io/ \
              > "${CYCLE_ROOT}/output-ledger-response.json"
            SOURCE_OUTPUT_HASH="$(jq -r '.result.ledger_hash // .result.ledger.ledger_hash' "${CYCLE_ROOT}/output-ledger-response.json")"
            test "${OUTPUT_HASH}" = "${SOURCE_OUTPUT_HASH}"

            LIVE_AFTER="$(capture_live_head "cycle-${CYCLE}-after")"
            LAG_AFTER="$((LIVE_AFTER - OUTPUT_LEDGER))"
            if [ "${LAG_AFTER}" -lt 0 ]; then LAG_AFTER=0; fi
            CHILD_CONCLUSION="$(jq -r '.conclusion' "${CYCLE_ROOT}/run.json")"

            jq -n \
              --argjson cycle "${CYCLE}" \
              --argjson runId "${RUN_ID}" \
              --arg childConclusion "${CHILD_CONCLUSION}" \
              --arg sourceHistory "${SOURCE_HISTORY}" \
              --arg sourceCurrent "${SOURCE_CURRENT}" \
              --argjson sourceLedger "${SOURCE_LEDGER}" \
              --arg outputHistory "${OUTPUT_HISTORY}" \
              --arg outputCurrent "${OUTPUT_CURRENT}" \
              --argjson outputLedger "${OUTPUT_LEDGER}" \
              --arg outputHash "${OUTPUT_HASH}" \
              --argjson liveLedger "${LIVE_AFTER}" \
              --argjson lagLedgers "${LAG_AFTER}" \
              '{cycle:$cycle,passed:true,childRunId:$runId,childConclusion:$childConclusion,coreCandidateStepsPassed:true,source:{historyBranch:$sourceHistory,currentStateBranch:$sourceCurrent,ledgerIndex:$sourceLedger},output:{historyBranch:$outputHistory,currentStateBranch:$outputCurrent,ledgerIndex:$outputLedger,ledgerHash:$outputHash},live:{ledgerIndex:$liveLedger,lagLedgers:$lagLedgers}}' \
              | tee "${CYCLE_ROOT}/summary.json" >> "${ROOT}/cycles.ndjson"

            SOURCE_HISTORY="${OUTPUT_HISTORY}"
            SOURCE_CURRENT="${OUTPUT_CURRENT}"
            if [ "${OUTPUT_HISTORY}" = 'history-rolling-next-candidate-data' ]; then
              OUTPUT_HISTORY='history-rolling-recovery-b-data'
              OUTPUT_CURRENT='current-state-rolling-recovery-b-data'
            else
              OUTPUT_HISTORY='history-rolling-next-candidate-data'
              OUTPUT_CURRENT='current-state-rolling-next-candidate-data'
            fi

            test "${LAG_AFTER}" -le "${TARGET_MAX_LAG_LEDGERS}" && break
          done

          jq -s '.' "${ROOT}/cycles.ndjson" > "${ROOT}/cycles.json"
          FINAL_LEDGER="$(jq -r '[.[] | select(.output != null)][-1].output.ledgerIndex // [.[] | select(.source != null)][-1].source.ledgerIndex' "${ROOT}/cycles.json")"
          FINAL_HASH="$(jq -r '[.[] | select(.output != null)][-1].output.ledgerHash // [.[] | select(.source != null)][-1].source.ledgerHash' "${ROOT}/cycles.json")"
          FINAL_HISTORY="$(jq -r '[.[] | select(.output != null)][-1].output.historyBranch // [.[] | select(.source != null)][-1].source.historyBranch' "${ROOT}/cycles.json")"
          FINAL_CURRENT="$(jq -r '[.[] | select(.output != null)][-1].output.currentStateBranch // [.[] | select(.source != null)][-1].source.currentStateBranch' "${ROOT}/cycles.json")"
          FINAL_LIVE="$(capture_live_head final)"
          FINAL_LAG="$((FINAL_LIVE - FINAL_LEDGER))"
          if [ "${FINAL_LAG}" -lt 0 ]; then FINAL_LAG=0; fi

          jq -n \
            --arg historyBranch "${FINAL_HISTORY}" \
            --arg currentStateBranch "${FINAL_CURRENT}" \
            --argjson ledgerIndex "${FINAL_LEDGER}" \
            --arg ledgerHash "${FINAL_HASH}" \
            --argjson liveLedger "${FINAL_LIVE}" \
            --argjson remainingLagLedgers "${FINAL_LAG}" \
            --argjson targetMaxLagLedgers "${TARGET_MAX_LAG_LEDGERS}" \
            --slurpfile cycles "${ROOT}/cycles.json" \
            '{passed:($remainingLagLedgers <= $targetMaxLagLedgers),finalCandidate:{historyBranch:$historyBranch,currentStateBranch:$currentStateBranch,ledgerIndex:$ledgerIndex,ledgerHash:$ledgerHash},live:{ledgerIndex:$liveLedger,remainingLagLedgers:$remainingLagLedgers,targetMaxLagLedgers:$targetMaxLagLedgers},cycles:$cycles[0]}' \
            | tee "${ROOT}/summary.json"

          jq -e '.passed == true' "${ROOT}/summary.json" > /dev/null

      - name: Upload catch-up batch evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: history-catchup-batch
          path: history-catchup-cycle
          if-no-files-found: warn
          retention-days: 30
