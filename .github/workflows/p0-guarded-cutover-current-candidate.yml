name: P0 guarded cutover current candidate

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: p0-guarded-cutover-current-candidate
  cancel-in-progress: false

jobs:
  cutover:
    if: startsWith(github.event.issue.title, 'P0 guarded cutover current candidate')
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      MAX_CUTOVER_LAG: '720'
      CANDIDATE_HISTORY_A: history-rolling-maintenance-candidate-data
      CANDIDATE_CURRENT_A: current-state-rolling-maintenance-candidate-data
      CANDIDATE_HISTORY_B: history-rolling-recovery-b-data
      CANDIDATE_CURRENT_B: current-state-rolling-recovery-b-data
    steps:
      - name: Select and verify latest aligned candidate
        shell: bash
        run: |
          set -euo pipefail
          ROOT=p0-guarded-cutover-current
          mkdir -p "$ROOT"

          fetch_json() {
            local branch="$1" path="$2" output="$3"
            gh api "repos/${REPOSITORY}/contents/${path}?ref=${branch}" --jq '.content' \
              | tr -d '\n' | base64 --decode > "$output"
            test -s "$output"
          }

          pair() {
            local h="$1" c="$2" p="$3"
            fetch_json "$h" history/publication.json "$ROOT/${p}-publication.json" || return 1
            fetch_json "$c" read-model/manifest.json "$ROOT/${p}-manifest.json" || return 1
            local hl hh cl ch he ce
            hl=$(jq -r '.endLedgerIndex // empty' "$ROOT/${p}-publication.json")
            hh=$(jq -r '.endLedgerHash // empty' "$ROOT/${p}-publication.json")
            cl=$(jq -r '.ledgerIndex // empty' "$ROOT/${p}-manifest.json")
            ch=$(jq -r '.ledgerHash // empty' "$ROOT/${p}-manifest.json")
            he=$(jq -r '.epochId // empty' "$ROOT/${p}-publication.json")
            ce=$(jq -r '.epochId // empty' "$ROOT/${p}-manifest.json")
            test "$(jq -r '.complete' "$ROOT/${p}-publication.json")" = true
            test "$(jq -r '.complete' "$ROOT/${p}-manifest.json")" = true
            test "$hl" = "$cl"; test "$hh" = "$ch"
            test "$he" = devnet-3371675; test "$ce" = devnet-3371675
            printf '%s\t%s\t%s\t%s\n' "$hl" "$hh" "$h" "$c"
          }

          A=$(pair "$CANDIDATE_HISTORY_A" "$CANDIDATE_CURRENT_A" A 2>/dev/null || true)
          B=$(pair "$CANDIDATE_HISTORY_B" "$CANDIDATE_CURRENT_B" B 2>/dev/null || true)
          test -n "$A" || test -n "$B"
          if test -n "$A" && { test -z "$B" || test "$(printf '%s' "$A" | cut -f1)" -ge "$(printf '%s' "$B" | cut -f1)"; }; then BEST="$A"; else BEST="$B"; fi

          TARGET_LEDGER=$(printf '%s' "$BEST" | cut -f1)
          TARGET_HASH=$(printf '%s' "$BEST" | cut -f2)
          HISTORY_BRANCH=$(printf '%s' "$BEST" | cut -f3)
          CURRENT_BRANCH=$(printf '%s' "$BEST" | cut -f4)

          HEAD_A=$(curl --fail-with-body --silent --show-error --retry 3 -H 'content-type: application/json' \
            --data '{"method":"ledger","params":[{"ledger_index":"validated","transactions":false,"expand":false}]}' \
            https://devnet.honeycluster.io/ | jq -r '.result.ledger_index // .result.ledger.ledger_index')
          HEAD_B=$(curl --fail-with-body --silent --show-error --retry 3 -H 'content-type: application/json' \
            --data '{"method":"ledger","params":[{"ledger_index":"validated","transactions":false,"expand":false}]}' \
            https://s.devnet.rippletest.net:51234/ | jq -r '.result.ledger_index // .result.ledger.ledger_index')
          LIVE_HEAD="$HEAD_A"; test "$HEAD_B" -le "$LIVE_HEAD" || LIVE_HEAD="$HEAD_B"
          LAG=$((LIVE_HEAD - TARGET_LEDGER)); test "$LAG" -ge 0 || LAG=0
          test "$LAG" -le "$MAX_CUTOVER_LAG"

          for endpoint in https://devnet.honeycluster.io/ https://s.devnet.rippletest.net:51234/; do
            REMOTE_HASH=$(curl --fail-with-body --silent --show-error --retry 3 -H 'content-type: application/json' \
              --data "{\"method\":\"ledger\",\"params\":[{\"ledger_index\":${TARGET_LEDGER},\"transactions\":false,\"expand\":false}]}" \
              "$endpoint" | jq -r '.result.ledger_hash // .result.ledger.ledger_hash')
            test "$REMOTE_HASH" = "$TARGET_HASH"
          done

          jq -n --arg history "$HISTORY_BRANCH" --arg current "$CURRENT_BRANCH" --argjson ledger "$TARGET_LEDGER" \
            --arg hash "$TARGET_HASH" --argjson live "$LIVE_HEAD" --argjson lag "$LAG" \
            '{verified:true,candidate:{historyBranch:$history,currentStateBranch:$current,ledgerIndex:$ledger,ledgerHash:$hash},live:{ledgerIndex:$live,lagLedgers:$lag},maxLagLedgers:720}' \
            > "$ROOT/selected-candidate.json"
          echo "HISTORY_BRANCH=$HISTORY_BRANCH" >> "$GITHUB_ENV"
          echo "CURRENT_BRANCH=$CURRENT_BRANCH" >> "$GITHUB_ENV"
          echo "TARGET_LEDGER=$TARGET_LEDGER" >> "$GITHUB_ENV"
          echo "TARGET_HASH=$TARGET_HASH" >> "$GITHUB_ENV"

      - name: Dispatch and verify guarded production cutover
        shell: bash
        run: |
          set -euo pipefail
          ROOT=p0-guarded-cutover-current
          gh api "repos/${REPOSITORY}/actions/workflows/rolling-checkpoint-live-cutover.yml/runs?event=workflow_dispatch&per_page=100" \
            --jq '.workflow_runs[].id' > "$ROOT/cutover-before.txt"
          jq -n --arg ref main --arg history "$HISTORY_BRANCH" --arg current "$CURRENT_BRANCH" \
            '{ref:$ref,inputs:{history_candidate_branch:$history,current_state_candidate_branch:$current,confirm_production_write:"true"}}' \
            > "$ROOT/cutover-dispatch.json"
          gh api --method POST "repos/${REPOSITORY}/actions/workflows/rolling-checkpoint-live-cutover.yml/dispatches" \
            --input "$ROOT/cutover-dispatch.json"

          CUTOVER_RUN_ID=''
          for attempt in $(seq 1 60); do
            gh api "repos/${REPOSITORY}/actions/workflows/rolling-checkpoint-live-cutover.yml/runs?event=workflow_dispatch&per_page=100" > "$ROOT/cutover-after.json"
            CUTOVER_RUN_ID=$(jq -r '.workflow_runs | sort_by(.created_at) | reverse | .[].id' "$ROOT/cutover-after.json" | while read id; do grep -Fxq "$id" "$ROOT/cutover-before.txt" || { echo "$id"; break; }; done)
            test -n "$CUTOVER_RUN_ID" && break
            sleep 5
          done
          test -n "$CUTOVER_RUN_ID"
          printf '%s\n' "$CUTOVER_RUN_ID" > "$ROOT/cutover-run-id.txt"

          for attempt in $(seq 1 200); do
            gh api "repos/${REPOSITORY}/actions/runs/${CUTOVER_RUN_ID}" > "$ROOT/cutover-run.json"
            test "$(jq -r '.status' "$ROOT/cutover-run.json")" = completed && break
            sleep 30
          done
          test "$(jq -r '.status' "$ROOT/cutover-run.json")" = completed
          gh api "repos/${REPOSITORY}/actions/runs/${CUTOVER_RUN_ID}/jobs?per_page=100" > "$ROOT/cutover-jobs.json"
          test "$(jq -r '.conclusion' "$ROOT/cutover-run.json")" = success
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" \
            --body "Guarded production cutover succeeded from candidate ledger ${TARGET_LEDGER} (${TARGET_HASH}). Cutover run: ${CUTOVER_RUN_ID}."

      - name: Preserve dynamic cutover evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-guarded-cutover-current-${{ github.run_id }}
          path: p0-guarded-cutover-current
          if-no-files-found: warn
          retention-days: 30
