name: R5 collector runs retention rewrite

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: r5-collector-runs-retention-rewrite
  cancel-in-progress: false

env:
  QUALIFICATION_ISSUE: '1261'
  MANAGER_PATH: scripts/manage-r5-collector-runs-retention-rewrite.mjs
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
  GH_TOKEN: ${{ github.token }}

jobs:
  prepare:
    if: >-
      github.event.issue.number == 1261 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      github.event.comment.body == '/r5-collector-runs-retention-rewrite-prepare'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Inspect exact collector retention state read-only
        id: state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r5-collector-runs-retention-rewrite-evidence
          source_commit="$(git rev-parse HEAD)"
          manager_sha="$(sha256sum "$MANAGER_PATH" | awk '{print $1}')"
          node "$MANAGER_PATH" prepare \
            --source-commit "$source_commit" \
            --output r5-collector-runs-retention-rewrite-evidence/prepare.json \
            > r5-collector-runs-retention-rewrite-evidence/prepare.stdout.json \
            2> r5-collector-runs-retention-rewrite-evidence/prepare.stderr.log
          cp r5-collector-runs-retention-rewrite-evidence/prepare.stdout.json /tmp/prepare.json
          test "$(jq -r '.retentionMutationAuthorized' /tmp/prepare.json)" = false
          test "$(jq -r '.physicalRewriteAuthorized' /tmp/prepare.json)" = false
          test "$(jq -r '.sequenceMutationAuthorized' /tmp/prepare.json)" = false
          test "$(jq -r '.schedulerMutationAuthorized' /tmp/prepare.json)" = false
          test "$(jq -r '.r5RearmAuthorized' /tmp/prepare.json)" = false
          printf 'source_commit=%s\nmanager_sha=%s\nstate_sha=%s\ndata_sha=%s\nplan_sha=%s\nproject_digest=%s\nmutation_sha=%s\ndatabase_bytes=%s\nrelation_bytes=%s\nrows=%s\nretained_rows=%s\ncandidate_rows=%s\nretained_digest=%s\nretained_min_id=%s\nretained_max_id=%s\nsequence_last=%s\nsequence_called=%s\nhead=%s\n' \
            "$source_commit" "$manager_sha" \
            "$(jq -r '.structuralStateSha256' /tmp/prepare.json)" \
            "$(jq -r '.dataStateSha256' /tmp/prepare.json)" \
            "$(jq -r '.planSha256' /tmp/prepare.json)" \
            "$(jq -r '.structuralState.projectIdentityDigest' /tmp/prepare.json)" \
            "$(jq -r '.mutation.sha256' /tmp/prepare.json)" \
            "$(jq -r '.databaseBytes' /tmp/prepare.json)" \
            "$(jq -r '.relationBytes' /tmp/prepare.json)" \
            "$(jq -r '.exactRows' /tmp/prepare.json)" \
            "$(jq -r '.retainedRows' /tmp/prepare.json)" \
            "$(jq -r '.candidateRows' /tmp/prepare.json)" \
            "$(jq -r '.retainedDigest' /tmp/prepare.json)" \
            "$(jq -r '.retainedMinId' /tmp/prepare.json)" \
            "$(jq -r '.retainedMaxId' /tmp/prepare.json)" \
            "$(jq -r '.sequenceState.lastValue' /tmp/prepare.json)" \
            "$(jq -r '.sequenceState.isCalled' /tmp/prepare.json)" \
            "$(jq -r '.maxMigrationVersion' /tmp/prepare.json)" >> "$GITHUB_OUTPUT"

      - name: Publish expiring owner authorization proposal
        env:
          SOURCE_COMMIT: ${{ steps.state.outputs.source_commit }}
          MANAGER_SHA: ${{ steps.state.outputs.manager_sha }}
          STATE_SHA: ${{ steps.state.outputs.state_sha }}
          DATA_SHA: ${{ steps.state.outputs.data_sha }}
          PLAN_SHA: ${{ steps.state.outputs.plan_sha }}
          PROJECT_DIGEST: ${{ steps.state.outputs.project_digest }}
          MUTATION_SHA: ${{ steps.state.outputs.mutation_sha }}
          DATABASE_BYTES: ${{ steps.state.outputs.database_bytes }}
          RELATION_BYTES: ${{ steps.state.outputs.relation_bytes }}
          ROWS: ${{ steps.state.outputs.rows }}
          RETAINED_ROWS: ${{ steps.state.outputs.retained_rows }}
          CANDIDATE_ROWS: ${{ steps.state.outputs.candidate_rows }}
          RETAINED_DIGEST: ${{ steps.state.outputs.retained_digest }}
          RETAINED_MIN_ID: ${{ steps.state.outputs.retained_min_id }}
          RETAINED_MAX_ID: ${{ steps.state.outputs.retained_max_id }}
          SEQUENCE_LAST: ${{ steps.state.outputs.sequence_last }}
          SEQUENCE_CALLED: ${{ steps.state.outputs.sequence_called }}
          HEAD: ${{ steps.state.outputs.head }}
        shell: bash
        run: |
          set -euo pipefail
          expires="$(date -u -d '+2 hours' '+%Y-%m-%dT%H:%M:%SZ')"
          nonce="$(openssl rand -hex 8)"
          command="/r5-collector-runs-retention-rewrite-authorize commit=${SOURCE_COMMIT} manager=${MANAGER_SHA} state=${STATE_SHA} data=${DATA_SHA} plan=${PLAN_SHA} project=${PROJECT_DIGEST} mutation=${MUTATION_SHA} head=${HEAD} prepare_run=${GITHUB_RUN_ID} expires=${expires} nonce=${nonce}"
          cat > /tmp/proposal.md <<EOF2
          ## R5 collector run history retention + physical rewrite authorization proposal

          - preparation run: \`${GITHUB_RUN_ID}\`
          - source main: \`${SOURCE_COMMIT}\`
          - manager SHA-256: \`${MANAGER_SHA}\`
          - structural state SHA-256: \`${STATE_SHA}\`
          - data state SHA-256: \`${DATA_SHA}\`
          - plan SHA-256: \`${PLAN_SHA}\`
          - project identity digest: \`${PROJECT_DIGEST}\`
          - exact mutation SHA-256: \`${MUTATION_SHA}\`
          - migration head: \`${HEAD}\`
          - database / collector relation bytes: \`${DATABASE_BYTES} / ${RELATION_BYTES}\`
          - rows before / retained / historical candidates: \`${ROWS} / ${RETAINED_ROWS} / ${CANDIDATE_ROWS}\`
          - retained ID range: \`${RETAINED_MIN_ID}..${RETAINED_MAX_ID}\`
          - retained digest: \`${RETAINED_DIGEST}\`
          - identity sequence last / called: \`${SEQUENCE_LAST} / ${SEQUENCE_CALLED}\`
          - expires: \`${expires}\`

          This authorizes exactly one bounded retention rewrite of \`public.xrpl_collector_runs\`: retain the latest 256 rows by \`completed_at DESC, id DESC\`, acquire an ACCESS EXCLUSIVE lock with a 5-second lock timeout, copy exactly those rows to a temporary table, TRUNCATE only \`xrpl_collector_runs\` without CASCADE or RESTART IDENTITY, restore the same IDs with \`OVERRIDING SYSTEM VALUE\`, require exact retained digest/ID range and unchanged identity sequence before commit, then perform a separate read-only post-commit verification.

          This removes only historical collector execution rows outside the latest 256. It does not authorize scheduler changes, phase work/messages/successors/reference history mutation, archive movement, deployment, public-reader changes, Mainnet, stabilization, soak, or R5 restart.

          Exact owner authorization command:

          \`${command}\`
          EOF2
          gh issue comment "$QUALIFICATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/proposal.md

      - name: Upload preparation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r5-collector-runs-retention-rewrite-prepare-evidence
          path: r5-collector-runs-retention-rewrite-evidence
          if-no-files-found: warn
          retention-days: 14

  execute:
    if: >-
      github.event.issue.number == 1261 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      startsWith(github.event.comment.body, '/r5-collector-runs-retention-rewrite-authorize ')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AUTHORIZATION_BODY: ${{ github.event.comment.body }}
      AUTHORIZATION_CREATED_AT: ${{ github.event.comment.created_at }}
      AUTHORIZATION_COMMENT_ID: ${{ github.event.comment.id }}
    steps:
      - name: Check out exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Parse exact owner authorization
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          regex='^/r5-collector-runs-retention-rewrite-authorize commit=([a-f0-9]{40}) manager=([a-f0-9]{64}) state=([a-f0-9]{64}) data=([a-f0-9]{64}) plan=([a-f0-9]{64}) project=([a-f0-9]{64}) mutation=([a-f0-9]{64}) head=([0-9]{14}) prepare_run=([0-9]+) expires=([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z) nonce=([a-f0-9]{16})$'
          [[ "$AUTHORIZATION_BODY" =~ $regex ]] || { echo 'authorization shape mismatch' >&2; exit 1; }
          commit="${BASH_REMATCH[1]}"; manager_sha="${BASH_REMATCH[2]}"; state_sha="${BASH_REMATCH[3]}"; data_sha="${BASH_REMATCH[4]}"; plan_sha="${BASH_REMATCH[5]}"; project_digest="${BASH_REMATCH[6]}"; mutation_sha="${BASH_REMATCH[7]}"; head="${BASH_REMATCH[8]}"; prepare_run="${BASH_REMATCH[9]}"; expires="${BASH_REMATCH[10]}"; nonce="${BASH_REMATCH[11]}"
          test "$commit" = "$(git rev-parse HEAD)"
          test "$manager_sha" = "$(sha256sum "$MANAGER_PATH" | awk '{print $1}')"
          test "$project_digest" = "$(printf '%s' "$SUPABASE_PROJECT_ID" | sha256sum | awk '{print $1}')"
          test "$head" = '20260816050000'
          now_epoch="$(date -u +%s)"; expires_epoch="$(date -u -d "$expires" +%s)"; auth_epoch="$(date -u -d "$AUTHORIZATION_CREATED_AT" +%s)"
          test "$auth_epoch" -lt "$expires_epoch"; test "$now_epoch" -le "$expires_epoch"; test $((expires_epoch-auth_epoch)) -le 7200
          printf 'commit=%s\nstate_sha=%s\ndata_sha=%s\nplan_sha=%s\nmutation_sha=%s\nprepare_run=%s\n' "$commit" "$state_sha" "$data_sha" "$plan_sha" "$mutation_sha" "$prepare_run" >> "$GITHUB_OUTPUT"

      - name: Verify exact prior proposal and unique owner authorization
        env:
          PREPARE_RUN: ${{ steps.auth.outputs.prepare_run }}
          COMMIT: ${{ steps.auth.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREPARE_RUN}" > /tmp/prepare-run.json
          jq -e --arg commit "$COMMIT" '.event=="issue_comment" and .conclusion=="success" and .head_sha==$commit and .actor.login=="badjoke-lab"' /tmp/prepare-run.json >/dev/null
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${QUALIFICATION_ISSUE}/comments?per_page=100" | jq -s 'add' > /tmp/comments.json
          EXPECTED="$AUTHORIZATION_BODY" PREPARE_RUN="$PREPARE_RUN" AUTH_ID="$AUTHORIZATION_COMMENT_ID" AUTH_CREATED_AT="$AUTHORIZATION_CREATED_AT" node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const comments=JSON.parse(readFileSync('/tmp/comments.json','utf8')); const expected=process.env.EXPECTED; const run=process.env.PREPARE_RUN; const authAt=Date.parse(process.env.AUTH_CREATED_AT)
          const proposals=comments.filter(c=>c?.user?.login==='github-actions[bot]'&&c?.body?.includes(`preparation run: \`${run}\``)&&c?.body?.includes(`\`${expected}\``))
          if(proposals.length!==1||!(Date.parse(proposals[0].created_at)<authAt)) throw new Error('exact prior proposal missing or late')
          const owners=comments.filter(c=>c?.user?.login==='badjoke-lab'&&c?.body===expected)
          if(owners.length!==1||Number(owners[0].id)!==Number(process.env.AUTH_ID)) throw new Error('owner authorization is not unique')
          NODE

      - name: Revalidate exact authorized state read-only
        env:
          COMMIT: ${{ steps.auth.outputs.commit }}
          STATE_SHA: ${{ steps.auth.outputs.state_sha }}
          DATA_SHA: ${{ steps.auth.outputs.data_sha }}
          PLAN_SHA: ${{ steps.auth.outputs.plan_sha }}
          MUTATION_SHA: ${{ steps.auth.outputs.mutation_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r5-collector-runs-retention-rewrite-evidence
          node "$MANAGER_PATH" prepare --source-commit "$COMMIT" --output r5-collector-runs-retention-rewrite-evidence/pre-apply.json > /tmp/pre.json
          test "$(jq -r '.structuralStateSha256' /tmp/pre.json)" = "$STATE_SHA"
          test "$(jq -r '.dataStateSha256' /tmp/pre.json)" = "$DATA_SHA"
          test "$(jq -r '.planSha256' /tmp/pre.json)" = "$PLAN_SHA"
          test "$(jq -r '.mutation.sha256' /tmp/pre.json)" = "$MUTATION_SHA"

      - name: Apply exact bounded collector retention rewrite
        id: apply
        env:
          COMMIT: ${{ steps.auth.outputs.commit }}
          STATE_SHA: ${{ steps.auth.outputs.state_sha }}
          DATA_SHA: ${{ steps.auth.outputs.data_sha }}
          PLAN_SHA: ${{ steps.auth.outputs.plan_sha }}
          MUTATION_SHA: ${{ steps.auth.outputs.mutation_sha }}
        shell: bash
        run: |
          set -euo pipefail
          node "$MANAGER_PATH" apply \
            --source-commit "$COMMIT" \
            --authorized-state "$STATE_SHA" \
            --authorized-data "$DATA_SHA" \
            --authorized-plan "$PLAN_SHA" \
            --authorized-mutation "$MUTATION_SHA" \
            --output r5-collector-runs-retention-rewrite-evidence/apply.json \
            2>&1 | tee r5-collector-runs-retention-rewrite-evidence/apply.log

      - name: Upload application evidence
        if: always() && steps.auth.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: r5-collector-runs-retention-rewrite-apply-evidence
          path: r5-collector-runs-retention-rewrite-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Publish bounded result
        if: always() && steps.apply.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          jq -r '"## R5 collector run retention + physical rewrite — PASS\n\n- rows before/after: `\(.rowsBefore) / \(.rowsAfter)`\n- retained digest preserved: `\(.retainedDigestBefore == .retainedDigestAfter)`\n- retained ID range: `\(.retainedMinId)..\(.retainedMaxId)`\n- sequence preserved: `\(.sequenceBefore == .sequenceAfter)`\n- relation bytes before/after/reclaimed: `\(.relationBytesBefore) / \(.relationBytesAfter) / \(.relationBytesReclaimed)`\n- database bytes before/after/reclaimed: `\(.databaseBytesBefore) / \(.databaseBytesAfter) / \(.databaseBytesReclaimed)`\n- R5 active run unchanged: `\(.activeRunBefore == .activeRunAfter)`\n- scheduler unchanged: `\(.schedulerBefore == .schedulerAfter)`\n- scheduler/deployment/public-reader/Mainnet/R5 rearm performed: `false / false / false / false / false`\n\nThis run removed only historical collector execution rows outside the latest 256. It did not authorize phase-history mutation, archive movement, scheduler/deployment/public-reader/Mainnet changes, stabilization, soak, or R5 restart."' r5-collector-runs-retention-rewrite-evidence/apply.json > /tmp/result.md
          gh issue comment "$QUALIFICATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/result.md
