name: Apply partitioned combined-history build

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/workflows/apply-partitioned-combined-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Replace monolithic build with partitioned implementation
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          cat > /tmp/exact.ts.gz.b64 <<'PAYLOAD'

PAYLOAD
          cat > /tmp/workflow.yml.gz.b64 <<'PAYLOAD'

PAYLOAD
          base64 -d /tmp/exact.ts.gz.b64 | gzip -d > scripts/build-incremental-history-exact-index.ts
          base64 -d /tmp/workflow.yml.gz.b64 | gzip -d > .github/workflows/build-combined-history-3932301.yml
          rm -f \
            .github/workflows/cancel-combined-run-30322659427.yml \
            .github/workflows/capture-combined-failure-30320403596.yml \
            .github/workflows/apply-partitioned-combined-fix.yml
          test "$(wc -l < scripts/build-incremental-history-exact-index.ts)" -eq 550
          test "$(wc -l < .github/workflows/build-combined-history-3932301.yml)" -eq 624
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Partition combined exact-index build across bounded jobs"
          git push origin "HEAD:refs/heads/$HEAD_BRANCH"
