name: Diagnose candidate rehearsal 3575657

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-candidate-rehearsal-3575657.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:candidate-source-rehearsal
      - name: Capture rehearsal stdout and stderr
        shell: bash
        run: |
          set +e
          mkdir -p candidate-diagnostic
          node .candidate-source-rehearsal-build/rehearse-candidate-sources.mjs \
            --local \
            --repository badjoke-lab/xrpl-lending-monitor \
            --history-branch history-rolling-recovery-b-data \
            --current-state-branch current-state-rolling-recovery-b-data \
            > candidate-diagnostic/stdout.json \
            2> candidate-diagnostic/stderr.txt
          STATUS=$?
          printf '%s\n' "${STATUS}" > candidate-diagnostic/exit-code.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-rehearsal-diagnostic-3575657
          path: candidate-diagnostic
          if-no-files-found: error
          retention-days: 30
