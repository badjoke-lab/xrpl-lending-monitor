name: Final pre-soak acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/final-pre-soak-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final-pre-soak-acceptance
  cancel-in-progress: true

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      BASE: https://xrpl-lending-monitor.badjoke-lab.workers.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Wait for current-architecture readiness and fresh public watermark
        shell: bash
        run: |
          set -euo pipefail
          ROOT=final-pre-soak-acceptance
          mkdir -p "$ROOT"
          : > "$ROOT/freshness-attempts.ndjson"
          for attempt in $(seq 1 480); do
            readiness_status="$(curl --silent --show-error --retry 2 \
              -o "$ROOT/readiness-probe.json" -w '%{http_code}' \
              "$BASE/api/status/pre-soak-readiness" || true)"
            curl --fail-with-body --silent --show-error --retry 2 "$BASE/api/overview" > "$ROOT/overview-probe.json" || true
            jq -n '{method:"ledger",params:[{ledger_index:"validated",transactions:false,expand:false}]}' > "$ROOT/head-request.json"
            curl --fail-with-body --silent --show-error --retry 2 -H 'content-type: application/json' --data @"$ROOT/head-request.json" https://devnet.honeycluster.io/ > "$ROOT/head-primary-probe.json" || true
            curl --fail-with-body --silent --show-error --retry 2 -H 'content-type: application/json' --data @"$ROOT/head-request.json" https://s.devnet.rippletest.net:51234/ > "$ROOT/head-fallback-probe.json" || true

            source="$(jq -r '.current_state_watermark.source // empty' "$ROOT/overview-probe.json" 2>/dev/null || true)"
            current="$(jq -r '.current_state_watermark.ledger_index // 0' "$ROOT/overview-probe.json" 2>/dev/null || echo 0)"
            updated="$(jq -r '.current_state_watermark.updated_at // empty' "$ROOT/overview-probe.json" 2>/dev/null || true)"
            primary="$(jq -r '.result.ledger_index // .result.ledger.ledger_index // 0' "$ROOT/head-primary-probe.json" 2>/dev/null || echo 0)"
            fallback="$(jq -r '.result.ledger_index // .result.ledger.ledger_index // 0' "$ROOT/head-fallback-probe.json" 2>/dev/null || echo 0)"
            live="$primary"
            if [ "$fallback" -gt 0 ] && { [ "$live" -eq 0 ] || [ "$fallback" -lt "$live" ]; }; then live="$fallback"; fi
            lag="$((live-current))"; [ "$lag" -lt 0 ] && lag=0
            age=999999
            if [ -n "$updated" ]; then
              epoch="$(date -u -d "$updated" +%s 2>/dev/null || echo 0)"
              [ "$epoch" -gt 0 ] && age="$(( $(date -u +%s) - epoch ))"
              [ "$age" -lt 0 ] && age=0
            fi
            ready="$(jq -r '.passed // false' "$ROOT/readiness-probe.json" 2>/dev/null || echo false)"
            jq -n \
              --argjson attempt "$attempt" \
              --argjson readinessHttpStatus "${readiness_status:-0}" \
              --arg ready "$ready" \
              --arg source "$source" \
              --argjson current "$current" \
              --argjson live "$live" \
              --argjson lag "$lag" \
              --argjson age "$age" \
              '{attempt:$attempt,readinessHttpStatus:$readinessHttpStatus,readinessPassed:($ready=="true"),source:$source,currentLedger:$current,liveLedger:$live,lagLedgers:$lag,ageSeconds:$age}' \
              >> "$ROOT/freshness-attempts.ndjson"

            if [ "$readiness_status" = 200 ] \
              && [ "$ready" = true ] \
              && [ "$source" = fast_lane ] \
              && [ "$current" -gt 0 ] \
              && [ "$lag" -le 10 ] \
              && [ "$age" -le 600 ]; then
              cp "$ROOT/readiness-probe.json" "$ROOT/pre-soak-readiness.json"
              cp "$ROOT/overview-probe.json" "$ROOT/overview.json"
              cp "$ROOT/head-primary-probe.json" "$ROOT/head-primary.json"
              cp "$ROOT/head-fallback-probe.json" "$ROOT/head-fallback.json"
              touch "$ROOT/fresh"
              break
            fi
            sleep 5
          done
          test -f "$ROOT/fresh"

      - name: Capture Cloudflare runtime and exact watermark ledgers
        shell: bash
        run: |
          set -euo pipefail
          ROOT=final-pre-soak-acceptance
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          curl --fail-with-body --silent --show-error "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/xrpl-lending-monitor/settings" > "$ROOT/settings.json"
          curl --fail-with-body --silent --show-error "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/xrpl-lending-monitor/schedules" > "$ROOT/schedules.json"
          ledger="$(jq -r '.current_state_watermark.ledger_index' "$ROOT/overview.json")"
          jq -n --argjson ledger "$ledger" '{method:"ledger",params:[{ledger_index:$ledger,transactions:false,expand:false}]}' > "$ROOT/exact-ledger-request.json"
          curl --fail-with-body --silent --show-error --retry 3 -H 'content-type: application/json' --data @"$ROOT/exact-ledger-request.json" https://devnet.honeycluster.io/ > "$ROOT/exact-primary.json"
          curl --fail-with-body --silent --show-error --retry 3 -H 'content-type: application/json' --data @"$ROOT/exact-ledger-request.json" https://s.devnet.rippletest.net:51234/ > "$ROOT/exact-fallback.json"

      - name: Evaluate all pre-soak runtime gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime, json, pathlib
          root=pathlib.Path('final-pre-soak-acceptance')
          def load(name): return json.loads((root/name).read_text())
          def ledger_identity(data):
              result=data.get('result',{})
              ledger=result.get('ledger',{}) if isinstance(result.get('ledger'),dict) else {}
              return (
                  int(result.get('ledger_index') or ledger.get('ledger_index') or ledger.get('seqNum') or 0),
                  result.get('ledger_hash') or ledger.get('ledger_hash') or ledger.get('hash'),
              )
          def binding(settings,name):
              for item in settings.get('result',{}).get('bindings',[]):
                  if item.get('name')==name: return item.get('text',item.get('value'))
              return None

          readiness=load('pre-soak-readiness.json')
          overview=load('overview.json')
          settings=load('settings.json')
          schedules=load('schedules.json')
          public=overview.get('current_state_watermark') or {}
          public_ledger=int(public.get('ledger_index') or 0)
          public_hash=public.get('ledger_hash')
          primary=ledger_identity(load('exact-primary.json'))
          fallback=ledger_identity(load('exact-fallback.json'))
          readiness_checks=readiness.get('checks') or {}

          checks={
              'current_architecture_readiness_passed': readiness.get('passed') is True,
              'every_readiness_check_passed': bool(readiness_checks) and all(item.get('passed') is True for item in readiness_checks.values()),
              'public_source_fast_lane': public.get('source')=='fast_lane',
              'primary_exact_ledger_matches_public': primary==(public_ledger,public_hash),
              'fallback_exact_ledger_matches_public': fallback==(public_ledger,public_hash),
              'devnet_runtime': binding(settings,'APP_NETWORK')=='devnet',
              'mainnet_disabled': str(binding(settings,'MAINNET_ENABLED')).lower()=='false',
              'single_five_minute_cron': [x.get('cron') for x in schedules.get('result',{}).get('schedules',[])]==['*/5 * * * *'],
          }
          summary={
              'generatedAt':datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'),
              'architecture':readiness.get('architecture'),
              'publicWatermark':public,
              'exactSourceLedgers':{
                  'honeycluster':{'ledgerIndex':primary[0],'ledgerHash':primary[1]},
                  'rippleDevnet':{'ledgerIndex':fallback[0],'ledgerHash':fallback[1]},
              },
              'runtime':{
                  'appNetwork':binding(settings,'APP_NETWORK'),
                  'mainnetEnabled':binding(settings,'MAINNET_ENABLED'),
                  'crons':[x.get('cron') for x in schedules.get('result',{}).get('schedules',[])],
              },
              'readiness':readiness,
              'checks':checks,
              'passed':all(checks.values()),
          }
          (root/'summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          raise SystemExit(0 if summary['passed'] else 2)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-pre-soak-acceptance
          path: final-pre-soak-acceptance
          if-no-files-found: error
          retention-days: 30
