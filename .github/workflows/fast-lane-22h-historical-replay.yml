name: Fast lane 22h historical replay

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/measure-fast-lane-22h-history.mjs'
      - '.github/workflows/fast-lane-22h-historical-replay.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/fast-lane-22h-historical-replay.yml'
      - 'scripts/measure-fast-lane-22h-history.mjs'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Replay most recent 22 hours into five-minute windows
        run: |
          node scripts/measure-fast-lane-22h-history.mjs \
            --lookback-seconds 79200 \
            --max-ledgers 27000 \
            --read-window 12 \
            --output /tmp/fast-lane-22h-history.json
          jq -e '.mode == "historical-22h-five-minute-replay" and .coverage.complete == true and .coverage.fiveMinuteWindows == 264' /tmp/fast-lane-22h-history.json > /dev/null
      - name: Upload replay evidence
        uses: actions/upload-artifact@v4
        with:
          name: fast-lane-22h-historical-replay
          path: /tmp/fast-lane-22h-history.json
          if-no-files-found: error
          retention-days: 14
