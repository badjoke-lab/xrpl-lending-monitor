name: Rehearse immutable-history candidate 3932301

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/rehearse-history-candidate-3932301.yml
      - scripts/diagnose-remote-history-terms.ts
      - vite.remote-history-term-diagnostic.config.ts

permissions:
  contents: read

concurrency:
  group: rehearse-history-candidate-3932301
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build remote exact-term diagnostic
        run: pnpm exec vite build --config vite.remote-history-term-diagnostic.config.ts

      - name: Compare candidate and production exact terms
        shell: bash
        run: |
          set -euo pipefail
          rm -rf candidate-rehearsal-evidence
          mkdir -p candidate-rehearsal-evidence
          node .remote-history-term-diagnostic-build/diagnose-remote-history-terms.mjs \
            > candidate-rehearsal-evidence/term-diagnostic.json \
            2> candidate-rehearsal-evidence/term-diagnostic.stderr.log
          jq . candidate-rehearsal-evidence/term-diagnostic.json
          cat candidate-rehearsal-evidence/term-diagnostic.stderr.log || true
          printf '%s\n' "$(git rev-parse HEAD)" > candidate-rehearsal-evidence/diagnostic-sha.txt

      - name: Upload candidate rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immutable-history-candidate-term-diagnostic-3932301
          path: candidate-rehearsal-evidence
          if-no-files-found: error
          retention-days: 30
