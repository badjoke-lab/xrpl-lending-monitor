name: R5 work status partial-index apply

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: r5-work-status-partial-index-apply
  cancel-in-progress: false

env:
  QUALIFICATION_ISSUE: '1261'
  MANAGER_PATH: scripts/manage-r5-work-status-partial-index.mjs
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
  GH_TOKEN: ${{ github.token }}

jobs:
  prepare:
    if: >-
      github.event.issue.number == 1261 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      github.event.comment.body == '/r5-work-status-index-prepare'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Inspect exact work-status pre-state read-only
        id: state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r5-work-status-partial-index-evidence
          source_commit="$(git rev-parse HEAD)"
          manager_sha="$(sha256sum "$MANAGER_PATH" | awk '{print $1}')"
          node "$MANAGER_PATH" prepare \
            --source-commit "$source_commit" \
            --output r5-work-status-partial-index-evidence/prepare.json \
            > /tmp/r5-work-status-index-prepare.json
          test "$(jq -r '.workStatusIndexShape' /tmp/r5-work-status-index-prepare.json)" = full
          test "$(jq -r '.temporaryIndexExists' /tmp/r5-work-status-index-prepare.json)" = false
          test "$(jq -r '.committedReaderValid' /tmp/r5-work-status-index-prepare.json)" = true
          test "$(jq -r '.indexMutationAuthorized' /tmp/r5-work-status-index-prepare.json)" = false
          test "$(jq -r '.rowMutationAuthorized' /tmp/r5-work-status-index-prepare.json)" = false
          test "$(jq -r '.vacuumAuthorized' /tmp/r5-work-status-index-prepare.json)" = false
          printf 'source_commit=%s\nmanager_sha=%s\nstate_sha=%s\nproject_digest=%s\nmutation_sha=%s\ndatabase_bytes=%s\nindex_bytes=%s\nwork_rows=%s\nnoncommitted_rows=%s\ntheoretical_without_full=%s\n' \
            "$source_commit" "$manager_sha" \
            "$(jq -r '.structuralStateSha256' /tmp/r5-work-status-index-prepare.json)" \
            "$(jq -r '.structuralState.projectIdentityDigest' /tmp/r5-work-status-index-prepare.json)" \
            "$(jq -r '.mutationSha256' /tmp/r5-work-status-index-prepare.json)" \
            "$(jq -r '.databaseBytes' /tmp/r5-work-status-index-prepare.json)" \
            "$(jq -r '.workStatusIndexBytes' /tmp/r5-work-status-index-prepare.json)" \
            "$(jq -r '.workRows' /tmp/r5-work-status-index-prepare.json)" \
            "$(jq -r '.nonCommittedRows' /tmp/r5-work-status-index-prepare.json)" \
            "$(jq -r '.theoreticalBytesWithoutFullIndex' /tmp/r5-work-status-index-prepare.json)" >> "$GITHUB_OUTPUT"

      - name: Publish expiring owner authorization proposal
        env:
          SOURCE_COMMIT: ${{ steps.state.outputs.source_commit }}
          MANAGER_SHA: ${{ steps.state.outputs.manager_sha }}
          STATE_SHA: ${{ steps.state.outputs.state_sha }}
          PROJECT_DIGEST: ${{ steps.state.outputs.project_digest }}
          MUTATION_SHA: ${{ steps.state.outputs.mutation_sha }}
          DATABASE_BYTES: ${{ steps.state.outputs.database_bytes }}
          INDEX_BYTES: ${{ steps.state.outputs.index_bytes }}
          WORK_ROWS: ${{ steps.state.outputs.work_rows }}
          NONCOMMITTED_ROWS: ${{ steps.state.outputs.noncommitted_rows }}
          THEORETICAL_WITHOUT_FULL: ${{ steps.state.outputs.theoretical_without_full }}
        shell: bash
        run: |
          set -euo pipefail
          expires="$(date -u -d '+2 hours' '+%Y-%m-%dT%H:%M:%SZ')"
          nonce="$(openssl rand -hex 8)"
          command="/r5-work-status-index-authorize commit=${SOURCE_COMMIT} manager=${MANAGER_SHA} state=${STATE_SHA} project=${PROJECT_DIGEST} mutation=${MUTATION_SHA} prepare_run=${GITHUB_RUN_ID} expires=${expires} nonce=${nonce}"
          cat > /tmp/r5-work-status-index-proposal.md <<EOF2
          ## R5 work-status partial-index replacement authorization proposal

          Preparation run: \`${GITHUB_RUN_ID}\`
          Source main commit: \`${SOURCE_COMMIT}\`
          Manager SHA-256: \`${MANAGER_SHA}\`
          Authorized structural state SHA-256: \`${STATE_SHA}\`
          Project identity digest: \`${PROJECT_DIGEST}\`
          Exact DDL SHA-256: \`${MUTATION_SHA}\`
          Database bytes: \`${DATABASE_BYTES}\`
          Full work-status index bytes: \`${INDEX_BYTES}\`
          Work rows / non-committed rows: \`${WORK_ROWS} / ${NONCOMMITTED_ROWS}\`
          Theoretical DB bytes if the full index disappeared entirely: \`${THEORETICAL_WITHOUT_FULL}\`
          Authorization expires: \`${expires}\`

          Read-only preparation verified the full work-status index, the dedicated committed-reader index, the absence of the temporary replacement index, and the production planner contract. The exact DDL creates \`WHERE status <> 'committed'\`, validates it, drops only the old work-status index, and renames the candidate atomically. It uses a 5-second lock timeout and 45-second statement timeout.

          This does not authorize row DELETE/UPDATE/INSERT, VACUUM, scheduler mutation, deployment, public-reader mutation, Mainnet, stabilization, soak, or R5 restart.

          Exact owner authorization command:

          \`${command}\`
          EOF2
          gh issue comment "$QUALIFICATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/r5-work-status-index-proposal.md

      - name: Upload sanitized preparation evidence
        uses: actions/upload-artifact@v4
        with:
          name: r5-work-status-partial-index-prepare-evidence
          path: r5-work-status-partial-index-evidence
          if-no-files-found: error
          retention-days: 14

  execute:
    if: >-
      github.event.issue.number == 1261 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      startsWith(github.event.comment.body, '/r5-work-status-index-authorize ')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AUTHORIZATION_BODY: ${{ github.event.comment.body }}
      AUTHORIZATION_CREATED_AT: ${{ github.event.comment.created_at }}
      AUTHORIZATION_COMMENT_ID: ${{ github.event.comment.id }}
    steps:
      - name: Check out exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Parse exact owner authorization
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          regex='^/r5-work-status-index-authorize commit=([a-f0-9]{40}) manager=([a-f0-9]{64}) state=([a-f0-9]{64}) project=([a-f0-9]{64}) mutation=([a-f0-9]{64}) prepare_run=([0-9]+) expires=([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z) nonce=([a-f0-9]{16})$'
          [[ "$AUTHORIZATION_BODY" =~ $regex ]] || { echo 'work-status index authorization shape mismatch' >&2; exit 1; }
          commit="${BASH_REMATCH[1]}"; manager_sha="${BASH_REMATCH[2]}"; state_sha="${BASH_REMATCH[3]}"; project_digest="${BASH_REMATCH[4]}"; mutation_sha="${BASH_REMATCH[5]}"; prepare_run="${BASH_REMATCH[6]}"; expires="${BASH_REMATCH[7]}"; nonce="${BASH_REMATCH[8]}"
          test "$commit" = "$(git rev-parse HEAD)"
          test "$manager_sha" = "$(sha256sum "$MANAGER_PATH" | awk '{print $1}')"
          actual_project_digest="$(printf '%s' "$SUPABASE_PROJECT_ID" | sha256sum | awk '{print $1}')"
          test "$project_digest" = "$actual_project_digest"
          now_epoch="$(date -u +%s)"; expires_epoch="$(date -u -d "$expires" +%s)"; auth_epoch="$(date -u -d "$AUTHORIZATION_CREATED_AT" +%s)"
          test "$auth_epoch" -lt "$expires_epoch"; test "$now_epoch" -le "$expires_epoch"; test $((expires_epoch-auth_epoch)) -le 7200
          printf 'commit=%s\nmanager_sha=%s\nstate_sha=%s\nproject_digest=%s\nmutation_sha=%s\nprepare_run=%s\nexpires=%s\nnonce=%s\n' "$commit" "$manager_sha" "$state_sha" "$project_digest" "$mutation_sha" "$prepare_run" "$expires" "$nonce" >> "$GITHUB_OUTPUT"

      - name: Verify exact prior proposal and unique owner authorization
        env:
          PREPARE_RUN: ${{ steps.auth.outputs.prepare_run }}
          COMMIT: ${{ steps.auth.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREPARE_RUN}" > /tmp/prepare-run.json
          jq -e --arg commit "$COMMIT" '.event=="issue_comment" and .conclusion=="success" and .head_sha==$commit and .actor.login=="badjoke-lab"' /tmp/prepare-run.json >/dev/null
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${QUALIFICATION_ISSUE}/comments?per_page=100" | jq -s 'add' > /tmp/comments.json
          EXPECTED="$AUTHORIZATION_BODY" PREPARE_RUN="$PREPARE_RUN" AUTH_ID="$AUTHORIZATION_COMMENT_ID" AUTH_CREATED_AT="$AUTHORIZATION_CREATED_AT" node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const comments=JSON.parse(readFileSync('/tmp/comments.json','utf8')); const expected=process.env.EXPECTED; const run=process.env.PREPARE_RUN; const authAt=Date.parse(process.env.AUTH_CREATED_AT)
          const proposals=comments.filter(c=>c?.user?.login==='github-actions[bot]'&&c?.body?.includes(`Preparation run: \`${run}\``)&&c?.body?.includes(`\`${expected}\``))
          if(proposals.length!==1||!(Date.parse(proposals[0].created_at)<authAt)) throw new Error('exact prior proposal missing or late')
          const owners=comments.filter(c=>c?.user?.login==='badjoke-lab'&&c?.body===expected)
          if(owners.length!==1||Number(owners[0].id)!==Number(process.env.AUTH_ID)) throw new Error('owner authorization is not unique')
          NODE

      - name: Revalidate exact authorized state read-only
        env:
          COMMIT: ${{ steps.auth.outputs.commit }}
          STATE_SHA: ${{ steps.auth.outputs.state_sha }}
          MUTATION_SHA: ${{ steps.auth.outputs.mutation_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r5-work-status-partial-index-evidence
          node "$MANAGER_PATH" prepare --source-commit "$COMMIT" --output r5-work-status-partial-index-evidence/pre-apply.json > /tmp/pre.json
          test "$(jq -r '.structuralStateSha256' /tmp/pre.json)" = "$STATE_SHA"
          test "$(jq -r '.mutationSha256' /tmp/pre.json)" = "$MUTATION_SHA"

      - name: Apply exact work-status partial-index replacement
        id: apply
        env:
          COMMIT: ${{ steps.auth.outputs.commit }}
          STATE_SHA: ${{ steps.auth.outputs.state_sha }}
          MUTATION_SHA: ${{ steps.auth.outputs.mutation_sha }}
        shell: bash
        run: |
          set -euo pipefail
          node "$MANAGER_PATH" apply --source-commit "$COMMIT" --authorized-state "$STATE_SHA" --authorized-mutation "$MUTATION_SHA" --output r5-work-status-partial-index-evidence/apply.json 2>&1 | tee r5-work-status-partial-index-evidence/apply.log

      - name: Upload sanitized application evidence
        if: always() && steps.auth.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: r5-work-status-partial-index-apply-evidence
          path: r5-work-status-partial-index-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Publish bounded result
        if: always() && steps.apply.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          jq -r '"## R5 work-status partial-index replacement — APPLIED\n\n- work rows before/after: `\(.workRowsBefore) / \(.workRowsAfter)`\n- non-committed rows before/after: `\(.nonCommittedRowsBefore) / \(.nonCommittedRowsAfter)`\n- status index bytes before/after/reclaimed: `\(.indexBytesBefore) / \(.indexBytesAfter) / \(.indexBytesReclaimed)`\n- database bytes before/after: `\(.databaseBytesBefore) / \(.databaseBytesAfter)`\n- database below 400,000,000 B after: `\(.databaseBelowHaltAfter)`\n- headroom after: `\(.databaseHeadroomBytesAfter)`\n- non-committed planner contract: `\(.plannerEvidence.stagedUsesStatusIndex and .plannerEvidence.inflightUsesStatusIndex)`\n- committed-reader planner contract: `\(.plannerEvidence.committedReaderUsesDedicatedIndex)`\n- row mutation / VACUUM / scheduler mutation / deployment: `none / none / none / none`\n- Mainnet: `disabled`\n- stabilization/soak/R5 restart: `not authorized`"' r5-work-status-partial-index-evidence/apply.json > /tmp/result.md
          gh issue comment "$QUALIFICATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/result.md
