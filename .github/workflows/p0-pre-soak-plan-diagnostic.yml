name: P0 pre-soak plan and API diagnostic

on:
  push:
    branches: [main]
    paths:
      - .github/p0-pre-soak-plan-diagnostic-trigger

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: '960'
      PRODUCTION_BASE: https://xrpl-lending-monitor.badjoke-lab.workers.dev
    steps:
      - name: Capture plan, live D1 query, usage, and diff schema
        shell: bash
        run: |
          set -u
          mkdir -p diagnostic

          curl_json() {
            local url="$1"
            local output="$2"
            curl --silent --show-error -o "$output" -w '%{http_code}' \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' "$url" > "${output}.status" || true
          }

          curl_json "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/subscriptions" diagnostic/account-subscriptions.json
          curl_json "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/account-settings" diagnostic/worker-account-settings.json
          curl_json "${PRODUCTION_BASE}/api/status/fast-lane-diff?limit=500" diagnostic/diff.json

          jq -n --arg sql "SELECT COUNT(*) AS metric_rows,MAX(run_at) AS latest_run_at FROM fast_lane_shadow_run_metrics WHERE network='devnet'" '{sql:$sql}' \
            | curl --silent --show-error -o diagnostic/d1-query.json -w '%{http_code}' \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H 'Content-Type: application/json' --data-binary @- \
                "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query" \
            > diagnostic/d1-query.status || true

          today="$(date -u +%F)"
          read -r -d '' usage_query <<'GRAPHQL' || true
          query D1Usage($accountTag:string!,$start:Date,$end:Date,$databaseId:string){viewer{accounts(filter:{accountTag:$accountTag}){d1AnalyticsAdaptiveGroups(limit:10000,filter:{date_geq:$start,date_leq:$end,databaseId:$databaseId}){sum{rowsRead rowsWritten}}}}}
          GRAPHQL
          jq -n --arg query "$usage_query" --arg accountTag "$CLOUDFLARE_ACCOUNT_ID" --arg start "$today" --arg end "$today" --arg databaseId "$DATABASE_ID" '{query:$query,variables:{accountTag:$accountTag,start:$start,end:$end,databaseId:$databaseId}}' > diagnostic/usage-request.json
          curl --silent --show-error -o diagnostic/usage.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'content-type: application/json' \
            --data @diagnostic/usage-request.json https://api.cloudflare.com/client/v4/graphql > diagnostic/usage.status || true

          subscriptions_status="$(cat diagnostic/account-subscriptions.json.status)"
          settings_status="$(cat diagnostic/worker-account-settings.json.status)"
          diff_status="$(cat diagnostic/diff.json.status)"
          d1_status="$(cat diagnostic/d1-query.status)"
          usage_status="$(cat diagnostic/usage.status)"

          jq 'if .success==true then [.result[]? | {id,status,frequency,rate_plan:(.rate_plan // {} | {id,public_name,currency,externally_managed})}] else {success,errors} end' diagnostic/account-subscriptions.json > diagnostic/subscriptions-sanitized.json 2>/dev/null || echo '{}' > diagnostic/subscriptions-sanitized.json
          jq '{success,result}' diagnostic/worker-account-settings.json > diagnostic/settings-sanitized.json 2>/dev/null || echo '{}' > diagnostic/settings-sanitized.json
          jq '{status,passed,sample,base,fastLane,canonicalOverlay,error,message}' diagnostic/diff.json > diagnostic/diff-sanitized.json 2>/dev/null || cp diagnostic/diff.json diagnostic/diff-sanitized.json

          rows_read="$(jq '[.data.viewer.accounts[0].d1AnalyticsAdaptiveGroups[].sum.rowsRead // 0] | add // 0' diagnostic/usage.json 2>/dev/null || echo null)"
          rows_written="$(jq '[.data.viewer.accounts[0].d1AnalyticsAdaptiveGroups[].sum.rowsWritten // 0] | add // 0' diagnostic/usage.json 2>/dev/null || echo null)"
          d1_success="$(jq '.success==true and ((.errors // [])|length)==0 and ([.result[].success]|all)' diagnostic/d1-query.json 2>/dev/null || echo false)"

          jq -n \
            --arg subscriptionsHttp "$subscriptions_status" --arg settingsHttp "$settings_status" --arg diffHttp "$diff_status" --arg d1Http "$d1_status" --arg usageHttp "$usage_status" \
            --argjson rowsRead "$rows_read" --argjson rowsWritten "$rows_written" --argjson d1QuerySucceeded "$d1_success" \
            --slurpfile subscriptions diagnostic/subscriptions-sanitized.json --slurpfile settings diagnostic/settings-sanitized.json --slurpfile diff diagnostic/diff-sanitized.json --slurpfile d1 diagnostic/d1-query.json \
            '{subscriptionsHttp:$subscriptionsHttp,subscriptions:$subscriptions[0],workerAccountSettingsHttp:$settingsHttp,workerAccountSettings:$settings[0],d1UsageHttp:$usageHttp,d1Today:{rowsRead:$rowsRead,rowsWritten:$rowsWritten},liveD1QueryHttp:$d1Http,liveD1QuerySucceeded:$d1QuerySucceeded,liveD1Query:$d1[0],diffHttp:$diffHttp,diff:$diff[0]}' \
            > diagnostic/summary.json

      - name: Report diagnostic
        if: always()
        shell: bash
        run: |
          test -s diagnostic/summary.json || echo '{"diagnostic":"failed before summary"}' > diagnostic/summary.json
          {
            echo 'Pre-soak plan and API diagnostic:'
            echo
            echo '```json'
            cat diagnostic/summary.json
            echo '```'
          } > diagnostic/comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body-file diagnostic/comment.md

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: p0-pre-soak-plan-diagnostic
          path: diagnostic
          if-no-files-found: warn
          retention-days: 14
