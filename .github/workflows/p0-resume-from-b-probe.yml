name: P0 resume-from-B probe

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Capture recovery state
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $runs = gh api "repos/$repo/actions/workflows/p0-resume-from-b.yml/runs?per_page=20" | ConvertFrom-Json
          $run = $runs.workflow_runs | Sort-Object {[datetime]$_.created_at} -Descending | Select-Object -First 1
          if (-not $run) { throw 'No resume-from-B run found' }
          $jobs = gh api "repos/$repo/actions/runs/$($run.id)/jobs?per_page=100" | ConvertFrom-Json
          $children = gh api "repos/$repo/actions/workflows/rolling-checkpoint-candidate.yml/runs?event=workflow_dispatch&per_page=20" | ConvertFrom-Json
          $cutovers = gh api "repos/$repo/actions/workflows/rolling-checkpoint-live-cutover.yml/runs?event=workflow_dispatch&per_page=20" | ConvertFrom-Json
          $monitors = gh api "repos/$repo/actions/workflows/verify-production-read-soak.yml/runs?per_page=20" | ConvertFrom-Json
          $payload = [ordered]@{
            capturedAt = (Get-Date).ToUniversalTime().ToString('o')
            run = [ordered]@{id=$run.id;status=$run.status;conclusion=$run.conclusion;createdAt=$run.created_at;updatedAt=$run.updated_at;url=$run.html_url;headSha=$run.head_sha}
            jobs = @($jobs.jobs | ForEach-Object {[ordered]@{id=$_.id;name=$_.name;status=$_.status;conclusion=$_.conclusion;steps=@($_.steps | ForEach-Object {[ordered]@{name=$_.name;status=$_.status;conclusion=$_.conclusion;number=$_.number}})}})
            latestCandidateRuns = @($children.workflow_runs | Sort-Object {[datetime]$_.created_at} -Descending | Select-Object -First 6 | ForEach-Object {[ordered]@{id=$_.id;status=$_.status;conclusion=$_.conclusion;createdAt=$_.created_at;updatedAt=$_.updated_at;url=$_.html_url}})
            latestCutoverRuns = @($cutovers.workflow_runs | Sort-Object {[datetime]$_.created_at} -Descending | Select-Object -First 6 | ForEach-Object {[ordered]@{id=$_.id;status=$_.status;conclusion=$_.conclusion;createdAt=$_.created_at;updatedAt=$_.updated_at;url=$_.html_url}})
            latestMonitorRuns = @($monitors.workflow_runs | Sort-Object {[datetime]$_.created_at} -Descending | Select-Object -First 6 | ForEach-Object {[ordered]@{id=$_.id;event=$_.event;status=$_.status;conclusion=$_.conclusion;createdAt=$_.created_at;updatedAt=$_.updated_at;url=$_.html_url;headSha=$_.head_sha}})
          } | ConvertTo-Json -Depth 8
          $payload | Set-Content -Path p0-resume-from-b-probe.json -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: p0-resume-from-b-probe
          path: p0-resume-from-b-probe.json
          retention-days: 14
