name: M4-6 type diagnostic

on:
  push:
    branches:
      - ui/project-documentation-pages

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/project-documentation-pages
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture type-check output
        continue-on-error: true
        run: |
          mkdir -p diagnostics
          pnpm typecheck > diagnostics/typecheck.log 2>&1
      - name: Commit diagnostic log
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/typecheck.log
          git commit -m "Capture M4-6 type-check result" || exit 0
          git push origin HEAD:ui/project-documentation-pages
