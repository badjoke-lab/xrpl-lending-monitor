name: M1 watch probe
on:
  pull_request:
    paths: [.github/workflows/m1-watch-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Capture current M1 exit state
        shell: bash
        run: |
          set -euo pipefail
          B="https://xrpl-lending-monitor.badjoke-lab.workers.dev"
          c="$(curl --max-time 60 -fsS "${B}/api/status/collector")"
          h="$(curl --max-time 120 -fsS "${B}/api/status/continuation-diagnostics")"
          m="$(curl --max-time 120 -fsS "${B}/api/status/m1-exit-diagnostics")"
          l="$(curl --max-time 60 -fsS "${B}/api/status/loan-activity-witnesses")"
          jq -n --argjson c "$c" --argjson h "$h" --argjson m "$m" --argjson l "$l" \
            '{collector:{status:$c.status,cursor:$c.cursor,head:$c.head,lag:$c.lag,consecutive_failures:$c.consecutive_failures,error:$c.error},hyb7:{passed:$h.report.passed,paths:($h.report.paths|with_entries(.value=.value.state))},m1_exit:{ready:$m.report.ready,gates:($m.report.gates|with_entries(.value=.value.state))},loan_activity:$l}'
