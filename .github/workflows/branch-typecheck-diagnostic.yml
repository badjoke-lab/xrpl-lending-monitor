name: Branch compressed-history diagnostic

on:
  push:
    branches:
      - agent/compress-fast-lane-history-bundles
    paths:
      - .github/branch-typecheck-diagnostic-trigger

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/compress-fast-lane-history-bundles
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture diagnostic output
        shell: bash
        run: |
          set +e
          pnpm typecheck > typecheck.log 2>&1
          typecheck_code=$?
          pnpm exec vitest run src/worker/repositories/fast-lane-history-window.test.ts \
            --reporter=verbose > unit-test.log 2>&1
          unit_code=$?
          printf '%s\n' "$typecheck_code" > typecheck-exit-code.txt
          printf '%s\n' "$unit_code" > unit-test-exit-code.txt
          cat typecheck.log
          cat unit-test.log
          exit 0
      - name: Publish diagnostic output
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          typecheck_code="$(cat typecheck-exit-code.txt 2>/dev/null || echo 99)"
          unit_code="$(cat unit-test-exit-code.txt 2>/dev/null || echo 99)"
          {
            echo "typecheck_exit_code=${typecheck_code}"
            echo "unit_test_exit_code=${unit_code}"
            echo "head_sha=${GITHUB_SHA}"
            echo
            echo '--- typecheck ---'
            cat typecheck.log 2>/dev/null || true
            echo
            echo '--- compressed history unit test ---'
            cat unit-test.log 2>/dev/null || true
          } > branch-typecheck-diagnostic-status.txt
          API_PATH="repos/${GITHUB_REPOSITORY}/contents/.github/branch-typecheck-diagnostic-status.txt"
          CONTENT="$(base64 -w0 branch-typecheck-diagnostic-status.txt)"
          EXISTING_SHA="$(gh api "$API_PATH" -f ref=agent/compress-fast-lane-history-bundles --jq .sha 2>/dev/null || true)"
          if [ -n "$EXISTING_SHA" ]; then
            gh api --method PUT "$API_PATH" \
              -f branch=agent/compress-fast-lane-history-bundles \
              -f message="Update compressed history diagnostic status" \
              -f content="$CONTENT" \
              -f sha="$EXISTING_SHA" > /dev/null
          else
            gh api --method PUT "$API_PATH" \
              -f branch=agent/compress-fast-lane-history-bundles \
              -f message="Create compressed history diagnostic status" \
              -f content="$CONTENT" > /dev/null
          fi
      - name: Enforce diagnostic result
        shell: bash
        run: |
          test "$(cat typecheck-exit-code.txt)" = 0
          test "$(cat unit-test-exit-code.txt)" = 0
      - name: Upload diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-compressed-history-diagnostic
          path: |
            typecheck.log
            unit-test.log
            typecheck-exit-code.txt
            unit-test-exit-code.txt
            branch-typecheck-diagnostic-status.txt
          if-no-files-found: error
          retention-days: 1
