name: R5 terminal archive derivation read-only probe

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: r5-terminal-archive-derivation-readonly-probe
  cancel-in-progress: false

jobs:
  probe:
    if: >-
      github.event.issue.number == 1261 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      github.event.comment.body == '/r5-terminal-archive-derivation-readonly-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Audit durable terminal membership only
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          node scripts/r5-terminal-archive-derived-membership-readonly-audit.mjs \
            --source-commit "$GITHUB_SHA" \
            --output-dir r5-terminal-archive-derivation-readonly-probe

      - name: Audit durable terminal completion time only
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          node scripts/r5-terminal-archive-derived-completion-time-readonly-audit.mjs \
            --source-commit "$GITHUB_SHA" \
            --output-dir r5-terminal-archive-derivation-readonly-probe

      - name: Audit terminal archive consumers only
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          node scripts/r5-terminal-archive-consumer-readonly-audit.mjs \
            --source-commit "$GITHUB_SHA" \
            --output-dir r5-terminal-archive-derivation-readonly-probe

      - name: Upload sanitized derivation evidence
        uses: actions/upload-artifact@v4
        with:
          name: r5-terminal-archive-derivation-readonly-probe-${{ github.run_id }}
          path: r5-terminal-archive-derivation-readonly-probe/
          if-no-files-found: error
          retention-days: 7

      - name: Publish sanitized derivation result
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### R5 terminal archive derivation read-only probe'
            echo
            cat r5-terminal-archive-derivation-readonly-probe/derived-membership-summary.md
            echo
            cat r5-terminal-archive-derivation-readonly-probe/derived-completion-time-summary.md
            echo
            cat r5-terminal-archive-derivation-readonly-probe/consumer-audit-summary.md
            echo
            echo "Run: ${GITHUB_RUN_ID}"
            echo 'Safety: SELECT/read_only only. No archive mutation/deletion, Phase B mutation, cleanup, physical rewrite, scheduler/deployment/public-reader change, R5 rearm, Mainnet, stabilization, or soak is authorized.'
          } > /tmp/r5-terminal-archive-derivation-comment.md
          gh issue comment 1261 --repo "$GITHUB_REPOSITORY" --body-file /tmp/r5-terminal-archive-derivation-comment.md
