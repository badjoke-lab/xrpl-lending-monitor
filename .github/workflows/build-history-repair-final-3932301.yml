name: Build final immutable history repair 3932301

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/build-history-repair-final-3932301.yml
      - scripts/run-history-repair-3932301.sh

permissions:
  contents: write

concurrency:
  group: build-final-immutable-history-repair-3932301-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  build-publish-rehearse:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out exact implementation
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check out active immutable history
        uses: actions/checkout@v4
        with:
          ref: history-data
          path: .local/history-root
          fetch-depth: 1
          sparse-checkout: |
            history-channel.json
            history
          sparse-checkout-cone-mode: false

      - name: Check out production current-state identity
        uses: actions/checkout@v4
        with:
          ref: current-state-data
          path: .local/current-state
          sparse-checkout: read-model/manifest.json
          sparse-checkout-cone-mode: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build deterministic history tools
        run: |
          pnpm build:history-extension-plan
          pnpm build:history-segment
          pnpm build:history-segment-checkpoint
          pnpm build:history-extension-artifacts
          pnpm build:history-segment-chain
          pnpm build:extended-history-publication
          pnpm build:history-exact-index
          pnpm build:history-segment-channel
          pnpm build:candidate-source-rehearsal

      - name: Validate repair runner
        run: |
          bash -n scripts/run-history-repair-3932301.sh
          grep -Fq 'https://clio.devnet.rippletest.net:51234/' scripts/run-history-repair-3932301.sh
          grep -Fq 'productionMutation: false' scripts/run-history-repair-3932301.sh
          jq -e '.vars.APP_NETWORK == "devnet" and .vars.MAINNET_ENABLED == "false" and .triggers.crons == ["*/5 * * * *"]' wrangler.jsonc >/dev/null

      - name: Build and publish candidate only
        shell: bash
        run: bash scripts/run-history-repair-3932301.sh

      - name: Upload immutable-history candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immutable-history-repair-final-3932301
          path: history-repair-evidence
          if-no-files-found: warn
          retention-days: 30
