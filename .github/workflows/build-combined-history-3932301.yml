name: Bootstrap chunked partitioned combined-history implementation

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/run-partitioned-bootstrap.txt

permissions:
  contents: write

concurrency:
  group: apply-partitioned-combined-history
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Decode and commit bounded partitioned implementation
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          cat .github/partitioned-chunks/exact.* > /tmp/exact.b64
          cat .github/partitioned-chunks/workflow.* > /tmp/workflow.b64
          base64 -d /tmp/exact.b64 | gzip -d > scripts/build-incremental-history-exact-index.ts
          base64 -d /tmp/workflow.b64 | gzip -d > .github/workflows/build-combined-history-3932301.yml
          test "$(sha256sum scripts/build-incremental-history-exact-index.ts | awk '{print $1}')" = "5f50eae467ddf6786327d6b3e01bfcab3335e6c2e1a188d930e13b60e5276cba"
          test "$(sha256sum .github/workflows/build-combined-history-3932301.yml | awk '{print $1}')" = "ac0920240c28c10783cd7a176381881f7b4a51a585a8ec34922c14fdda148e63"
          test "$(wc -l < scripts/build-incremental-history-exact-index.ts)" -eq 559
          test "$(wc -l < .github/workflows/build-combined-history-3932301.yml)" -eq 624
          rm -rf \
            .github/partitioned-chunks \
            .github/partitioned-exact.ts.gz.b64 \
            .github/partitioned-workflow.yml.gz.b64 \
            .github/partitioned-apply-trigger.txt \
            .github/bootstrap-partitioned-retry.txt \
            .github/run-partitioned-bootstrap.txt \
            .github/workflows/apply-partitioned-combined-fix.yml \
            .github/workflows/cancel-combined-run-30322659427.yml \
            .github/workflows/capture-combined-failure-30320403596.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Partition combined exact-index build across bounded jobs"
          git push origin "HEAD:refs/heads/$HEAD_BRANCH"
