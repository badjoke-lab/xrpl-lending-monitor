name: Resume combined immutable-history candidate publish 3932301

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/workflows/build-combined-history-3932301.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: resume-combined-history-3932301
  cancel-in-progress: true

env:
  SOURCE_RUN_ID: '30334947884'
  COMBINED_HISTORY_BRANCH: history-repair-3932301-combined-data
  CURRENT_STATE_BRANCH: current-state-data
  TARGET_HASH: 7D026FED85BCA2BDCFE450A0F3537707A43B4D08E1D2AE57AFBC54D88EBE1828
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  resume-publish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out corrected resume implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Check out production immutable history read-only
        uses: actions/checkout@v4
        with:
          ref: history-data
          path: .local/base-history
          fetch-depth: 1
          sparse-checkout: |
            history
            history-channel.json
          sparse-checkout-cone-mode: false

      - name: Check out reconstructed delta history read-only
        uses: actions/checkout@v4
        with:
          ref: history-repair-3932301-data
          path: .local/delta-history
          fetch-depth: 1
          sparse-checkout: |
            history
            history-channel.json
          sparse-checkout-cone-mode: false

      - name: Download preparation artifact from partitioned run
        uses: actions/download-artifact@v4
        with:
          name: combined-history-prepare-${{ env.SOURCE_RUN_ID }}
          path: .local/prepare
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Download all four exact-index parts from partitioned run
        uses: actions/download-artifact@v4
        with:
          pattern: combined-exact-part-*-${{ env.SOURCE_RUN_ID }}
          path: .local/exact-parts
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build verification and rehearsal tools
        shell: bash
        run: |
          set -euo pipefail
          pnpm build:history-extension-artifacts
          pnpm build:incremental-history-exact-index
          pnpm build:history-exact-rehearsal

      - name: Resume witness verification, candidate publish, and remote rehearsal
        shell: bash
        run: bash scripts/resume-combined-history-3932301.sh

      - name: Capture final resource state
        if: always()
        shell: bash
        run: |
          set +e
          EVIDENCE="$RUNNER_TEMP/combined-history-resume-evidence"
          mkdir -p "$EVIDENCE"
          df -h > "$EVIDENCE/disk-final.txt"
          du -sh .local/base-history .local/delta-history .local/exact-parts > "$EVIDENCE/sizes-final.txt" 2>&1 || true

      - name: Upload corrected resume candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combined-immutable-history-resume-3932301
          path: ${{ runner.temp }}/combined-history-resume-evidence
          if-no-files-found: error
          retention-days: 30
