name: P0 tail Queue runtime

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  tail:
    if: startsWith(github.event.issue.title, 'P0 tail Queue runtime')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Inspect Queue attachment
        shell: bash
        run: |
          set -o pipefail
          pnpm exec wrangler queues info xrpl-lending-fast-lane > /tmp/queue-info.txt 2>&1 || true

      - name: Tail next Queue Cron boundary
        shell: bash
        run: |
          set -o pipefail
          timeout 240s pnpm exec wrangler tail xrpl-lending-monitor --format json \
            > /tmp/runtime-tail.log 2>&1 || true

      - name: Report Queue runtime evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'Queue runtime evidence:'
            echo
            echo '### Queue attachment'
            echo '```text'
            if [ -s /tmp/queue-info.txt ]; then cat /tmp/queue-info.txt; else echo 'no Queue info'; fi
            echo '```'
            echo
            echo '### Worker runtime tail'
            echo '```text'
            if [ -s /tmp/runtime-tail.log ]; then tail -n 400 /tmp/runtime-tail.log; else echo 'no runtime events captured'; fi
            echo '```'
            echo
            echo "Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > /tmp/comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
