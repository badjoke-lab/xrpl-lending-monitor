name: P0 fast-lane error probe

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, 'P0 fast-lane error probe')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Query fast-lane status and storage
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          STATUS_SQL=$(cat <<'SQL'
          SELECT run_at, status, start_ledger_index, end_ledger_index,
                 latest_observed_ledger, lag_ledgers, ledgers_processed,
                 persistence_rows_written, error_message
          FROM fast_lane_shadow_run_metrics
          WHERE network = 'devnet'
          ORDER BY run_at DESC
          LIMIT 8
          SQL
          )

          STORAGE_SQL=$(cat <<'SQL'
          SELECT 'fast_lane_history_windows' AS table_name,
                 COUNT(*) AS row_count,
                 COALESCE(SUM(LENGTH(bundle_json)), 0) AS payload_bytes
          FROM fast_lane_history_windows
          UNION ALL
          SELECT 'fast_lane_shadow_windows', COUNT(*),
                 COALESCE(SUM(LENGTH(activity_bundle_json)), 0)
          FROM fast_lane_shadow_windows
          UNION ALL
          SELECT 'fast_lane_shadow_objects_compact', COUNT(*),
                 COALESCE(SUM(LENGTH(projection_json)), 0)
          FROM fast_lane_shadow_objects_compact
          UNION ALL
          SELECT 'fast_lane_shadow_run_metrics', COUNT(*),
                 COALESCE(SUM(LENGTH(error_message)), 0)
          FROM fast_lane_shadow_run_metrics
          UNION ALL
          SELECT 'current_state_overlay_objects', COUNT(*),
                 COALESCE(SUM(LENGTH(projection_json)), 0)
          FROM current_state_overlay_objects
          SQL
          )

          FOLD_SQL=$(cat <<'SQL'
          SELECT state.overlay_ledger_index,
                 state.overlay_ledger_hash,
                 state.updated_at,
                 (
                   SELECT COUNT(*)
                   FROM fast_lane_shadow_objects_compact AS fast
                   WHERE fast.network = 'devnet'
                     AND EXISTS (
                       SELECT 1
                       FROM current_state_overlay_objects AS overlay
                       WHERE overlay.network = 'devnet'
                         AND overlay.epoch_id = binding.base_epoch_id
                         AND overlay.base_snapshot_id = binding.base_snapshot_id
                         AND overlay.object_type = fast.object_type
                         AND overlay.object_id = fast.object_id
                         AND (
                           overlay.source_ledger_index > fast.source_ledger_index
                           OR (
                             overlay.source_ledger_index = fast.source_ledger_index
                             AND overlay.source_transaction_index >= fast.source_transaction_index
                           )
                         )
                     )
                 ) AS foldable_fast_rows
          FROM current_state_overlay_state AS state
          JOIN fast_lane_shadow_base_binding AS binding
            ON binding.network = 'devnet'
           AND state.network = 'devnet'
           AND state.epoch_id = binding.base_epoch_id
           AND state.base_snapshot_id = binding.base_snapshot_id
          LIMIT 1
          SQL
          )

          query_d1() {
            local sql="$1"
            local output="$2"
            jq -n --arg sql "$sql" '{sql: $sql}' \
              | curl --fail-with-body --silent --show-error \
                  -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  -H 'Content-Type: application/json' \
                  --data-binary @- \
                  "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query" \
              > "$output"
          }

          query_d1 "$STATUS_SQL" /tmp/result.json
          query_d1 "$STORAGE_SQL" /tmp/storage.json
          query_d1 "$FOLD_SQL" /tmp/fold.json

          {
            echo 'P0 fast-lane error probe result:'
            echo
            echo '```json'
            jq . /tmp/result.json
            echo '```'
            echo
            echo 'D1 storage breakdown:'
            echo
            echo '```json'
            jq . /tmp/storage.json
            echo '```'
            echo
            echo 'Canonical fold diagnostics:'
            echo
            echo '```json'
            jq . /tmp/fold.json
            echo '```'
          } > /tmp/comment.md

          if [ -n "${ISSUE_NUMBER:-}" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body-file /tmp/comment.md
          else
            cat /tmp/comment.md
          fi
