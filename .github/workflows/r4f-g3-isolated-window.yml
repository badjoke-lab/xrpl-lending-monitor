name: R4F G3 Isolated Window

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: r4f-g3-isolated-window
  cancel-in-progress: false

env:
  QUALIFICATION_ISSUE: '1261'

jobs:
  prepare:
    if: >-
      github.event.issue.number == 1261 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      github.event.comment.body == '/r4f-g3-isolation-prepare'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Inspect exact collector scheduler read-only
        id: scheduler
        run: node scripts/prepare-r4f-g3-isolated-window.mjs

      - name: Upload sanitized scheduler preparation evidence
        uses: actions/upload-artifact@v4
        with:
          name: r4f-g3-isolated-window-prepare-evidence
          path: r4f-g3-isolated-window-prepare-evidence/scheduler-prepare.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish dashboard-capture authorization proposal
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_COMMIT: ${{ steps.scheduler.outputs.source_commit }}
          JOB_ID: ${{ steps.scheduler.outputs.job_id }}
          JOB_NAME: ${{ steps.scheduler.outputs.job_name }}
          SCHEDULE: ${{ steps.scheduler.outputs.schedule }}
          COMMAND_DIGEST: ${{ steps.scheduler.outputs.command_digest }}
          PROJECT_DIGEST: ${{ steps.scheduler.outputs.project_digest }}
          RUNTIME_STATUS: ${{ steps.scheduler.outputs.runtime_status }}
          RUNTIME_TICK_COUNT: ${{ steps.scheduler.outputs.runtime_tick_count }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          cat > /tmp/isolation-prepare.md <<EOF
          ## R4F G3 isolated-window dashboard capture authorization proposal

          Preparation run: \`${GITHUB_RUN_ID}\`
          Run: ${RUN_URL}
          Source commit: \`${SOURCE_COMMIT}\`
          Project identity digest: \`${PROJECT_DIGEST}\`
          Collector cron job: \`${JOB_NAME}\`
          Cron job id: \`${JOB_ID}\`
          Schedule: \`${SCHEDULE}\`
          Scheduler command digest: \`${COMMAND_DIGEST}\`
          Collector runtime status: \`${RUNTIME_STATUS}\`
          Collector tick count: \`${RUNTIME_TICK_COUNT}\`
          Dashboard capture scope: \`r4f_g3_dashboard_capture\`

          A database-local watchdog is installed before the collector is paused.
          The pause is bounded to at most 15 minutes. On runner failure, the watchdog restores the exact collector command by digest. On normal completion, an explicit resume restores it sooner.

          Dashboard capture authorization must be retained before any pause or BEFORE reading. Exact authorization command:

          \`/r4f-g3-dashboard-authorize scope=r4f_g3_dashboard_capture commit=${SOURCE_COMMIT} project=${PROJECT_DIGEST} job=${JOB_ID} command=${COMMAND_DIGEST} prepare_run=${GITHUB_RUN_ID}\`

          This preparation is read-only. Dashboard authorization permits only the bounded project-filtered Usage capture sequence. It does not itself pause the collector and does not authorize schema/data migration, R5 mutation, public-reader change, Mainnet, stabilization, or soak.
          EOF
          gh issue comment "$QUALIFICATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/isolation-prepare.md

  dashboard_authorize:
    if: >-
      github.event.issue.number == 1261 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      startsWith(github.event.comment.body, '/r4f-g3-dashboard-authorize ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      GH_TOKEN: ${{ github.token }}
      AUTHORIZATION_BODY: ${{ github.event.comment.body }}
      AUTHORIZATION_CREATED_AT: ${{ github.event.comment.created_at }}
      AUTHORIZATION_COMMENT_ID: ${{ github.event.comment.id }}
    steps:
      - name: Check out current main read-only
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact dashboard capture authorization
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          regex='^/r4f-g3-dashboard-authorize scope=r4f_g3_dashboard_capture commit=([a-f0-9]{40}) project=([a-f0-9]{64}) job=([0-9]+) command=([a-f0-9]{64}) prepare_run=([0-9]+)$'
          [[ "$AUTHORIZATION_BODY" =~ $regex ]] || { echo 'dashboard authorization command shape mismatch' >&2; exit 1; }
          commit="${BASH_REMATCH[1]}"
          project_digest="${BASH_REMATCH[2]}"
          job_id="${BASH_REMATCH[3]}"
          command_digest="${BASH_REMATCH[4]}"
          prepare_run="${BASH_REMATCH[5]}"
          test "$job_id" -gt 0
          test "$prepare_run" -gt 0
          test "$commit" = "$(git rev-parse HEAD)"
          [[ "$SUPABASE_PROJECT_ID" =~ ^[a-z]{20}$ ]]
          actual_project_digest="$(printf '%s' "$SUPABASE_PROJECT_ID" | sha256sum | awk '{print $1}')"
          test "$project_digest" = "$actual_project_digest"

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${prepare_run}" > /tmp/isolation-prepare-run.json
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${QUALIFICATION_ISSUE}/comments?per_page=100" \
            | jq -s 'add' > /tmp/issue-comments.json

          node scripts/verify-r4f-g3-isolation-prepare-proposal.mjs \
            --comments /tmp/issue-comments.json \
            --run /tmp/isolation-prepare-run.json \
            --prepare-run "$prepare_run" \
            --commit "$commit" \
            --project-digest "$project_digest" \
            --job-id "$job_id" \
            --command-digest "$command_digest" \
            --authorization-created-at "$AUTHORIZATION_CREATED_AT"

          printf 'commit=%s\nproject_digest=%s\njob_id=%s\ncommand_digest=%s\nprepare_run=%s\n' \
            "$commit" "$project_digest" "$job_id" "$command_digest" "$prepare_run" >> "$GITHUB_OUTPUT"

      - name: Publish exact pause authorization command
        env:
          COMMIT: ${{ steps.auth.outputs.commit }}
          PROJECT_DIGEST: ${{ steps.auth.outputs.project_digest }}
          JOB_ID: ${{ steps.auth.outputs.job_id }}
          COMMAND_DIGEST: ${{ steps.auth.outputs.command_digest }}
          PREPARE_RUN: ${{ steps.auth.outputs.prepare_run }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/dashboard-authorized.md <<EOF
          ## R4F G3 Dashboard capture pre-authorization retained

          Authorization comment: \`${AUTHORIZATION_COMMENT_ID}\`
          Scope: \`r4f_g3_dashboard_capture\`
          Source commit: \`${COMMIT}\`
          Project identity digest: \`${PROJECT_DIGEST}\`
          Isolation preparation run: \`${PREPARE_RUN}\`

          This authorization precedes any scheduler pause and does not mutate provider state. Exact pause authorization command:

          \`/r4f-g3-isolation-pause commit=${COMMIT} project=${PROJECT_DIGEST} job=${JOB_ID} command=${COMMAND_DIGEST} prepare_run=${PREPARE_RUN} dashboard_auth=${AUTHORIZATION_COMMENT_ID}\`
          EOF
          gh issue comment "$QUALIFICATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/dashboard-authorized.md

  pause:
    if: >-
      github.event.issue.number == 1261 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      startsWith(github.event.comment.body, '/r4f-g3-isolation-pause ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      GH_TOKEN: ${{ github.token }}
      AUTHORIZATION_BODY: ${{ github.event.comment.body }}
      AUTHORIZATION_CREATED_AT: ${{ github.event.comment.created_at }}
      AUTHORIZATION_COMMENT_ID: ${{ github.event.comment.id }}
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Parse and verify exact pause authorization
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          regex='^/r4f-g3-isolation-pause commit=([a-f0-9]{40}) project=([a-f0-9]{64}) job=([0-9]+) command=([a-f0-9]{64}) prepare_run=([0-9]+) dashboard_auth=([0-9]+)$'
          [[ "$AUTHORIZATION_BODY" =~ $regex ]] || { echo 'pause authorization command shape mismatch' >&2; exit 1; }
          commit="${BASH_REMATCH[1]}"
          project_digest="${BASH_REMATCH[2]}"
          job_id="${BASH_REMATCH[3]}"
          command_digest="${BASH_REMATCH[4]}"
          prepare_run="${BASH_REMATCH[5]}"
          dashboard_auth="${BASH_REMATCH[6]}"

          test "$job_id" -gt 0
          test "$prepare_run" -gt 0
          test "$dashboard_auth" -gt 0
          test "$commit" = "$(git rev-parse HEAD)"
          [[ "$SUPABASE_PROJECT_ID" =~ ^[a-z]{20}$ ]]
          actual_project_digest="$(printf '%s' "$SUPABASE_PROJECT_ID" | sha256sum | awk '{print $1}')"
          test "$project_digest" = "$actual_project_digest"

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${prepare_run}" > /tmp/isolation-prepare-run.json
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${QUALIFICATION_ISSUE}/comments?per_page=100" \
            | jq -s 'add' > /tmp/issue-comments.json

          DASHBOARD_AUTH="$dashboard_auth" COMMIT="$commit" PROJECT_DIGEST="$project_digest" JOB_ID="$job_id" COMMAND_DIGEST="$command_digest" PREPARE_RUN="$prepare_run" PAUSE_AUTH_CREATED_AT="$AUTHORIZATION_CREATED_AT" node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const comments = JSON.parse(readFileSync('/tmp/issue-comments.json', 'utf8'))
          const id = Number(process.env.DASHBOARD_AUTH)
          const comment = comments.find((item) => Number(item?.id) === id)
          if (!comment || comment?.user?.login !== 'badjoke-lab') throw new Error('dashboard authorization comment not found')
          const expected = `/r4f-g3-dashboard-authorize scope=r4f_g3_dashboard_capture commit=${process.env.COMMIT} project=${process.env.PROJECT_DIGEST} job=${process.env.JOB_ID} command=${process.env.COMMAND_DIGEST} prepare_run=${process.env.PREPARE_RUN}`
          if (comment.body !== expected) throw new Error('dashboard authorization tuple mismatch')
          const dashboardAt = Date.parse(String(comment.created_at ?? ''))
          const pauseAt = Date.parse(String(process.env.PAUSE_AUTH_CREATED_AT ?? ''))
          if (!Number.isFinite(dashboardAt) || !Number.isFinite(pauseAt) || !(dashboardAt < pauseAt)) {
            throw new Error('dashboard authorization must precede pause authorization')
          }
          writeFileSync('/tmp/dashboard-auth-created-at.txt', String(comment.created_at))
          NODE

          dashboard_created_at="$(cat /tmp/dashboard-auth-created-at.txt)"
          node scripts/verify-r4f-g3-isolation-prepare-proposal.mjs \
            --comments /tmp/issue-comments.json \
            --run /tmp/isolation-prepare-run.json \
            --prepare-run "$prepare_run" \
            --commit "$commit" \
            --project-digest "$project_digest" \
            --job-id "$job_id" \
            --command-digest "$command_digest" \
            --authorization-created-at "$dashboard_created_at"

          printf 'commit=%s\nproject_digest=%s\njob_id=%s\ncommand_digest=%s\nprepare_run=%s\ndashboard_auth=%s\n' \
            "$commit" "$project_digest" "$job_id" "$command_digest" "$prepare_run" "$dashboard_auth" >> "$GITHUB_OUTPUT"

      - name: Pause only the exact collector scheduler with automatic restore watchdog
        id: pause
        env:
          PROJECT_DIGEST: ${{ steps.auth.outputs.project_digest }}
          JOB_ID: ${{ steps.auth.outputs.job_id }}
          COMMAND_DIGEST: ${{ steps.auth.outputs.command_digest }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/manage-r4f-g3-isolated-window.mjs \
            --mode pause \
            --expected-job-id "$JOB_ID" \
            --expected-command-digest "$COMMAND_DIGEST" \
            --expected-project-digest "$PROJECT_DIGEST" \
            --output-directory r4f-g3-isolated-window-evidence

          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs'
          const value = JSON.parse(readFileSync('r4f-g3-isolated-window-evidence/pause.json', 'utf8'))
          if (value.purpose !== 'r4f-g3-isolated-window-pause') throw new Error('pause evidence purpose mismatch')
          if (value.checks?.automaticRestoreWatchdogInstalledFirst !== true) throw new Error('restore watchdog ordering not verified')
          if (value.checks?.collectorSchedulerPaused !== true) throw new Error('collector scheduler pause not verified')
          if (value.checks?.quietIntervalSeconds !== 65) throw new Error('quiet interval mismatch')
          const output = process.env.GITHUB_OUTPUT
          if (!output) throw new Error('GITHUB_OUTPUT is unavailable')
          const lines = [
            `paused_at=${value.pausedAt}`,
            `quiet_ready_at=${value.quietReadyAt}`,
            `restore_deadline=${value.automaticRestoreDeadline}`,
            `watchdog_job_id=${value.scheduler.watchdogJobId}`,
            `tick_count=${value.collectorRuntime.tickCount}`,
          ]
          appendFileSync(output, `${lines.join('\n')}\n`)
          NODE

      - name: Upload sanitized pause evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r4f-g3-isolated-window-pause-evidence
          path: r4f-g3-isolated-window-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Publish isolated-window ready locator
        if: success()
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PROJECT_DIGEST: ${{ steps.auth.outputs.project_digest }}
          JOB_ID: ${{ steps.auth.outputs.job_id }}
          COMMAND_DIGEST: ${{ steps.auth.outputs.command_digest }}
          DASHBOARD_AUTH: ${{ steps.auth.outputs.dashboard_auth }}
          QUIET_READY_AT: ${{ steps.pause.outputs.quiet_ready_at }}
          RESTORE_DEADLINE: ${{ steps.pause.outputs.restore_deadline }}
          TICK_COUNT: ${{ steps.pause.outputs.tick_count }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/isolation-ready.md <<EOF
          ## R4F G3 isolated window ready

          Pause run: ${RUN_URL}
          Pause authorization comment: \`${AUTHORIZATION_COMMENT_ID}\`
          Dashboard authorization comment: \`${DASHBOARD_AUTH}\`
          Project identity digest: \`${PROJECT_DIGEST}\`
          Prior collector cron job id: \`${JOB_ID}\`
          Scheduler command digest: \`${COMMAND_DIGEST}\`
          Quiet-ready at: \`${QUIET_READY_AT}\`
          Collector tick count at quiet-ready: \`${TICK_COUNT}\`
          Automatic restore deadline: \`${RESTORE_DEADLINE}\`

          The one-minute collector scheduler is absent and the collector has been quiet for at least 65 seconds. Capture the project-filtered Supabase Usage → Total Egress BEFORE reading now. Retain its source artifact SHA-256 and Edge Function Invocations count.

          Record the retained BEFORE reading with this exact shape, then request a one-shot prepare using the resulting comment id:

          \`/r4f-g3-before dashboard_auth=${DASHBOARD_AUTH} pause_run=${GITHUB_RUN_ID} project=${PROJECT_DIGEST} captured_at=<UTC> invocations=<EDGE_FUNCTION_INVOCATIONS> artifact=<SHA256>\`

          \`/r4f-g3-prepare dashboard_auth=${DASHBOARD_AUTH} pause_run=${GITHUB_RUN_ID} before_comment=<BEFORE_COMMENT_ID> project=${PROJECT_DIGEST}\`

          Do not execute the one-shot before the BEFORE marker is retained. Do not wait past the automatic restore deadline.
          EOF
          gh issue comment "$QUALIFICATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/isolation-ready.md

  resume:
    if: >-
      github.event.issue.number == 1261 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      startsWith(github.event.comment.body, '/r4f-g3-isolation-resume ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      GH_TOKEN: ${{ github.token }}
      RESUME_BODY: ${{ github.event.comment.body }}
      RESUME_CREATED_AT: ${{ github.event.comment.created_at }}
    steps:
      - name: Check out current main for recovery code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Parse and verify successful one-shot before immediate resume
        id: resume_auth
        shell: bash
        run: |
          set -euo pipefail
          regex='^/r4f-g3-isolation-resume project=([a-f0-9]{64}) job=([0-9]+) command=([a-f0-9]{64}) pause_run=([0-9]+) one_shot_run=([0-9]+) before_comment=([0-9]+)$'
          [[ "$RESUME_BODY" =~ $regex ]] || { echo 'resume command shape mismatch' >&2; exit 1; }
          project_digest="${BASH_REMATCH[1]}"
          job_id="${BASH_REMATCH[2]}"
          command_digest="${BASH_REMATCH[3]}"
          pause_run="${BASH_REMATCH[4]}"
          one_shot_run="${BASH_REMATCH[5]}"
          before_comment="${BASH_REMATCH[6]}"
          test "$job_id" -gt 0
          test "$pause_run" -gt 0
          test "$one_shot_run" -gt 0
          test "$before_comment" -gt 0
          [[ "$SUPABASE_PROJECT_ID" =~ ^[a-z]{20}$ ]]
          actual_project_digest="$(printf '%s' "$SUPABASE_PROJECT_ID" | sha256sum | awk '{print $1}')"
          test "$project_digest" = "$actual_project_digest"

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${pause_run}" > /tmp/pause-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${one_shot_run}" > /tmp/one-shot-run.json
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${QUALIFICATION_ISSUE}/comments?per_page=100" \
            | jq -s 'add' > /tmp/issue-comments.json

          node scripts/verify-r4f-g3-resume-sequence.mjs \
            --comments /tmp/issue-comments.json \
            --pause-run /tmp/pause-run.json \
            --one-shot-run /tmp/one-shot-run.json \
            --pause-run-id "$pause_run" \
            --before-comment-id "$before_comment" \
            --project-digest "$project_digest" \
            --job-id "$job_id" \
            --command-digest "$command_digest" \
            --resume-created-at "$RESUME_CREATED_AT" > /tmp/resume-sequence.json

          before_captured_at="$(jq -r '.beforeCapturedAt' /tmp/resume-sequence.json)"
          printf 'project_digest=%s\njob_id=%s\ncommand_digest=%s\npause_run=%s\none_shot_run=%s\nbefore_comment=%s\nbefore_captured_at=%s\n' \
            "$project_digest" "$job_id" "$command_digest" "$pause_run" "$one_shot_run" "$before_comment" "$before_captured_at" >> "$GITHUB_OUTPUT"

      - name: Restore exact collector scheduler and remove isolation watchdog
        env:
          PROJECT_DIGEST: ${{ steps.resume_auth.outputs.project_digest }}
          JOB_ID: ${{ steps.resume_auth.outputs.job_id }}
          COMMAND_DIGEST: ${{ steps.resume_auth.outputs.command_digest }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/manage-r4f-g3-isolated-window.mjs \
            --mode resume \
            --expected-job-id "$JOB_ID" \
            --expected-command-digest "$COMMAND_DIGEST" \
            --expected-project-digest "$PROJECT_DIGEST" \
            --output-directory r4f-g3-isolated-window-evidence

      - name: Upload sanitized resume evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r4f-g3-isolated-window-resume-evidence
          path: r4f-g3-isolated-window-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Publish restoration and post-resume AFTER marker shape
        if: success()
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PAUSE_RUN: ${{ steps.resume_auth.outputs.pause_run }}
          ONE_SHOT_RUN: ${{ steps.resume_auth.outputs.one_shot_run }}
          BEFORE_COMMENT: ${{ steps.resume_auth.outputs.before_comment }}
          PROJECT_DIGEST: ${{ steps.resume_auth.outputs.project_digest }}
          COMMAND_DIGEST: ${{ steps.resume_auth.outputs.command_digest }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/isolation-resume.md <<EOF
          ## R4F G3 isolated window restored before Usage refresh

          Resume run: ${RUN_URL}
          Pause run: \`${PAUSE_RUN}\`
          One-shot run: \`${ONE_SHOT_RUN}\`
          BEFORE capture comment: \`${BEFORE_COMMENT}\`
          Project identity digest: \`${PROJECT_DIGEST}\`
          Scheduler command digest: \`${COMMAND_DIGEST}\`

          The exact collector scheduler has been restored and G3 isolation watchdogs have been removed immediately after the successful sequence-bound one-shot. Supabase Usage freshness did not gate restoration. This resume path does not mutate R5 state, change the public reader, enable Mainnet, or authorize stabilization/soak.

          Now wait for a fresh project-filtered Supabase Usage → Total Egress reading. G3 qualification still requires AFTER Edge Function Invocations to exceed the retained BEFORE count by at least one.

          Record the fresh AFTER reading with this exact shape:

          \`/r4f-g3-after run=${ONE_SHOT_RUN} pause_run=${PAUSE_RUN} resume_run=${GITHUB_RUN_ID} before_comment=${BEFORE_COMMENT} project=${PROJECT_DIGEST} captured_at=<UTC> invocations=<EDGE_FUNCTION_INVOCATIONS> artifact=<SHA256>\`
          EOF
          gh issue comment "$QUALIFICATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/isolation-resume.md
