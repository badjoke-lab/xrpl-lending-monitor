name: DB-less D2 Current base candidate

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: db-less-d2-current-base-candidate
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.issue.number == 1673 &&
        github.event.comment.user.login == 'badjoke-lab' &&
        github.event.comment.body == '/d2-build-base-candidate'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      D2_ISSUE: '1673'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build D2 executables
        run: |
          pnpm build:release-current-state
          pnpm build:db-less-current-base
          pnpm build:db-less-current-base-verifier

      - name: Capture source revision
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=d2-current-base-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Build fresh fixed-ledger source snapshot
        shell: bash
        run: |
          set -euo pipefail
          node .release-current-state-build/run-release-current-state.mjs             --local             --output-dir .local/d2-source             --release-tag "$RELEASE_TAG"             --page-limit 50000             --object-limit-per-page 2048             --index-buckets 64             --data-segments 20

      - name: Build Release-compatible DB-less base
        shell: bash
        run: |
          set -euo pipefail
          node .db-less-current-base-read-model-build/build-db-less-current-base-read-model.mjs             --local             --input-dir .local/d2-source/assets             --output-dir .local/d2-base             --source-revision "$SOURCE_REVISION"             --page-size 4096             --lookup-prefix-length 2

      - name: Independently verify generated base
        shell: bash
        run: |
          set -euo pipefail
          node .db-less-current-base-verifier-build/verify-db-less-current-base.mjs             --assets-dir .local/d2-base/assets             --output .local/d2-base/base-verification-summary.json

      - name: Assert Release asset ceiling before publication
        shell: bash
        run: |
          set -euo pipefail
          count="$(jq -r '.releaseAssetCount' .local/d2-base/base-read-model-summary.json)"
          test "$count" -le 1000
          actual="$(find .local/d2-base/assets -maxdepth 1 -type f | wc -l | tr -d ' ')"
          test "$actual" -eq "$count"

      - name: Create or recover exact draft candidate Release
        shell: bash
        run: |
          set -euo pipefail
          cat > .local/d2-base/release-notes.md <<EOF
          DB-less D2 Current base candidate.

          This prerelease is evidence only and is not the active public Current channel.
          Source revision: $SOURCE_REVISION
          Actions run: $GITHUB_RUN_ID
          EOF

          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > .local/d2-base/releases-pages.json

          matches="$(jq --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)] | length' .local/d2-base/releases-pages.json)"
          if [ "$matches" -gt 1 ]; then
            echo "Duplicate Release tag entries exist for $RELEASE_TAG" >&2
            exit 1
          fi

          if [ "$matches" -eq 1 ]; then
            jq --arg tag "$RELEASE_TAG" '.[][] | select(.tag_name == $tag)' \
              .local/d2-base/releases-pages.json \
              > .local/d2-base/draft-release.json

            test "$(jq -r '.draft' .local/d2-base/draft-release.json)" = "true"
            test "$(jq -r '.prerelease' .local/d2-base/draft-release.json)" = "false"
            test "$(jq -r '.name' .local/d2-base/draft-release.json)" = "DB-less D2 Current base $GITHUB_RUN_ID"

            release_id="$(jq -r '.id' .local/d2-base/draft-release.json)"
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
              > .local/d2-base/release-assets-pages.json
            test "$(jq '[.[][]] | length' .local/d2-base/release-assets-pages.json)" -eq 0
          else
            jq -n \
              --arg tag "$RELEASE_TAG" \
              --arg target "$SOURCE_REVISION" \
              --arg name "DB-less D2 Current base $GITHUB_RUN_ID" \
              --rawfile body .local/d2-base/release-notes.md \
              '{
                tag_name: $tag,
                target_commitish: $target,
                name: $name,
                body: $body,
                draft: true,
                prerelease: false
              }' > .local/d2-base/create-release.json

            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/releases" \
              --input .local/d2-base/create-release.json \
              > .local/d2-base/draft-release.json

            test "$(jq -r '.tag_name' .local/d2-base/draft-release.json)" = "$RELEASE_TAG"
            test "$(jq -r '.draft' .local/d2-base/draft-release.json)" = "true"
            test "$(jq -r '.prerelease' .local/d2-base/draft-release.json)" = "false"
            release_id="$(jq -r '.id' .local/d2-base/draft-release.json)"
          fi

          test "$release_id" -ge 1
          echo "D2_RELEASE_ID=$release_id" >> "$GITHUB_ENV"

      - name: Upload candidate assets with throttled retry
        shell: bash
        run: |
          set -euo pipefail
          release_id="$D2_RELEASE_ID"
          test "$release_id" -ge 1
          mapfile -d '' files < <(find .local/d2-base/assets -maxdepth 1 -type f -print0 | sort -z)
          delays=(5 15 30 60 120 180)

          for file in "${files[@]}"; do
            name="$(basename "$file")"
            expected_size="$(stat -c '%s' "$file")"
            expected_digest="sha256:$(sha256sum "$file" | awk '{print $1}')"
            attempt=0

            while :; do
              response=".local/d2-base/upload-response.json"
              code="$(curl --silent --show-error --location                 --output "$response"                 --write-out '%{http_code}'                 --request POST                 --header 'Accept: application/vnd.github+json'                 --header "Authorization: Bearer $GH_TOKEN"                 --header 'X-GitHub-Api-Version: 2026-03-10'                 --header 'Content-Type: application/octet-stream'                 --data-binary "@$file"                 "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$name" || true)"

              if [ "$code" = "201" ]; then
                uploaded_name="$(jq -r '.name' "$response")"
                uploaded_size="$(jq -r '.size' "$response")"
                uploaded_digest="$(jq -r '.digest // empty' "$response")"
                test "$uploaded_name" = "$name"
                test "$uploaded_size" = "$expected_size"
                test "$uploaded_digest" = "$expected_digest"
                break
              fi

              # An uncertain failed response can race with a successful server-side upload.
              # Before retrying, accept only an exact remote name/size/digest match.
              gh api --paginate --slurp                 "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100"                 > .local/d2-base/release-assets-pages.json
              matches="$(jq --arg name "$name" '[.[][] | select(.name == $name)] | length' .local/d2-base/release-assets-pages.json)"
              if [ "$matches" -eq 1 ]; then
                remote_size="$(jq -r --arg name "$name" '.[][] | select(.name == $name) | .size' .local/d2-base/release-assets-pages.json)"
                remote_digest="$(jq -r --arg name "$name" '.[][] | select(.name == $name) | .digest // empty' .local/d2-base/release-assets-pages.json)"
                if [ "$remote_size" = "$expected_size" ] && [ "$remote_digest" = "$expected_digest" ]; then
                  break
                fi
                echo "Remote asset conflict after upload failure: $name" >&2
                exit 1
              fi
              if [ "$matches" -gt 1 ]; then
                echo "Duplicate remote Release asset name: $name" >&2
                exit 1
              fi

              if [ "$attempt" -ge "${#delays[@]}" ]; then
                echo "Release asset upload failed after bounded retries: $name (HTTP $code)" >&2
                cat "$response" >&2 || true
                exit 1
              fi

              delay="${delays[$attempt]}"
              echo "Upload $name returned HTTP $code; retrying after ${delay}s." >&2
              sleep "$delay"
              attempt=$((attempt + 1))
            done

            # Avoid tripping GitHub's secondary rate limiter with a burst of uploads.
            sleep 1
          done

      - name: Verify uploaded Release asset names sizes and digests
        shell: bash
        run: |
          set -euo pipefail
          release_id="$D2_RELEASE_ID"
          test "$release_id" -ge 1
          gh api --paginate --slurp             "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100"             > .local/d2-base/release-assets-pages.json
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto'
          import { createReadStream } from 'node:fs'
          import { readdir, stat, readFile } from 'node:fs/promises'
          import { join } from 'node:path'

          async function digest(path) {
            const hash = createHash('sha256')
            for await (const chunk of createReadStream(path)) hash.update(chunk)
            return `sha256:${hash.digest('hex')}`
          }

          const dir = '.local/d2-base/assets'
          const pages = JSON.parse(await readFile('.local/d2-base/release-assets-pages.json', 'utf8'))
          const remote = pages.flat()
          const localNames = (await readdir(dir)).sort()
          if (remote.length !== localNames.length) {
            throw new Error(`Release asset count mismatch: ${remote.length} != ${localNames.length}`)
          }

          const byName = new Map()
          for (const asset of remote) {
            if (byName.has(asset.name)) throw new Error(`Duplicate Release asset name: ${asset.name}`)
            byName.set(asset.name, asset)
          }

          for (const name of localNames) {
            const asset = byName.get(name)
            if (!asset) throw new Error(`Missing Release asset ${name}`)
            const path = join(dir, name)
            const info = await stat(path)
            if (asset.size !== info.size) throw new Error(`Release asset size mismatch for ${name}`)
            const localDigest = await digest(path)
            if (asset.digest !== localDigest) {
              throw new Error(`Release asset digest mismatch for ${name}`)
            }
          }
          NODE

      - name: Publish verified candidate as prerelease
        shell: bash
        run: |
          set -euo pipefail
          jq -n '{
            draft: false,
            prerelease: true,
            make_latest: "false"
          }' > .local/d2-base/publish-release.json

          gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$D2_RELEASE_ID" \
            --input .local/d2-base/publish-release.json \
            > .local/d2-base/published-release.json

          test "$(jq -r '.id' .local/d2-base/published-release.json)" = "$D2_RELEASE_ID"
          test "$(jq -r '.tag_name' .local/d2-base/published-release.json)" = "$RELEASE_TAG"
          test "$(jq -r '.draft' .local/d2-base/published-release.json)" = "false"
          test "$(jq -r '.prerelease' .local/d2-base/published-release.json)" = "true"

          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            > .local/d2-base/published-release-readback.json
          test "$(jq -r '.id' .local/d2-base/published-release-readback.json)" = "$D2_RELEASE_ID"
          test "$(jq -r '.draft' .local/d2-base/published-release-readback.json)" = "false"
          test "$(jq -r '.prerelease' .local/d2-base/published-release-readback.json)" = "true"

      - name: Record D2 candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          ledger="$(jq -r '.ledgerIndex' .local/d2-base/base-read-model-summary.json)"
          hash="$(jq -r '.ledgerHash' .local/d2-base/base-read-model-summary.json)"
          vaults="$(jq -r '.counts.vaults' .local/d2-base/base-read-model-summary.json)"
          brokers="$(jq -r '.counts.loanBrokers' .local/d2-base/base-read-model-summary.json)"
          loans="$(jq -r '.counts.loans' .local/d2-base/base-read-model-summary.json)"
          assets="$(jq -r '.releaseAssetCount' .local/d2-base/base-read-model-summary.json)"
          bytes="$(jq -r '.totalCompressedBytes' .local/d2-base/base-read-model-summary.json)"
          manifest="$(jq -r '.manifestSha256' .local/d2-base/base-read-model-summary.json)"
          gh issue comment "$D2_ISSUE" --body "$(cat <<EOF
          D2 candidate build PASS.

          - run: $GITHUB_RUN_ID
          - source revision: `$SOURCE_REVISION`
          - release tag: `$RELEASE_TAG`
          - ledger: `$ledger`
          - ledger hash: `$hash`
          - Vaults: `$vaults`
          - LoanBrokers: `$brokers`
          - Loans: `$loans`
          - Release assets: `$assets`
          - compressed bytes: `$bytes`
          - base manifest SHA-256: `$manifest`

          The release is a prerelease evidence candidate only. It is not the active public Current channel.
          EOF
          )"

      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-less-d2-current-base-evidence
          path: |
            .local/d2-source/release-summary.json
            .local/d2-base/base-read-model-summary.json
            .local/d2-base/base-verification-summary.json
            .local/d2-base/assets/base-manifest.json
            .local/d2-base/draft-release.json
            .local/d2-base/release-assets-pages.json
            .local/d2-base/published-release.json
            .local/d2-base/published-release-readback.json
          if-no-files-found: warn
          retention-days: 30