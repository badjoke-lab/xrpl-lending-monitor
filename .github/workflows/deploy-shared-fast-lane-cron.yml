name: Deploy shared fast lane cron

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-shared-fast-lane-cron.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

concurrency:
  group: deploy-shared-fast-lane-cron
  cancel-in-progress: true

jobs:
  deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p shared-fast-lane-deploy-evidence

      - name: Apply pending remote D1 migrations
        run: pnpm exec wrangler d1 migrations apply xrpl-lending-monitor --remote | tee shared-fast-lane-deploy-evidence/migrations.txt

      - name: Reset only isolated fast-lane shadow state and run metrics
        shell: bash
        run: |
          cat > /tmp/reset-shared-fast-lane.sql <<'SQL'
          DELETE FROM fast_lane_shadow_commit_guards;
          DELETE FROM fast_lane_shadow_windows;
          DELETE FROM fast_lane_shadow_objects_compact;
          DELETE FROM fast_lane_shadow_state;
          DELETE FROM fast_lane_shadow_run_metrics;
          SQL
          pnpm exec wrangler d1 execute xrpl-lending-monitor --remote \
            --file /tmp/reset-shared-fast-lane.sql \
            --json > shared-fast-lane-deploy-evidence/reset.json

      - name: Build deploy assets
        run: pnpm build:deploy-assets

      - name: Validate shared Worker config
        run: pnpm exec wrangler deploy --config wrangler.jsonc --dry-run

      - name: Deploy shared Worker code
        run: pnpm exec wrangler deploy --config wrangler.jsonc | tee shared-fast-lane-deploy-evidence/deploy.txt

      - name: Replace XRPL schedule with one five-minute trigger
        run: |
          curl --fail-with-body --silent --show-error \
            -X PUT \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-monitor/schedules" \
            -d '[{"cron":"*/5 * * * *"}]' \
            > shared-fast-lane-deploy-evidence/schedule-update.json
          cat shared-fast-lane-deploy-evidence/schedule-update.json
          jq -e '.success == true and (.result.schedules | length == 1) and (.result.schedules[0].cron == "*/5 * * * *")' \
            shared-fast-lane-deploy-evidence/schedule-update.json > /dev/null

      - name: Confirm account trigger count remains five
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-monitor/schedules" \
            > shared-fast-lane-deploy-evidence/main-schedules.json
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-fast-lane-shadow/schedules" \
            > shared-fast-lane-deploy-evidence/separate-fast-schedules.json
          jq -e '.result.schedules | length == 1 and .[0].cron == "*/5 * * * *"' \
            shared-fast-lane-deploy-evidence/main-schedules.json > /dev/null
          jq -e '.result.schedules | length == 0' \
            shared-fast-lane-deploy-evidence/separate-fast-schedules.json > /dev/null

      - name: Wait for two successful shared fast-lane run metrics
        shell: bash
        run: |
          set -euo pipefail
          for ATTEMPT in $(seq 1 28); do
            pnpm exec wrangler d1 execute xrpl-lending-monitor --remote \
              --command "SELECT run_at,status,start_ledger_index,end_ledger_index,latest_observed_ledger,lag_ledgers,ledgers_processed,lending_transactions,coalesced_object_rows,persistence_rows_read,persistence_rows_written FROM fast_lane_shadow_run_metrics WHERE network='devnet' ORDER BY run_at ASC;" \
              --json > shared-fast-lane-deploy-evidence/metrics-latest-raw.txt
            sed -n '/^\[/,$p' shared-fast-lane-deploy-evidence/metrics-latest-raw.txt \
              > shared-fast-lane-deploy-evidence/metrics-latest.json
            COUNT="$(jq '.[0].results | length' shared-fast-lane-deploy-evidence/metrics-latest.json)"
            if [ "${COUNT}" -ge 2 ]; then
              jq '.[0].results' shared-fast-lane-deploy-evidence/metrics-latest.json \
                > shared-fast-lane-deploy-evidence/metrics-confirmed.json
              break
            fi
            sleep 30
          done
          test -f shared-fast-lane-deploy-evidence/metrics-confirmed.json

      - name: Verify cursor advance and observed cadence
        shell: bash
        run: |
          set -euo pipefail
          jq -e 'length >= 2' shared-fast-lane-deploy-evidence/metrics-confirmed.json > /dev/null
          FIRST_LEDGER="$(jq -r '.[0].end_ledger_index' shared-fast-lane-deploy-evidence/metrics-confirmed.json)"
          SECOND_LEDGER="$(jq -r '.[1].end_ledger_index' shared-fast-lane-deploy-evidence/metrics-confirmed.json)"
          FIRST_AT="$(jq -r '.[0].run_at' shared-fast-lane-deploy-evidence/metrics-confirmed.json)"
          SECOND_AT="$(jq -r '.[1].run_at' shared-fast-lane-deploy-evidence/metrics-confirmed.json)"
          GAP_SECONDS="$(node -e 'process.stdout.write(String((Date.parse(process.argv[2])-Date.parse(process.argv[1]))/1000))' "${FIRST_AT}" "${SECOND_AT}")"
          FIRST_WRITES="$(jq -r '.[0].persistence_rows_written' shared-fast-lane-deploy-evidence/metrics-confirmed.json)"
          SECOND_WRITES="$(jq -r '.[1].persistence_rows_written' shared-fast-lane-deploy-evidence/metrics-confirmed.json)"
          test "${SECOND_LEDGER}" -gt "${FIRST_LEDGER}"
          test "${GAP_SECONDS}" -gt 0
          test "${GAP_SECONDS}" -le 900
          jq -n \
            --argjson first_ledger "${FIRST_LEDGER}" \
            --argjson second_ledger "${SECOND_LEDGER}" \
            --arg first_run_at "${FIRST_AT}" \
            --arg second_run_at "${SECOND_AT}" \
            --argjson observed_gap_seconds "${GAP_SECONDS}" \
            --argjson first_rows_written "${FIRST_WRITES}" \
            --argjson second_rows_written "${SECOND_WRITES}" \
            '{schemaVersion:1,passed:true,first_ledger:$first_ledger,second_ledger:$second_ledger,ledger_advance:($second_ledger-$first_ledger),first_run_at:$first_run_at,second_run_at:$second_run_at,observed_gap_seconds:$observed_gap_seconds,first_rows_written:$first_rows_written,second_rows_written:$second_rows_written}' \
            > shared-fast-lane-deploy-evidence/summary.json
          cat shared-fast-lane-deploy-evidence/summary.json

      - name: Upload retained deployment evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: shared-fast-lane-deploy-evidence
          path: shared-fast-lane-deploy-evidence
          if-no-files-found: warn
          retention-days: 14
