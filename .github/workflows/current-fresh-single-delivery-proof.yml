name: Current fresh single-delivery proof

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: current-repair-production-worker-write
  cancel-in-progress: false

env:
  QUALIFICATION_ISSUE: '995'
  QUEUE_ID: 2ae398f2edbf43749e45cd7ede77c6cd
  DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
  SCRIPT_NAME: xrpl-lending-monitor
  REPAIRED_VERSION_ID: 4cc326be-6f7b-4d8e-8f0e-3d2008aa1045
  PRODUCTION_BASE: https://xrpl-lending-monitor.badjoke-lab.workers.dev
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  proof:
    if: >-
      github.event.issue.number == 995 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      github.event.comment.body == '/current-fresh-single-delivery-proof'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out current control and proof script
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare against exact stopped production state
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          export CURRENT_REPAIR_BOUNDED_PROOF_OUTPUT=current-fresh-single-delivery-proof/prepare
          python scripts/current-repair-bounded-proof.py --prepare
          result="$CURRENT_REPAIR_BOUNDED_PROOF_OUTPUT/result.json"
          test "$(jq -r '.safeToRunBoundedProof' "$result")" = true
          test "$(jq -r '.productionMutation' "$result")" = false
          digest="$(jq -r '.stateDigest' "$result")"
          target="$(jq -r '.targetScheduledTime' "$result")"
          test -n "$digest" && test "$digest" != null
          test "$target" -gt 0
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Execute exactly one fresh bounded delivery
        shell: bash
        env:
          AUTHORIZED_STATE_DIGEST: ${{ steps.prepare.outputs.digest }}
          AUTHORIZED_TARGET_SCHEDULED_TIME: ${{ steps.prepare.outputs.target }}
        run: |
          set -euo pipefail
          export CURRENT_REPAIR_BOUNDED_PROOF_OUTPUT=current-fresh-single-delivery-proof/execute
          python scripts/current-repair-bounded-proof.py --execute
          result="$CURRENT_REPAIR_BOUNDED_PROOF_OUTPUT/result.json"
          test "$(jq -r '.passed' "$result")" = true
          test "$(jq -r '.seedMessageSent' "$result")" = true
          test "$(jq -r '.queueResumed' "$result")" = true
          test "$(jq -r '.queueRepaused' "$result")" = true
          test "$(jq -r '.ledgerDelta' "$result")" -ge 1
          test "$(jq -r '.ledgerDelta' "$result")" -le 32
          test "$(jq -r '.finalSchedules | length' "$result")" -eq 0

      - name: Prove post-proof Queue remains paused
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p current-fresh-single-delivery-proof/final
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues/${QUEUE_ID}"
          curl -fsS -H "$auth" "$base" | tee current-fresh-single-delivery-proof/final/queue.json \
            | jq -e '.success == true and .result.settings.delivery_paused == true' >/dev/null
          curl -fsS -X POST -H "$auth" -H 'Content-Type: application/json' \
            "$base/messages/peek" -d '{"batch_size":2}' \
            | tee current-fresh-single-delivery-proof/final/peek.json >/dev/null

      - name: Upload fresh proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-fresh-single-delivery-proof
          path: current-fresh-single-delivery-proof
          if-no-files-found: warn
          retention-days: 30
