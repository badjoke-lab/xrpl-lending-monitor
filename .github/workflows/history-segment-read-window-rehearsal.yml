name: History segment read-window rehearsal

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/run-history-segment.ts'
      - '.github/workflows/history-segment-read-window-rehearsal.yml'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:history-segment

      - name: Freeze 24-ledger validated range
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p read-window-rehearsal
          jq -n '{method:"ledger",params:[{ledger_index:"validated",transactions:false,expand:false}]}' > read-window-rehearsal/head-request.json
          curl --fail-with-body --silent --show-error --retry 3 -H 'Content-Type: application/json' --data @read-window-rehearsal/head-request.json https://devnet.honeycluster.io/ > read-window-rehearsal/head-response.json
          END="$(jq -r '.result.ledger_index // .result.ledger.ledger_index // empty' read-window-rehearsal/head-response.json)"
          START="$((END - 23))"
          ANCHOR="$((START - 1))"
          jq -n --argjson ledger_index "${ANCHOR}" '{method:"ledger",params:[{ledger_index:$ledger_index,transactions:false,expand:false}]}' > read-window-rehearsal/anchor-request.json
          curl --fail-with-body --silent --show-error --retry 3 -H 'Content-Type: application/json' --data @read-window-rehearsal/anchor-request.json https://devnet.honeycluster.io/ > read-window-rehearsal/anchor-response.json
          ANCHOR_HASH="$(jq -r '.result.ledger_hash // .result.ledger.ledger_hash // empty' read-window-rehearsal/anchor-response.json)"
          printf '%s' "${ANCHOR_HASH}" | grep -Eq '^[A-F0-9]{64}$'
          jq -n --argjson start "${START}" --argjson end "${END}" --arg hash "${ANCHOR_HASH}" '{start:$start,end:$end,anchorHash:$hash}' > read-window-rehearsal/range.json

      - name: Build sequential segment
        shell: bash
        run: |
          set -euo pipefail
          START="$(jq -r .start read-window-rehearsal/range.json)"
          END="$(jq -r .end read-window-rehearsal/range.json)"
          ANCHOR_HASH="$(jq -r .anchorHash read-window-rehearsal/range.json)"
          STARTED="$(date +%s%3N)"
          node .history-segment-build/run-history-segment.mjs --local --endpoint https://devnet.honeycluster.io/ --timeout-ms 12000 --read-window-size 1 --start-ledger "${START}" --end-ledger "${END}" --epoch-id devnet-3371675 --segment-id read-window-rehearsal --previous-segment-id anchor --previous-segment-end-hash "${ANCHOR_HASH}" --source-revision window-rehearsal --output-dir read-window-rehearsal/window1 > read-window-rehearsal/window1.stdout.json
          echo $(( $(date +%s%3N) - STARTED )) > read-window-rehearsal/window1-elapsed-ms.txt

      - name: Build window-4 segment
        shell: bash
        run: |
          set -euo pipefail
          START="$(jq -r .start read-window-rehearsal/range.json)"
          END="$(jq -r .end read-window-rehearsal/range.json)"
          ANCHOR_HASH="$(jq -r .anchorHash read-window-rehearsal/range.json)"
          STARTED="$(date +%s%3N)"
          node .history-segment-build/run-history-segment.mjs --local --endpoint https://devnet.honeycluster.io/ --timeout-ms 12000 --read-window-size 4 --start-ledger "${START}" --end-ledger "${END}" --epoch-id devnet-3371675 --segment-id read-window-rehearsal --previous-segment-id anchor --previous-segment-end-hash "${ANCHOR_HASH}" --source-revision window-rehearsal --output-dir read-window-rehearsal/window4 > read-window-rehearsal/window4.stdout.json
          echo $(( $(date +%s%3N) - STARTED )) > read-window-rehearsal/window4-elapsed-ms.txt

      - name: Require byte-identical segment artifacts
        shell: bash
        run: |
          set -euo pipefail
          (cd read-window-rehearsal/window1 && find . -type f -print0 | sort -z | xargs -0 sha256sum) > read-window-rehearsal/window1-sha256.txt
          (cd read-window-rehearsal/window4 && find . -type f -print0 | sort -z | xargs -0 sha256sum) > read-window-rehearsal/window4-sha256.txt
          diff -u read-window-rehearsal/window1-sha256.txt read-window-rehearsal/window4-sha256.txt
          jq -n --slurpfile range read-window-rehearsal/range.json --argjson window1ElapsedMs "$(cat read-window-rehearsal/window1-elapsed-ms.txt)" --argjson window4ElapsedMs "$(cat read-window-rehearsal/window4-elapsed-ms.txt)" '{passed:true,range:$range[0],window1ElapsedMs:$window1ElapsedMs,window4ElapsedMs:$window4ElapsedMs,byteIdentical:true}' > read-window-rehearsal/evidence.json

      - name: Upload retained read-window evidence
        uses: actions/upload-artifact@v4
        with:
          name: history-segment-read-window-rehearsal
          path: read-window-rehearsal
          if-no-files-found: error
          retention-days: 30
