name: Verify fast lane against exact ledger state

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-fast-lane-against-ledger.yml'
      - 'scripts/verify-fast-lane-against-ledger.ts'
      - 'vite.fast-lane-ledger-diff.config.ts'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p fast-lane-ledger-diff-evidence

      - name: Capture one internally consistent fast-lane head sample
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler d1 execute xrpl-lending-monitor --remote \
            --command "SELECT s.last_processed_ledger,s.last_processed_hash,o.object_type,o.object_id,o.operation,o.projection_json FROM fast_lane_shadow_state s JOIN fast_lane_shadow_objects_compact o ON o.network=s.network AND o.epoch_id=s.epoch_id WHERE s.network='devnet' ORDER BY o.object_type ASC,o.object_id ASC LIMIT 100;" \
            --json > fast-lane-ledger-diff-evidence/sample-raw.txt
          sed -n '/^\[/,$p' fast-lane-ledger-diff-evidence/sample-raw.txt \
            > fast-lane-ledger-diff-evidence/sample.json
          jq -e 'type == "array" and length > 0 and .[0].success == true and (.[0].results | length > 0)' \
            fast-lane-ledger-diff-evidence/sample.json > /dev/null

      - name: Build exact-ledger verifier
        run: pnpm exec vite build --config vite.fast-lane-ledger-diff.config.ts

      - name: Compare sampled fast-lane rows with exact ledger_entry state
        run: |
          node .fast-lane-ledger-diff-build/verify-fast-lane-against-ledger.mjs \
            --endpoint https://devnet.honeycluster.io/ \
            --input fast-lane-ledger-diff-evidence/sample.json \
            --output fast-lane-ledger-diff-evidence/summary.json \
            --concurrency 8
          jq -e '.passed == true and .sampleSize > 0 and ((.counts.mismatch // 0) == 0) and ((.counts.unexpected_present // 0) == 0) and ((.counts.rpc_error // 0) == 0)' \
            fast-lane-ledger-diff-evidence/summary.json > /dev/null

      - name: Upload retained exact-ledger evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fast-lane-exact-ledger-diff-evidence
          path: fast-lane-ledger-diff-evidence
          if-no-files-found: warn
          retention-days: 14
