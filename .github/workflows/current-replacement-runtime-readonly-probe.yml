name: Current replacement runtime read-only probe

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: current-replacement-runtime-readonly-probe
  cancel-in-progress: false

env:
  PRODUCTION_BASE: https://xrpl-lending-monitor.badjoke-lab.workers.dev

jobs:
  probe:
    if: >-
      github.event.issue.number == 995 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      github.event.comment.body == '/current-replacement-runtime-probe'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read deployed replacement-base dry-run status
        shell: bash
        run: |
          set -euo pipefail
          ROOT=current-replacement-runtime-readonly-probe
          mkdir -p "${ROOT}"
          code="$(curl -sS -o "${ROOT}/replacement-base-rebase.json" -w '%{http_code}' \
            "${PRODUCTION_BASE}/api/status/replacement-base-rebase")"
          test "${code}" = 200
          jq -e '
            (.target.epochId | type == "string" and length > 0)
            and (.target.snapshotId | type == "string" and length > 0)
            and (.target.ledgerIndex | type == "number")
            and (.target.ledgerHash | test("^[A-F0-9]{64}$"))
            and (.status == "ready" or .status == "replayed")
          ' "${ROOT}/replacement-base-rebase.json" >/dev/null
          jq -n \
            --arg implementationCommit "${GITHUB_SHA}" \
            --argjson response "$(cat "${ROOT}/replacement-base-rebase.json")" \
            '{
              passed:true,
              productionMutation:false,
              implementationCommit:$implementationCommit,
              deployedTarget:$response.target,
              dryRunStatus:$response.status,
              plan:($response.plan // null),
              evidence:($response.evidence // null)
            }' | tee "${ROOT}/result.json"

      - name: Upload deployed runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: current-replacement-runtime-readonly-probe
          path: current-replacement-runtime-readonly-probe
          if-no-files-found: error
          retention-days: 30
