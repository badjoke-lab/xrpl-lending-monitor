name: Formal Free-operation soak hourly monitor

on:
  schedule:
    - cron: '10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: formal-free-operation-soak-hourly
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: '974'
    steps:
      - uses: actions/checkout@v4
      - name: Check active formal window and hourly invariants
        shell: bash
        run: |
          set -Eeuo pipefail
          status="$(jq -r '.status' .github/formal-free-soak-window.json)"
          start="$(jq -r '.startAt' .github/formal-free-soak-window.json)"
          end="$(jq -r '.endAt' .github/formal-free-soak-window.json)"
          now="$(date -u +%s)"; s="$(date -u -d "$start" +%s)"; e="$(date -u -d "$end" +%s)"
          if [ "$status" != running ] || [ "$now" -lt "$s" ] || [ "$now" -ge "$e" ]; then exit 0; fi
          mkdir -p hourly-evidence
          query(){ jq -n --arg sql "$1" '{sql:$sql}' | curl --fail-with-body --silent --show-error -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' --data-binary @- "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query" > "$2"; jq -e '.success==true and ([.result[].success]|all)' "$2" >/dev/null; }
          query "WITH b AS (SELECT run_at,status,lag_ledgers,error_message,CAST(strftime('%s',run_at)/300 AS INTEGER) slot_id FROM fast_lane_shadow_run_metrics WHERE network='devnet' AND julianday(run_at)>=julianday('now','-70 minutes')),r AS (SELECT *,ROW_NUMBER() OVER(PARTITION BY slot_id ORDER BY run_at DESC) rn,SUM(CASE WHEN status='error' OR error_message IS NOT NULL THEN 1 ELSE 0 END) OVER(PARTITION BY slot_id) errors FROM b) SELECT slot_id,run_at,status,lag_ledgers,error_message,errors FROM r WHERE rn=1 ORDER BY slot_id" hourly-evidence/slots.json
          query "SELECT COUNT(*) stale_rows FROM current_state_overlay_objects o WHERE o.network='devnet' AND NOT EXISTS (SELECT 1 FROM fast_lane_shadow_base_binding b WHERE b.network=o.network AND b.base_epoch_id=o.epoch_id AND b.base_snapshot_id=o.base_snapshot_id)" hourly-evidence/stale.json
          query "SELECT COUNT(*) compact_rows FROM fast_lane_shadow_objects_compact WHERE network='devnet'" hourly-evidence/compact.json
          query "SELECT COUNT(*) state_rows,MAX(overlay_ledger_index) overlay_ledger_index FROM current_state_overlay_state WHERE network='devnet'" hourly-evidence/state.json
          slots_ok="$(jq '.result[0].results as $s | ($s|length)>=12 and (($s[-1].slot_id-$s[0].slot_id)==(($s|length)-1)) and ($s|all((.status=="committed" or .status=="caught_up") and .lag_ledgers==0 and .error_message==null and .errors==0))' hourly-evidence/slots.json)"
          stale="$(jq -r '.result[0].results[0].stale_rows' hourly-evidence/stale.json)"
          compact="$(jq -r '.result[0].results[0].compact_rows' hourly-evidence/compact.json)"
          states="$(jq -r '.result[0].results[0].state_rows' hourly-evidence/state.json)"
          passed="$(jq -n --argjson a "$slots_ok" --argjson b "$stale" --argjson c "$compact" --argjson d "$states" '$a and $b==0 and $c==0 and $d==1')"
          jq -n --argjson passed "$passed" --slurpfile slots hourly-evidence/slots.json --argjson stale "$stale" --argjson compact "$compact" --argjson states "$states" '{passed:$passed,checkedAt:(now|todate),slots:$slots[0].result[0].results,staleRows:$stale,compactRows:$compact,stateRows:$states}' > hourly-evidence/summary.json
          { echo 'Formal soak hourly checkpoint:'; echo; echo '```json'; cat hourly-evidence/summary.json; echo '```'; } > hourly-evidence/comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file hourly-evidence/comment.md
          test "$passed" = true
