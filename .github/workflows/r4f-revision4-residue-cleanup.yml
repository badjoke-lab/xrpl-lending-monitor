name: R4F Revision4 Residue Cleanup

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: r4f-revision4-residue-cleanup
  cancel-in-progress: false

env:
  QUALIFICATION_ISSUE: '1261'
  CLEANUP_SCRIPT: 'scripts/r4f-revision4-residue-cleanup.mjs'

jobs:
  prepare:
    if: >-
      github.event.issue.number == 1261 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      github.event.comment.body == '/r4f-revision4-residue-cleanup-prepare'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Verify repository cleanup contract
        run: bash scripts/test-r4f-revision4-residue-cleanup-contract.sh

      - name: Inspect exact revision-4 residue read-only
        id: state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r4f-revision4-residue-cleanup-evidence
          source_commit="$(git rev-parse HEAD)"
          node "$CLEANUP_SCRIPT" inspect \
            --expect residue \
            --source-commit "$source_commit" \
            --output r4f-revision4-residue-cleanup-evidence/prepare-state.json \
            > /tmp/r4f-residue-prepare-result.json
          cat /tmp/r4f-residue-prepare-result.json
          state_sha="$(jq -r '.stateSha256' /tmp/r4f-residue-prepare-result.json)"
          pg_state="$(jq -r '.pgStateMd5' /tmp/r4f-residue-prepare-result.json)"
          project_digest="$(jq -r '.projectIdentityDigest' /tmp/r4f-residue-prepare-result.json)"
          [[ "$state_sha" =~ ^[a-f0-9]{64}$ ]]
          [[ "$pg_state" =~ ^[a-f0-9]{32}$ ]]
          [[ "$project_digest" =~ ^[a-f0-9]{64}$ ]]
          printf 'source_commit=%s\nstate_sha=%s\npg_state=%s\nproject_digest=%s\n' \
            "$source_commit" "$state_sha" "$pg_state" "$project_digest" >> "$GITHUB_OUTPUT"

      - name: Create exact expiring cleanup proposal
        id: proposal
        env:
          SOURCE_COMMIT: ${{ steps.state.outputs.source_commit }}
          STATE_SHA: ${{ steps.state.outputs.state_sha }}
          PG_STATE: ${{ steps.state.outputs.pg_state }}
          PROJECT_DIGEST: ${{ steps.state.outputs.project_digest }}
        shell: bash
        run: |
          set -euo pipefail
          test "$SOURCE_COMMIT" = "$(git rev-parse HEAD)"
          expires="$(date -u -d '+2 hours' '+%Y-%m-%dT%H:%M:%SZ')"
          nonce="$(openssl rand -hex 8)"
          auth_command="/r4f-revision4-residue-cleanup-authorize commit=${SOURCE_COMMIT} state=${STATE_SHA} pgstate=${PG_STATE} project=${PROJECT_DIGEST} prepare_run=${GITHUB_RUN_ID} expires=${expires} nonce=${nonce}"
          printf 'expires=%s\nnonce=%s\nauth_command=%s\n' \
            "$expires" "$nonce" "$auth_command" >> "$GITHUB_OUTPUT"

      - name: Upload sanitized residue preparation evidence
        uses: actions/upload-artifact@v4
        with:
          name: r4f-revision4-residue-cleanup-prepare-evidence
          path: r4f-revision4-residue-cleanup-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Publish exact cleanup authorization proposal
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_COMMIT: ${{ steps.state.outputs.source_commit }}
          STATE_SHA: ${{ steps.state.outputs.state_sha }}
          PG_STATE: ${{ steps.state.outputs.pg_state }}
          PROJECT_DIGEST: ${{ steps.state.outputs.project_digest }}
          EXPIRES: ${{ steps.proposal.outputs.expires }}
          AUTH_COMMAND: ${{ steps.proposal.outputs.auth_command }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r4f-residue-cleanup-proposal.md <<EOF
          ## R4F revision-4 runtime-function residue cleanup authorization proposal

          Preparation run: \`${GITHUB_RUN_ID}\`
          Run: ${RUN_URL}
          Source main commit: \`${SOURCE_COMMIT}\`
          Exact sanitized residue-state SHA-256: \`${STATE_SHA}\`
          Exact six-function PostgreSQL source-set MD5: \`${PG_STATE}\`
          Project identity digest: \`${PROJECT_DIGEST}\`
          Authorization expires: \`${EXPIRES}\`

          Read-only preparation proved the cleanup boundary before proposing any mutation:

          - revision-4 migration history remains unrecorded; only the two already-applied reclaim migrations are present in the bounded history set;
          - revision-4 checkpoint/run/batch row counts are exactly \`0 / 0 / 0\`;
          - exactly the six expected revision-4 runtime functions are present and each function definition is hash-bound in the sanitized evidence;
          - the revision-4 egress policy table/helpers/constraint and accounting-evidence table/inner completion/reader are all absent.

          The exact command below authorizes **only** one atomic PostgreSQL cleanup statement that revalidates the same migration history, zero row counts, artifact absence, six function identities, and source-set MD5 immediately before dropping these six functions with default RESTRICT semantics:

          1. \`public.xrpl_complete_r5_revision4_recovery_batch(...)\`
          2. \`public.xrpl_claim_r5_revision4_recovery_batch_from_prepared_head(...)\`
          3. \`public.xrpl_claim_r5_revision4_recovery_batch(...)\`
          4. \`public.xrpl_rebind_r5_revision4_prebatch_recovery_to_active_boundary(...)\`
          5. \`public.xrpl_rebind_r5_revision4_prebatch_recovery_to_active_boundary_strict(...)\`
          6. \`public.xrpl_prepare_r5_revision4_active_recovery(...)\`

          No CASCADE is used. This does **not** authorize migration-history changes, table/row mutation, collector pause/resume, Edge Function deploy/delete, qualification execution, active R5 replacement, public-reader mutation, Mainnet, stabilization, soak, or G3/provider-dashboard work.

          Exact authorization command:

          \`${AUTH_COMMAND}\`

          Preparation itself was read-only and made no production mutation.
          EOF
          gh issue comment "$QUALIFICATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/r4f-residue-cleanup-proposal.md

  execute:
    if: >-
      github.event.issue.number == 1261 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      startsWith(github.event.comment.body, '/r4f-revision4-residue-cleanup-authorize ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      GH_TOKEN: ${{ github.token }}
      AUTHORIZATION_BODY: ${{ github.event.comment.body }}
      AUTHORIZATION_CREATED_AT: ${{ github.event.comment.created_at }}
      AUTHORIZATION_COMMENT_ID: ${{ github.event.comment.id }}
    steps:
      - name: Check out exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Verify repository cleanup contract
        run: bash scripts/test-r4f-revision4-residue-cleanup-contract.sh

      - name: Parse exact owner cleanup authorization
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          regex='^/r4f-revision4-residue-cleanup-authorize commit=([a-f0-9]{40}) state=([a-f0-9]{64}) pgstate=([a-f0-9]{32}) project=([a-f0-9]{64}) prepare_run=([0-9]+) expires=([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z) nonce=([a-f0-9]{16})$'
          [[ "$AUTHORIZATION_BODY" =~ $regex ]] || { echo 'cleanup authorization command shape mismatch' >&2; exit 1; }
          commit="${BASH_REMATCH[1]}"
          state_sha="${BASH_REMATCH[2]}"
          pg_state="${BASH_REMATCH[3]}"
          project_digest="${BASH_REMATCH[4]}"
          prepare_run="${BASH_REMATCH[5]}"
          expires="${BASH_REMATCH[6]}"
          nonce="${BASH_REMATCH[7]}"

          test "$commit" = "$(git rev-parse HEAD)"
          [[ "$SUPABASE_PROJECT_ID" =~ ^[a-z]{20}$ ]]
          actual_project_digest="$(printf '%s' "$SUPABASE_PROJECT_ID" | sha256sum | awk '{print $1}')"
          test "$project_digest" = "$actual_project_digest"
          test "$prepare_run" -gt 0

          expires_epoch="$(date -u -d "$expires" +%s)"
          auth_epoch="$(date -u -d "$AUTHORIZATION_CREATED_AT" +%s)"
          now_epoch="$(date -u +%s)"
          test "$auth_epoch" -lt "$expires_epoch"
          test "$now_epoch" -le "$expires_epoch"
          test $((expires_epoch - auth_epoch)) -le 7200

          printf 'commit=%s\nstate_sha=%s\npg_state=%s\nproject_digest=%s\nprepare_run=%s\nexpires=%s\nnonce=%s\n' \
            "$commit" "$state_sha" "$pg_state" "$project_digest" "$prepare_run" "$expires" "$nonce" >> "$GITHUB_OUTPUT"

      - name: Verify exact prior proposal and unique owner authorization
        id: provenance
        env:
          COMMIT: ${{ steps.auth.outputs.commit }}
          PREPARE_RUN: ${{ steps.auth.outputs.prepare_run }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREPARE_RUN}" > /tmp/r4f-residue-prepare-run.json
          jq -e --arg commit "$COMMIT" \
            '.event == "issue_comment" and .conclusion == "success" and .head_sha == $commit and .actor.login == "badjoke-lab"' \
            /tmp/r4f-residue-prepare-run.json > /dev/null
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${QUALIFICATION_ISSUE}/comments?per_page=100" \
            | jq -s 'add' > /tmp/r4f-residue-comments.json
          EXPECTED_COMMAND="$AUTHORIZATION_BODY" PREPARE_RUN="$PREPARE_RUN" AUTH_CREATED_AT="$AUTHORIZATION_CREATED_AT" node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const comments = JSON.parse(readFileSync('/tmp/r4f-residue-comments.json', 'utf8'))
          const expected = process.env.EXPECTED_COMMAND
          const prepareRun = process.env.PREPARE_RUN
          const authorizationAt = Date.parse(process.env.AUTH_CREATED_AT ?? '')
          const proposals = comments.filter((comment) =>
            comment?.user?.login === 'github-actions[bot]'
            && typeof comment?.body === 'string'
            && comment.body.includes(`Preparation run: \`${prepareRun}\``)
            && comment.body.includes(`\`${expected}\``),
          )
          if (proposals.length !== 1) throw new Error(`expected one exact prior cleanup proposal, found ${proposals.length}`)
          const proposalAt = Date.parse(proposals[0].created_at ?? '')
          if (!Number.isFinite(proposalAt) || !Number.isFinite(authorizationAt) || !(proposalAt < authorizationAt)) {
            throw new Error('cleanup proposal must precede owner authorization')
          }
          const exactOwnerCommands = comments.filter((comment) =>
            comment?.user?.login === 'badjoke-lab' && comment?.body === expected
          )
          if (exactOwnerCommands.length !== 1) {
            throw new Error(`cleanup authorization command must be unique, found ${exactOwnerCommands.length}`)
          }
          NODE

      - name: Revalidate exact authorized residue state read-only
        id: revalidate
        env:
          COMMIT: ${{ steps.auth.outputs.commit }}
          AUTH_STATE_SHA: ${{ steps.auth.outputs.state_sha }}
          AUTH_PG_STATE: ${{ steps.auth.outputs.pg_state }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r4f-revision4-residue-cleanup-evidence
          node "$CLEANUP_SCRIPT" inspect \
            --expect residue \
            --source-commit "$COMMIT" \
            --output r4f-revision4-residue-cleanup-evidence/pre-cleanup-state.json \
            > /tmp/r4f-residue-pre-cleanup-result.json
          cat /tmp/r4f-residue-pre-cleanup-result.json
          test "$(jq -r '.stateSha256' /tmp/r4f-residue-pre-cleanup-result.json)" = "$AUTH_STATE_SHA"
          test "$(jq -r '.pgStateMd5' /tmp/r4f-residue-pre-cleanup-result.json)" = "$AUTH_PG_STATE"

      - name: Drop only the exact six authorized runtime residue functions atomically
        id: cleanup
        env:
          AUTH_PG_STATE: ${{ steps.auth.outputs.pg_state }}
        shell: bash
        run: |
          set -euo pipefail
          node "$CLEANUP_SCRIPT" cleanup \
            --authorized-pgstate "$AUTH_PG_STATE" \
            --output r4f-revision4-residue-cleanup-evidence/cleanup-mutation.json \
            2>&1 | tee r4f-revision4-residue-cleanup-evidence/cleanup-mutation.log

      - name: Verify exact clean post-state read-only
        id: post
        if: always() && steps.cleanup.outcome == 'success'
        env:
          COMMIT: ${{ steps.auth.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          node "$CLEANUP_SCRIPT" inspect \
            --expect clean \
            --source-commit "$COMMIT" \
            --output r4f-revision4-residue-cleanup-evidence/post-cleanup-state.json \
            > /tmp/r4f-residue-post-cleanup-result.json
          cat /tmp/r4f-residue-post-cleanup-result.json

      - name: Upload sanitized cleanup evidence
        if: always() && steps.auth.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: r4f-revision4-residue-cleanup-evidence
          path: r4f-revision4-residue-cleanup-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Publish bounded cleanup result
        if: always() && steps.auth.outcome == 'success' && steps.provenance.outcome == 'success'
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ steps.auth.outputs.commit }}
          STATE_SHA: ${{ steps.auth.outputs.state_sha }}
          PG_STATE: ${{ steps.auth.outputs.pg_state }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
          POST_OUTCOME: ${{ steps.post.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          verdict=FAIL
          if [ "$CLEANUP_OUTCOME" = success ] && [ "$POST_OUTCOME" = success ]; then
            verdict=PASS
          fi
          cat > /tmp/r4f-residue-cleanup-result.md <<EOF
          ## R4F revision-4 runtime-function residue cleanup — ${verdict}

          Run: ${RUN_URL}
          Source commit: \`${COMMIT}\`
          Authorization comment: \`${AUTHORIZATION_COMMENT_ID}\`
          Authorized residue-state SHA-256: \`${STATE_SHA}\`
          Authorized PostgreSQL source-set MD5: \`${PG_STATE}\`
          Atomic six-function cleanup: \`${CLEANUP_OUTCOME}\`
          Independent read-only clean-state verification: \`${POST_OUTCOME}\`

          Scope was limited to the exact six hash-bound revision-4 runtime functions. No CASCADE, migration-history mutation, table/row mutation, collector mutation, Edge Function mutation, qualification execution, active R5 replacement, public-reader mutation, Mainnet, stabilization, soak, or G3/provider-dashboard action was authorized by this workflow.
          EOF
          gh issue comment "$QUALIFICATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/r4f-residue-cleanup-result.md
