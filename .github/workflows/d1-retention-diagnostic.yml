name: D1 retention diagnostic

on:
  pull_request:
    paths:
      - "src/worker/repositories/d1-snapshot-retention*.ts"
      - "wrangler.d1-test.jsonc"
      - ".github/workflows/d1-retention-diagnostic.yml"

permissions:
  contents: read

jobs:
  focused-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run focused D1 retention tests
        run: pnpm exec vitest run src/worker/repositories/d1-snapshot-retention.integration.test.ts src/worker/repositories/d1-snapshot-restore.test.ts src/worker/repositories/d1-snapshot-eligibility.test.ts src/worker/repositories/d1-snapshot-retention.test.ts --reporter=json --outputFile=d1-retention-test.json
      - name: Upload focused test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-retention-test-result
          path: d1-retention-test.json
          if-no-files-found: error
          retention-days: 3
