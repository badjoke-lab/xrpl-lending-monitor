name: Current fresh replacement base build

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

concurrency:
  group: current-fresh-replacement-base-build-filtered-binary
  cancel-in-progress: false

env:
  QUALIFICATION_ISSUE: '995'
  CANDIDATE_BRANCH: current-state-fresh-replacement-candidate-data
  ACTIVE_EPOCH_ID: devnet-3371675
  MINIMUM_LEDGER: '4086727'

jobs:
  build:
    if: >-
      github.event.issue.number == 995 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      github.event.comment.body == '/current-fresh-replacement-base-build'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Check out isolated candidate branch
        uses: actions/checkout@v4
        with:
          ref: current-state-fresh-replacement-candidate-data
          path: .local/candidate
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install current XRPL binary codec for fresh build
        run: pnpm add --ignore-workspace-root-check --save-exact ripple-binary-codec@2.10.0

      - name: Build fresh validated Devnet snapshot
        shell: bash
        run: |
          set -euo pipefail

          # Full binary traversal is fast but Devnet contains newer unrelated ledger
          # entry fields that even the current published codec cannot decode. Keep the
          # 2048-entry binary pagination, but ask xrpld to return only the three lending
          # entry types needed by this release. Each filtered pass still advances its
          # marker through the complete fixed ledger tree, so all three passes must
          # reach marker exhaustion before the snapshot is complete. The 120-minute job
          # timeout remains the outer safety bound. Source-shape guards fail closed.
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises'

          const path = 'scripts/run-release-current-state.ts'
          let source = await readFile(path, 'utf8')

          function replaceExactlyOnce(from, to, label) {
            const first = source.indexOf(from)
            if (first < 0) throw new Error(`fresh-base patch target missing: ${label}`)
            if (source.indexOf(from, first + from.length) >= 0) {
              throw new Error(`fresh-base patch target repeated: ${label}`)
            }
            source = `${source.slice(0, first)}${to}${source.slice(first + from.length)}`
          }

          replaceExactlyOnce(
            "import { decode } from '@xrpl-commons/ripple-binary-codec'",
            "import { decode } from 'ripple-binary-codec'",
            'fresh builder codec import',
          )

          const traversalStartMarker = 'async function streamFullLedgerTraversal('
          const traversalEndMarker = '\nasync function appendIndexRecordsForSegment'
          const traversalStart = source.indexOf(traversalStartMarker)
          if (traversalStart < 0) throw new Error('fresh filtered traversal start missing')
          if (source.indexOf(traversalStartMarker, traversalStart + traversalStartMarker.length) >= 0) {
            throw new Error('fresh filtered traversal start repeated')
          }
          const traversalEnd = source.indexOf(traversalEndMarker, traversalStart)
          if (traversalEnd < 0) throw new Error('fresh filtered traversal end missing')
          if (source.indexOf(traversalEndMarker, traversalEnd + traversalEndMarker.length) >= 0) {
            throw new Error('fresh filtered traversal end repeated')
          }

          const filteredTraversal = `async function streamFullLedgerTraversal(options: Arguments, ledger: LedgerIdentity, workDataDir: string): Promise<TraversalResult> {
            const client = new XrplJsonRpcClient({ endpoint: options.endpoint, timeoutMs: options.timeoutMs })
            const counts = emptyCounts()
            const entryTypes = ['Vault', 'LoanBroker', 'Loan'] as const
            let sourcePages = 0
            let decodedObjectCount = 0
            let relevantObjectCount = 0

            process.stderr.write('Running binary type-filtered traversal until marker exhaustion for Vault, LoanBroker, Loan.\\n')
            for (const entryType of entryTypes) {
              const seenMarkers = new Set<string>()
              let marker: unknown = undefined
              let page = 0

              process.stderr.write(\`Starting ledger_data type filter \${entryType}.\\n\`)
              for (;;) {
                const params: Record<string, unknown> = {
                  ledger_hash: ledger.ledgerHash,
                  binary: true,
                  limit: options.objectLimitPerPage,
                  type: entryType,
                }
                if (marker !== undefined) params.marker = marker

                const result = await client.call<LedgerDataResult>('ledger_data', params)
                const ledgerHash = id(requiredString(result.ledger_hash, 'ledger_hash'), 'ledger_hash')
                const ledgerIndex = requiredLedgerIndex(result.ledger_index)
                if (ledgerHash !== ledger.ledgerHash || ledgerIndex !== ledger.ledgerIndex) throw new Error('ledger_data moved during filtered traversal')
                if (result.validated !== true) throw new Error('ledger_data response must describe a validated ledger')
                if (!Array.isArray(result.state)) throw new Error('ledger_data response state must be an array')

                page += 1
                sourcePages += 1
                const pageBatches = Array.from({ length: options.dataSegments }, () => [] as ReleaseNativeDataRecord[])

                for (let index = 0; index < result.state.length; index += 1) {
                  const stateEntry = result.state[index]
                  if (!isRecord(stateEntry)) throw new Error(\`state[\${index}] must be an object\`)
                  const binaryHex = requiredHex(stateEntry.data, \`state[\${index}].data\`)
                  const decoded = decode(binaryHex)
                  if (!isRecord(decoded)) throw new Error(\`state[\${index}] did not decode to an object\`)
                  decodedObjectCount += 1

                  if (decoded.LedgerEntryType !== entryType) {
                    throw new Error(\`ledger_data type filter \${entryType} returned \${String(decoded.LedgerEntryType)}\`)
                  }
                  const kind = kindFromLedgerEntryType(decoded.LedgerEntryType)
                  if (!kind) throw new Error(\`Unexpected filtered ledger entry type \${String(decoded.LedgerEntryType)}\`)

                  const objectId = id(requiredString(stateEntry.index, \`state[\${index}].index\`), \`state[\${index}].index\`)
                  const value: Record<string, unknown> = {
                    ...decoded,
                    LedgerEntryType: decoded.LedgerEntryType,
                    index: objectId,
                  }
                  const segment = dataSegmentForId(objectId, options.dataSegments)
                  const record: ReleaseNativeDataRecord = {
                    schemaVersion: 1,
                    segmentId: segmentId(segment),
                    sourcePage: sourcePages,
                    id: objectId,
                    kind,
                    valueSha256: await sha256Hex(canonicalJson(value)),
                    value,
                  }
                  pageBatches[segment]!.push(record)
                  relevantObjectCount += 1
                  addKindCount(counts, kind)
                }

                for (let segment = 0; segment < pageBatches.length; segment += 1) {
                  await appendCanonicalLines(dataRawPath(workDataDir, segment), pageBatches[segment]!)
                }

                if (page % 100 === 0) {
                  process.stderr.write(\`Processed \${page} pages for \${entryType}; total source pages: \${sourcePages}; relevant objects: \${relevantObjectCount}; decoded objects: \${decodedObjectCount}.\\n\`)
                }

                marker = result.marker
                if (marker === undefined || marker === null) {
                  process.stderr.write(\`Completed ledger_data type filter \${entryType} after \${page} pages.\\n\`)
                  break
                }
                const fingerprint = markerFingerprint(marker)
                if (seenMarkers.has(fingerprint)) throw new Error(\`ledger_data repeated marker for \${entryType} after page \${page}\`)
                seenMarkers.add(fingerprint)
              }
            }

            return {
              sourcePages: Math.max(1, sourcePages),
              decodedObjectCount,
              relevantObjectCount,
              counts,
              complete: true,
            }
          }
          `

          source = `${source.slice(0, traversalStart)}${filteredTraversal}${source.slice(traversalEnd)}`
          await writeFile(path, source, 'utf8')
          NODE

          pnpm build:release-current-state
          RELEASE_TAG="current-fresh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          node .release-current-state-build/run-release-current-state.mjs \
            --local \
            --endpoint https://s.devnet.rippletest.net:51234/ \
            --timeout-ms 12000 \
            --page-limit 4000 \
            --object-limit-per-page 2048 \
            --epoch-id "${ACTIVE_EPOCH_ID}" \
            --release-tag "${RELEASE_TAG}" \
            --index-buckets 64 \
            --data-segments 20 \
            --output-dir .local/fresh-release \
            > .local/fresh-release.stdout.json

          jq -e \
            --arg epoch "${ACTIVE_EPOCH_ID}" \
            --argjson minimum "${MINIMUM_LEDGER}" '
              .complete == true
              and .ledger.ledgerIndex > $minimum
              and (.ledger.ledgerHash | test("^[A-F0-9]{64}$"))
            ' .local/fresh-release/release-summary.json >/dev/null
          jq -e --arg epoch "${ACTIVE_EPOCH_ID}" '
            .complete == true
            and .network == "devnet"
            and .epochId == $epoch
            and (.manifestSha256 | test("^[a-f0-9]{64}$"))
          ' .local/fresh-release/assets/manifest.json >/dev/null

      - name: Build compact read model from fresh snapshot
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vite build --config vite.base-current-state-read-model.config.ts
          node .base-current-state-read-model-build/build-base-current-state-read-model.mjs \
            --local \
            --input-dir .local/fresh-release/assets \
            --output-dir .local/fresh-read-model \
            --page-size 50 \
            --lookup-prefix-length 2 \
            > .local/fresh-read-model.stdout.json

          release_ledger="$(jq -r '.ledger.ledgerIndex' .local/fresh-release/release-summary.json)"
          release_hash="$(jq -r '.ledger.ledgerHash' .local/fresh-release/release-summary.json)"
          jq -e \
            --arg epoch "${ACTIVE_EPOCH_ID}" \
            --argjson ledger "${release_ledger}" \
            --arg hash "${release_hash}" '
              .complete == true
              and .epochId == $epoch
              and .ledgerIndex == $ledger
              and .ledgerHash == $hash
              and .lookupPrefixLength == 2
              and (.manifestSha256 | test("^[a-f0-9]{64}$"))
          ' .local/fresh-read-model/read-model/manifest.json >/dev/null

      - name: Publish isolated candidate data
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          candidate="${GITHUB_WORKSPACE}/.local/candidate"
          model="${GITHUB_WORKSPACE}/.local/fresh-read-model"
          release="${GITHUB_WORKSPACE}/.local/fresh-release"

          cd "$candidate"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$model/read-model" ./read-model
          cp "$model/base-read-model-summary.json" ./fresh-replacement-base-summary.json
          cp "$release/release-summary.json" ./fresh-replacement-release-summary.json

          ledger="$(jq -r '.ledgerIndex' read-model/manifest.json)"
          snapshot="$(jq -r '.snapshotId' read-model/manifest.json)"
          release_tag="$(jq -r '.releaseTag' read-model/manifest.json)"
          manifest_sha="$(jq -r '.manifestSha256' read-model/manifest.json)"

          git add -A
          git commit -m "Stage fresh replacement Current base ${ledger}"
          data_sha="$(git rev-parse HEAD)"
          git push --force-with-lease origin "HEAD:${CANDIDATE_BRANCH}"

          jq -n \
            --arg dataCommitSha "$data_sha" \
            --arg manifestSha256 "$manifest_sha" \
            --arg releaseTag "$release_tag" \
            --arg snapshotId "$snapshot" \
            --arg updatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schemaVersion:1,active:{dataCommitSha:$dataCommitSha,manifestPath:"read-model/manifest.json",manifestSha256:$manifestSha256,releaseTag:$releaseTag,snapshotId:$snapshotId},updatedAt:$updatedAt}' \
            > channel.json

          git add channel.json
          git commit -m "Activate fresh replacement Current candidate ${ledger}"
          candidate_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:${CANDIDATE_BRANCH}"

          echo "ledger=$ledger" >> "$GITHUB_OUTPUT"
          echo "snapshot=$snapshot" >> "$GITHUB_OUTPUT"
          echo "manifest_sha=$manifest_sha" >> "$GITHUB_OUTPUT"
          echo "data_sha=$data_sha" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"

      - name: Verify candidate branch resolves exact staged data
        shell: bash
        env:
          LEDGER: ${{ steps.publish.outputs.ledger }}
          SNAPSHOT: ${{ steps.publish.outputs.snapshot }}
          MANIFEST_SHA: ${{ steps.publish.outputs.manifest_sha }}
          DATA_SHA: ${{ steps.publish.outputs.data_sha }}
          CANDIDATE_SHA: ${{ steps.publish.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          git ls-remote origin "refs/heads/${CANDIDATE_BRANCH}" \
            | grep -F "${CANDIDATE_SHA}" >/dev/null
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${CANDIDATE_BRANCH}/channel.json" \
            > .local/candidate-channel-remote.json
          jq -e \
            --arg data "$DATA_SHA" \
            --arg snapshot "$SNAPSHOT" \
            --arg manifest "$MANIFEST_SHA" '
              .active.dataCommitSha == $data
              and .active.snapshotId == $snapshot
              and .active.manifestSha256 == $manifest
            ' .local/candidate-channel-remote.json >/dev/null
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${DATA_SHA}/read-model/manifest.json" \
            > .local/candidate-manifest-remote.json
          jq -e \
            --arg snapshot "$SNAPSHOT" \
            --arg manifest "$MANIFEST_SHA" \
            --argjson ledger "$LEDGER" '
              .complete == true
              and .snapshotId == $snapshot
              and .manifestSha256 == $manifest
              and .ledgerIndex == $ledger
            ' .local/candidate-manifest-remote.json >/dev/null

          jq -n \
            --arg branch "$CANDIDATE_BRANCH" \
            --argjson ledger "$LEDGER" \
            --arg snapshot "$SNAPSHOT" \
            --arg manifestSha256 "$MANIFEST_SHA" \
            --arg dataCommitSha "$DATA_SHA" \
            --arg candidateCommitSha "$CANDIDATE_SHA" \
            '{passed:true,productionMutation:false,historyMutation:false,candidateBranch:$branch,ledgerIndex:$ledger,snapshotId:$snapshot,manifestSha256:$manifestSha256,dataCommitSha:$dataCommitSha,candidateCommitSha:$candidateCommitSha}' \
            > .local/fresh-replacement-base-build-result.json

      - name: Upload candidate build summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-fresh-replacement-base-build
          path: |
            .local/fresh-replacement-base-build-result.json
            .local/fresh-release/release-summary.json
            .local/fresh-read-model/base-read-model-summary.json
            .local/candidate-channel-remote.json
            .local/candidate-manifest-remote.json
          if-no-files-found: warn
          retention-days: 30
