name: P0 exact-index fix status

on:
  issues:
    types: [opened]

permissions:
  actions: read
  issues: write

jobs:
  status:
    if: startsWith(github.event.issue.title, 'P0 exact-index fix status')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Report repair run
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${REPOSITORY}/actions/workflows/p0-fix-exact-index-decompression.yml/runs?event=issues&per_page=10" > /tmp/runs.json
          RUN_ID="$(jq -r '.workflow_runs[0].id // empty' /tmp/runs.json)"
          test -n "${RUN_ID}"
          gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" > /tmp/jobs.json
          gh run view "${RUN_ID}" --repo "${REPOSITORY}" --log-failed > /tmp/failed.log || true
          {
            echo 'Exact-index repair status:'
            echo '```json'
            jq --argjson runId "${RUN_ID}" '{run:[.workflow_runs[]|select(.id==$runId)|{id,status,conclusion,created_at,updated_at,html_url}][0]}' /tmp/runs.json
            jq '{jobs:[.jobs[]|{id,name,status,conclusion,steps:[.steps[]|{name,status,conclusion,number}]}]}' /tmp/jobs.json
            echo '```'
            echo
            echo 'Failure tail:'
            echo '```text'
            tail -n 100 /tmp/failed.log
            echo '```'
          } > /tmp/comment.md
          gh issue comment "${ISSUE_NUMBER}" --repo "${REPOSITORY}" --body-file /tmp/comment.md
