name: DB-less D4 validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'tsconfig.node.json'
      - 'scripts/build-db-less-current-overlay-checkpoint.ts'
      - 'scripts/publish-db-less-current-overlay-checkpoint.ts'
      - 'vite.db-less-current-overlay-checkpoint.config.ts'
      - 'vite.db-less-current-overlay-publisher.config.ts'
      - '.github/workflows/db-less-d4-current-overlay-rehearsal.yml'
      - '.github/workflows/db-less-d4-current-overlay-incremental-rehearsal.yml'
      - '.github/workflows/db-less-d4-current-overlay-preflight.yml'
      - '.github/workflows/db-less-d4-current-overlay-activate.yml'
      - 'src/shared/db-less/current-overlay-checkpoint.ts'
      - 'src/shared/db-less/current-overlay-checkpoint.test.ts'
      - 'src/shared/db-less/current-overlay-provenance.ts'
      - 'src/shared/db-less/current-overlay-provenance.test.ts'
      - 'src/shared/db-less/current-overlay-generation-reader.ts'
      - 'src/shared/db-less/current-overlay-generation-reader.test.ts'
      - 'src/shared/db-less/current-overlay-chain-compactor.ts'
      - 'src/shared/db-less/current-overlay-chain-compactor.test.ts'
      - 'src/shared/db-less/current-overlay-reader.ts'
      - 'src/shared/db-less/current-overlay-reader.test.ts'
      - 'src/shared/db-less/current-overlay-equivalence.ts'
      - 'src/shared/db-less/current-overlay-equivalence.test.ts'
      - 'src/shared/db-less/current-overlay-retention.ts'
      - 'src/shared/db-less/current-overlay-retention.test.ts'
      - 'src/shared/db-less/current-overlay-channel.ts'
      - 'src/shared/db-less/current-overlay-channel.test.ts'
      - 'src/shared/db-less/current-overlay-channel-github-release.ts'
      - 'src/shared/db-less/current-overlay-channel-github-release.test.ts'
      - 'src/shared/db-less/current-composite-reader.ts'
      - 'src/shared/db-less/current-composite-reader.test.ts'
      - 'src/shared/db-less/github-release-publication.ts'
      - 'src/shared/db-less/github-release-publication.test.ts'
      - '.github/workflows/db-less-d4-validation.yml'

permissions:
  contents: read

concurrency:
  group: db-less-d4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Report runner Node
        run: node --version

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Build D4 Current overlay CLIs
        run: |
          pnpm build:db-less-current-overlay-checkpoint
          pnpm build:db-less-current-overlay-publisher

      - name: Typecheck worker/shared graph
        run: pnpm exec tsc -p tsconfig.worker.json --noEmit

      - name: Typecheck Node build configs
        run: pnpm exec tsc -p tsconfig.node.json --noEmit

      - name: Lint D4 surface
        run: >-
          pnpm exec eslint
          scripts/build-db-less-current-overlay-checkpoint.ts
          scripts/publish-db-less-current-overlay-checkpoint.ts
          vite.db-less-current-overlay-checkpoint.config.ts
          vite.db-less-current-overlay-publisher.config.ts
          src/shared/db-less/current-overlay-checkpoint.ts
          src/shared/db-less/current-overlay-checkpoint.test.ts
          src/shared/db-less/current-overlay-provenance.ts
          src/shared/db-less/current-overlay-provenance.test.ts
          src/shared/db-less/current-overlay-generation-reader.test.ts
          src/shared/db-less/current-overlay-chain-compactor.test.ts
          src/shared/db-less/current-overlay-chain-compactor.ts
          src/shared/db-less/current-overlay-chain-compactor.test.ts
          src/shared/db-less/current-overlay-generation-reader.ts
          src/shared/db-less/current-overlay-generation-reader.test.ts
          src/shared/db-less/current-overlay-reader.ts
          src/shared/db-less/current-overlay-reader.test.ts
          src/shared/db-less/current-overlay-equivalence.ts
          src/shared/db-less/current-overlay-equivalence.test.ts
          src/shared/db-less/current-overlay-retention.ts
          src/shared/db-less/current-overlay-retention.test.ts
          src/shared/db-less/current-overlay-channel.ts
          src/shared/db-less/current-overlay-channel.test.ts
          src/shared/db-less/current-overlay-channel-github-release.ts
          src/shared/db-less/current-overlay-channel-github-release.test.ts
          src/shared/db-less/current-composite-reader.ts
          src/shared/db-less/current-composite-reader.test.ts
          src/shared/db-less/github-release-publication.ts
          src/shared/db-less/github-release-publication.test.ts

      - name: Validate D4 activation topology
        shell: bash
        run: |
          set -euo pipefail
          workflow=".github/workflows/db-less-d4-current-overlay-activate.yml"
          grep -Fq "startsWith(github.event.comment.body, '/d4-activate-current-overlay ')" "$workflow"
          grep -Fq "Verify exact D4 activation authorization" "$workflow"
          grep -Fq 'test "$actual_main" = "$expected_main"' "$workflow"
          grep -Fq 'test "$actual_channel" = "$expected_channel"' "$workflow"
          grep -Fq -- '--expected-channel-sha256 "$EXPECTED_D3_CHANNEL_SHA"' "$workflow"
          grep -Fq -- '--active-overlay-channel-release-tag "$D4_CHANNEL_RELEASE_TAG"' "$workflow"
          grep -Fq 'incrementalGenerationCount' "$workflow"
          grep -Fq 'traversedIncrementalManifests' "$workflow"
          grep -Fq "Verify checkpoint matches exact authorization" "$workflow"
          grep -Fq 'test "$(jq -r '"'"'.channelSha256'"'"' "$summary")" = "$EXPECTED_D3_CHANNEL_SHA"' "$workflow"
          grep -Fq 'AUTHORIZED_MAIN_SHA=$expected_main' "$workflow"
          grep -Fq 'EXPECTED_D3_CHANNEL_SHA=$expected_channel' "$workflow"
          grep -Fq "group: db-less-d4-current-overlay-activation" "$workflow"
          grep -Fq "pnpm build:db-less-current-overlay-publisher" "$workflow"
          grep -Fq 'db-less-current-overlay-v1-$through' "$workflow"
          grep -Fq "db-less-current-overlay-channel-v1" "$workflow"
          grep -Fq -- '--target "$AUTHORIZED_MAIN_SHA"' "$workflow"
          grep -Fq 'target_commitish="$AUTHORIZED_MAIN_SHA"' "$workflow"
          grep -Fq "Publish immutable checkpoint then activate D4 channel" "$workflow"
          preflight_workflow=".github/workflows/db-less-d4-current-overlay-preflight.yml"
          grep -Fq "github.event.issue.number == 1736" "$preflight_workflow"
          grep -Fq "github.event.comment.body == '/d4-activate-current-overlay-preflight'" "$preflight_workflow"
          grep -Fq "actions: read" "$preflight_workflow"
          grep -Fq "contents: read" "$preflight_workflow"
          grep -Fq -- '--expected-channel-sha256 "$EXPECTED_D3_CHANNEL_SHA"' "$preflight_workflow"
          grep -Fq -- '--active-overlay-channel-release-tag "$D4_CHANNEL_RELEASE_TAG"' "$preflight_workflow"
          grep -Fq -- '--max-generations 2048' "$preflight_workflow"
          grep -Fq "manifestSchemaVersion" "$preflight_workflow"
          grep -Fq "rolling-sha256-v1" "$preflight_workflow"
          grep -Fq "equivalence.equivalent" "$preflight_workflow"
          grep -Fq 'publicationMutation: false' "$preflight_workflow"
          incremental_workflow=".github/workflows/db-less-d4-current-overlay-incremental-rehearsal.yml"
          grep -Fq "/d4-rehearse-current-overlay-incremental" "$incremental_workflow"
          grep -Fq -- '--active-overlay-channel-release-tag db-less-current-overlay-channel-v1' "$incremental_workflow"
          grep -Fq "Build verified incremental Current overlay checkpoint locally" "$incremental_workflow"

      - name: D4 focused tests
        run: >-
          pnpm exec vitest run
          src/shared/db-less/current-overlay-checkpoint.test.ts
          src/shared/db-less/current-overlay-provenance.test.ts
          src/shared/db-less/current-overlay-generation-reader.test.ts
          src/shared/db-less/current-overlay-chain-compactor.test.ts
          src/shared/db-less/current-overlay-reader.test.ts
          src/shared/db-less/current-overlay-equivalence.test.ts
          src/shared/db-less/current-overlay-retention.test.ts
          src/shared/db-less/current-overlay-channel.test.ts
          src/shared/db-less/current-overlay-channel-github-release.test.ts
          src/shared/db-less/current-composite-reader.test.ts
          src/shared/db-less/github-release-publication.test.ts
