name: Current stale Queue peek

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: current-repair-production-worker-write
  cancel-in-progress: false

env:
  QUALIFICATION_ISSUE: '995'
  QUEUE_ID: 2ae398f2edbf43749e45cd7ede77c6cd
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  peek:
    if: >-
      github.event.issue.number == 995 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      github.event.comment.body == '/current-stale-queue-peek'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read paused Queue and peek at most two messages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p current-stale-queue-peek
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues/${QUEUE_ID}"
          curl -fsS -H "$auth" "$base" | tee current-stale-queue-peek/queue.json \
            | jq -e '.success == true and .result.settings.delivery_paused == true' >/dev/null
          curl -fsS -X POST -H "$auth" -H 'Content-Type: application/json' \
            "$base/messages/peek" -d '{"batch_size":2}' \
            | tee current-stale-queue-peek/peek.json \
            | jq -e '.success == true and ((.result.messages // .result // []) | length) <= 2' >/dev/null
          jq -n '{passed:true,productionMutation:false,queueResumed:false,queuePurged:false}' \
            > current-stale-queue-peek/result.json

      - name: Upload peek evidence
        uses: actions/upload-artifact@v4
        with:
          name: current-stale-queue-peek
          path: current-stale-queue-peek
          if-no-files-found: error
          retention-days: 14
