name: Current Queue operations read-only probe

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: current-queue-operations-readonly-probe
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  QUEUE_ID: 2ae398f2edbf43749e45cd7ede77c6cd

jobs:
  probe:
    if: >-
      github.event.issue.number == 995 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      github.event.comment.body == '/current-queue-operations-probe'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Query Queue message operations only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p current-queue-operations-probe

          query='query QueueMessageOperationsByMinute($accountTag: string!, $queueId: string!, $datetimeStart: Date!, $datetimeEnd: Date!) { viewer { accounts(filter: { accountTag: $accountTag }) { queueMessageOperationsAdaptiveGroups(limit: 10000 filter: { queueId: $queueId datetime_geq: $datetimeStart datetime_leq: $datetimeEnd } orderBy: [datetimeMinute_ASC]) { count sum { bytes } dimensions { datetimeMinute actionType consumerType outcome } } } } }'
          body="$(jq -cn \
            --arg query "$query" \
            --arg accountTag "$CLOUDFLARE_ACCOUNT_ID" \
            --arg queueId "$QUEUE_ID" \
            '{query:$query,variables:{accountTag:$accountTag,queueId:$queueId,datetimeStart:"2026-09-04",datetimeEnd:"2026-09-05"}}')"

          http_code="$(curl -sS -o current-queue-operations-probe/graphql.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            https://api.cloudflare.com/client/v4/graphql \
            --data "$body")"
          printf '%s\n' "$http_code" > current-queue-operations-probe/http-status.txt

          jq -c '.' current-queue-operations-probe/graphql.json >/dev/null
          rows="$(jq -c '.data.viewer.accounts[0].queueMessageOperationsAdaptiveGroups // []' current-queue-operations-probe/graphql.json)"
          errors="$(jq -c '.errors // []' current-queue-operations-probe/graphql.json)"

          jq -n \
            --arg httpStatus "$http_code" \
            --argjson errors "$errors" \
            --argjson rows "$rows" \
            '{
              passed:($httpStatus == "200" and ($errors|length) == 0),
              productionMutation:false,
              source:"Cloudflare GraphQL Analytics API / queueMessageOperationsAdaptiveGroups",
              dateRange:{start:"2026-09-04",end:"2026-09-05"},
              httpStatus:$httpStatus,
              graphqlErrors:$errors,
              operationRows:$rows,
              proofWindowRows:[$rows[] | select(.dimensions.datetimeMinute >= "2026-09-04T03:00:00Z" and .dimensions.datetimeMinute <= "2026-09-04T03:15:00Z")],
              successorDueWindowRows:[$rows[] | select(.dimensions.datetimeMinute >= "2026-09-04T06:45:00Z" and .dimensions.datetimeMinute <= "2026-09-04T07:30:00Z")],
              totals:{
                write:([$rows[] | select(.dimensions.actionType == "WriteMessage") | .count] | add // 0),
                read:([$rows[] | select(.dimensions.actionType == "ReadMessage") | .count] | add // 0),
                delete:([$rows[] | select(.dimensions.actionType == "DeleteMessage") | .count] | add // 0)
              }
            }' | tee current-queue-operations-probe/result.json

      - name: Upload Queue operations evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-queue-operations-readonly-probe
          path: current-queue-operations-probe
          if-no-files-found: error
          retention-days: 30

      - name: Require successful read-only query
        shell: bash
        run: |
          test "$(jq -r '.passed' current-queue-operations-probe/result.json)" = true
