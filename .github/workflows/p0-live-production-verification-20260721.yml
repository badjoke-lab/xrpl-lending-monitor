name: P0 live production verification 2026-07-21

on:
  push:
    branches: [main]
    paths:
      - .github/p0-live-production-verification-20260721-trigger

permissions:
  contents: read
  issues: write

concurrency:
  group: p0-live-production-verification-20260721
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: '965'
      PRODUCTION_BASE: https://xrpl-lending-monitor.badjoke-lab.workers.dev
    steps:
      - name: Capture compact live verification
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence

          query_d1() {
            local sql="$1"
            local output="$2"
            jq -n --arg sql "$sql" '{sql:$sql}' \
              | curl --fail-with-body --silent --show-error \
                  -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  -H 'Content-Type: application/json' \
                  --data-binary @- \
                  "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query" \
              > "$output"
            jq -e '.success==true and ((.errors // [])|length)==0 and ([.result[].success]|all)' "$output" > /dev/null
          }

          for attempt in $(seq 1 16); do
            diff_http="$(curl --silent --show-error --retry 2 -o evidence/diff.json -w '%{http_code}' "${PRODUCTION_BASE}/api/status/fast-lane-diff?limit=500")"
            if test "$diff_http" = 200 && jq -e '.status=="ok" and .passed==true' evidence/diff.json > /dev/null; then
              break
            fi
            sleep 15
          done

          overview_http="$(curl --silent --show-error --retry 3 -o evidence/overview.json -w '%{http_code}' "${PRODUCTION_BASE}/api/overview")"
          history_http="$(curl --silent --show-error --retry 3 -o evidence/history.json -w '%{http_code}' "${PRODUCTION_BASE}/api/status/history-source")"

          query_d1 "SELECT epoch_id,last_processed_ledger,last_processed_hash,latest_observed_ledger,latest_observed_hash,status,updated_at,(latest_observed_ledger-last_processed_ledger) AS lag_ledgers FROM fast_lane_shadow_state WHERE network='devnet'" evidence/state.json
          query_d1 "SELECT overlay_ledger_index,overlay_ledger_hash,updated_at FROM current_state_overlay_state WHERE network='devnet' LIMIT 1" evidence/overlay-state.json
          query_d1 "SELECT COUNT(*) AS compact_rows FROM fast_lane_shadow_objects_compact WHERE network='devnet'" evidence/compact.json
          query_d1 "SELECT COUNT(*) AS stale_rows FROM current_state_overlay_objects o WHERE o.network='devnet' AND NOT EXISTS (SELECT 1 FROM fast_lane_shadow_base_binding b WHERE b.network=o.network AND b.base_epoch_id=o.epoch_id AND b.base_snapshot_id=o.base_snapshot_id)" evidence/stale.json
          query_d1 "SELECT COUNT(*) AS run_rows,COALESCE(SUM(ledgers_processed),0) AS ledgers_processed,COALESCE(SUM(lending_transactions),0) AS lending_transactions,COALESCE(SUM(coalesced_object_rows),0) AS coalesced_object_rows,COALESCE(SUM(persistence_rows_read),0) AS persistence_rows_read,COALESCE(SUM(persistence_rows_written),0) AS persistence_rows_written,COALESCE(SUM(CASE WHEN status='error' OR error_message IS NOT NULL THEN 1 ELSE 0 END),0) AS error_rows,MIN(run_at) AS first_run_at,MAX(run_at) AS last_run_at FROM fast_lane_shadow_run_metrics WHERE network='devnet' AND julianday(run_at)>=julianday('now','-60 minutes')" evidence/hour.json
          query_d1 "WITH base AS (SELECT run_at,status,end_ledger_index,latest_observed_ledger,lag_ledgers,error_message,CAST(strftime('%s',run_at)/300 AS INTEGER) AS slot_id FROM fast_lane_shadow_run_metrics WHERE network='devnet' AND julianday(run_at)>=julianday('now','-45 minutes')), ranked AS (SELECT *,ROW_NUMBER() OVER(PARTITION BY slot_id ORDER BY run_at DESC) AS rn,COUNT(*) OVER(PARTITION BY slot_id) AS runs_in_slot,SUM(CASE WHEN status='error' OR error_message IS NOT NULL THEN 1 ELSE 0 END) OVER(PARTITION BY slot_id) AS errors_in_slot FROM base) SELECT slot_id,run_at,status,end_ledger_index,latest_observed_ledger,lag_ledgers,error_message,runs_in_slot,errors_in_slot FROM ranked WHERE rn=1 ORDER BY slot_id DESC LIMIT 6" evidence/slots.json

          curl --fail-with-body --silent --show-error --retry 3 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-monitor/schedules" > evidence/schedules.json
          curl --fail-with-body --silent --show-error --retry 3 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}" > evidence/database.json

          today="$(date -u +%F)"
          read -r -d '' usage_query <<'GRAPHQL' || true
          query D1Usage($accountTag:string!,$start:Date,$end:Date,$databaseId:string){viewer{accounts(filter:{accountTag:$accountTag}){d1AnalyticsAdaptiveGroups(limit:10000,filter:{date_geq:$start,date_leq:$end,databaseId:$databaseId}){sum{rowsRead rowsWritten}}}}}
          GRAPHQL
          jq -n --arg query "$usage_query" --arg accountTag "$CLOUDFLARE_ACCOUNT_ID" --arg start "$today" --arg end "$today" --arg databaseId "$DATABASE_ID" '{query:$query,variables:{accountTag:$accountTag,start:$start,end:$end,databaseId:$databaseId}}' > evidence/usage-request.json
          curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'content-type: application/json' --data @evidence/usage-request.json https://api.cloudflare.com/client/v4/graphql > evidence/usage.json

          state="$(jq -c '.result[0].results[0]' evidence/state.json)"
          overlay_state="$(jq -c '.result[0].results[0]' evidence/overlay-state.json)"
          compact="$(jq -c '.result[0].results[0]' evidence/compact.json)"
          stale="$(jq -c '.result[0].results[0]' evidence/stale.json)"
          hour="$(jq -c '.result[0].results[0]' evidence/hour.json)"
          rows_read="$(jq '[.data.viewer.accounts[0].d1AnalyticsAdaptiveGroups[].sum.rowsRead // 0] | add // 0' evidence/usage.json)"
          rows_written="$(jq '[.data.viewer.accounts[0].d1AnalyticsAdaptiveGroups[].sum.rowsWritten // 0] | add // 0' evidence/usage.json)"
          database_bytes="$(jq -r '.result.file_size' evidence/database.json)"
          schedule_ok="$(jq '.success==true and (.result.schedules|length)==1 and .result.schedules[0].cron=="*/5 * * * *"' evidence/schedules.json)"
          slots_ok="$(jq '.result[0].results as $s | ($s|length)==6 and (($s[0].slot_id-$s[5].slot_id)==5) and ($s|all((.status=="committed" or .status=="caught_up") and .lag_ledgers==0 and .error_message==null and .errors_in_slot==0))' evidence/slots.json)"
          api_ok="$(jq -n --arg overview "$overview_http" --arg history "$history_http" --arg diff "$diff_http" --slurpfile d evidence/diff.json '$overview=="200" and $history=="200" and $diff=="200" and $d[0].status=="ok" and $d[0].passed==true and ($d[0].sample.exactProjectionMismatches // 0)==0 and ($d[0].sample.canonicalAheadRows // 0)==0')"
          state_ok="$(jq -n --argjson s "$state" '$s.status=="healthy" and $s.lag_ledgers==0 and $s.last_processed_ledger==$s.latest_observed_ledger and $s.last_processed_hash==$s.latest_observed_hash')"
          overlay_ok="$(jq -n --argjson s "$state" --argjson o "$overlay_state" --argjson c "$compact" --argjson st "$stale" '$o.overlay_ledger_index==$s.last_processed_ledger and $o.overlay_ledger_hash==$s.last_processed_hash and $c.compact_rows==0 and $st.stale_rows==0')"
          operational="$(jq -n --argjson a "$schedule_ok" --argjson b "$slots_ok" --argjson c "$api_ok" --argjson d "$state_ok" --argjson e "$overlay_ok" '$a and $b and $c and $d and $e')"

          jq -n \
            --arg checkedAt "$(date -u +%FT%TZ)" \
            --argjson operational "$operational" \
            --argjson scheduleOk "$schedule_ok" \
            --argjson slotsOk "$slots_ok" \
            --argjson apiOk "$api_ok" \
            --argjson stateOk "$state_ok" \
            --argjson overlayOk "$overlay_ok" \
            --argjson state "$state" \
            --argjson overlayState "$overlay_state" \
            --argjson compact "$compact" \
            --argjson stale "$stale" \
            --argjson hour "$hour" \
            --argjson rowsRead "$rows_read" \
            --argjson rowsWritten "$rows_written" \
            --argjson databaseBytes "$database_bytes" \
            --slurpfile diff evidence/diff.json \
            --slurpfile slots evidence/slots.json \
            '{checkedAt:$checkedAt,operational:$operational,checks:{scheduleOk:$scheduleOk,slotsOk:$slotsOk,apiOk:$apiOk,stateOk:$stateOk,overlayOk:$overlayOk},state:$state,overlayState:$overlayState,compact:$compact,stale:$stale,diff:$diff[0],lastHourPersistence:$hour,d1Today:{rowsRead:$rowsRead,rowsWritten:$rowsWritten},databaseBytes:$databaseBytes,slots:$slots[0].result[0].results}' > evidence/summary.json

          {
            echo '# P0 live production verification'
            echo
            echo 'This is diagnostic evidence only. It does not start or certify the formal soak in Issue #962.'
            echo
            echo '```json'
            cat evidence/summary.json
            echo '```'
          } > evidence/issue-body.md

          gh issue edit "$ISSUE_NUMBER" --repo "$REPOSITORY" --body-file evidence/issue-body.md

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-live-production-verification-20260721
          path: evidence
          if-no-files-found: warn
          retention-days: 14
