name: Apply candidate review documentation state

on:
  push:
    branches:
      - feat/unimpairment-candidate-review
    paths:
      - .github/workflows/apply-candidate-review-doc-state.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/unimpairment-candidate-review
          fetch-depth: 0

      - name: Record candidate review preparation
        shell: python
        run: |
          from pathlib import Path

          operation = Path('docs/operations-unimpairment-witness.md')
          text = operation.read_text()
          marker = '## Candidate preconditions\n'
          addition = '''## Prepared read-only candidate review\n\nThe manual `.github/workflows/unimpairment-candidate-review.yml` workflow prepares bounded candidate evidence without accepting credentials or submitting transactions. It requires explicit operator confirmation that current UTC-day D1 headroom has been reviewed, verifies a healthy zero-lag collector, reads at most 25 current Loans filtered to `on_ledger_status=impaired`, and records only public relationship and current-state fields needed for candidate review.\n\nThe candidate workflow is discovery evidence, not authority to submit. Exact Loan state and Loan Broker owner relationship must still be re-read immediately before any external signing step.\n\n'''
          if marker not in text:
              raise SystemExit('operation insertion marker not found')
          operation.write_text(text.replace(marker, addition + marker, 1))

          status = Path('docs/implementation-status.md')
          text = status.read_text()
          old = '2. resolve the single remaining HYB-7 evidence gap: real post-boundary unimpairment; the external witness operation is now specified with explicit custody separation, candidate preconditions, abort conditions, and validated-evidence gates, but no actor credentials or write capability have been added to the monitor;'
          new = '2. resolve the single remaining HYB-7 evidence gap: real post-boundary unimpairment; the external witness operation is specified and a gated manual read-only candidate-review workflow is prepared, but it has not been run because current D1 headroom is unavailable and no actor credentials or write capability have been added to the monitor;'
          if old not in text:
              raise SystemExit('implementation status target not found')
          status.write_text(text.replace(old, new, 1))

          Path('.github/workflows/apply-candidate-review-doc-state.yml').unlink()

      - name: Commit documentation state
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/operations-unimpairment-witness.md docs/implementation-status.md .github/workflows/apply-candidate-review-doc-state.yml
          git commit -m "Record prepared unimpairment candidate review"
          git push origin HEAD:feat/unimpairment-candidate-review
