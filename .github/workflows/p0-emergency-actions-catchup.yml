name: P0 emergency production catch-up

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: production-five-minute-fast-lane
  cancel-in-progress: false

jobs:
  catch-up:
    if: startsWith(github.event.issue.title, 'P0 emergency production catch-up')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FAST_LANE_PASSES_PER_RUN: '64'
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle production collector
        run: pnpm exec vite build --config vite.fast-lane-production.config.ts

      - name: Run retry-tolerant bounded production catch-up
        id: collector
        shell: bash
        run: |
          set -uo pipefail
          : > /tmp/collector.log
          : > /tmp/collector.err
          caught_up=0
          for attempt in $(seq 1 650); do
            echo "=== catch-up attempt ${attempt}/650 ===" >> /tmp/collector.log
            set +e
            node .fast-lane-production-build/run-fast-lane-production.mjs \
              > /tmp/attempt.out 2> /tmp/attempt.err
            rc=$?
            set -e
            cat /tmp/attempt.out >> /tmp/collector.log
            cat /tmp/attempt.err >> /tmp/collector.err
            lag="$(grep -o '"lagLedgers":[0-9]*' /tmp/attempt.out | tail -n 1 | cut -d: -f2 || true)"
            if [ "$lag" = "0" ]; then
              echo "caught up on attempt ${attempt}" >> /tmp/collector.log
              caught_up=1
              break
            fi
            if [ "$rc" -ne 0 ]; then
              echo "attempt ${attempt} exited ${rc}; retrying" >> /tmp/collector.err
              sleep 1
            fi
          done
          echo "caught_up=${caught_up}" >> /tmp/collector.log

      - name: Report catch-up result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'P0 emergency production catch-up result:'
            echo
            echo '```text'
            if [ -s /tmp/collector.log ]; then tail -n 220 /tmp/collector.log; else echo 'collector produced no stdout'; fi
            if [ -s /tmp/collector.err ]; then echo; echo 'stderr:'; tail -n 120 /tmp/collector.err; fi
            echo '```'
            echo
            echo "Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > /tmp/comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
