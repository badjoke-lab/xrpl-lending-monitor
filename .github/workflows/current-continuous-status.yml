name: Current continuous catch-up status

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: current-continuous-catchup-status
  cancel-in-progress: false

env:
  QUALIFICATION_ISSUE: '995'
  SCRIPT_NAME: xrpl-lending-monitor
  QUEUE_ID: 2ae398f2edbf43749e45cd7ede77c6cd
  DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
  EXPECTED_VERSION_ID: 75009b7d-f6f6-48dd-9350-1b44012b3553
  CONTINUOUS_STARTED_AT: '2026-08-30T09:58:51Z'
  CONTINUOUS_PRE_LEDGER: '4051806'
  CONTINUOUS_INITIAL_LAG: '848613'
  PRODUCTION_BASE: https://xrpl-lending-monitor.badjoke-lab.workers.dev
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  GH_TOKEN: ${{ github.token }}

jobs:
  status:
    if: >-
      github.event.issue.number == 995 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      github.event.comment.body == '/current-repair-continuous-catchup-status'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Capture read-only production status
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p current-continuous-status

          api() {
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'content-type: application/json' \
              "$@"
          }

          d1() {
            local sql="$1"
            jq -n --arg sql "$sql" '{sql:$sql}' > /tmp/d1-query.json
            api \
              -X POST \
              --data @/tmp/d1-query.json \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query"
          }

          api "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues/${QUEUE_ID}" \
            > current-continuous-status/queue.json
          api "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${SCRIPT_NAME}/schedules" \
            > current-continuous-status/schedules.json
          api "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${SCRIPT_NAME}/deployments" \
            > current-continuous-status/deployments.json
          api "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${SCRIPT_NAME}/settings" \
            > current-continuous-status/settings.json

          d1 "SELECT last_processed_ledger,last_processed_hash,latest_observed_ledger,latest_observed_hash,status,updated_at FROM fast_lane_shadow_state WHERE network='devnet'" \
            > current-continuous-status/fast-state.json
          d1 "SELECT run_at,status,start_ledger_index,end_ledger_index,latest_observed_ledger,lag_ledgers,ledgers_processed,persistence_rows_read,persistence_rows_written,error_message FROM fast_lane_shadow_run_metrics WHERE network='devnet' ORDER BY run_at DESC LIMIT 10" \
            > current-continuous-status/latest-metrics.json
          d1 "SELECT scheduled_time,status,started_at,completed_at,next_scheduled_time,next_cron,error_message,updated_at FROM fast_lane_queue_slots ORDER BY COALESCE(completed_at,started_at,updated_at) DESC LIMIT 10" \
            > current-continuous-status/latest-slots.json
          d1 "SELECT COUNT(*) AS invocation_count, COALESCE(SUM(ledgers_processed),0) AS ledgers_processed, COALESCE(SUM(persistence_rows_read),0) AS persistence_rows_read, COALESCE(SUM(persistence_rows_written),0) AS persistence_rows_written, COALESCE(MAX(ledgers_processed),0) AS max_ledgers_processed, COALESCE(SUM(CASE WHEN status <> 'committed' OR error_message IS NOT NULL THEN 1 ELSE 0 END),0) AS failed_metrics FROM fast_lane_shadow_run_metrics WHERE network='devnet' AND run_at >= '${CONTINUOUS_STARTED_AT}'" \
            > current-continuous-status/since-start.json
          d1 "PRAGMA page_count" > current-continuous-status/page-count.json
          d1 "PRAGMA page_size" > current-continuous-status/page-size.json

          overview_http="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' -H 'User-Agent: curl/8.5.0' -H 'Accept: application/json' "${PRODUCTION_BASE}/api/overview")"
          diff_http="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' -H 'User-Agent: curl/8.5.0' -H 'Accept: application/json' "${PRODUCTION_BASE}/api/status/fast-lane-diff?limit=1")"

          jq -n \
            --slurpfile queue current-continuous-status/queue.json \
            --slurpfile schedules current-continuous-status/schedules.json \
            --slurpfile deployments current-continuous-status/deployments.json \
            --slurpfile settings current-continuous-status/settings.json \
            --slurpfile fast current-continuous-status/fast-state.json \
            --slurpfile metrics current-continuous-status/latest-metrics.json \
            --slurpfile slots current-continuous-status/latest-slots.json \
            --slurpfile since current-continuous-status/since-start.json \
            --slurpfile pages current-continuous-status/page-count.json \
            --slurpfile page_size current-continuous-status/page-size.json \
            --arg expected_version "$EXPECTED_VERSION_ID" \
            --arg pre_ledger "$CONTINUOUS_PRE_LEDGER" \
            --arg initial_lag "$CONTINUOUS_INITIAL_LAG" \
            --arg overview_http "$overview_http" \
            --arg diff_http "$diff_http" '
              def rows($x): ($x[0].result[0].results // []);
              def binding($name): ($settings[0].result.bindings // [] | map(select(.name == $name)) | .[0] | (.text // .value // null));
              ($fast[0].result[0].results[0] // {}) as $f |
              (rows($metrics)[0] // {}) as $m |
              (rows($since)[0] // {}) as $s |
              (rows($pages)[0].page_count // 0) as $pc |
              (rows($page_size)[0].page_size // 0) as $ps |
              ($deployments[0].result.deployments[0].versions[0].version_id // null) as $version |
              ($queue[0].result.settings.delivery_paused // null) as $paused |
              {
                checkedAt: (now | todateiso8601),
                productionMutation: false,
                queuePaused: $paused,
                queueActive: ($paused == false),
                schedules: ($schedules[0].result.schedules // []),
                deploymentVersion: $version,
                appNetwork: binding("APP_NETWORK"),
                mainnetEnabled: binding("MAINNET_ENABLED"),
                maxLedgersPerRun: binding("FAST_LANE_MAX_LEDGERS_PER_RUN"),
                currentLedger: ($f.last_processed_ledger // 0),
                latestObservedLedger: ($m.latest_observed_ledger // $f.latest_observed_ledger // 0),
                currentLag: ($m.lag_ledgers // null),
                latestMetricStatus: ($m.status // null),
                latestMetricError: ($m.error_message // null),
                latestMetricLedgers: ($m.ledgers_processed // null),
                cursorAdvanceSinceStart: (($f.last_processed_ledger // 0) - ($pre_ledger | tonumber)),
                lagReductionSinceFirstObservedSlot: (($initial_lag | tonumber) - ($m.lag_ledgers // ($initial_lag | tonumber))),
                invocationCountSinceStart: ($s.invocation_count // 0),
                metricLedgersProcessedSinceStart: ($s.ledgers_processed // 0),
                persistenceRowsReadSinceStart: ($s.persistence_rows_read // 0),
                persistenceRowsWrittenSinceStart: ($s.persistence_rows_written // 0),
                failedMetricsSinceStart: ($s.failed_metrics // 0),
                maxLedgersProcessedPerMetric: ($s.max_ledgers_processed // 0),
                d1BytesApprox: (($pc | tonumber) * ($ps | tonumber)),
                publicOverviewHttp: ($overview_http | tonumber),
                publicDiffHttp: ($diff_http | tonumber),
                latestMetrics: rows($metrics),
                latestSlots: rows($slots),
                checks: {
                  queueActive: ($paused == false),
                  cronEmpty: (($schedules[0].result.schedules // []) | length == 0),
                  workerExpected: ($version == $expected_version),
                  devnetOnly: (binding("APP_NETWORK") == "devnet" and binding("MAINNET_ENABLED") == "false"),
                  maxLedgers32: (binding("FAST_LANE_MAX_LEDGERS_PER_RUN") == "32"),
                  latestMetricCommitted: (($m.status // null) == "committed" and ($m.error_message // null) == null),
                  noFailedMetricsSinceStart: (($s.failed_metrics // 0) == 0),
                  publicApis200: (($overview_http | tonumber) == 200 and ($diff_http | tonumber) == 200)
                }
              }
              | .healthy = ([.checks[]] | all)
            ' > current-continuous-status/result.json

          cat current-continuous-status/result.json

      - name: Publish status summary
        shell: bash
        run: |
          set -euo pipefail
          result=current-continuous-status/result.json
          healthy="$(jq -r '.healthy' "$result")"
          ledger="$(jq -r '.currentLedger' "$result")"
          latest="$(jq -r '.latestObservedLedger' "$result")"
          lag="$(jq -r '.currentLag' "$result")"
          advance="$(jq -r '.cursorAdvanceSinceStart' "$result")"
          lag_drop="$(jq -r '.lagReductionSinceFirstObservedSlot' "$result")"
          invocations="$(jq -r '.invocationCountSinceStart' "$result")"
          failed="$(jq -r '.failedMetricsSinceStart' "$result")"
          rows_read="$(jq -r '.persistenceRowsReadSinceStart' "$result")"
          rows_written="$(jq -r '.persistenceRowsWrittenSinceStart' "$result")"
          d1_bytes="$(jq -r '.d1BytesApprox' "$result")"
          queue_active="$(jq -r '.queueActive' "$result")"
          cron_count="$(jq -r '.schedules | length' "$result")"
          worker="$(jq -r '.deploymentVersion' "$result")"
          metric_status="$(jq -r '.latestMetricStatus' "$result")"
          metric_error="$(jq -r '.latestMetricError // "null"' "$result")"
          cat > /tmp/status.md <<EOF
          ## Current continuous catch-up status

          Run: \`${GITHUB_RUN_ID}\`
          Healthy: \`${healthy}\`
          Queue active: \`${queue_active}\`
          Cron count: \`${cron_count}\`
          Worker: \`${worker}\`
          Current cursor: \`${ledger}\`
          Latest observed ledger: \`${latest}\`
          Current lag: \`${lag}\`
          Cursor advance since continuous start: \`${advance}\`
          Lag reduction since first observed continuous slot: \`${lag_drop}\`
          Invocations since start: \`${invocations}\`
          Failed metrics since start: \`${failed}\`
          Persistence rows read / written since start: \`${rows_read} / ${rows_written}\`
          Approx D1 bytes: \`${d1_bytes}\`
          Latest metric: \`${metric_status}\`, error=\`${metric_error}\`

          This job is read-only for Cloudflare/D1. It sends no Queue message, changes no Queue setting, creates no Cron, deploys no Worker, and does not touch Supabase History/R5.
          EOF
          gh issue comment "$QUALIFICATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/status.md

      - name: Upload status evidence
        uses: actions/upload-artifact@v4
        with:
          name: current-continuous-status
          path: current-continuous-status
          if-no-files-found: error
          retention-days: 14
