name: Apply D1 headroom UI audit state

on:
  push:
    branches:
      - docs/d1-headroom-ui-audit-state
    paths:
      - .github/workflows/apply-d1-headroom-ui-audit-state.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/d1-headroom-ui-audit-state
          fetch-depth: 0

      - name: Record D1 headroom gate result
        shell: python
        run: |
          from pathlib import Path

          path = Path('docs/implementation-status.md')
          text = path.read_text()
          old = '- Production visual audit is now eligible after a current D1 headroom check; UI remediation and re-audit remain pending.'
          new = '- The production visual audit fresh-head gate is satisfied, but the 2026-07-07 13:13 UTC headroom probe recorded 9,761,975 rows read and 181,117 rows written for the UTC day against the operations-monitor reference allowances of 5,000,000 and 100,000. The existing below-80% headroom gate correctly stopped the screenshot crawl before Playwright installation or page traversal. Retry only after a new UTC-day usage check confirms headroom; do not weaken the gate. UI remediation and re-audit remain pending.'
          if old not in text:
              raise SystemExit('remaining-blocker target not found')
          text = text.replace(old, new, 1)

          old = '3. Check current D1 headroom, then run the gated representative production screenshot audit and inspect the resulting desktop/mobile evidence.'
          new = '3. Re-check D1 headroom after UTC-day usage resets; the 2026-07-07 check exceeded the operations threshold and correctly skipped capture. Run the gated representative production screenshot audit only when the existing headroom policy passes, then inspect the resulting desktop/mobile evidence.'
          if old not in text:
              raise SystemExit('next-order target not found')
          text = text.replace(old, new, 1)

          old = '3. while waiting for or deliberately generating an external Devnet unimpairment witness, use the now-satisfied fresh-head gate to check D1 headroom and run the gated production screenshot audit when safe;'
          new = '3. while waiting for or deliberately generating an external Devnet unimpairment witness, re-check D1 usage after UTC-day reset and run the gated production screenshot audit only when the existing headroom policy passes; the 2026-07-07 13:13 UTC check correctly blocked capture because daily usage already exceeded the operations reference allowances;'
          if old not in text:
              raise SystemExit('active-unit target not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          Path('.github/workflows/apply-d1-headroom-ui-audit-state.yml').unlink()

      - name: Commit status reconciliation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/implementation-status.md .github/workflows/apply-d1-headroom-ui-audit-state.yml
          git commit -m "Record D1 headroom gate blocking UI audit"
          git push origin HEAD:docs/d1-headroom-ui-audit-state
