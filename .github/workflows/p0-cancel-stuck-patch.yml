name: P0 cancel stuck patch

on:
  push:
    branches: [main]
    paths:
      - .github/p0-cancel-stuck-patch-trigger

permissions:
  actions: write
  contents: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cancel stuck checkout patch
        env:
          GH_TOKEN: ${{ github.token }}
          STUCK_RUN_ID: '29248847249'
        shell: bash
        run: |
          set -euo pipefail
          before="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${STUCK_RUN_ID}" --jq .status)"
          if [ "$before" = queued ] || [ "$before" = in_progress ] || [ "$before" = waiting ] || [ "$before" = pending ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${STUCK_RUN_ID}/cancel" > /dev/null
          fi
          sleep 3
          after="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${STUCK_RUN_ID}" --jq .status)"
          jq -n --argjson runId "$STUCK_RUN_ID" --arg before "$before" --arg after "$after" '{runId:$runId,statusBefore:$before,statusAfter:$after}' > status.json
          content="$(base64 -w0 status.json)"
          path="repos/${GITHUB_REPOSITORY}/contents/.github/p0-cancel-stuck-patch-status.json"
          sha="$(gh api "$path" --jq .sha 2>/dev/null || true)"
          if [ -n "$sha" ]; then gh api --method PUT "$path" -f message='Update stuck patch cancellation status' -f content="$content" -f sha="$sha" > /dev/null
          else gh api --method PUT "$path" -f message='Create stuck patch cancellation status' -f content="$content" > /dev/null
          fi
