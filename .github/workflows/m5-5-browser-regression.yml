name: M5-5 browser regression
# Pre-soak production rerun: 2026-07-12, wait for bounded fast-lane recovery

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Deployed read-only site base URL
        required: true
        default: https://xrpl-lending-monitor.badjoke-lab.workers.dev
        type: string
      confirm_d1_headroom:
        description: Confirm the operator expects the workflow to measure actual current UTC-day D1 headroom before browser regression
        required: true
        default: false
        type: boolean
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/m5-5-browser-regression.yml'
      - 'scripts/run-m5-5-browser-regression-current.mjs'
      - 'scripts/run-m5-5-browser-regression.mjs'
      - 'scripts/evaluate-m5-5-browser-exit.mjs'
      - 'scripts/m5-5-browser-exit-evaluation.mjs'

permissions:
  contents: read

concurrency:
  group: m5-5-browser-regression
  cancel-in-progress: false

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET_BASE_URL: ${{ inputs.base_url || 'https://xrpl-lending-monitor.badjoke-lab.workers.dev' }}
    steps:
      - name: Resolve browser-regression intent
        id: intent
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CONFIRM_D1_HEADROOM: ${{ inputs.confirm_d1_headroom }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          CURRENT_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          run_allowed=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            test "$CONFIRM_D1_HEADROOM" = "true"
            run_allowed=true
          elif [ "$EVENT_NAME" = "pull_request" ] && [ "$HEAD_REPOSITORY" = "$CURRENT_REPOSITORY" ]; then
            run_allowed=true
          fi
          echo "run_allowed=$run_allowed" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.intent.outputs.run_allowed == 'true'

      - name: Wait for current-state and canonical-refresh preflight
        if: steps.intent.outputs.run_allowed == 'true'
        shell: bash
        env:
          BASE_URL: ${{ env.TARGET_BASE_URL }}
        run: |
          set -euo pipefail
          ROOT=m5-5-browser-regression
          mkdir -p "${ROOT}"
          : > "${ROOT}/preflight-attempts.ndjson"

          for attempt in $(seq 1 480); do
            curl --max-time 60 --fail-with-body --silent --show-error --retry 2 \
              "${BASE_URL%/}/api/status/collector" \
              > "${ROOT}/canonical-collector-preflight.json" || true
            curl --max-time 60 --fail-with-body --silent --show-error --retry 2 \
              "${BASE_URL%/}/api/overview" \
              > "${ROOT}/overview-preflight.json" || true
            curl --max-time 60 --fail-with-body --silent --show-error --retry 2 \
              "${BASE_URL%/}/api/status/fast-lane-diff?limit=500" \
              > "${ROOT}/fast-lane-diff-preflight.json" || true

            SOURCE="$(jq -r '.current_state_watermark.source // empty' "${ROOT}/overview-preflight.json" 2>/dev/null || true)"
            CURRENT="$(jq -r '.current_state_watermark.ledger_index // 0' "${ROOT}/overview-preflight.json" 2>/dev/null || echo 0)"
            COUNTS="$(jq -r '.counts_watermark.ledger_index // 0' "${ROOT}/overview-preflight.json" 2>/dev/null || echo 0)"
            BINDING="$(jq -r '.binding.base.ledgerIndex // 0' "${ROOT}/fast-lane-diff-preflight.json" 2>/dev/null || echo 0)"
            jq -n --argjson attempt "${attempt}" --arg source "${SOURCE}" \
              --argjson current "${CURRENT}" --argjson counts "${COUNTS}" --argjson binding "${BINDING}" \
              '{attempt:$attempt,currentStateSource:$source,currentLedger:$current,countsLedger:$counts,fastLaneBaseLedger:$binding}' \
              >> "${ROOT}/preflight-attempts.ndjson"

            if jq -e '
                .role == "canonical_overlay_refresh"
                and .cadence.expected_interval_seconds == 14400
                and .cadence.stale_after_seconds == 18000
                and (.status == "behind" or .status == "healthy")
                and .consecutive_failures == 0
                and .error == null
              ' "${ROOT}/canonical-collector-preflight.json" > /dev/null 2>&1 \
              && jq -e '
                .current_state_watermark.source == "fast_lane"
                and (.current_state_watermark.ledger_index >= .counts_watermark.ledger_index)
              ' "${ROOT}/overview-preflight.json" > /dev/null 2>&1 \
              && jq -e '
                .status == "ok"
                and .passed == true
                and .binding.base.ledgerIndex == input.counts_watermark.ledger_index
                and .sample.sampledRows > 0
                and .sample.exactProjectionMismatches == 0
              ' "${ROOT}/fast-lane-diff-preflight.json" "${ROOT}/overview-preflight.json" > /dev/null 2>&1; then
              touch "${ROOT}/preflight-passed"
              break
            fi
            sleep 5
          done
          test -f "${ROOT}/preflight-passed"

          jq -n \
            --slurpfile collector "${ROOT}/canonical-collector-preflight.json" \
            --slurpfile overview "${ROOT}/overview-preflight.json" \
            '{
              status: "healthy",
              cursor: {
                last_processed_ledger: $overview[0].current_state_watermark.ledger_index,
                latest_observed_ledger: $overview[0].current_state_watermark.ledger_index,
                lag_ledgers: 0
              },
              consecutive_failures: $collector[0].consecutive_failures,
              error: $collector[0].error,
              freshness_source: $overview[0].current_state_watermark.source,
              canonical_collector: $collector[0]
            }' > "${ROOT}/collector-preflight.json"

      - name: Measure and enforce actual D1 headroom
        if: steps.intent.outputs.run_allowed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_HEADROOM_OUTPUT_DIR: m5-5-browser-regression
        run: bash scripts/check-d1-headroom.sh

      - uses: pnpm/action-setup@v4
        if: steps.intent.outputs.run_allowed == 'true'
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        if: steps.intent.outputs.run_allowed == 'true'
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        if: steps.intent.outputs.run_allowed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        if: steps.intent.outputs.run_allowed == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Run real-data browser regression and behavior smoke
        if: steps.intent.outputs.run_allowed == 'true'
        shell: bash
        env:
          BASE_URL: ${{ env.TARGET_BASE_URL }}
          M5_BROWSER_OUTPUT_DIR: m5-5-browser-regression
          M5_BROWSER_REQUEST_TIMEOUT_MS: 120000
        run: |
          set -o pipefail
          node scripts/run-m5-5-browser-regression-current.mjs 2>&1 | tee m5-5-browser-regression/runner.log

      - name: Evaluate M5-5 browser exit evidence
        if: steps.intent.outputs.run_allowed == 'true'
        env:
          M5_BROWSER_OUTPUT_DIR: m5-5-browser-regression
          M5_EXIT_EVALUATION_OUTPUT_DIR: m5-5-browser-regression
        run: node scripts/evaluate-m5-5-browser-exit.mjs

      - name: Publish browser-regression summary
        if: always() && steps.intent.outputs.run_allowed == 'true'
        shell: bash
        run: |
          if [ -f m5-5-browser-regression/d1-headroom-summary.json ]; then
            {
              echo '## D1 headroom gate'
              echo
              jq -r '"- Rows read: `\(.rows_read)` / `\(.rows_read_daily_allowance)`"' m5-5-browser-regression/d1-headroom-summary.json
              jq -r '"- Rows written: `\(.rows_written)` / `\(.rows_written_daily_allowance)`"' m5-5-browser-regression/d1-headroom-summary.json
              jq -r '"- Passed: **\(.passed)**"' m5-5-browser-regression/d1-headroom-summary.json
              echo
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
          if [ -f m5-5-browser-regression/summary.md ]; then
            cat m5-5-browser-regression/summary.md >> "${GITHUB_STEP_SUMMARY}"
          fi
          if [ -f m5-5-browser-regression/exit-evaluation.md ]; then
            cat m5-5-browser-regression/exit-evaluation.md >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload browser-regression evidence
        if: always() && steps.intent.outputs.run_allowed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: m5-5-browser-regression
          path: m5-5-browser-regression
          if-no-files-found: error
          retention-days: 14
