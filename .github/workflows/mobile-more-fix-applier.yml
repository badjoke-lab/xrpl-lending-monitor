name: Mobile More fix applier
on:
  pull_request:
    paths:
      - .github/workflows/mobile-more-fix-applier.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-more-menu
      - name: Apply reviewed source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/ui/components/AppShell.tsx')
          s = p.read_text()
          s = s.replace("import { useRef, type MouseEvent, type ReactNode } from 'react'", "import { useState, type MouseEvent, type ReactNode } from 'react'")
          s = s.replace("  const mobileMoreRef = useRef<HTMLDetailsElement>(null)\n  const closeMobileMore = () => {\n    if (mobileMoreRef.current) mobileMoreRef.current.open = false\n  }\n  const navigateFromMobile = (path: string) => {\n    closeMobileMore()\n", "  const [mobileMoreOpen, setMobileMoreOpen] = useState(false)\n  const navigateFromMobile = (path: string) => {\n    setMobileMoreOpen(false)\n")
          s = s.replace("        <details ref={mobileMoreRef}>\n          <summary>More</summary>", "        <details open={mobileMoreOpen}>\n          <summary\n            aria-expanded={mobileMoreOpen}\n            onClick={(event) => {\n              event.preventDefault()\n              setMobileMoreOpen((open) => !open)\n            }}\n          >More</summary>")
          p.write_text(s)
          PY
          git diff --check
          git diff -- src/ui/components/AppShell.tsx
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/ui/components/AppShell.tsx
          git commit -m "Control mobile More without native toggle race"
          git push origin HEAD:fix/mobile-more-menu
