name: Apply UI audit diagnostics status

on:
  push:
    branches:
      - fix/ui-audit-page-settle
    paths:
      - .github/workflows/apply-ui-audit-diagnostics-status.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ui-audit-page-settle
          fetch-depth: 0

      - name: Record audit diagnostics preparation
        shell: python
        run: |
          from pathlib import Path
          path = Path('docs/implementation-status.md')
          text = path.read_text()
          old = 'The screenshot capture script is hardened to wait for visible main content, completion of UI loading states, best-effort network idle, and web-font readiness before capture, and it records a manifest of profiles, routes, and discovered detail IDs.'
          new = 'The screenshot capture script is hardened to wait for visible main content, completion of UI loading states, best-effort network idle, and web-font readiness before capture. It records a manifest of profiles, routes, and discovered detail IDs plus per-route page-level horizontal overflow, overflowing-element candidates, browser console errors, page errors, and HTTP error responses for joint visual and technical review.'
          if old not in text:
              raise SystemExit('implementation status screenshot diagnostics target not found')
          path.write_text(text.replace(old, new, 1))
          Path('.github/workflows/apply-ui-audit-diagnostics-status.yml').unlink()

      - name: Commit status update
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/implementation-status.md .github/workflows/apply-ui-audit-diagnostics-status.yml
          git commit -m "Record UI audit diagnostics evidence"
          git push origin HEAD:fix/ui-audit-page-settle
