name: P0 fast continuation patch Windows

on:
  push:
    branches: [main]
    paths:
      - .github/p0-fast-continuation-patch-windows-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Patch candidate evidence and one-cycle P0 continuation
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          candidate_path = Path('.github/workflows/rolling-checkpoint-candidate.yml')
          candidate = candidate_path.read_text()
          old_limit = '          test "${MAX_DELTA_LEDGERS}" -le 5000\n'
          new_limit = '''          if [ "${MAX_DELTA_LEDGERS}" -gt 5000 ]; then
            test "${MAX_DELTA_LEDGERS}" -le 30000
            PAIR="${SOURCE_HISTORY_BRANCH}:${SOURCE_CURRENT_STATE_BRANCH}:${HISTORY_CANDIDATE_BRANCH}:${CURRENT_STATE_CANDIDATE_BRANCH}"
            case "${PAIR}" in
              history-p0-recovery-a-data:current-state-p0-recovery-a-data:history-p0-recovery-b-data:current-state-p0-recovery-b-data|history-p0-recovery-b-data:current-state-p0-recovery-b-data:history-p0-recovery-a-data:current-state-p0-recovery-a-data) ;;
              *) echo "Large delta is restricted to the aligned P0 recovery branches" >&2; exit 1 ;;
            esac
          fi
'''
          if old_limit not in candidate:
              raise SystemExit('candidate max-delta guard anchor missing')
          candidate = candidate.replace(old_limit, new_limit, 1)
          old_evidence = '''      - name: Build retained candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          ROOT=rolling-checkpoint-candidate
          PUBLICATION=.local/history-root/history/publication.json
'''
          new_evidence = '''      - name: Build retained candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          ROOT=rolling-checkpoint-candidate
          mkdir -p "${ROOT}"
          PUBLICATION=.local/history-root/history/publication.json
'''
          if old_evidence not in candidate:
              raise SystemExit('candidate evidence anchor missing')
          candidate = candidate.replace(old_evidence, new_evidence, 1)
          candidate_path.write_text(candidate)

          recovery_path = Path('.github/workflows/p0-history-recovery.yml')
          recovery = recovery_path.read_text()
          recovery = recovery.replace("      MAX_DELTA_LEDGERS: '5000'\n", "      MAX_DELTA_LEDGERS: '30000'\n", 1)
          recovery = recovery.replace("      MAX_CYCLES: '8'\n", "      MAX_CYCLES: '1'\n", 1)
          old_source = '''          SOURCE_HISTORY='history-data'
          SOURCE_CURRENT='current-state-data'
          OUTPUT_HISTORY='history-p0-recovery-a-data'
          OUTPUT_CURRENT='current-state-p0-recovery-a-data'
'''
          new_source = '''          SOURCE_HISTORY='history-p0-recovery-a-data'
          SOURCE_CURRENT='current-state-p0-recovery-a-data'
          OUTPUT_HISTORY='history-p0-recovery-b-data'
          OUTPUT_CURRENT='current-state-p0-recovery-b-data'
'''
          if old_source not in recovery:
              raise SystemExit('P0 recovery source anchor missing')
          recovery = recovery.replace(old_source, new_source, 1)
          recovery_path.write_text(recovery)

          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', '.github/workflows/rolling-checkpoint-candidate.yml', '.github/workflows/p0-history-recovery.yml'], check=True)
          subprocess.run(['git', 'commit', '-m', 'fix: continue P0 recovery from verified candidate A'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:main'], check=True)
