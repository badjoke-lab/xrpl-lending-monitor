name: P0 fast-lane diagnose

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p0-fast-lane-diagnose.yml'
      - '.github/p0-fast-lane-diagnose-trigger'
  workflow_dispatch:

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Test XRPL RPC endpoints
        shell: bash
        run: |
          set +e
          BODY='{"method":"ledger","params":[{"ledger_index":"validated","transactions":false,"expand":false,"api_version":2}]}'
          for pair in "primary|https://devnet.honeycluster.io/" "fallback|https://s.devnet.rippletest.net:51234/"; do
            name="${pair%%|*}"
            url="${pair#*|}"
            code="$(curl --max-time 12 --silent --show-error --output "rpc-${name}.json" --write-out '%{http_code}' -H 'content-type: application/json' --data "${BODY}" "${url}")"
            rc=$?
            jq -n --arg name "$name" --arg url "$url" --arg code "$code" --argjson curl_rc "$rc" --rawfile body "rpc-${name}.json" '{name:$name,url:$url,httpCode:$code,curlExit:$curl_rc,body:$body}' > "rpc-${name}-result.json"
          done
          set -e

      - name: Capture production schedule
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-monitor/schedules" \
            > schedules.json

      - name: Capture D1 fast-lane state and recent metrics
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler d1 execute xrpl-lending-monitor --remote \
            --command "SELECT epoch_id,last_processed_ledger,last_processed_hash,latest_observed_ledger,latest_observed_hash,status,updated_at FROM fast_lane_shadow_state WHERE network='devnet';" \
            --json > state-raw.txt
          sed -n '/^\[/,$p' state-raw.txt > state.json
          pnpm exec wrangler d1 execute xrpl-lending-monitor --remote \
            --command "SELECT run_at,status,start_ledger_index,end_ledger_index,latest_observed_ledger,lag_ledgers,ledgers_processed,persistence_rows_written FROM fast_lane_shadow_run_metrics WHERE network='devnet' ORDER BY run_at DESC LIMIT 12;" \
            --json > metrics-raw.txt
          sed -n '/^\[/,$p' metrics-raw.txt > metrics.json

      - name: Publish diagnosis
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg capturedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile primary rpc-primary-result.json \
            --slurpfile fallback rpc-fallback-result.json \
            --slurpfile schedules schedules.json \
            --slurpfile state state.json \
            --slurpfile metrics metrics.json \
            '{capturedAt:$capturedAt,rpc:{primary:$primary[0],fallback:$fallback[0]},schedules:$schedules[0],state:$state[0],metrics:$metrics[0]}' \
            > diagnosis.json
          content="$(base64 -w0 diagnosis.json)"
          api="repos/${GITHUB_REPOSITORY}/contents/.github/p0-fast-lane-diagnosis.json"
          sha="$(gh api "$api" --jq .sha 2>/dev/null || true)"
          if [ -n "$sha" ]; then
            gh api --method PUT "$api" -f message='Update P0 fast-lane diagnosis' -f content="$content" -f sha="$sha" >/dev/null
          else
            gh api --method PUT "$api" -f message='Create P0 fast-lane diagnosis' -f content="$content" >/dev/null
          fi
