name: Ops fast-lane evidence

on:
  push:
    branches: [ops-evidence]
    paths:
      - '.github/ops-fast-lane-probe-trigger'
  workflow_dispatch:

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Capture head, schedule, D1 state and metrics
        shell: bash
        run: |
          set -euo pipefail
          BODY='{"method":"ledger","params":[{"ledger_index":"validated","transactions":false,"expand":false,"api_version":2}]}'
          curl --fail-with-body --silent --show-error --max-time 15 \
            -H 'content-type: application/json' --data "${BODY}" \
            'https://devnet.honeycluster.io/' > head.json
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-monitor/schedules" \
            > schedules.json
          pnpm exec wrangler d1 execute xrpl-lending-monitor --remote \
            --command "SELECT epoch_id,last_processed_ledger,last_processed_hash,latest_observed_ledger,latest_observed_hash,status,updated_at FROM fast_lane_shadow_state WHERE network='devnet';" \
            --json > state-raw.txt
          sed -n '/^\[/,$p' state-raw.txt > state.json
          pnpm exec wrangler d1 execute xrpl-lending-monitor --remote \
            --command "SELECT run_at,status,start_ledger_index,end_ledger_index,latest_observed_ledger,lag_ledgers,ledgers_processed,persistence_rows_written FROM fast_lane_shadow_run_metrics WHERE network='devnet' ORDER BY run_at DESC LIMIT 12;" \
            --json > metrics-raw.txt
          sed -n '/^\[/,$p' metrics-raw.txt > metrics.json
          jq -n \
            --arg capturedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile head head.json \
            --slurpfile schedules schedules.json \
            --slurpfile state state.json \
            --slurpfile metrics metrics.json \
            '{capturedAt:$capturedAt,head:$head[0],schedules:$schedules[0],state:$state[0],metrics:$metrics[0]}' \
            > diagnosis.json

      - name: Publish evidence on ops branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          content="$(base64 -w0 diagnosis.json)"
          api="repos/${GITHUB_REPOSITORY}/contents/.github/ops-fast-lane-diagnosis.json"
          sha="$(gh api "$api?ref=ops-evidence" --jq .sha 2>/dev/null || true)"
          if [ -n "$sha" ]; then
            gh api --method PUT "$api" -f message='Update isolated fast-lane evidence' -f content="$content" -f sha="$sha" -f branch='ops-evidence' >/dev/null
          else
            gh api --method PUT "$api" -f message='Create isolated fast-lane evidence' -f content="$content" -f branch='ops-evidence' >/dev/null
          fi
