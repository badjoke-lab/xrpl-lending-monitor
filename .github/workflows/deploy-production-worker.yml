name: Deploy production Worker

on:
  push:
    branches:
      - main
    paths:
      - .github/production-deploy-trigger

permissions:
  actions: read
  contents: write

concurrency:
  group: production-worker-write
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_BASE: https://xrpl-lending-monitor.badjoke-lab.workers.dev
    steps:
      - name: Check out implementation
        uses: actions/checkout@v4

      - name: Check out production current-state identity
        uses: actions/checkout@v4
        with:
          ref: current-state-data
          path: .local/current-state-data
          sparse-checkout: read-model/manifest.json
          sparse-checkout-cone-mode: false

      - name: Check out production history identity
        uses: actions/checkout@v4
        with:
          ref: history-data
          path: .local/history-data
          sparse-checkout: history/publication.json
          sparse-checkout-cone-mode: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check production credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is unavailable" >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is unavailable" >&2; exit 1; }
          test -n "$GITHUB_TOKEN" || { echo "GITHUB_TOKEN is unavailable" >&2; exit 1; }
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Wait for production writes to quiesce
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p production-deploy-wait
          quiescent=false
          for attempt in $(seq 1 240); do
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/rolling-checkpoint-live-cutover.yml/runs?per_page=100" \
              > production-deploy-wait/live-cutover-runs.json
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-production-worker.yml/runs?per_page=100" \
              > production-deploy-wait/production-deploy-runs.json

            ACTIVE_CUTOVERS="$(jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending")] | length' production-deploy-wait/live-cutover-runs.json)"
            ACTIVE_DEPLOYS="$(jq --argjson current "${GITHUB_RUN_ID}" '[.workflow_runs[] | select(.id != $current) | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending")] | length' production-deploy-wait/production-deploy-runs.json)"
            ACTIVE="$((ACTIVE_CUTOVERS + ACTIVE_DEPLOYS))"

            jq -n \
              --argjson attempt "${attempt}" \
              --argjson activeCutovers "${ACTIVE_CUTOVERS}" \
              --argjson activeDeploys "${ACTIVE_DEPLOYS}" \
              --argjson activeTotal "${ACTIVE}" \
              '{attempt:$attempt,activeLiveCutovers:$activeCutovers,activeProductionDeploys:$activeDeploys,activeProductionWrites:$activeTotal}' \
              >> production-deploy-wait/attempts.ndjson
            if [ "${ACTIVE}" -eq 0 ]; then
              quiescent=true
              break
            fi
            sleep 10
          done
          test "${quiescent}" = true

      - name: Bind root Wrangler config to the active production checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          source = json.loads(Path('wrangler.jsonc').read_text())
          current = json.loads(Path('.local/current-state-data/read-model/manifest.json').read_text())
          history = json.loads(Path('.local/history-data/history/publication.json').read_text())

          assert source['triggers']['crons'] == ['*/5 * * * *']
          assert source['vars']['APP_NETWORK'] == 'devnet'
          assert source['vars']['MAINNET_ENABLED'] == 'false'
          assert current['complete'] is True
          assert history['complete'] is True
          assert current['epochId'] == history['epochId'] == 'devnet-3371675'
          assert current['ledgerIndex'] == history['endLedgerIndex']
          assert current['ledgerHash'] == history['endLedgerHash']
          assert isinstance(current['snapshotId'], str) and current['snapshotId']
          assert isinstance(current['ledgerIndex'], int) and current['ledgerIndex'] > 0
          assert isinstance(current['ledgerHash'], str) and len(current['ledgerHash']) == 64

          config = json.loads(json.dumps(source))
          config['keep_vars'] = False
          variables = config['vars']
          variables['CURRENT_STATE_REPLACEMENT_GITHUB_BRANCH'] = 'current-state-data'
          variables['CURRENT_STATE_REPLACEMENT_SNAPSHOT_ID'] = current['snapshotId']
          variables['REPLACEMENT_BASE_REBASE_ENABLED'] = 'true'
          variables['REPLACEMENT_BASE_EPOCH_ID'] = current['epochId']
          variables['REPLACEMENT_BASE_SNAPSHOT_ID'] = current['snapshotId']
          variables['REPLACEMENT_BASE_LEDGER_INDEX'] = str(current['ledgerIndex'])
          variables['REPLACEMENT_BASE_LEDGER_HASH'] = current['ledgerHash']
          variables.pop('REPLACEMENT_BASE_CUTOVER_TOKEN', None)

          rendered = json.dumps(config, indent=2) + '\n'
          Path('wrangler.jsonc').write_text(rendered)
          Path('wrangler.production.jsonc').write_text(rendered)
          identity = {
              'epochId': current['epochId'],
              'snapshotId': current['snapshotId'],
              'ledgerIndex': current['ledgerIndex'],
              'ledgerHash': current['ledgerHash'],
              'historyPublicationSha256': history['publicationSha256'],
          }
          Path('production-deploy-checkpoint.json').write_text(json.dumps(identity, indent=2) + '\n')
          PY

          jq -e '
            .keep_vars == false
            and .triggers.crons == ["*/5 * * * *"]
            and .vars.APP_NETWORK == "devnet"
            and .vars.MAINNET_ENABLED == "false"
            and .vars.CURRENT_STATE_REPLACEMENT_GITHUB_BRANCH == "current-state-data"
            and (.vars.REPLACEMENT_BASE_LEDGER_INDEX | tonumber) > 0
            and (.vars | has("REPLACEMENT_BASE_CUTOVER_TOKEN") | not)
          ' wrangler.jsonc > /dev/null
          cmp wrangler.jsonc wrangler.production.jsonc

      - name: Build application
        run: pnpm build

      - name: Reassert bound root config after build
        shell: bash
        run: |
          set -euo pipefail
          cp wrangler.production.jsonc wrangler.jsonc
          EXPECTED_LEDGER="$(jq -r '.ledgerIndex' production-deploy-checkpoint.json)"
          EXPECTED_SNAPSHOT="$(jq -r '.snapshotId' production-deploy-checkpoint.json)"
          EXPECTED_HASH="$(jq -r '.ledgerHash' production-deploy-checkpoint.json)"
          jq -e \
            --arg ledger "${EXPECTED_LEDGER}" \
            --arg snapshot "${EXPECTED_SNAPSHOT}" \
            --arg hash "${EXPECTED_HASH}" '
              .keep_vars == false
              and .vars.APP_NETWORK == "devnet"
              and .vars.MAINNET_ENABLED == "false"
              and .vars.CURRENT_STATE_REPLACEMENT_SNAPSHOT_ID == $snapshot
              and .vars.REPLACEMENT_BASE_SNAPSHOT_ID == $snapshot
              and .vars.REPLACEMENT_BASE_LEDGER_INDEX == $ledger
              and .vars.REPLACEMENT_BASE_LEDGER_HASH == $hash
              and (.vars | has("REPLACEMENT_BASE_CUTOVER_TOKEN") | not)
            ' wrangler.jsonc > /dev/null
          cmp wrangler.jsonc wrangler.production.jsonc

      - name: Deploy Worker from bound root config
        id: deploy
        run: pnpm exec wrangler deploy

      - name: Verify deployed runtime checkpoint
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_EPOCH="$(jq -r '.epochId' production-deploy-checkpoint.json)"
          EXPECTED_SNAPSHOT="$(jq -r '.snapshotId' production-deploy-checkpoint.json)"
          EXPECTED_LEDGER="$(jq -r '.ledgerIndex' production-deploy-checkpoint.json)"
          EXPECTED_HASH="$(jq -r '.ledgerHash' production-deploy-checkpoint.json)"
          AUTH=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          verified=false

          for attempt in $(seq 1 60); do
            curl --fail-with-body --silent --show-error "${AUTH[@]}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-monitor/settings" \
              > deployed-worker-settings.json || true
            curl --fail-with-body --silent --show-error "${AUTH[@]}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-monitor/schedules" \
              > deployed-worker-schedules.json || true
            rebase_status="$(curl --silent --show-error --retry 1 \
              -o deployed-rebase-status.json -w '%{http_code}' \
              "${PRODUCTION_BASE}/api/status/replacement-base-rebase" || true)"

            if jq -e \
              --arg epoch "${EXPECTED_EPOCH}" \
              --arg snapshot "${EXPECTED_SNAPSHOT}" \
              --arg ledger "${EXPECTED_LEDGER}" \
              --arg hash "${EXPECTED_HASH}" '
                def binding($name):
                  [.result.bindings[] | select(.name == $name) | (.text // .value)] | first;
                binding("APP_NETWORK") == "devnet"
                and binding("MAINNET_ENABLED") == "false"
                and binding("CURRENT_STATE_REPLACEMENT_SNAPSHOT_ID") == $snapshot
                and binding("REPLACEMENT_BASE_EPOCH_ID") == $epoch
                and binding("REPLACEMENT_BASE_SNAPSHOT_ID") == $snapshot
                and binding("REPLACEMENT_BASE_LEDGER_INDEX") == $ledger
                and binding("REPLACEMENT_BASE_LEDGER_HASH") == $hash
                and ([.result.bindings[] | select(.name == "REPLACEMENT_BASE_CUTOVER_TOKEN")] | length) == 0
              ' deployed-worker-settings.json > /dev/null 2>&1 \
              && jq -e '.result.schedules | length == 1 and .[0].cron == "*/5 * * * *"' \
                deployed-worker-schedules.json > /dev/null 2>&1 \
              && [ "${rebase_status}" = 200 ] \
              && jq -e --arg epoch "${EXPECTED_EPOCH}" --arg snapshot "${EXPECTED_SNAPSHOT}" --argjson ledger "${EXPECTED_LEDGER}" --arg hash "${EXPECTED_HASH}" '
                .status == "replayed"
                and .target.epochId == $epoch
                and .target.snapshotId == $snapshot
                and .target.ledgerIndex == $ledger
                and .target.ledgerHash == $hash
              ' deployed-rebase-status.json > /dev/null 2>&1; then
              verified=true
              break
            fi
            sleep 3
          done

          test "${verified}" = true
          jq -n \
            --slurpfile checkpoint production-deploy-checkpoint.json \
            --slurpfile rebase deployed-rebase-status.json \
            '{passed:true,checkpoint:$checkpoint[0],replacementBase:$rebase[0],schedule:"*/5 * * * *",mainnetEnabled:false}' \
            > production-deploy-verification.json

      - name: Report deploy status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          FINAL_OUTCOME="${VERIFY_OUTCOME}"
          if [ -z "${FINAL_OUTCOME}" ] || [ "${FINAL_OUTCOME}" = skipped ]; then FINAL_OUTCOME="${DEPLOY_OUTCOME}"; fi
          if [ -s production-deploy-checkpoint.json ]; then
            jq -n \
              --arg runId "$GITHUB_RUN_ID" \
              --arg runUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              --arg headSha "$GITHUB_SHA" \
              --arg outcome "$FINAL_OUTCOME" \
              --slurpfile checkpoint production-deploy-checkpoint.json \
              '{runId:$runId,runUrl:$runUrl,headSha:$headSha,outcome:$outcome,checkpoint:$checkpoint[0]}' \
              > deploy-status.json
          else
            jq -n \
              --arg runId "$GITHUB_RUN_ID" \
              --arg runUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              --arg headSha "$GITHUB_SHA" \
              --arg outcome "$FINAL_OUTCOME" \
              '{runId:$runId,runUrl:$runUrl,headSha:$headSha,outcome:$outcome,checkpoint:null}' \
              > deploy-status.json
          fi
          API_PATH="repos/${GITHUB_REPOSITORY}/contents/.github/production-deploy-status.json"
          CONTENT=$(base64 -w0 deploy-status.json)
          EXISTING_SHA=$(gh api "$API_PATH" --jq .sha 2>/dev/null || true)
          if [ -n "$EXISTING_SHA" ]; then
            gh api --method PUT "$API_PATH" -f message="Update production deploy status" -f content="$CONTENT" -f sha="$EXISTING_SHA" >/dev/null
          else
            gh api --method PUT "$API_PATH" -f message="Create production deploy status" -f content="$CONTENT" >/dev/null
          fi

      - name: Upload deploy verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-deploy-verification
          path: |
            production-deploy-checkpoint.json
            production-deploy-verification.json
            wrangler.production.jsonc
            deployed-worker-settings.json
            deployed-worker-schedules.json
            deployed-rebase-status.json
            production-deploy-wait
          if-no-files-found: warn
          retention-days: 14
