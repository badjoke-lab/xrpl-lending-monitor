name: Type brief

on:
  pull_request:

permissions:
  contents: read

jobs:
  type-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run typecheck
        shell: bash
        run: |
          git clone --depth 1 --branch "$GITHUB_HEAD_REF" "https://github.com/$GITHUB_REPOSITORY.git" repo
          cd repo
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          pnpm install --frozen-lockfile --silent
          pnpm typecheck
