name: Soak monitor rehearsal

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/soak-monitor-rehearsal.yml'
      - 'scripts/soak-observation-policy.mjs'
      - 'scripts/soak-observation-policy.test.ts'
      - 'scripts/run-first-24h-soak-segment-v2.mjs'
      - 'scripts/finalize-first-24h-soak-v2.mjs'
      - 'scripts/evaluate-soak-monitor-rehearsal.mjs'

permissions:
  contents: read
  actions: read

concurrency:
  group: soak-monitor-rehearsal-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  BASE_URL: https://xrpl-lending-monitor.badjoke-lab.workers.dev
  PRIMARY_RPC: https://devnet.honeycluster.io/
  FALLBACK_RPC: https://s.devnet.rippletest.net:51234/
  EXPECTED_EPOCH_ID: devnet-3371675
  EXPECTED_SNAPSHOT_ID: devnet-3592674-0373cda0b0cd
  EXPECTED_LEDGER_INDEX: '3592674'
  EXPECTED_LEDGER_HASH: 0373CDA0B0CD8486C0C55C5B5DD460501419367BD76D146E4A718EBD9DD8A893

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      t0_epoch_ms: ${{ steps.meta.outputs.t0_epoch_ms }}
      deployment_id: ${{ steps.meta.outputs.deployment_id }}
      version_id: ${{ steps.meta.outputs.version_id }}
      last_updated_at: ${{ steps.meta.outputs.last_updated_at }}
      last_ledger: ${{ steps.meta.outputs.last_ledger }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OUTPUT_DIR: soak-rehearsal-start
    steps:
      - uses: actions/checkout@v4
      - name: Establish stable rehearsal start
        run: node scripts/run-first-24h-soak-segment-v2.mjs start
      - name: Publish start outputs
        id: meta
        run: |
          echo "t0_epoch_ms=$(jq -r '.t0EpochMs' "$OUTPUT_DIR/summary.json")" >> "$GITHUB_OUTPUT"
          echo "deployment_id=$(jq -r '.deploymentId' "$OUTPUT_DIR/summary.json")" >> "$GITHUB_OUTPUT"
          echo "version_id=$(jq -r '.versionId' "$OUTPUT_DIR/summary.json")" >> "$GITHUB_OUTPUT"
          echo "last_updated_at=$(jq -r '.lastUpdatedAt' "$OUTPUT_DIR/summary.json")" >> "$GITHUB_OUTPUT"
          echo "last_ledger=$(jq -r '.lastLedger' "$OUTPUT_DIR/summary.json")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-rehearsal-start
          path: soak-rehearsal-start
          if-no-files-found: error
          retention-days: 14

  observe:
    needs: [start]
    if: ${{ needs.start.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OUTPUT_DIR: soak-rehearsal-segment
      SEGMENT_INDEX: '1'
      SLOT_COUNT: '4'
      SLOT_INTERVAL_MS: '300000'
      MAX_ATTEMPTS: '4'
      RETRY_DELAY_MS: '20000'
      T0_EPOCH_MS: ${{ needs.start.outputs.t0_epoch_ms }}
      START_DEPLOYMENT_ID: ${{ needs.start.outputs.deployment_id }}
      START_VERSION_ID: ${{ needs.start.outputs.version_id }}
      PREVIOUS_UPDATED_AT: ${{ needs.start.outputs.last_updated_at }}
      PREVIOUS_LEDGER: ${{ needs.start.outputs.last_ledger }}
    steps:
      - uses: actions/checkout@v4
      - name: Observe four production five-minute ticks
        run: node scripts/run-first-24h-soak-segment-v2.mjs segment
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-rehearsal-segment
          path: soak-rehearsal-segment
          if-no-files-found: error
          retention-days: 14

  evaluate:
    needs: [start, observe]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      START_DIR: soak-rehearsal-start
      SEGMENT_DIR: soak-rehearsal-segment
      OUTPUT_DIR: soak-rehearsal-result
      METRICS_PATH: soak-rehearsal-result/metrics.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: soak-rehearsal-start
          path: soak-rehearsal-start
      - uses: actions/download-artifact@v4
        with:
          name: soak-rehearsal-segment
          path: soak-rehearsal-segment
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture exact fast-lane metrics for rehearsal window
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          T0="$(jq -r '.t0Iso' "$START_DIR/start.json")"
          pnpm exec wrangler d1 execute xrpl-lending-monitor --remote \
            --command "SELECT run_at,status,start_ledger_index,end_ledger_index,latest_observed_ledger,lag_ledgers,ledgers_processed,lending_transactions,coalesced_object_rows,persistence_rows_read,persistence_rows_written FROM fast_lane_shadow_run_metrics WHERE network='devnet' AND run_at >= '$T0' ORDER BY run_at ASC;" \
            --json > "$OUTPUT_DIR/metrics-raw.txt"
          sed -n '/^\[/,$p' "$OUTPUT_DIR/metrics-raw.txt" > "$METRICS_PATH"
      - name: Evaluate rehearsal
        run: node scripts/evaluate-soak-monitor-rehearsal.mjs
      - name: Publish rehearsal summary
        if: always()
        run: |
          if [ -f "$OUTPUT_DIR/result.md" ]; then cat "$OUTPUT_DIR/result.md" >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f "$OUTPUT_DIR/fatal-error.json" ]; then cat "$OUTPUT_DIR/fatal-error.json" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-monitor-rehearsal-result
          path: soak-rehearsal-result
          if-no-files-found: error
          retention-days: 30
