name: Inspect cursor-fix run

on:
  push:
    branches: [main]
    paths: [.github/current-state-ops-inspect-trigger]

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect cursor-fix workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/apply-read-model-cursor-parse-fix.yml/runs?per_page=5" \
            --jq '{runs:[.workflow_runs[]|{id,status,conclusion,head_sha,created_at,updated_at,html_url}]}' \
            > runs.json
          API="repos/${GITHUB_REPOSITORY}/contents/.github/cursor-fix-runs.json"
          CONTENT=$(base64 -w0 runs.json)
          SHA=$(gh api "$API" --jq .sha 2>/dev/null || true)
          if [ -n "$SHA" ]; then
            gh api --method PUT "$API" -f message="Update cursor-fix run list" -f content="$CONTENT" -f sha="$SHA" >/dev/null
          else
            gh api --method PUT "$API" -f message="Create cursor-fix run list" -f content="$CONTENT" >/dev/null
          fi
