name: Adopt active candidate and cut over

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/adopt-active-candidate-cutover.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: adopt-active-candidate-and-cutover-20260712
  cancel-in-progress: false

jobs:
  adopt-and-cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      ACTIVE_CANDIDATE_RUN_ID: '29161905481'
    steps:
      - uses: actions/checkout@v4

      - name: Wait for active candidate core completion
        shell: bash
        run: |
          set -euo pipefail
          ROOT=adopt-active-candidate-cutover
          mkdir -p "${ROOT}"

          for attempt in $(seq 1 360); do
            gh api "repos/${REPOSITORY}/actions/runs/${ACTIVE_CANDIDATE_RUN_ID}" \
              > "${ROOT}/candidate-run.json"
            if [ "$(jq -r '.status' "${ROOT}/candidate-run.json")" = completed ]; then break; fi
            sleep 30
          done
          test "$(jq -r '.status' "${ROOT}/candidate-run.json")" = completed

          gh api "repos/${REPOSITORY}/actions/runs/${ACTIVE_CANDIDATE_RUN_ID}/jobs?per_page=100" \
            > "${ROOT}/candidate-jobs.json"
          for step in \
            'Bind source pair and freeze bounded target' \
            'Generate bounded delta with configured read window' \
            'Verify delta and build target publication' \
            'Build target exact index incrementally' \
            'Build target current state from best available base' \
            'Publish history candidate branch' \
            'Publish current-state candidate branch' \
            'Rehearse remote candidate pair'; do
            jq -e --arg name "${step}" '
              [.jobs[].steps[] | select(.name == $name)] | length == 1 and .[0].conclusion == "success"
            ' "${ROOT}/candidate-jobs.json" > /dev/null
          done

      - name: Select newest aligned candidate pair
        shell: bash
        run: |
          set -euo pipefail
          ROOT=adopt-active-candidate-cutover
          : > "${ROOT}/candidate-pairs.ndjson"

          fetch_optional() {
            local branch="$1"
            local path="$2"
            local output="$3"
            gh api --method GET \
              "repos/${REPOSITORY}/contents/${path}" \
              -f ref="${branch}" \
              --jq '.content' 2>/dev/null \
              | tr -d '\n' | base64 --decode > "${output}"
          }

          evaluate_pair() {
            local history_branch="$1"
            local current_branch="$2"
            local label="$3"
            local pair_root="${ROOT}/${label}"
            mkdir -p "${pair_root}"
            if ! fetch_optional "${history_branch}" history/publication.json "${pair_root}/publication.json"; then return 0; fi
            if ! fetch_optional "${current_branch}" read-model/manifest.json "${pair_root}/current.json"; then return 0; fi
            local history_ledger current_ledger history_hash current_hash
            history_ledger="$(jq -r '.endLedgerIndex // 0' "${pair_root}/publication.json")"
            current_ledger="$(jq -r '.ledgerIndex // 0' "${pair_root}/current.json")"
            history_hash="$(jq -r '.endLedgerHash // empty' "${pair_root}/publication.json")"
            current_hash="$(jq -r '.ledgerHash // empty' "${pair_root}/current.json")"
            if [ "${history_ledger}" -gt 3570657 ] \
              && [ "${history_ledger}" = "${current_ledger}" ] \
              && [ "${history_hash}" = "${current_hash}" ] \
              && [ "$(jq -r '.complete' "${pair_root}/publication.json")" = true ] \
              && [ "$(jq -r '.complete' "${pair_root}/current.json")" = true ]; then
              jq -n \
                --arg historyBranch "${history_branch}" \
                --arg currentStateBranch "${current_branch}" \
                --argjson ledgerIndex "${history_ledger}" \
                --arg ledgerHash "${history_hash}" \
                '{historyBranch:$historyBranch,currentStateBranch:$currentStateBranch,ledgerIndex:$ledgerIndex,ledgerHash:$ledgerHash}' \
                >> "${ROOT}/candidate-pairs.ndjson"
            fi
          }

          evaluate_pair history-rolling-next-candidate-data current-state-rolling-next-candidate-data next
          evaluate_pair history-rolling-recovery-b-data current-state-rolling-recovery-b-data recovery
          evaluate_pair history-rolling-maintenance-candidate-data current-state-rolling-maintenance-candidate-data maintenance

          test -s "${ROOT}/candidate-pairs.ndjson"
          jq -s 'sort_by(.ledgerIndex) | last' "${ROOT}/candidate-pairs.ndjson" \
            > "${ROOT}/selected-candidate.json"

          FINAL_HISTORY="$(jq -r '.historyBranch' "${ROOT}/selected-candidate.json")"
          FINAL_CURRENT="$(jq -r '.currentStateBranch' "${ROOT}/selected-candidate.json")"
          FINAL_LEDGER="$(jq -r '.ledgerIndex' "${ROOT}/selected-candidate.json")"
          FINAL_HASH="$(jq -r '.ledgerHash' "${ROOT}/selected-candidate.json")"

          jq -n '{method:"ledger",params:[{ledger_index:"validated",transactions:false,expand:false}]}' \
            > "${ROOT}/live-head-request.json"
          curl --fail-with-body --silent --show-error --retry 3 \
            -H 'content-type: application/json' \
            --data @"${ROOT}/live-head-request.json" \
            https://devnet.honeycluster.io/ \
            > "${ROOT}/live-head-response.json"
          LIVE_LEDGER="$(jq -r '.result.ledger_index // .result.ledger.ledger_index' "${ROOT}/live-head-response.json")"
          FINAL_LAG="$((LIVE_LEDGER - FINAL_LEDGER))"
          if [ "${FINAL_LAG}" -lt 0 ]; then FINAL_LAG=0; fi
          test "${FINAL_LAG}" -le 720

          {
            echo "FINAL_HISTORY=${FINAL_HISTORY}"
            echo "FINAL_CURRENT=${FINAL_CURRENT}"
            echo "FINAL_LEDGER=${FINAL_LEDGER}"
            echo "FINAL_HASH=${FINAL_HASH}"
            echo "LIVE_LEDGER=${LIVE_LEDGER}"
            echo "FINAL_LAG=${FINAL_LAG}"
          } >> "${GITHUB_ENV}"

      - name: Dispatch exactly one guarded live cutover
        shell: bash
        run: |
          set -euo pipefail
          ROOT=adopt-active-candidate-cutover

          gh api \
            "repos/${REPOSITORY}/actions/workflows/rolling-checkpoint-live-cutover.yml/runs?per_page=100" \
            > "${ROOT}/cutover-before.json"
          jq -e '
            [.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "pending" or .status == "waiting" or .status == "requested")] | length == 0
          ' "${ROOT}/cutover-before.json" > /dev/null
          jq -r '.workflow_runs[].id' "${ROOT}/cutover-before.json" \
            > "${ROOT}/cutover-run-ids-before.txt"

          jq -n \
            --arg ref main \
            --arg history "${FINAL_HISTORY}" \
            --arg current "${FINAL_CURRENT}" \
            '{ref:$ref,inputs:{history_candidate_branch:$history,current_state_candidate_branch:$current,confirm_production_write:"true"}}' \
            > "${ROOT}/cutover-dispatch.json"
          gh api --method POST \
            "repos/${REPOSITORY}/actions/workflows/rolling-checkpoint-live-cutover.yml/dispatches" \
            --input "${ROOT}/cutover-dispatch.json"

          CUTOVER_RUN_ID=''
          for attempt in $(seq 1 60); do
            gh api \
              "repos/${REPOSITORY}/actions/workflows/rolling-checkpoint-live-cutover.yml/runs?event=workflow_dispatch&per_page=100" \
              > "${ROOT}/cutover-after.json"
            mapfile -t NEW_IDS < <(
              jq -r '.workflow_runs | sort_by(.created_at) | reverse | .[].id' "${ROOT}/cutover-after.json" \
                | while IFS= read -r id; do
                    if ! grep -Fxq "${id}" "${ROOT}/cutover-run-ids-before.txt"; then printf '%s\n' "${id}"; fi
                  done
            )
            if [ "${#NEW_IDS[@]}" -eq 1 ]; then
              CUTOVER_RUN_ID="${NEW_IDS[0]}"
              break
            fi
            if [ "${#NEW_IDS[@]}" -gt 1 ]; then exit 1; fi
            sleep 10
          done
          test -n "${CUTOVER_RUN_ID}"
          echo "CUTOVER_RUN_ID=${CUTOVER_RUN_ID}" >> "${GITHUB_ENV}"
          printf '%s\n' "${CUTOVER_RUN_ID}" > "${ROOT}/cutover-run-id.txt"

      - name: Require successful production cutover evidence
        shell: bash
        run: |
          set -euo pipefail
          ROOT=adopt-active-candidate-cutover

          for attempt in $(seq 1 180); do
            gh api "repos/${REPOSITORY}/actions/runs/${CUTOVER_RUN_ID}" > "${ROOT}/cutover-run.json"
            if [ "$(jq -r '.status' "${ROOT}/cutover-run.json")" = completed ]; then break; fi
            sleep 30
          done
          test "$(jq -r '.status' "${ROOT}/cutover-run.json")" = completed
          test "$(jq -r '.conclusion' "${ROOT}/cutover-run.json")" = success

          gh run download "${CUTOVER_RUN_ID}" \
            --repo "${REPOSITORY}" \
            --name rolling-checkpoint-live-cutover \
            --dir "${ROOT}/cutover-artifact"
          EVIDENCE="$(find "${ROOT}/cutover-artifact" -name evidence.json -type f | head -n 1)"
          POST="$(find "${ROOT}/cutover-artifact" -name post-cutover-verification.json -type f | head -n 1)"
          test -n "${EVIDENCE}"
          test -n "${POST}"
          cp "${EVIDENCE}" "${ROOT}/cutover-evidence.json"
          cp "${POST}" "${ROOT}/post-cutover-verification.json"

          jq -e --argjson target "${FINAL_LEDGER}" '
            .passed == true
            and .target.target.ledgerIndex == $target
            and .schedule == "*/5 * * * *"
            and .mainnetEnabled == false
          ' "${ROOT}/cutover-evidence.json" > /dev/null
          jq -e --argjson target "${FINAL_LEDGER}" '
            .passed == true
            and .target.ledgerIndex == $target
            and .lagLedgers <= 10
            and .currentStateAgeSeconds <= 600
            and .schedule == "*/5 * * * *"
            and .mainnetEnabled == false
          ' "${ROOT}/post-cutover-verification.json" > /dev/null

          jq -n \
            --argjson adoptedCandidateRunId "${ACTIVE_CANDIDATE_RUN_ID}" \
            --arg history "${FINAL_HISTORY}" \
            --arg current "${FINAL_CURRENT}" \
            --argjson ledger "${FINAL_LEDGER}" \
            --arg hash "${FINAL_HASH}" \
            --argjson liveLedgerAtGate "${LIVE_LEDGER}" \
            --argjson lagAtGate "${FINAL_LAG}" \
            --argjson cutoverRunId "${CUTOVER_RUN_ID}" \
            --slurpfile cutover "${ROOT}/cutover-evidence.json" \
            --slurpfile post "${ROOT}/post-cutover-verification.json" \
            '{passed:true,adoptedCandidateRunId:$adoptedCandidateRunId,finalCandidate:{historyBranch:$history,currentStateBranch:$current,ledgerIndex:$ledger,ledgerHash:$hash,liveLedgerAtGate:$liveLedgerAtGate,lagAtGate:$lagAtGate},cutoverRunId:$cutoverRunId,cutover:$cutover[0],postCutover:$post[0]}' \
            > "${ROOT}/summary.json"

      - name: Upload adopted cutover evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: adopted-active-candidate-cutover
          path: adopt-active-candidate-cutover
          if-no-files-found: warn
          retention-days: 30
