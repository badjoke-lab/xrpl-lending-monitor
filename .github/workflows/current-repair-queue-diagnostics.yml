name: Current repair Queue diagnostics and control

on:
  issue_comment:
    types: [created]
  push:
    branches:
      - current-repair-queue-consumer-control
    paths:
      - .github/current-repair-queue-consumer-control.json

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: current-repair-production-worker-write
  cancel-in-progress: false

env:
  QUALIFICATION_ISSUE: '995'
  SCRIPT_NAME: xrpl-lending-monitor
  QUEUE_ID: 2ae398f2edbf43749e45cd7ede77c6cd
  DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
  EXPECTED_WORKER_VERSION: 6141a09f-cf99-4098-a75b-145cef1b9e63
  EXPECTED_CONSUMER_ID: 149852ab52d548fea9e6b1d377d28fc1
  EXPECTED_STALE_SLOT_COUNT: '58'
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  GH_TOKEN: ${{ github.token }}

jobs:
  diagnose:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 995 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      github.event.comment.body == '/current-repair-queue-diagnostics'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Capture bounded read-only Queue blocker evidence
        id: diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/current-repair-queue-diagnostics.py
          set +e
          CURRENT_REPAIR_QUEUE_DIAGNOSTICS_OUTPUT=current-repair-queue-diagnostics-evidence \
            python scripts/current-repair-queue-diagnostics.py
          diagnostic_rc=$?
          set -e
          result=current-repair-queue-diagnostics-evidence/result.json
          printf 'diagnostic_rc=%s\n' "$diagnostic_rc" >> "$GITHUB_OUTPUT"
          if test -f "$result"; then
            printf 'result_available=true\npassed=%s\n' "$(jq -r '.passed' "$result")" >> "$GITHUB_OUTPUT"
          else
            printf 'result_available=false\npassed=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish bounded read-only Queue blocker evidence
        if: always()
        shell: bash
        env:
          RESULT_AVAILABLE: ${{ steps.diagnostic.outputs.result_available }}
          DIAGNOSTIC_RC: ${{ steps.diagnostic.outputs.diagnostic_rc }}
        run: |
          set -euo pipefail
          result=current-repair-queue-diagnostics-evidence/result.json
          if test "$RESULT_AVAILABLE" = true && test -f "$result"; then
            failure="$(jq -r '.failure // "none"' "$result")"
            consumer_count="$(jq -r '.consumer.count // "unavailable"' "$result")"
            consumer_id="$(jq -r '.consumer.list.consumerId // "unavailable"' "$result")"
            list_script="$(jq -r '.consumer.list.scriptName // "null"' "$result")"
            detail_script="$(jq -r '.consumer.detail.scriptName // "null"' "$result")"
            detail_type="$(jq -r '.consumer.detail.type // "null"' "$result")"
            identity="$(jq -r '.consumer.identityMatchesExpectedWorker // false' "$result")"
            retries="$(jq -r '.consumer.detail.settings.max_retries // .consumer.list.settings.max_retries // "unavailable"' "$result")"
            queue_paused="$(jq -r '.queue.deliveryPaused // "unavailable"' "$result")"
            backlog="$(jq -r '.queue.metrics.backlogCount // "unavailable"' "$result")"
            schema="$(jq -c '.slots.schemaColumns // []' "$result")"
            total="$(jq -r '.slots.total // "unavailable"' "$result")"
            live="$(jq -r '.slots.liveUnstaged // "unavailable"' "$result")"
            stale="$(jq -r '.slots.staleReclaimable // "unavailable"' "$result")"
            staged="$(jq -r '.slots.stagedSuccessor // "unavailable"' "$result")"
            oldest="$(jq -r '.slots.staleSpan.oldestUpdatedAt // "unavailable"' "$result")"
            newest="$(jq -r '.slots.staleSpan.newestUpdatedAt // "unavailable"' "$result")"
            oldest_sample="$(jq -c '.slots.oldestStaleSample // []' "$result")"
            newest_sample="$(jq -c '.slots.newestStaleSample // []' "$result")"
            status_counts="$(jq -c '.slots.statusCounts // []' "$result")"
            message_relation_count="$(jq -r '.slots.staleMessageRelationEvidence.candidateCount // 0' "$result")"
            message_relations="$(jq -c '[.slots.staleMessageRelationEvidence.candidates[]? | {table,stateColumn,runIdColumn,matchedStaleMessages,relationRows,unmatchedStaleMessages,ambiguousStaleMessages,stateCounts}]' "$result")"
            processed="$(jq -r '.fastLane.lastProcessedLedger // "unavailable"' "$result")"
            observed="$(jq -r '.fastLane.latestObservedLedger // "unavailable"' "$result")"
          else
            failure='structured result unavailable'
            consumer_count=unavailable
            consumer_id=unavailable
            list_script=unavailable
            detail_script=unavailable
            detail_type=unavailable
            identity=false
            retries=unavailable
            queue_paused=unavailable
            backlog=unavailable
            schema='[]'
            total=unavailable
            live=unavailable
            stale=unavailable
            staged=unavailable
            oldest=unavailable
            newest=unavailable
            oldest_sample='[]'
            newest_sample='[]'
            status_counts='[]'
            message_relation_count=0
            message_relations='[]'
            processed=unavailable
            observed=unavailable
          fi
          cat > /tmp/current-repair-queue-diagnostics.md <<EOF
          ## Current repair Queue blocker diagnostics — read only

          Run: \`${GITHUB_RUN_ID}\`
          Diagnostic exit code: \`${DIAGNOSTIC_RC}\`
          Failure: \`${failure}\`

          Queue paused / backlog: \`${queue_paused} / ${backlog}\`
          Consumer count / id: \`${consumer_count} / ${consumer_id}\`
          Consumer list script_name: \`${list_script}\`
          Consumer detail script_name / type: \`${detail_script} / ${detail_type}\`
          Consumer detail matches expected Worker: \`${identity}\`
          Consumer max_retries: \`${retries}\`

          Queue slot schema columns: \`${schema}\`
          Queue slots total / live / stale / staged: \`${total} / ${live} / ${stale} / ${staged}\`
          Queue slot status counts: \`${status_counts}\`
          Stale updated_at span: \`${oldest} .. ${newest}\`
          Oldest five stale rows: \`${oldest_sample}\`
          Newest five stale rows: \`${newest_sample}\`
          Exact message_id relation candidates: \`${message_relation_count}\`
          Message relation evidence: \`${message_relations}\`

          Fast-lane processed / observed ledger: \`${processed} / ${observed}\`

          Message relation discovery is diagnostic-only and non-authoritative. It cannot authorize reclaim or any production mutation.
          This workflow is read-only for the diagnostics command. It does not update the Queue consumer, resume/reseed/purge Queue delivery, deploy a Worker, mutate D1/Supabase, create a Cron, or enable Mainnet.
          EOF
          gh issue comment "$QUALIFICATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/current-repair-queue-diagnostics.md

      - name: Upload bounded read-only Queue blocker evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-repair-queue-diagnostics
          path: current-repair-queue-diagnostics-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Fail incomplete Queue blocker diagnostics
        if: steps.diagnostic.outputs.passed != 'true'
        shell: bash
        run: |
          echo 'Queue blocker diagnostics did not complete cleanly; see Issue #995 and artifact.' >&2
          exit 1

  control:
    if: github.event_name == 'push' && github.actor == 'badjoke-lab'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out triggering control commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Bind control request to exact current main
        id: control_request
        shell: bash
        run: |
          set -euo pipefail
          control=.github/current-repair-queue-consumer-control.json
          test -f "$control"
          jq -e 'type == "object"' "$control" >/dev/null
          action="$(jq -r '.action // ""' "$control")"
          base_commit="$(jq -r '.baseCommit // ""' "$control")"
          authorization="$(jq -r '.authorization // ""' "$control")"
          test "$action" = prepare || test "$action" = execute
          [[ "$base_commit" =~ ^[a-f0-9]{40}$ ]]
          if test "$action" = prepare; then
            test -z "$authorization"
          else
            test -n "$authorization"
          fi
          git fetch --no-tags --depth=1 origin main
          current_main="$(git rev-parse origin/main)"
          test "$base_commit" = "$current_main"
          cp "$control" /tmp/current-repair-queue-consumer-control.json
          git checkout --detach "$current_main"
          manager="$(sha256sum scripts/current-repair-queue-consumer.py | awk '{print $1}')"
          printf 'action=%s\nbase_commit=%s\nmanager=%s\n' "$action" "$base_commit" "$manager" >> "$GITHUB_OUTPUT"
          if test "$action" = execute; then
            {
              echo 'authorization<<EOF'
              printf '%s\n' "$authorization"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Capture exact read-only Queue consumer state
        if: steps.control_request.outputs.action == 'prepare'
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/current-repair-queue-consumer.py
          CURRENT_REPAIR_QUEUE_CONSUMER_OUTPUT=current-repair-queue-consumer-control-evidence/prepare \
            python scripts/current-repair-queue-consumer.py --prepare
          result=current-repair-queue-consumer-control-evidence/prepare/result.json
          test -f "$result"
          test "$(jq -r '.safe' "$result")" = true
          test "$(jq -r '.productionMutation' "$result")" = false
          test "$(jq -r '.failures | length' "$result")" -eq 0
          consumer="$(jq -r '.state.consumer.consumerId // ""' "$result")"
          stale_count="$(jq -r '.state.slots.staleSnapshotRowCount // -1' "$result")"
          stale_fingerprint="$(jq -r '.state.slots.staleSnapshotFingerprint // ""' "$result")"
          state="$(jq -r '.stateDigest // ""' "$result")"
          test "$consumer" = "$EXPECTED_CONSUMER_ID"
          test "$stale_count" -eq "$EXPECTED_STALE_SLOT_COUNT"
          [[ "$stale_fingerprint" =~ ^[a-f0-9]{64}$ ]]
          [[ "$state" =~ ^[a-f0-9]{64}$ ]]
          printf 'consumer=%s\nstale_count=%s\nstale_fingerprint=%s\nstate=%s\n' \
            "$consumer" "$stale_count" "$stale_fingerprint" "$state" >> "$GITHUB_OUTPUT"

      - name: Publish exact collision-free authorization proposal
        if: steps.control_request.outputs.action == 'prepare'
        env:
          BASE_COMMIT: ${{ steps.control_request.outputs.base_commit }}
          MANAGER: ${{ steps.control_request.outputs.manager }}
          CONSUMER: ${{ steps.prepare.outputs.consumer }}
          STALE_COUNT: ${{ steps.prepare.outputs.stale_count }}
          STALE_FINGERPRINT: ${{ steps.prepare.outputs.stale_fingerprint }}
          STATE: ${{ steps.prepare.outputs.state }}
        shell: bash
        run: |
          set -euo pipefail
          expires="$(date -u -d '+2 hours' '+%Y-%m-%dT%H:%M:%SZ')"
          nonce="$(openssl rand -hex 8)"
          command="/current-repair-queue-consumer-control-authorize commit=${BASE_COMMIT} consumer=${CONSUMER} manager=${MANAGER} state=${STATE} worker=${EXPECTED_WORKER_VERSION} prepare_run=${GITHUB_RUN_ID} expires=${expires} nonce=${nonce}"
          cat > /tmp/current-repair-queue-consumer-control-proposal.md <<EOF
          ## Current repair Queue consumer collision-free authorization proposal

          Preparation run: \`${GITHUB_RUN_ID}\`
          Source main commit: \`${BASE_COMMIT}\`
          Queue consumer: \`${CONSUMER}\`
          Current Worker: \`${EXPECTED_WORKER_VERSION}\`
          Retained stale-slot snapshot: \`${STALE_COUNT}\` rows
          Stale-slot snapshot SHA-256: \`${STALE_FINGERPRINT}\`
          Read-only state digest: \`${STATE}\`
          Manager SHA-256: \`${MANAGER}\`

          This push-triggered control path exists only to avoid the repository's issue-comment workflow-level concurrency collision. It uses the same production write lock and the same Queue consumer manager as the audited issue-comment path.

          The read-only preflight requires Queue delivery already paused, the exact pinned Worker consumer, \`batch_size=1\`, \`max_concurrency=1\`, current \`max_retries=3\`, no Cron, Devnet only, Mainnet disabled, no live Queue slot, no staged successor, and the exact retained \`${EXPECTED_STALE_SLOT_COUNT}\`-row stale-slot snapshot above. Authorization changes only that exact consumer's \`max_retries\` from \`3\` to \`100\`.

          It does not classify or reclaim stale rows, resume delivery, send/reseed/purge Queue messages, deploy a Worker, mutate D1/Supabase, create a Cron, or enable Mainnet.

          Exact authorization command:

          \`${command}\`
          EOF
          gh issue comment "$QUALIFICATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/current-repair-queue-consumer-control-proposal.md

      - name: Parse exact control authorization
        if: steps.control_request.outputs.action == 'execute'
        id: auth
        env:
          AUTHORIZATION_BODY: ${{ steps.control_request.outputs.authorization }}
          BASE_COMMIT: ${{ steps.control_request.outputs.base_commit }}
          MANAGER: ${{ steps.control_request.outputs.manager }}
        shell: bash
        run: |
          set -euo pipefail
          regex='^/current-repair-queue-consumer-control-authorize commit=([a-f0-9]{40}) consumer=([0-9a-f]{32}) manager=([a-f0-9]{64}) state=([a-f0-9]{64}) worker=([0-9a-f-]{36}) prepare_run=([0-9]+) expires=([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z) nonce=([a-f0-9]{16})$'
          [[ "$AUTHORIZATION_BODY" =~ $regex ]] || { echo 'Control authorization shape mismatch' >&2; exit 1; }
          test "${BASH_REMATCH[1]}" = "$BASE_COMMIT"
          test "${BASH_REMATCH[2]}" = "$EXPECTED_CONSUMER_ID"
          test "${BASH_REMATCH[3]}" = "$MANAGER"
          test "${BASH_REMATCH[5]}" = "$EXPECTED_WORKER_VERSION"
          names=(commit consumer manager state worker prepare_run expires nonce)
          for index in "${!names[@]}"; do
            printf '%s=%s\n' "${names[$index]}" "${BASH_REMATCH[$((index + 1))]}" >> "$GITHUB_OUTPUT"
          done

      - name: Verify exact prior proposal and unique owner authorization
        if: steps.control_request.outputs.action == 'execute'
        env:
          AUTHORIZATION_BODY: ${{ steps.control_request.outputs.authorization }}
          PREPARE_RUN: ${{ steps.auth.outputs.prepare_run }}
          EXPIRES: ${{ steps.auth.outputs.expires }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${QUALIFICATION_ISSUE}/comments?per_page=100" | jq -s 'add' > /tmp/current-repair-comments.json
          EXPECTED="$AUTHORIZATION_BODY" PREPARE="$PREPARE_RUN" node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const comments = JSON.parse(readFileSync('/tmp/current-repair-comments.json', 'utf8'))
          const proposals = comments.filter((comment) => comment?.user?.login === 'github-actions[bot]' && typeof comment?.body === 'string' && comment.body.includes(`Preparation run: \`${process.env.PREPARE}\``) && comment.body.includes(`\`${process.env.EXPECTED}\``))
          if (proposals.length !== 1) throw new Error(`expected one exact collision-free Queue consumer proposal, found ${proposals.length}`)
          const authorizations = comments.filter((comment) => comment?.user?.login === 'badjoke-lab' && comment?.body === process.env.EXPECTED)
          if (authorizations.length !== 1) throw new Error(`expected one exact owner authorization, found ${authorizations.length}`)
          const auth = authorizations[0]
          const authEpoch = Math.floor(new Date(auth.created_at).getTime() / 1000)
          const expiresEpoch = Math.floor(new Date(process.env.EXPIRES).getTime() / 1000)
          const nowEpoch = Math.floor(Date.now() / 1000)
          if (!Number.isFinite(authEpoch) || !Number.isFinite(expiresEpoch)) throw new Error('authorization timestamps are invalid')
          if (!(authEpoch < expiresEpoch && nowEpoch <= expiresEpoch && expiresEpoch - authEpoch <= 7200)) throw new Error('authorization is expired or exceeds maximum validity')
          NODE

      - name: Re-prove and update exact Queue consumer only
        if: steps.control_request.outputs.action == 'execute'
        env:
          AUTHORIZED_STATE_DIGEST: ${{ steps.auth.outputs.state }}
          AUTHORIZED_CONSUMER_ID: ${{ steps.auth.outputs.consumer }}
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/current-repair-queue-consumer.py
          CURRENT_REPAIR_QUEUE_CONSUMER_OUTPUT=current-repair-queue-consumer-control-evidence/execute \
            python scripts/current-repair-queue-consumer.py --execute

      - name: Publish control result
        if: always() && steps.control_request.outputs.action == 'execute'
        shell: bash
        run: |
          set -euo pipefail
          result=current-repair-queue-consumer-control-evidence/execute/result.json
          if test -f "$result"; then
            passed="$(jq -r '.passed' "$result")"
            changed="$(jq -r '.consumerUpdatePerformed' "$result")"
            max_retries="$(jq -r '.post.state.consumer.settings.max_retries // "unavailable"' "$result")"
            queue_resumed="$(jq -r '.queueResumed' "$result")"
            d1_mutation="$(jq -r '.d1Mutation' "$result")"
          else
            passed=false
            changed=unknown
            max_retries=unknown
            queue_resumed=unknown
            d1_mutation=unknown
          fi
          cat > /tmp/current-repair-queue-consumer-control-result.md <<EOF
          ## Current repair Queue consumer collision-free result

          Run: \`${GITHUB_RUN_ID}\`
          Passed: \`${passed}\`
          Consumer update performed: \`${changed}\`
          Production max_retries: \`${max_retries}\`
          Queue resumed: \`${queue_resumed}\`
          D1 mutation: \`${d1_mutation}\`

          This control operation changes only the existing Queue consumer retry setting. It does not resume/reseed/purge Queue delivery, deploy a Worker, create a Cron, mutate D1/Supabase, or enable Mainnet.
          EOF
          gh issue comment "$QUALIFICATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/current-repair-queue-consumer-control-result.md

      - name: Upload control evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-repair-queue-consumer-control-${{ steps.control_request.outputs.action }}
          path: current-repair-queue-consumer-control-evidence
          if-no-files-found: warn
          retention-days: 14
