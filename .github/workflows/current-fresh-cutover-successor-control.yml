name: Current fresh replacement successor-aware cutover control

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: >-
    ${{
      github.event.issue.number == 995 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      (
        github.event.comment.body == '/current-fresh-cutover-successor-prepare' ||
        startsWith(github.event.comment.body, '/current-fresh-cutover-successor-authorize ')
      ) &&
      'current-fresh-cutover-production-write' ||
      format('current-fresh-cutover-successor-noop-{0}', github.run_id)
    }}
  cancel-in-progress: false

env:
  QUALIFICATION_ISSUE: '995'
  QUEUE_ID: 2ae398f2edbf43749e45cd7ede77c6cd
  DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
  PRODUCTION_BASE: https://xrpl-lending-monitor.badjoke-lab.workers.dev
  RUNTIME_SOURCE_SHA: 07af3846ac056b892a23ef6146cc986bdf753dc1
  CUTOVER_DATA_BRANCH: current-state-fresh-replacement-cutover-data
  CUTOVER_DATA_COMMIT: 4fad78c2b8e5dc6e83363d9c8239bbfd6010e352
  CUTOVER_PAYLOAD_COMMIT: d9ba9fc769ab7ec8002d6ab56f54801f7967800b
  TARGET_EPOCH: devnet-3371675
  TARGET_SNAPSHOT: devnet-5101160-ea7a044b3eea
  TARGET_LEDGER: '5101160'
  TARGET_HASH: EA7A044B3EEA548AA9C12831104CA8AFEB6FE14C0FE96CA95E96E8C789234401
  TARGET_MANIFEST: 260aa84de5597200ab619d4112e60af7ae04c58ac0b17faa19799898d9b97a45
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  GH_TOKEN: ${{ github.token }}

jobs:
  prepare:
    if: >-
      github.event.issue.number == 995 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      github.event.comment.body == '/current-fresh-cutover-successor-prepare'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable target and unchanged production source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$RUNTIME_SOURCE_SHA"
          git diff --quiet "$RUNTIME_SOURCE_SHA" HEAD -- src wrangler.jsonc package.json pnpm-lock.yaml
          test "$(jq -r '.triggers.crons | length' wrangler.jsonc)" -eq 0
          test "$(jq -r '.vars.APP_NETWORK' wrangler.jsonc)" = devnet
          test "$(jq -r '.vars.MAINNET_ENABLED' wrangler.jsonc)" = false
          head="$(gh api "repos/${GITHUB_REPOSITORY}/branches/${CUTOVER_DATA_BRANCH}" --jq '.commit.sha')"
          test "$head" = "$CUTOVER_DATA_COMMIT"
          gh api "repos/${GITHUB_REPOSITORY}/contents/channel.json?ref=${CUTOVER_DATA_BRANCH}" --jq '.content' | tr -d '\n' | base64 -d > /tmp/channel.json
          gh api "repos/${GITHUB_REPOSITORY}/contents/fresh-replacement-base-summary.json?ref=${CUTOVER_DATA_BRANCH}" --jq '.content' | tr -d '\n' | base64 -d > /tmp/base-summary.json
          gh api "repos/${GITHUB_REPOSITORY}/contents/read-model/manifest.json?ref=${CUTOVER_DATA_BRANCH}" --jq '.content' | tr -d '\n' | base64 -d > /tmp/read-model-manifest.json
          jq -e --arg payload "$CUTOVER_PAYLOAD_COMMIT" --arg snapshot "$TARGET_SNAPSHOT" --arg manifest "$TARGET_MANIFEST" '.active.dataCommitSha == $payload and .active.snapshotId == $snapshot and .active.manifestSha256 == $manifest and .active.manifestPath == "read-model/manifest.json"' /tmp/channel.json >/dev/null
          jq -e --arg epoch "$TARGET_EPOCH" --arg snapshot "$TARGET_SNAPSHOT" --arg hash "$TARGET_HASH" --arg manifest "$TARGET_MANIFEST" --argjson ledger "$TARGET_LEDGER" '.epochId == $epoch and .snapshotId == $snapshot and .ledgerIndex == $ledger and .ledgerHash == $hash and .manifestSha256 == $manifest' /tmp/base-summary.json >/dev/null
          jq -e --arg epoch "$TARGET_EPOCH" --arg snapshot "$TARGET_SNAPSHOT" --arg hash "$TARGET_HASH" --arg manifest "$TARGET_MANIFEST" --argjson ledger "$TARGET_LEDGER" '.complete == true and .epochId == $epoch and .snapshotId == $snapshot and .ledgerIndex == $ledger and .ledgerHash == $hash and .manifestSha256 == $manifest' /tmp/read-model-manifest.json >/dev/null

      - name: Capture successor-aware read-only production state
        id: state
        shell: bash
        run: |
          set -euo pipefail
          export STATE_ROOT=current-fresh-cutover-successor-prepare
          scripts/current-fresh-cutover-successor-state.sh
          metadata="$STATE_ROOT/state-metadata.json"
          successor="$(jq -r '.successorNextScheduledTime' "$metadata")"
          backlog_bytes="$(jq -r '.backlogBytes' "$metadata")"
          digest="$(jq -r '.stateDigest' "$metadata")"
          deployment="$(jq -r '.deployment' "$metadata")"
          manager="$(sha256sum .github/workflows/current-fresh-cutover-successor-control.yml | awk '{print $1}')"
          printf 'source_commit=%s\ncandidate_commit=%s\ndeployment=%s\nstate=%s\nmanager=%s\nsuccessor=%s\nqueue_bytes=%s\n' \
            "$(git rev-parse HEAD)" "$CUTOVER_DATA_COMMIT" "$deployment" "$digest" "$manager" "$successor" "$backlog_bytes" >> "$GITHUB_OUTPUT"

      - name: Publish exact successor-aware authorization proposal
        env:
          SOURCE_COMMIT: ${{ steps.state.outputs.source_commit }}
          CANDIDATE_COMMIT: ${{ steps.state.outputs.candidate_commit }}
          DEPLOYMENT: ${{ steps.state.outputs.deployment }}
          STATE: ${{ steps.state.outputs.state }}
          MANAGER: ${{ steps.state.outputs.manager }}
          SUCCESSOR: ${{ steps.state.outputs.successor }}
          QUEUE_BYTES: ${{ steps.state.outputs.queue_bytes }}
        shell: bash
        run: |
          set -euo pipefail
          now_epoch="$(date -u +%s)"
          two_hours="$((now_epoch + 7200))"
          successor_guard="$((SUCCESSOR / 1000 - 600))"
          if test "$successor_guard" -lt "$two_hours"; then expires_epoch="$successor_guard"; else expires_epoch="$two_hours"; fi
          test "$expires_epoch" -gt "$((now_epoch + 300))"
          expires="$(date -u -d "@${expires_epoch}" '+%Y-%m-%dT%H:%M:%SZ')"
          nonce="$(openssl rand -hex 8)"
          command="/current-fresh-cutover-successor-authorize commit=${SOURCE_COMMIT} manager=${MANAGER} state=${STATE} candidate=${CANDIDATE_COMMIT} deployment=${DEPLOYMENT} target=${TARGET_LEDGER} snapshot=${TARGET_SNAPSHOT} manifest=${TARGET_MANIFEST} successor=${SUCCESSOR} queue_bytes=${QUEUE_BYTES} prepare_run=${GITHUB_RUN_ID} expires=${expires} nonce=${nonce}"
          cat > /tmp/proposal.md <<EOF2
          ## Fresh Current successor-aware cutover authorization proposal

          Preparation run: \`${GITHUB_RUN_ID}\`
          Source main commit: \`${SOURCE_COMMIT}\`
          Immutable cutover data commit: \`${CANDIDATE_COMMIT}\`
          Current production Worker version: \`${DEPLOYMENT}\`
          Target: \`${TARGET_LEDGER} / ${TARGET_SNAPSHOT}\`
          Known delayed successor scheduled time (ms): \`${SUCCESSOR}\`
          Queue delayed bytes bound into state: \`${QUEUE_BYTES}\`
          Read-only stable-state digest: \`${STATE}\`
          Manager SHA-256: \`${MANAGER}\`

          This authorization first pauses Queue delivery before any Worker deployment. The known four-hour delayed successor is preserved, not purged. The execute path deploys the immutable fresh target, applies only the replacement-base cutover, and leaves Queue delivery paused. It does not resume Queue delivery, enqueue a message, create a Cron, enable Mainnet, mutate Supabase History, or claim Current recovery.

          Exact authorization command:

          \`${command}\`
          EOF2
          gh issue comment "$QUALIFICATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/proposal.md

      - uses: actions/upload-artifact@v4
        with:
          name: current-fresh-cutover-successor-prepare
          path: current-fresh-cutover-successor-prepare
          if-no-files-found: error
          retention-days: 30

  execute:
    if: >-
      github.event.issue.number == 995 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      startsWith(github.event.comment.body, '/current-fresh-cutover-successor-authorize ')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      AUTHORIZATION_BODY: ${{ github.event.comment.body }}
      AUTHORIZATION_CREATED_AT: ${{ github.event.comment.created_at }}
      AUTHORIZATION_COMMENT_ID: ${{ github.event.comment.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Parse and bind exact authorization
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          regex='^/current-fresh-cutover-successor-authorize commit=([a-f0-9]{40}) manager=([a-f0-9]{64}) state=([a-f0-9]{64}) candidate=([a-f0-9]{40}) deployment=([0-9a-f-]{36}) target=([0-9]+) snapshot=([A-Za-z0-9._-]+) manifest=([a-f0-9]{64}) successor=([0-9]+) queue_bytes=([0-9]+) prepare_run=([0-9]+) expires=([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z) nonce=([a-f0-9]{16})$'
          [[ "$AUTHORIZATION_BODY" =~ $regex ]] || { echo 'Authorization shape mismatch' >&2; exit 1; }
          names=(commit manager state candidate deployment target snapshot manifest successor queue_bytes prepare_run expires nonce)
          for index in "${!names[@]}"; do printf '%s=%s\n' "${names[$index]}" "${BASH_REMATCH[$((index + 1))]}" >> "$GITHUB_OUTPUT"; done
          test "${BASH_REMATCH[1]}" = "$(git rev-parse HEAD)"
          test "${BASH_REMATCH[2]}" = "$(sha256sum .github/workflows/current-fresh-cutover-successor-control.yml | awk '{print $1}')"
          test "${BASH_REMATCH[4]}" = "$CUTOVER_DATA_COMMIT"
          test "${BASH_REMATCH[6]}" = "$TARGET_LEDGER"
          test "${BASH_REMATCH[7]}" = "$TARGET_SNAPSHOT"
          test "${BASH_REMATCH[8]}" = "$TARGET_MANIFEST"
          expires_epoch="$(date -u -d "${BASH_REMATCH[12]}" +%s)"
          auth_epoch="$(date -u -d "$AUTHORIZATION_CREATED_AT" +%s)"
          now_epoch="$(date -u +%s)"
          successor_epoch="$((BASH_REMATCH[9] / 1000))"
          test "$auth_epoch" -lt "$expires_epoch"
          test "$now_epoch" -le "$expires_epoch"
          test $((expires_epoch - auth_epoch)) -le 7200
          test "$expires_epoch" -le "$((successor_epoch - 600))"

      - name: Verify exact prior proposal and unique authorization
        env:
          PREPARE_RUN: ${{ steps.auth.outputs.prepare_run }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${QUALIFICATION_ISSUE}/comments?per_page=100" | jq -s 'add' > /tmp/comments.json
          EXPECTED="$AUTHORIZATION_BODY" PREPARE="$PREPARE_RUN" AUTH_ID="$AUTHORIZATION_COMMENT_ID" node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const comments = JSON.parse(readFileSync('/tmp/comments.json', 'utf8'))
          const proposals = comments.filter((c) => c?.user?.login === 'github-actions[bot]' && typeof c?.body === 'string' && c.body.includes(`Preparation run: \`${process.env.PREPARE}\``) && c.body.includes(`\`${process.env.EXPECTED}\``))
          if (proposals.length !== 1) throw new Error(`expected one exact proposal, found ${proposals.length}`)
          const authorizations = comments.filter((c) => c?.user?.login === 'badjoke-lab' && c?.body === process.env.EXPECTED)
          if (authorizations.length !== 1 || Number(authorizations[0].id) !== Number(process.env.AUTH_ID)) throw new Error('authorization is not unique')
          NODE

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Install dependencies and build deploy assets
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm build:deploy-assets

      - name: Re-prove exact authorized state
        env:
          AUTHORIZED_STATE: ${{ steps.auth.outputs.state }}
          AUTHORIZED_DEPLOYMENT: ${{ steps.auth.outputs.deployment }}
          AUTHORIZED_SUCCESSOR: ${{ steps.auth.outputs.successor }}
          AUTHORIZED_QUEUE_BYTES: ${{ steps.auth.outputs.queue_bytes }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$RUNTIME_SOURCE_SHA"
          git diff --quiet "$RUNTIME_SOURCE_SHA" HEAD -- src wrangler.jsonc package.json pnpm-lock.yaml
          test "$(gh api "repos/${GITHUB_REPOSITORY}/branches/${CUTOVER_DATA_BRANCH}" --jq '.commit.sha')" = "$CUTOVER_DATA_COMMIT"
          export STATE_ROOT=current-fresh-cutover-successor-execute
          scripts/current-fresh-cutover-successor-state.sh
          metadata="$STATE_ROOT/state-metadata.json"
          test "$(jq -r '.stateDigest' "$metadata")" = "$AUTHORIZED_STATE"
          test "$(jq -r '.deployment' "$metadata")" = "$AUTHORIZED_DEPLOYMENT"
          test "$(jq -r '.successorNextScheduledTime' "$metadata")" = "$AUTHORIZED_SUCCESSOR"
          test "$(jq -r '.backlogBytes' "$metadata")" = "$AUTHORIZED_QUEUE_BYTES"

      - name: Build ephemeral fresh-target config
        shell: bash
        run: |
          set -euo pipefail
          jq --arg branch "$CUTOVER_DATA_BRANCH" --arg epoch "$TARGET_EPOCH" --arg snapshot "$TARGET_SNAPSHOT" --arg ledger "$TARGET_LEDGER" --arg hash "$TARGET_HASH" '
            .vars.CURRENT_STATE_GITHUB_BRANCH = $branch
            | .vars.CURRENT_STATE_REPLACEMENT_SNAPSHOT_ID = $snapshot
            | .vars.CURRENT_STATE_REPLACEMENT_GITHUB_BRANCH = $branch
            | .vars.REPLACEMENT_BASE_REBASE_ENABLED = "true"
            | .vars.REPLACEMENT_BASE_EPOCH_ID = $epoch
            | .vars.REPLACEMENT_BASE_SNAPSHOT_ID = $snapshot
            | .vars.REPLACEMENT_BASE_LEDGER_INDEX = $ledger
            | .vars.REPLACEMENT_BASE_LEDGER_HASH = $hash
          ' wrangler.jsonc > .wrangler-fresh-cutover-successor.json
          test "$(jq -r '.triggers.crons | length' .wrangler-fresh-cutover-successor.json)" -eq 0
          test "$(jq -r '.vars.APP_NETWORK' .wrangler-fresh-cutover-successor.json)" = devnet
          test "$(jq -r '.vars.MAINNET_ENABLED' .wrangler-fresh-cutover-successor.json)" = false
          test "$(jq -r '.vars.CURRENT_STATE_GITHUB_BRANCH' .wrangler-fresh-cutover-successor.json)" = "$CUTOVER_DATA_BRANCH"
          test "$(jq -r '.vars.REPLACEMENT_BASE_LEDGER_INDEX' .wrangler-fresh-cutover-successor.json)" = "$TARGET_LEDGER"

      - name: Pause Queue, deploy fresh runtime, and apply cutover
        id: mutate
        env:
          OLD_VERSION: ${{ steps.auth.outputs.deployment }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT=current-fresh-cutover-successor-execute
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          qbase="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues/${QUEUE_ID}"
          deployment_attempted=false
          cutover_applied=false
          rollback() {
            rc=$?
            if test "$deployment_attempted" = true && test "$cutover_applied" = false; then pnpm exec wrangler versions deploy "${OLD_VERSION}@100%" --yes || true; fi
            curl -fsS -X PATCH -H "$auth" -H 'Content-Type: application/json' "$qbase" -d '{"settings":{"delivery_paused":true}}' >/dev/null || true
            rm -f "${secret_file:-}" .wrangler-fresh-cutover-successor.json
            exit "$rc"
          }
          trap rollback ERR
          curl -fsS -X PATCH -H "$auth" -H 'Content-Type: application/json' "$qbase" -d '{"settings":{"delivery_paused":true}}' > "$ROOT/queue-pause.json"
          curl -fsS -H "$auth" "$qbase" | tee "$ROOT/queue-paused-confirm.json" | jq -e '.success == true and .result.settings.delivery_paused == true' >/dev/null
          umask 077
          cutover_token="$(openssl rand -hex 32)"
          secret_file="$(mktemp)"
          jq -n --arg token "$cutover_token" '{REPLACEMENT_BASE_CUTOVER_TOKEN:$token}' > "$secret_file"
          pnpm exec wrangler versions upload --config .wrangler-fresh-cutover-successor.json --secrets-file "$secret_file" --message "Fresh Current successor-aware cutover ${TARGET_LEDGER}" | tee "$ROOT/version-upload.txt"
          rm -f "$secret_file"
          new_version="$(grep -Eio '[0-9a-f]{8}-[0-9a-f-]{27,}' "$ROOT/version-upload.txt" | tail -1)"
          test -n "$new_version"
          deployment_attempted=true
          pnpm exec wrangler versions deploy "${new_version}@100%" --yes | tee "$ROOT/version-deploy.txt"
          curl -fsS "$PRODUCTION_BASE/api/status/replacement-base-rebase" > "$ROOT/deployed-dry-run.json"
          jq -e --arg epoch "$TARGET_EPOCH" --arg snapshot "$TARGET_SNAPSHOT" --arg hash "$TARGET_HASH" --argjson ledger "$TARGET_LEDGER" '.status == "ready" and .plan.action == "rebase" and .plan.cursorMode == "advance_to_target" and .target.epochId == $epoch and .target.snapshotId == $snapshot and .target.ledgerIndex == $ledger and .target.ledgerHash == $hash' "$ROOT/deployed-dry-run.json" >/dev/null
          curl -fsS -X POST -H "x-replacement-base-cutover-token: ${cutover_token}" "$PRODUCTION_BASE/api/operator/replacement-base-cutover" > "$ROOT/cutover-response.json"
          jq -e --arg epoch "$TARGET_EPOCH" --arg snapshot "$TARGET_SNAPSHOT" --arg hash "$TARGET_HASH" --argjson ledger "$TARGET_LEDGER" '.status == "cutover_applied" and .network == "devnet" and .rebase.status == "rebased" and .rebase.plan.action == "rebase" and .rebase.plan.cursorMode == "advance_to_target" and .target.epochId == $epoch and .target.snapshotId == $snapshot and .target.ledgerIndex == $ledger and .target.ledgerHash == $hash' "$ROOT/cutover-response.json" >/dev/null
          cutover_applied=true
          rm -f .wrangler-fresh-cutover-successor.json
          trap - ERR
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"

      - name: Verify cutover with delayed successor preserved and Queue paused
        env:
          NEW_VERSION: ${{ steps.mutate.outputs.new_version }}
          AUTHORIZED_SUCCESSOR: ${{ steps.auth.outputs.successor }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT=current-fresh-cutover-successor-execute
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          qbase="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues/${QUEUE_ID}"
          curl -fsS -H "$auth" "$qbase" > "$ROOT/queue-after.json"
          jq -e '.success == true and .result.settings.delivery_paused == true' "$ROOT/queue-after.json" >/dev/null
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query"
          query() { curl -fsS -H "$auth" -H 'Content-Type: application/json' "$api" -d "$(jq -n --arg sql "$1" '{sql:$sql}')"; }
          query "SELECT COUNT(*) AS row_count FROM fast_lane_queue_slots WHERE status='completed' AND next_scheduled_time=${AUTHORIZED_SUCCESSOR}" > "$ROOT/delayed-successor-after.json"
          jq -e '.success == true and .result[0].success == true and .result[0].results[0].row_count == 1' "$ROOT/delayed-successor-after.json" >/dev/null
          curl -fsS "$PRODUCTION_BASE/api/status/replacement-base-rebase" > "$ROOT/replay-proof.json"
          jq -e --arg snapshot "$TARGET_SNAPSHOT" --arg hash "$TARGET_HASH" --argjson ledger "$TARGET_LEDGER" '.status == "replayed" and .plan.action == "replay" and .target.snapshotId == $snapshot and .target.ledgerIndex == $ledger and .target.ledgerHash == $hash' "$ROOT/replay-proof.json" >/dev/null
          query "SELECT epoch_id,last_processed_ledger,last_processed_hash FROM sync_state WHERE network='devnet'" > "$ROOT/sync-after.json"
          query "SELECT epoch_id,base_snapshot_id,base_ledger_index,base_ledger_hash,overlay_ledger_index,overlay_ledger_hash FROM current_state_overlay_state WHERE network='devnet' AND base_snapshot_id='${TARGET_SNAPSHOT}' ORDER BY updated_at DESC LIMIT 1" > "$ROOT/overlay-after.json"
          query "SELECT shadow_epoch_id,base_epoch_id,base_snapshot_id,base_ledger_index,base_ledger_hash FROM fast_lane_shadow_base_binding WHERE network='devnet'" > "$ROOT/base-binding-after.json"
          query "SELECT COUNT(*) AS row_count FROM fast_lane_shadow_state" > "$ROOT/fast-state-count-after.json"
          query "SELECT COUNT(*) AS row_count FROM fast_lane_shadow_objects_compact" > "$ROOT/compact-count-after.json"
          jq -e --arg epoch "$TARGET_EPOCH" --arg hash "$TARGET_HASH" --argjson ledger "$TARGET_LEDGER" '.success == true and .result[0].results[0].epoch_id == $epoch and .result[0].results[0].last_processed_ledger == $ledger and .result[0].results[0].last_processed_hash == $hash' "$ROOT/sync-after.json" >/dev/null
          jq -e --arg epoch "$TARGET_EPOCH" --arg snapshot "$TARGET_SNAPSHOT" --arg hash "$TARGET_HASH" --argjson ledger "$TARGET_LEDGER" '.success == true and .result[0].results[0].epoch_id == $epoch and .result[0].results[0].base_snapshot_id == $snapshot and .result[0].results[0].base_ledger_index == $ledger and .result[0].results[0].base_ledger_hash == $hash and .result[0].results[0].overlay_ledger_index == $ledger and .result[0].results[0].overlay_ledger_hash == $hash' "$ROOT/overlay-after.json" >/dev/null
          jq -e --arg epoch "$TARGET_EPOCH" --arg snapshot "$TARGET_SNAPSHOT" --arg hash "$TARGET_HASH" --argjson ledger "$TARGET_LEDGER" '.success == true and .result[0].results[0].base_epoch_id == $epoch and .result[0].results[0].base_snapshot_id == $snapshot and .result[0].results[0].base_ledger_index == $ledger and .result[0].results[0].base_ledger_hash == $hash' "$ROOT/base-binding-after.json" >/dev/null
          jq -e '.success == true and .result[0].results[0].row_count == 0' "$ROOT/fast-state-count-after.json" >/dev/null
          jq -e '.success == true and .result[0].results[0].row_count == 0' "$ROOT/compact-count-after.json" >/dev/null
          jq -n --arg newVersion "$NEW_VERSION" --arg snapshot "$TARGET_SNAPSHOT" --arg manifest "$TARGET_MANIFEST" --argjson ledger "$TARGET_LEDGER" --argjson successor "$AUTHORIZED_SUCCESSOR" '{passed:true,productionMutation:true,newVersion:$newVersion,targetLedger:$ledger,targetSnapshot:$snapshot,manifestSha256:$manifest,queuePaused:true,queueResumed:false,queuePurged:false,delayedSuccessorPreserved:true,delayedSuccessorNextScheduledTime:$successor,cronChanged:false,mainnetEnabled:false,historyMutation:false,currentRecovered:false,recoveryRequiresFreshDeliveryProof:true}' | tee "$ROOT/result.json"

      - name: Publish cutover result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result=current-fresh-cutover-successor-execute/result.json
          if test -f "$result"; then passed="$(jq -r '.passed' "$result")"; version="$(jq -r '.newVersion' "$result")"; else passed=false; version=unavailable; fi
          gh issue comment "$QUALIFICATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body "Fresh successor-aware cutover run \`${GITHUB_RUN_ID}\`: passed=\`${passed}\`, version=\`${version}\`, Current recovered=\`false\`. Queue remains paused; separate fresh-delivery proof is required."

      - name: Upload execute evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-fresh-cutover-successor-execute
          path: current-fresh-cutover-successor-execute
          if-no-files-found: warn
          retention-days: 30
