name: Current fresh replacement read-only preflight

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: current-fresh-replacement-readonly-preflight
  cancel-in-progress: false

env:
  DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
  CANDIDATE_BRANCH: current-state-fresh-replacement-candidate-data
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  preflight:
    if: >-
      github.event.issue.number == 995 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      github.event.comment.body == '/current-fresh-replacement-preflight'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact implementation
        uses: actions/checkout@v4

      - name: Check out isolated fresh candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_BRANCH }}
          path: .local/fresh-candidate
          fetch-depth: 1
          sparse-checkout: |
            channel.json
            read-model/manifest.json
          sparse-checkout-cone-mode: false

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:replacement-base-rebase-plan

      - name: Verify fresh candidate and read production D1 evidence
        shell: bash
        run: |
          set -euo pipefail
          ROOT=current-fresh-replacement-preflight
          CHANNEL=.local/fresh-candidate/channel.json
          MANIFEST=.local/fresh-candidate/read-model/manifest.json
          mkdir -p "${ROOT}"

          CANDIDATE_HEAD="$(git -C .local/fresh-candidate rev-parse HEAD)"
          DATA_COMMIT="$(jq -r '.active.dataCommitSha // empty' "${CHANNEL}")"
          printf '%s' "${CANDIDATE_HEAD}" | grep -Eq '^[a-f0-9]{40}$'
          printf '%s' "${DATA_COMMIT}" | grep -Eq '^[a-f0-9]{40}$'

          jq -e --slurpfile manifest "${MANIFEST}" '
            .schemaVersion == 1
            and .active.manifestPath == "read-model/manifest.json"
            and .active.snapshotId == $manifest[0].snapshotId
            and .active.manifestSha256 == $manifest[0].manifestSha256
            and .active.releaseTag == $manifest[0].releaseTag
            and ($manifest[0].complete == true)
            and ($manifest[0].epochId == "devnet-3371675")
            and ($manifest[0].ledgerIndex == 5101160)
            and ($manifest[0].ledgerHash == "EA7A044B3EEA548AA9C12831104CA8AFEB6FE14C0FE96CA95E96E8C789234401")
            and ($manifest[0].snapshotId == "devnet-5101160-ea7a044b3eea")
            and ($manifest[0].manifestSha256 == "260aa84de5597200ab619d4112e60af7ae04c58ac0b17faa19799898d9b97a45")
          ' "${CHANNEL}" >/dev/null

          git -C .local/fresh-candidate fetch --depth=1 origin "${DATA_COMMIT}"
          git -C .local/fresh-candidate show "${DATA_COMMIT}:read-model/manifest.json" > "${ROOT}/data-commit-manifest.json"
          cmp -s "${MANIFEST}" "${ROOT}/data-commit-manifest.json"

          jq '{
            epochId,
            snapshotId,
            ledgerIndex,
            ledgerHash
          }' "${MANIFEST}" > "${ROOT}/target.json"

          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          d1="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query"
          query() {
            local sql="$1"
            curl -fsS -X POST -H "$auth" -H 'Content-Type: application/json' "$d1" \
              --data "$(jq -cn --arg sql "$sql" '{sql:$sql}')"
          }

          query "SELECT * FROM sync_state WHERE network='devnet'" > "${ROOT}/sync.json"
          query "SELECT id FROM network_epochs WHERE network='devnet' AND status='current' ORDER BY updated_at DESC" > "${ROOT}/epoch.json"
          query "SELECT network,epoch_id,base_snapshot_id,base_ledger_index,base_ledger_hash,overlay_ledger_index,overlay_ledger_hash,updated_at FROM current_state_overlay_state WHERE network='devnet' AND epoch_id='devnet-3371675' ORDER BY updated_at DESC,base_snapshot_id ASC" > "${ROOT}/overlays.json"

          for file in sync epoch overlays; do
            jq -e '.success == true' "${ROOT}/${file}.json" >/dev/null
          done
          jq -e '.result[0].results | length == 1' "${ROOT}/sync.json" >/dev/null
          jq -e '.result[0].results | length == 1' "${ROOT}/epoch.json" >/dev/null

          jq -n \
            --slurpfile sync "${ROOT}/sync.json" \
            --slurpfile epoch "${ROOT}/epoch.json" \
            --slurpfile overlays "${ROOT}/overlays.json" '
              ($sync[0].result[0].results[0]) as $s |
              {
                sync: {
                  network: "devnet",
                  epochId: $s.epoch_id,
                  lastProcessedLedger: $s.last_processed_ledger,
                  lastProcessedHash: $s.last_processed_hash,
                  latestObservedLedger: $s.latest_observed_ledger,
                  latestObservedHash: $s.latest_observed_hash,
                  status: $s.status
                },
                currentEpochId: $epoch[0].result[0].results[0].id,
                overlayStates: ($overlays[0].result[0].results | map({
                  network: "devnet",
                  epochId: .epoch_id,
                  baseSnapshotId: .base_snapshot_id,
                  baseLedgerIndex: .base_ledger_index,
                  baseLedgerHash: .base_ledger_hash,
                  overlayLedgerIndex: .overlay_ledger_index,
                  overlayLedgerHash: .overlay_ledger_hash,
                  updatedAt: .updated_at
                }))
              }
            ' > "${ROOT}/production-evidence.json"

          node .replacement-base-rebase-plan-build/plan-replacement-base-rebase.mjs \
            --local \
            --target "${ROOT}/target.json" \
            --evidence "${ROOT}/production-evidence.json" \
            > "${ROOT}/plan.json"

          jq -e '
            .plan.action == "rebase"
            and .plan.cursorMode == "advance_to_target"
            and .target.ledgerIndex == 5101160
            and .target.ledgerHash == "EA7A044B3EEA548AA9C12831104CA8AFEB6FE14C0FE96CA95E96E8C789234401"
          ' "${ROOT}/plan.json" >/dev/null

          jq -n \
            --arg implementationCommit "$(git rev-parse HEAD)" \
            --arg candidateBranch "${CANDIDATE_BRANCH}" \
            --arg candidateCommit "${CANDIDATE_HEAD}" \
            --arg dataCommit "${DATA_COMMIT}" \
            --slurpfile manifest "${MANIFEST}" \
            --slurpfile evidence "${ROOT}/production-evidence.json" \
            --slurpfile plan "${ROOT}/plan.json" '
              {
                passed: true,
                productionMutation: false,
                implementationCommit: $implementationCommit,
                candidateBranch: $candidateBranch,
                candidateCommit: $candidateCommit,
                dataCommit: $dataCommit,
                target: {
                  epochId: $manifest[0].epochId,
                  snapshotId: $manifest[0].snapshotId,
                  ledgerIndex: $manifest[0].ledgerIndex,
                  ledgerHash: $manifest[0].ledgerHash,
                  manifestSha256: $manifest[0].manifestSha256
                },
                production: {
                  currentEpochId: $evidence[0].currentEpochId,
                  cursorLedgerIndex: $evidence[0].sync.lastProcessedLedger,
                  cursorLedgerHash: $evidence[0].sync.lastProcessedHash,
                  latestObservedLedger: $evidence[0].sync.latestObservedLedger,
                  latestObservedHash: $evidence[0].sync.latestObservedHash,
                  status: $evidence[0].sync.status,
                  overlayStateCount: ($evidence[0].overlayStates | length)
                },
                plan: $plan[0].plan
              }
            ' | tee "${ROOT}/result.json"

      - name: Upload read-only fresh replacement evidence
        uses: actions/upload-artifact@v4
        with:
          name: current-fresh-replacement-preflight
          path: current-fresh-replacement-preflight
          if-no-files-found: error
          retention-days: 30
