name: Benchmark 40-ledger catch-up throughput

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/ops-benchmark-throughput-40.yml]

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec wrangler deploy
      - name: Capture collector samples
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" > evidence/subdomain.json
          SUBDOMAIN="$(jq -r '.result.subdomain' evidence/subdomain.json)"
          BASE="https://xrpl-lending-monitor.${SUBDOMAIN}.workers.dev"
          printf '%s\n' "$BASE" > evidence/base-url.txt
          sleep 75
          for I in 0 1 2 3 4 5; do
            curl -sS "$BASE/api/status/collector" > "evidence/collector-$I.json"
            if [ "$I" -lt 5 ]; then sleep 60; fi
          done
          jq -s '[.[] | {status, cursor: .cursor.last_processed_ledger, head: .cursor.latest_observed_ledger, lag: .cursor.lag_ledgers, run_duration_ms: .timing.run_duration_ms, ledgers_processed: .usage.ledgers_processed, rpc_requests: .usage.rpc_requests, estimated_rows: .usage.estimated_rows, estimated_statements: .usage.estimated_statements, overlay_mutations: .usage.overlay_mutations, consecutive_failures, error}]' evidence/collector-*.json > evidence/series.json
          jq '{first: .[0], last: .[-1], cursor_delta: (.[-1].cursor - .[0].cursor), head_delta: (.[-1].head - .[0].head), lag_delta: (.[-1].lag - .[0].lag), samples: length}' evidence/series.json > evidence/summary.json
          curl -sS "$BASE/api/status/continuation-verification" > evidence/continuation-verification.json
          curl -sS "$BASE/api/status/m1-exit" > evidence/m1-exit.json
      - uses: actions/upload-artifact@v4
        with:
          name: throughput-40-evidence
          path: evidence
          if-no-files-found: error
