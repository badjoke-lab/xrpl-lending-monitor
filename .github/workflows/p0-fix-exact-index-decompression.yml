name: P0 fix exact-index decompression headroom

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  repair:
    if: startsWith(github.event.issue.title, 'P0 fix exact-index decompression headroom')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      REPAIR_BRANCH: fix/exact-index-bucket-decompression-headroom
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch bounded base-bucket decompression headroom
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/build-incremental-history-exact-index.ts')
          text = path.read_text()
          anchor = "type ExactIndexAsset = HistoryExactIndexManifest['assets'][number]\n"
          replacement = "const MAX_BASE_EXACT_INDEX_DECOMPRESSED_BYTES = 128 * 1024 * 1024\n\ntype ExactIndexAsset = HistoryExactIndexManifest['assets'][number]\n"
          if text.count(anchor) != 1:
              raise SystemExit('exact-index asset anchor mismatch')
          text = text.replace(anchor, replacement)

          old = "  const decoded = await decodeGzipNdjsonWithMetadata({ bytes, sha256: options.asset.sha256 })\n"
          new = "  const decoded = await decodeGzipNdjsonWithMetadata({\n    bytes,\n    sha256: options.asset.sha256,\n    maxDecompressedBytes: MAX_BASE_EXACT_INDEX_DECOMPRESSED_BYTES,\n  })\n"
          if text.count(old) != 1:
              raise SystemExit('base bucket decoder anchor mismatch')
          text = text.replace(old, new)
          path.write_text(text)
          PY
          git diff --check
          pnpm lint
          pnpm typecheck
          pnpm build:incremental-history-exact-index
      - name: Publish focused repair PR
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -B "${REPAIR_BRANCH}"
          git add scripts/build-incremental-history-exact-index.ts
          git commit -m "Raise bounded exact-index bucket decompression headroom"
          git push --force origin "HEAD:refs/heads/${REPAIR_BRANCH}"
          PR_URL="$(gh pr list --repo "${REPOSITORY}" --head "${REPAIR_BRANCH}" --state open --json url --jq '.[0].url // empty')"
          if [ -z "${PR_URL}" ]; then
            PR_URL="$(gh pr create --repo "${REPOSITORY}" --base main --head "${REPAIR_BRANCH}" \
              --title 'Raise bounded exact-index bucket decompression headroom' \
              --body 'Raises only the incremental exact-index base-bucket decompression ceiling from the shared 64 MiB default to an explicit bounded 128 MiB. The shared artifact decoder default and all other readers remain unchanged. This repairs rolling recovery cycle 2, which failed after a validated bucket crossed 64 MiB uncompressed. Mainnet, capacity guards, cadence, and cutover guards are unchanged.')"
          fi
          gh issue comment "${ISSUE_NUMBER}" --repo "${REPOSITORY}" --body "Repair PR: ${PR_URL}"
