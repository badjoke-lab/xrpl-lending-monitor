name: Publish current-state release

on:
  workflow_dispatch:
    inputs:
      endpoint:
        description: XRPL JSON-RPC endpoint
        required: false
        default: https://s.devnet.rippletest.net:51234
      page_limit:
        description: Maximum ledger_data pages for release materialization
        required: false
        default: '500'
      object_limit_per_page:
        description: ledger_data object limit per page
        required: false
        default: '2048'
      data_segments:
        description: Release-native data segment count
        required: false
        default: '20'
      index_buckets:
        description: Release-native index bucket count
        required: false
        default: '64'
      publish_active:
        description: Publish active channel only when the snapshot is complete
        required: false
        default: 'false'
  push:
    branches:
      - main
    paths:
      - .github/current-state-release-trigger

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: current-state-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      ENDPOINT: ${{ github.event.inputs.endpoint || 'https://s.devnet.rippletest.net:51234' }}
      PAGE_LIMIT: ${{ github.event_name == 'push' && '15000' || github.event.inputs.page_limit || '500' }}
      OBJECT_LIMIT_PER_PAGE: ${{ github.event.inputs.object_limit_per_page || '2048' }}
      DATA_SEGMENTS: ${{ github.event.inputs.data_segments || '20' }}
      INDEX_BUCKETS: ${{ github.event.inputs.index_buckets || '64' }}
      PUBLISH_ACTIVE: ${{ github.event_name == 'push' && 'true' || github.event.inputs.publish_active || 'false' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release materializer
        run: |
          pnpm build:release-current-state
          TARGET=.release-current-state-build/run-release-current-state.mjs
          COUNT=$(grep -o "result.validated !== true" "$TARGET" | wc -l)
          if [ "$COUNT" -ne 1 ]; then
            echo "Expected exactly one validated guard in $TARGET, found $COUNT" >&2
            exit 1
          fi
          sed -i 's/result\.validated !== true/result.validated === false/' "$TARGET"

      - name: Materialize current-state release assets
        id: materialize
        run: |
          mkdir -p .local/current-state-release
          RELEASE_TAG="current-state-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          set +e
          node .release-current-state-build/run-release-current-state.mjs \
            --local \
            --endpoint "$ENDPOINT" \
            --release-tag "$RELEASE_TAG" \
            --page-limit "$PAGE_LIMIT" \
            --object-limit-per-page "$OBJECT_LIMIT_PER_PAGE" \
            --data-segments "$DATA_SEGMENTS" \
            --index-buckets "$INDEX_BUCKETS" \
            --output-dir .local/current-state-release \
            > .local/current-state-release/materialize.stdout.log \
            2> .local/current-state-release/materialize.stderr.log
          STATUS=$?
          cat .local/current-state-release/materialize.stderr.log
          cat .local/current-state-release/materialize.stdout.log
          exit "$STATUS"

      - name: Upload generated assets for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-state-release-assets
          path: .local/current-state-release
          if-no-files-found: error

      - name: Require complete current-state release before publication
        id: completeness
        if: env.PUBLISH_ACTIVE == 'true'
        run: |
          if [ "$(jq -r .complete .local/current-state-release/release-summary.json)" != "true" ]; then
            echo "Refusing to publish incomplete current-state snapshot." >&2
            exit 1
          fi

      - name: Publish immutable snapshot release
        id: publish_snapshot
        if: env.PUBLISH_ACTIVE == 'true'
        run: |
          TAG="$(jq -r .releaseTag .local/current-state-release/release-summary.json)"
          gh release create "$TAG" .local/current-state-release/assets/* \
            --title "$TAG" \
            --notes-file .local/current-state-release/release-notes.md \
            --target "$GITHUB_SHA" \
            --latest=false

      - name: Publish active channel
        id: publish_channel
        if: env.PUBLISH_ACTIVE == 'true'
        run: |
          CHANNEL_TAG="current-state-channel"
          if gh release view "$CHANNEL_TAG" >/dev/null 2>&1; then
            gh release upload "$CHANNEL_TAG" .local/current-state-release/channel/channel.json --clobber
          else
            gh release create "$CHANNEL_TAG" .local/current-state-release/channel/channel.json \
              --title "$CHANNEL_TAG" \
              --notes "Active current-state release channel." \
              --target "$GITHUB_SHA" \
              --latest=false
          fi

      - name: Report run status
        if: always()
        env:
          MATERIALIZE_OUTCOME: ${{ steps.materialize.outcome }}
          COMPLETENESS_OUTCOME: ${{ steps.completeness.outcome }}
          SNAPSHOT_OUTCOME: ${{ steps.publish_snapshot.outcome }}
          CHANNEL_OUTCOME: ${{ steps.publish_channel.outcome }}
        run: |
          SUMMARY=.local/current-state-release/release-summary.json
          STDERR=.local/current-state-release/materialize.stderr.log
          if [ -f "$SUMMARY" ]; then
            COMPLETE=$(jq -r '.complete // false' "$SUMMARY")
            RELEASE_TAG=$(jq -r '.releaseTag // ""' "$SUMMARY")
            SOURCE_PAGES=$(jq -r '.sourcePages // 0' "$SUMMARY")
            DATA_ASSETS=$(jq -r '.dataAssets // 0' "$SUMMARY")
            INDEX_ASSETS=$(jq -r '.indexAssets // 0' "$SUMMARY")
          else
            COMPLETE=false
            RELEASE_TAG=""
            SOURCE_PAGES=0
            DATA_ASSETS=0
            INDEX_ASSETS=0
          fi
          if [ -f "$STDERR" ]; then
            STDERR_TAIL=$(tail -n 40 "$STDERR")
          else
            STDERR_TAIL=""
          fi
          jq -n \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg runUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg headSha "$GITHUB_SHA" \
            --arg materialize "$MATERIALIZE_OUTCOME" \
            --arg completeness "$COMPLETENESS_OUTCOME" \
            --arg snapshot "$SNAPSHOT_OUTCOME" \
            --arg channel "$CHANNEL_OUTCOME" \
            --arg complete "$COMPLETE" \
            --arg releaseTag "$RELEASE_TAG" \
            --arg sourcePages "$SOURCE_PAGES" \
            --arg dataAssets "$DATA_ASSETS" \
            --arg indexAssets "$INDEX_ASSETS" \
            --arg stderrTail "$STDERR_TAIL" \
            '{schemaVersion:1,runId:$runId,runAttempt:$runAttempt,runUrl:$runUrl,headSha:$headSha,outcomes:{materialize:$materialize,completeness:$completeness,snapshot:$snapshot,channel:$channel},complete:($complete=="true"),releaseTag:$releaseTag,sourcePages:($sourcePages|tonumber),dataAssets:($dataAssets|tonumber),indexAssets:($indexAssets|tonumber),stderrTail:$stderrTail}' \
            > current-state-release-status.json
          API_PATH="repos/${GITHUB_REPOSITORY}/contents/.github/current-state-release-status.json"
          CONTENT=$(base64 -w0 current-state-release-status.json)
          EXISTING_SHA=$(gh api "$API_PATH" --jq .sha 2>/dev/null || true)
          if [ -n "$EXISTING_SHA" ]; then
            gh api --method PUT "$API_PATH" \
              -f message="Update current-state release run status" \
              -f content="$CONTENT" \
              -f sha="$EXISTING_SHA" >/dev/null
          else
            gh api --method PUT "$API_PATH" \
              -f message="Create current-state release run status" \
              -f content="$CONTENT" >/dev/null
          fi
