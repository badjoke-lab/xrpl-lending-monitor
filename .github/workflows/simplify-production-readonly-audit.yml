name: Simplify production read-only audit

on:
  push:
    branches:
      - simplify/collector-display-only-20260911

permissions:
  contents: read

env:
  DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read collector and Current identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p simplify-production-audit
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          d1="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query"

          query() {
            local sql="$1"
            curl -fsS -X POST -H "$auth" -H 'Content-Type: application/json' "$d1" \
              --data "$(jq -cn --arg sql "$sql" '{sql:$sql}')"
          }

          query "SELECT name,sql FROM sqlite_master WHERE type='table' AND name IN ('sync_state','incremental_collector_state','current_state_overlay_state','current_state_d1_active_snapshots','current_state_d1_snapshots','fast_lane_shadow_state') ORDER BY name" > simplify-production-audit/schema.json
          query "SELECT network,epoch_id,last_processed_ledger,last_processed_hash,latest_observed_ledger,latest_observed_hash,status,last_success_at,error_code,error_message,updated_at FROM sync_state WHERE network='devnet'" > simplify-production-audit/sync-state.json
          query "SELECT network,status,last_attempt_at,last_success_at,consecutive_failures,lag_ledgers,last_ledgers_processed,last_overlay_mutations,error_code,error_message,updated_at FROM incremental_collector_state WHERE network='devnet'" > simplify-production-audit/incremental-state.json
          query "SELECT network,epoch_id,base_snapshot_id,base_ledger_index,base_ledger_hash,overlay_ledger_index,overlay_ledger_hash,updated_at FROM current_state_overlay_state WHERE network='devnet' ORDER BY updated_at DESC LIMIT 5" > simplify-production-audit/overlay-state.json
          query "SELECT active.network,active.epoch_id,active.snapshot_id,snapshot.ledger_index,snapshot.ledger_hash,snapshot.status,snapshot.vault_count,snapshot.loan_broker_count,snapshot.loan_count,snapshot.object_count,snapshot.completed_at FROM current_state_d1_active_snapshots active JOIN current_state_d1_snapshots snapshot ON snapshot.id=active.snapshot_id AND snapshot.epoch_id=active.epoch_id WHERE active.network='devnet' LIMIT 5" > simplify-production-audit/active-snapshot.json
          query "SELECT network,epoch_id,last_processed_ledger,last_processed_hash,latest_observed_ledger,latest_observed_hash,status,updated_at FROM fast_lane_shadow_state WHERE network='devnet'" > simplify-production-audit/fast-lane-state.json

          for file in schema sync-state incremental-state overlay-state active-snapshot fast-lane-state; do
            jq -e '.success == true' "simplify-production-audit/${file}.json" >/dev/null
          done

          jq -n \
            --argjson sync "$(jq '.result[0].results[0] // null' simplify-production-audit/sync-state.json)" \
            --argjson incremental "$(jq '.result[0].results[0] // null' simplify-production-audit/incremental-state.json)" \
            --argjson overlay "$(jq '.result[0].results[0] // null' simplify-production-audit/overlay-state.json)" \
            --argjson snapshot "$(jq '.result[0].results[0] // null' simplify-production-audit/active-snapshot.json)" \
            --argjson fast "$(jq '.result[0].results[0] // null' simplify-production-audit/fast-lane-state.json)" \
            '{productionMutation:false,sync:$sync,incremental:$incremental,overlay:$overlay,activeSnapshot:$snapshot,fastLane:$fast}' \
            | tee simplify-production-audit/summary.json

      - uses: actions/upload-artifact@v4
        with:
          name: simplify-production-readonly-audit
          path: simplify-production-audit
          if-no-files-found: error
          retention-days: 7
