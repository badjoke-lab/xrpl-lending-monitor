name: Cancel combined run 30322659427

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/workflows/cancel-combined-run-30322659427.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Cancel exact previous combined build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/runs/30322659427/cancel"
          echo "cancel_requested_run=30322659427"
