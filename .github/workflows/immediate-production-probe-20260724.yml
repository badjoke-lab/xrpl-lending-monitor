name: Immediate production probe 20260724

on:
  push:
    branches: [main]
    paths:
      - .github/immediate-production-probe-20260724-trigger

permissions:
  contents: write
  issues: write

concurrency:
  group: immediate-production-probe-20260724
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
  PRODUCTION_BASE: https://xrpl-lending-monitor.badjoke-lab.workers.dev
  STATUS_ISSUE: '978'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Read current production state
        shell: bash
        run: |
          set -euo pipefail
          query_d1() {
            local sql="$1" output="$2"
            jq -n --arg sql "$sql" '{sql:$sql}' \
              | curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
                  --connect-timeout 10 --max-time 45 \
                  -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  -H 'Content-Type: application/json' --data-binary @- \
                  "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query" > "$output"
          }
          fetch_api() {
            local path="$1" output="$2" code_file="$3"
            curl --silent --show-error --retry 3 --retry-all-errors \
              --connect-timeout 10 --max-time 45 -o "$output" -w '%{http_code}' \
              "${PRODUCTION_BASE}${path}" > "$code_file"
          }

          query_d1 "SELECT epoch_id,last_processed_ledger,last_processed_hash,latest_observed_ledger,latest_observed_hash,status,(latest_observed_ledger-last_processed_ledger) AS lag_ledgers,updated_at FROM fast_lane_shadow_state WHERE network='devnet'" fast.json
          query_d1 "SELECT epoch_id,base_snapshot_id,base_ledger_index,base_ledger_hash,overlay_ledger_index,overlay_ledger_hash,updated_at FROM current_state_overlay_state WHERE network='devnet'" overlay.json
          query_d1 "SELECT network,run_at,status,start_ledger_index,end_ledger_index,latest_observed_ledger,lag_ledgers,ledgers_processed,persistence_rows_read,persistence_rows_written,error_message FROM fast_lane_shadow_run_metrics WHERE network='devnet' ORDER BY run_at DESC LIMIT 1" metric.json
          query_d1 "SELECT scheduled_time,datetime(scheduled_time/1000,'unixepoch') AS scheduled_at_utc,status,started_at,completed_at,next_scheduled_time,error_message,updated_at FROM fast_lane_queue_slots ORDER BY scheduled_time DESC LIMIT 12" slots.json
          query_d1 "SELECT COUNT(*) AS compact_rows FROM fast_lane_shadow_objects_compact WHERE network='devnet'" compact.json
          query_d1 "SELECT COUNT(*) AS stale_rows FROM current_state_overlay_objects o WHERE o.network='devnet' AND NOT EXISTS (SELECT 1 FROM fast_lane_shadow_base_binding b WHERE b.network=o.network AND b.base_epoch_id=o.epoch_id AND b.base_snapshot_id=o.base_snapshot_id)" stale.json
          query_d1 "SELECT COUNT(*) AS compressed_rows,MIN(start_ledger_index) AS first_ledger,MAX(end_ledger_index) AS last_ledger,MAX(LENGTH(bundle_json)) AS max_encoded_bytes FROM fast_lane_history_windows WHERE network='devnet' AND SUBSTR(bundle_json,1,15)='gzip-base64-v1:'" history.json

          fetch_api '/api/overview' overview.json overview.code
          fetch_api '/api/status/history-source' history-source.json history-source.code
          fetch_api '/api/status/fast-lane-diff?limit=1' fast-lane-diff.json fast-lane-diff.code
          fetch_api '/api/status/replacement-base-rebase' replacement-base.json replacement-base.code

          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-monitor/settings" > settings.json
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-monitor/schedules" > schedules.json
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-monitor/deployments" > deployments.json

          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          def results(path):
              p=json.loads(Path(path).read_text())
              return p.get('result',[{}])[0].get('results',[])
          def one(path):
              r=results(path); return r[0] if r else {}
          fast=one('fast.json'); overlay=one('overlay.json'); metric=one('metric.json')
          slots=results('slots.json'); compact=one('compact.json').get('compact_rows',-1); stale=one('stale.json').get('stale_rows',-1); history=one('history.json')
          settings=json.loads(Path('settings.json').read_text()); schedules=json.loads(Path('schedules.json').read_text()); deployments=json.loads(Path('deployments.json').read_text())
          bindings=settings.get('result',{}).get('bindings',[])
          def binding(name):
              for b in bindings:
                  if b.get('name')==name: return b.get('text',b.get('value'))
              return None
          sched=schedules.get('result',{}).get('schedules',[])
          deployment_rows=deployments.get('result',{}).get('deployments') or []
          http={n:Path(f'{n}.code').read_text().strip() for n in ('overview','history-source','fast-lane-diff','replacement-base')}
          latest_slots=slots[:3]
          slot_ok=bool(latest_slots) and all(s.get('status')=='completed' and not s.get('error_message') for s in latest_slots)
          head_match=(int(fast.get('last_processed_ledger',-1))==int(overlay.get('overlay_ledger_index',-2)) and fast.get('last_processed_hash')==overlay.get('overlay_ledger_hash'))
          healthy=all([
              fast.get('status')=='healthy', int(fast.get('lag_ledgers',-1))==0,
              metric.get('status')=='committed', metric.get('error_message') in (None,''),
              head_match, int(compact)==0, int(stale)==0, slot_ok,
              binding('APP_NETWORK')=='devnet', binding('MAINNET_ENABLED')=='false',
              len(sched)==1 and sched[0].get('cron')=='*/5 * * * *',
              all(v=='200' for v in http.values()), int(history.get('compressed_rows') or 0)>0,
          ])
          out={
            'checkedAt':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
            'healthy':healthy,'fastLane':fast,'canonicalOverlay':overlay,'latestMetric':metric,
            'recentQueueSlots':slots,'compactRows':compact,'staleRows':stale,'compressedHistory':history,
            'http':http,'configuration':{'appNetwork':binding('APP_NETWORK'),'mainnetEnabled':binding('MAINNET_ENABLED'),'schedules':sched,'latestDeployment':deployment_rows[0] if deployment_rows else None},
          }
          Path('immediate-production-probe-20260724.json').write_text(json.dumps(out,indent=2)+'\n')
          PY

      - name: Publish current probe evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s immediate-production-probe-20260724.json ]; then
            jq -n --arg checkedAt "$(date -u +%FT%TZ)" '{checkedAt:$checkedAt,healthy:false,error:"probe_result_missing"}' > immediate-production-probe-20260724.json
          fi
          tmp="$(mktemp)"
          jq --arg runUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --arg runId "$GITHUB_RUN_ID" '. + {runUrl:$runUrl,runId:($runId|tonumber)}' immediate-production-probe-20260724.json > "$tmp"
          mv "$tmp" immediate-production-probe-20260724.json
          {
            echo '## Immediate production probe'
            echo
            echo '```json'
            cat immediate-production-probe-20260724.json
            echo '```'
          } > issue-comment.md
          gh issue comment "$STATUS_ISSUE" --body-file issue-comment.md
          api="repos/${GITHUB_REPOSITORY}/contents/.github/immediate-production-probe-20260724.json"
          sha="$(gh api "$api" --jq .sha 2>/dev/null || true)"
          content="$(base64 -w0 immediate-production-probe-20260724.json)"
          if [ -n "$sha" ]; then
            gh api --method PUT "$api" -f message='Record immediate production probe' -f content="$content" -f sha="$sha" -f branch=main >/dev/null
          else
            gh api --method PUT "$api" -f message='Record immediate production probe' -f content="$content" -f branch=main >/dev/null
          fi
          test "$(jq -r '.healthy' immediate-production-probe-20260724.json)" = true
