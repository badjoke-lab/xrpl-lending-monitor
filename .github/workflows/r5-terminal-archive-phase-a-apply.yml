name: R5 terminal archive Phase A apply

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: r5-terminal-archive-phase-a-apply
  cancel-in-progress: false

env:
  QUALIFICATION_ISSUE: '1261'
  MANAGER_PATH: scripts/manage-r5-terminal-archive-production-apply.mjs
  INTERNAL_DB_HALT: '400000000'
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
  GH_TOKEN: ${{ github.token }}

jobs:
  prepare:
    if: >-
      github.event.issue.number == 1261 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      github.event.comment.body == '/r5-terminal-archive-phase-a-prepare'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare exact Phase A production pre-state read-only
        id: state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r5-terminal-archive-phase-a-evidence
          source_commit="$(git rev-parse HEAD)"
          manager_sha="$(sha256sum "$MANAGER_PATH" | awk '{print $1}')"
          node "$MANAGER_PATH" prepare \
            --source-commit "$source_commit" \
            --output r5-terminal-archive-phase-a-evidence/prepare.json \
            > r5-terminal-archive-phase-a-evidence/prepare.stdout.json
          file=r5-terminal-archive-phase-a-evidence/prepare.json
          test "$(jq -r '.archiveClassification' "$file")" = unapplied_expected
          test "$(jq -r '.activeRun.status' "$file")" = halted
          test "$(jq -r '.activeRun.lastError' "$file")" = r5_recovery_database_halt
          test "$(jq -r '.mainnetDisabled' "$file")" = true
          test "$(jq -r '.canonicalHistoryRowMutationAuthorized' "$file")" = false
          test "$(jq -r '.terminalTransportBackfillAuthorized' "$file")" = false
          test "$(jq -r '.physicalCompactionAuthorized' "$file")" = false
          test "$(jq -r '.schedulerMutationAuthorized' "$file")" = false
          test "$(jq -r '.publicReaderMutationAuthorized' "$file")" = false
          test "$(jq -r '.r5RearmAuthorized' "$file")" = false
          printf 'source_commit=%s\nmanager_sha=%s\nplan=%s\nstate=%s\nproject=%s\nhead=%s\ndatabase_bytes=%s\nscheduler=%s\n' \
            "$source_commit" "$manager_sha" \
            "$(jq -r '.planDigestSha256' "$file")" \
            "$(jq -r '.structuralStateSha256' "$file")" \
            "$(jq -r '.projectIdentityDigest' "$file")" \
            "$(jq -r '.maxMigrationVersion' "$file")" \
            "$(jq -r '.databaseBytes' "$file")" \
            "$(jq -r '.schedulerSha256' "$file")" >> "$GITHUB_OUTPUT"

      - name: Publish expiring exact Phase A authorization proposal
        env:
          SOURCE_COMMIT: ${{ steps.state.outputs.source_commit }}
          MANAGER_SHA: ${{ steps.state.outputs.manager_sha }}
          PLAN_SHA: ${{ steps.state.outputs.plan }}
          STATE_SHA: ${{ steps.state.outputs.state }}
          PROJECT_DIGEST: ${{ steps.state.outputs.project }}
          MIGRATION_HEAD: ${{ steps.state.outputs.head }}
          DATABASE_BYTES: ${{ steps.state.outputs.database_bytes }}
          SCHEDULER_SHA: ${{ steps.state.outputs.scheduler }}
        shell: bash
        run: |
          set -euo pipefail
          expires="$(date -u -d '+2 hours' '+%Y-%m-%dT%H:%M:%SZ')"
          nonce="$(openssl rand -hex 8)"
          command="/r5-terminal-archive-phase-a-authorize commit=${SOURCE_COMMIT} manager=${MANAGER_SHA} plan=${PLAN_SHA} state=${STATE_SHA} project=${PROJECT_DIGEST} head=${MIGRATION_HEAD} prepare_run=${GITHUB_RUN_ID} expires=${expires} nonce=${nonce}"
          file=r5-terminal-archive-phase-a-evidence/prepare.json
          jq -r '.plan.files[] | "- `\(.path)` — SHA-256 `\(.sha256)` — `\(.bytes)` bytes"' "$file" > /tmp/r5-terminal-archive-files.md
          cat > /tmp/r5-terminal-archive-proposal.md <<EOF2
          ## R5 terminal archive Phase A authorization proposal

          Preparation run: \`${GITHUB_RUN_ID}\`
          Source main commit: \`${SOURCE_COMMIT}\`
          Manager SHA-256: \`${MANAGER_SHA}\`
          Exact five-file plan digest: \`${PLAN_SHA}\`
          Authorized structural state SHA-256: \`${STATE_SHA}\`
          Project identity digest: \`${PROJECT_DIGEST}\`
          Current production migration head: \`${MIGRATION_HEAD}\`
          Database bytes at preparation: \`${DATABASE_BYTES}\`
          Fixed internal halt: \`${INTERNAL_DB_HALT}\`
          Scheduler structural SHA-256: \`${SCHEDULER_SHA}\`
          Authorization expires: \`${expires}\`

          Exact Phase A SQL allowlist:
          EOF2
          cat /tmp/r5-terminal-archive-files.md >> /tmp/r5-terminal-archive-proposal.md
          cat >> /tmp/r5-terminal-archive-proposal.md <<EOF2

          This proposal authorizes only installation of the private terminal archive schema/functions and the archive-aware revision-4/core compatibility definitions in the exact five-file plan above. It does **not** authorize terminal transport backfill, deletion of existing terminal transport rows, physical rewrite/compaction, VACUUM, scheduler mutation, deployment, public-reader mutation, Mainnet, stabilization, soak, or R5 rearm.

          The apply manager requires the R5 successor to remain \`halted\` with \`r5_recovery_database_halt\`, revalidates the exact structural state and plan, applies all five files in one transaction, and then requires canonical message/successor/work/reference row counts, R5 run/batch state, scheduler digest, and production migration head to remain unchanged. The new archive table must contain exactly zero rows after Phase A.

          Exact authorization command:

          \`${command}\`
          EOF2
          gh issue comment "$QUALIFICATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/r5-terminal-archive-proposal.md

      - name: Upload sanitized Phase A preparation evidence
        if: always() && steps.state.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: r5-terminal-archive-phase-a-prepare-evidence
          path: r5-terminal-archive-phase-a-evidence
          if-no-files-found: error
          retention-days: 14

  execute:
    if: >-
      github.event.issue.number == 1261 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      startsWith(github.event.comment.body, '/r5-terminal-archive-phase-a-authorize ')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      AUTHORIZATION_BODY: ${{ github.event.comment.body }}
      AUTHORIZATION_CREATED_AT: ${{ github.event.comment.created_at }}
      AUTHORIZATION_COMMENT_ID: ${{ github.event.comment.id }}
    steps:
      - name: Check out exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Parse and bind exact owner Phase A authorization
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          regex='^/r5-terminal-archive-phase-a-authorize commit=([a-f0-9]{40}) manager=([a-f0-9]{64}) plan=([a-f0-9]{64}) state=([a-f0-9]{64}) project=([a-f0-9]{64}) head=([0-9]{14}) prepare_run=([0-9]+) expires=([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z) nonce=([a-f0-9]{16})$'
          [[ "$AUTHORIZATION_BODY" =~ $regex ]] || { echo 'terminal archive Phase A authorization shape mismatch' >&2; exit 1; }
          commit="${BASH_REMATCH[1]}"; manager="${BASH_REMATCH[2]}"; plan="${BASH_REMATCH[3]}"; state="${BASH_REMATCH[4]}"; project="${BASH_REMATCH[5]}"; head="${BASH_REMATCH[6]}"; prepare_run="${BASH_REMATCH[7]}"; expires="${BASH_REMATCH[8]}"; nonce="${BASH_REMATCH[9]}"
          test "$commit" = "$(git rev-parse HEAD)"
          test "$manager" = "$(sha256sum "$MANAGER_PATH" | awk '{print $1}')"
          [[ "$SUPABASE_PROJECT_ID" =~ ^[a-z]{20}$ ]]
          current_project="$(PROJECT_ID="$SUPABASE_PROJECT_ID" node -e "const c=require('node:crypto');process.stdout.write(c.createHash('sha256').update(process.env.PROJECT_ID).digest('hex'))")"
          test "$project" = "$current_project"
          expires_epoch="$(date -u -d "$expires" +%s)"; auth_epoch="$(date -u -d "$AUTHORIZATION_CREATED_AT" +%s)"; now_epoch="$(date -u +%s)"
          test "$auth_epoch" -lt "$expires_epoch"; test "$now_epoch" -le "$expires_epoch"; test $((expires_epoch - auth_epoch)) -le 7200
          printf 'commit=%s\nmanager=%s\nplan=%s\nstate=%s\nproject=%s\nhead=%s\nprepare_run=%s\nexpires=%s\nnonce=%s\n' "$commit" "$manager" "$plan" "$state" "$project" "$head" "$prepare_run" "$expires" "$nonce" >> "$GITHUB_OUTPUT"

      - name: Verify exact prior proposal and unique owner authorization
        env:
          PREPARE_RUN: ${{ steps.auth.outputs.prepare_run }}
          COMMIT: ${{ steps.auth.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREPARE_RUN}" > /tmp/r5-terminal-archive-prepare-run.json
          jq -e --arg commit "$COMMIT" '.event == "issue_comment" and .conclusion == "success" and .head_sha == $commit and .actor.login == "badjoke-lab"' /tmp/r5-terminal-archive-prepare-run.json >/dev/null
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${QUALIFICATION_ISSUE}/comments?per_page=100" | jq -s 'add' > /tmp/r5-terminal-archive-comments.json
          EXPECTED="$AUTHORIZATION_BODY" PREPARE_RUN="$PREPARE_RUN" AUTH_ID="$AUTHORIZATION_COMMENT_ID" AUTH_CREATED_AT="$AUTHORIZATION_CREATED_AT" node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const comments = JSON.parse(readFileSync('/tmp/r5-terminal-archive-comments.json', 'utf8'))
          const expected = process.env.EXPECTED
          const prepareRun = process.env.PREPARE_RUN
          const authorizationAt = Date.parse(process.env.AUTH_CREATED_AT ?? '')
          const proposals = comments.filter((comment) => comment?.user?.login === 'github-actions[bot]' && typeof comment?.body === 'string' && comment.body.includes(`Preparation run: \`${prepareRun}\``) && comment.body.includes(`\`${expected}\``))
          if (proposals.length !== 1) throw new Error(`expected one exact terminal archive Phase A proposal, found ${proposals.length}`)
          const proposalAt = Date.parse(proposals[0].created_at ?? '')
          if (!Number.isFinite(proposalAt) || !Number.isFinite(authorizationAt) || !(proposalAt < authorizationAt)) throw new Error('Phase A proposal must precede owner authorization')
          const ownerCommands = comments.filter((comment) => comment?.user?.login === 'badjoke-lab' && comment?.body === expected)
          if (ownerCommands.length !== 1 || Number(ownerCommands[0].id) !== Number(process.env.AUTH_ID)) throw new Error(`Phase A authorization must be unique, found ${ownerCommands.length}`)
          NODE

      - name: Revalidate exact Phase A state read-only
        id: pre
        env:
          COMMIT: ${{ steps.auth.outputs.commit }}
          AUTH_PLAN: ${{ steps.auth.outputs.plan }}
          AUTH_STATE: ${{ steps.auth.outputs.state }}
          AUTH_HEAD: ${{ steps.auth.outputs.head }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r5-terminal-archive-phase-a-evidence
          node "$MANAGER_PATH" prepare --source-commit "$COMMIT" --output r5-terminal-archive-phase-a-evidence/pre-apply.json > /tmp/r5-terminal-archive-pre.json
          test "$(jq -r '.planDigestSha256' /tmp/r5-terminal-archive-pre.json)" = "$AUTH_PLAN"
          test "$(jq -r '.structuralStateSha256' /tmp/r5-terminal-archive-pre.json)" = "$AUTH_STATE"
          test "$(jq -r '.maxMigrationVersion' /tmp/r5-terminal-archive-pre.json)" = "$AUTH_HEAD"
          test "$(jq -r '.activeRun.status' /tmp/r5-terminal-archive-pre.json)" = halted
          test "$(jq -r '.activeRun.lastError' /tmp/r5-terminal-archive-pre.json)" = r5_recovery_database_halt

      - name: Apply only exact authorized terminal archive Phase A
        id: apply
        env:
          COMMIT: ${{ steps.auth.outputs.commit }}
          AUTH_PLAN: ${{ steps.auth.outputs.plan }}
          AUTH_STATE: ${{ steps.auth.outputs.state }}
        shell: bash
        run: |
          set -euo pipefail
          node "$MANAGER_PATH" apply \
            --source-commit "$COMMIT" \
            --authorized-plan "$AUTH_PLAN" \
            --authorized-state "$AUTH_STATE" \
            --output r5-terminal-archive-phase-a-evidence/apply.json \
            2>&1 | tee r5-terminal-archive-phase-a-evidence/apply.log

      - name: Verify bounded Phase A result
        if: steps.apply.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          file=r5-terminal-archive-phase-a-evidence/apply.json
          test "$(jq -r '.archiveClassificationAfter' "$file")" = applied_consistent
          test "$(jq -r '.archiveRowsAfter' "$file")" = 0
          test "$(jq -r '.archiveRlsEnabled' "$file")" = true
          test "$(jq -r '.archivePrivatePrivilegesVerified' "$file")" = true
          test "$(jq -r '.schemaFunctionMutationPerformed' "$file")" = true
          test "$(jq -r '.canonicalHistoryRowMutationPerformed' "$file")" = false
          test "$(jq -r '.terminalTransportBackfillPerformed' "$file")" = false
          test "$(jq -r '.terminalTransportDeletionPerformed' "$file")" = false
          test "$(jq -r '.physicalCompactionPerformed' "$file")" = false
          test "$(jq -r '.vacuumPerformed' "$file")" = false
          test "$(jq -r '.schedulerMutationPerformed' "$file")" = false
          test "$(jq -r '.deploymentPerformed' "$file")" = false
          test "$(jq -r '.publicReaderMutationPerformed' "$file")" = false
          test "$(jq -r '.mainnetDisabled' "$file")" = true
          test "$(jq -r '.r5RearmAuthorized' "$file")" = false

      - name: Upload sanitized Phase A application evidence
        if: always() && steps.auth.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: r5-terminal-archive-phase-a-apply-evidence
          path: r5-terminal-archive-phase-a-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Publish Phase A result
        if: always() && steps.auth.outcome == 'success'
        env:
          SOURCE_COMMIT: ${{ steps.auth.outputs.commit }}
          PREPARE_RUN: ${{ steps.auth.outputs.prepare_run }}
        shell: bash
        run: |
          set -euo pipefail
          verdict=FAIL
          if [ "${{ job.status }}" = success ]; then verdict=PASS; fi
          db_after=unavailable
          if [ -f r5-terminal-archive-phase-a-evidence/apply.json ]; then db_after="$(jq -r '.databaseBytesAfter' r5-terminal-archive-phase-a-evidence/apply.json)"; fi
          cat > /tmp/r5-terminal-archive-result.md <<EOF2
          ## R5 terminal archive Phase A — ${verdict}

          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          Source commit: \`${SOURCE_COMMIT}\`
          Preparation run: \`${PREPARE_RUN}\`
          Database bytes after Phase A: \`${db_after}\`

          PASS means only the exact private archive contract and archive-aware compatibility definitions were installed. Canonical transport/history row counts were unchanged and the archive contained zero rows. Terminal backfill/deletion, physical compaction/VACUUM, scheduler mutation, deployment, public reader changes, Mainnet, stabilization/soak, and R5 rearm were not authorized.
          EOF2
          gh issue comment "$QUALIFICATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/r5-terminal-archive-result.md
