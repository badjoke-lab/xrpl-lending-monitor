name: R5 revision4 minute successor read-only diagnostic

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: r5-revision4-minute-successor-diagnostic
  cancel-in-progress: false

env:
  SUCCESSOR_SQL: ops/production-sql/20260816050000_xrpl_r5_revision4_minute_successor_run_binding.sql
  SUCCESSOR_MANAGER: scripts/manage-r5-revision4-minute-successor.mjs
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

# Read-only diagnostic only. This workflow does not pause or alter the collector,
# apply or register migrations, deploy Edge functions, create/retry recovery runs,
# switch pg_cron, mutate public readers, enable Mainnet, stabilize, or soak.
jobs:
  diagnose:
    if: >-
      github.event.issue.number == 1261 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      github.event.comment.body == '/r5-revision4-minute-successor-diagnose'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Capture successor production state read-only
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p r5-revision4-minute-successor-diagnostic
          source_commit="$(git rev-parse HEAD)"
          sql_sha="$(sha256sum "$SUCCESSOR_SQL" | awk '{print $1}')"

          set +e
          node "$SUCCESSOR_MANAGER" audit \
            --source-commit "$source_commit" \
            --expected-sha "$sql_sha" \
            --output r5-revision4-minute-successor-diagnostic/successor-prestate.json \
            > r5-revision4-minute-successor-diagnostic/successor-prestate.stdout.json \
            2> r5-revision4-minute-successor-diagnostic/successor-prestate.stderr.txt
          printf '%s\n' "$?" > r5-revision4-minute-successor-diagnostic/successor-prestate.exit-code

          node scripts/inspect-r5-revision4-minute-state.mjs \
            r5-revision4-minute-successor-diagnostic/resource-state.json \
            > r5-revision4-minute-successor-diagnostic/resource-state.stdout.txt \
            2> r5-revision4-minute-successor-diagnostic/resource-state.stderr.txt
          printf '%s\n' "$?" > r5-revision4-minute-successor-diagnostic/resource-state.exit-code

          node scripts/verify-r5-revision4-minute-followup.mjs \
            r5-revision4-minute-successor-diagnostic/followup-state.json \
            > r5-revision4-minute-successor-diagnostic/followup-state.stdout.txt \
            2> r5-revision4-minute-successor-diagnostic/followup-state.stderr.txt
          printf '%s\n' "$?" > r5-revision4-minute-successor-diagnostic/followup-state.exit-code
          set -e

          cat > r5-revision4-minute-successor-diagnostic/manifest.json <<EOF
          {
            "schemaVersion": 1,
            "purpose": "r5-revision4-minute-successor-read-only-diagnostic",
            "sourceCommit": "${source_commit}",
            "successorSqlSha256": "${sql_sha}",
            "mutationAuthorized": false,
            "collectorMutationAuthorized": false,
            "migrationMutationAuthorized": false,
            "deploymentMutationAuthorized": false,
            "schedulerMutationAuthorized": false,
            "publicReaderMutationAuthorized": false,
            "mainnetDisabled": true,
            "stabilizationAuthorized": false,
            "soakAuthorized": false
          }
          EOF

      - name: Upload read-only diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r5-revision4-minute-successor-diagnostic
          path: r5-revision4-minute-successor-diagnostic
          if-no-files-found: error
          retention-days: 14
