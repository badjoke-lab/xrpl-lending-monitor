name: P0 one-time continuity diagnostic

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p0-one-time-continuity-diagnostic.yml

permissions:
  contents: read
  issues: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
  GH_TOKEN: ${{ github.token }}
  STATUS_ISSUE: '978'
  FORMAL_OPERATION_START: '2026-07-24T02:40:00Z'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Identify missing slots and ledger continuity
        shell: bash
        run: |
          set -euo pipefail

          query_d1() {
            local sql="$1" output="$2"
            jq -n --arg sql "$sql" '{sql:$sql}' \
              | curl --silent --show-error --retry 3 --retry-all-errors \
                  --connect-timeout 10 --max-time 45 \
                  -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  -H 'Content-Type: application/json' \
                  --data-binary @- \
                  "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query" \
              > "$output"
            jq -e '.success == true and ((.errors // []) | length) == 0' "$output" >/dev/null
          }

          query_d1 "WITH RECURSIVE ranked AS (SELECT run_at,status,lag_ledgers,error_message,start_ledger_index,end_ledger_index,CAST(strftime('%s',run_at)/300 AS INTEGER) AS slot,ROW_NUMBER() OVER (PARTITION BY CAST(strftime('%s',run_at)/300 AS INTEGER) ORDER BY run_at DESC) AS rn FROM fast_lane_shadow_run_metrics WHERE network='devnet' AND run_at >= '${FORMAL_OPERATION_START}'), terminal AS (SELECT * FROM ranked WHERE rn=1), bounds AS (SELECT MIN(slot) AS first_slot,MAX(slot) AS last_slot FROM terminal), seq(slot) AS (SELECT first_slot FROM bounds WHERE first_slot IS NOT NULL UNION ALL SELECT seq.slot+1 FROM seq,bounds WHERE seq.slot<bounds.last_slot) SELECT seq.slot,datetime(seq.slot*300,'unixepoch') AS slot_start_utc FROM seq LEFT JOIN terminal t ON t.slot=seq.slot WHERE t.slot IS NULL ORDER BY seq.slot" missing.json

          query_d1 "WITH ranked AS (SELECT run_at,status,lag_ledgers,error_message,start_ledger_index,end_ledger_index,CAST(strftime('%s',run_at)/300 AS INTEGER) AS slot,ROW_NUMBER() OVER (PARTITION BY CAST(strftime('%s',run_at)/300 AS INTEGER) ORDER BY run_at DESC) AS rn FROM fast_lane_shadow_run_metrics WHERE network='devnet' AND run_at >= '${FORMAL_OPERATION_START}'), terminal AS (SELECT * FROM ranked WHERE rn=1), ordered AS (SELECT slot,run_at,start_ledger_index,end_ledger_index,LAG(slot) OVER (ORDER BY slot) AS previous_slot,LAG(end_ledger_index) OVER (ORDER BY slot) AS previous_end_ledger FROM terminal) SELECT previous_slot,slot,datetime(previous_slot*300,'unixepoch') AS previous_slot_start_utc,datetime(slot*300,'unixepoch') AS slot_start_utc,previous_end_ledger,start_ledger_index,(start_ledger_index-previous_end_ledger-1) AS missing_ledgers FROM ordered WHERE previous_end_ledger IS NOT NULL AND start_ledger_index<>previous_end_ledger+1 ORDER BY slot" ledger-gaps.json

          query_d1 "WITH ranked AS (SELECT run_at,status,lag_ledgers,error_message,start_ledger_index,end_ledger_index,latest_observed_ledger,CAST(strftime('%s',run_at)/300 AS INTEGER) AS slot,ROW_NUMBER() OVER (PARTITION BY CAST(strftime('%s',run_at)/300 AS INTEGER) ORDER BY run_at DESC) AS rn FROM fast_lane_shadow_run_metrics WHERE network='devnet' AND run_at >= '${FORMAL_OPERATION_START}') SELECT slot,datetime(slot*300,'unixepoch') AS slot_start_utc,run_at,status,lag_ledgers,error_message,start_ledger_index,end_ledger_index,latest_observed_ledger FROM ranked WHERE rn=1 ORDER BY slot" terminal.json

          missing="$(jq -c '.result[0].results // []' missing.json)"
          ledger_gaps="$(jq -c '.result[0].results // []' ledger-gaps.json)"
          terminal="$(jq -c '.result[0].results // []' terminal.json)"
          missing_count="$(jq 'length' <<<"$missing")"
          ledger_gap_count="$(jq 'length' <<<"$ledger_gaps")"
          bad_terminal_count="$(jq '[.[] | select(.status != "committed" or (.lag_ledgers // -1) != 0 or .error_message != null)] | length' <<<"$terminal")"
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          jq -n \
            --arg checkedAt "$(date -u +%FT%TZ)" \
            --arg runUrl "$run_url" \
            --arg eventName "$GITHUB_EVENT_NAME" \
            --arg formalOperationStart "$FORMAL_OPERATION_START" \
            --argjson missingSlots "$missing" \
            --argjson ledgerGaps "$ledger_gaps" \
            --argjson missingSlotCount "$missing_count" \
            --argjson ledgerGapCount "$ledger_gap_count" \
            --argjson badTerminalCount "$bad_terminal_count" \
            '{checkedAt:$checkedAt,eventName:$eventName,runUrl:$runUrl,formalOperationStart:$formalOperationStart,missingSlotCount:$missingSlotCount,missingSlots:$missingSlots,ledgerGapCount:$ledgerGapCount,ledgerGaps:$ledgerGaps,badTerminalCount:$badTerminalCount}' > diagnostic.json

          {
            echo '## One-time production continuity diagnostic'
            echo
            echo '```json'
            cat diagnostic.json
            echo '```'
          } > comment.md

          gh issue comment "$STATUS_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file comment.md
