name: P0 one-time continuity diagnostic

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p0-one-time-continuity-diagnostic.yml

permissions:
  contents: read
  issues: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
  GH_TOKEN: ${{ github.token }}
  STATUS_ISSUE: '982'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect suspected ledger coverage gap
        shell: bash
        run: |
          set -euo pipefail

          query_d1() {
            local sql="$1" output="$2"
            jq -n --arg sql "$sql" '{sql:$sql}' \
              | curl --silent --show-error --retry 3 --retry-all-errors \
                  --connect-timeout 10 --max-time 45 \
                  -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  -H 'Content-Type: application/json' \
                  --data-binary @- \
                  "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query" \
              > "$output"
            jq -e '.success == true and ((.errors // []) | length) == 0' "$output" >/dev/null
          }

          query_d1 "SELECT network,run_at,status,start_ledger_index,end_ledger_index,latest_observed_ledger,lag_ledgers,ledgers_processed,persistence_rows_read,persistence_rows_written,error_message FROM fast_lane_shadow_run_metrics WHERE network='devnet' AND run_at >= '2026-07-24T02:50:00Z' AND run_at < '2026-07-24T03:01:00Z' ORDER BY run_at" metrics.json

          query_d1 "SELECT scheduled_time,datetime(scheduled_time/1000,'unixepoch') AS scheduled_at_utc,message_id,status,started_at,completed_at,next_scheduled_time,datetime(next_scheduled_time/1000,'unixepoch') AS next_scheduled_at_utc,error_message,updated_at FROM fast_lane_queue_slots WHERE scheduled_time >= 1784861400000 AND scheduled_time <= 1784862000000 ORDER BY scheduled_time" queue.json

          query_d1 "WITH committed AS (SELECT run_at,start_ledger_index,end_ledger_index,MAX(end_ledger_index) OVER (ORDER BY start_ledger_index,run_at ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING) AS previously_covered_through FROM fast_lane_shadow_run_metrics WHERE network='devnet' AND run_at >= '2026-07-24T02:40:00Z' AND status='committed' AND error_message IS NULL AND start_ledger_index IS NOT NULL AND end_ledger_index IS NOT NULL) SELECT run_at,previously_covered_through,start_ledger_index,end_ledger_index,(start_ledger_index-previously_covered_through-1) AS missing_ledgers FROM committed WHERE previously_covered_through IS NOT NULL AND start_ledger_index>previously_covered_through+1 ORDER BY start_ledger_index" gaps.json

          metrics="$(jq -c '.result[0].results // []' metrics.json)"
          queue="$(jq -c '.result[0].results // []' queue.json)"
          gaps="$(jq -c '.result[0].results // []' gaps.json)"
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          jq -n \
            --arg checkedAt "$(date -u +%FT%TZ)" \
            --arg runUrl "$run_url" \
            --argjson metrics "$metrics" \
            --argjson queue "$queue" \
            --argjson gaps "$gaps" \
            '{checkedAt:$checkedAt,runUrl:$runUrl,suspectedRange:{fromLedger:3898562,toLedger:3898593},metrics:$metrics,queueSlots:$queue,currentCommittedCoverageGaps:$gaps}' > diagnostic.json

          {
            echo '# Suspected ledger coverage gap diagnostic'
            echo
            echo '```json'
            cat diagnostic.json
            echo '```'
          } > issue.md

          gh issue edit "$STATUS_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file issue.md
