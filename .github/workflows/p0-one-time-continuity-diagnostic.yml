name: P0 one-time continuity diagnostic

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p0-one-time-continuity-diagnostic.yml

permissions:
  contents: read
  issues: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
  GH_TOKEN: ${{ github.token }}
  STATUS_ISSUE: '982'
  FORMAL_OPERATION_START: '2026-07-24T02:40:00Z'
  FORMAL_OPERATION_START_MS: '1784860800000'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate watchdog aggregate queries
        shell: bash
        run: |
          set -uo pipefail

          query_d1() {
            local sql="$1" output="$2"
            jq -n --arg sql "$sql" '{sql:$sql}' \
              | curl --silent --show-error --retry 3 --retry-all-errors \
                  --connect-timeout 10 --max-time 45 \
                  -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  -H 'Content-Type: application/json' \
                  --data-binary @- \
                  "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query" \
              > "$output" || printf '{"success":false,"result":[],"errors":[{"message":"transport_failure"}]}' > "$output"
          }

          query_d1 "WITH params AS (SELECT ${FORMAL_OPERATION_START_MS} AS first_ms,CAST((CAST(strftime('%s','now') AS INTEGER)-300)/300 AS INTEGER)*300000 AS expected_last_ms),q AS (SELECT scheduled_time,status,started_at,completed_at,error_message,CAST(strftime('%s',started_at)-scheduled_time/1000 AS INTEGER) AS start_delay_seconds FROM fast_lane_queue_slots,params WHERE scheduled_time BETWEEN params.first_ms AND params.expected_last_ms) SELECT COUNT(*) AS observed_slots,CAST((params.expected_last_ms-params.first_ms)/300000+1 AS INTEGER) AS expected_slots,CAST((params.expected_last_ms-params.first_ms)/300000+1 AS INTEGER)-COUNT(*) AS missing_slots,COALESCE(SUM(CASE WHEN status='completed' THEN 1 ELSE 0 END),0) AS completed_slots,COALESCE(SUM(CASE WHEN status='error' THEN 1 ELSE 0 END),0) AS error_slots,COALESCE(SUM(CASE WHEN status='processing' THEN 1 ELSE 0 END),0) AS processing_slots,COALESCE(SUM(CASE WHEN start_delay_seconds>300 THEN 1 ELSE 0 END),0) AS delayed_over_5m_slots,COALESCE(SUM(CASE WHEN start_delay_seconds>600 THEN 1 ELSE 0 END),0) AS delayed_over_10m_slots,COALESCE(MAX(start_delay_seconds),0) AS max_start_delay_seconds,MIN(scheduled_time) AS first_scheduled_time,MAX(scheduled_time) AS last_scheduled_time,MAX(completed_at) AS latest_completed_at FROM q CROSS JOIN params" queue.json

          query_d1 "WITH windows AS (SELECT start_ledger_index,end_ledger_index,created_at,MAX(end_ledger_index) OVER (ORDER BY start_ledger_index,end_ledger_index,created_at ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING) AS previously_covered_through FROM fast_lane_history_windows WHERE network='devnet' AND created_at>='${FORMAL_OPERATION_START}') SELECT COUNT(*) AS window_count,MIN(start_ledger_index) AS first_ledger,MAX(end_ledger_index) AS last_ledger,COALESCE(SUM(CASE WHEN previously_covered_through IS NOT NULL AND start_ledger_index>previously_covered_through+1 THEN 1 ELSE 0 END),0) AS gap_count,COALESCE(SUM(CASE WHEN previously_covered_through IS NOT NULL AND start_ledger_index>previously_covered_through+1 THEN start_ledger_index-previously_covered_through-1 ELSE 0 END),0) AS missing_ledgers,MIN(created_at) AS first_window_at,MAX(created_at) AS last_window_at FROM windows" coverage.json

          queue="$(cat queue.json)"
          coverage="$(cat coverage.json)"
          jq -n --arg checkedAt "$(date -u +%FT%TZ)" --argjson queue "$queue" --argjson coverage "$coverage" '{checkedAt:$checkedAt,queueQuery:$queue,coverageQuery:$coverage}' > diagnostic.json

          {
            echo '# Watchdog aggregate query validation'
            echo
            echo '```json'
            cat diagnostic.json
            echo '```'
          } > issue.md

          gh issue edit "$STATUS_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file issue.md
