name: P0 one-time continuity diagnostic

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p0-one-time-continuity-diagnostic.yml

permissions:
  contents: read
  issues: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
  GH_TOKEN: ${{ github.token }}
  STATUS_ISSUE: '982'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify persisted metricless ledger range
        shell: bash
        run: |
          set -euo pipefail

          query_d1() {
            local sql="$1" output="$2"
            jq -n --arg sql "$sql" '{sql:$sql}' \
              | curl --silent --show-error --retry 3 --retry-all-errors \
                  --connect-timeout 10 --max-time 45 \
                  -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  -H 'Content-Type: application/json' \
                  --data-binary @- \
                  "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query" \
              > "$output"
            jq -e '.success == true and ((.errors // []) | length) == 0' "$output" >/dev/null
          }

          query_d1 "SELECT network,epoch_id,start_ledger_index,end_ledger_index,end_ledger_hash,created_at,length(bundle_json) AS bundle_bytes FROM fast_lane_history_windows WHERE network='devnet' AND start_ledger_index=3898562 AND end_ledger_index=3898593" history-window.json

          query_d1 "SELECT network,epoch_id,start_ledger_index,end_ledger_index,end_ledger_hash,inspected_transaction_count,lending_transaction_count,successful_lending_transaction_count,affected_object_count,created_at,length(activity_bundle_json) AS activity_bundle_bytes FROM fast_lane_shadow_windows WHERE network='devnet' AND start_ledger_index=3898562 AND end_ledger_index=3898593" shadow-window.json

          query_d1 "SELECT epoch_id,last_processed_ledger,last_processed_hash,latest_observed_ledger,latest_observed_hash,status,updated_at FROM fast_lane_shadow_state WHERE network='devnet'" state.json

          history_window="$(jq -c '.result[0].results // []' history-window.json)"
          shadow_window="$(jq -c '.result[0].results // []' shadow-window.json)"
          state="$(jq -c '.result[0].results[0] // {}' state.json)"
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          jq -n \
            --arg checkedAt "$(date -u +%FT%TZ)" \
            --arg runUrl "$run_url" \
            --argjson historyWindow "$history_window" \
            --argjson shadowWindow "$shadow_window" \
            --argjson state "$state" \
            '{checkedAt:$checkedAt,runUrl:$runUrl,verifiedRange:{startLedger:3898562,endLedger:3898593},historyWindow:$historyWindow,shadowWindow:$shadowWindow,currentState:$state,persisted:((($historyWindow|length)==1) and (($shadowWindow|length)==1))}' > diagnostic.json

          {
            echo '# Metricless ledger range persistence verification'
            echo
            echo '```json'
            cat diagnostic.json
            echo '```'
          } > issue.md

          gh issue edit "$STATUS_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file issue.md
