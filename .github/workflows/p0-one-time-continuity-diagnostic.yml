name: P0 one-time continuity diagnostic

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p0-one-time-continuity-diagnostic.yml

permissions:
  contents: read
  issues: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
  GH_TOKEN: ${{ github.token }}
  STATUS_ISSUE: '978'
  FORMAL_OPERATION_START: '2026-07-24T02:40:00Z'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Identify scheduler gaps and true ledger coverage
        shell: bash
        run: |
          set -euo pipefail

          query_d1() {
            local sql="$1" output="$2"
            jq -n --arg sql "$sql" '{sql:$sql}' \
              | curl --silent --show-error --retry 3 --retry-all-errors \
                  --connect-timeout 10 --max-time 45 \
                  -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  -H 'Content-Type: application/json' \
                  --data-binary @- \
                  "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query" \
              > "$output"
            jq -e '.success == true and ((.errors // []) | length) == 0' "$output" >/dev/null
          }

          query_d1 "WITH RECURSIVE ranked AS (SELECT run_at,status,lag_ledgers,error_message,start_ledger_index,end_ledger_index,CAST(strftime('%s',run_at)/300 AS INTEGER) AS slot,ROW_NUMBER() OVER (PARTITION BY CAST(strftime('%s',run_at)/300 AS INTEGER) ORDER BY run_at DESC) AS rn FROM fast_lane_shadow_run_metrics WHERE network='devnet' AND run_at >= '${FORMAL_OPERATION_START}'), terminal AS (SELECT * FROM ranked WHERE rn=1), bounds AS (SELECT MIN(slot) AS first_slot,MAX(slot) AS last_slot FROM terminal), seq(slot) AS (SELECT first_slot FROM bounds WHERE first_slot IS NOT NULL UNION ALL SELECT seq.slot+1 FROM seq,bounds WHERE seq.slot<bounds.last_slot) SELECT seq.slot,datetime(seq.slot*300,'unixepoch') AS slot_start_utc FROM seq LEFT JOIN terminal t ON t.slot=seq.slot WHERE t.slot IS NULL ORDER BY seq.slot" missing.json

          query_d1 "WITH committed AS (SELECT run_at,start_ledger_index,end_ledger_index,MAX(end_ledger_index) OVER (ORDER BY start_ledger_index,run_at ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING) AS previously_covered_through FROM fast_lane_shadow_run_metrics WHERE network='devnet' AND run_at >= '${FORMAL_OPERATION_START}' AND status='committed' AND error_message IS NULL AND start_ledger_index IS NOT NULL AND end_ledger_index IS NOT NULL) SELECT run_at,previously_covered_through,start_ledger_index,end_ledger_index,(start_ledger_index-previously_covered_through-1) AS missing_ledgers FROM committed WHERE previously_covered_through IS NOT NULL AND start_ledger_index>previously_covered_through+1 ORDER BY start_ledger_index" true-ledger-gaps.json

          query_d1 "SELECT scheduled_time,datetime(scheduled_time/1000,'unixepoch') AS scheduled_at_utc,message_id,status,started_at,completed_at,next_scheduled_time,datetime(next_scheduled_time/1000,'unixepoch') AS next_scheduled_at_utc,error_message,updated_at FROM fast_lane_queue_slots WHERE scheduled_time IN (1784864100000,1784865600000,1784865900000) ORDER BY scheduled_time" queue.json

          query_d1 "WITH ranked AS (SELECT run_at,status,lag_ledgers,error_message,start_ledger_index,end_ledger_index,latest_observed_ledger,CAST(strftime('%s',run_at)/300 AS INTEGER) AS slot,ROW_NUMBER() OVER (PARTITION BY CAST(strftime('%s',run_at)/300 AS INTEGER) ORDER BY run_at DESC) AS rn FROM fast_lane_shadow_run_metrics WHERE network='devnet' AND run_at >= '${FORMAL_OPERATION_START}') SELECT slot,datetime(slot*300,'unixepoch') AS slot_start_utc,run_at,status,lag_ledgers,error_message,start_ledger_index,end_ledger_index,latest_observed_ledger FROM ranked WHERE rn=1 ORDER BY slot" terminal.json

          missing="$(jq -c '.result[0].results // []' missing.json)"
          true_ledger_gaps="$(jq -c '.result[0].results // []' true-ledger-gaps.json)"
          queue_slots="$(jq -c '.result[0].results // []' queue.json)"
          terminal="$(jq -c '.result[0].results // []' terminal.json)"
          missing_count="$(jq 'length' <<<"$missing")"
          true_ledger_gap_count="$(jq 'length' <<<"$true_ledger_gaps")"
          bad_terminal_count="$(jq '[.[] | select(.status != "committed" or (.lag_ledgers // -1) != 0 or .error_message != null)] | length' <<<"$terminal")"
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          jq -n \
            --arg checkedAt "$(date -u +%FT%TZ)" \
            --arg runUrl "$run_url" \
            --arg eventName "$GITHUB_EVENT_NAME" \
            --arg formalOperationStart "$FORMAL_OPERATION_START" \
            --argjson missingSlots "$missing" \
            --argjson trueLedgerGaps "$true_ledger_gaps" \
            --argjson queueSlots "$queue_slots" \
            --argjson missingSlotCount "$missing_count" \
            --argjson trueLedgerGapCount "$true_ledger_gap_count" \
            --argjson badTerminalCount "$bad_terminal_count" \
            '{checkedAt:$checkedAt,eventName:$eventName,runUrl:$runUrl,formalOperationStart:$formalOperationStart,missingSlotCount:$missingSlotCount,missingSlots:$missingSlots,trueLedgerGapCount:$trueLedgerGapCount,trueLedgerGaps:$trueLedgerGaps,missingSlotQueueRecords:$queueSlots,badTerminalCount:$badTerminalCount}' > diagnostic.json

          {
            echo '## Corrected one-time production continuity diagnostic'
            echo
            echo 'The ledger-gap calculation below uses every committed collector pass, not only the terminal pass in each five-minute slot.'
            echo
            echo '```json'
            cat diagnostic.json
            echo '```'
          } > comment.md

          gh issue comment "$STATUS_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file comment.md
