name: Checkpoint orphan audit 20260725

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/xrpl-lending-recovery-trigger-pr
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checkpoint-orphan-audit-20260725
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
  VAULT_ID: EE61076DFD544A725F7C7FB67908CFFF7E2B2BD78ECD23285F50E762A5D47143
  BROKER_ID: 3004F471F1E1730C19367DE075D7CEA26225809D07578196107ABDAB1AD65F8E

jobs:
  audit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query production D1 and XRPL Devnet
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          query_d1() {
            local sql="$1" output="$2" payload
            payload="$(mktemp)"
            jq -n --arg sql "$sql" '{sql:$sql}' > "$payload"
            curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 60 \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' --data-binary @"$payload" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query" > "$output"
            jq -e '.success==true and .result[0].success==true' "$output" >/dev/null
          }
          query_d1 "SELECT * FROM current_state_overlay_objects WHERE network='devnet' AND object_id IN ('${VAULT_ID}','${BROKER_ID}') ORDER BY object_id" audit/overlay.json
          query_d1 "SELECT * FROM fast_lane_shadow_objects_compact WHERE network='devnet' AND object_id IN ('${VAULT_ID}','${BROKER_ID}') ORDER BY object_id" audit/compact.json
          query_d1 "SELECT object_type,object_id,deletion_ledger_index,deletion_ledger_hash,transaction_hash,vault_id,loan_broker_id FROM archived_objects WHERE network='devnet' AND object_id IN ('${VAULT_ID}','${BROKER_ID}') ORDER BY deletion_ledger_index" audit/archive.json
          query_d1 "SELECT id,epoch_id,ledger_index,ledger_hash,status,completed_at FROM current_state_d1_snapshots ORDER BY completed_at DESC LIMIT 5" audit/d1-snapshots.json
          query_d1 "SELECT snapshot_id,object_id,projection_json FROM current_state_d1_vaults WHERE object_id='${VAULT_ID}' ORDER BY snapshot_id" audit/d1-vault.json
          query_d1 "SELECT snapshot_id,object_id,vault_id,projection_json FROM current_state_d1_loan_brokers WHERE object_id='${BROKER_ID}' ORDER BY snapshot_id" audit/d1-broker.json

          rpc() {
            local endpoint="$1" ledger="$2" id="$3" output="$4"
            jq -n --arg ledger "$ledger" --arg index "$id" '{method:"ledger_entry",params:[{index:$index,ledger_index:(if $ledger=="validated" then $ledger else ($ledger|tonumber) end)}]}' > request.json
            curl --silent --show-error --connect-timeout 10 --max-time 30 \
              -H 'Content-Type: application/json' --data-binary @request.json "$endpoint" > "$output" || true
          }
          for endpoint_name in primary fallback; do
            if [ "$endpoint_name" = primary ]; then endpoint='https://devnet.honeycluster.io/'; else endpoint='https://s.devnet.rippletest.net:51234/'; fi
            rpc "$endpoint" validated "$VAULT_ID" "audit/${endpoint_name}-vault-validated.json"
            rpc "$endpoint" 3861543 "$VAULT_ID" "audit/${endpoint_name}-vault-3861543.json"
            rpc "$endpoint" validated "$BROKER_ID" "audit/${endpoint_name}-broker-validated.json"
            rpc "$endpoint" 3861543 "$BROKER_ID" "audit/${endpoint_name}-broker-3861543.json"
          done
          jq -n \
            --arg checkedAt "$(date -u +%FT%TZ)" \
            --arg vaultId "$VAULT_ID" \
            --arg brokerId "$BROKER_ID" \
            '{checkedAt:$checkedAt,vaultId:$vaultId,brokerId:$brokerId}' > audit/manifest.json

      - name: Upload orphan audit
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-orphan-audit-20260725
          path: audit
          if-no-files-found: error
          retention-days: 30
