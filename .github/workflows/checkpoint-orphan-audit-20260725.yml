name: Checkpoint orphan audit 20260725

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/xrpl-lending-recovery-trigger-pr
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checkpoint-orphan-audit-20260725
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
  VAULT_ID: EE61076DFD544A725F7C7FB67908CFFF7E2B2BD78ECD23285F50E762A5D47143
  BROKER_ID: 3004F471F1E1730C19367DE075D7CEA26225809D07578196107ABDAB1AD65F8E

jobs:
  audit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query production D1 and XRPL Devnet
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          query_d1() {
            local name="$1" sql="$2" payload="audit/${name}.request.json" output="audit/${name}.json" code
            jq -n --arg sql "$sql" '{sql:$sql}' > "$payload"
            code="$(curl --silent --show-error --connect-timeout 10 --max-time 60 \
              -o "$output" -w '%{http_code}' \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' --data-binary @"$payload" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query" || true)"
            jq -n --arg name "$name" --arg code "$code" --arg sql "$sql" \
              --argjson success "$(jq -r '(.success==true and .result[0].success==true)' "$output" 2>/dev/null || echo false)" \
              '{name:$name,httpCode:$code,success:$success,sql:$sql}' > "audit/${name}.meta.json"
          }

          query_d1 schema "SELECT name,type,sql FROM sqlite_master WHERE type IN ('table','view') AND (name LIKE '%current_state%' OR name LIKE '%archive%' OR name LIKE '%fast_lane%') ORDER BY name"
          query_d1 overlay "SELECT object_type,object_id,operation,projection_json,source_ledger_index,source_ledger_hash,source_transaction_hash,source_transaction_index,epoch_id,base_snapshot_id FROM current_state_overlay_objects WHERE network='devnet' AND object_id IN ('${VAULT_ID}','${BROKER_ID}') ORDER BY object_id"
          query_d1 compact "SELECT * FROM fast_lane_shadow_objects_compact WHERE network='devnet' AND object_id IN ('${VAULT_ID}','${BROKER_ID}') ORDER BY object_id"
          query_d1 archive-object "SELECT * FROM archived_objects WHERE network='devnet' AND object_id IN ('${VAULT_ID}','${BROKER_ID}') ORDER BY object_id"
          query_d1 archive-projection "SELECT * FROM archived_object_projections WHERE network='devnet' AND object_id IN ('${VAULT_ID}','${BROKER_ID}') ORDER BY object_id"
          query_d1 d1-snapshots "SELECT * FROM current_state_d1_snapshots ORDER BY rowid DESC LIMIT 5"
          query_d1 d1-vault "SELECT * FROM current_state_d1_vaults WHERE object_id='${VAULT_ID}' ORDER BY rowid"
          query_d1 d1-broker "SELECT * FROM current_state_d1_loan_brokers WHERE object_id='${BROKER_ID}' ORDER BY rowid"

          rpc() {
            local endpoint="$1" ledger="$2" id="$3" output="$4"
            jq -n --arg ledger "$ledger" --arg index "$id" '{method:"ledger_entry",params:[{index:$index,ledger_index:(if $ledger=="validated" then $ledger else ($ledger|tonumber) end)}]}' > request.json
            curl --silent --show-error --connect-timeout 10 --max-time 30 \
              -H 'Content-Type: application/json' --data-binary @request.json "$endpoint" > "$output" || true
          }
          for endpoint_name in primary fallback; do
            if [ "$endpoint_name" = primary ]; then endpoint='https://devnet.honeycluster.io/'; else endpoint='https://s.devnet.rippletest.net:51234/'; fi
            rpc "$endpoint" validated "$VAULT_ID" "audit/${endpoint_name}-vault-validated.json"
            rpc "$endpoint" 3861543 "$VAULT_ID" "audit/${endpoint_name}-vault-3861543.json"
            rpc "$endpoint" validated "$BROKER_ID" "audit/${endpoint_name}-broker-validated.json"
            rpc "$endpoint" 3861543 "$BROKER_ID" "audit/${endpoint_name}-broker-3861543.json"
          done
          jq -n \
            --arg checkedAt "$(date -u +%FT%TZ)" \
            --arg vaultId "$VAULT_ID" \
            --arg brokerId "$BROKER_ID" \
            '{checkedAt:$checkedAt,vaultId:$vaultId,brokerId:$brokerId}' > audit/manifest.json

      - name: Upload orphan audit
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-orphan-audit-20260725
          path: audit
          if-no-files-found: error
          retention-days: 30
