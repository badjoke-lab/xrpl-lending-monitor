name: P0 direct fast patch Windows

on:
  push:
    branches: [main]
    paths:
      - .github/p0-direct-fast-patch-windows-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bounded fast recovery patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $encoded = ''
          $script = [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($encoded))
          $script | python -
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/rolling-checkpoint-candidate.yml .github/workflows/p0-history-recovery.yml
          if (git diff --cached --quiet) { exit 0 }
          git commit -m 'fix: enable bounded P0 fast recovery'
          git pull --rebase origin main
          git push origin HEAD:main
