name: XRPL.to shadow provider build validation

on:
  push:
    branches:
      - research/xrplto-shadow-provider-20261007
    paths:
      - '.github/workflows/xrplto-shadow-provider-build-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Build
        run: pnpm build
