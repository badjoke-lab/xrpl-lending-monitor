name: P0 ledger_data type probe

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  probe:
    if: startsWith(github.event.issue.title, 'P0 ledger_data type probe')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ENDPOINT: https://s.devnet.rippletest.net:51234
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          rpc() {
            curl --fail-with-body --silent --show-error \
              -H 'Content-Type: application/json' \
              --data-binary "$1" "$ENDPOINT"
          }
          HEAD=$(rpc '{"jsonrpc":"2.0","id":1,"method":"ledger","params":[{"ledger_index":"validated","transactions":false,"expand":false}]}')
          HASH=$(jq -r '.result.ledger_hash' <<<"$HEAD")
          INDEX=$(jq -r '.result.ledger_index' <<<"$HEAD")
          jq -n --arg hash "$HASH" --argjson index "$INDEX" '{ledger_hash:$hash,ledger_index:$index,types:[]}' > /tmp/result.json
          for TYPE in Vault LoanBroker Loan; do
            PAYLOAD=$(jq -nc --arg hash "$HASH" --arg type "$TYPE" '{jsonrpc:"2.0",id:1,method:"ledger_data",params:[{ledger_hash:$hash,binary:true,type:$type,limit:2048}]}')
            RESPONSE=$(rpc "$PAYLOAD")
            jq -e '.result.status != "error" and .error == null' <<<"$RESPONSE" >/dev/null
            COUNT=$(jq '.result.state | length' <<<"$RESPONSE")
            HAS_MARKER=$(jq '.result.marker != null' <<<"$RESPONSE")
            jq --arg type "$TYPE" --argjson count "$COUNT" --argjson has_marker "$HAS_MARKER" '.types += [{type:$type,count:$count,has_marker:$has_marker}]' /tmp/result.json > /tmp/next.json
            mv /tmp/next.json /tmp/result.json
          done
          {
            echo 'ledger_data type filter probe:'
            echo
            echo '```json'
            jq . /tmp/result.json
            echo '```'
          } > /tmp/comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body-file /tmp/comment.md
