name: Canonical history Stage B1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/canonical-history-stage-b1.yml'
      - 'docs/evidence/canonical-history-backfill-plan-3371676-3432924.json'
      - 'scripts/run-history-segment.ts'
      - 'scripts/update-history-segment-checkpoint.ts'
      - 'scripts/verify-history-segment-chain.ts'
      - 'scripts/build-history-segment-publication.ts'
      - 'scripts/build-history-exact-index.ts'
      - 'src/collector/history-segments/**'
      - 'src/collector/incremental/**'
      - 'src/shared/history-segments/**'
      - 'src/shared/current-state/**'
      - 'package.json'

permissions:
  contents: read

jobs:
  stage-b1:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build history tools
        run: |
          pnpm history-segment:build
          pnpm history-segment-checkpoint:build
          pnpm history-segment-chain:build
          pnpm history-segment-publication:build
          pnpm history-exact-index:build

      - name: Generate canonical Stage B1 segments
        shell: bash
        run: |
          set -euo pipefail
          PLAN=docs/evidence/canonical-history-backfill-plan-3371676-3432924.json
          ROOT=.local/canonical-stage-b1
          EPOCH=devnet-3371675
          CHECKPOINT="$ROOT/checkpoint.json"
          METRICS="$ROOT/segment-metrics.ndjson"
          ANCHOR_ID=devnet-3371675-3376176-3376675
          ANCHOR_HASH=4FBAE14F2EB86369228F8C58D7DADC4A334CC05DED7C2C20667FA8C9B90F6463
          mkdir -p "$ROOT/history/$EPOCH"
          : > "$METRICS"

          PREV_ID="$ANCHOR_ID"
          PREV_HASH="$ANCHOR_HASH"
          for ORDINAL in $(seq 11 20); do
            SEGMENT=$(jq -c --argjson ordinal "$ORDINAL" '.segments[] | select(.ordinal == $ordinal)' "$PLAN")
            SEGMENT_ID=$(jq -r '.segmentId' <<<"$SEGMENT")
            START=$(jq -r '.startLedgerIndex' <<<"$SEGMENT")
            END=$(jq -r '.endLedgerIndex' <<<"$SEGMENT")
            OUT="$ROOT/history/$EPOCH/$SEGMENT_ID"

            STARTED=$(date +%s)
            PASSED=false
            ATTEMPTS=0
            for ATTEMPT in 1 2 3; do
              ATTEMPTS=$ATTEMPT
              if node .history-segment-build/run-history-segment.mjs \
                --local \
                --timeout-ms 12000 \
                --start-ledger "$START" \
                --end-ledger "$END" \
                --epoch-id "$EPOCH" \
                --segment-id "$SEGMENT_ID" \
                --output-dir "$OUT" \
                --source-revision "$GITHUB_SHA" \
                --previous-segment-id "$PREV_ID" \
                --previous-segment-end-hash "$PREV_HASH" \
                > "$ROOT/segment-$ORDINAL-manifest-output.json"; then
                PASSED=true
                break
              fi
              sleep $((ATTEMPT * 10))
            done
            if [[ "$PASSED" != true ]]; then
              echo "Stage B1 segment $ORDINAL failed after $ATTEMPTS attempts" >&2
              exit 1
            fi
            ELAPSED=$(( $(date +%s) - STARTED ))

            node .history-segment-checkpoint-build/update-history-segment-checkpoint.mjs \
              --local \
              --checkpoint "$CHECKPOINT" \
              --manifest "$OUT/manifest.json" \
              --epoch-id "$EPOCH" \
              --range-start-ledger 3376676 \
              --range-end-ledger 3381675 \
              --previous-segment-id "$ANCHOR_ID" \
              --previous-segment-end-hash "$ANCHOR_HASH" \
              > "$ROOT/checkpoint-$ORDINAL-output.json"

            SEGMENT_BYTES=$(du -sb "$OUT" | cut -f1)
            TOTAL_RECORDS=$(jq '[.files[].records] | add' "$OUT/manifest.json")
            jq -nc \
              --argjson ordinal "$ORDINAL" \
              --arg segmentId "$SEGMENT_ID" \
              --argjson startLedgerIndex "$START" \
              --argjson endLedgerIndex "$END" \
              --argjson attempts "$ATTEMPTS" \
              --argjson elapsedSeconds "$ELAPSED" \
              --argjson artifactBytes "$SEGMENT_BYTES" \
              --argjson totalRecords "$TOTAL_RECORDS" \
              '{ordinal:$ordinal,segmentId:$segmentId,startLedgerIndex:$startLedgerIndex,endLedgerIndex:$endLedgerIndex,attempts:$attempts,elapsedSeconds:$elapsedSeconds,artifactBytes:$artifactBytes,totalRecords:$totalRecords}' \
              >> "$METRICS"

            PREV_ID="$SEGMENT_ID"
            PREV_HASH=$(jq -r '.endLedgerHash' "$OUT/manifest.json")
          done

          jq -e '.nextLedgerIndex == 3381676 and (.completedSegments | length) == 10' "$CHECKPOINT" > /dev/null
          jq -s '.' "$METRICS" > "$ROOT/segment-metrics.json"

      - name: Verify Stage B1 chain
        shell: bash
        run: |
          set -euo pipefail
          PLAN=docs/evidence/canonical-history-backfill-plan-3371676-3432924.json
          ROOT=.local/canonical-stage-b1
          EPOCH=devnet-3371675
          ANCHOR_ID=devnet-3371675-3376176-3376675
          ANCHOR_HASH=4FBAE14F2EB86369228F8C58D7DADC4A334CC05DED7C2C20667FA8C9B90F6463
          MANIFEST_ARGS=()
          LAST_MANIFEST=''
          for ORDINAL in $(seq 11 20); do
            SEGMENT_ID=$(jq -r --argjson ordinal "$ORDINAL" '.segments[] | select(.ordinal == $ordinal) | .segmentId' "$PLAN")
            MANIFEST="$ROOT/history/$EPOCH/$SEGMENT_ID/manifest.json"
            MANIFEST_ARGS+=(--manifest "$MANIFEST")
            LAST_MANIFEST="$MANIFEST"
          done
          TERMINAL_HASH=$(jq -r '.endLedgerHash' "$LAST_MANIFEST")
          node .history-segment-chain-build/verify-history-segment-chain.mjs \
            --local \
            "${MANIFEST_ARGS[@]}" \
            --epoch-id "$EPOCH" \
            --start-ledger 3376676 \
            --start-parent-hash "$ANCHOR_HASH" \
            --previous-segment-id "$ANCHOR_ID" \
            --previous-segment-end-hash "$ANCHOR_HASH" \
            --end-ledger 3381675 \
            --end-ledger-hash "$TERMINAL_HASH" \
            > "$ROOT/stage-b1-chain-summary.json"

      - name: Build Stage B1 publication and exact index
        shell: bash
        run: |
          set -euo pipefail
          PLAN=docs/evidence/canonical-history-backfill-plan-3371676-3432924.json
          ROOT=.local/canonical-stage-b1
          EPOCH=devnet-3371675
          MANIFEST_ARGS=()
          for ORDINAL in $(seq 11 20); do
            SEGMENT_ID=$(jq -r --argjson ordinal "$ORDINAL" '.segments[] | select(.ordinal == $ordinal) | .segmentId' "$PLAN")
            MANIFEST_ARGS+=(--manifest "$ROOT/history/$EPOCH/$SEGMENT_ID/manifest.json")
          done
          node .history-segment-publication-build/build-history-segment-publication.mjs \
            --local \
            "${MANIFEST_ARGS[@]}" \
            --chain-id canonical-stage-b1-3376676-3381675 \
            --epoch-id "$EPOCH" \
            --source-revision "$GITHUB_SHA" \
            --output "$ROOT/history/publication.json" \
            > "$ROOT/publication-output.json"

          STARTED=$(date +%s)
          node .history-exact-index-build/build-history-exact-index.mjs \
            --local \
            --publication "$ROOT/history/publication.json" \
            --artifact-root "$ROOT" \
            --output-dir "$ROOT/history/index/exact" \
            --asset-prefix history/index/exact \
            --bucket-count 1024 \
            --source-revision "$GITHUB_SHA" \
            > "$ROOT/exact-index-output.json"
          echo $(( $(date +%s) - STARTED )) > "$ROOT/exact-index-elapsed-seconds.txt"

      - name: Build Stage B1 measurement summary
        shell: bash
        run: |
          set -euo pipefail
          ROOT=.local/canonical-stage-b1
          INDEX="$ROOT/history/index/exact/manifest.json"
          PUBLICATION="$ROOT/history/publication.json"
          CHECKPOINT="$ROOT/checkpoint.json"
          EXACT_SECONDS=$(cat "$ROOT/exact-index-elapsed-seconds.txt")
          ARTIFACT_BYTES=$(du -sb "$ROOT" | cut -f1)
          jq -n \
            --arg publicationSha256 "$(jq -r '.publicationSha256' "$PUBLICATION")" \
            --arg exactIndexManifestSha256 "$(jq -r '.manifestSha256' "$INDEX")" \
            --arg terminalLedgerHash "$(jq -r '.endLedgerHash' "$PUBLICATION")" \
            --argjson checkpointNextLedgerIndex "$(jq -r '.nextLedgerIndex' "$CHECKPOINT")" \
            --argjson exactIndexRecords "$(jq -r '.totalRecords' "$INDEX")" \
            --argjson exactIndexCompressedBytes "$(jq '[.assets[].compressedBytes] | add' "$INDEX")" \
            --argjson maxBucketCompressedBytes "$(jq '[.assets[].compressedBytes] | max' "$INDEX")" \
            --argjson maxBucketRecords "$(jq '[.assets[].recordCount] | max' "$INDEX")" \
            --argjson exactIndexElapsedSeconds "$EXACT_SECONDS" \
            --argjson artifactBytes "$ARTIFACT_BYTES" \
            --slurpfile segmentMetrics "$ROOT/segment-metrics.json" \
            '{schemaVersion:1,passed:true,stageStartLedgerIndex:3376676,stageEndLedgerIndex:3381675,ledgerCount:5000,segmentCount:10,checkpointNextLedgerIndex:$checkpointNextLedgerIndex,publicationSha256:$publicationSha256,terminalLedgerHash:$terminalLedgerHash,exactIndexManifestSha256:$exactIndexManifestSha256,exactIndexBucketCount:1024,exactIndexRecords:$exactIndexRecords,exactIndexCompressedBytes:$exactIndexCompressedBytes,maxBucketCompressedBytes:$maxBucketCompressedBytes,maxBucketRecords:$maxBucketRecords,exactIndexElapsedSeconds:$exactIndexElapsedSeconds,artifactBytes:$artifactBytes,segmentMetrics:$segmentMetrics[0]}' \
            > "$ROOT/stage-b1-measurement-summary.json"
          cat "$ROOT/stage-b1-measurement-summary.json"

      - name: Upload Stage B1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-history-stage-b1
          path: .local/canonical-stage-b1
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
