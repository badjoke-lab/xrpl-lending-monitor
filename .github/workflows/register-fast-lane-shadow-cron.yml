name: Register fast lane shadow cron

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/register-fast-lane-shadow-cron.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

concurrency:
  group: register-fast-lane-shadow-cron
  cancel-in-progress: true

jobs:
  register-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - run: mkdir -p fast-lane-cron-registration-evidence

      - name: Register exact five-minute schedule through Cloudflare API
        run: |
          curl --fail-with-body --silent --show-error \
            -X PUT \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-fast-lane-shadow/schedules" \
            -d '[{"cron":"*/5 * * * *"}]' \
            > fast-lane-cron-registration-evidence/register.json
          cat fast-lane-cron-registration-evidence/register.json
          jq -e '.success == true and (.result.schedules | any(.cron == "*/5 * * * *"))' \
            fast-lane-cron-registration-evidence/register.json > /dev/null

      - name: Confirm registered schedule through read API
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-fast-lane-shadow/schedules" \
            > fast-lane-cron-registration-evidence/schedules.json
          cat fast-lane-cron-registration-evidence/schedules.json
          jq -e '.success == true and (.result.schedules | any(.cron == "*/5 * * * *"))' \
            fast-lane-cron-registration-evidence/schedules.json > /dev/null

      - name: Resolve Worker URL
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            > fast-lane-cron-registration-evidence/subdomain.json
          SUBDOMAIN="$(jq -r '.result.subdomain // empty' fast-lane-cron-registration-evidence/subdomain.json)"
          test -n "${SUBDOMAIN}"
          printf '%s\n' "https://xrpl-lending-fast-lane-shadow.${SUBDOMAIN}.workers.dev" \
            > fast-lane-cron-registration-evidence/base-url.txt

      - name: Wait for first scheduled state
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(cat fast-lane-cron-registration-evidence/base-url.txt)"
          for ATTEMPT in $(seq 1 24); do
            curl --fail-with-body --silent --show-error \
              "${BASE}/status" > fast-lane-cron-registration-evidence/status-latest.json
            LAST_LEDGER="$(jq -r '.state.last_processed_ledger // 0' fast-lane-cron-registration-evidence/status-latest.json)"
            UPDATED_AT="$(jq -r '.state.updated_at // empty' fast-lane-cron-registration-evidence/status-latest.json)"
            if [ "${LAST_LEDGER}" -gt 0 ] && [ -n "${UPDATED_AT}" ]; then
              cp fast-lane-cron-registration-evidence/status-latest.json \
                fast-lane-cron-registration-evidence/status-first.json
              break
            fi
            sleep 30
          done
          test -f fast-lane-cron-registration-evidence/status-first.json

      - name: Wait for second scheduled cursor advance
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(cat fast-lane-cron-registration-evidence/base-url.txt)"
          FIRST_LEDGER="$(jq -r '.state.last_processed_ledger' fast-lane-cron-registration-evidence/status-first.json)"
          FIRST_UPDATED="$(jq -r '.state.updated_at' fast-lane-cron-registration-evidence/status-first.json)"
          FIRST_MS="$(node -e 'process.stdout.write(String(Date.parse(process.argv[1])))' "${FIRST_UPDATED}")"

          for ATTEMPT in $(seq 1 24); do
            sleep 30
            curl --fail-with-body --silent --show-error \
              "${BASE}/status" > fast-lane-cron-registration-evidence/status-latest.json
            LAST_LEDGER="$(jq -r '.state.last_processed_ledger // 0' fast-lane-cron-registration-evidence/status-latest.json)"
            UPDATED_AT="$(jq -r '.state.updated_at // empty' fast-lane-cron-registration-evidence/status-latest.json)"
            UPDATED_MS="$(node -e 'const v=Date.parse(process.argv[1]||""); process.stdout.write(Number.isFinite(v)?String(v):"0")' "${UPDATED_AT}")"
            if [ "${LAST_LEDGER}" -gt "${FIRST_LEDGER}" ] && [ "${UPDATED_MS}" -gt "${FIRST_MS}" ]; then
              cp fast-lane-cron-registration-evidence/status-latest.json \
                fast-lane-cron-registration-evidence/status-second.json
              break
            fi
          done
          test -f fast-lane-cron-registration-evidence/status-second.json

      - name: Build retained registration summary
        shell: bash
        run: |
          set -euo pipefail
          FIRST_LEDGER="$(jq -r '.state.last_processed_ledger' fast-lane-cron-registration-evidence/status-first.json)"
          SECOND_LEDGER="$(jq -r '.state.last_processed_ledger' fast-lane-cron-registration-evidence/status-second.json)"
          FIRST_UPDATED="$(jq -r '.state.updated_at' fast-lane-cron-registration-evidence/status-first.json)"
          SECOND_UPDATED="$(jq -r '.state.updated_at' fast-lane-cron-registration-evidence/status-second.json)"
          GAP_SECONDS="$(node -e 'process.stdout.write(String((Date.parse(process.argv[2])-Date.parse(process.argv[1]))/1000))' "${FIRST_UPDATED}" "${SECOND_UPDATED}")"
          jq -n \
            --arg cron '*/5 * * * *' \
            --argjson first_ledger "${FIRST_LEDGER}" \
            --argjson second_ledger "${SECOND_LEDGER}" \
            --arg first_updated_at "${FIRST_UPDATED}" \
            --arg second_updated_at "${SECOND_UPDATED}" \
            --argjson observed_gap_seconds "${GAP_SECONDS}" \
            '{schemaVersion:1,passed:true,cron:$cron,first_ledger:$first_ledger,second_ledger:$second_ledger,ledger_advance:($second_ledger-$first_ledger),first_updated_at:$first_updated_at,second_updated_at:$second_updated_at,observed_gap_seconds:$observed_gap_seconds}' \
            > fast-lane-cron-registration-evidence/summary.json
          cat fast-lane-cron-registration-evidence/summary.json

      - name: Upload retained registration evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fast-lane-cron-registration-evidence
          path: fast-lane-cron-registration-evidence
          if-no-files-found: warn
          retention-days: 14
