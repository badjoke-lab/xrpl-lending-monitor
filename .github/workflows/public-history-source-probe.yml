name: Public history source probe

on:
  pull_request:
    paths:
      - src/shared/history-segments/public-source-probe.test.ts
      - .github/workflows/public-history-source-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Open configured public history source
        run: pnpm exec vitest run src/shared/history-segments/public-source-probe.test.ts --reporter=verbose
