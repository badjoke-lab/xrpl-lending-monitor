name: Public history source probe

on:
  pull_request:
    paths:
      - src/shared/history-segments/public-source-probe.test.ts
      - .github/workflows/public-history-source-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Probe production public history endpoints
        shell: bash
        run: |
          set -u
          B="https://xrpl-lending-monitor.badjoke-lab.workers.dev"
          for path in \
            "/api/status/history-source" \
            "/api/activity?limit=1" \
            "/api/audit/lifecycle?limit=1" \
            "/api/audit/archived?limit=1" \
            "/api/audit/cover-loss?limit=1"
          do
            echo "===== ${path} ====="
            curl --max-time 60 -sS -w '\nHTTP %{http_code} total=%{time_total}s\n' "${B}${path}" || true
            echo
          done

      - name: Open configured public history source
        run: pnpm exec vitest run src/shared/history-segments/public-source-probe.test.ts --reporter=verbose
