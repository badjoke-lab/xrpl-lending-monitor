name: Apply M1 fresh-head evidence

on:
  push:
    branches:
      - docs/m1-fresh-head-evidence
    paths:
      - .github/workflows/apply-m1-fresh-head-evidence.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/m1-fresh-head-evidence
          fetch-depth: 0

      - name: Reconcile roadmap and implementation status
        shell: python
        run: |
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'{path}: replacement target not found')
              p.write_text(text.replace(old, new, 1))

          replace(
              'docs/development-roadmap.md',
              'Latest operational probe state on 2026-07-07: created current, modified current, LoanPay/payment, default, deletion/archive, activity-history-balance consistency, ledger continuity, and cursor/overlay agreement are observed. Impairment, unimpairment, and freshness remain missing. The collector was still behind the observed head but advancing contiguously with zero observed failures.',
              'Latest operational probe state on 2026-07-07 at 13:00 UTC: the collector is healthy at zero lag with cursor and observed head both at `3463095`; processed continuation `3432925..3463095` contains `30171` ledgers with zero discontinuities. Created current, modified current, LoanPay/payment, impairment, default, deletion/archive, activity-history-balance consistency, ledger continuity, cursor/overlay agreement, and freshness are observed. Only unimpairment remains missing, with zero observed unimpairment source or lifecycle transitions. The M1 `validatedHeadReached` gate is now observed; `liveContinuation` remains missing only because unimpairment evidence is absent.',
          )

          replace(
              'docs/implementation-status.md',
              'The latest bounded runtime probe captured at 2026-07-07 11:44 UTC shows continued collector progress with zero consecutive failures, no current error, cursor `3461324`, observed head `3461639`, and lag `315`. The processed continuation range is contiguous from `3432925` through `3461324` with zero discontinuities. HYB-7 now observes created current objects, modified current objects, LoanPay/payment, default, deletion/archive handling, activity/history/balance consistency, ledger continuity, and cursor/overlay agreement. Remaining missing paths are impairment, unimpairment, and freshness at a healthy zero-lag head.',
              'The latest bounded runtime probe captured at 2026-07-07 13:00 UTC shows a healthy collector at zero reported lag with zero consecutive failures and no current error. Cursor and observed head both equal `3463095`. The processed continuation range is contiguous from `3432925` through `3463095`, covering `30171` ledgers with zero discontinuities. HYB-7 now observes created current objects, modified current objects, LoanPay/payment, impairment, default, deletion/archive handling, activity/history/balance consistency, ledger continuity, cursor/overlay agreement, and freshness. Only unimpairment remains missing; zero unimpairment source or lifecycle transitions have been observed.',
          )

          replace(
              'docs/implementation-status.md',
              '- `impaired`: missing;\n- `unimpaired`: missing;\n- `freshness`: missing while the collector remains behind the observed validated head.\n\nThe latest known M1 gates are:\n\n- `verifiedBaseBinding`: observed;\n- `catchUpStart`: observed;\n- `validatedHeadReached`: missing;\n- `liveContinuation`: missing because all required HYB-7 live paths are not yet observed.',
              '- `impaired`: observed;\n- `unimpaired`: missing;\n- `freshness`: observed.\n\nThe latest known M1 gates are:\n\n- `verifiedBaseBinding`: observed;\n- `catchUpStart`: observed;\n- `validatedHeadReached`: observed;\n- `liveContinuation`: missing only because the required unimpairment path has not yet been observed.',
          )

          replace(
              'docs/implementation-status.md',
              'The active operational unit is now:\n\n1. continue bounded D1 collection unchanged from `3432925` toward the observed validated head;\n2. verify sustained zero-failure operation and actual D1 resource usage under the documented ceilings;\n3. observe real post-boundary impairment and unimpairment evidence;\n4. confirm `validatedHeadReached` and freshness at healthy zero lag;\n5. run the M1 exit review workflow with `require_ready=true` and retain the evidence artifact;\n6. update repository status from the successful exit evidence;\n7. proceed to M5-5 real-data integration;\n8. run the production full-page desktop/mobile screenshot audit, remediate UI overflow and spacing defects, and re-audit;\n9. complete SEO/discoverability implementation and final-host binding, then owner-managed subdomain, analytics, Search Console verification, and sitemap submission;\n10. proceed through M6 hardening and real multi-day Devnet soak.',
              'The active operational unit is now:\n\n1. preserve healthy zero-lag collection and verify continued zero-failure operation plus actual D1 resource usage;\n2. resolve the single remaining HYB-7 evidence gap: real post-boundary unimpairment;\n3. while waiting for or deliberately generating an external Devnet unimpairment witness, use the now-satisfied fresh-head gate to check D1 headroom and run the gated production screenshot audit when safe;\n4. inspect screenshot evidence, remediate UI overflow and spacing defects, and re-audit affected routes;\n5. once unimpairment is observed, run the M1 exit review workflow with `require_ready=true` and retain the evidence artifact;\n6. update repository status from the successful exit evidence and proceed to M5-5 real-data integration;\n7. complete final-host SEO binding, then owner-managed subdomain, analytics, Search Console verification, and sitemap submission;\n8. proceed through M6 hardening and real multi-day Devnet soak.',
          )

          replace(
              'docs/implementation-status.md',
              '1. Monitor collector lag slope and D1 usage while continuation advances without changing collector limits absent failure or resource evidence.\n2. Keep replacement-base replay status, cursor/overlay agreement, and history-source diagnostics under permanent monitoring.\n3. Re-evaluate impairment and unimpairment evidence while the collector reaches the observed validated head.\n4. Confirm freshness at healthy zero lag and re-run continuation plus M1 diagnostics.\n5. Execute the reproducible M1 exit review with readiness enforcement.\n6. Complete M1 status review and M5-5 real-data integration.\n7. Run the representative production screenshot audit, complete UI remediation, and re-audit.\n8. Finalize SEO/discoverability against the configured public host and complete owner-managed subdomain, analytics, Search Console, and sitemap tasks.\n9. Complete M6 hardening and real multi-day Devnet soak.',
              '1. Monitor healthy zero-lag collection and D1 usage without changing collector limits absent failure or resource evidence.\n2. Keep replacement-base replay status, cursor/overlay agreement, and history-source diagnostics under permanent monitoring.\n3. Check current D1 headroom, then run the gated representative production screenshot audit and inspect the resulting desktop/mobile evidence.\n4. Resolve the sole remaining HYB-7 unimpairment witness gap through real Devnet evidence; if natural evidence remains absent, use a separately approved external Devnet test actor rather than adding signing or write capability to the monitor.\n5. Execute the reproducible M1 exit review with readiness enforcement after unimpairment is observed.\n6. Complete M1 status review and M5-5 real-data integration.\n7. Complete UI remediation and screenshot re-audit.\n8. Finalize SEO/discoverability against the configured public host and complete owner-managed subdomain, analytics, Search Console, and sitemap tasks.\n9. Complete M6 hardening and real multi-day Devnet soak.',
          )

          replace(
              'docs/implementation-status.md',
              '- The production cursor has not yet reached the observed validated head.\n- Real post-replacement-boundary HYB-7 evidence remains missing for impairment and unimpairment.\n- Freshness remains missing until collector lag reaches zero with healthy status.\n- M1 exit remains incomplete until `validatedHeadReached` and all required live continuation paths are observed and consistent.\n- M5-5 real-data integration remains gated behind M1 exit.\n- Production visual audit, final-host SEO binding, and M6 release hardening remain pending in the dependency order defined by the roadmap.',
              '- Real post-replacement-boundary HYB-7 evidence remains missing only for unimpairment.\n- M1 exit remains incomplete until that unimpairment path is observed and `liveContinuation` becomes observed.\n- M5-5 real-data integration remains gated behind M1 exit.\n- Production visual audit is now eligible after a current D1 headroom check; UI remediation and re-audit remain pending.\n- Final-host SEO binding and M6 release hardening remain pending in the dependency order defined by the roadmap.',
          )

          Path('.github/workflows/apply-m1-fresh-head-evidence.yml').unlink()

      - name: Commit evidence reconciliation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/development-roadmap.md docs/implementation-status.md .github/workflows/apply-m1-fresh-head-evidence.yml
          git commit -m "Record healthy fresh head and sole unimpairment blocker"
          git push origin HEAD:docs/m1-fresh-head-evidence
