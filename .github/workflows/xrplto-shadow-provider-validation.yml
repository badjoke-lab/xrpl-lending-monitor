name: XRPL.to shadow provider validation

on:
  push:
    branches:
      - research/xrplto-shadow-provider-20261007
    paths:
      - '.github/workflows/xrplto-shadow-provider-validation.yml'
      - 'src/collector/network/xrpl-read-provider.ts'
      - 'src/collector/network/xrpl-read-provider.test.ts'
      - 'src/collector/incremental/read-validated-ledger-rpc.ts'
      - 'src/collector/incremental/read-validated-ledger-rpc.test.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Run provider unit tests
        run: pnpm exec vitest run src/collector/network/xrpl-read-provider.test.ts src/collector/incremental/read-validated-ledger-rpc.test.ts

      - name: Lint provider changes
        run: pnpm exec eslint src/collector/network/xrpl-read-provider.ts src/collector/network/xrpl-read-provider.test.ts src/collector/incremental/read-validated-ledger-rpc.ts src/collector/incremental/read-validated-ledger-rpc.test.ts

      - name: Typecheck
        run: pnpm typecheck
