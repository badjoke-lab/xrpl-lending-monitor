name: Unit diagnostic

on:
  pull_request:
    branches: [main]

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture concise unit-test failure
        id: tests
        shell: bash
        run: |
          set +e
          pnpm test > unit-test.log 2>&1
          status=$?
          tail -n 160 unit-test.log > unit-test-tail.txt
          cat unit-test-tail.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-tail
          path: unit-test-tail.txt
          retention-days: 1
      - name: Preserve test result
        if: steps.tests.outputs.status != '0'
        run: exit 1
