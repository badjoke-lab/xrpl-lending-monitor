name: Cancel redundant recovery runs

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cancel-redundant-recovery-runs.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel redundant recovery workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cancel-redundant-recovery
          WORKFLOWS=(
            run-history-catchup-cycle.yml
            complete-history-recovery.yml
            test-fixed-catchup-cycle.yml
            resume-history-recovery-after-fixed-index.yml
            resume-history-recovery-v2.yml
            execute-live-cutover-now.yml
            rolling-checkpoint-live-cutover.yml
          )
          : > cancel-redundant-recovery/cancelled.txt
          for workflow in "${WORKFLOWS[@]}"; do
            gh api "repos/${REPOSITORY}/actions/workflows/${workflow}/runs?per_page=100" \
              > "cancel-redundant-recovery/${workflow}.json"
            while IFS= read -r run_id; do
              test "${run_id}" = "${GITHUB_RUN_ID}" && continue
              gh api --method POST "repos/${REPOSITORY}/actions/runs/${run_id}/cancel" || true
              printf '%s\t%s\n' "${workflow}" "${run_id}" >> cancel-redundant-recovery/cancelled.txt
            done < <(jq -r '.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "requested" or .status == "waiting" or .status == "pending") | .id' "cancel-redundant-recovery/${workflow}.json")
          done
