name: Qualifier 995 read-only diagnostic

on:
  push:
    branches:
      - agent/qualifier-995-diagnose
    paths:
      - .github/workflows/qualifier-995-readonly-diagnostic.yml

permissions:
  contents: write
  issues: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
  GH_TOKEN: ${{ github.token }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query exact failed-window evidence
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          query_d1() {
            local sql="$1" output="$2"
            jq -n --arg sql "$sql" '{sql:$sql}' \
              | curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
                  --connect-timeout 10 --max-time 45 \
                  -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  -H 'Content-Type: application/json' --data-binary @- \
                  "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query" \
              > "$output"
          }

          query_d1 "SELECT network,run_at,status,start_ledger_index,end_ledger_index,latest_observed_ledger,lag_ledgers,ledgers_processed,lending_transactions,coalesced_object_rows,persistence_rows_read,persistence_rows_written,error_message FROM fast_lane_shadow_run_metrics WHERE network='devnet' AND run_at>='2026-07-24T11:55:00Z' AND run_at<'2026-07-24T12:16:00Z' ORDER BY run_at" metrics.json
          query_d1 "SELECT scheduled_time,status,started_at,completed_at,next_scheduled_time,error_message,updated_at FROM fast_lane_queue_slots WHERE scheduled_time BETWEEN 1784894100000 AND 1784895300000 ORDER BY scheduled_time" slots.json
          query_d1 "SELECT start_ledger_index,end_ledger_index,end_ledger_hash,created_at,LENGTH(bundle_json) AS encoded_bytes FROM fast_lane_history_windows WHERE network='devnet' AND created_at>='2026-07-24T11:55:00Z' AND created_at<'2026-07-24T12:16:00Z' ORDER BY created_at,start_ledger_index" windows.json
          query_d1 "SELECT run_at,status,error_message,start_ledger_index,end_ledger_index,latest_observed_ledger,lag_ledgers,persistence_rows_read,persistence_rows_written FROM fast_lane_shadow_run_metrics WHERE network='devnet' AND status='error' AND run_at>='2026-07-24T11:25:00Z' AND run_at<'2026-07-24T12:25:00Z' ORDER BY run_at" errors.json

      - name: Build diagnostic result
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          SLOT_MS=300000
          def rows(path):
              payload=json.loads(Path(path).read_text())
              return payload.get('result',[{}])[0].get('results',[])
          def ms(value):
              return int(datetime.fromisoformat(value.replace('Z','+00:00')).timestamp()*1000)

          metrics=rows('metrics.json')
          slots=rows('slots.json')
          windows=rows('windows.json')
          errors=rows('errors.json')
          grouped={}
          for metric in metrics:
              slot=(ms(metric['run_at'])//SLOT_MS)*SLOT_MS
              grouped.setdefault(str(slot),[]).append(metric)
          groups=[]
          for slot, items in sorted(grouped.items(), key=lambda x:int(x[0])):
              groups.append({
                  'slot':int(slot),
                  'runs':len(items),
                  'statuses':[item.get('status') for item in items],
                  'errors':[item.get('error_message') for item in items if item.get('status')=='error' or item.get('error_message')],
                  'rowsRead':sum(int(item.get('persistence_rows_read') or 0) for item in items),
                  'rowsWritten':sum(int(item.get('persistence_rows_written') or 0) for item in items),
                  'terminalLag':int(items[-1].get('lag_ledgers') or 0),
                  'firstRunAt':items[0].get('run_at'),
                  'lastRunAt':items[-1].get('run_at'),
                  'ledgerRanges':[[item.get('start_ledger_index'),item.get('end_ledger_index')] for item in items],
              })
          placeholders=[]
          genuine=[]
          for item in errors:
              placeholder=(item.get('error_message') in (None,'') and item.get('start_ledger_index') is None and item.get('end_ledger_index') is None and int(item.get('latest_observed_ledger') or 0)==0 and int(item.get('persistence_rows_written') or 0)==0)
              (placeholders if placeholder else genuine).append(item)
          result={
              'checkedAt':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
              'readOnly':True,
              'qualificationRunId':30089272692,
              'window':{'start':'2026-07-24T11:25:00Z','end':'2026-07-24T12:20:00Z'},
              'slotGroups':groups,
              'queueSlots':slots,
              'errorRows':{'placeholderHeartbeats':placeholders,'genuineErrors':genuine},
              'historyWindows':windows,
              'maxObservedWritesPerFiveMinuteBucket':max((g['rowsWritten'] for g in groups),default=0),
              'notes':[
                  'The original qualifier grouped metrics by metric run_at floor, not by the queue slot that caused each pass.',
                  'A delayed or retried queue delivery can therefore be attributed to the wrong scheduled slot.',
                  'The diagnostic performs no deployment, Queue send, D1 mutation, or production API mutation.'
              ]
          }
          Path('diagnostic.json').write_text(json.dumps(result,indent=2)+'\n')
          PY

      - name: Publish diagnostic to issue 995
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Read-only failure diagnosis'
            echo
            echo '```json'
            cat diagnostic.json
            echo '```'
          } > comment.md
          gh issue comment 995 --repo "$GITHUB_REPOSITORY" --body-file comment.md

      - name: Retain diagnostic on this branch
        shell: bash
        run: |
          set -euo pipefail
          api="repos/${GITHUB_REPOSITORY}/contents/.github/qualifier-995-readonly-diagnostic.json"
          sha="$(gh api "$api?ref=${GITHUB_REF_NAME}" --jq .sha 2>/dev/null || true)"
          content="$(base64 -w0 diagnostic.json)"
          if [ -n "$sha" ]; then
            gh api --method PUT "$api" -f message='Retain qualifier 995 read-only diagnostic' -f content="$content" -f sha="$sha" -f branch="$GITHUB_REF_NAME" >/dev/null
          else
            gh api --method PUT "$api" -f message='Retain qualifier 995 read-only diagnostic' -f content="$content" -f branch="$GITHUB_REF_NAME" >/dev/null
          fi
