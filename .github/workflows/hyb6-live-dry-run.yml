name: HYB-6 live dry-run probe

on:
  push:
    branches:
      - ops/hyb6-live-dry-run
    paths:
      - .github/workflows/hyb6-live-dry-run.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/hyb6-live-dry-run.yml

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Worker URL and capture read-only runtime status
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hyb6-live-dry-run

          curl -sS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            > hyb6-live-dry-run/workers-subdomain.json

          SUBDOMAIN="$(jq -r '.result.subdomain // empty' hyb6-live-dry-run/workers-subdomain.json)"
          if [ -z "${SUBDOMAIN}" ]; then
            echo "Cloudflare Workers subdomain is unavailable" > hyb6-live-dry-run/probe-error.txt
            exit 0
          fi

          BASE="https://xrpl-lending-monitor.${SUBDOMAIN}.workers.dev"
          printf '%s\n' "${BASE}" > hyb6-live-dry-run/base-url.txt

          for NAME in catch-up-initialization collector continuation-verification m1-exit; do
            URL="${BASE}/api/status/${NAME}"
            STATUS="$(curl -sS -o "hyb6-live-dry-run/${NAME}.json" -w '%{http_code}' "${URL}" || true)"
            printf '%s\n' "${STATUS}" > "hyb6-live-dry-run/${NAME}.http-status.txt"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: hyb6-live-dry-run
          path: hyb6-live-dry-run
          if-no-files-found: error
