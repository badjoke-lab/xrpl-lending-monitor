name: Deploy compressed semantic history bundles

on:
  push:
    branches: [main]
    paths:
      - .github/compressed-history-deploy-trigger

permissions:
  contents: write

concurrency:
  group: production-worker-write
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
      PRODUCTION_BASE: https://xrpl-lending-monitor.badjoke-lab.workers.dev
    steps:
      - name: Check out implementation
        uses: actions/checkout@v4

      - name: Check out production current-state identity
        uses: actions/checkout@v4
        with:
          ref: current-state-data
          path: .local/current-state-data
          sparse-checkout: |
            read-model/manifest.json
            rolling-read-model-summary.json
          sparse-checkout-cone-mode: false

      - name: Check out archived history identity
        uses: actions/checkout@v4
        with:
          ref: history-data
          path: .local/history-data
          sparse-checkout: history/publication.json
          sparse-checkout-cone-mode: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate production contract
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path('wrangler.jsonc').read_text())
          current = json.loads(Path('.local/current-state-data/read-model/manifest.json').read_text())
          summary = json.loads(Path('.local/current-state-data/rolling-read-model-summary.json').read_text())
          history = json.loads(Path('.local/history-data/history/publication.json').read_text())

          assert config['main'] == 'src/worker/p0-redundant-scheduler-entry.ts'
          assert config['triggers']['crons'] == ['*/5 * * * *']
          assert config['vars']['APP_NETWORK'] == 'devnet'
          assert config['vars']['MAINNET_ENABLED'] == 'false'
          assert len(config['queues']['producers']) == 1
          assert len(config['queues']['consumers']) == 1
          assert config['queues']['consumers'][0]['max_batch_size'] == 1
          assert config['queues']['consumers'][0]['max_concurrency'] == 1
          assert 'REPLACEMENT_BASE_CUTOVER_TOKEN' not in config['vars']

          assert current['complete'] is True
          assert history['complete'] is True
          assert current['epochId'] == history['epochId'] == 'devnet-3371675'
          assert current['ledgerIndex'] >= history['endLedgerIndex']
          if current['ledgerIndex'] == history['endLedgerIndex']:
              assert current['ledgerHash'] == history['endLedgerHash']

          assert summary['mode'] == 'd1-overlay-fold'
          assert summary['source']['snapshotId'] == current['snapshotId']
          assert summary['source']['ledgerIndex'] == current['ledgerIndex']
          assert summary['source']['ledgerHash'] == current['ledgerHash']
          assert summary['target']['snapshotId'] == current['snapshotId']
          assert summary['target']['ledgerIndex'] == current['ledgerIndex']
          assert summary['target']['ledgerHash'] == current['ledgerHash']
          assert summary['overlaySource']['epochId'] == current['epochId']
          assert summary['overlaySource']['overlayLedgerIndex'] == current['ledgerIndex']
          assert summary['overlaySource']['overlayLedgerHash'] == current['ledgerHash']

          variables = config['vars']
          assert variables['CURRENT_STATE_REPLACEMENT_SNAPSHOT_ID'] == current['snapshotId']
          assert variables['REPLACEMENT_BASE_EPOCH_ID'] == current['epochId']
          assert variables['REPLACEMENT_BASE_SNAPSHOT_ID'] == current['snapshotId']
          assert int(variables['REPLACEMENT_BASE_LEDGER_INDEX']) == current['ledgerIndex']
          assert variables['REPLACEMENT_BASE_LEDGER_HASH'] == current['ledgerHash']

          checkpoint = {
              'implementationSha': '${{ github.sha }}',
              'epochId': current['epochId'],
              'snapshotId': current['snapshotId'],
              'ledgerIndex': current['ledgerIndex'],
              'ledgerHash': current['ledgerHash'],
              'historyMode': 'd1_fast_lane_windows_with_archived_branch',
              'historyArchiveLedgerIndex': history['endLedgerIndex'],
              'historyArchiveLedgerHash': history['endLedgerHash'],
              'historyPublicationSha256': history['publicationSha256'],
              'historyGapLedgers': current['ledgerIndex'] - history['endLedgerIndex'],
              'fastLaneHistoryEncoding': 'gzip-base64-v1',
              'fastLaneEncodedBundleLimitBytes': 131072,
          }
          Path('production-deploy-checkpoint.json').write_text(json.dumps(checkpoint, indent=2) + '\n')
          PY

      - name: Build application
        run: pnpm build

      - name: Apply D1 migrations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p production-d1-migrations
          pnpm exec wrangler d1 migrations list xrpl-lending-monitor --remote \
            | tee production-d1-migrations/before.txt
          pnpm exec wrangler d1 migrations apply xrpl-lending-monitor --remote \
            | tee production-d1-migrations/apply.txt
          pnpm exec wrangler d1 migrations list xrpl-lending-monitor --remote \
            | tee production-d1-migrations/after.txt

      - name: Read pre-deploy production cursor
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg sql "SELECT last_processed_ledger,last_processed_hash,latest_observed_ledger,latest_observed_hash,status,updated_at FROM fast_lane_shadow_state WHERE network='devnet'" '{sql:$sql}' \
            | curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H 'Content-Type: application/json' --data-binary @- \
                "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query" \
            > pre-deploy-fast-lane.json

      - name: Deploy Worker
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler deploy
          date -u +%FT%TZ > deployed-at.txt

      - name: Verify deployed configuration
        id: config_verify
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_EPOCH="$(jq -r '.epochId' production-deploy-checkpoint.json)"
          EXPECTED_SNAPSHOT="$(jq -r '.snapshotId' production-deploy-checkpoint.json)"
          EXPECTED_LEDGER="$(jq -r '.ledgerIndex' production-deploy-checkpoint.json)"
          EXPECTED_HASH="$(jq -r '.ledgerHash' production-deploy-checkpoint.json)"
          AUTH=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          verified=false

          for attempt in $(seq 1 60); do
            curl --fail-with-body --silent --show-error "${AUTH[@]}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-monitor/settings" \
              > deployed-worker-settings.json || true
            curl --fail-with-body --silent --show-error "${AUTH[@]}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-monitor/schedules" \
              > deployed-worker-schedules.json || true
            rebase_status="$(curl --silent --show-error --retry 1 -o deployed-rebase-status.json -w '%{http_code}' \
              "${PRODUCTION_BASE}/api/status/replacement-base-rebase" || true)"

            if jq -e \
              --arg epoch "${EXPECTED_EPOCH}" \
              --arg snapshot "${EXPECTED_SNAPSHOT}" \
              --arg ledger "${EXPECTED_LEDGER}" \
              --arg hash "${EXPECTED_HASH}" '
                def binding($name):
                  [.result.bindings[] | select(.name == $name) | (.text // .value)] | first;
                binding("APP_NETWORK") == "devnet"
                and binding("MAINNET_ENABLED") == "false"
                and binding("REPLACEMENT_BASE_EPOCH_ID") == $epoch
                and binding("REPLACEMENT_BASE_SNAPSHOT_ID") == $snapshot
                and binding("REPLACEMENT_BASE_LEDGER_INDEX") == $ledger
                and binding("REPLACEMENT_BASE_LEDGER_HASH") == $hash
                and ([.result.bindings[] | select(.name == "REPLACEMENT_BASE_CUTOVER_TOKEN")] | length) == 0
                and ([.result.bindings[] | select(.name == "FAST_LANE_QUEUE" and .type == "queue")] | length) == 1
              ' deployed-worker-settings.json > /dev/null 2>&1 \
              && jq -e '.result.schedules | length == 1 and .[0].cron == "*/5 * * * *"' deployed-worker-schedules.json > /dev/null 2>&1 \
              && [ "${rebase_status}" = 200 ] \
              && jq -e --arg epoch "${EXPECTED_EPOCH}" --arg snapshot "${EXPECTED_SNAPSHOT}" --argjson ledger "${EXPECTED_LEDGER}" --arg hash "${EXPECTED_HASH}" '
                .status == "replayed"
                and .target.epochId == $epoch
                and .target.snapshotId == $snapshot
                and .target.ledgerIndex == $ledger
                and .target.ledgerHash == $hash
              ' deployed-rebase-status.json > /dev/null 2>&1; then
              verified=true
              break
            fi
            sleep 3
          done
          test "$verified" = true

      - name: Verify compressed history catch-up and public reads
        id: history_verify
        shell: bash
        run: |
          set -uo pipefail
          DEPLOYED_AT="$(cat deployed-at.txt)"

          query_d1() {
            local sql="$1" output="$2"
            jq -n --arg sql "$sql" '{sql:$sql}' \
              | curl --silent --show-error --retry 3 --retry-all-errors \
                  --connect-timeout 10 --max-time 45 \
                  -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  -H 'Content-Type: application/json' --data-binary @- \
                  "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query" \
              > "$output"
          }

          fetch_api() {
            local path="$1" output="$2" code_file="$3"
            local code
            code="$(curl --silent --show-error --retry 3 --retry-all-errors \
              --connect-timeout 10 --max-time 45 -o "$output" -w '%{http_code}' \
              "${PRODUCTION_BASE}${path}" || true)"
            printf '%s' "$code" > "$code_file"
          }

          passed=false
          public_match=false
          for attempt in $(seq 1 45); do
            query_d1 "WITH windows AS (
              SELECT start_ledger_index,end_ledger_index,end_ledger_hash,created_at,LENGTH(bundle_json) AS encoded_bytes,
                     MAX(end_ledger_index) OVER (ORDER BY start_ledger_index,end_ledger_index,created_at ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING) AS previously_covered_through
              FROM fast_lane_history_windows
              WHERE network='devnet' AND created_at>='${DEPLOYED_AT}' AND SUBSTR(bundle_json,1,15)='gzip-base64-v1:'
            )
            SELECT COUNT(*) AS window_count,MIN(start_ledger_index) AS first_ledger,MAX(end_ledger_index) AS last_ledger,
                   COALESCE(SUM(CASE WHEN previously_covered_through IS NOT NULL AND start_ledger_index>previously_covered_through+1 THEN 1 ELSE 0 END),0) AS gap_count,
                   COALESCE(MAX(encoded_bytes),0) AS max_encoded_bytes,MIN(created_at) AS first_created_at,MAX(created_at) AS last_created_at
            FROM windows" compressed-aggregate.json

            query_d1 "SELECT start_ledger_index,end_ledger_index,end_ledger_hash,created_at,bundle_json
              FROM fast_lane_history_windows
              WHERE network='devnet' AND created_at>='${DEPLOYED_AT}' AND SUBSTR(bundle_json,1,15)='gzip-base64-v1:'
              ORDER BY end_ledger_index DESC LIMIT 1" compressed-witness-row.json

            query_d1 "WITH first_compressed AS (
              SELECT start_ledger_index,end_ledger_index FROM fast_lane_history_windows
              WHERE network='devnet' AND created_at>='${DEPLOYED_AT}' AND SUBSTR(bundle_json,1,15)='gzip-base64-v1:'
              ORDER BY start_ledger_index ASC LIMIT 1
            )
            SELECT start_ledger_index AS first_compressed_start,end_ledger_index AS first_compressed_end,
                   (SELECT MAX(end_ledger_index) FROM fast_lane_history_windows WHERE network='devnet' AND end_ledger_index<first_compressed.start_ledger_index) AS previous_end
            FROM first_compressed" transition.json

            query_d1 "SELECT epoch_id,last_processed_ledger,last_processed_hash,latest_observed_ledger,latest_observed_hash,status,(latest_observed_ledger-last_processed_ledger) AS lag_ledgers,updated_at FROM fast_lane_shadow_state WHERE network='devnet'" state.json
            query_d1 "SELECT epoch_id,base_snapshot_id,base_ledger_index,base_ledger_hash,overlay_ledger_index,overlay_ledger_hash,updated_at FROM current_state_overlay_state WHERE network='devnet'" overlay.json
            query_d1 "SELECT COUNT(*) AS compact_rows FROM fast_lane_shadow_objects_compact WHERE network='devnet'" compact.json
            query_d1 "SELECT COUNT(*) AS stale_rows FROM current_state_overlay_objects o WHERE o.network='devnet' AND NOT EXISTS (SELECT 1 FROM fast_lane_shadow_base_binding b WHERE b.network=o.network AND b.base_epoch_id=o.epoch_id AND b.base_snapshot_id=o.base_snapshot_id)" stale.json
            query_d1 "SELECT COUNT(*) AS error_rows,MIN(run_at) AS first_error_at,MAX(run_at) AS last_error_at FROM fast_lane_shadow_run_metrics WHERE network='devnet' AND run_at>='${DEPLOYED_AT}' AND status='error'" errors.json

            node <<'NODE' || true
            const fs = require('node:fs')
            const zlib = require('node:zlib')
            const response = JSON.parse(fs.readFileSync('compressed-witness-row.json', 'utf8'))
            const row = response?.result?.[0]?.results?.[0]
            if (!row || typeof row.bundle_json !== 'string' || !row.bundle_json.startsWith('gzip-base64-v1:')) process.exit(2)
            const bundle = JSON.parse(zlib.gunzipSync(Buffer.from(row.bundle_json.slice(15), 'base64')).toString('utf8'))
            if (bundle.startLedgerIndex !== row.start_ledger_index || bundle.endLedgerIndex !== row.end_ledger_index || bundle.endLedgerHash !== row.end_ledger_hash) process.exit(3)
            for (const key of ['protocolEvents','objectChanges','loanLifecycle','archivedObjects','balanceHistory']) {
              if (!Array.isArray(bundle[key])) process.exit(4)
            }
            let witness = null
            if (bundle.objectChanges.length > 0) {
              const item = bundle.objectChanges[0]
              witness = { kind:'object_change', transactionHash:item.transactionHash, ledgerIndex:item.ledgerIndex, objectType:item.objectType, objectId:item.objectId }
            } else if (bundle.protocolEvents.length > 0) {
              const item = bundle.protocolEvents[0]
              witness = { kind:'protocol_event', transactionHash:item.eventHash, ledgerIndex:item.ledgerIndex }
            }
            fs.writeFileSync('decoded-compressed-witness.json', JSON.stringify({
              row:{startLedgerIndex:row.start_ledger_index,endLedgerIndex:row.end_ledger_index,createdAt:row.created_at,encodedBytes:Buffer.byteLength(row.bundle_json)},
              counts:{protocolEvents:bundle.protocolEvents.length,objectChanges:bundle.objectChanges.length,loanLifecycle:bundle.loanLifecycle.length,archivedObjects:bundle.archivedObjects.length,balanceHistory:bundle.balanceHistory.length},
              witness,
            }, null, 2) + '\n')
            if (!witness) process.exit(5)
            NODE

            public_match=false
            if [ -s decoded-compressed-witness.json ]; then
              kind="$(jq -r '.witness.kind // empty' decoded-compressed-witness.json)"
              tx="$(jq -r '.witness.transactionHash // empty' decoded-compressed-witness.json)"
              ledger="$(jq -r '.witness.ledgerIndex // -1' decoded-compressed-witness.json)"
              if [ "$kind" = object_change ]; then
                object_type="$(jq -r '.witness.objectType' decoded-compressed-witness.json)"
                object_id="$(jq -r '.witness.objectId' decoded-compressed-witness.json)"
                encoded_type="$(jq -rn --arg value "$object_type" '$value|@uri')"
                encoded_id="$(jq -rn --arg value "$object_id" '$value|@uri')"
                fetch_api "/api/objects/${encoded_type}/${encoded_id}/history?limit=100" public-witness.json public-witness.code
                if [ "$(cat public-witness.code)" = 200 ] && jq -e --arg tx "$tx" --argjson ledger "$ledger" '.data | any(.transaction_hash==$tx and .ledger_index==$ledger)' public-witness.json >/dev/null 2>&1; then public_match=true; fi
              elif [ "$kind" = protocol_event ]; then
                fetch_api '/api/activity?limit=100' public-witness.json public-witness.code
                if [ "$(cat public-witness.code)" = 200 ] && jq -e --arg tx "$tx" --argjson ledger "$ledger" '.data | any(.transaction_hash==$tx and .ledger_index==$ledger)' public-witness.json >/dev/null 2>&1; then public_match=true; fi
              fi
            fi

            fetch_api '/api/overview' overview.json overview.code
            fetch_api '/api/status/history-source' history-source.json history-source.code
            fetch_api '/api/status/fast-lane-diff?limit=1' diff.json diff.code

            window_count="$(jq -r '.result[0].results[0].window_count // 0' compressed-aggregate.json 2>/dev/null || echo 0)"
            gap_count="$(jq -r '.result[0].results[0].gap_count // -1' compressed-aggregate.json 2>/dev/null || echo -1)"
            max_bytes="$(jq -r '.result[0].results[0].max_encoded_bytes // -1' compressed-aggregate.json 2>/dev/null || echo -1)"
            first_start="$(jq -r '.result[0].results[0].first_compressed_start // -1' transition.json 2>/dev/null || echo -1)"
            previous_end="$(jq -r '.result[0].results[0].previous_end // -1' transition.json 2>/dev/null || echo -1)"
            fast_ledger="$(jq -r '.result[0].results[0].last_processed_ledger // -1' state.json 2>/dev/null || echo -1)"
            fast_hash="$(jq -r '.result[0].results[0].last_processed_hash // empty' state.json 2>/dev/null || true)"
            lag="$(jq -r '.result[0].results[0].lag_ledgers // -1' state.json 2>/dev/null || echo -1)"
            fast_status="$(jq -r '.result[0].results[0].status // empty' state.json 2>/dev/null || true)"
            overlay_ledger="$(jq -r '.result[0].results[0].overlay_ledger_index // -1' overlay.json 2>/dev/null || echo -1)"
            overlay_hash="$(jq -r '.result[0].results[0].overlay_ledger_hash // empty' overlay.json 2>/dev/null || true)"
            compact_rows="$(jq -r '.result[0].results[0].compact_rows // -1' compact.json 2>/dev/null || echo -1)"
            stale_rows="$(jq -r '.result[0].results[0].stale_rows // -1' stale.json 2>/dev/null || echo -1)"
            error_rows="$(jq -r '.result[0].results[0].error_rows // -1' errors.json 2>/dev/null || echo -1)"

            if [ "$window_count" -gt 0 ] && [ "$gap_count" -eq 0 ] && [ "$max_bytes" -le 131072 ] \
               && [ "$previous_end" -ge 0 ] && [ "$first_start" -eq $((previous_end + 1)) ] \
               && [ "$fast_status" = healthy ] && [ "$lag" -eq 0 ] \
               && [ "$fast_ledger" -eq "$overlay_ledger" ] && [ "$fast_hash" = "$overlay_hash" ] \
               && [ "$compact_rows" -eq 0 ] && [ "$stale_rows" -eq 0 ] && [ "$error_rows" -eq 0 ] \
               && [ "$public_match" = true ] \
               && [ "$(cat overview.code)" = 200 ] && [ "$(cat history-source.code)" = 200 ] && [ "$(cat diff.code)" = 200 ]; then
              passed=true
              break
            fi
            sleep 20
          done

          curl --silent --show-error --retry 3 --retry-all-errors \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}" \
            > d1-database.json || true

          jq -n \
            --arg checkedAt "$(date -u +%FT%TZ)" \
            --arg deployedAt "$DEPLOYED_AT" \
            --argjson passed "$passed" \
            --argjson publicMatch "$public_match" \
            --slurpfile checkpoint production-deploy-checkpoint.json \
            --slurpfile preDeploy pre-deploy-fast-lane.json \
            --slurpfile compressed compressed-aggregate.json \
            --slurpfile transition transition.json \
            --slurpfile decoded decoded-compressed-witness.json \
            --slurpfile state state.json \
            --slurpfile overlay overlay.json \
            --slurpfile compact compact.json \
            --slurpfile stale stale.json \
            --slurpfile errors errors.json \
            --slurpfile database d1-database.json \
            --arg overviewHttp "$(cat overview.code 2>/dev/null || echo 000)" \
            --arg historyHttp "$(cat history-source.code 2>/dev/null || echo 000)" \
            --arg diffHttp "$(cat diff.code 2>/dev/null || echo 000)" \
            '{checkedAt:$checkedAt,deployedAt:$deployedAt,passed:$passed,checkpoint:$checkpoint[0],preDeploy:$preDeploy[0],compressedWindows:$compressed[0],formatTransition:$transition[0],decodedWitness:$decoded[0],publicWitnessMatch:$publicMatch,fastLane:$state[0],canonicalOverlay:$overlay[0],compact:$compact[0],stale:$stale[0],errors:$errors[0],database:$database[0],http:{overview:$overviewHttp,historySource:$historyHttp,fastLaneDiff:$diffHttp}}' \
            > compressed-history-deploy-verification.json

          test "$passed" = true

      - name: Publish deploy status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          CONFIG_OUTCOME: ${{ steps.config_verify.outcome }}
          HISTORY_OUTCOME: ${{ steps.history_verify.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          final_outcome="$HISTORY_OUTCOME"
          if [ -z "$final_outcome" ] || [ "$final_outcome" = skipped ]; then final_outcome="$CONFIG_OUTCOME"; fi
          if [ -z "$final_outcome" ] || [ "$final_outcome" = skipped ]; then final_outcome="$DEPLOY_OUTCOME"; fi
          if [ -z "$final_outcome" ]; then final_outcome=failure; fi
          if [ ! -s compressed-history-deploy-verification.json ]; then
            jq -n --arg checkedAt "$(date -u +%FT%TZ)" --arg outcome "$final_outcome" --slurpfile checkpoint production-deploy-checkpoint.json \
              '{checkedAt:$checkedAt,passed:false,workflowOutcome:$outcome,checkpoint:$checkpoint[0],error:"verification_result_missing"}' \
              > compressed-history-deploy-verification.json
          fi
          API_PATH="repos/${GITHUB_REPOSITORY}/contents/.github/compressed-history-deploy-status.json"
          CONTENT="$(base64 -w0 compressed-history-deploy-verification.json)"
          EXISTING_SHA="$(gh api "$API_PATH" --jq .sha 2>/dev/null || true)"
          if [ -n "$EXISTING_SHA" ]; then
            gh api --method PUT "$API_PATH" -f message="Update compressed history deploy status" -f content="$CONTENT" -f sha="$EXISTING_SHA" > /dev/null
          else
            gh api --method PUT "$API_PATH" -f message="Create compressed history deploy status" -f content="$CONTENT" > /dev/null
          fi

      - name: Upload deploy verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compressed-history-deploy-verification
          path: |
            production-deploy-checkpoint.json
            compressed-history-deploy-verification.json
            deployed-at.txt
            pre-deploy-fast-lane.json
            deployed-worker-settings.json
            deployed-worker-schedules.json
            deployed-rebase-status.json
            compressed-aggregate.json
            compressed-witness-row.json
            transition.json
            decoded-compressed-witness.json
            public-witness.json
            state.json
            overlay.json
            compact.json
            stale.json
            errors.json
            overview.json
            history-source.json
            diff.json
            d1-database.json
            production-d1-migrations
          if-no-files-found: warn
          retention-days: 14
