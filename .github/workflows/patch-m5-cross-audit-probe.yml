name: Patch M5 cross-audit bounded windows

on:
  pull_request:
    paths:
      - .github/workflows/patch-m5-cross-audit-probe.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Reduce strict ascending audit windows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/run-m5-5-cross-audit.mjs')
          text = path.read_text()
          old_history = '/history?limit=100'
          old_lifecycle = '/lifecycle?limit=100'
          if old_history not in text or old_lifecycle not in text:
            raise SystemExit('expected cross-audit anchors not found')
          text = text.replace(old_history, '/history?limit=25', 1)
          text = text.replace(old_lifecycle, '/lifecycle?limit=25', 1)
          path.write_text(text)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/run-m5-5-cross-audit.mjs
          git commit -m 'Use bounded current history audit windows'
          git push origin HEAD:${{ github.head_ref }}
