name: Exact-index output cleanup patch

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/exact-index-output-cleanup-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Clean output directory before exact-index rebuild
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/build-history-exact-index.ts')
          text = p.read_text()
          text = text.replace(
              "import { mkdir, readFile, writeFile } from 'node:fs/promises'",
              "import { mkdir, readFile, rm, writeFile } from 'node:fs/promises'",
              1,
          )
          old = "  await mkdir(options.outputDir, { recursive: true })\n  const assets: HistoryExactIndexManifest['assets'] = []"
          new = "  await rm(options.outputDir, { recursive: true, force: true })\n  await mkdir(options.outputDir, { recursive: true })\n  const assets: HistoryExactIndexManifest['assets'] = []"
          if old not in text:
              raise SystemExit('output directory marker not found')
          p.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/build-history-exact-index.ts
          git commit -m 'fix: clean exact-index output before rebuild'
          git push origin HEAD:${GITHUB_HEAD_REF}
