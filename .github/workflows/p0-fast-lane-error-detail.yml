name: P0 fast-lane error detail

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  probe:
    if: startsWith(github.event.issue.title, 'P0 fast-lane error detail')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Query current state and recent failures
        shell: bash
        run: |
          set -euo pipefail
          SQL=$(cat <<'SQL'
          SELECT run_at, status, start_ledger_index, end_ledger_index,
                 latest_observed_ledger, lag_ledgers, ledgers_processed,
                 persistence_rows_written, error_message
          FROM fast_lane_shadow_run_metrics
          WHERE network = 'devnet'
            AND (status = 'error' OR error_message IS NOT NULL)
          ORDER BY run_at DESC
          LIMIT 20;

          SELECT epoch_id, last_processed_ledger, latest_observed_ledger,
                 latest_observed_ledger - last_processed_ledger AS lag_ledgers,
                 status, updated_at
          FROM fast_lane_shadow_state
          WHERE network = 'devnet';

          SELECT overlay_ledger_index, updated_at
          FROM current_state_overlay_state
          WHERE network = 'devnet'
          LIMIT 1;
          SQL
          )
          jq -n --arg sql "$SQL" '{sql:$sql}' |
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' \
              --data-binary @- \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query" \
              > result.json
          {
            echo 'P0 fast-lane error detail:'
            echo
            echo '```json'
            jq . result.json
            echo '```'
          } > comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body-file comment.md
