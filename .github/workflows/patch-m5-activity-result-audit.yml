name: Patch M5 Activity result classification

on:
  pull_request:
    paths:
      - .github/workflows/patch-m5-activity-result-audit.yml

permissions:
  contents: write

concurrency:
  group: patch-m5-activity-result-classification
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Classify Activity result codes without rejecting valid failures
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/run-m5-5-cross-audit.mjs')
          text = path.read_text()
          old = "assert(activityRows.every((row) => row.result_code === 'tesSUCCESS'), 'Activity contains a non-success protocol event')"
          new = """assert(activityRows.every((row) => typeof row.result_code === 'string' && row.result_code.length > 0), 'Activity contains an event without a result code')
          const activitySuccessRows = activityRows.filter((row) => row.result_code === 'tesSUCCESS').length
          const activityNonSuccessRows = activityRows.length - activitySuccessRows""".replace('          ', '')
          if old not in text:
            raise SystemExit('Activity success-only assertion anchor not found')
          text = text.replace(old, new, 1)
          old_summary = 'activity_rows: activityRows.length,\n    archived_rows:'
          if old_summary not in text:
            raise SystemExit('Activity summary anchor not found')
          text = text.replace(old_summary, 'activity_rows: activityRows.length,\n    activity_success_rows: activitySuccessRows,\n    activity_non_success_rows: activityNonSuccessRows,\n    archived_rows:', 1)
          path.write_text(text)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/run-m5-5-cross-audit.mjs
          git commit -m 'Classify Activity results in M5 cross-audit'
          git push origin HEAD:${{ github.head_ref }}
