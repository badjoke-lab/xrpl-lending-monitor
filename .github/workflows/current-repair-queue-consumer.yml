name: Current repair Queue consumer settings

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: current-repair-production-worker-write
  cancel-in-progress: false

env:
  QUALIFICATION_ISSUE: '995'
  SCRIPT_NAME: xrpl-lending-monitor
  QUEUE_ID: 2ae398f2edbf43749e45cd7ede77c6cd
  DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
  EXPECTED_WORKER_VERSION: 6141a09f-cf99-4098-a75b-145cef1b9e63
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  GH_TOKEN: ${{ github.token }}

jobs:
  prepare:
    if: >-
      github.event.issue.number == 995 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      github.event.comment.body == '/current-repair-queue-consumer-prepare'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Capture exact read-only Queue consumer state
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/current-repair-queue-consumer.py
          set +e
          CURRENT_REPAIR_QUEUE_CONSUMER_OUTPUT=current-repair-queue-consumer-evidence/prepare \
            python scripts/current-repair-queue-consumer.py --prepare
          prepare_rc=$?
          set -e
          result=current-repair-queue-consumer-evidence/prepare/result.json
          if ! test -f "$result"; then
            printf 'safe=false\nprepare_result_available=false\nprepare_rc=%s\n' "$prepare_rc" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          safe="$(jq -r '.safe' "$result")"
          production_mutation="$(jq -r '.productionMutation' "$result")"
          failure_count="$(jq -r '.failures | length' "$result")"
          failures="$(jq -c '.failures' "$result")"
          source_commit="$(git rev-parse HEAD)"
          state="$(jq -r '.stateDigest' "$result")"
          consumer="$(jq -r '.state.consumer.consumerId // ""' "$result")"
          manager="$(sha256sum scripts/current-repair-queue-consumer.py | awk '{print $1}')"
          printf 'safe=%s\nprepare_result_available=true\nprepare_rc=%s\nproduction_mutation=%s\nfailure_count=%s\nfailures=%s\nsource_commit=%s\nstate=%s\nconsumer=%s\nmanager=%s\n' \
            "$safe" "$prepare_rc" "$production_mutation" "$failure_count" "$failures" \
            "$source_commit" "$state" "$consumer" "$manager" >> "$GITHUB_OUTPUT"

      - name: Publish exact Queue consumer authorization proposal
        if: steps.prepare.outputs.safe == 'true' && steps.prepare.outputs.prepare_result_available == 'true'
        env:
          SOURCE_COMMIT: ${{ steps.prepare.outputs.source_commit }}
          STATE: ${{ steps.prepare.outputs.state }}
          CONSUMER: ${{ steps.prepare.outputs.consumer }}
          MANAGER: ${{ steps.prepare.outputs.manager }}
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.prepare.outputs.production_mutation }}" = false
          test "${{ steps.prepare.outputs.failure_count }}" -eq 0
          test -n "$CONSUMER"
          expires="$(date -u -d '+2 hours' '+%Y-%m-%dT%H:%M:%SZ')"
          nonce="$(openssl rand -hex 8)"
          command="/current-repair-queue-consumer-authorize commit=${SOURCE_COMMIT} consumer=${CONSUMER} manager=${MANAGER} state=${STATE} worker=${EXPECTED_WORKER_VERSION} prepare_run=${GITHUB_RUN_ID} expires=${expires} nonce=${nonce}"
          cat > /tmp/current-repair-queue-consumer-proposal.md <<EOF
          ## Current repair Queue consumer authorization proposal

          Preparation run: \`${GITHUB_RUN_ID}\`
          Source main commit: \`${SOURCE_COMMIT}\`
          Queue consumer: \`${CONSUMER}\`
          Current Worker: \`${EXPECTED_WORKER_VERSION}\`
          Read-only state digest: \`${STATE}\`
          Manager SHA-256: \`${MANAGER}\`

          The read-only preflight requires Queue delivery already paused, one exact Worker consumer, \`batch_size=1\`, \`max_concurrency=1\`, current \`max_retries=3\`, no Cron, Devnet only, Mainnet disabled, no live Queue slot, and the retained stale failed slot. This authorization changes only that exact consumer's \`max_retries\` from \`3\` to \`100\`.

          It does not resume delivery, send/reseed/purge Queue messages, deploy a Worker, mutate D1/Supabase, create a Cron, or enable Mainnet.

          Exact authorization command:

          \`${command}\`
          EOF
          gh issue comment "$QUALIFICATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/current-repair-queue-consumer-proposal.md

      - name: Publish unsafe Queue consumer preparation result
        if: steps.prepare.outputs.safe != 'true'
        env:
          PREPARE_RESULT_AVAILABLE: ${{ steps.prepare.outputs.prepare_result_available }}
          PREPARE_RC: ${{ steps.prepare.outputs.prepare_rc }}
          FAILURES: ${{ steps.prepare.outputs.failures }}
        shell: bash
        run: |
          set -euo pipefail
          result=current-repair-queue-consumer-evidence/prepare/result.json
          if test "$PREPARE_RESULT_AVAILABLE" = true && test -f "$result"; then
            failures="$(jq -c '.failures' "$result")"
            queue_paused="$(jq -r '.state.queue.deliveryPaused' "$result")"
            backlog="$(jq -r '.state.queue.metrics.backlogCount' "$result")"
            consumer_retries="$(jq -r '.state.consumer.settings.max_retries // "unavailable"' "$result")"
            worker="$(jq -r '.state.workerVersion // "unavailable"' "$result")"
            schedules="$(jq -c '.state.schedules' "$result")"
            live="$(jq -r '.state.slots.liveUnstaged' "$result")"
            stale="$(jq -r '.state.slots.staleReclaimable' "$result")"
            staged="$(jq -r '.state.slots.stagedSuccessor' "$result")"
            processed="$(jq -r '.state.fastLane.lastProcessedLedger' "$result")"
            observed="$(jq -r '.state.fastLane.latestObservedLedger' "$result")"
          else
            failures='["prepareExecutionFailedBeforeStructuredResult"]'
            queue_paused=unavailable
            backlog=unavailable
            consumer_retries=unavailable
            worker=unavailable
            schedules=unavailable
            live=unavailable
            stale=unavailable
            staged=unavailable
            processed=unavailable
            observed=unavailable
          fi
          cat > /tmp/current-repair-queue-consumer-unsafe.md <<EOF
          ## Current repair Queue consumer preparation — unsafe

          Run: \`${GITHUB_RUN_ID}\`
          Prepare exit code: \`${PREPARE_RC}\`
          Failed checks: \`${failures}\`
          Queue delivery paused: \`${queue_paused}\`
          Queue backlog count: \`${backlog}\`
          Current consumer max_retries: \`${consumer_retries}\`
          Worker version: \`${worker}\`
          Worker schedules: \`${schedules}\`
          Queue slots live / stale / staged: \`${live} / ${stale} / ${staged}\`
          Fast-lane processed / observed ledger: \`${processed} / ${observed}\`

          No production mutation was authorized or performed by this preparation run.
          EOF
          gh issue comment "$QUALIFICATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/current-repair-queue-consumer-unsafe.md

      - name: Upload read-only Queue consumer preparation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-repair-queue-consumer-prepare
          path: current-repair-queue-consumer-evidence/prepare
          if-no-files-found: warn
          retention-days: 14

      - name: Fail unsafe Queue consumer preparation
        if: steps.prepare.outputs.safe != 'true'
        shell: bash
        run: |
          echo 'Queue consumer preparation is unsafe; see Issue #995 diagnostic comment.' >&2
          exit 1

  execute:
    if: >-
      github.event.issue.number == 995 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      startsWith(github.event.comment.body, '/current-repair-queue-consumer-authorize ')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      AUTHORIZATION_BODY: ${{ github.event.comment.body }}
      AUTHORIZATION_CREATED_AT: ${{ github.event.comment.created_at }}
      AUTHORIZATION_COMMENT_ID: ${{ github.event.comment.id }}
    steps:
      - name: Check out exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Parse and bind exact owner authorization
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          regex='^/current-repair-queue-consumer-authorize commit=([a-f0-9]{40}) consumer=([0-9a-f]{32}) manager=([a-f0-9]{64}) state=([a-f0-9]{64}) worker=([0-9a-f-]{36}) prepare_run=([0-9]+) expires=([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z) nonce=([a-f0-9]{16})$'
          [[ "$AUTHORIZATION_BODY" =~ $regex ]] || { echo 'Queue consumer authorization shape mismatch' >&2; exit 1; }
          names=(commit consumer manager state worker prepare_run expires nonce)
          for index in "${!names[@]}"; do
            printf '%s=%s\n' "${names[$index]}" "${BASH_REMATCH[$((index + 1))]}" >> "$GITHUB_OUTPUT"
          done
          test "${BASH_REMATCH[1]}" = "$(git rev-parse HEAD)"
          test "${BASH_REMATCH[3]}" = "$(sha256sum scripts/current-repair-queue-consumer.py | awk '{print $1}')"
          test "${BASH_REMATCH[5]}" = "$EXPECTED_WORKER_VERSION"
          expires_epoch="$(date -u -d "${BASH_REMATCH[7]}" +%s)"
          auth_epoch="$(date -u -d "$AUTHORIZATION_CREATED_AT" +%s)"
          now_epoch="$(date -u +%s)"
          test "$auth_epoch" -lt "$expires_epoch"
          test "$now_epoch" -le "$expires_epoch"
          test $((expires_epoch - auth_epoch)) -le 7200

      - name: Verify exact prior proposal and unique authorization
        env:
          PREPARE_RUN: ${{ steps.auth.outputs.prepare_run }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${QUALIFICATION_ISSUE}/comments?per_page=100" | jq -s 'add' > /tmp/current-repair-comments.json
          EXPECTED="$AUTHORIZATION_BODY" PREPARE="$PREPARE_RUN" AUTH_ID="$AUTHORIZATION_COMMENT_ID" node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const comments = JSON.parse(readFileSync('/tmp/current-repair-comments.json', 'utf8'))
          const proposals = comments.filter((comment) => comment?.user?.login === 'github-actions[bot]' && typeof comment?.body === 'string' && comment.body.includes(`Preparation run: \`${process.env.PREPARE}\``) && comment.body.includes(`\`${process.env.EXPECTED}\``))
          if (proposals.length !== 1) throw new Error(`expected one exact Queue consumer proposal, found ${proposals.length}`)
          const authorizations = comments.filter((comment) => comment?.user?.login === 'badjoke-lab' && comment?.body === process.env.EXPECTED)
          if (authorizations.length !== 1 || Number(authorizations[0].id) !== Number(process.env.AUTH_ID)) throw new Error('Queue consumer authorization is not unique')
          NODE

      - name: Re-prove and update exact Queue consumer only
        env:
          AUTHORIZED_STATE_DIGEST: ${{ steps.auth.outputs.state }}
          AUTHORIZED_CONSUMER_ID: ${{ steps.auth.outputs.consumer }}
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/current-repair-queue-consumer.py
          CURRENT_REPAIR_QUEUE_CONSUMER_OUTPUT=current-repair-queue-consumer-evidence/execute \
            python scripts/current-repair-queue-consumer.py --execute

      - name: Publish Queue consumer result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result=current-repair-queue-consumer-evidence/execute/result.json
          if test -f "$result"; then
            passed="$(jq -r '.passed' "$result")"
            changed="$(jq -r '.consumerUpdatePerformed' "$result")"
            max_retries="$(jq -r '.post.state.consumer.settings.max_retries // "unavailable"' "$result")"
            queue_resumed="$(jq -r '.queueResumed' "$result")"
            d1_mutation="$(jq -r '.d1Mutation' "$result")"
          else
            passed=false
            changed=unknown
            max_retries=unknown
            queue_resumed=unknown
            d1_mutation=unknown
          fi
          cat > /tmp/current-repair-queue-consumer-result.md <<EOF
          ## Current repair Queue consumer result

          Run: \`${GITHUB_RUN_ID}\`
          Passed: \`${passed}\`
          Consumer update performed: \`${changed}\`
          Production max_retries: \`${max_retries}\`
          Queue resumed: \`${queue_resumed}\`
          D1 mutation: \`${d1_mutation}\`

          This operation changes only the existing Queue consumer retry setting. It does not resume/reseed/purge Queue delivery, deploy a Worker, create a Cron, mutate D1/Supabase, or enable Mainnet.
          EOF
          gh issue comment "$QUALIFICATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/current-repair-queue-consumer-result.md

      - name: Upload Queue consumer mutation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-repair-queue-consumer
          path: current-repair-queue-consumer-evidence/execute
          if-no-files-found: warn
          retention-days: 30
