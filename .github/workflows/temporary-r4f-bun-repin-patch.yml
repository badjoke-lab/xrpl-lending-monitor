name: Temporary R4F Bun Repin Patch

on:
  push:
    branches:
      - agent/r4f-repin-bun-after-supabase-cli

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/agent/r4f-repin-bun-after-supabase-cli'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/r4f-repin-bun-after-supabase-cli
          fetch-depth: 1

      - name: Apply exact tool-order fix and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/r4f-revision4-12-ledger-qualification.yml')
          lines = workflow_path.read_text().splitlines(keepends=True)
          bun_marker = '      - name: Set up pinned Bun for proof prebundle\n'
          supabase_marker = '      - name: Set up Supabase CLI\n'
          next_marker = '      - name: Resolve exactly one elevated database API key\n'
          if lines.count(bun_marker) != 1 or lines.count(supabase_marker) != 1 or lines.count(next_marker) != 1:
              raise SystemExit('expected unique Bun, Supabase CLI, and following-step markers')
          bun_index = lines.index(bun_marker)
          supabase_index = lines.index(supabase_marker)
          next_index = lines.index(next_marker)
          if not (bun_index < supabase_index < next_index):
              raise SystemExit('unexpected pre-fix tool ordering')
          replacement = """      - name: Set up Supabase CLI
                uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
                with:
                  version: latest

              - name: Set up pinned Bun for proof prebundle
                uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
                with:
                  bun-version: 1.3.14

          """
          replacement = replacement.replace('              ', '      ').replace('                ', '        ').replace('                  ', '          ')
          lines[bun_index:next_index] = replacement.splitlines(keepends=True)
          workflow_path.write_text(''.join(lines))

          contract_path = Path('scripts/test-r4f-revision4-12-ledger-qualification-contract.sh')
          contract = contract_path.read_text()
          anchor = """grep -Fq 'supabase functions delete \"$PROOF_FUNCTION\"' \"$workflow\"

          for forbidden in \\
          """
          insertion = """grep -Fq 'supabase functions delete \"$PROOF_FUNCTION\"' \"$workflow\"

          test \"$(grep -Fxc '      - name: Set up Supabase CLI' \"$workflow\")\" -eq 1
          test \"$(grep -Fxc '      - name: Set up pinned Bun for proof prebundle' \"$workflow\")\" -eq 1
          test \"$(grep -Fxc '      - name: Bundle and deploy only isolated temporary revision-4 proof function' \"$workflow\")\" -eq 1
          supabase_setup_line=\"$(grep -n -F '      - name: Set up Supabase CLI' \"$workflow\" | cut -d: -f1)\"
          bun_setup_line=\"$(grep -n -F '      - name: Set up pinned Bun for proof prebundle' \"$workflow\" | cut -d: -f1)\"
          deploy_line=\"$(grep -n -F '      - name: Bundle and deploy only isolated temporary revision-4 proof function' \"$workflow\" | cut -d: -f1)\"
          test \"$supabase_setup_line\" -lt \"$bun_setup_line\"
          test \"$bun_setup_line\" -lt \"$deploy_line\"

          for forbidden in \\
          """
          if contract.count(anchor) != 1:
              raise SystemExit(f'expected exactly one contract insertion anchor, found {contract.count(anchor)}')
          contract_path.write_text(contract.replace(anchor, insertion, 1))

          Path('.github/workflows/temporary-r4f-bun-repin-patch.yml').unlink()
          PY

          bash scripts/test-r4f-revision4-12-ledger-qualification-contract.sh
          git diff --check

      - name: Commit exact fix to patch branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/r4f-revision4-12-ledger-qualification.yml \
                  scripts/test-r4f-revision4-12-ledger-qualification-contract.sh \
                  .github/workflows/temporary-r4f-bun-repin-patch.yml
          git diff --cached --check
          git commit -m 'Repin Bun after Supabase CLI setup'
          git push origin HEAD:agent/r4f-repin-bun-after-supabase-cli
