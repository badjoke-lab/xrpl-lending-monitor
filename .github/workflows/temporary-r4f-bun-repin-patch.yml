name: Temporary R4F Bun Repin Patch

on:
  push:
    branches:
      - agent/r4f-repin-bun-after-supabase-cli

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/agent/r4f-repin-bun-after-supabase-cli'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/r4f-repin-bun-after-supabase-cli
          fetch-depth: 1
          persist-credentials: false

      - name: Build and verify exact tool-order fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/r4f-revision4-12-ledger-qualification.yml')
          lines = workflow_path.read_text().splitlines(keepends=True)
          bun_marker = '      - name: Set up pinned Bun for proof prebundle\n'
          supabase_marker = '      - name: Set up Supabase CLI\n'
          next_marker = '      - name: Resolve exactly one elevated database API key\n'
          if lines.count(bun_marker) != 1 or lines.count(supabase_marker) != 1 or lines.count(next_marker) != 1:
              raise SystemExit('expected unique Bun, Supabase CLI, and following-step markers')
          bun_index = lines.index(bun_marker)
          supabase_index = lines.index(supabase_marker)
          next_index = lines.index(next_marker)
          if not (bun_index < supabase_index < next_index):
              raise SystemExit('unexpected pre-fix tool ordering')
          lines[bun_index:next_index] = [
              '      - name: Set up Supabase CLI\n',
              '        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf\n',
              '        with:\n',
              '          version: latest\n',
              '\n',
              '      - name: Set up pinned Bun for proof prebundle\n',
              '        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6\n',
              '        with:\n',
              '          bun-version: 1.3.14\n',
              '\n',
          ]
          workflow_path.write_text(''.join(lines))

          contract_path = Path('scripts/test-r4f-revision4-12-ledger-qualification-contract.sh')
          contract = contract_path.read_text()
          anchor = """grep -Fq 'supabase functions delete \"$PROOF_FUNCTION\"' \"$workflow\"

          for forbidden in \\
          """
          insertion = """grep -Fq 'supabase functions delete \"$PROOF_FUNCTION\"' \"$workflow\"

          test \"$(grep -Fxc '      - name: Set up Supabase CLI' \"$workflow\")\" -eq 1
          test \"$(grep -Fxc '      - name: Set up pinned Bun for proof prebundle' \"$workflow\")\" -eq 1
          test \"$(grep -Fxc '      - name: Bundle and deploy only isolated temporary revision-4 proof function' \"$workflow\")\" -eq 1
          supabase_setup_line=\"$(grep -n -F '      - name: Set up Supabase CLI' \"$workflow\" | cut -d: -f1)\"
          bun_setup_line=\"$(grep -n -F '      - name: Set up pinned Bun for proof prebundle' \"$workflow\" | cut -d: -f1)\"
          deploy_line=\"$(grep -n -F '      - name: Bundle and deploy only isolated temporary revision-4 proof function' \"$workflow\" | cut -d: -f1)\"
          test \"$supabase_setup_line\" -lt \"$bun_setup_line\"
          test \"$bun_setup_line\" -lt \"$deploy_line\"

          for forbidden in \\
          """
          if contract.count(anchor) != 1:
              raise SystemExit(f'expected exactly one contract insertion anchor, found {contract.count(anchor)}')
          contract_path.write_text(contract.replace(anchor, insertion, 1))
          PY

          bash scripts/test-r4f-revision4-12-ledger-qualification-contract.sh
          git diff --check
          test "$(git hash-object .github/workflows/r4f-revision4-12-ledger-qualification.yml)" = '8bcf65dadd7e7d114b2929603bd7ea8bb15cf0e8'
          test "$(git hash-object scripts/test-r4f-revision4-12-ledger-qualification-contract.sh)" = 'dc40dc0a023639b52540b09f538fe21fa60aa869'

      - name: Create detached verified Git commit object
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/r4f-revision4-12-ledger-qualification.yml'
          contract='scripts/test-r4f-revision4-12-ledger-qualification-contract.sh'
          helper='.github/workflows/temporary-r4f-bun-repin-patch.yml'

          encode() { base64 -w0 "$1"; }
          workflow_blob="$(jq -n --arg content "$(encode "$workflow")" '{content:$content,encoding:"base64"}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"
          contract_blob="$(jq -n --arg content "$(encode "$contract")" '{content:$content,encoding:"base64"}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"
          test "$workflow_blob" = '8bcf65dadd7e7d114b2929603bd7ea8bb15cf0e8'
          test "$contract_blob" = 'dc40dc0a023639b52540b09f538fe21fa60aa869'

          base_tree="$(git rev-parse HEAD^{tree})"
          jq -n \
            --arg base_tree "$base_tree" \
            --arg workflow_blob "$workflow_blob" \
            --arg contract_blob "$contract_blob" \
            --arg workflow "$workflow" \
            --arg contract "$contract" \
            --arg helper "$helper" \
            '{base_tree:$base_tree,tree:[
              {path:$workflow,mode:"100644",type:"blob",sha:$workflow_blob},
              {path:$contract,mode:"100755",type:"blob",sha:$contract_blob},
              {path:$helper,mode:"100644",type:"blob",sha:null}
            ]}' > /tmp/tree.json
          tree_sha="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" --input /tmp/tree.json --jq .sha)"

          jq -n --arg message 'Repin Bun after Supabase CLI setup' --arg tree "$tree_sha" --arg parent "$GITHUB_SHA" \
            '{message:$message,tree:$tree,parents:[$parent]}' > /tmp/commit.json
          commit_sha="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" --input /tmp/commit.json --jq .sha)"
          printf '%s\n' "$commit_sha" > /tmp/verified-commit-sha.txt
          printf 'workflow_blob=%s\ncontract_blob=%s\ntree=%s\ncommit=%s\n' "$workflow_blob" "$contract_blob" "$tree_sha" "$commit_sha" > /tmp/verified-git-objects.txt

      - name: Upload detached commit identity
        uses: actions/upload-artifact@v4
        with:
          name: r4f-bun-repin-detached-commit
          path: |
            /tmp/verified-commit-sha.txt
            /tmp/verified-git-objects.txt
          if-no-files-found: error
          retention-days: 1
