name: Current live Queue reseed

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: current-live-queue-reseed
  cancel-in-progress: false

env:
  QUALIFICATION_ISSUE: '995'
  QUEUE_ID: 2ae398f2edbf43749e45cd7ede77c6cd
  DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
  SCRIPT_NAME: xrpl-lending-monitor
  STALLED_LEDGER: '4086792'
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  reseed:
    if: >-
      github.event.issue.number == 995 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      github.event.comment.body == '/current-live-reseed'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Read live Current and choose action
        id: state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p current-live-reseed
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          d1="$api/d1/database/$DATABASE_ID/query"

          curl -fsS -H "$auth" "$api/queues/$QUEUE_ID" \
            | tee current-live-reseed/queue-before.json \
            | jq -e '.success == true and .result.settings.delivery_paused == false' >/dev/null
          curl -fsS -H "$auth" "$api/workers/scripts/$SCRIPT_NAME/deployments" \
            | tee current-live-reseed/deployments-before.json >/dev/null

          query() {
            local sql="$1"
            curl -fsS -X POST -H "$auth" -H 'Content-Type: application/json' "$d1" \
              --data "$(jq -cn --arg sql "$sql" '{sql:$sql}')"
          }

          query "SELECT last_processed_ledger,latest_observed_ledger,status,updated_at FROM fast_lane_shadow_state WHERE network='devnet'" \
            | tee current-live-reseed/fast-before.json >/dev/null
          query "SELECT COUNT(*) AS processing_count FROM fast_lane_queue_slots WHERE status='processing'" \
            | tee current-live-reseed/processing-before.json >/dev/null
          query "SELECT scheduled_time,status,next_scheduled_time,next_cron,error_message,updated_at FROM fast_lane_queue_slots ORDER BY scheduled_time DESC LIMIT 5" \
            | tee current-live-reseed/slots-before.json >/dev/null

          before="$(jq -r '.result[0].results[0].last_processed_ledger' current-live-reseed/fast-before.json)"
          observed="$(jq -r '.result[0].results[0].latest_observed_ledger' current-live-reseed/fast-before.json)"
          processing="$(jq -r '.result[0].results[0].processing_count' current-live-reseed/processing-before.json)"
          version="$(jq -r '.result.deployments[0].versions[0].version_id' current-live-reseed/deployments-before.json)"
          pct="$(jq -r '.result.deployments[0].versions[0].percentage' current-live-reseed/deployments-before.json)"
          test "$before" -ge "$STALLED_LEDGER"
          test "$pct" = 100

          target=$(( (( $(date +%s) + 90 + 59 ) / 60) * 60 * 1000 ))
          delay=$(( (target - $(date +%s%3N) + 999) / 1000 ))
          test "$delay" -ge 30
          test "$delay" -le 180

          if test "$before" -gt "$STALLED_LEDGER"; then
            seed_needed=false
          else
            seed_needed=true
          fi

          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "observed=$observed" >> "$GITHUB_OUTPUT"
          echo "processing=$processing" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "seed_needed=$seed_needed" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "delay=$delay" >> "$GITHUB_OUTPUT"

          echo "Current: $before / observed: $observed / processing slots: $processing"
          echo "Worker version: $version @ ${pct}%"
          echo "Seed needed: $seed_needed"
          jq '.result[0].results' current-live-reseed/slots-before.json

      - name: Send exactly one live catch-up seed
        if: steps.state.outputs.seed_needed == 'true'
        env:
          TARGET_SCHEDULED_TIME: ${{ steps.state.outputs.target }}
          DELAY_SECONDS: ${{ steps.state.outputs.delay }}
        shell: bash
        run: |
          set -euo pipefail
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues/${QUEUE_ID}"
          jq -n \
            --argjson scheduled "$TARGET_SCHEDULED_TIME" \
            --arg enqueuedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson delay "$DELAY_SECONDS" \
            '{body:{scheduledTime:$scheduled,cron:"queue-catch-up",enqueuedAt:$enqueuedAt},content_type:"json",delay_seconds:$delay}' \
            > current-live-reseed/request.json
          curl -fsS -X POST -H "$auth" -H 'Content-Type: application/json' "$base/messages" \
            --data-binary @current-live-reseed/request.json \
            | tee current-live-reseed/response.json \
            | jq -e '.success == true' >/dev/null
          echo "One live queue-catch-up seed sent."

      - name: Observe live Current
        env:
          BEFORE_LEDGER: ${{ steps.state.outputs.before }}
          DELAY_SECONDS: ${{ steps.state.outputs.delay }}
          SEED_NEEDED: ${{ steps.state.outputs.seed_needed }}
          TARGET_SCHEDULED_TIME: ${{ steps.state.outputs.target }}
        shell: bash
        run: |
          set -euo pipefail
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          d1="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query"
          query() {
            local sql="$1"
            curl -fsS -X POST -H "$auth" -H 'Content-Type: application/json' "$d1" \
              --data "$(jq -cn --arg sql "$sql" '{sql:$sql}')"
          }

          if test "$SEED_NEEDED" = true; then
            sleep $(( DELAY_SECONDS + 20 ))
          fi

          moved=false
          for attempt in 1 2 3 4; do
            query "SELECT last_processed_ledger,latest_observed_ledger,status,updated_at FROM fast_lane_shadow_state WHERE network='devnet'" \
              > current-live-reseed/fast-after-${attempt}.json
            after="$(jq -r '.result[0].results[0].last_processed_ledger' current-live-reseed/fast-after-${attempt}.json)"
            echo "Current observation $attempt: $BEFORE_LEDGER -> $after"
            if test "$after" -gt "$BEFORE_LEDGER" || { test "$SEED_NEEDED" = false && test "$after" -ge "$BEFORE_LEDGER"; }; then
              moved=true
              cp current-live-reseed/fast-after-${attempt}.json current-live-reseed/fast-after.json
              break
            fi
            sleep 20
          done

          query "SELECT scheduled_time,status,next_scheduled_time,next_cron,error_message,updated_at FROM fast_lane_queue_slots ORDER BY scheduled_time DESC LIMIT 5" \
            | tee current-live-reseed/slots-after.json >/dev/null
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues/${QUEUE_ID}" \
            | tee current-live-reseed/queue-after.json \
            | jq -e '.success == true and .result.settings.delivery_paused == false' >/dev/null

          after="$(jq -r '.result[0].results[0].last_processed_ledger' current-live-reseed/fast-after.json 2>/dev/null || echo "$BEFORE_LEDGER")"
          jq -n \
            --argjson before "$BEFORE_LEDGER" \
            --argjson after "$after" \
            --argjson seedSent "$(test "$SEED_NEEDED" = true && echo true || echo false)" \
            --argjson currentAdvanced "$(test "$after" -gt "$BEFORE_LEDGER" && echo true || echo false)" \
            '{seedSent:$seedSent,currentAdvanced:$currentAdvanced,before:$before,after:$after,queueDeliveryPaused:false}' \
            | tee current-live-reseed/result.json
          echo "Latest slots:"
          jq '.result[0].results' current-live-reseed/slots-after.json

          if test "$SEED_NEEDED" = true && test "$after" -le "$BEFORE_LEDGER"; then
            exit 1
          fi

      - name: Upload operational record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-live-reseed
          path: current-live-reseed
          if-no-files-found: warn
          retention-days: 30
