name: P0 ledger parser probe

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, 'P0 ledger parser probe')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Probe stuck ledger range
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/probe.mjs <<'NODE'
          const endpoints = [
            'https://devnet.honeycluster.io/',
            'https://s.devnet.rippletest.net:51234/',
          ]
          const start = 3637247
          const count = 32

          const isRecord = (value) => typeof value === 'object' && value !== null && !Array.isArray(value)
          const text = (value) => typeof value === 'string' && value.length > 0 ? value : null
          const integer = (value) => {
            const parsed = typeof value === 'string' && /^\d+$/.test(value) ? Number(value) : value
            return Number.isSafeInteger(parsed) && parsed >= 0 ? Number(parsed) : null
          }

          async function read(endpoint, ledgerIndex) {
            const controller = new AbortController()
            const timeout = setTimeout(() => controller.abort(), 12000)
            try {
              const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({
                  method: 'ledger',
                  params: [{
                    ledger_index: ledgerIndex,
                    transactions: true,
                    expand: true,
                    owner_funds: false,
                  }],
                }),
                signal: controller.signal,
              })
              const body = await response.json()
              return { httpStatus: response.status, body }
            } finally {
              clearTimeout(timeout)
            }
          }

          const report = { capturedAt: new Date().toISOString(), start, count, endpoints: [] }
          for (const endpoint of endpoints) {
            const result = { endpoint, ledgers: [], firstFailure: null }
            let previousHash = null
            for (let ledgerIndex = start; ledgerIndex < start + count; ledgerIndex += 1) {
              try {
                const { httpStatus, body } = await read(endpoint, ledgerIndex)
                const rpc = isRecord(body?.result) ? body.result : null
                const ledger = isRecord(rpc?.ledger) ? rpc.ledger : null
                const transactions = Array.isArray(ledger?.transactions) ? ledger.transactions : null
                const parseErrors = []
                if (httpStatus !== 200) parseErrors.push(`http_${httpStatus}`)
                if (!rpc) parseErrors.push('missing_result')
                if (rpc?.status === 'error' || rpc?.error) parseErrors.push(`rpc_${rpc?.error ?? 'error'}`)
                if (!ledger) parseErrors.push('missing_ledger')
                if (rpc?.validated !== true && ledger?.validated !== true) parseErrors.push('not_validated')
                if (integer(rpc?.ledger_index ?? ledger?.ledger_index ?? ledger?.seqNum) !== ledgerIndex) parseErrors.push('ledger_index_mismatch')
                const ledgerHash = text(rpc?.ledger_hash ?? ledger?.ledger_hash ?? ledger?.hash)
                const parentHash = text(ledger?.parent_hash ?? ledger?.parentHash)
                if (!ledgerHash) parseErrors.push('missing_ledger_hash')
                if (!parentHash) parseErrors.push('missing_parent_hash')
                if (previousHash && parentHash !== previousHash) parseErrors.push('parent_hash_mismatch')
                if (!transactions) {
                  parseErrors.push('missing_transactions')
                } else {
                  transactions.forEach((entry, index) => {
                    if (!isRecord(entry)) {
                      parseErrors.push(`tx_${index}_not_object`)
                      return
                    }
                    const tx = isRecord(entry.tx_json) ? entry.tx_json : isRecord(entry.tx) ? entry.tx : entry
                    const meta = isRecord(entry.meta) ? entry.meta : isRecord(entry.metaData) ? entry.metaData : isRecord(entry.meta_data) ? entry.meta_data : null
                    if (!meta) parseErrors.push(`tx_${index}_missing_metadata`)
                    if (!text(entry.hash ?? tx.hash)) parseErrors.push(`tx_${index}_missing_hash`)
                    if (!text(tx.TransactionType)) parseErrors.push(`tx_${index}_missing_transaction_type`)
                    if (!text(meta?.TransactionResult)) parseErrors.push(`tx_${index}_missing_transaction_result`)
                    if (integer(meta?.TransactionIndex) === null) parseErrors.push(`tx_${index}_missing_transaction_index`)
                  })
                }
                result.ledgers.push({
                  ledgerIndex,
                  transactionCount: transactions?.length ?? null,
                  parseErrors,
                })
                if (parseErrors.length && !result.firstFailure) {
                  result.firstFailure = { ledgerIndex, parseErrors }
                }
                if (ledgerHash) previousHash = ledgerHash
              } catch (error) {
                const message = error instanceof Error ? error.message : String(error)
                result.ledgers.push({ ledgerIndex, transactionCount: null, parseErrors: [message] })
                if (!result.firstFailure) result.firstFailure = { ledgerIndex, parseErrors: [message] }
              }
            }
            report.endpoints.push(result)
          }
          await import('node:fs').then(({ writeFileSync }) => writeFileSync('/tmp/report.json', JSON.stringify(report, null, 2)))
          NODE
          node /tmp/probe.mjs
          {
            echo 'P0 ledger parser probe result:'
            echo
            echo '```json'
            cat /tmp/report.json
            echo '```'
          } > /tmp/comment.md
          if [ -n "${ISSUE_NUMBER:-}" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body-file /tmp/comment.md
          else
            cat /tmp/comment.md
          fi
