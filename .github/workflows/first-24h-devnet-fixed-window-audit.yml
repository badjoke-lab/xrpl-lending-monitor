name: First 24-hour Devnet restart-safe audit

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Create one immutable anchor or audit all D1 history since that anchor
        required: true
        type: choice
        options:
          - start
          - audit
      start_run_id:
        description: Required for audit mode; reuse the original start workflow run ID on every retry
        required: false
        type: string
      confirm:
        description: Type START_FIXED_WINDOW or AUDIT_FIXED_WINDOW to match the selected mode
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: first-24h-devnet-restart-safe-${{ inputs.mode }}-${{ inputs.start_run_id || github.run_id }}
  cancel-in-progress: false

env:
  BASE_URL: https://xrpl-lending-monitor.badjoke-lab.workers.dev
  PRIMARY_RPC: https://devnet.honeycluster.io/
  FALLBACK_RPC: https://s.devnet.rippletest.net:51234/
  EXPECTED_EPOCH_ID: devnet-3371675
  EXPECTED_SNAPSHOT_ID: devnet-3592674-0373cda0b0cd
  EXPECTED_LEDGER_INDEX: '3592674'
  EXPECTED_LEDGER_HASH: 0373CDA0B0CD8486C0C55C5B5DD460501419367BD76D146E4A718EBD9DD8A893

jobs:
  reject_invalid_request:
    if: >-
      ${{
        (inputs.mode == 'start' && inputs.confirm != 'START_FIXED_WINDOW')
        || (inputs.mode == 'audit' && (inputs.confirm != 'AUDIT_FIXED_WINDOW' || inputs.start_run_id == ''))
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Refuse an ambiguous request
        run: |
          echo 'Use START_FIXED_WINDOW for start mode.'
          echo 'Use AUDIT_FIXED_WINDOW and the original start_run_id for audit mode.'
          exit 1

  start:
    if: ${{ inputs.mode == 'start' && inputs.confirm == 'START_FIXED_WINDOW' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OUTPUT_DIR: first-24h-soak-anchor
    steps:
      - uses: actions/checkout@v4
      - name: Establish the one immutable production anchor
        run: node scripts/run-first-24h-soak-segment.mjs start
      - name: Publish immutable anchor
        uses: actions/upload-artifact@v4
        with:
          name: first-24h-soak-anchor
          path: first-24h-soak-anchor
          if-no-files-found: error
          retention-days: 30
      - name: Publish start instructions
        run: |
          {
            echo '# Restart-safe 24-hour soak anchor created'
            echo
            echo "- Start workflow run ID: **${GITHUB_RUN_ID}**"
            echo "- Immutable anchor: **$(jq -r '.t0Iso' first-24h-soak-anchor/start.json)**"
            echo "- Initial audit eligibility: **$(jq -r '.expectedEndIso' first-24h-soak-anchor/start.json)**"
            echo '- Every audit retry must use this same start workflow run ID.'
            echo '- A monitor or audit failure never creates a replacement anchor.'
            echo '- A real D1 discontinuity is handled by automatically selecting the first later continuous 24-hour sequence.'
          } >> "$GITHUB_STEP_SUMMARY"

  audit:
    if: >-
      ${{
        inputs.mode == 'audit'
        && inputs.confirm == 'AUDIT_FIXED_WINDOW'
        && inputs.start_run_id != ''
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      START_PATH: first-24h-soak-anchor/start.json
      OUTPUT_DIR: first-24h-soak-audit
      METRICS_PATH: first-24h-soak-audit/metrics.json
    steps:
      - uses: actions/checkout@v4
      - name: Download the original immutable anchor
        uses: actions/download-artifact@v4
        with:
          name: first-24h-soak-anchor
          path: first-24h-soak-anchor
          run-id: ${{ inputs.start_run_id }}
          github-token: ${{ github.token }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read all exact D1 execution history since the anchor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          T0="$(jq -r '.t0Iso' "$START_PATH")"
          pnpm exec wrangler d1 execute xrpl-lending-monitor --remote \
            --command "SELECT run_at,status,start_ledger_index,end_ledger_index,latest_observed_ledger,lag_ledgers,ledgers_processed,lending_transactions,coalesced_object_rows,persistence_rows_read,persistence_rows_written FROM fast_lane_shadow_run_metrics WHERE network='devnet' AND run_at >= '$T0' ORDER BY run_at ASC;" \
            --json > "$OUTPUT_DIR/metrics-raw.txt"
          sed -n '/^\[/,$p' "$OUTPUT_DIR/metrics-raw.txt" > "$METRICS_PATH"
          jq -e 'type == "array"' "$METRICS_PATH" >/dev/null
      - name: Audit continuity without resetting the anchor
        run: node scripts/audit-fixed-soak-window.mjs
      - name: Publish audit summary
        if: always()
        run: |
          if [ -f "$OUTPUT_DIR/result.md" ]; then cat "$OUTPUT_DIR/result.md" >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f "$OUTPUT_DIR/fatal-error.json" ]; then cat "$OUTPUT_DIR/fatal-error.json" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Publish audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-24h-soak-audit-${{ inputs.start_run_id }}
          path: first-24h-soak-audit
          if-no-files-found: error
          retention-days: 30
