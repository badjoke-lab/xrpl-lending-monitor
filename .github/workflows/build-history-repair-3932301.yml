name: Build immutable history repair 3932301

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/build-history-repair-3932301.yml

permissions:
  contents: write

concurrency:
  group: build-immutable-history-repair-3932301
  cancel-in-progress: false

env:
  TARGET_LEDGER: '3932301'
  TARGET_HASH: 7D026FED85BCA2BDCFE450A0F3537707A43B4D08E1D2AE57AFBC54D88EBE1828
  SOURCE_LEDGER: '3800885'
  CANDIDATE_BRANCH: history-repair-3932301-data

jobs:
  build-publish-rehearse:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out implementation
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check out active production history
        uses: actions/checkout@v4
        with:
          ref: history-data
          path: .local/history-root
          sparse-checkout: history
          sparse-checkout-cone-mode: true

      - name: Check out active production current state
        uses: actions/checkout@v4
        with:
          ref: current-state-data
          path: .local/current-state
          sparse-checkout: read-model/manifest.json
          sparse-checkout-cone-mode: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build immutable-history tools
        run: |
          pnpm build:history-extension-plan
          pnpm build:history-segment
          pnpm build:history-segment-checkpoint
          pnpm build:history-extension-artifacts
          pnpm build:history-segment-chain
          pnpm build:extended-history-publication
          pnpm build:history-exact-index
          pnpm build:history-segment-channel
          pnpm build:candidate-source-rehearsal
          cp .history-segment-channel-build/build-history-segment-channel.mjs /tmp/build-history-segment-channel.mjs
          cp .candidate-source-rehearsal-build/rehearse-candidate-sources.mjs /tmp/rehearse-candidate-sources.mjs

      - name: Validate fixed repair boundary
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/history-repair-evidence
          mkdir -p /tmp/history-repair-evidence
          PUBLICATION=.local/history-root/history/publication.json
          CURRENT=.local/current-state/read-model/manifest.json
          test "$(jq -r '.endLedgerIndex' "$PUBLICATION")" = "$SOURCE_LEDGER"
          test "$(jq -r '.ledgerIndex' "$CURRENT")" = "$TARGET_LEDGER"
          test "$(jq -r '.ledgerHash' "$CURRENT")" = "$TARGET_HASH"
          test "$(jq -r '.epochId' "$PUBLICATION")" = "$(jq -r '.epochId' "$CURRENT")"
          jq -e --argjson ledger "$TARGET_LEDGER" --arg hash "$TARGET_HASH" '
            .complete == true and .ledgerIndex == $ledger and .ledgerHash == $hash
          ' "$CURRENT" >/dev/null
          jq -e --argjson source "$SOURCE_LEDGER" '
            .complete == true and .endLedgerIndex == $source and .exactIndex.manifestPath == "history/index/exact/manifest.json"
          ' "$PUBLICATION" >/dev/null
          jq -e --argjson ledger "$TARGET_LEDGER" --arg hash "$TARGET_HASH" '
            .vars.APP_NETWORK == "devnet"
            and .vars.MAINNET_ENABLED == "false"
            and .vars.REPLACEMENT_BASE_LEDGER_INDEX == ($ledger | tostring)
            and .vars.REPLACEMENT_BASE_LEDGER_HASH == $hash
            and .vars.CURRENT_STATE_REPLACEMENT_SNAPSHOT_ID == "devnet-3932301-7d026fed85bc"
            and .triggers.crons == ["*/5 * * * *"]
          ' wrangler.jsonc >/dev/null
          cp "$PUBLICATION" /tmp/history-repair-evidence/source-publication.json
          cp "$CURRENT" /tmp/history-repair-evidence/target-current-state.json

      - name: Build fixed history-extension plan
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/history-repair-evidence
          node .history-extension-plan-build/plan-history-extension.mjs \
            --local \
            --publication .local/history-root/history/publication.json \
            --target-ledger "$TARGET_LEDGER" \
            --target-ledger-hash "$TARGET_HASH" \
            --segment-ledgers 500 \
            --checkpoint-every-segments 10 \
            --output "$ROOT/plan.json" \
            > "$ROOT/plan.stdout.json"
          jq -e --argjson source "$SOURCE_LEDGER" --argjson target "$TARGET_LEDGER" '
            .source.endLedgerIndex == $source
            and .extension.startLedgerIndex == ($source + 1)
            and .extension.endLedgerIndex == $target
            and .target.ledgerIndex == $target
            and .extension.ledgerCount == ($target - $source)
            and .extension.segmentCount > 0
          ' "$ROOT/plan.json" >/dev/null

      - name: Generate and checkpoint immutable-history delta
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/history-repair-evidence
          PLAN="$ROOT/plan.json"
          EPOCH="$(jq -r '.epochId' "$PLAN")"
          RANGE_START="$(jq -r '.extension.startLedgerIndex' "$PLAN")"
          RANGE_END="$(jq -r '.extension.endLedgerIndex' "$PLAN")"
          ANCHOR_ID="$(jq -r '.extension.anchorPreviousSegmentId' "$PLAN")"
          ANCHOR_HASH="$(jq -r '.extension.anchorPreviousSegmentEndHash' "$PLAN")"
          CHECKPOINT="$ROOT/checkpoint.json"
          PREV_ID="$ANCHOR_ID"
          PREV_HASH="$ANCHOR_HASH"
          : > "$ROOT/manifest-paths.txt"
          : > "$ROOT/segment-metrics.ndjson"
          STARTED="$(date +%s)"

          while IFS= read -r SEGMENT; do
            ORDINAL="$(jq -r '.ordinal' <<<"$SEGMENT")"
            SEGMENT_ID="$(jq -r '.segmentId' <<<"$SEGMENT")"
            START="$(jq -r '.startLedgerIndex' <<<"$SEGMENT")"
            END="$(jq -r '.endLedgerIndex' <<<"$SEGMENT")"
            OUT=".local/history-root/history/${EPOCH}/${SEGMENT_ID}"
            PASSED=false
            ATTEMPTS=0
            SEGMENT_STARTED="$(date +%s)"
            for ATTEMPT in 1 2 3 4; do
              ATTEMPTS="$ATTEMPT"
              rm -rf "$OUT"
              if node .history-segment-build/run-history-segment.mjs \
                --local \
                --endpoint https://devnet.honeycluster.io/ \
                --timeout-ms 12000 \
                --start-ledger "$START" \
                --end-ledger "$END" \
                --epoch-id "$EPOCH" \
                --segment-id "$SEGMENT_ID" \
                --previous-segment-id "$PREV_ID" \
                --previous-segment-end-hash "$PREV_HASH" \
                --source-revision "$GITHUB_SHA" \
                --output-dir "$OUT" \
                > "$ROOT/segment-${ORDINAL}.stdout.json"; then
                PASSED=true
                break
              fi
              sleep "$((ATTEMPT * 10))"
            done
            test "$PASSED" = true

            node .history-segment-checkpoint-build/update-history-segment-checkpoint.mjs \
              --local \
              --checkpoint "$CHECKPOINT" \
              --manifest "$OUT/manifest.json" \
              --epoch-id "$EPOCH" \
              --range-start-ledger "$RANGE_START" \
              --range-end-ledger "$RANGE_END" \
              --previous-segment-id "$ANCHOR_ID" \
              --previous-segment-end-hash "$ANCHOR_HASH" \
              > "$ROOT/checkpoint-${ORDINAL}.stdout.json"

            jq -nc \
              --argjson ordinal "$ORDINAL" \
              --arg segmentId "$SEGMENT_ID" \
              --argjson startLedgerIndex "$START" \
              --argjson endLedgerIndex "$END" \
              --argjson attempts "$ATTEMPTS" \
              --argjson elapsedSeconds "$(( $(date +%s) - SEGMENT_STARTED ))" \
              --argjson records "$(jq '[.files[].records] | add' "$OUT/manifest.json")" \
              '{ordinal:$ordinal,segmentId:$segmentId,startLedgerIndex:$startLedgerIndex,endLedgerIndex:$endLedgerIndex,attempts:$attempts,elapsedSeconds:$elapsedSeconds,totalRecords:$records}' \
              >> "$ROOT/segment-metrics.ndjson"

            printf '%s\n' "$OUT/manifest.json" >> "$ROOT/manifest-paths.txt"
            PREV_ID="$SEGMENT_ID"
            PREV_HASH="$(jq -r '.endLedgerHash' "$OUT/manifest.json")"
          done < <(jq -c '.extension.segments[]' "$PLAN")

          printf '%s\n' "$(( $(date +%s) - STARTED ))" > "$ROOT/delta-elapsed-seconds.txt"
          EXPECTED="$(jq -r '.extension.segmentCount' "$PLAN")"
          jq -e --argjson end "$RANGE_END" --argjson count "$EXPECTED" '
            .nextLedgerIndex == ($end + 1) and (.completedSegments | length) == $count
          ' "$CHECKPOINT" >/dev/null
          jq -s '.' "$ROOT/segment-metrics.ndjson" > "$ROOT/segment-metrics.json"

      - name: Verify delta and build aligned publication
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/history-repair-evidence
          PLAN="$ROOT/plan.json"
          MANIFEST_ARGS=()
          while IFS= read -r MANIFEST; do MANIFEST_ARGS+=(--manifest "$MANIFEST"); done < "$ROOT/manifest-paths.txt"

          node .history-extension-artifacts-build/verify-history-extension-artifacts.mjs \
            --local --plan "$PLAN" "${MANIFEST_ARGS[@]}" \
            > "$ROOT/plan-bound-summary.json"
          node .history-segment-chain-build/verify-history-segment-chain.mjs \
            --local \
            "${MANIFEST_ARGS[@]}" \
            --epoch-id "$(jq -r '.epochId' "$PLAN")" \
            --start-ledger "$(jq -r '.extension.startLedgerIndex' "$PLAN")" \
            --start-parent-hash "$(jq -r '.source.endLedgerHash' "$PLAN")" \
            --previous-segment-id "$(jq -r '.source.lastSegmentId' "$PLAN")" \
            --previous-segment-end-hash "$(jq -r '.source.endLedgerHash' "$PLAN")" \
            --end-ledger "$TARGET_LEDGER" \
            --end-ledger-hash "$TARGET_HASH" \
            > "$ROOT/chain-summary.json"

          node .extended-history-publication-build/build-extended-history-publication.mjs \
            --local \
            --source-publication .local/history-root/history/publication.json \
            --plan "$PLAN" \
            "${MANIFEST_ARGS[@]}" \
            --chain-id "canonical-devnet-3371676-${TARGET_LEDGER}" \
            --source-revision "$GITHUB_SHA" \
            --output "$ROOT/publication.json" \
            > "$ROOT/publication.stdout.json"
          cp "$ROOT/publication.json" .local/history-root/history/publication.json
          jq -e --argjson ledger "$TARGET_LEDGER" --arg hash "$TARGET_HASH" '
            .complete == true and .endLedgerIndex == $ledger and .endLedgerHash == $hash
          ' .local/history-root/history/publication.json >/dev/null

      - name: Rebuild complete exact history index
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/history-repair-evidence
          STARTED="$(date +%s)"
          node .history-exact-index-build/build-history-exact-index.mjs \
            --local \
            --publication .local/history-root/history/publication.json \
            --artifact-root .local/history-root \
            --output-dir .local/history-root/history/index/exact \
            --asset-prefix history/index/exact \
            --bucket-count 256 \
            --source-revision "$GITHUB_SHA" \
            > "$ROOT/exact-index.stdout.json"
          printf '%s\n' "$(( $(date +%s) - STARTED ))" > "$ROOT/exact-index-elapsed-seconds.txt"
          cp .local/history-root/history/index/exact/manifest.json "$ROOT/exact-index-manifest.json"
          jq -e '.complete == true and .bucketCount == 256 and .totalRecords > 0' "$ROOT/exact-index-manifest.json" >/dev/null

      - name: Publish guarded history candidate branch
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/history-repair-evidence
          rm -rf /tmp/history-repair-candidate
          mkdir -p /tmp/history-repair-candidate
          cp -R .local/history-root/history /tmp/history-repair-candidate/history

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout --orphan history-repair-publish
          git rm -rf . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R /tmp/history-repair-candidate/. .
          git add history
          git commit -m 'Publish immutable history repair through ledger 3932301'
          DATA_SHA="$(git rev-parse HEAD)"
          node /tmp/build-history-segment-channel.mjs \
            --local \
            --publication history/publication.json \
            --publication-path history/publication.json \
            --exact-index-manifest history/index/exact/manifest.json \
            --exact-index-manifest-path history/index/exact/manifest.json \
            --data-commit-sha "$DATA_SHA" \
            --output history-channel.json
          git add history-channel.json
          git commit -m 'Activate immutable history repair candidate'
          git push --force origin "HEAD:refs/heads/${CANDIDATE_BRANCH}"
          git rev-parse HEAD > "$ROOT/candidate-commit-sha.txt"

      - name: Rehearse remote aligned candidate pair
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/history-repair-evidence
          node /tmp/rehearse-candidate-sources.mjs \
            --local \
            --repository badjoke-lab/xrpl-lending-monitor \
            --history-branch "$CANDIDATE_BRANCH" \
            --current-state-branch current-state-data \
            > "$ROOT/remote-rehearsal-summary.json"
          jq -e --argjson ledger "$TARGET_LEDGER" --arg hash "$TARGET_HASH" '
            .passed == true
            and .ledgerIndex == $ledger
            and .ledgerHash == $hash
            and (.exactReads | length) == 3
          ' "$ROOT/remote-rehearsal-summary.json" >/dev/null

      - name: Build retained repair evidence
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/history-repair-evidence
          jq -n \
            --slurpfile plan "$ROOT/plan.json" \
            --slurpfile publication "$ROOT/publication.json" \
            --slurpfile exact "$ROOT/exact-index-manifest.json" \
            --slurpfile remote "$ROOT/remote-rehearsal-summary.json" \
            --slurpfile segments "$ROOT/segment-metrics.json" \
            --arg candidateBranch "$CANDIDATE_BRANCH" \
            --arg candidateCommitSha "$(cat "$ROOT/candidate-commit-sha.txt")" \
            --argjson deltaElapsedSeconds "$(cat "$ROOT/delta-elapsed-seconds.txt")" \
            --argjson exactIndexElapsedSeconds "$(cat "$ROOT/exact-index-elapsed-seconds.txt")" '
            {
              passed: true,
              source: $plan[0].source,
              extension: ($plan[0].extension + {elapsedSeconds:$deltaElapsedSeconds,segments:$segments[0]}),
              target: {
                ledgerIndex: $publication[0].endLedgerIndex,
                ledgerHash: $publication[0].endLedgerHash,
                publicationSha256: $publication[0].publicationSha256,
                chainId: $publication[0].chainId
              },
              exactIndex: {
                manifestSha256: $exact[0].manifestSha256,
                totalRecords: $exact[0].totalRecords,
                elapsedSeconds: $exactIndexElapsedSeconds
              },
              candidate: {branch:$candidateBranch,commitSha:$candidateCommitSha},
              remoteRehearsal: $remote[0]
            }
          ' > "$ROOT/evidence.json"
          jq -e --argjson ledger "$TARGET_LEDGER" --arg hash "$TARGET_HASH" '
            .passed == true
            and .target.ledgerIndex == $ledger
            and .target.ledgerHash == $hash
            and .remoteRehearsal.passed == true
            and .remoteRehearsal.ledgerIndex == $ledger
            and .remoteRehearsal.ledgerHash == $hash
          ' "$ROOT/evidence.json" >/dev/null

      - name: Upload immutable-history repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immutable-history-repair-3932301
          path: /tmp/history-repair-evidence
          if-no-files-found: warn
          retention-days: 30
