name: D4 unattended bounded Current checkpoint update

# An owner opt-in persists across days: /d4-auto-enable on Issue #1736.
# To stop, owner posts /d4-auto-disable. Disabled by default.
# First cutover and any checkpoint promotion are production mutations.
on:
  schedule:
    - cron: '23 1,5,9,13,17,21 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/db-less-d4-unattended-update.yml'
      - 'scripts/db-less-d4-auto-decision.mjs'
      - 'scripts/db-less-d4-auto-decision.test.mjs'

permissions:
  contents: read

concurrency:
  group: db-less-d4-current-overlay-activation
  cancel-in-progress: false

jobs:
  policy-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/db-less-d4-auto-decision.test.mjs

  update-checkpoint:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
      issues: read
    env:
      GH_TOKEN: ${{ github.token }}
      D3_TAG: db-less-live-channel-candidate-v1
      D4_TAG: db-less-current-overlay-channel-v1
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check persistent owner authorization (disabled by default)
        id: optin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .local/d4-auto
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/1736/comments?per_page=100" > .local/d4-auto/owner-comments.json
          jq -sr --arg owner "$GITHUB_REPOSITORY_OWNER" '
            [.[][] | select(.user.login == $owner) |
              (.body // "") | select(. == "/d4-auto-enable" or . == "/d4-auto-disable")] |
              last // "/d4-auto-disable"
          ' .local/d4-auto/owner-comments.json > .local/d4-auto/permission.json
          approval="$(jq -er '.' .local/d4-auto/permission.json)"
          if [ "$approval" != '/d4-auto-enable' ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "D4 auto-update is disabled. No read/write of production assets."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "One-time owner opt-in is active. Bounded policy evaluation follows."
          fi

      - name: Inspect exact D3 and D4 channel health and maintenance demand
        if: steps.optin.outputs.enabled == 'true'
        id: assess
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$D3_TAG" > .local/d4-auto/d3-release.json
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$D4_TAG" > .local/d4-auto/d4-release.json
          jq -er '.body | fromjson' .local/d4-auto/d3-release.json > .local/d4-auto/d3.json
          jq -er '.body | fromjson' .local/d4-auto/d4-release.json > .local/d4-auto/d4.json
          for name in d3 d4; do
            test "$(jq -er '.draft' .local/d4-auto/$name-release.json)" = false
            test "$(jq -er '.prerelease' .local/d4-auto/$name-release.json)" = true
          done
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs'
          import {decideDbLessD4AutoUpdate} from './scripts/db-less-d4-auto-decision.mjs'
          const d3=JSON.parse(readFileSync('.local/d4-auto/d3.json','utf8'))
          const d4=JSON.parse(readFileSync('.local/d4-auto/d4.json','utf8'))
          const status=decideDbLessD4AutoUpdate({d3,d4,nowMs:Date.now()})
          writeFileSync('.local/d4-auto/decision.json',JSON.stringify(status,null,2)+'\n')
          process.stdout.write(JSON.stringify(status,null,2)+'\n')
          NODE
          cat .local/d4-auto/decision.json >> "$GITHUB_STEP_SUMMARY"
          echo "should_build=$(jq -er '.shouldBuild' .local/d4-auto/decision.json)" >> "$GITHUB_OUTPUT"
          echo "expected_d3_sha=$(jq -er '.frozenD3ChannelSha256' .local/d4-auto/decision.json)" >> "$GITHUB_OUTPUT"
          echo "expected_d4_sha=$(jq -er '.frozenD4ChannelSha256' .local/d4-auto/decision.json)" >> "$GITHUB_OUTPUT"
          echo "d3_head=$(jq -er '.d3Head' .local/d4-auto/decision.json)" >> "$GITHUB_OUTPUT"
          echo "d4_head=$(jq -er '.d4Head' .local/d4-auto/decision.json)" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        if: steps.assess.outputs.should_build == 'true'
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build existing production-proven v2 D4 publisher and checkpoint CLIs
        if: steps.assess.outputs.should_build == 'true'
        run: |
          pnpm build:db-less-current-overlay-checkpoint
          pnpm build:db-less-current-overlay-publisher

      - name: Build exact-source incremental checkpoint and verify full state
        if: steps.assess.outputs.should_build == 'true'
        run: >-
          node .db-less-current-overlay-checkpoint-build/build-db-less-current-overlay-checkpoint.mjs
          --local
          --repository "$GITHUB_REPOSITORY"
          --channel-release-tag "$D3_TAG"
          --expected-channel-sha256 "${{ steps.assess.outputs.expected_d3_sha }}"
          --active-overlay-channel-release-tag "$D4_TAG"
          --max-generations 2048
          --bucket-count 256
          --max-records-per-shard 50000
          --max-bytes-per-shard 2000000
          --output-dir .local/d4-auto

      - name: Verify source, bounded bytes, exact state and frozen D4 seed
        if: steps.assess.outputs.should_build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          summary=.local/d4-auto/rehearsal-summary.json
          test "$(jq -er '.mode' "$summary")" = incremental
          test "$(jq -er '.channelSha256' "$summary")" = "${{ steps.assess.outputs.expected_d3_sha }}"
          test "$(jq -er '.throughLedgerIndex' "$summary")" = "${{ steps.assess.outputs.d3_head }}"
          test "$(jq -er '.seedThroughLedgerIndex' "$summary")" = "${{ steps.assess.outputs.d4_head }}"
          test "$(jq -er '.manifestSchemaVersion' "$summary")" = 2
          test "$(jq -er '.equivalence.equivalent' "$summary")" = true
          test "$(jq -er '.equivalence.sourceStateSha256' "$summary")" = "$(jq -er '.equivalence.checkpointStateSha256' "$summary")"
          test "$(jq -er '.traversedIncrementalManifests' "$summary")" = "$(jq -er '.incrementalGenerationCount' "$summary")"
          test "$(jq -er '.seedShardReads' "$summary")" = 256
          jq -e '
            .shards | length > 0 and length <= 256 and
            (map(.bytes) | all(. > 0 and . <= 2000000)) and
            (map(.bytes) | add <= 450000000)
          ' ".local/d4-auto/$(jq -er '.manifestKey' "$summary")" > /dev/null

      - name: Recheck owner opt-in and source before ANY immutable write
        if: steps.assess.outputs.should_build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/1736/comments?per_page=100" > .local/d4-auto/owner-comments-before-write.json
          command="$(jq -sr --arg owner "$GITHUB_REPOSITORY_OWNER" '
            [.[][] | select(.user.login == $owner) |
              (.body // "") | select(. == "/d4-auto-enable" or . == "/d4-auto-disable")] |
              last // "/d4-auto-disable"
          ' .local/d4-auto/owner-comments-before-write.json)"
          test "$command" = "/d4-auto-enable"
          latest_d4="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$D4_TAG" --jq '.body' | jq -er '.channelSha256')"
          test "$latest_d4" = "${{ steps.assess.outputs.expected_d4_sha }}"
          latest_d3="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$D3_TAG" --jq '.body')"
          jq -e --argjson head "${{ steps.assess.outputs.d3_head }}" '
            . | fromjson | .lastCommittedLedgerIndex >= $head
          ' <<< "$latest_d3" > /dev/null
          # Publisher independently rechecks Current tail coverage just
          # before CAS activation, after uploading immutable assets.
          echo "No other D4 writer; exact source and owner opt-in still valid."

      - name: Resolve immutable checkpoint and D4 channel releases
        if: steps.assess.outputs.should_build == 'true'
        id: release
        shell: bash
        run: |
          set -euo pipefail
          through="$(jq -er '.throughLedgerIndex' .local/d4-auto/rehearsal-summary.json)"
          tag="db-less-current-overlay-v1-$through"
          echo "checkpoint_tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
            test "$(jq -er '.draft' <<< "$json")" = false
            test "$(jq -er '.prerelease' <<< "$json")" = true
          else
            gh release create "$tag" --target "$(git rev-parse HEAD)"               --prerelease --latest=false               --title "D4 Current overlay checkpoint $through"               --notes "Immutable D4 Current checkpoint, produced under owner-enabled bounded automatic maintenance."
          fi

      - name: Publish bounded immutable assets then atomically activate Current pointer
        if: steps.assess.outputs.should_build == 'true'
        run: >-
          node .db-less-current-overlay-publisher-build/publish-db-less-current-overlay-checkpoint.mjs
          --local
          --repository "$GITHUB_REPOSITORY"
          --input-dir .local/d4-auto
          --checkpoint-release-tag "${{ steps.release.outputs.checkpoint_tag }}"
          --channel-release-tag "$D4_TAG"
          --updated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          --output .local/d4-auto/publication-summary.json

      - name: Verify newly activated D4 readback
        if: steps.assess.outputs.should_build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          summary=.local/d4-auto/publication-summary.json
          published_sha="$(jq -er '.channelSha256' "$summary")"
          published_ledger="$(jq -er '.throughLedgerIndex' "$summary")"
          current="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$D4_TAG" --jq '.body')"
          test "$(jq -er '.channelSha256' <<< "$current")" = "$published_sha"
          test "$(jq -er '.active.throughLedgerIndex' <<< "$current")" = "$published_ledger"
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$D3_TAG" --jq '.body')"
          jq -e --argjson through "$published_ledger" '
            . | fromjson | .currentProjectionTail.coverageStartLedgerIndex <= $through
          ' <<< "$latest" >/dev/null
          echo "D4 AUTO UPDATE VERIFIED to ledger $published_ledger" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain small nonsecret operational evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-less-d4-unattended-maintenance
          path: |
            .local/d4-auto/decision.json
            .local/d4-auto/rehearsal-summary.json
            .local/d4-auto/publication-summary.json
          if-no-files-found: ignore
          retention-days: 7
