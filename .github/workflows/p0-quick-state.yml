name: P0 quick public state
# refresh: 2026-07-14T02:47:51+09:00
on:
  push:
    branches: [ops/p0-direct-recovery]
    paths: [.github/workflows/p0-quick-state.yml]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsS --retry 3 https://xrpl-lending-monitor.badjoke-lab.workers.dev/api/overview > overview.json
          curl -fsS --retry 3 -H 'content-type: application/json' --data '{"method":"ledger","params":[{"ledger_index":"validated","transactions":false,"expand":false,"api_version":2}]}' https://devnet.honeycluster.io/ > head.json
          jq -n --slurpfile overview overview.json --slurpfile head head.json '{capturedAt:(now|todateiso8601),overview:$overview[0],head:$head[0]}' > result.json
          content=$(base64 -w0 result.json)
          api="repos/${GITHUB_REPOSITORY}/contents/.github/p0-quick-state-result.json"
          sha=$(gh api "$api?ref=ops/p0-direct-recovery" --jq .sha)
          gh api --method PUT "$api" -f message='Update quick public production state' -f content="$content" -f sha="$sha" -f branch='ops/p0-direct-recovery' >/dev/null
