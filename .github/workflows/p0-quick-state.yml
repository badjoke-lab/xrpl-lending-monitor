name: P0 quick state
# refresh: 2
on:
  push:
    branches: [ops/p0-direct-recovery]
    paths: [.github/workflows/p0-quick-state.yml]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler d1 execute xrpl-lending-monitor --remote --command "SELECT * FROM fast_lane_shadow_state WHERE network='devnet'; SELECT * FROM fast_lane_shadow_run_metrics WHERE network='devnet' ORDER BY run_at DESC LIMIT 12;" --json > state.json
          curl -sS -H 'content-type: application/json' --data '{"method":"ledger","params":[{"ledger_index":"validated","transactions":false,"expand":false,"api_version":2}]}' https://devnet.honeycluster.io/ > head.json
          jq -n --slurpfile state state.json --slurpfile head head.json '{capturedAt:(now|todateiso8601),d1:$state,head:$head}' > result.json
          CONTENT=$(base64 -w0 result.json)
          API="repos/${GITHUB_REPOSITORY}/contents/.github/p0-quick-state-result.json"
          SHA=$(gh api "$API?ref=ops/p0-direct-recovery" --jq .sha 2>/dev/null || true)
          if [ -n "$SHA" ]; then gh api --method PUT "$API" -f message='Update quick production state' -f content="$CONTENT" -f sha="$SHA" -f branch='ops/p0-direct-recovery' >/dev/null; else gh api --method PUT "$API" -f message='Create quick production state' -f content="$CONTENT" -f branch='ops/p0-direct-recovery' >/dev/null; fi
