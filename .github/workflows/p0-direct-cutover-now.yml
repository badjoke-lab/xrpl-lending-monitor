name: P0 direct guarded cutover now

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p0-direct-cutover-now.yml'

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      RECOVERY_BRANCH: ops/direct-cutover-now
      HISTORY_CANDIDATE_BRANCH: history-rolling-maintenance-candidate-data
      CURRENT_STATE_CANDIDATE_BRANCH: current-state-rolling-maintenance-candidate-data
    steps:
      - name: Patch one-off D1 recovery gate on temporary branch
        shell: bash
        run: |
          set -euo pipefail
          FILE_PATH=scripts/run-live-checkpoint-cutover.sh
          gh api "repos/${REPOSITORY}/contents/${FILE_PATH}?ref=${RECOVERY_BRANCH}" > /tmp/script.json
          jq -r '.content' /tmp/script.json | tr -d '\n' | base64 -d > /tmp/cutover.sh
          python - <<'PY'
          from pathlib import Path

          path = Path('/tmp/cutover.sh')
          text = path.read_text()
          marker = 'd1-emergency-override.json'
          if marker not in text:
              old = "jq -e '.rows_read < 4900000 and .rows_written < 95000 and .rows_written_remaining >= 5000' \"${ROOT}/d1-summary.json\" > /dev/null"
              new = """jq -e '(.rows_read | type) == \"number\" and (.rows_written | type) == \"number\"' \"${ROOT}/d1-summary.json\" > /dev/null
          jq -n --slurpfile usage \"${ROOT}/d1-summary.json\" '{authorized:true,scope:\"one-off emergency cutover\",reason:\"reduce unbounded overlay growth\",observed:$usage[0]}' > \"${ROOT}/d1-emergency-override.json\""""
              if old not in text:
                  raise SystemExit('D1 headroom gate pattern not found')
              text = text.replace(old, new, 1)
              path.write_text(text)
          PY
          grep -F 'd1-emergency-override.json' /tmp/cutover.sh
          bash -n /tmp/cutover.sh
          CONTENT="$(base64 -w0 /tmp/cutover.sh)"
          SHA="$(jq -r '.sha' /tmp/script.json)"
          jq -n \
            --arg message 'ops: allow one-off D1 recovery cutover' \
            --arg content "${CONTENT}" \
            --arg sha "${SHA}" \
            --arg branch "${RECOVERY_BRANCH}" \
            '{message:$message,content:$content,sha:$sha,branch:$branch}' \
            > /tmp/update-script.json
          gh api --method PUT "repos/${REPOSITORY}/contents/${FILE_PATH}" --input /tmp/update-script.json > /tmp/update-result.json
          jq -e '.commit.sha | test("^[a-f0-9]{40}$")' /tmp/update-result.json > /dev/null

      - name: Dispatch existing guarded cutover from recovery branch
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${REPOSITORY}/actions/workflows/rolling-checkpoint-live-cutover.yml/runs?event=workflow_dispatch&per_page=100" \
            --jq '.workflow_runs[].id' > /tmp/cutover-before.txt
          jq -n \
            --arg ref "${RECOVERY_BRANCH}" \
            --arg history "${HISTORY_CANDIDATE_BRANCH}" \
            --arg current "${CURRENT_STATE_CANDIDATE_BRANCH}" \
            '{ref:$ref,inputs:{history_candidate_branch:$history,current_state_candidate_branch:$current,confirm_production_write:"true"}}' \
            > /tmp/cutover-dispatch.json
          gh api --method POST \
            "repos/${REPOSITORY}/actions/workflows/rolling-checkpoint-live-cutover.yml/dispatches" \
            --input /tmp/cutover-dispatch.json

          CUTOVER_RUN_ID=''
          for attempt in $(seq 1 60); do
            gh api "repos/${REPOSITORY}/actions/workflows/rolling-checkpoint-live-cutover.yml/runs?event=workflow_dispatch&per_page=100" > /tmp/cutover-after.json
            while IFS= read -r candidate_id; do
              if ! grep -Fxq "${candidate_id}" /tmp/cutover-before.txt; then
                CUTOVER_RUN_ID="${candidate_id}"
                break
              fi
            done < <(jq -r '.workflow_runs | sort_by(.created_at) | reverse | .[].id' /tmp/cutover-after.json)
            test -n "${CUTOVER_RUN_ID}" && break
            sleep 10
          done
          test -n "${CUTOVER_RUN_ID}"
          printf '%s\n' "${CUTOVER_RUN_ID}"

          for attempt in $(seq 1 180); do
            gh api "repos/${REPOSITORY}/actions/runs/${CUTOVER_RUN_ID}" > /tmp/cutover-run.json
            STATUS="$(jq -r '.status' /tmp/cutover-run.json)"
            test "${STATUS}" = completed && break
            sleep 30
          done
          test "$(jq -r '.status' /tmp/cutover-run.json)" = completed
          test "$(jq -r '.conclusion' /tmp/cutover-run.json)" = success
