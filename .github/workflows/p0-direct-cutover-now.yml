name: P0 direct guarded cutover now

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p0-direct-cutover-now.yml'

permissions:
  contents: read
  issues: write

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: '756'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
      PRODUCTION_BASE: https://xrpl-lending-monitor.badjoke-lab.workers.dev
    steps:
      - name: Observe canonical recovery after stale-overlay cleanup
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/canonical-recovery
          mkdir -p "${ROOT}"

          query_d1() {
            local sql="$1"
            local output="$2"
            jq -n --arg sql "$sql" '{sql:$sql}' \
              | curl --fail-with-body --silent --show-error \
                  -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  -H 'Content-Type: application/json' \
                  --data-binary @- \
                  "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query" \
              > "$output"
            jq -e '.success == true and ((.errors // []) | length) == 0' "$output" > /dev/null
          }

          SYNC_SQL='SELECT network,epoch_id,last_processed_ledger,last_processed_hash,latest_observed_ledger,latest_observed_hash,last_attempt_at,last_success_at,status,consecutive_failures,error_code,error_message,updated_at FROM sync_state WHERE network="devnet"'
          ACTIVE_SQL='SELECT b.base_snapshot_id,b.base_ledger_index,s.overlay_ledger_index,s.overlay_ledger_hash,s.updated_at,COUNT(o.object_id) AS active_rows,COALESCE(SUM(LENGTH(o.projection_json)),0) AS active_payload_bytes FROM fast_lane_shadow_base_binding b JOIN current_state_overlay_state s ON s.network=b.network AND s.epoch_id=b.base_epoch_id AND s.base_snapshot_id=b.base_snapshot_id LEFT JOIN current_state_overlay_objects o ON o.network=b.network AND o.epoch_id=b.base_epoch_id AND o.base_snapshot_id=b.base_snapshot_id WHERE b.network="devnet" GROUP BY b.base_snapshot_id,b.base_ledger_index,s.overlay_ledger_index,s.overlay_ledger_hash,s.updated_at'
          TOTAL_SQL='SELECT COUNT(*) AS total_rows,COALESCE(SUM(LENGTH(projection_json)),0) AS total_payload_bytes FROM current_state_overlay_objects WHERE network="devnet"'

          RECOVERED=false
          for attempt in $(seq 1 29); do
            query_d1 "$SYNC_SQL" "${ROOT}/sync-${attempt}.json"
            query_d1 "$ACTIVE_SQL" "${ROOT}/active-${attempt}.json"
            LAST_PROCESSED="$(jq -r '.result[0].results[0].last_processed_ledger // 0' "${ROOT}/sync-${attempt}.json")"
            LAST_SUCCESS="$(jq -r '.result[0].results[0].last_success_at // ""' "${ROOT}/sync-${attempt}.json")"
            STATUS="$(jq -r '.result[0].results[0].status // ""' "${ROOT}/sync-${attempt}.json")"
            if [ "${LAST_PROCESSED}" -gt 3711028 ] && [ "${LAST_SUCCESS}" ">" "2026-07-16T23:36:46Z" ] && [ "${STATUS}" != error ]; then
              RECOVERED=true
              cp "${ROOT}/sync-${attempt}.json" "${ROOT}/sync-final.json"
              cp "${ROOT}/active-${attempt}.json" "${ROOT}/active-final.json"
              break
            fi
            cp "${ROOT}/sync-${attempt}.json" "${ROOT}/sync-final.json"
            cp "${ROOT}/active-${attempt}.json" "${ROOT}/active-final.json"
            sleep 15
          done

          query_d1 "$TOTAL_SQL" "${ROOT}/total.json"
          curl --fail-with-body --silent --show-error --retry 3 "${PRODUCTION_BASE}/api/overview" > "${ROOT}/overview.json"
          curl --fail-with-body --silent --show-error --retry 3 "${PRODUCTION_BASE}/api/status/fast-lane-diff?limit=500" > "${ROOT}/diff.json"
          curl --fail-with-body --silent --show-error --retry 3 "${PRODUCTION_BASE}/api/status/replacement-base-rebase" > "${ROOT}/rebase.json"

          jq -n \
            --argjson recovered "${RECOVERED}" \
            --slurpfile sync "${ROOT}/sync-final.json" \
            --slurpfile active "${ROOT}/active-final.json" \
            --slurpfile total "${ROOT}/total.json" \
            --slurpfile overview "${ROOT}/overview.json" \
            --slurpfile diff "${ROOT}/diff.json" \
            --slurpfile rebase "${ROOT}/rebase.json" \
            '{checkedAt:(now|todate),canonicalRecovered:$recovered,sync:$sync[0],activeOverlay:$active[0],totalOverlay:$total[0],overview:$overview[0],fastLaneDiff:$diff[0],rebase:$rebase[0]}' \
            > "${ROOT}/summary.json"

          {
            echo '# Canonical recovery after cleanup'
            echo
            echo '```json'
            cat "${ROOT}/summary.json"
            echo '```'
          } > "${ROOT}/issue-body.md"
          gh issue edit "${ISSUE_NUMBER}" --repo "${REPOSITORY}" --body-file "${ROOT}/issue-body.md"

          test "${RECOVERED}" = true
