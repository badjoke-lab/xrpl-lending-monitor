name: P0 direct guarded cutover now

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p0-direct-cutover-now.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: p0-direct-fresh-candidate-cutover
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      RECOVERY_BRANCH: ops/direct-cutover-now
      HISTORY_CANDIDATE_BRANCH: history-rolling-recovery-b-data
      CURRENT_STATE_CANDIDATE_BRANCH: current-state-rolling-recovery-b-data
    steps:
      - name: Verify aligned near-head candidate
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/p0-direct-cutover
          mkdir -p "${ROOT}"

          gh api "repos/${REPOSITORY}/contents/scripts/run-live-checkpoint-cutover.sh?ref=${RECOVERY_BRANCH}" > "${ROOT}/recovery-script.json"
          jq -r '.content' "${ROOT}/recovery-script.json" | tr -d '\n' | base64 -d > "${ROOT}/run-live-checkpoint-cutover.sh"
          grep -F 'd1-emergency-override.json' "${ROOT}/run-live-checkpoint-cutover.sh"
          bash -n "${ROOT}/run-live-checkpoint-cutover.sh"

          gh api "repos/${REPOSITORY}/contents/history/publication.json?ref=${HISTORY_CANDIDATE_BRANCH}" > "${ROOT}/target-publication-api.json"
          jq -r '.content' "${ROOT}/target-publication-api.json" | tr -d '\n' | base64 -d > "${ROOT}/target-publication.json"
          gh api "repos/${REPOSITORY}/contents/read-model/manifest.json?ref=${CURRENT_STATE_CANDIDATE_BRANCH}" > "${ROOT}/target-current-api.json"
          jq -r '.content' "${ROOT}/target-current-api.json" | tr -d '\n' | base64 -d > "${ROOT}/target-current.json"

          TARGET_LEDGER="$(jq -r '.endLedgerIndex' "${ROOT}/target-publication.json")"
          TARGET_HASH="$(jq -r '.endLedgerHash' "${ROOT}/target-publication.json")"
          test "$(jq -r '.ledgerIndex' "${ROOT}/target-current.json")" -eq "${TARGET_LEDGER}"
          test "$(jq -r '.ledgerHash' "${ROOT}/target-current.json")" = "${TARGET_HASH}"
          jq -e '.complete == true' "${ROOT}/target-publication.json" > /dev/null
          jq -e '.complete == true' "${ROOT}/target-current.json" > /dev/null

          jq -n '{method:"ledger",params:[{ledger_index:"validated",transactions:false,expand:false}]}' > "${ROOT}/head-request.json"
          curl --fail-with-body --silent --show-error --retry 3 \
            -H 'content-type: application/json' \
            --data @"${ROOT}/head-request.json" \
            https://devnet.honeycluster.io/ > "${ROOT}/head-response.json"
          LIVE_LEDGER="$(jq -r '.result.ledger_index // .result.ledger.ledger_index' "${ROOT}/head-response.json")"
          TARGET_LAG="$((LIVE_LEDGER - TARGET_LEDGER))"
          test "${TARGET_LAG}" -ge 0
          test "${TARGET_LAG}" -le 720
          printf '%s\n' "${TARGET_LEDGER}" > "${ROOT}/target-ledger.txt"
          printf '%s\n' "${TARGET_HASH}" > "${ROOT}/target-hash.txt"
          printf '%s\n' "${LIVE_LEDGER}" > "${ROOT}/live-ledger.txt"
          printf '%s\n' "${TARGET_LAG}" > "${ROOT}/target-lag.txt"

      - name: Dispatch guarded cutover
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/p0-direct-cutover
          gh api "repos/${REPOSITORY}/actions/workflows/rolling-checkpoint-live-cutover.yml/runs?event=workflow_dispatch&per_page=100" \
            --jq '.workflow_runs[].id' > "${ROOT}/cutover-before.txt"
          jq -n \
            --arg ref "${RECOVERY_BRANCH}" \
            --arg history "${HISTORY_CANDIDATE_BRANCH}" \
            --arg current "${CURRENT_STATE_CANDIDATE_BRANCH}" \
            '{ref:$ref,inputs:{history_candidate_branch:$history,current_state_candidate_branch:$current,confirm_production_write:"true"}}' \
            > "${ROOT}/cutover-dispatch.json"
          gh api --method POST \
            "repos/${REPOSITORY}/actions/workflows/rolling-checkpoint-live-cutover.yml/dispatches" \
            --input "${ROOT}/cutover-dispatch.json"

          CUTOVER_RUN_ID=''
          for attempt in $(seq 1 60); do
            gh api "repos/${REPOSITORY}/actions/workflows/rolling-checkpoint-live-cutover.yml/runs?event=workflow_dispatch&per_page=100" > "${ROOT}/cutover-after.json"
            while IFS= read -r candidate_id; do
              if ! grep -Fxq "${candidate_id}" "${ROOT}/cutover-before.txt"; then
                CUTOVER_RUN_ID="${candidate_id}"
                break
              fi
            done < <(jq -r '.workflow_runs | sort_by(.created_at) | reverse | .[].id' "${ROOT}/cutover-after.json")
            test -n "${CUTOVER_RUN_ID}" && break
            sleep 10
          done
          test -n "${CUTOVER_RUN_ID}"
          printf '%s\n' "${CUTOVER_RUN_ID}" > "${ROOT}/cutover-run-id.txt"

          for attempt in $(seq 1 180); do
            gh api "repos/${REPOSITORY}/actions/runs/${CUTOVER_RUN_ID}" > "${ROOT}/cutover-run.json"
            STATUS="$(jq -r '.status' "${ROOT}/cutover-run.json")"
            test "${STATUS}" = completed && break
            sleep 30
          done
          test "$(jq -r '.status' "${ROOT}/cutover-run.json")" = completed
          gh api "repos/${REPOSITORY}/actions/runs/${CUTOVER_RUN_ID}/jobs?per_page=100" > "${ROOT}/cutover-jobs.json"
          test "$(jq -r '.conclusion' "${ROOT}/cutover-run.json")" = success

      - name: Upload direct cutover evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: p0-direct-guarded-cutover
          path: /tmp/p0-direct-cutover
          if-no-files-found: warn
          retention-days: 30
