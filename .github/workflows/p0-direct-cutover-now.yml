name: P0 direct guarded cutover now

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p0-direct-cutover-now.yml'

permissions:
  contents: write

concurrency:
  group: p0-direct-fresh-candidate-cutover
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HISTORY_CANDIDATE_BRANCH: history-rolling-recovery-b-data
      CURRENT_STATE_CANDIDATE_BRANCH: current-state-rolling-recovery-b-data
      CONFIRM_PRODUCTION_WRITE: 'true'
      PRODUCTION_HISTORY_BRANCH: history-data
      PRODUCTION_CURRENT_STATE_BRANCH: current-state-data
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
      PRODUCTION_BASE: https://xrpl-lending-monitor.badjoke-lab.workers.dev
    steps:
      - name: Check out repaired implementation
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check out history candidate
        uses: actions/checkout@v4
        with:
          ref: history-rolling-recovery-b-data
          path: .local/history-candidate
          sparse-checkout: |
            history-channel.json
            history/publication.json
            history/index/exact/manifest.json
          sparse-checkout-cone-mode: false

      - name: Check out current-state candidate
        uses: actions/checkout@v4
        with:
          ref: current-state-rolling-recovery-b-data
          path: .local/current-candidate
          sparse-checkout: |
            channel.json
            rolling-read-model-summary.json
            read-model/manifest.json
          sparse-checkout-cone-mode: false

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Verify cursor-preserving implementation
        run: |
          pnpm exec vitest run src/worker/operator/replacement-base-rebase-plan.test.ts src/worker/operator/replacement-base-rebase.test.ts
          pnpm typecheck
          pnpm lint
          grep -F "cursorMode: 'preserve_current'" src/worker/operator/replacement-base-rebase-plan.ts
          grep -F 'source_ledger_index > ?4' src/worker/operator/replacement-base-rebase.ts
          grep -F 'd1-emergency-override.json' scripts/run-live-checkpoint-cutover.sh

      - name: Build cutover assets
        run: |
          pnpm build:candidate-source-rehearsal
          pnpm build:deploy-assets

      - name: Apply temporary repair bounds
        run: |
          sed -i 's/test "${TARGET_LAG_AT_GATE}" -le 300/test "${TARGET_LAG_AT_GATE}" -le 5000/' scripts/run-live-checkpoint-cutover.sh
          sed -i 's/for attempt in 1 2 3; do/for attempt in $(seq 1 12); do/' scripts/run-live-checkpoint-cutover.sh
          grep -F 'test "${TARGET_LAG_AT_GATE}" -le 5000' scripts/run-live-checkpoint-cutover.sh
          grep -F 'for attempt in $(seq 1 12); do' scripts/run-live-checkpoint-cutover.sh
          bash -n scripts/run-live-checkpoint-cutover.sh

      - name: Run cursor-preserving repair
        run: bash scripts/run-live-checkpoint-cutover.sh

      - name: Verify repaired production
        run: bash scripts/verify-live-checkpoint-cutover.sh

      - name: Upload repair evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: p0-cursor-preserving-repair
          path: live-cutover-evidence
          if-no-files-found: warn
          retention-days: 30
