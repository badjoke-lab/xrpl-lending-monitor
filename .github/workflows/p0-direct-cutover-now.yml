name: P0 direct guarded cutover now

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p0-direct-cutover-now.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: p0-direct-fresh-candidate-cutover
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish complete replacement-base rebase context
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/p0-rebase-diagnosis
          mkdir -p "${ROOT}"
          FILES="${ROOT}/files.txt"
          {
            grep -R -l -F 'planReplacementBaseRebase' src test tests 2>/dev/null || true
            grep -R -l -F 'replacement-base-rebase' src test tests 2>/dev/null || true
            grep -R -l -F 'ReplacementBaseRebase' src test tests 2>/dev/null || true
            grep -R -l -F 'rebase refuses to regress' src test tests 2>/dev/null || true
          } | sort -u > "${FILES}"
          test -s "${FILES}"
          {
            printf '# Complete replacement-base rebase context\n\n'
            while IFS= read -r file; do
              printf '## `%s`\n\n```text\n' "${file}"
              cat "${file}"
              printf '\n```\n\n'
            done < "${FILES}"
          } > "${ROOT}/issue-body.md"
          gh issue edit 748 --repo "${REPOSITORY}" --body-file "${ROOT}/issue-body.md"
