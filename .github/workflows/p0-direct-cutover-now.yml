name: P0 direct guarded cutover now

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p0-direct-cutover-now.yml'

permissions:
  contents: read
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: '756'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
      PRODUCTION_BASE: https://xrpl-lending-monitor.badjoke-lab.workers.dev
    steps:
      - name: Query post-repair production state
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/post-repair
          mkdir -p "${ROOT}"

          query_d1() {
            local sql="$1"
            local output="$2"
            jq -n --arg sql "$sql" '{sql:$sql}' \
              | curl --fail-with-body --silent --show-error \
                  -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  -H 'Content-Type: application/json' \
                  --data-binary @- \
                  "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query" \
              > "$output"
          }

          STATUS_SQL='SELECT run_at,status,start_ledger_index,end_ledger_index,latest_observed_ledger,lag_ledgers,ledgers_processed,persistence_rows_written,error_message FROM fast_lane_shadow_run_metrics WHERE network = "devnet" ORDER BY run_at DESC LIMIT 12'
          ACTIVE_SQL='SELECT binding.base_epoch_id,binding.base_snapshot_id,binding.base_ledger_index,binding.base_ledger_hash,state.overlay_ledger_index,state.overlay_ledger_hash,state.updated_at,COUNT(objects.object_id) AS active_rows,COALESCE(SUM(LENGTH(objects.projection_json)),0) AS active_payload_bytes FROM fast_lane_shadow_base_binding AS binding JOIN current_state_overlay_state AS state ON state.network=binding.network AND state.epoch_id=binding.base_epoch_id AND state.base_snapshot_id=binding.base_snapshot_id LEFT JOIN current_state_overlay_objects AS objects ON objects.network=binding.network AND objects.epoch_id=binding.base_epoch_id AND objects.base_snapshot_id=binding.base_snapshot_id WHERE binding.network="devnet" GROUP BY binding.base_epoch_id,binding.base_snapshot_id,binding.base_ledger_index,binding.base_ledger_hash,state.overlay_ledger_index,state.overlay_ledger_hash,state.updated_at'
          TOTAL_SQL='SELECT COUNT(*) AS total_rows,COALESCE(SUM(LENGTH(projection_json)),0) AS total_payload_bytes FROM current_state_overlay_objects WHERE network="devnet"'
          BASES_SQL='SELECT base_snapshot_id,COUNT(*) AS rows,COALESCE(SUM(LENGTH(projection_json)),0) AS payload_bytes,MIN(source_ledger_index) AS min_source_ledger,MAX(source_ledger_index) AS max_source_ledger FROM current_state_overlay_objects WHERE network="devnet" GROUP BY base_snapshot_id ORDER BY rows DESC LIMIT 15'
          COMPACT_SQL='SELECT COUNT(*) AS compact_rows,COALESCE(SUM(LENGTH(projection_json)),0) AS compact_payload_bytes FROM fast_lane_shadow_objects_compact WHERE network="devnet"'

          query_d1 "$STATUS_SQL" "${ROOT}/runs.json"
          query_d1 "$ACTIVE_SQL" "${ROOT}/active.json"
          query_d1 "$TOTAL_SQL" "${ROOT}/total.json"
          query_d1 "$BASES_SQL" "${ROOT}/bases.json"
          query_d1 "$COMPACT_SQL" "${ROOT}/compact.json"

          curl --fail-with-body --silent --show-error --retry 3 "${PRODUCTION_BASE}/api/overview" > "${ROOT}/overview.json"
          curl --fail-with-body --silent --show-error --retry 3 "${PRODUCTION_BASE}/api/status/replacement-base-rebase" > "${ROOT}/rebase.json"
          curl --fail-with-body --silent --show-error --retry 3 "${PRODUCTION_BASE}/api/status/fast-lane-diff?limit=500" > "${ROOT}/diff.json"
          curl --fail-with-body --silent --show-error --retry 3 "${PRODUCTION_BASE}/api/status/history-source" > "${ROOT}/history.json"

          jq -n \
            --slurpfile runs "${ROOT}/runs.json" \
            --slurpfile active "${ROOT}/active.json" \
            --slurpfile total "${ROOT}/total.json" \
            --slurpfile bases "${ROOT}/bases.json" \
            --slurpfile compact "${ROOT}/compact.json" \
            --slurpfile overview "${ROOT}/overview.json" \
            --slurpfile rebase "${ROOT}/rebase.json" \
            --slurpfile diff "${ROOT}/diff.json" \
            --slurpfile history "${ROOT}/history.json" \
            '{
              checkedAt:(now|todate),
              d1:{
                latestRuns:$runs[0].result[0].results,
                activeOverlay:$active[0].result[0].results,
                totalOverlay:$total[0].result[0].results,
                overlayBases:$bases[0].result[0].results,
                compact:$compact[0].result[0].results,
                sizeAfterBytes:$total[0].result[0].meta.size_after
              },
              overview:$overview[0],
              rebase:$rebase[0],
              diff:$diff[0],
              history:$history[0]
            }' > "${ROOT}/summary.json"

          {
            echo '# Post-repair production validation'
            echo
            echo '```json'
            cat "${ROOT}/summary.json"
            echo '```'
          } > "${ROOT}/issue-body.md"
          gh issue edit "${ISSUE_NUMBER}" --repo "${REPOSITORY}" --body-file "${ROOT}/issue-body.md"
