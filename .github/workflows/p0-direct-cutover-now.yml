name: P0 direct guarded cutover now

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p0-direct-cutover-now.yml'

permissions:
  contents: read

concurrency:
  group: p0-direct-fresh-candidate-cutover
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Locate replacement-base cursor rejection
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/p0-rebase-diagnosis
          mkdir -p "${ROOT}"
          MATCHES="${ROOT}/matches.txt"
          grep -R -n -F 'Replacement-base rebase refuses to regress or replace a later incremental cursor' \
            --exclude-dir=.git --exclude-dir=node_modules . > "${MATCHES}"
          test -s "${MATCHES}"
          cut -d: -f1 "${MATCHES}" | sort -u > "${ROOT}/files.txt"
          while IFS= read -r file; do
            safe="$(printf '%s' "${file}" | tr '/.' '__')"
            grep -n -B 100 -A 140 -F 'Replacement-base rebase refuses to regress or replace a later incremental cursor' "${file}" \
              > "${ROOT}/${safe}.context.txt"
            cp "${file}" "${ROOT}/${safe}.full.txt"
          done < "${ROOT}/files.txt"
      - name: Upload rebase diagnosis
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: p0-rebase-cursor-diagnosis
          path: /tmp/p0-rebase-diagnosis
          if-no-files-found: error
          retention-days: 30
