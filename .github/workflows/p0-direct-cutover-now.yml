name: P0 direct guarded cutover now

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p0-direct-cutover-now.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: p0-direct-fresh-candidate-cutover
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish replacement-base cursor diagnosis to issue
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/p0-rebase-diagnosis
          mkdir -p "${ROOT}"
          MATCHES="${ROOT}/matches.txt"
          grep -R -n -F 'Replacement-base rebase refuses to regress or replace a later incremental cursor' \
            --exclude-dir=.git --exclude-dir=node_modules . > "${MATCHES}"
          test -s "${MATCHES}"
          {
            printf '# Replacement-base cursor diagnosis\n\n'
            while IFS=: read -r file line rest; do
              printf '## `%s` line %s\n\n```text\n' "${file}" "${line}"
              start=$(( line > 120 ? line - 120 : 1 ))
              end=$(( line + 180 ))
              sed -n "${start},${end}p" "${file}"
              printf '\n```\n\n'
            done < "${MATCHES}"
          } > "${ROOT}/issue-body.md"
          gh issue edit 748 --repo "${REPOSITORY}" --body-file "${ROOT}/issue-body.md"
