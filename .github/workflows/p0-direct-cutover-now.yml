name: P0 direct guarded cutover now

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p0-direct-cutover-now.yml'

permissions:
  contents: read
  issues: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: '756'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
      PRODUCTION_BASE: https://xrpl-lending-monitor.badjoke-lab.workers.dev
    steps:
      - name: Delete only stale overlay bases
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/overlay-cleanup
          mkdir -p "${ROOT}"

          query_d1() {
            local sql="$1"
            local output="$2"
            jq -n --arg sql "$sql" '{sql:$sql}' \
              | curl --fail-with-body --silent --show-error \
                  -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  -H 'Content-Type: application/json' \
                  --data-binary @- \
                  "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query" \
              > "$output"
            jq -e '.success == true and ((.errors // []) | length) == 0' "$output" > /dev/null
          }

          PRECHECK_SQL='SELECT b.base_epoch_id,b.base_snapshot_id,b.base_ledger_index,b.base_ledger_hash,(SELECT COUNT(*) FROM current_state_overlay_state s WHERE s.network=b.network AND s.epoch_id=b.base_epoch_id AND s.base_snapshot_id=b.base_snapshot_id) AS active_state_rows,(SELECT COUNT(*) FROM current_state_overlay_objects o WHERE o.network=b.network AND o.epoch_id=b.base_epoch_id AND o.base_snapshot_id=b.base_snapshot_id) AS active_object_rows,(SELECT COALESCE(SUM(LENGTH(o.projection_json)),0) FROM current_state_overlay_objects o WHERE o.network=b.network AND o.epoch_id=b.base_epoch_id AND o.base_snapshot_id=b.base_snapshot_id) AS active_payload_bytes,(SELECT COUNT(*) FROM current_state_overlay_objects o WHERE o.network="devnet" AND NOT EXISTS (SELECT 1 FROM fast_lane_shadow_base_binding x WHERE x.network=o.network AND x.base_epoch_id=o.epoch_id AND x.base_snapshot_id=o.base_snapshot_id)) AS stale_object_rows,(SELECT COALESCE(SUM(LENGTH(o.projection_json)),0) FROM current_state_overlay_objects o WHERE o.network="devnet" AND NOT EXISTS (SELECT 1 FROM fast_lane_shadow_base_binding x WHERE x.network=o.network AND x.base_epoch_id=o.epoch_id AND x.base_snapshot_id=o.base_snapshot_id)) AS stale_payload_bytes,(SELECT COUNT(*) FROM current_state_overlay_state s WHERE s.network="devnet" AND NOT EXISTS (SELECT 1 FROM fast_lane_shadow_base_binding x WHERE x.network=s.network AND x.base_epoch_id=s.epoch_id AND x.base_snapshot_id=s.base_snapshot_id)) AS stale_state_rows FROM fast_lane_shadow_base_binding b WHERE b.network="devnet"'
          query_d1 "$PRECHECK_SQL" "${ROOT}/before.json"
          curl --fail-with-body --silent --show-error --retry 3 "${PRODUCTION_BASE}/api/overview" > "${ROOT}/overview-before.json"

          jq -e '.result[0].results | length == 1' "${ROOT}/before.json" > /dev/null
          jq -e '.result[0].results[0].active_state_rows == 1' "${ROOT}/before.json" > /dev/null
          jq -e '.result[0].results[0].active_object_rows > 0' "${ROOT}/before.json" > /dev/null
          jq -e '.result[0].results[0].stale_object_rows > 0' "${ROOT}/before.json" > /dev/null
          ACTIVE_SNAPSHOT="$(jq -r '.result[0].results[0].base_snapshot_id' "${ROOT}/before.json")"
          ACTIVE_ROWS="$(jq -r '.result[0].results[0].active_object_rows' "${ROOT}/before.json")"
          ACTIVE_BYTES="$(jq -r '.result[0].results[0].active_payload_bytes' "${ROOT}/before.json")"
          test "$(jq -r '.base.id' "${ROOT}/overview-before.json")" = "${ACTIVE_SNAPSHOT}"

          DELETE_OBJECTS_SQL='DELETE FROM current_state_overlay_objects AS o WHERE o.network="devnet" AND NOT EXISTS (SELECT 1 FROM fast_lane_shadow_base_binding b WHERE b.network=o.network AND b.base_epoch_id=o.epoch_id AND b.base_snapshot_id=o.base_snapshot_id)'
          DELETE_STATES_SQL='DELETE FROM current_state_overlay_state AS s WHERE s.network="devnet" AND NOT EXISTS (SELECT 1 FROM fast_lane_shadow_base_binding b WHERE b.network=s.network AND b.base_epoch_id=s.epoch_id AND b.base_snapshot_id=s.base_snapshot_id)'
          query_d1 "$DELETE_OBJECTS_SQL" "${ROOT}/delete-objects.json"
          query_d1 "$DELETE_STATES_SQL" "${ROOT}/delete-states.json"

          query_d1 "$PRECHECK_SQL" "${ROOT}/after.json"
          curl --fail-with-body --silent --show-error --retry 3 "${PRODUCTION_BASE}/api/overview" > "${ROOT}/overview-after.json"

          jq -e '.result[0].results | length == 1' "${ROOT}/after.json" > /dev/null
          jq -e '.result[0].results[0].active_state_rows == 1' "${ROOT}/after.json" > /dev/null
          jq -e '.result[0].results[0].stale_object_rows == 0' "${ROOT}/after.json" > /dev/null
          jq -e '.result[0].results[0].stale_state_rows == 0' "${ROOT}/after.json" > /dev/null
          test "$(jq -r '.result[0].results[0].base_snapshot_id' "${ROOT}/after.json")" = "${ACTIVE_SNAPSHOT}"
          test "$(jq -r '.result[0].results[0].active_object_rows' "${ROOT}/after.json")" = "${ACTIVE_ROWS}"
          test "$(jq -r '.result[0].results[0].active_payload_bytes' "${ROOT}/after.json")" = "${ACTIVE_BYTES}"
          test "$(jq -r '.base.id' "${ROOT}/overview-after.json")" = "${ACTIVE_SNAPSHOT}"

          jq -n \
            --slurpfile before "${ROOT}/before.json" \
            --slurpfile after "${ROOT}/after.json" \
            --slurpfile deleteObjects "${ROOT}/delete-objects.json" \
            --slurpfile deleteStates "${ROOT}/delete-states.json" \
            --slurpfile overviewBefore "${ROOT}/overview-before.json" \
            --slurpfile overviewAfter "${ROOT}/overview-after.json" \
            '{checkedAt:(now|todate),passed:true,before:$before[0],after:$after[0],deleteObjects:$deleteObjects[0],deleteStates:$deleteStates[0],overviewBefore:$overviewBefore[0],overviewAfter:$overviewAfter[0]}' \
            > "${ROOT}/summary.json"

          {
            echo '# Stale overlay cleanup result'
            echo
            echo '```json'
            cat "${ROOT}/summary.json"
            echo '```'
          } > "${ROOT}/issue-body.md"
          gh issue edit "${ISSUE_NUMBER}" --repo "${REPOSITORY}" --body-file "${ROOT}/issue-body.md"
