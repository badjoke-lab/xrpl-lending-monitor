name: Typecheck diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/typecheck-diagnostic.yml'
      - 'src/worker/repositories/three-layer-*.ts'
      - 'src/worker/repositories/base-overlay-*.ts'

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: typecheck
        shell: bash
        run: |
          set +e
          pnpm typecheck > typecheck.log 2>&1
          STATUS=$?
          echo "status=${STATUS}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Post diagnostic to PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Temporary typecheck diagnostic'
            echo
            echo '```text'
            head -c 60000 typecheck.log
            echo
            echo '```'
            echo
            echo "exit_status: ${{ steps.typecheck.outputs.status }}"
          } > typecheck-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file typecheck-comment.md
