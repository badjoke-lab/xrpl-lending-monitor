name: Typecheck diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture typecheck output
        shell: bash
        run: |
          set +e
          pnpm typecheck > typecheck-output.txt 2>&1
          code=$?
          cat typecheck-output.txt
          echo "$code" > typecheck-exit-code.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostic
          path: |
            typecheck-output.txt
            typecheck-exit-code.txt
