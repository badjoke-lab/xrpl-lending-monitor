name: P0 one-time twelve-slot recovery recheck

on:
  schedule:
    - cron: '20 2 21 7 *'

permissions:
  contents: write
  issues: write

jobs:
  trigger-and-retire:
    if: github.run_started_at >= '2026-07-21T02:19:00Z' && github.run_started_at < '2026-07-21T02:30:00Z'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Trigger final verification and remove this one-time scheduler
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          printf 'verify-12-slots-oneoff-%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .github/p0-verify-12-five-minute-slots-trigger
          git rm .github/workflows/p0-oneoff-verify-12-slots-20260721.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/p0-verify-12-five-minute-slots-trigger
          git commit -m 'Run final twelve-slot verification and retire one-time scheduler'
          git push origin HEAD:main

      - name: Record one-time trigger
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 950 --repo "$GITHUB_REPOSITORY" --body 'Scheduled one-time 11:20 JST twelve-slot verification was triggered; the temporary scheduler removed itself in the same commit.'
