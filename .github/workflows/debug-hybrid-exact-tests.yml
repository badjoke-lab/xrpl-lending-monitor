name: Hybrid exact focused tests

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/debug-hybrid-exact-tests.yml'
      - 'scripts/build-history-exact-index.ts'
      - 'src/shared/history-segments/**'
      - 'src/worker/repositories/hybrid-exact-history-repository*'
      - 'src/worker/repositories/live-*-after-boundary.ts'
      - 'src/worker/routes/hybrid-exact-history-override*'
      - 'src/worker/entry.ts'

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm vitest run
          src/shared/history-segments/exact-index-reader.test.ts
          src/shared/history-segments/channel.test.ts
          src/shared/history-segments/reader-references.test.ts
          src/worker/repositories/hybrid-exact-history-repository.test.ts
          src/worker/routes/hybrid-exact-history-override.test.ts
          --reporter=verbose
