name: Current repair status hotfix control

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.event.issue.number == 995 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      github.event.comment.body == '/current-repair-apply-deploy-status-delta-fix'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact deploy-guard branch
        uses: actions/checkout@v4
        with:
          ref: fix/current-repair-deploy-status-delta
          fetch-depth: 1
          token: ${{ github.token }}
      - name: Add exact compact status hotfix delta
        shell: bash
        run: |
          set -euo pipefail
          file=scripts/deploy-current-repair-only.py
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/deploy-current-repair-only.py')
          s = p.read_text()
          needle = '    "src/worker/repositories/fast-lane-shadow-repository.ts",\n]'
          replacement = '    "src/worker/repositories/fast-lane-shadow-repository.ts",\n    "src/worker/repositories/fast-lane-compact-shadow-repository.ts",\n]'
          if s.count(needle) != 1:
              raise SystemExit('expected deploy delta list anchor exactly once')
          p.write_text(s.replace(needle, replacement))
          if p.read_text().count(replacement) != 1:
              raise SystemExit('expected repaired deploy delta list exactly once')
          PY
          git diff --check
          git diff --exit-code -- . ':!scripts/deploy-current-repair-only.py'
          git diff -- scripts/deploy-current-repair-only.py
      - name: Commit exact deploy-guard fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/deploy-current-repair-only.py
          git commit -m 'Allow exact compact status repair runtime delta'
          git push origin HEAD:fix/current-repair-deploy-status-delta
