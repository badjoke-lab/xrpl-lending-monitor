name: Formal Free-operation soak start gate

on:
  push:
    branches: [main]
    paths:
      - .github/formal-free-soak-start-trigger
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: formal-free-operation-soak-start
  cancel-in-progress: false

jobs:
  gate:
    if: github.event_name == 'push' || startsWith(github.event.issue.title, 'P0 formal Free-operation soak start gate')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: '976'
      PRODUCTION_BASE: https://xrpl-lending-monitor.badjoke-lab.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact pre-start production gate
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p formal-soak-evidence
          test "$(date -u +%s)" -lt "$(date -u -d '2026-07-23T11:00:00Z' +%s)"
          jq -e '.issueNumber==976 and .startAt=="2026-07-23T11:00:00Z" and .endAt=="2026-07-24T11:00:00Z" and .expectedSlots==288 and .status=="planned" and .cadence=="*/5 * * * *" and .network=="devnet" and .baseSnapshotId=="devnet-3860021-fbba23eeffd1" and .baseLedgerIndex==3860021' .github/formal-free-soak-window.json >/dev/null
          jq -e '.triggers.crons==["*/5 * * * *"] and .vars.APP_NETWORK=="devnet" and .vars.MAINNET_ENABLED=="false" and (.queues.producers|length)==1 and (.queues.consumers|length)==1 and .queues.consumers[0].max_batch_size==1 and .queues.consumers[0].max_concurrency==1' wrangler.jsonc >/dev/null

          query(){ jq -n --arg sql "$1" '{sql:$sql}' | curl --fail-with-body --silent --show-error -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' --data-binary @- "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query" > "$2"; jq -e '.success==true and ((.errors//[])|length)==0 and ([.result[].success]|all)' "$2" >/dev/null; }
          query "SELECT 1 AS live" formal-soak-evidence/live.json
          query "SELECT epoch_id,last_processed_ledger,last_processed_hash,latest_observed_ledger,latest_observed_hash,status,lag_ledgers FROM fast_lane_shadow_state WHERE network='devnet'" formal-soak-evidence/state.json
          query "SELECT base_epoch_id,base_snapshot_id,base_ledger_index,base_ledger_hash FROM fast_lane_shadow_base_binding WHERE network='devnet'" formal-soak-evidence/binding.json
          query "SELECT COUNT(*) overlay_rows,COALESCE(SUM(LENGTH(projection_json)),0) overlay_payload_bytes FROM current_state_overlay_objects WHERE network='devnet'" formal-soak-evidence/overlay.json
          query "SELECT COUNT(*) stale_rows FROM current_state_overlay_objects o WHERE o.network='devnet' AND NOT EXISTS (SELECT 1 FROM fast_lane_shadow_base_binding b WHERE b.network=o.network AND b.base_epoch_id=o.epoch_id AND b.base_snapshot_id=o.base_snapshot_id)" formal-soak-evidence/stale.json
          query "SELECT COUNT(*) state_rows,MAX(overlay_ledger_index) overlay_ledger_index FROM current_state_overlay_state WHERE network='devnet'" formal-soak-evidence/overlay-state.json
          query "SELECT COUNT(*) compact_rows FROM fast_lane_shadow_objects_compact WHERE network='devnet'" formal-soak-evidence/compact.json
          query "SELECT COUNT(*) foldable_rows FROM fast_lane_shadow_objects_compact fast WHERE fast.network='devnet' AND EXISTS (SELECT 1 FROM current_state_overlay_objects overlay JOIN fast_lane_shadow_base_binding binding ON binding.network='devnet' WHERE overlay.network='devnet' AND overlay.epoch_id=binding.base_epoch_id AND overlay.base_snapshot_id=binding.base_snapshot_id AND overlay.object_type=fast.object_type AND overlay.object_id=fast.object_id AND (overlay.source_ledger_index>fast.source_ledger_index OR (overlay.source_ledger_index=fast.source_ledger_index AND overlay.source_transaction_index>=fast.source_transaction_index)))" formal-soak-evidence/foldable.json
          query "WITH b AS (SELECT run_at,status,end_ledger_index,lag_ledgers,error_message,CAST(strftime('%s',run_at)/300 AS INTEGER) slot_id FROM fast_lane_shadow_run_metrics WHERE network='devnet' AND julianday(run_at)>=julianday('now','-45 minutes')),r AS (SELECT *,ROW_NUMBER() OVER(PARTITION BY slot_id ORDER BY run_at DESC) rn,SUM(CASE WHEN status='error' OR error_message IS NOT NULL THEN 1 ELSE 0 END) OVER(PARTITION BY slot_id) errors FROM b) SELECT slot_id,run_at,status,end_ledger_index,lag_ledgers,error_message,errors FROM r WHERE rn=1 ORDER BY slot_id DESC LIMIT 6" formal-soak-evidence/slots.json

          curl --fail-with-body --silent --show-error -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-monitor/schedules" > formal-soak-evidence/schedules.json
          curl --fail-with-body --silent --show-error -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}" > formal-soak-evidence/database.json
          oh="$(curl --silent --show-error -o formal-soak-evidence/overview.json -w '%{http_code}' "${PRODUCTION_BASE}/api/overview")"
          hh="$(curl --silent --show-error -o formal-soak-evidence/history.json -w '%{http_code}' "${PRODUCTION_BASE}/api/status/history-source")"
          dh="$(curl --silent --show-error -o formal-soak-evidence/diff.json -w '%{http_code}' "${PRODUCTION_BASE}/api/status/fast-lane-diff?limit=500")"

          today="$(date -u +%F)"
          read -r -d '' q <<'GRAPHQL' || true
          query D1Usage($accountTag:string!,$start:Date,$end:Date,$databaseId:string){viewer{accounts(filter:{accountTag:$accountTag}){d1AnalyticsAdaptiveGroups(limit:10000,filter:{date_geq:$start,date_leq:$end,databaseId:$databaseId}){sum{rowsRead rowsWritten}}}}}
          GRAPHQL
          jq -n --arg query "$q" --arg accountTag "$CLOUDFLARE_ACCOUNT_ID" --arg start "$today" --arg end "$today" --arg databaseId "$DATABASE_ID" '{query:$query,variables:{accountTag:$accountTag,start:$start,end:$end,databaseId:$databaseId}}' > formal-soak-evidence/usage-request.json
          curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'content-type: application/json' --data @formal-soak-evidence/usage-request.json https://api.cloudflare.com/client/v4/graphql > formal-soak-evidence/usage.json

          rr="$(jq '[.data.viewer.accounts[0].d1AnalyticsAdaptiveGroups[].sum.rowsRead//0]|add//0' formal-soak-evidence/usage.json)"
          rw="$(jq '[.data.viewer.accounts[0].d1AnalyticsAdaptiveGroups[].sum.rowsWritten//0]|add//0' formal-soak-evidence/usage.json)"
          db="$(jq -r '.result.file_size' formal-soak-evidence/database.json)"
          state="$(jq -c '.result[0].results[0]' formal-soak-evidence/state.json)"
          binding="$(jq -c '.result[0].results[0]' formal-soak-evidence/binding.json)"
          overlay="$(jq -c '.result[0].results[0]' formal-soak-evidence/overlay.json)"
          stale="$(jq -c '.result[0].results[0]' formal-soak-evidence/stale.json)"
          os="$(jq -c '.result[0].results[0]' formal-soak-evidence/overlay-state.json)"
          compact="$(jq -c '.result[0].results[0]' formal-soak-evidence/compact.json)"
          foldable="$(jq -c '.result[0].results[0]' formal-soak-evidence/foldable.json)"

          jq -e --argjson rr "$rr" --argjson rw "$rw" --argjson db "$db" --argjson state "$state" --argjson binding "$binding" --argjson overlay "$overlay" --argjson stale "$stale" --argjson os "$os" --argjson compact "$compact" --argjson foldable "$foldable" --arg oh "$oh" --arg hh "$hh" --arg dh "$dh" --slurpfile slots formal-soak-evidence/slots.json --slurpfile schedules formal-soak-evidence/schedules.json --slurpfile diff formal-soak-evidence/diff.json '
            $rr<1000000 and $rw<20000 and $db<400000000
            and $state.status=="healthy" and $state.lag_ledgers==0 and $state.last_processed_ledger==$state.latest_observed_ledger and $state.last_processed_hash==$state.latest_observed_hash
            and $binding.base_epoch_id=="devnet-3371675" and $binding.base_snapshot_id=="devnet-3860021-fbba23eeffd1" and $binding.base_ledger_index==3860021 and $binding.base_ledger_hash=="FBBA23EEFFD19FFD81F2E6A0A9A5D3E503EE78AA8EB6F3653F756BA90655B4A7"
            and $overlay.overlay_rows>0 and $overlay.overlay_rows<59000 and $overlay.overlay_payload_bytes<70000000 and $stale.stale_rows==0 and $os.state_rows==1 and $compact.compact_rows==0 and $foldable.foldable_rows==0
            and $oh=="200" and $hh=="200" and $dh=="200" and ($diff[0].sample.exactProjectionMismatches//0)==0 and ($diff[0].sample.canonicalAheadRows//0)==0
            and $schedules[0].success==true and ($schedules[0].result.schedules|length)==1 and $schedules[0].result.schedules[0].cron=="*/5 * * * *"
            and (($slots[0].result[0].results|length)==6) and (($slots[0].result[0].results[0].slot_id-$slots[0].result[0].results[5].slot_id)==5)
            and ($slots[0].result[0].results|all((.status=="committed" or .status=="caught_up") and .lag_ledgers==0 and .error_message==null and .errors==0))
          ' >/dev/null

          jq -n --argjson passed true --argjson rowsRead "$rr" --argjson rowsWritten "$rw" --argjson databaseBytes "$db" --argjson state "$state" --argjson binding "$binding" --argjson overlay "$overlay" --argjson stale "$stale" --argjson overlayState "$os" --argjson compact "$compact" --argjson foldable "$foldable" --slurpfile slots formal-soak-evidence/slots.json --slurpfile diff formal-soak-evidence/diff.json '{passed:$passed,checkedAt:(now|todate),window:{startAt:"2026-07-23T11:00:00Z",endAt:"2026-07-24T11:00:00Z"},d1Today:{rowsRead:$rowsRead,rowsWritten:$rowsWritten},databaseBytes:$databaseBytes,state:$state,binding:$binding,overlay:$overlay,stale:$stale,overlayState:$overlayState,compact:$compact,foldable:$foldable,slots:$slots[0].result[0].results,diff:$diff[0]}' > formal-soak-evidence/summary.json

      - name: Accept and mark running
        if: success()
        shell: bash
        run: |
          python - <<'PY'
          import json
          p='.github/formal-free-soak-window.json'; x=json.load(open(p)); x['status']='running'; json.dump(x,open(p,'w'),indent=2); open(p,'a').write('\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/formal-free-soak-window.json
          git commit -m 'Start formal Free-operation soak at 2026-07-23 20:00 JST'
          git push
          { echo 'Accepted formal Free-operation soak baseline:'; echo; echo '```json'; cat formal-soak-evidence/summary.json; echo '```'; } > formal-soak-evidence/comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file formal-soak-evidence/comment.md

      - name: Reject without backdating
        if: failure()
        shell: bash
        run: |
          test -s formal-soak-evidence/summary.json || echo '{"passed":false,"reason":"start gate failed before accepted summary"}' > formal-soak-evidence/summary.json
          { echo 'Formal Free-operation soak start gate rejected:'; echo; echo '```json'; cat formal-soak-evidence/summary.json; echo '```'; } > formal-soak-evidence/rejected.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file formal-soak-evidence/rejected.md
