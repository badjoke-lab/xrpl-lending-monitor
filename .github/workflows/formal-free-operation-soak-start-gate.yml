name: Formal Free-operation soak start gate

on:
  push:
    branches: [main]
    paths:
      - .github/formal-free-soak-start-trigger

permissions:
  contents: write
  issues: write

concurrency:
  group: formal-free-operation-soak-start
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: '974'
      PRODUCTION_BASE: https://xrpl-lending-monitor.badjoke-lab.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify immutable planned window and production baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p formal-soak-evidence
          now_epoch="$(date -u +%s)"
          start_epoch="$(date -u -d '2026-07-22T01:00:00Z' +%s)"
          test "$now_epoch" -lt "$start_epoch"
          jq -e '.issueNumber==974 and .startAt=="2026-07-22T01:00:00Z" and .endAt=="2026-07-23T01:00:00Z" and .expectedSlots==288 and .status=="planned" and .cadence=="*/5 * * * *" and .network=="devnet"' .github/formal-free-soak-window.json >/dev/null
          jq -e '.triggers.crons==["*/5 * * * *"] and .vars.APP_NETWORK=="devnet" and .vars.MAINNET_ENABLED=="false" and (.queues.producers|length)==1 and (.queues.consumers|length)==1 and .queues.consumers[0].max_batch_size==1 and .queues.consumers[0].max_concurrency==1' wrangler.jsonc >/dev/null

          query_d1() {
            jq -n --arg sql "$1" '{sql:$sql}' | curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' \
              --data-binary @- "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query" > "$2"
            jq -e '.success==true and ((.errors//[])|length)==0 and ([.result[].success]|all)' "$2" >/dev/null
          }

          query_d1 "SELECT 1 AS live" formal-soak-evidence/live.json
          query_d1 "SELECT epoch_id,last_processed_ledger,last_processed_hash,latest_observed_ledger,latest_observed_hash,status,updated_at,lag_ledgers FROM fast_lane_shadow_state WHERE network='devnet'" formal-soak-evidence/state.json
          query_d1 "SELECT base_epoch_id,base_snapshot_id,base_ledger_index,base_ledger_hash FROM fast_lane_shadow_base_binding WHERE network='devnet'" formal-soak-evidence/binding.json
          query_d1 "SELECT COUNT(*) AS overlay_rows,COALESCE(SUM(LENGTH(projection_json)),0) AS overlay_payload_bytes FROM current_state_overlay_objects WHERE network='devnet'" formal-soak-evidence/overlay.json
          query_d1 "SELECT COUNT(*) AS stale_rows FROM current_state_overlay_objects o WHERE o.network='devnet' AND NOT EXISTS (SELECT 1 FROM fast_lane_shadow_base_binding b WHERE b.network=o.network AND b.base_epoch_id=o.epoch_id AND b.base_snapshot_id=o.base_snapshot_id)" formal-soak-evidence/stale.json
          query_d1 "SELECT COUNT(*) AS state_rows,MAX(overlay_ledger_index) AS overlay_ledger_index FROM current_state_overlay_state WHERE network='devnet'" formal-soak-evidence/overlay-state.json
          query_d1 "SELECT COUNT(*) AS compact_rows FROM fast_lane_shadow_objects_compact WHERE network='devnet'" formal-soak-evidence/compact.json
          query_d1 "SELECT COUNT(*) AS foldable_rows FROM fast_lane_shadow_objects_compact fast WHERE fast.network='devnet' AND EXISTS (SELECT 1 FROM current_state_overlay_objects overlay JOIN fast_lane_shadow_base_binding binding ON binding.network='devnet' WHERE overlay.network='devnet' AND overlay.epoch_id=binding.base_epoch_id AND overlay.base_snapshot_id=binding.base_snapshot_id AND overlay.object_type=fast.object_type AND overlay.object_id=fast.object_id AND (overlay.source_ledger_index>fast.source_ledger_index OR (overlay.source_ledger_index=fast.source_ledger_index AND overlay.source_transaction_index>=fast.source_transaction_index)))" formal-soak-evidence/foldable.json

          SLOTS_SQL=$(cat <<'SQL'
          WITH base AS (
            SELECT run_at,status,end_ledger_index,latest_observed_ledger,lag_ledgers,error_message,
                   CAST(strftime('%s',run_at)/300 AS INTEGER) AS slot_id
            FROM fast_lane_shadow_run_metrics
            WHERE network='devnet' AND julianday(run_at)>=julianday('now','-45 minutes')
          ), ranked AS (
            SELECT *,ROW_NUMBER() OVER(PARTITION BY slot_id ORDER BY run_at DESC) terminal_rank,
                   SUM(CASE WHEN status='error' OR error_message IS NOT NULL THEN 1 ELSE 0 END) OVER(PARTITION BY slot_id) errors_in_slot
            FROM base
          )
          SELECT slot_id,run_at,status,end_ledger_index,latest_observed_ledger,lag_ledgers,error_message,errors_in_slot
          FROM ranked WHERE terminal_rank=1 ORDER BY slot_id DESC LIMIT 6
          SQL
          )
          query_d1 "$SLOTS_SQL" formal-soak-evidence/slots.json

          curl --fail-with-body --silent --show-error -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-monitor/schedules" > formal-soak-evidence/schedules.json
          curl --fail-with-body --silent --show-error -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}" > formal-soak-evidence/database.json

          overview_http="$(curl --silent --show-error -o formal-soak-evidence/overview.json -w '%{http_code}' "${PRODUCTION_BASE}/api/overview")"
          history_http="$(curl --silent --show-error -o formal-soak-evidence/history.json -w '%{http_code}' "${PRODUCTION_BASE}/api/status/history-source")"
          diff_http="$(curl --silent --show-error -o formal-soak-evidence/diff.json -w '%{http_code}' "${PRODUCTION_BASE}/api/status/fast-lane-diff?limit=500")"

          today="$(date -u +%F)"
          read -r -d '' q <<'GRAPHQL' || true
          query D1Usage($accountTag:string!,$start:Date,$end:Date,$databaseId:string){viewer{accounts(filter:{accountTag:$accountTag}){d1AnalyticsAdaptiveGroups(limit:10000,filter:{date_geq:$start,date_leq:$end,databaseId:$databaseId}){sum{rowsRead rowsWritten}}}}}
          GRAPHQL
          jq -n --arg query "$q" --arg accountTag "$CLOUDFLARE_ACCOUNT_ID" --arg start "$today" --arg end "$today" --arg databaseId "$DATABASE_ID" '{query:$query,variables:{accountTag:$accountTag,start:$start,end:$end,databaseId:$databaseId}}' > formal-soak-evidence/usage-request.json
          curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'content-type: application/json' --data @formal-soak-evidence/usage-request.json https://api.cloudflare.com/client/v4/graphql > formal-soak-evidence/usage.json

          rows_read="$(jq '[.data.viewer.accounts[0].d1AnalyticsAdaptiveGroups[].sum.rowsRead//0]|add//0' formal-soak-evidence/usage.json)"
          rows_written="$(jq '[.data.viewer.accounts[0].d1AnalyticsAdaptiveGroups[].sum.rowsWritten//0]|add//0' formal-soak-evidence/usage.json)"
          state="$(jq -c '.result[0].results[0]' formal-soak-evidence/state.json)"
          binding="$(jq -c '.result[0].results[0]' formal-soak-evidence/binding.json)"
          overlay="$(jq -c '.result[0].results[0]' formal-soak-evidence/overlay.json)"
          stale="$(jq -c '.result[0].results[0]' formal-soak-evidence/stale.json)"
          ostate="$(jq -c '.result[0].results[0]' formal-soak-evidence/overlay-state.json)"
          compact="$(jq -c '.result[0].results[0]' formal-soak-evidence/compact.json)"
          foldable="$(jq -c '.result[0].results[0]' formal-soak-evidence/foldable.json)"
          database_bytes="$(jq -r '.result.file_size' formal-soak-evidence/database.json)"

          schedule_ok="$(jq '.success==true and (.result.schedules|length)==1 and .result.schedules[0].cron=="*/5 * * * *"' formal-soak-evidence/schedules.json)"
          state_ok="$(jq -n --argjson s "$state" '$s.status=="healthy" and $s.lag_ledgers==0 and $s.last_processed_ledger==$s.latest_observed_ledger and $s.last_processed_hash==$s.latest_observed_hash')"
          binding_ok="$(jq -n --argjson b "$binding" '$b.base_epoch_id=="devnet-3371675" and $b.base_snapshot_id=="devnet-3800885-eaa0d29666e7" and $b.base_ledger_index==3800885 and $b.base_ledger_hash=="EAA0D29666E73D7594A52DF8000B07F346CD4DA24A9A07549612CDC7D727B700"')"
          storage_ok="$(jq -n --argjson o "$overlay" --argjson s "$stale" --argjson os "$ostate" --argjson c "$compact" --argjson f "$foldable" --argjson db "$database_bytes" '$o.overlay_rows>0 and $o.overlay_rows<59000 and $o.overlay_payload_bytes<70000000 and $s.stale_rows==0 and $os.state_rows==1 and $c.compact_rows==0 and $f.foldable_rows==0 and $db<400000000')"
          usage_ok="$(jq -n --argjson r "$rows_read" --argjson w "$rows_written" '$r<1000000 and $w<20000')"
          slots_ok="$(jq '.result[0].results as $s | ($s|length)==6 and (($s[0].slot_id-$s[5].slot_id)==5) and ($s|all((.status=="committed" or .status=="caught_up") and .lag_ledgers==0 and .error_message==null and .errors_in_slot==0))' formal-soak-evidence/slots.json)"
          api_ok="$(jq -n --arg oh "$overview_http" --arg hh "$history_http" --arg dh "$diff_http" --slurpfile d formal-soak-evidence/diff.json '$oh=="200" and $hh=="200" and $dh=="200" and ($d[0].sample.exactProjectionMismatches//0)==0 and ($d[0].sample.canonicalAheadRows//0)==0')"
          passed="$(jq -n --argjson a "$schedule_ok" --argjson b "$state_ok" --argjson c "$binding_ok" --argjson d "$storage_ok" --argjson e "$usage_ok" --argjson f "$slots_ok" --argjson g "$api_ok" '$a and $b and $c and $d and $e and $f and $g')"

          jq -n --argjson passed "$passed" --argjson rowsRead "$rows_read" --argjson rowsWritten "$rows_written" --argjson databaseBytes "$database_bytes" --argjson state "$state" --argjson binding "$binding" --argjson overlay "$overlay" --argjson stale "$stale" --argjson overlayState "$ostate" --argjson compact "$compact" --argjson foldable "$foldable" --slurpfile slots formal-soak-evidence/slots.json --slurpfile diff formal-soak-evidence/diff.json --arg overviewHttp "$overview_http" --arg historyHttp "$history_http" --arg diffHttp "$diff_http" '{passed:$passed,checkedAt:(now|todate),window:{startAt:"2026-07-22T01:00:00Z",endAt:"2026-07-23T01:00:00Z"},d1Today:{rowsRead:$rowsRead,rowsWritten:$rowsWritten},databaseBytes:$databaseBytes,state:$state,binding:$binding,overlay:$overlay,stale:$stale,overlayState:$overlayState,compact:$compact,foldable:$foldable,slots:$slots[0].result[0].results,api:{overviewHttp:$overviewHttp,historyHttp:$historyHttp,diffHttp:$diffHttp,diff:$diff[0]}}' > formal-soak-evidence/summary.json
          test "$passed" = true

      - name: Mark window running and report
        if: success()
        shell: bash
        run: |
          python - <<'PY'
          import json
          p='.github/formal-free-soak-window.json'
          x=json.load(open(p))
          x['status']='running'
          json.dump(x,open(p,'w'),indent=2)
          open(p,'a').write('\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/formal-free-soak-window.json
          git commit -m 'Start formal Free-operation soak at 2026-07-22 10:00 JST'
          git push
          { echo 'Accepted formal Free-operation soak baseline:'; echo; echo '```json'; cat formal-soak-evidence/summary.json; echo '```'; } > formal-soak-evidence/comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file formal-soak-evidence/comment.md

      - name: Report rejection
        if: failure()
        shell: bash
        run: |
          test -s formal-soak-evidence/summary.json || echo '{"passed":false,"reason":"start gate failed before summary"}' > formal-soak-evidence/summary.json
          { echo 'Formal Free-operation soak start gate rejected:'; echo; echo '```json'; cat formal-soak-evidence/summary.json; echo '```'; } > formal-soak-evidence/rejected.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file formal-soak-evidence/rejected.md
