name: Formal Free-operation soak start gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/formal-free-soak-start-trigger

permissions:
  contents: read
  issues: write

concurrency:
  group: formal-free-soak-start-gate
  cancel-in-progress: false

jobs:
  start-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: '962'
      PRODUCTION_BASE: https://xrpl-lending-monitor.badjoke-lab.workers.dev
      TARGET_EPOCH: devnet-3371675
      TARGET_SNAPSHOT: devnet-3800885-eaa0d29666e7
      TARGET_LEDGER: '3800885'
      TARGET_HASH: EAA0D29666E73D7594A52DF8000B07F346CD4DA24A9A07549612CDC7D727B700
      SOAK_START: '2026-07-22T00:15:00Z'
      SOAK_END: '2026-07-23T00:15:00Z'
    steps:
      - name: Check out implementation
        uses: actions/checkout@v4

      - name: Check out current-state publication identity
        uses: actions/checkout@v4
        with:
          ref: current-state-data
          path: .local/current-state
          sparse-checkout: read-model/manifest.json
          sparse-checkout-cone-mode: false

      - name: Check out history publication identity
        uses: actions/checkout@v4
        with:
          ref: history-data
          path: .local/history
          sparse-checkout: history/publication.json
          sparse-checkout-cone-mode: false

      - name: Capture and enforce start gate
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p start-gate-evidence

          now_epoch="$(date -u +%s)"
          start_epoch="$(date -u -d "$SOAK_START" +%s)"
          test "$now_epoch" -ge "$((start_epoch - 540))"
          test "$now_epoch" -lt "$start_epoch"

          query_d1() {
            local sql="$1"
            local output="$2"
            jq -n --arg sql "$sql" '{sql:$sql}' \
              | curl --fail-with-body --silent --show-error \
                  -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  -H 'Content-Type: application/json' \
                  --data-binary @- \
                  "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query" \
              > "$output"
            jq -e '.success==true and ((.errors // [])|length)==0 and ([.result[].success]|all)' "$output" > /dev/null
          }

          query_d1 "SELECT epoch_id,last_processed_ledger,last_processed_hash,latest_observed_ledger,latest_observed_hash,status,updated_at,(latest_observed_ledger-last_processed_ledger) AS lag_ledgers FROM fast_lane_shadow_state WHERE network='devnet'" start-gate-evidence/state.json
          query_d1 "SELECT base_epoch_id,base_snapshot_id,base_ledger_index,base_ledger_hash FROM fast_lane_shadow_base_binding WHERE network='devnet'" start-gate-evidence/binding.json
          query_d1 "SELECT COUNT(*) AS overlay_rows,COALESCE(SUM(LENGTH(projection_json)),0) AS overlay_payload_bytes FROM current_state_overlay_objects WHERE network='devnet'" start-gate-evidence/overlay.json
          query_d1 "SELECT COUNT(*) AS stale_rows FROM current_state_overlay_objects o WHERE o.network='devnet' AND NOT EXISTS (SELECT 1 FROM fast_lane_shadow_base_binding b WHERE b.network=o.network AND b.base_epoch_id=o.epoch_id AND b.base_snapshot_id=o.base_snapshot_id)" start-gate-evidence/stale.json
          query_d1 "SELECT COUNT(*) AS state_rows,MAX(overlay_ledger_index) AS overlay_ledger_index,MAX(overlay_ledger_hash) AS overlay_ledger_hash FROM current_state_overlay_state WHERE network='devnet'" start-gate-evidence/overlay-state.json
          query_d1 "SELECT COUNT(*) AS compact_rows FROM fast_lane_shadow_objects_compact WHERE network='devnet'" start-gate-evidence/compact.json
          query_d1 "SELECT COUNT(*) AS foldable_rows FROM fast_lane_shadow_objects_compact AS fast WHERE fast.network='devnet' AND EXISTS (SELECT 1 FROM current_state_overlay_objects AS overlay JOIN fast_lane_shadow_base_binding AS binding ON binding.network='devnet' WHERE overlay.network='devnet' AND overlay.epoch_id=binding.base_epoch_id AND overlay.base_snapshot_id=binding.base_snapshot_id AND overlay.object_type=fast.object_type AND overlay.object_id=fast.object_id AND (overlay.source_ledger_index>fast.source_ledger_index OR (overlay.source_ledger_index=fast.source_ledger_index AND overlay.source_transaction_index>=fast.source_transaction_index)))" start-gate-evidence/foldable.json

          SLOTS_SQL=$(cat <<'SQL'
          WITH base AS (
            SELECT run_at,status,end_ledger_index,latest_observed_ledger,lag_ledgers,error_message,
                   CAST(strftime('%s',run_at)/300 AS INTEGER) AS slot_id
            FROM fast_lane_shadow_run_metrics
            WHERE network='devnet' AND julianday(run_at)>=julianday('now','-45 minutes')
          ), ranked AS (
            SELECT *,ROW_NUMBER() OVER (PARTITION BY slot_id ORDER BY run_at DESC) AS terminal_rank,
                   COUNT(*) OVER (PARTITION BY slot_id) AS runs_in_slot,
                   SUM(CASE WHEN status='error' OR error_message IS NOT NULL THEN 1 ELSE 0 END) OVER (PARTITION BY slot_id) AS errors_in_slot
            FROM base
          )
          SELECT slot_id,run_at,status,end_ledger_index,latest_observed_ledger,lag_ledgers,error_message,runs_in_slot,errors_in_slot,
                 CAST(strftime('%s','now') AS INTEGER)-CAST(strftime('%s',run_at) AS INTEGER) AS age_seconds
          FROM ranked WHERE terminal_rank=1 ORDER BY slot_id DESC LIMIT 6
          SQL
          )
          query_d1 "$SLOTS_SQL" start-gate-evidence/slots.json

          curl --fail-with-body --silent --show-error --retry 3 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-monitor/schedules" \
            > start-gate-evidence/schedules.json
          curl --fail-with-body --silent --show-error --retry 3 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}" \
            > start-gate-evidence/database.json

          overview_http="$(curl --silent --show-error --retry 3 -o start-gate-evidence/overview.json -w '%{http_code}' "${PRODUCTION_BASE}/api/overview")"
          history_http="$(curl --silent --show-error --retry 3 -o start-gate-evidence/history.json -w '%{http_code}' "${PRODUCTION_BASE}/api/status/history-source")"
          diff_http="$(curl --silent --show-error --retry 3 -o start-gate-evidence/diff.json -w '%{http_code}' "${PRODUCTION_BASE}/api/status/fast-lane-diff?limit=500")"

          today="$(date -u +%F)"
          read -r -d '' usage_query <<'GRAPHQL' || true
          query D1Usage($accountTag:string!,$start:Date,$end:Date,$databaseId:string){viewer{accounts(filter:{accountTag:$accountTag}){d1AnalyticsAdaptiveGroups(limit:10000,filter:{date_geq:$start,date_leq:$end,databaseId:$databaseId}){sum{rowsRead rowsWritten}}}}}
          GRAPHQL
          jq -n --arg query "$usage_query" --arg accountTag "$CLOUDFLARE_ACCOUNT_ID" --arg start "$today" --arg end "$today" --arg databaseId "$DATABASE_ID" '{query:$query,variables:{accountTag:$accountTag,start:$start,end:$end,databaseId:$databaseId}}' > start-gate-evidence/usage-request.json
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'content-type: application/json' \
            --data @start-gate-evidence/usage-request.json \
            https://api.cloudflare.com/client/v4/graphql > start-gate-evidence/usage.json

          state="$(jq -c '.result[0].results[0]' start-gate-evidence/state.json)"
          binding="$(jq -c '.result[0].results[0]' start-gate-evidence/binding.json)"
          overlay="$(jq -c '.result[0].results[0]' start-gate-evidence/overlay.json)"
          stale="$(jq -c '.result[0].results[0]' start-gate-evidence/stale.json)"
          overlay_state="$(jq -c '.result[0].results[0]' start-gate-evidence/overlay-state.json)"
          compact="$(jq -c '.result[0].results[0]' start-gate-evidence/compact.json)"
          foldable="$(jq -c '.result[0].results[0]' start-gate-evidence/foldable.json)"
          database_bytes="$(jq -r '.result.file_size' start-gate-evidence/database.json)"
          rows_read="$(jq '[.data.viewer.accounts[0].d1AnalyticsAdaptiveGroups[].sum.rowsRead // 0] | add // 0' start-gate-evidence/usage.json)"
          rows_written="$(jq '[.data.viewer.accounts[0].d1AnalyticsAdaptiveGroups[].sum.rowsWritten // 0] | add // 0' start-gate-evidence/usage.json)"

          schedule_ok="$(jq '.success==true and (.result.schedules|length)==1 and .result.schedules[0].cron=="*/5 * * * *"' start-gate-evidence/schedules.json)"
          config_ok="$(jq '.triggers.crons==["*/5 * * * *"] and .vars.APP_NETWORK=="devnet" and .vars.MAINNET_ENABLED=="false" and (.queues.producers|length)==1 and (.queues.consumers|length)==1 and .queues.consumers[0].max_batch_size==1 and .queues.consumers[0].max_concurrency==1' wrangler.jsonc)"
          state_ok="$(jq -n --argjson s "$state" '$s.status=="healthy" and $s.lag_ledgers==0 and $s.last_processed_ledger==$s.latest_observed_ledger and $s.last_processed_hash==$s.latest_observed_hash')"
          binding_ok="$(jq -n --argjson b "$binding" --arg epoch "$TARGET_EPOCH" --arg snapshot "$TARGET_SNAPSHOT" --argjson ledger "$TARGET_LEDGER" --arg hash "$TARGET_HASH" '$b.base_epoch_id==$epoch and $b.base_snapshot_id==$snapshot and $b.base_ledger_index==$ledger and $b.base_ledger_hash==$hash')"
          publication_ok="$(jq -n --slurpfile current .local/current-state/read-model/manifest.json --slurpfile history .local/history/history/publication.json --arg epoch "$TARGET_EPOCH" --arg snapshot "$TARGET_SNAPSHOT" --argjson ledger "$TARGET_LEDGER" --arg hash "$TARGET_HASH" '$current[0].complete==true and $current[0].epochId==$epoch and $current[0].snapshotId==$snapshot and $current[0].ledgerIndex==$ledger and $current[0].ledgerHash==$hash and $history[0].complete==true and $history[0].endLedgerIndex==$ledger and $history[0].endLedgerHash==$hash')"
          storage_ok="$(jq -n --argjson s "$state" --argjson o "$overlay" --argjson st "$stale" --argjson os "$overlay_state" --argjson c "$compact" --argjson f "$foldable" --argjson db "$database_bytes" '$o.overlay_rows>0 and $o.overlay_rows<59000 and $o.overlay_payload_bytes<70000000 and $st.stale_rows==0 and $os.state_rows==1 and $os.overlay_ledger_index==$s.last_processed_ledger and $os.overlay_ledger_hash==$s.last_processed_hash and $c.compact_rows==0 and $f.foldable_rows==0 and $db<400000000')"
          usage_ok="$(jq -n --argjson r "$rows_read" --argjson w "$rows_written" '$r<1000000 and $w<20000')"
          api_ok="$(jq -n --arg overview "$overview_http" --arg history "$history_http" --arg diff "$diff_http" --slurpfile d start-gate-evidence/diff.json '$overview=="200" and $history=="200" and $diff=="200" and $d[0].status=="ok" and $d[0].passed==true and $d[0].reason==null and $d[0].fastLane.ledgerIndex==$d[0].canonicalOverlay.ledgerIndex and $d[0].fastLane.ledgerHash==$d[0].canonicalOverlay.ledgerHash and ($d[0].sample.exactProjectionMismatches // 0)==0 and ($d[0].sample.canonicalAheadRows // 0)==0')"
          slots_ok="$(jq '.result[0].results as $s | ($s|length)==6 and (($s[0].slot_id-$s[5].slot_id)==5) and ($s|all((.status=="committed" or .status=="caught_up") and .lag_ledgers==0 and .error_message==null and .errors_in_slot==0 and (.end_ledger_index|type)=="number")) and ($s[0].age_seconds>=0 and $s[0].age_seconds<=420)' start-gate-evidence/slots.json)"
          passed="$(jq -n --argjson a "$schedule_ok" --argjson b "$config_ok" --argjson c "$state_ok" --argjson d "$binding_ok" --argjson e "$publication_ok" --argjson f "$storage_ok" --argjson g "$usage_ok" --argjson h "$api_ok" --argjson i "$slots_ok" '$a and $b and $c and $d and $e and $f and $g and $h and $i')"

          jq -n \
            --argjson passed "$passed" \
            --argjson scheduleOk "$schedule_ok" \
            --argjson configOk "$config_ok" \
            --argjson stateOk "$state_ok" \
            --argjson bindingOk "$binding_ok" \
            --argjson publicationOk "$publication_ok" \
            --argjson storageOk "$storage_ok" \
            --argjson usageOk "$usage_ok" \
            --argjson apiOk "$api_ok" \
            --argjson slotsOk "$slots_ok" \
            --argjson state "$state" \
            --argjson binding "$binding" \
            --argjson overlay "$overlay" \
            --argjson stale "$stale" \
            --argjson overlayState "$overlay_state" \
            --argjson compact "$compact" \
            --argjson foldable "$foldable" \
            --argjson databaseBytes "$database_bytes" \
            --argjson rowsRead "$rows_read" \
            --argjson rowsWritten "$rows_written" \
            --slurpfile slots start-gate-evidence/slots.json \
            --slurpfile diff start-gate-evidence/diff.json \
            --arg start "$SOAK_START" \
            --arg end "$SOAK_END" \
            '{passed:$passed,checks:{scheduleOk:$scheduleOk,configOk:$configOk,stateOk:$stateOk,bindingOk:$bindingOk,publicationOk:$publicationOk,storageOk:$storageOk,usageOk:$usageOk,apiOk:$apiOk,slotsOk:$slotsOk},state:$state,binding:$binding,overlay:$overlay,stale:$stale,overlayState:$overlayState,compact:$compact,foldable:$foldable,databaseBytes:$databaseBytes,d1Today:{rowsRead:$rowsRead,rowsWritten:$rowsWritten},diff:$diff[0],slots:$slots[0].result[0].results,soakStart:$start,soakEnd:$end}' \
            > start-gate-evidence/summary.json

          test "$passed" = true

      - name: Report start gate
        if: always()
        shell: bash
        run: |
          test -s start-gate-evidence/summary.json || echo '{"passed":false,"reason":"start gate failed before summary"}' > start-gate-evidence/summary.json
          {
            echo 'Formal Free-operation soak start gate:'
            echo
            echo '```json'
            cat start-gate-evidence/summary.json
            echo '```'
          } > start-gate-evidence/comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body-file start-gate-evidence/comment.md
          if jq -e '.passed==true' start-gate-evidence/summary.json > /dev/null; then
            gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body 'Start gate accepted. The formal 288-slot Free-operation soak starts at 2026-07-22 09:15 JST and ends at 2026-07-23 09:15 JST.'
            gh issue edit "$ISSUE_NUMBER" --repo "$REPOSITORY" --add-label in-progress
          else
            gh issue edit "$ISSUE_NUMBER" --repo "$REPOSITORY" --title 'NOT STARTED — 24h five-minute Free-operation soak post-recovery 2026-07-22 09:15 JST' --state closed
          fi

      - name: Upload start-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formal-free-soak-start-gate
          path: start-gate-evidence
          if-no-files-found: warn
          retention-days: 30
