name: P0 run Queue production deploy

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    if: startsWith(github.event.issue.title, 'P0 run Queue production deploy')
    concurrency:
      group: p0-emergency-production-worker-write
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      QUEUE_NAME: xrpl-lending-fast-lane
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Queue production boundary
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "$(jq -r '.vars.APP_NETWORK' wrangler.jsonc)" = devnet
          test "$(jq -r '.vars.MAINNET_ENABLED' wrangler.jsonc)" = false
          test "$(jq -r '.triggers.crons | length' wrangler.jsonc)" -eq 1
          test "$(jq -r '.triggers.crons[0]' wrangler.jsonc)" = '*/5 * * * *'
          test "$(jq -r '.queues.producers[0].binding' wrangler.jsonc)" = FAST_LANE_QUEUE
          test "$(jq -r '.queues.producers[0].queue' wrangler.jsonc)" = "$QUEUE_NAME"
          test "$(jq -r '.queues.consumers[0].queue' wrangler.jsonc)" = "$QUEUE_NAME"
          test "$(jq -r '.queues.consumers[0].max_batch_size' wrangler.jsonc)" -eq 1
          test "$(jq -r '.queues.consumers[0].max_concurrency' wrangler.jsonc)" -eq 1

      - name: Ensure production Queue exists
        shell: bash
        run: |
          set -euo pipefail
          if pnpm exec wrangler queues info "$QUEUE_NAME" > /tmp/queue-info-before.txt 2>&1; then
            echo "Queue already exists"
          else
            cat /tmp/queue-info-before.txt
            pnpm exec wrangler queues create "$QUEUE_NAME" | tee /tmp/queue-create.txt
          fi
          pnpm exec wrangler queues info "$QUEUE_NAME" | tee /tmp/queue-info-after.txt

      - name: Build application
        run: pnpm build

      - name: Apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply xrpl-lending-monitor --remote

      - name: Deploy Queue producer and consumer
        run: pnpm exec wrangler deploy | tee /tmp/deploy.txt

      - name: Verify deployed five-minute Cron
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-monitor/schedules" \
            > /tmp/deployed-worker-schedules.json
          jq -e '.success == true and (.result.schedules | length) == 1 and .result.schedules[0].cron == "*/5 * * * *"' \
            /tmp/deployed-worker-schedules.json > /dev/null
          pnpm exec wrangler queues info "$QUEUE_NAME" | tee /tmp/queue-info-deployed.txt

      - name: Report Queue deployment result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'P0 Queue production deployment result:'
            echo
            echo "Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '```text'
            for path in /tmp/queue-info-before.txt /tmp/queue-create.txt /tmp/queue-info-after.txt /tmp/deploy.txt /tmp/queue-info-deployed.txt; do
              if [ -s "$path" ]; then
                echo "--- $(basename "$path") ---"
                tail -n 50 "$path"
              fi
            done
            if [ -s /tmp/deployed-worker-schedules.json ]; then
              echo '--- deployed-worker-schedules.json ---'
              jq . /tmp/deployed-worker-schedules.json
            fi
            echo '```'
          } > /tmp/comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
