name: Free-plan capacity audit

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/free-plan-capacity-audit.yml]

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Capture D1 database information
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p capacity-audit/counts
          pnpm exec wrangler d1 info xrpl-lending-monitor --json > capacity-audit/d1-info.json

      - name: Capture schema inventory
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler d1 execute xrpl-lending-monitor --remote --json --command \
            "SELECT type, name, tbl_name FROM sqlite_master WHERE type IN ('table','index') ORDER BY type, name;" \
            > capacity-audit/schema-inventory.json

      - name: Capture key table row counts
        shell: bash
        run: |
          set -u
          for TABLE in \
            processed_ledgers \
            protocol_events \
            object_changes \
            loan_lifecycle_events \
            archived_objects \
            balance_history \
            current_state_overlay_objects \
            network_epochs; do
            pnpm exec wrangler d1 execute xrpl-lending-monitor --remote --json --command \
              "SELECT '${TABLE}' AS table_name, COUNT(*) AS row_count FROM ${TABLE};" \
              > "capacity-audit/counts/${TABLE}.json" 2> "capacity-audit/counts/${TABLE}.stderr.txt" || true
          done

      - name: Upload capacity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-plan-capacity-audit
          path: capacity-audit
          if-no-files-found: error
          retention-days: 7
