name: Free-plan capacity audit

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/free-plan-capacity-audit.yml]

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Capture D1 database information
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p capacity-audit
          pnpm exec wrangler d1 info xrpl-lending-monitor --json > capacity-audit/d1-info.json

      - name: Capture row counts and page metrics
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler d1 execute xrpl-lending-monitor --remote --json --command "
            SELECT 'processed_ledgers' AS table_name, COUNT(*) AS row_count FROM processed_ledgers
            UNION ALL SELECT 'protocol_events', COUNT(*) FROM protocol_events
            UNION ALL SELECT 'object_changes', COUNT(*) FROM object_changes
            UNION ALL SELECT 'loan_lifecycle_events', COUNT(*) FROM loan_lifecycle_events
            UNION ALL SELECT 'archived_objects', COUNT(*) FROM archived_objects
            UNION ALL SELECT 'balance_history', COUNT(*) FROM balance_history
            UNION ALL SELECT 'current_state_overlay_objects', COUNT(*) FROM current_state_overlay_objects
            UNION ALL SELECT 'network_epochs', COUNT(*) FROM network_epochs;
          " > capacity-audit/row-counts.json

          pnpm exec wrangler d1 execute xrpl-lending-monitor --remote --json --command "PRAGMA page_count;" > capacity-audit/page-count.json
          pnpm exec wrangler d1 execute xrpl-lending-monitor --remote --json --command "PRAGMA page_size;" > capacity-audit/page-size.json

      - name: Upload capacity evidence
        uses: actions/upload-artifact@v4
        with:
          name: free-plan-capacity-audit
          path: capacity-audit
          if-no-files-found: error
          retention-days: 7
