name: Patch M5 browser JSON retry

on:
  pull_request:
    paths:
      - .github/workflows/patch-m5-browser-json-retry.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Retry transient non-JSON server failures
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/run-m5-5-browser-regression.mjs')
          text = path.read_text()
          old = '''    let json
    try {
      json = JSON.parse(text)
    } catch {
      throw new Error(`${relativePath} returned invalid JSON`)
    }

    last = { status: response.status, json, text }'''
          new = '''    let json
    try {
      json = JSON.parse(text)
    } catch {
      const retryable = response.status >= 500 && response.status <= 599
      if (retryable && attempt < maxAttempts) {
        await new Promise((resolve) => setTimeout(resolve, attempt * 1000))
        continue
      }
      throw new Error(`${relativePath} returned invalid JSON with HTTP ${response.status}`)
    }

    last = { status: response.status, json, text }'''
          if old not in text:
            raise SystemExit('request JSON parse anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/run-m5-5-browser-regression.mjs
          git commit -m 'Retry transient non-JSON browser audit failures'
          git push origin HEAD:${{ github.head_ref }}
