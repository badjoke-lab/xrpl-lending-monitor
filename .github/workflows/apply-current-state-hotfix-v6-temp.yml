name: Apply current-state hotfix v6 once
on:
  pull_request:
    paths: [.github/workflows/apply-current-state-hotfix-v6-temp.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply source and status patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git log -1 --pretty=%s)" = "Add source-only push hotfix applier" || exit 0
          cp current-state-hotfix.patch "${RUNNER_TEMP}/current-state-hotfix.patch"
          sed -i 's/@@ -87,7 +89,8 @@/@@ -87,6 +89,7 @@/' "${RUNNER_TEMP}/current-state-hotfix.patch"
          git apply "${RUNNER_TEMP}/current-state-hotfix.patch"
          git restore .github/workflows/m1-exit-review.yml
          git diff --check
      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/worker/repositories/release-current-state.ts docs/implementation-status.md
          git commit -m "Fix current-state relation list reads"
      - name: Push source changes
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
