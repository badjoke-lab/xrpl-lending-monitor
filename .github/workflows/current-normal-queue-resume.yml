name: Current normal Queue resume (no proof gate)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: current-normal-queue-resume-operational
  cancel-in-progress: false

env:
  QUALIFICATION_ISSUE: '995'
  QUEUE_ID: 2ae398f2edbf43749e45cd7ede77c6cd
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  resume:
    if: >-
      github.event.issue.number == 995 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      github.event.comment.body == '/current-normal-queue-resume-no-proof'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Capture Queue state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p current-normal-queue-resume
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          queue="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues/${QUEUE_ID}"
          curl -fsS -H "$auth" "$queue" \
            | tee current-normal-queue-resume/queue-before.json \
            | jq -e '.success == true' >/dev/null

      - name: Resume Queue delivery
        shell: bash
        run: |
          set -euo pipefail
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          queue="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues/${QUEUE_ID}"
          curl -fsS -X PATCH -H "$auth" -H 'Content-Type: application/json' "$queue" \
            --data '{"settings":{"delivery_paused":false}}' \
            | tee current-normal-queue-resume/resume-response.json \
            | jq -e '.success == true and .result.settings.delivery_paused == false' >/dev/null

      - name: Verify Queue is active
        shell: bash
        run: |
          set -euo pipefail
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          queue="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues/${QUEUE_ID}"
          curl -fsS -H "$auth" "$queue" \
            | tee current-normal-queue-resume/queue-after.json \
            | jq -e '.success == true and .result.settings.delivery_paused == false' >/dev/null
          jq -n '{passed:true,queueResumed:true,queueDeliveryPaused:false,proofGateRequired:false,d1Mutation:false,workerDeploymentMutation:false,cronMutation:false}' \
            > current-normal-queue-resume/result.json
          cat current-normal-queue-resume/result.json

      - name: Upload operational evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-normal-queue-resume
          path: current-normal-queue-resume
          if-no-files-found: warn
          retention-days: 30
