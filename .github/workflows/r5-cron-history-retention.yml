name: R5 cron history retention

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: r5-cron-history-retention
  cancel-in-progress: false

env:
  QUALIFICATION_ISSUE: '1261'
  MANAGER_PATH: scripts/manage-r5-cron-history-retention.mjs
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
  GH_TOKEN: ${{ github.token }}

jobs:
  prepare:
    if: >-
      github.event.issue.number == 1261 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      github.event.comment.body == '/r5-cron-history-retention-prepare'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Inspect retention pre-state read-only
        id: state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r5-cron-history-retention-evidence
          source_commit="$(git rev-parse HEAD)"
          manager_sha="$(sha256sum "$MANAGER_PATH" | awk '{print $1}')"
          node "$MANAGER_PATH" prepare \
            --source-commit "$source_commit" \
            --output r5-cron-history-retention-evidence/prepare.json \
            > /tmp/r5-cron-history-retention-prepare.json
          test "$(jq -r '.jobRows' /tmp/r5-cron-history-retention-prepare.json)" = 0
          test "$(jq -r '.mutationAuthorized' /tmp/r5-cron-history-retention-prepare.json)" = false
          test "$(jq -r '.schedulerMutationAuthorized' /tmp/r5-cron-history-retention-prepare.json)" = false
          test "$(jq -r '.vacuumAuthorized' /tmp/r5-cron-history-retention-prepare.json)" = false
          printf 'source_commit=%s\nmanager_sha=%s\nstate_sha=%s\nproject_digest=%s\ncommand_sha=%s\nrows=%s\ncandidate_success=%s\ncandidate_non_success=%s\ndatabase_bytes=%s\ntable_bytes=%s\n' \
            "$source_commit" "$manager_sha" \
            "$(jq -r '.structuralStateSha256' /tmp/r5-cron-history-retention-prepare.json)" \
            "$(jq -r '.structuralState.projectIdentityDigest' /tmp/r5-cron-history-retention-prepare.json)" \
            "$(jq -r '.cleanup.commandSha256' /tmp/r5-cron-history-retention-prepare.json)" \
            "$(jq -r '.exactRows' /tmp/r5-cron-history-retention-prepare.json)" \
            "$(jq -r '.candidateSucceededRows' /tmp/r5-cron-history-retention-prepare.json)" \
            "$(jq -r '.candidateNonSucceededRows' /tmp/r5-cron-history-retention-prepare.json)" \
            "$(jq -r '.databaseBytes' /tmp/r5-cron-history-retention-prepare.json)" \
            "$(jq -r '.tableBytes' /tmp/r5-cron-history-retention-prepare.json)" >> "$GITHUB_OUTPUT"

      - name: Publish expiring owner authorization proposal
        env:
          SOURCE_COMMIT: ${{ steps.state.outputs.source_commit }}
          MANAGER_SHA: ${{ steps.state.outputs.manager_sha }}
          STATE_SHA: ${{ steps.state.outputs.state_sha }}
          PROJECT_DIGEST: ${{ steps.state.outputs.project_digest }}
          COMMAND_SHA: ${{ steps.state.outputs.command_sha }}
          ROWS: ${{ steps.state.outputs.rows }}
          CANDIDATE_SUCCESS: ${{ steps.state.outputs.candidate_success }}
          CANDIDATE_NON_SUCCESS: ${{ steps.state.outputs.candidate_non_success }}
          DATABASE_BYTES: ${{ steps.state.outputs.database_bytes }}
          TABLE_BYTES: ${{ steps.state.outputs.table_bytes }}
        shell: bash
        run: |
          set -euo pipefail
          expires="$(date -u -d '+2 hours' '+%Y-%m-%dT%H:%M:%SZ')"
          nonce="$(openssl rand -hex 8)"
          command="/r5-cron-history-retention-authorize commit=${SOURCE_COMMIT} manager=${MANAGER_SHA} state=${STATE_SHA} project=${PROJECT_DIGEST} command=${COMMAND_SHA} prepare_run=${GITHUB_RUN_ID} expires=${expires} nonce=${nonce}"
          cat > /tmp/r5-cron-history-retention-proposal.md <<EOF2
          ## R5 cron history retention authorization proposal

          Preparation run: \`${GITHUB_RUN_ID}\`
          Source main commit: \`${SOURCE_COMMIT}\`
          Manager SHA-256: \`${MANAGER_SHA}\`
          Authorized structural state SHA-256: \`${STATE_SHA}\`
          Project identity digest: \`${PROJECT_DIGEST}\`
          Cleanup command SHA-256: \`${COMMAND_SHA}\`
          Current cron history rows / relation bytes: \`${ROWS} / ${TABLE_BYTES}\`
          Initial candidates succeeded / non-succeeded: \`${CANDIDATE_SUCCESS} / ${CANDIDATE_NON_SUCCESS}\`
          Database bytes: \`${DATABASE_BYTES}\`
          Policy: succeeded logs >24h deleted; non-succeeded terminal logs >7d deleted; cleanup runs every 6h at minute 17 UTC.
          Authorization expires: \`${expires}\`

          This authorizes one bounded initial DELETE plus creation of exactly one named pg_cron cleanup job. It does not authorize VACUUM, payload/commit deletion, scheduler changes other than this exact cleanup job, deployment, public-reader mutation, Mainnet, stabilization, soak, or R5 restart.

          Exact owner authorization command:

          \`${command}\`
          EOF2
          gh issue comment "$QUALIFICATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/r5-cron-history-retention-proposal.md

      - name: Upload sanitized preparation evidence
        uses: actions/upload-artifact@v4
        with:
          name: r5-cron-history-retention-prepare-evidence
          path: r5-cron-history-retention-evidence
          if-no-files-found: error
          retention-days: 14

  execute:
    if: >-
      github.event.issue.number == 1261 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      startsWith(github.event.comment.body, '/r5-cron-history-retention-authorize ')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AUTHORIZATION_BODY: ${{ github.event.comment.body }}
      AUTHORIZATION_CREATED_AT: ${{ github.event.comment.created_at }}
      AUTHORIZATION_COMMENT_ID: ${{ github.event.comment.id }}
    steps:
      - name: Check out exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Parse exact owner authorization
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          regex='^/r5-cron-history-retention-authorize commit=([a-f0-9]{40}) manager=([a-f0-9]{64}) state=([a-f0-9]{64}) project=([a-f0-9]{64}) command=([a-f0-9]{64}) prepare_run=([0-9]+) expires=([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z) nonce=([a-f0-9]{16})$'
          [[ "$AUTHORIZATION_BODY" =~ $regex ]] || { echo 'authorization shape mismatch' >&2; exit 1; }
          commit="${BASH_REMATCH[1]}"; manager_sha="${BASH_REMATCH[2]}"; state_sha="${BASH_REMATCH[3]}"; project_digest="${BASH_REMATCH[4]}"; command_sha="${BASH_REMATCH[5]}"; prepare_run="${BASH_REMATCH[6]}"; expires="${BASH_REMATCH[7]}"; nonce="${BASH_REMATCH[8]}"
          test "$commit" = "$(git rev-parse HEAD)"
          test "$manager_sha" = "$(sha256sum "$MANAGER_PATH" | awk '{print $1}')"
          actual_project_digest="$(printf '%s' "$SUPABASE_PROJECT_ID" | sha256sum | awk '{print $1}')"
          test "$project_digest" = "$actual_project_digest"
          now_epoch="$(date -u +%s)"; expires_epoch="$(date -u -d "$expires" +%s)"; auth_epoch="$(date -u -d "$AUTHORIZATION_CREATED_AT" +%s)"
          test "$auth_epoch" -lt "$expires_epoch"; test "$now_epoch" -le "$expires_epoch"; test $((expires_epoch-auth_epoch)) -le 7200
          printf 'commit=%s\nmanager_sha=%s\nstate_sha=%s\nproject_digest=%s\ncommand_sha=%s\nprepare_run=%s\nexpires=%s\nnonce=%s\n' "$commit" "$manager_sha" "$state_sha" "$project_digest" "$command_sha" "$prepare_run" "$expires" "$nonce" >> "$GITHUB_OUTPUT"

      - name: Verify exact prior proposal and unique owner authorization
        env:
          PREPARE_RUN: ${{ steps.auth.outputs.prepare_run }}
          COMMIT: ${{ steps.auth.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREPARE_RUN}" > /tmp/prepare-run.json
          jq -e --arg commit "$COMMIT" '.event=="issue_comment" and .conclusion=="success" and .head_sha==$commit and .actor.login=="badjoke-lab"' /tmp/prepare-run.json >/dev/null
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${QUALIFICATION_ISSUE}/comments?per_page=100" | jq -s 'add' > /tmp/comments.json
          EXPECTED="$AUTHORIZATION_BODY" PREPARE_RUN="$PREPARE_RUN" AUTH_ID="$AUTHORIZATION_COMMENT_ID" AUTH_CREATED_AT="$AUTHORIZATION_CREATED_AT" node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const comments=JSON.parse(readFileSync('/tmp/comments.json','utf8')); const expected=process.env.EXPECTED; const run=process.env.PREPARE_RUN; const authAt=Date.parse(process.env.AUTH_CREATED_AT)
          const proposals=comments.filter(c=>c?.user?.login==='github-actions[bot]'&&c?.body?.includes(`Preparation run: \`${run}\``)&&c?.body?.includes(`\`${expected}\``))
          if(proposals.length!==1||!(Date.parse(proposals[0].created_at)<authAt)) throw new Error('exact prior proposal missing or late')
          const owners=comments.filter(c=>c?.user?.login==='badjoke-lab'&&c?.body===expected)
          if(owners.length!==1||Number(owners[0].id)!==Number(process.env.AUTH_ID)) throw new Error('owner authorization is not unique')
          NODE

      - name: Revalidate authorized structural state read-only
        env:
          COMMIT: ${{ steps.auth.outputs.commit }}
          STATE_SHA: ${{ steps.auth.outputs.state_sha }}
          COMMAND_SHA: ${{ steps.auth.outputs.command_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r5-cron-history-retention-evidence
          node "$MANAGER_PATH" prepare --source-commit "$COMMIT" --output r5-cron-history-retention-evidence/pre-apply.json > /tmp/pre.json
          test "$(jq -r '.structuralStateSha256' /tmp/pre.json)" = "$STATE_SHA"
          test "$(jq -r '.cleanup.commandSha256' /tmp/pre.json)" = "$COMMAND_SHA"

      - name: Apply exact bounded cron retention
        id: apply
        env:
          COMMIT: ${{ steps.auth.outputs.commit }}
          STATE_SHA: ${{ steps.auth.outputs.state_sha }}
        shell: bash
        run: |
          set -euo pipefail
          node "$MANAGER_PATH" apply --source-commit "$COMMIT" --authorized-state "$STATE_SHA" --output r5-cron-history-retention-evidence/apply.json 2>&1 | tee r5-cron-history-retention-evidence/apply.log

      - name: Upload sanitized application evidence
        if: always() && steps.auth.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: r5-cron-history-retention-apply-evidence
          path: r5-cron-history-retention-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Publish bounded result
        if: always() && steps.apply.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          jq -r '"## R5 cron history retention — PASS\n\n- rows before/after/deleted: `\(.rowsBefore) / \(.rowsAfter) / \(.rowsDeleted)`\n- database bytes before/after: `\(.databaseBytesBefore) / \(.databaseBytesAfter)`\n- cron relation bytes before/after: `\(.tableBytesBefore) / \(.tableBytesAfter)`\n- cleanup job id/name/schedule: `\(.jobId) / \(.jobName) / \(.schedule)`\n- succeeded retention: `\(.successRetentionHours)h`\n- non-succeeded retention: `\(.nonSuccessRetentionDays)d`\n- VACUUM performed: `\(.vacuumPerformed)`\n- scheduler mutation performed: `\(.schedulerMutationPerformed)` (exact cleanup job only)\n- payload/commit deletion: `none`\n- deployment: `none`\n- Mainnet: `disabled`\n- stabilization/soak/R5 restart: `not authorized`\n\nOrdinary DELETE may create reusable internal space without immediately reducing `pg_database_size`; physical/reusable-space behavior must be measured separately before any VACUUM decision."' r5-cron-history-retention-evidence/apply.json > /tmp/result.md
          gh issue comment "$QUALIFICATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/result.md
