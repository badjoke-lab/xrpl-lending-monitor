name: Apply managed transition diagnostics

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/apply-managed-transition-diagnostics.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Patch operator integration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('src/worker/operator/live-continuation-verification.ts')
          s = p.read_text()
          s = s.replace(
            "} from '../repositories/loan-activity-diagnostics'\n",
            "} from '../repositories/loan-activity-diagnostics'\nimport {\n  readManagedTransitionSourceDiagnostics,\n  type ManagedTransitionSourceDiagnostics,\n} from '../repositories/managed-transition-source-diagnostics'\n",
          )
          s = s.replace(
            "  balanceSource?: BalanceHistorySourceDiagnostics,\n): LiveContinuationVerificationReport {",
            "  balanceSource?: BalanceHistorySourceDiagnostics,\n  managedTransitions?: ManagedTransitionSourceDiagnostics,\n): LiveContinuationVerificationReport {",
          )
          s = s.replace(
            "  const paths = {\n    ...report.paths,\n    activityHistoryBalance:",
            "  const managedPath = (source: number, lifecycle: number, label: string): VerificationPath => {\n    if (source == 0 && lifecycle == 0) return { state: 'missing', reason: `${label} source transition and lifecycle evidence not yet observed` }\n    if (source == 0 || lifecycle == 0) return { state: 'inconsistent', reason: `${label} source transition and lifecycle evidence disagree` }\n    return { state: 'observed', reason: `${label} source transition and lifecycle evidence observed` }\n  }\n  const paths = {\n    ...report.paths,\n    impaired: managedTransitions ? managedPath(managedTransitions.impaired, evidence.lifecycle.impaired, 'impaired') : report.paths.impaired,\n    unimpaired: managedTransitions ? managedPath(managedTransitions.unimpaired, evidence.lifecycle.unimpaired, 'unimpaired') : report.paths.unimpaired,\n    defaulted: managedTransitions ? managedPath(managedTransitions.defaulted, evidence.lifecycle.defaulted, 'defaulted') : report.paths.defaulted,\n    activityHistoryBalance:",
          )
          s = s.replace(
            "  const [evidence, loanActivity, balanceSource] = await Promise.all([\n    readLiveContinuationEvidence(db),\n    readLoanActivityDiagnostics(db),\n    readBalanceHistorySourceDiagnostics(db),\n  ])\n  return evaluateLiveContinuationForRuntime(evidence, loanActivity, balanceSource)",
            "  const [evidence, loanActivity, balanceSource, managedTransitions] = await Promise.all([\n    readLiveContinuationEvidence(db),\n    readLoanActivityDiagnostics(db),\n    readBalanceHistorySourceDiagnostics(db),\n    readManagedTransitionSourceDiagnostics(db),\n  ])\n  return evaluateLiveContinuationForRuntime(evidence, loanActivity, balanceSource, managedTransitions)",
          )
          s = s.replace(
            "  balanceSource: BalanceHistorySourceDiagnostics\n}",
            "  balanceSource: BalanceHistorySourceDiagnostics\n  managedTransitions: ManagedTransitionSourceDiagnostics\n}",
          )
          s = s.replace(
            "  const [evidence, drilldown, loanActivity, balanceSource] = await Promise.all([\n    readLiveContinuationEvidence(db),\n    readLiveContinuationDrilldown(db),\n    readLoanActivityDiagnostics(db),\n    readBalanceHistorySourceDiagnostics(db),\n  ])",
            "  const [evidence, drilldown, loanActivity, balanceSource, managedTransitions] = await Promise.all([\n    readLiveContinuationEvidence(db),\n    readLiveContinuationDrilldown(db),\n    readLoanActivityDiagnostics(db),\n    readBalanceHistorySourceDiagnostics(db),\n    readManagedTransitionSourceDiagnostics(db),\n  ])",
          )
          s = s.replace(
            "    report: evaluateLiveContinuationForRuntime(evidence, loanActivity, balanceSource),\n    drilldown,\n    loanActivity,\n    balanceSource,",
            "    report: evaluateLiveContinuationForRuntime(evidence, loanActivity, balanceSource, managedTransitions),\n    drilldown,\n    loanActivity,\n    balanceSource,\n    managedTransitions,",
          )
          p.write_text(s)

          p = Path('src/worker/operator/m1-runtime-exit.ts')
          s = p.read_text()
          s = s.replace(
            "import { readLoanActivityDiagnostics } from '../repositories/loan-activity-diagnostics'\n",
            "import { readLoanActivityDiagnostics } from '../repositories/loan-activity-diagnostics'\nimport { readManagedTransitionSourceDiagnostics } from '../repositories/managed-transition-source-diagnostics'\n",
          )
          s = s.replace(
            "  const [liveEvidence, loanActivity, balanceSource, boundBase] = await Promise.all([\n    readLiveContinuationEvidence(options.db),\n    readLoanActivityDiagnostics(options.db),\n    readBalanceHistorySourceDiagnostics(options.db),",
            "  const [liveEvidence, loanActivity, balanceSource, managedTransitions, boundBase] = await Promise.all([\n    readLiveContinuationEvidence(options.db),\n    readLoanActivityDiagnostics(options.db),\n    readBalanceHistorySourceDiagnostics(options.db),\n    readManagedTransitionSourceDiagnostics(options.db),",
          )
          s = s.replace(
            "    balanceSource,\n  )",
            "    balanceSource,\n    managedTransitions,\n  )",
          )
          p.write_text(s)
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/worker/operator/live-continuation-verification.ts src/worker/operator/m1-runtime-exit.ts
          git commit -m "Integrate managed transition source diagnostics"
          git push origin HEAD:${{ github.head_ref }}
