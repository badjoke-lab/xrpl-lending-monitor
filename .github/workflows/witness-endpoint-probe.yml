name: Witness endpoint probe
on:
  pull_request:
    paths: [.github/workflows/witness-endpoint-probe.yml]
permissions:
  contents: read
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe witness endpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir witness
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" > witness/subdomain.json
          S="$(jq -r '.result.subdomain' witness/subdomain.json)"
          B="https://xrpl-lending-monitor.${S}.workers.dev"
          curl -fsS "${B}/api/status/loan-activity-witnesses" > witness/loan-activity.json
          jq -e '.epochId and (.loanPay >= 0) and (.loanManage >= 0) and (.loanDelete >= 0)' witness/loan-activity.json >/dev/null
          cat witness/loan-activity.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: witness-endpoint-probe
          path: witness
          retention-days: 7
