name: T5 D1 protection deploy

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  validate-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate repository
        run: pnpm check
      - name: Deploy protected cadence
        run: pnpm exec wrangler deploy
      - name: Verify deployed schedule
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --retry 3 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-monitor/schedules" \
            > schedule.json
          jq -e '.result | length == 1 and .[0].cron == "0 */4 * * *"' schedule.json > /dev/null
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: t5-d1-protection-schedule
          path: schedule.json
          if-no-files-found: warn
