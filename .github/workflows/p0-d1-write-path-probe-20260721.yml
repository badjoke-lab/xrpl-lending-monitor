name: P0 D1 write-path probe 2026-07-21

on:
  push:
    branches: [main]
    paths:
      - .github/p0-d1-write-path-probe-20260721-trigger

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: '962'
    steps:
      - name: Query collector-reported persistence cost
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          query_d1() {
            local sql="$1"
            local output="$2"
            jq -n --arg sql "$sql" '{sql:$sql}' \
              | curl --fail-with-body --silent --show-error \
                  -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  -H 'Content-Type: application/json' \
                  --data-binary @- \
                  "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query" > "$output"
            jq -e '.success==true and ((.errors // [])|length)==0 and ([.result[].success]|all)' "$output" > /dev/null
          }

          query_d1 "SELECT run_at,status,start_ledger_index,end_ledger_index,latest_observed_ledger,lag_ledgers,ledgers_processed,lending_transactions,coalesced_object_rows,persistence_rows_read,persistence_rows_written,error_message FROM fast_lane_shadow_run_metrics WHERE network='devnet' ORDER BY run_at DESC LIMIT 24" evidence/recent-runs.json
          query_d1 "SELECT COUNT(*) AS run_rows,COALESCE(SUM(ledgers_processed),0) AS ledgers_processed,COALESCE(SUM(lending_transactions),0) AS lending_transactions,COALESCE(SUM(coalesced_object_rows),0) AS coalesced_object_rows,COALESCE(SUM(persistence_rows_read),0) AS persistence_rows_read,COALESCE(SUM(persistence_rows_written),0) AS persistence_rows_written,COALESCE(SUM(CASE WHEN status='error' OR error_message IS NOT NULL THEN 1 ELSE 0 END),0) AS error_rows,MIN(run_at) AS first_run_at,MAX(run_at) AS last_run_at FROM fast_lane_shadow_run_metrics WHERE network='devnet' AND julianday(run_at)>=julianday('now','-60 minutes')" evidence/hour-summary.json
          query_d1 "SELECT COUNT(*) AS slot_rows,COALESCE(SUM(CASE WHEN status='completed' THEN 1 ELSE 0 END),0) AS completed_slots,COALESCE(SUM(CASE WHEN status='error' THEN 1 ELSE 0 END),0) AS error_slots,MIN(scheduled_time) AS first_scheduled_time,MAX(scheduled_time) AS last_scheduled_time FROM fast_lane_queue_slots WHERE julianday(updated_at)>=julianday('now','-60 minutes')" evidence/queue-summary.json

          jq -n \
            --arg checkedAt "$(date -u +%FT%TZ)" \
            --slurpfile runs evidence/recent-runs.json \
            --slurpfile hour evidence/hour-summary.json \
            --slurpfile queue evidence/queue-summary.json \
            '{checkedAt:$checkedAt,hour:$hour[0].result[0].results[0],queue:$queue[0].result[0].results[0],recentRuns:$runs[0].result[0].results}' > evidence/summary.json

      - name: Report D1 write-path probe
        if: always()
        shell: bash
        run: |
          test -s evidence/summary.json || echo '{"failed":true,"reason":"probe failed before summary"}' > evidence/summary.json
          {
            echo 'D1 write-path probe:'
            echo
            echo '```json'
            cat evidence/summary.json
            echo '```'
          } > evidence/comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body-file evidence/comment.md

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-d1-write-path-probe-20260721
          path: evidence
          if-no-files-found: warn
          retention-days: 14
