name: Three-layer tests diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/three-layer-tests-diagnostic.yml'
      - 'src/worker/repositories/three-layer-*.ts'

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: tests
        shell: bash
        run: |
          set +e
          pnpm test > full-suite.log 2>&1
          STATUS=$?
          echo "status=${STATUS}" >> "$GITHUB_OUTPUT"
          {
            grep -nE 'FAIL|Failed|AssertionError|expected|Test Files|Tests|×|❯' full-suite.log || true
            echo '--- tail ---'
            tail -n 180 full-suite.log
          } > failure-summary.log
          exit 0
      - name: Post diagnostic to PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Temporary full-suite failure summary'
            echo
            echo '```text'
            head -c 60000 failure-summary.log
            echo
            echo '```'
            echo
            echo "exit_status: ${{ steps.tests.outputs.status }}"
          } > diagnostic-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file diagnostic-comment.md
