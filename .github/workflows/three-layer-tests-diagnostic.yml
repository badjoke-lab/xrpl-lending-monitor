name: Three-layer tests diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/three-layer-tests-diagnostic.yml'
      - 'src/worker/repositories/three-layer-*.ts'

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: tests
        shell: bash
        run: |
          set +e
          pnpm exec vitest run \
            src/worker/repositories/three-layer-cursor.test.ts \
            src/worker/repositories/three-layer-fast-read.test.ts \
            src/worker/repositories/three-layer-current-detail.test.ts \
            > three-layer-tests.log 2>&1
          STATUS=$?
          echo "status=${STATUS}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Post diagnostic to PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Temporary three-layer test diagnostic'
            echo
            echo '```text'
            cat three-layer-tests.log
            echo
            echo '```'
            echo
            echo "exit_status: ${{ steps.tests.outputs.status }}"
          } > diagnostic-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file diagnostic-comment.md
