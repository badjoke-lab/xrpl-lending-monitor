name: Replacement rebase live dry-run probe

on:
  push:
    branches:
      - replacement-rebase-live-probe
    paths:
      - .github/workflows/replacement-rebase-live-probe.yml

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Worker URL and capture read-only statuses
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p replacement-rebase-live-probe
          curl -sS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            > replacement-rebase-live-probe/workers-subdomain.json
          SUBDOMAIN="$(jq -r '.result.subdomain // empty' replacement-rebase-live-probe/workers-subdomain.json)"
          test -n "${SUBDOMAIN}"
          BASE="https://xrpl-lending-monitor.${SUBDOMAIN}.workers.dev"
          printf '%s\n' "${BASE}" > replacement-rebase-live-probe/base-url.txt

          ENDPOINT="${BASE}/api/status/replacement-base-rebase"
          STATUS=000
          for ATTEMPT in $(seq 1 18); do
            STATUS="$(curl -sS -o replacement-rebase-live-probe/replacement-base-rebase.json -w '%{http_code}' "${ENDPOINT}" || true)"
            printf '%s %s\n' "${ATTEMPT}" "${STATUS}" >> replacement-rebase-live-probe/attempts.txt
            if [ "${STATUS}" != "404" ] && [ "${STATUS}" != "000" ]; then
              break
            fi
            sleep 10
          done
          printf '%s\n' "${STATUS}" > replacement-rebase-live-probe/replacement-base-rebase.http-status.txt

          for NAME in collector catch-up-initialization continuation-verification history-source; do
            URL="${BASE}/api/status/${NAME}"
            CODE="$(curl -sS -o "replacement-rebase-live-probe/${NAME}.json" -w '%{http_code}' "${URL}" || true)"
            printf '%s\n' "${CODE}" > "replacement-rebase-live-probe/${NAME}.http-status.txt"
          done

          if [ "${STATUS}" = "404" ] || [ "${STATUS}" = "000" ]; then
            echo "replacement-base rebase endpoint was not deployed" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replacement-rebase-live-probe
          path: replacement-rebase-live-probe
          if-no-files-found: error
          retention-days: 30
