name: P0 run rolling checkpoint maintenance

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch:
    if: startsWith(github.event.issue.title, 'P0 run rolling checkpoint maintenance')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Capture existing maintenance runs
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${REPOSITORY}/actions/workflows/rolling-checkpoint-maintenance.yml/runs?event=workflow_dispatch&per_page=100" \
            --jq '.workflow_runs[].id' > /tmp/runs-before.txt

      - name: Dispatch rolling checkpoint maintenance
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${REPOSITORY}/actions/workflows/rolling-checkpoint-maintenance.yml/dispatches" \
            -f ref=main

      - name: Resolve dispatched run
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=''
          for ATTEMPT in $(seq 1 30); do
            gh api "repos/${REPOSITORY}/actions/workflows/rolling-checkpoint-maintenance.yml/runs?event=workflow_dispatch&per_page=100" \
              > /tmp/runs-after.json
            while IFS= read -r ID; do
              if ! grep -Fxq "${ID}" /tmp/runs-before.txt; then
                RUN_ID="${ID}"
                break
              fi
            done < <(jq -r '.workflow_runs | sort_by(.created_at) | reverse | .[].id' /tmp/runs-after.json)
            test -n "${RUN_ID}" && break
            sleep 5
          done
          test -n "${RUN_ID}"
          echo "run_id=${RUN_ID}" >> "${GITHUB_OUTPUT}"

      - name: Record dispatch
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment "${ISSUE_NUMBER}" --repo "${REPOSITORY}" \
            --body "Rolling checkpoint maintenance dispatched. Run ID: ${{ steps.resolve.outputs.run_id }}. The existing guarded candidate and cutover pipeline remains fail-closed."
