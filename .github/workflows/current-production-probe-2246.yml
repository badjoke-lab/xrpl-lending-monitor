name: Current production probe 2246

on:
  push:
    branches:
      - agent/current-production-probe-20260724-2246
    paths:
      - .github/workflows/current-production-probe-2246.yml

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
  PRODUCTION_BASE: https://xrpl-lending-monitor.badjoke-lab.workers.dev
  GH_TOKEN: ${{ github.token }}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Read current D1, API, and deployment state
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          query_d1() {
            local sql="$1" output="$2"
            jq -n --arg sql "$sql" '{sql:$sql}' \
              | curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
                  --connect-timeout 10 --max-time 45 \
                  -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  -H 'Content-Type: application/json' --data-binary @- \
                  "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query" \
              > "$output"
          }

          fetch_api() {
            local path="$1" output="$2" code_file="$3"
            curl --silent --show-error --retry 3 --retry-all-errors \
              --connect-timeout 10 --max-time 45 -o "$output" -w '%{http_code}' \
              "${PRODUCTION_BASE}${path}" > "$code_file"
          }

          query_d1 "SELECT epoch_id,last_processed_ledger,last_processed_hash,latest_observed_ledger,latest_observed_hash,status,(latest_observed_ledger-last_processed_ledger) AS lag_ledgers,updated_at FROM fast_lane_shadow_state WHERE network='devnet'" fast.json
          query_d1 "SELECT epoch_id,base_snapshot_id,base_ledger_index,base_ledger_hash,overlay_ledger_index,overlay_ledger_hash,updated_at FROM current_state_overlay_state WHERE network='devnet'" overlay.json
          query_d1 "SELECT run_at,status,start_ledger_index,end_ledger_index,latest_observed_ledger,lag_ledgers,ledgers_processed,persistence_rows_read,persistence_rows_written,error_message FROM fast_lane_shadow_run_metrics WHERE network='devnet' ORDER BY run_at DESC LIMIT 1" metric.json
          query_d1 "SELECT scheduled_time,status,started_at,completed_at,next_scheduled_time,error_message,updated_at FROM fast_lane_queue_slots ORDER BY scheduled_time DESC LIMIT 12" slots.json
          query_d1 "SELECT COUNT(*) AS compact_rows FROM fast_lane_shadow_objects_compact WHERE network='devnet'" compact.json
          query_d1 "SELECT COUNT(*) AS stale_rows FROM current_state_overlay_objects o WHERE o.network='devnet' AND NOT EXISTS (SELECT 1 FROM fast_lane_shadow_base_binding b WHERE b.network=o.network AND b.base_epoch_id=o.epoch_id AND b.base_snapshot_id=o.base_snapshot_id)" stale.json
          query_d1 "SELECT COUNT(*) AS retained_windows,MIN(start_ledger_index) AS first_ledger,MAX(end_ledger_index) AS last_ledger,MAX(LENGTH(bundle_json)) AS max_encoded_bytes FROM fast_lane_history_windows WHERE network='devnet'" windows.json

          fetch_api '/api/overview' overview.json overview.code
          fetch_api '/api/status/history-source' history-source.json history-source.code
          fetch_api '/api/status/fast-lane-diff?limit=1' fast-lane-diff.json fast-lane-diff.code
          fetch_api '/api/status/replacement-base-rebase' replacement-base.json replacement-base.code

          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-monitor/deployments" \
            > deployments.json

      - name: Evaluate current state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          def rows(path):
              payload=json.loads(Path(path).read_text())
              return payload.get('result',[{}])[0].get('results',[])
          def one(path):
              values=rows(path)
              return values[0] if values else {}

          fast=one('fast.json')
          overlay=one('overlay.json')
          metric=one('metric.json')
          slots=rows('slots.json')
          compact=one('compact.json').get('compact_rows',-1)
          stale=one('stale.json').get('stale_rows',-1)
          windows=one('windows.json')
          deployments=json.loads(Path('deployments.json').read_text())
          latest_deployment=(deployments.get('result',{}).get('deployments') or [None])[0]
          http={name:Path(f'{name}.code').read_text().strip() for name in ('overview','history-source','fast-lane-diff','replacement-base')}
          slot_ok=(len(slots)==12 and all(x.get('status')=='completed' and not x.get('error_message') for x in slots))
          aligned=(int(fast.get('last_processed_ledger',-1))==int(overlay.get('overlay_ledger_index',-2)) and fast.get('last_processed_hash')==overlay.get('overlay_ledger_hash'))
          healthy=all([
              fast.get('status')=='healthy',
              int(fast.get('lag_ledgers',-1))==0,
              metric.get('status') in ('committed','caught_up'),
              int(metric.get('lag_ledgers',-1))==0,
              metric.get('error_message') in (None,''),
              slot_ok, aligned, int(compact)==0, int(stale)==0,
              all(code=='200' for code in http.values()),
          ])
          result={
              'checkedAt':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
              'healthy':healthy,
              'fastLane':fast,
              'canonicalOverlay':overlay,
              'latestMetric':metric,
              'recentQueueSlots':slots,
              'compactRows':compact,
              'staleRows':stale,
              'historyWindows':windows,
              'http':http,
              'latestDeployment':latest_deployment,
          }
          Path('current-production-probe-2246.json').write_text(json.dumps(result,indent=2)+'\n')
          PY

      - name: Retain result on probe branch
        shell: bash
        run: |
          set -euo pipefail
          api="repos/${GITHUB_REPOSITORY}/contents/.github/current-production-probe-2246.json"
          content="$(base64 -w0 current-production-probe-2246.json)"
          gh api --method PUT "$api" \
            -f message='Retain current read-only production probe' \
            -f content="$content" \
            -f branch="$GITHUB_REF_NAME" >/dev/null
