name: Deploy history runtime contract

on:
  push:
    branches: [main]
    paths:
      - .github/history-runtime-deploy-trigger

permissions:
  contents: write

concurrency:
  group: production-worker-write
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_BASE: https://xrpl-lending-monitor.badjoke-lab.workers.dev
    steps:
      - name: Check out implementation
        uses: actions/checkout@v4

      - name: Check out production current-state identity
        uses: actions/checkout@v4
        with:
          ref: current-state-data
          path: .local/current-state-data
          sparse-checkout: |
            read-model/manifest.json
            rolling-read-model-summary.json
          sparse-checkout-cone-mode: false

      - name: Check out archived history identity
        uses: actions/checkout@v4
        with:
          ref: history-data
          path: .local/history-data
          sparse-checkout: history/publication.json
          sparse-checkout-cone-mode: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate production contract
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path('wrangler.jsonc').read_text())
          current = json.loads(Path('.local/current-state-data/read-model/manifest.json').read_text())
          summary = json.loads(Path('.local/current-state-data/rolling-read-model-summary.json').read_text())
          history = json.loads(Path('.local/history-data/history/publication.json').read_text())

          assert config['main'] == 'src/worker/p0-redundant-scheduler-entry.ts'
          assert config['triggers']['crons'] == ['*/5 * * * *']
          assert config['vars']['APP_NETWORK'] == 'devnet'
          assert config['vars']['MAINNET_ENABLED'] == 'false'
          assert len(config['queues']['producers']) == 1
          assert len(config['queues']['consumers']) == 1
          assert config['queues']['consumers'][0]['max_batch_size'] == 1
          assert config['queues']['consumers'][0]['max_concurrency'] == 1
          assert 'REPLACEMENT_BASE_CUTOVER_TOKEN' not in config['vars']

          assert current['complete'] is True
          assert history['complete'] is True
          assert current['epochId'] == history['epochId'] == 'devnet-3371675'
          assert current['ledgerIndex'] >= history['endLedgerIndex']
          if current['ledgerIndex'] == history['endLedgerIndex']:
              assert current['ledgerHash'] == history['endLedgerHash']

          assert summary['mode'] == 'd1-overlay-fold'
          assert summary['source']['snapshotId'] == current['snapshotId']
          assert summary['source']['ledgerIndex'] == current['ledgerIndex']
          assert summary['source']['ledgerHash'] == current['ledgerHash']
          assert summary['target']['snapshotId'] == current['snapshotId']
          assert summary['target']['ledgerIndex'] == current['ledgerIndex']
          assert summary['target']['ledgerHash'] == current['ledgerHash']
          assert summary['overlaySource']['epochId'] == current['epochId']
          assert summary['overlaySource']['overlayLedgerIndex'] == current['ledgerIndex']
          assert summary['overlaySource']['overlayLedgerHash'] == current['ledgerHash']

          variables = config['vars']
          assert variables['CURRENT_STATE_REPLACEMENT_SNAPSHOT_ID'] == current['snapshotId']
          assert variables['REPLACEMENT_BASE_EPOCH_ID'] == current['epochId']
          assert variables['REPLACEMENT_BASE_SNAPSHOT_ID'] == current['snapshotId']
          assert int(variables['REPLACEMENT_BASE_LEDGER_INDEX']) == current['ledgerIndex']
          assert variables['REPLACEMENT_BASE_LEDGER_HASH'] == current['ledgerHash']

          checkpoint = {
              'implementationSha': '${{ github.sha }}',
              'epochId': current['epochId'],
              'snapshotId': current['snapshotId'],
              'ledgerIndex': current['ledgerIndex'],
              'ledgerHash': current['ledgerHash'],
              'historyMode': 'd1_fast_lane_windows_with_archived_branch',
              'historyArchiveLedgerIndex': history['endLedgerIndex'],
              'historyArchiveLedgerHash': history['endLedgerHash'],
              'historyPublicationSha256': history['publicationSha256'],
              'historyGapLedgers': current['ledgerIndex'] - history['endLedgerIndex'],
          }
          Path('production-deploy-checkpoint.json').write_text(json.dumps(checkpoint, indent=2) + '\n')
          PY

      - name: Build application
        run: pnpm build

      - name: Apply D1 migrations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p production-d1-migrations
          pnpm exec wrangler d1 migrations list xrpl-lending-monitor --remote \
            | tee production-d1-migrations/before.txt
          pnpm exec wrangler d1 migrations apply xrpl-lending-monitor --remote \
            | tee production-d1-migrations/apply.txt
          pnpm exec wrangler d1 migrations list xrpl-lending-monitor --remote \
            | tee production-d1-migrations/after.txt

      - name: Deploy Worker
        id: deploy
        run: pnpm exec wrangler deploy

      - name: Verify deployed runtime
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_EPOCH="$(jq -r '.epochId' production-deploy-checkpoint.json)"
          EXPECTED_SNAPSHOT="$(jq -r '.snapshotId' production-deploy-checkpoint.json)"
          EXPECTED_LEDGER="$(jq -r '.ledgerIndex' production-deploy-checkpoint.json)"
          EXPECTED_HASH="$(jq -r '.ledgerHash' production-deploy-checkpoint.json)"
          AUTH=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          verified=false

          for attempt in $(seq 1 60); do
            curl --fail-with-body --silent --show-error "${AUTH[@]}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-monitor/settings" \
              > deployed-worker-settings.json || true
            curl --fail-with-body --silent --show-error "${AUTH[@]}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-monitor/schedules" \
              > deployed-worker-schedules.json || true
            overview_status="$(curl --silent --show-error --retry 1 -o deployed-overview.json -w '%{http_code}' \
              "${PRODUCTION_BASE}/api/overview" || true)"
            history_status="$(curl --silent --show-error --retry 1 -o deployed-history-source.json -w '%{http_code}' \
              "${PRODUCTION_BASE}/api/status/history-source" || true)"
            rebase_status="$(curl --silent --show-error --retry 1 -o deployed-rebase-status.json -w '%{http_code}' \
              "${PRODUCTION_BASE}/api/status/replacement-base-rebase" || true)"

            if jq -e \
              --arg epoch "${EXPECTED_EPOCH}" \
              --arg snapshot "${EXPECTED_SNAPSHOT}" \
              --arg ledger "${EXPECTED_LEDGER}" \
              --arg hash "${EXPECTED_HASH}" '
                def binding($name):
                  [.result.bindings[] | select(.name == $name) | (.text // .value)] | first;
                binding("APP_NETWORK") == "devnet"
                and binding("MAINNET_ENABLED") == "false"
                and binding("REPLACEMENT_BASE_EPOCH_ID") == $epoch
                and binding("REPLACEMENT_BASE_SNAPSHOT_ID") == $snapshot
                and binding("REPLACEMENT_BASE_LEDGER_INDEX") == $ledger
                and binding("REPLACEMENT_BASE_LEDGER_HASH") == $hash
                and ([.result.bindings[] | select(.name == "REPLACEMENT_BASE_CUTOVER_TOKEN")] | length) == 0
                and ([.result.bindings[] | select(.name == "FAST_LANE_QUEUE" and .type == "queue")] | length) == 1
              ' deployed-worker-settings.json > /dev/null 2>&1 \
              && jq -e '.result.schedules | length == 1 and .[0].cron == "*/5 * * * *"' \
                deployed-worker-schedules.json > /dev/null 2>&1 \
              && [ "${overview_status}" = 200 ] \
              && [ "${history_status}" = 200 ] \
              && [ "${rebase_status}" = 200 ] \
              && jq -e --arg epoch "${EXPECTED_EPOCH}" --arg snapshot "${EXPECTED_SNAPSHOT}" --argjson ledger "${EXPECTED_LEDGER}" --arg hash "${EXPECTED_HASH}" '
                .status == "replayed"
                and .target.epochId == $epoch
                and .target.snapshotId == $snapshot
                and .target.ledgerIndex == $ledger
                and .target.ledgerHash == $hash
              ' deployed-rebase-status.json > /dev/null 2>&1; then
              verified=true
              break
            fi
            sleep 3
          done

          test "${verified}" = true
          jq -n \
            --slurpfile checkpoint production-deploy-checkpoint.json \
            --slurpfile rebase deployed-rebase-status.json \
            --arg overviewHttp "${overview_status}" \
            --arg historyHttp "${history_status}" \
            '{passed:true,checkpoint:$checkpoint[0],replacementBase:$rebase[0],schedule:"*/5 * * * *",queueBound:true,mainnetEnabled:false,http:{overview:$overviewHttp,historySource:$historyHttp}}' \
            > production-deploy-verification.json

      - name: Report deploy status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          FINAL_OUTCOME="${VERIFY_OUTCOME}"
          if [ -z "${FINAL_OUTCOME}" ] || [ "${FINAL_OUTCOME}" = skipped ]; then FINAL_OUTCOME="${DEPLOY_OUTCOME}"; fi
          if [ -z "${FINAL_OUTCOME}" ]; then FINAL_OUTCOME=failure; fi
          if [ -s production-deploy-checkpoint.json ]; then
            jq -n \
              --arg runId "$GITHUB_RUN_ID" \
              --arg runUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              --arg headSha "$GITHUB_SHA" \
              --arg outcome "$FINAL_OUTCOME" \
              --slurpfile checkpoint production-deploy-checkpoint.json \
              '{runId:$runId,runUrl:$runUrl,headSha:$headSha,outcome:$outcome,checkpoint:$checkpoint[0]}' \
              > deploy-status.json
          else
            jq -n \
              --arg runId "$GITHUB_RUN_ID" \
              --arg runUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              --arg headSha "$GITHUB_SHA" \
              --arg outcome "$FINAL_OUTCOME" \
              '{runId:$runId,runUrl:$runUrl,headSha:$headSha,outcome:$outcome,checkpoint:null}' \
              > deploy-status.json
          fi
          API_PATH="repos/${GITHUB_REPOSITORY}/contents/.github/history-runtime-deploy-status.json"
          CONTENT="$(base64 -w0 deploy-status.json)"
          EXISTING_SHA="$(gh api "$API_PATH" --jq .sha 2>/dev/null || true)"
          if [ -n "$EXISTING_SHA" ]; then
            gh api --method PUT "$API_PATH" \
              -f message="Update history runtime deploy status" \
              -f content="$CONTENT" \
              -f sha="$EXISTING_SHA" > /dev/null
          else
            gh api --method PUT "$API_PATH" \
              -f message="Create history runtime deploy status" \
              -f content="$CONTENT" > /dev/null
          fi

      - name: Upload deploy verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-runtime-deploy-verification
          path: |
            production-deploy-checkpoint.json
            production-deploy-verification.json
            deployed-worker-settings.json
            deployed-worker-schedules.json
            deployed-overview.json
            deployed-history-source.json
            deployed-rebase-status.json
            production-d1-migrations
          if-no-files-found: warn
          retention-days: 14
