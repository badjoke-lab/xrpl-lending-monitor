name: Republish complete current-state artifact

on:
  push:
    branches:
      - main
    paths:
      - .github/current-state-republish-trigger

permissions:
  actions: read
  contents: write

concurrency:
  group: current-state-republish
  cancel-in-progress: false

jobs:
  republish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: '28699460881'
      SOURCE_HEAD_SHA: '6ec422753c474b805c8a1f7f53b184c556163190'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download complete artifact
        uses: actions/download-artifact@v4
        with:
          name: current-state-release-assets
          path: .local/current-state-release
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Verify complete release summary
        run: |
          test "$(jq -r .complete .local/current-state-release/release-summary.json)" = "true"
          test "$(jq -r .dataAssets .local/current-state-release/release-summary.json)" = "20"
          test "$(jq -r .indexAssets .local/current-state-release/release-summary.json)" = "64"
          test "$(find .local/current-state-release/assets -maxdepth 1 -type f | wc -l)" = "85"

      - name: Ensure immutable snapshot release
        id: snapshot
        run: |
          TAG="$(jq -r .releaseTag .local/current-state-release/release-summary.json)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file .local/current-state-release/release-notes.md \
              --target "$SOURCE_HEAD_SHA" \
              --latest=false
          fi

      - name: Upload snapshot assets with retries
        run: |
          TAG="${{ steps.snapshot.outputs.tag }}"
          for ASSET in .local/current-state-release/assets/*; do
            OK=false
            for ATTEMPT in 1 2 3; do
              if gh release upload "$TAG" "$ASSET" --clobber; then
                OK=true
                break
              fi
              echo "Retrying $ASSET after attempt $ATTEMPT" >&2
              sleep 5
            done
            if [ "$OK" != "true" ]; then
              echo "Failed to upload $ASSET after 3 attempts" >&2
              exit 1
            fi
          done
          COUNT=$(gh release view "$TAG" --json assets --jq '.assets | length')
          if [ "$COUNT" -ne 85 ]; then
            echo "Expected 85 release assets, found $COUNT" >&2
            exit 1
          fi

      - name: Publish active channel
        id: channel
        run: |
          CHANNEL_TAG=current-state-channel
          if gh release view "$CHANNEL_TAG" >/dev/null 2>&1; then
            gh release upload "$CHANNEL_TAG" .local/current-state-release/channel/channel.json --clobber
          else
            gh release create "$CHANNEL_TAG" .local/current-state-release/channel/channel.json \
              --title "$CHANNEL_TAG" \
              --notes "Active current-state release channel." \
              --target "$SOURCE_HEAD_SHA" \
              --latest=false
          fi

      - name: Report republish status
        if: always()
        env:
          SNAPSHOT_OUTCOME: ${{ steps.snapshot.outcome }}
          CHANNEL_OUTCOME: ${{ steps.channel.outcome }}
        run: |
          TAG=$(jq -r '.releaseTag // ""' .local/current-state-release/release-summary.json 2>/dev/null || true)
          jq -n \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg sourceRunId "$SOURCE_RUN_ID" \
            --arg releaseTag "$TAG" \
            --arg snapshot "$SNAPSHOT_OUTCOME" \
            --arg channel "$CHANNEL_OUTCOME" \
            '{runId:$runId,runUrl:$runUrl,sourceRunId:$sourceRunId,releaseTag:$releaseTag,snapshotOutcome:$snapshot,channelOutcome:$channel}' \
            > republish-status.json
          API_PATH="repos/${GITHUB_REPOSITORY}/contents/.github/current-state-republish-status.json"
          CONTENT=$(base64 -w0 republish-status.json)
          EXISTING_SHA=$(gh api "$API_PATH" --jq .sha 2>/dev/null || true)
          if [ -n "$EXISTING_SHA" ]; then
            gh api --method PUT "$API_PATH" -f message="Update current-state republish status" -f content="$CONTENT" -f sha="$EXISTING_SHA" >/dev/null
          else
            gh api --method PUT "$API_PATH" -f message="Create current-state republish status" -f content="$CONTENT" >/dev/null
          fi
