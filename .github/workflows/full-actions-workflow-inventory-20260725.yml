name: Full Actions workflow inventory 20260725

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/actions-workflow-audit-trigger-20260725

permissions:
  actions: read
  contents: read

jobs:
  inventory:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Capture complete workflow inventory
        shell: bash
        run: |
          set -u
          root=actions-workflow-audit
          mkdir -p "$root/workflow-trees"
          cp -R .github/workflows "$root/workflows"
          git rev-parse HEAD > "$root/main-head.txt"
          date -u +%FT%TZ > "$root/checked-at.txt"
          find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort > "$root/default-branch-workflow-files.txt"

          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" > "$root/registered-workflow-pages.json"
          jq '[.[].workflows[]] | sort_by(.path, .id)' "$root/registered-workflow-pages.json" > "$root/registered-workflows.json"
          jq '{registeredCount:length, activeCount:map(select(.state=="active"))|length, disabledCount:map(select(.state!="active"))|length}' "$root/registered-workflows.json" > "$root/counts.json"
          jq -r '.[] | [.id,.name,.path,.state,.created_at,.updated_at,.html_url] | @tsv' "$root/registered-workflows.json" > "$root/registered-workflows.tsv"

          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/branches?per_page=100" > "$root/branch-pages.json"
          jq '[.[][]] | sort_by(.name)' "$root/branch-pages.json" > "$root/branches.json"
          jq -r '.[] | [.name,.commit.sha] | @tsv' "$root/branches.json" > "$root/branches.tsv"
          : > "$root/branch-workflow-presence.tsv"
          : > "$root/branch-tree-errors.tsv"
          while IFS=$'\t' read -r branch sha; do
            tree="$root/workflow-trees/${sha}.json"
            if gh api "repos/${GITHUB_REPOSITORY}/git/trees/${sha}?recursive=1" > "$tree" 2> "$tree.error"; then
              jq -r --arg branch "$branch" --arg sha "$sha" '
                .tree[]
                | select(.type=="blob" and (.path|test("^\\.github/workflows/[^/]+\\.(yml|yaml)$")))
                | [.path,$branch,$sha] | @tsv
              ' "$tree" >> "$root/branch-workflow-presence.tsv"
              rm -f "$tree.error"
            else
              printf '%s\t%s\t%s\n' "$branch" "$sha" "$(tr '\n' ' ' < "$tree.error")" >> "$root/branch-tree-errors.tsv"
            fi
          done < "$root/branches.tsv"
          sort -u -o "$root/branch-workflow-presence.tsv" "$root/branch-workflow-presence.tsv"
          rm -rf "$root/workflow-trees"

      - name: Upload complete inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-actions-workflow-inventory-20260725
          path: actions-workflow-audit
          if-no-files-found: error
          retention-days: 30
