name: R5 revision4 prepared-head repair

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: r5-revision4-prepared-head-repair
  cancel-in-progress: false

env:
  QUALIFICATION_ISSUE: '1261'
  SQL_PATH: ops/production-sql/20260815211500_xrpl_r5_revision4_prepared_head_memory_retry_fix.sql
  MANAGER_PATH: scripts/manage-r5-revision4-prepared-head-memory-retry-fix.mjs
  TARGET_MIGRATION_VERSION: '20260815211500'
  PREVIOUS_MIGRATION_VERSION: '20260814130000'
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
  GH_TOKEN: ${{ github.token }}

jobs:
  prepare:
    if: >-
      github.event.issue.number == 1261 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      github.event.comment.body == '/r5-revision4-prepared-head-repair-prepare'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Audit exact rolled-back production state read-only
        id: state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r5-revision4-prepared-head-repair-evidence
          source_commit="$(git rev-parse HEAD)"
          sql_sha="$(sha256sum "$SQL_PATH" | awk '{print $1}')"
          manager_sha="$(sha256sum "$MANAGER_PATH" | awk '{print $1}')"
          node "$MANAGER_PATH" audit \
            --source-commit "$source_commit" \
            --expected-sha "$sql_sha" \
            --output r5-revision4-prepared-head-repair-evidence/prepare-audit.json \
            > /tmp/r5-revision4-prepared-head-repair-audit.json
          cat /tmp/r5-revision4-prepared-head-repair-audit.json
          test "$(jq -r '.classification' /tmp/r5-revision4-prepared-head-repair-audit.json)" = unapplied_expected
          test "$(jq -r '.maxMigrationVersion' /tmp/r5-revision4-prepared-head-repair-audit.json)" = "$PREVIOUS_MIGRATION_VERSION"
          test "$(jq -r '.revision4MemoryRetryCalls' /tmp/r5-revision4-prepared-head-repair-audit.json)" = 1
          test "$(jq -r '.revision3MemoryRetryCalls' /tmp/r5-revision4-prepared-head-repair-audit.json)" = 1
          test "$(jq -r '.run.status' /tmp/r5-revision4-prepared-head-repair-audit.json)" = prepared
          test "$(jq -r '.activeBatchCount' /tmp/r5-revision4-prepared-head-repair-audit.json)" = 0
          test "$(jq -r '.scheduler | length' /tmp/r5-revision4-prepared-head-repair-audit.json)" = 1
          test "$(jq -r '.scheduler[0].schedule' /tmp/r5-revision4-prepared-head-repair-audit.json)" = '* * * * *'
          jq -e '.scheduler[0].command | contains("xrpl-collector-tick") and (contains("xrpl-r5-minute-driver") | not)' /tmp/r5-revision4-prepared-head-repair-audit.json >/dev/null
          test "$(jq -r '.schedulerMutationAuthorized' /tmp/r5-revision4-prepared-head-repair-audit.json)" = false
          test "$(jq -r '.deploymentAuthorized' /tmp/r5-revision4-prepared-head-repair-audit.json)" = false
          test "$(jq -r '.canonicalHistoryMutationAuthorized' /tmp/r5-revision4-prepared-head-repair-audit.json)" = false
          printf 'source_commit=%s\nsql_sha=%s\nmanager_sha=%s\nstate_sha=%s\nproject_digest=%s\nrun_watermark=%s\nactive_floor=%s\ndatabase_bytes=%s\n' \
            "$source_commit" "$sql_sha" "$manager_sha" \
            "$(jq -r '.authorizationStateSha256' /tmp/r5-revision4-prepared-head-repair-audit.json)" \
            "$(jq -r '.projectIdentityDigest' /tmp/r5-revision4-prepared-head-repair-audit.json)" \
            "$(jq -r '.run.current_watermark_ledger_index' /tmp/r5-revision4-prepared-head-repair-audit.json)" \
            "$(jq -r '.canonicalWatermark.ledgerIndex' /tmp/r5-revision4-prepared-head-repair-audit.json)" \
            "$(jq -r '.databaseBytes' /tmp/r5-revision4-prepared-head-repair-audit.json)" \
            >> "$GITHUB_OUTPUT"

      - name: Publish exact expiring owner authorization proposal
        env:
          SOURCE_COMMIT: ${{ steps.state.outputs.source_commit }}
          SQL_SHA: ${{ steps.state.outputs.sql_sha }}
          MANAGER_SHA: ${{ steps.state.outputs.manager_sha }}
          STATE_SHA: ${{ steps.state.outputs.state_sha }}
          PROJECT_DIGEST: ${{ steps.state.outputs.project_digest }}
          RUN_WATERMARK: ${{ steps.state.outputs.run_watermark }}
          ACTIVE_FLOOR: ${{ steps.state.outputs.active_floor }}
          DATABASE_BYTES: ${{ steps.state.outputs.database_bytes }}
        shell: bash
        run: |
          set -euo pipefail
          expires="$(date -u -d '+2 hours' '+%Y-%m-%dT%H:%M:%SZ')"
          nonce="$(openssl rand -hex 8)"
          command="/r5-revision4-prepared-head-repair commit=${SOURCE_COMMIT} sql=${SQL_SHA} manager=${MANAGER_SHA} state=${STATE_SHA} project=${PROJECT_DIGEST} prepare_run=${GITHUB_RUN_ID} expires=${expires} nonce=${nonce}"
          cat > /tmp/r5-revision4-prepared-head-repair-proposal.md <<EOF2
          ## R5 revision-4 prepared-head memory-retry repair authorization proposal

          Preparation run: \`${GITHUB_RUN_ID}\`
          Source main commit: \`${SOURCE_COMMIT}\`
          Target migration-history version: \`${TARGET_MIGRATION_VERSION}\`
          Staged SQL SHA-256: \`${SQL_SHA}\`
          Manager SHA-256: \`${MANAGER_SHA}\`
          Authorized production state SHA-256: \`${STATE_SHA}\`
          Project identity digest: \`${PROJECT_DIGEST}\`
          Retained revision-4 watermark: \`${RUN_WATERMARK}\`
          Current canonical watermark floor: \`${ACTIVE_FLOOR}\`
          Database bytes: \`${DATABASE_BYTES}\`
          Authorization expires: \`${expires}\`

          Read-only preparation proved the revision-4 run is zero-progress \`prepared\`, no active R5 batch exists, the old \`xrpl-collector-tick\` one-minute scheduler is restored, revision 4 contains exactly one erroneous revision-3 memory-retry call, revision 3 retains exactly one intended memory-retry call, and migration head is exactly \`${PREVIOUS_MIGRATION_VERSION}\`.

          The exact command below authorizes only one transaction that patches the revision-4 prepared-head function and inserts the exact migration-history record. It does not authorize scheduler mutation, Edge deployment, canonical-history mutation, public-reader mutation, Mainnet, stabilization, or soak.

          Exact authorization command:

          \`${command}\`
          EOF2
          gh issue comment "$QUALIFICATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/r5-revision4-prepared-head-repair-proposal.md

      - name: Upload sanitized preparation evidence
        uses: actions/upload-artifact@v4
        with:
          name: r5-revision4-prepared-head-repair-prepare
          path: r5-revision4-prepared-head-repair-evidence
          if-no-files-found: error
          retention-days: 14

  execute:
    if: >-
      github.event.issue.number == 1261 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      startsWith(github.event.comment.body, '/r5-revision4-prepared-head-repair ')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AUTHORIZATION_BODY: ${{ github.event.comment.body }}
      AUTHORIZATION_CREATED_AT: ${{ github.event.comment.created_at }}
      AUTHORIZATION_COMMENT_ID: ${{ github.event.comment.id }}
    steps:
      - name: Check out exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Parse and bind exact owner authorization
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          regex='^/r5-revision4-prepared-head-repair commit=([a-f0-9]{40}) sql=([a-f0-9]{64}) manager=([a-f0-9]{64}) state=([a-f0-9]{64}) project=([a-f0-9]{64}) prepare_run=([0-9]+) expires=([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z) nonce=([a-f0-9]{16})$'
          [[ "$AUTHORIZATION_BODY" =~ $regex ]] || { echo 'prepared-head repair authorization shape mismatch' >&2; exit 1; }
          names=(commit sql_sha manager_sha state_sha project_digest prepare_run expires nonce)
          for index in "${!names[@]}"; do
            printf '%s=%s\n' "${names[$index]}" "${BASH_REMATCH[$((index + 1))]}" >> "$GITHUB_OUTPUT"
          done
          test "${BASH_REMATCH[1]}" = "$(git rev-parse HEAD)"
          test "${BASH_REMATCH[2]}" = "$(sha256sum "$SQL_PATH" | awk '{print $1}')"
          test "${BASH_REMATCH[3]}" = "$(sha256sum "$MANAGER_PATH" | awk '{print $1}')"
          test "${BASH_REMATCH[5]}" = "$(printf '%s' "$SUPABASE_PROJECT_ID" | sha256sum | awk '{print $1}')"
          expires_epoch="$(date -u -d "${BASH_REMATCH[7]}" +%s)"
          auth_epoch="$(date -u -d "$AUTHORIZATION_CREATED_AT" +%s)"
          now_epoch="$(date -u +%s)"
          test "$auth_epoch" -lt "$expires_epoch"
          test "$now_epoch" -le "$expires_epoch"
          test $((expires_epoch - auth_epoch)) -le 7200

      - name: Verify exact prior proposal and unique authorization
        env:
          PREPARE_RUN: ${{ steps.auth.outputs.prepare_run }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${QUALIFICATION_ISSUE}/comments?per_page=100" | jq -s 'add' > /tmp/r5-prepared-head-repair-comments.json
          EXPECTED="$AUTHORIZATION_BODY" PREPARE="$PREPARE_RUN" AUTH_ID="$AUTHORIZATION_COMMENT_ID" node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const comments = JSON.parse(readFileSync('/tmp/r5-prepared-head-repair-comments.json', 'utf8'))
          const proposals = comments.filter((comment) => comment?.user?.login === 'github-actions[bot]' && typeof comment?.body === 'string' && comment.body.includes(`Preparation run: \`${process.env.PREPARE}\``) && comment.body.includes(`\`${process.env.EXPECTED}\``))
          if (proposals.length !== 1) throw new Error(`expected exactly one matching proposal, found ${proposals.length}`)
          const auths = comments.filter((comment) => String(comment?.id) !== String(process.env.AUTH_ID) && comment?.user?.login === 'badjoke-lab' && comment?.body === process.env.EXPECTED)
          if (auths.length !== 0) throw new Error(`authorization replay detected: ${auths.length} prior exact commands`)
          NODE

      - name: Revalidate exact authorized production state read-only
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.auth.outputs.commit }}
          SQL_SHA: ${{ steps.auth.outputs.sql_sha }}
          STATE_SHA: ${{ steps.auth.outputs.state_sha }}
        run: |
          set -euo pipefail
          mkdir -p r5-revision4-prepared-head-repair-evidence
          node "$MANAGER_PATH" audit \
            --source-commit "$SOURCE_COMMIT" \
            --expected-sha "$SQL_SHA" \
            --output r5-revision4-prepared-head-repair-evidence/execute-prestate.json \
            > /tmp/r5-prepared-head-repair-prestate.json
          test "$(jq -r '.classification' /tmp/r5-prepared-head-repair-prestate.json)" = unapplied_expected
          test "$(jq -r '.authorizationStateSha256' /tmp/r5-prepared-head-repair-prestate.json)" = "$STATE_SHA"

      - name: Apply exact bounded revision4 prepared-head repair
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.auth.outputs.commit }}
          SQL_SHA: ${{ steps.auth.outputs.sql_sha }}
          STATE_SHA: ${{ steps.auth.outputs.state_sha }}
        run: |
          set -euo pipefail
          node "$MANAGER_PATH" apply \
            --source-commit "$SOURCE_COMMIT" \
            --expected-sha "$SQL_SHA" \
            --expected-state "$STATE_SHA" \
            --output r5-revision4-prepared-head-repair-evidence/apply-result.json \
            > /tmp/r5-prepared-head-repair-result.json
          cat /tmp/r5-prepared-head-repair-result.json
          test "$(jq -r '.after.classification' /tmp/r5-prepared-head-repair-result.json)" = applied_consistent
          test "$(jq -r '.after.revision4MemoryRetryCalls' /tmp/r5-prepared-head-repair-result.json)" = 0
          test "$(jq -r '.after.revision3MemoryRetryCalls' /tmp/r5-prepared-head-repair-result.json)" = 1
          test "$(jq -r '.schedulerMutationPerformed' /tmp/r5-prepared-head-repair-result.json)" = false
          test "$(jq -r '.canonicalHistoryMutationPerformed' /tmp/r5-prepared-head-repair-result.json)" = false

      - name: Upload repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r5-revision4-prepared-head-repair-evidence
          path: r5-revision4-prepared-head-repair-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Publish repair result
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r5-revision4-prepared-head-repair-pass.md <<EOF2
          ## R5 revision-4 prepared-head memory-retry repair — PASS

          Run: \`${GITHUB_RUN_ID}\`
          Source main commit: \`${{ steps.auth.outputs.commit }}\`
          Target migration-history version: \`${TARGET_MIGRATION_VERSION}\`

          PASS means the revision-4 prepared-head wrapper no longer calls the revision-3-only memory-retry RPC, while the revision-3 memory-retry path remains intact. The exact migration-history record was written in the same bounded transaction.

          Scheduler mutation: \`none\`. Edge deployment: \`none\`. Canonical history: \`unchanged\`. Public reader: \`unchanged\`. Mainnet: \`disabled\`. Stabilization/soak: \`not authorized\`.

          Next gate: fresh \`/r5-revision4-minute-prepare\` against the repaired production function and new migration max.
          EOF2
          gh issue comment "$QUALIFICATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/r5-revision4-prepared-head-repair-pass.md
