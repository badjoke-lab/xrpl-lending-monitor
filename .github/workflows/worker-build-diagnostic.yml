name: Worker build diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture Worker build output
        shell: bash
        run: |
          set +e
          pnpm exec wrangler deploy --dry-run --outdir .worker-dry-run > worker-build-output.txt 2>&1
          code=$?
          cat worker-build-output.txt
          echo "$code" > worker-build-exit-code.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: worker-build-diagnostic
          path: |
            worker-build-output.txt
            worker-build-exit-code.txt
