name: P0 apply formal soak isolation fix 2026-07-21

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: p0-apply-soak-isolation-fix-20260721
  cancel-in-progress: false

jobs:
  isolate:
    if: startsWith(github.event.issue.title, 'P0 apply formal soak isolation fix stage 1')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Disable legacy scheduled triggers
        shell: bash
        run: |
          set -Eeuo pipefail
          stage='initialization'
          report_failure() {
            code=$?
            gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body "Stage 1 isolation failed during: ${stage}. Exit code: ${code}."
            exit "$code"
          }
          trap report_failure ERR

          stage='remove scheduled and issue triggers'
          python - <<'PY'
          from pathlib import Path

          def indentation(line: str) -> int:
              return len(line) - len(line.lstrip(' '))

          def remove_on_key(path: str, key: str) -> None:
              p = Path(path)
              lines = p.read_text().splitlines(keepends=True)
              out = []
              removed = False
              i = 0
              target = f'  {key}:'
              while i < len(lines):
                  if lines[i].rstrip('\n') == target:
                      removed = True
                      i += 1
                      while i < len(lines):
                          stripped = lines[i].strip()
                          if stripped and indentation(lines[i]) <= 2:
                              break
                          i += 1
                      continue
                  out.append(lines[i])
                  i += 1
              if not removed:
                  raise SystemExit(f'missing on.{key}: {path}')
              p.write_text(''.join(out))

          scheduled = [
              '.github/workflows/catch-up-monitor.yml',
              '.github/workflows/fast-lane-shadow-canary.yml',
              '.github/workflows/m1-exit-review.yml',
              '.github/workflows/ui-screenshot-audit.yml',
              '.github/workflows/rolling-checkpoint-maintenance.yml',
              '.github/workflows/verify-production-read-soak.yml',
          ]
          for path in scheduled:
              remove_on_key(path, 'schedule')
          remove_on_key('.github/workflows/rolling-checkpoint-maintenance.yml', 'issues')
          PY

          stage='verify trigger cleanup'
          for file in \
            catch-up-monitor.yml \
            fast-lane-shadow-canary.yml \
            m1-exit-review.yml \
            ui-screenshot-audit.yml \
            rolling-checkpoint-maintenance.yml \
            verify-production-read-soak.yml; do
            if grep -Eq '^  schedule:' ".github/workflows/${file}"; then
              echo "schedule still present in ${file}" >&2
              exit 1
            fi
          done
          if grep -Eq '^  issues:' .github/workflows/rolling-checkpoint-maintenance.yml; then
            echo 'issues trigger still present in rolling checkpoint maintenance' >&2
            exit 1
          fi

          stage='remove expired and failed one-shot workflows'
          rm -f \
            .github/workflows/p0-oneoff-verify-12-slots-20260721.yml \
            .github/workflows/p0-soak-action-interference-audit-20260721.yml \
            .github/workflows/p0-isolate-formal-soak-actions-20260721.yml \
            .github/p0-soak-action-audit-target-20260721 \
            .github/p0-soak-action-audit-target-20260721-2

          stage='commit and push'
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Disable legacy scheduled Actions during formal five-minute soak'
          git push origin HEAD:main

          stage='report success'
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body 'Stage 1 isolation committed and pushed. Legacy scheduled Actions were changed to non-scheduled/manual triggers; verify main before relying on this result.'
