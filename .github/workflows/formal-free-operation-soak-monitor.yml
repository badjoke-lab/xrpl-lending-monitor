name: Formal Free-operation soak monitor

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: formal-free-operation-soak-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PRODUCTION_BASE: https://xrpl-lending-monitor.badjoke-lab.workers.dev
      TARGET_EPOCH: devnet-3371675
      TARGET_SNAPSHOT: devnet-3800885-eaa0d29666e7
      TARGET_LEDGER: '3800885'
      TARGET_HASH: EAA0D29666E73D7594A52DF8000B07F346CD4DA24A9A07549612CDC7D727B700
    steps:
      - uses: actions/checkout@v4

      - name: Resolve observation window
        id: window
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p soak-monitor-evidence
          jq -e '.issueNumber>0 and (.startUtc|type=="string") and (.endUtc|type=="string") and .expectedSlots==288' .github/formal-free-soak-window.json > /dev/null
          issue="$(jq -r '.issueNumber' .github/formal-free-soak-window.json)"
          start="$(jq -r '.startUtc' .github/formal-free-soak-window.json)"
          end="$(jq -r '.endUtc' .github/formal-free-soak-window.json)"
          now_epoch="$(date -u +%s)"
          start_epoch="$(date -u -d "$start" +%s)"
          end_epoch="$(date -u -d "$end" +%s)"
          echo "issue=$issue" >> "$GITHUB_OUTPUT"
          echo "start=$start" >> "$GITHUB_OUTPUT"
          echo "end=$end" >> "$GITHUB_OUTPUT"
          if [ "$now_epoch" -lt "$start_epoch" ]; then
            echo 'active=false' >> "$GITHUB_OUTPUT"
            echo 'phase=scheduled' >> "$GITHUB_OUTPUT"
          elif [ "$now_epoch" -lt "$end_epoch" ]; then
            echo 'active=true' >> "$GITHUB_OUTPUT"
            echo 'phase=running' >> "$GITHUB_OUTPUT"
          else
            echo 'active=false' >> "$GITHUB_OUTPUT"
            echo 'phase=ended' >> "$GITHUB_OUTPUT"
          fi

      - name: Capture hourly soak checkpoint
        if: steps.window.outputs.active == 'true'
        shell: bash
        env:
          ISSUE_NUMBER: ${{ steps.window.outputs.issue }}
          START_UTC: ${{ steps.window.outputs.start }}
          END_UTC: ${{ steps.window.outputs.end }}
        run: |
          set -Eeuo pipefail

          query_d1() {
            local sql="$1"
            local output="$2"
            jq -n --arg sql "$sql" '{sql:$sql}' \
              | curl --fail-with-body --silent --show-error \
                  -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  -H 'Content-Type: application/json' --data-binary @- \
                  "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query" > "$output"
            jq -e '.success==true and ((.errors // [])|length)==0 and ([.result[].success]|all)' "$output" > /dev/null
          }

          start_epoch="$(date -u -d "$START_UTC" +%s)"
          end_epoch="$(date -u -d "$END_UTC" +%s)"
          now_epoch="$(date -u +%s)"
          cutoff_epoch=$((now_epoch - 60))
          max_cutoff=$((end_epoch - 300))
          if [ "$cutoff_epoch" -gt "$max_cutoff" ]; then cutoff_epoch="$max_cutoff"; fi
          test "$cutoff_epoch" -ge "$start_epoch"
          expected=$(((cutoff_epoch - start_epoch) / 300 + 1))
          start_slot=$((start_epoch / 300))
          cutoff_slot=$((start_slot + expected - 1))

          SLOTS_SQL=$(cat <<SQL
          WITH base AS (
            SELECT run_at,status,end_ledger_index,latest_observed_ledger,lag_ledgers,error_message,
                   CAST(strftime('%s',run_at)/300 AS INTEGER) AS slot_id
            FROM fast_lane_shadow_run_metrics
            WHERE network='devnet'
              AND CAST(strftime('%s',run_at)/300 AS INTEGER) BETWEEN ${start_slot} AND ${cutoff_slot}
          ), ranked AS (
            SELECT *,ROW_NUMBER() OVER (PARTITION BY slot_id ORDER BY run_at DESC) AS terminal_rank,
                   SUM(CASE WHEN status='error' OR error_message IS NOT NULL THEN 1 ELSE 0 END) OVER (PARTITION BY slot_id) AS errors_in_slot
            FROM base
          ), terminal AS (
            SELECT slot_id,run_at,status,end_ledger_index,latest_observed_ledger,lag_ledgers,error_message,errors_in_slot
            FROM ranked WHERE terminal_rank=1
          )
          SELECT COUNT(*) AS slot_count,MIN(slot_id) AS first_slot,MAX(slot_id) AS last_slot,
                 SUM(CASE WHEN status NOT IN ('committed','caught_up') OR lag_ledgers<>0 OR error_message IS NOT NULL THEN 1 ELSE 0 END) AS terminal_failures,
                 COALESCE(SUM(errors_in_slot),0) AS errors_in_slots,
                 COALESCE(MAX(lag_ledgers),0) AS max_terminal_lag,
                 MAX(run_at) AS latest_terminal_run
          FROM terminal
          SQL
          )
          query_d1 "$SLOTS_SQL" soak-monitor-evidence/slots.json
          query_d1 "SELECT last_processed_ledger,latest_observed_ledger,last_processed_hash,latest_observed_hash,status,updated_at,(latest_observed_ledger-last_processed_ledger) AS lag_ledgers FROM fast_lane_shadow_state WHERE network='devnet'" soak-monitor-evidence/state.json
          query_d1 "SELECT base_epoch_id,base_snapshot_id,base_ledger_index,base_ledger_hash FROM fast_lane_shadow_base_binding WHERE network='devnet'" soak-monitor-evidence/binding.json
          query_d1 "SELECT COUNT(*) AS overlay_rows,COALESCE(SUM(LENGTH(projection_json)),0) AS overlay_payload_bytes FROM current_state_overlay_objects WHERE network='devnet'" soak-monitor-evidence/overlay.json
          query_d1 "SELECT COUNT(*) AS stale_rows FROM current_state_overlay_objects o WHERE o.network='devnet' AND NOT EXISTS (SELECT 1 FROM fast_lane_shadow_base_binding b WHERE b.network=o.network AND b.base_epoch_id=o.epoch_id AND b.base_snapshot_id=o.base_snapshot_id)" soak-monitor-evidence/stale.json
          query_d1 "SELECT COUNT(*) AS state_rows FROM current_state_overlay_state WHERE network='devnet'" soak-monitor-evidence/overlay-state.json
          query_d1 "SELECT COUNT(*) AS compact_rows FROM fast_lane_shadow_objects_compact WHERE network='devnet'" soak-monitor-evidence/compact.json
          query_d1 "SELECT COUNT(*) AS foldable_rows FROM fast_lane_shadow_objects_compact AS fast WHERE fast.network='devnet' AND EXISTS (SELECT 1 FROM current_state_overlay_objects AS overlay JOIN fast_lane_shadow_base_binding AS binding ON binding.network='devnet' WHERE overlay.network='devnet' AND overlay.epoch_id=binding.base_epoch_id AND overlay.base_snapshot_id=binding.base_snapshot_id AND overlay.object_type=fast.object_type AND overlay.object_id=fast.object_id AND (overlay.source_ledger_index>fast.source_ledger_index OR (overlay.source_ledger_index=fast.source_ledger_index AND overlay.source_transaction_index>=fast.source_transaction_index)))" soak-monitor-evidence/foldable.json

          curl --fail-with-body --silent --show-error -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-monitor/schedules" > soak-monitor-evidence/schedules.json
          curl --fail-with-body --silent --show-error -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}" > soak-monitor-evidence/database.json

          overview_http="$(curl --silent --show-error --retry 2 -o soak-monitor-evidence/overview.json -w '%{http_code}' "${PRODUCTION_BASE}/api/overview")"
          history_http="$(curl --silent --show-error --retry 2 -o soak-monitor-evidence/history.json -w '%{http_code}' "${PRODUCTION_BASE}/api/status/history-source")"
          diff_http="$(curl --silent --show-error --retry 2 -o soak-monitor-evidence/diff.json -w '%{http_code}' "${PRODUCTION_BASE}/api/status/fast-lane-diff?limit=500")"

          today="$(date -u +%F)"
          read -r -d '' q <<'GRAPHQL' || true
          query D1Usage($accountTag:string!,$start:Date,$end:Date,$databaseId:string){viewer{accounts(filter:{accountTag:$accountTag}){d1AnalyticsAdaptiveGroups(limit:10000,filter:{date_geq:$start,date_leq:$end,databaseId:$databaseId}){sum{rowsRead rowsWritten}}}}}
          GRAPHQL
          jq -n --arg query "$q" --arg accountTag "$CLOUDFLARE_ACCOUNT_ID" --arg start "$today" --arg end "$today" --arg databaseId "$DATABASE_ID" '{query:$query,variables:{accountTag:$accountTag,start:$start,end:$end,databaseId:$databaseId}}' > soak-monitor-evidence/usage-request.json
          curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'content-type: application/json' --data @soak-monitor-evidence/usage-request.json https://api.cloudflare.com/client/v4/graphql > soak-monitor-evidence/usage.json

          slots="$(jq -c '.result[0].results[0]' soak-monitor-evidence/slots.json)"
          state="$(jq -c '.result[0].results[0]' soak-monitor-evidence/state.json)"
          binding="$(jq -c '.result[0].results[0]' soak-monitor-evidence/binding.json)"
          overlay="$(jq -c '.result[0].results[0]' soak-monitor-evidence/overlay.json)"
          stale="$(jq -c '.result[0].results[0]' soak-monitor-evidence/stale.json)"
          overlay_state="$(jq -c '.result[0].results[0]' soak-monitor-evidence/overlay-state.json)"
          compact="$(jq -c '.result[0].results[0]' soak-monitor-evidence/compact.json)"
          foldable="$(jq -c '.result[0].results[0]' soak-monitor-evidence/foldable.json)"
          database_bytes="$(jq -r '.result.file_size' soak-monitor-evidence/database.json)"
          rows_read="$(jq '[.data.viewer.accounts[0].d1AnalyticsAdaptiveGroups[].sum.rowsRead // 0] | add // 0' soak-monitor-evidence/usage.json)"
          rows_written="$(jq '[.data.viewer.accounts[0].d1AnalyticsAdaptiveGroups[].sum.rowsWritten // 0] | add // 0' soak-monitor-evidence/usage.json)"

          slot_ok="$(jq -n --argjson s "$slots" --argjson expected "$expected" --argjson first "$start_slot" --argjson last "$cutoff_slot" '$s.slot_count==$expected and $s.first_slot==$first and $s.last_slot==$last and $s.terminal_failures==0 and $s.errors_in_slots==0 and $s.max_terminal_lag==0')"
          state_ok="$(jq -n --argjson s "$state" '$s.lag_ledgers==0 and $s.last_processed_ledger==$s.latest_observed_ledger and $s.last_processed_hash==$s.latest_observed_hash')"
          binding_ok="$(jq -n --argjson b "$binding" --arg epoch "$TARGET_EPOCH" --arg snapshot "$TARGET_SNAPSHOT" --argjson ledger "$TARGET_LEDGER" --arg hash "$TARGET_HASH" '$b.base_epoch_id==$epoch and $b.base_snapshot_id==$snapshot and $b.base_ledger_index==$ledger and $b.base_ledger_hash==$hash')"
          storage_ok="$(jq -n --argjson o "$overlay" --argjson st "$stale" --argjson os "$overlay_state" --argjson c "$compact" --argjson f "$foldable" --argjson db "$database_bytes" '$o.overlay_rows>0 and $o.overlay_rows<59000 and $o.overlay_payload_bytes<70000000 and $st.stale_rows==0 and $os.state_rows==1 and $c.compact_rows==0 and $f.foldable_rows==0 and $db<400000000')"
          usage_ok="$(jq -n --argjson r "$rows_read" --argjson w "$rows_written" '$r<4000000 and $w<80000')"
          schedule_ok="$(jq '.success==true and (.result.schedules|length==1) and .result.schedules[0].cron=="*/5 * * * *"' soak-monitor-evidence/schedules.json)"
          config_ok="$(jq '.triggers.crons==["*/5 * * * *"] and .vars.APP_NETWORK=="devnet" and .vars.MAINNET_ENABLED=="false" and (.queues.producers|length==1) and (.queues.consumers|length==1) and .queues.consumers[0].max_batch_size==1 and .queues.consumers[0].max_concurrency==1' wrangler.jsonc)"
          api_ok="$(jq -n --arg overview "$overview_http" --arg history "$history_http" --arg diff "$diff_http" --slurpfile d soak-monitor-evidence/diff.json '$overview=="200" and $history=="200" and $diff=="200" and $d[0].status=="ok" and $d[0].sample.exactProjectionMismatches==0 and $d[0].sample.canonicalAheadRows==0')"
          passed="$(jq -n --argjson a "$slot_ok" --argjson b "$state_ok" --argjson c "$binding_ok" --argjson d "$storage_ok" --argjson e "$usage_ok" --argjson f "$schedule_ok" --argjson g "$config_ok" --argjson h "$api_ok" '$a and $b and $c and $d and $e and $f and $g and $h')"

          jq -n --argjson passed "$passed" --argjson expectedSlotsThroughCheckpoint "$expected" --argjson slots "$slots" --argjson state "$state" --argjson binding "$binding" --argjson overlay "$overlay" --argjson stale "$stale" --argjson overlayState "$overlay_state" --argjson compact "$compact" --argjson foldable "$foldable" --argjson databaseBytes "$database_bytes" --argjson rowsRead "$rows_read" --argjson rowsWritten "$rows_written" --argjson slotOk "$slot_ok" --argjson stateOk "$state_ok" --argjson bindingOk "$binding_ok" --argjson storageOk "$storage_ok" --argjson usageOk "$usage_ok" --argjson scheduleOk "$schedule_ok" --argjson configOk "$config_ok" --argjson apiOk "$api_ok" --arg overviewHttp "$overview_http" --arg historyHttp "$history_http" --arg diffHttp "$diff_http" '{passed:$passed,expectedSlotsThroughCheckpoint:$expectedSlotsThroughCheckpoint,checks:{slotOk:$slotOk,stateOk:$stateOk,bindingOk:$bindingOk,storageOk:$storageOk,usageOk:$usageOk,scheduleOk:$scheduleOk,configOk:$configOk,apiOk:$apiOk},slots:$slots,state:$state,binding:$binding,overlay:$overlay,stale:$stale,overlayState:$overlayState,compact:$compact,foldable:$foldable,databaseBytes:$databaseBytes,d1Today:{rowsRead:$rowsRead,rowsWritten:$rowsWritten},overviewHttp:$overviewHttp,historyHttp:$historyHttp,diffHttp:$diffHttp,checkedAt:(now|todate)}' > soak-monitor-evidence/summary.json

          if [ "$passed" != true ]; then
            {
              echo 'Formal Free-operation soak failed at an hourly checkpoint:'
              echo
              echo '```json'
              cat soak-monitor-evidence/summary.json
              echo '```'
            } > soak-monitor-evidence/failure-comment.md
            gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body-file soak-monitor-evidence/failure-comment.md
            gh issue edit "$ISSUE_NUMBER" --repo "$REPOSITORY" --title 'FAILED — 24h five-minute Free-operation soak post-recovery 2026-07-22 09:10 JST' --state closed
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: steps.window.outputs.active == 'true' && always()
        with:
          name: formal-free-operation-soak-checkpoint
          path: soak-monitor-evidence
          if-no-files-found: warn
          retention-days: 30
