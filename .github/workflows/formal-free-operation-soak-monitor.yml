name: Formal Free-operation soak monitor

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: formal-free-operation-soak-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PRODUCTION_BASE: https://xrpl-lending-monitor.badjoke-lab.workers.dev
    steps:
      - uses: actions/checkout@v4

      - name: Resolve accepted observation window
        id: window
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p soak-monitor-evidence
          jq -e '.issueNumber>0 and .expectedSlots==288' .github/formal-free-soak-window.json > /dev/null
          issue="$(jq -r '.issueNumber' .github/formal-free-soak-window.json)"
          start="$(jq -r '.startUtc' .github/formal-free-soak-window.json)"
          end="$(jq -r '.endUtc' .github/formal-free-soak-window.json)"
          gh issue view "$issue" --repo "$REPOSITORY" --json state,title,labels > soak-monitor-evidence/issue.json
          now_epoch="$(date -u +%s)"
          start_epoch="$(date -u -d "$start" +%s)"
          end_epoch="$(date -u -d "$end" +%s)"
          accepted="$(jq -r 'if .state=="OPEN" and (([.labels[].name] | index("in-progress")) != null) and ((.title|startswith("FAILED"))|not) and ((.title|startswith("NOT STARTED"))|not) then "true" else "false" end' soak-monitor-evidence/issue.json)"
          active=false
          if [ "$now_epoch" -ge "$start_epoch" ] && [ "$now_epoch" -lt "$end_epoch" ] && [ "$accepted" = true ]; then
            active=true
          fi
          echo "active=$active" >> "$GITHUB_OUTPUT"
          echo "issue=$issue" >> "$GITHUB_OUTPUT"
          echo "start=$start" >> "$GITHUB_OUTPUT"
          echo "end=$end" >> "$GITHUB_OUTPUT"

      - name: Capture minimal hourly checkpoint
        if: steps.window.outputs.active == 'true'
        shell: bash
        env:
          ISSUE_NUMBER: ${{ steps.window.outputs.issue }}
          START_UTC: ${{ steps.window.outputs.start }}
          END_UTC: ${{ steps.window.outputs.end }}
        run: |
          set -Eeuo pipefail
          start_epoch="$(date -u -d "$START_UTC" +%s)"
          end_epoch="$(date -u -d "$END_UTC" +%s)"
          now_epoch="$(date -u +%s)"
          cutoff_epoch=$((now_epoch - 60))
          max_cutoff=$((end_epoch - 300))
          [ "$cutoff_epoch" -le "$max_cutoff" ] || cutoff_epoch="$max_cutoff"
          test "$cutoff_epoch" -ge "$start_epoch"
          expected=$(((cutoff_epoch - start_epoch) / 300 + 1))
          start_slot=$((start_epoch / 300))
          cutoff_slot=$((start_slot + expected - 1))

          SQL=$(cat <<SQL
          WITH base AS (
            SELECT run_at,status,start_ledger_index,end_ledger_index,latest_observed_ledger,
                   lag_ledgers,ledgers_processed,persistence_rows_written,error_message,
                   CAST(strftime('%s',run_at)/300 AS INTEGER) AS slot_id
            FROM fast_lane_shadow_run_metrics
            WHERE network='devnet'
              AND CAST(strftime('%s',run_at)/300 AS INTEGER) BETWEEN ${start_slot} AND ${cutoff_slot}
          ), ranked AS (
            SELECT *,ROW_NUMBER() OVER (PARTITION BY slot_id ORDER BY run_at DESC) AS terminal_rank
            FROM base
          ), terminal AS (
            SELECT * FROM ranked WHERE terminal_rank=1
          )
          SELECT COUNT(*) AS slot_count,MIN(slot_id) AS first_slot,MAX(slot_id) AS last_slot,
                 SUM(CASE WHEN status NOT IN ('committed','caught_up') OR lag_ledgers<>0 OR error_message IS NOT NULL OR end_ledger_index IS NULL THEN 1 ELSE 0 END) AS terminal_failures,
                 (SELECT COUNT(*) FROM base WHERE error_message IS NOT NULL OR (status='error' AND NOT (error_message IS NULL AND start_ledger_index IS NULL AND end_ledger_index IS NULL AND latest_observed_ledger=0 AND lag_ledgers=0 AND ledgers_processed=0 AND persistence_rows_written=0))) AS actual_error_rows,
                 (SELECT COUNT(*) FROM base WHERE status='error' AND error_message IS NULL AND start_ledger_index IS NULL AND end_ledger_index IS NULL AND latest_observed_ledger=0 AND lag_ledgers=0 AND ledgers_processed=0 AND persistence_rows_written=0) AS abandoned_heartbeats,
                 MAX(run_at) AS latest_terminal_run
          FROM terminal;
          SELECT last_processed_ledger,last_processed_hash,latest_observed_ledger,latest_observed_hash,status,updated_at,(latest_observed_ledger-last_processed_ledger) AS lag_ledgers FROM fast_lane_shadow_state WHERE network='devnet';
          SELECT (SELECT COUNT(*) FROM fast_lane_shadow_objects_compact WHERE network='devnet') AS compact_rows,
                 (SELECT COUNT(*) FROM current_state_overlay_state WHERE network='devnet') AS overlay_state_rows,
                 (SELECT MAX(overlay_ledger_index) FROM current_state_overlay_state WHERE network='devnet') AS overlay_ledger_index,
                 (SELECT MAX(overlay_ledger_hash) FROM current_state_overlay_state WHERE network='devnet') AS overlay_ledger_hash;
          SQL
          )
          jq -n --arg sql "$SQL" '{sql:$sql}' | curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' --data-binary @- \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query" > soak-monitor-evidence/d1.json
          jq -e '.success==true and ((.errors // [])|length)==0 and (.result|length)==3 and ([.result[].success]|all)' soak-monitor-evidence/d1.json > /dev/null

          curl --fail-with-body --silent --show-error -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-monitor/schedules" > soak-monitor-evidence/schedules.json
          curl --fail-with-body --silent --show-error -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}" > soak-monitor-evidence/database.json
          overview_http="$(curl --silent --show-error --retry 2 -o soak-monitor-evidence/overview.json -w '%{http_code}' "${PRODUCTION_BASE}/api/overview")"
          diff_http="$(curl --silent --show-error --retry 2 -o soak-monitor-evidence/diff.json -w '%{http_code}' "${PRODUCTION_BASE}/api/status/fast-lane-diff?limit=500")"

          today="$(date -u +%F)"
          read -r -d '' Q <<'GRAPHQL' || true
          query D1Usage($accountTag:string!,$start:Date,$end:Date,$databaseId:string){viewer{accounts(filter:{accountTag:$accountTag}){d1AnalyticsAdaptiveGroups(limit:10000,filter:{date_geq:$start,date_leq:$end,databaseId:$databaseId}){sum{rowsRead rowsWritten}}}}}
          GRAPHQL
          jq -n --arg query "$Q" --arg accountTag "$CLOUDFLARE_ACCOUNT_ID" --arg start "$today" --arg end "$today" --arg databaseId "$DATABASE_ID" '{query:$query,variables:{accountTag:$accountTag,start:$start,end:$end,databaseId:$databaseId}}' > soak-monitor-evidence/usage-request.json
          curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'content-type: application/json' --data @soak-monitor-evidence/usage-request.json https://api.cloudflare.com/client/v4/graphql > soak-monitor-evidence/usage.json

          slots="$(jq -c '.result[0].results[0]' soak-monitor-evidence/d1.json)"
          state="$(jq -c '.result[1].results[0]' soak-monitor-evidence/d1.json)"
          storage="$(jq -c '.result[2].results[0]' soak-monitor-evidence/d1.json)"
          rows_read="$(jq '[.data.viewer.accounts[0].d1AnalyticsAdaptiveGroups[].sum.rowsRead // 0]|add//0' soak-monitor-evidence/usage.json)"
          rows_written="$(jq '[.data.viewer.accounts[0].d1AnalyticsAdaptiveGroups[].sum.rowsWritten // 0]|add//0' soak-monitor-evidence/usage.json)"
          database_bytes="$(jq -r '.result.file_size' soak-monitor-evidence/database.json)"

          slot_ok="$(jq -n --argjson s "$slots" --argjson expected "$expected" --argjson first "$start_slot" --argjson last "$cutoff_slot" '$s.slot_count==$expected and $s.first_slot==$first and $s.last_slot==$last and $s.terminal_failures==0 and $s.actual_error_rows==0')"
          state_ok="$(jq -n --argjson s "$state" '$s.status=="healthy" and $s.lag_ledgers==0 and $s.last_processed_ledger==$s.latest_observed_ledger and $s.last_processed_hash==$s.latest_observed_hash')"
          storage_ok="$(jq -n --argjson s "$state" --argjson o "$storage" --argjson db "$database_bytes" '$o.compact_rows==0 and $o.overlay_state_rows==1 and $o.overlay_ledger_index==$s.last_processed_ledger and $o.overlay_ledger_hash==$s.last_processed_hash and $db<400000000')"
          usage_ok="$(jq -n --argjson r "$rows_read" --argjson w "$rows_written" '$r<4000000 and $w<80000')"
          schedule_ok="$(jq '.success==true and (.result.schedules|length)==1 and .result.schedules[0].cron=="*/5 * * * *"' soak-monitor-evidence/schedules.json)"
          config_ok="$(jq '.triggers.crons==["*/5 * * * *"] and .vars.APP_NETWORK=="devnet" and .vars.MAINNET_ENABLED=="false" and (.queues.producers|length)==1 and (.queues.consumers|length)==1 and .queues.consumers[0].max_batch_size==1 and .queues.consumers[0].max_concurrency==1' wrangler.jsonc)"
          api_ok="$(jq -n --arg overview "$overview_http" --arg diff "$diff_http" --slurpfile d soak-monitor-evidence/diff.json '$overview=="200" and $diff=="200" and $d[0].status=="ok" and $d[0].passed==true and $d[0].reason==null and $d[0].fastLane.ledgerIndex==$d[0].canonicalOverlay.ledgerIndex and $d[0].fastLane.ledgerHash==$d[0].canonicalOverlay.ledgerHash and ($d[0].sample.exactProjectionMismatches//0)==0 and ($d[0].sample.canonicalAheadRows//0)==0')"
          passed="$(jq -n --argjson a "$slot_ok" --argjson b "$state_ok" --argjson c "$storage_ok" --argjson d "$usage_ok" --argjson e "$schedule_ok" --argjson f "$config_ok" --argjson g "$api_ok" '$a and $b and $c and $d and $e and $f and $g')"

          jq -n --arg checkedAt "$(date -u +%FT%TZ)" --argjson passed "$passed" --argjson slots "$slots" --argjson state "$state" --argjson storage "$storage" --argjson rowsRead "$rows_read" --argjson rowsWritten "$rows_written" --argjson databaseBytes "$database_bytes" --argjson slotOk "$slot_ok" --argjson stateOk "$state_ok" --argjson storageOk "$storage_ok" --argjson usageOk "$usage_ok" --argjson scheduleOk "$schedule_ok" --argjson configOk "$config_ok" --argjson apiOk "$api_ok" '{checkedAt:$checkedAt,passed:$passed,checks:{slotOk:$slotOk,stateOk:$stateOk,storageOk:$storageOk,usageOk:$usageOk,scheduleOk:$scheduleOk,configOk:$configOk,apiOk:$apiOk},slots:$slots,state:$state,storage:$storage,d1Today:{rowsRead:$rowsRead,rowsWritten:$rowsWritten},databaseBytes:$databaseBytes}' > soak-monitor-evidence/summary.json

          if [ "$passed" != true ]; then
            { echo 'Formal five-minute soak failed at an isolated hourly checkpoint:'; echo; echo '```json'; cat soak-monitor-evidence/summary.json; echo '```'; } > soak-monitor-evidence/failure.md
            gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body-file soak-monitor-evidence/failure.md
            gh issue edit "$ISSUE_NUMBER" --repo "$REPOSITORY" --title 'FAILED — 24h five-minute Free-operation soak post-recovery 2026-07-22 09:15 JST' --state closed
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: steps.window.outputs.active == 'true' && always()
        with:
          name: formal-free-operation-soak-checkpoint
          path: soak-monitor-evidence
          if-no-files-found: warn
          retention-days: 30
