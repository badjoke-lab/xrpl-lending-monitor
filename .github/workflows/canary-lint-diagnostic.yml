name: Canary lint diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/canary-lint-diagnostic.yml'
      - 'scripts/verify-three-layer-read-canary.ts'
      - 'vite.three-layer-read-canary.config.ts'

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: lint
        shell: bash
        run: |
          set +e
          pnpm lint > lint.log 2>&1
          STATUS=$?
          echo "status=${STATUS}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Post lint diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Temporary canary lint diagnostic'
            echo
            echo '```text'
            cat lint.log
            echo
            echo '```'
            echo
            echo "exit_status: ${{ steps.lint.outputs.status }}"
          } > lint-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file lint-comment.md
