name: R5 revision-3 future-demand read-only audit

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: r5-revision3-future-demand-readonly-audit
  cancel-in-progress: false

jobs:
  audit:
    if: >-
      github.event.issue.number == 1261 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      github.event.comment.body == '/r5-revision3-future-demand-readonly-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Audit revision-3 runtime future demand read-only
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          mkdir -p r5-revision3-future-demand-readonly-audit
          node scripts/r5-revision3-future-demand-readonly-audit.mjs \
            --source-commit "$GITHUB_SHA" \
            --output-dir r5-revision3-future-demand-readonly-audit

      - name: Upload sanitized read-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: r5-revision3-future-demand-readonly-audit-${{ github.run_id }}
          path: r5-revision3-future-demand-readonly-audit/
          if-no-files-found: error
          retention-days: 14

      - name: Publish read-only audit result
        shell: bash
        run: |
          set -euo pipefail
          {
            cat r5-revision3-future-demand-readonly-audit/revision3-future-demand-summary.md
            echo
            echo "Run: ${GITHUB_RUN_ID}"
            echo 'Safety: SELECT/read_only only. No permission, scheduler, function, restore/schema, physical-compaction, deployment, R5 rearm, or Mainnet mutation is authorized.'
          } > /tmp/revision3-future-demand-result.md
          gh issue comment 1261 --repo "$GITHUB_REPOSITORY" --body-file /tmp/revision3-future-demand-result.md
