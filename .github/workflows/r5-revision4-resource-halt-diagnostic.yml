name: R5 revision4 resource halt diagnostic

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: r5-revision4-resource-halt-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    if: >-
      github.event.issue.number == 1261 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      github.event.comment.body == '/r5-revision4-resource-halt-diagnose'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up exact Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Reproduce halted batch accounting read-only
        run: |
          set -euo pipefail
          mkdir -p r5-revision4-resource-halt-diagnostic
          bun scripts/diagnose-r5-revision4-resource-halt.ts \
            r5-revision4-resource-halt-diagnostic/diagnostic.json
          jq -e '
            .safety.productionDatabaseReadOnly == true and
            .safety.noRunMutation == true and
            .safety.noBatchMutation == true and
            .safety.noPublicReaderMutation == true and
            .safety.mainnetDisabled == true and
            .historicalLedgerContinuityVerified == true and
            .range.ledgerCount == 12 and
            (.evidenceDigest | test("^[a-f0-9]{64}$"))
          ' r5-revision4-resource-halt-diagnostic/diagnostic.json >/dev/null

      - name: Upload sanitized diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r5-revision4-resource-halt-diagnostic
          path: r5-revision4-resource-halt-diagnostic
          if-no-files-found: warn
          retention-days: 14

      - name: Publish sanitized diagnostic result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s r5-revision4-resource-halt-diagnostic/diagnostic.json ]; then
            printf '## R5 revision-4 resource halt diagnostic — FAILED BEFORE EVIDENCE\n\nRun: %s/%s/actions/runs/%s\n\nNo production mutation was authorized or performed.\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > /tmp/diagnostic.md
          else
            classification="$(jq -r '.verdict.classification' r5-revision4-resource-halt-diagnostic/diagnostic.json)"
            egress_lower="$(jq -r '.bounds.egressLowerBytes' r5-revision4-resource-halt-diagnostic/diagnostic.json)"
            egress_upper="$(jq -r '.bounds.egressUpperBytes' r5-revision4-resource-halt-diagnostic/diagnostic.json)"
            reservation="$(jq -r '.guards.reservedEgressBytes' r5-revision4-resource-halt-diagnostic/diagnostic.json)"
            memory_upper="$(jq -r '.bounds.memoryUpperBeforeEarlyRssHalt' r5-revision4-resource-halt-diagnostic/diagnostic.json)"
            memory_limit="$(jq -r '.guards.projectMemoryHaltBytes' r5-revision4-resource-halt-diagnostic/diagnostic.json)"
            project_headroom="$(jq -r '.guards.projectEgressHeadroomBeforeBatch' r5-revision4-resource-halt-diagnostic/diagnostic.json)"
            digest="$(jq -r '.evidenceDigest' r5-revision4-resource-halt-diagnostic/diagnostic.json)"
            cat > /tmp/diagnostic.md <<EOF
          ## R5 revision-4 resource halt read-only diagnostic

          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          Source commit: \`${GITHUB_SHA}\`
          Classification: \`${classification}\`
          Batch egress lower bound: \`${egress_lower} B\`
          Batch egress upper bound: \`${egress_upper} B\`
          Exclusive batch reservation: \`${reservation} B\`
          Memory upper bound before the separate 200 MiB RSS halt: \`${memory_upper} B\`
          Project memory halt: \`${memory_limit} B\`
          Project egress headroom before this batch: \`${project_headroom} B\`
          Evidence digest: \`${digest}\`

          This diagnostic used production database read-only queries and public Devnet ledger reads only. It did not rearm R5, mutate the halted batch/run, deploy a function, pause/switch the collector, mutate the public reader, or enable Mainnet.
          EOF
          fi
          gh issue comment 1261 --repo "$GITHUB_REPOSITORY" --body-file /tmp/diagnostic.md
