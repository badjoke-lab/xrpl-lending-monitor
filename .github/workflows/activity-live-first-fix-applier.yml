name: Activity live-first fix applier
on:
  pull_request:
    paths:
      - .github/workflows/activity-live-first-fix-applier.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/activity-live-first-read-safety
      - name: Apply reviewed Activity route patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/worker/routes/hybrid-history-override.ts')
          text = path.read_text()
          text = text.replace('  type HybridHistoryResult,\n', '', 1)
          anchor = "} from '../serializers/history-api'\n"
          addition = "} from '../serializers/history-api'\nimport { safeHybridResult, safeNewestFirstHybridResult } from './hybrid-history-safety'\n"
          if anchor not in text:
              raise SystemExit('serializer import anchor not found')
          text = text.replace(anchor, addition, 1)
          helper = """function safeHybridResult<T>(result: HybridHistoryResult<T>, limit: number): boolean {\n  return result.immutable.complete || result.merge.immutableInput >= limit\n}\n\n"""
          if helper not in text:
              raise SystemExit('local safety helper not found')
          text = text.replace(helper, '', 1)
          target = "const result = await listHybridActivity({ ...common, page: { limit } })\n    if (!safeHybridResult(result, limit))"
          replacement = "const result = await listHybridActivity({ ...common, page: { limit } })\n    if (!safeNewestFirstHybridResult(result, limit))"
          if text.count(target) != 2:
              raise SystemExit(f'expected 2 Activity safety checks, found {text.count(target)}')
          text = text.replace(target, replacement, 2)
          path.write_text(text)
          PY
          git diff --check
          pnpm install --frozen-lockfile
          pnpm exec vitest run src/worker/routes/hybrid-history-safety.test.ts
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/worker/routes/hybrid-history-override.ts
          git commit -m "Use live-first safety for Activity reads"
          git push origin HEAD:fix/activity-live-first-read-safety
