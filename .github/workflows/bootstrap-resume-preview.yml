name: Bootstrap resume preview

on:
  pull_request:
    paths:
      - "src/collector/current-state/live-bootstrap-resume-preview.test.ts"
      - "src/collector/current-state/bootstrap-runner.ts"
      - "src/collector/current-state/bootstrap-shard-encoder.ts"
      - ".github/workflows/bootstrap-resume-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-devnet-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run two-batch Devnet resume preview
        env:
          RUN_LIVE_BOOTSTRAP_RESUME_PREVIEW: "true"
          XRPL_DEVNET_RPC_URL: "https://s.devnet.rippletest.net:51234/"
        run: pnpm exec vitest run src/collector/current-state/live-bootstrap-resume-preview.test.ts --reporter=verbose

      - name: Upload resume evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-resume-preview
          path: artifacts/bootstrap-resume-preview.json
          if-no-files-found: warn
          retention-days: 14
