name: Diagnose deployed loan list route

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/deploy-loan-list-fix.yml]

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec wrangler deploy

      - name: Capture failing route with Worker tail
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p loan-list-route-diagnostics
          curl --fail-with-body --silent --show-error --retry 3 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            > loan-list-route-diagnostics/subdomain.json
          SUBDOMAIN="$(jq -r '.result.subdomain // empty' loan-list-route-diagnostics/subdomain.json)"
          test -n "$SUBDOMAIN"
          BASE="https://xrpl-lending-monitor.${SUBDOMAIN}.workers.dev"
          printf '%s\n' "$BASE" > loan-list-route-diagnostics/base-url.txt

          pnpm exec wrangler tail xrpl-lending-monitor --format json \
            > loan-list-route-diagnostics/worker-tail.jsonl 2>&1 &
          TAIL_PID=$!
          sleep 6

          set +e
          HTTP_CODE="$(curl --silent --show-error --output loan-list-route-diagnostics/response.json \
            --write-out '%{http_code}' \
            "$BASE/api/loans?limit=5&on_ledger_status=active&schedule_status=current")"
          CURL_STATUS=$?
          set -e
          printf '%s\n' "$HTTP_CODE" > loan-list-route-diagnostics/http-code.txt
          printf '%s\n' "$CURL_STATUS" > loan-list-route-diagnostics/curl-status.txt

          sleep 8
          kill "$TAIL_PID" 2>/dev/null || true
          wait "$TAIL_PID" 2>/dev/null || true

          cat loan-list-route-diagnostics/response.json
          echo "HTTP $HTTP_CODE"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loan-list-route-diagnostics
          path: loan-list-route-diagnostics
          if-no-files-found: error
          retention-days: 7
