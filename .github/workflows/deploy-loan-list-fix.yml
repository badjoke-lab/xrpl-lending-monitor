name: Deploy loan list fix and verify

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/deploy-loan-list-fix.yml]

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec wrangler deploy

      - name: Capture filtered loan-list evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p loan-list-fix-evidence
          curl --fail-with-body --silent --show-error --retry 3 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            > loan-list-fix-evidence/subdomain.json
          SUBDOMAIN="$(jq -r '.result.subdomain // empty' loan-list-fix-evidence/subdomain.json)"
          test -n "$SUBDOMAIN"
          BASE="https://xrpl-lending-monitor.${SUBDOMAIN}.workers.dev"
          printf '%s\n' "$BASE" > loan-list-fix-evidence/base-url.txt

          curl --fail-with-body --silent --show-error --retry 3 \
            "$BASE/api/loans?limit=5&on_ledger_status=active&schedule_status=current" \
            > loan-list-fix-evidence/active-current.json
          curl --fail-with-body --silent --show-error --retry 3 \
            "$BASE/api/loans?limit=5&on_ledger_status=active&schedule_status=payment_due" \
            > loan-list-fix-evidence/active-payment-due.json
          curl --fail-with-body --silent --show-error --retry 3 \
            "$BASE/api/loans?limit=5&on_ledger_status=active&schedule_status=default_eligible" \
            > loan-list-fix-evidence/active-default-eligible.json
          curl --fail-with-body --silent --show-error --retry 3 \
            "$BASE/api/loans?limit=5&on_ledger_status=impaired" \
            > loan-list-fix-evidence/impaired.json
          curl --fail-with-body --silent --show-error --retry 3 \
            "$BASE/api/loans?limit=5&on_ledger_status=defaulted" \
            > loan-list-fix-evidence/defaulted.json

          for FILE in loan-list-fix-evidence/active-current.json \
                      loan-list-fix-evidence/active-payment-due.json \
                      loan-list-fix-evidence/active-default-eligible.json \
                      loan-list-fix-evidence/impaired.json \
                      loan-list-fix-evidence/defaulted.json; do
            jq -e '.availability.state == "available" and (.data | type == "array") and .page' "$FILE" > /dev/null
          done

          curl --fail-with-body --silent --show-error --retry 3 \
            "$BASE/api/status/collector" \
            > loan-list-fix-evidence/collector.json
          curl --fail-with-body --silent --show-error --retry 3 \
            "$BASE/api/status/continuation-diagnostics" \
            > loan-list-fix-evidence/continuation-diagnostics.json

      - name: Build evidence summary
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --slurpfile current loan-list-fix-evidence/active-current.json \
            --slurpfile due loan-list-fix-evidence/active-payment-due.json \
            --slurpfile eligible loan-list-fix-evidence/active-default-eligible.json \
            --slurpfile impaired loan-list-fix-evidence/impaired.json \
            --slurpfile defaulted loan-list-fix-evidence/defaulted.json \
            --slurpfile collector loan-list-fix-evidence/collector.json \
            --slurpfile continuation loan-list-fix-evidence/continuation-diagnostics.json \
            '{
              collector: {
                status: $collector[0].status,
                cursor: $collector[0].cursor.last_processed_ledger,
                head: $collector[0].cursor.latest_observed_ledger,
                lag: $collector[0].cursor.lag_ledgers,
                consecutive_failures: $collector[0].consecutive_failures,
                error: $collector[0].error
              },
              loan_activity: $continuation[0].loanActivity,
              first_page: {
                active_current: {count: ($current[0].data | length), next_cursor: ($current[0].page.next_cursor != null)},
                active_payment_due: {count: ($due[0].data | length), next_cursor: ($due[0].page.next_cursor != null)},
                active_default_eligible: {count: ($eligible[0].data | length), next_cursor: ($eligible[0].page.next_cursor != null)},
                impaired: {count: ($impaired[0].data | length), next_cursor: ($impaired[0].page.next_cursor != null)},
                defaulted: {count: ($defaulted[0].data | length), next_cursor: ($defaulted[0].page.next_cursor != null)}
              }
            }' > loan-list-fix-evidence/summary.json

          jq -e '.collector.error == null and .collector.consecutive_failures == 0' \
            loan-list-fix-evidence/summary.json > /dev/null

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loan-list-fix-evidence
          path: loan-list-fix-evidence
          if-no-files-found: error
          retention-days: 7
