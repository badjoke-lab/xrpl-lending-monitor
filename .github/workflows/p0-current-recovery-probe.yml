name: P0 current recovery probe

on:
  push:
    branches: [main]
    paths:
      - .github/p0-current-recovery-probe-trigger

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: '958'
    steps:
      - name: Query exact current recovery state
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          query_d1() {
            local sql="$1"
            local output="$2"
            jq -n --arg sql "$sql" '{sql:$sql}' \
              | curl --fail-with-body --silent --show-error \
                  -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  -H 'Content-Type: application/json' \
                  --data-binary @- \
                  "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query" \
              > "$output"
            jq -e '.success == true and ((.errors // []) | length) == 0 and ([.result[].success] | all)' "$output" > /dev/null
          }

          curl --fail-with-body --silent --show-error --retry 3 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-monitor/schedules" > evidence/schedules.json
          curl --fail-with-body --silent --show-error --retry 3 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}" > evidence/database.json

          query_d1 "SELECT base_epoch_id,base_snapshot_id,base_ledger_index,base_ledger_hash FROM fast_lane_shadow_base_binding WHERE network='devnet'" evidence/binding.json
          query_d1 "SELECT COUNT(*) AS overlay_rows,COALESCE(SUM(LENGTH(projection_json)),0) AS overlay_payload_bytes FROM current_state_overlay_objects WHERE network='devnet'" evidence/overlay.json
          query_d1 "SELECT COUNT(*) AS stale_rows FROM current_state_overlay_objects WHERE network='devnet' AND NOT (epoch_id='devnet-3371675' AND base_snapshot_id='devnet-3800885-eaa0d29666e7')" evidence/stale.json
          query_d1 "SELECT COUNT(*) AS state_rows,MAX(overlay_ledger_index) AS overlay_ledger_index FROM current_state_overlay_state WHERE network='devnet'" evidence/state.json
          query_d1 "SELECT COUNT(*) AS compact_rows,MIN(source_ledger_index) AS compact_min_ledger,MAX(source_ledger_index) AS compact_max_ledger FROM fast_lane_shadow_objects_compact WHERE network='devnet'" evidence/compact.json
          query_d1 "SELECT COUNT(*) AS foldable_rows FROM fast_lane_shadow_objects_compact AS fast WHERE fast.network='devnet' AND EXISTS (SELECT 1 FROM current_state_overlay_objects AS overlay JOIN fast_lane_shadow_base_binding AS binding ON binding.network='devnet' WHERE overlay.network='devnet' AND overlay.epoch_id=binding.base_epoch_id AND overlay.base_snapshot_id=binding.base_snapshot_id AND overlay.object_type=fast.object_type AND overlay.object_id=fast.object_id AND (overlay.source_ledger_index>fast.source_ledger_index OR (overlay.source_ledger_index=fast.source_ledger_index AND overlay.source_transaction_index>=fast.source_transaction_index)))" evidence/foldable.json
          query_d1 "SELECT last_processed_ledger,latest_observed_ledger,(latest_observed_ledger-last_processed_ledger) AS lag_ledgers,last_processed_hash,latest_observed_hash FROM fast_lane_shadow_state WHERE network='devnet'" evidence/fast-state.json
          query_d1 "SELECT run_at,status,start_ledger_index,end_ledger_index,latest_observed_ledger,lag_ledgers,error_message FROM fast_lane_shadow_run_metrics WHERE network='devnet' ORDER BY run_at DESC LIMIT 16" evidence/runs.json

          SLOTS_SQL=$(cat <<'SQL'
          WITH base AS (
            SELECT run_at,status,end_ledger_index,latest_observed_ledger,lag_ledgers,error_message,
                   CAST(strftime('%s',run_at)/300 AS INTEGER) AS slot_id
            FROM fast_lane_shadow_run_metrics
            WHERE network='devnet' AND run_at >= '2026-07-21T00:15:00.000Z'
          ), ranked AS (
            SELECT *,ROW_NUMBER() OVER(PARTITION BY slot_id ORDER BY run_at DESC) AS rn,
                   COUNT(*) OVER(PARTITION BY slot_id) AS runs_in_slot,
                   SUM(CASE WHEN status='error' OR error_message IS NOT NULL THEN 1 ELSE 0 END) OVER(PARTITION BY slot_id) AS errors_in_slot
            FROM base
          )
          SELECT slot_id,run_at,status,end_ledger_index,latest_observed_ledger,lag_ledgers,error_message,runs_in_slot,errors_in_slot
          FROM ranked WHERE rn=1 ORDER BY slot_id DESC LIMIT 12
          SQL
          )
          query_d1 "$SLOTS_SQL" evidence/slots.json

          jq -n \
            --argjson databaseBytes "$(jq -r '.result.file_size' evidence/database.json)" \
            --slurpfile schedules evidence/schedules.json \
            --slurpfile binding evidence/binding.json \
            --slurpfile overlay evidence/overlay.json \
            --slurpfile stale evidence/stale.json \
            --slurpfile state evidence/state.json \
            --slurpfile compact evidence/compact.json \
            --slurpfile foldable evidence/foldable.json \
            --slurpfile fastState evidence/fast-state.json \
            --slurpfile runs evidence/runs.json \
            --slurpfile slots evidence/slots.json \
            '{databaseBytes:$databaseBytes,schedules:$schedules[0].result.schedules,binding:$binding[0].result[0].results[0],overlay:$overlay[0].result[0].results[0],stale:$stale[0].result[0].results[0],state:$state[0].result[0].results[0],compact:$compact[0].result[0].results[0],foldable:$foldable[0].result[0].results[0],fastState:$fastState[0].result[0].results[0],latestRuns:$runs[0].result[0].results,latestSlots:($slots[0].result[0].results|reverse)}' > evidence/summary.json

      - name: Report
        if: always()
        shell: bash
        run: |
          test -s evidence/summary.json || echo '{"passed":false}' > evidence/summary.json
          { echo 'Current recovery state:'; echo; echo '```json'; cat evidence/summary.json; echo '```'; } > evidence/comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body-file evidence/comment.md
