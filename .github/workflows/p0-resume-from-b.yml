name: P0 resume from verified candidate B

on:
  push:
    branches: [main]
    paths:
      - .github/p0-resume-from-b-trigger

permissions:
  actions: write
  contents: write

concurrency:
  group: p0-resume-from-b
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCTION_BASE: https://xrpl-lending-monitor.badjoke-lab.workers.dev
    steps:
      - name: Resume bounded recovery and cut over
        shell: bash
        run: |
          set -euo pipefail
          ROOT=p0-resume-from-b
          mkdir -p "$ROOT"
          : > "$ROOT/cycles.ndjson"

          repo_json() {
            local branch="$1" path="$2" out="$3"
            for i in $(seq 1 60); do
              if gh api --method GET "repos/${GITHUB_REPOSITORY}/contents/${path}" -f ref="$branch" --jq .content 2>/dev/null \
                | tr -d '\n' | base64 --decode > "$out"; then
                test -s "$out" && return 0
              fi
              sleep 10
            done
            return 1
          }

          ledger_rpc() {
            local index="$1" out="$2"
            jq -n --arg index "$index" '{method:"ledger",params:[{ledger_index:($index|if test("^[0-9]+$") then tonumber else . end),transactions:false,expand:false}]}' > "$ROOT/request.json"
            curl --fail-with-body --silent --show-error --retry 3 -H 'content-type: application/json' \
              --data @"$ROOT/request.json" https://devnet.honeycluster.io/ > "$out"
          }

          validate_pair() {
            local hbranch="$1" cbranch="$2" prefix="$3"
            repo_json "$hbranch" history/publication.json "$ROOT/${prefix}-publication.json"
            repo_json "$cbranch" read-model/manifest.json "$ROOT/${prefix}-manifest.json"
            local ledger hash cledger chash
            ledger="$(jq -r .endLedgerIndex "$ROOT/${prefix}-publication.json")"
            hash="$(jq -r .endLedgerHash "$ROOT/${prefix}-publication.json")"
            cledger="$(jq -r .ledgerIndex "$ROOT/${prefix}-manifest.json")"
            chash="$(jq -r .ledgerHash "$ROOT/${prefix}-manifest.json")"
            test "$(jq -r .complete "$ROOT/${prefix}-publication.json")" = true
            test "$(jq -r .complete "$ROOT/${prefix}-manifest.json")" = true
            test "$ledger" = "$cledger"
            test "$hash" = "$chash"
            ledger_rpc "$ledger" "$ROOT/${prefix}-ledger.json"
            test "$hash" = "$(jq -r '.result.ledger_hash // .result.ledger.ledger_hash' "$ROOT/${prefix}-ledger.json")"
            printf '%s\t%s\n' "$ledger" "$hash"
          }

          workflow_ids() {
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/$1/runs?event=workflow_dispatch&per_page=100" --jq '.workflow_runs[].id'
          }

          dispatch_candidate() {
            local sh="$1" sc="$2" oh="$3" oc="$4" prefix="$5"
            workflow_ids rolling-checkpoint-candidate.yml > "$ROOT/${prefix}-before.txt"
            jq -n --arg ref main --arg sh "$sh" --arg sc "$sc" --arg oh "$oh" --arg oc "$oc" \
              '{ref:$ref,inputs:{source_history_branch:$sh,source_current_state_branch:$sc,history_candidate_branch:$oh,current_state_candidate_branch:$oc,max_delta_ledgers:"5000",segment_ledgers:"500",read_window_size:"4"}}' \
              > "$ROOT/${prefix}-dispatch.json"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/rolling-checkpoint-candidate.yml/dispatches" \
              --input "$ROOT/${prefix}-dispatch.json"
            local run_id=''
            for i in $(seq 1 90); do
              gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/rolling-checkpoint-candidate.yml/runs?event=workflow_dispatch&per_page=100" \
                > "$ROOT/${prefix}-runs.json"
              while read -r id; do
                if ! grep -Fxq "$id" "$ROOT/${prefix}-before.txt"; then run_id="$id"; break; fi
              done < <(jq -r '.workflow_runs | sort_by(.created_at) | reverse | .[].id' "$ROOT/${prefix}-runs.json")
              test -n "$run_id" && break
              sleep 10
            done
            test -n "$run_id"
            for i in $(seq 1 960); do
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" > "$ROOT/${prefix}-run.json"
              test "$(jq -r .status "$ROOT/${prefix}-run.json")" = completed && break
              sleep 15
            done
            test "$(jq -r .status "$ROOT/${prefix}-run.json")" = completed
            printf '%s\n' "$run_id"
          }

          SOURCE_HISTORY=history-p0-recovery-b-data
          SOURCE_CURRENT=current-state-p0-recovery-b-data
          OUTPUT_HISTORY=history-p0-recovery-a-data
          OUTPUT_CURRENT=current-state-p0-recovery-a-data

          IFS=$'\t' read -r SOURCE_LEDGER SOURCE_HASH < <(validate_pair "$SOURCE_HISTORY" "$SOURCE_CURRENT" source)

          for cycle in $(seq 1 6); do
            ledger_rpc validated "$ROOT/live-before.json"
            LIVE="$(jq -r '.result.ledger_index // .result.ledger.ledger_index' "$ROOT/live-before.json")"
            LAG=$((LIVE - SOURCE_LEDGER)); test "$LAG" -ge 0 || LAG=0
            test "$LAG" -le 300 && break

            RUN_ID="$(dispatch_candidate "$SOURCE_HISTORY" "$SOURCE_CURRENT" "$OUTPUT_HISTORY" "$OUTPUT_CURRENT" "cycle-${cycle}")"
            IFS=$'\t' read -r NEXT_LEDGER NEXT_HASH < <(validate_pair "$OUTPUT_HISTORY" "$OUTPUT_CURRENT" "cycle-${cycle}-output")
            test "$NEXT_LEDGER" -gt "$SOURCE_LEDGER"
            test "$NEXT_LEDGER" -le $((SOURCE_LEDGER + 5000))
            ledger_rpc validated "$ROOT/live-after.json"
            LIVE_AFTER="$(jq -r '.result.ledger_index // .result.ledger.ledger_index' "$ROOT/live-after.json")"
            LAG_AFTER=$((LIVE_AFTER - NEXT_LEDGER)); test "$LAG_AFTER" -ge 0 || LAG_AFTER=0
            jq -n --argjson cycle "$cycle" --argjson runId "$RUN_ID" --arg sh "$SOURCE_HISTORY" --arg sc "$SOURCE_CURRENT" \
              --arg oh "$OUTPUT_HISTORY" --arg oc "$OUTPUT_CURRENT" --argjson source "$SOURCE_LEDGER" --argjson output "$NEXT_LEDGER" \
              --arg hash "$NEXT_HASH" --argjson live "$LIVE_AFTER" --argjson lag "$LAG_AFTER" \
              '{cycle:$cycle,childRunId:$runId,source:{historyBranch:$sh,currentBranch:$sc,ledgerIndex:$source},output:{historyBranch:$oh,currentBranch:$oc,ledgerIndex:$output,ledgerHash:$hash},liveLedger:$live,remainingLagLedgers:$lag}' \
              >> "$ROOT/cycles.ndjson"

            SOURCE_HISTORY="$OUTPUT_HISTORY"; SOURCE_CURRENT="$OUTPUT_CURRENT"
            SOURCE_LEDGER="$NEXT_LEDGER"; SOURCE_HASH="$NEXT_HASH"
            if [ "$OUTPUT_HISTORY" = history-p0-recovery-a-data ]; then
              OUTPUT_HISTORY=history-p0-recovery-b-data; OUTPUT_CURRENT=current-state-p0-recovery-b-data
            else
              OUTPUT_HISTORY=history-p0-recovery-a-data; OUTPUT_CURRENT=current-state-p0-recovery-a-data
            fi
            test "$LAG_AFTER" -le 300 && break
          done

          ledger_rpc validated "$ROOT/live-final.json"
          LIVE_FINAL="$(jq -r '.result.ledger_index // .result.ledger.ledger_index' "$ROOT/live-final.json")"
          FINAL_LAG=$((LIVE_FINAL - SOURCE_LEDGER)); test "$FINAL_LAG" -ge 0 || FINAL_LAG=0
          test "$FINAL_LAG" -le 300

          workflow_ids rolling-checkpoint-live-cutover.yml > "$ROOT/cutover-before.txt"
          jq -n --arg ref main --arg h "$SOURCE_HISTORY" --arg c "$SOURCE_CURRENT" \
            '{ref:$ref,inputs:{history_candidate_branch:$h,current_state_candidate_branch:$c,confirm_production_write:"true"}}' \
            > "$ROOT/cutover-dispatch.json"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/rolling-checkpoint-live-cutover.yml/dispatches" \
            --input "$ROOT/cutover-dispatch.json"
          CUTOVER_ID=''
          for i in $(seq 1 90); do
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/rolling-checkpoint-live-cutover.yml/runs?event=workflow_dispatch&per_page=100" > "$ROOT/cutover-runs.json"
            while read -r id; do
              if ! grep -Fxq "$id" "$ROOT/cutover-before.txt"; then CUTOVER_ID="$id"; break; fi
            done < <(jq -r '.workflow_runs | sort_by(.created_at) | reverse | .[].id' "$ROOT/cutover-runs.json")
            test -n "$CUTOVER_ID" && break
            sleep 10
          done
          test -n "$CUTOVER_ID"
          for i in $(seq 1 480); do
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CUTOVER_ID}" > "$ROOT/cutover-run.json"
            test "$(jq -r .status "$ROOT/cutover-run.json")" = completed && break
            sleep 15
          done
          test "$(jq -r .conclusion "$ROOT/cutover-run.json")" = success

          VERIFIED=false
          for i in $(seq 1 90); do
            curl --silent --show-error --retry 1 "$PRODUCTION_BASE/api/overview" > "$ROOT/overview.json" || true
            curl --silent --show-error --retry 1 "$PRODUCTION_BASE/api/activity?limit=25" > "$ROOT/activity.json" || true
            OBSERVED="$(jq -r '[.snapshot.ledger_index,.snapshot.ledgerIndex,.current_state_watermark.ledger_index,.current_state_watermark.ledgerIndex,.data.snapshot.ledger_index,.data.snapshot.ledgerIndex] | map(select(. != null)) | max // 0' "$ROOT/overview.json" 2>/dev/null || echo 0)"
            if [ "$OBSERVED" -ge "$SOURCE_LEDGER" ] && jq -e '(.events // .items // .data.events // .data.items) | type == "array"' "$ROOT/activity.json" >/dev/null 2>&1; then VERIFIED=true; break; fi
            sleep 5
          done
          test "$VERIFIED" = true

          jq -n --argjson target "$SOURCE_LEDGER" --arg hash "$SOURCE_HASH" --argjson live "$LIVE_FINAL" --argjson lag "$FINAL_LAG" \
            --argjson cutover "$CUTOVER_ID" --slurpfile overview "$ROOT/overview.json" --slurpfile activity "$ROOT/activity.json" \
            '{passed:true,targetLedger:$target,targetHash:$hash,liveLedgerAtCutover:$live,remainingLagLedgers:$lag,cutoverRunId:$cutover,overview:$overview[0],activity:$activity[0]}' \
            > "$ROOT/status.json"

          CONTENT="$(base64 -w0 "$ROOT/status.json")"
          API="repos/${GITHUB_REPOSITORY}/contents/.github/p0-resume-from-b-status.json"
          for i in $(seq 1 10); do
            SHA="$(gh api "$API" --jq .sha 2>/dev/null || true)"
            if [ -n "$SHA" ]; then
              gh api --method PUT "$API" -f message='Update P0 resume-from-B status' -f content="$CONTENT" -f sha="$SHA" >/dev/null && exit 0
            else
              gh api --method PUT "$API" -f message='Create P0 resume-from-B status' -f content="$CONTENT" >/dev/null && exit 0
            fi
            sleep 2
          done
          exit 1
