name: Four-hour history maintenance

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/four-hour-history-maintenance-trigger

permissions:
  actions: write
  contents: write

concurrency:
  group: four-hour-history-maintenance
  cancel-in-progress: true

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      SOURCE_HISTORY: history-data
      SOURCE_CURRENT: current-state-data
      CANDIDATE_A_HISTORY: history-four-hour-a-data
      CANDIDATE_A_CURRENT: current-state-four-hour-a-data
      CANDIDATE_B_HISTORY: history-four-hour-b-data
      CANDIDATE_B_CURRENT: current-state-four-hour-b-data
      MAX_DELTA_LEDGERS: '5000'
      TARGET_MAX_LAG_LEDGERS: '720'
      MAX_CYCLES: '8'
      PRODUCTION_BASE: https://xrpl-lending-monitor.badjoke-lab.workers.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
    steps:
      - uses: actions/checkout@v4

      - name: Advance aligned history and current state
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT=four-hour-history-maintenance
          STATUS_PATH=.github/four-hour-history-maintenance-status.json
          PHASE=initialize
          mkdir -p "$ROOT"
          : > "$ROOT/cycles.ndjson"

          publish_status() {
            local state="$1" phase="$2" message="${3:-}"
            local now source_ledger source_hash current_ledger current_hash
            now="$(date -u +%FT%TZ)"
            source_ledger="$(jq -r '.endLedgerIndex // null' "$ROOT/source-publication.json" 2>/dev/null || echo null)"
            source_hash="$(jq -r '.endLedgerHash // ""' "$ROOT/source-publication.json" 2>/dev/null || true)"
            current_ledger="$(jq -r '.ledgerIndex // null' "$ROOT/source-current.json" 2>/dev/null || echo null)"
            current_hash="$(jq -r '.ledgerHash // ""' "$ROOT/source-current.json" 2>/dev/null || true)"
            jq -n \
              --arg state "$state" --arg phase "$phase" --arg message "$message" \
              --arg checkedAt "$now" --arg runId "${GITHUB_RUN_ID}" --arg runAttempt "${GITHUB_RUN_ATTEMPT}" \
              --arg commit "${GITHUB_SHA}" --argjson sourceLedger "${source_ledger:-null}" \
              --arg sourceHash "$source_hash" --argjson currentLedger "${current_ledger:-null}" \
              --arg currentHash "$current_hash" \
              '{state:$state,phase:$phase,message:$message,checkedAt:$checkedAt,runId:$runId,runAttempt:$runAttempt,commit:$commit,source:{historyLedger:$sourceLedger,historyHash:$sourceHash,currentLedger:$currentLedger,currentHash:$currentHash},collectorCadence:"five_minutes",historyCadence:"four_hours"}' \
              > "$ROOT/status.json"
            if test -s "$ROOT/summary.json"; then
              jq -s '.[0] + {summary:.[1]}' "$ROOT/status.json" "$ROOT/summary.json" > "$ROOT/status-next.json"
              mv "$ROOT/status-next.json" "$ROOT/status.json"
            fi
            local api encoded sha
            api="repos/${REPOSITORY}/contents/${STATUS_PATH}"
            encoded="$(base64 -w0 "$ROOT/status.json")"
            for attempt in 1 2 3 4 5; do
              sha="$(gh api "$api" --jq .sha 2>/dev/null || true)"
              if test -n "$sha"; then
                if gh api --method PUT "$api" -f message="ops: record four-hour maintenance ${state}" -f content="$encoded" -f sha="$sha" -f branch=main >/dev/null; then
                  return 0
                fi
              else
                if gh api --method PUT "$api" -f message="ops: record four-hour maintenance ${state}" -f content="$encoded" -f branch=main >/dev/null; then
                  return 0
                fi
              fi
              sleep $((attempt * 2))
            done
            return 1
          }

          finish() {
            local code=$?
            trap - EXIT
            set +e
            if test "$code" -eq 0; then
              publish_status passed complete "history/current-state maintenance completed"
            else
              publish_status failed "$PHASE" "maintenance exited with code ${code}"
            fi
            exit "$code"
          }
          trap finish EXIT
          publish_status running "$PHASE" "maintenance started"

          PHASE=validate_boundary
          jq -e '
            .triggers.crons == ["*/5 * * * *"]
            and .vars.APP_NETWORK == "devnet"
            and .vars.MAINNET_ENABLED == "false"
            and (.queues.producers | length) == 1
            and (.queues.consumers | length) == 1
            and .queues.consumers[0].max_batch_size == 1
            and .queues.consumers[0].max_concurrency == 1
          ' wrangler.jsonc > /dev/null

          fetch_json() {
            local branch="$1" path="$2" output="$3"
            gh api --method GET "repos/${REPOSITORY}/contents/${path}" -f ref="$branch" --jq '.content' \
              | tr -d '\n' | base64 --decode > "$output"
            jq -e . "$output" > /dev/null
          }

          live_head() {
            local request endpoint response head attempt
            request="$ROOT/live-head-request.json"
            jq -n '{method:"ledger",params:[{ledger_index:"validated",transactions:false,expand:false}]}' > "$request"
            attempt=0
            for endpoint in 'https://devnet.honeycluster.io/' 'https://s.devnet.rippletest.net:51234/'; do
              attempt=$((attempt + 1))
              response="$ROOT/live-head-response-${attempt}.json"
              if curl --fail-with-body --silent --show-error --retry 4 --retry-all-errors \
                --connect-timeout 10 --max-time 45 \
                -H 'content-type: application/json' --data-binary @"$request" \
                "$endpoint" > "$response"; then
                head="$(jq -r '.result.ledger_index // .result.ledger.ledger_index // empty' "$response")"
                if printf '%s' "$head" | grep -Eq '^[0-9]+$'; then
                  printf '%s\n' "$head"
                  return 0
                fi
              fi
            done
            return 1
          }

          wait_new_run() {
            local workflow="$1" before="$2" output="$3" run_id=''
            for _ in $(seq 1 90); do
              gh api "repos/${REPOSITORY}/actions/workflows/${workflow}/runs?event=workflow_dispatch&per_page=100" > "$ROOT/runs-after.json"
              while IFS= read -r candidate; do
                if ! grep -Fxq "$candidate" "$before"; then run_id="$candidate"; break; fi
              done < <(jq -r '.workflow_runs | sort_by(.created_at) | reverse | .[].id' "$ROOT/runs-after.json")
              test -n "$run_id" && break
              sleep 10
            done
            test -n "$run_id"
            printf '%s\n' "$run_id" | tee "$output"
          }

          wait_success() {
            local run_id="$1" output="$2"
            for _ in $(seq 1 720); do
              gh api "repos/${REPOSITORY}/actions/runs/${run_id}" > "$output"
              test "$(jq -r '.status' "$output")" = completed && break
              sleep 30
            done
            test "$(jq -r '.status' "$output")" = completed
            test "$(jq -r '.conclusion' "$output")" = success
          }

          capture_d1_usage() {
            local output="$1" today query
            today="$(date -u +%F)"
            query='query D1Usage($accountTag:string!,$start:Date,$end:Date,$databaseId:string){viewer{accounts(filter:{accountTag:$accountTag}){d1AnalyticsAdaptiveGroups(limit:10000,filter:{date_geq:$start,date_leq:$end,databaseId:$databaseId}){sum{rowsRead rowsWritten}}}}}'
            jq -n --arg query "$query" --arg accountTag "$CLOUDFLARE_ACCOUNT_ID" \
              --arg start "$today" --arg end "$today" --arg databaseId "$D1_DATABASE_ID" \
              '{query:$query,variables:{accountTag:$accountTag,start:$start,end:$end,databaseId:$databaseId}}' \
              | curl --fail-with-body --silent --show-error -X POST \
                  -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'content-type: application/json' \
                  --data-binary @- https://api.cloudflare.com/client/v4/graphql \
              | jq '{date:"'"$today"'",rowsRead:([.data.viewer.accounts[0].d1AnalyticsAdaptiveGroups[].sum.rowsRead // 0]|add//0),rowsWritten:([.data.viewer.accounts[0].d1AnalyticsAdaptiveGroups[].sum.rowsWritten // 0]|add//0),errors:(.errors//[])}' \
              > "$output"
          }

          capture_d1_usage "$ROOT/d1-start.json" || echo '{"unavailable":true}' > "$ROOT/d1-start.json"
          source_history="$SOURCE_HISTORY"
          source_current="$SOURCE_CURRENT"
          final_history="$SOURCE_HISTORY"
          final_current="$SOURCE_CURRENT"
          target_lag=999999999

          for cycle in $(seq 1 "$MAX_CYCLES"); do
            PHASE="candidate_cycle_${cycle}_prepare"
            fetch_json "$source_history" history/publication.json "$ROOT/source-publication.json"
            fetch_json "$source_current" read-model/manifest.json "$ROOT/source-current.json"
            source_ledger="$(jq -r '.endLedgerIndex' "$ROOT/source-publication.json")"
            source_hash="$(jq -r '.endLedgerHash' "$ROOT/source-publication.json")"
            test "$(jq -r '.complete' "$ROOT/source-publication.json")" = true
            test "$(jq -r '.complete' "$ROOT/source-current.json")" = true
            test "$source_ledger" = "$(jq -r '.ledgerIndex' "$ROOT/source-current.json")"
            test "$source_hash" = "$(jq -r '.ledgerHash' "$ROOT/source-current.json")"

            PHASE="candidate_cycle_${cycle}_live_head"
            head="$(live_head)"
            target_lag=$((head - source_ledger))
            test "$target_lag" -ge 0
            if test "$target_lag" -le "$TARGET_MAX_LAG_LEDGERS"; then
              final_history="$source_history"
              final_current="$source_current"
              break
            fi

            if test $((cycle % 2)) -eq 1; then
              output_history="$CANDIDATE_A_HISTORY"
              output_current="$CANDIDATE_A_CURRENT"
            else
              output_history="$CANDIDATE_B_HISTORY"
              output_current="$CANDIDATE_B_CURRENT"
            fi
            test "$output_history" != "$source_history"
            test "$output_current" != "$source_current"

            PHASE="candidate_cycle_${cycle}_run"
            gh api "repos/${REPOSITORY}/actions/workflows/rolling-checkpoint-candidate.yml/runs?event=workflow_dispatch&per_page=100" \
              --jq '.workflow_runs[].id' > "$ROOT/candidate-before.txt"
            jq -n --arg ref main \
              --arg sourceHistory "$source_history" --arg sourceCurrent "$source_current" \
              --arg outputHistory "$output_history" --arg outputCurrent "$output_current" \
              --arg maxDelta "$MAX_DELTA_LEDGERS" \
              '{ref:$ref,inputs:{source_history_branch:$sourceHistory,source_current_state_branch:$sourceCurrent,history_candidate_branch:$outputHistory,current_state_candidate_branch:$outputCurrent,max_delta_ledgers:$maxDelta,segment_ledgers:"500",read_window_size:"4"}}' \
              > "$ROOT/candidate-dispatch.json"
            gh api --method POST "repos/${REPOSITORY}/actions/workflows/rolling-checkpoint-candidate.yml/dispatches" \
              --input "$ROOT/candidate-dispatch.json"
            run_id="$(wait_new_run rolling-checkpoint-candidate.yml "$ROOT/candidate-before.txt" "$ROOT/candidate-run-id.txt")"
            wait_success "$run_id" "$ROOT/candidate-run.json"

            PHASE="candidate_cycle_${cycle}_verify"
            fetch_json "$output_history" history/publication.json "$ROOT/output-publication.json"
            fetch_json "$output_current" read-model/manifest.json "$ROOT/output-current.json"
            output_ledger="$(jq -r '.endLedgerIndex' "$ROOT/output-publication.json")"
            output_hash="$(jq -r '.endLedgerHash' "$ROOT/output-publication.json")"
            test "$output_ledger" -gt "$source_ledger"
            test "$output_ledger" -le $((source_ledger + MAX_DELTA_LEDGERS))
            test "$output_ledger" = "$(jq -r '.ledgerIndex' "$ROOT/output-current.json")"
            test "$output_hash" = "$(jq -r '.ledgerHash' "$ROOT/output-current.json")"

            head="$(live_head)"
            target_lag=$((head - output_ledger))
            jq -n --argjson cycle "$cycle" --argjson runId "$run_id" \
              --argjson sourceLedger "$source_ledger" --argjson outputLedger "$output_ledger" \
              --argjson lag "$target_lag" \
              '{cycle:$cycle,candidateRunId:$runId,sourceLedger:$sourceLedger,outputLedger:$outputLedger,lagLedgers:$lag}' \
              >> "$ROOT/cycles.ndjson"
            jq -s '{cycles:.}' "$ROOT/cycles.ndjson" > "$ROOT/summary.json"
            publish_status running "$PHASE" "candidate cycle ${cycle} completed"

            source_history="$output_history"
            source_current="$output_current"
            final_history="$output_history"
            final_current="$output_current"
          done

          test "$target_lag" -le "$TARGET_MAX_LAG_LEDGERS"

          if test "$final_history" != "$SOURCE_HISTORY" || test "$final_current" != "$SOURCE_CURRENT"; then
            PHASE=cutover
            gh api "repos/${REPOSITORY}/actions/workflows/rolling-checkpoint-live-cutover.yml/runs?event=workflow_dispatch&per_page=100" \
              --jq '.workflow_runs[].id' > "$ROOT/cutover-before.txt"
            jq -n --arg ref main --arg history "$final_history" --arg current "$final_current" \
              '{ref:$ref,inputs:{history_candidate_branch:$history,current_state_candidate_branch:$current,confirm_production_write:true}}' \
              > "$ROOT/cutover-dispatch.json"
            gh api --method POST "repos/${REPOSITORY}/actions/workflows/rolling-checkpoint-live-cutover.yml/dispatches" \
              --input "$ROOT/cutover-dispatch.json"
            cutover_id="$(wait_new_run rolling-checkpoint-live-cutover.yml "$ROOT/cutover-before.txt" "$ROOT/cutover-run-id.txt")"
            wait_success "$cutover_id" "$ROOT/cutover-run.json"
          fi

          PHASE=verify_production
          fetch_json "$SOURCE_HISTORY" history/publication.json "$ROOT/production-publication.json"
          fetch_json "$SOURCE_CURRENT" read-model/manifest.json "$ROOT/production-current.json"
          production_ledger="$(jq -r '.endLedgerIndex' "$ROOT/production-publication.json")"
          production_hash="$(jq -r '.endLedgerHash' "$ROOT/production-publication.json")"
          test "$production_ledger" = "$(jq -r '.ledgerIndex' "$ROOT/production-current.json")"
          test "$production_hash" = "$(jq -r '.ledgerHash' "$ROOT/production-current.json")"
          head="$(live_head)"
          final_lag=$((head - production_ledger))
          test "$final_lag" -le "$TARGET_MAX_LAG_LEDGERS"

          overview_http="$(curl --silent --show-error --retry 3 -o "$ROOT/overview.json" -w '%{http_code}' "$PRODUCTION_BASE/api/overview")"
          diff_http="$(curl --silent --show-error --retry 3 -o "$ROOT/diff.json" -w '%{http_code}' "$PRODUCTION_BASE/api/status/fast-lane-diff?limit=500")"
          test "$overview_http" = 200
          test "$diff_http" = 200
          jq -e '.status == "ok" and .passed == true' "$ROOT/diff.json" > /dev/null
          capture_d1_usage "$ROOT/d1-end.json" || echo '{"unavailable":true}' > "$ROOT/d1-end.json"

          jq -n --arg checkedAt "$(date -u +%FT%TZ)" --argjson ledger "$production_ledger" \
            --arg hash "$production_hash" --argjson lag "$final_lag" \
            --slurpfile cycles "$ROOT/cycles.ndjson" --slurpfile d1Start "$ROOT/d1-start.json" --slurpfile d1End "$ROOT/d1-end.json" \
            '{checkedAt:$checkedAt,passed:true,production:{ledgerIndex:$ledger,ledgerHash:$hash,lagLedgers:$lag},cycles:$cycles,d1:{start:$d1Start[0],end:$d1End[0]},cadence:"four_hours",collectorCadence:"five_minutes"}' \
            > "$ROOT/summary.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: four-hour-history-maintenance
          path: four-hour-history-maintenance
          if-no-files-found: warn
          retention-days: 30