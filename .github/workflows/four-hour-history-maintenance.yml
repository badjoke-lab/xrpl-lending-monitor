name: Inspect candidate workflow startup

on:
  push:
    branches: [main]
    paths:
      - .github/four-hour-history-maintenance-trigger

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_RUN_ID: '29847182175'
    steps:
      - name: Read run metadata
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}" > run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}/jobs?filter=all&per_page=100" > jobs.json
          jq -n --slurpfile run run.json --slurpfile jobs jobs.json '{run:$run[0],jobs:$jobs[0]}' > result.json
          API="repos/${GITHUB_REPOSITORY}/contents/.github/candidate-run-metadata.json"
          CONTENT="$(base64 -w0 result.json)"
          SHA="$(gh api "$API" --jq .sha 2>/dev/null || true)"
          if test -n "$SHA"; then
            gh api --method PUT "$API" -f message='ops: record candidate run metadata' -f content="$CONTENT" -f sha="$SHA" -f branch=main >/dev/null
          else
            gh api --method PUT "$API" -f message='ops: record candidate run metadata' -f content="$CONTENT" -f branch=main >/dev/null
          fi