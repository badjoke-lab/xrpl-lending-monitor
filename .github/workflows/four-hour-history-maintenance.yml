name: Four-hour history maintenance

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/four-hour-history-maintenance-trigger

permissions:
  actions: write
  contents: write

concurrency:
  group: four-hour-history-maintenance
  cancel-in-progress: true

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate maintenance scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n .github/scripts/run-four-hour-history-maintenance.sh
          bash -n .github/scripts/run-rolling-checkpoint-candidate.sh
          jq -e '.triggers.crons == ["*/5 * * * *"] and .vars.APP_NETWORK == "devnet" and .vars.MAINNET_ENABLED == "false"' wrangler.jsonc >/dev/null

      - name: Run four-hour maintenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/run-four-hour-history-maintenance.sh

      - name: Upload maintenance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: four-hour-history-maintenance
          path: .local/four-hour-history-maintenance
          if-no-files-found: warn
          retention-days: 30