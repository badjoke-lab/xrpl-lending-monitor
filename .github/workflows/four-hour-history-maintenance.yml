name: Four-hour current-state checkpoint

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/four-hour-history-maintenance-trigger

permissions:
  actions: write
  contents: write

concurrency:
  group: four-hour-current-state-checkpoint
  cancel-in-progress: true

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: badjoke-lab/xrpl-lending-monitor
      CANDIDATE_A: current-state-four-hour-a-data
      CANDIDATE_B: current-state-four-hour-b-data
      PRODUCTION_CURRENT: current-state-data
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate five-minute production boundary
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .triggers.crons == ["*/5 * * * *"]
            and .vars.APP_NETWORK == "devnet"
            and .vars.MAINNET_ENABLED == "false"
            and (.queues.producers | length) == 1
            and (.queues.consumers | length) == 1
            and .queues.consumers[0].max_batch_size == 1
            and .queues.consumers[0].max_concurrency == 1
          ' wrangler.jsonc >/dev/null
          node --check scripts/build-overlay-current-state-checkpoint.mjs
          bash -n scripts/run-current-state-checkpoint-cutover.sh
          bash -n scripts/run-four-hour-current-state-checkpoint.sh

      - name: Build and cut over the newest current-state checkpoint
        shell: bash
        run: bash scripts/run-four-hour-current-state-checkpoint.sh

      - name: Upload four-hour current-state checkpoint evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: four-hour-current-state-checkpoint
          path: current-state-checkpoint-evidence
          if-no-files-found: warn
          retention-days: 30
