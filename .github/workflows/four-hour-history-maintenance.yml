name: Historical backfill recovery (manual only)

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: historical-backfill-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate guarded recovery boundary
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.triggers.crons == ["*/5 * * * *"] and .vars.APP_NETWORK == "devnet" and .vars.MAINNET_ENABLED == "false"' wrangler.jsonc >/dev/null
          python3 .github/scripts/persist-resilient-history-transport.py
          python3 .github/scripts/persist-candidate-ledger-rpc-fallback.py
          bash -n .github/scripts/run-four-hour-history-maintenance.sh
          bash -n .github/scripts/run-rolling-checkpoint-candidate.sh

      - name: Run guarded historical recovery
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/run-four-hour-history-maintenance.sh

      - name: Upload recovery evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: historical-backfill-recovery
          path: .local/four-hour-history-maintenance
          if-no-files-found: warn
          retention-days: 30
