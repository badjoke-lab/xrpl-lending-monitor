name: R4F G3 Dual Provider Verdict

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: r4f-g3-dual-provider-verdict
  cancel-in-progress: false

env:
  QUALIFICATION_ISSUE: '1261'
  PROJECT_IDENTITY_DIGEST: 81378864f4d6650a60a2c09a95629a18780d49fc23836e0f6a024b70f13f88a8

jobs:
  finalize:
    if: >-
      github.event.issue.number == 1261 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      startsWith(github.event.comment.body, '/r4f-g3-finalize ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      FINALIZE_BODY: ${{ github.event.comment.body }}
    steps:
      - name: Check out current main read-only
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify formal dual-verdict runner contract
        shell: bash
        run: |
          set -euo pipefail
          runner='scripts/run-r4f-g3-dual-provider-verdict.sh'
          test -s "$runner"
          for required in \
            'verify-r4f-g3-after-sequence.mjs' \
            'assemble-r4f-g3-provider-capture.mjs' \
            'verify-r4f-revision4-provider-capture.mjs' \
            'verify-r4f-g3-provider-capture-independent.mjs' \
            'compare-r4f-g3-provider-verdicts.mjs' \
            'profileSelected: false' \
            'r5Authorized: false' \
            'mainnetDisabled: true'; do
            grep -Fq "$required" "$runner"
          done

      - name: Run formal production plus independent G3 verdict
        shell: bash
        run: bash scripts/run-r4f-g3-dual-provider-verdict.sh

      - name: Require exact dual qualification contract
        if: always()
        shell: bash
        run: |
          if test -s r4f-g3-formal-verdict/dual-verdict.json; then
            test "$(jq -r '.agreement' r4f-g3-formal-verdict/dual-verdict.json)" = 'true'
            test "$(jq -r '.productionQualified' r4f-g3-formal-verdict/dual-verdict.json)" = 'true'
            test "$(jq -r '.independentQualified' r4f-g3-formal-verdict/dual-verdict.json)" = 'true'
            test "$(jq -r '.dualQualified' r4f-g3-formal-verdict/dual-verdict.json)" = 'true'
          fi

      - name: Upload complete formal dual-verdict evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r4f-g3-formal-dual-verdict
          path: r4f-g3-formal-verdict
          if-no-files-found: warn
          retention-days: 14
