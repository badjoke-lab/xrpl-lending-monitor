name: Capture checkpoint failure tail 20260725

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/xrpl-lending-recovery-trigger-pr
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: capture-checkpoint-failure-tail-20260725
  cancel-in-progress: true

jobs:
  capture:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      JOB_ID: '89652303548'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Capture exact failure tail and bounded source
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/jobs/${JOB_ID}/logs" > checkpoint-job.log
          tail -n 260 checkpoint-job.log > four-hour-checkpoint-failure-tail-20260725.log
          grep -Ein 'error|fail|exception|fatal|killed|heap|ENOMEM|ENOSPC|SQLITE|timeout|exit code' checkpoint-job.log \
            | tail -n 120 > four-hour-checkpoint-failure-errors-20260725.txt || true
          test -s four-hour-checkpoint-failure-tail-20260725.log
          tar --exclude=.git --exclude=node_modules --exclude=dist --exclude=.local \
            -czf xrpl-lending-source-20260725.tar.gz \
            scripts src tests package.json pnpm-lock.yaml vitest.config.* .github/workflows/repair-and-stage-qualification-995-v4.yml 2>/dev/null || \
          tar --exclude=.git --exclude=node_modules --exclude=dist --exclude=.local \
            -czf xrpl-lending-source-20260725.tar.gz \
            scripts src package.json pnpm-lock.yaml .github/workflows/repair-and-stage-qualification-995-v4.yml

      - name: Upload exact failure evidence
        uses: actions/upload-artifact@v4
        with:
          name: four-hour-checkpoint-failure-20260725
          path: |
            four-hour-checkpoint-failure-tail-20260725.log
            four-hour-checkpoint-failure-errors-20260725.txt
            xrpl-lending-source-20260725.tar.gz
          if-no-files-found: error
          retention-days: 30
