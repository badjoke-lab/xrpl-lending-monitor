name: P0 Actions status

on:
  issues:
    types: [opened]

permissions:
  actions: read
  issues: write

jobs:
  status:
    if: startsWith(github.event.issue.title, 'P0 Actions status')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${REPOSITORY}/actions/runs?per_page=30" \
            --jq '{runs: [.workflow_runs[] | {id, name, event, display_title, status, conclusion, head_sha, created_at, updated_at, html_url}]}' \
            > /tmp/runs.json
          {
            echo 'Recent workflow runs:'
            echo
            echo '```json'
            jq . /tmp/runs.json
            echo '```'
          } > /tmp/comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body-file /tmp/comment.md
