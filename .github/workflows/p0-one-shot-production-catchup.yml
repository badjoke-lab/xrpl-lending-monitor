name: P0 one-shot production catch-up

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p0-one-shot-production-catchup.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: production-five-minute-fast-lane
  cancel-in-progress: false

jobs:
  catch-up:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_ID: bebc2c68-03d2-4a1c-98a7-46b34ee4e25d
      FAST_LANE_PASSES_PER_RUN: '64'
      GH_TOKEN: ${{ github.token }}
      STATUS_ISSUE: '978'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Bundle production collector
        run: pnpm exec vite build --config vite.fast-lane-production.config.ts

      - name: Catch up production fast lane
        id: recovery
        shell: bash
        run: |
          set -uo pipefail
          : > /tmp/catchup.log

          query_state() {
            jq -n --arg sql "SELECT epoch_id,last_processed_ledger,last_processed_hash,latest_observed_ledger,latest_observed_hash,status,(latest_observed_ledger-last_processed_ledger) AS lag_ledgers FROM fast_lane_shadow_state WHERE network='devnet'" '{sql:$sql}' \
              | curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
                  -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  -H 'Content-Type: application/json' \
                  --data-binary @- \
                  "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query" \
              | jq -c '.result[0].results[0]'
          }

          before="$(query_state)"
          printf 'before=%s\n' "$before" | tee -a /tmp/catchup.log

          for round in $(seq 1 12); do
            lag="$(query_state | jq -r '.lag_ledgers')"
            if [ "$lag" = 0 ]; then
              echo "lag reached zero before round ${round}" | tee -a /tmp/catchup.log
              break
            fi

            echo "=== round ${round}/12 lag=${lag} ===" | tee -a /tmp/catchup.log
            set +e
            node .fast-lane-production-build/run-fast-lane-production.mjs \
              >> /tmp/catchup.log 2>&1
            rc=$?
            set -e
            echo "round ${round} exit=${rc}" | tee -a /tmp/catchup.log
            query_state | tee -a /tmp/catchup.log
            sleep 2
          done

          after="$(query_state)"
          printf 'after=%s\n' "$after" | tee -a /tmp/catchup.log
          jq -n \
            --arg checkedAt "$(date -u +%FT%TZ)" \
            --argjson before "$before" \
            --argjson after "$after" \
            --arg logTail "$(tail -n 120 /tmp/catchup.log)" \
            '{checkedAt:$checkedAt,before:$before,after:$after,passed:($after.lag_ledgers==0 and $after.status=="healthy"),logTail:$logTail}' \
            > /tmp/catchup-summary.json
          test "$(jq -r '.passed' /tmp/catchup-summary.json)" = true

      - name: Publish authoritative recovery result
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          if [ ! -s /tmp/catchup-summary.json ]; then
            jq -n --arg checkedAt "$(date -u +%FT%TZ)" --arg logTail "$(tail -n 120 /tmp/catchup.log 2>/dev/null || true)" '{checkedAt:$checkedAt,passed:false,logTail:$logTail}' > /tmp/catchup-summary.json
          fi
          {
            echo '# Production recovery status'
            echo
            echo 'Authoritative D1 state from the one-shot production catch-up.'
            echo
            echo '```json'
            cat /tmp/catchup-summary.json
            echo '```'
          } > /tmp/issue.md
          gh issue edit "$STATUS_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/issue.md

      - name: Remove one-shot workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          path='.github/workflows/p0-one-shot-production-catchup.yml'
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}" --jq .sha)"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/contents/${path}" \
            -f message='ops: remove completed one-shot production catch-up' \
            -f sha="$sha" \
            -f branch=main >/dev/null
