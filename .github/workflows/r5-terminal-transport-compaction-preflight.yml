name: R5 terminal transport compaction preflight

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: r5-terminal-transport-compaction-preflight
  cancel-in-progress: false

env:
  QUALIFICATION_ISSUE: '1261'
  PREFLIGHT_PATH: scripts/r5-terminal-transport-compaction-readonly-preflight.mjs
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
  GH_TOKEN: ${{ github.token }}

jobs:
  probe:
    if: >-
      github.event.issue.number == 1261 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      github.event.comment.body == '/r5-terminal-transport-compaction-preflight'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Read terminal transport physical shape only
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r5-terminal-transport-compaction-preflight-evidence
          source_commit="$(git rev-parse HEAD)"
          script_sha="$(sha256sum "$PREFLIGHT_PATH" | awk '{print $1}')"
          node "$PREFLIGHT_PATH" \
            --source-commit "$source_commit" \
            --output r5-terminal-transport-compaction-preflight-evidence/preflight.json \
            > r5-terminal-transport-compaction-preflight-evidence/preflight.stdout.json
          file=r5-terminal-transport-compaction-preflight-evidence/preflight.json
          test "$(jq -r '.safety.readOnly' "$file")" = true
          test "$(jq -r '.safety.rowMutationAuthorized' "$file")" = false
          test "$(jq -r '.safety.schemaMutationAuthorized' "$file")" = false
          test "$(jq -r '.safety.physicalCompactionAuthorized' "$file")" = false
          test "$(jq -r '.safety.vacuumAuthorized' "$file")" = false
          test "$(jq -r '.safety.reindexAuthorized' "$file")" = false
          test "$(jq -r '.safety.clusterAuthorized' "$file")" = false
          test "$(jq -r '.safety.schedulerMutationAuthorized' "$file")" = false
          test "$(jq -r '.safety.deploymentAuthorized' "$file")" = false
          test "$(jq -r '.safety.publicReaderMutationAuthorized' "$file")" = false
          test "$(jq -r '.safety.mainnetDisabled' "$file")" = true
          test "$(jq -r '.safety.r5RearmAuthorized' "$file")" = false
          test "$(jq -r '.activeRun.status' "$file")" = halted
          test "$(jq -r '.activeRun.lastError' "$file")" = r5_recovery_database_halt
          test "$(jq -r '.checkpoint.archiveFailCloseMarker' "$file")" = true
          test "$(jq -r '.checkpoint.archiveTableMarker' "$file")" = true
          test "$(jq -r '.archiveRows' "$file")" -ge 1500
          printf 'source_commit=%s\nscript_sha=%s\nstructural_sha=%s\ndatabase_bytes=%s\narchive_rows=%s\nmessage_rows=%s\nsuccessor_rows=%s\nmessage_total=%s\nsuccessor_total=%s\nmessage_dead=%s\nsuccessor_dead=%s\nconstraints=%s\ninbound_fks=%s\nindexes=%s\ntriggers=%s\npolicies=%s\nviews=%s\n' \
            "$source_commit" "$script_sha" "$(jq -r '.structuralStateSha256' "$file")" \
            "$(jq -r '.databaseBytes' "$file")" "$(jq -r '.archiveRows' "$file")" \
            "$(jq -r '.messages.rows' "$file")" "$(jq -r '.successors.rows' "$file")" \
            "$(jq -r '.messages.totalBytes' "$file")" "$(jq -r '.successors.totalBytes' "$file")" \
            "$(jq -r '.messages.stats.dead // 0' "$file")" "$(jq -r '.successors.stats.dead // 0' "$file")" \
            "$(jq -r '.constraints | length' "$file")" "$(jq -r '.inboundForeignKeys | length' "$file")" \
            "$(jq -r '.indexes | length' "$file")" "$(jq -r '.userTriggers | length' "$file")" \
            "$(jq -r '.policies | length' "$file")" "$(jq -r '.dependentViews | length' "$file")" >> "$GITHUB_OUTPUT"

      - name: Publish sanitized Phase C preflight result
        env:
          SOURCE_COMMIT: ${{ steps.probe.outputs.source_commit }}
          SCRIPT_SHA: ${{ steps.probe.outputs.script_sha }}
          STRUCTURAL_SHA: ${{ steps.probe.outputs.structural_sha }}
          DATABASE_BYTES: ${{ steps.probe.outputs.database_bytes }}
          ARCHIVE_ROWS: ${{ steps.probe.outputs.archive_rows }}
          MESSAGE_ROWS: ${{ steps.probe.outputs.message_rows }}
          SUCCESSOR_ROWS: ${{ steps.probe.outputs.successor_rows }}
          MESSAGE_TOTAL: ${{ steps.probe.outputs.message_total }}
          SUCCESSOR_TOTAL: ${{ steps.probe.outputs.successor_total }}
          MESSAGE_DEAD: ${{ steps.probe.outputs.message_dead }}
          SUCCESSOR_DEAD: ${{ steps.probe.outputs.successor_dead }}
          CONSTRAINTS: ${{ steps.probe.outputs.constraints }}
          INBOUND_FKS: ${{ steps.probe.outputs.inbound_fks }}
          INDEXES: ${{ steps.probe.outputs.indexes }}
          TRIGGERS: ${{ steps.probe.outputs.triggers }}
          POLICIES: ${{ steps.probe.outputs.policies }}
          VIEWS: ${{ steps.probe.outputs.views }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/result.md <<EOF2
          ## R5 terminal transport Phase C physical-compaction preflight — READ ONLY

          - run: \`${GITHUB_RUN_ID}\`
          - source main: \`${SOURCE_COMMIT}\`
          - preflight script SHA-256: \`${SCRIPT_SHA}\`
          - structural state SHA-256: \`${STRUCTURAL_SHA}\`
          - database bytes: \`${DATABASE_BYTES}\`
          - archive rows: \`${ARCHIVE_ROWS}\`
          - live message / successor rows: \`${MESSAGE_ROWS} / ${SUCCESSOR_ROWS}\`
          - message / successor relation bytes: \`${MESSAGE_TOTAL} / ${SUCCESSOR_TOTAL}\`
          - estimated dead tuples: \`${MESSAGE_DEAD} / ${SUCCESSOR_DEAD}\`
          - constraints / inbound FKs / indexes: \`${CONSTRAINTS} / ${INBOUND_FKS} / ${INDEXES}\`
          - user triggers / RLS policies / dependent views: \`${TRIGGERS} / ${POLICIES} / ${VIEWS}\`

          Safety: Management API \`read_only:true\` SELECT only. No row/schema mutation, physical compaction, VACUUM, REINDEX, CLUSTER, scheduler/deployment/public-reader/Mainnet mutation, stabilization, soak, or R5 rearm is authorized.
          EOF2
          gh issue comment "$QUALIFICATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/result.md

      - name: Upload sanitized Phase C preflight evidence
        if: always() && steps.probe.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: r5-terminal-transport-compaction-preflight-evidence
          path: r5-terminal-transport-compaction-preflight-evidence
          if-no-files-found: error
          retention-days: 14
