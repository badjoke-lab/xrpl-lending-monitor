name: P0 rolling recovery repair status

on:
  issues:
    types: [opened]

permissions:
  actions: read
  issues: write

jobs:
  status:
    if: startsWith(github.event.issue.title, 'P0 rolling recovery repair status')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Report failed repair log tail
        shell: bash
        run: |
          set -euo pipefail
          gh run view 29685452599 --repo "${REPOSITORY}" --log-failed > /tmp/failed.log || true
          {
            echo 'Failed repair log tail:'
            echo '```text'
            tail -n 120 /tmp/failed.log
            echo '```'
          } > /tmp/comment.md
          gh issue comment "${ISSUE_NUMBER}" --repo "${REPOSITORY}" --body-file /tmp/comment.md
