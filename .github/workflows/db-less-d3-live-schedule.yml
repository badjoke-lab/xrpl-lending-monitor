name: DB-less D3 five-minute schedule driver

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      continue_chain:
        description: Continue the self-sustaining five-minute driver chain
        required: false
        default: false
        type: boolean
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read

jobs:
  dispatch-live:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 1736 &&
        github.event.comment.user.login == github.repository_owner &&
        (
          github.event.comment.body == '/d3-schedule-driver-once' ||
          github.event.comment.body == '/d3-schedule-chain-start'
        )
      )
    concurrency:
      group: db-less-d3-live-schedule-driver
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      CHANNEL_RELEASE_TAG: db-less-live-channel-candidate-v1
    steps:
      - name: Verify candidate channel is initialized
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$CHANNEL_RELEASE_TAG")"
          test "$(jq -r '.draft' <<<"$release_json")" = "false"
          test "$(jq -r '.prerelease' <<<"$release_json")" = "true"
          test "$(jq -r '.body | fromjson | .live != null' <<<"$release_json")" = "true"

      - name: Dispatch bounded live collector cadence
        shell: bash
        env:
          CONTINUE_CHAIN: ${{ github.event.inputs.continue_chain || 'false' }}
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
        run: |
          set -euo pipefail
          mkdir -p .local/d3-driver

          # GitHub dispatch can return HTTP 500 even when the event was
          # accepted. Retry boundedly; concurrency on the writer prevents
          # overlapping mutation. Do not silently terminate a cadence.
          dispatch_workflow() {
            local target="$1"
            shift
            local attempt
            for attempt in 1 2 3 4; do
              if gh workflow run "$target" --repo "$GITHUB_REPOSITORY" --ref main "$@"; then
                return 0
              fi
              if [ "$attempt" -eq 4 ]; then
                echo "::error::D3 workflow dispatch failed four times: $target"
                return 1
              fi
              sleep $((3 * attempt))
            done
          }

          chain_mode=false
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            chain_mode=true
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$CONTINUE_CHAIN" = "true" ]; then
            chain_mode=true
          elif [ "$GITHUB_EVENT_NAME" = "issue_comment" ] && [ "$COMMENT_BODY" = "/d3-schedule-chain-start" ]; then
            chain_mode=true
          fi

          if [ "$chain_mode" != "true" ]; then
            dispatch_workflow db-less-d3-live-once.yml
            echo "Dispatched one diagnostic live collector run."
            exit 0
          fi

          dispatch_workflow db-less-d3-live-schedule.yml -f continue_chain=true
          echo "Prequeued successor five-minute driver run."

          for slot in 1 2 3 4 5 6; do
            # A GitHub 500 can leave a one-shot with zero jobs stuck
            # 'queued' forever. Never let it suppress every later slot.
            # A genuinely executing worker or a recent queued worker still
            # blocks, protecting the single-writer invariant.
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow db-less-d3-live-once.yml \
              --limit 30 \
              --json status,createdAt \
              > .local/d3-driver/live-runs.json
            node scripts/db-less-d3-dispatch-policy.mjs \
              .local/d3-driver/live-runs.json \
              > .local/d3-driver/gate.json
            active="$(jq -er '.blockers' .local/d3-driver/gate.json)"
            orphaned="$(jq -er '.staleQueued' .local/d3-driver/gate.json)"
            if [ "$orphaned" -gt 0 ]; then
              echo "::warning::D3 has $orphaned orphan queued/pending dispatches. Re-dispatching without overriding a live writer."
            fi

            if [ "$active" -eq 0 ]; then
              if dispatch_workflow db-less-d3-live-once.yml; then
                echo "Dispatched five-minute slot $slot."
              else
                echo "::warning::D3 dispatch failed in slot $slot; next bounded slot will retry."
              fi
            else
              echo "Skipped slot $slot because $active collector dispatches are live or recently queued."
            fi

            if [ "$slot" -lt 6 ]; then
              sleep 300
            fi
          done

