name: DB-less D3 five-minute schedule driver

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      continue_chain:
        description: Continue the self-sustaining five-minute driver chain
        required: false
        default: false
        type: boolean
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read

jobs:
  dispatch-live:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 1673 &&
        github.event.comment.user.login == github.repository_owner &&
        github.event.comment.body == '/d3-schedule-driver-once'
      )
    concurrency:
      group: db-less-d3-live-schedule-driver
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      CHANNEL_RELEASE_TAG: db-less-live-channel-candidate-v1
    steps:
      - name: Verify candidate channel is initialized
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$CHANNEL_RELEASE_TAG")"
          test "$(jq -r '.draft' <<<"$release_json")" = "false"
          test "$(jq -r '.prerelease' <<<"$release_json")" = "true"
          test "$(jq -r '.body | fromjson | .live != null' <<<"$release_json")" = "true"

      - name: Dispatch bounded live collector cadence
        shell: bash
        env:
          CONTINUE_CHAIN: ${{ github.event.inputs.continue_chain || 'false' }}
        run: |
          set -euo pipefail

          chain_mode=false
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            chain_mode=true
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$CONTINUE_CHAIN" = "true" ]; then
            chain_mode=true
          fi

          if [ "$chain_mode" != "true" ]; then
            gh workflow run db-less-d3-live-once.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo "Dispatched one diagnostic live collector run."
            exit 0
          fi

          for slot in 1 2 3 4 5 6; do
            active="$(
              gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow db-less-d3-live-once.yml \
                --limit 20 \
                --json status \
                --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "pending" or .status == "waiting" or .status == "requested")] | length'
            )"

            if [ "$active" -eq 0 ]; then
              gh workflow run db-less-d3-live-once.yml --repo "$GITHUB_REPOSITORY" --ref main
              echo "Dispatched five-minute slot $slot."
            else
              echo "Skipped slot $slot because a live collector run is already active."
            fi

            if [ "$slot" -lt 6 ]; then
              sleep 300
            fi
          done

          gh workflow run db-less-d3-live-schedule.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f continue_chain=true
          echo "Queued successor five-minute driver run."
