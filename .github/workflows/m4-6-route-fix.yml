name: M4-6 route fix

on:
  push:
    branches:
      - ui/project-documentation-pages

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/project-documentation-pages
      - name: Patch exact API documentation routes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/worker/index.ts')
          text = path.read_text()
          old = """app.get(['/api', '/api/'], (context) => {
            return context.env.ASSETS.fetch(new URL('/', context.req.url).toString())
          })
          """
          new = """function serveApiDocumentation(context: Context<{ Bindings: Bindings }>) {
            const assetUrl = new URL('/', context.req.url)
            return context.env.ASSETS.fetch(new Request(assetUrl.toString()))
          }

          app.get('/api', serveApiDocumentation)
          app.get('/api/', serveApiDocumentation)
          """
          if old not in text:
              raise SystemExit('target block not found')
          path.write_text(text.replace(old, new))
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/m4-6-route-fix.yml
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/worker/index.ts .github/workflows/m4-6-route-fix.yml
          git commit -m "Fix API documentation asset routing types"
          git push origin HEAD:ui/project-documentation-pages
