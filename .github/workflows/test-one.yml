name: Test one
on:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run src/worker/bootstrap/d1-local-integration.test.ts --reporter=json --outputFile=result.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: result.json
