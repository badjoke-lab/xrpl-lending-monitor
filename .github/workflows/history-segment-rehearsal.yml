name: History segment rehearsal

on:
  pull_request:
    branches: [runner1]
    paths: [.github/workflows/history-segment-rehearsal.yml]

permissions:
  contents: read

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:history-segment
      - name: Generate first fixed range
        shell: bash
        run: |
          set -o pipefail
          mkdir -p rehearsal
          node .history-segment-build/run-history-segment.mjs \
            --local \
            --start-ledger 3389181 \
            --end-ledger 3389185 \
            --epoch-id devnet-3371675 \
            --segment-id rehearsal-3389181-3389185 \
            --source-revision "$GITHUB_SHA" \
            --output-dir rehearsal/a \
            > rehearsal/a-manifest.stdout.json \
            2> rehearsal/a-error.log
      - name: Generate second fixed range
        shell: bash
        run: |
          set -o pipefail
          node .history-segment-build/run-history-segment.mjs \
            --local \
            --start-ledger 3389181 \
            --end-ledger 3389185 \
            --epoch-id devnet-3371675 \
            --segment-id rehearsal-3389181-3389185 \
            --source-revision "$GITHUB_SHA" \
            --output-dir rehearsal/b \
            > rehearsal/b-manifest.stdout.json \
            2> rehearsal/b-error.log
      - name: Verify byte-identical replay
        shell: bash
        run: |
          set -euo pipefail
          find rehearsal/a -type f -printf '%f\n' | sort > rehearsal/a-files.txt
          find rehearsal/b -type f -printf '%f\n' | sort > rehearsal/b-files.txt
          cmp rehearsal/a-files.txt rehearsal/b-files.txt
          while IFS= read -r NAME; do
            cmp "rehearsal/a/$NAME" "rehearsal/b/$NAME"
          done < rehearsal/a-files.txt
          cmp rehearsal/a-manifest.stdout.json rehearsal/b-manifest.stdout.json
          sha256sum rehearsal/a/* | sort -k2 > rehearsal/digests.txt
          cat rehearsal/a/manifest.json
          cat rehearsal/digests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: history-segment-rehearsal
          path: rehearsal
          if-no-files-found: error
          retention-days: 14
