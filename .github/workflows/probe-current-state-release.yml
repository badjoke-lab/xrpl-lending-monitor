name: Probe current-state release

on:
  push:
    branches:
      - main
    paths:
      - .github/current-state-probe-trigger

permissions:
  contents: write

concurrency:
  group: current-state-release-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build materializer
        run: |
          pnpm build:release-current-state
          TARGET=.release-current-state-build/run-release-current-state.mjs
          COUNT=$(grep -o "result.validated !== true" "$TARGET" | wc -l)
          if [ "$COUNT" -ne 1 ]; then
            echo "Expected one validated guard, found $COUNT" >&2
            exit 1
          fi
          sed -i 's/result\.validated !== true/result.validated === false/' "$TARGET"

      - name: Run probe
        id: probe
        run: |
          mkdir -p .local/current-state-probe
          set +e
          node .release-current-state-build/run-release-current-state.mjs \
            --local \
            --release-tag probe-${GITHUB_RUN_ID} \
            --page-limit 2 \
            --object-limit-per-page 2048 \
            --data-segments 20 \
            --index-buckets 64 \
            --output-dir .local/current-state-probe \
            > .local/current-state-probe/stdout.log \
            2> .local/current-state-probe/stderr.log
          STATUS=$?
          cat .local/current-state-probe/stderr.log
          cat .local/current-state-probe/stdout.log
          exit "$STATUS"

      - name: Report probe status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          SUMMARY=.local/current-state-probe/release-summary.json
          STDERR=.local/current-state-probe/stderr.log
          if [ -f "$SUMMARY" ]; then
            COMPLETE=$(jq -r '.complete // false' "$SUMMARY")
            SOURCE_PAGES=$(jq -r '.sourcePages // 0' "$SUMMARY")
            DATA_ASSETS=$(jq -r '.dataAssets // 0' "$SUMMARY")
            INDEX_ASSETS=$(jq -r '.indexAssets // 0' "$SUMMARY")
          else
            COMPLETE=false
            SOURCE_PAGES=0
            DATA_ASSETS=0
            INDEX_ASSETS=0
          fi
          STDERR_TAIL=$(tail -n 30 "$STDERR" 2>/dev/null || true)
          jq -n \
            --arg runId "$GITHUB_RUN_ID" \
            --arg outcome "$PROBE_OUTCOME" \
            --arg complete "$COMPLETE" \
            --arg sourcePages "$SOURCE_PAGES" \
            --arg dataAssets "$DATA_ASSETS" \
            --arg indexAssets "$INDEX_ASSETS" \
            --arg stderrTail "$STDERR_TAIL" \
            '{runId:$runId,outcome:$outcome,complete:($complete=="true"),sourcePages:($sourcePages|tonumber),dataAssets:($dataAssets|tonumber),indexAssets:($indexAssets|tonumber),stderrTail:$stderrTail}' \
            > probe-status.json
          API_PATH="repos/${GITHUB_REPOSITORY}/contents/.github/current-state-probe-status.json"
          CONTENT=$(base64 -w0 probe-status.json)
          EXISTING_SHA=$(gh api "$API_PATH" --jq .sha 2>/dev/null || true)
          if [ -n "$EXISTING_SHA" ]; then
            gh api --method PUT "$API_PATH" -f message="Update current-state probe status" -f content="$CONTENT" -f sha="$EXISTING_SHA" >/dev/null
          else
            gh api --method PUT "$API_PATH" -f message="Create current-state probe status" -f content="$CONTENT" >/dev/null
          fi
