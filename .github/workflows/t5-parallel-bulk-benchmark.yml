name: T5 parallel bulk benchmark

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: history-data
          path: .local/history-source
          sparse-checkout: history/publication.json
          sparse-checkout-cone-mode: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm build:history-extension-plan
          pnpm exec vite build --config vite.history-extension-shards.config.ts
      - name: Freeze 4000-ledger benchmark range
        shell: bash
        run: |
          set -euo pipefail
          ROOT=t5-parallel-bulk-benchmark
          SOURCE=.local/history-source/history/publication.json
          mkdir -p "${ROOT}"
          SOURCE_END="$(jq -r '.endLedgerIndex' "${SOURCE}")"
          TARGET="$((SOURCE_END + 4000))"
          jq -n --argjson ledger_index "${TARGET}" '{method:"ledger",params:[{ledger_index:$ledger_index,transactions:false,expand:false}]}' > "${ROOT}/target-request.json"
          curl --fail-with-body --silent --show-error --retry 3 -H 'Content-Type: application/json' --data @"${ROOT}/target-request.json" https://devnet.honeycluster.io/ > "${ROOT}/target-response.json"
          TARGET_HASH="$(jq -r '.result.ledger_hash // .result.ledger.ledger_hash // empty' "${ROOT}/target-response.json")"
          printf '%s' "${TARGET_HASH}" | grep -Eq '^[A-F0-9]{64}$'
          node .history-extension-plan-build/plan-history-extension.mjs --local --publication "${SOURCE}" --target-ledger "${TARGET}" --target-ledger-hash "${TARGET_HASH}" --segment-ledgers 500 --checkpoint-every-segments 2 --output "${ROOT}/extension-plan.json" > "${ROOT}/extension-plan.stdout.json"
          node .history-extension-shards-build/plan-history-extension-shards.mjs --local --plan "${ROOT}/extension-plan.json" --segments-per-shard 2 --output "${ROOT}/shard-plan.json" > "${ROOT}/shard-plan.stdout.json"
          jq -e '.extension.ledgerCount == 4000 and .extension.segmentCount == 8' "${ROOT}/extension-plan.json" > /dev/null
          jq -e '.shardCount == 4 and ([.shards[].segmentCount] | all(. == 2))' "${ROOT}/shard-plan.json" > /dev/null
      - id: matrix
        run: echo "matrix=$(jq -c '{shard:[.shards[].ordinal]}' t5-parallel-bulk-benchmark/shard-plan.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: t5-parallel-bulk-plan
          path: t5-parallel-bulk-benchmark

  generate:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm build:history-segment
          pnpm build:history-segment-checkpoint
      - uses: actions/download-artifact@v4
        with:
          name: t5-parallel-bulk-plan
          path: .local/plan
      - name: Generate 1000-ledger shard
        shell: bash
        env:
          SHARD_ORDINAL: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          PLAN=.local/plan/extension-plan.json
          SHARDS=.local/plan/shard-plan.json
          SHARD="$(jq -c --argjson ordinal "${SHARD_ORDINAL}" '.shards[] | select(.ordinal == $ordinal)' "${SHARDS}")"
          EPOCH="$(jq -r '.epochId' "${PLAN}")"
          START="$(jq -r '.startLedgerIndex' <<<"${SHARD}")"
          END="$(jq -r '.endLedgerIndex' <<<"${SHARD}")"
          ANCHOR_LEDGER="$(jq -r '.anchorPreviousLedgerIndex' <<<"${SHARD}")"
          ANCHOR_ID="$(jq -r '.anchorPreviousSegmentId' <<<"${SHARD}")"
          ROOT="bulk-shard-${SHARD_ORDINAL}"
          CHECKPOINT="${ROOT}/checkpoint.json"
          mkdir -p "${ROOT}/history/${EPOCH}"
          STARTED="$(date +%s)"

          jq -n --argjson ledger_index "${ANCHOR_LEDGER}" '{method:"ledger",params:[{ledger_index:$ledger_index,transactions:false,expand:false}]}' > "${ROOT}/anchor-request.json"
          curl --fail-with-body --silent --show-error --retry 3 -H 'Content-Type: application/json' --data @"${ROOT}/anchor-request.json" https://devnet.honeycluster.io/ > "${ROOT}/anchor-response.json"
          PREV_HASH="$(jq -r '.result.ledger_hash // .result.ledger.ledger_hash // empty' "${ROOT}/anchor-response.json")"
          PREV_ID="${ANCHOR_ID}"

          while IFS= read -r SEGMENT; do
            ORDINAL="$(jq -r '.ordinal' <<<"${SEGMENT}")"
            SEGMENT_ID="$(jq -r '.segmentId' <<<"${SEGMENT}")"
            SEGMENT_START="$(jq -r '.startLedgerIndex' <<<"${SEGMENT}")"
            SEGMENT_END="$(jq -r '.endLedgerIndex' <<<"${SEGMENT}")"
            OUT="${ROOT}/history/${EPOCH}/${SEGMENT_ID}"
            PASSED=false
            ATTEMPTS=0
            for ATTEMPT in 1 2 3; do
              ATTEMPTS="${ATTEMPT}"
              if node .history-segment-build/run-history-segment.mjs --local --endpoint https://devnet.honeycluster.io/ --timeout-ms 12000 --start-ledger "${SEGMENT_START}" --end-ledger "${SEGMENT_END}" --epoch-id "${EPOCH}" --segment-id "${SEGMENT_ID}" --previous-segment-id "${PREV_ID}" --previous-segment-end-hash "${PREV_HASH}" --source-revision "${GITHUB_SHA}" --output-dir "${OUT}" > "${ROOT}/segment-${ORDINAL}.stdout.json"; then PASSED=true; break; fi
              sleep $((ATTEMPT * 10))
            done
            test "${PASSED}" = true
            node .history-segment-checkpoint-build/update-history-segment-checkpoint.mjs --local --checkpoint "${CHECKPOINT}" --manifest "${OUT}/manifest.json" --epoch-id "${EPOCH}" --range-start-ledger "${START}" --range-end-ledger "${END}" --previous-segment-id "${ANCHOR_ID}" --previous-segment-end-hash "$(jq -r '.result.ledger_hash // .result.ledger.ledger_hash' "${ROOT}/anchor-response.json")" > "${ROOT}/checkpoint-${ORDINAL}.stdout.json"
            PREV_ID="${SEGMENT_ID}"
            PREV_HASH="$(jq -r '.endLedgerHash' "${OUT}/manifest.json")"
            jq -nc --argjson ordinal "${ORDINAL}" --arg segmentId "${SEGMENT_ID}" --argjson attempts "${ATTEMPTS}" --argjson records "$(jq '[.files[].records] | add' "${OUT}/manifest.json")" '{ordinal:$ordinal,segmentId:$segmentId,attempts:$attempts,totalRecords:$records}' >> "${ROOT}/segment-metrics.ndjson"
          done < <(jq -c '.segments[]' <<<"${SHARD}")

          ELAPSED="$(( $(date +%s) - STARTED ))"
          jq -s '.' "${ROOT}/segment-metrics.ndjson" > "${ROOT}/segment-metrics.json"
          jq -n --argjson shardOrdinal "${SHARD_ORDINAL}" --argjson elapsedSeconds "${ELAPSED}" --argjson ledgerCount "$((END - START + 1))" --slurpfile metrics "${ROOT}/segment-metrics.json" '{passed:true,shardOrdinal:$shardOrdinal,elapsedSeconds:$elapsedSeconds,ledgerCount:$ledgerCount,metrics:$metrics[0]}' > "${ROOT}/evidence.json"
      - uses: actions/upload-artifact@v4
        with:
          name: t5-bulk-shard-${{ matrix.shard }}
          path: bulk-shard-${{ matrix.shard }}

  verify:
    needs: [plan, generate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm build:history-extension-artifacts
          pnpm build:history-segment-chain
      - uses: actions/download-artifact@v4
        with:
          name: t5-parallel-bulk-plan
          path: .local/plan
      - uses: actions/download-artifact@v4
        with:
          pattern: t5-bulk-shard-*
          path: .local/shards
          merge-multiple: true
      - name: Verify and summarize benchmark
        shell: bash
        run: |
          set -euo pipefail
          PLAN=.local/plan/extension-plan.json
          EPOCH="$(jq -r '.epochId' "${PLAN}")"
          MANIFEST_ARGS=()
          while IFS= read -r SEGMENT_ID; do
            MANIFEST="$(find .local/shards -path "*/history/${EPOCH}/${SEGMENT_ID}/manifest.json" -print -quit)"
            test -n "${MANIFEST}"
            MANIFEST_ARGS+=(--manifest "${MANIFEST}")
          done < <(jq -r '.extension.segments[].segmentId' "${PLAN}")
          mkdir -p t5-parallel-bulk-benchmark-result
          node .history-extension-artifacts-build/verify-history-extension-artifacts.mjs --local --plan "${PLAN}" "${MANIFEST_ARGS[@]}" > t5-parallel-bulk-benchmark-result/plan-bound-summary.json
          node .history-segment-chain-build/verify-history-segment-chain.mjs --local "${MANIFEST_ARGS[@]}" --epoch-id "${EPOCH}" --start-ledger "$(jq -r '.extension.startLedgerIndex' "${PLAN}")" --start-parent-hash "$(jq -r '.source.endLedgerHash' "${PLAN}")" --previous-segment-id "$(jq -r '.source.lastSegmentId' "${PLAN}")" --previous-segment-end-hash "$(jq -r '.source.endLedgerHash' "${PLAN}")" --end-ledger "$(jq -r '.target.ledgerIndex' "${PLAN}")" --end-ledger-hash "$(jq -r '.target.ledgerHash' "${PLAN}")" > t5-parallel-bulk-benchmark-result/chain-summary.json
          find .local/shards -name evidence.json -path '*bulk-shard-*' -print0 | xargs -0 jq -s 'sort_by(.shardOrdinal)' > t5-parallel-bulk-benchmark-result/shard-evidence.json
          jq -n --slurpfile shards t5-parallel-bulk-benchmark-result/shard-evidence.json --slurpfile chain t5-parallel-bulk-benchmark-result/chain-summary.json '{passed:true,shards:$shards[0],maxShardSeconds:([$shards[0][].elapsedSeconds] | max),totalLedgers:([$shards[0][].ledgerCount] | add),chain:$chain[0]}' > t5-parallel-bulk-benchmark-result/evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: t5-parallel-bulk-benchmark-result
          path: t5-parallel-bulk-benchmark-result
          if-no-files-found: error
