name: Focused test

on:
  pull_request:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run tests
        shell: bash
        run: |
          git clone --depth 1 --branch "$GITHUB_HEAD_REF" "https://github.com/$GITHUB_REPOSITORY.git" repo
          cd repo
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          pnpm install --frozen-lockfile --silent
          pnpm exec vitest run src/worker/core-api-routes.test.ts --reporter=verbose
