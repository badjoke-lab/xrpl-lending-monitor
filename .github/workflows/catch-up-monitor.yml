name: Catch-up runtime monitor

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/catch-up-monitor.yml
      - docs/operations-catch-up-monitor.md

permissions:
  contents: read

concurrency:
  group: catch-up-runtime-monitor
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Resolve deployed Worker URL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-monitor
          curl --fail-with-body --silent --show-error --retry 3 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            > runtime-monitor/subdomain.json

          SUBDOMAIN="$(jq -r '.result.subdomain // empty' runtime-monitor/subdomain.json)"
          test -n "${SUBDOMAIN}"
          BASE="https://xrpl-lending-monitor.${SUBDOMAIN}.workers.dev"
          printf '%s\n' "${BASE}" > runtime-monitor/base-url.txt

      - name: Sample collector progress
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(cat runtime-monitor/base-url.txt)"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            INTERVAL=60
          else
            INTERVAL=300
          fi

          for I in 0 1 2; do
            curl --fail-with-body --silent --show-error --retry 3 \
              "${BASE}/api/status/collector" \
              > "runtime-monitor/collector-${I}.json"
            jq -e '.cursor and .usage and (.consecutive_failures != null)' \
              "runtime-monitor/collector-${I}.json" > /dev/null
            if [ "${I}" -lt 2 ]; then
              sleep "${INTERVAL}"
            fi
          done

      - name: Capture HYB-7, M1, and cutover diagnostics
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(cat runtime-monitor/base-url.txt)"

          curl --fail-with-body --silent --show-error --retry 3 \
            "${BASE}/api/status/continuation-diagnostics" \
            > runtime-monitor/continuation-diagnostics.json
          jq -e '.evidence and .report and .report.paths and .drilldown and .drilldown.linkageGaps and .loanActivity and .balanceSource and .managedTransitions' \
            runtime-monitor/continuation-diagnostics.json > /dev/null
          jq '.report' runtime-monitor/continuation-diagnostics.json \
            > runtime-monitor/continuation-verification.json

          curl --fail-with-body --silent --show-error --retry 3 \
            "${BASE}/api/status/m1-exit-diagnostics" \
            > runtime-monitor/m1-exit-diagnostics.json
          jq -e '.evidence and .report and .report.gates' \
            runtime-monitor/m1-exit-diagnostics.json > /dev/null
          jq '.report' runtime-monitor/m1-exit-diagnostics.json \
            > runtime-monitor/m1-exit.json

          curl --fail-with-body --silent --show-error --retry 3 \
            "${BASE}/api/status/replacement-base-rebase" \
            > runtime-monitor/replacement-base-rebase.json
          jq -e '.status == "replayed" and .target.snapshotId == "devnet-3432924-canonical" and .target.ledgerIndex == 3432924' \
            runtime-monitor/replacement-base-rebase.json > /dev/null

          curl --fail-with-body --silent --show-error --retry 3 \
            "${BASE}/api/status/history-source" \
            > runtime-monitor/history-source.json
          jq -e '.status == "ok" and .mode == "hybrid" and .configured == true and .chain.end_ledger_index == 3432924 and .exact_index.total_records > 0' \
            runtime-monitor/history-source.json > /dev/null

          curl --fail-with-body --silent --show-error --retry 3 \
            "${BASE}/api/overview" \
            > runtime-monitor/overview.json
          grep -q 'devnet-3432924-canonical' runtime-monitor/overview.json

      - name: Build operational summary
        shell: bash
        run: |
          set -euo pipefail
          jq -s '[.[] | {
            status,
            cursor: .cursor.last_processed_ledger,
            head: .cursor.latest_observed_ledger,
            lag: .cursor.lag_ledgers,
            run_duration_ms: .timing.run_duration_ms,
            ledgers_processed: .usage.ledgers_processed,
            rpc_requests: .usage.rpc_requests,
            estimated_rows: .usage.estimated_rows,
            estimated_statements: .usage.estimated_statements,
            overlay_mutations: .usage.overlay_mutations,
            consecutive_failures,
            error
          }]' runtime-monitor/collector-*.json > runtime-monitor/series.json

          jq '{
            first: .[0],
            last: .[-1],
            cursor_delta: (.[-1].cursor - .[0].cursor),
            head_delta: (.[-1].head - .[0].head),
            lag_delta: (.[-1].lag - .[0].lag),
            samples: length,
            samples_with_failures: ([.[] | select(.consecutive_failures > 0 or .error != null)] | length)
          }' runtime-monitor/series.json > runtime-monitor/summary.json

          jq '{
            processed_ledgers: .evidence.processedLedgers,
            object_changes: .evidence.objectChanges,
            overlay_objects: .evidence.overlayObjects,
            protocol_events: .evidence.protocolEvents,
            loan_activity: .loanActivity,
            lifecycle: .evidence.lifecycle,
            managed_transitions: .managedTransitions,
            archives: .evidence.archives,
            balance_source: .balanceSource,
            balance_history: .evidence.balanceHistory,
            drilldown: .drilldown,
            path_states: (.report.paths | with_entries(.value = .value.state)),
            passed: .report.passed
          }' runtime-monitor/continuation-diagnostics.json \
            > runtime-monitor/diagnostic-summary.json

          jq '{
            expected_base: .evidence.expectedBase,
            bound_base: .evidence.boundBase,
            processed_ledgers: .evidence.processedLedgers,
            cursor: .evidence.cursor,
            gate_states: (.report.gates | with_entries(.value = .value.state)),
            ready: .report.ready
          }' runtime-monitor/m1-exit-diagnostics.json \
            > runtime-monitor/m1-exit-summary.json

          jq -n \
            --slurpfile rebase runtime-monitor/replacement-base-rebase.json \
            --slurpfile history runtime-monitor/history-source.json \
            '{
              replacement_rebase_status: $rebase[0].status,
              replacement_snapshot: $rebase[0].target.snapshotId,
              replacement_ledger: $rebase[0].target.ledgerIndex,
              replacement_cursor: $rebase[0].evidence.sync.lastProcessedLedger,
              history_mode: $history[0].mode,
              history_end_ledger: $history[0].chain.end_ledger_index,
              history_segments: $history[0].chain.segment_count,
              exact_index_records: $history[0].exact_index.total_records
            }' > runtime-monitor/cutover-summary.json

          {
            echo '## Catch-up runtime monitor'
            echo
            echo '| Metric | First | Last | Delta |'
            echo '|---|---:|---:|---:|'
            jq -r '"| Cursor | \(.first.cursor) | \(.last.cursor) | \(.cursor_delta) |"' runtime-monitor/summary.json
            jq -r '"| Head | \(.first.head) | \(.last.head) | \(.head_delta) |"' runtime-monitor/summary.json
            jq -r '"| Lag | \(.first.lag) | \(.last.lag) | \(.lag_delta) |"' runtime-monitor/summary.json
            echo
            echo '### Canonical cutover state'
            jq -r '"- Replacement rebase: **\(.replacement_rebase_status)**"' runtime-monitor/cutover-summary.json
            jq -r '"- Replacement snapshot: `\(.replacement_snapshot)` at ledger `\(.replacement_ledger)`"' runtime-monitor/cutover-summary.json
            jq -r '"- Hybrid history: **\(.history_mode)** through ledger `\(.history_end_ledger)` in `\(.history_segments)` segments"' runtime-monitor/cutover-summary.json
            jq -r '"- Exact-index records: `\(.exact_index_records)`"' runtime-monitor/cutover-summary.json
            echo
            echo '### HYB-7 evidence counts'
            echo
            echo '| Evidence | Count |'
            echo '|---|---:|'
            jq -r '"| Processed ledgers | \(.evidence.processedLedgers.count) |"' runtime-monitor/continuation-diagnostics.json
            jq -r '"| Object changes: created | \(.evidence.objectChanges.created) |"' runtime-monitor/continuation-diagnostics.json
            jq -r '"| Object changes: modified | \(.evidence.objectChanges.modified) |"' runtime-monitor/continuation-diagnostics.json
            jq -r '"| Object changes: deleted | \(.evidence.objectChanges.deleted) |"' runtime-monitor/continuation-diagnostics.json
            jq -r '"| Relevant Loan activity | \(.loanActivity.total) |"' runtime-monitor/continuation-diagnostics.json
            jq -r '"| LoanSet events | \(.loanActivity.loanSet) |"' runtime-monitor/continuation-diagnostics.json
            jq -r '"| LoanPay events | \(.loanActivity.loanPay) |"' runtime-monitor/continuation-diagnostics.json
            jq -r '"| LoanManage events | \(.loanActivity.loanManage) |"' runtime-monitor/continuation-diagnostics.json
            jq -r '"| LoanDelete events | \(.loanActivity.loanDelete) |"' runtime-monitor/continuation-diagnostics.json
            jq -r '"| Lifecycle events | \(.evidence.lifecycle.total) |"' runtime-monitor/continuation-diagnostics.json
            jq -r '"| Impair source transitions | \(.managedTransitions.impaired) |"' runtime-monitor/continuation-diagnostics.json
            jq -r '"| Unimpair source transitions | \(.managedTransitions.unimpaired) |"' runtime-monitor/continuation-diagnostics.json
            jq -r '"| Default source transitions | \(.managedTransitions.defaulted) |"' runtime-monitor/continuation-diagnostics.json
            jq -r '"| Balance source changes | \(.balanceSource.sourceChanges) |"' runtime-monitor/continuation-diagnostics.json
            jq -r '"| Balance-history rows | \(.evidence.balanceHistory.total) |"' runtime-monitor/continuation-diagnostics.json
            echo
            echo '### HYB-7 linkage gaps'
            jq -r '.drilldown.linkageGaps | to_entries[] | "- `\(.key)`: **\(.value)**"' runtime-monitor/continuation-diagnostics.json
            echo
            echo '### HYB-7 paths'
            jq -r '.report.paths | to_entries[] | "- `\(.key)`: **\(.value.state)** — \(.value.reason)"' runtime-monitor/continuation-diagnostics.json
            echo
            echo '### M1 exit gates'
            jq -r '.report.gates | to_entries[] | "- `\(.key)`: **\(.value.state)** — \(.value.reason)"' runtime-monitor/m1-exit-diagnostics.json
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Enforce runtime monitor invariants
        shell: bash
        run: |
          set -euo pipefail
          FAILURES="$(jq -r '.samples_with_failures' runtime-monitor/summary.json)"
          FIRST_LAG="$(jq -r '.first.lag' runtime-monitor/summary.json)"
          CURSOR_DELTA="$(jq -r '.cursor_delta' runtime-monitor/summary.json)"

          if [ "${FAILURES}" -gt 0 ]; then
            echo "Collector error or consecutive failure observed in ${FAILURES} sample(s)."
            exit 1
          fi

          if [ "${FIRST_LAG}" -gt 0 ] && [ "${CURSOR_DELTA}" -le 0 ]; then
            echo "Collector cursor did not advance while catch-up lag remained positive."
            exit 1
          fi

          jq -e '.status == "replayed"' runtime-monitor/replacement-base-rebase.json > /dev/null
          jq -e '.mode == "hybrid" and .configured == true and .chain.end_ledger_index == 3432924' runtime-monitor/history-source.json > /dev/null
          grep -q 'devnet-3432924-canonical' runtime-monitor/overview.json

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catch-up-runtime-monitor
          path: runtime-monitor
          if-no-files-found: error
          retention-days: 14
