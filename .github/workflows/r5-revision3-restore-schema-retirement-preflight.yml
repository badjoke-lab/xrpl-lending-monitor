name: R5 revision-3 restore schema retirement preflight

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: r5-revision3-restore-schema-retirement-preflight
  cancel-in-progress: false

env:
  QUALIFICATION_ISSUE: '1261'
  PROBE_PATH: scripts/r5-revision3-restore-schema-retirement-readonly-preflight.mjs
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
  GH_TOKEN: ${{ github.token }}

jobs:
  preflight:
    if: >-
      github.event.issue.number == 1261 &&
      github.event.comment.user.login == 'badjoke-lab' &&
      github.event.comment.body == '/r5-revision3-restore-schema-retirement-preflight'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Inventory exact restore retirement state read-only
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          out=r5-restore-schema-retirement-preflight
          source_commit="$(git rev-parse HEAD)"
          node "$PROBE_PATH" --source-commit "$source_commit" --output-dir "$out" > "$out.stdout.json"
          file="$out/restore-schema-retirement-preflight.json"
          jq -e '.state.safetyBoundary.productionDatabaseReadOnly == true' "$file" >/dev/null
          jq -e '.state.safetyBoundary.measurementOnly == true' "$file" >/dev/null
          jq -e '.state.safetyBoundary.functionDropAuthorized == false' "$file" >/dev/null
          jq -e '.state.safetyBoundary.schemaDropAuthorized == false' "$file" >/dev/null
          jq -e '.state.safetyBoundary.tableDropAuthorized == false' "$file" >/dev/null
          jq -e '.state.safetyBoundary.cascadeAuthorized == false' "$file" >/dev/null
          jq -e '.state.safetyBoundary.rowMutationAuthorized == false' "$file" >/dev/null
          jq -e '.state.safetyBoundary.schedulerMutationAuthorized == false' "$file" >/dev/null
          jq -e '.state.safetyBoundary.deploymentAuthorized == false' "$file" >/dev/null
          jq -e '.state.safetyBoundary.r5RearmAuthorized == false' "$file" >/dev/null
          jq -e '.state.safetyBoundary.mainnetDisabled == true' "$file" >/dev/null
          jq -e '.state.restoreRows.targets == 0 and .state.restoreRows.attemptRows == 0 and .state.restoreRows.accountingRows == 0' "$file" >/dev/null
          jq -e '.state.targetFunctions | length == 5' "$file" >/dev/null
          jq -e '.state.targetFunctions | all(.service_role_execute == false and .authenticated_execute == false and .anon_execute == false)' "$file" >/dev/null
          jq -e '.state.triggerBindings | length == 0' "$file" >/dev/null
          jq -e '.state.referencingViews | length == 0' "$file" >/dev/null
          printf 'source_commit=%s\n' "$source_commit" >> "$GITHUB_OUTPUT"

      - name: Publish read-only preflight result
        if: steps.probe.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          {
            cat r5-restore-schema-retirement-preflight/summary.md
            printf '\nRun: `%s`\n' "$GITHUB_RUN_ID"
          } > /tmp/result.md
          gh issue comment "$QUALIFICATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/result.md

      - name: Upload sanitized preflight evidence
        if: always() && steps.probe.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: r5-revision3-restore-schema-retirement-preflight
          path: r5-restore-schema-retirement-preflight
          if-no-files-found: error
          retention-days: 14
