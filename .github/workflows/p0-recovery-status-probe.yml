name: P0 recovery status probe

on:
  push:
    branches: [main]
    paths:
      - .github/p0-recovery-status-probe-trigger

permissions:
  actions: write
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel obsolete canonical continuation and capture recovery queue
        env:
          GH_TOKEN: ${{ github.token }}
          OBSOLETE_RUN_ID: '29241432797'
        shell: bash
        run: |
          set -euo pipefail
          OBSOLETE_STATUS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${OBSOLETE_RUN_ID}" --jq .status 2>/dev/null || true)"
          if [ "${OBSOLETE_STATUS}" = in_progress ] || [ "${OBSOLETE_STATUS}" = queued ] || [ "${OBSOLETE_STATUS}" = waiting ] || [ "${OBSOLETE_STATUS}" = pending ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${OBSOLETE_RUN_ID}/cancel" || true
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/p0-history-recovery.yml/runs?per_page=50" > recovery-runs.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" > repository-runs.json
          RUN_ID="$(jq -r '.workflow_runs | sort_by(.created_at) | reverse | .[0].id // empty' recovery-runs.json)"
          test -n "${RUN_ID}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" > run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" > jobs.json
          jq -n \
            --arg obsoleteRunId "${OBSOLETE_RUN_ID}" \
            --arg obsoleteStatusBefore "${OBSOLETE_STATUS}" \
            --slurpfile run run.json \
            --slurpfile jobs jobs.json \
            --slurpfile recovery recovery-runs.json \
            --slurpfile repository repository-runs.json \
            '{capturedAt:(now|todateiso8601),obsoleteCanonicalContinuation:{runId:$obsoleteRunId,statusBefore:$obsoleteStatusBefore,cancelRequested:($obsoleteStatusBefore|IN("in_progress","queued","waiting","pending"))},run:{id:$run[0].id,url:$run[0].html_url,event:$run[0].event,headSha:$run[0].head_sha,status:$run[0].status,conclusion:$run[0].conclusion,createdAt:$run[0].created_at,updatedAt:$run[0].updated_at},jobs:[$jobs[0].jobs[] | {id,name,status,conclusion,startedAt:.started_at,completedAt:.completed_at,steps:[.steps[]? | {name,status,conclusion,number}]}],recoveryRuns:[$recovery[0].workflow_runs[]|{id,status,conclusion,event,headSha:.head_sha,createdAt:.created_at,updatedAt:.updated_at,url:.html_url}],activeRepositoryRuns:[$repository[0].workflow_runs[]|select(.status != "completed")|{id,name,status,conclusion,event,headSha:.head_sha,createdAt:.created_at,updatedAt:.updated_at,url:.html_url}]}' \
            > status.json
          API_PATH="repos/${GITHUB_REPOSITORY}/contents/.github/p0-history-recovery-status.json"
          CONTENT="$(base64 -w0 status.json)"
          for attempt in $(seq 1 10); do
            EXISTING_SHA="$(gh api "$API_PATH" --jq .sha 2>/dev/null || true)"
            if [ -n "$EXISTING_SHA" ] && gh api --method PUT "$API_PATH" -f message="Update P0 recovery status" -f content="$CONTENT" -f sha="$EXISTING_SHA" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1
