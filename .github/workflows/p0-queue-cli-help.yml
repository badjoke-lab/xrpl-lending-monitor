name: P0 Queue CLI help

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  help:
    if: startsWith(github.event.issue.title, 'P0 Queue CLI help')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Inspect Queue CLI commands
        shell: bash
        run: |
          set +e
          {
            echo '=== wrangler queues --help ==='
            pnpm exec wrangler queues --help
            echo
            echo '=== wrangler queues message --help ==='
            pnpm exec wrangler queues message --help
            echo
            echo '=== wrangler queues messages --help ==='
            pnpm exec wrangler queues messages --help
            echo
            echo '=== wrangler queues producer --help ==='
            pnpm exec wrangler queues producer --help
          } > /tmp/help.txt 2>&1

      - name: Report Queue CLI help
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'Queue CLI capability probe:'
            echo
            echo '```text'
            cat /tmp/help.txt
            echo '```'
          } > /tmp/comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
