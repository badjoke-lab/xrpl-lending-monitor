name: Diagnose Worker deployments

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-worker-deployments.yml'

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Capture active deployments, versions, and recent Actions runs
        shell: bash
        run: |
          set -euo pipefail
          ROOT=worker-deployments
          mkdir -p "$ROOT"
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/xrpl-lending-monitor"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          for endpoint in settings deployments versions; do
            status="$(curl --silent --show-error "${auth[@]}" -o "$ROOT/$endpoint.json" -w '%{http_code}' "$base/$endpoint" || true)"
            printf '%s\n' "$status" > "$ROOT/$endpoint.status"
          done
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" > "$ROOT/actions-runs.json"
          jq '[.workflow_runs[] | select(.created_at >= "2026-07-12T15:50:00Z") | {id,name,path,event,status,conclusion,head_branch,head_sha,created_at,run_started_at,updated_at}]' "$ROOT/actions-runs.json" > "$ROOT/actions-runs-recent.json"
          jq -n \
            --slurpfile settings "$ROOT/settings.json" \
            --slurpfile deployments "$ROOT/deployments.json" \
            --slurpfile versions "$ROOT/versions.json" \
            --slurpfile runs "$ROOT/actions-runs-recent.json" \
            '{settings:$settings[0],deployments:$deployments[0],versions:$versions[0],recentActionsRuns:$runs[0]}' \
            > "$ROOT/summary.json"
          cat "$ROOT/actions-runs-recent.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worker-deployments
          path: worker-deployments
          if-no-files-found: error
          retention-days: 7
