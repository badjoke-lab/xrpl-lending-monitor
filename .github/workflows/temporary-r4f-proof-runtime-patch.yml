name: Temporary R4F Proof Runtime Patch

on:
  push:
    branches:
      - agent/r4f-proof-edge-runtime-config

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: agent/r4f-proof-edge-runtime-config
      TARGET_PATH: supabase/functions/xrpl-r5-recovery-batch/index.ts
    steps:
      - name: Patch qualification-only runtime override through Contents API
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/contents/${TARGET_PATH}?ref=${TARGET_BRANCH}" > /tmp/file.json
          jq -r '.content' /tmp/file.json | tr -d '\n' | base64 -d > /tmp/index.ts
          sha="$(jq -r '.sha' /tmp/file.json)"
          TARGET=/tmp/index.ts python - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ['TARGET'])
          text = path.read_text()
          marker = '__XRPL_R5_REVISION4_PROOF_RUNTIME_CONFIG__'
          if marker in text:
              print('runtime override already present; no content change required')
              raise SystemExit(0)
          old = '''function selectionDigest(): string {
            const value = env('XRPL_R5_REVISION4_SELECTION_DIGEST')
            if (!/^[a-f0-9]{64}$/u.test(value)) {
              throw new RecoveryError('XRPL_R5_REVISION4_SELECTION_DIGEST is invalid', true)
            }
            return value
          }

          function unexplainedDirectionalReserveBytes(): number {
            const raw = env('XRPL_R5_REVISION4_UNEXPLAINED_EGRESS_RESERVE_BYTES')
            const value = Number(raw)
            if (!Number.isSafeInteger(value) || value < 0) {
              throw new RecoveryError(
                'XRPL_R5_REVISION4_UNEXPLAINED_EGRESS_RESERVE_BYTES is invalid',
                true,
              )
            }
            return value
          }
          '''
          new = '''type Revision4QualificationRuntimeOverride = {
            selectionDigest: string
            unexplainedEgressReserveBytes: number
          }

          function qualificationRuntimeOverride(): Revision4QualificationRuntimeOverride | null {
            const value = (
              globalThis as typeof globalThis & {
                __XRPL_R5_REVISION4_PROOF_RUNTIME_CONFIG__?: unknown
              }
            ).__XRPL_R5_REVISION4_PROOF_RUNTIME_CONFIG__
            if (value === undefined) return null
            if (typeof value !== 'object' || value === null || Array.isArray(value)) {
              throw new RecoveryError('revision-4 qualification runtime override is invalid', true)
            }
            const candidate = value as Record<string, unknown>
            if (Object.keys(candidate).sort().join(',') !== 'selectionDigest,unexplainedEgressReserveBytes') {
              throw new RecoveryError('revision-4 qualification runtime override shape is invalid', true)
            }
            if (
              typeof candidate.selectionDigest !== 'string'
              || !/^[a-f0-9]{64}$/u.test(candidate.selectionDigest)
            ) {
              throw new RecoveryError('revision-4 qualification selection override is invalid', true)
            }
            if (
              typeof candidate.unexplainedEgressReserveBytes !== 'number'
              || !Number.isSafeInteger(candidate.unexplainedEgressReserveBytes)
              || candidate.unexplainedEgressReserveBytes < 0
            ) {
              throw new RecoveryError('revision-4 qualification reserve override is invalid', true)
            }
            return {
              selectionDigest: candidate.selectionDigest,
              unexplainedEgressReserveBytes: candidate.unexplainedEgressReserveBytes,
            }
          }

          function selectionDigest(): string {
            const override = qualificationRuntimeOverride()
            if (override) return override.selectionDigest
            const value = env('XRPL_R5_REVISION4_SELECTION_DIGEST')
            if (!/^[a-f0-9]{64}$/u.test(value)) {
              throw new RecoveryError('XRPL_R5_REVISION4_SELECTION_DIGEST is invalid', true)
            }
            return value
          }

          function unexplainedDirectionalReserveBytes(): number {
            const override = qualificationRuntimeOverride()
            if (override) return override.unexplainedEgressReserveBytes
            const raw = env('XRPL_R5_REVISION4_UNEXPLAINED_EGRESS_RESERVE_BYTES')
            const value = Number(raw)
            if (!Number.isSafeInteger(value) || value < 0) {
              throw new RecoveryError(
                'XRPL_R5_REVISION4_UNEXPLAINED_EGRESS_RESERVE_BYTES is invalid',
                true,
              )
            }
            return value
          }
          '''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exact runtime block once, found {count}')
          path.write_text(text.replace(old, new))
          PY
          if ! grep -Fq '__XRPL_R5_REVISION4_PROOF_RUNTIME_CONFIG__' /tmp/index.ts; then
            echo 'runtime override missing after patch' >&2
            exit 1
          fi
          current="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${TARGET_PATH}?ref=${TARGET_BRANCH}" --jq '.content' | tr -d '\n' | base64 -d)"
          proposed="$(cat /tmp/index.ts)"
          if [ "$current" = "$proposed" ]; then
            echo 'target already patched'
            exit 0
          fi
          base64 -w0 /tmp/index.ts > /tmp/content.b64
          jq -n \
            --arg message 'Support qualification-only proof runtime config' \
            --arg content "$(cat /tmp/content.b64)" \
            --arg sha "$sha" \
            --arg branch "$TARGET_BRANCH" \
            '{message:$message,content:$content,sha:$sha,branch:$branch}' > /tmp/put.json
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/${TARGET_PATH}" --input /tmp/put.json > /tmp/put-result.json
          jq -e '.commit.sha | test("^[a-f0-9]{40}$")' /tmp/put-result.json > /dev/null
