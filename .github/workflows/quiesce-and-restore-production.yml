name: Quiesce and restore production

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/quiesce-and-restore-production.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: production-worker-write
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_BASE: https://xrpl-lending-monitor.badjoke-lab.workers.dev
    steps:
      - name: Check out implementation
        uses: actions/checkout@v4

      - name: Check out production current-state identity
        uses: actions/checkout@v4
        with:
          ref: current-state-data
          path: .local/current-state-data
          sparse-checkout: read-model/manifest.json
          sparse-checkout-cone-mode: false

      - name: Check out production history identity
        uses: actions/checkout@v4
        with:
          ref: history-data
          path: .local/history-data
          sparse-checkout: history/publication.json
          sparse-checkout-cone-mode: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cancel legacy production writers
        shell: bash
        run: |
          set -euo pipefail
          ROOT=quiesce-production
          mkdir -p "${ROOT}"
          : > "${ROOT}/cancelled-runs.ndjson"
          WORKFLOWS=(
            rolling-checkpoint-live-cutover.yml
            rolling-checkpoint-maintenance.yml
            resume-history-recovery-after-fixed-index.yml
            deploy-production-worker.yml
            rolling-checkpoint-promotion.yml
          )

          for workflow in "${WORKFLOWS[@]}"; do
            if ! gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?per_page=100" \
              > "${ROOT}/${workflow}.json" 2> "${ROOT}/${workflow}.stderr"; then
              printf '{"workflow_runs":[]}\n' > "${ROOT}/${workflow}.json"
            fi
            while IFS= read -r run; do
              id="$(jq -r '.id' <<<"${run}")"
              status="$(jq -r '.status' <<<"${run}")"
              name="$(jq -r '.name' <<<"${run}")"
              branch="$(jq -r '.head_branch // ""' <<<"${run}")"
              sha="$(jq -r '.head_sha // ""' <<<"${run}")"
              if [ "${id}" = "${GITHUB_RUN_ID}" ]; then continue; fi
              gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/cancel" \
                > "${ROOT}/cancel-${id}.json" 2> "${ROOT}/cancel-${id}.stderr" || true
              jq -n --argjson id "${id}" --arg workflow "${workflow}" --arg name "${name}" \
                --arg status "${status}" --arg branch "${branch}" --arg sha "${sha}" \
                '{id:$id,workflow:$workflow,name:$name,statusBeforeCancel:$status,headBranch:$branch,headSha:$sha}' \
                >> "${ROOT}/cancelled-runs.ndjson"
            done < <(jq -c '.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending" or .status == "requested")' "${ROOT}/${workflow}.json")
          done

      - name: Require production writers to become quiescent
        shell: bash
        run: |
          set -euo pipefail
          ROOT=quiesce-production
          WORKFLOWS=(
            rolling-checkpoint-live-cutover.yml
            rolling-checkpoint-maintenance.yml
            resume-history-recovery-after-fixed-index.yml
            deploy-production-worker.yml
            rolling-checkpoint-promotion.yml
          )
          : > "${ROOT}/quiescence-attempts.ndjson"
          QUIESCENT=false
          for attempt in $(seq 1 120); do
            ACTIVE=0
            for workflow in "${WORKFLOWS[@]}"; do
              if ! gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?per_page=100" \
                > "${ROOT}/wait-${workflow}.json" 2>/dev/null; then
                printf '{"workflow_runs":[]}\n' > "${ROOT}/wait-${workflow}.json"
              fi
              count="$(jq --argjson current "${GITHUB_RUN_ID}" '[.workflow_runs[] | select(.id != $current) | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending" or .status == "requested")] | length' "${ROOT}/wait-${workflow}.json")"
              ACTIVE="$((ACTIVE + count))"
            done
            jq -n --argjson attempt "${attempt}" --argjson active "${ACTIVE}" \
              '{attempt:$attempt,activeProductionWriters:$active,observedAt:(now|todateiso8601)}' \
              >> "${ROOT}/quiescence-attempts.ndjson"
            if [ "${ACTIVE}" -eq 0 ]; then QUIESCENT=true; break; fi
            sleep 5
          done
          test "${QUIESCENT}" = true

      - name: Build production checkpoint config
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          source = json.loads(Path('wrangler.jsonc').read_text())
          current = json.loads(Path('.local/current-state-data/read-model/manifest.json').read_text())
          history = json.loads(Path('.local/history-data/history/publication.json').read_text())
          assert source['triggers']['crons'] == ['*/5 * * * *']
          assert source['vars']['APP_NETWORK'] == 'devnet'
          assert source['vars']['MAINNET_ENABLED'] == 'false'
          assert current['complete'] is True and history['complete'] is True
          assert current['epochId'] == history['epochId'] == 'devnet-3371675'
          assert current['ledgerIndex'] == history['endLedgerIndex']
          assert current['ledgerHash'] == history['endLedgerHash']

          config = json.loads(json.dumps(source))
          variables = config['vars']
          variables['CURRENT_STATE_REPLACEMENT_GITHUB_BRANCH'] = 'current-state-data'
          variables['CURRENT_STATE_REPLACEMENT_SNAPSHOT_ID'] = current['snapshotId']
          variables['REPLACEMENT_BASE_REBASE_ENABLED'] = 'true'
          variables['REPLACEMENT_BASE_EPOCH_ID'] = current['epochId']
          variables['REPLACEMENT_BASE_SNAPSHOT_ID'] = current['snapshotId']
          variables['REPLACEMENT_BASE_LEDGER_INDEX'] = str(current['ledgerIndex'])
          variables['REPLACEMENT_BASE_LEDGER_HASH'] = current['ledgerHash']
          variables.pop('REPLACEMENT_BASE_CUTOVER_TOKEN', None)
          Path('wrangler.quiescent-production.jsonc').write_text(json.dumps(config, indent=2) + '\n')
          Path('quiesce-production/expected.json').write_text(json.dumps({
              'epochId': current['epochId'],
              'snapshotId': current['snapshotId'],
              'ledgerIndex': current['ledgerIndex'],
              'ledgerHash': current['ledgerHash'],
              'historyPublicationSha256': history['publicationSha256'],
          }, indent=2) + '\n')
          PY
          pnpm build

      - name: Restore and verify production runtime
        shell: bash
        run: |
          set -euo pipefail
          ROOT=quiesce-production
          EXPECTED_EPOCH="$(jq -r '.epochId' "${ROOT}/expected.json")"
          EXPECTED_SNAPSHOT="$(jq -r '.snapshotId' "${ROOT}/expected.json")"
          EXPECTED_LEDGER="$(jq -r '.ledgerIndex' "${ROOT}/expected.json")"
          EXPECTED_HASH="$(jq -r '.ledgerHash' "${ROOT}/expected.json")"
          AUTH=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          REPAIRS=0
          STABLE_STREAK=0
          : > "${ROOT}/stability-observations.ndjson"

          pnpm exec wrangler deploy --config wrangler.quiescent-production.jsonc \
            > "${ROOT}/restore-deploy.log" 2>&1

          for attempt in $(seq 1 40); do
            curl --fail-with-body --silent --show-error "${AUTH[@]}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-monitor/settings" \
              > "${ROOT}/settings.json" || true
            curl --fail-with-body --silent --show-error "${AUTH[@]}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/xrpl-lending-monitor/schedules" \
              > "${ROOT}/schedules.json" || true
            HTTP="$(curl --silent --show-error --retry 1 -o "${ROOT}/rebase.json" -w '%{http_code}' \
              "${PRODUCTION_BASE}/api/status/replacement-base-rebase" || true)"

            HEALTHY=false
            if jq -e --arg epoch "${EXPECTED_EPOCH}" --arg snapshot "${EXPECTED_SNAPSHOT}" --arg ledger "${EXPECTED_LEDGER}" --arg hash "${EXPECTED_HASH}" '
                def binding($name): [.result.bindings[] | select(.name == $name) | (.text // .value)] | first;
                binding("APP_NETWORK") == "devnet"
                and binding("MAINNET_ENABLED") == "false"
                and binding("CURRENT_STATE_REPLACEMENT_SNAPSHOT_ID") == $snapshot
                and binding("REPLACEMENT_BASE_EPOCH_ID") == $epoch
                and binding("REPLACEMENT_BASE_SNAPSHOT_ID") == $snapshot
                and binding("REPLACEMENT_BASE_LEDGER_INDEX") == $ledger
                and binding("REPLACEMENT_BASE_LEDGER_HASH") == $hash
                and ([.result.bindings[] | select(.name == "REPLACEMENT_BASE_CUTOVER_TOKEN")] | length) == 0
              ' "${ROOT}/settings.json" >/dev/null 2>&1 \
              && jq -e '.result.schedules | length == 1 and .[0].cron == "*/5 * * * *"' "${ROOT}/schedules.json" >/dev/null 2>&1 \
              && [ "${HTTP}" = 200 ] \
              && jq -e --arg snapshot "${EXPECTED_SNAPSHOT}" --argjson ledger "${EXPECTED_LEDGER}" --arg hash "${EXPECTED_HASH}" '
                .status == "replayed" and .target.snapshotId == $snapshot and .target.ledgerIndex == $ledger and .target.ledgerHash == $hash
              ' "${ROOT}/rebase.json" >/dev/null 2>&1; then
              HEALTHY=true
              STABLE_STREAK="$((STABLE_STREAK + 1))"
            else
              STABLE_STREAK=0
              REPAIRS="$((REPAIRS + 1))"
              pnpm exec wrangler deploy --config wrangler.quiescent-production.jsonc \
                > "${ROOT}/repair-${REPAIRS}.log" 2>&1
              sleep 5
            fi
            jq -n --argjson attempt "${attempt}" --argjson repairs "${REPAIRS}" --argjson streak "${STABLE_STREAK}" --arg healthy "${HEALTHY}" \
              '{attempt:$attempt,repairs:$repairs,stableStreak:$streak,healthy:($healthy=="true"),observedAt:(now|todateiso8601)}' \
              >> "${ROOT}/stability-observations.ndjson"
            sleep 15
          done
          test "${STABLE_STREAK}" -ge 20
          jq -n --slurpfile expected "${ROOT}/expected.json" --argjson repairs "${REPAIRS}" --argjson stable "${STABLE_STREAK}" \
            '{passed:true,expected:$expected[0],cancelledRuns:0,repairs:$repairs,finalStableObservations:$stable,observationIntervalSeconds:15,schedule:"*/5 * * * *",mainnetEnabled:false}' \
            > "${ROOT}/summary.json"
          CANCELLED="$(wc -l < "${ROOT}/cancelled-runs.ndjson")"
          jq --argjson cancelled "${CANCELLED}" '.cancelledRuns=$cancelled' "${ROOT}/summary.json" > "${ROOT}/summary.tmp"
          mv "${ROOT}/summary.tmp" "${ROOT}/summary.json"
          cat "${ROOT}/summary.json"

      - name: Upload quiescence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quiesce-and-restore-production
          path: quiesce-production
          if-no-files-found: error
          retention-days: 14
